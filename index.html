<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Léo Malherbe">
<meta name="license" content="https://creativecommons.org/licenses/by-nc-sa/4.0/">
<meta name="copyright" content="© 2026 Léo Malherbe — KEDGE Business School">
<meta name="description" content="Cours de macroéconomie écologique de Léo Malherbe (KEDGE Business School) : le plan de chaque séance et ses outils interactifs.">
<title>Macroéconomie écologique — Léo Malherbe, KEDGE Business School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;
    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;
    --econ:#2A78D6;--eco:#2E8B57;--rms:#C08A00;--warn:#C0392B;--fish:#0E7C9B;
    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);
    --font-d:"Spectral","IBM Plex Sans",Georgia,serif;--font-b:"IBM Plex Sans",system-ui,sans-serif;--font-m:"IBM Plex Mono",ui-monospace,monospace;
  }
  :root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:900px;margin:0 auto;padding-block:40px 56px;padding-inline:20px;}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;}
  .eyebrow b{color:var(--fish);font-weight:500;}
  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(32px,5.4vw,52px);line-height:1.02;margin:0;letter-spacing:-.018em;text-wrap:balance;}
  .chapo{color:var(--muted);font-size:16px;margin:16px 0 0;max-width:72ch;text-wrap:pretty;}
  .chapo b{color:var(--ink);font-weight:600;}
  .toggles{display:flex;gap:8px;flex-shrink:0;}
  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}
  .tg:hover{color:var(--ink);border-color:var(--faint);}
  .tg:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--rms);outline-offset:3px;}

  .seances{margin-top:38px;display:flex;flex-direction:column;gap:16px;}
  a.seance{display:flex;gap:20px;align-items:flex-start;text-decoration:none;color:inherit;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:22px 24px;transition:border-color .15s,transform .15s;}
  a.seance:hover{border-color:var(--ac);transform:translateY(-2px);}
  .num{flex-shrink:0;width:54px;height:54px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:600;
    font-size:26px;color:var(--ac);line-height:1;}
  .corps{flex:1;min-width:0;}
  .corps h2{font-family:var(--font-d);font-weight:600;font-size:21px;margin:0 0 6px;line-height:1.15;text-wrap:balance;}
  .corps .pres{font-size:14px;color:var(--muted);margin:0;max-width:66ch;text-wrap:pretty;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .chip{font-family:var(--font-m);font-size:10.5px;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:6px;padding:4px 8px;line-height:1.3;}
  .compte{font-family:var(--font-m);font-size:11px;color:var(--faint);margin-top:11px;}
  .go{font-family:var(--font-m);font-size:12px;color:var(--ac);font-weight:500;margin-top:12px;display:inline-block;}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);
    font-size:11.5px;text-align:center;text-wrap:balance;}
  footer p{margin:0 0 7px;} footer p:last-child{margin-bottom:0;}
  footer a{color:var(--muted);text-decoration:underline;text-underline-offset:2px;}
  footer a:hover{color:var(--ink);}
  .lic{max-width:62ch;margin-inline:auto;line-height:1.6;} .lic a{white-space:nowrap;}
  @media (max-width:560px){
    a.seance{gap:14px;padding:18px 16px;}
    .num{width:44px;height:44px;font-size:21px;border-radius:11px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="titre"></h1>
      <p class="chapo" id="chapo"></p>
    </div>
    <div class="toggles">
      <button class="tg" id="lang" aria-label="langue"><span aria-hidden="true">⇄</span><span id="langlbl">FR</span></button>
      <button class="tg" id="theme" aria-label="thème">◐</button>
    </div>
  </header>

  <div class="seances" id="seances"></div>

  <footer>
    <p id="pied"></p>
    <p class="lic" id="licence"></p>
  </footer>
</div>

<script type="application/json" id="donnees">{"textes": {"fr": {"titre_onglet": "Macroéconomie écologique — Léo Malherbe, KEDGE Business School", "surtitre": "<b>Léo Malherbe<\/b> · KEDGE Business School", "titre": "Macroéconomie écologique", "chapo": "Le cours en séances. Chaque séance est une <b>page unique<\/b> : un fil qui en donne le plan, et des outils interactifs qui s'ouvrent à l'intérieur, sans jamais la quitter. Tout fonctionne sur ordinateur comme sur téléphone, et reste accessible après le cours.", "ouvrir": "Ouvrir la séance", "outils": "outils interactifs", "parties": "parties", "aucune": "Séance en préparation", "pied": "Cours de macroéconomie écologique — KEDGE Business School."}, "en": {"titre_onglet": "Ecological macroeconomics — Léo Malherbe, KEDGE Business School", "surtitre": "<b>Léo Malherbe<\/b> · KEDGE Business School", "titre": "Ecological macroeconomics", "chapo": "The course, session by session. Each session is a <b>single page<\/b>: a thread laying out its plan, and interactive tools that open inside it, without ever leaving. Everything works on a computer or a phone, and stays available after class.", "ouvrir": "Open the session", "outils": "interactive tools", "parties": "parts", "aucune": "Session in preparation", "pied": "Ecological macroeconomics — KEDGE Business School."}}, "licence": {"fr": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — réutilisation et adaptation libres à des fins non commerciales, avec attribution et sous la même licence.", "en": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — free to reuse and adapt for non-commercial purposes, with attribution and under the same licence."}, "seances": [{"numero": "1", "url": "seance1", "couleur": "eco", "prefixe": "parc", "titre": {"fr": "L'économie dans un monde fini", "en": "The economy in a finite world"}, "presentation": {"fr": "Comment l'économie est reliée au monde physique, ce qu'une ressource peut supporter, et ce que « limite » veut dire à l'échelle de la planète.", "en": "How the economy is tied to the physical world, what a resource can bear, and what “limit” means at the scale of a planet."}, "parties": {"fr": ["La machine économique", "La gestion soutenable des ressources", "Un monde fini"], "en": ["The economic machine", "Sustainable resource management", "A finite world"]}, "nb_outils": 12}, {"numero": "2", "url": "seance2", "couleur": "econ", "prefixe": "s2", "titre": {"fr": "Inégalités et justice", "en": "Inequality and justice"}, "presentation": {"fr": "Comment se mesure une inégalité, ce que montrent les données mondiales, ce qu'une répartition juste voudrait dire, et pourquoi les patrimoines divergent.", "en": "How inequality is measured, what global data show, what a just distribution would mean, and why wealth diverges."}, "parties": {"fr": ["Fondamentaux statistiques", "Les inégalités dans les données", "Évaluer les inégalités : le modèle de Rawls (1971)", "La divergence des patrimoines"], "en": ["Statistical fundamentals", "Inequality in the data", "Assessing inequality: Rawls's model (1971)", "The divergence of wealth"]}, "nb_outils": 13}]}</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById('donnees').textContent);

  var LANG='fr';  try{var sl=localStorage.getItem('accueil_lang');  if(sl) LANG=sl;}catch(e){}
  var THEME=null; try{var st=localStorage.getItem('accueil_theme'); if(st) THEME=st;}catch(e){}
  if(!THEME) THEME=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  document.documentElement.setAttribute('data-theme',THEME);

  /* Les séances partagent l'origine de cette page : on leur transmet le réglage,
     pour qu'un étudiant qui choisit l'anglais ici le retrouve en ouvrant une séance. */
  function propager(){
    try{
      localStorage.setItem('accueil_lang',LANG);
      localStorage.setItem('accueil_theme',THEME);
      D.seances.forEach(function(s){
        localStorage.setItem(s.prefixe+'_lang',LANG);
        localStorage.setItem(s.prefixe+'_theme',THEME);
      });
    }catch(e){}
  }

  function rendre(){
    var t=D.textes[LANG];
    document.documentElement.lang=LANG;
    document.title=t.titre_onglet;
    document.getElementById('eyebrow').innerHTML=t.surtitre;
    document.getElementById('titre').textContent=t.titre;
    document.getElementById('chapo').innerHTML=t.chapo;
    document.getElementById('pied').textContent=t.pied;
    document.getElementById('licence').innerHTML=D.licence[LANG];
    document.getElementById('langlbl').textContent=LANG.toUpperCase();

    var box=document.getElementById('seances'); box.innerHTML='';
    D.seances.forEach(function(s){
      var a=document.createElement('a');
      a.className='seance'; a.href=s.url;
      a.style.setProperty('--ac','var(--'+s.couleur+')');
      var chips=s.parties[LANG].map(function(p){return '<span class="chip">'+p+'</span>';}).join('');
      a.innerHTML='<span class="num">'+s.numero+'</span><span class="corps">'+
        '<h2>'+s.titre[LANG]+'</h2>'+
        '<p class="pres">'+s.presentation[LANG]+'</p>'+
        '<span class="chips">'+chips+'</span>'+
        '<span class="compte">'+s.nb_outils+' '+t.outils+' · '+s.parties[LANG].length+' '+t.parties+'</span><br>'+
        '<span class="go">'+t.ouvrir+' →</span></span>';
      box.appendChild(a);
    });
    propager();
  }

  document.getElementById('lang').addEventListener('click',function(){
    LANG=LANG==='fr'?'en':'fr'; rendre();
  });
  document.getElementById('theme').addEventListener('click',function(){
    THEME=THEME==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',THEME); rendre();
  });

  rendre();
})();
</script>
</body>
</html>
