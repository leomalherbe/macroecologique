0864,T0:13,N:44};\nfunction simE(p){\n  p=Object.assign({},SIME0,p||{});var N=p.N,m=1-p.a1*(1-p.th);\n  var r={t:[0],G:[0],Y:[0],T:[0],YD:[0],C:[0],dH:[0],H:[0],Yc:[0],Tc:[0],YDc:[0],Cc:[0],dHc:[0],Hc:[0],E:[0],Ef:[0],Er:[0],EM:[0],CUM:[0],Tat:[p.T0],d:[1]};\n  var H=0,Hc=0,Tat=p.T0,cum=0,k=p.th*(1-p.mu)*0+p.tau*p.om*(1-p.mu)*p.eps;\n  for(var t=1;t<=N;t++){\n    var G=(typeof p.Gpath==='function')?p.Gpath(t):p.G;\n    var Y=(p.a2*H+G)/m,T=p.th*Y,YD=Y-T,C=p.a1*YD+p.a2*H,dH=G-T;H+=dH;\n    var Yc=Y,Yn=Y,it=0;\n    if(p.clim){for(it=0;it<300;it++){var Tt=Tat+k*Yc;Yn=(p.a2*Hc+G-Math.exp(Tt-p.T0))/m;if(Math.abs(Yn-Yc)<1e-11){Yc=Yn;break;}Yc=Yn;}}\n    else{Yc=(p.a2*Hc+G)/m;}\n    var E=p.eps*Yc,Ef=(1-p.mu)*E,EM=p.om*Ef;Tat+=p.tau*EM;cum+=EM;var dmg=Math.exp(Tat-p.T0);\n    var Tc=p.th*Yc,YDc=Yc-Tc,Cc=Yc-G,dHc=G-Tc;Hc+=dHc;\n    r.t.push(t);r.G.push(G);r.Y.push(Y);r.T.push(T);r.YD.push(YD);r.C.push(C);r.dH.push(dH);r.H.push(H);\n    r.Yc.push(Yc);r.Tc.push(Tc);r.YDc.push(YDc);r.Cc.push(Cc);r.dHc.push(dHc);r.Hc.push(Hc);\n    r.E.push(E);r.Ef.push(Ef);r.Er.push(E-Ef);r.EM.push(EM);r.CUM.push(cum);r.Tat.push(Tat);r.d.push(dmg);\n  }\n  return r;\n}\n\nvar STR={\nfr:{\n doc_title:\"Le multiplicateur, puis l'état stationnaire\",prev:\"Précédent\",next:\"Suivant\",reset:\"Réinitialiser\",\n eyebrow:\"Séance 7 · La dynamique de SIM-E\",\n title:\"Le multiplicateur, puis l'état stationnaire\",\n sub:\"Au départ, personne n'a d'épargne. L'État dépense : cette dépense devient le revenu de quelqu'un, qui en consomme une partie, laquelle devient le revenu de quelqu'un d'autre… La première année se règle en <b>vagues de dépense<\/b> ; les années suivantes, l'épargne accumulée revient à son tour dans la dépense, jusqu'à un <b>état stationnaire<\/b>.\",\n s1t:\"Année 1 : les vagues de dépense\",\n s1d:\"Suivez la dépense publique de main en main. Chaque agent reçoit un revenu, paie l'impôt, consomme une part de ce qui lui reste et garde le reste. Les curseurs changent toute la cascade.\",\n wsl:{G:[\"Dépenses publiques\",\"G\"],th:[\"Taux d'impôt\",\"θ\"],a1:[\"Propension à consommer\",\"α<sub>1<\/sub>\"]},\n cols:[\"Agent\",\"Revenu\",\"Impôt\",\"Rev. disp.\",\"Conso.\",\"Épargne\"],tot:\"Total\",inf:\"… à l'infini\",\n lg:[\"revenu de chaque vague\",\"total cumulé (PIB)\",\"PIB de l'année 1\"],\n w0t:\"L'État dépense\",\n w0:function(o){return \"L'État achète pour <b>\"+o.G+\"<\/b> de biens et services : c'est un revenu de \"+o.G+\" pour l'agent 1. Il en paie <b>\"+o.t1+\"<\/b> d'impôt, il lui reste \"+o.yd1+\" ; il en consomme \"+o.a1+\", soit <b>\"+o.c1+\"<\/b>, et garde \"+o.s1+\".\";},\n wkt:function(k){return \"Vague \"+k;},\n wk:function(o){return \"La consommation de l'agent \"+(o.k-1)+\" est le revenu de l'agent \"+o.k+\" : <b>\"+o.y+\"<\/b>. Chaque vague vaut <i>c<\/i> = α<sub>1<\/sub>(1 − θ) = <b>\"+o.c+\"<\/b> fois la précédente : elles rétrécissent, et le total cumulé s'approche de \"+o.Y+\" sans jamais le dépasser.\";},\n wit:\"À l'infini : le multiplicateur\",\n wi:function(o){return \"La somme des vagues est une suite géométrique. Le PIB de l'année atteint <b>\"+o.Y+\"<\/b> : chaque euro de dépense publique en a fait circuler <b>\"+o.m+\"<\/b>. Les impôts prélevés valent \"+o.T+\". Ce qui manque, <b>\"+o.D+\"<\/b>, est à la fois le déficit de l'État et la somme des épargnes : c'est la monnaie qui reste dans les poches des ménages à la fin de l'année.\";},\n wf:function(o){return \"Y = G (1 + <i>c<\/i> + <i>c<\/i>² + …) = G / [1 − α<sub>1<\/sub>(1 − θ)]<br><b>\"+o.Y+\" = \"+o.G+\" × \"+o.m+\"<\/b><br>G − T = <b>\"+o.D+\"<\/b> = Σ épargnes\";},\n wf6:\"Déficit public = épargne des ménages : c'est l'identité de <a class='s6' href='seance6.html#/3' target='_top'>les balances sectorielles de la séance 6<\/a>, (S − I) + (T − G) = 0, ici sans investissement.\",\n s2t:\"Année après année : vers l'état stationnaire\",\n s2d:\"À partir de l'année 2, les ménages détiennent de la monnaie, et la fonction de consommation en dépense une part α<sub>2<\/sub>. Réglez les paramètres, ajoutez si vous voulez une hausse de la dépense publique en cours de route, et regardez où le système s'arrête.\",\n sl:{G:[\"Dépenses publiques\",\"G\"],th:[\"Taux d'impôt\",\"θ\"],a1:[\"Propension à consommer le revenu\",\"α<sub>1<\/sub>\"],a2:[\"Propension à consommer la richesse\",\"α<sub>2<\/sub>\"],G2:[\"Nouvelle dépense publique\",\"G′\"]},\n shock:\"Relance à la période 20\",\n pre:[[\"Le cours\",\"G 20 · θ 20 % · α₁ 0,6 · α₂ 0,4\"],[\"Ménages plus économes\",\"α₁ 0,5\"],[\"Impôt plus lourd\",\"θ 25 %\"],[\"Relance à la période 20\",\"G 20 → 25\"]],\n c1t:\"Flux annuels\",c2t:\"La monnaie : épargne de l'année et stock\",\n l1:[\"PIB (Y)\",\"Revenu disponible (YD)\",\"Consommation (C)\"],l2:[\"Épargne de l'année = déficit (ΔH)\",\"Stock de monnaie (H)\"],\n k:[[\"Multiplicateur de l'année 1\",\"1 / [1 − α₁(1 − θ)]\"],[\"PIB de l'année 1\",\"Y₁\"],[\"PIB stationnaire\",\"Y* = G / θ\"],[\"Multiplicateur de long terme\",\"Y* / G = 1 / θ\"],[\"Monnaie stationnaire\",\"H* = (1 − α₁) YD* / α₂\"]],\n tabc:[\"Variable\",\"Symbole\"],per:\"période\",\n vars:[[\"Dépenses publiques\",\"G\"],[\"PIB\",\"Y = C + G\"],[\"Impôts\",\"T = θ·Y\"],[\"Revenu disponible\",\"YD = Y − T\"],[\"Consommation\",\"C = α₁·YD + α₂·H₋₁\"],[\"Déficit public\",\"ΔH<sub>s<\/sub> = G − T\"],[\"Épargne\",\"ΔH<sub>h<\/sub> = YD − C\"],[\"Masse monétaire\",\"H = H₋₁ + ΔH\"]],\n tab_n:\"La dernière colonne, ∞, est l'état stationnaire calculé analytiquement ; le tableur l'approche sur 44 périodes.\",\n l_h:\"Ce que dit l'état stationnaire\",\n lx:function(o){return \"Le système s'arrête quand <b>le déficit est nul<\/b> : les impôts prélevés égalent la dépense publique, θY = G, d'où <b>Y* = G / θ = \"+o.Y+\"<\/b>. Les ménages n'épargnent plus : ils ont atteint la richesse qu'ils souhaitent détenir, \"+o.H+\". À long terme, le multiplicateur vaut 1/θ = \"+o.m+\" : seuls la dépense et le taux d'impôt fixent le niveau d'activité, les propensions à consommer ne règlent que la vitesse du chemin et la monnaie détenue à l'arrivée. C'est la même logique que le Y = G/s du <a class='s6' href='seance6.html#/2' target='_top'>circuit de la séance 6<\/a>, avec une fuite fiscale au lieu d'une fuite d'épargne.\";},\n foot:\"Modèle SIM : W. Godley et M. Lavoie, <i>Monetary Economics<\/i>, Palgrave Macmillan, 2007 (2<sup>e<\/sup> éd. 2012), chap. 3. Les calculs reproduisent ceux du tableur SIM-E du cours, bloc climatique désactivé.\"\n},\nen:{\n doc_title:\"The multiplier, then the steady state\",prev:\"Previous\",next:\"Next\",reset:\"Reset\",\n eyebrow:\"Session 7 · SIM-E dynamics\",\n title:\"The multiplier, then the steady state\",\n sub:\"At the start, nobody has any savings. The government spends: that spending becomes someone's income, who consumes part of it, which becomes someone else's income… The first year plays out in <b>waves of spending<\/b>; in later years, accumulated savings flow back into spending in turn, until a <b>steady state<\/b> is reached.\",\n s1t:\"Year 1: waves of spending\",\n s1d:\"Follow government spending from hand to hand. Each agent receives an income, pays tax, consumes part of what is left and keeps the rest. The sliders change the whole cascade.\",\n wsl:{G:[\"Government spending\",\"G\"],th:[\"Tax rate\",\"θ\"],a1:[\"Propensity to consume\",\"α<sub>1<\/sub>\"]},\n cols:[\"Agent\",\"Income\",\"Tax\",\"Disp. inc.\",\"Cons.\",\"Saving\"],tot:\"Total\",inf:\"… to infinity\",\n lg:[\"income of each wave\",\"cumulative total (GDP)\",\"year-1 GDP\"],\n w0t:\"The government spends\",\n w0:function(o){return \"The government buys <b>\"+o.G+\"<\/b> of goods and services: that is an income of \"+o.G+\" for agent 1. They pay <b>\"+o.t1+\"<\/b> in tax, leaving \"+o.yd1+\"; they consume \"+o.a1+\" of it, i.e. <b>\"+o.c1+\"<\/b>, and keep \"+o.s1+\".\";},\n wkt:function(k){return \"Wave \"+k;},\n wk:function(o){return \"Agent \"+(o.k-1)+\"'s consumption is agent \"+o.k+\"'s income: <b>\"+o.y+\"<\/b>. Each wave is <i>c<\/i> = α<sub>1<\/sub>(1 − θ) = <b>\"+o.c+\"<\/b> times the previous one: they shrink, and the cumulative total approaches \"+o.Y+\" without ever exceeding it.\";},\n wit:\"To infinity: the multiplier\",\n wi:function(o){return \"The sum of the waves is a geometric series. The year's GDP reaches <b>\"+o.Y+\"<\/b>: each euro of public spending has set <b>\"+o.m+\"<\/b> in motion. Taxes collected come to \"+o.T+\". What is missing, <b>\"+o.D+\"<\/b>, is both the government deficit and the sum of savings: the money left in households' pockets at the end of the year.\";},\n wf:function(o){return \"Y = G (1 + <i>c<\/i> + <i>c<\/i>² + …) = G / [1 − α<sub>1<\/sub>(1 − θ)]<br><b>\"+o.Y+\" = \"+o.G+\" × \"+o.m+\"<\/b><br>G − T = <b>\"+o.D+\"<\/b> = Σ savings\";},\n wf6:\"Public deficit = household saving: this is the identity of <a class='s6' href='seance6.html#/3' target='_top'>session 6's sectoral balances<\/a>, (S − I) + (T − G) = 0, here with no investment.\",\n s2t:\"Year after year: towards the steady state\",\n s2d:\"From year 2 onwards, households hold money, and the consumption function spends a share α<sub>2<\/sub> of it. Set the parameters, add a rise in public spending along the way if you like, and see where the system comes to rest.\",\n sl:{G:[\"Government spending\",\"G\"],th:[\"Tax rate\",\"θ\"],a1:[\"Propensity to consume income\",\"α<sub>1<\/sub>\"],a2:[\"Propensity to consume wealth\",\"α<sub>2<\/sub>\"],G2:[\"New government spending\",\"G′\"]},\n shock:\"Stimulus in period 20\",\n pre:[[\"The course\",\"G 20 · θ 20% · α₁ 0.6 · α₂ 0.4\"],[\"Thriftier households\",\"α₁ 0.5\"],[\"Heavier tax\",\"θ 25%\"],[\"Stimulus in period 20\",\"G 20 → 25\"]],\n c1t:\"Annual flows\",c2t:\"Money: the year's saving and the stock\",\n l1:[\"GDP (Y)\",\"Disposable income (YD)\",\"Consumption (C)\"],l2:[\"The year's saving = deficit (ΔH)\",\"Money stock (H)\"],\n k:[[\"Year-1 multiplier\",\"1 / [1 − α₁(1 − θ)]\"],[\"Year-1 GDP\",\"Y₁\"],[\"Steady-state GDP\",\"Y* = G / θ\"],[\"Long-run multiplier\",\"Y* / G = 1 / θ\"],[\"Steady-state money\",\"H* = (1 − α₁) YD* / α₂\"]],\n tabc:[\"Variable\",\"Symbol\"],per:\"period\",\n vars:[[\"Government spending\",\"G\"],[\"GDP\",\"Y = C + G\"],[\"Taxes\",\"T = θ·Y\"],[\"Disposable income\",\"YD = Y − T\"],[\"Consumption\",\"C = α₁·YD + α₂·H₋₁\"],[\"Public deficit\",\"ΔH<sub>s<\/sub> = G − T\"],[\"Saving\",\"ΔH<sub>h<\/sub> = YD − C\"],[\"Money stock\",\"H = H₋₁ + ΔH\"]],\n tab_n:\"The last column, ∞, is the steady state computed analytically; the spreadsheet approaches it over 44 periods.\",\n l_h:\"What the steady state says\",\n lx:function(o){return \"The system comes to rest when <b>the deficit is zero<\/b>: taxes collected equal public spending, θY = G, hence <b>Y* = G / θ = \"+o.Y+\"<\/b>. Households no longer save: they hold the wealth they wish to hold, \"+o.H+\". In the long run the multiplier is 1/θ = \"+o.m+\": only spending and the tax rate set the level of activity; the propensities to consume only set the speed of the path and the money held on arrival. It is the same logic as the Y = G/s of <a class='s6' href='seance6.html#/2' target='_top'>session 6's circuit<\/a>, with a tax leak instead of a saving leak.\";},\n foot:\"SIM model: W. Godley and M. Lavoie, <i>Monetary Economics<\/i>, Palgrave Macmillan, 2007 (2nd ed. 2012), ch. 3. The computations reproduce those of the course's SIM-E spreadsheet, with the climate block switched off.\"\n}};\n/* ---------- section 1 ---------- */\nvar W={G:20,th:.2,a1:.6},WR={G:[5,40,1],th:[.05,.5,.01],a1:[.3,.95,.01]},NW=10,WSTEP=0;\nfunction f1(x){return fmt(x,1);} function f2(x){return fmt(x,2);}\nfunction waves(){var a=[],y=W.G;for(var i=0;i<NW;i++){var t=W.th*y,yd=y-t,c=W.a1*yd;a.push({y:y,t:t,yd:yd,c:c,s:yd-c});y=c;}return a;}\nfunction mkSliders(boxId,obj,rng,labels,onch){var box=$(boxId),d=D();\n  if(!box.childElementCount){Object.keys(rng).forEach(function(k){var f=document.createElement('div');f.className='field';f.setAttribute('data-k',k) g10(r))),f=r/p;return (f<=1.5?1:f<=3?2:f<=7?5:10)*p/1;}\nfunction ticks(lo,hi,n){var st=niceStep((hi-lo)/(n||4));var a=[];for(var v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)a.push(Math.round(v*1e6)/1e6);return a;}\nfunction niceMax(m){if(m<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return (f<=1?1:f<=1.5?1.5:f<=2?2:f<=2.5?2.5:f<=3?3:f<=4?4:f<=5?5:f<=6?6:f<=8?8:10)*p;}\nfunction lineChart(svg,o){\n  clear(svg);var W=o.W||620,H=o.H||280,L=o.L||46,R=o.R||16,T=o.T||14,B=o.B||30;\n  svg.setAttribute('viewBox','0 0 '+W+' '+H);\n  var n=o.n,ymin=o.ymin,ymax=o.ymax;\n  function X(i){return L+(n<=1?0:i/(n-1))*(W-L-R);}\n  function Y(v){v=Math.max(ymin,Math.min(ymax,v));return H-B-(v-ymin)/(ymax-ymin)*(H-B-T);}\n  var g=mk('g',{'class':'ax'}),yt=o.yticks||[],ys=yt.length>1?Math.abs(yt[1]-yt[0]):1,yd=ys>=1?0:(ys>=.1?1:2);\n  yt.forEach(function(v){g.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v)}));g.appendChild(mk('text',{x:L-6,y:Y(v)+3.5,'text-anchor':'end'},o.fy?o.fy(v):fmt(v,yd)));});\n  (o.xticks||[]).forEach(function(i){g.appendChild(mk('text',{x:X(i),y:H-B+16,'text-anchor':'middle'},o.fx?o.fx(i):i));});\n  svg.appendChild(g);\n  if(o.zero!=null&&o.zero>ymin&&o.zero<ymax)svg.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(o.zero),y2:Y(o.zero),style:'stroke:var(--faint);stroke-width:1'}));\n  if(o.vline!=null)svg.appendChild(mk('line',{x1:X(o.vline),x2:X(o.vline),y1:T,y2:H-B,style:'stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3'}));\n  o.series.forEach(function(s){\n    var dd='';s.vals.forEach(function(v,i){if(v==null||!isFinite(v))return;dd+=(dd?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';});\n    svg.appendChild(mk('path',{d:dd,style:'fill:none;stroke:'+s.color+';stroke-width:'+(s.w||2.4)+';'+(s.dash?'stroke-dasharray:'+s.dash+';':'')+'stroke-linejoin:round'}));\n    if(s.end){var lastI=s.vals.length-1,lv=s.vals[lastI];if(isFinite(lv)){svg.appendChild(mk('circle',{cx:X(lastI),cy:Y(lv),r:3.6,style:'fill:'+s.color}));}}\n  });\n  if(o.ylab)svg.appendChild(mk('text',{x:L,y:T-3,style:'fill:var(--faint);font-size:10.5px;font-family:var(--font-m)'},o.ylab));\n  return {X:X,Y:Y};\n}\nfunction boot(){\n  $('theme').addEventListener('click',function(){var nt=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nt);try{localStorage.setItem(PFX+'_theme',nt);}catch(e){}renderAll();});\n  $('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem(PFX+'_lang',LANG);}catch(e){}applyLang();});\n  if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){renderAll();});}catch(e){}}\n  applyLang();\n}\n/* ---- le modèle SIM-E (identique au tableur : Godley et Lavoie, bloc climat ajouté) ---- */\nvar SIME0={G:20,th:.2,a1:.6,a2:.4,eps:7.65,mu:.05,om:.15,tau:.000864,T0:13,N:44};\nfunction simE(p){\n  p=Object.assign({},SIME0,p||{});var N=p.N,m=1-p.a1*(1-p.th);\n  var r={t:[0],G:[0],Y:[0],T:[0],YD:[0],C:[0],dH:[0],H:[0],Yc:[0],Tc:[0],YDc:[0],Cc:[0],dHc:[0],Hc:[0],E:[0],Ef:[0],Er:[0],EM:[0],CUM:[0],Tat:[p.T0],d:[1]};\n  var H=0,Hc=0,Tat=p.T0,cum=0,k=p.th*(1-p.mu)*0+p.tau*p.om*(1-p.mu)*p.eps;\n  for(var t=1;t<=N;t++){\n    var G=(typeof p.Gpath==='function')?p.Gpath(t):p.G;\n    var Y=(p.a2*H+G)/m,T=p.th*Y,YD=Y-T,C=p.a1*YD+p.a2*H,dH=G-T;H+=dH;\n    var Yc=Y,Yn=Y,it=0;\n    if(p.clim){for(it=0;it<300;it++){var Tt=Tat+k*Yc;Yn=(p.a2*Hc+G-Math.exp(Tt-p.T0))/m;if(Math.abs(Yn-Yc)<1e-11){Yc=Yn;break;}Yc=Yn;}}\n    else{Yc=(p.a2*Hc+G)/m;}\n    var E=p.eps*Yc,Ef=(1-p.mu)*E,EM=p.om*Ef;Tat+=p.tau*EM;cum+=EM;var dmg=Math.exp(Tat-p.T0);\n    var Tc=p.th*Yc,YDc=Yc-Tc,Cc=Yc-G,dHc=G-Tc;Hc+=dHc;\n    r.t.push(t);r.G.push(G);r.Y.push(Y);r.T.push(T);r.YD.push(YD);r.C.push(C);r.dH.push(dH);r.H.push(H);\n    r.Yc.push(Yc);r.Tc.push(Tc);r.YDc.push(YDc);r.Cc.push(Cc);r.dHc.push(dHc);r.Hc.push(Hc);\n    r.E.push(E);r.Ef.push(Ef);r.Er.push(E-Ef);r.EM.push(EM);r.CUM.push(cum);r.Tat.push(Tat);r.d.push(dmg);\n  }\n  return r;\n}\n\nvar STR={\nfr:{\n doc_title:\"Quand le climat rétroagit\",prev:\"Précédent\",next:\"Suivant\",\n eyebrow:\"Séance 7 · Le bloc climatique de SIM-E\",\n title:\"Quand le climat rétroagit\",\n sub:\"Sept équations suffisent à brancher le climat sur le circuit. La production consomme de l'énergie, l'énergie fossile émet du CO₂, le CO₂ s'accumule et réchauffe l'atmosphère, et le réchauffement détruit une partie de la consommation des ménages. <b>Le dernier maillon rejoint le premier.<\/b>\",\n s1t:\"Sept équations de plus\",\n s1d:\"Avancez équation par équation. À droite, la chaîne se remplit avec les valeurs de l'année choisie, dans le paramétrage du cours (G = 20, μ = 5 %).\",\n eqs:[[\"E = ε · Y\",\"(12)\",\"L'énergie nécessaire à la production\",\"L'énergie consommée dans l'année, mesurée en exajoules, est proportionnelle au PIB. ε est l'<b>intensité énergétique<\/b> : le ratio de transmission de l'engrenage. Dans le cours, ε = 7,65.\"],\n  [\"E<sub>f<\/sub> = (1 − μ) · E\",\"(13)\",\"La part fossile\",\"μ est la part des renouvelables dans le mix énergétique ; le reste, 1 − μ, est fossile. Dans le cours, μ = 5 %.\"],\n  [\"E<sub>r<\/sub> = μ · E\",\"(14)\",\"La part renouvelable\",\"Les renouvelables n'émettent pas de CO₂ dans le modèle. Les équations (13) et (14) ne font que partager E en deux.\"],\n  [\"EMIS = ω · E<sub>f<\/sub>\",\"(15)\",\"Les émissions de l'année\",\"Seule l'énergie fossile émet. ω est l'<b>intensité carbone<\/b> de l'énergie fossile : les émissions par exajoule. Dans le cours, ω = 0,15.\"],\n  [\"CO2<sub>cum<\/sub> = CO2<sub>cum,−1<\/sub> + EMIS\",\"(16)\",\"Le stock dans l'atmosphère\",\"Les émissions s'ajoutent d'année en année : c'est un <b>stock<\/b>, qui ne baisse jamais dans le modèle. Même si les émissions diminuent, il continue de monter.\"],\n  [\"T<sub>at<\/sub> = T<sub>at,−1<\/sub> + τ · EMIS\",\"(17)\",\"La température\",\"Chaque unité émise ajoute τ degré à la température atmosphérique, qui part de 13 °C. La température suit donc le stock d'émissions cumulées : τ = 0,000864.\"],\n  [\"d<sub>t<\/sub> = e<sup>T<sub>at,t<\/sub> − T<sub>at,0<\/sub><\/sup>\",\"(18)\",\"Les dommages\",\"Les destructions climatiques croissent <b>exponentiellement<\/b> avec l'écart de température par rapport à l'année de départ : un degré de plus pèse de plus en plus lourd.\"],\n  [\"C<sub>d<\/sub> = α<sub>1<\/sub>·YD + α<sub>2<\/sub>·H<sub>h,−1<\/sub> − d<sub>t<\/sub>\",\"(7)\",\"La boucle se referme\",\"Les dommages sont retranchés de la consommation. Moins de consommation, c'est moins de PIB (éq. 10), donc moins d'impôts et un déficit plus grand (éq. 6 et 8), mais aussi moins d'énergie l'année suivante (éq. 12).\"]],\n yr:\"Année\",yr_h:\"De 1 à 44, comme dans le tableur.\",\n circ:\"<span class='nh'>Une simultanéité<\/span>Dans une même année, le PIB dépend des dommages, qui dépendent de la température, qui dépend des émissions… qui dépendent du PIB. Le tableur contient donc une <b>référence circulaire<\/b> : Excel la résout par itérations (calcul itératif activé). Les valeurs ci-dessus sont celles du point fixe.\",\n ch:[\"Y\",\"E\",\"E<sub>f<\/sub>\",\"E<sub>r<\/sub>\",\"EMIS\",\"CO2<sub>cum<\/sub>\",\"T<sub>at<\/sub>\",\"d<sub>t<\/sub>\",\"C\"],\n s2t:\"Référence et chocs climatiques\",\n s2d:\"Deux économies tournent côte à côte avec les mêmes paramètres : la <b>référence<\/b>, sans dommages, et l'économie où le climat rétroagit. Suivez d'abord la lecture guidée, étape par étape ; changez ensuite la dépense publique, l'impôt ou la part des renouvelables, et refaites-la.\",\n pre:[[\"Le paramétrage du cours\",\"G 20 · θ 20 % · μ 5 %\"],[\"Rétroaction coupée\",\"dommages désactivés\"]],\n clim:\"Rétroaction climatique activée\",\n sl:{G:[\"Dépenses publiques\",\"G\"],th:[\"Taux d'impôt\",\"θ\"],mu:[\"Part des renouvelables\",\"μ\"]},\n fixed:\"<span class='nh'>Paramètres fixés ici<\/span>α<sub>1<\/sub> = 0,6 · α<sub>2<\/sub> = 0,4 · ε = 7,65 · ω = 0,15 · τ = 0,000864. Tous sont modifiables dans le tableur.\",\n c1t:\"Énergie consommée (EJ)\",c2t:\"Émissions et température\",c3t:\"PIB\",c4t:\"Déficit public\",\n l1:[\"totale\",\"fossile\",\"renouvelable\"],l2:[\"émissions annuelles (gauche)\",\"température, °C (droite)\"],l3:[\"référence\",\"chocs climatiques\"],\n k:[\"Hausse de température\",\"PIB en fin de période\",\"Déficit public en fin de période\",\"Dommages de l'année\"],\n ks:function(o){return [\"en 44 ans, depuis 13 °C\",\"référence : \"+o.Yr+\" (\"+o.gap+\")\",\"référence : \"+o.Dr,\"en unités de consommation\"];},\n gl:\"Lecture guidée\",\n g:[[\"Comment lire ces quatre graphiques\",function(o){return \"Les quatre courbes ont une même source : le PIB. Suivez la lecture en cinq temps, chaque étape éclaire le graphique concerné et pointe l'année qui compte. Les chiffres suivent vos réglages.\";},0],\n  [\"1. Le PIB : d'abord ensemble, puis l'écart\",function(o){return \"Les premières années, les deux PIB montent presque ensemble : il fait encore à peine plus chaud. L'écart se creuse ensuite. \"+(o.pk<o.T?\"Avec la rétroaction, le PIB culmine à <b>\"+o.Ypk+\"<\/b> l'année \"+o.pk+\", puis recule jusqu'à <b>\"+o.Y44+\"<\/b>\":\"Avec la rétroaction, le PIB croît encore mais finit à <b>\"+o.Y44+\"<\/b>\")+\", quand la référence atteint \"+o.Yr+\" (écart de \"+o.gap+\").\";},3],\n  [\"2. L'énergie suit le PIB\",function(o){return \"Avec une intensité énergétique fixe, l'énergie consommée est le PIB multiplié par ε : sa courbe a la forme de celle du PIB. \"+(o.epk<o.T?\"Elle culmine à <b>\"+o.Epk+\" EJ<\/b> l'année \"+o.epk+\", puis redescend avec l'activité. \":\"Elle croît jusqu'au bout, à \"+o.E44+\" EJ. \")+\"Avec μ = \"+o.mu+\", la part renouvelable reste de \"+o.Er44+\" EJ en fin de période.\";},1],\n  [\"3. Les émissions baissent, la température monte\",function(o){return \"Les émissions suivent l'énergie fossile\"+(o.mpk<o.T?\" et culminent l'année \"+o.mpk:\"\")+\". Mais la température dépend du <b>stock<\/b> d'émissions accumulées : tant que les émissions restent positives, elle monte, de <b>+\"+o.dT+\" °C<\/b> en 44 ans. La récession climatique réduit les émissions sans arrêter le réchauffement.\";},2],\n  [\"4. Le déficit se creuse de nouveau\",function(o){return \"Dans la référence, le déficit tend vers zéro : l'économie rejoint l'état stationnaire où les impôts égalent la dépense. Avec la rétroaction, il descend jusqu'à <b>\"+o.Dmin+\"<\/b> l'année \"+o.dm+\", puis remonte à <b>\"+o.D44+\"<\/b> : à dépense inchangée, un PIB plus faible rapporte moins d'impôts.\";},4],\n  [\"5. La chaîne complète\",function(o){return \"Dommages ↑ → consommation ↓ → PIB ↓ → impôts ↓ → déficit ↑. Et PIB ↓ → énergie ↓ → émissions ↓, sans que la température cesse de monter. Le PIB obtenu par euro de dépense publique, Y / G, passe de \"+o.m0+\" au sommet à \"+o.m44+\" en fin de période. Changez maintenant G, θ ou μ et refaites la lecture.\";},0]],\n g_off:\"<b>Rétroaction coupée<\/b> : les dommages ne touchent plus la consommation, les deux économies sont identiques et les courbes de PIB et de déficit se confondent. La température monte pourtant, plus encore qu'avec la rétroaction, puisque rien ne freine l'activité. Réactivez la rétroaction pour suivre la lecture.\",\n s4t:\"Ce que SIM-E ne dit pas\",\n s4d:\"Un modèle simple a aussi ses angles morts. Les connaître évite de lui faire dire plus qu'il ne peut.\",\n lims:[\n  [\"Ni capital ni investissement\",\"var(--rms)\",function(){return \"On ne peut pas y construire d'éoliennes : changer μ ou ε revient à décréter le résultat d'une transition, sans en représenter le coût ni le financement.\";}],\n  [\"Un stock de CO₂ sans puits\",\"var(--fish)\",function(){return \"Le CO₂ émis ne quitte jamais l'atmosphère et la température réagit sans inertie. Les océans et la biosphère, qui en absorbent une partie, ne sont pas représentés.\";}],\n  [\"Un seul monde\",\"var(--econ)\",function(){return \"Le modèle représente l'économie mondiale d'un seul bloc : pas de pays, pas d'échanges entre eux. Qui émet et qui subit les dommages, au Nord ou au Sud, il ne peut pas le dire.\";}]],\n l_h:\"Une intuition, pas une prévision\",\n l_x:\"SIM-E ne dit pas de combien la planète se réchauffera. Il montre comment un choc climatique se transmet dans un circuit monétaire : par la demande, les recettes fiscales et le déficit. C'est cette intuition qu'on mobilise pour concevoir des stratégies de transition, et qu'on éprouve ensuite sur le tableur.\",\n foot:\"Bloc économique d'après le modèle SIM de W. Godley et M. Lavoie, <i>Monetary Economics<\/i>, Palgrave Macmillan, 2007 (2<sup>e<\/sup> éd. 2012). Bloc climatique et calculs identiques au tableur SIM-E du cours, sur 44 périodes. Unités du modèle : énergie en exajoules, émissions et dommages en unités du modèle.\"\n},\nen:{\n doc_title:\"When the climate feeds back\",prev:\"Previous\",next:\"Next\",\n eyebrow:\"Session 7 · SIM-E's climate block\",\n title:\"When the climate feeds back\",\n sub:\"Seven equations are enough to plug the climate into the circuit. Production uses energy, fossil energy emits CO₂, CO₂ accumulates and warms the atmosphere, and warming destroys part of household consumption. <b>The last link joins the first.<\/b>\",\n s1t:\"Seven more equations\",\n s1d:\"Step through the equations one by one. On the right, the chain fills in with the values of the chosen year, under the course's settings (G = 20, μ = 5%).\",\n eqs:[[\"E = ε · Y\",\"(12)\",\"The energy production needs\",\"Energy used in the year, measured in exajoules, is proportional to GDP. ε is <b>energy intensity<\/b>: the transmission ratio of the gears. In the course, ε = 7.65.\"],\n  [\"E<sub>f<\/sub> = (1 − μ) · E\",\"(13)\",\"The fossil share\",\"μ is the share of renewables in the energy mix; the rest, 1 − μ, is fossil. In the course, μ = 5%.\"],\n  [\"E<sub>r<\/sub> = μ · E\",\"(14)\",\"The renewable share\",\"Renewables emit no CO₂ in the model. Equations (13) and (14) simply split E in two.\"],\n  [\"EMIS = ω · E<sub>f<\/sub>\",\"(15)\",\"The year's emissions\",\"Only fossil energy emits. ω is the <b>carbon intensity<\/b> of fossil energy: emissions per exajoule. In the course, ω = 0.15.\"],\n  [\"CO2<sub>cum<\/sub> = CO2<sub>cum,−1<\/sub> + EMIS\",\"(16)\",\"The stock in the atmosphere\",\"Emissions add up year after year: it is a <b>stock<\/b>, which never falls in the model. Even if emissions decline, it keeps rising.\"],\n  [\"T<sub>at<\/sub> = T<sub>at,−1<\/sub> + τ · EMIS\",\"(17)\",\"Temperature\",\"Each unit emitted adds τ degrees to atmospheric temperature, which starts at 13 °C. Temperature thus tracks the stock of cumulative emissions: τ = 0.000864.\"],\n  [\"d<sub>t<\/sub> = e<sup>T<sub>at,t<\/sub> − T<sub>at,0<\/sub><\/sup>\",\"(18)\",\"Damage\",\"Climate destruction grows <b>exponentially<\/b> with the temperature gap relative to the starting year: each extra degree weighs more and more.\"],\n  [\"C<sub>d<\/sub> = α<sub>1<\/sub>·YD + α<sub>2<\/sub>·H<sub>h,−1<\/sub> − d<sub>t<\/sub>\",\"(7)\",\"The loop closes\",\"Damage is subtracted from consumption. Less consumption means less GDP (eq. 10), hence less tax and a larger deficit (eqs. 6 and 8), but also less energy the following year (eq. 12).\"]],\n yr:\"Year\",yr_h:\"From 1 to 44, as in the spreadsheet.\",\n circ:\"<span class='nh'>A simultaneity<\/span>Within one year, GDP depends on damage, which depends on temperature, which depends on emissions… which depend on GDP. The spreadsheet therefore contains a <b>circular reference<\/b>: Excel solves it by iteration (iterative calculation enabled). The values above are those of the fixed point.\",\n ch:[\"Y\",\"E\",\"E<sub>f<\/sub>\",\"E<sub>r<\/sub>\",\"EMIS\",\"CO2<sub>cum<\/sub>\",\"T<sub>at<\/sub>\",\"d<sub>t<\/sub>\",\"C\"],\n s2t:\"Baseline and climate shocks\",\n s2d:\"Two economies run side by side with the same parameters: the <b>baseline<\/b>, without damage, and the economy where the climate feeds back. First follow the guided reading, step by step; then change public spending, the tax rate or the share of renewables, and read again.\",\n pre:[[\"The course's settings\",\"G 20 · θ 20% · μ 5%\"],[\"Feedback cut\",\"damage switched off\"]],\n clim:\"Climate feedback on\",\n sl:{G:[\"Government spending\",\"G\"],th:[\"Tax rate\",\"θ\"],mu:[\"Share of renewables\",\"μ\"]},\n fixed:\"<span class='nh'>Parameters fixed here<\/span>α<sub>1<\/sub> = 0.6 · α<sub>2<\/sub> = 0.4 · ε = 7.65 · ω = 0.15 · τ = 0.000864. All of them can be changed in the spreadsheet.\",\n c1t:\"Energy used (EJ)\",c2t:\"Emissions and temperature\",c3t:\"GDP\",c4t:\"Public deficit\",\n l1:[\"total\",\"fossil\",\"renewable\"],l2:[\"annual emissions (left)\",\"temperature, °C (right)\"],l3:[\"baseline\",\"climate shocks\"],\n k:[\"Temperature rise\",\"GDP at the end\",\"Public deficit at the end\",\"Damage in the year\"],\n ks:function(o){return [\"over 44 years, from 13 °C\",\"baseline: \"+o.Yr+\" (\"+o.gap+\")\",\"baseline: \"+o.Dr,\"in units of consumption\"];},\n gl:\"Guided reading\",\n g:[[\"How to read these four charts\",function(o){return \"The four curves share one source: GDP. Follow the reading in five steps; each step highlights the chart concerned and marks the year that matters. The figures follow your settings.\";},0],\n  [\"1. GDP: together at first, then the gap\",function(o){return \"In the first years the two GDPs rise almost together: it is barely warmer yet. Then the gap widens. \"+(o.pk<o.T?\"With feedback, GDP peaks at <b>\"+o.Ypk+\"<\/b> in year \"+o.pk+\", then falls back to <b>\"+o.Y44+\"<\/b>\":\"With feedback, GDP still grows but ends at <b>\"+o.Y44+\"<\/b>\")+\", while the baseline reaches \"+o.Yr+\" (a gap of \"+o.gap+\").\";},3],\n  [\"2. Energy follows GDP\",function(o){return \"With fixed energy intensity, energy used is GDP times ε: its curve has the shape of GDP's. \"+(o.epk<o.T?\"It peaks at <b>\"+o.Epk+\" EJ<\/b> in year \"+o.epk+\", then falls back with activity. \":\"It grows to the end, reaching \"+o.E44+\" EJ. \")+\"With μ = \"+o.mu+\", the renewable part is \"+o.Er44+\" EJ at the end.\";},1],\n  [\"3. Emissions fall, temperature rises\",function(o){return \"Emissions follow fossil energy\"+(o.mpk<o.T?\" and peak in year \"+o.mpk:\"\")+\". But temperature depends on the <b>stock<\/b> of accumulated emissions: as long as emissions stay positive it rises, by <b>+\"+o.dT+\" °C<\/b> over 44 years. The climate recession cuts emissions without stopping the warming.\";},2],\n  [\"4. The deficit widens again\",function(o){return \"In the baseline the deficit tends to zero: the economy reaches the steady state where taxes equal spending. With feedback it falls to <b>\"+o.Dmin+\"<\/b> in year \"+o.dm+\", then rises back to <b>\"+o.D44+\"<\/b>: with spending unchanged, a smaller GDP yields less tax.\";},4],\n  [\"5. The whole chain\",function(o){return \"Damage ↑ → consumption ↓ → GDP ↓ → taxes ↓ → deficit ↑. And GDP ↓ → energy ↓ → emissions ↓, without temperature ceasing to rise. GDP obtained per euro of public spending, Y / G, goes from \"+o.m0+\" at the peak to \"+o.m44+\" at the end. Now change G, θ or μ and read again.\";},0]],\n g_off:\"<b>Feedback cut<\/b>: damage no longer touches consumption, the two economies are identical and the GDP and deficit curves merge. Yet temperature rises, even more than with feedback, since nothing holds back activity. Switch the feedback back on to follow the reading.\",\n s4t:\"What SIM-E does not tell you\",\n s4d:\"A simple model has its blind spots too. Knowing them stops you making it say more than it can.\",\n lims:[\n  [\"No capital, no investment\",\"var(--rms)\",function(){return \"You cannot build wind turbines in it: changing μ or ε amounts to decreeing the outcome of a transition, without representing its cost or how it is financed.\";}],\n  [\"A CO₂ stock with no sinks\",\"var(--fish)\",function(){return \"CO₂ emitted never leaves the atmosphere and temperature responds with no inertia. Oceans and the biosphere, which absorb part of it, are not represented.\";}],\n  [\"A single world\",\"var(--econ)\",function(){return \"The model represents the world economy as a single block: no countries, no trade between them. Who emits and who bears the damage, North or South, it cannot say.\";}]],\n l_h:\"An intuition, not a forecast\",\n l_x:\"SIM-E does not tell you how much the planet will warm. It shows how a climate shock is transmitted through a monetary circuit: through demand, tax revenue and the deficit. That intuition is what you draw on to design transition strategies, and then test in the spreadsheet.\",\n foot:\"Economic block after W. Godley and M. Lavoie's SIM model, <i>Monetary Economics<\/i>, Palgrave Macmillan, 2007 (2nd ed. 2012). Climate block and computations identical to the course's SIM-E spreadsheet, over 44 periods. Model units: energy in exajoules, emissions and damage in model units.\"\n}};\nfunction f1(x){return fmt(x,1);} function f2(x){return fmt(x,2);}\n/* ---------- section 1 ---------- */\nvar BASE=simE({clim:1}),YR=44,EQ=0;\nfunction renderEq(){var d=D(),e=d.eqs[EQ],r=BASE,t=YR;\n  $('eqb').innerHTML=e[0]+'<span class=\"n\">'+e[1]+'<\/span>';$('eqt').textContent=e[2];$('eqx').innerHTML=e[3];\n  $('vyr').textContent=t;\n  var vals=[r.Yc[t],r.E[t],r.Ef[t],r.Er[t],r.EM[t],r.CUM[t],r.Tat[t],r.d[t],r.Cc[t]],dec=[1,0,0,1,1,0,2,2,1],unit=['','','','','','',' °C','',''];\n  /* étape -> maillons visibles et maillon courant */\n  var lit=[1,2,3,4,5,6,7,8][EQ],cur=[[1],[2],[3],[4],[5],[6],[7],[8]][EQ];\n  var h='';vals.forEach(function(v,i){var on=i<=lit||(EQ===7);var c=cur.indexOf(i)>=0||(EQ===7&&i===0);\n    if(i)h+='<span class=\"ar\">→<\/span>';h+='<span class=\"ch'+(on?' on':'')+(c?' cur':'')+'\"><span class=\"s\">'+d.ch[i]+'<\/span><span class=\"v\">'+(on?fmt(v,dec[i])+unit[i]:'·')+'<\/span><\/span>';});\n  if(EQ===7)h+='<span class=\"ar\" style=\"color:var(--warn);font-weight:600\">↺ Y<\/span>';\n  $('chain').innerHTML=h;$('circ').innerHTML=d.circ;}\nnew Stepper('st1',8,function(i){EQ=i;renderEq();});\n$('ryr').addEventListener('input',function(e){YR=+e.target.value;renderEq();});\n/* ---------- section 2 ---------- */\nvar PR={G:20,th:.2,mu:.05},PRR={G:[5,40,1],th:[.05,.5,.01],mu:[0,1,.01]},CLIM=true,PSEL=0;\nfunction mkSliders(){var d=D(),box=$('ssl');\n  if(!box.childElementCount){Object.keys(PRR).forEach(function(k){var f=document.createElement('div');f.className='field';f.setAttribute('data-k',k);\n    f.innerHTML='<label><span class=\"nm\"><\/span><span class=\"vv\"><\/span><\/label><input type=\"range\" min=\"'+PRR[k][0]+'\" max=\"'+PRR[k][1]+'\" step=\"'+PRR[k][2]+'\">';\n    f.querySelector('input').addEventListener('input',function(e){PR[k]=+e.target.value;PSEL=-1;renderSim();});box.appendChild(f);});}\n  Object.keys(PRR).forEach(function(k){var f=box.querySelector('[data-k=\"'+k+'\"]');f.querySelector('.nm').innerHTML=d.sl[k][0]+' <i>'+d.sl[k][1]+'<\/i>';\n    f.querySelector('.vv').textContent=k==='G'?fmt(PR[k]):pct(PR[k]*100,0);f.querySelector('input').value=PR[k];});}\n$('clim').addEventListener('change',function(e){CLIM=e.target.checked;PSEL=-1;renderSim();});\n$('presets').addEventListener('click',function(e){var b=e.target.closest('.pz');if(!b)return;PSEL=+b.getAttribute('data-i');PR={G:20,th:.2,mu:.05};CLIM=PSEL===0;renderSim();});\nfunction maxOf(a){return Math.max.apply(null,a.filter(isFinite));}\nfunction renderSim(){var d=D();mkSliders();$('clim').checked=CLIM;\n  $('presets').innerHTML=d.pre.map(function(p,i){return '<button class=\"pz'+(PSEL===i?' on':'')+'\" data-i=\"'+i+'\"><b>'+p[0]+'<\/b> · '+p[1]+'<\/button>';}).join('');\n  var r=simE({G:PR.G,th:PR.th,mu:PR.mu,clim:CLIM?1:0}),N=r.t.length,xt=[0,10,20,30,40],W=420,H=230;\n  var em=niceMax(maxOf(r.E)*1.05);\n  var ax1=lineChart($('c1'),{W:W,H:H,L:44,n:N,ymin:0,ymax:em,yticks:ticks(0,em,4),xticks:xt,series:[{vals:r.E,color:'var(--econ)'},{vals:r.Ef,color:'var(--diss)'},{vals:r.Er,color:'var(--eco)'}]});\n  $('lg1').innerHTML=['var(--econ)','var(--diss)','var(--eco)'].map(function(c,i){return '<span><i style=\"background:'+c+'\"><\/i>'+d.l1[i]+'<\/span>';}).join('');\n  /* émissions (gauche) et température (droite, ramenée sur l'échelle de gauche) */\n  var mm=niceMax(maxOf(r.EM)*1.05),tlo=13,thi=Math.max(14,Math.ceil(maxOf(r.Tat)+.2));\n  var tsc=r.Tat.map(function(v){return (v-tlo)/(thi-tlo)*mm;});\n  var ax2=lineChart($('c2'),{W:W,H:H,L:44,R:36,n:N,ymin:0,ymax:mm,yticks:ticks(0,mm,4),xticks:xt,series:[{vals:r.EM,color:'var(--econ)'},{vals:tsc,color:'var(--warn)',end:1}]});\n  var svg=$('c2');for(var tv=tlo;tv<=thi+1e-9;tv+=(thi-tlo>4?2:1)){var y=ax2.Y((tv-tlo)/(thi-tlo)*mm);svg.appendChild(mk('text',{x:W-32,y:y+3.5,style:'fill:var(--warn);font-size:10.5px;font-family:var(--font-m)'},fmt(tv)+'°'));}\n  $('lg2').innerHTML='<span><i style=\"background:var(--econ)\"><\/i>'+d.l2[0]+'<\/span><span><i style=\"background:var(--warn)\"><\/i>'+d.l2[1]+'<\/span>';\n  var ym=niceMax(Math.max(maxOf(r.Y),maxOf(r.Yc))*1.05);\n  var ax3=lineChart($('c3'),{W:W,H:H,L:44,n:N,ymin:0,ymax:ym,yticks:ticks(0,ym,4),xticks:xt,series:[{vals:r.Y,color:'var(--econ)'},{vals:r.Yc,color:'var(--warn)',end:1}]});\n  var dm=niceMax(Math.max(maxOf(r.dH),maxOf(r.dHc))*1.05),dl=Math.min(0,Math.min.apply(null,r.dHc));\n  var ax4=lineChart($('c4'),{W:W,H:H,L:44,n:N,ymin:dl<0?-niceMax(-dl):0,ymax:dm,zero:0,yticks:ticks(dl<0?-niceMax(-dl):0,dm,4),xticks:xt,series:[{vals:r.dH.map(function(v,i){return i?v:null;}),color:'var(--econ)'},{vals:r.dHc.map(function(v,i){return i?v:null;}),color:'var(--warn)',end:1}]});\n  var lg3='<span><i style=\"background:var(--econ)\"><\/i>'+d.l3[0]+'<\/span><span><i style=\"background:var(--warn)\"><\/i>'+d.l3[1]+'<\/span>';$('lg3').innerHTML=lg3;$('lg4').innerHTML=lg3;\n  var t=N-1,gap=(r.Yc[t]/r.Y[t]-1)*100;\n  var o={Yr:f1(r.Y[t]),gap:(gap>=0?'+':'')+fmt(gap,0)+(LANG==='fr'?' %':'%'),Dr:f1(r.dH[t]),Hr:f1(r.H[t])};\n  var kv=['+'+f2(r.Tat[t]-13)+' °C',f1(r.Yc[t]),f1(r.dHc[t]),CLIM?f1(r.d[t]):'—'],ks=d.ks(o);\n  renderGuide(r,{1:[ax1,r.E],2:[ax2,r.EM],3:[ax3,r.Yc],4:[ax4,r.dHc]});\n  $('kpis').innerHTML=d.k.map(function(k,i){return '<div class=\"kpi\"><div class=\"kl\">'+k+'<\/div><div class=\"kv\" style=\"color:'+['var(--warn)','var(--warn)','var(--rms)','var(--warn)'][i]+'\">'+kv[i]+'<\/div><div class=\"ks\">'+ks[i]+'<\/div><\/div>';}).join('');}\nvar GSTEP=0;\nfunction facts(r){var N=r.t.length,t=N-1,pk=1,epk=1,mpk=1,dm=1;\n  for(var i=1;i<N;i++){if(r.Yc[i]>r.Yc[pk])pk=i;if(r.E[i]>r.E[epk])epk=i;if(r.EM[i]>r.EM[mpk])mpk=i;if(r.dHc[i]<r.dHc[dm])dm=i;}\n  var gap=(r.Yc[t]/r.Y[t]-1)*100;\n  return {T:t,pk:pk,epk:epk,mpk:mpk,dm:dm,dT:f1(r.Tat[t]-13),Ypk:f1(r.Yc[pk]),Y44:f1(r.Yc[t]),Yr:f1(r.Y[t]),gap:(gap>=0?'+':'−')+fmt(Math.abs(gap),0)+(LANG==='fr'?' %':'%'),\n    Epk:fmt(r.E[epk]),E44:fmt(r.E[t]),Er44:fmt(r.Er[t],1),mu:pct(PR.mu*100,0),Dmin:f1(r.dHc[dm]),D44:f1(r.dHc[t]),m0:f1(r.Yc[pk]/PR.G),m44:f1(r.Yc[t]/PR.G)};}\nfunction renderGuide(r,AX){var d=D(),o=facts(r),g=d.g[GSTEP],foc=CLIM?g[2]:0;\n  $('gt').textContent=CLIM?g[0]:d.gl;$('gx').innerHTML=CLIM?g[1](o):d.g_off;\n  for(var k=1;k<=4;k++){$('w'+k).classList.toggle('dim',foc>0&&foc!==k);$('w'+k).classList.toggle('focus',foc===k);}\n  if(foc>0){var yr={1:o.epk,2:o.mpk,3:o.pk,4:o.dm}[foc],a=AX[foc][0],v=AX[foc][1][yr],svg=$('c'+foc);\n    svg.appendChild(mk('line',{x1:a.X(yr),x2:a.X(yr),y1:14,y2:a.Y(v),style:'stroke:var(--warn);stroke-width:1.2;stroke-dasharray:3 3'}));\n    svg.appendChild(mk('circle',{cx:a.X(yr),cy:a.Y(v),r:5.5,style:'fill:var(--surface);stroke:var(--warn);stroke-width:2.4'}));\n    var tx=mk('text',{x:a.X(yr)+(yr>34?-8:8),y:24,'text-anchor':yr>34?'end':'start',style:'fill:var(--warn);font-size:11.5px;font-family:var(--font-m);font-weight:600'});tx.textContent=(LANG==='fr'?'année ':'year ')+yr;svg.appendChild(tx);}\n}\nnew Stepper('st2',6,function(i){GSTEP=i;renderSim();});\nfunction renderLims(){var d=D();$('lims').innerHTML=d.lims.map(function(l){return '<div class=\"lim\" style=\"--c:'+l[1]+'\"><h3>'+l[0]+'<\/h3><p>'+l[2]()+'<\/p><\/div>';}).join('');}\nfunction renderAll(){renderEq();renderSim();renderLims();}\nboot();\nLAST_STEPPER=null;\n<\/script>\n<\/body>\n<\/html>\n\n<\/body><\/html>"}</script>

<script>
(function(){
  "use strict";

  var CFG   = JSON.parse(document.getElementById('configsrc').textContent);
  var TOOLS = JSON.parse(document.getElementById('toolsrc').textContent);

  var STEPS   = CFG.outils;          // {fichier, cle, partie, icone, couleur}
  var PARTIES = CFG.parties;         // {numero, couleur} ; numero vide = seuil
  var N       = STEPS.length;
  var NP      = PARTIES.length;
  var PREFIXE = CFG.prefixe_stockage || 'fil';

  function tok(nom){ return 'var(--' + (nom || 'ink') + ')'; }

  /* ───────── bibliothèque d'icônes ─────────
     Chaque icône reçoit la couleur d'accent de sa carte. Pour en ajouter une,
     déclarer un cas supplémentaire et le nommer dans la configuration. */
  function emb(nom, couleur){
    var a = tok(couleur);
    var S = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">';
    switch(nom){
      case 'cibles':      return S+'<circle cx="12" cy="12" r="9" stroke="'+a+'"/><circle cx="12" cy="12" r="5.4"/><circle cx="12" cy="12" r="2" fill="var(--econ)" stroke="var(--econ)"/></svg>';
      case 'circuit':     return S+'<circle cx="12" cy="12" r="8"/><path d="M15 9.2A4 4 0 0 0 8.5 11" stroke="'+a+'"/><path d="M9 14.8A4 4 0 0 0 15.5 13" stroke="'+a+'"/><path d="M9.5 11.5h4M9.5 13h4" stroke="'+a+'"/></svg>';
      case 'eclair':      return S+'<circle cx="12" cy="12" r="8"/><path d="M12.5 7l-3.2 5.4H12l-0.6 4.2 3.6-5.6H12z" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'engrenages':  return S+'<circle cx="9" cy="10" r="3.2"/><circle cx="15.4" cy="15" r="2.6"/><path d="M9 4.6v1.6M9 13.8v1.6M3.8 10h1.6M12.6 10h1.6M5.4 6.4l1.1 1.1M11.5 12.5l1.1 1.1M12.6 6.4l-1.1 1.1M5.4 13.6l1.1-1.1" stroke="'+a+'"/></svg>';
      case 'courbes':     return S+'<path d="M3 20C10 20 12 5 21 4" stroke="'+a+'"/><path d="M3 20C9 20 9 9 20 8.5"/></svg>';
      case 'bosse':       return S+'<path d="M3.5 19C8 5 16 5 20.5 19" stroke="'+a+'"/><path d="M3 12.5h18" stroke-dasharray="2 2"/></svg>';
      case 'lecture':     return S+'<path d="M9 7l8 5-8 5z" fill="'+a+'" stroke="'+a+'"/><path d="M4 12h2"/></svg>';
      case 'seuil':       return S+'<path d="M3 20C7 20 8 8 13 8s2 8 8 8" stroke="'+a+'"/><path d="M3 6h18" stroke-dasharray="2 2"/></svg>';
      case 'divergence':  return S+'<path d="M3 18C9 18 12 15 21 14"/><path d="M3 18C9 18 11 7 21 4" stroke="'+a+'"/><path d="M3 21V3" opacity=".45"/></svg>';
      case 'fourche':     return S+'<path d="M3 12h7"/><path d="M10 12l8-5.5" stroke="'+a+'"/><path d="M10 12l8 5.5" stroke="var(--faint)"/><path d="M18 6.5l-3 .4M18 6.5l.5 2.9" stroke="'+a+'"/></svg>';
      case 'leviers':     return S+'<path d="M3 20h18"/><path d="M6 20v-7"/><path d="M12 20V6" stroke="'+a+'"/><path d="M18 20v-10"/><path d="M8.6 8.4l2.2 2.2M10.8 8.4l-2.2 2.2" stroke="var(--faint)"/><path d="M14.6 12l2.2 2.2M16.8 12l-2.2 2.2" stroke="var(--faint)"/></svg>';
      case 'anneau':      return S+'<circle cx="12" cy="12" r="8.6" stroke-dasharray="3.4 2.4"/><circle cx="12" cy="12" r="4.4" stroke="'+a+'"/></svg>';
      case 'aires':       return S+'<path d="M3 20h18"/><path d="M3 17.6c4 0 6-2.4 9-2.4s5.4 1.6 9 1.6" stroke="'+a+'"/><path d="M3 13.6c4 0 6-3.6 9-3.6s5.4 2.6 9 2.6"/><path d="M3 9.4c4 0 6-2.6 9-2.6s5.4 1.8 9 1.8" opacity=".5"/></svg>';
      case 'balance':     return S+'<path d="M12 4v16M5 8h14" stroke="'+a+'"/><path d="M5 8l-2.2 5a2.6 2.6 0 0 0 4.4 0z"/><path d="M19 8l-2.2 5a2.6 2.6 0 0 0 4.4 0z"/></svg>';
      case 'flux':        return S+'<path d="M3 8h13" stroke="'+a+'"/><path d="M16 8l-3-2.6M16 8l-3 2.6" stroke="'+a+'"/><path d="M21 16H8"/><path d="M8 16l3-2.6M8 16l3 2.6"/></svg>';
      case 'horloge':     return S+'<circle cx="12" cy="12" r="8.6"/><path d="M12 7v5.4l3.4 2" stroke="'+a+'"/></svg>';
      case 'grille':      return S+'<rect x="4" y="4" width="16" height="16" rx="2.6"/><path d="M12 4.4v15.2M4.4 12h15.2"/><path d="M5.7 5.7h5.1v5.1h-5.1z" fill="'+a+'" stroke="none"/></svg>';
      case 'carres':      return S+'<g stroke="none"><rect x="4.6" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="10.2" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="15.8" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="4.6" y="10.2" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="10.2" y="10.2" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="15.8" y="10.2" width="4.6" height="4.6" rx="1" fill="currentColor"/><rect x="4.6" y="15.8" width="4.6" height="4.6" rx="1" fill="currentColor"/><rect x="10.2" y="15.8" width="4.6" height="4.6" rx="1" fill="var(--faint)"/><rect x="15.8" y="15.8" width="4.6" height="4.6" rx="1" fill="var(--line)"/></g></svg>';
      case 'curseurs':    return S+'<path d="M3.4 7h17.2M3.4 12h17.2M3.4 17h17.2"/><circle cx="8" cy="7" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/><circle cx="15.2" cy="12" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/><circle cx="11" cy="17" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/></svg>';
      /* robinet : un apport par le haut, un niveau qui s'établit, une fuite par
         le bas — la baignoire monétaire (crédits, dépôts, remboursements). */
      /* fuite : une monnaie qui circule dans un périmètre, et ce qui en sort.
         Le trait d'accent est la fuite, pas la circulation. */
      case 'fuite':       return S+'<rect x="2.8" y="5" width="12.6" height="14" rx="2.4"/><circle cx="6.8" cy="11.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="11.2" cy="14.4" r="1.15" fill="currentColor" stroke="none"/><circle cx="6.8" cy="16.6" r="1.15" fill="currentColor" stroke="none"/><path d="M11.8 8.2h9" stroke="'+a+'"/><path d="M20.8 8.2l-2.2-1.8M20.8 8.2l-2.2 1.8" stroke="'+a+'"/></svg>';
      case 'robinet':     return S+'<path d="M3.4 5.2h5.4" stroke="'+a+'"/><path d="M8.8 5.2v2.7" stroke="'+a+'"/><circle cx="8.8" cy="9.5" r="0.8" fill="'+a+'" stroke="none"/><path d="M4.6 12.2h14.8v5.4a2 2 0 0 1-2 2H6.6a2 2 0 0 1-2-2z"/><path d="M4.6 15.1h14.8" stroke="'+a+'"/><circle cx="12" cy="22" r="0.95" fill="'+a+'" stroke="none"/></svg>';
      case 'seau':        return S+'<path d="M4.2 6.6h15.6l-1.7 9.7a1.8 1.8 0 0 1-1.8 1.5H7.7a1.8 1.8 0 0 1-1.8-1.5z"/><path d="M10.4 11.6h.01M13.7 13.6h.01" stroke="'+a+'" stroke-width="2.6"/><circle cx="10.5" cy="20.4" r="1.05" fill="'+a+'" stroke="none"/><circle cx="13.9" cy="21.4" r="0.85" fill="'+a+'" stroke="none"/></svg>';
      case 'des':         return S+'<rect x="4" y="4" width="16" height="16" rx="3.4"/><circle cx="8.6" cy="8.6" r="1.35" fill="'+a+'" stroke="none"/><circle cx="15.4" cy="8.6" r="1.35" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.35" fill="'+a+'" stroke="none"/><circle cx="8.6" cy="15.4" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.35" fill="'+a+'" stroke="none"/></svg>';
      case 'planchers':   return S+'<path d="M3 20h18"/><rect x="5" y="6.5" width="3.8" height="13.5" rx="1"/><rect x="10.1" y="9.5" width="3.8" height="10.5" rx="1"/><rect x="15.2" y="12" width="3.8" height="8" rx="1" stroke="'+a+'"/><path d="M3.8 16.8h16.4" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'mappemonde':  return S+'<circle cx="12" cy="12" r="8.6" stroke="'+a+'"/><path d="M12 3.4c3.1 3 3.1 14.2 0 17.2M12 3.4c-3.1 3-3.1 14.2 0 17.2"/><path d="M3.7 9.3h16.6M3.7 14.7h16.6"/></svg>';
      /* silhouette réelle de la courbe de l'éléphant : bosse, creux, trompe */
      case 'elephant':    return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17.5C6.6 17.5 7.2 10 9.6 10S12.6 15.2 15.4 15.2C17.4 15.2 18.2 9.5 20 4.6" stroke="'+a+'"/></svg>';
      case 'convergence': return S+'<path d="M3.2 5.5h4.4M3.2 12h4.4M3.2 18.5h4.4"/><path d="M7.6 5.5C12.8 5.5 12.8 12 16.2 12" stroke="'+a+'"/><path d="M7.6 12h8.6" stroke="'+a+'"/><path d="M7.6 18.5C12.8 18.5 12.8 12 16.2 12" stroke="'+a+'"/><circle cx="18.4" cy="12" r="2.1" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'distribution':return S+'<path d="M3 20h18"/><path d="M5.5 20v-3.2M8.5 20v-9M11.5 20v-6M14.5 20v-3.4M17.5 20v-1.8"/><path d="M12.8 4.5V20" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'lorenz':      return S+'<path d="M4 20h16M4 20V4"/><path d="M4 20L20 4" stroke-dasharray="2.5 2" opacity=".55"/><path d="M4 20C11 20 16.5 15 20 4" stroke="'+a+'"/></svg>';
      /* plusieurs séries superposées, pilotées par un même sélecteur */
      case 'series':      return S+'<path d="M4 20h16M4 20V4"/><path d="M6 14.5l3.4-3.4 3.4 3.4 3.4-6.6 2.6 2.4" stroke="'+a+'"/><path d="M6 17.8c3.4-.6 6.2 1 12-2.6" opacity=".45"/><circle cx="9.4" cy="11.1" r="1.25" fill="'+a+'" stroke="none"/><circle cx="16.2" cy="7.9" r="1.25" fill="'+a+'" stroke="none"/></svg>';
      case 'croisement':  return S+'<path d="M4 20h16M4 20V4"/><path d="M6 17.5L19 7" stroke="'+a+'" stroke-dasharray="3 2"/><circle cx="8.5" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="13.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="10.5" r="1.2" fill="'+a+'" stroke="none"/><circle cx="18" cy="8" r="1.2" fill="'+a+'" stroke="none"/></svg>';
      case 'voile':       return S+'<path d="M2.6 12S6 6.8 12 6.8 21.4 12 21.4 12 18 17.2 12 17.2 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="2.5" stroke="'+a+'"/><path d="M4.5 19.5L19.5 4.5" stroke="'+a+'"/></svg>';
      case 'course':      return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17C9 17 13 13.5 20 5.5" stroke="'+a+'"/><path d="M4.5 17C9 17 13 15.5 20 13.5"/></svg>';
      case 'ratio':       return S+'<path d="M3 20h18"/><rect x="5.5" y="4.5" width="4.6" height="15.5" rx="1.2" stroke="'+a+'"/><rect x="13.9" y="15" width="4.6" height="5" rx="1.2"/></svg>';
      case 'ecart':       return S+'<path d="M3 20h18"/><path d="M4 7h16" stroke="'+a+'"/><path d="M4 12.6C9 12.6 13.5 16 20 17"/><path d="M12 7.6v6.9" stroke="var(--faint)"/><path d="M12 7.6l-1.5 1.7M12 7.6l1.5 1.7M12 14.5l-1.5-1.7M12 14.5l1.5-1.7" stroke="var(--faint)"/></svg>';
    }
    return S+'<circle cx="12" cy="12" r="8" stroke="'+a+'"/></svg>';
  }

  /* ───────── état ───────── */
  var LANG = CFG.langue_defaut || 'fr';
  try{ var sl=localStorage.getItem(PREFIXE+'_lang'); if(sl) LANG=sl; }catch(e){}
  var THEME=null;
  try{ var st=localStorage.getItem(PREFIXE+'_theme'); if(st) THEME=st; }catch(e){}
  if(!THEME) THEME = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', THEME);

  function T(){ return CFG.textes[LANG]; }

  function seed(){
    for(var i=0;i<N;i++){
      try{
        localStorage.setItem(STEPS[i].cle+'_theme', THEME);
        localStorage.setItem(STEPS[i].cle+'_lang',  LANG);
      }catch(e){}
    }
    try{ localStorage.setItem(PREFIXE+'_theme',THEME); localStorage.setItem(PREFIXE+'_lang',LANG); }catch(e){}
  }

  /* ───────── le fil ───────── */
  function carte(i){
    var d=T(), s=STEPS[i];
    var a=document.createElement('a');
    a.className='card'; a.href='#/'+(i+1);
    a.innerHTML='<span class="emb" style="color:'+tok(s.couleur)+'">'+emb(s.icone,s.couleur)+'</span>'+
      '<span class="cbody"><span class="idx">'+(i+1)+'</span>'+
      '<h3>'+d.cartes[i].titre+'</h3><p>'+d.cartes[i].resume+'</p>'+
      '<span class="go">'+d.nav_ouvrir+' →</span></span>';
    return a;
  }

  /* Une partie sans numéro est un seuil : elle ouvre la séance sans être
     comptée dans les parties. Le fil l'annonce par une étiquette, le bandeau
     par un repère discret placé avant les chiffres romains. */
  function estSeuil(p){ var P=PARTIES[p-1]; return !!P.seuil || !P.numero; }
  function marque(p){ return estSeuil(p) ? '◦' : PARTIES[p-1].numero; }
  function etiquette(p){
    var e=T().parties[p-1].etiquette;
    return e || (LANG==='en' ? 'Opening' : 'Ouverture');
  }

  function buildFil(){
    var d=T(), box=document.getElementById('parties');
    box.innerHTML='';
    for(var p=1;p<=NP;p++){
      var sec=document.createElement('section');
      sec.className='part'+(estSeuil(p)?' seuil':'');
      sec.style.setProperty('--pc', tok(PARTIES[p-1].couleur));
      var rang = estSeuil(p)
        ? '<span class="sn">'+etiquette(p)+'</span>'
        : '<span class="rn">'+PARTIES[p-1].numero+'</span>';
      var h='<div class="parthead">'+rang+
            '<h2>'+d.parties[p-1].titre+'</h2></div>'+
            '<p class="partlead">'+d.parties[p-1].chapo+'</p>'+
            '<div class="cards"></div>';
      sec.innerHTML=h;
      var grille=sec.querySelector('.cards');
      for(var i=0;i<N;i++) if(STEPS[i].partie===p) grille.appendChild(carte(i));
      box.appendChild(sec);
    }
  }

  /* ───────── bandeau de situation ───────── */
  function premierDe(p){ for(var j=0;j<N;j++) if(STEPS[j].partie===p) return j; return 0; }

  function buildNav(i){
    var d=T(), s=STEPS[i], cur=null,
        bar=document.getElementById('nparts'), box=document.getElementById('steps');
    document.documentElement.style.setProperty('--acc', tok(PARTIES[s.partie-1].couleur));
    document.getElementById('ncount').textContent=(i+1)+' / '+N;

    bar.innerHTML='';
    for(var p=1;p<=NP;p++){
      if(p===s.partie){
        var c=document.createElement('span');
        c.className='pcur';
        /* Séance à une seule partie : le repère n'oppose la partie à rien,
           il ne reste que son intitulé. */
        c.innerHTML=(NP>1?'<em>'+marque(p)+'</em>':'')+'<span>'+d.parties[p-1].titre+'</span>';
        c.setAttribute('aria-current','true');
        bar.appendChild(c);
      } else {
        var g=document.createElement('a');
        g.className='pgrp';
        g.href='#/'+(premierDe(p)+1);
        g.title=(estSeuil(p)?etiquette(p):PARTIES[p-1].numero)+' · '+d.parties[p-1].titre;
        g.textContent=marque(p);
        bar.appendChild(g);
      }
    }

    box.innerHTML='';
    for(var j=0;j<N;j++){
      if(STEPS[j].partie!==s.partie) continue;
      var a=document.createElement('a');
      a.className='stp'+(j===i?' on':'');
      a.href='#/'+(j+1);
      a.title=d.cartes[j].titre;
      a.innerHTML='<em>'+(j+1)+'</em><span>'+d.cartes[j].titre+'</span>';
      if(j===i){ a.setAttribute('aria-current','true'); cur=a; }
      box.appendChild(a);
    }
    /* le bandeau peut être encore masqué : on attend une frame pour mesurer */
    if(cur) requestAnimationFrame(function(){
      box.scrollLeft = Math.max(0, cur.offsetLeft - (box.clientWidth - cur.offsetWidth)/2);
    });
  }

  /* ───────── iframes ───────── */
  var host=document.getElementById('host'), frames={}, current=-1;

  /* Une iframe capte le clavier dès qu'on a cliqué dedans, et la coquille ne
     voit plus rien. On y relaie donc Échap et F — et seulement eux : les
     flèches appartiennent aux outils, qui s'en servent pour leurs propres
     étapes. Les iframes srcdoc héritent de notre origine, d'où l'accès. */
  function brancherClavier(fr){
    try{
      var doc=fr.contentDocument; if(!doc) return;
      doc.addEventListener('keydown', function(ev){
        if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
        if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
        else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
      });
    }catch(e){}
  }

  function syncFrame(fr){
    if(!fr) return;
    try{
      var doc=fr.contentDocument;
      if(!doc || !doc.documentElement) return;
      for(var n=0;n<2;n++){
        if(doc.documentElement.getAttribute('data-theme')===THEME) break;
        var tb=doc.getElementById('theme'); if(!tb) break; tb.click();
      }
      for(var m=0;m<2;m++){
        if((doc.documentElement.lang||'fr')===LANG) break;
        var lb=doc.getElementById('lang'); if(!lb) break; lb.click();
      }
    }catch(e){}
  }

  function showTool(i){
    var s=STEPS[i], d=T();
    document.body.classList.add('mode-tool');
    seed();
    if(!frames[s.fichier]){
      var fr=document.createElement('iframe');
      fr.setAttribute('title', d.cartes[i].titre);
      host.appendChild(fr);
      frames[s.fichier]=fr;
      fr.addEventListener('load', function(){ syncFrame(fr); brancherClavier(fr); });
      fr.srcdoc = TOOLS[s.fichier];
    } else {
      syncFrame(frames[s.fichier]);
    }
    for(var k in frames) frames[k].style.display = (k===s.fichier) ? 'block' : 'none';
    if(plein) montrerNav(1600);
    current=i;
    buildNav(i);
    var pb=document.getElementById('prev'), nb=document.getElementById('next');
    pb.disabled=(i===0); nb.disabled=(i===N-1);
    pb.title=d.nav_prec; nb.title=d.nav_suiv;
  }

  function showFil(){
    if(plein) setPlein(false);
    document.body.classList.remove('mode-tool');
    current=-1;
    window.scrollTo(0, window.__filScroll||0);
  }

  /* ───────── plein écran ───────── */
  var plein=false, minuterieNav=null, minuterieAstuce=null;

  function montrerNav(delaiMasquage){
    document.body.classList.add('nav-on');
    clearTimeout(minuterieNav);
    if(delaiMasquage) minuterieNav=setTimeout(function(){
      document.body.classList.remove('nav-on');
    }, delaiMasquage);
  }

  function demanderPleinEcran(){
    var el=document.documentElement;
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(f){ try{ var p=f.call(el); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }
  function quitterPleinEcran(){
    var actif=document.fullscreenElement||document.webkitFullscreenElement;
    if(!actif) return;
    var f=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(f){ try{ var p=f.call(document); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }

  function setPlein(v){
    if(plein===v) return;
    plein=v;
    document.body.classList.toggle('mode-plein', v);
    var b=document.getElementById('tplein'), d=T();
    b.textContent = v ? '⤡' : '⤢';
    b.title = v ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    if(v){
      demanderPleinEcran();
      montrerNav(2400);
      document.getElementById('pastille').textContent =
        (d.nav_plein_astuce||'Approchez du haut pour revoir la barre · Échap pour sortir');
      document.body.classList.add('astuce');
      clearTimeout(minuterieAstuce);
      /* l'astuce doit rester lisible après le retrait du bandeau, pas pendant */
      minuterieAstuce=setTimeout(function(){ document.body.classList.remove('astuce'); }, 6500);
    } else {
      quitterPleinEcran();
      clearTimeout(minuterieNav); clearTimeout(minuterieAstuce);
      document.body.classList.remove('nav-on','astuce');
    }
  }

  document.getElementById('tplein').addEventListener('click', function(){ setPlein(!plein); });
  document.getElementById('hotzone').addEventListener('mouseenter', function(){ montrerNav(0); });
  document.querySelector('.nav').addEventListener('mouseleave', function(){ if(plein) montrerNav(500); });
  /* Sortie par F11 ou par la touche Échap interceptée par le navigateur :
     on resynchronise la coquille sur l'état réel. */
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement||document.webkitFullscreenElement) && plein) setPlein(false);
    });
  });

  function route(){
    var h=(location.hash||'').replace(/^#\/?/,'');
    var n=parseInt(h,10);
    if(h && !isNaN(n) && n>=1 && n<=N){
      if(current===-1) window.__filScroll = window.pageYOffset||0;
      showTool(n-1);
    } else {
      showFil();
    }
  }
  window.addEventListener('hashchange', route);

  function go(i){
    if(i<0){ location.hash='#/fil'; return; }
    if(i>N-1) return;
    location.hash='#/'+(i+1);
  }
  document.getElementById('prev').addEventListener('click', function(){ if(current>0) go(current-1); });
  document.getElementById('next').addEventListener('click', function(){ if(current>-1 && current<N-1) go(current+1); });

  document.addEventListener('keydown', function(ev){
    if(current===-1) return;
    if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
    else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
    else if(ev.key==='ArrowLeft'  && current>0)   { go(current-1); }
    else if(ev.key==='ArrowRight' && current<N-1) { go(current+1); }
  });

  /* ───────── bascules ───────── */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', THEME);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleTheme(){ THEME=(THEME==='dark')?'light':'dark'; applyTheme(); }
  document.getElementById('theme').addEventListener('click', toggleTheme);
  document.getElementById('ttheme').addEventListener('click', toggleTheme);

  function applyLang(){
    var d=T();
    document.documentElement.lang=LANG;
    document.title = d.titre_onglet;
    document.getElementById('eyebrow').innerHTML = d.surtitre;
    document.getElementById('titre').textContent = d.titre;
    document.getElementById('seance').textContent = d.seance;
    document.getElementById('chapo').innerHTML = d.chapo;
    document.getElementById('pied').innerHTML = d.pied;
    document.getElementById('licence').innerHTML = d.licence;
    document.getElementById('homelbl').textContent = d.nav_fil;
    /* Remontée vers la page du cours : seulement si le manifeste la déclare.
       Une séance diffusée seule, sans page d'accueil à côté, n'affiche rien
       plutôt qu'un lien qui mènerait à une erreur. */
    var lien = CFG.lien_accueil, rm = document.getElementById('remonte'),
        ab = document.getElementById('accueilbtn');
    if(lien){
      rm.href = lien; ab.href = lien;
      rm.hidden = false; ab.hidden = false;
      document.getElementById('remontelbl').textContent = d.nav_accueil || 'Le cours';
      ab.title = d.nav_accueil || 'Le cours';
    } else {
      rm.hidden = true; ab.hidden = true;
    }
    var bp=document.getElementById('tplein');
    bp.title = plein ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    document.getElementById('langlbl').textContent = LANG.toUpperCase();
    document.getElementById('tlanglbl').textContent = LANG.toUpperCase();
    buildFil();
    if(current>-1) buildNav(current);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleLang(){
    var codes=Object.keys(CFG.textes);
    LANG = codes[(codes.indexOf(LANG)+1) % codes.length];
    applyLang();
  }
  document.getElementById('lang').addEventListener('click', toggleLang);
  document.getElementById('tlang').addEventListener('click', toggleLang);

  /* ───────── démarrage ───────── */
  seed();
  applyLang();
  route();
})();
</script>

</body>
</html>
