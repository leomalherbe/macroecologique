1},{r:null},{r:0.6},{r:0.97}];\n  var GMAX=4;\n  // Frontières par habitant (O'Neill et al. 2018) — valeurs absolues affichées uniquement pour 2015.\n  // Ordre = indicateurs du donut : CO2, Phosphore, Azote, Usage des sols(–), Empr. écologique, Empr. matières\n  var ABS=[{b:1.61,uf:'t CO₂/hab·an',ue:'t CO₂/cap·yr'},{b:0.89,uf:'kg P/hab·an',ue:'kg P/cap·yr'},{b:8.9,uf:'kg N/hab·an',ue:'kg N/cap·yr'},null,{b:1.72,uf:'hag/hab',ue:'gha/cap'},{b:7.2,uf:'t/hab·an',ue:'t/cap·yr'}];\n\n  var STR={\n    fr:{\n      eyebrow:\"Le Donut · plafond écologique\",\n      title:\"Rester dans les limites planétaires\",\n      sub:\"Le « <b>Donut<\/b> » de Kate Raworth superpose deux bords : un <b>plancher social<\/b> (les besoins humains) et un <b>plafond écologique<\/b> (les limites planétaires). On commence ici par le plafond : les <b>neuf limites planétaires<\/b>, la question de savoir <i>où<\/i> placer une limite, et un donut interactif du dépassement écologique pays par pays.\",\n      s1t:\"Les neuf limites planétaires\",\n      s1d:\"Proposées par Johan Rockström et ses collègues (2009), les limites planétaires délimitent un <b>« espace de fonctionnement sûr »<\/b> pour l'humanité : neuf processus qui régulent la stabilité du système Terre. Tant qu'on reste en deçà, le risque de basculement reste faible ; au-delà, on entre dans une zone de danger croissant.\",\n      s1lead:\"Chaque limite mesure une <b>pression humaine<\/b> sur un processus vital (climat, eau, cycles chimiques…). La dernière évaluation (2023, actualisée en 2025) estime que <b>7 des 9<\/b> limites sont désormais franchies.\",\n      s1stat:\"franchies\",\n      boundaries:[\n        {n:\"Changement climatique\", st:\"over\", d:\"Concentration de CO₂ et forçage radiatif. Cœur du système ; franchie.\",\n          m:\"Concentration de CO₂ atmosphérique (ppm) ; forçage radiatif (W/m²)\", s:\"350 ppm (+1 W/m²)\", a:\"≈ 423 ppm (+3,0 W/m²)\",\n          j:\"Limiter le réchauffement vers 1–1,5 °C et éviter le basculement des calottes glaciaires. L'Holocène stable était à ~280 ppm.\"},\n        {n:\"Intégrité de la biosphère\", st:\"over\", d:\"Perte de biodiversité et des fonctions écologiques. Largement franchie.\",\n          m:\"Taux d'extinction (E/MSY = extinctions par million d'espèces·années ; rythme naturel ≈ 1) ; production primaire captée par l'humain (HANPP, %)\", s:\"< 10 E/MSY ; < 10 % HANPP\", a:\"> 100 E/MSY ; ~30 % HANPP\",\n          j:\"Rester proche du rythme d'extinction naturel (~1 E/MSY) et laisser assez d'énergie aux écosystèmes.\"},\n        {n:\"Changement d'usage des sols\", st:\"over\", d:\"Conversion des forêts et écosystèmes (agriculture, urbanisation).\",\n          m:\"Surface de forêts encore intactes (% du couvert d'origine)\", s:\"75 % (85 % tropical/boréal, 50 % tempéré)\", a:\"≈ 59 %\",\n          j:\"Les forêts régulent le climat : stockage du carbone, humidité, albédo.\"},\n        {n:\"Eau douce\", st:\"over\", d:\"Perturbation des cycles de l'eau verte (sols) et bleue (rivières, nappes).\",\n          m:\"Part des terres où l'eau verte (sols) et l'eau bleue (rivières, nappes) s'écartent du régime holocène (%)\", s:\"≈ 11–13 %\", a:\"≈ 22 %\",\n          j:\"Maintenir le cycle de l'eau proche de sa variabilité préindustrielle.\"},\n        {n:\"Flux biogéochimiques\", st:\"over\", d:\"Cycles de l'azote et du phosphore, dopés par les engrais. Très franchie.\",\n          m:\"Azote fixé industriellement (Tg N/an) ; flux de phosphore (Tg P/an)\", s:\"62 Tg N/an ; 11 Tg P/an\", a:\"≈ 165 Tg N/an ; phosphore saturant les sols\",\n          j:\"Éviter l'eutrophisation des eaux et les « zones mortes » côtières.\"},\n        {n:\"Acidification des océans\", st:\"over\", d:\"Baisse du pH de l'océan due au CO₂. Nouvellement franchie (2025).\",\n          m:\"État de saturation en aragonite de l'océan de surface (Ω)\", s:\"Ω ≥ 2,86 (≈ 80 % du niveau préindustriel)\", a:\"≈ 2,84\",\n          j:\"L'aragonite est indispensable aux organismes calcifiants (coraux, coquillages).\"},\n        {n:\"Entités nouvelles\", st:\"over\", d:\"Polluants de synthèse, plastiques, métaux lourds. Jugée franchie (2022).\",\n          m:\"Pas d'indicateur global unique ; substances de synthèse rejetées sans évaluation suffisante\", s:\"0 (précaution)\", a:\"largement > 0\",\n          j:\"Plastiques, PFAS, métaux lourds… : effets planétaires potentiellement irréversibles.\"},\n        {n:\"Aérosols atmosphériques\", st:\"safe\", d:\"Particules dans l'air. Globalement respectée, mais dépassée régionalement.\",\n          m:\"Différence interhémisphérique de profondeur optique des aérosols (AOD)\", s:\"0,10\", a:\"≈ 0,06 (mais dépassée en Asie du Sud)\",\n          j:\"Les aérosols perturbent les moussons et le bilan radiatif régional.\"},\n        {n:\"Ozone stratosphérique\", st:\"safe\", d:\"Couche d'ozone. Respectée et en voie de reconstitution (protocole de Montréal).\",\n          m:\"Concentration d'ozone stratosphérique (unités Dobson, DU)\", s:\"≥ 277 DU (−5 % vs préindustriel)\", a:\"≈ 286 DU\",\n          j:\"L'ozone filtre les UV-B. Le protocole de Montréal a permis sa reconstitution.\"}\n      ],\n      st_over:\"franchie\", st_safe:\"respectée\",\n      pp_metric:\"Métrique\", pp_seuil:\"Seuil\", pp_now:\"Aujourd'hui\", pp_vs:\"Vs seuil\", pp_novs:\"pas de seuil chiffré global\",\n      s2t:\"Où placer la limite ?\",\n      s2d:\"Une limite planétaire n'est pas un mur physique net. Pour chaque processus, on choisit une <b>variable de contrôle<\/b> mesurable (p. ex. la concentration de CO₂), puis on place la limite <b>en amont<\/b> du point de bascule, du côté prudent d'une <b>zone d'incertitude<\/b>.\",\n      th_safe:\"Espace sûr\", th_bnd:\"Limite\", th_unc:\"Zone d'incertitude\", th_risk:\"Risque élevé\", th_axis:\"variable de contrôle (pression)\", th_tip:\"point de bascule\",\n      s2p1:\"La <b>limite<\/b> est placée à l'entrée de la zone d'incertitude, par <b>précaution<\/b> : on ne connaît pas exactement où se situe le point de bascule, alors on garde une marge.\",\n      s2p2:\"Certains processus ont un vrai <b>seuil<\/b> planétaire (climat, acidification) ; d'autres (azote, entités nouvelles) n'en ont pas de global net — la limite y traduit surtout un niveau de risque jugé acceptable.\",\n      s2p3:\"Pour comparer les <b>pays<\/b>, on divise en plus la limite globale en une <b>part par habitant<\/b> (« part juste »). Fixer cette part est un choix normatif autant que scientifique — c'est la référence du donut ci-dessous.\",\n      s3t:\"Le plafond écologique, pays par pays\",\n      s3d:\"Chaque coin du donut est une frontière ; le <b>cercle en pointillés<\/b> marque la part soutenable par habitant. Un coin qui <b>dépasse<\/b> le cercle est en dépassement (rouge). Choisis un pays et fais glisser les années pour voir la pression écologique évoluer (1992–2015).\",\n      s3bridge:\"Ces 6 indicateurs traduisent les limites planétaires <b>à l'échelle nationale<\/b> (part par habitant). Quatre correspondent directement à une limite du bloc 1 — <b>climat<\/b> (CO₂), <b>flux biogéochimiques<\/b> (azote, phosphore) et <b>usage des sols<\/b>. Les deux <b>empreintes<\/b> (écologique, matières) sont des <b>indicateurs agrégés<\/b> complémentaires, pas des limites planétaires au sens strict. Les autres limites — biosphère, eau douce, océans, aérosols, ozone, entités nouvelles — n'ont pas d'équivalent national par habitant et ne figurent pas ici.\",\n      c_country:\"Pays\", c_year:\"Année\",\n      lg_in:\"dans la limite\", lg_over:\"dépassement\", lg_bnd:\"frontière (part/hab.)\",\n      tip_bnd:\"Seuil · part/hab.\", tip_s:\"Seuil / hab.\", play:\"Lecture\", pause:\"Pause\",\n      indf:[\"Changement climatique\",\"Phosphore\",\"Azote\",\"Usage des sols\",\"Empreinte écologique\",\"Empreinte matières\"],\n      indShort:[\"Climat (CO₂)\",\"Phosphore\",\"Azote\",\"Usage des sols\",\"Empr. écologique\",\"Empr. matières\"],\n      ro_over:\"{n}/6 frontières franchies\", ro_none:\"aucune frontière franchie\",\n      dunote:\"Données : Fanning, O'Neill, Hickel &amp; Roux (2022), 6 indicateurs biophysiques normalisés à la <b>part par habitant<\/b> de chaque frontière (1 = la limite). Au survol, les <b>valeurs absolues<\/b> (unités physiques) sont affichées pour <b>2015<\/b> ; frontières par habitant d'après O'Neill et al. (2018). L'usage des sols n'a pas d'unité par habitant simple.\",\n      ducap:\"{c} · {y}\",\n      s4t:\"Le plancher social, pays par pays\",\n      s4d:\"Le <b>plancher social<\/b> (Kate Raworth) rassemble les besoins humains fondamentaux : 11 dimensions, chacune normalisée à un <b>seuil de « bien-vivre »<\/b> (1 = seuil atteint). En dessous de 1, il y a un <b>manque<\/b> — le plancher n'est pas assuré.\",\n      s4pol:\"Quelles dimensions retenir, et où placer chaque seuil ? Ce n'est pas une question purement technique : <b>le choix des variables et du niveau des seuils est une décision politique<\/b>, à délibérer dans le débat public. Les 11 indicateurs ci-dessous sont ceux de la base de Leeds — un choix parmi d'autres possibles.\",\n      indfS:[\"Satisfaction de vie\",\"Espérance de vie\",\"Nutrition\",\"Assainissement\",\"Revenu\",\"Accès à l'énergie\",\"Éducation\",\"Soutien social\",\"Qualité démocratique\",\"Égalité\",\"Emploi\"],\n      indShortS:[\"Satisfaction\",\"Espér. de vie\",\"Nutrition\",\"Assainissement\",\"Revenu\",\"Énergie\",\"Éducation\",\"Soutien social\",\"Démocratie\",\"Égalité\",\"Emploi\"],\n      s4tab:\"Les 11 indicateurs sociaux et leurs seuils (d'après O'Neill et al. 2018, Table 2)\",\n      st_ind:\"Indicateur social\", st_thr:\"Seuil du « bien-vivre »\",\n      socThr:[\"6,5 sur l'échelle de Cantril (0–10)\",\"65 ans d'espérance de vie en bonne santé\",\"2 700 kilocalories par personne et par jour\",\"95 % de la population a accès à un assainissement amélioré\",\"95 % de la population gagne plus de 1,90 $ par jour\",\"95 % de la population a accès à l'électricité\",\"95 % de scolarisation dans le secondaire\",\"90 % ont des proches sur qui compter\",\"0,80 (valeur approximative US/UK, indice de gouvernance)\",\"70 sur 100 (indice de Gini de 0,30)\",\"94 % en emploi (6 % de chômage)\"],\n      slg_met:\"seuil atteint\", slg_short:\"manque\", slg_thr:\"seuil du bien-vivre\",\n      ro_short:\"{n}/11 sous le seuil\", ro_none_s:\"tous les seuils atteints\", soc_short:\"en manque\", soc_met:\"objectifs atteints\",\n      stip_thr:\"Seuil\", s_nd:\"n.d.\", of_thr:\"du seuil\",\n      sdunote:\"Données : Fanning et al. (2022), 11 indicateurs sociaux normalisés au <b>seuil de bien-vivre<\/b> (1 = seuil, cf. tableau ci-dessus). Chaque coin du donut exprime la valeur du pays en <b>% de son seuil<\/b>. « n.d. » : donnée non disponible cette année-là.\",\n      s5t:\"Le Donut complet : l'espace sûr et juste\",\n      s5d:\"On superpose les deux faces. L'<b>anneau intérieur<\/b> est le plancher social (11 dimensions) : un <b>manque<\/b> creuse un trou vers le centre. L'<b>anneau extérieur<\/b> est le plafond écologique (6 frontières) : un <b>dépassement<\/b> pousse une pointe vers l'extérieur. Entre les deux, l'<b>anneau vert clair<\/b> est l'« espace sûr et juste » : le but est d'y loger toutes les dimensions.\",\n      lgF_short:\"manque social (sous le plancher)\", lgF_over:\"dépassement écologique (au-delà du plafond)\", lgF_safe:\"espace sûr et juste\",\n      roF_soc:\"Plancher social\", roF_eco:\"Plafond écologique\",\n      roF_socv:\"{n}/11 objectifs atteints\", roF_ecov:\"{n}/6 frontières franchies\",\n      roF_q:\"Dans l'espace sûr et juste ?\", roF_no:\"Non\", roF_yes:\"Oui\",\n      roF_why:\"Aucun pays de la sélection n'y parvient : soit le plancher social n'est pas assuré, soit le plafond écologique est dépassé — le plus souvent les deux à la fois.\",\n      roF_whyok:\"Ce pays loge dans l'anneau : plancher social assuré et aucune frontière écologique franchie.\",\n      s6t:\"Les trajectoires : personne n'atteint l'espace sûr et juste\",\n      s6d:\"On résume chaque pays par <b>deux nombres<\/b> : combien de ses <b>11 objectifs sociaux<\/b> sont atteints (axe vertical, vers le haut = mieux) et combien de ses <b>6 frontières écologiques<\/b> sont franchies (axe horizontal, vers la gauche = mieux). L'<b>espace sûr et juste<\/b> est le coin en <b>haut à gauche<\/b> — tous les besoins assurés, aucune frontière dépassée. Chaque pays trace un chemin de 1992 à 2015.\",\n      s6_xax:\"Frontières écologiques franchies →\",\n      s6_yax:\"Objectifs sociaux atteints ↑\",\n      s6_safe:\"espace sûr et juste\",\n      s6_empty:\"aucun pays ici\",\n      s6_hi:\"pays à hauts revenus\",\n      s6_lo:\"pays à faibles revenus\",\n      s6_dev:\"« développement »\",\n      s6_hint:\"Cliquez un pays pour isoler sa trajectoire de 1992 à 2015.\",\n      s6_note:\"<b>Depuis au moins trente ans, aucun pays n'a assuré les besoins fondamentaux de sa population sans surconsommer les ressources.<\/b> Les nations franchissent leurs « parts justes » des frontières planétaires plus vite qu'elles n'atteignent les seuils sociaux minimaux. Le coin en haut à gauche reste vide : <b>soit le plancher social n'est pas assuré, soit le plafond écologique est dépassé — le plus souvent les deux à la fois.<\/b> <b>Tout l'enjeu du XXI<sup>e<\/sup> siècle est d'assurer le plancher <i>sans<\/i> dépasser le plafond — de faire tenir l'humanité dans l'anneau.<\/b>\",\n      s6_info:\"<b>{c}<\/b><br>Objectifs sociaux : {s0} → {s1} / 11<br>Frontières franchies : {e0} → {e1} / 6<br><span class=\\\"muted\\\">1992 → 2015<\/span>\",\n      s6_pick:\"Cliquez un pays à gauche, ou une bulle, pour lire sa trajectoire.\",\n      lesson:\"<b>Entrer dans l'anneau.<\/b> Le Donut complet le montre d'un coup d'œil : aucun pays n'est encore dans l'espace sûr et juste. Les pays riches franchissent le <b>plafond écologique<\/b> ; les pays pauvres restent sous le <b>plancher social<\/b>. Tout l'enjeu du XXIᵉ siècle est d'assurer le plancher <i>sans<\/i> dépasser le plafond — de faire tenir l'humanité dans l'anneau.\",\n      foot:\"Limites planétaires : Rockström et al. (2009) ; Richardson et al. (2023), <i>Science Advances<\/i> ; actualisation 2025 (Planetary Health Check, Stockholm Resilience Centre). Données pays : Fanning, O'Neill, Hickel &amp; Roux (2022), « The social shortfall and ecological overshoot of nations », <i>Nature Sustainability<\/i> — goodlife.leeds.ac.uk. Seuils par habitant et seuils sociaux (tableau des seuils du « bien-vivre », d'après la Table 2) : O'Neill, Fanning, Lamb &amp; Steinberger (2018), « A good life for all within planetary boundaries », <i>Nature Sustainability<\/i>. Année d'observation la plus récente : 2015.\"\n    },\n    en:{\n      eyebrow:\"The Doughnut · ecological ceiling\",\n      title:\"Staying within the planetary boundaries\",\n      sub:\"Kate Raworth's «&nbsp;<b>Doughnut<\/b>&nbsp;» stacks two edges: a <b>social foundation<\/b> (human needs) and an <b>ecological ceiling<\/b> (the planetary boundaries). We start with the ceiling: the <b>nine planetary boundaries<\/b>, the question of <i>where<\/i> to draw a limit, and an interactive doughnut of ecological overshoot country by country.\",\n      s1t:\"The nine planetary boundaries\",\n      s1d:\"Proposed by Johan Rockström and colleagues (2009), the planetary boundaries define a <b>«&nbsp;safe operating space&nbsp;»<\/b> for humanity: nine processes that regulate the stability of the Earth system. Stay below them and the risk of tipping stays low; beyond, we enter a zone of rising danger.\",\n      s1lead:\"Each boundary measures a <b>human pressure<\/b> on a vital process (climate, water, chemical cycles…). The latest assessment (2023, updated in 2025) finds that <b>7 of the 9<\/b> boundaries are now transgressed.\",\n      s1stat:\"transgressed\",\n      boundaries:[\n        {n:\"Climate change\", st:\"over\", d:\"CO₂ concentration and radiative forcing. Core of the system; transgressed.\",\n          m:\"Atmospheric CO₂ concentration (ppm); radiative forcing (W/m²)\", s:\"350 ppm (+1 W/m²)\", a:\"≈ 423 ppm (+3.0 W/m²)\",\n          j:\"Keep warming near 1–1.5 °C and avoid tipping the ice sheets. The stable Holocene sat at ~280 ppm.\"},\n        {n:\"Biosphere integrity\", st:\"over\", d:\"Loss of biodiversity and ecological function. Heavily transgressed.\",\n          m:\"Extinction rate (E/MSY = extinctions per million species·years; natural background ≈ 1); human appropriation of primary production (HANPP, %)\", s:\"< 10 E/MSY; < 10 % HANPP\", a:\"> 100 E/MSY; ~30 % HANPP\",\n          j:\"Stay near the natural extinction rate (~1 E/MSY) and leave enough energy for ecosystems.\"},\n        {n:\"Land-system change\", st:\"over\", d:\"Conversion of forests and ecosystems (agriculture, urbanisation).\",\n          m:\"Area of forest still intact (% of original cover)\", s:\"75 % (85 % tropical/boreal, 50 % temperate)\", a:\"≈ 59 %\",\n          j:\"Forests regulate the climate: carbon storage, moisture, albedo.\"},\n        {n:\"Freshwater change\", st:\"over\", d:\"Disruption of green (soil) and blue (rivers, aquifers) water cycles.\",\n          m:\"Share of land where green (soil) and blue (rivers, aquifers) water depart from the Holocene regime (%)\", s:\"≈ 11–13 %\", a:\"≈ 22 %\",\n          j:\"Keep the water cycle close to its pre-industrial variability.\"},\n        {n:\"Biogeochemical flows\", st:\"over\", d:\"Nitrogen and phosphorus cycles, boosted by fertilisers. Far transgressed.\",\n          m:\"Industrially fixed nitrogen (Tg N/yr); phosphorus flow (Tg P/yr)\", s:\"62 Tg N/yr; 11 Tg P/yr\", a:\"≈ 165 Tg N/yr; phosphorus saturating soils\",\n          j:\"Avoid water eutrophication and coastal “dead zones”.\"},\n        {n:\"Ocean acidification\", st:\"over\", d:\"Falling ocean pH driven by CO₂. Newly transgressed (2025).\",\n          m:\"Aragonite saturation state of the surface ocean (Ω)\", s:\"Ω ≥ 2.86 (≈ 80 % of pre-industrial)\", a:\"≈ 2.84\",\n          j:\"Aragonite is essential to calcifying organisms (corals, shellfish).\"},\n        {n:\"Novel entities\", st:\"over\", d:\"Synthetic pollutants, plastics, heavy metals. Judged transgressed (2022).\",\n          m:\"No single global metric; synthetic substances released without adequate testing\", s:\"0 (precaution)\", a:\"far above 0\",\n          j:\"Plastics, PFAS, heavy metals…: potentially irreversible planetary-scale effects.\"},\n        {n:\"Atmospheric aerosols\", st:\"safe\", d:\"Airborne particles. Globally within, but exceeded regionally.\",\n          m:\"Interhemispheric difference in aerosol optical depth (AOD)\", s:\"0.10\", a:\"≈ 0.06 (but exceeded over South Asia)\",\n          j:\"Aerosols disrupt monsoons and the regional radiation balance.\"},\n        {n:\"Stratospheric ozone\", st:\"safe\", d:\"Ozone layer. Within and recovering (Montreal Protocol).\",\n          m:\"Stratospheric ozone concentration (Dobson units, DU)\", s:\"≥ 277 DU (−5 % vs pre-industrial)\", a:\"≈ 286 DU\",\n          j:\"Ozone filters UV-B. The Montreal Protocol allowed it to recover.\"}\n      ],\n      st_over:\"transgressed\", st_safe:\"within\",\n      pp_metric:\"Metric\", pp_seuil:\"Boundary\", pp_now:\"Today\", pp_vs:\"Vs boundary\", pp_novs:\"no single global boundary value\",\n      s2t:\"Where to draw the limit?\",\n      s2d:\"A planetary boundary is not a sharp physical wall. For each process, a measurable <b>control variable<\/b> is chosen (e.g. CO₂ concentration), then the boundary is placed <b>upstream<\/b> of the tipping point, on the safe side of a <b>zone of uncertainty<\/b>.\",\n      th_safe:\"Safe space\", th_bnd:\"Boundary\", th_unc:\"Zone of uncertainty\", th_risk:\"High risk\", th_axis:\"control variable (pressure)\", th_tip:\"tipping point\",\n      s2p1:\"The <b>boundary<\/b> is set at the entrance of the zone of uncertainty, as a <b>precaution<\/b>: we don't know exactly where the tipping point lies, so we keep a margin.\",\n      s2p2:\"Some processes have a genuine planetary <b>threshold<\/b> (climate, acidification); others (nitrogen, novel entities) have no sharp global one — there the boundary mainly reflects a level of risk deemed acceptable.\",\n      s2p3:\"To compare <b>countries<\/b>, the global boundary is further divided into a <b>per-capita share<\/b> («&nbsp;fair share&nbsp;»). Setting that share is a normative as much as a scientific choice — it is the reference for the doughnut below.\",\n      s3t:\"The ecological ceiling, country by country\",\n      s3d:\"Each wedge of the doughnut is a boundary; the <b>dashed circle<\/b> marks the sustainable per-capita share. A wedge that <b>crosses<\/b> the circle is in overshoot (red). Pick a country and drag the years to watch ecological pressure change (1992–2015).\",\n      s3bridge:\"These 6 indicators translate the planetary boundaries to the <b>national scale<\/b> (per-capita share). Four map directly onto a boundary from block 1 — <b>climate<\/b> (CO₂), <b>biogeochemical flows<\/b> (nitrogen, phosphorus) and <b>land-system change<\/b>. The two <b>footprints<\/b> (ecological, material) are complementary <b>aggregate indicators<\/b>, not planetary boundaries in the strict sense. The other boundaries — biosphere, freshwater, oceans, aerosols, ozone, novel entities — have no per-capita national equivalent and do not appear here.\",\n      c_country:\"Country\", c_year:\"Year\",\n      lg_in:\"within limit\", lg_over:\"overshoot\", lg_bnd:\"boundary (per-capita)\",\n      tip_bnd:\"Boundary · per-cap.\", tip_s:\"Boundary / cap.\", play:\"Play\", pause:\"Pause\",\n      indf:[\"Climate change\",\"Phosphorus\",\"Nitrogen\",\"Land-system change\",\"Ecological footprint\",\"Material footprint\"],\n      indShort:[\"Climate (CO₂)\",\"Phosphorus\",\"Nitrogen\",\"Land use\",\"Eco. footprint\",\"Material footpr.\"],\n      ro_over:\"{n}/6 boundaries transgressed\", ro_none:\"no boundary transgressed\",\n      dunote:\"Data: Fanning, O'Neill, Hickel &amp; Roux (2022), 6 biophysical indicators normalised to the <b>per-capita share<\/b> of each boundary (1 = the limit). On hover, <b>absolute values<\/b> (physical units) are shown for <b>2015<\/b>; per-capita boundaries from O'Neill et al. (2018). Land-system change has no simple per-capita unit.\",\n      ducap:\"{c} · {y}\",\n      s4t:\"The social foundation, country by country\",\n      s4d:\"The <b>social foundation<\/b> (Kate Raworth) gathers basic human needs: 11 dimensions, each normalised to a <b>«&nbsp;good life&nbsp;» threshold<\/b> (1 = threshold met). Below 1 there is a <b>shortfall<\/b> — the floor is not secured.\",\n      s4pol:\"Which dimensions to keep, and where to set each threshold? This is not a purely technical question: <b>the choice of variables and of threshold levels is a political decision<\/b>, to be deliberated in public debate. The 11 indicators below are those of the Leeds dataset — one choice among others.\",\n      indfS:[\"Life satisfaction\",\"Life expectancy\",\"Nutrition\",\"Sanitation\",\"Income\",\"Access to energy\",\"Education\",\"Social support\",\"Democratic quality\",\"Equality\",\"Employment\"],\n      indShortS:[\"Satisfaction\",\"Life expect.\",\"Nutrition\",\"Sanitation\",\"Income\",\"Energy\",\"Education\",\"Social support\",\"Democracy\",\"Equality\",\"Employment\"],\n      s4tab:\"The 11 social indicators and their thresholds (after O'Neill et al. 2018, Table 2)\",\n      st_ind:\"Social indicator\", st_thr:\"“Good life” threshold\",\n      socThr:[\"6.5 on the 0–10 Cantril ladder\",\"65 years of healthy life expectancy\",\"2,700 kilocalories per person per day\",\"95% of people have improved sanitation\",\"95% of people earn above $1.90 a day\",\"95% of people have electricity access\",\"95% enrolment in secondary school\",\"90% have friends or family to depend on\",\"0.80 (approx. US/UK, governance index)\",\"70 on 0–100 scale (Gini index of 0.30)\",\"94% employed (6% unemployment)\"],\n      slg_met:\"threshold met\", slg_short:\"shortfall\", slg_thr:\"good-life threshold\",\n      ro_short:\"{n}/11 below threshold\", ro_none_s:\"all thresholds met\", soc_short:\"short\", soc_met:\"goals met\",\n      stip_thr:\"Threshold\", s_nd:\"n/a\", of_thr:\"of threshold\",\n      sdunote:\"Data: Fanning et al. (2022), 11 social indicators normalised to the <b>good-life threshold<\/b> (1 = threshold, see table above). Each wedge of the doughnut shows the country value as <b>% of its threshold<\/b>. “n/a”: data not available that year.\",\n      s5t:\"The full Doughnut: the safe and just space\",\n      s5d:\"We stack the two edges. The <b>inner ring<\/b> is the social foundation (11 dimensions): a <b>shortfall<\/b> digs a hole toward the centre. The <b>outer ring<\/b> is the ecological ceiling (6 boundaries): an <b>overshoot<\/b> pushes a spike outward. Between them, the <b>light-green ring<\/b> is the “safe and just space”: the goal is to fit every dimension inside it.\",\n      lgF_short:\"social shortfall (below the floor)\", lgF_over:\"ecological overshoot (beyond the ceiling)\", lgF_safe:\"safe and just space\",\n      roF_soc:\"Social foundation\", roF_eco:\"Ecological ceiling\",\n      roF_socv:\"{n}/11 goals met\", roF_ecov:\"{n}/6 boundaries crossed\",\n      roF_q:\"In the safe and just space?\", roF_no:\"No\", roF_yes:\"Yes\",\n      roF_why:\"No country in the selection makes it: either the social foundation is not secured, or the ecological ceiling is exceeded — most often both at once.\",\n      roF_whyok:\"This country sits within the ring: social foundation secured and no ecological boundary crossed.\",\n      s6t:\"Pathways: no country reaches the safe and just space\",\n      s6d:\"Each country is summed up by <b>two numbers<\/b>: how many of its <b>11 social goals<\/b> are achieved (vertical axis, up = better) and how many of its <b>6 ecological boundaries<\/b> are transgressed (horizontal axis, left = better). The <b>safe and just space<\/b> is the <b>top-left<\/b> corner — all needs secured, no boundary crossed. Each country traces a path from 1992 to 2015.\",\n      s6_xax:\"Ecological boundaries transgressed →\",\n      s6_yax:\"Social goals achieved ↑\",\n      s6_safe:\"safe and just space\",\n      s6_empty:\"no country here\",\n      s6_hi:\"high-income countries\",\n      s6_lo:\"low-income countries\",\n      s6_dev:\"«&nbsp;development&nbsp;»\",\n      s6_hint:\"Click a country to isolate its 1992–2015 path.\",\n      s6_note:\"<b>For at least thirty years, no country has met the basic needs of its residents without overconsuming natural resources.<\/b> Nations overshoot their «&nbsp;fair shares&nbsp;» of the planetary boundaries faster than they achieve minimum social thresholds. The top-left corner stays empty: <b>either the social foundation is not secured, or the ecological ceiling is exceeded — most often both at once.<\/b> <b>The whole challenge of the 21st century is to secure the floor <i>without<\/i> overshooting the ceiling — to fit humanity inside the ring.<\/b>\",\n      s6_info:\"<b>{c}<\/b><br>Social goals: {s0} → {s1} / 11<br>Boundaries crossed: {e0} → {e1} / 6<br><span class=\\\"muted\\\">1992 → 2015<\/span>\",\n      s6_pick:\"Click a country on the left, or a bubble, to read its path.\",\n      lesson:\"<b>Getting into the ring.<\/b> The full Doughnut shows it at a glance: no country is yet in the safe and just space. Wealthy countries cross the <b>ecological ceiling<\/b>; poorer countries stay below the <b>social foundation<\/b>. The whole challenge of the 21st century is to secure the floor <i>without<\/i> overshooting the ceiling — to fit humanity inside the ring.\",\n      foot:\"Planetary boundaries: Rockström et al. (2009); Richardson et al. (2023), <i>Science Advances<\/i>; 2025 update (Planetary Health Check, Stockholm Resilience Centre). Country data: Fanning, O'Neill, Hickel &amp; Roux (2022), “The social shortfall and ecological overshoot of nations”, <i>Nature Sustainability<\/i> — goodlife.leeds.ac.uk. Per-capita and social thresholds (the “good life” thresholds table, after Table 2): O'Neill, Fanning, Lamb &amp; Steinberger (2018), “A good life for all within planetary boundaries”, <i>Nature Sustainability<\/i>. Most recent observation year: 2015.\"\n    }\n  };\n\n  function fmt(x,d){var s=(+x).toFixed(d);return LANG==='fr'?s.replace('.',','):s;}\n\n  // ---------- Section 1 : boundary cards ----------\n  function buildPB(){\n    var d=STR[LANG], box=document.getElementById('pbGrid');box.innerHTML='';\n    d.boundaries.forEach(function(b,i){\n      var el=document.createElement('div');el.className='pb '+b.st;el.setAttribute('tabindex','0');\n      var st=b.st==='over'?d.st_over:d.st_safe;\n      // mini-gauge : facteur de dépassement\n      var g=PBR[i], gauge;\n      if(g && g.r!=null){\n        var col=g.r>1?'var(--warn)':'var(--green)', lbl=(g.lbl||fmt(g.r,g.r<10?1:0))+'×';\n        var w=Math.min(g.r,GMAX)/GMAX*100, bnd=1/GMAX*100;\n        gauge='<div class=\"pbgauge\"><div class=\"pgh\"><span class=\"pgk\">'+d.pp_vs+'<\/span><span class=\"pgv\" style=\"color:'+col+'\">'+lbl+'<\/span><\/div>'+\n          '<div class=\"pgbar\"><i style=\"width:'+w.toFixed(1)+'%;background:'+col+'\"><\/i><span class=\"bnd\" style=\"left:'+bnd.toFixed(1)+'%\"><\/span><\/div><\/div>';\n      } else {\n        gauge='<div class=\"pbgauge\"><div class=\"pgh\"><span class=\"pgk\">'+d.pp_vs+'<\/span><span class=\"pgnovs\">'+d.pp_novs+'<\/span><\/div><\/div>';\n      }\n      var pop='<div class=\"pbpop\">'+\n        '<div class=\"pprow\"><span class=\"ppk\">'+d.pp_metric+'<\/span><span class=\"ppv\">'+b.m+'<\/span><\/div>'+\n        '<div class=\"pprow\"><span class=\"ppk\">'+d.pp_seuil+'<\/span><span class=\"ppv seuil\">'+b.s+'<\/span><\/div>'+\n        '<div class=\"pprow\"><span class=\"ppk\">'+d.pp_now+'<\/span><span class=\"ppv\">'+b.a+'<\/span><\/div>'+\n        gauge+\n        '<div class=\"ppj\">'+b.j+'<\/div><\/div>';\n      el.innerHTML='<div class=\"pbh\"><span class=\"pbn\">'+b.n+' <span class=\"info\">i<\/span><\/span><span class=\"pbs\">'+st+'<\/span><\/div><div class=\"pbd\">'+b.d+'<\/div>'+pop;\n      function place(){var pop=el.querySelector('.pbpop');var ph=pop?pop.offsetHeight:200;var sec=el.closest('.card').getBoundingClientRect(),pr=el.getBoundingClientRect();el.classList.toggle('up',(sec.bottom-pr.bottom)<(ph+20));}\n      el.addEventListener('mouseenter',place); el.addEventListener('focus',place);\n      el.addEventListener('click',function(){place();var was=el.classList.contains('open');document.querySelectorAll('.pb.open').forEach(function(x){x.classList.remove('open');});if(!was)el.classList.add('open');});\n      box.appendChild(el);\n    });\n  }\n  document.addEventListener('click',function(e){if(!e.target.closest('.pb'))document.querySelectorAll('.pb.open').forEach(function(x){x.classList.remove('open');});});\n\n  // ---------- Section 2 : threshold schematic ----------\n  function drawTh(){\n    var d=STR[LANG], svg=document.getElementById('thsvg');\n    while(svg.firstChild)svg.removeChild(svg.firstChild);\n    var W=520,H=250,x0=20,x1=500,yb=150,h=44;\n    var xBnd=x0+(x1-x0)*0.42, xTip=x0+(x1-x0)*0.80;\n    // zones\n    svg.appendChild(mk('rect',{x:x0,y:yb,width:xBnd-x0,height:h,rx:4,fill:'var(--green)','fill-opacity':0.30}));\n    // uncertainty gradient (green->warn) via steps\n    var n=24;\n    for(var i=0;i<n;i++){\n      var xa=xBnd+(xTip-xBnd)*i/n, xb=xBnd+(xTip-xBnd)*(i+1)/n;\n      var t=i/(n-1);\n      svg.appendChild(mk('rect',{x:xa,y:yb,width:(xb-xa)+0.6,height:h,fill:'var(--gold)','fill-opacity':(0.15+0.4*t).toFixed(2)}));\n    }\n    svg.appendChild(mk('rect',{x:xTip,y:yb,width:x1-xTip,height:h,rx:4,fill:'var(--warn)','fill-opacity':0.34}));\n    svg.appendChild(mk('rect',{x:x0,y:yb,width:x1-x0,height:h,rx:5,fill:'none',stroke:'var(--line)'}));\n    // axis arrow\n    svg.appendChild(mk('line',{x1:x0,y1:yb+h+20,x2:x1,y2:yb+h+20,stroke:'var(--faint)','stroke-width':1.2}));\n    svg.appendChild(mk('path',{d:'M '+(x1-8)+' '+(yb+h+16)+' L '+x1+' '+(yb+h+20)+' L '+(x1-8)+' '+(yb+h+24)+' Z',fill:'var(--faint)'}));\n    var ax=mk('text',{x:x0,y:yb+h+38,fill:'var(--faint)','font-size':11,'font-family':'var(--font-m)'});ax.textContent=d.th_axis;svg.appendChild(ax);\n    // boundary marker\n    svg.appendChild(mk('line',{x1:xBnd,y1:yb-16,x2:xBnd,y2:yb+h+6,stroke:'var(--ink)','stroke-width':2}));\n    var bl=mk('text',{x:xBnd,y:yb-22,'text-anchor':'middle',fill:'var(--ink)','font-size':12.5,'font-weight':'600','font-family':'var(--font-b)'});bl.textContent=d.th_bnd;svg.appendChild(bl);\n    // tipping point marker\n    svg.appendChild(mk('line',{x1:xTip,y1:yb-6,x2:xTip,y2:yb+h+6,stroke:'var(--warn)','stroke-width':1.6,'stroke-dasharray':'3 3'}));\n    var tl=mk('text',{x:xTip,y:yb-10,'text-anchor':'middle',fill:'var(--warn)','font-size':11,'font-family':'var(--font-d)','font-style':'italic'});tl.textContent=d.th_tip;svg.appendChild(tl);\n    // zone labels\n    function zlab(x,txt,col){var t=mk('text',{x:x,y:yb+h/2+4,'text-anchor':'middle',fill:col,'font-size':11.5,'font-family':'var(--font-b)','font-weight':'500'});t.textContent=txt;svg.appendChild(t);}\n    zlab((x0+xBnd)/2,d.th_safe,'var(--green)');\n    zlab((xBnd+xTip)/2,d.th_unc,'var(--gold)');\n    zlab((xTip+x1)/2,d.th_risk,'var(--warn)');\n  }\n\n  // ---------- Section 3 : donut ----------\n  var cx=260,cy=250,r0=58,rMax=190,VMAX=11,GAP=5,N=6;\n  var curC=0, curY=23;\n  function rad(v){v=Math.max(0,Math.min(v,VMAX));return r0+(rMax-r0)*Math.sqrt(v/VMAX);}\n  var rB=rad(1);\n  function pt(r,a){var t=a*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)];}\n  function annSec(ri,ro,a0,a1){\n    var p0=pt(ri,a0),p1=pt(ro,a0),p2=pt(ro,a1),p3=pt(ri,a1);\n    return 'M '+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+\n           ' L '+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+\n           ' A '+ro+' '+ro+' 0 0 1 '+p2[0].toFixed(2)+' '+p2[1].toFixed(2)+\n           ' L '+p3[0].toFixed(2)+' '+p3[1].toFixed(2)+\n           ' A '+ri+' '+ri+' 0 0 0 '+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+' Z';\n  }\n  function drawDonut(){\n    var d=STR[LANG], svg=document.getElementById('donut');\n    while(svg.firstChild)svg.removeChild(svg.firstChild);\n    var C=DATA.c[curC], vals=C.v.map(function(s){return s[curY];});\n    // zone backgrounds\n    svg.appendChild(mk('circle',{cx:cx,cy:cy,r:rMax,fill:'var(--warn)','fill-opacity':0.05}));\n    svg.appendChild(mk('circle',{cx:cx,cy:cy,r:rB,fill:'var(--green)','fill-opacity':0.09}));\n    // sector separators (faint)\n    for(var i=0;i<N;i++){var a=-90+i*60;var pe=pt(rMax,a);svg.appendChild(mk('line',{x1:cx,y1:cy,x2:pe[0],y2:pe[1],stroke:'var(--line)','stroke-width':1}));}\n    var over=0;\n    for(i=0;i<N;i++){\n      var v=vals[i], a0=-90+i*60+GAP/2, a1=-90+(i+1)*60-GAP/2;\n      var rv=rad(v), rg=Math.min(rv,rB);\n      svg.appendChild(mk('path',{d:annSec(r0,rg,a0,a1),fill:'var(--green)','fill-opacity':0.92}));\n      if(v>1){over++;svg.appendChild(mk('path',{d:annSec(rB,rv,a0,a1),fill:'var(--warn)','fill-opacity':0.9}));}\n    }\n    // boundary circle\n    svg.appendChild(mk('circle',{cx:cx,cy:cy,r:rB,fill:'none',stroke:'var(--ink)','stroke-width':1.8,'stroke-dasharray':'4 4','stroke-opacity':0.75}));\n    // inner hole\n    svg.appendChild(mk('circle',{cx:cx,cy:cy,r:r0,fill:'var(--surface)',stroke:'var(--line)'}));\n    // labels\n    for(i=0;i<N;i++){\n      var mid=-90+i*60+30, lp=pt(rMax+14,mid), co=Math.cos(mid*Math.PI/180);\n      var anchor=co>0.34?'start':(co<-0.34?'end':'middle');\n      var nm=mk('text',{x:lp[0].toFixed(1),y:lp[1].toFixed(1),'text-anchor':anchor,fill:'var(--ink)','font-size':12,'font-weight':'600'});nm.textContent=d.indShort[i];svg.appendChild(nm);\n      var vv=vals[i], vc=vv>1?'var(--warn)':'var(--green)';\n      var vt=mk('text',{x:lp[0].toFixed(1),y:(lp[1]+14).toFixed(1),'text-anchor':anchor,fill:vc,'font-size':11.5,'font-family':'var(--font-m)','font-weight':'600'});vt.textContent='×'+fmt(vv,vv<10?1:0);svg.appendChild(vt);\n    }\n    // center\n    var cn=mk('text',{x:cx,y:cy-4,'text-anchor':'middle',fill:(over>0?'var(--warn)':'var(--green)'),'font-size':26,'font-weight':'600','font-family':'var(--font-d)'});cn.textContent=over+'/6';svg.appendChild(cn);\n    var cl=mk('text',{x:cx,y:cy+13,'text-anchor':'middle',fill:'var(--muted)','font-size':9.5,'font-family':'var(--font-m)'});cl.textContent=(LANG==='fr'?'franchies':'over');svg.appendChild(cl);\n    // readout\n    document.getElementById('roTitle').textContent=d.ducap.replace('{c}',C[LANG]).replace('{y}',DATA.years[curY]);\n    var rc=document.getElementById('roCount');\n    rc.className='rc '+(over>0?'hi':'lo');\n    rc.textContent=over>0?d.ro_over.replace('{n}',over):d.ro_none;\n    // list: sorted desc\n    var order=vals.map(function(v,idx){return {i:idx,v:v};}).sort(function(a,b){return b.v-a.v;});\n    var list=document.getElementById('roList');list.innerHTML='';\n    order.forEach(function(o){\n      var row=document.createElement('div');row.className='rli';\n      var col=o.v>1?'var(--warn)':'var(--green)';\n      var w=Math.min(o.v,VMAX)/VMAX*100, bnd=1/VMAX*100;\n      row.innerHTML='<span>'+d.indShort[o.i]+'<\/span><b style=\"color:'+col+'\">×'+fmt(o.v,o.v<10?1:0)+'<\/b>'+\n        '<div class=\"bar\"><i style=\"width:'+w.toFixed(1)+'%;background:'+col+'\"><\/i><span class=\"bnd\" style=\"left:'+bnd.toFixed(1)+'%\"><\/span><\/div>';\n      list.appendChild(row);\n    });\n  }\n\n  function buildCountries(){\n    var box=document.getElementById('countries');box.innerHTML='';\n    DATA.c.forEach(function(C,idx){\n      var b=document.createElement('button');b.className='cbtn'+(idx===curC?' on':'');b.textContent=C[LANG];\n      b.addEventListener('click',function(){curC=idx;syncC();drawDonut();});box.appendChild(b);\n    });\n  }\n  function syncC(){document.querySelectorAll('.cbtn').forEach(function(b,idx){b.classList.toggle('on',idx===curC);});}\n\n  var yearEl=document.getElementById('year');\n  var LAST=DATA.years.length-1, timer=null;\n  function setYear(y){curY=Math.max(0,Math.min(y,LAST));yearEl.value=curY;document.getElementById('yv').textContent=DATA.years[curY];document.getElementById('prev').disabled=curY<=0;document.getElementById('next').disabled=curY>=LAST;drawDonut();}\n  function stopPlay(){if(timer){clearInterval(timer);timer=null;}var p=STR[LANG];document.getElementById('playIcon').textContent='▶';document.getElementById('playLbl').textContent=p.play;}\n  function startPlay(){var p=STR[LANG];if(curY>=LAST)setYear(0);document.getElementById('playIcon').textContent='⏸';document.getElementById('playLbl').textContent=p.pause;timer=setInterval(function(){if(curY>=LAST){stopPlay();return;}setYear(curY+1);},650);}\n  yearEl.addEventListener('input',function(){stopPlay();setYear(+yearEl.value);});\n  document.getElementById('play').addEventListener('click',function(){if(timer)stopPlay();else startPlay();});\n  document.getElementById('prev').addEventListener('click',function(){stopPlay();setYear(curY-1);});\n  document.getElementById('next').addEventListener('click',function(){stopPlay();setYear(curY+1);});\n\n  // ---------- wedge tooltip : seuil + valeur observée ----------\n  var dsvg=document.getElementById('donut'), dtip=document.getElementById('duTip'), VB={x:-72,y:0,w:664,h:520};\n  dsvg.addEventListener('mousemove',function(e){\n    var rect=dsvg.getBoundingClientRect();\n    var sx=VB.x+(e.clientX-rect.left)/rect.width*VB.w, sy=VB.y+(e.clientY-rect.top)/rect.height*VB.h;\n    var dx=sx-cx, dy=sy-cy, r=Math.sqrt(dx*dx+dy*dy);\n    if(r<r0*0.45||r>rMax+6){dtip.style.opacity=0;return;}\n    var ang=Math.atan2(dy,dx)*180/Math.PI, t=((ang+90)%360+360)%360, i=Math.floor(t/60);\n    if(i<0||i>5){dtip.style.opacity=0;return;}\n    var d=STR[LANG], C=DATA.c[curC], v=C.v[i][curY], col=v>1?'var(--warn)':'var(--green)', ab=ABS[i], rows;\n    if(curY===LAST && ab){\n      var u=(LANG==='fr'?ab.uf:ab.ue), obs=ab.b*v;\n      rows='<div class=\"dtr\"><span>'+d.tip_s+'<\/span><b>'+fmt(ab.b,1)+' '+u+'<\/b><\/div>'+\n        '<div class=\"dtr\"><span>'+C[LANG]+' · '+DATA.years[curY]+'<\/span><b style=\"color:'+col+'\">'+fmt(obs,obs<10?1:0)+' '+u+' <span class=\"mul\">(×'+fmt(v,v<10?1:0)+')<\/span><\/b><\/div>';\n    } else {\n      rows='<div class=\"dtr\"><span>'+d.tip_bnd+'<\/span><b>'+fmt(1,1)+'<\/b><\/div>'+\n        '<div class=\"dtr\"><span>'+C[LANG]+' · '+DATA.years[curY]+'<\/span><b style=\"color:'+col+'\">×'+fmt(v,v<10?1:0)+'<\/b><\/div>';\n    }\n    dtip.innerHTML='<div class=\"dtn\">'+d.indf[i]+'<\/div>'+rows;\n    var box=dtip.parentNode.getBoundingClientRect();\n    dtip.style.left=(e.clientX-box.left)+'px'; dtip.style.top=(e.clientY-box.top-14)+'px'; dtip.style.opacity=1;\n  });\n  dsvg.addEventListener('mouseleave',function(){dtip.style.opacity=0;});\n\n  // ---------- Section 4 : social floor ----------\n  var NS=SOC.ind.length, VMAXs=1.5, GAPs=3, curCS=0, curYS=LAST;\n  function radS(v){v=Math.max(0,Math.min(v,VMAXs));return r0+(rMax-r0)*(v/VMAXs);}\n  var rBs=radS(1);\n  function drawSocial(){\n    var d=STR[LANG], svg=document.getElementById('social');\n    while(svg.firstChild)svg.removeChild(svg.firstChild);\n    var C=SOC.c[curCS], vals=C.v.map(function(s){return s[curYS];});\n    svg.appendChild(mk('circle',{cx:cx,cy:cy,r:rMax,fill:'var(--green)','fill-opacity':0.05}));\n    svg.appendChild(mk('circle',{cx:cx,cy:cy,r:rBs,fill:'var(--orange)','fill-opacity':0.06}));\n    var step=360/NS, i;\n    for(i=0;i<NS;i++){var a=-90+i*step;var pe=pt(rMax,a);svg.appendChild(mk('line',{x1:cx,y1:cy,x2:pe[0],y2:pe[1],stroke:'var(--line)','stroke-width':1}));}\n    var short=0, met=0;\n    for(i=0;i<NS;i++){\n      var v=vals[i], a0=-90+i*step+GAPs/2, a1=-90+(i+1)*step-GAPs/2;\n      if(v==null){svg.appendChild(mk('path',{d:annSec(r0,rBs,a0,a1),fill:'var(--faint)','fill-opacity':0.16}));continue;}\n      var rv=radS(v);\n      svg.appendChild(mk('path',{d:annSec(r0,rv,a0,a1),fill:'var(--green)','fill-opacity':0.9}));\n      if(v<1){short++;svg.appendChild(mk('path',{d:annSec(rv,rBs,a0,a1),fill:'var(--orange)','fill-opacity':0.85}));}else{met++;}\n    }\n    svg.appendChild(mk('circle',{cx:cx,cy:cy,r:rBs,fill:'none',stroke:'var(--ink)','stroke-width':1.8,'stroke-dasharray':'4 4','stroke-opacity':0.75}));\n    svg.appendChild(mk('circle',{cx:cx,cy:cy,r:r0,fill:'var(--surface)',stroke:'var(--line)'}));\n    for(i=0;i<NS;i++){\n      var mid=-90+i*step+step/2, lp=pt(rMax+13,mid), co=Math.cos(mid*Math.PI/180);\n      var anchor=co>0.34?'start':(co<-0.34?'end':'middle');\n      var nm=mk('text',{x:lp[0].toFixed(1),y:lp[1].toFixed(1),'text-anchor':anchor,fill:'var(--ink)','font-size':10.5,'font-weight':'600'});nm.textContent=d.indShortS[i];svg.appendChild(nm);\n      var vv=vals[i];\n      var vt=mk('text',{x:lp[0].toFixed(1),y:(lp[1]+13).toFixed(1),'text-anchor':anchor,'font-size':10.5,'font-family':'var(--font-m)','font-weight':'600',fill:(vv==null?'var(--faint)':(vv<1?'var(--orange)':'var(--green)'))});\n      vt.textContent=(vv==null?d.s_nd:Math.round(vv*100)+' %');svg.appendChild(vt);\n    }\n    var cn=mk('text',{x:cx,y:cy-4,'text-anchor':'middle',fill:(met<NS?'var(--orange)':'var(--green)'),'font-size':26,'font-weight':'600','font-family':'var(--font-d)'});cn.textContent=met+'/'+NS;svg.appendChild(cn);\n    var cl=mk('text',{x:cx,y:cy+13,'text-anchor':'middle',fill:'var(--muted)','font-size':9.5,'font-family':'var(--font-m)'});cl.textContent=d.soc_met;svg.appendChild(cl);\n    document.getElementById('roTitleS').textContent=d.ducap.replace('{c}',C[LANG]).replace('{y}',SOC.years[curYS]);\n    var rc=document.getElementById('roCountS');rc.className='rc '+(short>0?'hi2':'lo');\n    rc.textContent=short>0?d.ro_short.replace('{n}',short):d.ro_none_s;\n    var order=vals.map(function(v,idx){return {i:idx,v:(v==null?99:v)};}).sort(function(a,b){return a.v-b.v;});\n    var list=document.getElementById('roListS');list.innerHTML='';\n    order.forEach(function(o){\n      var vv=vals[o.i], row=document.createElement('div');row.className='rli';\n      if(vv==null){row.innerHTML='<span>'+d.indShortS[o.i]+'<\/span><b style=\"color:var(--faint)\">'+d.s_nd+'<\/b><div class=\"bar\"><span class=\"bnd\" style=\"left:'+(1/VMAXs*100).toFixed(1)+'%\"><\/span><\/div>';list.appendChild(row);return;}\n      var col=vv<1?'var(--orange)':'var(--green)', w=Math.min(vv,VMAXs)/VMAXs*100, bnd=1/VMAXs*100;\n      row.innerHTML='<span>'+d.indShortS[o.i]+'<\/span><b style=\"color:'+col+'\">'+Math.round(vv*100)+' %<\/b>'+\n        '<div class=\"bar\"><i style=\"width:'+w.toFixed(1)+'%;background:'+col+'\"><\/i><span class=\"bnd\" style=\"left:'+bnd.toFixed(1)+'%\"><\/span><\/div>';\n      list.appendChild(row);\n    });\n  }\n  function buildCountriesS(){\n    var box=document.getElementById('countriesS');box.innerHTML='';\n    SOC.c.forEach(function(C,idx){var b=document.createElement('button');b.className='cbtn'+(idx===curCS?' on':'');b.textContent=C[LANG];b.addEventListener('click',function(){curCS=idx;syncCS();drawSocial();});box.appendChild(b);});\n  }\n  function syncCS(){document.querySelectorAll('#countriesS .cbtn').forEach(function(b,idx){b.classList.toggle('on',idx===curCS);});}\n  var yearElS=document.getElementById('yearS'), timerS=null;\n  function setYearS(y){curYS=Math.max(0,Math.min(y,LAST));yearElS.value=curYS;document.getElementById('yvS').textContent=SOC.years[curYS];document.getElementById('prevS').disabled=curYS<=0;document.getElementById('nextS').disabled=curYS>=LAST;drawSocial();}\n  function stopPlayS(){if(timerS){clearInterval(timerS);timerS=null;}var p=STR[LANG];document.getElementById('playIconS').textContent='▶';document.getElementById('playLblS').textContent=p.play;}\n  function startPlayS(){var p=STR[LANG];if(curYS>=LAST)setYearS(0);document.getElementById('playIconS').textContent='⏸';document.getElementById('playLblS').textContent=p.pause;timerS=setInterval(function(){if(curYS>=LAST){stopPlayS();return;}setYearS(curYS+1);},650);}\n  yearElS.addEventListener(' oke-dasharray':'4 4','stroke-opacity':0.6}));\n    // trou central\n    svg.appendChild(mk('circle',{cx:cxF,cy:cyF,r:rHole,fill:'var(--surface)',stroke:'var(--line)'}));\n    // repères plancher / plafond (haut)\n    var lf=mk('text',{x:cxF,y:cyF-(rFloor+rCeil)/2+4,'text-anchor':'middle',fill:'var(--green)','font-size':10,'font-family':'var(--font-b)','font-weight':600,'fill-opacity':0.85});lf.textContent=d.lgF_safe;svg.appendChild(lf);\n    // centre : verdict compact\n    var inRing=(met===NSF && over===0);\n    var cn=mk('text',{x:cxF,y:cyF+2,'text-anchor':'middle',fill:(inRing?'var(--green)':'var(--muted)'),'font-size':16,'font-weight':600,'font-family':'var(--font-d)'});cn.textContent=(inRing?'✓':'—');svg.appendChild(cn);\n    // lecture\n    document.getElementById('roF').innerHTML=\n      '<div class=\"rh\"><span class=\"rt\">'+CE[LANG]+' · '+DATA.years[curYF]+'<\/span><\/div>'+\n      '<div class=\"rffrow\"><span class=\"dot\" style=\"background:var(--orange)\"><\/span><span>'+d.roF_soc+'<\/span> <b style=\"color:'+(met<NSF?'var(--orange)':'var(--green)')+'\">'+d.roF_socv.replace('{n}',met)+'<\/b><\/div>'+\n      '<div class=\"rffrow\"><span class=\"dot\" style=\"background:var(--warn)\"><\/span><span>'+d.roF_eco+'<\/span> <b style=\"color:'+(over>0?'var(--warn)':'var(--green)')+'\">'+d.roF_ecov.replace('{n}',over)+'<\/b><\/div>'+\n      '<div class=\"rfverdict\"><span class=\"vq\">'+d.roF_q+'<\/span><span class=\"va '+(inRing?'yes':'no')+'\">'+(inRing?d.roF_yes:d.roF_no)+'<\/span><\/div>'+\n      '<p class=\"rfwhy\">'+(inRing?d.roF_whyok:d.roF_why)+'<\/p>';\n  }\n  function buildCountriesF(){\n    var box=document.getElementById('countriesF');box.innerHTML='';\n    DATA.c.forEach(function(C,idx){var b=document.createElement('button');b.className='cbtn'+(idx===curCF?' on':'');b.textContent=C[LANG];b.addEventListener('click',function(){curCF=idx;syncCF();drawFull();});box.appendChild(b);});\n  }\n  function syncCF(){document.querySelectorAll('#countriesF .cbtn').forEach(function(b,idx){b.classList.toggle('on',idx===curCF);});}\n  var yearElF=document.getElementById('yearF'), timerF=null;\n  function setYearF(y){curYF=Math.max(0,Math.min(y,LAST));yearElF.value=curYF;document.getElementById('yvF').textContent=DATA.years[curYF];document.getElementById('prevF').disabled=curYF<=0;document.getElementById('nextF').disabled=curYF>=LAST;drawFull();}\n  function stopPlayF(){if(timerF){clearInterval(timerF);timerF=null;}var p=STR[LANG];document.getElementById('playIconF').textContent='▶';document.getElementById('playLblF').textContent=p.play;}\n  function startPlayF(){var p=STR[LANG];if(curYF>=LAST)setYearF(0);document.getElementById('playIconF').textContent='⏸';document.getElementById('playLblF').textContent=p.pause;timerF=setInterval(function(){if(curYF>=LAST){stopPlayF();return;}setYearF(curYF+1);},650);}\n  yearElF.addEventListener('input',function(){stopPlayF();setYearF(+yearElF.value);});\n  document.getElementById('playF').addEventListener('click',function(){if(timerF)stopPlayF();else startPlayF();});\n  document.getElementById('prevF').addEventListener('click',function(){stopPlayF();setYearF(curYF-1);});\n  document.getElementById('nextF').addEventListener('click',function(){stopPlayF();setYearF(curYF+1);});\n\n  // ---------- Section 6 : trajectoires (pathways) ----------\n  var PM={l:64,r:30,t:34,b:52}, PWD=660, PHT=470;\n  var PPW=PWD-PM.l-PM.r, PPH=PHT-PM.t-PM.b, TMAX=6, AMAX=11;\n  var curHi=-1;\n  function pxX(t){return PM.l+(t/TMAX)*PPW;}\n  function pxY(a){return PM.t+(1-a/AMAX)*PPH;}\n  function pathStats(ci,yi){\n    var eco=0,i,ev=DATA.c[ci].v,sv=SOC.c[ci].v,soc=0;\n    for(i=0;i<6;i++){if(ev[i][yi]>1)eco++;}\n    for(i=0;i<sv.length;i++){var x=sv[i][yi];if(x!=null&&x>=1)soc++;}\n    return {s:soc,e:eco};\n  }\n  function drawPaths(){\n    var d=STR[LANG], svg=document.getElementById('paths');\n    while(svg.firstChild)svg.removeChild(svg.firstChild);\n    var defs=mk('defs',{});\n    var mrk=mk('marker',{id:'devarr',viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});\n    mrk.appendChild(mk('path',{d:'M0 0 L10 5 L0 10 z',fill:'var(--faint)'}));\n    defs.appendChild(mrk);svg.appendChild(defs);\n    var i,ci,yi,NY=DATA.years.length;\n    // gridlines + ticks\n    for(i=0;i<=TMAX;i++){var gx=pxX(i);svg.appendChild(mk('line',{x1:gx,y1:PM.t,x2:gx,y2:PHT-PM.b,stroke:'var(--line)','stroke-width':1,'stroke-opacity':i===0?0.9:0.4}));\n      var tx=mk('text',{x:gx,y:PHT-PM.b+16,'text-anchor':'middle',fill:'var(--faint)','font-size':10.5,'font-family':'var(--font-m)'});tx.textContent=i;svg.appendChild(tx);}\n    for(i=0;i<=AMAX;i++){var gy=pxY(i);svg.appendChild(mk('line',{x1:PM.l,y1:gy,x2:PWD-PM.r,y2:gy,stroke:'var(--line)','stroke-width':1,'stroke-opacity':i===0?0.9:0.4}));\n      var ty=mk('text',{x:PM.l-9,y:gy+3.5,'text-anchor':'end',fill:'var(--faint)','font-size':10.5,'font-family':'var(--font-m)'});ty.textContent=i;svg.appendChild(ty);}\n    // safe & just corner (top-left)\n    var sw=pxX(1)-pxX(0), sh=pxY(10)-pxY(11);\n    svg.appendChild(mk('rect',{x:pxX(0),y:pxY(11),width:sw,height:sh,fill:'var(--green)','fill-opacity':0.16,stroke:'var(--green)','stroke-width':1.4,'stroke-dasharray':'4 3','stroke-opacity':0.7}));\n    var sl1=mk('text',{x:pxX(0)+6,y:pxY(11)+15,fill:'var(--green)','font-size':10.5,'font-weight':600,'font-family':'var(--font-b)'});sl1.textContent=d.s6_safe;svg.appendChild(sl1);\n    var sl2=mk('text',{x:pxX(0)+6,y:pxY(11)+28,fill:'var(--green)','font-size':9.5,'font-family':'var(--font-d)','font-style':'italic','fill-opacity':0.85});sl2.textContent='('+d.s6_empty+')';svg.appendChild(sl2);\n    // development arrow (empirical trend bottom-left -> top-right)\n    svg.appendChild(mk('line',{x1:pxX(0.7),y1:pxY(1.2),x2:pxX(5),y2:pxY(9.4),stroke:'var(--faint)','stroke-width':1.4,'stroke-dasharray':'5 4','marker-end':'url(#devarr)','stroke-opacity':0.8}));\n    var da=mk('text',{x:pxX(3.05),y:pxY(6.1)-6,'text-anchor':'middle',fill:'var(--faint)','font-size':10.5,'font-family':'var(--font-d)','font-style':'italic'});\n    da.setAttribute('transform','rotate(-30 '+pxX(3.05)+' '+(pxY(6.1)-6)+')');da.innerHTML=d.s6_dev;svg.appendChild(da);\n    // region annotations\n    var hi=mk('text',{x:pxX(5.7),y:pxY(10.4),'text-anchor':'end',fill:'var(--muted)','font-size':10,'font-family':'var(--font-m)','fill-opacity':0.75});hi.textContent=d.s6_hi;svg.appendChild(hi);\n    var lo=mk('text',{x:pxX(0.15),y:pxY(0.5),'text-anchor':'start',fill:'var(--muted)','font-size':10,'font-family':'var(--font-m)','fill-opacity':0.75});lo.textContent=d.s6_lo;svg.appendChild(lo);\n    // per-country jitter (dé-superposition)\n    function jit(idx){return (idx-4.5)*0.055;}\n    // trajectories\n    for(ci=0;ci<DATA.c.length;ci++){\n      var jx=jit(ci), jy=jit(ci), pts=[];\n      for(yi=0;yi<NY;yi++){var st=pathStats(ci,yi);pts.push([pxX(st.e+jx),pxY(st.s+jy)]);}\n      var sel=(curHi===ci), dim=(curHi>=0&&!sel);\n      var col=sel?'var(--blue)':'var(--muted)';\n      var dstr='M '+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L ');\n      svg.appendChild(mk('path',{d:dstr,fill:'none',stroke:col,'stroke-width':sel?2.4:1.2,'stroke-opacity':sel?0.95:(dim?0.12:0.5),'stroke-linejoin':'round','stroke-linecap':'round'}));\n      if(sel){\n        // origin (1992) hollow + year dots\n        svg.appendChild(mk('circle',{cx:pts[0][0],cy:pts[0][1],r:4,fill:'var(--surface)',stroke:'var(--blue)','stroke-width':1.6}));\n        for(yi=1;yi<NY-1;yi++){svg.appendChild(mk('circle',{cx:pts[yi][0],cy:pts[yi][1],r:1.7,fill:'var(--blue)','fill-opacity':0.55}));}\n      }\n    }\n    // endpoints (2015) — on top\n    for(ci=0;ci<DATA.c.length;ci++){\n      var jx2=jit(ci), st2=pathStats(ci,NY-1), ex=pxX(st2.e+jx2), ey=pxY(st2.s+jx2);\n      var sel2=(curHi===ci), dim2=(curHi>=0&&!sel2);\n      var g=mk('g',{'class':'cdot','data-ci':ci});\n      g.appendChild(mk('circle',{cx:ex,cy:ey,r:sel2?7:5.2,fill:sel2?'var(--blue)':'var(--ink)','fill-opacity':dim2?0.2:1,stroke:'var(--surface)','stroke-width':1.4}));\n      var rightSide=(st2.e+jx2)<TMAX-1.4;\n      var lx=rightSide?ex+9:ex-9, anch=rightSide?'start':'end';\n      var lbl=mk('text',{x:lx,y:ey+3.5,'text-anchor':anch,fill:sel2?'var(--blue)':'var(--ink)','font-size':11,'font-weight':600,'font-family':'var(--font-m)','fill-opacity':dim2?0.25:1});\n      lbl.textContent=DATA.c[ci].code;g.appendChild(lbl);\n      svg.appendChild(g);\n    }\n    // axis titles\n    var xt=mk('text',{x:PM.l+PPW/2,y:PHT-6,'text-anchor':'middle',fill:'var(--muted)','font-size':12,'font-weight':600,'font-family':'var(--font-b)'});xt.textContent=d.s6_xax;svg.appendChild(xt);\n    var yt=mk('text',{x:16,y:PM.t+PPH/2,'text-anchor':'middle',fill:'var(--muted)','font-size':12,'font-weight':600,'font-family':'var(--font-b)'});yt.setAttribute('transform','rotate(-90 16 '+(PM.t+PPH/2)+')');yt.textContent=d.s6_yax;svg.appendChild(yt);\n    // readout\n    var ro=document.getElementById('pathInfo');\n    if(curHi>=0){var a0=pathStats(curHi,0),a1=pathStats(curHi,NY-1);\n      ro.innerHTML=d.s6_info.replace('{c}',DATA.c[curHi][LANG]).replace('{s0}',a0.s).replace('{s1}',a1.s).replace('{e0}',a0.e).replace('{e1}',a1.e);\n    } else { ro.innerHTML='<span class=\"muted\">'+d.s6_pick+'<\/span>'; }\n  }\n  function buildPathCountries(){\n    var box=document.getElementById('pathCountries');box.innerHTML='';\n    DATA.c.forEach(function(C,idx){var b=document.createElement('button');b.className='cbtn'+(idx===curHi?' on':'');b.textContent=C[LANG];\n      b.addEventListener('click',function(){curHi=(curHi===idx?-1:idx);syncPathC();drawPaths();});box.appendChild(b);});\n  }\n  function syncPathC(){document.querySelectorAll('#pathCountries .cbtn').forEach(function(b,idx){b.classList.toggle('on',idx===curHi);});}\n  document.getElementById('paths').addEventListener('click',function(e){\n    var g=e.target.closest('.cdot');if(!g)return;var ci=+g.getAttribute('data-ci');curHi=(curHi===ci?-1:ci);syncPathC();drawPaths();\n  });\n\n  // ---------- toggles ----------\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme');if(a)return a;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}\n  document.getElementById('theme').addEventListener('click',function(){document.documentElement.setAttribute('data-theme',effTheme()==='dark'?'light':'dark');try{localStorage.setItem('donut_theme',effTheme());}catch(e){}drawTh();drawDonut();});\n  try{var stt=localStorage.getItem('donut_theme');if(stt)document.documentElement.setAttribute('data-theme',stt);}catch(e){}\n  function applyLang(){\n    var d=STR[LANG];document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');if(d[k]!=null)el.innerHTML=d[k];});\n    document.getElementById('langlbl').textContent=LANG.toUpperCase();\n    buildPB(); buildCountries(); drawTh(); drawDonut();\n    document.getElementById('playLbl').textContent=timer?d.pause:d.play;\n    document.getElementById('playIcon').textContent=timer?'⏸':'▶';\n    document.getElementById('prev').disabled=curY<=0; document.getElementById('next').disabled=curY>=LAST;\n    buildSocTable(); buildCountriesS(); drawSocial();\n    document.getElementById('playLblS').textContent=timerS?d.pause:d.play;\n    document.getElementById('playIconS').textContent=timerS?'⏸':'▶';\n    document.getElementById('prevS').disabled=curYS<=0; document.getElementById('nextS').disabled=curYS>=LAST;\n    buildCountriesF(); drawFull();\n    document.getElementById('playLblF').textContent=timerF?d.pause:d.play;\n    document.getElementById('playIconF').textContent=timerF?'⏸':'▶';\n    document.getElementById('prevF').disabled=curYF<=0; document.getElementById('nextF').disabled=curYF>=LAST;\n    buildPathCountries(); drawPaths();\n  }\n  document.getElementById('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr'   var CFG   = JSON.parse(document.getElementById('configsrc').textContent);
  var TOOLS = JSON.parse(document.getElementById('toolsrc').textContent);

  var STEPS   = CFG.outils;          // {fichier, cle, partie, icone, couleur}
  var PARTIES = CFG.parties;         // {numero, couleur}
  var N       = STEPS.length;
  var NP      = PARTIES.length;
  var PREFIXE = CFG.prefixe_stockage || 'fil';

  function tok(nom){ return 'var(--' + (nom || 'ink') + ')'; }

  /* ───────── bibliothèque d'icônes ─────────
     Chaque icône reçoit la couleur d'accent de sa carte. Pour en ajouter une,
     déclarer un cas supplémentaire et le nommer dans la configuration. */
  function emb(nom, couleur){
    var a = tok(couleur);
    var S = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">';
    switch(nom){
      case 'cibles':      return S+'<circle cx="12" cy="12" r="9" stroke="'+a+'"/><circle cx="12" cy="12" r="5.4"/><circle cx="12" cy="12" r="2" fill="var(--econ)" stroke="var(--econ)"/></svg>';
      case 'circuit':     return S+'<circle cx="12" cy="12" r="8"/><path d="M15 9.2A4 4 0 0 0 8.5 11" stroke="'+a+'"/><path d="M9 14.8A4 4 0 0 0 15.5 13" stroke="'+a+'"/><path d="M9.5 11.5h4M9.5 13h4" stroke="'+a+'"/></svg>';
      case 'eclair':      return S+'<circle cx="12" cy="12" r="8"/><path d="M12.5 7l-3.2 5.4H12l-0.6 4.2 3.6-5.6H12z" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'engrenages':  return S+'<circle cx="9" cy="10" r="3.2"/><circle cx="15.4" cy="15" r="2.6"/><path d="M9 4.6v1.6M9 13.8v1.6M3.8 10h1.6M12.6 10h1.6M5.4 6.4l1.1 1.1M11.5 12.5l1.1 1.1M12.6 6.4l-1.1 1.1M5.4 13.6l1.1-1.1" stroke="'+a+'"/></svg>';
      case 'courbes':     return S+'<path d="M3 20C10 20 12 5 21 4" stroke="'+a+'"/><path d="M3 20C9 20 9 9 20 8.5"/></svg>';
      case 'bosse':       return S+'<path d="M3.5 19C8 5 16 5 20.5 19" stroke="'+a+'"/><path d="M3 12.5h18" stroke-dasharray="2 2"/></svg>';
      case 'lecture':     return S+'<path d="M9 7l8 5-8 5z" fill="'+a+'" stroke="'+a+'"/><path d="M4 12h2"/></svg>';
      case 'seuil':       return S+'<path d="M3 20C7 20 8 8 13 8s2 8 8 8" stroke="'+a+'"/><path d="M3 6h18" stroke-dasharray="2 2"/></svg>';
      case 'divergence':  return S+'<path d="M3 18C9 18 12 15 21 14"/><path d="M3 18C9 18 11 7 21 4" stroke="'+a+'"/><path d="M3 21V3" opacity=".45"/></svg>';
      case 'fourche':     return S+'<path d="M3 12h7"/><path d="M10 12l8-5.5" stroke="'+a+'"/><path d="M10 12l8 5.5" stroke="var(--faint)"/><path d="M18 6.5l-3 .4M18 6.5l.5 2.9" stroke="'+a+'"/></svg>';
      case 'leviers':     return S+'<path d="M3 20h18"/><path d="M6 20v-7"/><path d="M12 20V6" stroke="'+a+'"/><path d="M18 20v-10"/><path d="M8.6 8.4l2.2 2.2M10.8 8.4l-2.2 2.2" stroke="var(--faint)"/><path d="M14.6 12l2.2 2.2M16.8 12l-2.2 2.2" stroke="var(--faint)"/></svg>';
      case 'anneau':      return S+'<circle cx="12" cy="12" r="8.6" stroke-dasharray="3.4 2.4"/><circle cx="12" cy="12" r="4.4" stroke="'+a+'"/></svg>';
      case 'aires':       return S+'<path d="M3 20h18"/><path d="M3 17.6c4 0 6-2.4 9-2.4s5.4 1.6 9 1.6" stroke="'+a+'"/><path d="M3 13.6c4 0 6-3.6 9-3.6s5.4 2.6 9 2.6"/><path d="M3 9.4c4 0 6-2.6 9-2.6s5.4 1.8 9 1.8" opacity=".5"/></svg>';
      case 'balance':     return S+'<path d="M12 4v16M5 8h14" stroke="'+a+'"/><path d="M5 8l-2.2 5a2.6 2.6 0 0 0 4.4 0z"/><path d="M19 8l-2.2 5a2.6 2.6 0 0 0 4.4 0z"/></svg>';
      case 'flux':        return S+'<path d="M3 8h13" stroke="'+a+'"/><path d="M16 8l-3-2.6M16 8l-3 2.6" stroke="'+a+'"/><path d="M21 16H8"/><path d="M8 16l3-2.6M8 16l3 2.6"/></svg>';
      case 'horloge':     return S+'<circle cx="12" cy="12" r="8.6"/><path d="M12 7v5.4l3.4 2" stroke="'+a+'"/></svg>';
    }
    return S+'<circle cx="12" cy="12" r="8" stroke="'+a+'"/></svg>';
  }

  /* ───────── état ───────── */
  var LANG = CFG.langue_defaut || 'fr';
  try{ var sl=localStorage.getItem(PREFIXE+'_lang'); if(sl) LANG=sl; }catch(e){}
  var THEME=null;
  try{ var st=localStorage.getItem(PREFIXE+'_theme'); if(st) THEME=st; }catch(e){}
  if(!THEME) THEME = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', THEME);

  function T(){ return CFG.textes[LANG]; }

  function seed(){
    for(var i=0;i<N;i++){
      try{
        localStorage.setItem(STEPS[i].cle+'_theme', THEME);
        localStorage.setItem(STEPS[i].cle+'_lang',  LANG);
      }catch(e){}
    }
    try{ localStorage.setItem(PREFIXE+'_theme',THEME); localStorage.setItem(PREFIXE+'_lang',LANG); }catch(e){}
  }

  /* ───────── le fil ───────── */
  function carte(i){
    var d=T(), s=STEPS[i];
    var a=document.createElement('a');
    a.className='card'; a.href='#/'+(i+1);
    a.innerHTML='<span class="emb" style="color:'+tok(s.couleur)+'">'+emb(s.icone,s.couleur)+'</span>'+
      '<span class="cbody"><span class="idx">'+(i+1)+'</span>'+
      '<h3>'+d.cartes[i].titre+'</h3><p>'+d.cartes[i].resume+'</p>'+
      '<span class="go">'+d.nav_ouvrir+' →</span></span>';
    return a;
  }

  function buildFil(){
    var d=T(), box=document.getElementById('parties');
    box.innerHTML='';
    for(var p=1;p<=NP;p++){
      var sec=document.createElement('section');
      sec.className='part';
      sec.style.setProperty('--pc', tok(PARTIES[p-1].couleur));
      var h='<div class="parthead"><span class="rn">'+PARTIES[p-1].numero+'</span>'+
            '<h2>'+d.parties[p-1].titre+'</h2></div>'+
            '<p class="partlead">'+d.parties[p-1].chapo+'</p>'+
            '<div class="cards"></div>';
      sec.innerHTML=h;
      var grille=sec.querySelector('.cards');
      for(var i=0;i<N;i++) if(STEPS[i].partie===p) grille.appendChild(carte(i));
      box.appendChild(sec);
    }
  }

  /* ───────── bandeau de situation ───────── */
  function premierDe(p){ for(var j=0;j<N;j++) if(STEPS[j].partie===p) return j; return 0; }

  function buildNav(i){
    var d=T(), s=STEPS[i], cur=null,
        bar=document.getElementById('nparts'), box=document.getElementById('steps');
    document.documentElement.style.setProperty('--acc', tok(PARTIES[s.partie-1].couleur));
    document.getElementById('ncount').textContent=(i+1)+' / '+N;

    bar.innerHTML='';
    for(var p=1;p<=NP;p++){
      if(p===s.partie){
        var c=document.createElement('span');
        c.className='pcur';
        c.innerHTML='<em>'+PARTIES[p-1].numero+'</em><span>'+d.parties[p-1].titre+'</span>';
        c.setAttribute('aria-current','true');
        bar.appendChild(c);
      } else {
        var g=document.createElement('a');
        g.className='pgrp';
        g.href='#/'+(premierDe(p)+1);
        g.title=PARTIES[p-1].numero+' · '+d.parties[p-1].titre;
        g.textContent=PARTIES[p-1].numero;
        bar.appendChild(g);
      }
    }

    box.innerHTML='';
    for(var j=0;j<N;j++){
      if(STEPS[j].partie!==s.partie) continue;
      var a=document.createElement('a');
      a.className='stp'+(j===i?' on':'');
      a.href='#/'+(j+1);
      a.title=d.cartes[j].titre;
      a.innerHTML='<em>'+(j+1)+'</em><span>'+d.cartes[j].titre+'</span>';
      if(j===i){ a.setAttribute('aria-current','true'); cur=a; }
      box.appendChild(a);
    }
    /* le bandeau peut être encore masqué : on attend une frame pour mesurer */
    if(cur) requestAnimationFrame(function(){
      box.scrollLeft = Math.max(0, cur.offsetLeft - (box.clientWidth - cur.offsetWidth)/2);
    });
  }

  /* ───────── iframes ───────── */
  var host=document.getElementById('host'), frames={}, current=-1;

  /* Une iframe capte le clavier dès qu'on a cliqué dedans, et la coquille ne
     voit plus rien. On y relaie donc Échap et F — et seulement eux : les
     flèches appartiennent aux outils, qui s'en servent pour leurs propres
     étapes. Les iframes srcdoc héritent de notre origine, d'où l'accès. */
  function brancherClavier(fr){
    try{
      var doc=fr.contentDocument; if(!doc) return;
      doc.addEventListener('keydown', function(ev){
        if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
        if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
        else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
      });
    }catch(e){}
  }

  function syncFrame(fr){
    if(!fr) return;
    try{
      var doc=fr.contentDocument;
      if(!doc || !doc.documentElement) return;
      for(var n=0;n<2;n++){
        if(doc.documentElement.getAttribute('data-theme')===THEME) break;
        var tb=doc.getElementById('theme'); if(!tb) break; tb.click();
      }
      for(var m=0;m<2;m++){
        if((doc.documentElement.lang||'fr')===LANG) break;
        var lb=doc.getElementById('lang'); if(!lb) break; lb.click();
      }
    }catch(e){}
  }

  function showTool(i){
    var s=STEPS[i], d=T();
    document.body.classList.add('mode-tool');
    seed();
    if(!frames[s.fichier]){
      var fr=document.createElement('iframe');
      fr.setAttribute('title', d.cartes[i].titre);
      host.appendChild(fr);
      frames[s.fichier]=fr;
      fr.addEventListener('load', function(){ syncFrame(fr); brancherClavier(fr); });
      fr.srcdoc = TOOLS[s.fichier];
    } else {
      syncFrame(frames[s.fichier]);
    }
    for(var k in frames) frames[k].style.display = (k===s.fichier) ? 'block' : 'none';
    if(plein) montrerNav(1600);
    current=i;
    buildNav(i);
    var pb=document.getElementById('prev'), nb=document.getElementById('next');
    pb.disabled=(i===0); nb.disabled=(i===N-1);
    pb.title=d.nav_prec; nb.title=d.nav_suiv;
  }

  function showFil(){
    if(plein) setPlein(false);
    document.body.classList.remove('mode-tool');
    current=-1;
    window.scrollTo(0, window.__filScroll||0);
  }

  /* ───────── plein écran ───────── */
  var plein=false, minuterieNav=null, minuterieAstuce=null;

  function montrerNav(delaiMasquage){
    document.body.classList.add('nav-on');
    clearTimeout(minuterieNav);
    if(delaiMasquage) minuterieNav=setTimeout(function(){
      document.body.classList.remove('nav-on');
    }, delaiMasquage);
  }

  function demanderPleinEcran(){
    var el=document.documentElement;
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(f){ try{ var p=f.call(el); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }
  function quitterPleinEcran(){
    var actif=document.fullscreenElement||document.webkitFullscreenElement;
    if(!actif) return;
    var f=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(f){ try{ var p=f.call(document); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }

  function setPlein(v){
    if(plein===v) return;
    plein=v;
    document.body.classList.toggle('mode-plein', v);
    var b=document.getElementById('tplein'), d=T();
    b.textContent = v ? '⤡' : '⤢';
    b.title = v ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    if(v){
      demanderPleinEcran();
      montrerNav(2400);
      document.getElementById('pastille').textContent =
        (d.nav_plein_astuce||'Approchez du haut pour revoir la barre · Échap pour sortir');
      document.body.classList.add('astuce');
      clearTimeout(minuterieAstuce);
      /* l'astuce doit rester lisible après le retrait du bandeau, pas pendant */
      minuterieAstuce=setTimeout(function(){ document.body.classList.remove('astuce'); }, 6500);
    } else {
      quitterPleinEcran();
      clearTimeout(minuterieNav); clearTimeout(minuterieAstuce);
      document.body.classList.remove('nav-on','astuce');
    }
  }

  document.getElementById('tplein').addEventListener('click', function(){ setPlein(!plein); });
  document.getElementById('hotzone').addEventListener('mouseenter', function(){ montrerNav(0); });
  document.querySelector('.nav').addEventListener('mouseleave', function(){ if(plein) montrerNav(500); });
  /* Sortie par F11 ou par la touche Échap interceptée par le navigateur :
     on resynchronise la coquille sur l'état réel. */
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement||document.webkitFullscreenElement) && plein) setPlein(false);
    });
  });

  function route(){
    var h=(location.hash||'').replace(/^#\/?/,'');
    var n=parseInt(h,10);
    if(h && !isNaN(n) && n>=1 && n<=N){
      if(current===-1) window.__filScroll = window.pageYOffset||0;
      showTool(n-1);
    } else {
      showFil();
    }
  }
  window.addEventListener('hashchange', route);

  function go(i){
    if(i<0){ location.hash='#/fil'; return; }
    if(i>N-1) return;
    location.hash='#/'+(i+1);
  }
  document.getElementById('prev').addEventListener('click', function(){ if(current>0) go(current-1); });
  document.getElementById('next').addEventListener('click', function(){ if(current>-1 && current<N-1) go(current+1); });

  document.addEventListener('keydown', function(ev){
    if(current===-1) return;
    if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
    else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
    else if(ev.key==='ArrowLeft'  && current>0)   { go(current-1); }
    else if(ev.key==='ArrowRight' && current<N-1) { go(current+1); }
  });

  /* ───────── bascules ───────── */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', THEME);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleTheme(){ THEME=(THEME==='dark')?'light':'dark'; applyTheme(); }
  document.getElementById('theme').addEventListener('click', toggleTheme);
  document.getElementById('ttheme').addEventListener('click', toggleTheme);

  function applyLang(){
    var d=T();
    document.documentElement.lang=LANG;
    document.title = d.titre_onglet;
    document.getElementById('eyebrow').innerHTML = d.surtitre;
    document.getElementById('titre').textContent = d.titre;
    document.getElementById('seance').textContent = d.seance;
    document.getElementById('chapo').innerHTML = d.chapo;
    document.getElementById('pied').innerHTML = d.pied;
    document.getElementById('licence').innerHTML = d.licence;
    document.getElementById('homelbl').textContent = d.nav_fil;
    var bp=document.getElementById('tplein');
    bp.title = plein ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    document.getElementById('langlbl').textContent = LANG.toUpperCase();
    document.getElementById('tlanglbl').textContent = LANG.toUpperCase();
    buildFil();
    if(current>-1) buildNav(current);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleLang(){
    var codes=Object.keys(CFG.textes);
    LANG = codes[(codes.indexOf(LANG)+1) % codes.length];
    applyLang();
  }
  document.getElementById('lang').addEventListener('click', toggleLang);
  document.getElementById('tlang').addEventListener('click', toggleLang);

  /* ───────── démarrage ───────── */
  seed();
  applyLang();
  route();
})();
</script>

</body>
</html>
