\n  <div class=\"toprow\">\n    <div class=\"intro\">\n      <div class=\"introtop\">\n        <p class=\"eyebrow\" data-t=\"eyebrow\">Rendement énergétique · EROI<\/p>\n        <div class=\"toggles\">\n          <button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button>\n          <button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button>\n        <\/div>\n      <\/div>\n      <h1 data-t=\"title\">Combien d'énergie reste-t-il vraiment à la société ?<\/h1>\n      <p class=\"sub\" data-t=\"sub\"><\/p>\n    <\/div>\n    <div class=\"card formula\">\n      <div class=\"ftitle\" data-t=\"f_t\">Relation fondamentale<\/div>\n      <div class=\"feq\" data-t=\"f_eq\">EROI = énergie brute / énergie investie<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Section 1 -->\n  <div class=\"card sec\">\n    <div class=\"sechead\">\n      <div class=\"lft\"><span class=\"snum\">1<\/span><h2 data-t=\"s1t\">Manipule l'EROI<\/h2><\/div>\n      <div class=\"bigval\"><span class=\"bl\" data-t=\"s1sel\">EROI sélectionné<\/span><b id=\"eroiBig\">10,0:1<\/b><\/div>\n    <\/div>\n    <p class=\"secdesc\" data-t=\"s1d\">Observe la différence entre énergie brute et énergie nette.<\/p>\n    <div class=\"field\">\n      <label><span class=\"nm\">EROI<\/span><\/label>\n      <input type=\"range\" id=\"eroi1\" min=\"1.2\" max=\"40\" step=\"0.1\" value=\"10\">\n    <\/div>\n    <div class=\"ends\"><span data-t=\"s1min\">1,2 — presque tout est réabsorbé<\/span><span data-t=\"s1max\">40 — surplus très élevé<\/span><\/div>\n    <div class=\"barleg\">\n      <span class=\"lg\"><span class=\"sw gold\"><\/span><span data-t=\"s1reinv\">énergie réinvestie<\/span> <b id=\"reinvPct\"><\/b><\/span>\n      <span class=\"lg\"><span class=\"sw green\"><\/span><span data-t=\"s1net\">énergie nette<\/span> <b id=\"netPct\"><\/b><\/span>\n    <\/div>\n    <div class=\"stack\"><div class=\"seg gold\" id=\"segReinv\"><\/div><div class=\"seg green\" id=\"segNet\"><\/div><\/div>\n    <div class=\"tiles3\">\n      <div class=\"t\"><div class=\"tl\" data-t=\"t1l\">Pour livrer 1 unité nette<\/div><div class=\"tv\" id=\"t1v\"><\/div><div class=\"ts\" data-t=\"t1s\">unités brutes à produire<\/div><\/div>\n      <div class=\"t\"><div class=\"tl\" data-t=\"t2l\">Autoconsommation énergétique<\/div><div class=\"tv\" id=\"t2v\"><\/div><div class=\"ts\" data-t=\"t2s\">unité réinvestie par unité nette<\/div><\/div>\n      <div class=\"t\"><div class=\"tl\" data-t=\"t3l\">Surplus net<\/div><div class=\"tv\" id=\"t3v\"><\/div><div class=\"ts\" data-t=\"t3s\">l'investissement énergétique<\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Section 2 : cliff -->\n  <div class=\"card sec\">\n    <div class=\"sechead\"><div class=\"lft\"><span class=\"snum\">2<\/span><h2 data-t=\"s2t\">La falaise de l'énergie nette<\/h2><\/div><\/div>\n    <p class=\"secdesc\" data-t=\"s2d\"><\/p>\n    <svg id=\"cliff\" viewBox=\"0 0 880 290\" role=\"img\" aria-label=\"Part d'énergie nette selon l'EROI : elle s'effondre quand l'EROI approche de 1\"><\/svg>\n    <h3 class=\"subh\" data-t=\"s2bt\">L'EROI des sources d'énergie aujourd'hui<\/h3>\n    <p class=\"secdesc\" data-t=\"s2bd\"><\/p>\n    <svg id=\"sources\" viewBox=\"0 0 880 340\" role=\"img\" aria-label=\"EROI moyen par source d'énergie (Hall, Lambert & Balogh 2014)\"><\/svg>\n    <p class=\"srccite\" data-t=\"s2cite\"><\/p>\n  <\/div>\n\n  <!-- Section 3 : simulator -->\n  <div class=\"card sec\">\n    <div class=\"sechead\"><div class=\"lft\"><span class=\"snum o\">3<\/span><h2 data-t=\"s3t\">Simulateur de découplage absolu<\/h2><\/div>\n      <button class=\"reset\" id=\"reset\" data-t=\"s3reset\">Réinitialiser<\/button><\/div>\n    <p class=\"secdesc\" data-t=\"s3d\"><\/p>\n    <div class=\"presets\" id=\"presets\"><\/div>\n    <div class=\"fgrid\">\n      <div class=\"field wide\"><label><span class=\"nm\" data-t=\"p_g\">Croissance annuelle du PIB<\/span><span class=\"vv\" id=\"vG\"><\/span><\/label><input type=\"range\" id=\"g\" min=\"0\" max=\"6\" step=\"0.1\" value=\"2\"><\/div>\n      <div class=\"field wide\"><label><span class=\"nm\" data-t=\"p_i\">Baisse annuelle de l'intensité énergétique nette<\/span><span class=\"vv\" id=\"vI\"><\/span><\/label><input type=\"range\" id=\"i\" min=\"0\" max=\"6\" step=\"0.1\" value=\"2\">\n        <p class=\"fnote\" data-t=\"p_inote\">Ex. efficacité, structure économique, sobriété : moins d'énergie nette par unité de PIB.<\/p><\/div>\n      <div class=\"field\"><label><span class=\"nm\" data-t=\"p_e0\">EROI initial<\/span><span class=\"vv\" id=\"vE0\"><\/span><\/label><input type=\"range\" id=\"e0\" min=\"2\" max=\"40\" step=\"0.5\" value=\"15\"><\/div>\n      <div class=\"field\"><label><span class=\"nm\" data-t=\"p_e1\">EROI final<\/span><span class=\"vv\" id=\"vE1\"><\/span><\/label><input type=\"range\" id=\"e1\" min=\"2\" max=\"40\" step=\"0.5\" value=\"15\"><\/div>\n    <\/div>\n\n    <div class=\"result\">\n      <div class=\"rh\">\n        <div><div class=\"rlbl\" data-t=\"r_lbl\">Résultat en fin de période · base 100 aujourd'hui<\/div><h3 data-t=\"r_title\">Découplage absolu énergétique<\/h3><\/div>\n        <span class=\"badge\" id=\"marginBadge\"><\/span>\n      <\/div>\n      <div class=\"rbars\">\n        <div class=\"rbar\"><div class=\"rbh\"><span data-t=\"r_pib\">PIB<\/span><b id=\"vPib\"><\/b><\/div><div class=\"track\"><div class=\"fill f-pib\" id=\"fPib\"><\/div><div class=\"hundred\" id=\"h1\"><\/div><\/div><\/div>\n        <div class=\"rbar\"><div class=\"rbh\"><span data-t=\"r_net\">Besoin d'énergie nette<\/span><b id=\"vNet\"><\/b><\/div><div class=\"track\"><div class=\"fill f-net\" id=\"fNet\"><\/div><div class=\"hundred\" id=\"h2\"><\/div><\/div><\/div>\n        <div class=\"rbar\"><div class=\"rbh\"><span data-t=\"r_gross\">Énergie brute à mobiliser<\/span><b id=\"vGross\"><\/b><\/div><div class=\"track\"><div class=\"fill f-gross\" id=\"fGross\"><\/div><div class=\"hundred\" id=\"h3\"><\/div><\/div><\/div>\n      <\/div>\n      <p class=\"rnote\" data-t=\"r_note\">Une valeur sous 100 signifie une baisse absolue par rapport à aujourd'hui. C'est un exercice de mécanique énergétique, pas une prévision.<\/p>\n    <\/div>\n\n    <div class=\"cond\">\n      <div class=\"clbl\" data-t=\"c_lbl\">Condition de réussite<\/div>\n      <p data-t=\"c_p1\"><\/p>\n      <div class=\"big\" id=\"reqRate\"><\/div>\n      <div class=\"sub2\" data-t=\"c_sub\">par an dans ce scénario.<\/div>\n      <div class=\"eroinote\" id=\"eroiNote\"><\/div>\n    <\/div>\n\n    <p class=\"lesson\" data-t=\"lesson\"><\/p>\n  <\/div>\n\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  var SVGNS=\"http://www.w3.org/2000/svg\";\n  function mk(t,a){var e=document.createElementNS(SVGNS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}\n  var LANG='fr'; try{var s=localStorage.getItem('eroi_lang');if(s)LANG=s;}catch(e){}\n\n  var STR={\n    fr:{\n      eyebrow:\"Rendement énergétique · EROI\",\n      title:\"Combien d'énergie reste-t-il vraiment à la société ?\",\n      sub:\"L'EROI (<i>energy return on investment<\/i>) mesure le rapport entre l'énergie obtenue et l'énergie qu'il faut réinvestir pour l'obtenir. Plus il baisse, plus le secteur énergétique doit consommer sa propre production — et moins il reste d'énergie <b>nette<\/b> pour le reste de la société.\",\n      f_t:\"Relation fondamentale\", f_eq:\"EROI = énergie brute / énergie investie\",\n      s1t:\"Manipule l'EROI\", s1sel:\"EROI sélectionné\",\n      s1d:\"Fais glisser l'EROI et observe la répartition de l'énergie brute produite entre la part <b>réinvestie<\/b> par le système énergétique et la part <b>nette<\/b> laissée à la société.\",\n      s1min:\"1,2 — presque tout est réabsorbé\", s1max:\"40 — surplus très élevé\",\n      s1reinv:\"énergie réinvestie\", s1net:\"énergie nette\",\n      t1l:\"Pour livrer 1 unité nette\", t1s:\"unités brutes à produire\",\n      t2l:\"Autoconsommation énergétique\", t2s:\"unité réinvestie par unité nette\",\n      t3l:\"Surplus net\", t3s:\"l'investissement énergétique\",\n      s2t:\"La falaise de l'énergie nette\",\n      s2d:\"La part nette (1 − 1/EROI) reste proche de 100 % tant que l'EROI est élevé. Mais sous un EROI d'environ <b>7<\/b>, elle <b>s'effondre<\/b> : chaque baisse coûte alors très cher en énergie nette.\",\n      s2bt:\"L'EROI des sources d'énergie aujourd'hui\",\n      s2bd:\"EROI moyen par source (au point d'usage). Les sources en <b>zone critique<\/b> (sous ~7) laissent peu d'énergie nette ; le seuil minimal estimé pour une société complexe se situe vers <b>10–14<\/b>.\",\n      s2cite:\"Source : Hall, Lambert &amp; Balogh (2014), « EROI of different fuels and the implications for society », <i>Energy Policy<\/i> 64, 141–152 — valeurs moyennes. L'EROI du photovoltaïque progresse dans les études plus récentes.\",\n      srcData:[[\"Hydroélectricité\",84],[\"Charbon\",46],[\"Pétrole & gaz (mondial)\",20],[\"Éolien\",18],[\"Nucléaire\",14],[\"Solaire photovoltaïque\",10],[\"Éthanol (biomasse)\",5],[\"Sables bitumineux\",4],[\"Biodiesel\",2]],\n      cliffCritical:\"zone critique\", cliffAxX:\"EROI\", cliffAxY:\"part d'énergie nette\",\n      s3t:\"Simulateur de découplage absolu\", s3reset:\"Réinitialiser\",\n      s3d:\"On teste si le PIB peut augmenter pendant que l'<b>énergie brute mobilisée diminue<\/b>. L'intensité énergétique agit sur le besoin net ; l'EROI détermine ensuite le <b>surcroît d'énergie brute<\/b> nécessaire pour fournir ce besoin net.\",\n      presets:[[\"stable\",\"EROI stable\"],[\"down\",\"EROI en baisse\"]],\n      p_hor:\"Horizon\", p_g:\"Croissance annuelle du PIB\", p_i:\"Baisse annuelle de l'intensité énergétique nette\",\n      p_inote:\"Ex. efficacité, structure économique, sobriété : moins d'énergie nette par unité de PIB.\",\n      p_e0:\"EROI initial\", p_e1:\"EROI final\",\n      r_lbl:\"Résultat après 20 ans · base 100 aujourd'hui\", r_title:\"Découplage absolu énergétique\",\n      r_pib:\"PIB\", r_net:\"Besoin d'énergie nette\", r_gross:\"Énergie brute à mobiliser\",\n      r_note:\"Une valeur sous 100 signifie une baisse absolue par rapport à aujourd'hui. La comparaison est un exercice de mécanique énergétique, pas une prévision.\",\n      c_lbl:\"Condition de réussite\",\n      c_p1:\"Pour que l'énergie brute diminue malgré la croissance, l'intensité énergétique nette doit baisser d'au moins\",\n      c_sub:\"par an dans ce scénario.\",\n      margeOk:\"marge {m} pt/an\", margeNo:\"manque {m} pt/an\",\n      eroiDown:\"L'EROI baisse de <b>{a}<\/b> à <b>{b}<\/b>. La part de la production brute réabsorbée par le système énergétique passe d'environ <b>{pa} %<\/b> à <b>{pb} %<\/b>.\",\n      eroiUp:\"L'EROI monte de <b>{a}<\/b> à <b>{b}<\/b>. La part réabsorbée par le système énergétique passe d'environ <b>{pa} %<\/b> à <b>{pb} %<\/b> — un vent favorable.\",\n      eroiFlat:\"L'EROI reste à <b>{a}<\/b>. La part réabsorbée par le système énergétique est d'environ <b>{pa} %<\/b>, constante.\",\n      lesson:\"<b>Le piège de l'EROI.<\/b> Un EROI qui baisse <b>relève le seuil d'efficacité<\/b> déjà exigé par le découplage : à besoin net constant, il faut produire <b>plus d'énergie brute<\/b> — donc plus de matières et d'impacts. Le système énergétique réabsorbe une part croissante de sa propre production.\",\n    },\n    en:{\n      eyebrow:\"Energy return · EROI\",\n      title:\"How much energy is really left to society?\",\n      sub:\"EROI (<i>energy return on investment<\/i>) is the ratio of the energy obtained to the energy you must reinvest to obtain it. The lower it is, the more the energy sector must consume its own output — and the less <b>net<\/b> energy is left for the rest of society.\",\n      f_t:\"The core relation\", f_eq:\"EROI = gross energy / energy invested\",\n      s1t:\"Play with EROI\", s1sel:\"selected EROI\",\n      s1d:\"Drag EROI and watch the gross energy produced split between the share <b>reinvested<\/b> by the energy system and the <b>net<\/b> share left to society.\",\n      s1min:\"1.2 — almost all reabsorbed\", s1max:\"40 — very high surplus\",\n      s1reinv:\"reinvested energy\", s1net:\"net energy\",\n      t1l:\"To deliver 1 net unit\", t1s:\"gross units to produce\",\n      t2l:\"Energy self-consumption\", t2s:\"unit reinvested per net unit\",\n      t3l:\"Net surplus\", t3s:\"the energy investment\",\n      s2t:\"The net-energy cliff\",\n      s2d:\"The net share (1 − 1/EROI) stays near 100 % while EROI is high. But below an EROI of about <b>7<\/b>, it <b>collapses<\/b>: each further drop then costs dearly in net energy.\",\n      s2bt:\"The EROI of energy sources today\",\n      s2bd:\"Mean EROI by source (at point of use). Sources in the <b>critical zone<\/b> (below ~7) leave little net energy; the estimated minimum for a complex society is around <b>10–14<\/b>.\",\n      s2cite:\"Source: Hall, Lambert &amp; Balogh (2014), “EROI of different fuels and the implications for society”, <i>Energy Policy<\/i> 64, 141–152 — mean values. Solar PV's EROI is rising in more recent studies.\",\n      srcData:[[\"Hydropower\",84],[\"Coal\",46],[\"Oil & gas (global)\",20],[\"Wind\",18],[\"Nuclear\",14],[\"Solar photovoltaics\",10],[\"Ethanol (biomass)\",5],[\"Oil sands\",4],[\"Biodiesel\",2]],\n      cliffCritical:\"critical zone\", cliffAxX:\"EROI\", cliffAxY:\"net energy share\",\n      s3t:\"Absolute-decoupling simulator\", s3reset:\"Reset\",\n      s3d:\"We test whether GDP can grow while <b>gross energy mobilised falls<\/b>. Energy intensity sets the net need; EROI then sets the <b>extra gross energy<\/b> required to supply that net need.\",\n      presets:[[\"stable\",\"EROI stable\"],[\"down\",\"EROI falling\"]],\n      p_hor:\"Horizon\", p_g:\"Annual GDP growth\", p_i:\"Annual decline in net energy intensity\",\n      p_inote:\"E.g. efficiency, economic structure, sufficiency: less net energy per unit of GDP.\",\n      p_e0:\"Initial EROI\", p_e1:\"Final EROI\",\n      r_lbl:\"After 20 years · base 100 today\", r_title:\"Absolute energy decoupling\",\n      r_pib:\"GDP\", r_net:\"Net energy need\", r_gross:\"Gross energy to mobilise\",\n      r_note:\"A value below 100 means an absolute fall versus today. The comparison is an exercise in energy mechanics, not a forecast.\",\n      c_lbl:\"Condition for success\",\n      c_p1:\"For gross energy to fall despite growth, net energy intensity must decline by at least\",\n      c_sub:\"per year in this scenario.\",\n      margeOk:\"margin {m} pt/yr\", margeNo:\"short by {m} pt/yr\",\n      eroiDown:\"EROI falls from <b>{a}<\/b> to <b>{b}<\/b>. The share of gross output reabsorbed by the energy system rises from about <b>{pa} %<\/b> to <b>{pb} %<\/b>.\",\n      eroiUp:\"EROI rises from <b>{a}<\/b> to <b>{b}<\/b>. The reabsorbed share falls from about <b>{pa} %<\/b> to <b>{pb} %<\/b> — a tailwind.\",\n      eroiFlat:\"EROI stays at <b>{a}<\/b>. The reabsorbed share is about <b>{pa} %<\/b>, constant.\",\n      lesson:\"<b>The EROI trap.<\/b> A falling EROI <b>raises the efficiency threshold<\/b> that decoupling already demands: at constant net need, you must produce <b>more gross energy<\/b> — hence more materials and impacts. The energy system reabsorbs a growing share of its own output.\",\n    }\n  };\n\n  function fmt(x,d){var s=(+x).toFixed(d);return LANG==='fr'?s.replace('.',','):s;}\n\n  // ---------- Section 1 ----------\n  var eroi1=document.getElementById('eroi1');\n  function update1(){\n    var E=parseFloat(eroi1.value);\n    var reinv=1/E, net=1-1/E;\n    document.getElementById('eroiBig').textContent=fmt(E,1)+':1';\n    document.getElementById('reinvPct').textContent=fmt(reinv*100,1)+' %';\n    document.getElementById('netPct').textContent=fmt(net*100,1)+' %';\n    document.getElementById('segReinv').style.width=(reinv*100)+'%';\n    document.getElementById('segNet').style.width=(net*100)+'%';\n    document.getElementById('t1v').textContent=fmt(E/(E-1),2);\n    document.getElementById('t2v').textContent=fmt(1/(E-1),2);\n    document.getElementById('t3v').textContent=fmt(E-1,1)+'×';\n    drawCliff();\n  }\n  eroi1.addEventListener('input',update1);\n\n  // ---------- Section 2 : cliff ----------\n  function drawCliff(){\n    var d=STR[LANG], svg=document.getElementById('cliff');\n    while(svg.firstChild)svg.removeChild(svg.firstChild);\n    var W=880,H=290,pL=46,pR=20,pT=16,pB=34, x0=pL,x1=W-pR,y0=pT,y1=H-pB, Emax=40;\n    function X(e){return x0+(e-1)/(Emax-1)*(x1-x0);}\n    function Y(v){return y1-v*(y1-y0);}\n    // critical zone (EROI<7)\n    svg.appendChild(mk('rect',{x:X(1),y:y0,width:(X(7)-X(1)),height:(y1-y0),fill:'var(--warn)','fill-opacity':0.06}));\n    var cz=mk('text',{x:X(4),y:y0+13,'text-anchor':'middle',fill:'var(--warn)','font-size':10,'font-family':'var(--font-m)',opacity:.8});cz.textContent=d.cliffCritical;svg.appendChild(cz);\n    // axes\n    var g=mk('g',{class:'cax'});\n    [0,.25,.5,.75,1].forEach(function(v){var yy=Y(v);g.appendChild(mk('line',{x1:x0,y1:yy,x2:x1,y2:yy}));var t=mk('text',{x:x0-5,y:yy+3,'text-anchor':'end'});t.textContent=Math.round(v*100);g.appendChild(t);});\n    [1,10,20,30,40].forEach(function(e){var xx=X(e);var t=mk('text',{x:xx,y:y1+14,'text-anchor':'middle'});t.textContent=e;g.appendChild(t);});\n    svg.appendChild(g);\n    var xl=mk('text',{x:(x0+x1)/2,y:H-4,'text-anchor':'middle',fill:'var(--faint)','font-size':10,'font-family':'var(--font-m)'});xl.textContent=d.cliffAxX;svg.appendChild(xl);\n    var yl=mk('text',{x:x0-30,y:y0-4,fill:'var(--faint)','font-size':10,'font-family':'var(--font-m)'});yl.textContent=d.cliffAxY;svg.appendChild(yl);\n    // curve net share\n    var path='M ', fillp='M '+X(1).toFixed(1)+' '+Y(0).toFixed(1)+' ';\n    for(var e=1;e<=Emax;e+=0.25){var v=1-1/e;path+=(e===1?'':'L ')+X(e).toFixed(1)+' '+Y(v).toFixed(1)+' ';fillp+='L '+X(e).toFixed(1)+' '+Y(v).toFixed(1)+' ';}\n    fillp+='L '+X(Emax).toFixed(1)+' '+Y(0).toFixed(1)+' Z';\n    svg.appendChild(mk('path',{d:fillp,fill:'var(--green)','fill-opacity':0.10}));\n    svg.appendChild(mk('path',{d:path,fill:'none',stroke:'var(--green)','stroke-width':2.4}));\n    // live marker from section 1\n    var E=parseFloat(eroi1.value), vv=1-1/E;\n    svg.appendChild(mk('line',{x1:X(E),y1:Y(vv),x2:X(E),y2:y1,stroke:'var(--ink)','stroke-width':1,'stroke-dasharray':'3 3',opacity:.5}));\n    svg.appendChild(mk('circle',{cx:X(E),cy:Y(vv),r:4.5,fill:'var(--green)',stroke:'var(--surface)','stroke-width':1.6}));\n    var ml=mk('text',{x:X(E)+(E>30?-6:7),y:Y(vv)-7,'text-anchor':(E>30?'end':'start'),fill:'var(--ink)','font-size':10.5,'font-family':'var(--font-m)','font-weight':600});ml.textContent='EROI '+fmt(E,1);svg.appendChild(ml);\n  }\n  function drawSources(){\n    var d=STR[LANG], svg=document.getElementById('sources');\n    while(svg.firstChild)svg.removeChild(svg.firstChild);\n    var data=d.srcData, n=data.length;\n    var W=880, padT=8, padB=28, padL=182, padR=52, rowH=33;\n    var H=padT+n*rowH+padB;\n    svg.setAttribute('viewBox','0 0 '+W+' '+H);\n    var x0=padL,x1=W-padR,y0=padT, maxE=90;\n    function X(e){return x0+e/maxE*(x1-x0);}\n    svg.appendChild(mk('rect',{x:x0,y:y0,width:(X(7)-x0).toFixed(1),height:n*rowH,fill:'var(--warn)','fill-opacity':0.06}));\n    var g=mk('g',{class:'cax'});\n    [0,20,40,60,80].forEach(function(v){var xx=X(v);g.appendChild(mk('line',{x1:xx,y1:y0,x2:xx,y2:y0+n*rowH}));var t=mk('text',{x:xx,y:y0+n*rowH+15,'text-anchor':'middle'});t.textContent=v;g.appendChild(t);});\n    svg.appendChild(g);\n    var xl=mk('text',{x:(x0+x1)/2,y:H-3,'text-anchor':'middle',fill:'var(--faint)','font-size':10,'font-family':'var(--font-m)'});xl.textContent='EROI';svg.appendChild(xl);\n    data.forEach(function(row,idx){\n      var yc=y0+idx*rowH+rowH/2, e=row[1];\n      var col=e<7?'var(--warn)':(e<14?'var(--gold)':'var(--green)');\n      var lab=mk('text',{x:x0-10,y:yc+4,'text-anchor':'end',fill:'var(--ink)','font-size':12.5});lab.textContent=row[0];svg.appendChild(lab);\n      svg.appendChild(mk('rect',{x:x0,y:yc-8,width:Math.max(1.5,X(e)-x0).toFixed(1),height:16,rx:3,fill:col}));\n      var vt=mk('text',{x:(X(e)+6).toFixed(1),y:yc+4,fill:'var(--muted)','font-size':12,'font-family':'var(--font-m)','font-weight':600});vt.textContent=e;svg.appendChild(vt);\n    });\n  }\n\n  // ---------- Section 3 : simulator ----------\n  var g=document.getElementById('g'),iEl=document.getElementById('i'),e0=document.getElementById('e0'),e1=document.getElementById('e1');\n  var DEF={hor:20,g:2,i:2,e0:15,e1:15};\n  var PRE={stable:{e0:15,e1:15},down:{e0:15,e1:8},up:{e0:10,e1:20}};\n  var activePre='stable';\n  function netShare(E){return 1-1/E;}\n  function update3(){\n    var d=STR[LANG];\n    var T=20, gg=parseFloat(g.value)/100, ii=parseFloat(iEl.value)/100, E0=parseFloat(e0.value), E1=parseFloat(e1.value);\n    document.getElementById('vG').textContent=fmt(parseFloat(g.value),1)+' %';\n    document.getElementById('vI').textContent=fmt(parseFloat(iEl.value),1)+' %';\n    document.getElementById('vE0').textContent=fmt(E0,1);\n    document.getElementById('vE1').textContent=fmt(E1,1);\n    var pib=Math.exp(gg*T), net=Math.exp((gg-ii)*T);\n    var gf=netShare(E0)/netShare(E1);\n    var gross=net*gf;\n    var pibI=pib*100, netI=net*100, grossI=gross*100;\n    var scale=Math.max(pibI,netI,grossI,110);\n    function setBar(fid,vid,val){document.getElementById(fid).style.width=(val/scale*100)+'%';document.getElementById(vid).textContent=Math.round(val);}\n    setBar('fPib','vPib',pibI); setBar('fNet','vNet',netI); setBar('fGross','vGross',grossI);\n    var hp=(100/scale*100)+'%'; ['h1','h2','h3'].forEach(function(id){document.getElementById(id).style.left=hp;});\n    // required intensity decline for gross index = 100\n    var iStar=gg+Math.log(gf)/T;\n    document.getElementById('reqRate').innerHTML=fmt(iStar*100,2)+' <small>%<\/small>';\n    var margin=(ii-iStar)*100; // pt/yr\n    var badge=document.getElementById('marginBadge');\n    if(grossI<=100.0001){badge.className='badge ok';badge.textContent=d.margeOk.replace('{m}',fmt(Math.abs(margin),2));}\n    else{badge.className='badge no';badge.textContent=d.margeNo.replace('{m}',fmt(Math.abs(margin),2));}\n    // eroi note\n    var pa=fmt(100/E0,1), pb=fmt(100/E1,1), note;\n    if(Math.abs(E0-E1)<0.01) note=d.eroiFlat.replace('{a}',fmt(E0,1)).replace('{pa}',pa);\n    else if(E1<E0) note=d.eroiDown.replace('{a}',fmt(E0,1)).replace('{b}',fmt(E1,1)).replace('{pa}',pa).replace('{pb}',pb);\n    else note=d.eroiUp.replace('{a}',fmt(E0,1)).replace('{b}',fmt(E1,1)).replace('{pa}',pa).replace('{pb}',pb);\n    document.getElementById('eroiNote').innerHTML=note;\n  }\n  [g,iEl].forEach(function(el){el.addEventListener('input',function(){update3();});});\n  [e0,e1].forEach(function(el){el.addEventListener('input',function(){activePre=null;syncPre();update3();});});\n\n  function buildPresets(){\n    var d=STR[LANG], box=document.getElementById('presets');box.innerHTML='';\n    d.presets.forEach(function(p){var b=document.createElement('button');b.className='pz';b.dataset.k=p[0];b.textContent=p[1];\n      b.addEventListener('click',function(){var pr=PRE[p[0]];e0.value=pr.e0;e1.value=pr.e1;activePre=p[0];syncPre();update3();});box.appendChild(b);});\n    syncPre();\n  }\n  function syncPre(){document.querySelectorAll('.pz').forEach(function(b){b.classList.toggle('on',b.dataset.k===activePre);});}\n  document.getElementById('reset').addEventListener('click',function(){g.value=DEF.g;iEl.value=DEF.i;e0.value=DEF.e0;e1.value=DEF.e1;activePre='stable';syncPre();update3();});\n\n  // ---------- toggles ----------\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme');if(a)return a;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}\n  document.getElementById('theme').addEventListener('click',function(){document.documentElement.setAttribute('data-theme',effTheme()==='dark'?'light':'dark');try{localStorage.setItem('eroi_theme',effTheme());}catch(e) (in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:transparent;}\n  .verdict .vtxt{font-size:13px;color:var(--muted);text-wrap:pretty;} .verdict .vtxt b{color:var(--ink);font-weight:600;}\n\n  .reset{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:8px 13px;cursor:pointer;}\n  .reset:hover{color:var(--ink);border-color:var(--faint);}\n  .presets{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 18px;}\n  .pz{font-family:var(--font-b);font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:20px;padding:7px 14px;cursor:pointer;}\n  .pz:hover{color:var(--ink);border-color:var(--faint);}\n  .pz.on{border-color:var(--orange);color:var(--ink);box-shadow:0 0 0 1px var(--orange) inset;}\n\n  .trajwrap{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:center;margin-top:6px;}\n  @media(max-width:760px){.trajwrap{grid-template-columns:1fr;}}\n  #traj{display:block;width:100%;height:auto;} #traj text{font-family:var(--font-b);}\n  .tax line{stroke:var(--line);} .tax text{fill:var(--faint);font-size:10px;font-family:var(--font-m);}\n  .cond{border:1px solid var(--line);border-radius:14px;padding:16px 18px;}\n  .cond .clbl{font-family:var(--font-m);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;}\n  .cond p{font-size:13.5px;color:var(--muted);margin:0;text-wrap:pretty;} .cond p b{color:var(--ink);font-weight:600;}\n  .cond .big{font-family:var(--font-d);font-weight:600;font-size:38px;color:var(--green);line-height:1;margin:8px 0 2px;} .cond .big small{font-size:20px;color:var(--muted);font-weight:400;}\n  .cond .big .reqpre{font-family:var(--font-m);font-size:18px;color:var(--muted);font-weight:400;}\n  .ratesum .code{color:var(--ink);}\n  .cond .sub2{font-size:12.5px;color:var(--faint);}\n  .cond .obsnote{margin-top:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--muted);text-wrap:pretty;} .cond .obsnote b{color:var(--ink);font-weight:600;}\n  .cond.note{border-left:4px solid var(--green);}\n  .cond.note p{font-size:14px;color:var(--muted);margin:0;line-height:1.6;text-wrap:pretty;} .cond.note p b{color:var(--ink);font-weight:600;}\n\n  .rategrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 20px;margin:2px 0 6px;}\n  @media(max-width:720px){.rategrid{grid-template-columns:1fr;}}\n  .ratesum{margin-top:14px;font-family:var(--font-m);font-size:13px;color:var(--muted);text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;text-wrap:balance;}\n  .ratesum b{color:var(--ink);font-weight:600;} .ratesum .up{color:var(--warn);} .ratesum .dn{color:var(--green);}\n  .dcstatus{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px;}\n  .dcchip{font-family:var(--font-m);font-size:12px;border-radius:20px;padding:5px 13px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px;color:var(--muted);}\n  .dcchip .mk2{font-weight:700;font-size:13px;}\n  .dcchip.ok{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green);border-color:transparent;}\n  .dcchip.no{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn);border-color:transparent;}\n\n  .lesson{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:15px 18px;font-size:13.5px;color:var(--muted);text-wrap:pretty;}\n  .lesson b{color:var(--ink);font-weight:600;} .lesson i{font-family:var(--font-d);font-style:italic;}\n  .lesson .lh{font-family:var(--font-d);font-weight:600;font-size:15.5px;color:var(--ink);display:block;margin-bottom:5px;}\n  footer{margin-top:22px;color:var(--faint);font-size:11.5px;text-align:center;text-wrap:balance;} footer i{font-family:var(--font-d);font-style:italic;}\n<\/style>\n\n<div class=\"wrap\">\n  <div class=\"toprow\">\n    <div class=\"intro\">\n      <div class=\"introtop\">\n        <p class=\"eyebrow\" data-t=\"eyebrow\">Approche synthétique · IPAT<\/p>\n        <div class=\"toggles\">\n          <button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button>\n          <button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button>\n        <\/div>\n      <\/div>\n      <h1 data-t=\"title\">Trois leviers pour contenir l'impact<\/h1>\n      <p class=\"sub\" data-t=\"sub\"><\/p>\n    <\/div>\n    <div class=\"card formula\">\n      <div class=\"ftitle\" data-t=\"f_t\">L'identité IPAT<\/div>\n      <div class=\"ident\">\n        <span class=\"v vI\">I<\/span><span class=\"op\">=<\/span>\n        <span class=\"v vP\">P<\/span><span class=\"op\">×<\/span>\n        <span class=\"v vA\">A<\/span><span class=\"op\">×<\/span>\n        <span class=\"v vT\">T<\/span>\n      <\/div>\n      <div class=\"flegend\">\n        <div class=\"fl\"><span><b class=\"vI\" style=\"color:var(--warn)\">I<\/b><\/span><span data-t=\"f_i\">impact écologique total<\/span><\/div>\n        <div class=\"fl p\"><span><b>P<\/b><\/span><span data-t=\"f_p\">population<\/span><\/div>\n        <div class=\"fl a\"><span><b>A<\/b><\/span><span data-t=\"f_a\">richesse par habitant (<i>affluence<\/i>)<\/span><\/div>\n        <div class=\"fl t\"><span><b>T<\/b><\/span><span data-t=\"f_tt\">impact par unité de richesse (technologie)<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Section 1 : understand the identity -->\n  <div class=\"card sec\">\n    <div class=\"sechead\">\n      <div class=\"lft\"><span class=\"snum\">1<\/span><h2 data-t=\"s0t\">Comprendre l'identité IPAT<\/h2><\/div>\n    <\/div>\n    <p class=\"secdesc\" data-t=\"s0d\"><\/p>\n    <div class=\"defs\" id=\"defs\"><\/div>\n    <div class=\"idrow\">\n      <div class=\"idblock\">\n        <div class=\"idlbl\" data-t=\"stat_lbl\">En statique · une identité comptable<\/div>\n        <div class=\"ideq\"><span class=\"kI\">I<\/span> = <span class=\"kP\">P<\/span> × <span class=\"kA\">A<\/span> × <span class=\"kT\">T<\/span><\/div>\n        <div class=\"ideq2\" data-t=\"stat_eq2\"><\/div>\n        <p data-t=\"stat_p\"><\/p>\n      <\/div>\n      <div class=\"idblock\">\n        <div class=\"idlbl\" data-t=\"dyn_lbl\">En dynamique · coefficients multiplicateurs<\/div>\n        <div class=\"ideq mini\"><span class=\"kI\">ΔI/I<\/span> = (1 + <span class=\"kP\">ΔP/P<\/span>)(1 + <span class=\"kA\">ΔA/A<\/span>)(1 + <span class=\"kT\">ΔT/T<\/span>) − 1<\/div>\n        <details class=\"demo\">\n          <summary><span class=\"darrow\">▸<\/span><span data-t=\"demo_t\">Démonstration mathématique<\/span><\/summary>\n          <div class=\"demobody\">\n            <p data-t=\"demo_intro\">Notons Δ la variation d'une période à la suivante :<\/p>\n            <div class=\"dstep\">I = P × A × T<\/div>\n            <div class=\"dstep\">→ I + ΔI = (P + ΔP)(A + ΔA)(T + ΔT)<\/div>\n            <p data-t=\"demo_scale\">On rapporte chaque variable à son niveau initial :<\/p>\n            <div class=\"dstep\">→ (I + ΔI)/I = ((P + ΔP)/P) · ((A + ΔA)/A) · ((T + ΔT)/T)<\/div>\n            <div class=\"dstep\">→ 1 + ΔI/I = (1 + ΔP/P)(1 + ΔA/A)(1 + ΔT/T)<\/div>\n            <div class=\"dstep res\">→ <span class=\"kI\">ΔI/I<\/span> = (1 + <span class=\"kP\">ΔP/P<\/span>)(1 + <span class=\"kA\">ΔA/A<\/span>)(1 + <span class=\"kT\">ΔT/T<\/span>) − 1<\/div>\n          <\/div>\n        <\/details>\n      <\/div>\n    <\/div>\n    <div class=\"dcpl\">\n      <div class=\"dc rel\">\n        <div class=\"dch\"><span class=\"dcbadge rel\" data-t=\"dc_rel_t\">Découplage relatif<\/span><span class=\"dccond\"><span class=\"kT\">ΔT/T<\/span> &lt; 0<\/span><\/div>\n        <p data-t=\"dc_rel_x\"><\/p>\n      <\/div>\n      <div class=\"dc abs\">\n        <div class=\"dch\"><span class=\"dcbadge abs\" data-t=\"dc_abs_t\">Découplage absolu<\/span><span class=\"dccond\"><span class=\"kI\">ΔI/I<\/span> &lt; 0<\/span><\/div>\n        <p data-t=\"dc_abs_x\"><\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Section 2 : dynamic condition -->\n  <div class=\"card sec\">\n    <div class=\"sechead\">\n      <div class=\"lft\"><span class=\"snum o\">2<\/span><h2 data-t=\"s2t\">Rester sous le plafond<\/h2><\/div>\n      <button class=\"reset\" id=\"reset2\" data-t=\"reset\">Réinitialiser<\/button>\n    <\/div>\n    <p class=\"secdesc\" data-t=\"s2d\"><\/p>\n    <div class=\"presets\" id=\"presets\"><\/div>\n    <div class=\"rategrid\">\n      <div class=\"field\">\n        <label><span class=\"nm\"><span class=\"tag P\">P<\/span><span data-t=\"r_P\">Croissance population<\/span><\/span><span class=\"vv\" id=\"vgP\"><\/span><\/label>\n        <input type=\"range\" id=\"gP\" min=\"-0.5\" max=\"3\" step=\"0.1\" value=\"0.9\">\n        <div class=\"ends\"><span>−0,5<\/span><span>+3<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label><span class=\"nm\"><span class=\"tag A\">A<\/span><span data-t=\"r_A\">Croissance richesse / hab.<\/span><\/span><span class=\"vv\" id=\"vgA\"><\/span><\/label>\n        <input type=\"range\" id=\"gA\" min=\"-2\" max=\"5\" step=\"0.1\" value=\"1.7\">\n        <div class=\"ends\"><span>−2<\/span><span>+5<\/span><\/div>\n      <\/div>\n      <div class=\"field\">\n        <label><span class=\"nm\"><span class=\"tag T\">T<\/span><span data-t=\"r_T\">Évolution impact / richesse<\/span><\/span><span class=\"vv\" id=\"vgT\"><\/span><\/label>\n        <input type=\"range\" id=\"gT\" min=\"-6\" max=\"1\" step=\"any\" value=\"-1.5\">\n        <div class=\"ends\"><span>−6<\/span><span>+1<\/span><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"ratesum\" id=\"rateSum\"><\/div>\n    <div class=\"dcstatus\"><span class=\"dcchip\" id=\"dcRel\"><\/span><span class=\"dcchip\" id=\"dcAbs\"><\/span><\/div>\n\n    <div class=\"trajwrap\">\n      <svg id=\"traj\" viewBox=\"0 0 560 300\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"Trajectoire de l'impact sur 30 ans face à la capacité de charge\"><\/svg>\n      <div class=\"condcol\">\n        <div class=\"cond\" id=\"condBox\">\n          <div class=\"clbl\" data-t=\"cond_lbl\">Condition sur T<\/div>\n          <p data-t=\"cond_p1\"><\/p>\n          <div class=\"big\"><span class=\"reqpre\">ΔT/T =<\/span> <span id=\"reqT\"><\/span><\/div>\n          <div class=\"sub2\" data-t=\"cond_sub\">par an, dans ce scénario de P et A.<\/div>\n          <div class=\"obsnote\" id=\"obsNote\"><\/div>\n        <\/div>\n        <div class=\"cond note\" id=\"commentBox\" style=\"display:none\">\n          <div class=\"clbl\" data-t=\"comment_lbl\">Résultat<\/div>\n          <p data-t=\"comment_body\"><\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <p class=\"lesson\">\n    <span class=\"lh\" data-t=\"l_h\">Aucun levier ne suffit seul.<\/span>\n    <span data-t=\"l_body\"><\/span>\n  <\/p>\n\n  <footer data-t=\"foot\"><\/footer>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  var SVGNS=\"http://www.w3.org/2000/svg\";\n  function mk(t,a){var e=document.createElementNS(SVGNS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}\n  var LANG='fr'; try{var s=localStorage.getItem('ipat_lang');if(s)LANG=s;}catch(e){}\n\n  // Carrying-capacity ceiling: today's impact = 100 ≈ 1.7 Earths → 1 Earth ≈ 59\n  var CEIL=59, H=30;\n\n  var STR={\n    fr:{\n      eyebrow:\"Approche synthétique · IPAT\",\n      title:\"Trois leviers pour contenir l'impact\",\n      sub:\"Pour ne pas dépasser la <b>capacité de charge<\/b>, il faut limiter l'impact écologique total. L'identité <b>IPAT<\/b> systématise cette exigence : elle décompose l'impact en trois leviers — <b>population<\/b>, <b>richesse par habitant<\/b> et <b>impact par unité de richesse<\/b> — qu'il faut penser <b>ensemble<\/b>.\",\n      f_t:\"L'identité IPAT\",\n      f_i:\"impact écologique total\", f_p:\"population\",\n      f_a:\"richesse par habitant (<i>affluence<\/i>)\", f_tt:\"impact par unité de richesse (technologie)\",\n      reset:\"Réinitialiser\", c_impact:\"Impact\",\n      s0t:\"Comprendre l'identité IPAT\",\n      s0d:\"IPAT relie l'impact écologique à trois facteurs.\",\n      defs:[\n        {s:'I', c:'I', n:\"Impact écologique\", eq:\"l'impact total mesuré\", mean:\"La pression sur l'environnement qu'on cherche à limiter : <b>émissions de CO₂<\/b>, matières extraites, empreinte écologique…\"},\n        {s:'P', c:'P', n:\"Population\", eq:\"le nombre d'habitants\", mean:\"Combien nous sommes — à l'échelle mondiale, environ <b>8 milliards<\/b> d'humains.\"},\n        {s:'A', c:'A', n:\"Richesse par habitant\", eq:\"FRAC:PIB:P\", mean:\"Le niveau de vie moyen, ou <b>PIB par tête<\/b> : ce que chacun produit et consomme en moyenne.\"},\n        {s:'T', c:'T', n:\"Impact par unité de richesse\", eq:\"FRAC:I:PIB\", mean:\"Le « <b>contenu écologique<\/b> » de chaque unité produite : efficacité, mix technologique, intensité (ex. CO₂ par € de PIB).\"}\n      ],\n      stat_lbl:\"En statique · une identité comptable\",\n      stat_eq2:\"<span class='kI'>I<\/span> = <span class='kP'>P<\/span> × <span class='frac'><span class='num'>PIB<\/span><span class='den'>P<\/span><\/span> × <span class='frac'><span class='num'>I<\/span><span class='den'>PIB<\/span><\/span> = <span class='kI'>I<\/span>\",\n      stat_p:\"<b>A<\/b> et <b>T<\/b> sont des ratios. En les remplaçant par leur définition, la population et le PIB se <b>simplifient<\/b> : il ne reste que I. L'identité est donc vraie <b>par construction<\/b>.\",\n      dyn_lbl:\"En dynamique · coefficients multiplicateurs\",\n      demo_t:\"Démonstration mathématique\",\n      demo_intro:\"Notons Δ la variation d'une période à la suivante :\",\n      demo_scale:\"On rapporte chaque variable à son niveau initial :\",\n      dc_rel_t:\"Découplage relatif\",\n      dc_rel_x:\"L'impact par unité de richesse (T) diminue. L'impact <b>total peut encore augmenter<\/b>, mais moins vite que le PIB.\",\n      dc_abs_t:\"Découplage absolu\",\n      dc_abs_x:\"Le produit des coefficients passe <b>sous 1<\/b> : la baisse de T l'emporte sur la hausse de P et A. L'impact <b>total diminue<\/b>.\",\n      s1t:\"Décompose l'impact\",\n      s1d:\"L'impact est le <b>produit<\/b> des trois leviers (base 100 = aujourd'hui). Fais glisser chacun : comme ils se <b>multiplient<\/b>, agir sur un seul ne déplace l'impact que modestement. Le repère vert marque la <b>capacité de charge<\/b> — le niveau soutenable de long terme.\",\n      p_P:\"Population\", p_A:\"Richesse / habitant\", p_T:\"Impact / richesse\",\n      bar_lbl:\"Impact écologique total · base 100 aujourd'hui\",\n      mk_today:\"aujourd'hui<br>≈ 1,7 Terre\", mk_ceil:\"capacité de charge<br>1 Terre\",\n      v_under:\"Sous la capacité de charge\", v_over:\"Au-dessus de la capacité de charge\",\n      vtxt_under:\"L'impact tient dans le budget écologique : <b>{v}<\/b> contre un plafond de <b>59<\/b>.\",\n      vtxt_over:\"L'impact dépasse le plafond de <b>{p} %<\/b> — il faudrait le ramener de <b>{v}<\/b> à <b>59<\/b>.\",\n      s2t:\"Rester sous le plafond\",\n      s2d:\"Les leviers évoluent dans le temps. Chaque année, l'impact est multiplié par le <b>produit des coefficients<\/b> (1+ΔP/P)(1+ΔA/A)(1+ΔT/T). Dans la tendance mondiale, la population (P) et le PIB <b>augmentent<\/b>, tandis que l'impact par unité de richesse (T) <b>a tendance à se réduire<\/b> grâce aux gains d'efficacité. Question : à quelle vitesse T doit-il baisser pour ramener l'impact sous la capacité de charge en une génération (30 ans) ?\",\n      presets:[[\"tendance\",\"Tendance mondiale\"],[\"efficacite\",\"Efficacité héroïque\"],[\"combinee\",\"Approche combinée\"]],\n      r_P:\"Croissance population\", r_A:\"Croissance richesse / hab.\", r_T:\"Évolution impact / richesse\",\n      cond_lbl:\"Condition sur T\",\n      cond_p1:\"Pour ramener l'impact sous la capacité de charge en 30 ans, l'amélioration de T doit atteindre au minimum :\",\n      cond_sub:\"par an, dans ce scénario de P et A.\",\n      comment_lbl:\"Résultat\",\n      comment_body:\"En combinant une <b>stabilisation démographique et économique<\/b> (P et A) avec une <b>amélioration technologique<\/b> (T), on obtient un <b>découplage absolu<\/b> tout juste suffisant pour repasser sous la capacité de charge.\",\n      obs_ok:\"Le scénario actuel y parvient : la trajectoire passe <b>sous<\/b> le plafond. Historiquement, T ne s'améliore que d'environ <b>1 à 1,5 % par an<\/b> — un rythme rarement atteint sur la durée.\",\n      obs_no:\"Le scénario actuel <b>n'y parvient pas<\/b> : T ne baisse pas assez vite et l'impact reste au-dessus du plafond. Or historiquement T ne s'améliore que d'environ <b>1 à 1,5 % par an<\/b> : compter sur la seule technologie ne suffit pas.\",\n      rate_up:\"Variation de l'impact <span class='code'>ΔI/I<\/span> = <b class='up'>+{s} %/an<\/b> → il <b class='up'>monte<\/b>.\",\n      rate_dn:\"Variation de l'impact <span class='code'>ΔI/I<\/span> = <b class='dn'>{s} %/an<\/b> → il <b class='dn'>baisse<\/b>.\",\n      rate_eq:\"Variation de l'impact <span class='code'>ΔI/I<\/span> ≈ <b>{s} %/an<\/b>.\",\n      traj_today:\"aujourd'hui\", traj_ceil:\"capacité de charge\", traj_axY:\"impact (base 100)\", traj_axX:\"années\",\n      l_h:\"Aucun levier ne suffit seul.\",\n      l_body:\"Parce que les leviers se <b>multiplient<\/b>, une amélioration technologique (T) est vite <b>annulée<\/b> par la hausse de la population (P) et surtout du niveau de vie (A) : c'est l'<b>effet rebond<\/b> à l'échelle macro. Contenir l'impact suppose donc d'agir sur <b>les trois dimensions à la fois<\/b> — efficacité <i>et<\/i> sobriété <i>et<\/i> démographie. IPAT ne dit pas quel levier privilégier ; il montre qu'aucun ne peut être négligé.\",\n      foot:\"Identité I = P × A × T d'après Ehrlich &amp; Holdren (1971), « Impact of Population Growth », <i>Science<\/i> 171, 1212–1217. Plafond « 1 Terre » : dépassement écologique mondial ≈ 1,7 Terre (Global Footprint Network). Ordres de grandeur des taux : croissance démographique et du PIB par habitant, ONU / Banque mondiale ; amélioration de l'intensité, tendances historiques. Exercice de mécanique, pas une prévision.\",\n    },\n    en:{\n      eyebrow:\"A synthetic view · IPAT\",\n      title:\"Three levers to keep impact in check\",\n      sub:\"To stay within the <b>carrying capacity<\/b>, total ecological impact must be limited. The <b>IPAT<\/b> identity systematises this requirement: it breaks impact into three levers — <b>population<\/b>, <b>affluence per person<\/b> and <b>impact per unit of affluence<\/b> — that must be thought of <b>together<\/b>.\",\n      f_t:\"The IPAT identity\",\n      f_i:\"total ecological impact\", f_p:\"population\",\n      f_a:\"wealth per person (<i>affluence<\/i>)\", f_tt:\"impact per unit of wealth (technology)\",\n      reset:\"Reset\", c_impact:\"Impact\",\n      s0t:\"Understanding the IPAT identity\",\n      s0d:\"IPAT links ecological impact to three factors.\",\n      defs:[\n        {s:'I', c:'I', n:\"Ecological impact\", eq:\"total measured impact\", mean:\"The environmental pressure we seek to limit: <b>CO₂ emissions<\/b>, materials extracted, ecological footprint…\"},\n        {s:'P', c:'P', n:\"Population\", eq:\"the number of people\", mean:\"How many we are — globally, about <b>8 billion<\/b> humans.\"},\n        {s:'A', c:'A', n:\"Wealth per person\", eq:\"FRAC:GDP:P\", mean:\"Average living standard, or <b>GDP per capita<\/b>: what each person produces and consumes on average.\"},\n        {s:'T', c:'T', n:\"Impact per unit of wealth\", eq:\"FRAC:I:GDP\", mean:\"The “<b>ecological content<\/b>” of each unit produced: efficiency, technology mix, intensity (e.g. CO₂ per € of GDP).\"}\n      ],\n      stat_lbl:\"Static · an accounting identity\",\n      stat_eq2:\"<span class='kI'>I<\/span> = <span class='kP'>P<\/span> × <span class='frac'><span class='num'>GDP<\/span><span class='den'>P<\/span><\/span> × <span class='frac'><span class='num'>I<\/span><span class='den'>GDP<\/span><\/span> = <span class='kI'>I<\/span>\",\n      stat_p:\"<b>A<\/b> and <b>T<\/b> are ratios. Substituting their definitions, population and GDP <b>cancel out<\/b>: only I remains. The identity is therefore true <b>by construction<\/b>.\",\n      dyn_lbl:\"Dynamic · multiplier coefficients\",\n      demo_t:\"Mathematical derivation\",\n      demo_intro:\"Let Δ denote the change from one period to the next:\",\n      demo_scale:\"Scale each variable to its initial level:\",\n      dc_rel_t:\"Relative decoupling\",\n      dc_rel_x:\"Impact per unit of wealth (T) falls. Total impact <b>can still rise<\/b>, but more slowly than GDP.\",\n      dc_abs_t:\"Absolute decoupling\",\n      dc_abs_x:\"The product of coefficients drops <b>below 1<\/b>: the fall in T outweighs the rise in P and A. Total impact <b>falls<\/b>.\",\n      s1t:\"Break down the impact\",\n      s1d:\"Impact is the <b>product<\/b> of the three levers (base 100 = today). Drag each one: because they <b>multiply<\/b>, acting on a single lever moves impact only modestly. The green mark is the <b>carrying capacity<\/b> — the long-run sustainable level.\",\n      p_P:\"Population\", p_A:\"Wealth / person\", p_T:\"Impact / wealth\",\n      bar_lbl:\"Total ecological impact · base 100 today\",\n      mk_today:\"today<br>≈ 1.7 Earths\", mk_ceil:\"carrying capacity<br>1 Earth\",\n      v_under:\"Within carrying capacity\", v_over:\"Above carrying capacity\",\n      vtxt_under:\"Impact fits the ecological budget: <b>{v}<\/b> against a ceiling of <b>59<\/b>.\",\n      vtxt_over:\"Impact exceeds the ceiling by <b>{p} %<\/b> — it would need to come down from <b>{v}<\/b> to <b>59<\/b>.\",\n      s2t:\"Staying under the ceiling\",\n      s2d:\"The levers change over time. Each year, impact is multiplied by the <b>product of coefficients<\/b> (1+ΔP/P)(1+ΔA/A)(1+ΔT/T). In the global trend, population (P) and GDP <b>rise<\/b>, while impact per unit of wealth (T) <b>tends to fall<\/b> thanks to efficiency gains. Question: how fast must T fall to bring impact under the carrying capacity within one generation (30 years)?\",\n      presets:[[\"tendance\",\"Global trend\"],[\"efficacite\",\"Heroic efficiency\"],[\"combinee\",\"Combined approach\"]],\n      r_P:\"Population growth\", r_A:\"Wealth/person growth\", r_T:\"Change in impact/wealth\",\n      cond_lbl:\"Condition on T\",\n      cond_p1:\"To bring impact under the carrying capacity in 30 years, the improvement in T must reach at least:\",\n      cond_sub:\"per year, in this P and A scenario.\",\n      comment_lbl:\"Result\",\n      comment_body:\"By combining <b>demographic and economic stabilisation<\/b> (P and A) with a <b>technological improvement<\/b> (T), we achieve <b>absolute decoupling<\/b> — just enough to move back under the carrying capacity.\",\n      obs_ok:\"The current scenario gets there: the path drops <b>below<\/b> the ceiling. Historically T improves only about <b>1 to 1.5 % per year<\/b> — a pace rarely sustained.\",\n      obs_no:\"The current scenario <b>does not<\/b> get there: T falls too slowly and impact stays above the ceiling. Yet historically T improves only about <b>1 to 1.5 % per year<\/b>: technology alone is not enough.\",\n      rate_up:\"Impact change <span class='code'>ΔI/I<\/span> = <b class='up'>+{s} %/yr<\/b> → it <b class='up'>rises<\/b>.\",\n      rate_dn:\"Impact change <span class='code'>ΔI/I<\/span> = <b class='dn'>{s} %/yr<\/b> → it <b class='dn'>falls<\/b>.\",\n      rate_eq:\"Impact change <span class='code'>ΔI/I<\/span> ≈ <b>{s} %/yr<\/b>.\",\n      traj_today:\"today\", traj_ceil:\"carrying capacity\", traj_axY:\"impact (base 100)\", traj_axX:\"years\",\n      l_h:\"No single lever is enough.\",\n      l_body:\"Because the levers <b>multiply<\/b>, a technological gain (T) is quickly <b>cancelled<\/b> by rising population (P) and above all rising living standards (A): the <b>rebound effect<\/b> at the macro scale. Keeping impact in check therefore means acting on <b>all three dimensions at once<\/b> — efficiency <i>and<\/i> sufficiency <i>and<\/i> demography. IPAT does not say which lever to favour; it shows that none can be ignored.\",\n      foot:\"Identity I = P × A × T after Ehrlich &amp; Holdren (1971), “Impact of Population Growth”, <i>Science<\/i> 171, 1212–1217. “1 Earth” ceiling: global ecological overshoot ≈ 1.7 Earths (Global Footprint Network). Rate magnitudes: population and GDP-per-capita growth, UN / World Bank; intensity improvement, historical trends. A mechanical exercise, not a forecast.\",\n    }\n  };\n\n  function fmt(x,d){var s=(+x).toFixed(d);return LANG==='fr'?s.replace('.',','):s;}\n  function sgn(x,d){var s=fmt(Math.abs(x),d);return (x<0?'−':'+')+s;}\n\n  // ---------- Section 1 : definitions ----------\n  function buildDefs(){\n    var d=STR[LANG], box=document.getElementById('defs');box.innerHTML='';\n    d.defs.forEach(function(x){\n      var eqHtml;\n      if(x.eq.indexOf('FRAC:')===0){var pr=x.eq.split(':');eqHtml='<span class=\"eqs\">=<\/span> <span class=\"frac\"><span class=\"num\">'+pr[1]+'<\/span><span class=\"den\">'+pr[2]+'<\/span><\/span>';}\n      else eqHtml='<span class=\"eqs\">=<\/span> '+x.eq;\n      var card=document.createElement('div');card.className='defcard';\n      card.innerHTML='<div class=\"sym '+x.c+'\">'+x.s+'<\/div><div><div class=\"dn\">'+x.n+'<\/div><div class=\"deq\">'+eqHtml+'<\/div><div class=\"dm\">'+x.mean+'<\/div><\/div>';\n      box.appendChild(card);\n    });\n  }\n\n  // ---------- Section 2 : rester sous le plafond ----------\n  var gP=document.getElementById('gP'),gA=document.getElementById('gA'),gT=document.getElementById('gT');\n  var PRE={\n    tendance:{gP:0.9,gA:1.7,gT:-1.5},\n    efficacite:{gP:0.9,gA:1.7,gT:0},\n    combinee:{gP:0,gA:0,gT:0}\n  };\n  // Efficacité héroïque : T compense exactement la hausse de P et A (tendance) → impact stable (ΔI/I = 0)\n  PRE.efficacite.gT=(1/((1+PRE.efficacite.gP/100)*(1+PRE.efficacite.gA/100))-1)*100;\n  // Approche combinée : P et A stabilisés (0 %), et T juste nécessaire pour ramener l'impact\n  // à la capacité de charge en H ans → découplage absolu tout juste suffisant\n  PRE.combinee.gT=(Math.pow(CEIL/100,1/H)-1)*100;\n  var activePre='tendance';\n  function update2(){\n    var d=STR[LANG];\n    var pP=+gP.value, pA=+gA.value, pT=+gT.value;\n    document.getElementById('vgP').textContent=sgn(pP,1)+' %';\n    document.getElementById('vgA').textContent=sgn(pA,1)+' %';\n    document.getElementById('vgT').textContent=sgn(pT,1)+' %';\n    // multiplier coefficients (course method): C_I = C_P × C_A × C_T\n    var cP=1+pP/100, cA=1+pA/100, cT=1+pT/100;\n    var C=cP*cA*cT;                 // annual impact coefficient\n    var annual=(C-1)*100;           // ΔI/I per year, %\n    var rs=document.getElementById('rateSum');\n    if(annual>0.02) rs.innerHTML=d.rate_up.replace('{s}',fmt(annual,1));\n    else if(annual<-0.02) rs.innerHTML=d.rate_dn.replace('{s}',sgn(annual,1));\n    else rs.innerHTML=d.rate_eq.replace('{s}',fmt(annual,1));\n    // required annual ΔT/T so that [cP·cA·(1+t*)]^H = CEIL/100\n    var Cneed=Math.pow(CEIL/100,1/H);\n    var tStar=(Cneed/(cP*cA)-1)*100;\n    document.getElementById('reqT').innerHTML=sgn(tStar,1)+' <small>%<\/small>';\n    var end=100*Math.pow(C,H);\n    var reaches=end<=CEIL+1e-6;\n    document.getElementById('obsNote').innerHTML=reaches?d.obs_ok:d.obs_no;\n    // \"Condition sur T\" isole T à P et A fixés : sans objet en approche combinée → on commente le résultat\n    var combi=(activePre==='combinee');\n    document.getElementById('condBox').style.display=combi?'none':'';\n    document.getElementById('commentBox').style.display=combi?'':'none';\n    // Decoupling verdict from the equation: relative if ΔT/T<0, absolute if ΔI/I<0\n    var relOK=pT<-1e-9, absOK=annual<-1e-9;\n    var rel=document.getElementById('dcRel'), abs=document.getElementById('dcAbs');\n    rel.className='dcchip '+(relOK?'ok':'no'); rel.innerHTML='<span class=\"mk2\">'+(relOK?'✓':'✗')+'<\/span> '+d.dc_rel_t;\n    abs.className='dcchip '+(absOK?'ok':'no'); abs.innerHTML='<span class=\"mk2\">'+(absOK?'✓':'✗')+'<\/span> '+d.dc_abs_t;\n    drawTraj(C);\n  }\n  function drawTraj(C){\n    var d=STR[LANG], svg=document.getElementById('traj');\n    while(svg.firstChild)svg.removeChild(svg.firstChild);\n    var W=560,Ht=300,pL=40,pR=54,pT=16,pB=34, x0=pL,x1=W-pR,y0=pT,y1=Ht-pB;\n    var ymax=200;\n    function X(yr){return x0+yr/H*(x1-x0);}\n    function Y(v){return y1-Math.min(v,ymax)/ymax*(y1-y0);}\n    // grid\n    var g=mk('g',{class:'tax'});\n    [0,50,100,150,200].forEach(function(v){var yy=Y(v);g.appendChild(mk('line',{x1:x0,y1:yy,x2:x1,y2:yy}));var t=mk('text',{x:x0-5,y:yy+3,'text-anchor':'end'});t.textContent=v;g.appendChild(t);});\n    [0,10,20,30].forEach(function(yr){var xx=X(yr);var t=mk('text',{x:xx,y:y1+14,'text-anchor':'middle'});t.textContent=yr;g.appendChild(t);});\n    svg.appendChild(g);\n    var xl=mk('text',{x:(x0+x1)/2,y:Ht-3,'text-anchor':'middle',fill:'var(--faint)','font-size':10,'font-family':'var(--font-m)'});xl.textContent=d.traj_axX;svg.appendChild(xl);\n    // ceiling band + line\n    svg.appendChild(mk('rect',{x:x0,y:Y(CEIL),width:(x1-x0),height:(y1-Y(CEIL)),fill:'var(--green)','fill-opacity':0.07}));\n    svg.appendChild(mk('line',{x1:x0,y1:Y(CEIL),x2:x1,y2:Y(CEIL),stroke:'var(--green)','stroke-width':2,'stroke-dasharray':'2 3'}));\n    var cl=mk('text',{x:x1+4,y:Y(CEIL)+3,fill:'var(--green)','font-size':10,'font-family':'var(--font-m)','font-weight':600});cl.textContent=d.traj_ceil;svg.appendChild(cl);\n    // today ref\n    svg.appendChild(mk('line',{x1:x0,y1:Y(100),x2:x1,y2:Y(100),stroke:'var(--faint)','stroke-width':1,'stroke-dasharray':'1 4',opacity:.6}));\n    var tl=mk('text',{x:x1+4,y:Y(100)+3,fill:'var(--faint)','font-size':10,'font-family':'var(--font-m)'});tl.textContent='100';svg.appendChild(tl);\n    // trajectory (multiplicative compounding: I_y = 100 · C^y)\n    var path='M ', last=100;\n    for(var yr=0;yr<=H;yr+=1){var v=100*Math.pow(C,yr);last=v;path+=(yr===0?'':'L ')+X(yr).toFixed(1)+' '+Y(v).toFixed(1)+' ';}\n    var col=(last<=CEIL+1e-6)?'var(--green)':'var(--warn)';\n    svg.appendChild(mk('path',{d:path,fill:'none',stroke:col,'stroke-width':2.6}));\n    var end=100*Math.pow(C,H);\n    svg.appendChild(mk('circle',{cx:X(H),cy:Y(end),r:4.5,fill:col,stroke:'var(--surface)','stroke-width':1.6}));\n    var el=mk('text',{x:X(H)-6,y:Y(end)+(end>150?16:-9),'text-anchor':'end',fill:'var(--ink)','font-size':11,'font-family':'var(--font-m)','font-weight':600});el.textContent=Math.round(end);svg.appendChild(el);\n    // start dot\n    svg.appendChild(mk('circle',{cx:X(0),cy:Y(100),r:3.5,fill:'var(--faint)'}));\n  }\n  [gP,gA,gT].forEach(function(el){el.addEventListener('input',function(){activePre=null;syncPre();update2();});});\n  function buildPresets(){\n    var d=STR[LANG], box=document.getElementById('presets');box.innerHTML='';\n    d.presets.forEach(function(p){var b=document.createElement('button');b.className='pz';b.dataset.k=p[0];b.textContent=p[1];\n      b.addEventListener('click',function(){var pr=PRE[p[0]];gP.value=pr.gP;gA.value=pr.gA;gT.value=pr.gT;activePre=p[0];syncPre();update2();});box.appendChild(b);});\n    syncPre();\n  }\n  function syncPre(){document.querySelectorAll('.pz').forEach(function(b){b.classList.toggle('on',b.dataset.k===activePre);});}\n  document.getElementById('reset2').addEventListener('click',function(){var pr=PRE.tendance;gP.value=pr.gP;gA.value=pr.gA;gT.value=pr.gT;activePre='tendance';syncPre();update2();});\n\n  // ---------- toggles ----------\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme');if(a)return a;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}\n  document.getElementById('theme').addEventListener('click',function(
