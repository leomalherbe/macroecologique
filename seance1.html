t);\n    // current square ring + count\n    var row2=Math.floor((N-1)/8), col2=(N-1)%8, cx=off+col2*cell, cy=off+row2*cell;\n    svg.appendChild(mk('rect',{x:cx+1.5,y:cy+1.5,width:cell-3,height:cell-3,rx:3,fill:'none',stroke:gold,'stroke-width':2.6}));\n    var lbl=sci(grains(N),fr);\n    var tt=mk('text',{x:cx+cell/2,y:cy+cell/2+4,'text-anchor':'middle',fill:gv('--ink'),'font-size':(lbl.length>7?9:11),'font-family':'var(--font-m)','font-weight':600}); tt.textContent=lbl; svg.appendChild(tt);\n  }\n\n  function readout(){\n    var fr=lang()==='fr';\n    document.getElementById('chs-case').textContent=N;\n    var g=grains(N), tot=total(N);\n    var ge=document.getElementById('chs-grains'); ge.textContent=sci(g,fr); ge.title=grp(g.toString())+' grains';\n    var te=document.getElementById('chs-total'); te.textContent=sci(tot,fr); te.title=grp(tot.toString())+' grains';\n    document.getElementById('chs-mass').textContent=fmtMass(Number(g)*0.025,fr);\n  }\n\n  function draw(){ drawBoard(); readout(); document.getElementById('chs-slider').value=N; }\n\n  function setN(v){ N=Math.max(1,Math.min(64,v)); draw(); }\n\n  // controls\n  var sl=document.getElementById('chs-slider');\n  sl.addEventListener('input',function(){ stop(); setN(parseInt(sl.value,10)); });\n  document.getElementById('chs-prev').addEventListener('click',function(){ stop(); setN(N-1); });\n  document.getElementById('chs-next').addEventListener('click',function(){ stop(); setN(N+1); });\n  var pico=document.getElementById('chs-ico-play'), paus=document.getElementById('chs-ico-pause');\n  function stop(){ playing=false; pico.hidden=false; paus.hidden=true; if(raf) cancelAnimationFrame(raf); }\n  function play(){\n    if(N>=64) N=1;\n    playing=true; pico.hidden=true; paus.hidden=false; lastStep=0;\n    function loop(ts){\n      if(!playing) return;\n      if(!lastStep) lastStep=ts;\n      if(ts-lastStep>150){ lastStep=ts; if(N<64){ setN(N+1); } else { stop(); return; } }\n      raf=requestAnimationFrame(loop);\n    }\n    raf=requestAnimationFrame(loop);\n  }\n  document.getElementById('chs-play').addEventListener('click',function(){ playing?stop():play(); });\n\n  function applyLang2(){\n    var d=STR2[lang()];\n    document.getElementById('chs-eb').textContent=d.eb;\n    document.getElementById('chs-title').textContent=d.title;\n    document.getElementById('chs-intro').innerHTML=d.intro;\n    document.getElementById('chs-l1').textContent=d.l1;\n    document.getElementById('chs-l2').textContent=d.l2;\n    document.getElementById('chs-l3').textContent=d.l3;\n    document.getElementById('chs-l4').textContent=d.l4;\n    document.getElementById('chs-cap').innerHTML=d.cap;\n    draw();\n  }\n\n  // sync with existing toggles (they run their own handlers; we re-render after)\n  var lg=document.getElementById('lang'); if(lg) lg.addEventListener('click',function(){ setTimeout(applyLang2,0); });\n  var th=document.getElementById('theme'); if(th) th.addEventListener('click',function(){ setTimeout(draw,0); });\n  if(window.matchMedia){ try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){ setTimeout(draw,0); }); }catch(e){} }\n  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(draw); }\n\n  applyLang2();\n})();\n<\/script>\n\n<\/body>\n<\/html>", "rms-verhulst.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Le rendement maximal soutenable (RMS)<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;\n    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n    --curve:#2A78D6;--rms:#C08A00;--catch:#2E8B57;--warn:#C0392B;--stock:#38505F;\n    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);\n    --font-d:\"Spectral\",Georgia,serif;--font-b:\"IBM Plex Sans\",system-ui,sans-serif;--font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n  }\n  :root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;\n    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --curve:#3987E5;--rms:#D6A83A;--catch:#41A76D;--warn:#E0705F;--stock:#8FA6B4;\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }}\n  :root[data-theme=\"dark\"]{\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;\n    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --curve:#3987E5;--rms:#D6A83A;--catch:#41A76D;--warn:#E0705F;--stock:#8FA6B4;\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}\n  .wrap{max-width:1100px;margin:0 auto;padding-block:26px 44px;padding-inline:20px;}\n  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}\n  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--rms);font-weight:500;margin:0 0 6px;}\n  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(27px,4.4vw,40px);line-height:1.04;margin:0;letter-spacing:-.01em;text-wrap:balance;}\n  .sub{color:var(--muted);font-size:15px;margin:8px 0 0;max-width:80ch;text-wrap:pretty;}\n  .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}\n  .toggles{display:flex;gap:8px;flex-shrink:0;}\n  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}\n  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}\n  .tg:focus-visible,button:focus-visible{outline:2px solid var(--rms);outline-offset:2px;}\n\n  .sectionhead{display:flex;align-items:baseline;gap:11px;margin:26px 0 2px;}\n  .sectionhead .num{font-family:var(--font-m);font-size:12px;font-weight:500;color:#fff;border-radius:7px;padding:3px 9px;line-height:1;}\n  .sectionhead .num.a{background:var(--warn);} .sectionhead .num.b{background:var(--catch);}\n  .sectionhead h2{font-family:var(--font-d);font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em;}\n  .seclead{color:var(--muted);font-size:13.5px;margin:6px 0 12px;max-width:82ch;text-wrap:pretty;}\n  .seclead b{color:var(--ink);font-weight:600;} .seclead i{font-family:var(--font-d);font-style:italic;}\n\n  .framing{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);}\n  .framing h2{font-family:var(--font-d);font-weight:600;font-size:19px;margin:0 0 4px;letter-spacing:-.01em;}\n  .framing .frlead{color:var(--muted);font-size:13.5px;margin:0 0 14px;text-wrap:pretty;}\n  .framing i{font-family:var(--font-d);font-style:italic;} .framing b{color:var(--ink);font-weight:600;}\n  .frtwo{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n  @media(max-width:640px){.frtwo{grid-template-columns:1fr;}}\n  .frbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;}\n  .frbox h3{font-family:var(--font-d);font-weight:600;font-size:14.5px;margin:0 0 5px;}\n  .frbox p{font-size:12.8px;color:var(--muted);margin:0;text-wrap:pretty;}\n  .frlink{color:var(--muted);font-size:13px;margin:13px 0;text-wrap:pretty;}\n  .frtwo.levers{margin-top:2px;}\n  .frtwo.levers .lev1{border-left:3px solid var(--warn);} .frtwo.levers .lev1 h3{color:var(--warn);}\n  .frtwo.levers .lev2{border-left:3px solid var(--catch);} .frtwo.levers .lev2 h3{color:var(--catch);}\n  .example{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--catch);border-radius:12px;padding:13px 17px;font-size:13px;color:var(--muted);text-wrap:pretty;}\n  .example b{color:var(--ink);font-weight:600;} .example i{font-family:var(--font-d);font-style:italic;}\n\n  .split{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:stretch;}\n  @media (max-width:760px){.split{grid-template-columns:1fr;}}\n  .presets{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px;}\n  .pz{font-family:var(--font-b);font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:8px 13px;cursor:pointer;box-shadow:var(--shadow);}\n  .pz:hover{color:var(--ink);border-color:var(--faint);}\n  .pz.on{border-color:var(--rms);color:var(--ink);box-shadow:0 0 0 1px var(--rms) inset,var(--shadow);}\n  .pz .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}\n\n  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}\n  @media (max-width:760px){.grid{grid-template-columns:1fr;}}\n  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px 10px;}\n  .panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap;}\n  .panel .nm{font-family:var(--font-d);font-weight:600;font-size:16.5px;}\n  .panel .hint{font-size:11px;font-family:var(--font-m);color:var(--faint);}\n  .panel svg{display:block;width:100%;height:auto;touch-action:none;}\n  .panel svg text{font-family:var(--font-b);}\n  .axis line{stroke:var(--grid);} .axis text{fill:var(--faint);font-size:10px;font-family:var(--font-m);}\n  .axlab{fill:var(--muted);font-size:11px;font-family:var(--font-d);font-style:italic;}\n  .guide{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3;opacity:.7;}\n  .grip{cursor:grab;} .grip:active{cursor:grabbing;}\n  .sidebox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;justify-content:center;text-wrap:pretty;}\n  .sidebox p{margin:0 0 10px;} .sidebox p:last-child{margin:0;}\n  .sidebox b{color:var(--ink);font-weight:600;} .sidebox i{font-family:var(--font-d);font-style:italic;}\n  .sidebox .tagline{font-family:var(--font-m);font-size:11px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px;margin-top:2px;}\n\n  .eqnote{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 18px;font-size:12.5px;color:var(--muted);line-height:1.5;text-wrap:pretty;}\n  .eqnote b{color:var(--ink);font-weight:600;} .eqnote i{font-family:var(--font-d);font-style:italic;}\n  .readout{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:14px;padding:13px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);font-family:var(--font-m);font-size:12.5px;color:var(--muted);}\n  .readout .r b{color:var(--ink);font-weight:600;}\n  .verdict{margin-top:14px;border-radius:12px;padding:13px 18px;font-size:13.5px;border:1px solid var(--line);border-left-width:4px;background:var(--panel);color:var(--muted);text-wrap:pretty;}\n  .verdict.ok{border-left-color:var(--catch);} .verdict.bad{border-left-color:var(--warn);} .verdict.edge{border-left-color:var(--rms);}\n  .verdict b{color:var(--ink);font-weight:600;} .verdict i{font-family:var(--font-d);font-style:italic;}\n\n  .callout{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--rms);border-radius:12px;padding:14px 18px;font-size:13px;color:var(--muted);text-wrap:pretty;}\n  .callout b{color:var(--ink);font-weight:600;} .callout i{font-family:var(--font-d);font-style:italic;}\n  footer{margin-top:22px;color:var(--faint);font-size:11.5px;text-align:center;text-wrap:balance;}\n<\/style>\n\n<div class=\"wrap\">\n  <header>\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\">Notre pression sur l'écosystème · modèle de Verhulst<\/p>\n      <h1 data-t=\"title\">L'empreinte soutenable<\/h1>\n      <p class=\"sub\" data-t=\"sub\"><\/p>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" aria-label=\"langue\"><span aria-hidden=\"true\">⇄<\/span><span id=\"langlbl\">FR<\/span><\/button>\n      <button class=\"tg\" id=\"theme\" aria-label=\"thème\">◐<\/button>\n    <\/div>\n  <\/header>\n\n  <!-- Cadre : deux capacités de charge, deux leviers -->\n  <div class=\"framing\">\n    <h2 data-t=\"frT\">Deux capacités de charge, deux leviers<\/h2>\n    <p class=\"frlead\" data-t=\"frLead\"><\/p>\n    <div class=\"frtwo\">\n      <div class=\"frbox\"><h3 data-t=\"frAt\">① Notre capacité de charge<\/h3><p data-t=\"frAb\"><\/p><\/div>\n      <div class=\"frbox\"><h3 data-t=\"frBt\">② Celle des ressources<\/h3><p data-t=\"frBb\"><\/p><\/div>\n    <\/div>\n    <p class=\"frlink\" data-t=\"frLink\"><\/p>\n    <div class=\"frtwo levers\">\n      <div class=\"frbox lev1\"><h3 data-t=\"frL1t\">1 · Non renouvelables<\/h3><p data-t=\"frL1b\"><\/p><\/div>\n      <div class=\"frbox lev2\"><h3 data-t=\"frL2t\">2 · Renouvelables<\/h3><p data-t=\"frL2b\"><\/p><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Section 1 : non renouvelable -->\n  <div class=\"sectionhead\"><span class=\"num a\">1<\/span><h2 data-t=\"sec1t\">Gérer une ressource non renouvelable<\/h2><\/div>\n  <p class=\"seclead\" data-t=\"sec1lead\"><\/p>\n  <div class=\"split\">\n    <div class=\"panel\">\n      <div class=\"ph\"><span class=\"nm\" data-t=\"dep_t\">Un stock qui ne fait que baisser<\/span><span class=\"hint\" data-t=\"dep_h\">le flux de prise fixe la pente<\/span><\/div>\n      <svg id=\"deplete\" viewBox=\"0 0 460 300\" role=\"img\" aria-label=\"Épuisement d'un stock non renouvelable sous deux rythmes de prise\"><\/svg>\n    <\/div>\n    <div class=\"sidebox\" id=\"sec1box\"><\/div>\n  <\/div>\n\n  <!-- Section 2 : renouvelable -->\n  <div class=\"sectionhead\"><span class=\"num b\">2<\/span><h2 data-t=\"sec2t\">Gérer une ressource renouvelable : le RMS<\/h2><\/div>\n  <p class=\"seclead\" data-t=\"sec2lead\"><\/p>\n  <div class=\"eqnote\" data-t=\"eqnote\"><\/div>\n  <div class=\"presets\" id=\"presets\"><\/div>\n  <div class=\"grid\">\n    <div class=\"panel\">\n      <div class=\"ph\"><span class=\"nm\" data-t=\"pAt\">Le surplus régénéré <i>G(N)<\/i><\/span><span class=\"hint\" data-t=\"pAh\">glissez la prise ▲▼ et le stock ◀▶<\/span><\/div>\n      <svg id=\"curve\" viewBox=\"0 0 460 320\" role=\"img\" aria-label=\"Courbe de production soutenable G(N) et ligne de prise\"><\/svg>\n    <\/div>\n    <div class=\"panel\">\n      <div class=\"ph\"><span class=\"nm\" data-t=\"pBt\">La trajectoire du stock <i>N(t)<\/i><\/span><span class=\"hint\" data-t=\"pBh\">simulation à prise constante<\/span><\/div>\n      <svg id=\"traj\" viewBox=\"0 0 460 320\" role=\"img\" aria-label=\"Trajectoire du stock dans le temps\"><\/svg>\n    <\/div>\n  <\/div>\n  <div class=\"readout\" id=\"readout\"><\/div>\n  <div class=\"verdict\" id=\"verdict\"><\/div>\n\n  <div class=\"callout\" data-t=\"callout\"><\/div>\n\n  <div class=\"example\" data-t=\"sec2ex\"><\/div>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  var K=1000, r=0.6;\n  var RMS=r*K/4;            // = 150, atteint en N=K/2\n  var C=118;               // prise courante (renouvelable)\n  var N0=900;              // stock de départ\n  var LANG='fr'; try{var s=localStorage.getItem('rms_lang'); if(s)LANG=s;}catch(e){}\n\n  var PRESETS=[\n    {key:\"sust\", C:118, N0:900, col:\"var(--catch)\"},\n    {key:\"msy\",  C:150, N0:900, col:\"var(--rms)\"},\n    {key:\"over\", C:170, N0:900, col:\"var(--warn)\"},\n    {key:\"depl\", C:118, N0:100, col:\"var(--warn)\"}\n  ];\n  var activePreset=\"sust\";\n\n  var STR={\n    fr:{eyebrow:\"Notre pression sur l'écosystème · modèle de Verhulst\",\n      title:\"L'empreinte soutenable\",\n      sub:\"Toute activité <b>prélève<\/b> des ressources et <b>rejette<\/b> des déchets : c'est notre <b>empreinte<\/b> sur l'écosystème. Comme toute espèce, nous avons une <b>capacité de charge<\/b> à ne pas dépasser. La tenir suppose de bien gérer les deux grands types de ressources — <b>non renouvelables<\/b> et <b>renouvelables<\/b>. Pour ces dernières, un repère précis : le <b>RMS<\/b>.\",\n      // cadre\n      frT:\"Deux capacités de charge, deux leviers\",\n      frLead:\"Avant tout modèle, le cadre. Il faut distinguer <b>deux<\/b> capacités de charge — la nôtre, et celle de chaque ressource —, puis voir de quoi dépend notre marge de manœuvre.\",\n      frAt:\"① Notre capacité de charge\",\n      frAb:\"Comme toute espèce, l'humanité a une <b>capacité de charge<\/b> sur l'écosystème. Au-delà d'un certain prélèvement, la pression devient intenable : on bascule vers un <b>scénario exponentiel<\/b> puis un <b>effondrement<\/b>. Notre empreinte doit rester <b>sous<\/b> cette limite.\",\n      frBt:\"② Celle des ressources\",\n      frBb:\"Nous prélevons sur des ressources qui ont leur <b>propre stock<\/b>. Pour une espèce vivante, ce stock est borné par <b>sa<\/b> capacité de charge dans son écosystème : il ne peut pas y avoir plus de poissons dans une rivière que ce qu'elle apporte en <b>nourriture<\/b>.\",\n      frLink:\"Les deux sont <b>emboîtées<\/b> mais distinctes : la nôtre est <b>agrégée<\/b>, celle de chaque ressource est <b>locale<\/b>. Tenir la nôtre passe par bien gérer chaque ressource — selon qu'elle se régénère ou non. Deux leviers :\",\n      frL1t:\"1 · Non renouvelables\",\n      frL1b:\"Pas de régénération : tout prélèvement épuise le stock. Seul levier — <b>ralentir l'épuisement<\/b> : le <b>recyclage<\/b> (réinjecter la matière) et le <b>rationnement<\/b> par les <b>prix<\/b> et/ou les <b>quantités<\/b>.\",\n      frL2t:\"2 · Renouvelables\",\n      frL2b:\"Le stock se reproduit : on peut prélever <b>le maximum sans l'épuiser<\/b>, en laissant <b>intacte sa capacité de régénération<\/b>. Ce maximum a un nom — le <b>rendement maximal soutenable (RMS)<\/b>, détaillé plus bas.\",\n      // section 1\n      sec1t:\"Gérer une ressource non renouvelable\",\n      sec1lead:\"Énergies fossiles, minerais : le <b>stock<\/b> est fixe, il ne se reproduit pas. Toute prise est une <b>ponction nette<\/b> — le flux ne fait que vider le réservoir. Il n'existe <b>aucun niveau de prise soutenable<\/b> : seul change le <b>rythme<\/b> auquel on épuise la réserve.\",\n      dep_t:\"Un stock qui ne fait que baisser\", dep_h:\"le flux de prise fixe la pente\",\n      depAxT:\"temps\", depAxS:\"réserve restante\", depFull:\"réserve initiale\",\n      depSlow:\"prise faible\", depFast:\"prise forte\", depEnd:\"épuisement\",\n      sec1box:[\n        \"<b>Stock<\/b> (la réserve, en tonnes) et <b>flux<\/b> (la prise, en tonnes par an) sont deux grandeurs distinctes. Sans régénération, le flux se <b>soustrait<\/b> directement au stock.\",\n        \"Doubler la prise ne fait que <b>rapprocher l'échéance<\/b> : la pente est plus raide, l'épuisement plus précoce. La seule marge d'action est le <b>rythme<\/b>. Deux leviers pour l'étaler dans le temps : <b>recycler<\/b> (réinjecter la matière) et <b>rationner<\/b> la prise, par les <b>prix<\/b> ou des <b>quotas<\/b>.\",\n        \"<span class='tagline'>Ici le flux ne rencontre aucun surplus : il n'y a pas de RMS.<\/span>\"\n      ],\n      // section 2\n      sec2t:\"Gérer une ressource renouvelable : le RMS\",\n      sec2ex:\"<b>Un exemple végétal.<\/b> Même logique pour les cultures : on ne peut pas <b>étendre les terres cultivées à l'infini<\/b>. Déboiser au-delà d'un seuil <b>déséquilibre le cycle du carbone<\/b> et épuise une autre ressource — les prélèvements passent au-dessus de la régénération d'un stock. C'est un <b>déplacement<\/b> du problème, pas une solution. Et les terres ont une <b>productivité marginale décroissante<\/b> : chaque hectare gagné rapporte de moins en moins.\",\n      sec2lead:\"Prenons l'exemple de la <b>pêche<\/b> pour l'illustrer. Un stock vivant se <b>reproduit<\/b> : chaque année il régénère un surplus <i>G(N) = rN(1−N/K)<\/i>. Ce surplus — nul quand le stock est vide (<i>N=0<\/i>) comme quand il sature (<i>N=K<\/i>) — est <b>maximal à mi-chemin, <i>N=K/2<\/i><\/b>. Prélever exactement ce surplus laisse le stock intact : c'est le <b>rendement maximal soutenable (RMS)<\/b>. La prise (un <b>flux<\/b>) se lit comme une <b>droite horizontale<\/b> ; ses intersections avec la courbe du surplus sont les équilibres. Faites-la glisser.\",\n      eqnote:\"<b>Lire les deux points.<\/b> Là où la prise croise le surplus, <b>régénération = prise<\/b> : ce sont des équilibres. Entre les deux, <i>G&gt;C<\/i> — le surplus dépasse la prise, le stock <b>croît<\/b> (→) ; au-delà de <i>N₊<\/i>, <i>G&lt;C<\/i>, il <b>décroît<\/b> (←). Le stock converge donc vers <b><i>N₊<\/i> (à droite), l'équilibre soutenable<\/b> où il s'installe tout seul : la prise n'entame que le surplus. <b><i>N₋<\/i> (à gauche) est un seuil<\/b> : en dessous, la régénération ne compense plus la prise et le stock <b>s'effondre<\/b>. Le <b>stock de départ <i>N₀<\/i><\/b> (repère sur les deux graphes) doit donc rester <b>au-dessus de <i>N₋<\/i><\/b>.\",\n      pAt:\"Le surplus régénéré <i>G(N)<\/i>\", pAh:\"glissez la prise C ▲▼\",\n      pBt:\"La trajectoire du stock <i>N(t)<\/i>\", pBh:\"glissez le stock de départ ▲▼\",\n      axN:\"stock N — état de la ressource (biomasse)\", axG:\"flux par an — régénération & prise\", axT:\"temps\", axNt:\"stock N (biomasse)\",\n      lblRms:\"RMS\", lblCatch:\"prise C (flux)\", lblNeq:\"N₊ stable\", lblNun:\"N₋ seuil\", lblN0:\"N₀\",\n      tagStock:\"STOCK →\", tagFlux:\"↑ FLUX\", surplusLbl:\"surplus max = RMS\",\n      growLbl:\"le stock se reconstitue\", declLbl:\"il décline\",\n      rC:\"Prise C\", rRms:\"RMS = rK/4\", rNm:\"Seuil N₋\", rNp:\"Équilibre stable N₊\", rNone:\"—\",\n      presets:[{t:\"Pêche soutenable\"},{t:\"Pile au RMS\"},{t:\"Surpêche (prise > RMS)\"},{t:\"Stock appauvri (sous le seuil)\"}],\n      vOk:\"<b>Cas soutenable.<\/b> Prise sous le RMS et stock de départ au-dessus de <i>N₋<\/i> : le stock converge vers <i>N₊<\/i> et la pêche se maintient.\",\n      vDepl:\"<b>Oui — c'est aussi de la surpêche.<\/b> On prélève plus que le stock ne régénère (<i>G&lt;C<\/i>). La différence avec le cas précédent : ici la prise <b>reste sous le RMS<\/b> — elle serait soutenable pour un stock sain — mais le stock part <b>sous le seuil <i>N₋<\/i><\/b>, où le surplus régénéré est trop faible. Résultat : effondrement. <i>N₋<\/i> est un <b>point de non-retour<\/b> ; pour remonter, il faudrait pêcher <b>sous ce faible surplus<\/b> et laisser le stock repasser au-dessus de <i>N₋<\/i>.\",\n      vEdge:\"<b>Sur le fil du rasoir.<\/b> Prise exactement égale au RMS : un <b>unique<\/b> équilibre, en <i>N=K/2<\/i>, et il est <b>instable<\/b>. La moindre baisse du stock — ou de la productivité — fait basculer vers l'effondrement. Viser le RMS pile, c'est ne se garder aucune marge.\",\n      vOver:\"<b>Dépassement.<\/b> Prise <b>supérieure au RMS<\/b> : la droite passe au-dessus de la courbe, aucune intersection. Partout <i>G&lt;C<\/i> : quel que soit le stock de départ, la régénération ne suit jamais et le stock <b>s'effondre<\/b>. Aucune prise au-dessus du RMS n'est soutenable.\",\n      callout:\"<b>Capacité de charge → capacité de prise.<\/b> La capacité de charge <i>K<\/i> est une propriété du <b>stock<\/b> ; le RMS en est la traduction en <b>flux<\/b> — la <b>capacité de prise<\/b> maximale que l'écosystème peut supporter durablement. Deux leçons que la lecture graphique rend évidentes : l'équilibre soutenable se situe <b>à <i>K/2<\/i> ou au-dessus<\/b> (côté <i>N₊<\/i>) — <i>K/2<\/i> est l'<b>optimum économique<\/b> (rendement maximal, le RMS), mais un point de bascule instable, d'où l'intérêt de se tenir un peu au-dessus, avec une marge ; et <b>dépasser le RMS ne fait rien gagner durablement<\/b> — tout dépassement doit être compensé par une période de prise <b>sous<\/b> le RMS, si bien que la prise moyenne de long terme ne peut jamais l'excéder.\",\n      foot:\"Modèle de Schaefer (production excédentaire) dérivé de la logistique de Verhulst. r = 0,6 · K = 1000 (unités arbitraires). Illustration pédagogique.\"\n    },\n    en:{eyebrow:\"Our pressure on the ecosystem · Verhulst model\",\n      title:\"The sustainable footprint\",\n      sub:\"Any activity <b>draws<\/b> resources and <b>dumps<\/b> waste: that is our <b>footprint<\/b> on the ecosystem. Like any species, we have a <b>carrying capacity<\/b> not to exceed. Holding it means managing the two great types of resource well — <b>non-renewable<\/b> and <b>renewable<\/b>. For the latter, a precise benchmark: the <b>MSY<\/b>.\",\n      frT:\"Two carrying capacities, two levers\",\n      frLead:\"Before any model, the frame. We must distinguish <b>two<\/b> carrying capacities — ours, and that of each resource — then see what our room for manoeuvre depends on.\",\n      frAt:\"① Our carrying capacity\",\n      frAb:\"Like any species, humanity has a <b>carrying capacity<\/b> on the ecosystem. Beyond a certain draw, the pressure becomes untenable: it tips into an <b>exponential scenario<\/b> then a <b>collapse<\/b>. Our footprint must stay <b>below<\/b> this limit.\",\n      frBt:\"② That of the resources\",\n      frBb:\"We draw on resources that have their <b>own stock<\/b>. For a living species, that stock is bounded by <b>its<\/b> carrying capacity in its ecosystem: there can be no more fish in a river than the <b>food<\/b> the river supplies.\",\n      frLink:\"The two are <b>nested<\/b> but distinct: ours is <b>aggregate<\/b>, each resource's is <b>local<\/b>. Holding ours runs through managing each resource well — depending on whether it regrows or not. Two levers:\",\n      frL1t:\"1 · Non-renewable\",\n      frL1b:\"No regrowth: any draw depletes the stock. The only lever — <b>slow the depletion<\/b>: <b>recycling<\/b> (reinjecting matter) and <b>rationing<\/b> by <b>price<\/b> and/or <b>quantity<\/b>.\",\n      frL2t:\"2 · Renewable\",\n      frL2b:\"The stock reproduces: you can take <b>the most without depleting it<\/b>, leaving its <b>regeneration capacity intact<\/b>. That maximum has a name — the <b>maximum sustainable yield (MSY)<\/b>, detailed below.\",\n      sec1t:\"Managing a non-renewable resource\",\n      sec1lead:\"Fossil fuels, ores: the <b>stock<\/b> is fixed, it does not reproduce. Any catch is a <b>net withdrawal<\/b> — the flow only empties the reservoir. There is <b>no sustainable catch level<\/b>: only the <b>rate<\/b> at which the reserve is used up changes.\",\n      dep_t:\"A stock that only falls\", dep_h:\"the catch flow sets the slope\",\n      depAxT:\"time\", depAxS:\"reserve remaining\", depFull:\"initial reserve\",\n      depSlow:\"low catch\", depFast:\"high catch\", depEnd:\"exhaustion\",\n      sec1box:[\n        \"<b>Stock<\/b> (the reserve, in tonnes) and <b>flow<\/b> (the catch, in tonnes per year) are two distinct quantities. With no regrowth, the flow is <b>subtracted<\/b> straight from the stock.\",\n        \"Doubling the catch merely <b>brings the deadline forward<\/b>: a steeper slope, earlier exhaustion. The only lever is the <b>rate<\/b>. Two ways to stretch it out in time: <b>recycle<\/b> (reinject matter) and <b>ration<\/b> the draw, by <b>price<\/b> or <b>quotas<\/b>.\",\n        \"<span class='tagline'>Here the flow meets no surplus: there is no MSY.<\/span>\"\n      ],\n      sec2t:\"Managing a renewable resource: the MSY\",\n      sec2ex:\"<b>A plant example.<\/b> Same logic for crops: you cannot <b>extend farmland infinitely<\/b>. Clearing forest beyond a threshold <b>unbalances the carbon cycle<\/b> and depletes another resource — the draw rises above a stock's regeneration. It is a <b>displacement<\/b> of the problem, not a solution. And land has <b>decreasing marginal productivity<\/b>: each hectare gained yields less and less.\",\n      sec2lead:\"Take <b>fishing<\/b> as the illustration. A living stock <b>reproduces<\/b>: each year it regrows a surplus <i>G(N) = rN(1−N/K)<\/i>. This surplus — zero when the stock is empty (<i>N=0<\/i>) as when it saturates (<i>N=K<\/i>) — is <b>largest half-way, <i>N=K/2<\/i><\/b>. Taking exactly that surplus leaves the stock intact: the <b>maximum sustainable yield (MSY)<\/b>. The catch (a <b>flow<\/b>) reads as a <b>horizontal line<\/b>; its intersections with the surplus curve are the equilibria. Drag it.\",\n      eqnote:\"<b>Reading the two points.<\/b> Where the catch meets the surplus, <b>regrowth = catch<\/b>: these are equilibria. Between them, <i>G&gt;C<\/i> — the surplus exceeds the catch, the stock <b>grows<\/b> (→); beyond <i>N₊<\/i>, <i>G&lt;C<\/i>, it <b>shrinks<\/b> (←). So the stock converges to <b><i>N₊<\/i> (right), the sustainable equilibrium<\/b> where it settles on its own: the catch only takes the surplus. <b><i>N₋<\/i> (left) is a threshold<\/b>: below it, regrowth no longer offsets the catch and the stock <b>collapses<\/b>. So the <b>starting stock <i>N₀<\/i><\/b> (marked on both graphs) must stay <b>above <i>N₋<\/i><\/b>.\",\n      pAt:\"The regrown surplus <i>G(N)<\/i>\", pAh:\"drag the catch C ▲▼\",\n      pBt:\"The stock trajectory <i>N(t)<\/i>\", pBh:\"drag the starting stock ▲▼\",\n      axN:\"stock N — state of the resource (biomass)\", axG:\"flow per year — regrowth & catch\", axT:\"time\", axNt:\"stock N (biomass)\",\n      lblRms:\"MSY\", lblCatch:\"catch C (flow)\", lblNeq:\"N₊ stable\", lblNun:\"N₋ threshold\", lblN0:\"N₀\",\n      tagStock:\"STOCK →\", tagFlux:\"↑ FLOW\", surplusLbl:\"max surplus = MSY\",\n      growLbl:\"the stock rebuilds\", declLbl:\"it declines\",\n      rC:\"Catch C\", rRms:\"MSY = rK/4\", rNm:\"Threshold N₋\", rNp:\"Stable equilibrium N₊\", rNone:\"—\",\n      presets:[{t:\"Sustainable catch\"},{t:\"Exactly at MSY\"},{t:\"Overfishing (C > MSY)\"},{t:\"Depleted stock (below threshold)\"}],\n      vOk:\"<b>Sustainable case.<\/b> Catch below MSY and starting stock above <i>N₋<\/i>: the stock converges to <i>N₊<\/i> and the fishery holds.\",\n      vDepl:\"<b>Yes — this is overfishing too.<\/b> The catch exceeds what the stock regrows (<i>G&lt;C<\/i>). The difference from the previous case: here the catch <b>stays below MSY<\/b> — it would be sustainable for a healthy stock — but the stock starts <b>below the threshold <i>N₋<\/i><\/b>, where the regrown surplus is too small. Result: collapse. <i>N₋<\/i> is a <b>point of no return<\/b>; to recover, you would have to fish <b>below that small surplus<\/b> and let the stock climb back above <i>N₋<\/i>.\",\n      vEdge:\"<b>On a knife-edge.<\/b> Catch exactly equal to MSY: a <b>single<\/b> equilibrium at <i>N=K/2<\/i>, and it is <b>unstable<\/b>. Any dip in the stock — or in productivity — tips it into collapse. Aiming right at MSY leaves no margin.\",\n      vOver:\"<b>Overshoot.<\/b> Catch <b>above MSY<\/b>: the line sits above the curve, no intersection. Everywhere <i>G&lt;C<\/i>: whatever the starting stock, regrowth never keeps up and the stock <b>collapses<\/b>. No catch above MSY is sustainable.\",\n      callout:\"<b>Carrying capacity → catch capacity.<\/b> Carrying capacity <i>K<\/i> is a property of the <b>stock<\/b>; MSY is its counterpart in <b>flow<\/b> — the maximum <b>catch capacity<\/b> the ecosystem can bear indefinitely. Two lessons the graphical reading makes obvious: the sustainable equilibrium sits <b>at <i>K/2<\/i> or above<\/b> (the <i>N₊<\/i> side) — <i>K/2<\/i> is the <b>economic optimum<\/b> (maximum yield, the MSY), but an unstable tipping point, so in practice one keeps a little above it, with a margin; and <b>overshooting MSY gains nothing lasting<\/b> — any overshoot must be repaid by a spell of catching <b>below<\/b> MSY, so long-run average catch can never exceed it.\",\n      foot:\"Schaefer surplus-production model derived from the Verhulst logistic. r = 0.6 · K = 1000 (arbitrary units). Teaching illustration.\"\n    }\n  };\n\n  function cvar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}\n  function mk(t,a){var e=document.createElementNS(\"http://www.w3.org/2000/svg\",t);for(var k in a)e.setAttribute(k,a[k]);return e;}\n  function G(N){return r*N*(1-N/K);}\n  function equil(){ if(C>RMS) return null; var d=Math.sqrt(Math.max(0,1-C/RMS)); return {lo:K/2*(1-d), hi:K/2*(1+d)}; }\n  function arrow(svg,x1,y,x2,y2,col){\n    svg.appendChild(mk('line',{x1:x1,y1:y,x2:x2,y2:y2,stroke:col,'stroke-width':2,'stroke-linecap':'round'}));\n    var dir=(x2<x1)?-1:1, ah=4.5;\n    svg.appendChild(mk('path',{d:'M '+x2+' '+y2+' l '+(-dir*ah)+' '+(-ah)+' M '+x2+' '+y2+' l '+(-dir*ah)+' '+ah,stroke:col,'stroke-width':2,'stroke-linecap':'round',fill:'none'}));\n  }\n\n  // shared geometry (curve + traj)\n  var Wc=460,Hc=320,pL=48,pR=18,pT=22,pB=42;\n  var ax0=pL,ax1=Wc-pR,ay0=pT,ay1=Hc-pB;\n  var gMax=RMS*1.28;\n  function NX(N){return ax0+(N/K)*(ax1-ax0);}\n  function GY(g){return ay1-(g/gMax)*(ay1-ay0);}\n  function NXinv(px){return (px-ax0)/(ax1-ax0)*K;}\n  function GYinv(py){return (ay1-py)/(ay1-ay0)*gMax;}\n\n  // ---------- Section 1 : depletion ----------\n  function drawDeplete(){\n    var d=STR[LANG];\n    var W=460,H=300,qL=46,qR=64,qT=20,qB=40;\n    var x0=qL,x1=W-qR,y0=qT,y1=H-qB;\n    var Tmax=100, S0=100;\n    var slowEnd=82, fastEnd=42;   // années jusqu'à épuisement\n    var TX=function(t){return x0+(t/Tmax)*(x1-x0);};\n    var SY=function(s){return y1-(s/(S0*1.05))*(y1-y0);};\n    var svg=document.getElementById('deplete');\n    while(svg.firstChild) svg.removeChild(svg.firstChild);\n    var g=mk('g',{class:'axis'});\n    [0,25,50,75,100].forEach(function(s){var yy=SY(s); g.appendChild(mk('line',{x1:x0,y1:yy,x2:x1,y2:yy,stroke:'var(--grid)'}));\n      var tx=mk('text',{x:x0-7,y:yy+3,'text-anchor':'end'}); tx.textContent=s; g.appendChild(tx);});\n    [0,50,100].forEach(function(t){var xx=TX(t); var tx=mk('text',{x:xx,y:y1+14,'text-anchor':(t===0?'start':t===100?'end':'middle')}); tx.textContent=t; g.appendChild(tx);});\n    svg.appendChild(g);\n    var xl=mk('text',{x:(x0+x1)/2,y:H-4,'text-anchor':'middle',class:'axlab'}); xl.textContent=d.depAxT; svg.appendChild(xl);\n    var yl=mk('text',{x:13,y:(y0+y1)/2,'text-anchor':'middle',class:'axlab',transform:'rotate(-90 13 '+((y0+y1)/2)+')'}); yl.textContent=d.depAxS; svg.appendChild(yl);\n    // initial reserve marker\n    svg.appendChild(mk('line',{x1:x0,y1:SY(S0),x2:x1,y2:SY(S0),class:'guide'}));\n    var fl=mk('text',{x:x1,y:SY(S0)-5,'text-anchor':'end',fill:'var(--faint)','font-size':10.5,'font-family':'var(--font-m)'}); fl.textContent=d.depFull; svg.appendChild(fl);\n    // two depletion lines\n    function depline(Tend,col,lbl,lf){\n      svg.appendChild(mk('path',{d:'M '+TX(0)+' '+SY(S0)+' L '+TX(Tend)+' '+SY(0),fill:'none',stroke:col,'stroke-width':2.6,'stroke-linecap':'round'}));\n      svg.appendChild(mk('circle',{cx:TX(Tend),cy:SY(0),r:3.6,fill:col,stroke:'var(--surface)','stroke-width':1.4}));\n      // label along the line at fraction lf\n      var lt=Tend*lf, ly=S0*(1-lt/Tend);\n      var tx=mk('text',{x:TX(lt)+7,y:SY(ly)-6,fill:col,'font-size':11,'font-family':'var(--font-m)','font-weight':600}); tx.textContent=lbl; svg.appendChild(tx);\n      // exhaustion label (own row, below the time ticks)\n      var et=mk('text',{x:TX(Tend),y:SY(0)+26,'text-anchor':'middle',fill:col,'font-size':9.5,'font-family':'var(--font-m)'}); et.textContent=d.depEnd; svg.appendChild(et);\n    }\n    depline(fastEnd,'var(--warn)',d.depFast,0.34);\n    depline(slowEnd,'var(--stock)',d.depSlow,0.62);\n  }\n\n  // ---------- Section 2 : curve ----------\n  function drawCurve(){\n    var d=STR[LANG];\n    var svg=document.getElementById('curve');\n    while(svg.firstChild) svg.removeChild(svg.firstChild);\n    var eq=equil();\n    var g=mk('g',{class:'axis'});\n    [0,50,100,150].forEach(function(t){var yy=GY(t); g.appendChild(mk('line',{x1:ax0,y1:yy,x2:ax1,y2:yy,stroke:'var(--grid)'}));\n      var tx=mk('text',{x:ax0-7,y:yy+3,'text-anchor':'end'}); tx.textContent=t; g.appendChild(tx);});\n    [[0,'0'],[K/2,'K/2'],[K,'K']].forEach(function(p){var xx=NX(p[0]); g.appendChild(mk('line',{x1:xx,y1:ay0,x2:xx,y2:ay1,stroke:'var(--grid)'}));\n      var tx=mk('text',{x:xx,y:ay1+14,'text-anchor':(p[0]===0?'start':p[0]===K?'end':'middle')}); tx.textContent=p[1]; g.appendChild(tx);});\n    svg.appendChild(g);\n    // axis labels + stock/flux tags\n    var xl=mk('text',{x:(ax0+ax1)/2,y:Hc-4,'text-anchor':'middle',class:'axlab'}); xl.textContent=d.axN; svg.appendChild(xl);\n    var yl=mk('text',{x:13,y:(ay0+ay1)/2,'text-anchor':'middle',class:'axlab',transform:'rotate(-90 13 '+((ay0+ay1)/2)+')'}); yl.textContent=d.axG; svg.appendChild(yl);\n\n    // parabola + fill\n    var pth='M ';\n    for(var N=0;N<=K+1;N+=8){ pth+=(N?'L ':'')+NX(N).toFixed(1)+' '+GY(G(N)).toFixed(1)+' '; }\n    var fillp=pth+'L '+NX(K).toFixed(1)+' '+GY(0).toFixed(1)+' L '+NX(0).toFixed(1)+' '+GY(0).toFixed(1)+' Z';\n    svg.appendChild(mk('path',{d:fillp,fill:'var(--curve)','fill-opacity':0.08}));\n    svg.appendChild(mk('path',{d:pth,fill:'none',stroke:'var(--curve)','stroke-width':2.4}));\n\n    // RMS point (sommet de la cloche) + guides vers les deux axes\n    var rx=NX(K/2), ry=GY(RMS);\n    svg.appendChild(mk('line',{x1:rx,y1:ry,x2:rx,y2:ay1,class:'guide'}));\n    svg.appendChild(mk('line',{x1:ax0,y1:ry,x2:rx,y2:ry,class:'guide'}));\n    svg.appendChild(mk('circle',{cx:rx,cy:ry,r:3.8,fill:'var(--rms)',stroke:'var(--surface)','stroke-width':1.5}));\n    var rl=mk('text',{x:rx+7,y:ry-7,fill:'var(--rms)','font-size':12,'font-family':'var(--font-m)','font-weight':600}); rl.textContent=d.lblRms; svg.appendChild(rl);\n\n    // catch line C\n    var cy=GY(C), over=(C>RMS), ccol=over?'var(--warn)':'var(--catch)';\n    svg.appendChild(mk('line',{x1:ax0,y1:cy,x2:ax1,y2:cy,stroke:ccol,'stroke-width':2.2,'stroke-dasharray':over?'6 4':'none'}));\n    var cl=mk('text',{x:ax0+4,y:cy-6,fill:ccol,'font-size':11.5,'font-family':'var(--font-m)','font-weight':600}); cl.textContent=d.lblCatch; svg.appendChild(cl);\n\n    // équilibres : les deux points où la prise C coupe la courbe du surplus\n    if(eq){\n      var yLo=GY(G(eq.lo)), yHi=GY(G(eq.hi));\n      // segment de la courbe où G > C (le stock peut se reconstituer) surligné\n      var hi='M ';\n      for(var N2=eq.lo;N2<=eq.hi;N2+=4){ hi+=(N2===eq.lo?'':'L ')+NX(N2).toFixed(1)+' '+GY(G(N2)).toFixed(1)+' '; }\n      svg.appendChild(mk('path',{d:hi,fill:'none',stroke:'var(--catch)','stroke-width':4,'stroke-linecap':'round',opacity:.28}));\n      svg.appendChild(mk('circle',{cx:NX(eq.hi),cy:yHi,r:4.6,fill:'var(--catch)',stroke:'var(--surface)','stroke-width':1.6}));\n      svg.appendChild(mk('circle',{cx:NX(eq.lo),cy:yLo,r:4.6,fill:'var(--surface)',stroke:'var(--warn)','stroke-width':2}));\n      var t2=mk('text',{x:NX(eq.lo),y:yLo+16,'text-anchor':'middle',fill:'var(--warn)','font-size':10,'font-family':'var(--font-m)'}); t2.textContent=d.lblNun; svg.appendChild(t2);\n      var t1=mk('text',{x:NX(eq.hi)+6,y:yHi-9,'text-anchor':'middle',fill:'var(--catch)','font-size':10,'font-family':'var(--font-m)'}); t1.textContent=d.lblNeq; svg.appendChild(t1);\n    }\n    // repère (lecture seule) du stock de départ N0 : montre s'il est au-dessus ou sous le seuil N₋\n    var nx=NX(N0), belowThr=(eq && N0<eq.lo), n0col=belowThr?'var(--warn)':'var(--stock)';\n    svg.appendChild(mk('line',{x1:nx,y1:ay0,x2:nx,y2:ay1,stroke:n0col,'stroke-width':1.4,'stroke-dasharray':'2 3',opacity:.8}));\n    svg.appendChild(mk('path',{d:'M '+(nx-5)+' '+(ay1+3)+' L '+(nx+5)+' '+(ay1+3)+' L '+nx+' '+(ay1-4)+' Z',fill:n0col}));\n    var n0l=mk('text',{x:nx,y:ay0-6,'text-anchor':'middle',fill:n0col,'font-size':11,'font-family':'var(--font-m)','font-weight':600}); n0l.textContent=d.lblN0; svg.appendChild(n0l);\n    // hit area : glisser la prise C verticalement\n    var hitC=mk('rect',{x:ax0,y:cy-12,width:ax1-ax0,height:24,fill:'transparent',class:'grip'}); hitC.dataset.drag='C'; svg.appendChild(hitC);\n  }\n\n  function simulate(){\n    var T=70, dt=0.15, N=N0, out=[N];\n    for(var t=dt;t<=T;t+=dt){ var dN=(G(N)-C)*dt; N=N+dN; if(N<0)N=0; out.push(N); }\n    return {out:out, T:T, dt:dt};\n  }\n  function drawTraj(){\n    var d=STR[LANG];\n    var svg=document.getElementById('traj');\n    while(svg.firstChild) svg.removeChild(svg.firstChild);\n    var sim=simulate(), out=sim.out, T=sim.T; var eq=equil();\n    var nMax=K*1.06;\n    var TX=function(t){return ax0+(t/T)*(ax1-ax0);};\n    var TY=function(n){return ay1-(n/nMax)*(ay1-ay0);};\n    var g=mk('g',{class:'axis'});\n    [0,250,500,750,1000].forEach(function(n){var yy=TY(n); g.appendChild(mk('line',{x1:ax0,y1:yy,x2:ax1,y2:yy,stroke:'var(--grid)'}));\n      var tx=mk('text',{x:ax0-7,y:yy+3,'text-anchor':'end'}); tx.textContent=n; g.appendChild(tx);});\n    [0,T/2,T].forEach(function(t){var xx=TX(t); var tx=mk('text',{x:xx,y:ay1+14,'text-anchor':(t===0?'start':t===T?'end':'middle')}); tx.textContent=Math.round(t); g.appendChild(tx);});\n    svg.appendChild(g);\n    var xl=mk('text',{x:(ax0+ax1)/2,y:Hc-4,'text-anchor':'middle',class:'axlab'}); xl.textContent=d.axT; svg.appendChild(xl);\n    var yl=mk('text',{x:13,y:(ay0+ay1)/2,'text-anchor':'middle',class:'axlab',transform:'rotate(-90 13 '+((ay0+ay1)/2)+')'}); yl.textContent=d.axNt; svg.appendChild(yl);\n    svg.appendChild(mk('line',{x1:ax0,y1:TY(K),x2:ax1,y2:TY(K),class:'guide'}));\n    var kl=mk('text',{x:ax \n    var d=STR[LANG];\n    drawDeplete(); drawCurve(); drawTraj();\n    var eq=equil();\n    document.getElementById('readout').innerHTML=\n      '<span class=\"r\"><b>'+d.rC+'<\/b> : '+fmt(C)+'<\/span>'+\n      '<span class=\"r\"><b>'+d.rRms+'<\/b> : '+fmt(RMS)+'<\/span>'+\n      '<span class=\"r\"><b>'+d.rNm+'<\/b> : '+(eq?fmt(eq.lo):d.rNone)+'<\/span>'+\n      '<span class=\"r\"><b>'+d.rNp+'<\/b> : '+(eq?fmt(eq.hi):d.rNone)+'<\/span>'+\n      '<span class=\"r\"><b>N₀<\/b> : '+fmt(N0)+'<\/span>';\n    var v=document.getElementById('verdict'), cls, html;\n    if(C>RMS+0.5){ cls='bad'; html=d.vOver; }\n    else if(C>RMS-0.8){ cls='edge'; html=d.vEdge; }\n    else if(eq && N0<eq.lo){ cls='bad'; html=d.vDepl; }\n    else { cls='ok'; html=d.vOk; }\n    v.className='verdict '+cls; v.innerHTML=html;\n    document.querySelectorAll('.pz').forEach(function(b){b.classList.toggle('on',b.dataset.k===activePreset);});\n  }\n\n  // dragging : prise C (sur la courbe) ou stock de départ N0 (sur la trajectoire)\n  var dragging=null, dragSvg=null;\n  function svgPt(svg,ev){var r=svg.getBoundingClientRect(); var vb=svg.viewBox.baseVal;\n    var cx=(ev.touches?ev.touches[0].clientX:ev.clientX), cy=(ev.touches?ev.touches[0].clientY:ev.clientY);\n    return {x:(cx-r.left)/r.width*vb.width, y:(cy-r.top)/r.height*vb.height};}\n  function onDown(ev){ var tgt=ev.target; if(tgt.dataset&&tgt.dataset.drag){ dragging=tgt.dataset.drag; dragSvg=tgt.ownerSVGElement; activePreset=null; ev.preventDefault(); onMove(ev); } }\n  function onMove(ev){ if(!dragging||!dragSvg) return; ev.preventDefault();\n    var p=svgPt(dragSvg,ev);\n    if(dragging==='C'){ C=Math.max(2,Math.min(gMax*0.99, GYinv(p.y))); }\n    else if(dragging==='N0'){ N0=TRAJ_TYinv(p.y); }\n    render();\n  }\n  function onUp(){ dragging=null; dragSvg=null; }\n  ['curve','traj'].forEach(function(id){ var el=document.getElementById(id);\n    el.addEventListener('mousedown',onDown); el.addEventListener('touchstart',onDown,{passive:false}); });\n  window.addEventListener('mousemove',onMove); window.addEventListener('touchmove',onMove,{passive:false});\n  window.addEventListener('mouseup',onUp); window.addEventListener('touchend',onUp);\n\n  function buildSideAndPresets(){\n    var d=STR[LANG];\n    document.getElementById('sec1box').innerHTML=d.sec1box.map(function(x){return '<p>'+x+'<\/p>';}).join('');\n    var box=document.getElementById('presets'); box.innerHTML='';\n    PRESETS.forEach(function(p,i){ var b=document.createElement('button'); b.className='pz'; b.dataset.k=p.key;\n      b.innerHTML='<span class=\"dot\" style=\"background:'+p.col+'\"><\/span>'+d.presets[i].t;\n      b.addEventListener('click',function(){ C=p.C; N0=p.N0; activePreset=p.key; render(); });\n      box.appendChild(b); });\n  }\n\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme');if(a)return a;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}\n  document.getElementById('theme').addEventListener('click',function(){document.documentElement.setAttribute('data-theme',effTheme()==='dark'?'light':'dark');try{localStorage.setItem('rms_theme',effTheme());}catch(e){}render();});\n  try{var stt=localStorage.getItem('rms_theme');if(stt)document.documentElement.setAttribute('data-theme',stt);}catch(e){}\n  function applyLang(){var d=STR[LANG];document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');if(d[k])el.innerHTML=d[k];});\n    document.getElementById('langlbl').textContent=LANG.toUpperCase(); buildSideAndPresets(); render();}\n  document.getElementById('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem('rms_lang',LANG);}catch(e){}applyLang();});\n\n  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(render);}\n  applyLang();\n})();\n<\/script>\n\n<\/body>\n<\/html>\n", "simulateur-prises-temps-reel.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Piloter les prises en temps réel<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;\n    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n    --curve:#2A78D6;--rms:#C08A00;--catch:#2E8B57;--warn:#C0392B;--stock:#2A78D6;\n    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);\n    --font-d:\"Spectral\",Georgia,serif;--font-b:\"IBM Plex Sans\",system-ui,sans-serif;--font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n  }\n  :root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;\n    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --curve:#3987E5;--rms:#D6A83A;--catch:#41A76D;--warn:#E0705F;--stock:#3987E5;\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }}\n  :root[data-theme=\"dark\"]{\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;\n    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --curve:#3987E5;--rms:#D6A83A;--catch:#41A76D;--warn:#E0705F;--stock:#3987E5;\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}\n  .wrap{max-width:1100px;margin:0 auto;padding-block:26px 44px;padding-inline:20px;}\n  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}\n  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--catch);font-weight:500;margin:0 0 6px;}\n  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(27px,4.4vw,40px);line-height:1.04;margin:0;letter-spacing:-.01em;text-wrap:balance;}\n  .sub{color:var(--muted);font-size:15px;margin:8px 0 0;max-width:82ch;text-wrap:pretty;}\n  .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}\n  .toggles{display:flex;gap:8px;flex-shrink:0;}\n  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}\n  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}\n  .tg:focus-visible,button:focus-visible{outline:2px solid var(--rms);outline-offset:2px;}\n\n  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);}\n  .btn{font-family:var(--font-b);font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}\n  .btn:hover{border-color:var(--faint);}\n  .btn.play{background:var(--catch);color:#fff;border-color:var(--catch);min-width:118px;justify-content:center;}\n  .btn.play.paused{background:var(--catch);} .btn.reset{}\n  .yr{font-family:var(--font-m);font-size:14px;color:var(--muted);} .yr b{color:var(--ink);font-weight:600;font-size:16px;}\n  .barsp{flex:1;}\n  .live{display:flex;gap:8px 18px;flex-wrap:wrap;font-family:var(--font-m);font-size:12.5px;color:var(--muted);}\n  .live .l b{color:var(--ink);font-weight:600;} .live .l .up{color:var(--catch);} .live .l .dn{color:var(--warn);} .live .l .eq{color:var(--rms);}\n\n  .stage{display:grid;grid-template-columns:120px 1fr;gap:16px;margin-top:16px;align-items:stretch;}\n  @media (max-width:640px){.stage{grid-template-columns:96px 1fr;}}\n  .sliderbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 6px;display:flex;flex-direction:column;align-items:center;}\n  .sliderbox .cap{font-family:var(--font-m);font-size:11px;color:var(--muted);text-align:center;margin-bottom:2px;letter-spacing:.04em;}\n  .sliderbox .val{font-family:var(--font-m);font-size:15px;font-weight:600;color:var(--catch);margin-bottom:4px;}\n  .sliderbox svg{display:block;width:100%;height:auto;touch-action:none;cursor:grab;flex:1;}\n  .sliderbox svg:active{cursor:grabbing;}\n  .charts{display:flex;flex-direction:column;gap:12px;}\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px 8px;}\n  .card .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px;flex-wrap:wrap;}\n  .card .nm{font-family:var(--font-d);font-weight:600;font-size:15.5px;}\n  .card .hint{font-size:11px;font-family:var(--font-m);color:var(--faint);}\n  .card svg{display:block;width:100%;height:auto;}\n  .card svg text{font-family:var(--font-b);}\n  .axis line{stroke:var(--grid);} .axis text{fill:var(--faint);font-size:10px;font-family:var(--font-m);}\n  .axlab{fill:var(--muted);font-size:11px;font-family:var(--font-d);font-style:italic;}\n  .guide{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3;opacity:.7;}\n\n  .callout{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--catch);border-radius:12px;padding:14px 18px;font-size:13px;color:var(--muted);text-wrap:pretty;}\n  .callout h3{font-family:var(--font-d);font-weight:600;font-size:15px;margin:0 0 8px;color:var(--ink);}\n  .callout ol{margin:0;padding-left:20px;} .callout li{margin:0 0 6px;} .callout li:last-child{margin:0;}\n  .callout b{color:var(--ink);font-weight:600;} .callout i{font-family:var(--font-d);font-style:italic;}\n  footer{margin-top:22px;color:var(--faint);font-size:11.5px;text-align:center;text-wrap:balance;}\n<\/style>\n\n<div class=\"wrap\">\n  <header>\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\">Simulateur — décisions année après année<\/p>\n      <h1 data-t=\"title\">Piloter les prises en temps réel<\/h1>\n      <p class=\"sub\" data-t=\"sub\"><\/p>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" aria-label=\"langue\"><span aria-hidden=\"true\">⇄<\/span><span id=\"langlbl\">FR<\/span><\/button>\n      <button class=\"tg\" id=\"theme\" aria-label=\"thème\">◐<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"bar\">\n    <button class=\"btn play\" id=\"play\"><\/button>\n    <button class=\"btn reset\" id=\"reset\"><\/button>\n    <span class=\"yr\" data-t=\"yrlbl\"><\/span>\n    <span class=\"barsp\"><\/span>\n    <div class=\"live\" id=\"live\"><\/div>\n  <\/div>\n\n  <div class=\"stage\">\n    <div class=\"sliderbox\">\n      <div class=\"cap\" data-t=\"slidercap\">PRISE C<\/div>\n      <div class=\"val\" id=\"cval\">0<\/div>\n      <svg id=\"slider\" viewBox=\"0 0 96 360\" role=\"slider\" aria-label=\"niveau de prise\"><\/svg>\n    <\/div>\n    <div class=\"charts\">\n      <div class=\"card\">\n        <div class=\"ph\"><span class=\"nm\" data-t=\"stt\">Le stock <i>N<\/i> au fil du temps<\/span><span class=\"hint\" data-t=\"sth\">cible d'une pêche au RMS : K/2<\/span><\/div>\n        <svg id=\"stock\" viewBox=\"0 0 720 300\" role=\"img\" aria-label=\"Évolution du stock dans le temps\"><\/svg>\n      <\/div>\n      <div class=\"card\">\n        <div class=\"ph\"><span class=\"nm\" data-t=\"ctt\">Vos décisions de prise <i>C<\/i><\/span><span class=\"hint\" data-t=\"cth\">historique<\/span><\/div>\n        <svg id=\"catch\" viewBox=\"0 0 720 150\" role=\"img\" aria-label=\"Historique des prises\"><\/svg>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"callout\">\n    <h3 data-t=\"scent\">L'expérience à mener en classe<\/h3>\n    <ol id=\"scenario\"><\/ol>\n  <\/div>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  var K=1000, r=0.6, RMS=r*K/4;   // 150\n  var Cmax=2*RMS;                 // 300 -> RMS au milieu du curseur\n  var YEARS=120, SPEED=1;         // 1 année = 1 seconde -> 120 s au total\n  var N0=180;                     // stock de départ (bas) : croît vers K si C=0\n  var t=0, N=N0, C=0, running=false, lastTs=null;\n  var hist={t:[0],N:[N0],C:[0]};\n  var LANG='fr'; try{var s=localStorage.getItem('simu_lang'); if(s)LANG=s;}catch(e){}\n\n  var STR={\n    fr:{eyebrow:\"Simulateur — décisions année après année\",\n      title:\"Piloter les prises en temps réel\",\n      sub:\"Ici, contrairement à la fiche RMS — une <b>photo instantanée<\/b> et une <b>projection<\/b> à prise constante pour toujours — le stock évolue <b>vraiment<\/b>, année après année. On part de prises nulles (le stock croît vers <i>K<\/i>), puis vous <b>fixez la prise en direct<\/b> avec le curseur et vous <b>enchaînez les décisions<\/b>. 120 ans défilent à raison d'<b>1 an = 1 seconde<\/b>.\",\n      slidercap:\"PRISE C\", yrlbl:\"\", stt:\"Le stock <i>N<\/i> au fil du temps\", sth:\"cible d'une pêche au RMS : K/2\",\n      ctt:\"Vos décisions de prise <i>C<\/i>\", cth:\"historique\",\n      play:\"▶ Démarrer\", pause:\"⏸ Pause\", resume:\"▶ Reprendre\", reset:\"↺ Réinitialiser\",\n      yr:\"Année\", of:\"/\", done:\"— 120 ans atteints\",\n      lStock:\"stock N\", lReg:\"régénération G(N)\", lC:\"prise C\", lBal:\"solde G−C\",\n      up:\"↑ le stock monte\", dn:\"↓ le stock baisse\", eq:\"→ stable\", coll:\"effondré\",\n      axTime:\"temps (années)\", axStock:\"stock N\", axCatch:\"prise C\",\n      kLbl:\"K\", k2Lbl:\"K/2\", rmsLbl:\"RMS\", eqLbl:\"= régénération (stock stable)\",\n      scent:\"L'expérience à mener en classe\",\n      scen:[\n        \"<b>Laisser le stock se reconstituer.<\/b> Prise à 0 : le stock croît logistiquement jusqu'à <i>K<\/i>. Les poissons atteignent alors leur <b>capacité de charge<\/b> sur l'écosystème — le milieu ne peut en porter davantage. On a une ressource pleine.\",\n        \"<b>Passer à une pêche soutenable.<\/b> Montez la prise au <b>RMS<\/b> (milieu du curseur). Le stock <b>redescend vers <i>K/2<\/i><\/b> puis s'y stabilise : on prélève juste le surplus régénéré.\",\n        \"<b>Tester un dépassement.<\/b> Passez <b>au-dessus du RMS<\/b> quelques années : le stock plonge sous <i>K/2<\/i>. Pour revenir, il faut alors pêcher <b>bien en dessous du RMS<\/b> le temps que le stock remonte à <i>K/2<\/i> — seulement ensuite on peut de nouveau pêcher durablement au RMS.\"\n      ],\n      foot:\"Modèle de Schaefer : dN/dt = rN(1−N/K) − C. r = 0,6 · K = 1000 · RMS = 150 (unités arbitraires). Intégration en temps réel.\"\n    },\n    en:{eyebrow:\"Simulator — decisions year by year\",\n      title:\"Steer the catch in real time\",\n      sub:\"Here, unlike the MSY figure — a <b>snapshot<\/b> and a <b>projection<\/b> at a catch held constant forever — the stock <b>really<\/b> evolves, year after year. It starts from zero catch (the stock grows toward <i>K<\/i>), then you <b>set the catch live<\/b> with the slider and <b>chain decisions<\/b>. 120 years scroll by at <b>1 year = 1 second<\/b>.\",\n      slidercap:\"CATCH C\", yrlbl:\"\", stt:\"The stock <i>N<\/i> over time\", sth:\"target for MSY fishing: K/2\",\n      ctt:\"Your catch decisions <i>C<\/i>\", cth:\"history\",\n      play:\"▶ Start\", pause:\"⏸ Pause\", resume:\"▶ Resume\", reset:\"↺ Reset\",\n      yr:\"Year\", of:\"/\", done:\"— 120 years reached\",\n      lStock:\"stock N\", lReg:\"regrowth G(N)\", lC:\"catch C\", lBal:\"balance G−C\",\n      up:\"↑ stock rising\", dn:\"↓ stock falling\", eq:\"→ steady\", coll:\"collapsed\",\n      axTime:\"time (years)\", axStock:\"stock N\", axCatch:\"catch C\",\n      kLbl:\"K\", k2Lbl:\"K/2\", rmsLbl:\"MSY\", eqLbl:\"= regrowth (stock steady)\",\n      scent:\"The classroom experiment\",\n      scen:[\n        \"<b>Let the stock rebuild.<\/b> Catch at 0: the stock grows logistically to <i>K<\/i>. The fish then reach their <b>carrying capacity<\/b> in the ecosystem — the environment can hold no more. The resource is now full.\",\n        \"<b>Switch to sustainable fishing.<\/b> Raise the catch to <b>MSY<\/b> (mid-slider). The stock <b>falls back toward <i>K/2<\/i><\/b> and settles there: you take exactly the regrown surplus.\",\n        \"<b>Try an overshoot.<\/b> Go <b>above MSY<\/b> for a few years: the stock dives below <i>K/2<\/i>. To recover you must then fish <b>well below MSY<\/b> until the stock climbs back to <i>K/2<\/i> — only then can you fish sustainably at MSY again.\"\n      ],\n      foot:\"Schaefer model: dN/dt = rN(1−N/K) − C. r = 0.6 · K = 1000 · MSY = 150 (arbitrary units). Real-time integration.\"\n    }\n  };\n\n  function mk(t,a){var e=document.createElementNS(\"http://www.w3.org/2000/svg\",t);for(var k in a)e.setAttribute(k,a[k]);return e;}\n  function G(x){return r*x*(1-x/K);}\n\n  // ---------- slider ----------\n  var slW=96,slH=360,slPadT=18,slPadB=26, slx=52;\n  var sTop=slPadT, sBot=slH-slPadB;\n  function CY(v){return sBot-(v/Cmax)*(sBot-sTop);}\n  function CYinv(y){return Math.max(0,Math.min(Cmax,(sBot-y)/(sBot-sTop)*Cmax));}\n  function drawSlider(){\n    var d=STR[LANG], svg=document.getElementById('slider');\n    while(svg.firstChild) svg.removeChild(svg.firstChild);\n    // track\n    svg.appendChild(mk('line',{x1:slx,y1:sTop,x2:slx,y2:sBot,stroke:'var(--line)','stroke-width':6,'stroke-linecap':'round'}));\n    // filled part up to C\n    svg.appendChild(mk('line',{x1:slx,y1:sBot,x2:slx,y2:CY(C),stroke:'var(--catch)','stroke-width':6,'stroke-linecap':'round'}));\n    // ticks 0 / RMS / max\n    function tick(v,lbl,col,bold){var y=CY(v);\n      svg.appendChild(mk('line',{x1:slx-11,y1:y,x2:slx+11,y2:y,stroke:col,'stroke-width':bold?1.6:1,'stroke-dasharray':bold?'none':'2 2'}));\n      var tx=mk('text',{x:slx-15,y:y+3,'text-anchor':'end',fill:col,'font-size':bold?11:9.5,'font-family':'var(--font-m)','font-weight':bold?600:400}); tx.textContent=lbl; svg.appendChild(tx);}\n    tick(0,'0','var(--faint)',false);\n    tick(Cmax,String(Cmax),'var(--faint)',false);\n    tick(RMS,d.rmsLbl,'var(--rms)',true);\n    // handle\n    svg.appendChild(mk('circle',{cx:slx,cy:CY(C),r:9,fill:'var(--catch)',stroke:'var(--surface)','stroke-width':2}));\n    document.getElementById('cval').textContent=Math.round(C);\n  }\n\n  // ---------- stock chart ----------\n  var W=720,H=300,pL=42,pR=40,pT=16,pB=34, ax0=pL,ax1=W-pR,ay0=pT,ay1=H-pB;\n  function TX(y){return ax0+(y/YEARS)*(ax1-ax0);}\n  function SY(n){return ay1-(n/(K*1.06))*(ay1-ay0);}\n  function drawStock(){\n    var d=STR[LANG], svg=document.getElementById('stock');\n    while(svg.firstChild) svg.removeChild(svg.firstChild);\n    var g=mk('g',{class:'axis'});\n    [0,250,500,750,1000].forEach(function(n){var yy=SY(n); g.appendChild(mk('line',{x1:ax0,y1:yy,x2:ax1,y2:yy,stroke:'var(--grid)'}));\n      var tx=mk('text',{x:ax0-6,y:yy+3,'text-anchor':'end'}); tx.textContent=n; g.appendChild(tx);});\n    [0,30,60,90,120].forEach(function(yr){var xx=TX(yr); var tx=mk('text',{x:xx,y:ay1+14,'text-anchor':(yr===0?'start':yr===120?'end':'middle')}); tx.textContent=yr; g.appendChild(tx);});\n    svg.appendChild(g);\n    var xl=mk('text',{x:(ax0+ax1)/2,y:H-3,'text-anchor':'middle',class:'axlab'}); xl.textContent=d.axTime; svg.appendChild(xl);\n    // K and K/2 guides\n    svg.appendChild(mk('line',{x1:ax0,y1:SY(K),x2:ax1,y2:SY(K),class:'guide'}));\n    var kl=mk('text',{x:ax1+3,y:SY(K)+3,fill:'var(--faint)','font-size':10.5,'font-family':'var(--font-m)'}); kl.textContent=d.kLbl; svg.appendChild(kl);\n    svg.appendChild(mk('line',{x1:ax0,y1:SY(K/2),x2:ax1,y2:SY(K/2),stroke:'var(--rms)','stroke-width':1.2,'stroke-dasharray':'5 4',opacity:.9}));\n    var k2=mk('text',{x:ax1+3,y:SY(K/2)+3,fill:'var(--rms)','font-size':10.5,'font-family':'var(--font-m)'}); k2.textContent=d.k2Lbl; svg.appendChild(k2);\n    // trajectory\n    var col=(N<1?'var(--warn)':'var(--stock)'), p='M ';\n    for(var i=0;i<hist.t.length;i++) p+=(i?'L ':'')+TX(hist.t[i]).toFixed(1)+' '+SY(hist.N[i]).toFixed(1)+' ';\n    svg.appendChild(mk('path',{d:p,fill:'none',stroke:col,'stroke-width':2.6,'stroke-linejoin':'round'}));\n    // leading dot, colored by G-C balance\n    var bal=G(N)-C, dotc=(N<1?'var(--warn)':bal>1?'var(--catch)':bal<-1?'var(--warn)':'var(--rms)');\n    svg.appendChild(mk('circle',{cx:TX(t),cy:SY(N),r:4.4,fill:dotc,stroke:'var(--surface)','stroke-width':1.6}));\n  }\n\n  // ---------- catch history ----------\n  var cW=720,cH=150,cpT=12,cpB=28, cy0=cpT,cy1=cH-cpB;\n  function CX(y){return ax0+(y/YEARS)*(ax1-ax0);}\n  function CCY(v){return cy1-(v/Cmax)*(cy1-cy0);}\n  function drawCatch(){\n    var d=STR[LANG], svg=document.getElementById('catch');\n    while(svg.firstChild) svg.removeChild(svg.firstChild);\n    var g=mk('g',{class:'axis'});\n    [0,150,300].forEach(function(v){var yy=CCY(v); g.appendChild(mk('line',{x1:ax0,y1:yy,x2:ax1,y2:yy,stroke:'var(--grid)'}));\n      var tx=mk('text',{x:ax0-6,y:yy+3,'text-anchor':'end'}); tx.textContent=v; g.appendChild(tx);});\n    [0,30,60,90,120].forEach(function(yr){var xx=CX(yr); var tx=mk('text',{x:xx,y:cy1+14,'text-anchor':(yr===0?'start':yr===120?'end':'middle')}); tx.textContent=yr; g.appendChild(tx);});\n    svg.appendChild(g);\n    var xl=mk('text',{x:(ax0+ax1)/2,y:cH-2,'text-anchor':'middle',class:'axlab'}); xl.textContent=d.axTime; svg.appendChild(xl);\n    // RMS reference\n    svg.appendChild(mk('line',{x1:ax0,y1:CCY(RMS),x2:ax1,y2:CCY(RMS),stroke:'var(--rms)','stroke-width':1.2,'stroke-dasharray':'5 4',opacity:.9}));\n    var rl=mk('text',{x:ax1+3,y:CCY(RMS)+3,fill:'var(--rms)','font-size':10.5,'font-family':'var(--font-m)'}); rl.textContent=d.rmsLbl; svg.appendChild(rl);\n    // catch history area + line\n    if(hist.t.length>1){\n      var area='M '+CX(0).toFixed(1)+' '+CCY(0).toFixed(1)+' ';\n      for(var i=0;i<hist.t.length;i++) area+='L '+CX(hist.t[i]).toFixed(1)+' '+CCY(hist.C[i]).toFixed(1)+' ';\n      area+='L '+CX(t).toFixed(1)+' '+CCY(0).toFixed(1)+' Z';\n      svg.appendChild(mk('path',{d:area,fill:'var(--catch)','fill-opacity':0.14}));\n      var p='M ';\n      for(var i=0;i<hist.t.length;i++) p+=(i?'L ':'')+CX(hist.t[i]).toFixed(1)+' '+CCY(hist.C[i]).toFixed(1)+' ';\n      svg.appendChild(mk('path',{d:p,fill:'none',stroke:'var(--catch)','stroke-width':2.2,'stroke-linejoin':'round'}));\n    }\n    svg.appendChild(mk('circle',{cx:CX(t),cy:CCY(C),r:3.6,fill:'var(--catch)',stroke:'var(--surface)','stroke-width':1.4}));\n  }\n\n  // ---------- readouts ----------\n  function updateLive(){\n    var d=STR[LANG], bal=G(N)-C;\n    var arrow = N<1 ? '<span class=\"dn\">'+d.coll+'<\/span>' : (bal>1?'<span class=\"up\">'+d.up+'<\/span>':bal<-1?'<span class=\"dn\">'+d.dn+'<\/span>':'<span class=\"eq\">'+d.eq+'<\/span>');\n    document.getElementById('live').innerHTML=\n      '<span class=\"l\"><b>'+d.lStock+'<\/b> '+Math.round(N)+' ('+Math.round(N/K*100)+'% K)<\/span>'+\n      '<span class=\"l\"><b>'+d.lReg+'<\/b> '+Math.round(G(N))+'<\/span>'+\n      '<span class=\"l\"><b>'+d.lC+'<\/b> '+Math.round(C)+'<\/span>'+\n      '<span class=\"l\">'+arrow+'<\/span>';\n    var pt=STR[LANG];\n    document.querySelector('[data-t=\"yrlbl\"]').innerHTML='<b>'+pt.yr+' '+Math.floor(t)+'<\/b> '+pt.of+' '+YEARS+(t>=YEARS?' '+pt.done:'');\n  }\n  function draw(){ drawSlider(); drawStock(); drawCatch(); updateLive(); }\n\n  // ---------- animation ----------\n  function frame(ts){\n    if(!running) return;\n    if(lastTs==null) lastTs=ts;\n    var dtSec=(ts-lastTs)/1000; lastTs=ts;\n    if(dtSec>0.25) dtSec=0.25;           // évite les sauts si onglet en arrière-plan\n    var dY=dtSec*SPEED, rem=dY;\n    while(rem>1e-6 && t<YEARS){\n      var h=Math.min(0.02,rem);\n      var dN=(r*N*(1-N/K)-C)*h; N=N+dN; if(N<0)N=0;\n      t+=h; rem-=h;\n    }\n    hist.t.push(t); hist.N.push(N); hist.C.push(C);\n    draw();\n    if(t>=YEARS){ running=false; lastTs=null; syncPlay(); return; }\n    requestAnimationFrame(frame);\n  }\n  function play(){ if(t>=YEARS) return; running=true; lastTs=null; syncPlay(); requestAnimationFrame(frame); }\n  function pause(){ running=false; lastTs=null; syncPlay(); }\n  function reset(){ running=false; lastTs=null; t=0; N=N0; C=0; hist={t:[0],N:[N0],C:[0]}; syncPlay(); draw(); }\n  function syncPlay(){ var d=STR[LANG], b=document.getElementById('play');\n    b.classList.toggle('paused',!running);\n    b.textContent = running ? d.pause : (t>0 && t<YEARS ? d.resume : d.play);\n  }\n\n  // ---------- slider drag ----------\n  var dragging=false;\n  function sPt(ev){var svg=document.getElementById('slider'),r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;\n    var cyp=(ev.touches?ev.touches[0].clientY:ev.clientY); return (cyp-r.top)/r.height*vb.height;}\n  function setC(y){ C=CYinv(y); if(t>=YEARS){ /* fige */ } draw(); }\n  var sl=document.getElementById('slider');\n  sl.addEventListener('mousedown',function(e){dragging=true;e.preventDefault();setC(sPt(e));});\n  sl.addEventListener('touchstart',function(e){dragging=true;e.preventDefault();setC(sPt(e));},{passive:false});\n  window.addEventListener('mousemove',function(e){if(dragging)setC(sPt(e));});\n  window.addEventListener('touchmove',function(e){if(dragging){e.preventDefault();setC(sPt(e));}},{passive:false});\n  window.addEventListener('mouseup',function(){dragging=false;});\n  window.addEventListener('touchend',function(){dragging=false;});\n  // keyboard on slider\n  sl.setAttribute('tab lyLang();\n})();\n<\/script>\n\n<\/body>\n<\/html>", "islande-capacite-charge.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Prélever sans épuiser<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;\n    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n    --cMorue:#2A78D6;--cCapelan:#E0699A;--cMerlan:#0A8A2E;--cMaquereau:#5A4FB0;--cTotal:#38505F;--dTour:#C08A00;\n    --cEglefin:#EB6834;--cLieu:#1BAF7A;--cSebastes:#EDA100;--cNonid:#9A958C;--cAutres:#C7C3BA;\n    --K:#2A3742;--warn:#C0392B;--eco:#2E8B57;\n    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);\n    --font-d:\"Spectral\",Georgia,serif;--font-b:\"IBM Plex Sans\",system-ui,sans-serif;--font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n  }\n  :root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;\n    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --cMorue:#3987E5;--cCapelan:#D6699A;--cMerlan:#3AA653;--cMaquereau:#9085E9;--cTotal:#8FA6B4;--dTour:#D6A83A;\n    --cEglefin:#D95926;--cLieu:#199E70;--cSebastes:#C98500;--cNonid:#8C877E;--cAutres:#6C6860;\n    --K:#C8D2DA;--warn:#E0705F;--eco:#41A76D;\n    --shadow:0 1px 2px rgba(0,0,0,.4  épuiser<\/h1>\n      <p class=\"sub\" data-t=\"sub\">Chaque espèce raconte la même mécanique : les prises montent vite, puis butent sur un plafond soutenable — le <b>RMS<\/b>, traduction en flux de la capacité de charge. Rester dessous, c'est durable ; le dépasser, c'est puiser dans le stock — avec un retour forcé vers le RMS… ou un effondrement. Deux espèces, deux trajectoires.<\/p>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"pstep\"><span class=\"pn\">1<\/span><h2 data-t=\"st1t\">Espèce par espèce<\/h2><\/div>\n  <p class=\"steplead\" data-t=\"st1p\"><\/p>\n  <div class=\"keyrow\" id=\"keyrow\"><\/div>\n  <div class=\"grid\" id=\"grid\"><\/div>\n\n  <div class=\"pstep\"><span class=\"pn\">2<\/span><h2 data-t=\"st2t\">L'agrégation<\/h2><\/div>\n  <p class=\"steplead\" data-t=\"st2p\"><\/p>\n  <div class=\"aggcard\">\n    <div class=\"chart-h\"><span class=\"ttl\" data-t=\"aggtitle\">Captures par espèce<\/span><\/div>\n    <div class=\"chartwrap\">\n      <svg class=\"chart\" id=\"aggchart\" viewBox=\"0 0 900 470\" role=\"img\" aria-label=\"Aires empilees des captures d'Islande par espece, 1950 a 2019, avec RMS et tendance\"><\/svg>\n      <div class=\"tooltip\" id=\"aggtip\"><\/div>\n    <\/div>\n    <div class=\"legend\" id=\"agglegend\"><\/div>\n  <\/div>\n  <div class=\"callout\" data-t=\"sdiv\"><\/div>\n\n  <div class=\"pstep\"><span class=\"pn\">3<\/span><h2 data-t=\"st3t\">Le frein : les quotas<\/h2><\/div>\n  <div class=\"reg\">\n    <div class=\"card\">\n      <h3 data-t=\"regt\">Le frein : le système de quotas<\/h3>\n      <div id=\"regbody\"><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h3 data-t=\"regtlt\">Chronologie de la régulation<\/h3>\n      <ul class=\"tl\" id=\"tl\"><\/ul>\n    <\/div>\n  <\/div>\n\n  <div class=\"pstep\"><
