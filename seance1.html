ircle',{cx:clx,cy:cly,r:rl,fill:'none',stroke:'var(--eco)','stroke-width':1.6,opacity:0.85}));\n      for(var k=0;k<N;k++){\n        var a=(k/N)*360, ar=a*Math.PI/180;\n        var c0=[clx+rl*Math.cos(ar),cly+rl*Math.sin(ar)];\n        var t=[-Math.sin(ar),Math.cos(ar)], nn=[Math.cos(ar),Math.sin(ar)];\n        var L1=4.6, W=3;\n        var apex=[c0[0]+t[0]*L1,c0[1]+t[1]*L1];\n        var wa=[c0[0]+nn[0]*W,c0[1]+nn[1]*W], wb=[c0[0]-nn[0]*W,c0[1]-nn[1]*W];\n        g.appendChild(mk('polyline',{points:wa[0].toFixed(1)+','+wa[1].toFixed(1)+' '+apex[0].toFixed(1)+','+apex[1].toFixed(1)+' '+wb[0].toFixed(1)+','+wb[1].toFixed(1),class:'toothE'}));\n      }\n    })();\n  })();\n\n  // coupling / counterforce (P4)\n  (function(){\n    var g=document.getElementById('g-couple');\n    // counterforce arrow at mesh pointing up into monetary wheel\n    g.appendChild(mk('line',{x1:MESH[0]+22,y1:MESH[1]+26,x2:MESH[0]+22,y2:MESH[1]-18,class:'flow cf','marker-end':'url(#ahCf)',id:'cfArrow'}));\n    // limit arc on the energy wheel (planetary boundary)\n    var a0=40,a1=140,d='';\n    for(var i=0;i<=40;i++){var a=a0+(a1-a0)*i/40;var q=[cxE+(RE+10)*Math.cos(a*Math.PI/180),cyE+(RE+10)*Math.sin(a*Math.PI/180)];d+=(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)+' ';}\n    g.appendChild(mk('path',{d:d,class:'limit',id:'limitArc'}));\n    g.style.opacity=0;\n  })();\n\n  // labels (built per language)\n  var labelDefs=[\n    {id:'lEin', x:LX, y:246, cls:'flbl in', anchor:'middle', key:'energyIn'},\n    {id:'lEnt', x:LX, y:556, cls:'flbl out', anchor:'middle', key:'entropy'},\n    {id:'lMin', x:RX, y:562, cls:'flbl in', anchor:'middle', key:'matterIn'},\n    {id:'lWas', x:RX, y:250, cls:'flbl out', anchor:'middle', key:'waste'},\n    {id:'lRec', x:RX+35, y:320, cls:'flbl rec', anchor:'start', key:'recyc'}\n  ];\n  function buildLabels(){\n    var d=STR[LANG];\n    document.querySelectorAll('.floatlbl').forEach(function(n){n.remove();});\n    labelDefs.forEach(function(L){\n      var host = (L.id==='lEin'||L.id==='lEnt')?document.getElementById('g-eflow'):document.getElementById('g-mflow');\n      var lines=d[L.key];\n      var t=mk('text',{x:L.x,y:L.y,class:L.cls+' floatlbl','text-anchor':L.anchor});\n      lines.forEach(function(ln,i){ var ts=mk('tspan',{x:L.x,dy:(i?13:0)}); ts.textContent=ln; t.appendChild(ts); });\n      host.appendChild(t);\n    });\n    // counterforce label\n    var cf=mk('text',{x:MESH[0]+30,y:MESH[1]-6,class:'flbl cf floatlbl','text-anchor':'start'}); cf.textContent=d.cf;\n    document.getElementById('g-couple').appendChild(cf);\n    // wheel names\n    var gn=document.getElementById('g-names'); gn.innerHTML='';\n    var nm=mk('text',{x:cxM,y:cyM+4,class:'wheelname'}); nm.textContent=d.nameM; gn.appendChild(nm);\n    var ne=mk('text',{x:cxE,y:cyE+4,class:'wheelname'}); ne.textContent=d.nameE; gn.appendChild(ne);\n  }\n\n  // ---------- state ----------\n  var scale=document.getElementById('scale'), v=4;\n  var rectE=document.getElementById('rectE'), rectM=document.getElementById('rectM');\n  var EY0=238, EY1=572;   // clip range energy (top->down)\n  var MY0=228, MY1=580;   // clip range matter\n  function update(val){\n    v=val;\n    var pE=Math.max(0,Math.min(1,v-1));\n    var pM=Math.max(0,Math.min(1,v-2));\n    var pC=Math.max(0,Math.min(1,v-3));\n    // energy clip grows downward\n    rectE.setAttribute('y',EY0); rectE.setAttribute('height',((EY1-EY0)*pE).toFixed(1));\n    // matter clip grows upward\n    var hM=(MY1-MY0)*pM; rectM.setAttribute('y',(MY1-hM).toFixed(1)); rectM.setAttribute('height',hM.toFixed(1));\n    // coupling\n    document.getElementById('g-couple').style.opacity=pC;\n    document.getElementById('meshdot').style.opacity=(0.4+0.5*pC).toFixed(2);\n    document.getElementById('limitArc').style.opacity=pC;\n    scale.value=v; updatePanel();\n  }\n  function phaseIndex(){return Math.min(4,Math.max(1,Math.ceil(v-1e-9)));}\n  function updatePanel(){\n    var d=STR[LANG],i=phaseIndex()-1,ph=d.phases[i];\n    document.getElementById('p-num').textContent=(i+1);\n    document.getElementById('p-num').style.background=ACC[i];\n    document.getElementById('p-title').textContent=ph.t;\n    document.getElementById('p-body').innerHTML=ph.b;\n    var cw=document.getElementById('p-chips');cw.innerHTML='';\n    ph.chips.forEach(function(c){var el=document.createElement('div');el.className='chip '+c[0];el.innerHTML='<span class=\"sym\">'+c[1]+'<\/span><span class=\"txt\">'+c[2]+'<\/span>';cw.appendChild(el);});\n    document.getElementById('p-note').textContent=ph.note;\n    document.querySelectorAll('.tk').forEach(function(tk,k){var on=(k===i);tk.classList.toggle('active',on);if(on)tk.style.setProperty('--acc',ACC[i]);});\n  }\n\n  // ticks\n  function buildTicks(){\n    var d=STR[LANG],box=document.getElementById('ticks');box.innerHTML='';\n    for(var k=0;k<4;k++){(function(k){\n      var tk=document.createElement('div');tk.className='tk';\n      tk.innerHTML='<span class=\"n\">'+(k+1)+'<\/span><span class=\"l\">'+d.ticks[k]+'<\/span>';\n      tk.addEventListener('click',function(){animateTo(k+1);});\n      box.appendChild(tk);\n    })(k);}\n  }\n\n  // animation\n  var raf=null,playing=false;\n  function setPlayIcon(on){var p=document.getElementById('ico-play'),q=document.getElementById('ico-pause');(on?p:q).setAttribute('hidden','');(on?q:p).removeAttribute('hidden');}\n  function animateTo(target){\n    cancelAnimationFrame(raf);playing=false;setPlayIcon(false);\n    var start=v,t0=performance.now(),dur=reduce?0:520;\n    function step(now){var k=dur?Math.min(1,(now-t0)/dur):1;var e=1-Math.pow(1-k,3);update(start+(target-start)*e);if(k<1)raf=requestAnimationFrame(step);}\n    raf=requestAnimationFrame(step);\n  }\n  function playAll(){\n    if(playing){cancelAnimationFrame(raf);playing=false;setPlayIcon(false);return;}\n    playing=true;setPlayIcon(true); if(v>=4)v=1;\n    var t0=performance.now(),start=v,dur=(4-start)*1400;\n    function step(now){if(!playing)return;var k=dur?Math.min(1,(now-t0)/dur):1;update(start+(4-start)*k);if(k<1)raf=requestAnimationFrame(step);else{playing=false;setPlayIcon(false);}}\n    raf=requestAnimationFrame(step);\n  }\n  document.getElementById('play').addEventListener('click',playAll);\n  document.getElementById('prev').addEventListener('click',function(){animateTo(Math.max(1,Math.ceil(v-1e-9)-1));});\n  document.getElementById('next').addEventListener('click',function(){animateTo(Math.min(4,Math.floor(v+1e-9)+1));});\n  scale.addEventListener('input',function(){cancelAnimationFrame(raf);playing=false;setPlayIcon(false);update(parseFloat(scale.value));});\n\n  // toggles\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme');if(a)return a;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}\n  document.getElementById('theme').addEventListener('click',function(){document.documentElement.setAttribute('data-theme',effTheme()==='dark'?'light':'dark');try{localStorage.setItem('eco_theme',effTheme());}catch(e){}});\n  try{var stt=localStorage.getItem('eco_theme');if(stt)document.documentElement.setAttribute('data-theme',stt);}catch(e){}\n\n  function applyLang(){\n    var d=STR[LANG];document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');if(d[k])el.innerHTML=d[k];});\n    document.getElementById('langlbl').textContent=LANG.toUpperCase();\n    buildLabels(); buildTicks(); updatePanel();\n  }\n  document.getElementById('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem('eco_lang',LANG);}catch(e){}applyLang();});\n\n  // boot\n  applyLang();\n  update(1); // start at the first phase (1/4)\n})();\n<\/script>\n\n<\/body>\n<\/html>", "engrenage-couplage.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>L'engrenage en mouvement<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EDF1ED;--surface:#FCFDFC;--panel:#F4F8F4;\n    --ink:#15201A;--muted:#586359;--faint:#83907F;--line:#DBE3DB;--rim:#AEBBAE;\n    --eco:#2E8B57;--fin:#3F6BC0;--prod:#B0631C;--diss:#6E6760;--warn:#C0392B;\n    --shadow:0 1px 2px rgba(21,32,26,.05),0 10px 28px rgba(21,32,26,.07);\n    --font-d:\"Spectral\",Georgia,serif;--font-b:\"IBM Plex Sans\",system-ui,sans-serif;--font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n  }\n  :root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n    --bg:#0C1210;--surface:#151C17;--panel:#101711;\n    --ink:#E7EEE8;--muted:#93A398;--faint:#6C7B70;--line:#28322B;--rim:#3A473E;\n    --eco:#41A76D;--fin:#6E97E6;--prod:#C17B2A;--diss:#9A928A;--warn:#E0705F;\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }}\n  :root[data-theme=\"dark\"]{\n    --bg:#0C1210;--surface:#151C17;--panel:#101711;\n    --ink:#E7EEE8;--muted:#93A398;--faint:#6C7B70;--line:#28322B;--rim:#3A473E;\n    --eco:#41A76D;--fin:#6E97E6;--prod:#C17B2A;--diss:#9A928A;--warn:#E0705F;\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}\n  .wrap{max-width:1140px;margin:0 auto;padding-block:26px 40px;padding-inline:20px;}\n  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}\n  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--eco);font-weight:500;margin:0 0 6px;}\n  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.6vw,42px);line-height:1.03;margin:0;letter-spacing:-.01em;text-wrap:balance;}\n  .sub{color:var(--muted);font-size:15px;margin:8px 0 0;max-width:66ch;text-wrap:pretty;}\n  .toggles{display:flex;gap:8px;flex-shrink:0;}\n  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}\n  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}\n  .tg:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--eco);outline-offset:2px;}\n  .stage{display:grid;grid-template-columns:1fr .82fr;gap:20px;margin-top:24px;align-items:stretch;}\n  @media (max-width:860px){.stage{grid-template-columns:1fr;}}\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}\n  .wheelcard{padding:6px 8px 4px;}\n  svg.wheel{display:block;width:100%;height:auto;max-width:100%;}\n  svg.wheel text{font-family:var(--font-d);fill:var(--ink);}\n  .gearM{fill:none;stroke:var(--fin);stroke-width:2;stroke-linejoin:round;}\n  .gearE{fill:none;stroke:var(--eco);stroke-width:2;stroke-linejoin:round;}\n  .hubM{fill:none;stroke:var(--fin);stroke-width:1.6;}\n  .hubE{fill:none;stroke:var(--eco);stroke-width:1.6;}\n  .spoke{stroke:var(--eco);stroke-width:1.6;stroke-linecap:round;opacity:.65;}\n  .spokeM{stroke:var(--fin);stroke-width:1.6;stroke-linecap:round;opacity:.6;}\n  .pole-dot{fill:var(--surface);stroke:var(--fin);stroke-width:1.5;}\n  .pole-lbl{font-style:italic;font-weight:600;font-size:13px;fill:var(--fin);}\n  .wheelname{font-style:italic;font-size:13px;fill:var(--muted);text-anchor:middle;}\n  .flow{fill:none;stroke-width:4;stroke-linecap:round;}\n  .flow.in{stroke:var(--prod);} .flow.out{stroke:var(--diss);}\n  .flbl{font-size:11.5px;font-style:italic;font-family:var(--font-d);}\n  .flbl.in{fill:var(--prod);} .flbl.out{fill:var(--diss);}\n  .decoupbadge{font-family:var(--font-m);font-size:10.5px;fill:var(--eco);opacity:0;}\n\n  .panel{padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-height:100%;}\n  .ctl label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:8px;}\n  .ctl .nm{font-weight:600;color:var(--ink);} .ctl .nm small{font-weight:400;color:var(--faint);font-family:var(--font-m);}\n  .ctl .val{font-family:var(--font-m);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;}\n  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:var(--line);outline-offset:5px;}\n  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2.5px solid var(--eco);cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.2);}\n  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--surface);border:2.5px solid var(--eco);cursor:grab;}\n  input#throttle::-webkit-slider-thumb{border-color:var(--fin);} input#throttle::-moz-range-thumb{border-color:var(--fin);}\n  .playrow{display:flex;align-items:center;gap:12px;}\n  .play{width:42px;height:42px;border-radius:50%;border:none;background:var(--fin);color:#fff;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:transform .12s;}\n  .play:hover{transform:scale(1.05);} .play svg{width:16px;height:16px;fill:#fff;}\n  .playrow .hint{font-size:12.5px;color:var(--muted);}\n  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;}\n  .tile{background:var(--surface);padding:11px 12px;}\n  .tile .t-l{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-family:var(--font-m);margin-bottom:4px;line-height:1.2;}\n  .tile .t-v{font-family:var(--font-m);font-size:19px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1;}\n  .tile.pib .t-v{color:var(--fin);} .tile.deb .t-v{color:var(--eco);}\n  .meter{margin-top:2px;}\n  .meter .mhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px;}\n  .meter .mhead b{color:var(--ink);font-weight:600;}\n  .bar{position:relative;height:16px;border-radius:8px;background:var(--panel);border:1px solid var(--line);overflow:hidden;}\n  .bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;transition:width .12s linear,background .2s;}\n  .bar .thr{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn);opacity:.7;}\n  .mnote{font-size:12px;color:var(--faint);margin-top:7px;font-family:var(--font-m);}\n  .mnote.over{color:var(--warn);}\n  .decoupinfo{margin-top:12px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;}\n  .decoupinfo h4{font-family:var(--font-d);font-weight:600;font-size:14px;margin:0 0 6px;color:var(--ink);}\n  .decoupinfo>p{font-size:12.5px;color:var(--muted);margin:0 0 10px;text-wrap:pretty;}\n  .decoupinfo b{color:var(--ink);font-weight:600;}\n  .ditwo{display:grid;grid-template-columns:1fr 1fr;gap:10px;}\n  @media(max-width:520px){.ditwo{grid-template-columns:1fr;}}\n  .ditwo .dic{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;}\n  .ditwo .dic>b{display:block;font-size:12px;margin-bottom:3px;}\n  .ditwo .rel>b{color:var(--eco);} .ditwo .abs>b{color:var(--warn);}\n  .ditwo .dic>span{display:block;font-size:12px;color:var(--muted);text-wrap:pretty;}\n  .ditwo .dic>span b{color:var(--ink);font-weight:600;}\n  .lesson{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:13px;margin-top:auto;text-wrap:pretty;}\n  .lesson b{color:var(--ink);font-weight:600;}\n  footer{margin-top:22px;color:var(--faint);font-size:12px;text-align:center;text-wrap:balance;}\n  footer i{font-family:var(--font-d);font-style:italic;}\n<\/style>\n\n<div class=\"wrap\">\n  <header>\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\">Le modèle de l'engrenage · rotation couplée<\/p>\n      <h1 data-t=\"title\">L'engrenage en mouvement<\/h1>\n      <p class=\"sub\" data-t=\"sub\">La roue monétaire entraîne la roue énergétique, en sens inverse : on ne peut pas accélérer l'une sans l'autre. Actionne le régime de la roue monétaire (le PIB) et observe le débit physique et la pression sur les limites planétaires.<\/p>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"stage\">\n    <div class=\"card wheelcard\">\n      <svg class=\"wheel\" id=\"wheel\" viewBox=\"0 0 470 560\" role=\"img\" aria-label=\"Deux roues dentées engrenées : la roue monétaire entraîne la roue énergétique en sens inverse\">\n        <defs>\n          <marker id=\"ahIn\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M1 1 L6 3.5 L1 6 Z\" fill=\"var(--prod)\"><\/path><\/marker>\n          <marker id=\"ahOut\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M1 1 L6 3.5 L1 6 Z\" fill=\"var(--diss)\"><\/path><\/marker>\n        <\/defs>\n        <g id=\"g-flows\"><\/g>\n        <g id=\"g-energy\"><\/g>\n        <g id=\"g-mon\"><\/g>\n        <g id=\"g-names\"><\/g>\n        <g id=\"g-badge\"><\/g>\n      <\/svg>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"panel\">\n        <div class=\"playrow\">\n          <button class=\"play\" id=\"play\" aria-label=\"Lecture / pause\">\n            <svg id=\"ico-play\" viewBox=\"0 0 24 24\" hidden><path d=\"M8 5v14l11-7z\"/><\/svg>\n            <svg id=\"ico-pause\" viewBox=\"0 0 24 24\"><path d=\"M6 5h4v14H6zM14 5h4v14h-4z\"/><\/svg>\n          <\/button>\n          <span class=\"hint\" data-t=\"hint\">Les roues tournent — règle le régime ci-dessous.<\/span>\n        <\/div>\n\n        <div class=\"ctl\">\n          <label><span class=\"nm\" data-t=\"c_thr\">Régime de la roue monétaire <small>(PIB)<\/small><\/span><span class=\"val\" id=\"throttleV\">55<\/span><\/label>\n          <input type=\"range\" id=\"throttle\" min=\"0\" max=\"100\" step=\"1\" value=\"55\">\n        <\/div>\n\n        <div class=\"tiles\">\n          <div class=\"tile pib\"><div class=\"t-l\" data-t=\"tl_pib\">Roue monétaire · PIB<\/div><div class=\"t-v\" id=\"o-pib\">55<\/div><\/div>\n          <div class=\"tile deb\"><div class=\"t-l\" data-t=\"tl_deb\">Roue énergétique · débit<\/div><div class=\"t-v\" id=\"o-deb\">55<\/div><\/div>\n        <\/div>\n\n        <div class=\"meter\">\n          <div class=\"mhead\"><span data-t=\"m_lbl\">Pression sur les limites planétaires<\/span><b id=\"o-meter\">55 %<\/b><\/div>\n          <div class=\"bar\"><div class=\"fill\" id=\"meterFill\"><\/div><div class=\"thr\" id=\"meterThr\"><\/div><\/div>\n          <div class=\"mnote\" id=\"meterNote\"><\/div>\n        <\/div>\n\n\n        <p class=\"lesson\" id=\"lesson\"><\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <footer><span data-t=\"foot\">Deux leviers pour réduire la pression : calibrer la taille de la roue monétaire (sobriété) ou réduire le nombre de dents par des investissements verts (découplage).<\/span><\/footer>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  var SVGNS=\"http://www.w3.org/2000/svg\";\n  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;\n  function mk(t,a){var e=document.createElementNS(SVGNS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}\n\n  // geometry: meshed gears (same module)\n  var Nm=22, Ne=30;\n  var cxM=235,cyM=148,RM=84;\n  var RE=RM*Ne/Nm;                 // ~114.5\n  var cyE=cyM+RM+RE;               // pitch circles tangent\n  var cxE=235;\n  var MESH=[235, cyM+RM];\n\n  var LANG='fr'; try{var s=localStorage.getItem('coupl_lang');if(s)LANG=s;}catch(e){}\n  var STR={\n    fr:{\n      eyebrow:\"Le modèle de l'engrenage · rotation couplée\",\n      title:\"L'engrenage en mouvement\",\n      sub:\"La roue monétaire entraîne la roue énergétique, en sens inverse : on ne peut pas accélérer l'une sans l'autre. Actionne le régime de la roue monétaire (le PIB) et observe le débit physique et la pression sur les limites planétaires.\",\n      foot:\"La roue énergétique tourne en sens inverse de la roue monétaire, au rythme fixé par le ratio de transmission. Réduire la pression suppose soit la sobriété (calibrer la roue), soit le découplage.\",\n      hint:\"Les roues tournent — règle le régime ci-dessous.\",\n      hintPaused:\"En pause — appuie sur lecture pour faire tourner l'engrenage.\",\n      c_thr:'Régime de la roue monétaire <small>(PIB)<\/small>',\n      c_dec:'Découplage <small>(ratio de transmission)<\/small>',\n      tl_pib:\"Roue monétaire · PIB\", tl_deb:\"Roue énergétique · débit\", tl_rat:\"Ratio transmission\",\n      m_lbl:\"Pression sur les limites planétaires\",\n      di_t:\"Qu'est-ce que le découplage ?\",\n      di_b:\"<b>Découpler<\/b>, c'est réduire le <b>débit physique<\/b> (énergie, matières) nécessaire pour produire une unité de PIB. Dans l'engrenage, cela revient à <b>réduire le ratio de transmission<\/b> — moins de dents — par l'efficacité énergétique, les renouvelables et l'économie circulaire.\",\n      di_rt:\"Découplage relatif\",\n      di_rb:\"Le débit physique augmente encore, mais <b>moins vite<\/b> que le PIB. Fréquent — mais la pression totale continue de monter.\",\n      di_at:\"Découplage absolu\",\n      di_ab:\"Le PIB monte pendant que le débit <b>baisse<\/b> en valeur absolue. Seul cas qui réduit vraiment la pression — rare, surtout à l'échelle mondiale et pour les matières.\",\n      nameM:\"roue monétaire\", nameE:\"roue énergétique\",\n      decoup:\"découplage actif\",\n      flow:{energy:\"énergie\",entropy:\"entropie\",res:\"ressources\",waste:\"déchets\"},\n      lessonBase:\"À découplage nul, la roue énergétique tourne au même rythme que la monétaire : <b>accélérer le PIB accélère le débit physique<\/b>.\",\n      lessonDec:\"Avec le découplage, la roue énergétique <b>ralentit<\/b> par rapport au PIB — mais le découplage absolu (débit qui baisse pendant que le PIB monte) reste difficile.\",\n      lessonOver:\"⚠ Le débit dépasse la limite : <b>surexploitation<\/b>. Réduis le PIB (sobriété) ou augmente le découplage.\",\n      over:\"dépassement\", ok:\"sous la limite\"\n    },\n    en:{\n      eyebrow:\"The Gear Model · coupled rotation\",\n      title:\"The Gear in Motion\",\n      sub:\"The monetary wheel drives the energy wheel, the opposite way: you can't speed up one without the other. Set the monetary-wheel throttle (GDP) and watch the physical throughput and the pressure on the planetary boundaries.\",\n      foot:\"The energy wheel turns opposite the monetary one, at the pace set by the transmission ratio. Reducing the pressure means either sufficiency (calibrating the wheel) or decoupling.\",\n      hint:\"The wheels are turning — set the throttle below.\",\n      hintPaused:\"Paused — press play to spin the gear.\",\n      c_thr:'Monetary wheel throttle <small>(GDP)<\/small>',\n      c_dec:'Decoupling <small>(transmission ratio)<\/small>',\n      tl_pib:\"Monetary wheel · GDP\", tl_deb:\"Energy wheel · throughput\", tl_rat:\"Transmission ratio\",\n      m_lbl:\"Pressure on planetary boundaries\",\n      di_t:\"What is decoupling?\",\n      di_b:\"<b>Decoupling<\/b> means cutting the <b>physical throughput<\/b> (energy, materials) needed to produce a unit of GDP. In the gear, it amounts to <b>lowering the transmission ratio<\/b> — fewer teeth — through energy efficiency, renewables and the circular economy.\",\n      di_rt:\"Relative decoupling\",\n      di_rb:\"Physical throughput still rises, but <b>slower<\/b> than GDP. Common — yet total pressure keeps climbing.\",\n      di_at:\"Absolute decoupling\",\n      di_ab:\"GDP rises while throughput <b>falls<\/b> in absolute terms. The only case that truly cuts pressure — rare, especially globally and for materials.\",\n      nameM:\"monetary wheel\", nameE:\"energy wheel\",\n      decoup:\"decoupling on\",\n      flow:{energy:\"energy\",entropy:\"entropy\",res:\"resources\",waste:\"waste\"},\n      lessonBase:\"With no decoupling, the energy wheel turns at the same pace as the monetary one: <b>speeding up GDP speeds up physical throughput<\/b>.\",\n      lessonDec:\"With decoupling, the energy wheel <b>slows down<\/b> relative to GDP — but absolute decoupling (throughput falling while GDP rises) stays hard.\",\n      lessonOver:\"⚠ Throughput crosses the boundary: <b>overshoot<\/b>. Cut GDP (sufficiency) or raise decoupling.\",\n      over:\"overshoot\", ok:\"below the boundary\"\n    }\n  };\n\n  // ---------- gears ----------\n  function gearPath(cx,cy,r,n,add,ded){\n    var step=2*Math.PI/n,d='';\n    function P(f,rr){var a=f;return [(cx+rr*Math.cos(a)).toFixed(2),(cy+rr*Math.sin(a)).toFixed(2)];}\n    for(var i=0;i<n;i++){\n      var a=i*step, rt=r-ded, tp=r+add;\n      var q0=P(a,rt),q1=P(a+step*0.16,rt),q2=P(a+step*0.30,tp),q3=P(a+step*0.50,tp),q4=P(a+step*0.64,rt),q5=P(a+step,rt);\n      d+=(i===0?'M '+q0[0]+' '+q0[1]+' ':'')+'L '+q1[0]+' '+q1[1]+' L '+q2[0]+' '+q2[1]+' L '+q3[0]+' '+q3[1]+' L '+q4[0]+' '+q4[1]+' L '+q5[0]+' '+q5[1]+' ';\n    }\n    return d+'Z';\n  }\n  var gMon=document.getElementById('g-mon'), gEn=document.getElementById('g-energy');\n  var rotM=mk('g',{}), rotE=mk('g',{});     // rotating inner groups\n  gMon.appendChild(rotM); gEn.appendChild(rotE);\n  (function(){\n    rotE.appendChild(mk('path',{d:gearPath(cxE,cyE,RE,Ne,8,8),class:'gearE'}));\n    rotE.appendChild(mk('circle',{cx:cxE,cy:cyE,r:16,class:'hubE'}));\n    for(var k=0;k<4;k++){var a=k*Math.PI/2;rotE.appendChild(mk('line',{x1:cxE,y1:cyE,x2:cxE+(RE-16)*Math.cos(a),y2:cyE+(RE-16)*Math.sin(a),class:'spoke'}));}\n\n    rotM.appendChild(mk('path',{d:gearPath(cxM,cyM,RM,Nm,8,8),class:'gearM'}));\n    rotM.appendChild(mk('circle',{cx:cxM,cy:cyM,r:14,class:'hubM'}));\n    // F,P,D markers on pitch circle (rotate with wheel)\n    var poles=[['F',270],['P',0],['D',180]];\n    poles.forEach(function(o){\n      var a=o[1]*Math.PI/180, x=cxM+RM*Math.cos(a), y=cyM+RM*Math.sin(a);\n      rotM.appendChild(mk('circle',{cx:x,cy:y,r:3.2,class:'pole-dot'}));\n      var lx=cxM+(RM-16)*Math.cos(a), ly=cyM+(RM-16)*Math.sin(a);\n      var tx=mk('text',{x:lx,y:ly+4,class:'pole-lbl','text-anchor':'middle'});tx.textContent=o[0];rotM.appendChild(tx);\n    });\n    for(var k=0;k<3;k++){var a=k*2*Math.PI/3+0.4;rotM.appendChild(mk('line',{x1:cxM,y1:cyM,x2:cxM+(RM-14)*Math.cos(a),y2:cyM+(RM-14)*Math.sin(a),class:'spokeM'}));}\n  })();\n\n  // ---------- flows (static, intensity ~ throughput) ----------\n  var LX=cxE-RE-16, RX=cxE+RE+16;\n  var flows={};\n  (function(){\n    var g=document.getElementById('g-flows');\n    flows.eIn=mk('line',{x1:LX,y1:cyE-70,x2:LX,y2:cyE,class:'flow in'});\n    flows.eOut=mk('line',{x1:LX,y1:cyE,x2:LX,y2:cyE+RE-6,class:'flow out','marker-end':'url(#ahOut)'});\n    flows.mIn=mk('line',{x1:RX,y1:cyE+RE-6,x2:RX,y2:cyE,class:'flow in'});\n    flows.mOut=mk('line',{x1:RX,y1:cyE,x2:RX,y2:cyE-70,class:'flow out','marker-end':'url(#ahOut)'});\n    [flows.eIn,flows.eOut,flows.mIn,flows.mOut].forEach(function(f){g.appendChild(f);});\n    // labels\n    flows.lE=mk('text',{x:LX,y:cyE-80,class:'flbl in','text-anchor':'middle'});\n    flows.lEnt=mk('text',{x:LX,y:cyE+RE+8,class:'flbl out','text-anchor':'middle'});\n    flows.lR=mk('text',{x:RX,y:cyE+RE+8,class:'flbl in','text-anchor':'middle'});\n    flows.lW=mk('text',{x:RX,y:cyE-80,class:'flbl out','text-anchor':'middle'});\n    [flows.lE,flows.lEnt,flows.lR,flows.lW].forEach(function(f){g.appendChild(f);});\n  })();\n\n  // names + decoupling badge\n  (function(){\n    var gn=document.getElementById('g-names');\n    var nm=mk('text',{x:cxM,y:cyM-RM-10,class:'wheelname'});nm.id='nameM';gn.appendChild(nm);\n    var ne=mk('text',{x:cxE,y:cyE+4,class:'wheelname'});ne.id='nameE';gn.appendChild(ne);\n    var bd=mk('text',{x:MESH[0]+14,y:MESH[1]-4,class:'decoupbadge','text-anchor':'start'});bd.id='badge';document.getElementById('g-badge').appendChild(bd);\n  })();\n\n  // ---------- state / animation ----------\n  var throttle=document.getElementById('throttle');\n  var running=!reduce, angM=0, angE=0, last=0;\n  var THR_LIMIT=65;\n\n  function coupling(){ return 1; }\n  function debitNorm(){ return (parseFloat(throttle.value)/100)*coupling(); } // 0..1\n\n  function frame(now){\n    if(!last) last=now; var dt=(now-last)/1000; last=now;\n    if(running){\n      var wm=(parseFloat(throttle.value)/100)*95; // deg/s\n      angM=(angM+wm*dt)%360;\n      angE=(angE-wm*dt*(Nm/Ne)*coupling())%360;\n      rotM.setAttribute('transform','rotate('+angM.toFixed(2)+' '+cxM+' '+cyM+')');\n      rotE.setAttribute('transform','rotate('+angE.toFixed(2)+' '+cxE+' '+cyE+')');\n    }\n    requestAnimationFrame(frame);\n  }\n\n  function readouts(){\n    var d=STR[LANG];\n    var pib=Math.round(parseFloat(throttle.value));\n    var deb=Math.round(debitNorm()*100);\n    document.getElementById('throttleV').textContent=pib;\n    document.getElementById('o-pib').textContent=pib;\n    document.getElementById('o-deb').textContent=deb;\n    // meter\n    var over=deb>THR_LIMIT;\n    document.getElementById('o-meter').textContent=deb+' %';\n    var fill=document.getElementById('meterFill');\n    fill.style.width=deb+'%';\n    fill.style.background = over? 'var(--warn)' : (deb>45?'var(--prod)':'var(--eco)');\n    document.getElementById('meterThr').style.left=THR_LIMIT+'%';\n    var note=document.getElementById('meterNote');\n    note.textContent = over? ('▲ '+d.over) : ('· '+d.ok);\n    note.className='mnote'+(over?' over':'');\n    // flows intensity\n    var op=(0.22+0.78*debitNorm()).toFixed(2), w=(2.5+3.5*debitNorm()).toFixed(1);\n    [flows.eIn,flows.eOut,flows.mIn,flows.mOut].forEach(function(f){f.style.opacity=op;f.style.strokeWidth=w;});\n    [flows.lE,flows.lEnt,flows.lR,flows.lW].forEach(function(f){f.style.opacity=(0.4+0.6*debitNorm()).toFixed(2);});\n    // lesson\n    var lesson=document.getElementById('lesson');\n    lesson.innerHTML = over? d.lessonOver : d.lessonBase;\n  }\n\n  throttle.addEventListener('input',readouts);\n\n  // play/pause\n  function setIcon(){var p=document.getElementById('ico-play'),q=document.getElementById('ico-pause');(running?p:q).setAttribute('hidden','');(running?q:p).removeAttribute('hidden');}\n  document.getElementById('play').addEventListener('click',function(){running=!running;setIcon();updateHint();});\n  function updateHint(){document.querySelector('.hint').textContent = running?STR[LANG].hint:STR[LANG].hintPaused;}\n\n  // toggles\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme');if(a)return a;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}\n  document.getElementById('theme').addEventListener('click',function(){document.documentElement.setAttribute('data-theme',effTheme()==='dark'?'light':'dark');try{localStorage.setItem('coupl_theme',effTheme());}catch(e){}});\n  try{var stt=localStorage.getItem('coupl_theme');if(stt)document.documentElement.setAttribute('data-theme',stt);}catch(e){}\n\n  function applyLang(){\n    var d=STR[LANG];document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');if(d[k])el.innerHTML=d[k];});\n    document.getElementById('langlbl').textContent=LANG.toUpperCase();\n    document.getElementById('nameM').textContent=d.nameM;\n    document.getElementById('nameE').textContent=d.nameE;\n    flows.lE.textContent=d.flow.energy; flows.lEnt.textContent=d.flow.entropy;\n    flows.lR.textContent=d.flow.res; flows.lW.textContent=d.flow.waste;\n    updateHint(); readouts();\n  }\n  document.getElementById('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem('coupl_lang',LANG);}catch(e){}applyLang();});\n\n  // boot\n  setIcon(); applyLang(); readouts();\n  // static mesh pose when paused (so the resting frame shows interlocked gears)\n  rotE.setAttribute('transform','rotate('+(360/Ne/2)+' '+cxE+' '+cyE+')');\n  requestAnimationFrame(frame);\n})();\n<\/script>\n\n<\/body>\n<\/html>\n", "verhulst-modele.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Croissance exponentielle vs logistique<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#F1F4F0;\n    --surface:#FCFCFB;\n    --panel:#F7F9F6;\n    --ink:#17201C;\n    --muted:#5C6863;\n    --faint:#8A948E;\n    --line:#DCE3DD;\n    --grid:#E7ECE6;\n    --logi:#0C8A5A;\n    --expo:#C4531A;\n    --gold:#A9791B;\n    --logi-soft:rgba(12,138,90,.12);\n    --expo-soft:rgba(196,83,26,.11);\n    --shadow:0 1px 2px rgba(23,32,28,.05),0 8px 24px rgba(23,32,28,.06);\n    --font-d:\"Spectral\",Georgia,serif;\n    --font-b:\"IBM Plex Sans\",system-ui,sans-serif;\n    --font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n  }\n  :root:not([data-theme=\"light\"]){\n    @media (prefers-color-scheme:dark){\n      --bg:#0E110D;--surface:#181C17;--panel:#14180F;\n      --ink:#E9EDE8;--muted:#98A29A;--faint:#727B74;\n      --line:#2A312B;--grid:#242A24;\n      --logi:#33936B;--expo:#CC6C2A;--gold:#C9A445;\n      --logi-soft:rgba(51,147,107,.16);--expo-soft:rgba(204,108,42,.15);\n      --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);\n    }\n  }\n  :root[data-theme=\"dark\"]{\n    --bg:#0E110D;--surface:#181C17;--panel:#14180F;\n    --ink:#E9EDE8;--muted:#98A29A;--faint:#727B74;\n    --line:#2A312B;--grid:#242A24;\n    --logi:#33936B;--expo:#CC6C2A;--gold:#C9A445;\n    --logi-soft:rgba(51,147,107,.16);--expo-soft:rgba(204,108,42,.15);\n    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);\n  }\n\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);\n       line-height:1.5;-webkit-font-smoothing:antialiased;}\n  .wrap{max-width:1120px;margin:0 auto;padding-block:28px 44px;padding-inline:20px;}\n\n  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}\n  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;\n           color:var(--logi);font-weight:500;margin:0 0 6px;}\n  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(30px,5vw,44px);\n     line-height:1.02;margin:0;letter-spacing:-.01em;text-wrap:balance;}\n  .sub{color:var(--muted);font-size:15px;margin:8px 0 0;max-width:62ch;text-wrap:pretty;}\n  .toggles{display:flex;gap:8px;flex-shrink:0;}\n  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);\n      color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}\n  .tg:hover{color:var(--ink);border-color:var(--faint);}\n  .tg b{color:var(--ink);font-weight:600;}\n  .tg:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--logi);outline-offset:2px;}\n\n  .stage{display:grid;grid-template-columns:1.62fr 1fr;gap:18px;margin-top:26px;align-items:start;}\n  @media (max-width:820px){.stage{grid-template-columns:1fr;}}\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}\n  .pad{padding:16px 18px;}\n\n  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:14px 18px 4px;}\n  .lg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}\n  .lg .swatch{width:22px;height:0;border-top-width:3px;border-top-style:solid;border-radius:2px;}\n  .lg.logi .swatch{border-color:var(--logi);}\n  .lg.expo .swatch{border-top-style:dashed;border-color:var(--expo);}\n  .lg.cap .swatch{border-top-style:dashed;border-color:var(--faint);width:22px;}\n  .lg b{color:var(--ink);font-weight:500;}\n\n  .plotwrap{position:relative;padding:6px 10px 12px;}\n  canvas{display:block;width:100%;}\n  #plot{height:370px;}\n  @media (max-width:560px){#plot{height:300px;}}\n\n  .playbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;}\n  .play{width:42px;height:42px;border-radius:50%;border:none;background:var(--logi);color:#fff;\n        cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:transform .12s;}\n  .play:hover{transform:scale(1.05);}\n  .play svg{width:17px;height:17px;fill:#fff;}\n  .scrub{flex:1;min-width:140px;display:flex;align-items:center;gap:10px;}\n  .scrub input{flex:1;}\n  .tlabel{font-family:var(--font-m);font-size:12.5px;color:var(--muted);white-space:nowrap;}\n  .tlabel b{color:var(--ink);}\n  .ghost-btn{font-family:var(--font-b);font-size:12.5px;border:1px solid var(--line);background:transparent;\n             color:var(--muted);border-radius:8px;padding:8px 10px;cursor:pointer;}\n  .ghost-btn:hover{color:var(--ink);border-color:var(--faint);}\n  .spd{font-family:var(--font-m);font-size:12px;color:var(--muted);border:1px solid var(--line);\n       background:var(--surface);border-radius:8px;padding:7px 8px;}\n\n  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:var(--grid);border-radius:3px;outline-offset:4px;}\n  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;\n       background:var(--surface);border:2px solid var(--logi);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);}\n  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);\n       border:2px solid var(--logi);cursor:pointer;}\n\n  .params{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;padding:16px 18px;border-top:1px solid var(--line);}\n  @media (max-width:560px){.params{grid-template-columns:1fr;}}\n  .prm label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:7px;}\n  .prm .nm{font-weight:500;color:var(--ink);}\n  .prm .nm i{font-family:var(--font-d);font-style:italic;font-weight:500;}\n  .prm .val{font-family:var(--font-m);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;}\n  .prm input[type=range]{width:100%;}\n\n  /* side column */\n  .side{display:flex;flex-direction:column;gap:18px;}\n  .eq{font-family:var(--font-d);text-align:center;font-size:26px;color:var(--ink);\n      padding:10px 0 14px;letter-spacing:.01em;}\n  .eq i{font-style:italic;}\n  .eq .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;\n            font-size:16px;line-height:1.05;margin:0 2px;}\n  .eq .frac span:first-child{border-bottom:1.5px solid var(--ink);padding:0 4px 1px;}\n  .eq .frac span:last-child{padding:1px 4px 0;}\n  .glossary{display:grid;gap:7px;font-size:13px;color:var(--muted);}\n  .glossary div{display:flex;gap:9px;align-items:baseline;}\n  .glossary .k{font-family:var(--font-d);font-style:italic;font-size:15px;color:var(--ink);min-width:20px;flex-shrink:0;}\n\n  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);\n         border:1px solid var(--line);border-radius:12px;overflow:hidden;}\n  .tile{background:var(--surface);padding:12px 14px;}\n  .tile .t-l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);\n             font-family:var(--font-m);margin-bottom:4px;}\n  .tile .t-v{font-family:var(--font-m);font-size:21px;font-weight:500;color:var(--ink);\n             font-variant-numeric:tabular-nums;line-height:1;}\n  .tile .t-v small{font-size:12px;color:var(--muted);font-weight:400;}\n  .phase{grid-column:1/-1;background:var(--panel);}\n  .phase .t-v{font-family:var(--font-d);font-size:17px;font-weight:500;}\n  .phase .t-v.p0{color:var(--expo);} .phase .t-v.p1{color:var(--gold);}\n  .phase .t-v.p2{color:var(--logi);} .phase .t-v.p3{color:var(--logi);}\n\n  .rn-title{font-size:13px;color:var(--muted);padding:14px 18px 0;}\n  .rn-title b{color:var(--ink);font-weight:600;font-family:var(--font-d);}\n  #rnplot{height:172px;}\n\n  .regimes{display:grid;gap:0;}\n  .rg{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 18px;border-top:1px solid var(--line);}\n  .rg:first-child{border-top:none;}\n  .rg .dot{width:11px;height:11px;border-radius:50%;margin-top:5px;}\n  .rg .cond{font-family:var(--font-m);font-size:12px;color:var(--ink);font-weight:500;}\n  .rg .desc{font-size:12.5px;color:var(--muted);margin-top:2px;text-wrap:pretty;}\n\n  footer{margin-top:26px;color:var(--faint);font-size:12px;text-align:center;text-wrap:balance;}\n  footer i{font-family:var(--font-d);font-style:italic;}\n  .hd-note{font-family:var(--font-d);font-style:italic;color:var(--gold);}\n\n  /* chessboard metaphor */\n  .chesshead{padding:16px 18px 2px;}\n  .chesshead h2{font-family:var(--font-d);font-weight:600;font-size:19px;margin:0 0 5px;letter-spacing:-.01em;}\n  .chesshead .eb{font-family:var(--font-m);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--expo);font-weight:500;margin:0 0 6px;}\n  .chesshead p{font-size:13.5px;color:var(--muted);margin:0;max-width:74ch;text-wrap:pretty;}\n  .chesshead p b{color:var(--ink);font-weight:600;} .chesshead p i{font-family:var(--font-d);font-style:italic;}\n  .chessgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;padding:14px 18px 18px;align-items:start;}\n  @media(max-width:760px){.chessgrid{grid-template-columns:1fr;}}\n  .chessboard svg{display:block;width:100%;height:auto;}\n  .chesspanel{display:flex;flex-direction:column;gap:14px;}\n  .chessctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}\n  .chessctl input[type=range]{flex:1;min-width:120px;}\n  .stepbtn{font-family:var(--font-m);font-size:15px;line-height:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:9px 12px;cursor:pointer;}\n  .stepbtn:hover{color:var(--ink);border-color:var(--faint);}\n  .chesscap{font-size:12.8px;color:var(--muted);text-wrap:pretty;margin:0;line-height:1.55;}\n  .chesscap b{color:var(--ink);font-weight:600;} .chesscap i{font-family:var(--font-d);font-style:italic;}\n  .chesstiles .tile .t-v{font-size:18px;}\n  .chesstiles .tile .t-v small{font-size:11px;}\n\n  /* section headers + two-growth contrast */\n  .secthead{display:flex;align-items:baseline;gap:11px;margin-top:32px;border-bottom:1px solid var(--line);padding-bottom:9px;}\n  .secthead .sn{font-family:var(--font-m);font-size:12px;font-weight:600;color:#fff;background:var(--logi);border-radius:7px;padding:3px 10px;line-height:1;}\n  .secthead.s1 .sn{background:var(--expo);}\n  .secthead h2{font-family:var(--font-d);font-weight:600;font-size:21px;margin:0;letter-spacing:-.01em;}\n  .sectlead{color:var(--muted);font-size:14px;margin:11px 0 2px;max-width:84ch;text-wrap:pretty;}\n  .sectlead b{color:var(--ink);font-weight:600;} .sectlead i{font-family:var(--font-d);font-style:italic;}\n  .twogrow{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px;}\n  @media(max-width:620px){.twogrow{grid-template-columns:1fr;}}\n  .tw{background:var(--surface);padding:16px 18px;}\n  .tw .emb{height:34px;margin-bottom:9px;}\n  .tw .emb svg{height:34px;width:auto;display:block;}\n  .tw h3{font-family:var(--font-d);font-weight:600;font-size:16px;margin:0 0 6px;}\n  .tw.exp h3{color:var(--expo);} .tw.log h3{color:var(--logi);}\n  .tw p{font-size:13px;color:var(--muted);margin:0;text-wrap:pretty;}\n  .tw p b{color:var(--ink);font-weight:600;} .tw p i{font-family:var(--font-d);font-style:italic;}\n  .stage{margin-top:16px !important;}\n<\/style>\n\n<div class=\"wrap\">\n  <header>\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\">Macroéconomie écologique · Séance 1<\/p>\n      <h1 data-t=\"title\">Exponentielle ou logistique ?<\/h1>\n      <p class=\"sub\" data-t=\"sub\">Deux façons de croître, et une limite qui fait toute la différence. On oppose d'abord les deux régimes ; le <b>modèle de Verhulst<\/b> vient ensuite formaliser le frein — première marche vers la question de l'<b>exploitation des ressources<\/b>.<\/p>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button>\n    <\/div>\n  <\/header>\n\n  <!-- PART 1 : the two growth types -->\n  <div class=\"secthead s1\"><span class=\"sn\">1<\/span><h2 data-t=\"s1t\">Deux types de croissance<\/h2><\/div>\n  <p class=\"sectlead\" data-t=\"s1lead\"><\/p>\n  <div class=\"twogrow\">\n    <div class=\"tw exp\">\n      <div class=\"emb\"><svg viewBox=\"0 0 52 34\" fill=\"none\" stroke=\"var(--expo)\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M2 32 C 26 32 35 20 48 2\"/><\/svg><\/div>\n      <h3 data-t=\"tw_exp_t\">Croissance exponentielle<\/h3>\n      <p data-t=\"tw_exp_b\"><\/p>\n    <\/div>\n    <div class=\"tw log\">\n      <div class=\"emb\"><svg viewBox=\"0 0 52 34\" fill=\"none\" stroke-linecap=\"round\"><path d=\"M2 8 H50\" stroke=\"var(--faint)\" stroke-width=\"1.2\" stroke-dasharray=\"2 3\"/><path d=\"M2 31 C 17 31 17 5 50 4\" stroke=\"var(--logi)\" stroke-width=\"2.4\"/><\/svg><\/div>\n      <h3 data-t=\"tw_log_t\">Croissance logistique<\/h3>\n      <p data-t=\"tw_log_b\"><\/p>\n    <\/div>\n  <\/div>\n\n  <!-- chessboard : exponential metaphor -->\n  <div class=\"card chess\" style=\"margin-top:16px;overflow:hidden\">\n    <div class=\"chesshead\">\n      <p class=\"eb\" id=\"chs-eb\">Croissance exponentielle<\/p>\n      <h2 id=\"chs-title\">La métaphore de l'échiquier<\/h2>\n      <p id=\"chs-intro\"><\/p>\n    <\/div>\n    <div class=\"chessgrid\">\n      <div class=\"chessboard\">\n        <svg id=\"chessboard\" viewBox=\"0 0 460 460\" role=\"img\" aria-label=\"Échiquier des grains de riz — un grain sur la première case, doublé à chaque case\"><\/svg>\n      <\/div>\n      <div class=\"chesspanel\">\n        <div class=\"tiles chesstiles\">\n          <div class=\"tile\"><div class=\"t-l\" id=\"chs-l1\">Case<\/div><div class=\"t-v\" id=\"chs-case\">1<\/div><\/div>\n          <div class=\"tile\"><div class=\"t-l\" id=\"chs-l2\">Grains sur la case<\/div><div class=\"t-v\" id=\"chs-grains\">1<\/div><\/div>\n          <div class=\"tile\"><div class=\"t-l\" id=\"chs-l3\">Total (cases 1 à n)<\/div><div class=\"t-v\" id=\"chs-total\">1<\/div><\/div>\n          <div class=\"tile\"><div class=\"t-l\" id=\"chs-l4\">Poids de riz<\/div><div class=\"t-v\" id=\"chs-mass\">0,025 g<\/div><\/div>\n        <\/div>\n        <div class=\"chessctl\">\n          <button class=\"play\" id=\"chs-play\" aria-label=\"Balayer\">\n            <svg id=\"chs-ico-play\" viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg>\n            <svg id=\"chs-ico-pause\" viewBox=\"0 0 24 24\" hidden><path d=\"M6 5h4v14H6zM14 5h4v14h-4z\"/><\/svg>\n          <\/button>\n          <button class=\"stepbtn\" id=\"chs-prev\" aria-label=\"Case précédente\">−<\/button>\n          <input type=\"range\" id=\"chs-slider\" min=\"1\" max=\"64\" step=\"1\" value=\"1\" aria-label=\"Numéro de case\">\n          <button class=\"stepbtn\" id=\"chs-next\" aria-label=\"Case suivante\">+<\/button>\n        <\/div>\n        <p class=\"chesscap\" id=\"chs-cap\"><\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- PART 2 : Verhulst -->\n  <div class=\"secthead s2\"><span class=\"sn\">2<\/span><h2 data-t=\"s2t\">Le modèle de Verhulst<\/h2><\/div>\n  <p class=\"sectlead\" data-t=\"s2lead\"><\/p>\n\n  <div class=\"stage\">\n    <!-- MAIN -->\n    <div class=\"card\" style=\"overflow:hidden\">\n      <div class=\"legend\">\n        <span class=\"lg logi\"><span class=\"swatch\"><\/span><b data-t=\"lg_log\">Logistique<\/b><\/span>\n        <span class=\"lg expo\"><span class=\"swatch\"><\/span><b data-t=\"lg_exp\">Exponentielle<\/b><\/span>\n        <span class=\"lg cap\"><span class=\"swatch\"><\/span><b>K<\/b>&nbsp;<span data-t=\"lg_cap\">capacité de charge<\/span><\/span>\n      <\/div>\n      <div class=\"plotwrap\"><canvas id=\"plot\"><\/canvas><\/div>\n\n      <div class=\"playbar\">\n        <button class=\"play\" id=\"play\" aria-label=\"Lecture / pause\">\n          <svg id=\"ico-play\" viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg>\n          <svg id=\"ico-pause\" viewBox=\"0 0 24 24\" hidden><path d=\"M6 5h4v14H6zM14 5h4v14h-4z\"/><\/svg>\n        <\/button>\n        <div class=\"scrub\">\n          <input type=\"range\" id=\"time\" min=\"0\" max=\"1000\" value=\"1000\" step=\"1\" aria-label=\"Temps\">\n        <\/div>\n        <span class=\"tlabel\"><span data-t=\"time\">t<\/span> = <b id=\"tval\">0<\/b><\/span>\n        <select class=\"spd\" id=\"speed\" aria-label=\"Vitesse\">\n          <option value=\"0.5\">0.5×<\/option>\n          <option value=\"1\" selected>1×<\/option>\n          <option value=\"2\">2×<\/option>\n          <option value=\"4\">4×<\/option>\n        <\/select>\n        <button class=\"ghost-btn\" id=\"replay\" data-t=\"replay\">↺ Rejouer<\/button>\n      <\/div>\n\n      <div class=\"params\">\n        <div class=\"prm\">\n          <label><span class=\"nm\"><i>r<\/i> — <span data-t=\"p_r\">taux intrinsèque<\/span><\/span><span class=\"val\" id=\"rv\">0.050<\/span><\/label>\n          <input type=\"range\" id=\"r\" min=\"0.01\" max=\"0.15\" step=\"0.005\" value=\"0.05\">\n        <\/div>\n        <div class=\"prm\">\n          <label><span class=\"nm\"><i>K<\/i> — <span data-t=\"p_k\">capacité de charge<\/span><\/span><span class=\"val\" id=\"kv\">1000<\/span><\/label>\n          <input type=\"range\" id=\"k\" min=\"200\" max=\"2000\" step=\"50\" value=\"1000\">\n        <\/div>\n        <div class=\"prm\">\n          <label><span class=\"nm\"><i>N<\/i>₀ — <span data-t=\"p_n\">population initiale<\/span><\/span><span class=\"val\" id=\"nv\">1<\/span><\/label>\n          <input type=\"range\" id=\"n0\" min=\"1\" max=\"120\" step=\"1\" value=\"1\">\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- SIDE -->\n    <div class=\"side\">\n      <div class=\"card pad\">\n        <div class=\"eq\">\n          <i>R<\/i> = <i>r<\/i>&thinsp;(1 −\n          <span class=\"frac\"><span><i>N<\/i><\/span><span><i>K<\/i><\/span><\/span>)\n        <\/div>\n        <div class=\"glossary\">\n          <div><span class=\"k\">R<\/span><span data-t=\"g_R\">taux de croissance <em>observé<\/em> (par tête)<\/span><\/div>\n          <div><span class=\"k\">r<\/span><span data-t=\"g_r\">taux intrinsèque, la croissance maximale sans contrainte<\/span><\/div>\n          <div><span class=\"k\">N<\/span><span data-t=\"g_N\">taille de la population (le stock)<\/span><\/div>\n          <div><span class=\"k\">K<\/span><span data-t=\"g_K\">capacité de charge — la limite de l'environnement<\/span><\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"tiles\">\n        <div class=\"tile\"><div class=\"t-l\" data-t=\"tl_t\">Temps t<\/div><div class=\"t-v\" id=\"o-t\">0<\/div><\/div>\n        <div class=\"tile\"><div class=\"t-l\" data-t=\"tl_n\">N logistique<\/div><div class=\"t-v\" id=\"o-n\">1<\/div><\/div>\n        <div class=\"tile\"><div class=\"t-l\" data-t=\"tl_r\">Taux R<\/div><div class=\"t-v\" id=\"o-r\">5.0<small>%<\/small><\/div><\/div>\n        <div class=\"tile\"><div class=\"t-l\" data-t=\"tl_f\">N / K<\/div><div class=\"t-v\" id=\"o-f\">0.00<\/div><\/div>\n        <div class=\"tile phase\"><div class=\"t-l\" data-t=\"tl_ph\">Régime<\/div><div class=\"t-v p0\" id=\"o-ph\">—<\/div><\/div>\n      <\/div>\n\n    <\/div>\n  <\/div>\n\n  <!-- regimes full width -->\n  <div class=\"card\" style=\"margin-top:18px;overflow:hidden\">\n    <div class=\"regimes\" id=\"regimes\"><\/div>\n  <\/div>\n\n  <footer>\n    <span data-t=\"foot\">Point d'inflexion en <i>N = K/2<\/i> : la vitesse de croissance dN/dt y est maximale, avant que le frein ne l'emporte. Au-delà de K, R devient négatif — surexploitation puis retour vers K.<\/span>\n  <\/footer>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  // ---------- i18n ----------\n  var LANG = 'fr';\n  try{ var s=localStorage.getItem('verhulst_lang'); if(s) LANG=s; }catch(e){}\n  var STR = {\n    fr:{\n      eyebrow:\"Macroéconomie écologique · Séance 1\", title:\"Exponentielle ou logistique ?\",\n      sub:\"Deux façons de croître, et une limite qui fait toute la différence. On oppose d'abord les deux régimes ; le <b>modèle de Verhulst<\/b> vient ensuite formaliser le frein — première marche vers la question de l'<b>exploitation des ressources<\/b>.\",\n      s1t:\"Deux types de croissance\",\n      s1lead:\"Avant tout modèle, l'intuition. Une population peut croître de deux façons opposées, selon une seule question : le <b>taux de croissance<\/b> reste-t-il constant, ou se <b>réduit-il<\/b> à l'approche d'une limite ?\",\n      tw_exp_t:\"Croissance exponentielle\",\n      tw_exp_b:\"Le taux de croissance est <b>constant<\/b> : la population augmente du même pourcentage à chaque pas, elle <b>double<\/b> à intervalle fixe. Rien ne la freine — elle <b>explose<\/b> et file vers l'infini. C'est la légende de l'échiquier ci-dessous.\",\n      tw_log_t:\"Croissance logistique\",\n      tw_log_b:\"Le taux <b>diminue<\/b> à mesure que la population approche une <b>limite<\/b>. La courbe prend une forme en <b>S<\/b> : montée rapide, ralentissement, puis <b>plateau<\/b>. La croissance se stabilise au lieu d'exploser.\",\n      s2t:\"Le modèle de Verhulst\",\n      s2lead:\"Verhulst (1845) formalise ce frein en une seule équation : le taux observé <i>R<\/i> décroît avec <i>N/K<\/i>. C'est le passage de l'intuition au mécanisme — et le point de départ pour penser l'<b>exploitation des ressources<\/b> : jusqu'où prélever sans dépasser la limite ?\",\n      lg_log:\"Logistique\", lg_exp:\"Exponentielle\", lg_cap:\"capacité de charge\",\n      time:\"t\", replay:\"↺ Rejouer\",\n      p_r:\"taux intrinsèque\", p_k:\"capacité de charge\", p_n:\"population initiale\",\n      g_R:\"taux de croissance <em>observé<\/em> (par tête)\", g_r:\"taux intrinsèque, la croissance maximale sans contrainte\",\n      g_N:\"taille de la population (le stock)\", g_K:\"capacité de charge — la limite de l'environnement\",\n      tl_t:\"Temps t\", tl_n:\"N logistique\", tl_r:\"Taux R\", tl_f:\"N / K\", tl_ph:\"Régime\",\n      rn_h:\"Le frein environnemental.\", rn_s:\"R décroît linéairement avec N, s'annule en K.\",\n      foot:\"Le point d'inflexion (N = K/2) marque la vitesse de croissance maximale. Le scénario exponentiel, lui, ignore K : il dépasse la capacité de charge, atteint 2K, puis s'effondre — surexploitation et épuisement des ressources.\",\n      ax_t:\"temps (t)\", ax_n:\"population (N)\", ax_rn_x:\"population (N)\", ax_rn_y:\"taux R\",\n      c_log:\"Logistique\", c_exp:\"Exponentielle\", c_infl:\"point d'inflexion\", c_crash:\"effondrement\",\n      rn_r:\"r  (N→0)\", rn_k:\"K\",\n      ph:[\"Croissance quasi-exponentielle\",\"Point d'inflexion · N ≈ K/2\",\"Croissance freinée\",\"Plateau · état stationnaire\"],\n      regimes:[\n        [\"N ≪ K\",\"R ≈ r — le frein est inactif, la croissance est quasi exponentielle. La population « ne sent pas » encore la limite.\"],\n        [\"N = K/2\",\"Point d'inflexion : la vitesse dN/dt est maximale. Au-delà, l'environnement se comporte comme un stabilisateur.\"],\n        [\"N → K\",\"(1 − N/K) → 0, donc R diminue : le frein se resserre, la croissance ralentit vers le plateau.\"],\n        [\"N = K\",\"R = 0 : équilibre stable, l'état stationnaire. Si N > K, R devient négatif et la population redescend vers K.\"]\n      ]\n    },\n    en:{\n      eyebrow:\"Ecological macroeconomics · Session 1\", title:\"Exponential or logistic?\",\n      sub:\"Two ways to grow, and one limit that makes all the difference. We first contrast the two regimes; the <b>Verhulst model<\/b> then formalises the brake — a first step toward the question of <b>resource exploitation<\/b>.\",\n      s1t:\"Two kinds of growth\",\n      s1lead:\"Before any model, the intuition. A population can grow in two opposite ways, hinging on a single question: does the <b>growth rate<\/b> stay constant, or does it <b>fall<\/b> as a limit approaches?\",\n      tw_exp_t:\"Exponential growth\",\n      tw_exp_b:\"The growth rate is <b>constant<\/b>: the population rises by the same percentage at each step, <b>doubling<\/b> at a fixed interval. Nothing brakes it — it <b>explodes<\/b> toward infinity. This is the chessboard legend below.\",\n      tw_log_t:\"Logistic growth\",\n      tw_log_b:\"The rate <b>falls<\/b> as the population approaches a <b>limit<\/b>. The curve takes an <b>S<\/b> shape: fast rise, slowdown, then a <b>plateau<\/b>. Growth settles instead of exploding.\",\n      s2t:\"The Verhulst model\",\n      s2lead:\"Verhulst (1845) formalises this brake in a single equation: the observed rate <i>R<\/i> falls with <i>N/K<\/i>. This is the move from intuition to mechanism — and the starting point for thinking about <b>resource exploitation<\/b>: how far can we harvest without overshooting the limit?\",\n      lg_log:\"Logistic\", lg_exp:\"Exponential\", lg_cap:\"carrying capacity\",\n      time:\"t\", replay:\"↺ Replay\",\n      p_r:\"intrinsic rate\", p_k:\"carrying capacity\", p_n:\"initial population\",\n      g_R:\"<em>observed<\/em> growth rate (per capita)\", g_r:\"intrinsic rate — maximum growth with no constraint\",\n      g_N:\"population size (the stock)\", g_K:\"carrying capacity — the environment's limit\",\n      tl_t:\"Time t\", tl_n:\"N logistic\", tl_r:\"Rate R\", tl_f:\"N / K\", tl_ph:\"Regime\",\n      rn_h:\"The environmental brake.\", rn_s:\"R falls linearly with N, reaching zero at K.\",\n      foot:\"The inflection point (N = K/2) marks peak growth speed. The exponential scenario ignores K entirely: it overshoots the carrying capacity, reaches 2K, then collapses — overshoot and resource depletion.\",\n      ax_t:\"time (t)\", ax_n:\"population (N)\", ax_rn_x:\"population (N)\", ax_rn_y:\"rate R\",\n      c_log:\"Logistic\", c_exp:\"Exponential\", c_infl:\"inflection point\", c_crash:\"collapse\",\n      rn_r:\"r  (N→0)\", rn_k:\"K\",\n      ph:[\"Near-exponential growth\",\"Inflection point · N ≈ K/2\",\"Braked growth\",\"Plateau · steady state\"],\n      regimes:[\n        [\"N ≪ K\",\"R ≈ r — the brake is idle, growth is nearly exponential. The population does not yet 'feel' the limit.\"],\n        [\"N = K/2\",\"Inflection point: speed dN/dt is at its maximum. Beyond it, the environment acts as a stabiliser.\"],\n        [\"N → K\",\"(1 − N/K) → 0, so R falls: the brake tightens and growth slows toward the plateau.\"],\n        [\"N = K\",\"R = 0: stable equilibrium, the steady state. If N > K, R turns negative and the population falls back toward K.\"]\n      ]\n    }\n  };\n\n  function applyLang(){\n    var d=STR[LANG];\n    document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){\n      var k=el.getAttribute('data-t'); if(d[k]!=null) el.innerHTML=d[k];\n    });\n    document.getElementById('langlbl').textContent = LANG.toUpperCase();\n    buildRegimes();\n  }\n  function buildRegimes(){\n    var d=STR[LANG], cols=[getVar('--expo'),getVar('--gold'),getVar('--logi'),getVar('--logi')];\n    var box=document.getElementById('regimes'); box.innerHTML='';\n    d.regimes.forEach(function(rg,i){\n      var el=document.createElement('div'); el.className='rg';\n      el.innerHTML='<span class=\"dot\" style=\"background:'+cols[i]+'\"><\/span>'+\n                   '<div><div class=\"cond\">'+rg[0]+'<\/div><div class=\"desc\">'+rg[1]+'<\/div><\/div>';\n      box.appendChild(el);\n    });\n  }\n\n  // ---------- theme ----------\n  function getVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }\n  function effectiveTheme(){\n    var a=document.documentElement.getAttribute('data-theme');\n    if(a) return a;\n    return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';\n  }\n  document.getElementById('theme').addEventListener('click',function(){\n    document.documentElement.setAttribute('data-theme', effectiveTheme()==='dark'?'light':'dark');\n    try{localStorage.setItem('verhulst_theme',effectiveTheme());}catch(e){}\n    buildRegimes(); drawAll();\n  });\n  try{var st=localStorage.getItem('verhulst_theme'); if(st) document.documentElement.setAttribute('data-theme',st);}catch(e){}\n  if(window.matchMedia){ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){buildRegimes();drawAll();}); }\n\n  // ---------- model ----------\n  var P={ r:0.05, K:1000, N0:1 };\n  var D={};\n  function derive(){\n    D.A=(P.K-P.N0)/P.N0;\n    D.tStar = D.A>0 ? Math.log(D.A)/P.r : 0;\n    D.tCrash = Math.log(2*P.K/P.N0)/P.r;   // exponential reaches 2K here, then collapses\n    D.tMax = 300;                          // fixed window — long enough to see stabilisation\n    D.yMax = 2.15*P.K;\n  }\n  function Nlog(t){ return P.K/(1+D.A*Math.exp(-P.r*t)); }\n  function Nexp(t){\n    if(t<=D.tCrash) return P.N0*Math.exp(P.r*t);      // unchecked growth up to 2K\n    return 2*P.K*Math.exp(-0.17*(t-D.tCrash));         // overshoot → collapse\n  }\n\n  // ---------- canvases ----------\n  var plot=document.getElementById('plot'), pctx=plot.getContext('2d');\n  var rn=document.getElementById('rnplot'), rctx=rn?rn.getContext('2d'):null;\n  var pW,pH,rW,rH,DPR=1;\n  function sizeCanvas(cv,ctx){\n    DPR=Math.min(window.devicePixelRatio||1,2);\n    var r=cv.getBoundingClientRect();\n    cv.width=Math.round(r.width*DPR); cv.height=Math.round(r.height*DPR);\n    ctx.setTransform(DPR,0,0,DPR,0,0);\n    return [r.width,r.height];\n  }\n  function resize(){\n    var a=sizeCanvas(plot,pctx); pW=a[0]; pH=a[1];\n    if(rn){ var b=sizeCanvas(rn,rctx); rW=b[0]; rH=b[1]; }\n    drawAll();\n  }\n\n  function fmt(n){ return n>=1000? Math.round(n).toLocaleString('en-US').replace(/,/g,' ') : (n>=100?Math.round(n):n.toFixed(n<10?1:0)); }\n\n  // ---------- main plot ----------\n  function drawPlot(){\n    var d=STR[LANG];\n    var ink=getVar('--ink'), muted=getVar('--muted'), faint=getVar('--faint'),\n        grid=getVar('--grid'), logi=getVar('--logi'), expo=getVar('--expo'),\n        gold=getVar('--gold'), surface=getVar('--surface');\n    var padL=48,padR=70,padT=16,padB=32;\n    var x0=padL,x1=pW-padR,y0=padT,y1=pH-padB;\n    pctx.clearRect(0,0,pW,pH);\n    var X=function(t){return x0+(t/D.tMax)*(x1-x0);};\n    var Y=function(N){return y1-(N/D.yMax)*(y1-y0);};\n\n    // y gridlines at K/2, K, 2K\n    pctx.font='11px \"IBM Plex Mono\",monospace'; pctx.textBaseline='middle';\n    var ylevels=[{v:0,l:'0'},{v:P.K/2,l:'K/2'},{v:P.K,l:'K'},{v:2*P.K,l:'2K'}];\n    ylevels.forEach(function(g){\n      var yy=Y(g.v);\n      pctx.strokeStyle=grid; pctx.lineWidth=1;\n      pctx.beginPath();pctx.moveTo(x0,yy);pctx.lineTo(x1,yy);pctx.stroke();\n      pctx.fillStyle=faint; pctx.textAlign='right'; pctx.fillText(g.l,x0-8,yy);\n    });\n    // x ticks\n    pctx.textAlign='center'; pctx.textBaseline='top';\n    var step=niceStep(D.tMax);\n    for(var t=0;t<=D.tMax+0.5;t+=step){\n      var xx=X(t);\n      pctx.strokeStyle=grid;pctx.lineWidth=1;\n      pctx.beginPath();pctx.moveTo(xx,y1);pctx.lineTo(xx,y1+4);pctx.stroke();\n      pctx.fillStyle=faint; pctx.fillText(Math.round(t),xx,y1+7);\n    }\n\n    // K reference line (dashed)\n    pctx.save();\n    pctx.setLineDash([5,4]); pctx.strokeStyle=faint; pctx.lineWidth=1.4;\n    pctx.beginPath();pctx.moveTo(x0,Y(P.K));pctx.lineTo(x1,Y(P.K));pctx.stroke();\n    // K/2 line lighter\n    pctx.setLineDash([2,4]); pctx.strokeStyle=faint; pctx.globalAlpha=.6;\n    pctx.beginPath();pctx.moveTo(x0,Y(P.K/2));pctx.lineTo(x1,Y(P.K/2));pctx.stroke();\n    pctx.restore();\n\n    // clip plotting region\n    pctx.save();\n    pctx.beginPath();pctx.rect(x0,y0-2,x1-x0,y1-y0+2);pctx.clip();\n\n    // helper to trace a curve\n    function trace(fn,tEnd,color,dash,w,alpha){\n      pctx.save();\n      pctx.strokeStyle=color; pctx.lineWidth=w; pctx.globalAlpha=alpha;\n      pctx.lineJoin='round';pctx.lineCap='round';\n      if(dash) pctx.setLineDash(dash); else pctx.setLineDash([]);\n      pctx.beginPath();\n      var n=260, started=false;\n      for(var i=0;i<=n;i++){\n        var t=(i/n)*tEnd;\n        var v=fn(t); var py=Y(v);\n        if(py<y0-40){ // went off top: draw to edge then stop\n          if(started){ pctx.lineTo(X(t),y0-6); }\n          break;\n        }\n        if(!started){ pctx.moveTo(X(t),py); started=true; }\n        else pctx.lineTo(X(t),py);\n      }\n      pctx.stroke(); pctx.restore();\n    }\n\n    // ghost (full, faint) — gives a readable resting state\n    trace(Nexp, D.tMax, expo, [5,5], 1.4, .18);\n    trace(Nlog, D.tMax, logi, null, 2, .16);\n    // active up to current time\n    var tNow=state.t;\n    trace(Nexp, tNow, expo, [6,5], 1.8, .95);\n    trace(Nlog, tNow, logi, null, 2.6, 1);\n    pctx.restore();\n\n    // inflection marker (gold ring), if within range\n    if(D.tStar>0 && D.tStar<=D.tMax){\n      var ix=X(D.tStar), iy=Y(P.K/2), reached=tNow>=D.tStar;\n      pctx.save();\n      pctx.fillStyle=surface; pctx.strokeStyle=gold; pctx.lineWidth=2;\n      pctx.beginPath();pctx.arc(ix,iy,5,0,7);pctx.fill();pctx.stroke();\n      if(reached){pctx.fillStyle=gold;pctx.beginPath();pctx.arc(ix,iy,2.4,0,7);pctx.fill();}\n      pctx.fillStyle=gold; pctx.font='italic 11.5px \"Spectral\",serif';\n      pctx.textAlign='left'; pctx.textBaseline='bottom';\n      if(ix < x1-90) pctx.fillText(d.c_infl, ix+9, iy-4);\n      pctx.restore();\n    }\n\n    // moving marker on logistic\n    var nlv=Nlog(tNow), mx=X(tNow), my=Y(nlv);\n    if(nlv<=D.yMax){\n      pctx.fillStyle=logi; pctx.strokeStyle=surface; pctx.lineWidth=2;\n      pctx.beginPath();pctx.arc(mx,my,5,0,7);pctx.fill();pctx.stroke();\n    }\n    // moving marker on exponential (if still on canvas)\n    var nev=Nexp(tNow);\n    if(nev<=D.yMax){\n      var ex=X(tNow), ey=Y(nev);\n      pctx.fillStyle=expo; pctx.strokeStyle=surface; pctx.lineWidth=2;\n      pctx.beginPath();pctx.arc(ex,ey,4.5,0,7);pctx.fill();pctx.stroke();\n    }\n\n    // overshoot & collapse marker on the exponential scenario\n    if(D.tCrash>0 && D.tCrash<=D.tMax){\n      var cx2=X(D.tCrash), cy2=Y(2*P.K), crashed=tNow>=D.tCrash;\n      pctx.save();\n      pctx.fillStyle=crashed?expo:surface; pctx.strokeStyle=expo; pctx.lineWidth=2;\n      pctx.beginPath();pctx.arc(cx2,cy2,5,0,7);pctx.fill();pctx.stroke();\n      pctx.fillStyle=expo; pctx.font='600 11.5px \"IBM Plex Sans\",sans-serif';\n      var right=cx2>x1-130;\n      pctx.textAlign=right?'right':'left'; pctx.textBaseline='bottom';\n      pctx.fillText('2K · '+d.c_crash, right?cx2-9:cx2+9, cy2-5);\n      pctx.restore();\n    }\n\n    // direct end-labels\n    pctx.font='600 12px \"IBM Plex Sans\",sans-serif'; pctx.textBaseline='middle';\n    // logistic label near its current end (right side)\n    pctx.fillStyle=logi; pctx.textAlign='left';\n    var lly=Y(Math.min(nlv,P.K*.99));\n    if(mx>x1-84){ pctx.textAlign='right'; pctx.fillText(d.c_log, x1-4, Y(P.K)+ (nlv>P.K*0.9? -12:12)); }\n    else pctx.fillText(d.c_log, Math.min(mx+9,x1-4), lly);\n    // exponential label: at the point where it's ~1.4K (still visible), if reached\n    var tLab=Math.log(1.4*P.K/P.N0)/P.r;\n    if(tLab<=tNow && tLab<=D.tMax){\n      pctx.fillStyle=expo; pctx.textAlign='left';\n      var elx=X(tLab), ely=Y(1.4*P.K);\n      pctx.save();\n      pctx.translate(elx,ely);\n      pctx.fillText(d.c_exp, 8, -4);\n      pctx.restore();\n    }\n\n    // axis titles\n    pctx.fillStyle=muted; pctx.font='12px \"IBM Plex Sans\",sans-serif';\n    pctx.textAlign='right'; pctx.textBaseline='bottom';\n    pctx.fillText(d.ax_t, x1, pH-2);\n    pctx.save(); pctx.translate(11,y0); pctx.rotate(-Math.PI/2);\n    pctx.textAlign='right'; pctx.textBaseline='top'; pctx.fillText('↑ '+d.ax_n,0,0); pctx.restore();\n  }\n\n  function niceStep(max){\n    var raw=max/6, mag=Math.pow(10,Math.floor(Math.log10(raw))), n=raw/mag;\n    var s= n<1.5?1:n<3?2:n<7?5:10; return s*mag;\n  }\n\n  // ---------- R(N) panel ----------\n  function drawRN(){\n    if(!rn) return;\n    var d=STR[LANG];\n    var muted=getVar('--muted'),faint=getVar('--faint'),grid=getVar('--grid'),\n        logi=getVar('--logi'),expo=getVar('--expo'),ink=getVar('--ink'),\n        surface=getVar('--surface'),lsoft=getVar('--logi-soft'),esoft=getVar('--expo-soft');\n    var padL=40,padR=16,padT=16,padB=26;\n    var x0=padL,x1=rW-padR,y0=padT,y1=rH-padB;\n    rctx.clearRect(0,0,rW,rH);\n    var Nmax=2*P.K;\n    var X=function(N){return x0+(N/Nmax)*(x1-x0);};\n    var Y=function(R){return y0+(1-(R+P.r)/(2*P.r))*(y1-y0);}; // R from +r (top) to -r (bottom)\n    var yZero=Y(0);\n\n    // zone fills\n    rctx.fillStyle=lsoft; rctx.fillRect(x0,y0,x1-x0,yZero-y0);\n    rctx.fillStyle=esoft; rctx.fillRect(x0,yZero,x1-x0,y1-yZero);\n\n    // zero axis\n    rctx.strokeStyle=faint; rctx.lineWidth=1.3;\n    rctx.beginPath();rctx.moveTo(x0,yZero);rctx.lineTo(x1,yZero);rctx.stroke();\n    // K vertical marker\n    var kx=X(P.K);\n    rctx.save();rctx.setLineDash([3,3]);rctx.strokeStyle=faint;rctx.globalAlpha=.8;\n    rctx.beginPath();rctx.moveTo(kx,y0);rctx.lineTo(kx,y1);rctx.stroke();rctx.restore();\n\n    // the line R=r(1-N/K): green for N<K, orange for N>K\n    rctx.lineWidth=2.4;rctx.lineCap='round';\n    rctx.strokeStyle=logi;\n    rctx.beginPath();rctx.moveTo(X(0),Y(P.r));rctx.lineTo(X(P.K),Y(0));rctx.stroke();\n    rctx.strokeStyle=expo;\n    rctx.beginPath();rctx.moveTo(X(P.K),Y(0));rctx.lineTo(X(Nmax),Y(-P.r));rctx.stroke();\n\n    // labels\n    rctx.font='11px \"IBM Plex Mono\",monospace';rctx.fillStyle=faint;\n    rctx.textAlign='left';rctx.textBaseline='bottom';\n    rctx.fillText('+r',x0+3,Y(P.r)+13);\n    rctx.textBaseline='top'; rctx.fillText('−r',x0+3,Y(-P.r)-13);\n    rctx.textAlign='center'; rctx.fillStyle=faint; rctx.textBaseline='top';\n    rctx.fillText('K',kx,y1+6);\n    rctx.textAlign='right'; rctx.fillText('2K',x1,y1+6);\n    rctx.textAlign='left'; rctx.fillText('N',x0,y1+6);\n    // y title\n    rctx.save();rctx.translate(11,(y0+y1)/2);rctx.rotate(-Math.PI/2);\n    rctx.fillStyle=muted;rctx.textAlign='center';rctx.textBaseline='top';\n    rctx.font='11px \"IBM Plex Sans\",sans-serif';rctx.fillText(d.ax_rn_y,0,0);rctx.restore();\n\n    // current marker\n    var nl=Nlog(state.t), Rc=P.r*(1-nl/P.K);\n    var cx=X(Math.min(nl,Nmax)), cy=Y(Rc);\n    rctx.fillStyle=nl<=P.K?logi:expo; rctx.strokeStyle=surface;rctx.lineWidth=2;\n    rctx.beginPath();rctx.arc(cx,cy,5,0,7);rctx.fill();rctx.stroke();\n  }\n\n  // ---------- readouts ----------\n  function updateReadouts(){\n    var d=STR[LANG], t=state.t;\n    var nl=Nlog(t), f=nl/P.K, R=P.r*(1-f);\n    document.getElementById('o-t').textContent=Math.round(t);\n    document.getElementById('o-n').textContent=fmt(nl);\n    document.getElementById('o-r').innerHTML=(R*100).toFixed(1)+'<small>%<\/small>';\n    document.getElementById('o-f').textContent=f.toFixed(2);\n    var pi= f<0.45?0 : f<0.55?1 : f<0.97?2 : 3;\n    var ph=document.getElementById('o-ph');\n    ph.textContent=d.ph[pi]; ph.className='t-v p'+pi;\n    document.getElementById('tval').textContent=Math.round(t);\n  }\n\n  function drawAll(){ derive(); drawPlot(); if(rn) drawRN(); updateReadouts(); }\n\n  // ---------- animation ----------\n  var state={ t:0, playing:false, last:0 };\n  var timeEl=document.getElementById('time');\n  var playBtn=document.getElementById('play');\n  var icoPlay=document.getElementById('ico-play'), icoPause=document.getElementById('ico-pause');\n  var speedEl=document.getElementById('speed');\n\n  function setPlaying(p){\n    state.playing=p;\n    icoPlay.hidden=p; icoPause.hidden=!p;\n    if(p){ state.last=performance.now(); requestAnimationFrame(loop); }\n  }\n  function loop(now){\n    if(!state.playing) return;\n    var dt=(now-state.last)/1000; state.last=now;\n    var spd=parseFloat(speedEl.value);\n    // full playthrough ~7s at 1x\n    state.t += dt*(D.tMax/7)*spd;\n    if(state.t>=D.tMax){ state.t=D.tMax; setPlaying(false); }\n    syncTime(); drawAll();\n    if(state.playing) requestAnimationFrame(loop);\n  }\n  function syncTime(){ timeEl.value=Math.round(state.t/D.tMax*1000); }\n\n  playBtn.addEventListener('click',function(){\n    if(state.t>=D.tMax){ state.t=0; }\n    setPlaying(!state.playing);\n    if(state.playing) drawAll();\n  });\n  document.getElementById('replay').addEventListener('click',function(){\n    state.t=0; syncTime(); setPlaying(true); drawAll();\n  });\n  timeEl.addEventListener('input',function(){\n    setPlaying(false);\n    state.t=(parseFloat(timeEl.value)/1000)*D.tMax;\n    drawAll();\n  });\n\n  // params\n  function bindParam(id,key,disp,transform){\n    var el=document.getElementById(id), out=document.getElementById(disp);\n    el.addEventListener('input',function(){\n      P[key]=parseFloat(el.value);\n      out.textContent = key==='r'? P.r.toFixed(3) : (key==='K'? P.K : P.N0);\n      derive();\n      // keep t proportional to tMax so the marker doesn't jump absurdly\n      if(state.t>D.tMax) state.t=D.tMax;\n      syncTime(); drawAll();\n    });\n  }\n  bindParam('r','r','rv'); bindParam('k','K','kv'); bindParam('n0','N0','nv');\n\n  // lang\n  document.getElementById('lang').addEventListener('click',function(){\n    LANG = LANG==='fr'?'en':'fr';\n    try{localStorage.setItem('verhulst_lang',LANG);}catch(e){}\n    applyLang(); drawAll();\n  });\n\n  // ---------- boot ----------\n  applyLang(); derive();\n  window.addEventListener('resize',resize);\n  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(drawAll); }\n  resize();\n  // start at full curve (readable rest state), then auto-reveal once\n  state.t=D.tMax; syncTime(); drawAll();\n  if(!reduce){\n    setTimeout(function(){\n      if(state.t>=D.tMax && !state.playing){ state.t=0; setPlaying(true); }\n    }, 900);\n  }\n})();\n<\/script>\n\n<script>\n/* Chessboard / wheat-grain metaphor — self-contained */\n(function(){\n  \"use strict\";\n  var STR2={\n    fr:{eb:\"Croissance exponentielle\", title:\"La métaphore de l'échiquier\",\n      intro:\"Une légende : sur la première case d'un échiquier on pose <b>un grain de riz<\/b>, sur la deuxième <b>deux<\/b>, puis on <b>double à chaque case<\/b>. Doubler à chaque pas, c'est un taux constant (×2) — exactement une <b>croissance exponentielle<\/b>. Avancez case après case.\",\n      l1:\"Case\", l2:\"Grains sur la case\", l3:\"Total (cases 1 à n)\", l4:\"Poids de riz\",\n      half:\"seconde moitié\",\n      cap:\"Les premières cases ne pèsent presque rien ; c'est la <b>seconde moitié<\/b> de l'échiquier qui échappe à toute intuition. La dernière case porte à elle seule <b>2⁶³ ≈ 9,2 × 10¹⁸ grains<\/b>, et l'échiquier entier <b>2⁶⁴ − 1 ≈ 1,8 × 10¹⁹<\/b> — de l'ordre de <b>mille fois la récolte mondiale annuelle de riz<\/b>. Aucun stock réel ne suit : une croissance à taux constant finit toujours par buter sur une limite — c'est la capacité de charge <i>K<\/i>, que le <b>modèle de Verhulst<\/b> formalise juste après.\"\n    },\n    en:{eb:\"Exponential growth\", title:\"The wheat-and-chessboard metaphor\",\n      intro:\"A legend: on the first square of a chessboard you place <b>one grain of rice<\/b>, on the second <b>two<\/b>, then you <b>double on every square<\/b>. Doubling at each step is a constant rate (×2) — exactly <b>exponential growth<\/b>. Step through square by square.\",\n      l1:\"Square\", l2:\"Grains on the square\", l3:\"Total (squares 1 to n)\", l4:\"Weight of rice\",\n      half:\"second half\",\n      cap:\"The first squares weigh almost nothing; it is the <b>second half<\/b> of the board that defies intuition. The last square alone carries <b>2⁶³ ≈ 9.2 × 10¹⁸ grains<\/b>, and the whole board <b>2⁶⁴ − 1 ≈ 1.8 × 10¹⁹<\/b> — on the order of <b>a thousand times the world's annual rice harvest<\/b>. No real stock can keep up: constant-rate growth always ends up hitting a limit — the carrying capacity <i>K<\/i>, which the <b>Verhulst model<\/b> formalises next.\"\n    }\n  };\n  function lang(){ var l=document.documentElement.lang; return (l==='en')?'en':'fr'; }\n  function gv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }\n  function mk(t,a){var e=document.createElementNS(\"http://www.w3.org/2000/svg\",t);for(var k in a)e.setAttribute(k,a[k]);return e;}\n  var SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};\n  function sup(n){return String(n).split('').map(function(c){return SUP[c]||c;}).join('');}\n  function grp(s){return s.replace(/\\B(?=(\\d{3})+(?!\\d))/g,' ');}\n  function sci(g,fr){var s=g.toString(); if(s.length<=5) return grp(s); var exp=s.length-1; return s[0]+(fr?',':'.')+(s[1]||'0')+' × 10'+sup(exp);}\n  function dec(x,fr,d){var s=(d!=null)?x.toFixed(d):String(x); return fr?s.replace('.',','):s;}\n  function fmtMass(grams,fr){\n    if(grams<1) return dec(grams,fr,3)+' g';\n    var u=[['Gt',1e15],['Mt',1e12],['t',1e6],['kg',1e3],['g',1]];\n    for(var i=0;i<u.length;i++){ if(grams>=u[i][1]){ var v=grams/u[i][1]; return dec(v,fr, v<10?2:(v<100?1:0))+' '+u[i][0]; } }\n    return dec(grams,fr,0)+' g';\n  }\n\n  var N=1, playing=false, raf=null, lastStep=0;\n  var svg=document.getElementById('chessboard');\n  var off=14, cell=54;\n\n  function grains(k){ return (1n << BigInt(k-1)); }\n  function total(k){ return (1n << BigInt(k)) - 1n; }\n\n  function drawBoard(){\n    var fr=lang()==='fr', d=STR2[lang()];\n    var expo=gv('--expo'), line=gv('--line'), grid=gv('--grid'), gold=gv('--gold'), faint=gv('--faint');\n    while(svg.firstChild) svg.removeChild(svg.firstChild);\n    for(var k=1;k<=64;k++){\n      var row=Math.floor((k-1)/8), col=(k-1)%8;\n      var x=off+col*cell, y=off+row*cell;\n      var revealed=(k<=N);\n      var op=0.06+0.9*((k-1)/63);\n      svg.appendChild(mk('rect',{x:x+1.5,y:y+1.5,width:cell-3,height:cell-3,rx:3,\n        fill:revealed?expo:'none','fill-opacity':revealed?op.toFixed(3):0,\n        stroke:revealed?line:grid,'stroke-width':1}));\n    }\n    // halfway divider (after square 32 = after row 3)\n    var hy=off+4*cell;\n    svg.appendChild(mk('line',{x1:off,y1:hy,x2:off+8*cell,y2:hy,stroke:faint,'stroke-width':1.4,'stroke-dasharray':'5 4',opacity:0.85}));\n    var ht=mk('text',{x:off+8*cell-2,y:hy-5,'text-anchor':'end',fill:faint,'font-size':11,'font-family':'var(--font-m)','font-style':'italic'}); ht.textContent='↓ '+d.half; svg.appendChild(h
