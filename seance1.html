2019],\n    series:[\n      {key:\"prim\", cvar:\"--cMorue\", v:[14.2,13.8,12.5,11.0,13.1,11.9,10.6,8.7,7.6,7.8,6.2,8.0,10.1,10.4,10.8,11.2,10.5,9.3,9.1,7.7,6.7,6.9,7.7]},\n      {key:\"manu\", cvar:\"--warn\",   v:[11.4,11.0,10.1,10.4,10.4,9.7,9.5,9.4,7.9,8.3,7.6,8.3,8.3,10.9,10.7,9.1,8.9,9.4,8.5,7.9,7.6,7.0,6.6]},\n      {key:\"fin\",  cvar:\"--eco\",    v:[3.9,4.0,4.5,5.5,5.6,6.1,6.1,9.5,10.8,12.5,14.1,9.5,11.1,7.8,6.2,8.2,7.1,7.4,6.5,6.3,6.3,5.9,6.0]},\n      {key:\"tour\", cvar:\"--dTour\",  v:[null,null,null,null,null,null,null,null,null,null,null,null,3.5,3.5,3.7,4.0,4.7,5.5,6.5,8.2,8.1,8.1,8.3]}\n    ]\n  };\n\n  var PANELS=[\n    {key:\"Morue\",   cvar:\"--cMorue\",   K:400, tac:270, ghost:null,           tagc:\"var(--cMorue)\"},\n    {key:\"Capelan\", cvar:\"--cCapelan\", K:600, tac:0, tacClosed:true, ghost:null, tagc:\"var(--warn)\"}\n  ];\n\n  var STR={\n    fr:{eyebrow:\"Verhulst appliqué aux pêcheries\", title:\"Prélever sans épuiser\",\n      sub:\"Chaque espèce raconte la même mécanique : les prises montent vite, puis butent sur un plafond soutenable — le <b>RMS<\/b>, traduction en flux de la capacité de charge. On regarde d'abord espèce par espèce, puis on agrège : le total de l'écosystème bute lui aussi sur un plafond. Diversifier les espèces déplace la contrainte sans la lever — d'où les quotas, puis la question des limites planétaires.\",\n      ghostlbl:\"Trajectoire soutenable\", maTrend:\"tendance (moyenne mobile 7 ans)\", rmsLabel:\"RMS\",\n      st1t:\"Espèce par espèce : chacune sa limite\",\n      st1p:\"Pour chaque grande espèce, les <b>prises<\/b> (un flux) montent, butent sur un <b>plafond soutenable<\/b> — le RMS — puis, si l'effort a dépassé ce que le stock régénère, s'effondrent. Deux espèces, deux trajectoires.\",\n      st2t:\"L'agrégation : le total bute sur un plafond\",\n      st2p:\"On empile maintenant toutes les espèces. La composition change au fil du temps, mais le <b>total<\/b> des prises atteint son pic (~2 Mt) puis oscille autour d'un niveau soutenable — le <b>RMS agrégé<\/b> de l'écosystème.\",\n      st3t:\"Le frein : les quotas\",\n      st4t:\"Diversifier ne suffit plus\",\n      aggtitle:\"Captures par espèce\", aggaxisY:\"captures (milliers de t)\", aggtotal:\"Total\", aggtrendlbl:\"tendance (7 ans)\", tacLbl:\"TAC 2019\", tacClosedLbl:\"TAC 2019 : fermé\",\n      aggnames:{\"Morue\":\"Morue\",\"Églefin\":\"Églefin\",\"Lieu noir\":\"Lieu noir\",\"Sébastes\":\"Sébastes\",\"Capelan\":\"Capelan\",\"Merlan bleu\":\"Merlan bleu\",\"Maquereau\":\"Maquereau\",\"Non identifiés\":\"Non identifiés\",\"Autres\":\"Autres\"},\n      agganno:[[1997,\"Pic : 2,15 Mt\"]],\n      sdiv:\"<b>Diversifier les espèces : déplacer la contrainte, pas la lever.<\/b> Quand une espèce s'effondre, la flotte se reporte sur une autre — morue → capelan → merlan bleu → maquereau. Chaque report ouvre une <b>courbe logistique neuve<\/b> et masque le problème espèce par espèce. Mais la somme, elle, reste collée à son plafond : diversifier <b>déplace<\/b> la pression d'un stock vers un autre, sans réduire l'empreinte totale sur l'écosystème. Tôt ou tard, il faut un <b>frein<\/b>.\",\n      callout:\"<b>Des prises, pas un stock — mais les deux sont liés.<\/b> Ici les <b>prises<\/b> sont un <b>flux<\/b>, pas la biomasse (un <b>stock<\/b>) ; ils se répondent : variation du stock = régénération − prises. Une prise ne prend durablement que le surplus régénéré, <b>maximal à mi-chemin (<i>N = K/2<\/i>)<\/b> — le <b>rendement maximal soutenable (RMS)<\/b>, notre <b>capacité de prise<\/b> et le plafond tracé ici. Le dépasser puise dans le stock ; il faut ensuite pêcher <b>sous le RMS<\/b> pour le reconstituer, si bien que la prise moyenne de long terme ne peut l'excéder. <i>(La construction graphique du RMS et la distinction ressource renouvelable / non renouvelable sont détaillées dans la fiche « Le rendement maximal soutenable ».)<\/i>\",\n      names:{\"Total\":\"Total — toutes espèces\",\"Capelan\":\"Capelan\",\"Morue\":\"Morue\",\"Merlan bleu\":\"Merlan bleu\",\"Maquereau\":\"Maquereau\"},\n      tags:{\"Total\":\"montée → plafond (capacité de l'écosystème)\",\"Capelan\":\"dépassement → effondrement\",\"Morue\":\"surpêche → retour vers le RMS\",\"Merlan bleu\":\"impulsion → effondrement\",\"Maquereau\":\"au-dessus du RMS (en cours)\"},\n      key:[\"<b>Prises<\/b> annuelles (données)\",\"<b>RMS<\/b> — plafond soutenable indicatif\",\"<b>Dépassement<\/b> du RMS\",\"<b>TAC<\/b> — quota islandais 2019\"],\n      foot:\"Prises : Sea Around Us, ZEE 352 (Islande), v50.1. <b>RMS<\/b> : niveau soutenable indicatif (modèle logistique). <b>TAC<\/b> : quotas islandais 2019 (Fisheries Iceland / MFRI) — morue 270 kt ; capelan fermé (quota 0, stock effondré). Sur la figure agrégée, le <b>RMS agrégé<\/b> (~1,4 Mt) est un plafond indicatif.\",\n      unit:\"milliers de t\",\n      regt:\"Plafonner les prises : TAC et quotas (ITQ)\",\n      regp:[\n        \"Le graphique montre le problème ; les quotas sont la réponse. Après l'effondrement du hareng et la surpêche de la morue, l'Islande a bâti un <b>frein institutionnel<\/b> : plafonner les prises pour rester sous la capacité de charge.\",\n        \"Chaque année, un <b>total autorisé de captures (TAC)<\/b> est fixé pour chaque stock, sur avis scientifique. Il est réparti en <b>quotas individuels transférables (ITQ)<\/b> : chaque navire détient une part (%) du TAC, et ces parts s'achètent et se vendent.\",\n        \"C'est exactement le <b>freinage au point d'inflexion<\/b> du modèle logistique : plutôt que de laisser l'effort dépasser <i>K<\/i> et provoquer l'effondrement, on cale les prises sur ce que le stock peut supporter.\"\n      ],\n      regtlt:\"Chronologie de la régulation\",\n      tl:[\n        [\"1975\",\"<b>Zone des 200 milles<\/b> : l'Islande reprend le contrôle de l'accès à ses eaux (guerres de la morue).\"],\n        [\"1975→84\",\"<b>Quotas par navire<\/b>, espèce par espèce : hareng (1975), capelan (1980), puis démersaux dont la morue (1984).\"],\n        [\"1990\",\"<b>Loi sur la gestion des pêches<\/b> : quotas individuels transférables (ITQ) unifiés ; les stocks, <b>propriété commune de la nation<\/b>.\"],\n        [\"depuis\",\"Un <b>TAC<\/b> par stock chaque année, sur avis scientifique, avec des règles de contrôle de l'exploitation.\"]\n      ],\n      divt:\"À l'échelle de l'économie : pêche → finance → tourisme\",\n      divsub:\"Part des grands secteurs dans la valeur ajoutée islandaise, 1997–2019\",\n      divnames:{prim:\"Pêche & agriculture\",manu:\"Industrie manufacturière\",fin:\"Finance & assurance\",tour:\"Tourisme (héberg. + restauration)\"},\n      divp:[\n        \"<b>Substituer un élément à un autre.<\/b> Quand la pêche bute sur la capacité de charge de l'écosystème marin, l'économie <b>reporte<\/b> la pression ailleurs : après le pic de 1997, le poids de la pêche recule et la <b>finance<\/b> gonfle (jusqu'à la crise de 2008), puis le <b>tourisme<\/b> décolle. C'est la même logique que la succession morue → capelan → merlan bleu → maquereau, mais à l'échelle des secteurs.\",\n        \"<b>Mais toute production charge l'écosystème.<\/b> Aucun secteur n'y échappe : le tourisme et l'aviation qu'il suppose émettent du CO₂. Substituer un secteur à un autre <b>déplace<\/b> la pression, il ne la supprime pas — on repousse une limite locale en en sollicitant une autre.\",\n        \"<b>Au niveau agrégé, la production butte sur les limites planétaires.<\/b> La capacité de charge n'est pas un seul plafond mais un ensemble <b>multidimensionnel<\/b> (climat, biodiversité, cycles de l'azote et du phosphore, eau douce…). La diversification gagne du temps sur une dimension ; elle ne relâche pas la contrainte globale.\"\n      ],\n      divsource:\"Source : <i>Économie et Institutions<\/i>, journals.openedition.org/ei/7981.\"\n    },\n    en:{eyebrow:\"Verhulst applied to fisheries\", title:\"Harvesting without depleting\",\n      sub:\"Every species tells the same mechanics: catches rise fast, then hit a sustainable ceiling — the <b>MSY<\/b>, the flow counterpart of the carrying capacity. We look first species by species, then aggregate: the ecosystem total hits a ceiling too. Diversifying species relocates the constraint without lifting it — hence quotas, then the question of planetary boundaries.\",\n      ghostlbl:\"Sustainable path\", maTrend:\"trend (7-year moving average)\", rmsLabel:\"MSY\",\n      st1t:\"Species by species: each has its own limit\",\n      st1p:\"For each major species, <b>catches<\/b> (a flow) rise, hit a <b>sustainable ceiling<\/b> — the MSY — then, if effort has exceeded what the stock regrows, collapse. Two species, two trajectories.\",\n      st2t:\"Aggregation: the total hits a ceiling\",\n      st2p:\"Now we stack every species. The composition shifts over time, but <b>total<\/b> catches reach their peak (~2 Mt) then oscillate around a sustainable level — the ecosystem's <b>aggregate MSY<\/b>.\",\n      st3t:\"The brake: quotas\",\n      st4t:\"Diversifying is no longer enough\",\n      aggtitle:\"Catch by species\", aggaxisY:\"catch (thousand t)\", aggtotal:\"Total\", aggtrendlbl:\"trend (7 yr)\", tacLbl:\"TAC 2019\", tacClosedLbl:\"TAC 2019: closed\",\n      aggnames:{\"Morue\":\"Cod\",\"Églefin\":\"Haddock\",\"Lieu noir\":\"Saithe\",\"Sébastes\":\"Redfish\",\"Capelan\":\"Capelin\",\"Merlan bleu\":\"Blue whiting\",\"Maquereau\":\"Mackerel\",\"Non identifiés\":\"Unidentified\",\"Autres\":\"Other\"},\n      agganno:[[1997,\"Peak: 2.15 Mt\"]],\n      sdiv:\"<b>Diversifying species: relocating the constraint, not lifting it.<\/b> When one species collapses, the fleet shifts to another — cod → capelin → blue whiting → mackerel. Each shift opens a <b>fresh logistic curve<\/b> and hides the problem species by species. But the sum stays pinned to its ceiling: diversifying <b>relocates<\/b> pressure from one stock to another without reducing the total footprint on the ecosystem. Sooner or later, you need a <b>brake<\/b>.\",\n      callout:\"<b>Catches, not a stock — but the two are linked.<\/b> Here <b>catches<\/b> are a <b>flow<\/b>, not biomass (a <b>stock<\/b>); they answer each other: change in stock = regrowth − catch. A catch only sustainably takes the regrown surplus, <b>largest half-way (<i>N = K/2<\/i>)<\/b> — the <b>maximum sustainable yield (MSY)<\/b>, our <b>catch capacity<\/b> and the ceiling drawn here. Exceeding it draws down the stock; you must then fish <b>below MSY<\/b> to rebuild it, so long-run average catch cannot exceed it. <i>(The graphical construction of MSY and the renewable / non-renewable distinction are detailed in the “Maximum sustainable yield” figure.)<\/i>\",\n      names:{\"Total\":\"Total — all species\",\"Capelan\":\"Capelin\",\"Morue\":\"Cod\",\"Merlan bleu\":\"Blue whiting\",\"Maquereau\":\"Mackerel\"},\n      tags:{\"Total\":\"rise → ceiling (ecosystem capacity)\",\"Capelan\":\"overshoot → collapse\",\"Morue\":\"overfishing → back toward MSY\",\"Merlan bleu\":\"pulse → collapse\",\"Maquereau\":\"above MSY (ongoing)\"},\n      key:[\"<b>Catch<\/b>, annual (data)\",\"<b>MSY<\/b> — indicative sustainable ceiling\",\"<b>Overshoot<\/b> of MSY\",\"<b>TAC<\/b> — Icelandic quota 2019\"],\n      foot:\"Catch: Sea Around Us, EEZ 352 (Iceland), v50.1. <b>MSY<\/b>: indicative sustainable level (logistic model). <b>TAC<\/b>: Icelandic quotas 2019 (Fisheries Iceland / MFRI) — cod 270 kt; capelin closed (quota 0, collapsed stock). On the aggregate figure, the aggregate <b>MSY<\/b> (~1.4 Mt) is an indicative ceiling.\",\n      unit:\"thousand t\",\n      regt:\"Capping catches: TAC and quotas (ITQ)\",\n      regp:[\n        \"The chart shows the problem; quotas are the answer. After the herring collapse and cod overfishing, Iceland built an <b>institutional brake<\/b>: cap catches to stay below the carrying capacity.\",\n        \"Each year a <b>Total Allowable Catch (TAC)<\/b> is set for every stock, on scientific advice. It is split into <b>Individual Transferable Quotas (ITQ)<\/b>: each vessel holds a share (%) of the TAC, and these shares can be bought and sold.\",\n        \"This is exactly the logistic model's <b>braking at the inflection point<\/b>: rather than letting effort overshoot <i>K<\/i> and trigger collapse, catches are pinned to what the stock can bear.\"\n      ],\n      regtlt:\"Timeline of regulation\",\n      tl:[\n        [\"1975\",\"<b>200-mile zone<\/b>: Iceland regains control of access to its waters (the Cod Wars).\"],\n        [\"1975→84\",\"<b>Vessel quotas<\/b>, species by species: herring (1975), capelin (1980), then demersals incl. cod (1984).\"],\n        [\"1990\",\"<b>Fisheries Management Act<\/b>: unified individual transferable quotas (ITQ); stocks become the <b>common property of the nation<\/b>.\"],\n        [\"since\",\"A yearly <b>TAC<\/b> per stock, on scientific advice, with harvest control rules.\"]\n      ],\n      divt:\"At the scale of the economy: fishing → finance → tourism\",\n      divsub:\"Share of major sectors in Icelandic value added, 1997–2019\",\n      divnames:{prim:\"Fishing & agriculture\",manu:\"Manufacturing\",fin:\"Finance & insurance\",tour:\"Tourism (accom. + food service)\"},\n      divp:[\n        \"<b>Substituting one element for another.<\/b> When fishing hits the marine ecosystem's carrying capacity, the economy <b>shifts<\/b> the pressure elsewhere: after the 1997 peak, fishing's weight declines and <b>finance<\/b> swells (until the 2008 crisis), then <b>tourism<\/b> takes off. Same logic as the cod → capelin → blue whiting → mackerel succession, but at the scale of sectors.\",\n        \"<b>Yet all production loads the ecosystem.<\/b> No sector escapes it: tourism and the aviation it relies on emit CO₂. Substituting one sector for another <b>relocates<\/b> the pressure, it does not remove it — one local limit is pushed back by drawing on another.\",\n        \"<b>In the aggregate, production hits the planetary boundaries.<\/b> Carrying capacity is not a single ceiling but a <b>multidimensional<\/b> set (climate, biodiversity, nitrogen and phosphorus cycles, freshwater…). Diversification buys time on one dimension; it does not loosen the global constraint.\"\n      ],\n      divsource:\"Source: <i>Économie et Institutions<\/i>, journals.openedition.org/ei/7981.\"\n    }\n  };\n\n  function cvar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}\n  function mk(t,a){var e=document.createElementNS(\"http://www.w3.org/2000/svg\",t);for(var k in a)e.setAttribute(k,a[k]);return e;}\n\n  function drawPanel(p){\n    var W=440,H=232,padL=42,padR=60,padT=14,padB=24;\n    var x0=padL,x1=W-padR,y0=padT,y1=H-padB;\n    var data=S[p.key];\n    var yMax=Math.max(Math.max.apply(null,data), p.K)*1.14;\n    var X=function(y){return x0+(y-1950)/(2019-1950)*(x1-x0);};\n    var Y=function(v){return y1-(v/yMax)*(y1-y0);};\n    var svg=mk('svg',{viewBox:\"0 0 \"+W+\" \"+H, role:\"img\"});\n    var uid=p.key.replace(/[^a-z]/gi,'');\n    // defs clip above K\n    var defs=mk('defs',{}); var cp=mk('clipPath',{id:'above-'+uid});\n    cp.appendChild(mk('rect',{x:x0,y:y0,width:x1-x0,height:(Y(p.K)-y0).toFixed(1)})); defs.appendChild(cp); svg.appendChild(defs);\n    // y axis: 0, K, yMax(round)\n    var g=mk('g',{class:'axis'});\n    function nice(v){return v>=1000?Math.round(v/100)*100:Math.round(v/10)*10;}\n    var yticks=[0, nice(yMax*0.98)];\n    yticks.forEach(function(t){var yy=Y(t); g.appendChild(mk('line',{x1:x0,y1:yy,x2:x1,y2:yy,stroke:'var(--grid)'}));\n      var tx=mk('text',{x:x0-6,y:yy+3,'text-anchor':'end'}); tx.textContent=t; g.appendChild(tx);});\n    // x ticks\n    [1950,1985,2019].forEach(function(yr){var xx=X(yr); var tx=mk('text',{x:xx,y:y1+14,'text-anchor':(yr===1950?'start':yr===2019?'end':'middle')}); tx.textContent=yr; g.appendChild(tx);});\n    svg.appendChild(g);\n\n    var col=cvar(p.cvar);\n    // catch area (fill light)\n    var area='M '+X(1950).toFixed(1)+' '+Y(0).toFixed(1)+ ont-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.6vw,42px);line-height:1.03;margin:0;letter-spacing:-.01em;text-wrap:balance;}\n  .sub{color:var(--muted);font-size:15px;margin:8px 0 0;max-width:66ch;text-wrap:pretty;}\n  .toggles{display:flex;gap:8px;flex-shrink:0;}\n  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}\n  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}\n  .tg:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--eco);outline-offset:2px;}\n  .stage{display:grid;grid-template-columns:1fr .82fr;gap:20px;margin-top:24px;align-items:stretch;}\n  @media (max-width:860px){.stage{grid-template-columns:1fr;}}\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}\n  .wheelcard{padding:6px 8px 4px;}\n  svg.wheel{display:block;width:100%;height:auto;max-width:100%;}\n  svg.wheel text{font-family:var(--font-d);fill:var(--ink);}\n  .gearM{fill:none;stroke:var(--fin);stroke-width:2;stroke-linejoin:round;}\n  .gearE{fill:none;stroke:var(--eco);stroke-width:2;stroke-linejoin:round;}\n  .hubM{fill:none;stroke:var(--fin);stroke-width:1.6;}\n  .hubE{fill:none;stroke:var(--eco);stroke-width:1.6;}\n  .spoke{stroke:var(--eco);stroke-width:1.6;stroke-linecap:round;opacity:.65;}\n  .spokeM{stroke:var(--fin);stroke-width:1.6;stroke-linecap:round;opacity:.6;}\n  .pole-dot{fill:var(--surface);stroke:var(--fin);stroke-width:1.5;}\n  .pole-lbl{font-style:italic;font-weight:600;font-size:13px;fill:var(--fin);}\n  .wheelname{font-style:italic;font-size:13px;fill:var(--muted);text-anchor:middle;}\n  .flow{fill:none;stroke-width:4;stroke-linecap:round;}\n  .flow.in{stroke:var(--prod);} .flow.out{stroke:var(--diss);}\n  .flbl{font-size:11.5px;font-style:italic;font-family:var(--font-d) nt-family:var(--font-m);font-size:19px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1;}\n  .tile.pib .t-v{color:var(--fin);} .tile.deb .t-v{color:var(--eco);}\n  .meter{margin-top:2px;}\n  .meter .mhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px;}\n  .meter .mhead b{color:var(--ink);font-weight:600;}\n  .bar{position:relative;height:16px;border-radius:8px;background:var(--panel);border:1px solid var(--line);overflow:hidden;}\n  .bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;transition:width .12s linear,background .2s;}\n  .bar .thr{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--warn);opacity:.7;}\n  .mnote{font-size:12px;color:var(--faint);margin-top:7px;font-family:var(--font-m);}\n  .mnote.over{color:var(--warn);}\n  .decoupinfo{margin-top:12px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;}\n  .decoupinfo h4{font-family:var(--font-d);font-weight:600;font-size:14px;margin:0 0 6px;color:var(--ink);}\n  .decoupinfo>p{font-size:12.5px;color:var(--muted);margin:0 0 10px;text-wrap:pretty;}\n  .decoupinfo b{color:var(--ink);font-weight:600;}\n  .ditwo{display:grid;grid-template-columns:1fr 1fr;gap:10px;}\n  @media(max-width:520px){.ditwo{grid-template-columns:1fr;}}\n  .ditwo .dic{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;}\n  .ditwo .dic>b{display:block;font-size:12px;margin-bottom:3px;}\n  .ditwo .rel>b{color:var(--eco);} .ditwo .abs>b{color:var(--warn);}\n  .ditwo .dic>span{display:block;font-size:12px;color:var(--muted);text-wrap:pretty;}\n  .ditwo .dic>span b{color:var(--ink);font-weight:600;}\n  .lesson{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:13px;margin-top:auto;text-wrap:pretty;}\n  .lesson b{color:var(--ink);font-weight:600;}\n  footer{margin-top:22px;color:var(--faint);font-size:12px;text-align:center;text-wrap:balance;}\n  footer i{font-family:var(--font-d);font-style:italic;}\n  .sub b{color:var(--ink);font-weight:600;}\n  .dsec{margin-top:32px;}\n  .dhead{display:flex;align-items:center;gap:11px;margin:0 0 4px;}\n  .dhead .dnum{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--eco);color:#fff;font-family:var(--font-m);font-size:13px;font-weight:600;display:grid;place-items:center;}\n  .dhead .dnum.warn{background:var(--warn);}\n  .dhead h2{font-family:var(--font-d);font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance;}\n  .dlead{color:var(--muted);font-size:13.5px;margin:8px 0 14px;max-width:88ch;text-wrap:pretty;}\n  .dlead b{color:var(--ink);font-weight:600;} .dlead i{font-family:var(--font-d);font-style:italic;}\n  .dgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:stretch;}\n  @media(max-width:820px){.dgrid{grid-template-columns:1fr;}}\n  .chartcard{padding:12px 14px 8px;}\n  .chartcard svg{display:block;width:100%;height:auto;}\n  .chartcard svg text{font-family:var(--font-b);}\n  .dax line{stroke:var(--line);} .dax text{fill:var(--faint);font-size:10px;font-family:var(--font-m);}\n  .defcard{padding:16px 18px;display:flex;flex-direction:column;gap:13px;}\n  .defcard .def>b{display:block;font-size:14.5px;font-family:var(--font-d);margin-bottom:4px;}\n  .defcard .def.rel>b{color:var(--prod);} .defcard .def.abs>b{color:var(--eco);}\n  .defcard .def p{font-size:12.8px;color:var(--muted);margin:0;text-wrap:pretty;}\n  .defcard .def p b{color:var(--ink);font-weight:600;}\n  .defcard .defnote{font-size:12.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:12px;margin:auto 0 0;text-wrap:pretty;font-family:var(--font-d);font-style:italic;}\n  .evgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}\n  @media(max-width:820px){.evgrid{grid-template-columns:1fr;}}\n  .evcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;}\n  .evcard h4{font-family:var(--font-d);font-weight:600;font-size:14.5px;margin:0 0 6px;color:var(--ink);}\n  .evcard p{font-size:12.6px;color:var(--muted);margin:0 0 10px;text-wrap:pretty;}\n  .evcard p b{color:var(--ink);font-weight:600;}\n  .evcard .fig{font-family:var(--font-m);font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;text-wrap:pretty;line-height:1.5;}\n  .evcard .fig b{color:var(--warn);}\n  .evbanner{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:13px 17px;font-size:13px;color:var(--muted);text-wrap:pretty;}\n  .evbanner b{color:var(--ink);font-weight:600;} .evbanner i{font-family:var(--font-d);font-style:italic;}\n  .thermo{display:grid;grid-template-columns:1.08fr .92fr;gap:16px;margin-top:22px;align-items:stretch;}\n  @media(max-width:820px){.thermo{grid-template-columns:1fr;}}\n  .thermocard{padding:14px 16px;display:flex;align-items:center;}\n  .thermocard svg{display:block;width:100%;height:auto;}\n  .thermocard svg text{font-family:var(--font-b);}\n  .thermobox{padding:18px 20px;display:flex;flex-direction:column;gap:12px;}\n  .thermobox h2{font-family:var(--font-d);font-weight:600;font-size:18px;margin:0;letter-spacing:-.01em;text-wrap:balance;}\n  .thermobox>p{font-size:13px;color:var(--muted);margin:0;text-wrap:pretty;}\n  .thermobox>p b{color:var(--ink);font-weight:600;} .thermobox>p i{font-family:var(--font-d);font-style:italic;}\n  .twolaws{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;}\n  @media(max-width:520px){.twolaws{grid-template-columns:1fr;}}\n  .law{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}\n  .law>b{display:block;font-family:var(--font-d);font-size:13px;color:var(--ink);margin-bottom:3px;}\n  .law>span{font-size:12px;color:var(--muted);text-wrap:pretty;} .law>span b{color:var(--ink);font-weight:600;}\n<\/style>\n\n<div class=\"wrap\">\n  <header>\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\">Le modèle de l'engrenage · rotation couplée<\/p>\n      <h1 data-t=\"title\">L'engrenage en mouvement<\/h1>\n      <p class=\"sub\" data-t=\"sub\">La roue monétaire entraîne la roue énergétique, en sens inverse. On ne peut pas accélérer l'une sans l'autre — sauf à réduire le ratio de transmission (le découplage). Actionne le régime, puis le découplage, et observe la pression sur les limites.<\/p>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"thermo\">\n    <div class=\"card thermocard\"><svg id=\"capsvg\" viewBox=\"0 0 700 300\" role=\"img\" aria-label=\"L'engrenage économie–écosystème dans un monde fini : le débit physique ne peut pas croître à l'infini\"><\/svg><\/div>\n    <div class=\"card thermobox\">\n      <h2 data-t=\"th_t\">Un système thermodynamique dans un monde fini<\/h2>\n      <p data-t=\"th_b\"><\/p>\n      <div class=\"twolaws\">\n        <div class=\"law\"><b data-t=\"th_l1t\">1ʳᵉ loi<\/b><span data-t=\"th_l1b\"><\/span><\/div>\n        <div class=\"law\"><b data-t=\"th_l2t\">2ᵈᵉ loi<\/b><span data-t=\"th_l2b\"><\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"dsec\">\n    <div class=\"dhead\"><h2 data-t=\"tr_t\">Desserrer l'engrenage : le découplage<\/h2><\/div>\n    <p class=\"dlead\" data-t=\"tr_lead\"><\/p>\n  <\/div>\n\n  <div class=\"stage\">\n    <div class=\"card wheelcard\">\n      <svg class=\"wheel\" id=\"wheel\" viewBox=\"0 0 470 560\" role=\"img\" aria-label=\"Deux roues dentées engrenées : la roue monétaire entraîne la roue énergétique en sens inverse\">\n        <defs>\n          <marker id=\"ahIn\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M1 1 L6 3.5 L1 6 Z\" fill=\"var(--prod)\"><\/path><\/marker>\n          <marker id=\"ahOut\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M1 1 L6 3.5 L1 6 Z\" fill=\"var(--diss)\"><\/path><\/marker>\n        <\/defs>\n        <g id=\"g-flows\"><\/g>\n        <g id=\"g-energy\"><\/g>\n        <g id=\"g-mon\"><\/g>\n        <g id=\"g-names\"><\/g>\n        <g id=\"g-badge\"><\/g>\n      <\/svg>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"panel\">\n        <div class=\"playrow\">\n          <button class=\"play\" id=\"play\" aria-label=\"Lecture / pause\">\n            <svg id=\"ico-play\" viewBox=\"0 0 24 24\" hidden><path d=\"M8 5v14l11-7z\"/><\/svg>\n            <svg id=\"ico-pause\" viewBox=\"0 0 24 24\"><path d=\"M6 5h4v14H6zM14 5h4v14h-4z\"/><\/svg>\n          <\/button>\n          <span class=\"hint\" data-t=\"hint\">Les roues tournent — règle les deux leviers ci-dessous.<\/span>\n        <\/div>\n\n        <div class=\"ctl\">\n          <label><span class=\"nm\" data-t=\"c_thr\">Régime de la roue monétaire <small>(PIB)<\/small><\/span><span class=\"val\" id=\"throttleV\">55<\/span><\/label>\n          <input type=\"range\" id=\"throttle\" min=\"0\" max=\"100\" step=\"1\" value=\"55\">\n        <\/div>\n        <div class=\"ctl\">\n          <label><span class=\"nm\" data-t=\"c_dec\">Découplage <small>(ratio de transmission)<\/small><\/span><span class=\"val\" id=\"decoupleV\">0 %<\/span><\/label>\n          <input type=\"range\" id=\"decouple\" min=\"0\" max=\"100\" step=\"1\" value=\"0\">\n        <\/div>\n\n        <div class=\"tiles\">\n          <div class=\"tile pib\"><div class=\"t-l\" data-t=\"tl_pib\">Roue monétaire · PIB<\/div><div class=\"t-v\" id=\"o-pib\">55<\/div><\/div>\n          <div class=\"tile deb\"><div class=\"t-l\" data-t=\"tl_deb\">Roue énergétique · débit<\/div><div class=\"t-v\" id=\"o-deb\">55<\/div><\/div>\n          <div class=\"tile\"><div class=\"t-l\" data-t=\"tl_rat\">Ratio transmission<\/div><div class=\"t-v\" id=\"o-rat\">100<small>%<\/small><\/div><\/div>\n        <\/div>\n\n        <div class=\"meter\">\n          <div class=\"mhead\"><span data-t=\"m_lbl\">Pression sur les limites planétaires<\/span><b id=\"o-meter\">55 %<\/b><\/div>\n          <div class=\"bar\"><div class=\"fill\" id=\"meterFill\"><\/div><div class=\"thr\" id=\"meterThr\"><\/div><\/div>\n          <div class=\"mnote\" id=\"meterNote\"><\/div>\n        <\/div>\n\n        <p class=\"lesson\" id=\"lesson\"><\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"dsec\">\n    <div class=\"dhead\"><span class=\"dnum\">1<\/span><h2 data-t=\"ds1t\">Deux types de découplage<\/h2><\/div>\n    <p class=\"dlead\" data-t=\"ds1lead\"><\/p>\n    <div class=\"dgrid\">\n      <div class=\"card chartcard\"><svg id=\"decChart\" viewBox=\"0 0 480 320\" role=\"img\" aria-label=\"Trajectoires du PIB et de l'impact selon le type de découplage, face à la limite planétaire\"><\/svg><\/div>\n      <div class=\"card defcard\">\n        <div class=\"def rel\"><b data-t=\"ds_relt\">Découplage relatif<\/b><p data-t=\"ds_relb\"><\/p><\/div>\n        <div class=\"def abs\"><b data-t=\"ds_abst\">Découplage absolu<\/b><p data-t=\"ds_absb\"><\/p><\/div>\n        <p class=\"defnote\" data-t=\"ds_note\"><\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"dsec\">\n    <div class=\"dhead\"><span class=\"dnum warn\">2<\/span><h2 data-t=\"ds2t\">Absence de découplage absolu<\/h2><\/div>\n    <p class=\"dlead\" data-t=\"ds2lead\"><\/p>\n    <div class=\"evgrid\" id=\"evgrid\"><\/div>\n  <\/div>\n\n  <footer><span data-t=\"foot\">Deux leviers pour réduire la pression : calibrer la taille de la roue monétaire (sobriété) ou réduire le nombre de dents par des investissements verts (découplage).<\/span><\/footer>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  var SVGNS=\"http://www.w3.org/2000/svg\";\n  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;\n  function mk(t,a){var e=document.createElementNS(SVGNS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}\n\n  // geometry: meshed gears (same module)\n  var Nm=22, Ne=30;\n  var cxM=235,cyM=148,RM=84;\n  var RE=RM*Ne/Nm;                 // ~114.5\n  var cyE=cyM+RM+RE;               // pitch circles tangent\n  var cxE=235;\n  var MESH=[235, cyM+RM];\n\n  var LANG='fr'; try{var s=localStorage.getItem('dec_lang');if(s)LANG=s;}catch(e){}\n  var STR={\n    fr:{\n      eyebrow:\"Retour sur l'engrenage · lois de la thermodynamique\",\n      title:\"Le découplage : mythe ou levier ?\",\n      sub:\"La roue monétaire entraîne la roue énergétique, en sens inverse — l'économie reste un <b>système thermodynamique<\/b> dans un monde fini. Peut-on faire tourner le PIB sans accélérer le débit physique ? C'est la promesse du <b>découplage<\/b>. Actionne l'engrenage, puis distingue découplage <b>relatif<\/b> et <b>absolu<\/b>, et confronte-les aux données.\",\n      foot:\"Deux leviers pour réduire la pression : calibrer la taille de la roue monétaire (sobriété) ou réduire le nombre de dents par des investissements verts (découplage). Sources : T. Jackson, <i>Prosperity without Growth<\/i> (2020) ; <i>Decoupling Debunked<\/i>, EEB (2020) ; empreinte française : Cahen-Fourot &amp; Magalhães, <i>Socio-Economic Review<\/i> (2023) ; EROI du pétrole : C. Hall, <i>Energy Return on Investment<\/i>, Springer (2015).\",\n      hint:\"Les roues tournent — règle les deux leviers ci-dessous.\",\n      hintPaused:\"En pause — appuie sur lecture pour faire tourner l'engrenage.\",\n      c_thr:'Régime de la roue monétaire <small>(PIB)<\/small>',\n      c_dec:'Découplage <small>(ratio de transmission)<\/small>',\n      tl_pib:\"Roue monétaire · PIB\", tl_deb:\"Roue énergétique · débit\", tl_rat:\"Ratio transmission\",\n      m_lbl:\"Pression sur les limites planétaires\",\n      di_t:\"Qu'est-ce que le découplage ?\",\n      di_b:\"<b>Découpler<\/b>, c'est réduire le <b>débit physique<\/b> (énergie, matières) nécessaire pour produire une unité de PIB. Dans l'engrenage, cela revient à <b>réduire le ratio de transmission<\/b> — moins de dents — par l'efficacité énergétique, les renouvelables et l'économie circulaire.\",\n      di_rt:\"Découplage relatif\",\n      di_rb:\"Le débit physique augmente encore, mais <b>moins vite<\/b> que le PIB. Fréquent — mais la pression totale continue de monter.\",\n      di_at:\"Découplage absolu\",\n      di_ab:\"Le PIB monte pendant que le débit <b>baisse<\/b> en valeur absolue. Seul cas qui réduit vraiment la pression — rare, surtout à l'échelle mondiale et pour les matières.\",\n      nameM:\"roue monétaire\", nameE:\"roue énergétique\",\n      decoup:\"découplage actif\",\n      flow:{energy:\"énergie\",entropy:\"entropie\",res:\"ressources\",waste:\"déchets\"},\n      lessonBase:\"À découplage nul, la roue énergétique tourne au même rythme que la monétaire : <b>accélérer le PIB accélère le débit physique<\/b>.\",\n      lessonDec:\"Avec le découplage, la roue énergétique <b>ralentit<\/b> par rapport au PIB — mais le découplage absolu (débit qui baisse pendant que le PIB monte) reste difficile.\",\n      lessonOver:\"⚠ Le débit dépasse la limite : <b>surexploitation<\/b>. Réduis le PIB (sobriété) ou augmente le découplage.\",\n      th_t:\"Un système thermodynamique dans un monde fini\",\n      th_b:\"L'économie est <b>encastrée<\/b> dans la biosphère : elle y puise des ressources et y rejette des déchets. Ce <b>débit physique<\/b> obéit aux <b>lois de la thermodynamique<\/b> — et <i>un engrenage ne peut pas tourner à vitesse infinie dans un monde fini<\/i>.\",\n      th_l1t:\"1ʳᵉ loi — conservation\",\n      th_l1b:\"Rien ne se crée : l'énergie et la matière ne sortent pas de nulle part. Toute production <b>prélève<\/b> un stock physique existant.\",\n      th_l2t:\"2ᵈᵉ loi — entropie\",\n      th_l2b:\"Tout se dégrade : l'énergie utilisée se <b>dissipe<\/b>, la matière se disperse. Le <b>recyclage parfait est impossible<\/b> — une friction irréductible.\",\n      dgWorld:\"MONDE FINI — LIMITES PLANÉTAIRES\", dgLimit:\"la vitesse ne peut pas être infinie\",\n      dgEcon:\"économie\", dgEco:\"écosystème\", dgFlux:\"débit physique (matière · énergie)\",\n      tr_t:\"Desserrer l'engrenage : le découplage\",\n      tr_lead:\"Peut-on desserrer cet engrenage ? En partie, oui : en gagnant en <b>efficacité énergétique<\/b> (renouvelables, isolation, procédés sobres, économie circulaire), on <b>réduit le nombre de dents<\/b> — le débit physique nécessaire à chaque unité de PIB. Les deux roues restent liées, mais on peut les <b>déconnecter partiellement<\/b>. C'est le <b>découplage<\/b> : fais glisser le curseur ci-dessous et observe la roue énergétique ralentir par rapport à la roue monétaire.\",\n      ds1t:\"Deux types de découplage\",\n      ds1lead:\"L'innovation technologique peut-elle permettre une « croissance verte » illimitée en <b>découplant<\/b> le PIB de son empreinte ? Dans <i>Prosperity without Growth<\/i> (2020), Tim Jackson distingue deux cas — et un seul respecte la capacité de charge.\",\n      ds_relt:\"Découplage relatif\",\n      ds_relb:\"<b>Intensité ↓ · impact total ↑.<\/b> L'impact par unité de PIB baisse, mais le PIB grimpe plus vite : l'impact <b>total continue d'augmenter<\/b>. On produit « plus proprement », mais on produit plus — c'est ce qu'on observe presque partout.\",\n      ds_abst:\"Découplage absolu\",\n      ds_absb:\"<b>Impact total ↓.<\/b> L'impact absolu <b>diminue pendant que le PIB croît<\/b>. Il ne suffit pas de ralentir la hausse : il faut l'<b>inverser<\/b>. Seul cas compatible avec la capacité de charge, et il reste rare.\",\n      ds_note:\"Une croissance exponentielle sans dépasser K exige un découplage absolu — soutenu, mondial, et sur toutes les dimensions.\",\n      dcGDP:\"PIB\", dcNone:\"sans\", dcRel:\"relatif\", dcAbs:\"absolu\", dcLim:\"limite\", dcTime:\"temps\", dcAxis:\"indice (base 100)\",\n      ds2t:\"Absence de découplage absolu\",\n      ds2lead:\"En pratique, le découplage absolu <b>n'est pas observé<\/b> — pour plusieurs raisons physiques et économiques. En voici trois, au cœur du rapport <i>Decoupling Debunked<\/i> (2020).\",\n      ds2concl:\"<b>Extraction de matières ×3 en 40 ans · consommation d'eau +250 %.<\/b> Seul un découplage <b>relatif<\/b> est observé. <b>Aucun découplage absolu robuste à l'échelle mondiale depuis 1990<\/b> : ce n'est pas une question de volonté technologique, c'est une contrainte physique.\",\n      evidence:[\n        {t:\"L'effet rebond\", b:\"Les gains d'efficacité rendent l'usage <b>moins cher<\/b>, ce qui <b>relance la consommation<\/b> : une partie des économies attendues est « re-dépensée ». L'efficacité par unité progresse, mais le <b>volume total<\/b> grimpe — et le gain net fond.\", f:\"Le <b>paradoxe de Jevons<\/b> (1865) : plus efficace ⇒ plus consommé\"},\n        {t:\"Le transfert écologique\", b:\"Un pays réduit l'empreinte <b>mesurée sur son sol<\/b> en <b>important<\/b> les biens les plus polluants. Sa consommation réelle ne baisse pas — elle est simplement <b>comptée ailleurs<\/b>. La France en est un cas net.\", f:\"<b>France<\/b> : ses importations de matières sont passées de <b>15 %<\/b> de l'extraction nationale (1948) à <b>plus de 50 %<\/b> en 2015 — son empreinte est de plus en plus <b>importée<\/b>.\"},\n        {t:\"L'EROI décroissant\", b:\"Produire de l'énergie coûte <b>de plus en plus d'énergie<\/b>. Le système énergétique <b>réabsorbe une part croissante<\/b> de sa propre production : même à besoin net constant, il faut <b>plus d'énergie brute<\/b>. Le seuil d'efficacité nécessaire au découplage <b>monte encore<\/b>.\", f:\"Pétrole : 1 baril investi en rapportait ~<b>100<\/b> vers 1930, ~<b>30<\/b> en 1970, ~<b>15<\/b> aujourd'hui\"}\n      ],\n      over:\"dépassement\", ok:\"sous la limite\"\n    },\n    en:{\n      eyebrow:\"Back to the gear · laws of thermodynamics\",\n      title:\"Decoupling: myth or lever?\",\n      sub:\"The monetary wheel drives the energy wheel, the opposite way — the economy stays a <b>thermodynamic system<\/b> in a finite world. Can GDP spin without speeding up physical throughput? That is the promise of <b>decoupling<\/b>. Run the gear, then tell <b>relative<\/b> from <b>absolute<\/b> decoupling, and hold them up to the data.\",\n      foot:\"Two levers to reduce the pressure: calibrate the size of the monetary wheel (sufficiency) or cut the number of teeth through green investment (decoupling). Sources: T. Jackson, <i>Prosperity without Growth<\/i> (2020); <i>Decoupling Debunked<\/i>, EEB (2020); French footprint: Cahen-Fourot &amp; Magalhães, <i>Socio-Economic Review<\/i> (2023); oil EROI: C. Hall, <i>Energy Return on Investment<\/i>, Springer (2015).\",\n      hint:\"The wheels are turning — set the two levers below.\",\n      hintPaused:\"Paused — press play to spin the gear.\",\n      c_thr:'Monetary wheel throttle <small>(GDP)<\/small>',\n      c_dec:'Decoupling <small>(transmission ratio)<\/small>',\n      tl_pib:\"Monetary wheel · GDP\", tl_deb:\"Energy wheel · throughput\", tl_rat:\"Transmission ratio\",\n      m_lbl:\"Pressure on planetary boundaries\",\n      di_t:\"What is decoupling?\",\n      di_b:\"<b>Decoupling<\/b> means cutting the <b>physical throughput<\/b> (energy, materials) needed to produce a unit of GDP. In the gear, it amounts to <b>lowering the transmission ratio<\/b> — fewer teeth — through energy efficiency, renewables and the circular economy.\",\n      di_rt:\"Relative decoupling\",\n      di_rb:\"Physical throughput still rises, but <b>slower<\/b> than GDP. Common — yet total pressure keeps climbing.\",\n      di_at:\"Absolute decoupling\",\n      di_ab:\"GDP rises while throughput <b>falls<\/b> in absolute terms. The only case that truly cuts pressure — rare, especially globally and for materials.\",\n      nameM:\"monetary wheel\", nameE:\"energy wheel\",\n      decoup:\"decoupling on\",\n      flow:{energy:\"energy\",entropy:\"entropy\",res:\"resources\",waste:\"waste\"},\n      lessonBase:\"With no decoupling, the energy wheel turns at the same pace as the monetary one: <b>speeding up GDP speeds up physical throughput<\/b>.\",\n      lessonDec:\"With decoupling, the energy wheel <b>slows down<\/b> relative to GDP — but absolute decoupling (throughput falling while GDP rises) stays hard.\",\n      lessonOver:\"⚠ Throughput crosses the boundary: <b>overshoot<\/b>. Cut GDP (sufficiency) or raise decoupling.\",\n      th_t:\"A thermodynamic system in a finite world\",\n      th_b:\"The economy is <b>embedded<\/b> in the biosphere: it draws resources from it and dumps waste back. This <b>physical throughput<\/b> obeys the <b>laws of thermodynamics<\/b> — and <i>a gear cannot turn at infinite speed in a finite world<\/i>.\",\n      th_l1t:\"1st law — conservation\",\n      th_l1b:\"Nothing is created: energy and matter do not come from nowhere. All production <b>draws on<\/b> an existing physical stock.\",\n      th_l2t:\"2nd law — entropy\",\n      th_l2b:\"Everything degrades: used energy <b>dissipates<\/b>, matter disperses. <b>Perfect recycling is impossible<\/b> — an irreducible friction.\",\n      dgWorld:\"FINITE WORLD — PLANETARY BOUNDARIES\", dgLimit:\"speed cannot be infinite\",\n      dgEcon:\"economy\", dgEco:\"ecosystem\", dgFlux:\"physical throughput (matter · energy)\",\n      tr_t:\"Loosening the gear: decoupling\",\n      tr_lead:\"Can this gear be loosened? Partly, yes: by gaining <b>energy efficiency<\/b> (renewables, insulation, leaner processes, the circular economy), you <b>cut the number of teeth<\/b> — the physical throughput needed per unit of GDP. The two wheels stay linked, but you can <b>partially disconnect<\/b> them. That is <b>decoupling<\/b>: drag the slider below and watch the energy wheel slow relative to the monetary wheel.\",\n      ds1t:\"Two types of decoupling\",\n      ds1lead:\"Can technological innovation enable unlimited “green growth” by <b>decoupling<\/b> GDP from its footprint? In <i>Prosperity without Growth<\/i> (2020), Tim Jackson draws two cases — and only one respects the carrying capacity.\",\n      ds_relt:\"Relative decoupling\",\n      ds_relb:\"<b>Intensity ↓ · total impact ↑.<\/b> Impact per unit of GDP falls, but GDP climbs faster: <b>total impact keeps rising<\/b>. We produce “more cleanly” but produce more — what we see almost everywhere.\",\n      ds_abst:\"Absolute decoupling\",\n      ds_absb:\"<b>Total impact ↓.<\/b> Absolute impact <b>falls while GDP grows<\/b>. Not slowing the rise but <b>reversing<\/b> it. The only case compatible with the carrying capacity, and it stays rare.\",\n      ds_note:\"Exponential growth without exceeding K requires absolute decoupling — sustained, global, and across every dimension.\",\n      dcGDP:\"GDP\", dcNone:\"none\", dcRel:\"relative\", dcAbs:\"absolute\", dcLim:\"limit\", dcTime:\"time\", dcAxis:\"index (base 100)\",\n      ds2t:\"The absence of absolute decoupling\",\n      ds2lead:\"In practice, absolute decoupling is <b>not observed<\/b> — for several physical and economic reasons. Here are three, central to the report <i>Decoupling Debunked<\/i> (2020).\",\n      ds2concl:\"<b>Material extraction ×3 in 40 years · water use +250 %.<\/b> Only <b>relative<\/b> decoupling is observed. <b>No robust absolute decoupling at global scale since 1990<\/b>: this is not a matter of technological will, it is a physical constraint.\",\n      evidence:[\n        {t:\"The rebound effect\", b:\"Efficiency gains make use <b>cheaper<\/b>, which <b>revives consumption<\/b>: part of the expected savings is “re-spent”. Efficiency per unit improves, but <b>total volume<\/b> climbs — and the net gain melts away.\", f:\"The <b>Jevons paradox<\/b> (1865): more efficient ⇒ more consumed\"},\n        {t:\"Ecological transfer\", b:\"A country cuts the footprint <b>measured on its own soil<\/b> by <b>importing<\/b> the most polluting goods. Its real consumption does not fall — it is simply <b>counted elsewhere<\/b>. France is a clear case.\", f:\"<b>France<\/b>: material imports rose from <b>15 %<\/b> of domestic extraction (1948) to <b>over 50 %<\/b> in 2015 — its footprint is increasingly <b>imported<\/b>.\"},\n        {t:\"Declining EROI\", b:\"Producing energy costs <b>ever more energy<\/b>. The energy system <b>reabsorbs a growing share<\/b> of its own output: even at constant net need, more <b>gross energy<\/b> is required. The efficiency threshold for decoupling <b>rises further<\/b>.\", f:\"Oil: one barrel invested returned ~<b>100<\/b> around 1930, ~<b>30<\/b> in 1970, ~<b>15<\/b> today\"}\n      ],\n      over:\"overshoot\", ok:\"below the boundary\"\n    }\n  };\n\n  // ---------- gears ----------\n  function gearPath(cx,cy,r,n,add,ded){\n    var step=2*Math.PI/n,d='';\n    function P(f,rr){var a=f;return [(cx+rr*Math.cos(a)).toFixed(2),(cy+rr*Math.sin(a)).toFixed(2)];}\n    for(var i=0;i<n;i++){\n      var a=i*step, rt=r-ded, tp=r+add;\n      var q0=P(a,rt),q1=P(a+step*0.16,rt),q2=P(a+step*0.30,tp),q3=P(a+step*0.50,tp),q4=P(a+step*0.64,rt),q5=P(a+step,rt);\n      d+=(i===0?'M '+q0[0]+' '+q0[1]+' ':'')+'L '+q1[0]+' '+q1[1]+' L '+q2[0]+' '+q2[1]+' L '+q3[0]+' '+q3[1]+' L '+q4[0]+' '+q4[1]+' L '+q5[0]+' '+q5[1]+' ';\n    }\n    return d+'Z';\n  }\n  var gMon=document.getElementById('g-mon'), gEn=document.getElementById('g-energy');\n  var rotM=mk('g',{}), rotE=mk('g',{});     // rotating inner groups\n  gMon.appendChild(rotM); gEn.appendChild(rotE);\n  (function(){\n    rotE.appendChild(mk('path',{d:gearPath(cxE,cyE,RE,Ne,8,8),class:'gearE'}));\n    rotE.appendChild(mk('circle',{cx:cxE,cy:cyE,r:16,class:'hubE'}));\n    for(var k=0;k<4;k++){var a=k*Math.PI/2;rotE.appendChild(mk('line',{x1:cxE,y1:cyE,x2:cxE+(RE-16)*Math.cos(a),y2:cyE+(RE-16)*Math.sin(a),class:'spoke'}));}\n\n    rotM.appendChild(mk('path',{d:gearPath(cxM,cyM,RM,Nm,8,8),class:'gearM'}));\n    rotM.appendChild(mk('circle',{cx:cxM,cy:cyM,r:14,class:'hubM'}));\n    // F,P,D markers on pitch circle (rotate with wheel)\n    var poles=[['F',270],['P',0],['D',180]];\n    poles.forEach(function(o){\n      var a=o[1]*Math.PI/180, x=cxM+RM*Math.cos(a), y=cyM+RM*Math.sin(a);\n      rotM.appendChild(mk('circle',{cx:x,cy:y,r:3.2,class:'pole-dot'}));\n      var lx=cxM+(RM-16)*Math.cos(a), ly=cyM+(RM-16)*Math.sin(a);\n      var tx=mk('text',{x:lx,y:ly+4,class:'pole-lbl','text-anchor':'middle'});tx.textContent=o[0];rotM.appendChild(tx);\n    });\n    for(var k=0;k<3;k++){var a=k*2*Math.PI/3+0.4;rotM.appendChild(mk('line',{x1:cxM,y1:cyM,x2:cxM+(RM-14)*Math.cos(a),y2:cyM+(RM-14)*Math.sin(a),class:'spokeM'}));}\n  })();\n\n  // ---------- flows (static, intensity ~ throughput) ----------\n  var LX=cxE-RE-16, RX=cxE+RE+16;\n  var flows={};\n  (function(){\n    var g=document.getElementById('g-flows');\n    flows.eIn=mk('line',{x1:LX,y1:cyE-70,x2:LX,y2:cyE,class:'flow in'});\n    flows.eOut=mk('line',{x1:LX,y1:cyE,x2:LX,y2:cyE+RE-6,class:'flow out','marker-end':'url(#ahOut)'});\n    flows.mIn=mk('line',{x1:RX,y1:cyE+RE-6,x2:RX,y2:cyE,class:'flow in'});\n    flows.mOut=mk('line',{x1:RX,y1:cyE,x2:RX,y2:cyE-70,class:'flow out','marker-end':'url(#ahOut)'});\n    [flows.eIn,flows.eOut,flows.mIn,flows.mOut].forEach(function(f){g.appendChild(f);});\n    // labels\n    flows.lE=mk('text',{x:LX,y:cyE-80,class:'flbl in','text-anchor':'middle'});\n    flows.lEnt=mk('text',{x:LX,y:cyE+RE+8,class:'flbl out','text-anchor':'middle'});\n    flows.lR=mk('text',{x:RX,y:cyE+RE+8,class:'flbl in','text-anchor':'middle'});\n    flows.lW=mk('text',{x:RX,y:cyE-80,class:'flbl out','text-anchor':'middle'});\n    [flows.lE,flows.lEnt,flows.lR,flows.lW].forEach(function(f){g.appendChild(f);});\n  })();\n\n  // names + decoupling badge\n  (function(){\n    var gn=document.getElementById('g-names');\n    var nm=mk('text',{x:cxM,y:cyM-RM-10,class:'wheelname'});nm.id='nameM';gn.appendChild(nm);\n    var ne=mk('text',{x:cxE,y:cyE+4,class:'wheelname'});ne.id='nameE';gn.appendChild(ne);\n    var bd=mk('text',{x:MESH[0]+14,y:MESH[1]-4,class:'decoupbadge','text-anchor':'start'});bd.id='badge';document.getElementById('g-badge').appendChild(bd);\n  })();\n\n  // ---------- state / animation ----------\n  var throttle=document.getElementById('throttle'), decouple=document.getElementById('decouple');\n  var running=!reduce, angM=0, angE=0, last=0;\n  var THR_LIMIT=65;\n\n  function coupling(){ return 1 - 0.85*(parseFloat(decouple.value)/100); } // 1 -> 0.15\n  function debitNorm(){ return (parseFloat(throttle.value)/100)*coupling(); } // 0..1\n\n  function frame(now){\n    if(!last) last=now; var dt=(now-last)/1000; last=now;\n    if(running){\n      var wm=(parseFloat(throttle.value)/100)*95; // deg/s\n      angM=(angM+wm*dt)%360;\n      angE=(angE-wm*dt*(Nm/Ne)*coupling())%360;\n      rotM.setAttribute('transform','rotate('+angM.toFixed(2)+' '+cxM+' '+cyM+')');\n      rotE.setAttribute('transform','rotate('+angE.toFixed(2)+' '+cxE+' '+cyE+')');\n    }\n    requestAnimationFrame(frame);\n  }\n\n  function readouts(){\n    var d=STR[LANG];\n    var pib=Math.round(parseFloat(throttle.value));\n    var c=coupling(), deb=Math.round(debitNorm()*100), rat=Math.round(c*100);\n    document.getElementById('throttleV').textContent=pib;\n    document.getElementById('decoupleV').textContent=Math.round(parseFloat(decouple.value))+' %';\n    document.getElementById('o-pib').textContent=pib;\n    document.getElementById('o-deb').textContent=deb;\n    document.getElementById('o-rat').innerHTML=rat+'<small>%<\/small>';\n    // meter\n    var over=deb>THR_LIMIT;\n    document.getElementById('o-meter').textContent=deb+' %';\n    var fill=document.getElementById('meterFill');\n    fill.style.width=deb+'%';\n    fill.style.background = over? 'var(--warn)' : (deb>45?'var(--prod)':'var(--eco)');\n    document.getElementById('meterThr').style.left=THR_LIMIT+'%';\n    var note=document.getElementById('meterNote');\n    note.textContent = over? ('▲ '+d.over) : ('· '+d.ok);\n    note.className='mnote'+(over?' over':'');\n    // flows intensity\n    var op=(0.22+0.78*debitNorm()).toFixed(2), w=(2.5+3.5*debitNorm()).toFixed(1);\n    [flows.eIn,flows.eOut,flows.mIn,flows.mOut].forEach(function(f){f.style.opacity=op;f.style.strokeWidth=w;});\n    [flows.lE,flows.lEnt,flows.lR,flows.lW].forEach(function(f){f.style.opacity=(0.4+0.6*debitNorm()).toFixed(2);});\n    // decoupling badge\n    var bd=document.getElementById('badge'); bd.style.opacity = parseFloat(decouple.value)>12?0.95:0;\n    bd.textContent=d.decoup;\n    // lesson\n    var lesson=document.getElementById('lesson');\n    lesson.innerHTML = over? d.lessonOver : (parseFloat(decouple.value)>12? d.lessonDec : d.lessonBase);\n  }\n\n  throttle.addEventListener('input',readouts);\n  decouple.addEventListener('input',readouts);\n\n  // play/pause\n  function setIcon(){var p=document.getElementById('ico-play'),q=document.getElementById('ico-pause');(running?p:q).setAttribute('hidden','');(running?q:p).removeAttribute('hidden');}\n  document.getElementById('play').addEventListener('click',function(){running=!running;setIcon();updateHint();});\n  function updateHint(){document.querySelector('.hint').textContent = running?STR[LANG].hint:STR[LANG].hintPaused;}\n\n  // toggles\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme');if(a)return a;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}\n  document.getElementById('theme').addEventListener('click',function(){document.documentElement.setAttribute('data-theme',effTheme()==='dark'?'light':'dark');try{localStorage.setItem('dec_theme',effTheme());}catch(e){}});\n  try{var stt=localStorage.getItem('dec_theme');if(stt)document.documentElement.setAttribute('data-theme',stt);}catch(e){}\n\n  function applyLang(){\n    var d=STR[LANG];document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');if(d[k])el.innerHTML=d[k];});\n    document.getElementById('langlbl').textContent=LANG.toUpperCase();\n    document.getElementById('nameM').textContent=d.nameM;\n    document.getElementById('nameE').textContent=d.nameE;\n    flows.lE.textContent=d.flow.energy; flows.lEnt.textContent=d.flow.entropy;\n    flows.lR.textContent=d.flow.res; flows.lW.textContent=d.flow.waste;\n    updateHint(); readouts(); drawDecChart(); buildEvidence(); drawCapstone();\n  }\n  document.getElementById('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem('dec_lang',LANG);}catch(e){}applyLang();});\n\n  function gear(svg,cx,cy,rr,teeth,col){\n    svg.appendChild(mk('circle',{cx:cx,cy:cy,r:rr,fill:'none',stroke:col,'stroke-width':2.4}));\n    svg.appendChild(mk('circle',{cx:cx,cy:cy,r:rr*0.34,fill:'none',stroke:col,'stroke-width':2}));\n    for(var k=0;k<teeth;k++){var ang=k/teeth*Math.PI*2,x1=cx+Math.cos(ang)*rr,y1=cy+Math.sin(ang)*rr,x2=cx+Math.cos(ang)*(rr+5.5),y2=cy+Math.sin(ang)*(rr+5.5);svg.appendChild(mk('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:col,'stroke-width':2.4,'stroke-linecap':'round'}));}\n  }\n  function drawCapstone(){\n    var d=STR[LANG], svg=document.getElementById('capsvg'); if(!svg)return;\n    while(svg.firstChild) svg.removeChild(svg.firstChild);\n    svg.appendChild(mk('rect',{x:16,y:16,width:668,height:268,rx:18,fill:'none',stroke:'var(--faint)','stroke-width':1.6,'stroke-dasharray':'2 4'}));\n    var wl=mk('text',{x:30,y:36,fill:'var(--faint)','font-size':11,'font-family':'var(--font-m)','letter-spacing':'.08em'}); wl.textContent=d.dgWorld; svg.appendChild(wl);\n    var cy=92;\n    svg.appendChild(mk('line',{x1:300,y1:cy,x2:660,y2:cy,stroke:'var(--warn)','stroke-width':2,'stroke-dasharray':'7 5'}));\n    var ll=mk('text',{x:660,y:cy-8,'text-anchor':'end',fill:'var(--warn)','font-size':12,'font-family':'var(--font-m)','font-weight':500}); ll.textContent=d.dgLimit; svg.appendChild(ll);\n    gear(svg,150,120,42,10,'var(--fin)');\n    gear(svg,150,205,42,10,'var(--eco)');\n    var e1=mk('text',{x:150,y:124,'text-anchor':'middle',fill:'var(--fin)','font-size':11.5,'font-family':'var(--font-m)','font-weight':600}); e1.textContent=d.dgEcon; svg.appendChild(e1);\n    var e2=mk('text',{x:150,y:209,'text-anchor':'middle',fill:'var(--eco)','font-size':11.5,'font-family':'var(--font-m)','font-weight':600}); e2.textContent=d.dgEco; svg.appendChild(e2);\n    svg.appendChild(mk('path',{d:'M 210 150 C 330 150 360 100 460 94 L 636 92',fill:'none',stroke:'var(--ink)','stroke-width':2.4,'stroke-linecap':'round'}));\n    svg.appendChild(mk('path',{d:'M 636 92 l -11 -5 M 636 92 l -11 5',fill:'none',stroke:'var(--ink)','stroke-width':2.4,'stroke-linecap':'round'}));\n    var fl=mk('text',{x:300,y:150,fill:'var(--muted)','font-size':12,'font-family':'var(--font-d)','font-style':'italic'}); fl.textContent=d.dgFlux; svg.appendChild(fl);\n    svg.appendChild(mk('circle',{cx:636,cy:92,r:4.5,fill:'var(--warn)',stroke:'var(--surface)','stroke-width':1.4}));\n  }\n  function drawDecChart(){\n    var d=STR[LANG], svg=document.getElementById('decChart');\n    while(svg.firstChild) svg.removeChild(svg.firstChild);\n    var W=480,H=320,pL=42,pR=108,pT=16,pB=34;\n    var x0=pL,x1=W-pR,y0=pT,y1=H-pB, T=25, ymax=250;\n    function X(t){return x0+t/T*(x1-x0);}\n    function Y(v){return y1-v/ymax*(y1-y0);}\n    var g=mk('g',{class:'dax'});\n    [0,100,200].forEach(function(v){var yy=Y(v);g.appendChild(mk('line',{x1:x0,y1:yy,x2:x1,y2:yy}));var t=mk('text',{x:x0-6,y:yy+3,'text-anchor':'end'});t.textContent=v;g.appendChild(t);});\n    var xl=mk('text',{x:(x0+x1)/2,y:H-5,'text-anchor':'middle',fill:'var(--faint)','font-size':10,'font-family':'var(--font-m)'});xl.textContent=d.dcTime;g.appendChild(xl);\n    var yl=mk('text',{x:x0-30,y:y0-4,fill:'var(--faint)','font-size':10,'font-family':'var(--font-m)'});yl.textContent=d.dcAxis;g.appendChild(yl);\n    svg.appendChild(g);\n    var lim=130;\n    svg.appendChild(mk('line',{x1:x0,y1:Y(lim),x2:x1,y2:Y(lim),stroke:'var(--warn)','stroke-width':1.4,'stroke-dasharray':'6 4',opacity:.85}));\n    function curve(fn,col,dash,wd){var p='M ';for(var t=0;t<=T;t+=0.5){p+=(t?'L ':'')+X(t).toFixed(1)+' '+Y(Math.min(ymax,fn(t))).toFixed(1)+' ';}svg.appendChild(mk('path',{d:p,fill:'none',stroke:col,'stroke-width':wd||2.2,'stroke-dasharray':dash||'none','stroke-linecap':'round','stroke-linejoin':'round'}));}\n    var fGDP=function(t){return 100*Math.exp(0.034*t);};\n    var fRel=function(t){return 100*Math.exp(0.016*t);};\n    var fAbs=function(t){return 100*Math.exp(-0.012*t);};\n    curve(fGDP,'var(--fin)',null,2.6);\n    curve(fRel,'var(--prod)',null,2.4);\n    curve(fAbs,'var(--eco)',null,2.4);\n    function lab(v,txt,col){var yy=Y(Math.min(ymax,v));var t=mk('text',{x:x1+5,y:yy+3,fill:col,'font-size':10.5,'font-family':'var(--font-m)','font-weight':600});t.textContent=txt;svg.appendChild(t);}\n    lab(fGDP(T),d.dcGDP,'var(--fin)');\n    lab(lim,d.dcLim,'var(--warn)');\n    lab(fRel(T),d.dcRel,'var(--prod)');\n    lab(fAbs(T),d.dcAbs,'var(--eco)');\n  }\n  function buildEvidence(){\n    var d=STR[LANG], box=document.getElementById('evgrid'); box.innerHTML='';\n    d.evidence.forEach(function(e){var el=document.createElement('div');el.className='evcard';el.innerHTML='<h4>'+e.t+'<\/h4><p>'+e.b+'<\/p><div class=\"fig\">'+e.f+'<\/div>';box.appendChild(el);});\n  }\n\n  // boot\n  setIcon(); applyLang(); readouts();\n  // static mesh pose when paused (so the resting frame shows interlocked gears)\n  rotE.setAttribute('transform','rotate('+(360/Ne/2)+' '+cxE+' '+cyE+')');\n  requestAnimationFrame(frame);\n})();\n<\/script>\n\n<\/body>\n<\/html>\n", "eroi.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Combien d'énergie reste à la société ?<\/title>\n<link rel=\"preconnect\" href=\"https://font
