<title>Macroéconomie écologique — le fil du cours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;
    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;
    --econ:#2A78D6;--eco:#2E8B57;--rms:#C08A00;--warn:#C0392B;--fish:#0E7C9B;
    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);
    --font-d:"Spectral",Georgia,serif;--font-b:"IBM Plex Sans",system-ui,sans-serif;--font-m:"IBM Plex Mono",ui-monospace,monospace;
  }
  :root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}
  body.mode-tool{overflow:hidden;}

  /* ───────── vue « fil » ───────── */
  .wrap{max-width:1080px;margin:0 auto;padding-block:28px 56px;padding-inline:20px;}
  header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:400;margin:0 0 7px;text-wrap:pretty;}
  .eyebrow b{color:var(--fish);font-weight:500;}
  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.6vw,44px);line-height:1.03;margin:0;letter-spacing:-.015em;text-wrap:balance;}
  .seance{font-family:var(--font-d);font-weight:500;font-size:clamp(17px,2.1vw,21px);line-height:1.15;color:var(--muted);margin:7px 0 0;}
  .sub{color:var(--muted);font-size:15.5px;margin:14px 0 0;max-width:80ch;text-wrap:pretty;}
  .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}
  .toggles{display:flex;gap:8px;flex-shrink:0;}
  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}
  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}
  .tg:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--rms);outline-offset:2px;}

  .part{margin-top:40px;}
  .parthead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px;}
  .parthead .rn{font-family:var(--font-m);font-size:12px;font-weight:600;color:#fff;background:var(--pc);border-radius:7px;padding:3px 10px;line-height:1;flex-shrink:0;}
  .parthead h2{font-family:var(--font-d);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance;}
  .partlead{color:var(--muted);font-size:14px;margin:10px 0 16px;max-width:84ch;text-wrap:pretty;}
  .partlead b{color:var(--ink);font-weight:600;} .partlead i{font-family:var(--font-d);font-style:italic;}

  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media (max-width:680px){.cards{grid-template-columns:1fr;}}
  a.card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;transition:border-color .15s,transform .15s;}
  a.card:hover{border-color:var(--faint);transform:translateY(-1px);}
  .emb{flex-shrink:0;width:46px;height:46px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .emb svg{width:26px;height:26px;}
  .cbody{flex:1;min-width:0;}
  .cbody .idx{font-family:var(--font-m);font-size:11px;color:var(--faint);}
  .cbody h3{font-family:var(--font-d);font-weight:600;font-size:16.5px;margin:1px 0 3px;line-height:1.15;text-wrap:balance;}
  .cbody p{font-size:12.8px;color:var(--muted);margin:0;text-wrap:pretty;}
  .cbody .go{font-family:var(--font-m);font-size:11.5px;color:var(--fish);font-weight:500;margin-top:7px;display:inline-block;}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px;text-align:center;text-wrap:balance;}
  footer p{margin:0 0 7px;} footer p:last-child{margin-bottom:0;}
  footer a{color:var(--muted);text-decoration:underline;text-underline-offset:2px;}
  footer a:hover{color:var(--ink);}
  .lic{max-width:62ch;margin-inline:auto;text-wrap:pretty;line-height:1.6;}
  .lic a{white-space:nowrap;}

  /* ───────── vue « outil » ───────── */
  #view-tool{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);}
  body.mode-tool #view-tool{display:flex;}
  body.mode-tool #view-fil{display:none;}
  .nav{display:flex;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;}
  .navrow{display:flex;align-items:center;gap:10px;padding:7px 14px;}
  .navrow.r1{min-height:46px;}
  .nbtn{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:7px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1;}
  .nbtn:hover:not([disabled]){color:var(--ink);border-color:var(--faint);}
  .nbtn[disabled]{opacity:.35;cursor:default;}
  .nbtn.home{color:var(--ink);font-weight:500;}
  .nparts{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding-inline:4px;}
  .pcur{display:inline-flex;align-items:baseline;gap:9px;min-width:0;font-family:var(--font-d);font-weight:600;font-size:15.5px;line-height:1.15;white-space:nowrap;}
  .pcur em{font-family:var(--font-m);font-style:normal;font-size:12px;font-weight:600;color:var(--acc);flex-shrink:0;}
  .pcur span{overflow:hidden;text-overflow:ellipsis;}
  .ngroup{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .ncount{font-family:var(--font-m);font-size:11.5px;color:var(--faint);min-width:46px;text-align:center;}

  .navrow.r2{gap:4px;border-top:1px solid var(--line);padding-block:5px;overflow-x:auto;scrollbar-width:none;background:var(--panel);}
  .navrow.r2::-webkit-scrollbar{display:none;}
  .stp{display:inline-flex;align-items:baseline;gap:7px;flex:0 0 auto;min-width:0;max-width:260px;padding:5px 10px;border-radius:8px;border:1px solid transparent;text-decoration:none;color:var(--faint);font-size:12.5px;line-height:1.2;white-space:nowrap;}
  .stp em{font-family:var(--font-m);font-style:normal;font-size:10.5px;flex-shrink:0;opacity:.8;}
  .stp span{overflow:hidden;text-overflow:ellipsis;}
  .stp:hover{color:var(--ink);background:var(--surface);}
  .stp.on{color:var(--ink);font-weight:600;background:var(--surface);border-color:var(--line);box-shadow:inset 2px 0 0 var(--acc);max-width:none;}
  .stp.on em{color:var(--acc);opacity:1;}
  .pgrp{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);text-decoration:none;font-family:var(--font-m);font-size:11px;font-weight:600;color:var(--faint);line-height:1;}
  .pgrp:hover{color:var(--ink);background:var(--surface);border-color:var(--faint);}

  .host{flex:1;position:relative;min-height:0;}
  .host iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);}

  /* ───────── plein écran ─────────
     Le bandeau se retire au-dessus du bord et revient dès que le pointeur
     approche du haut. La bande de déclenchement #hotzone appartient à la page
     hôte : indispensable, car une iframe absorbe les mouvements de souris et
     la coquille ne les verrait jamais. */
  body.mode-plein .nav{position:absolute;top:0;left:0;right:0;z-index:6;
    transform:translateY(-100%);transition:transform .18s ease;box-shadow:0 8px 26px rgba(0,0,0,.20);}
  body.mode-plein.nav-on .nav{transform:none;}
  #hotzone{display:none;}
  body.mode-plein #hotzone{display:block;position:absolute;top:0;left:0;right:0;height:6px;z-index:7;}
  body.mode-plein.nav-on #hotzone{display:none;}
  .pastille{display:none;}
  body.mode-plein .pastille{display:block;position:absolute;top:10px;right:14px;z-index:5;
    font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;color:var(--faint);
    background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 9px;
    opacity:0;transition:opacity .4s ease;pointer-events:none;}
  body.mode-plein.astuce .pastille{opacity:.92;}
  @media (prefers-reduced-motion:reduce){
    body.mode-plein .nav{transition:none;} .pastille{transition:none;}
  }
  @media (max-width:640px){
    .pcur{font-size:13.5px;}
    .nbtn{padding:7px 8px;} .ncount{min-width:38px;}
    .nbtn.home span{display:none;}
    .stp{max-width:200px;}
    .navrow{padding-inline:10px;}
  }
</style>
</head>

>change d'échelle<\/b> : les limites cessent d'être locales et deviennent globales. Douze outils interactifs, dans l'ordre du fil : chacun s'ouvre ici même, et l'on revient au fil d'un clic.", "parties": [{"titre": "La machine économique", "chapo": "L'économie se raconte comme un <b>circuit<\/b> : une roue monétaire qui tourne sur elle-même, indéfiniment. Reste à demander ce qui l'entraîne — une seconde roue, physique celle-là, et les deux ne tournent qu'ensemble : un <b>engrenage<\/b>. C'est cette machine qu'on confrontera ensuite au monde."}, {"titre": "La gestion soutenable des ressources", "chapo": "Une ressource renouvelable a une <b>capacité de charge<\/b> : un stock maximal que le milieu peut porter. Sa loi de croissance détermine le <b>prélèvement soutenable<\/b> — ce qu'on peut retirer sans entamer le stock. Reste à tenir ce niveau dans la durée, alors que la décision se reprend chaque année et que l'erreur se paie par l'effondrement."}, {"titre": "Un monde fini", "chapo": "Changer d'échelle change le problème. On demande d'abord si les deux roues peuvent être séparées : c'est la promesse du <b>découplage<\/b>, que l'EROI vient compliquer, puisque l'énergie qui alimente le débit coûte elle-même de l'énergie. On décompose ensuite l'impact en trois leviers, et l'on mesure enfin le plafond : non pas une grandeur unique, mais un jeu de limites <b>multidimensionnel<\/b>."}], "cartes": [{"titre": "L'encastrement de l'économie", "resume": "D'un simple paiement à la Voie lactée : l'économie est un <b>sous-système encastré<\/b> dans le système Terre — elle y puise et y rejette."}, {"titre": "La roue monétaire", "resume": "Le circuit keynésien : revenus, dépenses, épargne et investissement qui bouclent. La roue supérieure de l'engrenage."}, {"titre": "La roue énergétique", "resume": "Ce qui fait tourner la roue monétaire : le flux d'énergie et de ressources, l'entropie, le débit physique. La roue inférieure."}, {"titre": "L'engrenage", "resume": "Les deux roues couplées : l'activité économique est indissociable de son socle physique. Rotation couplée."}, {"titre": "Croissance exponentielle et croissance logistique", "resume": "Deux lois de croissance : l'exponentielle sans frein, la logistique qui bute sur une capacité de charge K."}, {"titre": "L'empreinte soutenable", "resume": "Notre capacité de charge et celle des ressources ; gérer les non-renouvelables (recyclage, rationnement) et les renouvelables — le RMS."}, {"titre": "Le simulateur de prises", "resume": "Le stock évolue en temps réel ; on fixe la prise en direct, année après année. On entre dans le concret des pêcheries."}, {"titre": "Prélever sans épuiser", "resume": "Le cas de l'Islande : chaque espèce bute sur sa limite, le total sature, diversifier déplace le prélèvement — puis quotas et limites planétaires."}, {"titre": "Le découplage : mythe ou levier ?", "resume": "On ajoute à l'engrenage un second levier — le taux de découplage — puis on confronte la promesse aux données : relatif ou absolu, et trois obstacles."}, {"titre": "L'énergie qui reste à la société", "resume": "L'EROI : sous un certain seuil, la part réinvestie dévore l'énergie nette. La falaise, et ce qu'elle exige d'un découplage absolu."}, {"titre": "Trois leviers pour contenir l'impact", "resume": "L'identité <b>I = P × A × T<\/b> : vraie par construction, donc sans échappatoire. Les leviers se multiplient, aucun ne suffit seul."}, {"titre": "Rester dans les limites planétaires", "resume": "Les neuf limites, le plafond écologique pays par pays et le plancher social : les deux bords du donut."}], "pied": "Parcours du cours de macroéconomie écologique — chaque carte ouvre l'outil interactif correspondant.", "licence": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — réutilisation et adaptation libres à des fins non commerciales, avec attribution et sous la même licence.", "nav_fil": "Le fil", "nav_ouvrir": "Ouvrir l’outil", "nav_prec": "Outil précédent", "nav_suiv": "Outil suivant", "nav_plein": "Plein écran (F)", "nav_plein_sortie": "Quitter le plein écran (Échap)", "nav_plein_astuce": "Approchez du haut pour revoir la barre · Échap pour sortir"}, "en": {"titre_onglet": "Ecological macroeconomics — Session 1: the thread of the course", "surtitre": "<b>Ecological macroeconomics<\/b> · Léo Malherbe · KEDGE Business School", "titre": "The thread of the course", "seance": "Session 1", "chapo": "Three movements. The first builds the <b>economic machine<\/b> and shows that it rests on a physical base. The second tests it on a <b>single resource<\/b>, looking for its limit and for how to harvest it without depleting it. The third <b>changes scale<\/b>: limits stop being local and become global. Twelve interactive tools, in the order of the thread: each opens right here, and one click brings you back.", "parties": [{"titre": "The economic machine", "chapo": "Economics tells itself as a <b>circuit<\/b>: a monetary wheel turning on itself, indefinitely. The question is what drives it — a second wheel, a physical one, and neither turns without the other: a <b>gear<\/b>. This is the machine we will later confront with the world."}, {"titre": "Sustainable resource management", "chapo": "A renewable resource has a <b>carrying capacity<\/b>: a maximum stock the environment can hold. Its growth law determines the <b>sustainable harvest<\/b> — what can be taken without eating into the stock. Holding that level over time is the hard part, since the decision is made afresh every year and error is paid for in collapse."}, {"titre": "A finite world", "chapo": "Changing scale changes the problem. First we ask whether the two wheels can be separated: that is the promise of <b>decoupling<\/b>, which EROI complicates, since the energy feeding the throughput itself costs energy. Then we break impact down into three levers, and finally we measure the ceiling: not a single magnitude, but a <b>multidimensional<\/b> set of boundaries."}], "cartes": [{"titre": "The embedded economy", "resume": "From a simple payment to the Milky Way: the economy is a <b>subsystem embedded<\/b> in the Earth system — drawing from it and dumping into it."}, {"titre": "The monetary wheel", "resume": "The Keynesian circuit: incomes, spending, saving and investment closing the loop. The upper wheel of the gear."}, {"titre": "The energy wheel", "resume": "What drives the monetary wheel: the flow of energy and resources, entropy, physical throughput. The lower wheel."}, {"titre": "The gear", "resume": "The two wheels coupled: economic activity is inseparable from its physical base. Coupled rotation."}, {"titre": "Exponential and logistic growth", "resume": "Two growth laws: the unchecked exponential, and the logistic that hits a carrying capacity K."}, {"titre": "The sustainable footprint", "resume": "Our carrying capacity and the resources' ; managing non-renewables (recycling, rationing) and renewables — the MSY."}, {"titre": "The catch simulator", "resume": "The stock evolves in real time; you set the catch live, year after year. Into the concrete world of fisheries."}, {"titre": "Harvesting without depleting", "resume": "The Iceland case: each species hits its limit, the total saturates, diversifying shifts the take — then quotas and planetary boundaries."}, {"titre": "Decoupling: myth or lever?", "resume": "A second lever is added to the gear — the decoupling rate — then the promise is tested against data: relative or absolute, and three obstacles."}, {"titre": "The energy left to society", "resume": "EROI: below a certain threshold, the reinvested share devours net energy. The cliff, and what it demands of absolute decoupling."}, {"titre": "Three levers to contain impact", "resume": "The identity <b>I = P × A × T<\/b>: true by construction, hence inescapable. The levers multiply, none is sufficient alone."}, {"titre": "Staying within planetary boundaries", "resume": "The nine boundaries, the ecological ceiling country by country and the social foundation: the two edges of the doughnut."}], "pied": "Course path for ecological macroeconomics — each card opens the matching interactive tool.", "licence": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — free to reuse and adapt for non-commercial purposes, with attribution and under the same licence.", "nav_fil": "The thread", "nav_ouvrir": "Open the tool", "nav_prec": "Previous tool", "nav_suiv": "Next tool", "nav_plein": "Full screen (F)", "nav_plein_sortie": "Exit full screen (Esc)", "nav_plein_astuce": "Move to the top edge to bring the bar back · Esc to exit"}}}</script>

eco);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.22);}\n  .rng::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--surface);border:2.5px solid var(--eco);cursor:pointer;}\n\n  .thesis{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--eco);border-radius:12px;padding:14px 18px;font-size:14px;color:var(--muted);text-wrap:pretty;transition:border-color .3s,background .3s;}\n  .thesis.hot{border-left-color:var(--gold);background:var(--surface);}\n  .thesis b{color:var(--ink);font-weight:600;} .thesis i{font-family:var(--font-d);font-style:italic;}\n<\/style>\n\n<div class=\"wrap\">\n  <header>\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\">Économie et système Terre<\/p>\n      <h1 data-t=\"title\">L'encastrement de l'économie<\/h1>\n      <p class=\"sub\" data-t=\"sub\"><\/p>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" aria-label=\"langue\"><span aria-hidden=\"true\">⇄<\/span><span id=\"langlbl\">FR<\/span><\/button>\n      <button class=\"tg\" id=\"theme\" aria-label=\"thème\">◐<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"stagewrap\">\n    <svg id=\"stage\" viewBox=\"0 0 600 400\" role=\"img\" aria-label=\"Dézoom : de l'acte de paiement à la Voie lactée\"><\/svg>\n    <span class=\"llabel\" id=\"lnum\">1 / 5<\/span>\n    <span class=\"slabel\" id=\"scaleLbl\"><\/span>\n  <\/div>\n\n  <div class=\"cap\"><h3 id=\"capT\">—<\/h3><p id=\"capB\">—<\/p><\/div>\n\n  <div class=\"controls\">\n    <button class=\"btn\" id=\"prev\" aria-label=\"Zoom avant\">◀<\/button>\n    <button class=\"btn play\" id=\"play\"><\/button>\n    <button class=\"btn\" id=\"next\" aria-label=\"Dézoomer\">▶<\/button>\n    <div class=\"dots\" id=\"dots\"><\/div>\n  <\/div>\n  <input type=\"range\" class=\"rng\" id=\"rng\" min=\"0\" max=\"4\" step=\"1\" value=\"0\" aria-label=\"Niveau de zoom\">\n\n  <div class=\"thesis\" id=\"thesis\" data-t=\"thesis\"><\/div>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  var LANG='fr'; try{var s=localStorage.getItem('enc_lang'); if(s)LANG=s;}catch(e){}\n  var STR={\n    fr:{eyebrow:\"Économie et système Terre\", title:\"L'encastrement de l'économie\",\n      sub:\"L'économie n'est pas un système autonome : c'est un <b>sous-système encastré<\/b> dans le système Terre. Pour le voir, partons d'un simple <b>paiement<\/b> et <b>dézoomons<\/b>, cran par cran, jusqu'à la Voie lactée.\",\n      play:\"▶ Dézoomer\", pause:\"⏸ Pause\", replay:\"↺ Recommencer\",\n      scale:\"échelle ≈ \",\n      thesis:\"L'économie est un <b>sous-système<\/b> encastré dans le système Terre — elle y puise ses ressources et y rejette ses déchets. Ce n'est <b>pas<\/b> un système clos qui flotterait à part.\",\n      thesisHot:\"Toute l'économie humaine tient dans ce point : un <b>sous-système fini<\/b>, encastré dans le système Terre — lui-même une petite bille dans le cosmos.\",\n      levels:[\n        {s:\"1 m\", t:\"Un acte de paiement\", b:\"Une opération économique banale : un <b>paiement<\/b>, un acte de consommation. C'est la brique élémentaire de toute la macroéconomie.\"},\n        {s:\"100 km\", t:\"La ville dans son environnement\", b:\"Dézoom. La ville — ici réduite à un point — n'est pas seule : elle est posée dans une <b>nature<\/b> — montagnes, forêts, rivières — d'où elle tire ses ressources et où elle rejette ses déchets.\"},\n        {s:\"12 700 km\", t:\"Le globe — des réseaux commerciaux\", b:\"Dézoom. Les économies se nouent en <b>réseaux commerciaux<\/b> mondiaux. Toute l'activité tient sur une même <b>bille finie<\/b> : la Terre.\"},\n        {s:\"10⁹ km\", t:\"Le système solaire\", b:\"Dézoom. La Terre est un <b>système quasi fermé<\/b> : elle reçoit l'énergie du Soleil, mais presque aucune matière n'entre ni ne sort. Ses stocks sont bornés.\"},\n        {s:\"10¹⁸ km\", t:\"La Voie lactée\", b:\"Dézoom maximal. Le Soleil n'est qu'un point parmi des milliards. <b>Toute l'économie humaine est encastrée dans le système Terre<\/b> — un sous-système fini de la biosphère.\"}\n      ]\n    },\n    en:{eyebrow:\"Economy and Earth system\", title:\"The embedded economy\",\n      sub:\"The economy is not a stand-alone system: it is a <b>subsystem embedded<\/b> in the Earth system. To see it, start from a simple <b>payment<\/b> and <b>zoom out<\/b>, step by step, all the way to the Milky Way.\",\n      play:\"▶ Zoom out\", pause:\"⏸ Pause\", replay:\"↺ Restart\",\n      scale:\"scale ≈ \",\n      thesis:\"The economy is a <b>subsystem<\/b> embedded in the Earth system — it draws its resources from it and dumps its waste into it. It is <b>not<\/b> a closed system floating apart.\",\n      thesisHot:\"The whole human economy fits into this dot: a <b>finite subsystem<\/b>, embedded in the Earth system — itself a tiny marble in the cosmos.\",\n      levels:[\n        {s:\"1 m\", t:\"An act of payment\", b:\"A mundane economic operation: a <b>payment<\/b>, an act of consumption. The elementary brick of all macroeconomics.\"},\n        {s:\"100 km\", t:\"The city in its environment\", b:\"Zoom out. The city — here just a dot — is not alone: it sits within <b>nature<\/b> — mountains, forests, rivers — from which it draws resources and into which it dumps waste.\"},\n        {s:\"12,700 km\", t:\"The globe — trade networks\", b:\"Zoom out. Economies knit into worldwide <b>trade networks<\/b>. All activity sits on one <b>finite marble<\/b>: the Earth.\"},\n        {s:\"10⁹ km\", t:\"The solar system\", b:\"Zoom out. Earth is a <b>near-closed system<\/b>: it receives energy from the Sun, but almost no matter enters or leaves. Its stocks are bounded.\"},\n        {s:\"10¹⁸ km\", t:\"The Milky Way\", b:\"Maximum zoom-out. The Sun is just one point among billions. <b>The whole human economy is embedded in the Earth system<\/b> — a finite subsystem of the biosphere.\"}\n      ]\n    }\n  };\n\n  var stage=document.getElementById('stage');\n  var NS=\"http://www.w3.org/2000/s t\n    o+='<rect x=\"360\" y=\"248\" width=\"150\" height=\"12\" rx=\"3\" fill=\"var(--faint)\" opacity=\"0.5\"/>';\n    o+=personne(452,222,'var(--econ)');\n    // payment (card + €) to the right\n    o+=arrow(210,196,352,196,'var(--econ)',3);\n    o+='<rect x=\"250\" y=\"176\" width=\"30\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"var(--econ)\" stroke-width=\"2\"/><rect x=\"255\" y=\"182\" width=\"9\" height=\"7\" rx=\"1\" fill=\"var(--econ)\"/>';\n    o+='<text x=\"300\" y=\"170\" text-anchor=\"middle\" font-size=\"14\" font-family=\"var(--font-m)\" fill=\"var(--econ)\">paiement €<\/text>';\n    // goods back\n    o+=arrow(352,262,214,262,'var(--eco)',3);\n    o+='<path d=\"M 292 250 h 26 l -3 16 h -20 z\" fill=\"none\" stroke=\"var(--eco)\" stroke-width=\"2\"/><path d=\"M 298 250 v -4 a 5 5 0 0 1 14 0 v 4\" fill=\"none\" stroke=\"var(--eco)\" stroke-width=\"2\"/>';\n    o+='<text x=\"300\" y=\"290\" text-anchor=\"middle\" font-size=\"13\" font-family=\"var(--font-m)\" fill=\"var(--eco)\">'+(LANG==='fr'?'biens':'goods')+'<\/text>';\n    return o;\n  },\n  // 1 — ville + environnement (la ville n'est qu'un point)\n  function(){\n    var o='';\n    // sky ground\n    o+='<path d=\"M 0 300 Q 150 285 300 300 T 600 300 L 600 400 L 0 400 Z\" fill=\"var(--eco)\" opacity=\"0.10\"/>';\n    // mountains\n    o+='<path d=\"M 40 300 L 150 120 L 250 300 Z\" fill=\"none\" stroke=\"var(--rock)\" stroke-width=\"2\"/>';\n    o+='<path d=\"M 190 300 L 300 160 L 410 300 Z\" fill=\"none\" stroke=\"var(--rock)\" stroke-width=\"2\"/>';\n    o+='<path d=\"M 150 120 L 175 150 L 130 150 Z\" fill=\"var(--rock)\" opacity=\"0.3\"/>';\n    // forest\n    for(var i=0;i<6;i++){var x=440+((i%3)*30), y=250+Math.floor(i/3)*30; o+='<path d=\"M '+x+' '+(y+16)+' L '+(x-11)+' '+(y+16)+' L '+x+' '+y+' L '+(x+11)+' '+(y+16)+' Z\" fill=\"var(--eco)\" opacity=\"0.5\"/><line x1=\"'+x+'\" y1=\"'+(y+16)+'\" x2=\"'+x+'\" y2=\"'+(y+22)+'\" stroke=\"var(--rock)\" stroke-width=\"2\"/>';}\n    // river\n    o+='<path d=\"M 20 360 C 180 330 200 300 360 320 S 560 300 590 340\" fill=\"none\" stroke=\"var(--water)\" stroke-width=\"5\" stroke-linecap=\"round\" opacity=\"0.8\"/>';\n    o+=marker(300,300,LANG==='fr'?'la ville':'the city',12);\n    return o;\n  },\n  // 2 — globe, réseaux commerciaux\n  function(){\n    var o='';\n    o+='<circle cx=\"300\" cy=\"200\" r=\"150\" fill=\"var(--water)\" opacity=\"0.12\" stroke=\"var(--water)\" stroke-width=\"1.6\"/>';\n    // rough continents\n    o+='<path d=\"M 230 110 C 270 100 300 120 290 150 C 280 175 240 175 225 150 C 215 130 210 118 230 110 Z\" fill=\"var(--eco)\" opacity=\"0.5\"/>';\n    o+='<path d=\"M 320 165 C 360 155 385 180 375 215 C 365 250 335 260 315 235 C 300 215 300 178 320 165 Z\" fill=\"var(--eco)\" opacity=\"0.5\"/>';\n    o+='<path d=\"M 200 210 C 225 205 240 230 230 255 C 220 278 195 275 188 250 C 183 232 185 216 200 210 Z\" fill=\"var(--eco)\" opacity=\"0.5\"/>';\n    // meridians\n    o+='<ellipse cx=\"300\" cy=\"200\" rx=\"70\" ry=\"150\" fill=\"none\" stroke=\"var(--water)\" stroke-width=\"1\" opacity=\"0.4\"/><line x1=\"150\" y1=\"200\" x2=\"450\" y2=\"200\" stroke=\"var(--water)\" stroke-width=\"1\" opacity=\"0.4\"/>';\n    // trade arcs\n    var pts=[[250,130],[360,190],[210,235],[350,255],[300,110]];\n    function arc(a,b,c){var mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-55; return '<path d=\"M '+a[0]+' '+a[1]+' Q '+mx+' '+my+' '+b[0]+' '+b[1]+'\" fill=\"none\" stroke=\"'+c+'\" stroke-width=\"1.8\" opacity=\"0.85\"/>';}\n    o+=arc(pts[0],pts[1],'var(--econ)')+arc(pts[2],pts[3],'var(--econ)')+arc(pts[0],pts[2],'var(--gold)')+arc(pts[1],pts[4],'var(--gold)');\n    pts.forEach(function(p){o+='<circle cx=\"'+p[0]+'\" cy=\"'+p[1]+'\" r=\"3.2\" fill=\"var(--econ)\"/>';});\n    o+=marker(250,130,LANG==='fr'?'le pays':'the country',10);\n    return o;\n  },\n  // 5 — système solaire\n  function(){\n    var o='<rect x=\"0\" y=\"0\" width=\"600\" height=\"400\" fill=\"var(--space)\"/>'+stars(70,3);\n    // sun\n    o+='<circle cx=\"120\" cy=\"200\" r=\"34\" fill=\"var(--gold)\"/><circle cx=\"120\" cy=\"200\" r=\"46\" fill=\"none\" stroke=\"var(--gold)\" stroke-width=\"1\" opacity=\"0.4\"/>';\n    var orbits=[80,120,168,220,275,330,380,430];\n    var planets=[[80,5,'var(--spaceink)'],[120,6,'var(--gold)'],[168,7,'var(--econ)'],[220,5,'var(--warn)'],[275,12,'var(--rock)'],[330,10,'var(--gold)']];\n    orbits.forEach(function(r){o+='<ellipse cx=\"120\" cy=\"200\" rx=\"'+r+'\" ry=\"'+(r*0.9).toFixed(0)+'\" fill=\"none\" stroke=\"var(--spaceink)\" stroke-width=\"0.8\" opacity=\"0.3\"/>';});\n    var ang=[-0.5,0.4,-0.2,1.1,2.4,-1.6];\n    planets.forEach(function(p,i){var a=ang[i], x=120+p[0]*Math.cos(a), y=200+p[0]*0.9*Math.sin(a);\n      o+='<circle cx=\"'+x.toFixed(0)+'\" cy=\"'+y.toFixed(0)+'\" r=\"'+p[1]+'\" fill=\"'+p[2]+'\"/>';\n      if(i===2){o+='<circle cx=\"'+x.toFixed(0)+'\" cy=\"'+y.toFixed(0)+'\" r=\"'+(p[1]+7)+'\" fill=\"none\" stroke=\"var(--warn)\" stroke-width=\"2\"/><text x=\"'+(x+18)+'\" y=\"'+(y+4)+'\" font-size=\"12\" font-family=\"var(--font-m)\" fill=\"var(--warn)\">'+(LANG==='fr'?'la Terre':'Earth')+'<\/text>';}\n    });\n    o+='<text x=\"120\" y=\"255\" text-anchor=\"middle\" font-size=\"12\" font-family=\"var(--font-m)\" fill=\"var(--gold)\">'+(LANG==='fr'?'Soleil':'Sun')+'<\/text>';\n    return o;\n  },\n  // 6 — voie lactée\n  function(){\n    var o='<rect x=\"0\" y=\"0\" width=\"600\" height=\"400\" fill=\"var(--space)\"/>'+stars(120,9);\n    // galaxy spiral\n    o+='<g transform=\"translate(300,200)\">';\n    o+='<ellipse cx=\"0\" cy=\"0\" rx=\"40\" ry=\"30\" fill=\"var(--gold)\" opacity=\"0.35\"/><ellipse cx=\"0\" cy=\"0\" rx=\"20\" ry=\"15\" fill=\"var(--gold)\" opacity=\"0.6\"/>';\n    var R=rng(21);\n    for(var arm=0;arm<3;arm++){\n      var off=arm*(2*Math.PI/3);\n      for(var t=0;t<80;t++){\n        var ang=off+t*0.16, rad=18+t*2.5;\n        var x=rad*Math.cos(ang), y=rad*0.62*Math.sin(ang);\n        var rr=(0.5+R()*1.6).toFixed(1);\n        o+='<circle cx=\"'+x.toFixed(1)+'\" cy=\"'+y.toFixed(1)+'\" r=\"'+rr+'\" fill=\"var(--spaceink)\" opacity=\"'+(0.3+R()*0.5).toFixed(2)+'\"/>';\n      }\n    }\n    o+='<\/g>';\n    // sun marker on an outer arm\n    var mx=300+150*Math.cos(0.16*58), my=200+150*0.62*Math.sin(0.16*58);\n    o+=marker(mx,my,LANG==='fr'?'le Soleil — nous sommes ici':'the Sun — we are here',10);\n    return o;\n  }\n  ];\n\n  var idx=0, playing=false, timer=null;\n  function draw(dir){\n    var lv=STR[LANG].levels[idx];\n    var cls='scene '+(dir<0?'zin':'zout');\n    stage.innerHTML='<g class=\"'+cls+'\">'+scenes[idx]()+'<\/g>';\n    document.getElementById('capT').textContent=lv.t;\n    document.getElementById('capB').innerHTML=lv.b;\n    document.getElementById('scaleLbl').textContent=STR[LANG].scale+lv.s;\n    document.getElementById('lnum').textContent=(idx+1)+' / 5';\n    document.getElementById('rng').value=idx;\n    document.querySelectorAll('.dot').forEach(function(d,k){d.classList.toggle('on',k===idx);});\n    document.getElementById('prev').disabled=(idx===0);\n    document.getElementById('next').disabled=(idx===4);\n    // thesis emphasis at the last two levels\n    var th=document.getElementById('thesis'), hot=(idx>=3);\n    th.classList.toggle('hot',hot);\n    th.innerHTML = hot? STR[LANG].thesisHot : STR[LANG].thesis;\n  }\n  function go(i,dir){ idx=Math.max(0,Math.min(4,i)); draw(dir); }\n  function stop(){ playing=false; if(timer){clearInterval(timer);timer=null;} syncPlay(); }\n  function play(){ if(idx>=4) go(0,-1); playing=true; syncPlay();\n    timer=setInterval(function(){ if(idx>=4){ stop(); return; } go(idx+1,1); },1900);\n  }\n  function syncPlay(){ var b=document.getElementById('play'), d=STR[LANG]; b.textContent = playing? d.pause : (idx>=4? d.replay : d.play); }\n\n  document.getElementById('next').addEventListener('click',function(){ stop(); go(idx+1,1); });\n  document.getElementById('prev').addEventListener('click',function(){ stop(); go(idx-1,-1); });\n  document.getElementById('play').addEventListener('click',function(){ playing?stop():play(); });\n  document.getElementById('rng').addEventListener('input',function(){ stop(); var v=parseInt(this.value,10); go(v, v<idx?-1:1); });\n  document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight'){stop();go(idx+1,1);} else if(e.key==='ArrowLeft'){stop();go(idx-1,-1);} });\n\n  (function(){var d=document.getElementById('dots'); for(var k=0;k<5;k++){(function(k){var b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','niveau '+(k+1));b.addEventListener('click',function(){stop();go(k,k<idx?-1:1);});d.appendChild(b);})(k);} })();\n\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme');if(a)return a;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}\n  document.getElementById('theme').addEventListener('click',function(){document.documentElement.setAttribute('data-theme',effTheme()==='dark'?'light':'dark');try{localStorage.setItem('enc_theme',effTheme());}catch(e){}draw(0);});\n  try{var stt=localStorage.getItem('enc_theme');if(stt)document.documentElement.setAttribute('data-theme',stt);}catch(e){}\n  function applyLang(){var d=STR[LANG];document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');if(d[k]!=null&&k!=='thesis')el.innerHTML=d[k];});\n    document.getElementById('langlbl').textContent=LANG.toUpperCase(); syncPlay(); draw(0);}\n  document.getElementById('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem('enc_lang',LANG);}catch(e){}applyLang();});\n\n  applyLang();\n})();\n<\/script>\n\n<\/body>\n<\/html>", "circuit-monetaire.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Le circuit monétaire<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EEF1F5;\n    --surface:#FCFCFD;\n    --panel:#F5F8FC;\n    --ink:#161E28;\n    --muted:#586474;\n    --faint:#8592A2;\n    --line:#DCE2EA;\n    --rim:#AEB8C6;\n    --fin:#2B5CB8;\n    --prod:#B0631C;\n    --dep:#7A44BD;\n    --eco:#2E8B57;\n    --fin-soft:rgba(43,92,184,.10);\n    --prod-soft:rgba(176,99,28,.10);\n    --dep-soft:rgba(122,68,189,.10);\n    --shadow:0 1px 2px rgba(22,30,40,.05),0 10px 28px rgba(22,30,40,.07);\n    --font-d:\"Spectral\",Georgia,serif;\n    --font-b:\"IBM Plex Sans\",system-ui,sans-serif;\n    --font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n  }\n  :root:not([data-theme=\"light\"]){\n    @media (prefers-color-scheme:dark){\n      --bg:#0D1117;--surface:#161B22;--panel:#11161D;\n      --ink:#E7ECF3;--muted:#93A0B0;--faint:#6D7A8A;\n      --line:#28303B;--rim:#3A4552;\n      --fin:#5E86D6;--prod:#C17B2A;--dep:#9A72D2;--eco:#3FA76B;\n      --fin-soft:rgba(94,134,214,.15);--prod-soft:rgba(193,123,42,.15);--dep-soft:rgba(154,114,210,.15);\n      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n    }\n  }\n  :root[data-theme=\"dark\"]{\n    --bg:#0D1117;--surface:#161B22;--panel:#11161D;\n    --ink:#E7ECF3;--muted:#93A0B0;--faint:#6D7A8A;\n    --line:#28303B;--rim:#3A4552;\n    --fin:#5E86D6;--prod:#C17B2A;--dep:#9A72D2;--eco:#3FA76B;\n    --fin-soft:rgba(94,134,214,.15);--prod-soft:rgba(193,123,42,.15);--dep-soft:rgba(154,114,210,.15);\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }\n\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}\n  .wrap{max-width:1140px;margin:0 auto;padding-block:26px 40px;padding-inline:20px;}\n\n  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}\n  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fin);font-weight:500;margin:0 0 6px;}\n  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.6vw,42px);line-height:1.03;margin:0;letter-spacing:-.01em;text-wrap:balance;}\n  .sub{color:var(--muted);font-size:15px;margin:8px 0 0;max-width:66ch;text-wrap:pretty;}\n  .toggles{display:flex;gap:8px;flex-shrink:0;}\n  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}\n  .tg:hover{color:var(--ink);border-color:var(--faint);}\n  .tg b{color:var(--ink);font-weight:600;}\n  .tg:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--fin);outline-offset:2px;}\n\n  .stage{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin-top:24px;align-items:stretch;}\n  @media (max-width:860px){.stage{grid-template-columns:1fr;}}\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}\n\n  .wheelcard{padding:8px 10px 4px;display:flex;flex-direction:column;}\n  svg.wheel{display:block;width:100%;height:auto;max-width:100%;}\n  svg.wheel text{font-family:var(--font-d);fill:var(--ink);}\n  .rim{fill:none;stroke:var(--rim);stroke-width:1.6;}\n  .axis{stroke:var(--faint);stroke-width:1;stroke-dasharray:1 5;stroke-linecap:round;opacity:.8;}\n  .pole-dot{fill:var(--surface);stroke:var(--ink);stroke-width:1.6;}\n  .pole-lbl{font-style:italic;font-weight:600;font-size:19px;fill:var(--ink);}\n  .agents{font-style:italic;font-size:15px;fill:var(--muted);text-anchor:middle;}\n  .flabel{font-style:italic;font-size:16px;font-weight:500;}\n  .flabel.fin{fill:var(--fin);} .flabel.prod{fill:var(--prod);} .flabel.dep{fill:var(--dep);}\n  .arc{fill:none;stroke-width:3.4;stroke-linecap:round;}\n  .arc.fin{stroke:var(--fin);} .arc.prod{stroke:var(--prod);} .arc.dep{stroke:var(--dep);}\n  .tooth{stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;}\n  .tooth.fin{stroke:var(--fin);} .tooth.prod{stroke:var(--prod);} .tooth.dep{stroke:var(--dep);}\n  .tip{stroke:var(--surface);stroke-width:1.5;}\n  .loop{fill:none;stroke:var(--prod);stroke-width:3.2;stroke-linecap:round;}\n\n  /* panel */\n  .panel{padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-height:100%;}\n  .p-head{display:flex;align-items:center;gap:12px;}\n  .p-num{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--font-m);font-weight:500;font-size:17px;color:#fff;flex-shrink:0;}\n  .p-title{font-family:var(--font-d);font-weight:600;font-size:20px;line-height:1.12;margin:0;text-wrap:balance;}\n  .p-body{color:var(--muted);font-size:14.5px;margin:0;text-wrap:pretty;}\n  .p-body b{color:var(--ink);font-weight:600;}\n  .chips{display:flex;flex-direction:column;gap:8px;margin-top:2px;}\n  .chip{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);}\n  .chip .sym{font-family:var(--font-d);font-style:italic;font-weight:600;font-size:16px;min-width:34px;}\n  .chip .txt{font-size:13px;color:var(--muted);}\n  .chip .txt b{color:var(--ink);font-weight:600;}\n  .chip.fin .sym{color:var(--fin);} .chip.prod .sym{color:var(--prod);} .chip.dep .sym{color:var(--dep);}\n  .note{font-size:12.5px;color:var(--faint);font-family:var(--font-m);margin-top:auto;padding-top:6px;}\n\n  /* scale */\n  .scalewrap{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 22px 20px;}\n  .scale-top{display:flex;align-items:center;gap:14px;margin-bottom:6px;}\n  .navbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;flex-shrink:0;}\n  .navbtn:hover{border-color:var(--faint);} .navbtn:disabled{opacity:.35;cursor:default;}\n  .navbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}\n  .play{width:36px;height:36px;border-radius:9px;border:none;background:var(--fin);color:#fff;cursor:pointer;display:grid;place-items:center;flex-shrink:0;}\n  .play svg{width:15px;height:15px;fill:#fff;}\n  .track{flex:1;position:relative;display:flex;flex-direction:column;}\n  .rangerow{position:relative;height:26px;display:flex;align-items:center;}\n  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:var(--line);outline-offset:6px;position:relative;z-index:2;}\n  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--surface);border:2.5px solid var(--fin);cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.22);}\n  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:2.5px solid var(--fin);cursor:grab;}\n  .ticks{display:flex;justify-content:space-between;margin-top:10px;}\n  .tk{flex:1;text-align:center;cursor:pointer;position:relative;padding-top:2px;}\n  .tk:first-child{text-align:left;} .tk:last-child{text-align:right;}\n  .tk .n{font-family:var(--font-m);font-size:12px;color:var(--faint);display:block;}\n  .tk .l{font-size:12.5px;color:var(--muted);display:block;margin-top:1px;line-height:1.15;}\n  .tk.active .n{color:#fff;background:var(--acc,var(--fin));border-radius:20px;padding:1px 8px;}\n  .tk.active .l{color:var(--ink);font-weight:600;}\n  .tk:hover .l{color:var(--ink);}\n\n  footer{margin-top:22px;color:var(--faint);font-size:12px;text-align:center;text-wrap:balance;}\n  footer i{font-family:var(--font-d);font-style:italic;}\n<\/style>\n\n<div class=\"wrap\">\n  <header>\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\">Le modèle de l'engrenage · roue supérieure<\/p>\n      <h1 data-t=\"title\">Le circuit monétaire<\/h1>\n      <p class=\"sub\" data-t=\"sub\">La roue supérieure de l'engrenage : le circuit keynésien de la monnaie, qui met la machine économique en mouvement. Fais glisser l'échelle pour dérouler les 4 phases. La roue écologique inférieure viendra ensuite.<\/p>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"stage\">\n    <div class=\"card wheelcard\">\n      <svg class=\"wheel\" id=\"wheel\" viewBox=\"0 0 440 430\" role=\"img\" aria-label=\"Roue du circuit monétaire à trois pôles : Financement, Production, Dépense\">\n        <g id=\"g-axes\"><\/g>\n        <circle class=\"rim\" cx=\"220\" cy=\"205\" r=\"150\"><\/circle>\n        <g id=\"g-arcs\"><\/g>\n        <g id=\"g-teeth\"><\/g>\n        <g id=\"g-loop\"><\/g>\n        <g id=\"g-tip\"><\/g>\n        <g id=\"g-poles\"><\/g>\n        <g id=\"g-flabels\"><\/g>\n      <\/svg>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"panel\">\n        <div class=\"p-head\">\n          <div class=\"p-num\" id=\"p-num\">1<\/div>\n          <h2 class=\"p-title\" id=\"p-title\">—<\/h2>\n        <\/div>\n        <p class=\"p-body\" id=\"p-body\">—<\/p>\n        <div class=\"chips\" id=\"p-chips\"><\/div>\n        <div class=\"note\" id=\"p-note\"><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"scalewrap\">\n    <div class=\"scale-top\">\n      <button class=\"play\" id=\"play\" aria-label=\"Dérouler les phases\">\n        <svg id=\"ico-play\" viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg>\n        <svg id=\"ico-pause\" viewBox=\"0 0 24 24\" hidden><path d=\"M6 5h4v14H6zM14 5h4v14h-4z\"/><\/svg>\n      <\/button>\n      <button class=\"navbtn\" id=\"prev\" aria-label=\"Phase précédente\"><svg viewBox=\"0 0 24 24\"><polyline points=\"15 6 9 12 15 18\"><\/polyline><\/svg><\/button>\n      <div class=\"track\">\n        <div class=\"rangerow\"><input type=\"range\" id=\"scale\" min=\"1\" max=\"4\" step=\"0.02\" value=\"4\" aria-label=\"Phase du circuit\"><\/div>\n      <\/div>\n      <button class=\"navbtn\" id=\"next\" aria-label=\"Phase suivante\"><svg viewBox=\"0 0 24 24\"><polyline points=\"9 6 15 12 9 18\"><\/polyline><\/svg><\/button>\n    <\/div>\n    <div class=\"ticks\" id=\"ticks\"><\/div>\n  <\/div>\n\n  <footer>\n    <span data-t=\"foot\">Sens de rotation horaire : <i>F → P → D → F<\/i>. Chaque pôle est une « valve » ; au niveau macroéconomique, la somme des flux entrants égale la somme des flux sortants.<\/span>\n  <\/footer>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  var SVGNS=\"http://www.w3.org/2000/svg\";\n  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var cx=220, cy=205, R=150;\n  var LANG='fr';\n  try{var sl=localStorage.getItem('circuit_lang'); if(sl) LANG=sl;}catch(e){}\n\n  // ---------- geometry ----------\n  function pt(aDeg, rr){ var a=aDeg*Math.PI/180; return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)]; }\n  // clockwise on screen = increasing angle. Poles: F=270(top), P=0/360(right), D=180(left)\n  var SEGS=[\n    {key:'fin',  a0:270, a1:360, cls:'fin'},   // F -> P  (top-right)\n    {key:'prod', a0:360, a1:540, cls:'prod'},  // P -> D  (bottom half)\n    {key:'dep',  a0:540, a1:630, cls:'dep'}    // D -> F  (top-left)\n  ];\n\n  // ---------- i18n ----------\n  var STR={\n    fr:{\n      eyebrow:\"Le modèle de l'engrenage · roue supérieure\",\n      title:\"Le circuit monétaire\",\n      sub:\"La roue supérieure de l'engrenage : le circuit keynésien de la monnaie, qui met la machine économique en mouvement. Fais glisser l'échelle pour dérouler les 4 phases. La roue écologique inférieure viendra ensuite.\",\n      foot:\"Sens de rotation horaire : F → P → D → F. Chaque pôle est une « valve » ; au niveau macroéconomique, la somme des flux entrants égale la somme des flux sortants.\",\n      poles:{F:\"Financement\",P:\"Production\",D:\"Dépense finale\"},\n      ticks:[\"Les pôles\",\"Financement\",\"Production\",\"Dépense & épargne\"],\n      phases:[\n        {t:\"Les trois pôles (les valves)\",\n         b:\"La roue porte <b>trois pôles<\/b> — <b>F<\/b> (financement), <b>P<\/b> (production), <b>D<\/b> (dépense finale) — pilotés par les agents. Chaque pôle agit comme une <b>valve<\/b> : un flux entrant est une ressource, un flux sortant un emploi.\",\n         chips:[[\"fin\",\"F\",\"<b>Financement<\/b> — le carrefour financier\"],[\"prod\",\"P\",\"<b>Production<\/b> — le secteur productif\"],[\"dep\",\"D\",\"<b>Dépense finale<\/b> — surtout les ménages\"]],\n         note:\"Σ flux entrants = Σ flux sortants\"},\n        {t:\"Le financement (F → P)\",\n         b:\"La circulation démarre au carrefour financier <b>F<\/b>, qui met la machine en mouvement. Le flux de financement <b>f<\/b> s'ouvre par deux valves, accompagné d'une rétroaction négative (remboursements d'emprunts, dividendes).\",\n         chips:[[\"fin\",\"f\",\"<b>Épargne<\/b> levée sur les marchés financiers (titres)\"],[\"fin\",\"f\",\"<b>Création monétaire<\/b> — crédit bancaire aux entreprises\"]],\n         note:\"F → P  ·  flux positif + rétroaction (remboursements, dividendes)\"},\n        {t:\"La production et les revenus (P → D)\",\n         b:\"Le secteur productif <b>P<\/b> verse les <b>revenus<\/b> aux ménages : salaires (w) + profits (p). C'est la contrepartie monétaire de la production — le revenu qui, à l'étape suivante, alimentera la dépense.\",\n         chips:[[\"prod\",\"y = w+p\",\"<b>Revenu<\/b> versé aux ménages — salaires (w) + profits (p)\"]],\n         note:\"P → D  ·  la roue transmet le mouvement à la dépense\"},\n        {t:\"La dépense et l'épargne (D → F)\",\n         b:\"La <b>dépense<\/b> referme le circuit. Les ménages partagent leur revenu — <b>consommation c<\/b> vers la production P (rétroaction négative) et <b>épargne s<\/b> vers le secteur financier F — tandis que les entreprises <b>dépensent entre elles<\/b> : biens intermédiaires (u) + biens de capital / investissement (i). Toute cette dépense ravitaille P — la roue tourne.\",\n         chips:[[\"dep\",\"c\",\"<b>Consommation<\/b> → revient à P\"],[\"dep\",\"s\",\"<b>Épargne<\/b> → reflue vers F (dépôts, titres)\"],[\"prod\",\"u+i\",\"<b>Dépense des entreprises<\/b> — biens intermédiaires (u) + investissement (i)\"]],\n         note:\"D → F  ·  circuit bouclé  ·  la dépense = c + (u+i)\"}\n      ]\n    },\n    en:{\n      eyebrow:\"The Gear Model · upper wheel\",\n      title:\"The Monetary Wheel\",\n      sub:\"The upper wheel of the gear: the Keynesian monetary circuit that sets the economic machine in motion. Drag the scale to unfold the 4 phases. The lower ecological wheel comes next.\",\n      foot:\"Clockwise rotation: F → P → D → F. Each pole is a “valve”; at the macro level, the sum of inflows equals the sum of outflows.\",\n      poles:{F:\"Financing\",P:\"Production\",D:\"Final expenditure\"},\n      ticks:[\"The poles\",\"Financing\",\"Production\",\"Spending & saving\"],\n      phases:[\n        {t:\"The three poles (the valves)\",\n         b:\"The wheel carries <b>three poles<\/b> — <b>F<\/b> (financing), <b>P<\/b> (production), <b>D<\/b> (final expenditure) — steered by agents. Each pole acts as a <b>valve<\/b>: an inflow is a resource, an outflow a use.\",\n         chips:[[\"fin\",\"F\",\"<b>Financing<\/b> — the financial hub\"],[\"prod\",\"P\",\"<b>Production<\/b> — the productive sector\"],[\"dep\",\"D\",\"<b>Final expenditure<\/b> — mainly households\"]],\n         note:\"Σ inflows = Σ outflows\"},\n        {t:\"Financing (F → P)\",\n         b:\"Circulation starts at the financial hub <b>F<\/b>, which sets the machine in motion. The financing flow <b>f<\/b> opens through two valves, with a negative feedback (loan repayments, dividends).\",\n         chips:[[\"fin\",\"f\",\"<b>Savings<\/b> raised on financial markets (securities)\"],[\"fin\",\"f\",\"<b>Money creation<\/b> — bank lending to firms\"]],\n         note:\"F → P  ·  positive flow + feedback (repayments, dividends)\"},\n        {t:\"Production and income (P → D)\",\n         b:\"The productive sector <b>P<\/b> pays <b>income<\/b> to households: wages (w) + profits (p). This is the monetary counterpart of production — the income that will feed spending at the next step.\",\n         chips:[[\"prod\",\"y = w+p\",\"<b>Income<\/b> paid to households — wages (w) + profits (p)\"]],\n         note:\"P → D  ·  the wheel transmits motion to spending\"},\n        {t:\"Spending and saving (D → F)\",\n         b:\"<b>Spending<\/b> closes the circuit. Households split their income — <b>consumption c<\/b> to production P (negative feedback) and <b>savings s<\/b> to the financial sector F — while firms <b>spend on one another<\/b>: intermediate goods (u) + capital goods / investment (i). All this spending feeds P — the wheel turns.\",\n         chips:[[\"dep\",\"c\",\"<b>Consumption<\/b> → back to P\"],[\"dep\",\"s\",\"<b>Savings<\/b> → back to F (deposits, securities)\"],[\"prod\",\"u+i\",\"<b>Firms' spending<\/b> — intermediate goods (u) + investment (i)\"]],\n         note:\"D → F  ·  closed circuit  ·  spending = c + (u+i)\"}\n      ]\n    }\n  };\n  var ACC=['var(--fin)','var(--fin)','var(--prod)','var(--dep)']; // per phase accent\n\n  // ---------- build static SVG ----------\n  function mk(tag,attrs){ var e=document.createElementNS(SVGNS,tag); for(var k in attrs) e.setAttribute(k,attrs[k]); return e; }\n\n  // axes (dash-dot style): vertical F->center, horizontal D--P\n  (function(){\n    var g=document.getElementById('g-axes');\n    var F=pt(270,R), P=pt(0,R), D=pt(180,R);\n    g.appendChild(mk('line',{x1:cx,y1:cy,x2:F[0],y2:F[1],class:'axis'}));\n    g.appendChild(mk('line',{x1:D[0],y1:cy,x2:P[0],y2:cy,class:'axis'}));\n  })();\n\n  // arcs\n  var arcEls={};\n  (function(){\n    var g=document.getElementById('g-arcs');\n    SEGS.forEach(function(s){\n      var d='', n=64;\n      for(var i=0;i<=n;i++){ var a=s.a0+(s.a1-s.a0)*i/n; var q=pt(a,R); d+=(i?'L':'M')+q[0].toFixed(2)+' '+q[1].toFixed(2)+' '; }\n      var p=mk('path',{d:d,class:'arc '+s.cls});\n      g.appendChild(p);\n      var L=p.getTotalLength();\n      p.style.strokeDasharray=L; p.style.strokeDashoffset=L;\n      arcEls[s.key]={el:p,L:L};\n    });\n  })();\n\n  // teeth (chevrons pointing clockwise)\n  var teeth=[];\n  (function(){\n    var g=document.getElementById('g-teeth');\n    SEGS.forEach(function(s){\n      var span=s.a1-s.a0, step=12, start=s.a0+6;\n      for(var a=start; a<s.a1-2; a+=step){\n        var c0=pt(a,R);\n        var ta=a*Math.PI/180;\n        var t=[-Math.sin(ta),Math.cos(ta)]; // tangent (clockwise)\n        var nn=[Math.cos(ta),Math.sin(ta)]; // outward normal\n        var L1=6, W=4.2;\n        var apex=[c0[0]+t[0]*L1, c0[1]+t[1]*L1];\n        var wa=[c0[0]+nn[0]*W, c0[1]+nn[1]*W];\n        var wb=[c0[0]-nn[0]*W, c0[1]-nn[1]*W];\n        var pl=mk('polyline',{points:wa[0].toFixed(1)+','+wa[1].toFixed(1)+' '+apex[0].toFixed(1)+','+apex[1].toFixed(1)+' '+wb[0].toFixed(1)+','+wb[1].toFixed(1),class:'tooth '+s.cls});\n        pl.style.opacity=0;\n        g.appendChild(pl);\n        teeth.push({el:pl, seg:s.key, frac:(a-s.a0)/span});\n      }\n    });\n  })();\n\n  // self-loop at P (u+i) — a small wheel of chevrons, like the other flows\n  var loopGroup=document.getElementById('g-loop');\n  (function(){\n    var g=loopGroup;\n    var Pp=pt(0,R);\n    var rl=27, clx=Pp[0]+30, cly=Pp[1];   // loop centred just right of P\n    g.appendChild(mk('circle',{cx:clx,cy:cly,r:rl,fill:'none',stroke:'var(--prod)','stroke-width':1.9,opacity:0.85}));\n    var N=8;\n    for(var k=0;k<N;k++){\n      var a=(k/N)*360, ar=a*Math.PI/180;\n      var c0=[clx+rl*Math.cos(ar), cly+rl*Math.sin(ar)];\n      var t=[-Math.sin(ar),Math.cos(ar)];   // clockwise tangent\n      var nn=[Math.cos(ar),Math.sin(ar)];\n      var L1=5.4, W=3.6;\n      var apex=[c0[0]+t[0]*L1, c0[1]+t[1]*L1];\n      var wa=[c0[0]+nn[0]*W, c0[1]+nn[1]*W];\n      var wb=[c0[0]-nn[0]*W, c0[1]-nn[1]*W];\n      g.appendChild(mk('polyline',{points:wa[0].toFixed(1)+','+wa[1].toFixed(1)+' '+apex[0].toFixed(1)+','+apex[1].toFixed(1)+' '+wb[0].toFixed(1)+','+wb[1].toFixed(1),class:'tooth prod'}));\n    }\n    g.style.opacity=0;\n  })();\n\n  // tip dot\n  var tipEl=mk('circle',{r:5,class:'tip'}); tipEl.style.opacity=0;\n  document.getElementById('g-tip').appendChild(tipEl);\n\n  // poles\n  (function(){\n    var g=document.getElementById('g-poles');\n    var F=pt(270,R),P=pt(0,R),D=pt(180,R);\n    [['F',F,0,-14,'middle'],['P',P,0,-15,'middle'],['D',D,-16,5,'end']].forEach(function(o){\n      g.appendChild(mk('circle',{cx:o[1][0],cy:o[1][1],r:4.5,class:'pole-dot'}));\n      var tx=mk('text',{x:o[1][0]+o[2],y:o[1][1]+o[3],class:'pole-lbl','text-anchor':o[4]}); tx.textContent=o[0];\n      g.appendChild(tx);\n    });\n    var ag=mk('text',{x:cx,y:cy+5,class:'agents'}); ag.textContent='agents'; ag.id='agentsLbl';\n    g.appendChild(ag);\n  })();\n\n  // flow labels\n  var flab={};\n  (function(){\n    var g=document.getElementById('g-flabels');\n    function lbl(id,aDeg,rr,cls,anchor){ var q=pt(aDeg,rr); var t=mk('text',{x:q[0],y:q[1],class:'flabel '+cls,'text-anchor':anchor||'middle'}); t.style.opacity=0; g.appendChild(t); flab[id]=t; }\n    lbl('f',318,R+22,'fin');\n    lbl('ui',14,R+42,'prod','middle');\n    lbl('y',95,R+26,'pr en'); }\n  function playAll(){\n    if(playing){ cancelAnimationFrame(raf); playing=false; setPlayIcon(false); return; }\n    playing=true; setPlayIcon(true);\n    if(v>=4) v=1;\n    var t0=performance.now(), start=v, dur=(4-start)*1400;\n    function step(now){\n      if(!playing) return;\n      var k=dur?Math.min(1,(now-t0)/dur):1;\n      update(start+(4-start)*k);\n      if(k<1) raf=requestAnimationFrame(step);\n      else { playing=false; setPlayIcon(false); }\n    }\n    raf=requestAnimationFrame(step);\n  }\n\n  document.getElementById('play').addEventListener('click',playAll);\n  document.getElementById('prev').addEventListener('click',function(){ animateTo(Math.max(1,Math.ceil(v-1e-9)-1)); });\n  document.getElementById('next').addEventListener('click',function(){ animateTo(Math.min(4,Math.floor(v+1e-9)+1)); });\n  scale.addEventListener('input',function(){\n    cancelAnimationFrame(raf); playing=false; setPlayIcon(false);\n    update(parseFloat(scale.value));\n  });\n\n  // ---------- toggles ----------\n  function effTheme(){ var a=document.documentElement.getAttribute('data-theme'); if(a) return a; return (window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }\n  document.getElementById('theme').addEventListener('click',function(){\n    document.documentElement.setAttribute('data-theme', effTheme()==='dark'?'light':'dark');\n    try{localStorage.setItem('circuit_theme',effTheme());}catch(e){}\n  });\n  try{var stt=localStorage.getItem('circuit_theme'); if(stt) document.documentElement.setAttribute('data-theme',stt);}catch(e){}\n\n  function applyLang(){\n    var d=STR[LANG];\n    document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){ var k=el.getAttribute('data-t'); if(d[k]) el.innerHTML=d[k]; });\n    document.getElementById('langlbl').textContent=LANG.toUpperCase();\n    // rebuild ticks with language\n    var box=document.getElementById('ticks'); box.innerHTML='';\n    for(var k=0;k<4;k++){ (function(k){\n      var tk=document.createElement('div'); tk.className='tk';\n      tk.innerHTML='<span class=\"n\">'+(k+1)+'<\/span><span class=\"l\">'+d.ticks[k]+'<\/span>';\n      tk.addEventListener('click',function(){ animateTo(k+1); });\n      box.appendChild(tk);\n    })(k); }\n    updatePanel();\n  }\n  document.getElementById('lang').addEventListener('click',function(){\n    LANG=LANG==='fr'?'en':'fr';\n    try{localStorage.setItem('circuit_lang',LANG);}catch(e){}\n    applyLang();\n  });\n\n  // ---------- boot ----------\n  applyLang();\n  update(1); // start at the first phase (1/4)\n})();\n<\/script>\n\n<\/body>\n<\/html>", "roue-energetique.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>La roue énergétique<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EDF1ED;--surface:#FCFDFC;--panel:#F4F8F4;\n    --ink:#15201A;--muted:#586359;--faint:#83907F;--line:#DBE3DB;--rim:#AEBBAE;\n    --eco:#2E8B57;--fin:#3F6BC0;--prod:#B0631C;--diss:#6E6760;--warn:#C0392B;\n    --eco-soft:rgba(46,139,87,.10);--prod-soft:rgba(176,99,28,.10);--diss-soft:rgba(110,103,96,.10);--warn-soft:rgba(192,57,43,.10);\n    --shadow:0 1px 2px rgba(21,32,26,.05),0 10px 28px rgba(21,32,26,.07);\n    --font-d:\"Spectral\",Georgia,serif;--font-b:\"IBM Plex Sans\",system-ui,sans-s gap:14px;min-height:100%;}\n  .p-head{display:flex;align-items:center;gap:12px;}\n  .p-num{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--font-m);font-weight:500;font-size:17px;color:#fff;flex-shrink:0;}\n  .p-title{font-family:var(--font-d);font-weight:600;font-size:20px;line-height:1.12;margin:0;text-wrap:balance;}\n  .p-body{color:var(--muted);font-size:14.5px;margin:0;text-wrap:pretty;}\n  .p-body b{color:var(--ink);font-weight:600;}\n  .chips{display:flex;flex-direction:column;gap:8px;margin-top:2px;}\n  .chip{display:grid;grid-template-columns:26px 1fr;gap:11px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);}\n  .chip .sym{font-size:17px;text-align:center;line-height:1;}\n  .chip .txt{font-size:13px;color:var(--muted);} .chip .txt b{color:var(--ink);font-weight:600;}\n  .chip.eco .sym{color:var(--eco);} .chip.prod .sym{color:var(--prod);} .chip.diss .sym{color:var(--diss);} .chip.warn .sym{color:var(--warn);}\n  .note{font-size:12.5px;color:var(--faint);font-family:var(--font-m);margin-top:auto;padding-top:6px;}\n\n  .scalewrap{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 22px 20px;}\n  .scale-top{display:flex;align-items:center;gap:14px;margin-bottom:6px;}\n  .navbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;flex-shrink:0;}\n  .navbtn:hover{border-color:var(--faint);} .navbtn:disabled{opacity:.35;cursor:default;}\n  .navbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}\n  .play{width:36px;height:36px;border-radius:9px;border:none;background:var(--eco);color:#fff;cursor:pointer;display:grid;place-items:center;flex-shrink:0;}\n  .play svg{width:15px;height:15px;fill:#fff;}\n  .track{flex:1;display:flex;flex-direction:column;}\n  .rangerow{position:relative;height:26px;display:flex;align-items:center;}\n  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:var(--line);outline-offset:6px;}\n  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--surface);border:2.5px solid var(--eco);cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.22);}\n  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:2.5px solid var(--eco);cursor:grab;}\n  .ticks{display:flex;justify-content:space-between;margin-top:10px;}\n  .tk{flex:1;text-align:center;cursor:pointer;padding-top:2px;}\n  .tk:first-child{text-align:left;} .tk:last-child{text-align:right;}\n  .tk .n{font-family:var(--font-m);font-size:12px;color:var(--faint);display:block;}\n  .tk .l{font-size:12.5px;color:var(--muted);display:block;margin-top:1px;line-height:1.15;}\n  .tk.active .n{color:#fff;background:var(--acc,var(--eco));border-radius:20px;padding:1px 8px;}\n  .tk.active .l{color:var(--ink);font-weight:600;} .tk:hover .l{color:var(--ink);}\n  footer{margin-top:22px;color:var(--faint);font-size:12px;text-align:center;text-wrap:balance;}\n  footer i{font-family:var(--font-d);font-style:italic;}\n<\/style>\n\n<div class=\"wrap\">\n  <header>\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\">Le modèle de l'engrenage · roue inférieure<\/p>\n      <h1 data-t=\"title\">La roue énergétique<\/h1>\n      <p class=\"sub\" data-t=\"sub\">Aux flux monétaires répondent des flux réels de matière et d'énergie, en sens inverse. La roue monétaire entraîne, par un engrenage, une seconde roue reliée à l'écosystème. Fais glisser l'échelle pour dérouler les 4 phases.<\/p>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"stage\">\n    <div class=\"card wheelcard\">\n      <svg class=\"wheel\" id=\"wheel\" viewBox=\"0 0 470 600\" role=\"img\" aria-label=\"Deux roues couplées : la roue monétaire entraîne la roue énergétique reliée à l'écosystème\">\n        <defs>\n          <marker id=\"ahIn\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\"><path d=\"M1 1 L7 4 L1 7 Z\" fill=\"var(--prod)\"><\/path><\/marker>\n          <marker id=\"ahOut\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\"><path d=\"M1 1 L7 4 L1 7 Z\" fill=\"var(--diss)\"><\/path><\/marker>\n          <marker id=\"ahRec\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M1 1 L6 3.5 L1 6 Z\" fill=\"var(--eco)\"><\/path><\/marker>\n          <marker id=\"ahCf\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\"><path d=\"M1 1 L7 4 L1 7 Z\" fill=\"var(--warn)\"><\/path><\/marker>\n          <clipPath id=\"clipE\"><rect id=\"rectE\" x=\"22\" y=\"238\" width=\"168\" height=\"0\"><\/rect><\/clipPath>\n          <clipPath id=\"clipM\"><rect id=\"rectM\" x=\"286\" y=\"580\" width=\"186\" height=\"0\"><\/rect><\/clipPath>\n        <\/defs>\n        <g id=\"g-mon\"><\/g>\n        <g id=\"g-energy\"><\/g>\n        <g id=\"g-mesh\"><\/g>\n        <g id=\"g-eflow\" clip-path=\"url(#clipE)\"><\/g>\n        <g id=\"g-mflow\" clip-path=\"url(#clipM)\"><\/g>\n        <g id=\"g-couple\"><\/g>\n        <g id=\"g-names\"><\/g>\n      <\/svg>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"panel\">\n        <div class=\"p-head\"><div class=\"p-num\" id=\"p-num\">1<\/div><h2 class=\"p-title\" id=\"p-title\">—<\/h2><\/div>\n        <p class=\"p-body\" id=\"p-body\">—<\/p>\n        <div class=\"chips\" id=\"p-chips\"><\/div>\n        <div class=\"note\" id=\"p-note\"><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"scalewrap\">\n    <div class=\"scale-top\">\n      <button class=\"play\" id=\"play\" aria-label=\"Dérouler les phases\">\n        <svg id=\"ico-play\" viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg>\n        <svg id=\"ico-pause\" viewBox=\"0 0 24 24\" hidden><path d=\"M6 5h4v14H6zM14 5h4v14h-4z\"/><\/svg>\n      <\/button>\n      <button class=\"navbtn\" id=\"prev\" aria-label=\"Phase précédente\"><svg viewBox=\"0 0 24 24\"><polyline points=\"15 6 9 12 15 18\"><\/polyline><\/svg><\/button>\n      <div class=\"track\"><div class=\"rangerow\"><input type=\"range\" id=\"scale\" min=\"1\" max=\"4\" step=\"0.02\" value=\"4\" aria-label=\"Phase\"><\/div><\/div>\n      <button class=\"navbtn\" id=\"next\" aria-label=\"Phase suivante\"><svg viewBox=\"0 0 24 24\"><polyline points=\"9 6 15 12 9 18\"><\/polyline><\/svg><\/button>\n    <\/div>\n    <div class=\"ticks\" id=\"ticks\"><\/div>\n  <\/div>\n\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  var SVGNS=\"http://www.w3.org/2000/svg\";\n  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;\n  function mk(t,a){var e=document.createElementNS(SVGNS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}\n\n  // geometry\n  var cxM=235,cyM=150,RM=88;      // monetary wheel (driver, top)\n  var cxE=235,cyE=360,RE=122;     // energy wheel (main, bottom); meshed: cyE-cyM=RM+RE=210\n  var MESH=[235,238];\n\n  var LANG='fr'; try{var s=localStorage.getItem('eco_lang');if(s)LANG=s;}catch(e){}\n\n  var STR={\n    fr:{\n      eyebrow:\"Le modèle de l'engrenage · roue inférieure\",\n      title:\"La roue énergétique\",\n      sub:\"Aux flux monétaires répondent des flux réels de matière et d'énergie, en sens inverse. La roue monétaire entraîne, par un engrenage, une seconde roue reliée à l'écosystème. Fais glisser l'échelle pour dérouler les 4 phases.\",\n      foot:\"On ne peut pas accélérer la roue monétaire sans accélérer la roue énergétique : à faible entropie en entrée (énergie, ressources) répond une entropie élevée en sortie (chaleur, déchets).\",\n      nameM:\"roue monétaire\", nameE:\"roue énergétique\",\n      energyIn:[\"Énergie fossile\",\"+ renouvelable\"], entropy:[\"Entropie\",\"chaleur dégradée\"],\n      matterIn:[\"Ressources\",\"matérielles (limitées)\"], waste:[\"Déchets\"], recyc:[\"recyclage\"],\n      cf:\"force en retour\",\n      ticks:[\"L'engrenage\",\"L'énergie\",\"La matière\",\"Couplage & limites\"],\n      phases:[\n        {t:\"L'engrenage\",\n         b:\"L'ouverture de la valve <b>F<\/b> met la roue monétaire en mouvement. Par un <b>engrenage<\/b>, elle entraîne une seconde roue reliée à l'écosystème — la <b>roue énergétique<\/b> — qui tourne en <b>sens inverse<\/b>. Aux flux monétaires répondent des flux réels de matière et d'énergie.\",\n         chips:[[\"eco\",\"↺\",\"<b>Roue énergétique<\/b> — tourne à l'inverse de la roue monétaire\"],[\"warn\",\"⚙\",\"<b>Engrenage<\/b> : impossible d'accélérer l'une sans l'autre\"]],\n         note:\"flux réels ↔ flux monétaires · sens opposés\"},\n        {t:\"L'énergie\",\n         b:\"L'entrée de monnaie dans le système productif provoque une <b>« chute d'énergie »<\/b> : l'énergie (<b>fossile + renouvelable<\/b>) traverse l'économie et transforme la matière par le travail des humains et des machines, avant d'être libérée en bas sous forme de <b>chaleur irrécupérable<\/b>.\",\n         chips:[[\"prod\",\"↓\",\"<b>Énergie<\/b> fossile + renouvelable — l'entrée (faible entropie)\"],[\"diss\",\"≈\",\"<b>Entropie<\/b> — chaleur dégradée, irrécupérable (sortie)\"]],\n         note:\"énergie utile (entrée) → entropie (sortie)\"},\n        {t:\"La matière\",\n         b:\"Couplée à l'énergie, l'<b>extraction de ressources matérielles<\/b> (limitées) alimente la roue ; après usage, la matière retourne à l'environnement sous forme de <b>déchets<\/b>, ou est en partie <b>recyclée<\/b>.\",\n         chips:[[\"prod\",\"↑\",\"<b>Ressources matérielles<\/b> limitées — l'entrée\"],[\"diss\",\"♻\",\"<b>Déchets · recyclage<\/b> — la sortie\"]],\n         note:\"ressources (entrée) → déchets / recyclage (sortie)\"},\n        {t:\"Le couplage et les limites\",\n         b:\"On ne peut pas accélérer la roue monétaire (croissance du PIB) sans accélérer la roue énergétique — au risque de <b>dépasser les frontières planétaires<\/b>. Et quand les ressources se raréfient, la roue énergétique ralentit. Comme les deux roues sont <b>couplées<\/b> et tournent ensemble, ce ralentissement gagne aussi la roue monétaire : c'est une <b>force en retour<\/b> qui la freine. Économiquement, ce coup de frein se traduit par un ralentissement de la croissance — jusqu'à la <b>récession<\/b>, voire une <b>décroissance subie<\/b>.\",\n         chips:[[\"warn\",\"⇧\",\"<b>Force en retour<\/b> : la rareté freine la roue monétaire\"],[\"eco\",\"◎\",\"Plus de PIB ⇒ roue plus rapide ⇒ pression sur les limites\"]],\n         note:\"PIB ↑ ⇒ débit physique ↑ ⇒ frontières planétaires\"}\n      ]\n    },\n    en:{\n      eyebrow:\"The Gear Model · lower wheel\",\n      title:\"The Energy Wheel\",\n      sub:\"Monetary flows are mirrored by real flows of matter and energy, running the opposite way. The monetary wheel drives, through a gear, a second wheel tied to the ecosystem. Drag the scale to unfold the 4 phases.\",\n      foot:\"You cannot speed up the monetary wheel without speeding up the energy wheel: low-entropy inputs (energy, resources) come back as high-entropy outputs (heat, waste).\",\n      nameM:\"monetary wheel\", nameE:\"energy wheel\",\n      energyIn:[\"Fossil energy\",\"+ renewable\"], entropy:[\"Entropy\",\"degraded heat\"],\n      matterIn:[\"Material\",\"resources (limited)\"], waste:[\"Waste\"], recyc:[\"recycling\"],\n      cf:\"counter-force\",\n      ticks:[\"The gearing\",\"Energy\",\"Matter\",\"Coupling & limits\"],\n      phases:[\n        {t:\"The gearing\",\n         b:\"Opening valve <b>F<\/b> sets the monetary wheel in motion. Through a <b>gear<\/b>, it drives a second wheel tied to the ecosystem — the <b>energy wheel<\/b> — turning the <b>opposite way<\/b>. Monetary flows are mirrored by real flows of matter and energy.\",\n         chips:[[\"eco\",\"↺\",\"<b>Energy wheel<\/b> — turns opposite to the monetary wheel\"],[\"warn\",\"⚙\",\"<b>Gear<\/b>: you can't speed up one without the other\"]],\n         note:\"real flows ↔ monetary flows · opposite directions\"},\n        {t:\"Energy\",\n         b:\"Money flowing into production causes an <b>“energy drop”<\/b>: energy (<b>fossil + renewable<\/b>) runs through the economy and transforms matter through the work of people and machines, before being released at the bottom as <b>irrecoverable heat<\/b>.\",\n         chips:[[\"prod\",\"↓\",\"<b>Energy<\/b> fossil + renewable — the input (low entropy)\"],[\"diss\",\"≈\",\"<b>Entropy<\/b> — degraded, irrecoverable heat (output)\"]],\n         note:\"useful energy (in) → entropy (out)\"},\n        {t:\"Matter\",\n         b:\"Coupled with energy, the <b>extraction of material resources<\/b> (limited) feeds the wheel; after use, matter returns to the environment as <b>waste<\/b>, or is partly <b>recycled<\/b>.\",\n         chips:[[\"prod\",\"↑\",\"<b>Material resources<\/b>, limited — the input\"],[\"diss\",\"♻\",\"<b>Waste · recycling<\/b> — the output\"]],\n         note:\"resources (in) → waste / recycling (out)\"},\n        {t:\"Coupling and limits\",\n         b:\"You cannot speed up the monetary wheel (GDP growth) without speeding up the energy wheel — risking <b>overshooting planetary boundaries<\/b>. And when resources grow scarce, the energy wheel slows. Because the two wheels are <b>coupled<\/b> and turn together, that slowdown also reaches the monetary wheel: a <b>counter-force<\/b> that brakes it. In economic terms, this braking shows up as slower growth — up to <b>recession<\/b>, or an <b>imposed degrowth<\/b>.\",\n         chips:[[\"warn\",\"⇧\",\"<b>Counter-force<\/b>: scarcity brakes the monetary wheel\"],[\"eco\",\"◎\",\"More GDP ⇒ faster wheel ⇒ pressure on the limits\"]],\n         note:\"GDP ↑ ⇒ throughput ↑ ⇒ planetary boundaries\"}\n      ]\n    }\n  };\n  var ACC=['var(--eco)','var(--prod)','var(--diss)','var(--warn)'];\n\n  // ---------- build wheels ----------\n  function teeth(g,cx,cy,r,cls,dir,stepDeg){\n    for(var a=0;a<360;a+=stepDeg){\n      var ar=a*Math.PI/180;\n      var c0=[cx+r*Math.cos(ar),cy+r*Math.sin(ar)];\n      var t=dir>0?[-Math.sin(ar),Math.cos(ar)]:[Math.sin(ar),-Math.cos(ar)];\n      var nn=[Math.cos(ar),Math.sin(ar)];\n      var L1=6,W=4;\n      var apex=[c0[0]+t[0]*L1,c0[1]+t[1]*L1];\n      var wa=[c0[0]+nn[0]*W,c0[1]+nn[1]*W], wb=[c0[0]-nn[0]*W,c0[1]-nn[1]*W];\n      g.appendChild(mk('polyline',{points:wa[0].toFixed(1)+','+wa[1].toFixed(1)+' '+apex[0].toFixed(1)+','+apex[1].toFixed(1)+' '+wb[0].toFixed(1)+','+wb[1].toFixed(1),class:cls}));\n    }\n  }\n  function rotArrow(g,cx,cy,r,dir,color){\n    // small curved rotation arrow near top of wheel\n    var a0=dir>0?-120:-60, a1=dir>0?-60:-120;\n    var p0=[cx+r*Math.cos(a0*Math.PI/180),cy+r*Math.sin(a0*Math.PI/180)];\n    var p1=[cx+r*Math.cos(a1*Math.PI/180),cy+r*Math.sin(a1*Math.PI/180)];\n    var sweep=dir>0?1:0;\n    var pa=mk('path',{d:'M '+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A '+r+' '+r+' 0 0 '+sweep+' '+p1[0].toFixed(1)+' '+p1[1].toFixed(1),class:'rotarr',stroke:color,'marker-end':dir>0?'url(#rotR)':'url(#rotL)'});\n    g.appendChild(pa);\n  }\n\n  (function(){\n    // rotation markers\n    var defs=document.querySelector('#wheel defs');\n    ['rotR','rotL'].forEach(function(id){\n      var m=mk('marker',{id:id,markerWidth:7,markerHeight:7,refX:3.5,refY:3.5,orient:'auto'});\n      m.appendChild(mk('path',{d:'M1 1 L6 3.5 L1 6 Z',fill:'var(--fin)'}));\n      if(id==='rotL') m.querySelector('path').setAttribute('fill','var(--eco)');\n      defs.appendChild(m);\n    });\n    var gm=document.getElementById('g-mon');\n    gm.appendChild(mk('circle',{cx:cxM,cy:cyM,r:RM,class:'rimM'}));\n    teeth(gm,cxM,cyM,RM,'toothM',1,16);\n    // poles F,P,D\n    var F=[cxM,cyM-RM],P=[cxM+RM,cyM],D=[cxM-RM,cyM];\n    [['F',F,0,-8,'middle'],['P',P,11,4,'start'],['D',D,-11,4,'end']].forEach(function(o){\n      gm.appendChild(mk('circle',{cx:o[1][0],cy:o[1][1],r:3.4,class:'pole-dot'}));\n      var tx=mk('text',{x:o[1][0]+o[2],y:o[1][1]+o[3],class:'pole-lbl','text-anchor':o[4]});tx.textContent=o[0];gm.appendChild(tx);\n    });\n    rotArrow(gm,cxM,cyM,RM-9,1,'var(--fin)');\n\n    var ge=document.getElementById('g-energy');\n    ge.appendChild(mk('circle',{cx:cxE,cy:cyE,r:RE,class:'rimE'}));\n    teeth(ge,cxE,cyE,RE,'toothE',-1,13);\n    rotArrow(ge,cxE,cyE,RE-11,-1,'var(--eco)');\n  })();\n\n  // mesh dot\n  document.getElementById('g-mesh').appendChild(mk('circle',{cx:MESH[0],cy:MESH[1],r:5,class:'meshdot',id:'meshdot'}));\n\n  // ---------- flows ----------\n  // energy channel (left): vertical, energy in (amber, top) -> entropy out (grey, bottom)\n  var LX=98;  // left channel x (just outside energy wheel left edge 113)\n  (function(){\n    var g=document.getElementById('g-eflow');\n    g.appendChild(mk('line',{x1:LX,y1:262,x2:LX,y2:452,class:'flow in'}));                  // energy in (down)\n    g.appendChild(mk('line',{x1:LX,y1:452,x2:LX,y2:520,class:'flow out','marker-end':'url(#ahOut)'})); // entropy out (down)\n  })();\n  // matter channel (right): vertical, resources in (amber, bottom) -> waste out (grey, top)\n  var RX=372; // right channel x (just outside energy wheel right edge 357)\n  (function(){\n    var g=document.getElementById('g-mflow');\n    g.appendChild(mk('line',{x1:RX,y1:548,x2:RX,y2:360,class:'flow in'}));                  // resources in (up)\n    g.appendChild(mk('line',{x1:RX,y1:360,x2:RX,y2:270,class:'flow out','marker-end':'url(#ahOut)'})); // waste out (up)\n    // small recycling loop — chevrons, like the u+i loop (part of waste returns)\n    (function(){\n      var clx=RX+16, cly=316, rl=15, N=6;\n      g.appendChild(mk('c
