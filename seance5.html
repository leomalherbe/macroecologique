<head>

<title>Macroéconomie écologique — Séance 5 : le fil du cours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;
    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;
    --econ:#2A78D6;--eco:#2E8B57;--rms:#C08A00;--warn:#C0392B;--fish:#0E7C9B;
    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);
    --font-d:"Spectral","IBM Plex Sans",Georgia,serif;/* IBM Plex en second : Spectral n'a pas le grec, β et α y retomberaient sur Georgia */--font-b:"IBM Plex Sans",system-ui,sans-serif;--font-m:"IBM Plex Mono",ui-monospace,monospace;
  }
  :root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}
  body.mode-tool{overflow:hidden;}

  /* ───────── vue « fil » ───────── */
  .wrap{max-width:1080px;margin:0 auto;padding-block:28px 56px;padding-inline:20px;}
  header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .remonte{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-m);font-size:11.5px;color:var(--faint);text-decoration:none;margin:0 0 12px;padding:3px 0;}
  .remonte:hover{color:var(--ink);}
  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:400;margin:0 0 7px;text-wrap:pretty;}
  .eyebrow b{color:var(--fish);font-weight:500;}
  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.6vw,44px);line-height:1.03;margin:0;letter-spacing:-.015em;text-wrap:balance;}
  .seance{font-family:var(--font-d);font-weight:500;font-size:clamp(17px,2.1vw,21px);line-height:1.15;color:var(--muted);margin:7px 0 0;}
  .sub{color:var(--muted);font-size:15.5px;margin:14px 0 0;max-width:80ch;text-wrap:pretty;}
  .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}
  .toggles{display:flex;gap:8px;flex-shrink:0;}
  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}
  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}
  .tg:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--rms);outline-offset:2px;}

  .part{margin-top:40px;}
  .parthead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px;}
  .parthead .rn{font-family:var(--font-m);font-size:12px;font-weight:600;color:#fff;background:var(--pc);border-radius:7px;padding:3px 10px;line-height:1;flex-shrink:0;}
  /* Une partie-seuil ouvre la séance sans prendre de rang : étiquette ajourée
     plutôt que badge plein, pour qu'elle ne se lise pas comme une partie I. */
  .parthead .sn{font-family:var(--font-m);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--pc);background:transparent;border:1px solid var(--pc);border-radius:7px;padding:3px 9px;line-height:1;flex-shrink:0;}
  .parthead h2{font-family:var(--font-d);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance;}
  .partlead{color:var(--muted);font-size:14px;margin:10px 0 16px;max-width:84ch;text-wrap:pretty;}
  .partlead b{color:var(--ink);font-weight:600;} .partlead i{font-family:var(--font-d);font-style:italic;}

  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media (max-width:680px){.cards{grid-template-columns:1fr;}}
  a.card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;transition:border-color .15s,transform .15s;}
  a.card:hover{border-color:var(--faint);transform:translateY(-1px);}
  .emb{flex-shrink:0;width:46px;height:46px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .emb svg{width:26px;height:26px;}
  .cbody{flex:1;min-width:0;}
  .cbody .idx{font-family:var(--font-m);font-size:11px;color:var(--faint);}
  .cbody h3{font-family:var(--font-d);font-weight:600;font-size:16.5px;margin:1px 0 3px;line-height:1.15;text-wrap:balance;}
  .cbody p{font-size:12.8px;color:var(--muted);margin:0;text-wrap:pretty;}
  .cbody .go{font-family:var(--font-m);font-size:11.5px;color:var(--fish);font-weight:500;margin-top:7px;display:inline-block;}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px;text-align:center;text-wrap:balance;}
  footer p{margin:0 0 7px;} footer p:last-child{margin-bottom:0;}
  footer a{color:var(--muted);text-decoration:underline;text-underline-offset:2px;}
  footer a:hover{color:var(--ink);}
  .lic{max-width:62ch;margin-inline:auto;text-wrap:pretty;line-height:1.6;}
  .lic a{white-space:nowrap;}

  /* ───────── vue « outil » ───────── */
  #view-tool{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);}
  body.mode-tool #view-tool{display:flex;}
  body.mode-tool #view-fil{display:none;}
  .nav{display:flex;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;}
  .navrow{display:flex;align-items:center;gap:10px;padding:7px 14px;}
  .navrow.r1{min-height:46px;}
  .nbtn{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:7px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1;}
  .nbtn:hover:not([disabled]){color:var(--ink);border-color:var(--faint);}
  .nbtn[disabled]{opacity:.35;cursor:default;}
  .nbtn.home{color:var(--ink);font-weight:500;}
  .nparts{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding-inline:4px;}
  .pcur{display:inline-flex;align-items:baseline;gap:9px;min-width:0;font-family:var(--font-d);font-weight:600;font-size:15.5px;line-height:1.15;white-space:nowrap;}
  .pcur em{font-family:var(--font-m);font-style:normal;font-size:12px;font-weight:600;color:var(--acc);flex-shrink:0;}
  .pcur span{overflow:hidden;text-overflow:ellipsis;}
  .ngroup{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .ncount{font-family:var(--font-m);font-size:11.5px;color:var(--faint);min-width:46px;text-align:center;}

  .navrow.r2{gap:4px;border-top:1px solid var(--line);padding-block:5px;overflow-x:auto;scrollbar-width:none;background:var(--panel);}
  .navrow.r2::-webkit-scrollbar{display:none;}
  .stp{display:inline-flex;align-items:baseline;gap:7px;flex:0 0 auto;min-width:0;max-width:260px;padding:5px 10px;border-radius:8px;border:1px solid transparent;text-decoration:none;color:var(--faint);font-size:12.5px;line-height:1.2;white-space:nowrap;}
  .stp em{font-family:var(--font-m);font-style:normal;font-size:10.5px;flex-shrink:0;opacity:.8;}
  .stp span{overflow:hidden;text-overflow:ellipsis;}
  .stp:hover{color:var(--ink);background:var(--surface);}
  .stp.on{color:var(--ink);font-weight:600;background:var(--surface);border-color:var(--line);box-shadow:inset 2px 0 0 var(--acc);max-width:none;}
  .stp.on em{color:var(--acc);opacity:1;}
  .pgrp{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);text-decoration:none;font-family:var(--font-m);font-size:11px;font-weight:600;color:var(--faint);line-height:1;}
  .pgrp:hover{color:var(--ink);background:var(--surface);border-color:var(--faint);}

  .host{flex:1;position:relative;min-height:0;}
  .host iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);}

  /* ───────── plein écran ─────────
     Le bandeau se retire au-dessus du bord et revient dès que le pointeur
     approche du haut. La bande de déclenchement #hotzone appartient à la page
     hôte : indispensable, car une iframe absorbe les mouvements de souris et
     la coquille ne les verrait jamais. */
  body.mode-plein .nav{position:absolute;top:0;left:0;right:0;z-index:6;
    transform:translateY(-100%);transition:transform .18s ease;box-shadow:0 8px 26px rgba(0,0,0,.20);}
  body.mode-plein.nav-on .nav{transform:none;}
  #hotzone{display:none;}
  body.mode-plein #hotzone{display:block;position:absolute;top:0;left:0;right:0;height:6px;z-index:7;}
  body.mode-plein.nav-on #hotzone{display:none;}
  .pastille{display:none;}
  body.mode-plein .pastille{display:block;position:absolute;top:10px;right:14px;z-index:5;
    font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;color:var(--faint);
    background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 9px;
    opacity:0;transition:opacity .4s ease;pointer-events:none;}
  body.mode-plein.astuce .pastille{opacity:.92;}
  @media (prefers-reduced-motion:reduce){
    body.mode-plein .nav{transition:none;} .pastille{transition:none;}
  }
  @media (max-width:640px){
    .pcur{font-size:13.5px;}
    .nbtn{padding:7px 8px;} .ncount{min-width:38px;}
    .nbtn.home span{display:none;}
    .stp{max-width:200px;}
    .navrow{padding-inline:10px;}
  }
</style>
</head>

'data-theme',st);}catch(e){}\n\n/* ---------- données du jeu ---------- */\nvar ORDER=['mg','ag','je','mv','bb','cl'];\nvar R={\n  mg:{fr:'Magasin général',en:'General store'},\n  ag:{fr:'Agriculteur',en:'Farmer'},\n  je:{fr:'Jeune sans emploi',en:'Unemployed youth'},\n  mv:{fr:'Mama Veggie',en:'Mama Veggie'},\n  bb:{fr:'Boda Boda',en:'Boda boda'},\n  cl:{fr:'Clinique médicale',en:'Health clinic'}\n};\nvar PROFILE={\n  mg:{fr:['Magasin de taille moyenne : épicerie, produits transformés, charbon. Une partie des produits vient de l’extérieur du quartier.','3 enfants · besoins 450 KSh/jour','Doit gagner assez de shillings pour se réapprovisionner dehors.'],\n      en:['Mid-size store: groceries, processed food, charcoal. Some products come from outside the community.','3 children · needs 450 KSh/day','Must earn enough shillings to restock outside.']},\n  ag:{fr:['Ferme héritée, chèvres laitières et poules. Vend ses légumes aux mamas du marché. Des terres restent en friche faute de pouvoir payer des ouvriers.','4 enfants · besoins 400 KSh/jour','Prêt à vendre en monnaie locale s’il trouve des ouvriers payés dans cette monnaie.'],\n      en:['Inherited farm with milk goats and hens. Sells vegetables to market mamas. Some land lies idle for lack of money to pay labourers.','4 children · needs 400 KSh/day','Would sell in local money if labourers accept to be paid in it.']},\n  je:{fr:['Sans emploi. Ramasse les déchets, plante des arbres, fait des courses : tout ce que les petits entrepreneurs proposent.','Aucun enfant, aide sa grand-mère et 6 frères et sœurs · besoins 80 KSh/jour','Accepte la monnaie locale si ceux qui vendent à manger l’acceptent aussi.'],\n      en:['Unemployed. Picks up waste, plants trees, runs errands: whatever small businesses offer.','No children, helps grandma and 6 siblings · needs 80 KSh/day','Accepts local money if food sellers accept it too.']},\n  mv:{fr:['Vend des légumes au bord de la route principale. Les achète au marché ou directement aux agriculteurs du coin.','5 enfants · besoins 450 KSh/jour · vit au jour le jour','La monnaie dans laquelle elle paie ses fournisseurs peut se négocier.'],\n      en:['Sells vegetables by the main road. Buys them at the market or straight from local farmers.','5 children · needs 450 KSh/day · hand-to-mouth','The currency she pays suppliers in may be negotiable.']},\n  bb:{fr:['Transport en moto-taxi. Le carburant s’achète hors du quartier.','2 enfants · besoins 300 KSh/jour','Doit gagner assez de shillings pour le carburant.'],\n      en:['Motorbike taxi. Fuel is bought outside the community.','2 children · needs 300 KSh/day','Must earn enough shillings for fuel.']},\n  cl:{fr:['Vend des médicaments et donne des conseils médicaux. Les médicaments viennent de l’extérieur.','3 enfants · besoins 400 KSh/jour','Au moins 80 % du prix des médicaments doit rentrer en shillings.'],\n      en:['Sells medicines and gives medical advice. Medicines come from outside.','3 children · needs 400 KSh/day','At least 80% of the medicine price must come in shillings.']}\n};\nvar PRODUCTS=[\n  {id:'mv_veg',s:'mv',p:50,fr:'Légumes',en:'Vegetables'},\n  {id:'bb_ride',s:'bb',p:50,fr:'Course en moto',en:'Motorbike ride'},\n  {id:'je_day',s:'je',p:50,fr:'Journée de travail',en:'Day of work'},\n  {id:'ag_veg',s:'ag',p:20,fr:'Légumes (en gros)',en:'Vegetables (wholesale)'},\n  {id:'ag_milk',s:'ag',p:30,fr:'Lait (vendu au magasin uniquement)',en:'Milk (sold to the store only)',only:'mg'},\n  {id:'mg_coal',s:'mg',p:100,fr:'Charbon',en:'Charcoal'},\n  {id:'mg_milk',s:'mg',p:60,fr:'Lait',en:'Milk'},\n  {id:'mg_water',s:'mg',p:40,fr:'Eau',en:'Water'},\n  {id:'mg_flour',s:'mg',p:20,fr:'Farine',en:'Flour'},\n  {id:'cl_cons',s:'cl',p:60,fr:'Consultation',en:'Consultation'},\n  {id:'cl_med',s:'cl',p:100,fr:'Médicaments',en:'Medicines'}\n];\nfunction prod(id){for(var i=0;i<PRODUCTS.length;i++)if(PRODUCTS[i].id===id)return PRODUCTS[i];return null;}\nvar RATE=1.2;\nvar OUT={mg:{base:'all',rate:.8},bb:{base:'all',rate:.3},cl:{base:'med',rate:.8}};\nvar ECO_INIT={mg:100000,ag:100000,je:0,mv:10000,bb:200000,cl:250000};\nvar OPTIONAL=['bb','cl'];\nvar GAT_INIT={mg:200,ag:200,je:200,mv:200,bb:200,cl:200};\nvar PROJ=['routes','egouts','chiens'];\nvar PROJN={routes:{fr:'Réparation des routes',en:'Road repair'},egouts:{fr:'Entretien des égouts',en:'Sewer maintenance'},chiens:{fr:'Limite sur les chiens errants',en:'Stray dog control'}};\nvar MATRIX={ag:{routes:200,egouts:-200,chiens:25},mg:{routes:-200,egouts:200,chiens:25},mv:{routes:25,egouts:25,chiens:200},je:{routes:25,egouts:50,chiens:-200}};\nvar BAN_ACTORS=['ag','mg','mv','je'];\nvar VOTERS=['mg','mv','ag'];\n\n/* ---------- textes ---------- */\nvar S={fr:{\n  eye:'Macroéconomie écologique · Séance 5 · Jeu de rôle',h1:'Monnaies kényanes',\n  tabs:{team:'Équipe',eco:'EcoPesa',sum:'Bilan',teach:'Vue enseignant'},\n  chipNo:'Équipe non renseignée',chip:'Équipe',\n  teamLead:'Un seul appareil par équipe, tenu par la ou le secrétaire. <b>Quatre rôles sont obligatoires<\/b> : le magasin général, l’agriculteur, le jeune sans emploi et Mama Veggie. <b>Boda Boda et la clinique sont optionnels<\/b> : cochez-les si vous voulez les jouer (un joueur peut alors tenir deux rôles). Chacun garde son rôle pendant toute la partie, qui est enregistrée automatiquement dans ce navigateur.',\n  optLbl:'optionnel',optOn:'Joué dans cette équipe',optLocked:'des opérations l’utilisent',\n  cmp:{title:'EcoPesa et GatinaPesa comparés',r:['Monnaie mise en circulation','Volume d’échanges locaux','Multiplicateur territorial','Taux de fuite','Gini des avoirs en fin de partie'],\n    read:function(r,more,faster,gv,ev){return 'GatinaPesa a fait <b>×'+r+'<\/b> les échanges d’EcoPesa ('+(more?'davantage':'moins')+' d’échanges), avec un multiplicateur '+(faster?'plus élevé':'plus faible')+' ('+gv+' contre '+ev+'). Volume et vitesse de circulation ne disent pas la même chose.';},\n    empty:'Jouez les trois tours des deux scénarios pour comparer.',\n    note:'Pour EcoPesa, les avoirs comptent les shillings et les EP convertis en shillings.'},\n  setupTitle:'Préparer l’équipe',\n  game:{eye:'Le jeu',title:'Une monnaie locale pour un quartier',eco:'Vous jouez ici le scénario <b>EcoPesa<\/b> : une monnaie locale adossée au shilling, que l’on achète au bureau de change avec un bonus de 20 %, que l’on dépense dans le quartier et que l’on peut reconvertir en shillings. La partie dure trois tours.',\n    origin:'Ce jeu de rôle adapte <i>Kenyan Community Currencies – A role play in two parts<\/i>, un jeu pédagogique construit à partir des monnaies communautaires lancées au Kenya par l’association <b>Grassroots Economics<\/b>. Vous incarnez les habitants d’un quartier informel où l’argent manque : les shillings kényans servent surtout à payer ce qui vient de l’extérieur, et les échanges locaux s’arrêtent faute de moyen de paiement.',\n    ctxT:'Le contexte réel',\n    ctx:[['2010','Eco-Pesa · Kongowea, Mombasa','Des bons échangeables contre des shillings auprès des commerces du réseau, financés par des dons. Le pilote circule environ un an.'],\n         ['2012','Bangla-Pesa · Bangladesh, Mombasa','Un réseau d’entreprises émet ses propres bons, garantis par les biens et services de ses membres : la monnaie ne dépend plus des dons. En 2013, ses promoteurs sont arrêtés pour contrefaçon de monnaie, puis les poursuites sont abandonnées.'],\n         ['2014','Gatina-Pesa · Kawangware, Nairobi','Le modèle Bangla-Pesa répliqué dans un autre quartier. Ces réseaux se fédèrent ensuite dans le réseau Sarafu.']],\n    ctxNote:'Le jeu simplifie ces dispositifs : les règles de chaque scénario sont celles du jeu, pas celles des monnaies réelles.',\n    goalT:'Ce que le jeu doit vous faire comprendre',\n    goals:['Sur quoi repose la <b>confiance<\/b> dans une monnaie qui n’a pas cours légal.','Comment une monnaie locale fait <b>circuler<\/b> les revenus dans un territoire, et ce que mesure le <b>multiplicateur territorial<\/b>.','Pourquoi une monnaie convertible en shillings <b>fuit<\/b> hors du quartier.','Quels effets une monnaie communautaire a sur les <b>inégalités<\/b>.','Qui <b>décide<\/b> de l’usage de la monnaie, et qui reste en dehors du cercle.'],\n    scT:'Les trois scénarios',\n    sc:['Une monnaie adossée au shilling, que l’on achète avec un bonus et que l’on peut reconvertir.','Une monnaie distribuée à parts égales, qui ne se reconvertit pas.','Une monnaie gérée par un réseau d’entreprises, qui vote ses projets collectifs.']},\n  teamNum:'Numéro d’équipe',members:'Membres de l’équipe',memberPh:'Prénom',\n  roleTitle:'Les rôles',playedBy:'Joué par',nobody:'— à attribuer —',autoAssign:'Répartir automatiquement',\n  rolesHint:'Lisez votre fiche : elle dit ce que vous vendez, ce dont vous avez besoin, et à quelle condition vous accepteriez une monnaie locale.',\n  steps:'Déroulé',stepsList:['Remplissez l’équipe, choisissez les rôles optionnels et attribuez les rôles.','EcoPesa : trois tours de trois étapes. Discutez, puis la ou le secrétaire saisit chaque opération.','Répondez aux questions de l’onglet EcoPesa, puis envoyez le fichier de l’onglet Bilan.'],\n  settings:'Réglages de départ (enseignant)',settingsHint:'Épargne initiale de chaque acteur. Modifiable seulement tant qu’aucune opération n’a été saisie dans le scénario.',\n  ecoInit:'EcoPesa · épargne initiale (KSh)',gatInit:'GatinaPesa · solde initial (GP)',locked:'verrouillé : des opérations existent',\n  demo:'Charger une partie d’exemple',reset:'Tout effacer',resetSure:'Effacer toute la partie ?',yes:'Oui, effacer',no:'Annuler',\n  demoSure:'Remplacer la partie en cours par un exemple ?',demoYes:'Oui, charger',\n  round:'Tour',synth:'Synthèse',\n  howTitle:'Comment se joue un tour',orderLbl:'Ordre de jeu',allLbl:'tout le monde',nextLbl:'tour suivant',\n  ecoIntro:'L’EcoPesa est un bon d’achat local adossé au shilling : on l’obtient en apportant des shillings au bureau de change, on le dépense dans le quartier, et on peut le reconvertir en shillings. La partie dure <b>trois tours<\/b>, et chaque tour se joue en <b>trois étapes<\/b>.',\n  ecoSteps:[['Ouverture','Chaque acteur qui le souhaite apporte des shillings au bureau de change et reçoit <b>1,2 EP par shilling<\/b> (100 KSh donnent 120 EP). On peut aussi ne rien changer.'],['Circulation','Le marché est ouvert : chacun achète ce dont il a besoin aux autres acteurs, aux prix de la grille, <b>en EP ou en shillings<\/b>. Un vendeur peut refuser une monnaie.'],['Clôture','Le magasin paie ses <b>achats hors du quartier<\/b> en shillings, tout comme Boda Boda et la clinique s’ils sont joués. Qui en manque reconvertit des EP : 1,2 EP donnent 1 KSh, soit environ 16,7 % de perte. Ces shillings quittent le quartier.']],\n  ecoOrder:'Tout le monde termine l’étape 1 avant de passer à l’étape 2, puis tout le monde termine l’étape 2 avant l’étape 3. Un joueur ne fait pas ses trois étapes d’affilée. Quand l’étape 3 est finie pour tous, on passe au tour suivant. Le secrétaire saisit chaque opération au fur et à mesure ; à l’intérieur d’une étape, l’ordre des saisies ne compte pas.',\n  gatIntro:'La GatinaPesa est une monnaie communautaire distribuée à parts égales : chaque acteur reçoit <b>200 GP<\/b>. Elle ne s’achète pas et ne se reconvertit pas en shillings, donc la masse monétaire ne bouge pas. La partie dure <b>trois tours<\/b>.',\n  gatSteps:[['Besoins','Chacun relit sa fiche et décide ce qu’il veut acheter pendant ce tour.'],['Marché','Chacun achète aux autres acteurs, aux prix de la grille, en GP. Le secrétaire saisit chaque vente.'],['Bilan du tour','On regarde les soldes : qui s’est enrichi, qui s’est appauvri ? Puis on passe au tour suivant.']],\n  gatOrder:'Tout le monde fait ses achats du tour avant que l’on passe ensemble au tour suivant. Personne n’enchaîne plusieurs tours seul.',\n  banIntro:'Le réseau d’entreprises qui garantit la Bangla-Pesa doit financer un projet collectif. <b>Seuls les membres du réseau votent<\/b> : le magasin général, Mama Veggie et l’agriculteur. Le jeune sans emploi peut prendre la parole mais ne vote pas.',\n  banSteps:[['Lire la matrice','Chacun repère ce que chaque projet lui rapporte ou lui coûte en Bangla-Pesa.'],['Débattre','Lancez le chronomètre. Chaque votant défend son projet, le jeune donne son avis. 15 minutes au plus.'],['Voter et noter','Les trois votants annoncent leur choix : deux voix suffisent. Arrêtez le chronomètre, indiquez s’il y a eu des tensions et prenez des notes.']],\n  banOrder:'Le groupe fait les trois étapes ensemble, l’une après l’autre.',\n  s1:'Ouverture · bureau de change',s2:'Circulation · ventes',s3:'Clôture · reconversion et achats extérieurs',\n  actor:'Acteur',kshIn:'Shillings apportés',exch:'Échanger',getsEP:'reçoit',\n  product:'Produit',seller:'Vendeur',buyer:'Acheteur',qty:'Qté',amount:'Montant',label:'Objet',currency:'Monnaie',record:'Enregistrer la vente',other:'Autre (montant négocié)',otherPh:'ex. réparation',\n  epOut:'EP à reconvertir',reconv:'Reconvertir',getsKSh:'reçoit',\n  outTitle:'Achats hors du quartier',outHint:'payés en shillings à la clôture, selon une règle fixe. S’il manque des shillings, reconvertissez des EP avant ; sinon l’achat n’est payé qu’en partie.',outDue:'À payer',outHave:'KSh dispo',outPaid:'Payé',outShort:'manque',outBtn:'Reconvertir le nécessaire',\n  rule_mg:'80 % des recettes du tour · réapprovisionnement',rule_bb:'30 % des recettes du tour · carburant',rule_cl:'80 % des ventes de médicaments · médicaments importés',\n  k_out:'Shillings sortis du quartier',k_out_s:'achats hors du quartier',thOut:'KSh sortis',\n  noEntry:'Aucune opération pour l’instant.',\n  accounts:'Comptes à la fin du tour',accountsAll:'Comptes en fin de partie',start:'Début',end:'Fin',\n  total:'Total',\n  e_amt:'Indiquez un montant positif.',e_same:'Le vendeur et l’acheteur doivent être différents.',e_only:'Ce lait ne se vend qu’au magasin général.',\n  e_ksh:function(n,a){return n+' n’a que '+a+' KSh à ce moment du tour.';},\n  e s+'<\/div><\/div><div class=\"legend\">'+lg+'<\/div>';\n}\nfunction addTeam(o){\n  if(!o||o.kind!=='kenya-monnaies'||!o.summary||!o.summary.eco||!o.team)return false;\n  var i=-1;teacher.forEach(function(x,j){if(String(x.team.num)===String(o.team.num))i=j;});\n  var slim={team:{num:o.team.num,members:o.team.members},summary:{eco:o.summary.eco},answers:{eco:(o.eco&&o.eco.answers)||[]}};\n  if(i>=0)teacher[i]=slim;else teacher.push(slim);return true;\n}\n\n/* ---------- actions ---------- */\nfunction setErr(k,m){msg[k]=m;}\nfunction clearErr(){msg.eco1=msg.eco2=msg.eco3=msg.gat='';}\nfunction act(a){\n  var parts=a.split(':');\n  clearErr();\n  if(a==='ex'){\n    var k=num(D.eco.exK),who_=D.eco.exA,r=state.eco.r;\n    if(isNaN(k)||k<=0){setErr('eco1',t('e_amt'));return render();}\n    state.eco.rounds[r].ex.push({a:who_,k:k});\n    var c=ecoCalc();\n    if(!c.ok){state.eco.rounds[r].ex.pop();setErr('eco1',laterMsg(c,r,who_)||t('e_ksh')(rn(who_),fmt(availBefore(r,1,who_,'ksh'))));return render();}\n    D.eco.exK='';\n  }else if(a==='rc'||parts[0]==='need'){\n    var r2_=state.eco.r,ent;\n    if(parts[0]==='need'){var o=ecoCalc().rounds[r2_],kk=parts[1],miss=o.due[kk]-o.preK[kk];\n      if(miss<=EPS||o.endE[kk]<=EPS)return render();\n      ent={a:kk,e:Math.min(Math.ceil(miss*RATE*100)/100,r2(o.endE[kk])),auto:true};}\n    else{var e=num(D.eco.rcE);if(isNaN(e)||e<=0){setErr('eco3',t('e_amt'));return render();}ent={a:D.eco.rcA,e:e};}\n    state.eco.rounds[r2_].rc.push(ent);\n    var c3=ecoCalc();if(!c3.ok){state.eco.rounds[r2_].rc.pop();setErr('eco3',laterMsg(c3,r2_,ent.a)||t('e_ep')(rn(ent.a),fmt(availBefore(r2_,3,ent.a,'ep'))));return render();}\n    if(a==='rc')D.eco.rcE='';\n  }else if(parts[0]==='sale'){\n    var sc=parts[1],d=D[sc],p=d.p==='other'?null:prod(d.p),amt=saleAmount(sc),seller=p?p.s:d.oS,buyer=p&&p.only?p.only:d.buyer,ek=sc==='eco'?'eco2':'gat';\n    if(isNaN(amt)||amt<=0){setErr(ek,t('e_amt'));return render();}\n    if(!p&&!d.oL.trim()){setErr(ek,t('e_label'));return render();}\n    if(seller===buyer){setErr(ek,t('e_same'));return render();}\n    var x={p:d.p,q:p?parseInt(d.q,10):1,s:seller,b:buyer,amt:amt};\n    if(!p)x.label=d.oL.trim();\n    if(sc==='eco')x.cur=d.cur;\n    var rr=state[sc].r;state[sc].rounds[rr].tx.push(x);\n    var cc=sc==='eco'?ecoCalc():gatCalc(),ok=cc.ok;\n    if(!ok){state[sc].rounds[rr].tx.pop();\n      if(sc==='eco')setErr(ek,laterMsg(cc,rr,buyer)||(d.cur==='ep'?t('e_ep'):t('e_ksh'))(rn(buyer),fmt(availBefore(rr,2,buyer,d.cur))));\n      else setErr(ek,t('e_gp')(rn(buyer),fmt(gatAvail(rr,buyer))));\n      return render();}\n    d.q=1;d.oA='';d.oL='';\n  }else if(parts[0]==='delex'||parts[0]==='delrc'||parts[0]==='deltx'){\n    var sc2=parts[0]==='deltx'?parts[1]:'eco',idx=+parts[parts.length-1],rr2=state[sc2].r,list=parts[0]==='delex'?'ex':parts[0]==='delrc'?'rc':'tx';\n    var removed=state[sc2].rounds[rr2][list].splice(idx,1)[0];\n    var ok2=sc2==='eco'?ecoCalc().ok:gatCalc().ok;\n    if(!ok2){state[sc2].rounds[rr2][list].splice(idx,0,removed);setErr(sc2==='eco'?(list==='ex'?'eco1':list==='tx'?'eco2':'eco3'):'gat',t('e_del'));return render();}\n  }else if(a==='auto'){\n    var ms=[];state.team.members.forEach(function(m,i){if(m.trim())ms.push(i);});\n    if(ms.length)ACT().forEach(function(k,i){state.team.roles[k]=String(ms[i%ms.length]);});\n  }else if(a==='demo'){pending='demo';}\n  else if(a==='reset'){pending='reset';}\n  else if(a==='cancel'){pending=null;}\n  else if(a==='resetYes'){var tab=state.tab;state=blank();state.tab=tab;pending=null;}\n  else if(a==='demoYes'){state=demoState();pending=null;}\n  else if(a==='timer'){var b=state.ban;if(b.running){b.elapsed+=(Date.now()-b.startedAt)/1000;b.running=false;}else{b.running=true;b.startedAt=Date.now();}tick();}\n  else if(a==='treset'){state.ban.elapsed=0;state.ban.running=false;state.ban.minutes='';}\n  else if(a==='download'){download();return;}\n  else if(a==='copy'){copyCode();return;}\n  else if(a==='addcode'){var v=document.getElementById('pastecode').value.trim();msg.teach='';\n    try{if(!addTeam(JSON.parse(v)))throw 0;saveTeacher();}catch(e){msg.teach=t('badCode');}}\n  else if(a==='tclear'){teacher=[];saveTeacher();}\n  save();render();\n}\nfunction laterMsg(c,r,k){if(c.bad&&(c.bad.r!==r||c.bad.k!==k))return t('e_later')(rn(c.bad.k),c.bad.r+1,c.bad.cur==='ep'?'EP':'KSh');return null;}\nfunction availBefore(r,stage,k,cur){\n  /* solde avant l'opération refusée : on recalcule l'état courant sans elle */\n  var c=JSON.parse(JSON.stringify(state.eco));for(var i=r+1;i<3;i++)c.rounds[i]={ex:[],tx:[],rc:[]};\n  if(stage===1){c.rounds[r].tx=[];c.rounds[r].rc=[];}else if(stage===2){c.rounds[r].rc=[];}\n  var o=ecoCalc(c).rounds[r];return Math.max(0,cur==='ksh'?o.preK[k]:o.endE[k]);\n}\nfunction gatAvail(r,k){var c=JSON.parse(JSON.stringify(state.gat));for(var i=r+1;i<3;i++)c.rounds[i]={tx:[]};return Math.max(0,gatCalc(c).rounds[r].end[k]);}\nfunction download(){\n  var o=exportObj(),name='equipe-'+(String(state.team.num||'x').replace(/[^0-9a-zA-Z-]/g,''))+'-monnaies-kenya.json';\n  try{var blob=new Blob([JSON.stringify(o,null,1)],{type:'application/json'});var u=URL.createObjectURL(blob);var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},500);}catch(e){}\n}\nfunction copyCode(){\n  var ta=document.getElementById('code'),m=document.getElementById('copymsg');\n  function fail(){if(m)m.textContent=t('copyFail');if(ta){ta.focus();ta.select();}}\n  try{navigator.clipboard.writeText(ta.value).then(function(){if(m)m.textContent='✓ '+t('copied');},fail);}catch(e){fail();}\n}\nvar timerId=null;\nfunction tick(){\n  if(timerId)clearInterval(timerId);\n  timerId=setInterval(function(){\n    if(!state.ban.running){clearInterval(timerId);timerId=null;return;}\n    var c=document.getElementById('clock');if(c){var el=curElapsed();c.textContent=clock(el);c.classList.toggle('over',el>900);}\n  },500);\n}\n\n/* ---------- événements ---------- */\ndocument.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.getAttribute('data-tab');pending=null;clearErr();msg.sum='';save();render();window.scrollTo(0,0);});\nvar view=document.getElementById('view');\nview.addEventListener('click',function(e){\n  var b;\n  if((b=e.target.closest('[data-act]'))){act(b.getAttribute('data-act'));return;}\n  if((b=e.target.closest('[data-round]'))){var p=b.getAttribute('data-round').split(':');state[p[0]].r=+p[1];clearErr();save();render();return;}\n  if((b=e.target.closest('[data-cur]'))){D.eco.cur=b.getAttribute('data-cur');render();return;}\n  if((b=e.target.closest('[data-vote]'))){var v=b.getAttribute('data-vote').split(':');state.ban.votes[v[0]]=state.ban.votes[v[0]]===v[1]?'':v[1];save();render();return;}\n  if((b=e.target.closest('[data-youth]'))){var y=b.getAttribute('data-youth');state.ban.youth=state.ban.youth===y?'':y;save();render();return;}\n  if((b=e.target.closest('[data-tens]'))){var tv=b.getAttribute('data-tens');state.ban.tens=state.ban.tens===tv?'':tv;save();render();return;}\n});\nview.addEventListener('input',function(e){\n  var el=e.target,a;\n  if((a=el.getAttribute('data-d'))){var p=a.split(':');D[p[0]][p[1]]=el.value;\n    if(el.tagName==='SELECT'&&el.getAttribute('data-rr')){render();return;}\n    var pv;if((pv=document.getElementById(p[0]+'_prev')))pv.innerHTML=salePreview(p[0]);\n    if((pv=document.getElementById('eco_exPrev')))pv.innerHTML=exPrev();\n    if((pv=document.getElementById('eco_rcPrev')))pv.innerHTML=rcPrev();\n    return;}\n  if((a=el.getAttribute('data-ans'))){var q=a.split(':');state[q[0]].answers[+q[1]]=el.value;save();return;}\n  if((a=el.getAttribute('data-ban'))){state.ban[a]=el.value;save();return;}\n  if(el.id==='tnum'){state.team.num=el.value.trim();save();renderChip();return;}\n  if((a=el.getAttribute('data-mem'))!==null){state.team.members[+a]=el.value;save();return;}\n  if((a=el.getAttribute('data-init'))){var n=num(el.value);if(!isNaN(n)&&n>=0){state[a].init[el.getAttribute('data-k')]=n;save();}return;}\n});\nview.addEventListener('toggle',function(e){if(e.target.id==='settings')setOpen=e.target.open;var k=e.target.getAttribute&&e.target.getAttribute('data-keep');if(k)openSet[k]=e.target.open;},true);\nview.addEventListener('change',function(e){\n  var el=e.target,a;\n  if((a=el.getAttribute('data-role'))){state.team.roles[a]=el.value;save();return;}\n  if((a=el.getAttribute('data-opt'))){if(!el.checked&&usedEco(a)){el.checked=true;return;}state.team.opt[a]=el.checked;if(!el.checked)state.team.roles[a]='';save();render();return;}\n  if(el.getAttribute('data-mem')!==null){save();render();return;}\n  if(el.id==='files'){\n    var fs=Array.prototype.slice.call(el.files||[]),left=fs.length,bad=0;msg.teach='';\n    fs.forEach(function(f){var rd=new FileReader();rd.onload=function(){try{if(!addTeam(JSON.parse(rd.result)))bad++;}catch(x){bad++;}if(--left===0){if(bad)msg.teach=t('badCode')+' ('+bad+')';saveTeacher();render();}};rd.readAsText(f);});\n  }\n});\n\n/* thème & langue */\nfunction eff(){var a=document.documentElement.getAttribute('data-theme');if(a)return a;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}\ndocument.getElementById('theme').addEventListener('click',function(){var n=eff()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem(PFX+'_theme',n);}catch(e){}});\ndocument.getElementById('lang').addEventListener('click',function(){L=L==='fr'?'en':'fr';try{localStorage.setItem(PFX+'_lang',L);}catch(e){}render();});\n\n/* ---------- partie d'exemple ---------- */\nfunction demoState(){\n  var s=blank();s.tab='team';\n  s.team={num:'7',members:['Awa','Bruno','Chloé','Driss'],roles:{mg:'0',ag:'1',je:'2',mv:'3',bb:'0',cl:'1'},opt:{bb:true,cl:true}};\n  var R1=s.eco.rounds;\n  R1[0].ex=[{a:'bb',k:100},{a:'cl',k:150},{a:'mg',k:50}];\n  R1[0].tx=[{p:'mv_veg',q:1,s:'mv',b:'bb',amt:50,cur:'ep'},{p:'je_day',q:2,s:'je',b:'cl',amt:100,cur:'ep'},{p:'mg_flour',q:2,s:'mg',b:'je',amt:40,cur:'ep'},{p:'ag_veg',q:2,s:'ag',b:'mv',amt:40,cur:'ep'},{p:'cl_cons',q:1,s:'cl',b:'bb',amt:60,cur:'ep'},{p:'mg_coal',q:1,s:'mg',b:'ag',amt:100,cur:'ksh'}];\n  R1[0].rc=[{a:'mg',e:20,rule:true}];\n  R1[1].ex=[{a:'bb',k:50}];\n  R1[1].tx=[{p:'bb_ride',q:2,s:'bb',b:'cl',amt:100,cur:'ep'},{p:'mg_water',q:1,s:'mg',b:'je',amt:40,cur:'ep'},{p:'mv_veg',q:1,s:'mv',b:'ag',amt:50,cur:'ep'},{p:'ag_milk',q:1,s:'ag',b:'mg',amt:30,cur:'ep'}];\n  R1[1].rc=[{a:'mg',e:20,rule:true},{a:'bb',e:60}];\n  R1[2].ex=[{a:'cl',k:100}];\n  R1[2].tx=[{p:'je_day',q:1,s:'je',b:'cl',amt:50,cur:'ep'},{p:'mg_flour',q:1,s:'mg',b:'je',amt:20,cur:'ep'},{p:'cl_med',q:1,s:'cl',b:'bb',amt:100,cur:'ep'}];\n  R1[2].rc=[{a:'mg',e:10,rule:true},{a:'cl',e:40}];\n  var G=s.gat.rounds;\n  G[0].tx=[{p:'mv_veg',q:2,s:'mv',b:'bb',amt:100},{p:'je_day',q:2,s:'je',b:'ag',amt:100},{p:'mg_coal',q:1,s:'mg',b:'cl',amt:100},{p:'ag_milk',q:2,s:'ag',b:'mg',amt:60}];\n  G[1].tx=[{p:'cl_cons',q:1,s:'cl',b:'je',amt:60},{p:'bb_ride',q:2,s:'bb',b:'mg',amt:100},{p:'mg_flour',q:3,s:'mg',b:'mv',amt:60},{p:'ag_veg',q:3,s:'ag',b:'mv',amt:60}];\n  G[2].tx=[{p:'cl_med',q:1,s:'cl',b:'bb',amt:100},{p:'mg_water',q:2,s:'mg',b:'je',amt:80},{p:'je_day',q:1,s:'je',b:'cl',amt:50}];\n  s.ban.votes={ag:'routes',mg:'egouts',mv:'egouts'};s.ban.youth='egouts';s.ban.elapsed=9*60+20;s.ban.tens='yes';\n  s.ban.notes='(exemple) Long débat entre le magasin et l’agriculteur ; Mama Veggie a tranché pour les égouts.';\n  return s;\n}\n\nif(state.ban.running)tick();\nrender();\n})();\n<\/script>\n<\/body>\n<\/html>\n\n<\/body><\/html>"}</script>

<script>
(function(){
  "use strict";

  var CFG   = JSON.parse(document.getElementById('configsrc').textContent);

  /* ───────── bibliothèque d'icônes ─────────
     Chaque icône reçoit la couleur d'accent de sa carte. Pour en ajouter une,
     déclarer un cas supplémentaire et le nommer dans la configuration. */
  function emb(nom, couleur){
    var a = tok(couleur);
    var S = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">';
    switch(nom){
      case 'cibles':      return S+'<circle cx="12" cy="12" r="9" stroke="'+a+'"/><circle cx="12" cy="12" r="5.4"/><circle cx="12" cy="12" r="2" fill="var(--econ)" stroke="var(--econ)"/></svg>';
      case 'circuit':     return S+'<circle cx="12" cy="12" r="8"/><path d="M15 9.2A4 4 0 0 0 8.5 11" stroke="'+a+'"/><path d="M9 14.8A4 4 0 0 0 15.5 13" stroke="'+a+'"/><path d="M9.5 11.5h4M9.5 13h4" stroke="'+a+'"/></svg>';
      case 'eclair':      return S+'<circle cx="12" cy="12" r="8"/><path d="M12.5 7l-3.2 5.4H12l-0.6 4.2 3.6-5.6H12z" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'engrenages':  return S+'<circle cx="9" cy="10" r="3.2"/><circle cx="15.4" cy="15" r="2.6"/><path d="M9 4.6v1.6M9 13.8v1.6M3.8 10h1.6M12.6 10h1.6M5.4 6.4l1.1 1.1M11.5 12.5l1.1 1.1M12.6 6.4l-1.1 1.1M5.4 13.6l1.1-1.1" stroke="'+a+'"/></svg>';
      case 'courbes':     return S+'<path d="M3 20C10 20 12 5 21 4" stroke="'+a+'"/><path d="M3 20C9 20 9 9 20 8.5"/></svg>';
      case 'bosse':       return S+'<path d="M3.5 19C8 5 16 5 20.5 19" stroke="'+a+'"/><path d="M3 12.5h18" stroke-dasharray="2 2"/></svg>';
      case 'lecture':     return S+'<path d="M9 7l8 5-8 5z" fill="'+a+'" stroke="'+a+'"/><path d="M4 12h2"/></svg>';

      case 'fourche':     return S+'<path d="M3 12h7"/><path d="M10 12l8-5.5" stroke="'+a+'"/><path d="M10 12l8 5.5" stroke="var(--faint)"/><path d="M18 6.5l-3 .4M18 6.5l.5 2.9" stroke="'+a+'"/></svg>';

      case 'carres':      return S+'<g stroke="none"><rect x="4.6" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="10.2" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="15.8" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="4.6" y="10.2" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="10.2" y="10.2" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="15.8" y="10.2" width="4.6" height="4.6" rx="1" fill="currentColor"/><rect x="4.6" y="15.8" width="4.6" height="4.6" rx="1" fill="currentColor"/><rect x="10.2" y="15.8" width="4.6" height="4.6" rx="1" fill="var(--faint)"/><rect x="15.8" y="15.8" width="4.6" height="4.6" rx="1" fill="var(--line)"/></g></svg>';
      case 'curseurs':    return S+'<path d="M3.4 7h17.2M3.4 12h17.2M3.4 17h17.2"/><circle cx="8" cy="7" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/><circle cx="15.2" cy="12" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/><circle cx="11" cy="17" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/></svg>';
      /* robinet : un apport par le haut, un niveau qui s'établit, une fuite par
         le bas — la baignoire monétaire (crédits, dépôts, remboursements). */
      /* fuite : une monnaie qui circule dans un périmètre, et ce qui en sort.
         Le trait d'accent est la fuite, pas la circulation. */
      case 'fuite':       return S+'<rect x="2.8" y="5" width="12.6" height="14" rx="2.4"/><circle cx="6.8" cy="11.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="11.2" cy="14.4" r="1.15" fill="currentColor" stroke="none"/><circle cx="6.8" cy="16.6" r="1.15" fill="currentColor" stroke="none"/><path d="M11.8 8.2h9" stroke="'+a+'"/><path d="M20.8 8.2l-2.2-1.8M20.8 8.2l-2.2 1.8" stroke="'+a+'"/></svg>';
      case 'robinet':     return S+'<path d="M3.4 5.2h5.4" stroke="'+a+'"/><path d="M8.8 5.2v2.7" stroke="'+a+'"/><circle cx="8.8" cy="9.5" r="0.8" fill="'+a+'" stroke="none"/><path d="M4.6 12.2h14.8v5.4a2 2 0 0 1-2 2H6.6a2 2 0 0 1-2-2z"/><path d="M4.6 15.1h14.8" stroke="'+a+'"/><circle cx="12" cy="22" r="0.95" fill="'+a+'" stroke="none"/></svg>';
      case 'seau':        return S+'<path d="M4.2 6.6h15.6l-1.7 9.7a1.8 1.8 0 0 1-1.8 1.5H7.7a1.8 1.8 0 0 1-1.8-1.5z"/><path d="M10.4 11.6h.01M13.7 13.6h.01" stroke="'+a+'" stroke-width="2.6"/><circle cx="10.5" cy="20.4" r="1.05" fill="'+a+'" stroke="none"/><circle cx="13.9" cy="21.4" r="0.85" fill="'+a+'" stroke="none"/></svg>';
      case 'des':         return S+'<rect x="4" y="4" width="16" height="16" rx="3.4"/><circle cx="8.6" cy="8.6" r="1.35" fill="'+a+'" stroke="none"/><circle cx="15.4" cy="8.6" r="1.35" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.35" fill="'+a+'" stroke="none"/><circle cx="8.6" cy="15.4" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.35" fill="'+a+'" stroke="none"/></svg>';
      case 'planchers':   return S+'<path d="M3 20h18"/><rect x="5" y="6.5" width="3.8" height="13.5" rx="1"/><rect x="10.1" y="9.5" width="3.8" height="10.5" rx="1"/><rect x="15.2" y="12" width="3.8" height="8" rx="1" stroke="'+a+'"/><path d="M3.8 16.8h16.4" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'mappemonde':  return S+'<circle cx="12" cy="12" r="8.6" stroke="'+a+'"/><path d="M12 3.4c3.1 3 3.1 14.2 0 17.2M12 3.4c-3.1 3-3.1 14.2 0 17.2"/><path d="M3.7 9.3h16.6M3.7 14.7h16.6"/></svg>';
      /* silhouette réelle de la courbe de l'éléphant : bosse, creux, trompe */
      case 'elephant':    return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17.5C6.6 17.5 7.2 10 9.6 10S12.6 15.2 15.4 15.2C17.4 15.2 18.2 9.5 20 4.6" stroke="'+a+'"/></svg>';
      case 'convergence': return S+'<path d="M3.2 5.5h4.4M3.2 12h4.4M3.2 18.5h4.4"/><path d="M7.6 5.5C12.8 5.5 12.8 12 16.2 12" stroke="'+a+'"/><path d="M7.6 12h8.6" stroke="'+a+'"/><path d="M7.6 18.5C12.8 18.5 12.8 12 16.2 12" stroke="'+a+'"/><circle cx="18.4" cy="12" r="2.1" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'distribution':return S+'<path d="M3 20h18"/><path d="M5.5 20v-3.2M8.5 20v-9M11.5 20v-6M14.5 20v-3.4M17.5 20v-1.8"/><path d="M12.8 4.5V20" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'lorenz':      return S+'<path d="M4 20h16M4 20V4"/><path d="M4 20L20 4" stroke-dasharray="2.5 2" opacity=".55"/><path d="M4 20C11 20 16.5 15 20 4" stroke="'+a+'"/></svg>';
      /* plusieurs séries superposées, pilotées par un même sélecteur */
      case 'series':      return S+'<path d="M4 20h16M4 20V4"/><path d="M6 14.5l3.4-3.4 3.4 3.4 3.4-6.6 2.6 2.4" stroke="'+a+'"/><path d="M6 17.8c3.4-.6 6.2 1 12-2.6" opacity=".45"/><circle cx="9.4" cy="11.1" r="1.25" fill="'+a+'" stroke="none"/><circle cx="16.2" cy="7.9" r="1.25" fill="'+a+'" stroke="none"/></svg>';
      case 'croisement':  return S+'<path d="M4 20h16M4 20V4"/><path d="M6 17.5L19 7" stroke="'+a+'" stroke-dasharray="3 2"/><circle cx="8.5" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="13.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="10.5" r="1.2" fill="'+a+'" stroke="none"/><circle cx="18" cy="8" r="1.2" fill="'+a+'" stroke="none"/></svg>';
      case 'voile':       return S+'<path d="M2.6 12S6 6.8 12 6.8 21.4 12 21.4 12 18 17.2 12 17.2 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="2.5" stroke="'+a+'"/><path d="M4.5 19.5L19.5 4.5" stroke="'+a+'"/></svg>';
      case 'course':      return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17C9 17 13 13.5 20 5.5" stroke="'+a+'"/><path d="M4.5 17C9 17 13 15.5 20 13.5"/></svg>';
      case 'ratio':       return S+'<path d="M3 20h18"/><rect x="5.5" y="4.5" width="4.6" height="15.5" rx="1.2" stroke="'+a+'"/><rect x="13.9" y="15" width="4.6" height="5" rx="1.2"/></svg>';
      case 'ecart':       return S+'<path d="M3 20h18"/><path d="M4 7h16" stroke="'+a+'"/><path d="M4 12.6C9 12.6 13.5 16 20 17"/><path d="M12 7.6v6.9" stroke="var(--faint)"/><path d="M12 7.6l-1.5 1.7M12 7.6l1.5 1.7M12 14.5l-1.5-1.7M12 14.5l1.5-1.7" stroke="var(--faint)"/></svg>';
    }
    return S+'<circle cx="12" cy="12" r="8" stroke="'+a+'"/></svg>';
  }

  /* ───────── état ───────── */
  var LANG = CFG.langue_defaut || 'fr';
  try{ var sl=localStorage.getItem(PREFIXE+'_lang'); if(sl) LANG=sl; }catch(e){}
  var THEME=null;
  try{ var st=localStorage.getItem(PREFIXE+'_theme'); if(st) THEME=st; }catch(e){}
  if(!THEME) THEME = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', THEME);

  function T(){ return CFG.textes[LANG]; }

  function seed(){
    for(var i=0;i<N;i++){
      try{
        localStorage.setItem(STEPS[i].cle+'_theme', THEME);
        localStorage.setItem(STEPS[i].cle+'_lang',  LANG);
      }catch(e){}
    }
    try{ localStorage.setItem(PREFIXE+'_theme',THEME); localStorage.setItem(PREFIXE+'_lang',LANG); }catch(e){}
  }

  /* ───────── le fil ───────── */
  function carte(i){
    var d=T(), s=STEPS[i];
    var a=document.createElement('a');
    a.className='card'; a.href='#/'+(i+1);
    a.innerHTML='<span class="emb" style="color:'+tok(s.couleur)+'">'+emb(s.icone,s.couleur)+'</span>'+
      '<span class="cbody"><span class="idx">'+(i+1)+'</span>'+
      '<h3>'+d.cartes[i].titre+'</h3><p>'+d.cartes[i].resume+'</p>'+
      '<span class="go">'+d.nav_ouvrir+' →</span></span>';
    return a;
  }

  /* Une partie sans numéro est un seuil : elle ouvre la séance sans être
     comptée dans les parties. Le fil l'annonce par une étiquette, le bandeau
     par un repère discret placé avant les chiffres romains. */
  function estSeuil(p){ var P=PARTIES[p-1]; return !!P.seuil || !P.numero; }
  function marque(p){ return estSeuil(p) ? '◦' : PARTIES[p-1].numero; }
  function etiquette(p){
    var e=T().parties[p-1].etiquette;
    return e || (LANG==='en' ? 'Opening' : 'Ouverture');
  }

  function buildFil(){
    var d=T(), box=document.getElementById('parties');
    box.innerHTML='';
    for(var p=1;p<=NP;p++){
      var sec=document.createElement('section');
      sec.className='part'+(estSeuil(p)?' seuil':'');
      sec.style.setProperty('--pc', tok(PARTIES[p-1].couleur));
      var rang = estSeuil(p)
        ? '<span class="sn">'+etiquette(p)+'</span>'
        : '<span class="rn">'+PARTIES[p-1].numero+'</span>';
      var h='<div class="parthead">'+rang+
            '<h2>'+d.parties[p-1].titre+'</h2></div>'+
            '<p class="partlead">'+d.parties[p-1].chapo+'</p>'+
            '<div class="cards"></div>';
      sec.innerHTML=h;
      var grille=sec.querySelector('.cards');
      for(var i=0;i<N;i++) if(STEPS[i].partie===p) grille.appendChild(carte(i));
      box.appendChild(sec);
    }
  }

  /* ───────── bandeau de situation ───────── */
  function premierDe(p){ for(var j=0;j<N;j++) if(STEPS[j].partie===p) return j; return 0; }

  function buildNav(i){
    var d=T(), s=STEPS[i], cur=null,
        bar=document.getElementById('nparts'), box=document.getElementById('steps');
    document.documentElement.style.setProperty('--acc', tok(PARTIES[s.partie-1].couleur));
    document.getElementById('ncount').textContent=(i+1)+' / '+N;

    bar.innerHTML='';
    for(var p=1;p<=NP;p++){
      if(p===s.partie){
        var c=document.createElement('span');
        c.className='pcur';
        /* Séance à une seule partie : le repère n'oppose la partie à rien,
           il ne reste que son intitulé. */
        c.innerHTML=(NP>1?'<em>'+marque(p)+'</em>':'')+'<span>'+d.parties[p-1].titre+'</span>';
        c.setAttribute('aria-current','true');
        bar.appendChild(c);
      } else {
        var g=document.createElement('a');
        g.className='pgrp';
        g.href='#/'+(premierDe(p)+1);
        g.title=(estSeuil(p)?etiquette(p):PARTIES[p-1].numero)+' · '+d.parties[p-1].titre;
        g.textContent=marque(p);
        bar.appendChild(g);
      }
    }

    box.innerHTML='';
    for(var j=0;j<N;j++){
      if(STEPS[j].partie!==s.partie) continue;
      var a=document.createElement('a');
      a.className='stp'+(j===i?' on':'');
      a.href='#/'+(j+1);
      a.title=d.cartes[j].titre;
      a.innerHTML='<em>'+(j+1)+'</em><span>'+d.cartes[j].titre+'</span>';
      if(j===i){ a.setAttribute('aria-current','true'); cur=a; }
      box.appendChild(a);
    }
    /* le bandeau peut être encore masqué : on attend une frame pour mesurer */
    if(cur) requestAnimationFrame(function(){
      box.scrollLeft = Math.max(0, cur.offsetLeft - (box.clientWidth - cur.offsetWidth)/2);
    });
  }

  /* ───────── iframes ───────── */
  var host=document.getElementById('host'), frames={}, current=-1;

  /* Une iframe capte le clavier dès qu'on a cliqué dedans, et la coquille ne
     voit plus rien. On y relaie donc Échap et F — et seulement eux : les
     flèches appartiennent aux outils, qui s'en servent pour leurs propres
     étapes. Les iframes srcdoc héritent de notre origine, d'où l'accès. */
  function brancherClavier(fr){
    try{
      var doc=fr.contentDocument; if(!doc) return;
      doc.addEventListener('keydown', function(ev){
        if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
        if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
        else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
      });
    }catch(e){}
  }

  function syncFrame(fr){
    if(!fr) return;
    try{
      var doc=fr.contentDocument;
      if(!doc || !doc.documentElement) return;
      for(var n=0;n<2;n++){
        if(doc.documentElement.getAttribute('data-theme')===THEME) break;
        var tb=doc.getElementById('theme'); if(!tb) break; tb.click();
      }
      for(var m=0;m<2;m++){
        if((doc.documentElement.lang||'fr')===LANG) break;
        var lb=doc.getElementById('lang'); if(!lb) break; lb.click();
      }
    }catch(e){}
  }

  function showTool(i){
    var s=STEPS[i], d=T();
    document.body.classList.add('mode-tool');
    seed();
    if(!frames[s.fichier]){
      var fr=document.createElement('iframe');
      fr.setAttribute('title', d.cartes[i].titre);
      host.appendChild(fr);
      frames[s.fichier]=fr;
      fr.addEventListener('load', function(){ syncFrame(fr); brancherClavier(fr); });
      fr.srcdoc = TOOLS[s.fichier];
    } else {
      syncFrame(frames[s.fichier]);
    }
    for(var k in frames) frames[k].style.display = (k===s.fichier) ? 'block' : 'none';
    if(plein) montrerNav(1600);
    current=i;
    buildNav(i);
    var pb=document.getElementById('prev'), nb=document.getElementById('next');
    pb.disabled=(i===0); nb.disabled=(i===N-1);
    pb.title=d.nav_prec; nb.title=d.nav_suiv;
  }

  function showFil(){
    if(plein) setPlein(false);
    document.body.classList.remove('mode-tool');
    current=-1;
    window.scrollTo(0, window.__filScroll||0);
  }

  /* ───────── plein écran ───────── */
  var plein=false, minuterieNav=null, minuterieAstuce=null;

  function montrerNav(delaiMasquage){
    document.body.classList.add('nav-on');
    clearTimeout(minuterieNav);
    if(delaiMasquage) minuterieNav=setTimeout(function(){
      document.body.classList.remove('nav-on');
    }, delaiMasquage);
  }

  function demanderPleinEcran(){
    var el=document.documentElement;
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(f){ try{ var p=f.call(el); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }
  function quitterPleinEcran(){
    var actif=document.fullscreenElement||document.webkitFullscreenElement;
    if(!actif) return;
    var f=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(f){ try{ var p=f.call(document); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }

  function setPlein(v){
    if(plein===v) return;
    plein=v;
    document.body.classList.toggle('mode-plein', v);
    var b=document.getElementById('tplein'), d=T();
    b.textContent = v ? '⤡' : '⤢';
    b.title = v ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    if(v){
      demanderPleinEcran();
      montrerNav(2400);
      document.getElementById('pastille').textContent =
        (d.nav_plein_astuce||'Approchez du haut pour revoir la barre · Échap pour sortir');
      document.body.classList.add('astuce');
      clearTimeout(minuterieAstuce);
      /* l'astuce doit rester lisible après le retrait du bandeau, pas pendant */
      minuterieAstuce=setTimeout(function(){ document.body.classList.remove('astuce'); }, 6500);
    } else {
      quitterPleinEcran();
      clearTimeout(minuterieNav); clearTimeout(minuterieAstuce);
      document.body.classList.remove('nav-on','astuce');
    }
  }

  document.getElementById('tplein').addEventListener('click', function(){ setPlein(!plein); });
  document.getElementById('hotzone').addEventListener('mouseenter', function(){ montrerNav(0); });
  document.querySelector('.nav').addEventListener('mouseleave', function(){ if(plein) montrerNav(500); });
  /* Sortie par F11 ou par la touche Échap interceptée par le navigateur :
     on resynchronise la coquille sur l'état réel. */
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement||document.webkitFullscreenElement) && plein) setPlein(false);
    });
  });

  function route(){
    var h=(location.hash||'').replace(/^#\/?/,'');
    var n=parseInt(h,10);
    if(h && !isNaN(n) && n>=1 && n<=N){
      if(current===-1) window.__filScroll = window.pageYOffset||0;
      showTool(n-1);
    } else {
      showFil();
    }
  }
  window.addEventListener('hashchange', route);

  function go(i){
    if(i<0){ location.hash='#/fil'; return; }
    if(i>N-1) return;
    location.hash='#/'+(i+1);
  }
  document.getElementById('prev').addEventListener('click', function(){ if(current>0) go(current-1); });
  document.getElementById('next').addEventListener('click', function(){ if(current>-1 && current<N-1) go(current+1); });

  document.addEventListener('keydown', function(ev){
    if(current===-1) return;
    if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
    else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
    else if(ev.key==='ArrowLeft'  && current>0)   { go(current-1); }
    else if(ev.key==='ArrowRight' && current<N-1) { go(current+1); }
  });

  /* ───────── bascules ───────── */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', THEME);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleTheme(){ THEME=(THEME==='dark')?'light':'dark'; applyTheme(); }
  document.getElementById('theme').addEventListener('click', toggleTheme);
  document.getElementById('ttheme').addEventListener('click', toggleTheme);

  function applyLang(){
    var d=T();
    document.documentElement.lang=LANG;
    document.title = d.titre_onglet;
    document.getElementById('eyebrow').innerHTML = d.surtitre;
    document.getElementById('titre').textContent = d.titre;
    document.getElementById('seance').textContent = d.seance;
    document.getElementById('chapo').innerHTML = d.chapo;
    document.getElementById('pied').innerHTML = d.pied;
    document.getElementById('licence').innerHTML = d.licence;
    document.getElementById('homelbl').textContent = d.nav_fil;
    /* Remontée vers la page du cours : seulement si le manifeste la déclare.
       Une séance diffusée seule, sans page d'accueil à côté, n'affiche rien
       plutôt qu'un lien qui mènerait à une erreur. */
    var lien = CFG.lien_accueil, rm = document.getElementById('remonte'),
        ab = document.getElementById('accueilbtn');
    if(lien){
      rm.href = lien; ab.href = lien;
      rm.hidden = false; ab.hidden = false;
      document.getElementById('remontelbl').textContent = d.nav_accueil || 'Le cours';
      ab.title = d.nav_accueil || 'Le cours';
    } else {
      rm.hidden = true; ab.hidden = true;
    }
    var bp=document.getElementById('tplein');
    bp.title = plein ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    document.getElementById('langlbl').textContent = LANG.toUpperCase();
    document.getElementById('tlanglbl').textContent = LANG.toUpperCase();
    buildFil();
    if(current>-1) buildNav(current);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleLang(){
    var codes=Object.keys(CFG.textes);
    LANG = codes[(codes.indexOf(LANG)+1) % codes.length];
    applyLang();
  }
  document.getElementById('lang').addEventListener('click', toggleLang);
  document.getElementById('tlang').addEventListener('click', toggleLang);

  /* ───────── démarrage ───────── */
  seed();
  applyLang();
  route();
})();
</script>

</body>
</html>
