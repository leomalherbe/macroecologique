<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;
    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;
    --econ:#2A78D6;--eco:#2E8B57;--rms:#C08A00;--warn:#C0392B;--fish:#0E7C9B;
    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);
    --font-d:"Spectral","IBM Plex Sans",Georgia,serif;/* IBM Plex en second : Spectral n'a pas le grec, β et α y retomberaient sur Georgia */--font-b:"IBM Plex Sans",system-ui,sans-serif;--font-m:"IBM Plex Mono",ui-monospace,monospace;
  }
  :root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}
  body.mode-tool{overflow:hidden;}

  /* ───────── vue « fil » ───────── */
  .wrap{max-width:1080px;margin:0 auto;padding-block:28px 56px;padding-inline:20px;}
  header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .remonte{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-m);font-size:11.5px;color:var(--faint);text-decoration:none;margin:0 0 12px;padding:3px 0;}
  .remonte:hover{color:var(--ink);}
  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:400;margin:0 0 7px;text-wrap:pretty;}
  .eyebrow b{color:var(--fish);font-weight:500;}
  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.6vw,44px);line-height:1.03;margin:0;letter-spacing:-.015em;text-wrap:balance;}
  .seance{font-family:var(--font-d);font-weight:500;font-size:clamp(17px,2.1vw,21px);line-height:1.15;color:var(--muted);margin:7px 0 0;}
  .sub{color:var(--muted);font-size:15.5px;margin:14px 0 0;max-width:80ch;text-wrap:pretty;}
  .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}
  .toggles{display:flex;gap:8px;flex-shrink:0;}
  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}
  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}
  .tg:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--rms);outline-offset:2px;}

  .part{margin-top:40px;}
  .parthead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px;}
  .parthead .rn{font-family:var(--font-m);font-size:12px;font-weight:600;color:#fff;background:var(--pc);border-radius:7px;padding:3px 10px;line-height:1;flex-shrink:0;}
  /* Une partie-seuil ouvre la séance sans prendre de rang : étiquette ajourée
     plutôt que badge plein, pour qu'elle ne se lise pas comme une partie I. */
  .parthead .sn{font-family:var(--font-m);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--pc);background:transparent;border:1px solid var(--pc);border-radius:7px;padding:3px 9px;line-height:1;flex-shrink:0;}
  .parthead h2{font-family:var(--font-d);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance;}
  .partlead{color:var(--muted);font-size:14px;margin:10px 0 16px;max-width:84ch;text-wrap:pretty;}
  .partlead b{color:var(--ink);font-weight:600;} .partlead i{font-family:var(--font-d);font-style:italic;}

  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media (max-width:680px){.cards{grid-template-columns:1fr;}}
  a.card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;transition:border-color .15s,transform .15s;}
  a.card:hover{border-color:var(--faint);transform:translateY(-1px);}
  .emb{flex-shrink:0;width:46px;height:46px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .emb svg{width:26px;height:26px;}
  .cbody{flex:1;min-width:0;}
  .cbody .idx{font-family:var(--font-m);font-size:11px;color:var(--faint);}
  .cbody h3{font-family:var(--font-d);font-weight:600;font-size:16.5px;margin:1px 0 3px;line-height:1.15;text-wrap:balance;}
  .cbody p{font-size:12.8px;color:var(--muted);margin:0;text-wrap:pretty;}
  .cbody .go{font-family:var(--font-m);font-size:11.5px;color:var(--fish);font-weight:500;margin-top:7px;display:inline-block;}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px;text-align:center;text-wrap:balance;}
  footer p{margin:0 0 7px;} footer p:last-child{margin-bottom:0;}
  footer a{color:var(--muted);text-decoration:underline;text-underline-offset:2px;}
  footer a:hover{color:var(--ink);}
  .lic{max-width:62ch;margin-inline:auto;text-wrap:pretty;line-height:1.6;}
  .lic a{white-space:nowrap;}

  /* ───────── vue « outil » ───────── */
  #view-tool{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);}
  body.mode-tool #view-tool{display:flex;}
  body.mode-tool #view-fil{display:none;}
  .nav{display:flex;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;}
  .navrow{display:flex;align-items:center;gap:10px;padding:7px 14px;}
  .navrow.r1{min-height:46px;}
  .nbtn{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:7px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1;}
  .nbtn:hover:not([disabled]){color:var(--ink);border-color:var(--faint);}
  .nbtn[disabled]{opacity:.35;cursor:default;}
  .nbtn.home{color:var(--ink);font-weight:500;}
  .nparts{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding-inline:4px;}
  .pcur{display:inline-flex;align-items:baseline;gap:9px;min-width:0;font-family:var(--font-d);font-weight:600;font-size:15.5px;line-height:1.15;white-space:nowrap;}
  .pcur em{font-family:var(--font-m);font-style:normal;font-size:12px;font-weight:600;color:var(--acc);flex-shrink:0;}
  .pcur span{overflow:hidden;text-overflow:ellipsis;}
  .ngroup{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .ncount{font-family:var(--font-m);font-size:11.5px;color:var(--faint);min-width:46px;text-align:center;}

  .navrow.r2{gap:4px;border-top:1px solid var(--line);padding-block:5px;overflow-x:auto;scrollbar-width:none;background:var(--panel);}
  .navrow.r2::-webkit-scrollbar{display:none;}
  .stp{display:inline-flex;align-items:baseline;gap:7px;flex:0 0 auto;min-width:0;max-width:260px;padding:5px 10px;border-radius:8px;border:1px solid transparent;text-decoration:none;color:var(--faint);font-size:12.5px;line-height:1.2;white-space:nowrap;}
  .stp em{font-family:var(--font-m);font-style:normal;font-size:10.5px;flex-shrink:0;opacity:.8;}
  .stp span{overflow:hidden;text-overflow:ellipsis;}
  .stp:hover{color:var(--ink);background:var(--surface);}
  .stp.on{color:var(--ink);font-weight:600;background:var(--surface);border-color:var(--line);box-shadow:inset 2px 0 0 var(--acc);max-width:none;}
  .stp.on em{color:var(--acc);opacity:1;}
  .pgrp{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);text-decoration:none;font-family:var(--font-m);font-size:11px;font-weight:600;color:var(--faint);line-height:1;}
  .pgrp:hover{color:var(--ink);background:var(--surface);border-color:var(--faint);}

  .host{flex:1;position:relative;min-height:0;}
  .host iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);}

  /* ───────── plein écran ─────────
     Le bandeau se retire au-dessus du bord et revient dès que le pointeur
     approche du haut. La bande de déclenchement #hotzone appartient à la page
     hôte : indispensable, car une iframe absorbe les mouvements de souris et
     la coquille ne les verrait jamais. */
  body.mode-plein .nav{position:absolute;top:0;left:0;right:0;z-index:6;
    transform:translateY(-100%);transition:transform .18s ease;box-shadow:0 8px 26px rgba(0,0,0,.20);}
  body.mode-plein.nav-on .nav{transform:none;}
  #hotzone{display:none;}
  body.mode-plein #hotzone{display:block;position:absolute;top:0;left:0;right:0;height:6px;z-index:7;}
  body.mode-plein.nav-on #hotzone{display:none;}
  .pastille{display:none;}
  body.mode-plein .pastille{display:block;position:absolute;top:10px;right:14px;z-index:5;
    font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;color:var(--faint);
    background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 9px;
    opacity:0;transition:opacity .4s ease;pointer-events:none;}
  body.mode-plein.astuce .pastille{opacity:.92;}
  @media (prefers-reduced-motion:reduce){
    body.mode-plein .nav{transition:none;} .pastille{transition:none;}
  }
  @media (max-width:640px){
    .pcur{font-size:13.5px;}
    .nbtn{padding:7px 8px;} .ncount{min-width:38px;}
    .nbtn.home span{display:none;}
    .stp{max-width:200px;}
    .navrow{padding-inline:10px;}
  }
</style>

l<\/b>. Les mêmes échanges, mesurés en matières, en terres, en énergie et en heures de travail, montrent enfin un déséquilibre que les prix ne disaient pas."}], "cartes": [{"titre": "Lire la balance des paiements", "resume": "Exportations, importations, balance commerciale, revenus, solde courant, puis flux de capitaux et solde financier : la balance se construit en <b>huit étapes<\/b>, une définition à la fois, sur un pays fictif. On découvre ensuite que le compte courant et le compte financier sont des miroirs, avant de le vérifier sur les données réelles des <b>États-Unis depuis 1970<\/b> et de la <b>France depuis 2010<\/b>."}, {"titre": "Des flux aux stocks : la position extérieure", "resume": "Partez d'une position nulle et d'un commerce équilibré, puis exportez ou importez davantage : chaque solde courant s'ajoute à la richesse extérieure, année après année. Ces excédents et ces déficits se traduisent en mouvements de capitaux, puis le <b>change<\/b> et le prix des actifs viennent déformer le stock. États-Unis et Chine, le privilège exorbitant, et six configurations historiques, du rentier d'avant 1914 à la Chine d'aujourd'hui."}, {"titre": "Trois soldes, et le reste du monde", "resume": "L'identité se démontre en <b>trois lignes<\/b> : solde privé, solde public et solde extérieur s'annulent. Deux exercices à résoudre avant de révéler la réponse, puis un mode libre où l'on choisit l'inconnue. Les soldes français depuis 1980 montrent l'identité année par année, et un miroir à deux économies en tire la leçon : si un pays veut tout épargner, un autre doit s'endetter."}, {"titre": "Centre, périphérie et échange inégal", "resume": "Dégradez les <b>termes de l'échange<\/b> et comptez les caisses qu'il faut exporter pour payer les mêmes importations. Un siècle de prix agricoles relatifs illustre Prebisch et Singer ; les élasticités de la loi de <b>Thirlwall<\/b> bornent la croissance de la périphérie. Pour finir, la face physique de l'échange : matières, terres, énergie et travail, où un échange équilibré en valeur ne l'est plus du tout."}], "pied": "Parcours du cours de macroéconomie écologique — chaque carte ouvre l'outil interactif correspondant.", "licence": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — réutilisation et adaptation libres à des fins non commerciales, avec attribution et sous la même licence.", "nav_fil": "Le fil", "nav_accueil": "Le cours", "nav_ouvrir": "Ouvrir l’outil", "nav_prec": "Outil précédent", "nav_suiv": "Outil suivant", "nav_plein": "Plein écran (F)", "nav_plein_sortie": "Quitter le plein écran (Échap)", "nav_plein_astuce": "Approchez du haut pour revoir la barre · Échap pour sortir"}, "en": {"titre_onglet": "Ecological macroeconomics — Session 8: the thread of the course", "surtitre": "<b>Ecological macroeconomics<\/b> · Léo Malherbe · KEDGE Business School", "titre": "The thread of the course", "seance": "Session 8 — The open economy and global imbalances", "chapo": "Four movements. First, how to read the <b>balance of payments<\/b>: every transaction is recorded twice, and the current account has the financial account as its mirror. Then from flows to stocks — the <b>international investment position<\/b>, which prices and the exchange rate distort as much as flows do. The sectoral balances identity of session 6 then gains a third term, the <b>rest of the world<\/b>: one country's imbalances are another's. We end on the relations between <b>centre and periphery<\/b> — terms of trade, growth bounded by the balance of payments, and ecologically unequal exchange. Four interactive tools, in the order of the thread: each opens right here, and one click brings you back.", "parties": [{"titre": "Every transaction is recorded twice", "chapo": "The balance of payments records every payment between a country's residents and the rest of the world over a year. It is not a balance sheet but a statement of <b>flows<\/b>, and it follows a double-entry rule: whatever a country buys abroad, it must pay for. The <b>current account<\/b> balance therefore has the <b>financial account<\/b> as its exact mirror — a deficit on one is a surplus on the other, the same fact seen from either side."}, {"titre": "A country's external wealth", "chapo": "One year of deficit says nothing; fifteen accumulated years say a great deal. Current account balances add up into a stock: the <b>net international investment position<\/b>, what a country owns abroad minus what it owes there. But that stock does not move only with the flows: the <b>exchange rate<\/b> and asset prices distort it, sometimes more. Hence two surprises — the world's largest debtor earns net positive income, and the largest creditor pays some out."}, {"titre": "Back to sectoral balances", "chapo": "The identity of session 6 was incomplete: it assumed a closed economy. In an open economy a third sector enters the account — the <b>rest of the world<\/b> — and the three balances still sum to zero. The consequence is severe: one country's imbalances are exactly another's, and not every country can run a surplus at once. If one wants to save, another must borrow."}, {"titre": "Who gains from trade", "chapo": "What remains is what the traded goods are worth. Countries that mostly export primary products see their international purchasing power erode — the <b>Prebisch-Singer<\/b> hypothesis — and their growth bounded by their balance of payments, which <b>Thirlwall<\/b>'s law formalises. The same trade, measured in materials, land, energy and hours of labour, finally reveals an imbalance that prices did not show."}], "cartes": [{"titre": "Reading the balance of payments", "resume": "Exports, imports, the trade balance, income, the current account balance, then capital flows and the financial balance: the account is built in <b>eight steps<\/b>, one definition at a time, on a fictional country. You then discover that the current and financial accounts mirror each other, before checking it on real data for the <b>United States since 1970<\/b> and <b>France since 2010<\/b>."}, {"titre": "From flows to stocks: the international investment position", "resume": "Start from a zero position and balanced trade, then export or import more: each current account balance adds to external wealth, year after year. These surpluses and deficits translate into capital movements, and then the <b>exchange rate<\/b> and asset prices distort the stock. The United States and China, the exorbitant privilege, and six historical configurations, from the pre-1914 rentier to China today."}, {"titre": "Three balances, and the rest of the world", "resume": "The identity is proved in <b>three lines<\/b>: private, public and external balances cancel out. Two exercises to solve before revealing the answer, then a free mode where you choose the unknown. France's balances since 1980 show the identity year by year, and a two-economy mirror draws the lesson: if one country wants to save it all, another must borrow."}, {"titre": "Centre, periphery and unequal exchange", "resume": "Worsen the <b>terms of trade<\/b> and count the crates that must be exported to pay for the same imports. A century of relative agricultural prices illustrates Prebisch and Singer; the elasticities of <b>Thirlwall<\/b>'s law bound growth in the periphery. Finally, the physical face of trade: materials, land, energy and labour, where an exchange balanced in value is not balanced at all."}], "pied": "Course path for ecological macroeconomics — each card opens the matching interactive tool.", "licence": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — free to reuse and adapt for non-commercial purposes, with attribution and under the same licence.", "nav_fil": "The thread", "nav_accueil": "The course", "nav_ouvrir": "Open the tool", "nav_prec": "Previous tool", "nav_suiv": "Next tool", "nav_plein": "Full screen (F)", "nav_plein_sortie": "Exit full screen (Esc)", "nav_plein_astuce": "Move to the top edge to bring the bar back · Esc to exit"}}}</script>

tom:4px;}\n.note{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:13px;color:var(--muted);text-wrap:pretty;margin-top:14px;}\n.note .nh{font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:4px;}\n.read{font-size:13.6px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-top:10px;min-height:2.8em;text-wrap:pretty;}\nfooter{margin-top:22px;color:var(--faint);font-size:11.5px;text-align:center;text-wrap:balance;}\nfooter i{font-family:var(--font-d);}\nfooter a{color:var(--muted);}\nsvg text{font-family:var(--font-b);}\n.ax line{stroke:var(--grid);} .ax text{fill:var(--faint);font-size:10.5px;font-family:var(--font-m);}\n.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y;}\n.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:6px;}\n.legend span{display:inline-flex;align-items:center;gap:6px;}\n.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;}\n.legend i.sq{height:10px;width:10px;border-radius:2px;}\n.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important;}\n.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px;}\n.dots{display:flex;gap:5px;flex-wrap:wrap;}\n.dots button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--font-m);font-size:11px;cursor:pointer;padding:0;}\n.dots button.on{background:var(--ACC);border-color:var(--ACC);color:#fff;}\n.dots button.done{color:var(--ink);border-color:var(--faint);}\n.steptitle{font-family:var(--font-d);font-weight:600;font-size:16.5px;color:var(--ink);margin:0 0 4px;}\n.steptext{font-size:13.6px;color:var(--muted);margin:0 0 12px;max-width:88ch;text-wrap:pretty;}\n.kbd{font-family:var(--font- ]},{sel:12,band:[12,12]},{sel:14,band:[13,15]}]};\nvar I18N={\nfr:{title:'Lire la balance des paiements',eyebrow:'Séance 8 · Économie ouverte',h1:'Lire la balance des paiements',\nsub:'La balance des paiements enregistre des <b>flux<\/b>, pas des stocks : tous les paiements entre les résidents d\\'un pays (ménages, entreprises, administrations) et le reste du monde au cours d\\'une période, en général une année.',\ns1h:'Des exportations au solde financier',\ns1d:'Un pays fictif, une année, en milliards d\\'euros. On part de ce qui se vend et s\\'achète à l\\'étranger, on remonte jusqu\\'au solde courant, puis on passe aux flux de capitaux. Huit étapes, une définition à la fois.',\nprev:'←',next:'Suivant →',kbd:'ou ← →',\nwl:['X','IM','X − IM','r<sub>f<\/sub>','Tr<sub>f<\/sub>','S<sub>c<\/sub>','entrées','sorties','S<sub>f<\/sub>'],\nwlt:['X','IM','X − IM','rf','Trf','Sc','entr.','sort.','Sf'],\ngrpA:'Compte courant',grpB:'Compte financier',\nled:['Exportations X','Importations IM','Balance commerciale X − IM','Revenus primaires r<sub>f<\/sub>','Revenus secondaires Tr<sub>f<\/sub>','Solde courant S<sub>c<\/sub>','Entrées de capitaux','Sorties de capitaux','Solde financier S<sub>f<\/sub>'],\nst:[['Les exportations','Les <b>exportations<\/b> (X) sont les biens et services que les résidents vendent à des non-résidents. Le paiement vient de l\\'étranger : il <b>entre<\/b> dans le pays. Ici, 100.'],\n['Les importations','Les <b>importations<\/b> (IM) sont les biens et services que les résidents achètent à des non-résidents. Le paiement <b>sort<\/b> du pays. Ici, 112.'],\n['La balance commerciale','La <b>balance commerciale<\/b> est la différence X − IM. Positive, c\\'est un <b>excédent commercial<\/b> : le pays vend plus qu\\'il n\\'achète. Négative, c\\'est un <b>déficit commercial<\/b>. Ici, 100 − 112 = −12.'],\n['Les revenus primaires','Le pays ne fait pas que commercer : il possède des actifs à l\\'étranger, et l\\'étranger en possède chez lui. Les <b>revenus primaires<\/b> (r<sub>f<\/sub>) sont les revenus du capital et du travail reçus de l\\'étranger, moins ceux qui lui sont versés : intérêts, dividendes, loyers, profits, salaires. Ici, +7.'],\n['Les revenus secondaires','Les <b>revenus secondaires<\/b> (Tr<sub>f<\/sub>) sont les transferts sans contrepartie : on donne sans rien recevoir en échange. Ici, −3 : le pays transfère plus qu\\'il ne reçoit.'],\n['Le solde courant','On additionne : <b>solde courant<\/b> S<sub>c<\/sub> = (X − IM) + r<sub>f<\/sub> + Tr<sub>f<\/sub> = −12 + 7 − 3 = <b>−8<\/b>. Il mesure ce que le pays gagne moins ce qu\\'il dépense dans ses échanges avec le reste du monde. En déficit, le pays dépense plus qu\\'il ne gagne : il faut financer l\\'écart.'],\n['Les flux de capitaux','Au-delà des biens, des services et des revenus, des <b>actifs<\/b> circulent : actions, obligations, entreprises, prêts, dépôts. Quand des non-résidents achètent des actifs du pays ou lui prêtent, ce sont des <b>entrées de capitaux<\/b> (30). Quand des résidents achètent des actifs étrangers, ce sont des <b>sorties de capitaux<\/b> (22).'],\n['Le solde financier','Le <b>solde financier<\/b> S<sub>f<\/sub> = entrées − sorties = 30 − 22 = <b>+8<\/b>. Positif, ce sont des <b>entrées nettes de capitaux<\/b> : le reste du monde accumule des créances sur le pays, qui s\\'endette (net) de 8. Ce +8 répond exactement au −8 du solde courant. Ce n\\'est pas un hasard : c\\'est l\\'objet de la section suivante.']],\nex:[[['Bien','Un viticulteur vend du vin à un importateur américain'],['Service','Des touristes étrangers dorment dans les hôtels du pays'],['Service','Un bureau d\\'études conseille une entreprise allemande']],\n[['Bien','Un distributeur importe des smartphones coréens'],['Bien','Le pays achète du gaz norvégien'],['Service','Des résidents passent leurs vacances en Espagne']],\n[['+','Excédent commercial : X > IM'],['−','Déficit commercial : X < IM']],\n[['Reçu','Une filiale à l\\'étranger verse des dividendes à sa maison mère'],['Reçu','Un fonds du pays touche les intérêts d\\'obligations étrangères'],['Reçu','Des frontaliers rapportent le salaire gagné à l\\'étranger'],['Versé','Des actionnaires étrangers touchent les dividendes d\\'entreprises du pays']],\n[['Versé','Aide publique au développement'],['Versé','Envois de fonds des travailleurs immigrés à leur famille'],['Versé','Contribution au budget de l\\'Union européenne'],['Reçu','Subventions agricoles versées par l\\'Union européenne']],\n[['+','Excédent courant : le pays gagne plus qu\\'il ne dépense, il a de quoi prêter au reste du monde'],['−','Déficit courant : le pays dépense plus qu\\'il ne gagne, il doit emprunter ou vendre des actifs']],\n[['Entrée','Une entreprise étrangère construit une usine dans le pays'],['Entrée','Un fonds de pension étranger achète des obligations de l\\'État (portefeuille)'],['Entrée','Une banque étrangère prête à une entreprise du pays'],['Sortie','Une entreprise du pays rachète une usine en Espagne'],['Sortie','Un ménage achète des actions américaines (portefeuille)'],['Sortie','La banque centrale achète des dollars (avoirs de réserve)']],\n[['+','Entrées nettes : le pays emprunte au reste du monde, il est emprunteur net'],['−','Sorties nettes : le pays prête au reste du monde, il est prêteur net']]],\nconvh:'Conventions de signe',\nconv:'Ici, le solde financier est compté en <b>entrées nettes de capitaux<\/b> : positif, le pays emprunte (net) au reste du monde. Le FMI, Eurostat et la Banque de France publient le compte financier dans l\\'autre sens (acquisitions nettes d\\'actifs moins accroissement net des engagements) : un emprunteur net y affiche un solde financier <b>négatif<\/b>. Avant d\\'utiliser une base de données, vérifiez la convention.',\ns2h:'Deux comptes, un miroir',\ns2d:'Parce que chaque transaction s\\'écrit deux fois, la somme du compte courant et du compte financier est toujours nulle. Un déficit courant a pour contrepartie un excédent financier de même valeur absolue, et inversement.',\nideq:'(X − IM) + r<sub>f<\/sub> + Tr<sub>f<\/sub> = − S<sub>f<\/sub>',\ncards:[['Compte courant','Biens et services','(X − IM) : exportations et importations, y compris les dépenses des touristes.'],['Compte courant','Revenus primaires r<sub>f<\/sub>','Revenus du capital et du travail reçus de l\\'étranger ou versés à l\\'étranger : intérêts, dividendes, loyers, profits. Solde positif ou négatif.'],['Compte courant','Revenus secondaires Tr<sub>f<\/sub>','Transferts sans contrepartie : aide publique au développement, aide humanitaire des ONG, envois de fonds des immigrés.'],['Compte financier','Investissements directs','Prise de participation d\\'au moins 10 % : construction d\\'une usine, rachat d\\'une entreprise étrangère.'],['Compte financier','Portefeuille','Achats d\\'actions (moins de 10 % du capital) et d\\'obligations, sans influence sur la gestion de l\\'émetteur.'],['Compte financier','Avoirs de réserve','Devises et actifs achetés ou vendus par la banque centrale pour peser sur le taux de change.']],\ncaslider:'Solde courant (Md)',\ncaDef:'<b>Déficit courant de {a}<\/b> : le pays reçoit {a} d\\'<b>entrées nettes de capitaux<\/b>. Il accumule des engagements envers le reste du monde pour financer ce déficit : il est <b>emprunteur net<\/b>. En 2024, c\\'est le cas des États-Unis et de la France.',\ncaSur:'<b>Excédent courant de {a}<\/b> : le pays enregistre {a} de <b>sorties nettes de capitaux<\/b>. Il accumule des créances sur le reste du monde pour recycler son excédent : il est <b>prêteur net<\/b>. En 2024, c\\'est le cas de la Chine et de l\\'Allemagne.',\ncaZero:'Compte courant équilibré : le compte financier l\\'est aussi.',\nmirCA:'Compte courant',mirFA:'Compte financier',\npracth:'Dans les données',\npract:'Pour retrouver l\\'égalité dans les statistiques, deux termes s\\'ajoutent : le <b>compte de capital<\/b>, petit (remises de dettes, aides à l\\'investissement, cessions de marques ou de licences), et les <b>erreurs et omissions nettes<\/b>, un résidu statistique qui recueille ce que les sources n\\'ont pas su saisir.',\ns3h:'Deux pays au miroir : les États-Unis et la France',\ns3d:'Le compte courant et le compte financier, avec les deux termes d\\'ajustement. Le compte financier est présenté en entrées nettes de capitaux : il est le reflet du compte courant. Choisissez un pays, suivez les étapes, puis survolez ou touchez le graphique pour lire une année.',\nctry:{us:'États-Unis, 1970-2024',fr:'France, 2010-2025'},\nusk:'étapes : ← →',\nlg:['Compte courant','Compte financier (entrées nettes)','Compte de capital','Erreurs et omissions'],\nsteps:{us:[['Vue d\\'ensemble','Pendant cinquante ans, les deux courbes se répondent en miroir. Le petit écart qui les sépare, ce sont les erreurs et omissions, parfois plus grandes que le compte de capital.'],\n['Les années 1970 : l\\'équilibre','Le compte courant oscille autour de zéro. Les États-Unis vendent encore à peu près autant au reste du monde qu\\'ils lui achètent.'],\n['1983-1987 : le premier grand déficit','Dollar fort, déficit budgétaire en hausse : le déficit courant atteint 161 Md$ en 1987, et les capitaux étrangers affluent d\\'autant. On parle alors des « déficits jumeaux ».'],\n['1997-2006 : la grande divergence','Le déficit courant se creuse jusqu\\'à 817 Md$ en 2006, environ 6 % du PIB. Le reste du monde, Chine en tête, place son épargne en actifs américains : le compte financier monte en miroir.'],\n['2009 : la crise réduit le déficit','La récession fait chuter les importations : le déficit courant revient à 380 Md$, les entrées nettes de capitaux tombent à 239 Md$. Les erreurs et omissions, 146 Md$, comblent l\\'écart.'],\n['2024 : un record','Déficit courant de 1 185 Md$, record historique, environ 4 % du PIB ; entrées nettes de capitaux de 1 129 Md$. Le marché américain absorbe la production du monde, et le monde achète des actifs en dollars.']],\nfr:[['Vue d\\'ensemble','Depuis 2010, le compte courant français est presque toujours en déficit, de 8 à 54 Md€. Derrière ce solde : un déficit chronique des biens, compensé en partie par des excédents de services et, surtout, de revenus primaires, souvent supérieurs à 45 Md€ par an : les entreprises françaises détiennent beaucoup d\\'actifs rentables à l\\'étranger. Le compte financier lui répond en miroir, sur des montants dix fois plus petits qu\\'aux États-Unis.'],\n['La tendance longue : des déficits financés par des entrées de capitaux','De 2010 à 2025, le compte courant est en déficit 14 années sur 16, pour environ 255 Md€ au total. En face, le pays enregistre des entrées nettes de capitaux presque chaque année : le reste du monde accumule des créances sur la France, qui finance ainsi ses déficits courants.'],\n['2019 et 2021 : de rares excédents','Le compte courant passe en excédent : +12,5 Md€ en 2019, +9,0 Md€ en 2021. Le compte financier enregistre en 2021 des sorties nettes de 4,6 Md€ : la France prête au reste du monde.'],\n['2020 : la pandémie','Les exportations s\\'effondrent, notamment l\\'aéronautique et le tourisme : déficit courant de 37,5 Md€, financé par 49,5 Md€ d\\'entrées nettes de capitaux.'],\n['2022 : le choc énergétique','La flambée des prix de l\\'énergie porte le déficit des biens à 137 Md€ et le déficit courant à 53,9 Md€, un record sur la période ; entrées nettes de capitaux : 57,7 Md€.'],\n['2023-2025 : vers l\\'équilibre','Après le record de 2022, le déficit courant se réduit : 26,3 Md€ en 2023, 9,3 Md€ en 2024, 11,6 Md€ en 2025. Le compte financier se rapproche lui aussi de l\\'équilibre : 8,2 Md€ d\\'entrées nettes en 2024, 8,6 Md€ de sorties nettes en 2025.']]},\nyr:'<b>{y}<\/b> · compte courant {ca} · compte financier {fa} · compte de capital {ka} · erreurs et omissions {er} <span style=\"color:var(--faint)\">({u})<\/span>',\nunit:{us:'Md$',fr:'Md€'},\nyr0:'Survolez ou touchez le graphique pour lire une année.',\nl3h:'Ne pas juger un poste à son signe',\nl3:'Toute économie, riche ou pauvre, enregistre des débits et des crédits strictement égaux. Un déficit commercial n\\'est pas en soi une perte, un excédent financier n\\'est pas en soi une richesse : ce sont les deux faces des mêmes échanges de biens, de services et d\\'actifs. Ce qui compte, c\\'est le système qu\\'ils dessinent : comment l\\'économie s\\'insère dans les échanges mondiaux, et qui finance qui.',\nfoot:'Sources : FMI, base de données de la balance des paiements (BPM6), et BEA pour les États-Unis ; Banque de France, rapports annuels sur la balance des paiements (2020, 2022 et 2025) pour la France, chaque année prise dans le rapport le plus récent qui la détaille ; erreurs et omissions de 2023 à 2025 calculées par différence. Compte financier présenté en entrées nettes, de signe opposé à la convention du FMI.'},\nen:{title:'Reading the balance of payments',eyebrow:'Session 8 · The open economy',h1:'Reading the balance of payments',\nsub:'The balance of payments records <b>flows<\/b>, not stocks: every payment between the residents of a country (households, firms, government) and the rest of the world over a period, usually a year.',\ns1h:'From exports to the financial account',\ns1d:'A fictitious country, one year, in billions of euros. We start from what is sold and bought abroad, work up to the current account, then turn to capital flows. Eight steps, one definition at a time.',\nprev:'←',next:'Next →',kbd:'or ← →',\nwl:['X','IM','X − IM','r<sub>f<\/sub>','Tr<sub>f<\/sub>','S<sub>c<\/sub>','inflows','outflows','S<sub>f<\/sub>'],\nwlt:['X','IM','X − IM','rf','Trf','Sc','in','out','Sf'],\ngrpA:'Current account',grpB:'Financial account',\nled:['Exports X','Imports IM','Trade balance X − IM','Primary income r<sub>f<\/sub>','Secondary income Tr<sub>f<\/sub>','Current account S<sub>c<\/sub>','Capital inflows','Capital outflows','Financial account S<sub>f<\/sub>'],\nst:[['Exports','<b>Exports<\/b> (X) are the goods and services residents sell to non-residents. Payment comes from abroad: it <b>flows into<\/b> the country. Here, 100.'],\n['Imports','<b>Imports<\/b> (IM) are the goods and services residents buy from non-residents. Payment <b>flows out<\/b> of the country. Here, 112.'],\n['The trade balance','The <b>trade balance<\/b> is the difference X − IM. Positive, it is a <b>trade surplus<\/b>: the country sells more than it buys. Negative, it is a <b>trade deficit<\/b>. Here, 100 − 112 = −12.'],\n['Primary income','A country does more than trade: it owns assets abroad, and the rest of the world owns assets in it. <b>Primary income<\/b> (r<sub>f<\/sub>) is the income on capital and labour received from abroad, minus what is paid abroad: interest, dividends, rents, profits, wages. Here, +7.'],\n['Secondary income','<b>Secondary income<\/b> (Tr<sub>f<\/sub>) is transfers with no counterpart: something is given and nothing received in return. Here, −3: the country transfers more than it receives.'],\n['The current account','Add it up: the <b>current account<\/b> S<sub>c<\/sub> = (X − IM) + r<sub>f<\/sub> + Tr<sub>f<\/sub> = −12 + 7 − 3 = <b>−8<\/b>. It measures what the country earns minus what it spends in its dealings with the rest of the world. In deficit, the country spends more than it earns: the gap has to be financed.'],\n['Capital flows','Beyond goods, services and income, <b>assets<\/b> change hands: shares, bonds, companies, loans, deposits. When non-residents buy domestic assets or lend to the country, these are <b>capital inflows<\/b> (30). When residents buy foreign assets, these are <b>capital outflows<\/b> (22).'],\n['The financial account','The <b>financial account<\/b> S<sub>f<\/sub> = inflows − outflows = 30 − 22 = <b>+8<\/b>. Positive, these are <b>net capital inflows<\/b>: the rest of the world accumulates claims on the country, which borrows (net) 8. This +8 exactly answers the −8 of the current account. It is no coincidence: that is the subject of the next section.']],\nex:[[['Good','A winegrower sells wine to a US importer'],['Service','Foreign tourists stay in domestic hotels'],['Service','An engineering firm advises a German company']],\n[['Good','A retailer imports Korean smartphones'],['Good','The country buys Norwegian gas'],['Service','Residents go on holiday in Spain']],\n[['+','Trade surplus: X > IM'],['−','Trade deficit: X < IM']],\n[['Received','A subsidiary abroad pays dividends to its parent company'],['Received','A domestic fund earns interest on foreign bonds'],['Received','Cross-border workers bring home wages earned abroad'],['Paid','Foreign shareholders receive dividends from domestic companies']],\n[['Paid','Official development assistance'],['Paid','Immigrant workers\\' remittances to their families'],['Paid','Contribution to the European Union budget'],['Received','Farm subsidies paid by the European Union']],\n[['+','Current account surplus: the country earns more than it spends and can lend to the rest of the world'],['−','Current account deficit: the country spends more than it earns and must borrow or sell assets']],\n[['Inflow','A foreign firm builds a factory in the country'],['Inflow','A foreign pension fund buys government bonds (portfolio)'],['Inflow','A foreign bank lends to a domestic company'],['Outflow','A domestic firm buys a factory in Spain'],['Outflow','A household buys US shares (portfolio)'],['Outflow','The central bank buys dollars (reserve assets)']],\n[['+','Net inflows: the country borrows from the rest of the world, it is a net borrower'],['−','Net outflows: the country lends to the rest of the world, it is a net lender']]],\nconvh:'Sign conventions',\nconv:'Here the financial account is counted as <b>net capital inflows<\/b>: positive means the country borrows (net) from the rest of the world. The IMF, Eurostat and the Banque de France publish the financial account the other way round (net acquisition of assets minus net incurrence of liabilities): a net borrower shows a <b>negative<\/b> financial account there. Check the convention before using a database.',\ns2h:'Two accounts, one mirror',\ns2d:'Because every transaction is written twice, the current account and the financial account always sum to zero. A current account deficit has as its counterpart a financial account surplus of the same absolute value, and vice versa.',\nideq:'(X − IM) + r<sub>f<\/sub> + Tr<sub>f<\/sub> = − S<sub>f<\/sub>',\ncards:[['Current account','Goods and services','(X − IM): exports and imports, including tourist spending.'],['Current account','Primary income r<sub>f<\/sub>','Income on capital and labour received from or paid abroad: interest, dividends, rents, profits. Positive or negative balance.'],['Current account','Secondary income Tr<sub>f<\/sub>','Transfers with no counterpart: official development assistance, humanitarian aid from NGOs, migrants\\' remittances.'],['Financial account','Direct investment','A stake of at least 10%: building a factory, buying a foreign company.'],['Financial account','Portfolio','Purchases of shares (under 10% of the equity) and bonds, with no influence on the issuer\\'s management.'],['Financial account','Reserve assets','Foreign currency and assets bought or sold by the central bank to influence the exchange rate.']],\ncaslider:'Current account balance (bn)',\ncaDef:'<b>Current account deficit of {a}<\/b>: the country receives {a} of <b>net capital inflows<\/b>. It accumulates liabilities to the rest of the world to finance the deficit: it is a <b>net borrower<\/b>. In 2024 this is the case of the United States and France.',\ncaSur:'<b>Current account surplus of {a}<\/b>: the country records {a} of <b>net capital outflows<\/b>. It accumulates claims on the rest of the world to recycle its surplus: it is a <b>net lender<\/b>. In 2024 this is the case of China and Germany.',\ncaZero:'Balanced current account: the financial account is balanced too.',\nmirCA:'Current account',mirFA:'Financial account',\npracth:'In the data',\npract:'To find the equality in the statistics, two terms are added: the <b>capital account<\/b>, small (debt forgiveness, investment grants, sales of brands or licences), and <b>net errors and omissions<\/b>, a statistical residual that collects what the sources failed to capture.',\ns3h:'Two countries in the mirror: the United States and France',\ns3d:'The current and financial accounts, with the two adjustment terms. The financial account is shown as net capital inflows: it mirrors the current account. Pick a country, follow the steps, then hover over or tap the chart to read a year.',\nctry:{us:'United States, 1970-2024',fr:'France, 2010-2025'},\nusk:'steps: ← →',\nlg:['Current account','Financial account (net inflows)','Capital account','Errors and omissions'],\nsteps:{us:[['Overview','For fifty years the two curves mirror each other. The small gap between them is errors and omissions, sometimes larger than the capital account.'],\n['The 1970s: balance','The current account hovers around zero. The United States still sells roughly as much to the rest of the world as it buys from it.'],\n['1983-1987: the first large deficit','A strong dollar and a rising budget deficit: the current account deficit reaches $161bn in 1987, with foreign capital flowing in by as much. People talk of “twin deficits”.'],\n['1997-2006: the great divergence','The current account deficit widens to $817bn in 2006, about 6% of GDP. The rest of the world, China first, invests its savings in US assets: the financial account rises in mirror image.'],\n['2009: the crisis shrinks the deficit','Recession cuts imports: the current account deficit falls back to $380bn, net capital inflows drop to $239bn. Errors and omissions, $146bn, fill the gap.'],\n['2024: a record','A current account deficit of $1,185bn, an all-time record, about 4% of GDP; net capital inflows of $1,129bn. The US market absorbs the world\\'s output, and the world buys dollar assets.']],\nfr:[['Overview','Since 2010 the French current account has almost always been in deficit, by €8bn to €54bn. Behind it: a chronic deficit on goods, partly offset by surpluses on services and, above all, on primary income, often above €45bn a year: French firms own many profitable assets abroad. The financial account mirrors it, on amounts ten times smaller than in the United States.'],\n['The long-run trend: deficits financed by capital inflows','From 2010 to 2025 the current account is in deficit in 14 years out of 16, for about €255bn in total. On the other side, the country records net capital inflows almost every year: the rest of the world accumulates claims on France, which finances its current account deficits in this way.'],\n['2019 and 2021: rare surpluses','The current account moves into surplus: +€12.5bn in 2019, +€9.0bn in 2021. In 2021 the financial account records net outflows of €4.6bn: France lends to the rest of the world.'],\n['2020: the pandemic','Exports collapse, aerospace and tourism in particular: a current account deficit of €37.5bn, financed by €49.5bn of net capital inflows.'],\n['2022: the energy shock','Soaring energy prices push the goods deficit to €137bn and the current account deficit to €53.9bn, a record over the period; net capital inflows: €57.7bn.'],\n['2023-2025: towards balance','After the 2022 record, the current account deficit shrinks: €26.3bn in 2023, €9.3bn in 2024, €11.6bn in 2025. The financial account also moves towards balance: €8.2bn of net inflows in 2024, €8.6bn of net outflows in 2025.']]},\nyr:'<b>{y}<\/b> · current account {ca} · financial account {fa} · capital account {ka} · errors and omissions {er} <span style=\"color:var(--faint)\">({u})<\/span>',\nunit:{us:'$bn',fr:'€bn'},\nyr0:'Hover over or tap the chart to read a year.',\nl3h:'Do not judge an item by its sign',\nl3:'Every economy, rich or poor, records debits and credits that are strictly equal. A trade deficit is not a loss in itself, a financial surplus is not wealth in itself: they are two sides of the same exchanges of goods, services and assets. What matters is the system they draw: ho =function(ev){if(ev.pointerType==='mouse')o.onSel(null);};}\n  return {X:X,Y:Y};}\n\nvar I18N={\nfr:{title:'Des flux aux stocks : la position extérieure',eyebrow:'Séance 8 · Économie ouverte',h1:'Des flux aux stocks : la position extérieure',\nsub:'La balance des paiements additionne les flux d\\'une année. Que deviennent ces flux, année après année ? Ils s\\'accumulent dans un stock, que les prix et le change viennent aussi modifier.',\n\na1h:'Du solde courant à la position extérieure',\na1d:'D\\'abord une seule année, puis dix. Pour l\\'instant, on laisse de côté les prix et le change.',\na1s1:'Une année : le solde courant',\na1s1d:'Au départ, le commerce est équilibré : 100 d\\'exportations, 100 d\\'importations, ni revenus ni transferts. Augmentez les exportations ou les importations et regardez le solde courant S<sub>c<\/sub> = X − IM.',\nslx:{x:'Exportations X',m:'Importations IM'},\neqx:'S<sub>c<\/sub> = X − IM = {x} − {m} = <b>{c}<\/b>',\nrxp:'Le pays vend plus qu\\'il n\\'achète au reste du monde : <b>excédent courant de {a}<\/b>. Il gagne plus qu\\'il ne dépense dans ses échanges avec l\\'étranger.',\nrxn:'Le pays achète plus qu\\'il ne vend au reste du monde : <b>déficit courant de {a}<\/b>. Il dépense plus qu\\'il ne gagne dans ses échanges avec l\\'étranger.',\nrx0:'Commerce équilibré : le solde courant est nul.',\nbx:['X','IM','S<sub>c<\/sub>'],bxt:['X','IM','Sc'],\na1s2:'Dix années : la position extérieure nette',\na1s2d:'Année après année, les soldes courants s\\'accumulent dans un stock : la <b>position extérieure nette<\/b> (PEN), ce que les résidents possèdent sur le reste du monde moins ce qu\\'ils lui doivent. C\\'est la richesse nette du pays vis-à-vis de l\\'étranger. Chaque année, le solde courant la fait varier : <b>PEN<sub>t<\/sub> = PEN<sub>t−1<\/sub> + S<sub>c,t<\/sub><\/b>. Un excédent courant enrichit la nation vis-à-vis de l\\'étranger, un déficit l\\'appauvrit. La position part de zéro et le solde est équilibré ; choisissez un scénario ou réglez le curseur.',\npre1:['Scénario excédent','Scénario déficit'],\nsl1:{ca:'Solde courant annuel'},\nk1:['Position de départ','Soldes courants cumulés','Position dans 10 ans'],\nlg1:['Solde courant de l\\'année','Position extérieure nette'],\nr1:'Après dix ans, la position extérieure vaut <b>{p}<\/b> : la somme des dix soldes courants. {msg}',\nr1p:'Le pays est devenu créancier du reste du monde.',r1n:'Le pays est devenu débiteur du reste du monde.',r10:'Sans excédent ni déficit, rien ne s\\'accumule.',\nyr1:'Année <b>{y}<\/b> · solde courant {c} · position {p}',\na2h:'Soldes courants et mouvements de capitaux',\na2d:'Que devient un excédent courant ? Un pays qui exporte plus qu\\'il n\\'importe reçoit plus de paiements qu\\'il n\\'en verse : il a des <b>capitaux à placer à l\\'étranger<\/b> (dépôts, titres, entreprises). Ce sont des <b>sorties nettes de capitaux<\/b>. À l\\'inverse, un pays qui importe plus qu\\'il n\\'exporte doit trouver de quoi payer : il emprunte au reste du monde ou lui cède des actifs, ce sont des <b>entrées nettes de capitaux<\/b>. On raisonne en flux nets : le solde financier bouge toujours en sens inverse du solde courant, <b>S<sub>f<\/sub> = −S<sub>c<\/sub><\/b>.',\nslf:{ca:'Solde courant'},\neqf:'S<sub>c<\/sub> = <b>{c}<\/b>   ⇒   S<sub>f<\/sub> = −S<sub>c<\/sub> = <b>{f}<\/b>',\nbf:['Solde courant','Solde financier'],\nrf:'{msg}',\nrfp:'<b>Excédent courant de {a}<\/b> : le pays a {a} de capitaux à placer à l\\'étranger. Solde financier de {f} : ce sont des <b>sorties nettes de capitaux<\/b>, le pays prête au reste du monde et accumule des créances sur lui.',rfn:'<b>Déficit courant de {a}<\/b> : il faut le financer. Solde financier de {f} : ce sont des <b>entrées nettes de capitaux<\/b>, le pays emprunte au reste du monde ou lui cède des actifs.',rf0:'Solde courant nul : le pays n\\'a ni capitaux nets à placer ni besoin d\\'emprunter, le solde financier est nul.',\na2s2:'Quand le change et les prix s\\'en mêlent',\na2s2d:'La position extérieure n\\'est pas seulement la somme des soldes courants : ce que le pays détient et ce qu\\'il doit changent aussi de valeur. Il part d\\'une position nulle, mais pas d\\'un bilan vide : 100 d\\'actifs à l\\'étranger, en devises, et 100 de dettes envers des non-résidents, en monnaie nationale. Deux curseurs s\\'ajoutent au solde courant.',\npre2:['Flux seulement','La bourse du pays s\\'envole','La monnaie se déprécie'],\nsl2:{ca:'Solde courant annuel',e:'Taux de change de la monnaie nationale, par an',pr:'Écart de valorisation : actifs détenus − passifs dus, par an'},\nhint2:{ca:'+ : excédent, − : déficit',e:'+ : appréciation, − : dépréciation',pr:'+ : ce que le pays détient à l\\'étranger se valorise plus que ce qu\\'il doit, la position s\\'améliore'},\nk2:['Position de départ','Effet des flux','Effet de valorisation','Position dans 10 ans'],\nlg2s:['Position extérieure nette','Si seuls les flux comptaient'],\nr2:'Sur dix ans, les soldes courants cumulés font varier la position de <b>{f}<\/b>, le change et les prix de <b>{v}<\/b>. {msg}',\nmsgV:'Ici, la valorisation pèse plus que les flux : la position extérieure ne se lit pas seulement dans la balance des paiements.',\nmsgF:'Ici, les flux l\\'emportent : la position suit les soldes courants.',\nmsg0:'Sans effet de change ni de prix, la position n\\'est que la somme des soldes courants.',\ndec:[['+','Achats nets d\\'actifs étrangers par les résidents'],['±','Variation de valeur des actifs étrangers (change et prix)'],['−','Achats nets d\\'actifs du pays par les non-résidents'],['∓','Variation de valeur des actifs du pays détenus par les non-résidents'],['=','Variation de la position extérieure nette sur dix ans']],\nyr:'Année <b>{y}<\/b> · position {p} · actifs {a} · engagements {l}',\nzero:'0',\ns2h:'États-Unis et Chine, 2016-2024',\ns2d:'Les positions extérieures nettes des deux premières économies du monde, en milliers de milliards de dollars, au 31 décembre de chaque année. Survolez ou touchez le graphique pour lire une année.',\nlg2:['États-Unis','Chine'],\nyr2:'<b>{y}<\/b> · États-Unis {u} · Chine {c} <span style=\"color:var(--faint)\">(milliers de Md$)<\/span>',\nyr20:'En 2024, les États-Unis doivent au reste du monde, net, <b>26,5 milliers de milliards de dollars<\/b>, près de 90 % de leur PIB. La Chine détient une créance nette de 3,3 milliers de milliards.',\ns3h:'Débiteur, mais bien payé ?',\ns3d:'Une position extérieure produit des revenus : intérêts, dividendes, profits, enregistrés en revenus primaires. On attendrait d\\'un débiteur qu\\'il en verse plus qu\\'il n\\'en reçoive. Les deux géants montrent l\\'inverse.',\npriv:[['États-Unis','Débiteur net : −26,5 milliers de Md$','Pendant des décennies, les revenus primaires sont restés <b>excédentaires<\/b> : les États-Unis s\\'endettent en titres sûrs et peu rémunérés (bons du Trésor, dépôts en dollars) et placent à l\\'étranger en investissements directs et en actions, mieux rémunérés. C\\'est le « privilège exorbitant » du dollar. En 2024, ce solde est devenu légèrement négatif, pour la première fois depuis au moins 1960.'],\n['Chine','Créancière nette : +3,3 milliers de Md$','Ses revenus primaires sont presque toujours <b>déficitaires<\/b> : −130 Md$ en 2024. Elle place surtout en réserves et en titres publics étrangers peu rémunérés, et verse des profits élevés aux entreprises étrangères implantées chez elle.']],\npropt:'Le déficit commercial américain : perte ou privilège ?',\npropd:'Le mercantilisme revendiqué de l\\'administration Trump, dès son premier mandat, traite le déficit commercial comme une perte à corriger, notamment par des droits de douane. Trois propositions comptables invitent à nuancer.',\nprops:[['1','Une entrée de capitaux est toujours la contrepartie d\\'un déficit courant','Un pays qui importe plus de biens et de services qu\\'il n\\'en exporte reçoit nécessairement plus de capitaux étrangers.'],['2','En termes réels, exporter est un coût, importer est un revenu','Les ressources, dont le travail, utilisées pour produire ce qui est exporté ne servent ni à la consommation des résidents ni à leur production. Pour une entreprise, peu importe qui achète.'],['3','Les exportations des uns sont les importations des autres','Tous les pays ne peuvent pas être exportateurs nets de biens ou de capitaux. Ceux qui sont en position défavorable se lancent dans une course à l\\'austérité, qui alimente le marasme général.']],\nlecth:'Une lecture critique',\nlect:'Le déficit commercial américain fait des États-Unis le principal débouché de la production mondiale depuis quarante ans. Il est financé par des entrées nettes de capitaux qui renforcent l\\'hégémonie de Wall Street, portées par l\\'appétit des investisseurs pour les actifs en dollars. Selon cette lecture, ce régime nourrit les inégalités aux États-Unis, prive les économies en développement de financements et fait de l\\'hypertrophie financière américaine un risque systémique mondial. L\\'hégémonie du dollar sur laquelle il repose est aujourd\\'hui très débattue.',\ns4h:'Commerce, revenus, compte courant : six configurations',\ns4d:'Le solde courant additionne le solde commercial et les revenus nets des actifs (en négligeant les transferts). Réglez les deux : la ligne correspondante s\\'allume, avec ses exemples historiques.',\ntb:'Solde commercial (X − IM)',ni:'Revenus nets des actifs r<sub>f<\/sub>',\ncols:['Solde commercial','Revenus nets','Solde courant','Compte financier','Exemples'],\neqt:'solde courant = {tb} {ni} = <b>{ca}<\/b> → compte financier <b>{fa}<\/b>',\nrows:[['−','−','−','+','Pays d\\'Afrique subsaharienne ; les États-Unis depuis 2024'],['−','+','−','+','Les États-Unis jusqu\\'en 2023'],['+','+','+','−','Allemagne'],['+','−','+','−','Chine, pays émergents exportateurs'],['−','+','+','−','Royaume-Uni et France avant 1914 ; Japon aujourd\\'hui'],['+','−','−','+','Pays endettés dont l\\'excédent commercial ne suffit pas à payer les intérêts']],\nnone:'Un des soldes est nul : déplacez les curseurs pour faire apparaître une configuration.',\nl4h:'Ce que l\\'on possède rapporte, ce que l\\'on doit coûte',\nl4:'Les revenus nets des actifs dépendent de la position extérieure. Un pays <b>créancier<\/b>, qui possède plus d\\'actifs à l\\'étranger qu\\'il n\\'en doit, touche en principe des revenus nets positifs. Ils peuvent même couvrir un déficit commercial : avant 1914, le Royaume-Uni importait plus qu\\'il n\\'exportait, et les intérêts et dividendes de ses placements dans le monde comblaient l\\'écart. Un pays <b>débiteur<\/b> verse au contraire des revenus nets : pour équilibrer son compte courant, il lui faut un excédent commercial, d\\'autant plus grand que sa dette est lourde. Les États-Unis et la Chine font exception : les premiers ont longtemps reçu plus qu\\'ils ne versaient malgré leur dette, parce qu\\'ils empruntent à bas taux en dollars et placent dans des actifs mieux rémunérés ; la seconde, créancière, verse plus qu\\'elle ne reçoit.',\nfoot:'Sources : FMI (position extérieure globale) ; BEA (États-Unis, 2024) ; SAFE (Chine, revenus primaires 2024) ; Banque fédérale de réserve de Dallas (revenus primaires américains).'},\nen:{title:'From flows to stocks: the international investment position',eyebrow:'Session 8 · The open economy',h1:'From flows to stocks: the international investment position',\nsub:'The balance of payments adds up a year\\'s flows. What becomes of them, year after year? They accumulate into a stock, which prices and the exchange rate also change.',\n\na1h:'From the current account to the investment position',\na1d:'First a single year, then ten. For now, prices and the exchange rate are left aside.',\na1s1:'One year: the current account',\na1s1d:'At the start, trade is balanced: 100 of exports, 100 of imports, no income and no transfers. Raise exports or imports and watch the current account S<sub>c<\/sub> = X − IM.',\nslx:{x:'Exports X',m:'Imports IM'},\neqx:'S<sub>c<\/sub> = X − IM = {x} − {m} = <b>{c}<\/b>',\nrxp:'The country sells more to the rest of the world than it buys: a <b>current account surplus of {a}<\/b>. It earns more than it spends in its dealings with the rest of the world.',\nrxn:'The country buys more from the rest of the world than it sells: a <b>current account deficit of {a}<\/b>. It spends more than it earns in its dealings with the rest of the world.',\nrx0:'Balanced trade: the current account is zero.',\nbx:['X','IM','S<sub>c<\/sub>'],bxt:['X','IM','Sc'],\na1s2:'Ten years: the net international investment position',\na1s2d:'Year after year, current accounts accumulate into a stock: the <b>net international investment position<\/b> (NIIP), what residents own on the rest of the world minus what they owe it. It is the country\\'s net wealth vis-à-vis the rest of the world. Each year the current account changes it: <b>NIIP<sub>t<\/sub> = NIIP<sub>t−1<\/sub> + S<sub>c,t<\/sub><\/b>. A current account surplus makes the nation richer vis-à-vis the rest of the world, a deficit makes it poorer. The position starts at zero with a balanced current account; pick a scenario or move the slider.',\npre1:['Surplus scenario','Deficit scenario'],\nsl1:{ca:'Yearly current account'},\nk1:['Starting position','Cumulated current accounts','Position in 10 years'],\nlg1:['Current account of the year','Net international investment position'],\nr1:'After ten years the investment position stands at <b>{p}<\/b>: the sum of the ten current accounts. {msg}',\nr1p:'The country has become a creditor of the rest of the world.',r1n:'The country has become a debtor of the rest of the world.',r10:'With neither surplus nor deficit, nothing accumulates.',\nyr1:'Year <b>{y}<\/b> · current account {c} · position {p}',\na2h:'Current accounts and capital movements',\na2d:'What happens to a current account surplus? A country that exports more than it imports receives more payments than it makes: it has <b>capital to invest abroad<\/b> (deposits, securities, companies). These are <b>net capital outflows<\/b>. Conversely, a country that imports more than it exports has to find the means to pay: it borrows from the rest of the world or sells it assets, these are <b>net capital inflows<\/b>. We reason in net flows: the financial account always moves in the opposite direction to the current account, <b>S<sub>f<\/sub> = −S<sub>c<\/sub><\/b>.',\nslf:{ca:'Current account'},\neqf:'S<sub>c<\/sub> = <b>{c}<\/b>   ⇒   S<sub>f<\/sub> = −S<sub>c<\/sub> = <b>{f}<\/b>',\nbf:['Current account','Financial account'],\nrf:'{msg}',\nrfp:'<b>Current account surplus of {a}<\/b>: the country has {a} of capital to invest abroad. Financial account of {f}: these are <b>net capital outflows<\/b>, the country lends to the rest of the world and accumulates claims on it.',rfn:'<b>Current account deficit of {a}<\/b>: it has to be financed. Financial account of {f}: these are <b>net capital inflows<\/b>, the country borrows from the rest of the world or sells it assets.',rf0:'Zero current account: the country has no net capital to invest and no need to borrow, the financial account is zero.',\na2s2:'When the exchange rate and prices step in',\na2s2d:'The investment position is not just the sum of current accounts: what the country owns and what it owes also change in value. It starts from a zero position, but not from an empty balance sheet: 100 of assets abroad, in foreign currency, and 100 of debts to non-residents, in its own currency. Two sliders are added to the current account.',\npre2:['Flows only','Domestic stocks soar','The currency depreciates'],\nsl2:{ca:'Yearly current account',e:'Exchange rate of the domestic currency, per year',pr:'Valuation gap: assets held − liabilities owed, per year'},\nhint2:{ca:'+: surplus, −: deficit',e:'+: appreciation, −: depreciation',pr:'+: what the country holds abroad gains more value than what it owes, the position improves'},\nk2:['Starting position','Effect of flows','Valuation effect','Position in 10 years'],\nlg2s:['Net international investment position','If only flows counted'],\nr2:'Over ten years, cumulated current accounts move the position by <b>{f}<\/b>, the exchange rate and prices by <b>{v}<\/b>. {msg}',\nmsgV:'Here valuation outweighs flows: the investment position cannot be read from the balance of payments alone.',\nmsgF:'Here flows dominate: the position follows the current accounts.',\nmsg0:'With no exchange-rate or price effect, the position is just the sum of current accounts.',\ndec:[['+','Net purchases of foreign assets by residents'],['±','Change in value of foreign assets (exchange rate and prices)'],['−','Net purchases of domestic assets by non-residents'],['∓','Change in value of domestic assets held by non-residents'],['=','Change in the net international investment position over ten years']],\nyr:'Year <b>{y}<\/b> · position {p} · assets {a} · liabilities {l}',\nzero:'0',\ns2h:'The United States and China, 2016-2024',\ns2d:'The net international investment positions of the world\\'s two largest economies, in trillions of dollars, on 31 December of each year. Hover over or tap the chart to read a year.',\nlg2:['United States','China'],\nyr2:'<b>{y}<\/b> · United States {u} · China {c} <span style=\"color:var(--faint)\">($ trillion)<\/span>',\nyr20:'In 2024 the United States owes the rest of the world, net, <b>$26.5 trillion<\/b>, close to 90% of its GDP. China holds a net claim of $3.3 trillion.',\ns3h:'A debtor, but well paid?',\ns3d:'An investment position yields income: interest, dividends, profits, recorded as primary income. A debtor should pay out more than it receives. The two giants show the opposite.',\npriv:[['United States','Net debtor: −$26.5 trillion','For decades primary income stayed in <b>surplus<\/b>: the United States borrows through safe, low-yielding assets (Treasury bills, dollar deposits) and invests abroad in direct investment and equities, which pay more. This is the dollar\\'s “exorbitant privilege”. In 2024 the balance turned slightly negative, for the first time since at least 1960.'],\n['China','Net creditor: +$3.3 trillion','Its primary income is almost always in <b>deficit<\/b>: −$130bn in 2024. It holds mostly reserves and low-yielding foreign government bonds, and pays high profits to foreign firms operating in China.']],\npropt:'The US trade deficit: loss or privilege?',\npropd:'The avowed mercantilism of the Trump administration, from its first term, treats the trade deficit as a loss to be corrected, notably through tariffs. Three accounting propositions call for nuance.',\nprops:[['1','A capital inflow is always the counterpart of a current account deficit','A country that imports more goods and services than it exports necessarily receives more foreign capital.'],['2','In real terms, exports are a cost and imports are income','The resources, labour included, used to produce exports serve neither residents\\' consumption nor their production. For a firm, it does not matter who buys.'],['3','One country\\'s exports are another country\\'s imports','Not all countries can be net exporters of goods or capital. Those in an unfavourable position engage in a race to austerity, which feeds the general slump.']],\nlecth:'A critical reading',\nlect:'The US trade deficit has made the United States the main outlet for world production for forty years. It is financed by net capital inflows that strengthen Wall Street\\'s hegemony, driven by investors\\' appetite for dollar assets. On this reading, the regime feeds inequality in the United States, deprives developing economies of finance and makes US financial hypertrophy a global systemic risk. The dollar hegemony on which it rests is now widely debated.',\ns4h:'Trade, income, current account: six configurations',\ns4d:'The current account adds the trade balance and net income on assets (leaving transfers aside). Set both: the matching row lights up, with its historical examples.',\ntb:'Trade balance (X − IM)',ni:'Net income on assets r<sub>f<\/sub>',\ncols:['Trade  courant S<sub>c<\/sub> : exportations nettes, revenus et transferts nets reçus de l\\'étranger. Comme le solde courant est le miroir du compte financier, S<sub>c<\/sub> = −S<sub>f<\/sub>.'],\n['Le revenu par son affectation','Le même revenu est consommé, prélevé en impôts nets des transferts, ou épargné.'],\n['On égalise','Les deux écritures décrivent le même revenu : on les égalise, et la consommation disparaît des deux côtés.'],\n['Trois soldes dont la somme est nulle','On regroupe : solde du secteur privé, solde du secteur public, solde du secteur extérieur. Pour qu\\'un secteur accumule des actifs financiers, il faut qu\\'au moins un autre s\\'endette d\\'autant : « <i>it takes two to tango<\/i> » (Wray, 2018).'],\n['Retour à l\\'économie fermée','Sans reste du monde, S<sub>f<\/sub> = 0, et l\\'on retrouve l\\'identité de la séance 6 : l\\'épargne nette du privé est le déficit public.']],\nlines:[['(1)','Y = C + I + G + S<sub>c<\/sub> = C + I + G − S<sub>f<\/sub>','par les emplois'],['(2)','Y = C + S + T','par l\\'affectation'],['','C + I + G − S<sub>f<\/sub> = C + S + T','(1) = (2)'],['','<span class=\"hp\">(S − I)<\/span> + <span class=\"hg\">(T − G)<\/span> + <span class=\"hf\">S<sub>f<\/sub><\/span> = 0','solde privé + solde public + solde extérieur = 0'],['','S<sub>f<\/sub> = 0  ⇒  S − I = G − T','économie fermée : <a href=\"seance6.html#/3\" target=\"_top\">les balances sectorielles de la séance 6<\/a>']],\nnote:'S<sub>f<\/sub>, solde du secteur extérieur, est le compte financier compté en entrées nettes : il est positif quand le reste du monde accumule des créances sur l\\'économie.',\ns2h:'Trouver le solde manquant',\ns2d:'Deux soldes connus suffisent pour déduire le troisième. Les deux exemples posent une question : réfléchissez avant de révéler. Puis passez en mode libre.',\npre:['Exemple 1','Exemple 2','Mode libre'],\nunk:'Solde inconnu :',names:{p:'Privé (S − I)',g:'Public (T − G)',f:'Extérieur S<sub>f<\/sub>'},short:{p:'Privé',g:'Public',f:'Extérieur'},\nq:['Le compte financier du reste du monde est à l\\'équilibre : solde extérieur nul (le solde courant l\\'est aussi). Le secteur privé gagne 100 Md$ et en dépense 90 : excédent de 10. <b>Quel est le solde public ?<\/b>',\n'Le solde courant affiche un déficit de 20 Md$, donc un solde extérieur de +20. Le budget public est excédentaire de 10. <b>Quel est le solde du secteur privé ?<\/b>'],\nrev:'Révéler',\nans:['10 + (T − G) + 0 = 0 : <b>déficit public de 10 Md$<\/b>. Le reste du monde étant à l\\'équilibre, le secteur privé accumule 10 Md$ de titres publics : le déficit de l\\'État est son épargne.',\n'(S − I) + 10 + 20 = 0 : <b>déficit privé de 30 Md$<\/b>. Le secteur privé vend des actifs ou s\\'endette de 30 ; en face, le reste du monde (20) et l\\'État (10) accumulent des créances ou réduisent leurs dettes.'],\ncur:'solde courant S<sub>c<\/sub> = −S<sub>f<\/sub> = {c}',\nsec:{p:['Le secteur privé','accumule {v} d\\'actifs financiers nets','s\\'endette ou vend des actifs pour {v}','est à l\\'équilibre'],g:['L\\'État','est en excédent de {v}','est en déficit de {v}','est à l\\'équilibre'],f:['Le reste du monde','accumule {v} de créances sur l\\'économie (déficit courant)','réduit de {v} ses créances : l\\'économie prête au reste du monde (excédent courant)','est à l\\'équilibre']},\ns3h:'La France, 1980-2025',\ns3d:'Les trois soldes de l\\'économie française, en points de PIB. Chaque année, les barres positives et négatives se compensent exactement. Survolez ou touchez une année.',\nfrk:'étapes : ← →',\nlg:['Secteur extérieur','Secteur public','Secteur privé'],\nfr:[['Vue d\\'ensemble','Depuis le début des années 1980, l\\'État est en déficit chaque année, et c\\'est le secteur privé qui accumule l\\'excédent correspondant. Le solde extérieur reste presque toujours compris entre −2 et +2 points.'],\n['1993 : la récession','Le déficit public atteint 5,6 points de PIB, l\\'excédent privé 6,3 : ménages et entreprises réduisent leurs dépenses, l\\'État les compense. Le solde extérieur est négatif : la France prête au reste du monde.'],\n['1997-1999 : l\\'excédent courant','Solde extérieur de −3,9 points en 1999, soit un excédent courant de 3,9 points : la France prête au reste du monde, et le déficit public se réduit à 1,4 point.'],\n['2009-2010 : la grande crise financière','Le déficit public dépasse 6 points en 2010 ; le secteur privé, qui se désendette, dégage 5,5 points d\\'excédent.'],\n['2020 : la pandémie','Déficit public de 5,9 points ; l\\'excédent privé (3,9 points) ne suffit pas, le reste du monde finance la différence : solde extérieur de +2,1 points, déficit courant.'],\n['2024-2025 : un face-à-face','Le solde extérieur est presque nul : le déficit public (5,8 points en 2024) est entièrement absorbé par l\\'excédent du secteur privé (5,9 points). Les valeurs de 2025 sont des estimations.']],\nyr:'<b>{y}<\/b> · extérieur {e} · public {g} · privé {p} <span style=\"color:var(--faint)\">(% du PIB)<\/span> · solde courant {c}',\nyr0:'Survolez ou touchez une année.',\ns4h:'Le miroir : les déséquilibres des uns sont ceux des autres',\ns4d:'Deux économies : un pays et le reste du monde. Ce que le pays prête, le reste du monde l\\'emprunte. Réglez les soldes privé et public du pays, et le solde public du reste du monde : le solde privé du reste du monde en découle.',\nsl:{pa:'Pays : solde privé',ga:'Pays : solde public',gb:'Reste du monde : solde public'},\ngrp:['Le pays','Le reste du monde'],\nr4:'Le pays a un solde extérieur de {fa}, soit un solde courant de {ca}. Le reste du monde a donc un solde courant de {cb}. Avec un solde public de {gb}, son secteur privé {pb}.',\npbp:'accumule {v} d\\'actifs financiers',pbn:'doit s\\'endetter de {v}',pb0:'est à l\\'équilibre',\nl4h:'Tout le monde ne peut pas épargner à la fois',\nl4:'Les déséquilibres internes d\\'une économie reflètent ceux du reste du monde. Si le privé et l\\'État d\\'un pays veulent tous deux dégager des excédents, le pays exporte son épargne : quelque part, un secteur privé ou un État doit s\\'endetter d\\'autant. Quand tous les pays visent l\\'excédent en même temps, l\\'ajustement passe par la baisse des revenus.',\nfoot:'Sources : FMI, World Economic Outlook (solde courant et capacité ou besoin de financement des administrations publiques) ; solde privé calculé par différence. Wray, L. R. (2018), <i>Macroeconomics<\/i>, Red Globe Press.'},\nen:{title:'Three balances, and the rest of the world',eyebrow:'Session 8 · The open economy',h1:'Three balances, and the rest of the world',\nsub:'In a closed economy, the private sector\\'s net saving has the government deficit as its counterpart. In an open economy a third sector enters the identity: the <b>rest of the world<\/b>. The three balances always sum to zero.',\ns1h:'The international macroeconomic equilibrium equation',\ns1d:'Two ways of writing the same national income, and the identity follows in three lines. Go step by step.',\nprev:'←',next:'Next →',kbd:'or ← →',\nsteps:[['Income by its uses','National income Y is spent on consumption, investment and government spending, plus the current account S<sub>c<\/sub>: net exports, net income and transfers from abroad. Since the current account mirrors the financial account, S<sub>c<\/sub> = −S<sub>f<\/sub>.'],\n['Income by its allocation','The same income is consumed, taken in taxes net of transfers, or saved.'],\n['Set them equal','Both describe the same income: set them equal, and consumption drops out on both sides.'],\n['Three balances that sum to zero','Group the terms: private sector balance, public sector balance, external sector balance. For one sector to accumulate financial assets, at least one other must borrow as much: “<i>it takes two to tango<\/i>” (Wray, 2018).'],\n['Back to the closed economy','Without a rest of the world, S<sub>f<\/sub> = 0, and we are back to the identity of session 6: the private sector\\'s net saving is the public deficit.']],\nlines:[['(1)','Y = C + I + G + S<sub>c<\/sub> = C + I + G − S<sub>f<\/sub>','by uses'],['(2)','Y = C + S + T','by allocation'],['','C + I + G − S<sub>f<\/sub> = C + S + T','(1) = (2)'],['','<span class=\"hp\">(S − I)<\/span> + <span class=\"hg\">(T − G)<\/span> + <span class=\"hf\">S<sub>f<\/sub><\/span> = 0','private balance + public balance + external balance = 0'],['','S<sub>f<\/sub> = 0  ⇒  S − I = G − T','closed economy: <a href=\"seance6.html#/3\" target=\"_top\">the sectoral balances of session 6<\/a>']],\nnote:'S<sub>f<\/sub>, the external sector balance, is the financial account counted as net inflows: it is positive when the rest of the world accumulates claims on the economy.',\ns2h:'Finding the missing balance',\ns2d:'Two known balances are enough to deduce the third. The two examples ask a question: think before revealing. Then switch to free mode.',\npre:['Example 1','Example 2','Free mode'],\nunk:'Unknown balance:',names:{p:'Private (S − I)',g:'Public (T − G)',f:'External S<sub>f<\/sub>'},short:{p:'Private',g:'Public',f:'External'},\nq:['The rest of the world\\'s financial position is balanced: external balance of zero (so is the current account). The private sector earns $100bn and spends $90bn: a surplus of 10. <b>What is the public balance?<\/b>',\n'The current account shows a deficit of $20bn, hence an external balance of +20. The government budget is in surplus by 10. <b>What is the private sector balance?<\/b>'],\nrev:'Reveal',\nans:['10 + (T − G) + 0 = 0: <b>a public deficit of $10bn<\/b>. With the rest of the world balanced, the private sector accumulates $10bn of government securities: the government\\'s deficit is its saving.',\n'(S − I) + 10 + 20 = 0: <b>a private deficit of $30bn<\/b>. The private sector sells assets or borrows 30; on the other side, the rest of the world (20) and the government (10) accumulate claims or reduce their debts.'],\ncur:'current account S<sub>c<\/sub> = −S<sub>f<\/sub> = {c}',\nsec:{p:['The private sector','accumulates {v} of net financial assets','borrows or sells assets for {v}','is balanced'],g:['The government','runs a surplus of {v}','runs a deficit of {v}','is balanced'],f:['The rest of the world','accumulates {v} of claims on the economy (current account deficit)','reduces its claims by {v}: the economy lends to the rest of the world (current account surplus)','is balanced']},\ns3h:'France, 1980-2025',\ns3d:'The three balances of the French economy, in percentage points of GDP. Each year the positive and negative bars offset each other exactly. Hover over or tap a year.',\nfrk:'steps: ← →',\nlg:['External sector','Public sector','Private sector'],\nfr:[['Overview','Since the early 1980s the government has run a deficit every year, and the private sector has accumulated the matching surplus. The external balance almost always stays between −2 and +2 points.'],\n['1993: the recession','The public deficit reaches 5.6 points of GDP, the private surplus 6.3: households and firms cut their spending, the government offsets it. The external balance is negative: France lends to the rest of the world.'],\n['1997-1999: the current account surplus','An external balance of −3.9 points in 1999, i.e. a current account surplus of 3.9 points: France lends to the rest of the world, and the public deficit shrinks to 1.4 points.'],\n['2009-2010: the great financial crisis','The public deficit exceeds 6 points in 2010; the private sector, deleveraging, runs a surplus of 5.5 points.'],\n['2020: the pandemic','A public deficit of 5.9 points; the private surplus (3.9 points) is not enough, and the rest of the world finances the difference: an external balance of +2.1 points, a current account deficit.'],\n['2024-2025: face to face','The external balance is almost zero: the public deficit (5.8 points in 2024) is entirely absorbed by the private sector surplus (5.9 points). The 2025 values are estimates.']],\nyr:'<b>{y}<\/b> · external {e} · public {g} · private {p} <span style=\"color:var(--faint)\">(% of GDP)<\/span> · current account {c}',
