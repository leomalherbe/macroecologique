/sub> × P<sub>M<\/sub> / P<sub>X<\/sub>',\npre1:['Termes égaux (100)','Termes dégradés (50)','Termes améliorés (125)'],\nsl1:{px:'Prix des exportations P<sub>X<\/sub>',pm:'Prix des importations P<sub>M<\/sub>'},\nk1:['Termes de l\\'échange','Exportations nécessaires','Pour une unité importée'],\nlbM:'<b>Importations<\/b>100 unités',lbX:'<b>Exportations<\/b>{q} unités',\nr1:'Avec des termes de l\\'échange de <b>{t}<\/b>, le pays doit exporter <b>{q} unités<\/b> pour payer 100 unités d\\'importations. {msg}',\nr1lo:'Ses termes de l\\'échange sont inférieurs à 100 : chaque unité exportée achète moins d\\'une unité importée.',\nr1hi:'Ses termes de l\\'échange dépassent 100 : chaque unité exportée achète plus d\\'une unité importée.',\nr1eq:'Une unité exportée paie exactement une unité importée.',\ns2h:'L\\'hypothèse de Prebisch-Singer',\ns2d:'En 1950, Raúl Prebisch et Hans Singer avancent que les prix des produits primaires tendent à baisser à long terme par rapport à ceux des produits manufacturés : les termes de l\\'échange des pays qui les exportent se dégradent. Ci-dessous, l\\'indice de Grilli et Yang des prix agricoles mondiaux, rapportés aux prix des produits manufacturés (indice : moyenne des années 1977-1979 = 100). Survolez ou touchez une année.',\nlg2:['Indice des prix agricoles relatifs','Tendance log-linéaire'],\ngy0:'Sur 1900-2015, la tendance est d\\'environ <b>{b} % par an<\/b> : l\\'indice moyen passe de 158 sur 1900-1919 à 55 sur 1996-2015, près de trois fois moins. Les pics (1917, 1951, 1974, 2011) ne durent pas.',\ngy:'<b>{y}<\/b> · indice {v} · tendance {t}',\nwhy:[['Demande','La loi d\\'Engel','Quand le revenu augmente, la part consacrée à l\\'alimentation et aux matières premières diminue : la demande de produits primaires croît moins vite que la demande de produits manufacturés.'],['Marchés','Qui garde les gains de productivité ?','Au centre, syndicats et entreprises en position de force transforment les gains de productivité en salaires et en profits ; à la périphérie, la concurrence et le surplus de main-d\\'œuvre les transforment en baisse des prix.'],['Technique','Des substituts','Matières synthétiques et procédés plus économes en matières réduisent la demande de produits primaires.']],\ns3h:'La loi de Thirlwall',\ns3d:'Un pays peut-il croître aussi vite qu\\'il le souhaite ? Pas s\\'il dépend du reste du monde pour une partie de ce qu\\'il consomme et investit. Thirlwall (1979) montre que sa croissance est <b>contrainte par la balance des paiements<\/b>. Construisons la contrainte en cinq étapes.',\nnext:'Suivant →',kbd:'ou ← →',\ntst:[['Une contrainte de long terme','À long terme, un pays ne peut pas financer indéfiniment un déficit courant : il doit pouvoir payer ce qu\\'il importe avec ce qu\\'il exporte. Ses importations ne peuvent donc pas croître durablement plus vite que ses exportations. On note x le taux de croissance des exportations, m celui des importations.'],\n['Les exportations suivent la croissance du reste du monde','Ce que le pays vend dépend du revenu de ses clients, le reste du monde, qui croît au taux z. L\\'<b>élasticité-revenu des exportations ε<\/b> dit de combien de % les exportations augmentent quand le revenu mondial augmente de 1 %. ε élevé : le pays vend des biens que le monde achète davantage en s\\'enrichissant (biens manufacturés élaborés, services spécialisés). ε faible : produits de base, dont la part dans les dépenses recule quand le revenu monte.'],\n['Les importations suivent la croissance du pays','Ce que le pays achète à l\\'étranger dépend de son propre revenu, qui croît au taux y. L\\'<b>élasticité-revenu des importations Π<\/b> dit de combien de % les importations augmentent quand le revenu national augmente de 1 %. Π élevé : dès qu\\'il croît, le pays doit importer beaucoup de biens d\\'équipement, d\\'énergie ou de biens de consommation qu\\'il ne produit pas.'],\n['On réunit les trois relations','On remplace x et m dans la contrainte : on obtient le taux de croissance compatible avec l\\'équilibre extérieur.'],\n['Ce qui borne la croissance','La croissance du pays augmente avec la croissance mondiale z et avec ε ; elle baisse avec Π. Ce qui compte est le <b>rapport ε / Π<\/b> : si ε = Π, le pays croît au même rythme que le reste du monde ; si ε < Π, plus lentement ; si ε > Π, plus vite. Le simulateur part de ε = Π.']],\ntln:[['x = m','les exportations et les importations croissent au même rythme'],['x = ε × z','les exportations dépendent de la croissance du reste du monde'],['m = Π × y','les importations dépendent de la croissance du pays'],['ε × z = Π × y   ⇒   y = (ε / Π) × z','la croissance compatible avec l\\'équilibre extérieur'],['y = (ε / Π) × z','y monte avec z et ε, baisse avec Π']],\nsimt:'À vous : réglez les élasticités',\npre3:['ε = Π','Périphérie primaire','Montée en gamme'],\nsl3:{z:'Croissance du reste du monde z',e:'Élasticité-revenu des exportations ε',p:'Élasticité-revenu des importations Π'},\nk3:['Exportations x','Importations m','Croissance du pays y','Rapport ε / Π'],\nlg3:['PIB du pays','PIB du reste du monde'],\nr3:'Le pays croît de <b>{y} %<\/b> par an quand le reste du monde croît de {z} %. En trente ans, son PIB est multiplié par <b>{a}<\/b>, celui du reste du monde par {b}. {msg}',\nr3eq:'ε = Π : le pays suit exactement le rythme du reste du monde.',\nr3lo:'ε < Π : à chaque point de croissance, ses importations augmentent plus vite que ses exportations ne peuvent suivre ; pour garder ses comptes extérieurs en équilibre, il doit croître moins vite que le monde.',\nr3hi:'ε > Π : ses exportations tirent plus que ses importations ne pèsent ; il peut croître plus vite que le monde sans déséquilibre extérieur.',\nth:'Année <b>{y}<\/b> · pays {a} · reste du monde {b} <span style=\"color:var(--faint)\">(base 100 l\\'année 0)<\/span>',\ntoth:'Et les termes de l\\'échange ?',\ntot:'Le modèle complet de Thirlwall part de l\\'équilibre du compte courant en valeur, et fait donc intervenir les prix relatifs. La « loi » suppose que ces prix relatifs, c\\'est-à-dire les termes de l\\'échange, restent stables à long terme : c\\'est ce qui permet de ne garder que les élasticités-revenu. Si les termes de l\\'échange de la périphérie se dégradent, comme le soutiennent Prebisch et Singer, la contrainte se resserre encore : à volume égal, ses exportations paient moins d\\'importations.',\nl3h:'Le libre-échange ne profite pas à tous de la même façon',\nl3:'Une économie qui exporte des biens à faible élasticité-revenu et importe des biens à forte élasticité-revenu croît plus lentement que le reste du monde, même sans aucun déséquilibre interne. Entre pays de niveaux de développement et de technologie différents, le libre-échange ne favorise pas inconditionnellement le développement.',\ns4h:'L\\'échange écologiquement inégal',\ns4d:'Les mêmes écarts de prix ont une face physique. Hickel, Dorninger, Wieland et Suwandi (2022) mesurent les ressources et le travail <b>incorporés<\/b> dans les biens échangés entre le Nord (les économies avancées selon le FMI) et le Sud (les autres pays), de 1990 à 2015.',\nuet:'Le principe : un échange équilibré en valeur, déséquilibré en ressources',\nued:'Le Nord et le Sud échangent des biens de même valeur marchande. Mesurez maintenant ce que contiennent ces biens : les matières, les terres, l\\'énergie et le travail qu\\'il a fallu pour les produire.',\nues:{v:'Valeur marchande',m:'Matières',l:'Terres',e:'Énergie',w:'Travail'},\nuelb:['Le Sud exporte vers le Nord','Le Nord exporte vers le Sud'],\nuer:{v:'En valeur marchande, l\\'échange est équilibré : chaque côté exporte autant qu\\'il importe.',m:'Pour chaque unité de <b>matières<\/b> incorporées qu\\'il importe du Nord, le Sud en exporte en moyenne <b>5<\/b>.',l:'Pour chaque hectare de <b>terres<\/b> incorporé qu\\'il importe, le Sud en exporte en moyenne <b>5<\/b>.',e:'Pour chaque unité d\\'<b>énergie<\/b> incorporée qu\\'il importe, le Sud en exporte en moyenne <b>3<\/b>.',w:'Pour chaque heure de <b>travail<\/b> incorporée qu\\'il importe, le Sud en exporte en moyenne <b>13<\/b>.'},\nunit:'unité',units:'unités',\nk4t:'Ce que le Nord s\\'approprie en termes nets, en 2015',\nk4:[['Matières','12 Gt','équivalents matières premières, 43 % de la consommation matérielle annuelle du Nord'],['Terres','822 Mha','de terres incorporées'],['Énergie','21 EJ','l\\'équivalent de 3,4 milliards de barils de pétrole'],['Travail','188 M','années de travail'],['Valeur','10 800 Md$','aux prix du Nord, 23 % du PIB du Nord ; 242 000 Md$ cumulés sur 1990-2015']],\nn4h:'Lecture',\nn4:'Les auteurs calculent les ressources incorporées à l\\'aide de tableaux entrées-sorties environnementaux, puis les valorisent aux prix du Nord. Le résultat dépend de ces choix, discutés dans la littérature. Il prolonge Prebisch et Singer en termes physiques : pour payer ce qu\\'il importe, le Sud exporte bien plus de matières, de terres, d\\'énergie et de travail qu\\'il n\\'en reçoit.',\nfoot:'Sources : Grilli et Yang (1988), mise à jour de Pfaffenzeller, Newbold et Rayner (2007), indice des prix agricoles, valeurs arrondies ; Prebisch (1950) ; Singer (1950) ; Thirlwall (1979) ; Hickel, Dorninger, Wieland et Suwandi (2022), <i>Global Environmental Change<\/i>, 73.'},\nen:{title:'Centre, periphery and unequal exchange',eyebrow:'Session 8 · The open economy',h1:'Centre, periphery and unequal exchange',\nsub:'Not every country sells the same things to the rest of the world. Those that mainly export primary goods see their international purchasing power erode, and their growth capped by the balance of payments. Physical flows tell the same story.',\ns1h:'The terms of trade',\ns1d:'The terms of trade measure the “international purchasing power” a country derives from its exports: the ratio of the average price of its exports P<sub>X<\/sub> to that of its imports P<sub>M<\/sub>. To pay for its imports without borrowing, it needs P<sub>X<\/sub>Q<sub>X<\/sub> = P<sub>M<\/sub>Q<sub>M<\/sub>. The country needs 100 units of imports: how much must it export?',\ntoteq:'ToT = (P<sub>X<\/sub> / P<sub>M<\/sub>) × 100&emsp;&emsp;and&emsp;&emsp;Q<sub>X<\/sub> = Q<sub>M<\/sub> × P<sub>M<\/sub> / P<sub>X<\/sub>',\npre1:['Equal terms (100)','Deteriorated terms (50)','Improved terms (125)'],\nsl1:{px:'Export prices P<sub>X<\/sub>',pm:'Import prices P<sub>M<\/sub>'},\nk1:['Terms of trade','Exports needed','Per unit imported'],\nlbM:'<b>Imports<\/b>100 units',lbX:'<b>Exports<\/b>{q} units',\nr1:'With terms of trade of <b>{t}<\/b>, the country must export <b>{q} units<\/b> to pay for 100 units of imports. {msg}',\nr1lo:'Its terms of trade are below 100: each unit exported buys less than one unit imported.',\nr1hi:'Its terms of trade are above 100: each unit exported buys more than one unit imported.',\nr1eq:'One unit exported pays for exactly one unit imported.',\ns2h:'The Prebisch-Singer hypothesis',\ns2d:'In 1950 Raúl Prebisch and Hans Singer argued that the prices of primary goods tend to fall in the long run relative to those of manufactures: the terms of trade of the countries that export them deteriorate. Below, the Grilli-Yang index of world agricultural prices, relative to the prices of manufactures (index: 1977-1979 average = 100). Hover over or tap a year.',\nlg2:['Relative agricultural price index','Log-linear trend'],\ngy0:'Over 1900-2015 the trend is about <b>{b}% a year<\/b>: the average index falls from 158 in 1900-1919 to 55 in 1996-2015, almost a third. The peaks (1917, 1951, 1974, 2011) do not last.',\ngy:'<b>{y}<\/b> · index {v} · trend {t}',\nwhy:[['Demand','Engel\\'s law','As income rises, the share spent on food and raw materials falls: demand for primary goods grows more slowly than demand for manufactures.'],['Markets','Who keeps the productivity gains?','At the centre, trade unions and firms with market power turn productivity gains into wages and profits; in the periphery, competition and surplus labour turn them into lower prices.'],['Technology','Substitutes','Synthetic materials and more material-efficient processes reduce demand for primary goods.']],\ns3h:'Thirlwall\\'s law',\ns3d:'Can a country grow as fast as it wishes? Not if it depends on the rest of the world for part of what it consumes and invests. Thirlwall (1979) shows that its growth is <b>constrained by the balance of payments<\/b>. Let us build the constraint in five steps.',\nnext:'Next →',kbd:'or ← →',\ntst:[['A long-run constraint','In the long run a country cannot finance a current account deficit indefinitely: it must be able to pay for its imports with its exports. Its imports therefore cannot grow lastingly faster than its exports. Let x be the growth rate of exports and m that of imports.'],\n['Exports follow the growth of the rest of the world','What the country sells depends on the income of its customers, the rest of the world, which grows at rate z. The <b>income elasticity of exports ε<\/b> says by how many % exports rise when world income rises by 1%. High ε: the country sells goods the world buys more of as it gets richer (sophisticated manufactures, specialised services). Low ε: commodities, whose share of spending falls as income rises.'],\n['Imports follow the country\\'s own growth','What the country buys abroad depends on its own income, which grows at rate y. The <b>income elasticity of imports Π<\/b> says by how many % imports rise when national income rises by 1%. High Π: as soon as it grows, the country must import a lot of capital goods, energy or consumer goods it does not produce.'],\n['Putting the three together','Substitute x and m into the constraint: this gives the growth rate compatible with external balance.'],\n['What caps growth','The country\\'s growth rises with world growth z and with ε; it falls with Π. What matters is the <b>ratio ε / Π<\/b>: if ε = Π, the country grows at the same pace as the rest of the world; if ε < Π, more slowly; if ε > Π, faster. The simulator starts from ε = Π.']],\ntln:[['x = m','exports and imports grow at the same rate'],['x = ε × z','exports depend on the growth of the rest of the world'],['m = Π × y','imports depend on the country\\'s growth'],['ε × z = Π × y   ⇒   y = (ε / Π) × z','growth compatible with external balance'],['y = (ε / Π) × z','y rises with z and ε, falls with Π']],\nsimt:'Your turn: set the elasticities',\npre3:['ε = Π','Primary periphery','Moving up the value chain'],\nsl3:{z:'Growth of the rest of the world z',e:'Income elasticity of exports ε',p:'Income elasticity of imports Π'},\nk3:['Exports x','Imports m','Country growth y','Ratio ε / Π'],\nlg3:['Country GDP','Rest-of-world GDP'],\nr3:'The country grows at <b>{y}%<\/b> a year while the rest of the world grows at {z}%. In thirty years its GDP is multiplied by <b>{a}<\/b>, the rest of the world\\'s by {b}. {msg}',\nr3eq:'ε = Π: the country keeps exactly in step with the rest of the world.',\nr3lo:'ε < Π: with each point of growth, its imports rise faster than its exports can follow; to keep its external accounts balanced, it must grow more slowly than the world.',\nr3hi:'ε > Π: its exports pull more than its imports weigh; it can grow faster than the world without an external imbalance.',\nth:'Year <b>{y}<\/b> · country {a} · rest of the world {b} <span style=\"color:var(--faint)\">(year 0 = 100)<\/span>',\ntoth:'What about the terms of trade?',\ntot:'Thirlwall\\'s full model starts from current account balance in value, so relative prices come into it. The “law” assumes that these relative prices, i.e. the terms of trade, stay stable in the long run: that is what leaves only the income elasticities. If the periphery\\'s terms of trade deteriorate, as Prebisch and Singer argue, the constraint tightens further: for the same volume, its exports pay for fewer imports.',\nl3h:'Free trade does not benefit everyone equally',\nl3:'An economy that exports goods with a low income elasticity and imports goods with a high one grows more slowly than the rest of the world, even with no internal imbalance at all. Between countries at different levels of development and technology, free trade does not unconditionally promote development.',\ns4h:'Ecologically unequal exchange',\ns4d:'The same price gaps have a physical side. Hickel, Dorninger, Wieland and Suwandi (2022) measure the resources and labour <b>embodied<\/b> in goods traded between the North (the IMF\\'s advanced economies) and the South (all other countries), from 1990 to 2015.',\nuet:'The principle: trade balanced in value, unbalanced in resources',\nued:'North and South exchange goods of equal market value. Now measure what these goods contain: the materials, land, energy and labour it took to produce them.',\nues:{v:'Market value',m:'Materials',l:'Land',e:'Energy',w:'Labour'},\nuelb:['The South exports to the North','The North exports to the South'],\nuer:{v:'In market value, trade is balanced: each side exports as much as it imports.',m:'For each unit of embodied <b>materials<\/b> it imports from the North, the South exports <b>5<\/b> on average.',l:'For each hectare of embodied <b>land<\/b> it imports, the South exports <b>5<\/b> on average.',e:'For each unit of embodied <b>energy<\/b> it imports, the South exports <b>3<\/b> on average.',w:'For each hour of embodied <b>labour<\/b> it imports, the South exports <b>13<\/b> on average.'},\nunit:'unit',units:'units',\nk4t:'What the North appropriates in net terms, in 2015',\nk4:[['Materials','12 Gt','raw material equivalents, 43% of the North\\'s annual material consumption'],['Land','822 Mha','of embodied land'],['Energy','21 EJ','the equivalent of 3.4 billion barrels of oil'],['Labour','188 M','person-years of work'],['Value','$10.8 tn','in Northern prices, 23% of Northern GDP; $242 tn cumulated over 1990-2015']],\nn4h:'Reading',\nn4:'The authors compute embodied resources with environmentally extended input-output tables, then value them at Northern prices. The result depends on these choices, which are debated in the literature. It extends Prebisch and Singer in physical terms: to pay for what it imports, the South exports far more materials, land, energy and labour than it receives.',\nfoot:'Sources: Grilli and Yang (1988), updated by Pfaffenzeller, Newbold and Rayner (2007), agricultural price index, rounded values; Prebisch (1950); Singer (1950); Thirlwall (1979); Hickel, Dorninger, Wieland and Suwandi (2022), <i>Global Environmental Change<\/i>, 73.'}};\nfunction sliders(box,obj,keys,rg,lab,onch,suf){if(!box.childElementCount){keys.forEach(function(k){var f=document.createElement('div');f.className='field';\n    f.innerHTML='<label><span class=\"nm\" id=\"n_'+k+'\"><\/span><span class=\"vv\" id=\"v_'+k+'\"><\/span><\/label><input type=\"range\" id=\"r_'+k+'\" min=\"'+rg[k][0]+'\" max=\"'+rg[k][1]+'\" step=\"'+rg[k][2]+'\">';\n    f.querySelector('input').addEventListener('input',function(e){obj()[k]=+e.target.value;onch();});box.appendChild(f);});}\n  keys.forEach(function(k){$('n_'+k).innerHTML=lab[k];$('r_'+k).value=obj()[k];$('v_'+k).textContent=suf(k,obj()[k]);});}\nfunction presets(box,names,sel,onp){box.innerHTML='';names.forEach(function(p,i){var b=document.createElement('button');b.type='button';b.className='pz'+(i===sel?' on':'');b.textContent=p;b.addEventListener('click',function(){onp(i);});box.appendChild(b);});}\nfunction renderS1(){var d=D();presets($('pz1'),d.pre1,P1SEL,function(i){T1=Object.assign({},PRE1[i]);P1SEL=i;renderS1();});\n  sliders($('sl1'),function(){return T1;},['px','pm'],{px:[20,200,5],pm:[20,200,5]},d.sl1,function(){P1SEL=-1;renderS1();},function(k,v){return fmt(v);});\n  var tot=T1.px/T1.pm*100,q=100*T1.pm/T1.px;\n  $('kp1').innerHTML=[[d.k1[0],fmt(tot)],[d.k1[1],fmt(q)],[d.k1[2],fmt(q/100,2)]].map(function(k){return '<div class=\"kpi\"><div class=\"kl\">'+k[0]+'<\/div><div class=\"kv\">'+k[1]+'<\/div><\/div>';}).join('');\n  function boxes(n,c){var s='',full=Math.floor(n/10+1e-9),rest=n/10-full;for(var i=0;i<full;i++)s+='<span class=\"bx '+c+'\"><\/span> ('tnext').disabled=TSTEP===4;}\nfunction renderTH(){var d=D();renderTD();presets($('pz3'),d.pre3,P3SEL,function(i){T3=Object.assign({},PRE3[i]);P3SEL=i;THSEL=null;renderTH();});\n  sliders($('sl3'),function(){return T3;},['z','e','p'],{z:[0,6,0.5],e:[0.2,3,0.1],p:[0.2,3,0.1]},d.sl3,function(){P3SEL=-1;THSEL=null;renderTH();},function(k,v){return k==='z'?fmt(v,1)+' %':fmt(v,1);});\n  var x=T3.e*T3.z,y=x/T3.p,m=T3.p*y,rt=T3.e/T3.p;\n  $('kp3').innerHTML=[[d.k3[0],fmt(x,1)+' %'],[d.k3[1],fmt(m,1)+' %'],[d.k3[2],fmt(y,1)+' %'],[d.k3[3],fmt(rt,2)]].map(function(k,i){return '<div class=\"kpi\"><div class=\"kl\">'+k[0]+'<\/div><div class=\"kv sm'+(i===3?(rt>1.005?' pos':(rt<0.995?' neg':'')):'')+'\">'+k[1]+'<\/div><\/div>';}).join('');\n  var yrs=[],A=[],B=[];for(var t=0;t<=30;t++){yrs.push(t);A.push(100*Math.pow(1+y/100,t));B.push(100*Math.pow(1+T3.z/100,t));}\n  var mx=Math.max(Math.max.apply(null,A),Math.max.apply(null,B)),mn=Math.min(Math.min.apply(null,A),100);var rg=Math.max(mx-mn,40)/5,pw=Math.pow(10,Math.floor(Math.log10(rg))),st=[1,2,5,10].map(function(k){return k*pw;}).find(function(k){return k>=rg;});var ymin=Math.floor(mn/st)*st,ymax=Math.max(Math.ceil(mx/st)*st,ymin+st),tk=[];for(var v=ymin;v<=ymax+1e-9;v+=st)tk.push(v);\n  chart($('th'),{x:yrs,ymin:ymin,ymax:ymax,yticks:tk,xtick:function(x){return x%5===0;},sel:THSEL,H:240,L:44,series:[{v:A,c:'var(--rms)',w:2.8},{v:B,c:'var(--muted)',w:2,dash:true}],onSel:function(i){THSEL=i;renderTH();}});\n  $('thlg').innerHTML='<span><i style=\"background:var(--rms)\"><\/i>'+d.lg3[0]+'<\/span><span><i class=\"dash\" style=\"color:var(--muted);background:var(--muted)\"><\/i>'+d.lg3[1]+'<\/span>';\n  var r=d.r3.replace('{y}',fmt(y,1)).replace('{z}',fmt(T3.z,1)).replace('{a}',fmt(A[30]/100,1)).replace('{b}',fmt(B[30]/100,1)).replace('{msg}',rt>1.005?d.r3hi:(rt<0.995?d.r3lo:d.r3eq));\n  $('read3').innerHTML=(THSEL!==null?d.th.replace('{y}',THSEL).replace('{a}',fmt(A[THSEL])).replace('{b}',fmt(B[THSEL]))+'<br>':'')+r;}\nfunction renderUE(){var d=D();$('ues').innerHTML='';['v','m','l','e','w'].forEach(function(k){var b=document.createElement('button');b.type='button';b.className=k===UE?'on':'';b.textContent=d.ues[k];b.addEventListener('click',function(){UE=k;renderUE();});$('ues').appendChild(b);});\n  var r=UER[UE],svg=$('ue');clear(svg);var NW=narrow(svg),W=NW?440:760,H=170,L0=NW?10:200,R0=W-70,full=R0-L0;svg.setAttribute('viewBox','0 0 '+W+' '+H);\n  [[r,d.uelb[0],'var(--rms)',30],[1,d.uelb[1],'var(--econ)',NW?118:110]].forEach(function(b){var w=full*b[0]/r,y=b[3];\n    if(NW)svg.appendChild(mk('text',{x:L0,y:y-8,style:'fill:var(--muted);font-size:15px'},b[1]));\n    else svg.appendChild(mk('text',{x:L0-12,y:y+22,'text-anchor':'end',style:'fill:var(--muted);font-size:13px'},b[1]));\n    svg.appendChild(mk('rect',{x:L0,y:y,width:Math.max(w,4),height:34,rx:4,style:'fill:'+b[2]}));\n    svg.appendChild(mk('path',{d:'M'+(L0+Math.max(w,4))+' '+(y-4)+'L'+(L0+Math.max(w,4)+16)+' '+(y+17)+'L'+(L0+Math.max(w,4))+' '+(y+38)+'Z',style:'fill:'+b[2]}));\n    svg.appendChild(mk('text',{x:L0+Math.max(w,4)+22,y:y+23,style:'fill:var(--ink);font-family:var(--font-m);font-size:'+(NW?16:14)+'px;font-weight:600'},fmt(b[0])));});\n  $('ueread').innerHTML=d.uer[UE];}\nfunction renderS4(){var d=D();renderUE();$('kp4').innerHTML=d.k4.map(function(k){return '<div class=\"kpi\"><div class=\"kl\">'+k[0]+'<\/div><div class=\"kv\">'+k[1]+'<\/div><div class=\"ks\">'+k[2]+'<\/div><\/div>';}).join('');}\nfunction renderAll(){renderS1();renderGY();renderTH();renderS4();}\n\n$('tprev').addEventListener('click',function(){if(TSTEP>0){TSTEP--;LASTSEC=2;renderTD();}});\n$('tnext').addEventListener('click',function(){if(TSTEP<4){TSTEP++;LASTSEC=2;renderTD();}});\ndocument.querySelectorAll('section').forEach(function(sec,i){sec.addEventListener('pointerdown',function(){LASTSEC=i;});});\ndocument.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||LASTSEC!==2)return;if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft <script>
(function(){
  "use strict";

  var CFG   = JSON.parse(document.getElementById('configsrc').textContent);
  var TOOLS = JSON.parse(document.getElementById('toolsrc').textContent);

  var PARTIES = CFG.parties;         // {numero, couleur} ; numero vide = seuil

  var NP      = PARTIES.length;
  var PREFIXE = CFG.prefixe_stockage || 'fil';

  function tok(nom){ return 'var(--' + (nom || 'ink') + ')'; }

  /* ───────── bibliothèque d'icônes ─────────
     Chaque icône reçoit la couleur d'accent de sa carte. Pour en ajouter une,
     déclarer un cas supplémentaire et le nommer dans la configuration. */
  function emb(nom, couleur){

      case 'cibles':      return S+'<circle cx="12" cy="12" r="9" stroke="'+a+'"/><circle cx="12" cy="12" r="5.4"/><circle cx="12" cy="12" r="2" fill="var(--econ)" stroke="var(--econ)"/></svg>';
      case 'circuit':     return S+'<circle cx="12" cy="12" r="8"/><path d="M15 9.2A4 4 0 0 0 8.5 11" stroke="'+a+'"/><path d="M9 14.8A4 4 0 0 0 15.5 13" stroke="'+a+'"/><path d="M9.5 11.5h4M9.5 13h4" stroke="'+a+'"/></svg>';
      case 'eclair':      return S+'<circle cx="12" cy="12" r="8"/><path d="M12.5 7l-3.2 5.4H12l-0.6 4.2 3.6-5.6H12z" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'engrenages':  return S+'<circle cx="9" cy="10" r="3.2"/><circle cx="15.4" cy="15" r="2.6"/><path d="M9 4.6v1.6M9 13.8v1.6M3.8 10h1.6M12.6 10h1.6M5.4 6.4l1.1 1.1M11.5 12.5l1.1 1.1M12.6 6.4l-1.1 1.1M5.4 13.6l1.1-1.1" stroke="'+a+'"/></svg>';
      case 'courbes':     return S+'<path d="M3 20C10 20 12 5 21 4" stroke="'+a+'"/><path d="M3 20C9 20 9 9 20 8.5"/></svg>';
      case 'bosse':       return S+'<path d="M3.5 19C8 5 16 5 20.5 19" stroke="'+a+'"/><path d="M3 12.5h18" stroke-dasharray="2 2"/></svg>';
      case 'lecture':     return S+'<path d="M9 7l8 5-8 5z" fill="'+a+'" stroke="'+a+'"/><path d="M4 12h2"/></svg>';
      case 'seuil':       return S+'<path d="M3 20C7 20 8 8 13 8s2 8 8 8" stroke="'+a+'"/><path d="M3 6h18" stroke-dasharray="2 2"/></svg>';
      case 'divergence':  return S+'<path d="M3 18C9 18 12 15 21 14"/><path d="M3 18C9 18 11 7 21 4" stroke="'+a+'"/><path d="M3 21V3" opacity=".45"/></svg>';
      case 'fourche':     return S+'<path d="M3 12h7"/><path d="M10 12l8-5.5" stroke="'+a+'"/><path d="M10 12l8 5.5" stroke="var(--faint)"/><path d="M18 6.5l-3 .4M18 6.5l.5 2.9" stroke="'+a+'"/></svg>';
      case 'leviers':     return S+'<path d="M3 20h18"/><path d="M6 20v-7"/><path d="M12 20V6" stroke="'+a+'"/><path d="M18 20v-10"/><path d="M8.6 8.4l2.2 2.2M10.8 8.4l-2.2 2.2" stroke="var(--faint)"/><path d="M14.6 12l2.2 2.2M16.8 12l-2.2 2.2" stroke="var(--faint)"/></svg>';
      case 'anneau':      return S+'<circle cx="12" cy="12" r="8.6" stroke-dasharray="3.4 2.4"/><circle cx="12" cy="12" r="4.4" stroke="'+a+'"/></svg>';
      case 'aires':       return S+'<path d="M3 20h18"/><path d="M3 17.6c4 0 6-2.4 9-2.4s5.4 1.6 9 1.6" stroke="'+a+'"/><path d="M3 13.6c4 0 6-3.6 9-3.6s5.4 2.6 9 2.6"/><path d="M3 9.4c4 0 6-2.6 9-2.6s5.4 1.8 9 1.8" opacity=".5"/></svg>';
      case 'balance':     return S+'<path d="M12 4v16M5 8h14" stroke="'+a+'"/><path d="M5 8l-2.2 5a2.6 2.6 0 0 0 4.4 0z"/><path d="M19 8l-2.2 5a2.6 2.6 0 0 0 4.4 0z"/></svg>';
      case 'flux':        return S+'<path d="M3 8h13" stroke="'+a+'"/><path d="M16 8l-3-2.6M16 8l-3 2.6" stroke="'+a+'"/><path d="M21 16H8"/><path d="M8 16l3-2.6M8 16l3 2.6"/></svg>';
      case 'horloge':     return S+'<circle cx="12" cy="12" r="8.6"/><path d="M12 7v5.4l3.4 2" stroke="'+a+'"/></svg>';
      case 'grille':      return S+'<rect x="4" y="4" width="16" height="16" rx="2.6"/><path d="M12 4.4v15.2M4.4 12h15.2"/><path d="M5.7 5.7h5.1v5.1h-5.1z" fill="'+a+'" stroke="none"/></svg>';
      case 'carres':      return S+'<g stroke="none"><rect x="4.6" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="10.2" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="15.8" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="4.6" y="10.2" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="10.2" y="10.2" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="15.8" y="10.2" width="4.6" height="4.6" rx="1" fill="currentColor"/><rect x="4.6" y="15.8" width="4.6" height="4.6" rx="1" fill="currentColor"/><rect x="10.2" y="15.8" width="4.6" height="4.6" rx="1" fill="var(--faint)"/><rect x="15.8" y="15.8" width="4.6" height="4.6" rx="1" fill="var(--line)"/></g></svg>';
      case 'curseurs':    return S+'<path d="M3.4 7h17.2M3.4 12h17.2M3.4 17h17.2"/><circle cx="8" cy="7" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/><circle cx="15.2" cy="12" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/><circle cx="11" cy="17" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/></svg>';
      /* robinet : un apport par le haut, un niveau qui s'établit, une fuite par
         le bas — la baignoire monétaire (crédits, dépôts, remboursements). */
      /* fuite : une monnaie qui circule dans un périmètre, et ce qui en sort.
         Le trait d'accent est la fuite, pas la circulation. */
      case 'fuite':       return S+'<rect x="2.8" y="5" width="12.6" height="14" rx="2.4"/><circle cx="6.8" cy="11.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="11.2" cy="14.4" r="1.15" fill="currentColor" stroke="none"/><circle cx="6.8" cy="16.6" r="1.15" fill="currentColor" stroke="none"/><path d="M11.8 8.2h9" stroke="'+a+'"/><path d="M20.8 8.2l-2.2-1.8M20.8 8.2l-2.2 1.8" stroke="'+a+'"/></svg>';
      case 'robinet':     return S+'<path d="M3.4 5.2h5.4" stroke="'+a+'"/><path d="M8.8 5.2v2.7" stroke="'+a+'"/><circle cx="8.8" cy="9.5" r="0.8" fill="'+a+'" stroke="none"/><path d="M4.6 12.2h14.8v5.4a2 2 0 0 1-2 2H6.6a2 2 0 0 1-2-2z"/><path d="M4.6 15.1h14.8" stroke="'+a+'"/><circle cx="12" cy="22" r="0.95" fill="'+a+'" stroke="none"/></svg>';
      case 'seau':        return S+'<path d="M4.2 6.6h15.6l-1.7 9.7a1.8 1.8 0 0 1-1.8 1.5H7.7a1.8 1.8 0 0 1-1.8-1.5z"/><path d="M10.4 11.6h.01M13.7 13.6h.01" stroke="'+a+'" stroke-width="2.6"/><circle cx="10.5" cy="20.4" r="1.05" fill="'+a+'" stroke="none"/><circle cx="13.9" cy="21.4" r="0.85" fill="'+a+'" stroke="none"/></svg>';
      case 'des':         return S+'<rect x="4" y="4" width="16" height="16" rx="3.4"/><circle cx="8.6" cy="8.6" r="1.35" fill="'+a+'" stroke="none"/><circle cx="15.4" cy="8.6" r="1.35" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.35" fill="'+a+'" stroke="none"/><circle cx="8.6" cy="15.4" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.35" fill="'+a+'" stroke="none"/></svg>';
      case 'planchers':   return S+'<path d="M3 20h18"/><rect x="5" y="6.5" width="3.8" height="13.5" rx="1"/><rect x="10.1" y="9.5" width="3.8" height="10.5" rx="1"/><rect x="15.2" y="12" width="3.8" height="8" rx="1" stroke="'+a+'"/><path d="M3.8 16.8h16.4" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'mappemonde':  return S+'<circle cx="12" cy="12" r="8.6" stroke="'+a+'"/><path d="M12 3.4c3.1 3 3.1 14.2 0 17.2M12 3.4c-3.1 3-3.1 14.2 0 17.2"/><path d="M3.7 9.3h16.6M3.7 14.7h16.6"/></svg>';
      /* silhouette réelle de la courbe de l'éléphant : bosse, creux, trompe */
      case 'elephant':    return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17.5C6.6 17.5 7.2 10 9.6 10S12.6 15.2 15.4 15.2C17.4 15.2 18.2 9.5 20 4.6" stroke="'+a+'"/></svg>';
      case 'convergence': return S+'<path d="M3.2 5.5h4.4M3.2 12h4.4M3.2 18.5h4.4"/><path d="M7.6 5.5C12.8 5.5 12.8 12 16.2 12" stroke="'+a+'"/><path d="M7.6 12h8.6" stroke="'+a+'"/><path d="M7.6 18.5C12.8 18.5 12.8 12 16.2 12" stroke="'+a+'"/><circle cx="18.4" cy="12" r="2.1" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'distribution':return S+'<path d="M3 20h18"/><path d="M5.5 20v-3.2M8.5 20v-9M11.5 20v-6M14.5 20v-3.4M17.5 20v-1.8"/><path d="M12.8 4.5V20" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'lorenz':      return S+'<path d="M4 20h16M4 20V4"/><path d="M4 20L20 4" stroke-dasharray="2.5 2" opacity=".55"/><path d="M4 20C11 20 16.5 15 20 4" stroke="'+a+'"/></svg>';
      /* plusieurs séries superposées, pilotées par un même sélecteur */
      case 'series':      return S+'<path d="M4 20h16M4 20V4"/><path d="M6 14.5l3.4-3.4 3.4 3.4 3.4-6.6 2.6 2.4" stroke="'+a+'"/><path d="M6 17.8c3.4-.6 6.2 1 12-2.6" opacity=".45"/><circle cx="9.4" cy="11.1" r="1.25" fill="'+a+'" stroke="none"/><circle cx="16.2" cy="7.9" r="1.25" fill="'+a+'" stroke="none"/></svg>';
      case 'croisement':  return S+'<path d="M4 20h16M4 20V4"/><path d="M6 17.5L19 7" stroke="'+a+'" stroke-dasharray="3 2"/><circle cx="8.5" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="13.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="10.5" r="1.2" fill="'+a+'" stroke="none"/><circle cx="18" cy="8" r="1.2" fill="'+a+'" stroke="none"/></svg>';
      case 'voile':       return S+'<path d="M2.6 12S6 6.8 12 6.8 21.4 12 21.4 12 18 17.2 12 17.2 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="2.5" stroke="'+a+'"/><path d="M4.5 19.5L19.5 4.5" stroke="'+a+'"/></svg>';
      case 'course':      return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17C9 17 13 13.5 20 5.5" stroke="'+a+'"/><path d="M4.5 17C9 17 13 15.5 20 13.5"/></svg>';
      case 'ratio':       return S+'<path d="M3 20h18"/><rect x="5.5" y="4.5" width="4.6" height="15.5" rx="1.2" stroke="'+a+'"/><rect x="13.9" y="15" width="4.6" height="5" rx="1.2"/></svg>';
      case 'ecart':       return S+'<path d="M3 20h18"/><path d="M4 7h16" stroke="'+a+'"/><path d="M4 12.6C9 12.6 13.5 16 20 17"/><path d="M12 7.6v6.9" stroke="var(--faint)"/><path d="M12 7.6l-1.5 1.7M12 7.6l1.5 1.7M12 14.5l-1.5-1.7M12 14.5l1.5-1.7" stroke="var(--faint)"/></svg>';
    }
    return S+'<circle cx="12" cy="12" r="8" stroke="'+a+'"/></svg>';
  }

  /* ───────── état ───────── */
  var LANG = CFG.langue_defaut || 'fr';
  try{ var sl=localStorage.getItem(PREFIXE+'_lang'); if(sl) LANG=sl; }catch(e){}
  var THEME=null;
  try{ var st=localStorage.getItem(PREFIXE+'_theme'); if(st) THEME=st; }catch(e){}
  if(!THEME) THEME = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', THEME);

  function T(){ return CFG.textes[LANG]; }

  function seed(){
    for(var i=0;i<N;i++){
      try{
        localStorage.setItem(STEPS[i].cle+'_theme', THEME);
        localStorage.setItem(STEPS[i].cle+'_lang',  LANG);
      }catch(e){}
    }
    try{ localStorage.setItem(PREFIXE+'_theme',THEME); localStorage.setItem(PREFIXE+'_lang',LANG); }catch(e){}
  }

  /* ───────── le fil ───────── */
  function carte(i){
    var d=T(), s=STEPS[i];
    var a=document.createElement('a');
    a.className='card'; a.href='#/'+(i+1);
    a.innerHTML='<span class="emb" style="color:'+tok(s.couleur)+'">'+emb(s.icone,s.couleur)+'</span>'+
      '<span class="cbody"><span class="idx">'+(i+1)+'</span>'+
      '<h3>'+d.cartes[i].titre+'</h3><p>'+d.cartes[i].resume+'</p>'+
      '<span class="go">'+d.nav_ouvrir+' →</span></span>';
    return a;
  }

  /* Une partie sans numéro est un seuil : elle ouvre la séance sans être
     comptée dans les parties. Le fil l'annonce par une étiquette, le bandeau
     par un repère discret placé avant les chiffres romains. */
  function estSeuil(p){ var P=PARTIES[p-1]; return !!P.seuil || !P.numero; }
  function marque(p){ return estSeuil(p) ? '◦' : PARTIES[p-1].numero; }
  function etiquette(p){
    var e=T().parties[p-1].etiquette;
    return e || (LANG==='en' ? 'Opening' : 'Ouverture');
  }

  function buildFil(){
    var d=T(), box=document.getElementById('parties');
    box.innerHTML='';
    for(var p=1;p<=NP;p++){
      var sec=document.createElement('section');
      sec.className='part'+(estSeuil(p)?' seuil':'');
      sec.style.setProperty('--pc', tok(PARTIES[p-1].couleur));
      var rang = estSeuil(p)
        ? '<span class="sn">'+etiquette(p)+'</span>'
        : '<span class="rn">'+PARTIES[p-1].numero+'</span>';
      var h='<div class="parthead">'+rang+
            '<h2>'+d.parties[p-1].titre+'</h2></div>'+
            '<p class="partlead">'+d.parties[p-1].chapo+'</p>'+
            '<div class="cards"></div>';
      sec.innerHTML=h;
      var grille=sec.querySelector('.cards');
      for(var i=0;i<N;i++) if(STEPS[i].partie===p) grille.appendChild(carte(i));
      box.appendChild(sec);
    }
  }

  /* ───────── bandeau de situation ───────── */
  function premierDe(p){ for(var j=0;j<N;j++) if(STEPS[j].partie===p) return j; return 0; }

  function buildNav(i){
    var d=T(), s=STEPS[i], cur=null,
        bar=document.getElementById('nparts'), box=document.getElementById('steps');
    document.documentElement.style.setProperty('--acc', tok(PARTIES[s.partie-1].couleur));
    document.getElementById('ncount').textContent=(i+1)+' / '+N;

    bar.innerHTML='';
    for(var p=1;p<=NP;p++){
      if(p===s.partie){
        var c=document.createElement('span');
        c.className='pcur';
        /* Séance à une seule partie : le repère n'oppose la partie à rien,
           il ne reste que son intitulé. */
        c.innerHTML=(NP>1?'<em>'+marque(p)+'</em>':'')+'<span>'+d.parties[p-1].titre+'</span>';
        c.setAttribute('aria-current','true');
        bar.appendChild(c);
      } else {
        var g=document.createElement('a');
        g.className='pgrp';
        g.href='#/'+(premierDe(p)+1);
        g.title=(estSeuil(p)?etiquette(p):PARTIES[p-1].numero)+' · '+d.parties[p-1].titre;
        g.textContent=marque(p);
        bar.appendChild(g);
      }
    }

    box.innerHTML='';
    for(var j=0;j<N;j++){
      if(STEPS[j].partie!==s.partie) continue;
      var a=document.createElement('a');
      a.className='stp'+(j===i?' on':'');
      a.href='#/'+(j+1);
      a.title=d.cartes[j].titre;
      a.innerHTML='<em>'+(j+1)+'</em><span>'+d.cartes[j].titre+'</span>';
      if(j===i){ a.setAttribute('aria-current','true'); cur=a; }
      box.appendChild(a);
    }
    /* le bandeau peut être encore masqué : on attend une frame pour mesurer */
    if(cur) requestAnimationFrame(function(){
      box.scrollLeft = Math.max(0, cur.offsetLeft - (box.clientWidth - cur.offsetWidth)/2);
    });
  }

  /* ───────── iframes ───────── */
  var host=document.getElementById('host'), frames={}, current=-1;

  /* Une iframe capte le clavier dès qu'on a cliqué dedans, et la coquille ne
     voit plus rien. On y relaie donc Échap et F — et seulement eux : les
     flèches appartiennent aux outils, qui s'en servent pour leurs propres
     étapes. Les iframes srcdoc héritent de notre origine, d'où l'accès. */
  function brancherClavier(fr){
    try{
      var doc=fr.contentDocument; if(!doc) return;
      doc.addEventListener('keydown', function(ev){
        if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
        if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
        else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
      });
    }catch(e){}
  }

  function syncFrame(fr){
    if(!fr) return;
    try{
      var doc=fr.contentDocument;
      if(!doc || !doc.documentElement) return;
      for(var n=0;n<2;n++){
        if(doc.documentElement.getAttribute('data-theme')===THEME) break;
        var tb=doc.getElementById('theme'); if(!tb) break; tb.click();
      }
      for(var m=0;m<2;m++){
        if((doc.documentElement.lang||'fr')===LANG) break;
        var lb=doc.getElementById('lang'); if(!lb) break; lb.click();
      }
    }catch(e){}
  }

  function showTool(i){
    var s=STEPS[i], d=T();
    document.body.classList.add('mode-tool');
    seed();
    if(!frames[s.fichier]){
      var fr=document.createElement('iframe');
      fr.setAttribute('title', d.cartes[i].titre);
      host.appendChild(fr);
      frames[s.fichier]=fr;
      fr.addEventListener('load', function(){ syncFrame(fr); brancherClavier(fr); });
      fr.srcdoc = TOOLS[s.fichier];
    } else {
      syncFrame(frames[s.fichier]);
    }
    for(var k in frames) frames[k].style.display = (k===s.fichier) ? 'block' : 'none';
    if(plein) montrerNav(1600);
    current=i;
    buildNav(i);
    var pb=document.getElementById('prev'), nb=document.getElementById('next');
    pb.disabled=(i===0); nb.disabled=(i===N-1);
    pb.title=d.nav_prec; nb.title=d.nav_suiv;
  }

  function showFil(){
    if(plein) setPlein(false);
    document.body.classList.remove('mode-tool');
    current=-1;
    window.scrollTo(0, window.__filScroll||0);
  }

  /* ───────── plein écran ───────── */
  var plein=false, minuterieNav=null, minuterieAstuce=null;

  function montrerNav(delaiMasquage){
    document.body.classList.add('nav-on');
    clearTimeout(minuterieNav);
    if(delaiMasquage) minuterieNav=setTimeout(function(){
      document.body.classList.remove('nav-on');
    }, delaiMasquage);
  }

  function demanderPleinEcran(){
    var el=document.documentElement;
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(f){ try{ var p=f.call(el); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }
  function quitterPleinEcran(){
    var actif=document.fullscreenElement||document.webkitFullscreenElement;
    if(!actif) return;
    var f=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(f){ try{ var p=f.call(document); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }

  function setPlein(v){
    if(plein===v) return;
    plein=v;
    document.body.classList.toggle('mode-plein', v);
    var b=document.getElementById('tplein'), d=T();
    b.textContent = v ? '⤡' : '⤢';
    b.title = v ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    if(v){
      demanderPleinEcran();
      montrerNav(2400);
      document.getElementById('pastille').textContent =
        (d.nav_plein_astuce||'Approchez du haut pour revoir la barre · Échap pour sortir');
      document.body.classList.add('astuce');
      clearTimeout(minuterieAstuce);
      /* l'astuce doit rester lisible après le retrait du bandeau, pas pendant */
      minuterieAstuce=setTimeout(function(){ document.body.classList.remove('astuce'); }, 6500);
    } else {
      quitterPleinEcran();
      clearTimeout(minuterieNav); clearTimeout(minuterieAstuce);
      document.body.classList.remove('nav-on','astuce');
    }
  }

  document.getElementById('tplein').addEventListener('click', function(){ setPlein(!plein); });
  document.getElementById('hotzone').addEventListener('mouseenter', function(){ montrerNav(0); });
  document.querySelector('.nav').addEventListener('mouseleave', function(){ if(plein) montrerNav(500); });
  /* Sortie par F11 ou par la touche Échap interceptée par le navigateur :
     on resynchronise la coquille sur l'état réel. */
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement||document.webkitFullscreenElement) && plein) setPlein(false);
    });
  });

  function route(){
    var h=(location.hash||'').replace(/^#\/?/,'');
    var n=parseInt(h,10);
    if(h && !isNaN(n) && n>=1 && n<=N){
      if(current===-1) window.__filScroll = window.pageYOffset||0;
      showTool(n-1);
    } else {
      showFil();
    }
  }
  window.addEventListener('hashchange', route);

  function go(i){
    if(i<0){ location.hash='#/fil'; return; }
    if(i>N-1) return;
    location.hash='#/'+(i+1);
  }
  document.getElementById('prev').addEventListener('click', function(){ if(current>0) go(current-1); });
  document.getElementById('next').addEventListener('click', function(){ if(current>-1 && current<N-1) go(current+1); });

  document.addEventListener('keydown', function(ev){
    if(current===-1) return;
    if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
    else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
    else if(ev.key==='ArrowLeft'  && current>0)   { go(current-1); }
    else if(ev.key==='ArrowRight' && current<N-1) { go(current+1); }
  });

  /* ───────── bascules ───────── */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', THEME);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleTheme(){ THEME=(THEME==='dark')?'light':'dark'; applyTheme(); }
  document.getElementById('theme').addEventListener('click', toggleTheme);
  document.getElementById('ttheme').addEventListener('click', toggleTheme);

  function applyLang(){
    var d=T();
    document.documentElement.lang=LANG;
    document.title = d.titre_onglet;
    document.getElementById('eyebrow').innerHTML = d.surtitre;
    document.getElementById('titre').textContent = d.titre;
    document.getElementById('seance').textContent = d.seance;
    document.getElementById('chapo').innerHTML = d.chapo;
    document.getElementById('pied').innerHTML = d.pied;
    document.getElementById('licence').innerHTML = d.licence;
    document.getElementById('homelbl').textContent = d.nav_fil;
    /* Remontée vers la page du cours : seulement si le manifeste la déclare.
       Une séance diffusée seule, sans page d'accueil à côté, n'affiche rien
       plutôt qu'un lien qui mènerait à une erreur. */
    var lien = CFG.lien_accueil, rm = document.getElementById('remonte'),
        ab = document.getElementById('accueilbtn');
    if(lien){
      rm.href = lien; ab.href = lien;
      rm.hidden = false; ab.hidden = false;
      document.getElementById('remontelbl').textContent = d.nav_accueil || 'Le cours';
      ab.title = d.nav_accueil || 'Le cours';
    } else {
      rm.hidden = true; ab.hidden = true;
    }
    var bp=document.getElementById('tplein');
    bp.title = plein ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    document.getElementById('langlbl').textContent = LANG.toUpperCase();
    document.getElementById('tlanglbl').textContent = LANG.toUpperCase();
    buildFil();
    if(current>-1) buildNav(current);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleLang(){
    var codes=Object.keys(CFG.textes);
    LANG = codes[(codes.indexOf(LANG)+1) % codes.length];
    applyLang();
  }
  document.getElementById('lang').addEventListener('click', toggleLang);
  document.getElementById('tlang').addEventListener('click', toggleLang);

  /* ───────── démarrage ───────── */
  seed();
  applyLang();
  route();
})();
</script>

</body>
</html>
