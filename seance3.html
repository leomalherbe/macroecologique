<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;
    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;
    --econ:#2A78D6;--eco:#2E8B57;--rms:#C08A00;--warn:#C0392B;--fish:#0E7C9B;
    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);
    --font-d:"Spectral","IBM Plex Sans",Georgia,serif;/* IBM Plex en second : Spectral n'a pas le grec, β et α y retomberaient sur Georgia */--font-b:"IBM Plex Sans",system-ui,sans-serif;--font-m:"IBM Plex Mono",ui-monospace,monospace;
  }
  :root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}
  body.mode-tool{overflow:hidden;}

  /* ───────── vue « fil » ───────── */
  .wrap{max-width:1080px;margin:0 auto;padding-block:28px 56px;padding-inline:20px;}
  header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .remonte{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-m);font-size:11.5px;color:var(--faint);text-decoration:none;margin:0 0 12px;padding:3px 0;}
  .remonte:hover{color:var(--ink);}
  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:400;margin:0 0 7px;text-wrap:pretty;}
  .eyebrow b{color:var(--fish);font-weight:500;}
  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.6vw,44px);line-height:1.03;margin:0;letter-spacing:-.015em;text-wrap:balance;}
  .seance{font-family:var(--font-d);font-weight:500;font-size:clamp(17px,2.1vw,21px);line-height:1.15;color:var(--muted);margin:7px 0 0;}
  .sub{color:var(--muted);font-size:15.5px;margin:14px 0 0;max-width:80ch;text-wrap:pretty;}
  .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}
  .toggles{display:flex;gap:8px;flex-shrink:0;}
  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}
  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}
  .tg:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--rms);outline-offset:2px;}

  .part{margin-top:40px;}
  .parthead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px;}
  .parthead .rn{font-family:var(--font-m);font-size:12px;font-weight:600;color:#fff;background:var(--pc);border-radius:7px;padding:3px 10px;line-height:1;flex-shrink:0;}
  /* Une partie-seuil ouvre la séance sans prendre de rang : étiquette ajourée
     plutôt que badge plein, pour qu'elle ne se lise pas comme une partie I. */
  .parthead .sn{font-family:var(--font-m);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--pc);background:transparent;border:1px solid var(--pc);border-radius:7px;padding:3px 9px;line-height:1;flex-shrink:0;}
  .parthead h2{font-family:var(--font-d);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance;}
  .partlead{color:var(--muted);font-size:14px;margin:10px 0 16px;max-width:84ch;text-wrap:pretty;}
  .partlead b{color:var(--ink);font-weight:600;} .partlead i{font-family:var(--font-d);font-style:italic;}

  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media (max-width:680px){.cards{grid-template-columns:1fr;}}
  a.card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;transition:border-color .15s,transform .15s;}
  a.card:hover{border-color:var(--faint);transform:translateY(-1px);}
  .emb{flex-shrink:0;width:46px;height:46px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .emb svg{width:26px;height:26px;}
  .cbody{flex:1;min-width:0;}
  .cbody .idx{font-family:var(--font-m);font-size:11px;color:var(--faint);}
  .cbody h3{font-family:var(--font-d);font-weight:600;font-size:16.5px;margin:1px 0 3px;line-height:1.15;text-wrap:balance;}
  .cbody p{font-size:12.8px;color:var(--muted);margin:0;text-wrap:pretty;}
  .cbody .go{font-family:var(--font-m);font-size:11.5px;color:var(--fish);font-weight:500;margin-top:7px;display:inline-block;}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px;text-align:center;text-wrap:balance;}
  footer p{margin:0 0 7px;} footer p:last-child{margin-bottom:0;}
  footer a{color:var(--muted);text-decoration:underline;text-underline-offset:2px;}
  footer a:hover{color:var(--ink);}
  .lic{max-width:62ch;margin-inline:auto;text-wrap:pretty;line-height:1.6;}
  .lic a{white-space:nowrap;}

  /* ───────── vue « outil » ───────── */
  #view-tool{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);}
  body.mode-tool #view-tool{display:flex;}
  body.mode-tool #view-fil{display:none;}
  .nav{display:flex;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;}
  .navrow{display:flex;align-items:center;gap:10px;padding:7px 14px;}
  .navrow.r1{min-height:46px;}
  .nbtn{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:7px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1;}
  .nbtn:hover:not([disabled]){color:var(--ink);border-color:var(--faint);}
  .nbtn[disabled]{opacity:.35;cursor:default;}
  .nbtn.home{color:var(--ink);font-weight:500;}
  .nparts{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding-inline:4px;}
  .pcur{display:inline-flex;align-items:baseline;gap:9px;min-width:0;font-family:var(--font-d);font-weight:600;font-size:15.5px;line-height:1.15;white-space:nowrap;}
  .pcur em{font-family:var(--font-m);font-style:normal;font-size:12px;font-weight:600;color:var(--acc);flex-shrink:0;}
  .pcur span{overflow:hidden;text-overflow:ellipsis;}
  .ngroup{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .ncount{font-family:var(--font-m);font-size:11.5px;color:var(--faint);min-width:46px;text-align:center;}

  .navrow.r2{gap:4px;border-top:1px solid var(--line);padding-block:5px;overflow-x:auto;scrollbar-width:none;background:var(--panel);}
  .navrow.r2::-webkit-scrollbar{display:none;}
  .stp{display:inline-flex;align-items:baseline;gap:7px;flex:0 0 auto;min-width:0;max-width:260px;padding:5px 10px;border-radius:8px;border:1px solid transparent;text-decoration:none;color:var(--faint);font-size:12.5px;line-height:1.2;white-space:nowrap;}
  .stp em{font-family:var(--font-m);font-style:normal;font-size:10.5px;flex-shrink:0;opacity:.8;}
  .stp span{overflow:hidden;text-overflow:ellipsis;}
  .stp:hover{color:var(--ink);background:var(--surface);}
  .stp.on{color:var(--ink);font-weight:600;background:var(--surface);border-color:var(--line);box-shadow:inset 2px 0 0 var(--acc);max-width:none;}
  .stp.on em{color:var(--acc);opacity:1;}
  .pgrp{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);text-decoration:none;font-family:var(--font-m);font-size:11px;font-weight:600;color:var(--faint);line-height:1;}
  .pgrp:hover{color:var(--ink);background:var(--surface);border-color:var(--faint);}

  .host{flex:1;position:relative;min-height:0;}
  .host iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);}

  /* ───────── plein écran ─────────
     Le bandeau se retire au-dessus du bord et revient dès que le pointeur
     approche du haut. La bande de déclenchement #hotzone appartient à la page
     hôte : indispensable, car une iframe absorbe les mouvements de souris et
     la coquille ne les verrait jamais. */
  body.mode-plein .nav{position:absolute;top:0;left:0;right:0;z-index:6;
    transform:translateY(-100%);transition:transform .18s ease;box-shadow:0 8px 26px rgba(0,0,0,.20);}
  body.mode-plein.nav-on .nav{transform:none;}
  #hotzone{display:none;}
  body.mode-plein #hotzone{display:block;position:absolute;top:0;left:0;right:0;height:6px;z-index:7;}
  body.mode-plein.nav-on #hotzone{display:none;}
  .pastille{display:none;}
  body.mode-plein .pastille{display:block;position:absolute;top:10px;right:14px;z-index:5;
    font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;color:var(--faint);
    background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 9px;
    opacity:0;transition:opacity .4s ease;pointer-events:none;}
  body.mode-plein.astuce .pastille{opacity:.92;}
  @media (prefers-reduced-motion:reduce){
    body.mode-plein .nav{transition:none;} .pastille{transition:none;}
  }
  @media (max-width:640px){
    .pcur{font-size:13.5px;}
    .nbtn{padding:7px 8px;} .ncount{min-width:38px;}
    .nbtn.home span{display:none;}
    .stp{max-width:200px;}
    .navrow{padding-inline:10px;}
  }
</style>
</head>

tèmes — un système dure s'il équilibre <b>efficacité et résilience<\/b>, et cet équilibre tient à la diversité de ses voies. Le deuxième décrit la <b>diversité de l'économie réelle<\/b> : quatre types de biens, trois logiques institutionnelles. Le troisième la <b>mesure<\/b>, avec les indices de Simpson, Shannon et Pielou. Sept outils interactifs, dans l'ordre du fil : chacun s'ouvre ici même, et l'on revient au fil d'un clic.", "parties": [{"titre": "Au-delà du PIB", "chapo": "De 2000 à 2022, le revenu mondial double. Le <b>Donut<\/b> de Kate Raworth vérifie ce que cette croissance a produit : les manques sociaux reculent à peine, les dépassements écologiques s'aggravent. La croissance ne suffit pas à ramener l'humanité dans l'espace sûr et juste. Il faut donc d'autres critères de prospérité — c'est la question dont part la séance.", "etiquette": "Ouverture"}, {"titre": "Le modèle biomimétique", "chapo": "L'écologie a forgé un critère pour juger si un système peut durer : la <b>résilience<\/b>. Un réseau trop efficace casse au premier choc, un réseau trop redondant stagne ; ceux qui durent se situent dans une <b>fenêtre de vitalité<\/b>. Goerner, Lietaer et Ulanowicz transposent cette mesure aux flux monétaires : à PIB égal, la diversité des logiques institutionnelles décide de la capacité d'une économie à encaisser un choc."}, {"titre": "La diversité dans l'économie", "chapo": "Une économie produit <b>quatre types de biens<\/b>, que deux questions suffisent à distinguer : la consommation de l'un prive-t-elle les autres, peut-on en empêcher l'accès ? Chaque type appelle son organisation. En France, <b>trois logiques<\/b> se partagent l'emploi : le secteur marchand, le secteur public et l'économie sociale et solidaire, chacune avec son principe et sa propre diversité interne."}, {"titre": "Mesurer la diversité : Simpson, Shannon, Pielou", "chapo": "Pour comparer des économies, il faut résumer leur diversité par un nombre. <b>Simpson<\/b> pose une question de probabilité : deux individus tirés au hasard sont-ils de la même catégorie ? <b>Shannon<\/b> mesure l'incertitude sur la catégorie d'un individu, et <b>Pielou<\/b> la rapporte à son maximum. Chaque indice a une borne qui dépend du nombre de catégories : c'est à elle qu'il faut comparer le résultat."}], "cartes": [{"titre": "Le PIB double, le Donut se dégrade", "resume": "On fait défiler les années 2000 à 2022 : le revenu mondial double, les manques sociaux reculent à peine, les dépassements s'aggravent. Trois groupes de pays montrent qui porte le manque et qui cause le dépassement. Puis on mesure combien de manque est comblé pour chaque point de dépassement ajouté : à peine <b>0,2<\/b>."}, {"titre": "La fenêtre de vitalité", "resume": "Une chaîne alimentaire efficace perd tout quand une espèce disparaît, un réseau redondant tient. On mesure cet équilibre entre <b>efficacité et réserve<\/b>, puis on fait circuler le même PIB par une, trois ou trente logiques institutionnelles : seule, la logique marchande sort de la fenêtre ; trop de petites unités la font basculer dans la stagnation."}, {"titre": "Diversité et chocs", "resume": "Trois raisons pour lesquelles la diversité protège : adaptation, effet portefeuille, synergie. On retire des secteurs face à la crise de 2020 et l'on voit quels besoins restent sans réponse ; puis on compose une économie et l'on mesure, sur trente ans simulés, combien elle est plus stable qu'une économie <b>100 % marchande<\/b>."}, {"titre": "Classer les biens", "resume": "Ma consommation prive-t-elle les autres ? Peut-on empêcher l'accès ? On classe <b>dix-huit biens<\/b> avec un retour sur chaque réponse, puis on voit quelle organisation peut produire chaque type, et comment une route change de case selon le péage et la saturation."}, {"titre": "Trois logiques, une économie", "resume": "Cent carrés pour l'emploi en France : deux tiers dans le marchand, un quart dans le public, près d'un dixième dans l'<b>ESS<\/b>. On découvre le principe de chaque logique, puis la diversité qu'elle abrite : 312 grandes entreprises qui produisent un tiers de la valeur ajoutée marchande, trois versants de la fonction publique, quatre principes de l'ESS."}, {"titre": "L'urne de Simpson", "resume": "On tire deux jetons au hasard, encore et encore : la part des paires de même catégorie converge vers <b>λ<\/b>. Un carré montre pourquoi λ est une somme de carrés, puis on lit D = 1 − λ par rapport à son maximum 1 − 1/S. Le même secteur marchand est très peu divers en nombre d'entreprises, presque au maximum en valeur ajoutée."}, {"titre": "Le laboratoire des indices", "resume": "On tire des individus un à un en notant la surprise de chaque tirage : la moyenne converge vers <b>H<\/b>, l'indice de Shannon, que Pielou rapporte à son maximum ln S. Puis on règle les parts de S catégories et l'on voit les trois indices réagir ensemble. Enfin on ajoute une catégorie qui ne pèse que <b>1 %<\/b> : S augmente, les maximums se déplacent, et la lecture change."}], "pied": "Parcours du cours de macroéconomie écologique — chaque carte ouvre l'outil interactif correspondant.", "licence": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — réutilisation et adaptation libres à des fins non commerciales, avec attribution et sous la même licence.", "nav_fil": "Le fil", "nav_accueil": "Le cours", "nav_ouvrir": "Ouvrir l’outil", "nav_prec": "Outil précédent", "nav_suiv": "Outil suivant", "nav_plein": "Plein écran (F)", "nav_plein_sortie": "Quitter le plein écran (Échap)", "nav_plein_astuce": "Approchez du haut pour revoir la barre · Échap pour sortir"}, "en": {"titre_onglet": "Ecological macroeconomics — Session 3: the thread of the course", "surtitre": "<b>Ecological macroeconomics<\/b> · Léo Malherbe · KEDGE Business School", "titre": "The thread of the course", "seance": "Session 3 — Diversity and resilience", "chapo": "An opening, then three movements. The opening observes that GDP growth does not bring societies back into the <b>Doughnut<\/b>: other criteria are needed. The first movement looks for them in ecosystems — a system lasts if it balances <b>efficiency and resilience<\/b>, and that balance rests on the diversity of its pathways. The second describes the <b>diversity of the real economy<\/b>: four types of goods, three institutional logics. The third <b>measures<\/b> it, with the Simpson, Shannon and Pielou indices. Seven interactive tools, in the order of the thread: each opens right here, and one click brings you back.", "parties": [{"titre": "Beyond GDP", "chapo": "From 2000 to 2022, world income doubles. Kate Raworth's <b>Doughnut<\/b> checks what that growth produced: social shortfalls barely recede, ecological overshoots worsen. Growth is not enough to bring humanity back into the safe and just space. Other criteria of prosperity are needed — that is the question this session starts from.", "etiquette": "Opening"}, {"titre": "The biomimetic model", "chapo": "Ecology has forged a criterion for judging whether a system can last: <b>resilience<\/b>. A network that is too efficient breaks at the first shock, one that is too redundant stagnates; those that last sit inside a <b>window of vitality<\/b>. Goerner, Lietaer and Ulanowicz transpose this measure to monetary flows: at equal GDP, the diversity of institutional logics decides an economy's capacity to absorb a shock."}, {"titre": "Diversity in the economy", "chapo": "An economy produces <b>four types of goods<\/b>, which two questions suffice to tell apart: does one person's consumption deprive others, and can access be prevented? Each type calls for its own organisation. In France, <b>three logics<\/b> share employment: the market sector, the public sector and the social and solidarity economy, each with its principle and its own internal diversity."}, {"titre": "Measuring diversity: Simpson, Shannon, Pielou", "chapo": "To compare economies, their diversity must be summed up in a number. <b>Simpson<\/b> asks a question of probability: are two individuals drawn at random of the same category? <b>Shannon<\/b> measures the uncertainty about an individual's category, and <b>Pielou<\/b> relates it to its maximum. Each index has a bound that depends on the number of categories: that is what the result must be compared with."}], "cartes": [{"titre": "GDP doubles, the Doughnut worsens", "resume": "Scroll through the years 2000 to 2022: world income doubles, social shortfalls barely recede, overshoots worsen. Three groups of countries show who bears the shortfall and who causes the overshoot. Then measure how much shortfall is closed for each point of overshoot added: barely <b>0.2<\/b>."}, {"titre": "The window of vitality", "resume": "An efficient food chain loses everything when one species disappears; a redundant network holds. Measure this balance between <b>efficiency and reserve<\/b>, then route the same GDP through one, three or thirty institutional logics: alone, the market logic falls outside the window; too many small units tip it into stagnation."}, {"titre": "Diversity and shocks", "resume": "Three reasons why diversity protects: adaptation, portfolio effect, synergy. Remove sectors facing the 2020 crisis and see which needs go unmet; then compose an economy and measure, over thirty simulated years, how much more stable it is than a <b>fully market-based<\/b> one."}, {"titre": "Classifying goods", "resume": "Does my consumption deprive others? Can access be prevented? Classify <b>eighteen goods<\/b> with feedback on each answer, then see which organisation can produce each type, and how a road changes category depending on tolls and congestion."}, {"titre": "Three logics, one economy", "resume": "A hundred squares for employment in France: two thirds in the market sector, a quarter in the public sector, nearly a tenth in the <b>social and solidarity economy<\/b>. Discover the principle of each logic, then the diversity it holds: 312 large firms producing a third of market value added, three branches of the civil service, four principles of the SSE."}, {"titre": "Simpson's urn", "resume": "Draw two tokens at random, over and over: the share of same-category pairs converges on <b>λ<\/b>. A square shows why λ is a sum of squares, then read D = 1 − λ against its maximum 1 − 1/S. The same market sector is barely diverse by number of firms, and almost maximally so by value added."}, {"titre": "The index laboratory", "resume": "Draw individuals one by one, noting the surprise of each draw: the average converges on <b>H<\/b>, the Shannon index, which Pielou relates to its maximum ln S. Then set the shares of S categories and watch the three indices react together. Finally add a category weighing just <b>1 %<\/b>: S rises, the maximums shift, and the reading changes."}], "pied": "Course path for ecological macroeconomics — each card opens the matching interactive tool.", "licence": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — free to reuse and adapt for non-commercial purposes, with attribution and under the same licence.", "nav_fil": "The thread", "nav_accueil": "The course", "nav_ouvrir": "Open the tool", "nav_prec": "Previous tool", "nav_suiv": "Next tool", "nav_plein": "Full screen (F)", "nav_plein_sortie": "Exit full screen (Esc)", "nav_plein_astuce": "Move to the top edge to bring the bar back · Esc to exit"}}}</script>

ncome inequality (Palma)\"],\n PV1:[\"Régimes autoritaires\",\"Autocratic regimes\"],PJ1:[\"Corruption perçue\",\"Perceived corruption\"],\n PJ2:[\"Homicides (≥ 5 pour 100 000)\",\"Homicides (≥ 5 per 100,000)\"],\n CC3:[\"Empreinte carbone\",\"Carbon footprint\"],NP3:[\"Empreinte phosphore\",\"Phosphorus footprint\"],NP4:[\"Empreinte azote\",\"Nitrogen footprint\"],\n FD3:[\"Empreinte en eau bleue\",\"Blue-water footprint\"],BB3:[\"Empreinte biodiversité\",\"Biodiversity footprint\"],BB4:[\"Empreinte HANPP\",\"HANPP footprint\"]\n};\nvar DIMS={\n eco:[[\"climate change\",[\"Climat\",\"Climate\"],[\"CC1\",\"CC2\"],[\"CC3\"]],\n      [\"ocean acidification\",[\"Acidification des océans\",\"Ocean acidification\"],[\"OA1\"],[]],\n      [\"chemical pollution\",[\"Pollution chimique\",\"Chemical pollution\"],[\"CP1\"],[]],\n      [\"nutrient pollution\",[\"Azote & phosphore\",\"Nitrogen & phosphorus\"],[\"NP1\",\"NP2\"],[\"NP3\",\"NP4\"]],\n      [\"freshwater disruption\",[\"Eau douce\",\"Freshwater\"],[\"FD1\",\"FD2\"],[\"FD3\"]],\n      [\"land conversion\",[\"Usage des sols\",\"Land conversion\"],[\"LC1\"],[]],\n      [\"biodiversity breakdown\",[\"Biodiversité\",\"Biodiversity\"],[\"BB1\",\"BB2\"],[\"BB3\",\"BB4\"]],\n      [\"air pollution\",[\"Pollution de l'air\",\"Air pollution\"],[\"AP1\"],[]],\n      [\"ozone depletion\",[\"Couche d'ozone\",\"Ozone layer\"],[\"OD1\"],[]]],\n soc:[[\"food\",[\"Alimentation\",\"Food\"],[\"NU1\",\"NU2\"],null,[\"Alimentation\",\"Food\"]],[\"health\",[\"Santé\",\"Health\"],[\"HE1\",\"HE2\"],null,[\"Santé\",\"Health\"]],\n      [\"education\",[\"Éducation\",\"Education\"],[\"ED1\",\"ED2\"],null,[\"Éducation\",\"Education\"]],[\"income and work\",[\"Revenu & travail\",\"Income & work\"],[\"IW1\",\"IW2\"],null,[\"Revenu\",\"Income\"]],\n      [\"water\",[\"Eau\",\"Water\"],[\"WA1\",\"WA2\"],null,[\"Eau\",\"Water\"]],[\"energy\",[\"Énergie\",\"Energy\"],[\"EN1\",\"EN2\"],null,[\"Énergie\",\"Energy\"]],\n      [\"connectivity\",[\"Connectivité\",\"Connectivity\"],[\"CO1\",\"CO2\"],null,[\"Réseaux\",\"Networks\"]],[\"housing\",[\"Logement\",\"Housing\"],[\"HO1\"],null,[\"Logement\",\"Housing\"]],\n      [\"equality\",[\"Égalité de genre\",\"Gender equality\"],[\"EQ1\"],null,[\"Égalité\",\"Equality\"]],[\"social cohesion\",[\"Cohésion sociale\",\"Social cohesion\"],[\"SC1\",\"SC2\"],null,[\"Cohésion\",\"Cohesion\"]],\n      [\"political voice\",[\"Voix politique\",\"Political voice\"],[\"PV1\"],null,[\"Démocratie\",\"Democracy\"]],[\"peace and justice\",[\"Paix & justice\",\"Peace & justice\"],[\"PJ1\",\"PJ2\"],null,[\"Justice\",\"Justice\"]]]\n};\nvar G={};GLOB.forEach(function(x){G[x.c]=x;});\nvar YEARS=[];for(var y=2000;y<=2022;y++)YEARS.push(y);\n\n/* ---------- textes ---------- */\nvar T={\nfr:{\n eyebrow:\"Séance 3 · Au-delà du PIB\",\n title:\"Le PIB double, le Donut se dégrade\",\n sub:\"Entre 2000 et 2022, le revenu mondial a <b>doublé<\/b>. Le Donut de Kate Raworth permet de vérifier ce que cette croissance a produit : a-t-elle ramené l'humanité au-dessus du <b>plancher social<\/b> sans franchir le <b>plafond écologique<\/b> ? On rejoue ici la dernière mesure, publiée dans <i>Nature<\/i> par Fanning et Raworth (2025).\",\n s1t:\"Le Donut mondial, année par année\",\n s1d:\"Chaque pointe est un indicateur. <b>Vers l'intérieur<\/b>, la part de l'humanité qui reste <b>sous le plancher social<\/b>. <b>Vers l'extérieur<\/b>, le <b>dépassement<\/b> d'une limite planétaire. L'anneau vert est l'espace sûr et juste. Faites défiler les années et comparez trois choses : la croissance du revenu, le recul des manques, la progression des dépassements. Touchez une pointe pour lire sa valeur.\",\n year:\"Année\", play:\"▶ Lecture\", pause:\"⏸ Pause\",\n lg_short:\"manque social (part de l'humanité)\", lg_over:\"dépassement écologique\", lg_safe:\"espace sûr et juste\", lg_in:\"dans la limite\", lg_na:\"non mesuré\",\n sp1:\"Revenu mondial (RNB réel)\", sp1d:\"indice, 2000 = 100\", sp2:\"Manque social médian\", sp2d:\"médiane des 21 indicateurs sociaux\", sp3:\"Dépassement écologique médian\", sp3d:\"médiane des 13 indicateurs ; le palier 2005-2018 tient à l’eau bleue, mesurée jusqu’en 2005 puis prolongée\",\n xc_t:\"Combien de manque comblé pour un point de dépassement ?\",\n xc_k:\"Rapport depuis 2000\",\n xc_y:\"↑ manque comblé (points)\",\n xc_ref1:\"pente 1 : un pour un\",\n xc_s:\"De 2000 à {y}, le manque social a reculé de <b>{ds} points<\/b> et le dépassement écologique a progressé de <b>{de} points<\/b>. Chaque point de dépassement en plus s'accompagne de <b>{r} point<\/b> de manque en moins. Autrement dit, il a fallu <b>{inv} points<\/b> de dépassement pour combler un point de manque.\",\n xc_s0:\"Avancez d'au moins une année pour mesurer le rapport entre le manque comblé et le dépassement ajouté depuis 2000.\",\n xc_x:\"dépassement ajouté depuis 2000 (points) →\",\n xc_ref:\"pente 0,2\",\n xc_n:\"Variation médiane des indicateurs entre 2000 et l'année choisie (21 sociaux, 13 écologiques). Les unités diffèrent : part de l'humanité d'un côté, distance à la limite de l'autre. Ce rapport décrit la trajectoire observée ; il ne mesure pas un lien de cause à effet.\",\n fiche0:\"Touchez ou survolez une pointe du donut pour afficher l'indicateur.\",\n f_short:\"de l'humanité sous le seuil\", f_over:\"au-delà de la limite\", f_within:\"en deçà de la limite\", f_interp:\"Valeur interpolée ou prolongée : pas d'observation cette année-là.\", f_obs:\"Valeur observée.\",\n f_start:\"en 2000\",\n ring_floor:\"plancher social\", ring_ceil:\"plafond écologique\",\n s2t:\"Trois groupes de pays, trois positions dans le Donut\",\n s2d:\"Les auteurs classent 193 pays selon leur revenu moyen par habitant sur 2000-2022. Côté écologique, on compare ici l'<b>empreinte par habitant<\/b> de chaque groupe à sa <b>part équitable<\/b> de la limite planétaire (2017). Seuls six indicateurs peuvent être ramenés à l'habitant. Les autres limites apparaissent en gris. Attention : les groupes partagent les <b>pays<\/b>, pas la population. Les 40 % de pays les plus pauvres abritent 42 % de l’humanité, les 40 % intermédiaires 43 %, les 20 % les plus riches 15 %.\",\n g_B40:\"40 % des pays les plus pauvres\", g_M40:\"40 % des pays intermédiaires\", g_T20:\"20 % des pays les plus riches\",\n g_B40s:\"revenu < 8 100 $ PPA · 78 pays\", g_M40s:\"8 100 – 33 200 $ PPA · 77 pays\", g_T20s:\"revenu > 33 200 $ PPA · 38 pays\",\n k1:\"Population mondiale\", k2:\"Manque social médian\", k3:\"Dépassement médian\",\n shareT:\"Qui porte le manque, qui cause le dépassement ? (médianes, en %)\",\n sh_pop:\"population\", sh_short:\"manque social mondial\", sh_over:\"dépassement écologique mondial\",\n fiche2:\"Les 20 % de pays les plus riches comptent <b>15 %<\/b> de la population mondiale mais causent <b>44 %<\/b> du dépassement écologique, contre <b>4 %<\/b> pour les 40 % de pays les plus pauvres. Ceux-ci portent en retour <b>63 %<\/b> du manque social.\",\n s3t:\"Le rythme ne suffit pas\",\n s3d:\"Les auteurs mesurent la vitesse moyenne de chaque indicateur entre 2000 et 2022 (en points de pourcentage par an), puis la comparent à la vitesse nécessaire pour atteindre l'objectif fixé.\",\n p1t:\"Plancher social : trop lent\", p1d:\"Le manque recule de 0,5 point par an (médiane). Pour le combler d'ici 2030, il faudrait aller <b>4,9 fois plus vite<\/b>.\",\n p2t:\"Plafond écologique : dans le mauvais sens\", p2d:\"Les dépassements progressent de 3,9 points par an (médiane des tendances significatives). Pour revenir sous les limites d'ici 2050, il faudrait les <b>réduire<\/b> de 6,9 points par an.\",\n pc_obs:\"2000-2022 (observé)\", pc_need1:\"nécessaire pour 2030\", pc_need2:\"nécessaire pour 2050\", pc_unit:\"points de % par an\", pc_better:\"amélioration →\", pc_worse:\"← dégradation\",\n lesson:\"<b>La croissance du PIB ne ramène pas les sociétés dans le Donut.<\/b> Le revenu mondial double, les manques sociaux reculent à peine, les dépassements s'aggravent vite. D'où la question suivante du cours : quels <b>critères<\/b> permettent à un système de prospérer durablement dans un monde fini ? L'économie écologique va les chercher du côté des écosystèmes.\",\n foot:\"Données : Fanning, A. L. &amp; Raworth, K. (2025), « Doughnut of social and planetary boundaries monitors a world out of balance », <i>Nature<\/i> 646, 47-56 — dépôt de données doughnut-v3 (Zenodo 10.5281/zenodo.15688961). Revenu mondial : somme des RNB réels par habitant × population des 193 pays de l'étude (PPA constants). Les valeurs manquantes d'une année sont interpolées entre deux observations, ou prolongées aux extrémités ; la fiche de chaque indicateur le signale.\",\n na:\"n.d.\"\n},\nen:{\n eyebrow:\"Session 3 · Beyond GDP\",\n title:\"GDP doubles, the Doughnut worsens\",\n sub:\"Between 2000 and 2022, world income <b>doubled<\/b>. Kate Raworth's Doughnut lets us check what that growth delivered: did it lift humanity above the <b>social foundation<\/b> without breaking through the <b>ecological ceiling<\/b>? Here we replay the latest measurement, published in <i>Nature<\/i> by Fanning and Raworth (2025).\",\n s1t:\"The global Doughnut, year by year\",\n s1d:\"Each spike is one indicator. <b>Inward<\/b>, the share of humanity still <b>below the social foundation<\/b>. <b>Outward<\/b>, the <b>overshoot<\/b> of a planetary boundary. The green ring is the safe and just space. Scroll through the years and compare three things: income growth, the retreat of shortfalls, the advance of overshoot. Tap a spike to read its value.\",\n year:\"Year\", play:\"▶ Play\", pause:\"⏸ Pause\",\n lg_short:\"social shortfall (share of humanity)\", lg_over:\"ecological overshoot\", lg_safe:\"safe and just space\", lg_in:\"within the boundary\", lg_na:\"not measured\",\n sp1:\"World income (real GNI)\", sp1d:\"index, 2000 = 100\", sp2:\"Median social shortfall\", sp2d:\"median of the 21 social indicators\", sp3:\"Median ecological overshoot\", sp3d:\"median of the 13 indicators; the 2005-2018 plateau comes from blue water, measured until 2005 then carried forward\",\n xc_t:\"How much shortfall closed for one point of overshoot?\",\n xc_k:\"Ratio since 2000\",\n xc_y:\"↑ shortfall closed (points)\",\n xc_ref1:\"slope 1: one for one\",\n xc_s:\"From 2000 to {y}, social shortfall fell by <b>{ds} points<\/b> and ecological overshoot rose by <b>{de} points<\/b>. Each extra point of overshoot comes with <b>{r} point<\/b> less shortfall. Put differently, it took <b>{inv} points<\/b> of overshoot to close one point of shortfall.\",\n xc_s0:\"Move forward at least one year to measure the ratio between shortfall closed and overshoot added since 2000.\",\n xc_x:\"overshoot added since 2000 (points) →\",\n xc_ref:\"slope 0.2\",\n xc_n:\"Median change of the indicators between 2000 and the chosen year (21 social, 13 ecological). The units differ: share of humanity on one side, distance to the boundary on the other. This ratio describes the observed path; it does not measure cause and effect.\",\n fiche0:\"Tap or hover over a spike of the doughnut to show the indicator.\",\n f_short:\"of humanity below the threshold\", f_over:\"beyond the boundary\", f_within:\"within the boundary\", f_interp:\"Interpolated or carried value: no observation that year.\", f_obs:\"Observed value.\",\n f_start:\"in 2000\",\n ring_floor:\"social foundation\", ring_ceil:\"ecological ceiling\",\n s2t:\"Three groups of countries, three places in the Doughnut\",\n s2d:\"The authors rank 193 countries by average income per head over 2000-2022. On the ecological side, each group's <b>per-capita footprint<\/b> is compared here with its <b>fair share<\/b> of the planetary boundary (2017). Only six indicators can be expressed per person. The other boundaries appear in grey. Note that the groups split <b>countries<\/b>, not people. The poorest 40 % of countries are home to 42 % of humanity, the middle 40 % to 43 %, the richest 20 % to 15 %.\",\n g_B40:\"Poorest 40 % of countries\", g_M40:\"Middle 40 % of countries\", g_T20:\"Richest 20 % of countries\",\n g_B40s:\"income < $8,100 PPP · 78 countries\", g_M40s:\"$8,100 – 33,200 PPP · 77 countries\", g_T20s:\"income > $33,200 PPP · 38 countries\",\n k1:\"World population\", k2:\"Median social shortfall\", k3:\"Median overshoot\",\n shareT:\"Who bears the shortfall, who drives the overshoot? (medians, %)\",\n sh_pop:\"population\", sh_short:\"global social shortfall\", sh_over:\"global ecological overshoot\",\n fiche2:\"The richest 20 % of countries hold <b>15 %<\/b> of the world's population but drive <b>44 %<\/b> of ecological overshoot, against <b>4 %<\/b> for the poorest 40 % of countries. These in turn bear <b>63 %<\/b> of the social shortfall.\",\n s3t:\"The pace falls short\",\n s3d:\"The authors measure the average speed of each indicator between 2000 and 2022 (in percentage points per year), then compare it with the speed needed to reach the target.\",\n p1t:\"Social foundation: too slow\", p1d:\"Shortfall shrinks by 0.5 points a year (median). Closing it by 2030 would require going <b>4.9 times faster<\/b>.\",\n p2t:\"Ecological ceiling: the wrong way\", p2d:\"Overshoot grows by 3.9 points a year (median of significant trends). Getting back within the boundaries by 2050 would require <b>cutting<\/b> it by 6.9 points a year.\",\n pc_obs:\"2000-2022 (observed)\", pc_need1:\"needed for 2030\", pc_need2:\"needed for 2050\", pc_unit:\"percentage points per year\", pc_better:\"improvement →\", pc_worse:\"← deterioration\",\n lesson:\"<b>GDP growth does not bring societies back into the Doughnut.<\/b> World income doubles, social shortfalls barely recede, overshoot worsens fast. Hence the course's next question: what <b>criteria<\/b> allow a system to thrive durably in a finite world? Ecological economics looks for them in ecosystems.\",\n foot:\"Data: Fanning, A. L. &amp; Raworth, K. (2025), “Doughnut of social and planetary boundaries monitors a world out of balance”, <i>Nature<\/i> 646, 47-56 — doughnut-v3 data repository (Zenodo 10.5281/zenodo.15688961). World income: sum of real GNI per capita × population over the study's 193 countries (constant PPP). A year's missing values are interpolated between two observations, or carried at the ends; each indicator's card says so.\",\n na:\"n/a\"\n}};\nfunction t(k){return T[LANG][k];}\nfunction nm(c){return IND[c][LANG===\"fr\"?0:1];}\nfunction fmt(x,d){var s=(+x).toFixed(d==null?0:d);if(LANG===\"fr\")s=s.replace(\".\",\",\").replace(\"-\",\"−\");else s=s.replace(\"-\",\"−\");return s;}\n\n/* ---------- géométrie du donut ---------- */\nvar CX=320,CY=320,R0=78,RF=178,RC=228,RMAX=318,LMAX=Math.log10(1+3500/100);\nfunction pol(r,a){var q=(a-90)*Math.PI/180;return [CX+r*Math.cos(q),CY+r*Math.sin(q)];}\nfunction arc(ri,ro,a0,a1){\n  var p0=pol(ri,a0),p1=pol(ro,a0),p2=pol(ro,a1),p3=pol(ri,a1),lg=(a1-a0)>180?1:0;\n  return \"M\"+p0[0].toFixed(2)+\" \"+p0[1].toFixed(2)+\"L\"+p1[0].toFixed(2)+\" \"+p1[1].toFixed(2)+\n    \"A\"+ro+\" \"+ro+\" 0 \"+lg+\" 1 \"+p2[0].toFixed(2)+\" \"+p2[1].toFixed(2)+\"L\"+p3[0].toFixed(2)+\" \"+p3[1].toFixed(2)+\n    \"A\"+ri+\" \"+ri+\" 0 \"+lg+\" 0 \"+p0[0].toFixed(2)+\" \"+p0[1].toFixed(2)+\"Z\";\n}\nfunction rShort(s){return RF-(RF-R0-6)*Math.max(0,Math.min(100,s))/100;}\nfunction rOver(o){return RC+(RMAX-RC)*Math.log10(1+Math.max(0,o)/100)/LMAX;}\n\n/* layout : dimensions sociales (intérieur) 30° chacune ; écologiques (extérieur) 40° chacune */\nfunction layout(kind,mode){\n  var out=[],dims=DIMS[kind],span=360/dims.length;\n  dims.forEach(function(d,i){\n    var codes=kind===\"soc\"?d[2]:(mode===\"grp\"?d[3]:d[2]);\n    var a0=i*span,pad=kind===\"soc\"?1.2:1.6;\n    if(!codes.length){out.push({dim:i,code:null,a0:a0+pad,a1:a0+span-pad});return;}\n    var w=(span-2*pad)/codes.length;\n    codes.forEach(function(c,j){out.push({dim:i,code:c,a0:a0+pad+j*w+0.5,a1:a0+pad+(j+1)*w-0.5});});\n  });\n  return out;\n}\n\nfunction drawDonut(svg,valFn,mode,onPick,picked){\n  var title=svg.querySelect .5,fill:\"var(--muted)\"},T[LANG].nodes.B));\n  svg.appendChild(mk(\"text\",{x:n===1?440:450,y:n===1?348:372,\"text-anchor\":\"middle\",\"font-size\":12.5,fill:\"var(--muted)\"},T[LANG].nodes.E));\n}\n\n/* ---------- courbe ---------- */\nfunction drawCurve(svg,pts){\n  clear(svg);\n  var L=52,R=500,Tp=20,B=270;\n  function X(a){return L+(R-L)*a;}function Y(f){return B-(B-Tp)*f/1.05;}\n  svg.appendChild(mk(\"rect\",{x:X(WIN_LO),y:Tp,width:X(WIN_HI)-X(WIN_LO),height:B-Tp,fill:\"var(--eco)\",\"fill-opacity\":.13}));\n  for(var i=0;i<=10;i+=2){var a=i/10;svg.appendChild(mk(\"line\",{x1:X(a),x2:X(a),y1:Tp,y2:B,stroke:\"var(--grid)\"}));svg.appendChild(mk(\"text\",{x:X(a),y:B+16,\"text-anchor\":\"middle\",\"font-size\":11,\"font-family\":\"var(--font-m)\",fill:\"var(--faint)\"},fmt(a,1)));}\n  [0,0.25,0.5,0.75,1].forEach(function(f){svg.appendChild(mk(\"line\",{x1:L,x2:R,y1:Y(f),y2:Y(f),stroke:\"var(--grid)\"}));svg.appendChild(mk(\"text\",{x:L-7,y:Y(f)+4,\"text-anchor\":\"end\",\"font-size\":11,\"font-family\":\"var(--font-m)\",fill:\"var(--faint)\"},fmt(f,2)));});\n  svg.appendChild(mk(\"line\",{x1:L,x2:R,y1:Y(0.95),y2:Y(0.95),stroke:\"var(--eco)\",\"stroke-dasharray\":\"4 4\"}));\n  var d=\"\";for(i=1;i<=200;i++){var a2=i/201,f2=-Math.E*a2*Math.log(a2);d+=(i>1?\"L\":\"M\")+X(a2).toFixed(1)+\" \"+Y(f2).toFixed(1);}\n  svg.appendChild(mk(\"path\",{d:d,fill:\"none\",stroke:\"var(--ink)\",\"stroke-width\":2.2}));\n  svg.appendChild(mk(\"text\",{x:(X(WIN_LO)+X(WIN_HI))/2,y:Tp-5,\"text-anchor\":\"middle\",\"font-size\":11.5,\"font-weight\":600,fill:\"var(--eco)\"},t(\"win\")));\n  svg.appendChild(mk(\"text\",{x:L,y:B+34,\"font-size\":11.5,fill:\"var(--muted)\"},\"← \"+t(\"left\")));\n  svg.appendChild(mk(\"text\",{x:R,y:B+34,\"text-anchor\":\"end\",\"font-size\":11.5,fill:\"var(--muted)\"},t(\"right\")+\" →\"));\n  svg.appendChild(mk(\"text\",{x:(L+R)/2,y:B+52,\"text-anchor\":\"middle\",\"font-size\":12,\"font-family\":\"var(--font-m)\",fill:\"var(--ink)\"},t(\"cx\")));\n  svg.appendChild(mk(\"text\",{x:14,y:(Tp+B)/2,\"text-anchor\":\"middle\",\"font-size\":12,fill:\"var(--muted)\",transform:\"rotate(-90 14 \"+((Tp+B)/2)+\")\"},t(\"cy\")));\n  pts.forEach(function(p){\n    var c=zcol(zone(p.a));\n    svg.appendChild(mk(\"line\",{x1:X(p.a),x2:X(p.a),y1:Y(p.F),y2:B,stroke:c,\"stroke-dasharray\":\"3 3\"}));\n    svg.appendChild(mk(\"circle\",{cx:X(p.a),cy:Y(p.F),r:8,fill:c,stroke:\"var(--surface)\",\"stroke-width\":2.5}));\n    if(p.lbl){var right=p.a<0.7;svg.appendChild(mk(\"text\",{x:X(p.a)+(right?12:-12),y:Y(p.F)+(p.dy||-10),\"text-anchor\":right?\"start\":\"end\",\"font-size\":12.5,\"font-weight\":600,fill:c},p.lbl));}\n  });\n}\n\n/* ---------- textes ---------- */\nvar T={\nfr:{\n eyebrow:\"Séance 3 · Le modèle biomimétique\",\n title:\"La fenêtre de vitalité\",\n sub:\"Le PIB mesure la quantité de ce qui circule dans une économie. Il ne dit rien de sa capacité à <b>encaisser un choc<\/b> et à durer. L'écologie a forgé un critère pour cela, à partir de l'étude des écosystèmes naturels : la <b>résilience<\/b>. Cet outil part de ce critère dans la nature, montre comment on le mesure, puis le transpose à l'économie pour comprendre pourquoi la <b>diversité des logiques institutionnelles et des types de producteurs<\/b> compte autant que le volume produit.\",\n s1t:\"Dans la nature : pourquoi certains écosystèmes durent\",\n s1d:\"Un <b>écosystème<\/b> est un ensemble de populations animales, végétales et microbiennes reliées par ce qu'elles mangent : un <b>réseau trophique<\/b>. La nourriture, donc l'énergie, y circule d'espèce en espèce. Les <b>décomposeurs<\/b> (bactéries, champignons, vers de terre) se nourrissent de la matière morte et des déchets de toutes les espèces, et la transforment en nutriments que les plantes réutilisent : ils bouclent le circuit. Deux écosystèmes ci-dessous font circuler la même production végétale (100). Le premier la fait passer par une seule voie ; le second par plusieurs voies parallèles. Déclenchez une épidémie chez les lapins et regardez ce qu'il reste à manger aux prédateurs.\",\n shockOn:\"Une épidémie frappe les lapins\", shockOff:\"Revenir à la situation normale\",\n shockhint:\"Les flux qui passaient par les lapins disparaissent.\",\n w1t:\"Une chaîne\", w1d:\"Plantes → lapins → renards. Tout passe par les lapins : c'est la voie la plus directe, donc la plus <b>efficace<\/b>.\",\n w2t:\"Un réseau\", w2d:\"Trois herbivores, deux prédateurs, des décomposeurs qui recyclent. Les voies sont <b>redondantes<\/b> : chaque prédateur a plusieurs proies.\",\n pred:\"Nourriture qui reste aux prédateurs\",\n s1box:\"C'est la <b>résilience<\/b> au sens de l'écologue C. S. Holling (1973) : la capacité d'un système à absorber un choc tout en continuant de fonctionner. Elle vient des <b>voies de rechange<\/b>. Mais ces voies ont un prix : dans le réseau, la nourriture se disperse, chaque voie est moins chargée, le système est moins efficace. Un écosystème ne peut donc pas maximiser à la fois l'efficacité et la résilience. Il doit trouver un équilibre.\",\n s2t:\"Mesurer l'équilibre entre efficacité et résilience\",\n s2d:\"L'écologue Robert Ulanowicz a proposé de mesurer cet équilibre sur le tableau des flux (qui mange combien de qui). On en tire deux grandeurs. L'<b>ascendance<\/b> A mesure la part organisée du réseau : elle est forte quand la nourriture suit des voies uniques et prévisibles. La <b>réserve<\/b> Φ mesure la part redondante : les voies parallèles. Leur somme est la <b>capacité<\/b> C. Le rapport <b>a = A / C<\/b> situe le réseau entre ces deux pôles.\",\n th_m:\"Grandeur\", th_f:\"Formule\", th_A:\"Chaîne\", th_B:\"Réseau\",\n m_T:\"Débit total\", m_A:\"Ascendance\", m_P:\"Réserve\", m_C:\"Capacité\", m_a:\"Degré d'ordre\", m_F:\"Aptitude à durer\",\n measnote:\"T<sub>ij<\/sub> : flux de i vers j ; T<sub>i·<\/sub> : tout ce que i verse ; T<sub>·j<\/sub> : tout ce que j reçoit ; TST : somme de tous les flux. Logarithmes népériens.\",\n s2box:\"<b>La courbe en cloche.<\/b> L'aptitude à durer F = −e · a · ln(a) est nulle aux deux extrémités : un réseau tout en redondance (a proche de 0) n'est pas organisé, un réseau tout en efficacité (a proche de 1) n'a aucune réserve. Elle culmine à a = 1/e ≈ 0,37. Les écosystèmes naturels étudiés par Ulanowicz se concentrent autour de ce sommet, dans une zone étroite : la <b>fenêtre de vitalité<\/b>, définie ici par F ≥ 0,95. La chaîne en sort, côté efficacité ; le réseau y est.\",\n lA:\"chaîne\", lB:\"réseau\",\n s3t:\"De l'écosystème à l'économie\",\n s3d:\"Goerner, Lietaer et Ulanowicz (2009) proposent d'appliquer la même mesure aux <b>flux monétaires<\/b>. L'évolvabilité d'une économie, sa capacité à durer et à s'adapter, dépend alors de deux facteurs : l'<b>intensité des flux<\/b>, que résume le PIB, et la <b>diversité du réseau<\/b> qui les porte, c'est-à-dire la diversité des logiques institutionnelles et des types de producteurs.\",\n mapH:[\"Dans un écosystème\",\"Dans une économie\"],\n map:[[\"Espèces (lapins, renards, décomposeurs…)\",\"Organisations : grands groupes, PME, micro-entreprises, administrations, coopératives, associations…\"],\n      [\"Flux de nourriture et d'énergie\",\"Flux de monnaie : salaires, consommation, crédits, intérêts\"],\n      [\"Intensité des flux trophiques\",\"PIB\"],\n      [\"Nombre et diversité des voies\",\"Diversité des logiques institutionnelles (marchande, publique, ESS) et des types de producteurs\"],\n      [\"Une seule proie pour un prédateur\",\"Une économie dominée par une seule logique ou par quelques grands groupes\"]],\n th_flow:\"Flux\", th_from:\"de\", th_to:\"vers\", th_val:\"montant\",\n fl:{M:\"dépôts\",rM:\"intérêts sur dépôts\",L:\"crédits\",rL:\"intérêts sur crédits\",WB:\"salaires\",C:\"consommation\",I:\"investissement (entre entreprises)\"},\n nodes:{H:\"Ménages\",B:\"Banques\",E:\"Entreprises\"},\n s3res:\"<b>Le circuit de Didier et Lagoarde-Ségot (2024).<\/b> Ménages, banques et entreprises, une seule logique institutionnelle, un PIB de 100. Le degré d'ordre vaut <b>a = {a}<\/b> et l'aptitude <b>F = {F}<\/b> : comme la chaîne, cette économie se trouve hors de la fenêtre, du côté de l'efficacité. Tous les flux passent par un seul type de banque et un seul type d'entreprise : rien ne prend le relais si ce type d'organisation flanche.\",\n s4t:\"Diversifier les logiques et les types de producteurs\",\n s4d:\"On garde le même PIB (100) mais on le fait circuler par plusieurs <b>logiques<\/b> : marchande, publique, ESS, ou plusieurs types de producteurs. Chacune a ses banques et ses entreprises ; les ménages restent communs. Réglez le nombre de logiques et le poids de la principale.\",\n c_n:\"Nombre de logiques ou de types de producteurs\", c_s:\"Poids de la logique principale\",\n pr:[[\"100 % grands groupes\",1,100],[\"90 / 10\",2,90],[\"Marché, public, ESS (66 / 25 / 9)\",3,66],[\"Une myriade de micro-entreprises\",30,4]],\n cx:\"a = A / C\", cy:\"aptitude F\", left:\"diversité, redondance\", right:\"efficacité, optimisation\", win:\"fenêtre de vitalité (F ≥ 0,95)\",\n st_frag:\"Fragile : trop d'efficacité\", st_ok:\"Dans la fenêtre de vitalité\", st_stag:\"Stagnation : trop de diversité\",\n k_A:\"Ascendance A\", k_P:\"Réserve Φ\", k_sh:\"Si la logique principale s'arrête\", k_shs:\"part des flux qui continuent\", k_n:\"Débit total\",\n s5t:\"Lire la courbe\",\n z1t:\"Trop de diversité\", z1d:\"Une myriade de petites unités, peu de flux sur chacune. Le système est robuste mais peu organisé : il <b>stagne<\/b>. C'est le cas d'une économie faite seulement de micro-entreprises.\",\n z2t:\"La fenêtre de vitalité\", z2d:\"Assez d'organisation pour être efficace, assez de redondance pour encaisser un choc. Détourner 10 % des flux vers une seconde logique suffit à y entrer ; la combinaison marché, public, ESS se place près du sommet.\",\n z3t:\"Trop d'efficacité\", z3d:\"Tous les flux passent par la même voie. Le système est performant tant que rien ne casse, puis s'effondre d'un bloc : la <b>fragilité<\/b> d'une économie dominée par une seule logique ou par quelques grands groupes.\",\n lesson:\"<b>À PIB égal, la structure compte.<\/b> Comme un écosystème, une économie a besoin de voies de rechange. La diversité des logiques institutionnelles, marchande, publique et ESS, et celle des types de producteurs ne sont pas un coût d'efficacité : c'est la réserve qui permet de durer. Reste à mesurer cette diversité dans les données, avec les indices de Simpson, Shannon et Pielou.\",\n foot:\"Holling, C. S. (1973), « Resilience and stability of ecological systems », <i>Annual Review of Ecology and Systematics<\/i> 4 ; Ulanowicz, R. E. (2009), <i>A Third Window<\/i> ; Goerner, S. J., Lietaer, B. &amp; Ulanowicz, R. E. (2009), « Quantifying economic sustainability », <i>Ecological Economics<\/i> 69(1), 76-81 ; Didier, T. &amp; Lagoarde-Ségot, T. (2024).\"\n},\nen:{\n eyebrow:\"Session 3 · The biomimetic model\",\n title:\"The window of vitality\",\n sub:\"GDP measures how much circulates in an economy. It says nothing about its ability to <b>absorb a shock<\/b> and last. Ecology has forged a criterion for that, from the study of natural ecosystems: <b>resilience<\/b>. This tool starts from that criterion in nature, shows how it is measured, then carries it over to the economy to understand why the <b>diversity of institutional logics and of types of producers<\/b> matters as much as the volume produced.\",\n s1t:\"In nature: why some ecosystems last\",\n s1d:\"An <b>ecosystem<\/b> is a set of animal, plant and microbial populations linked by what they eat: a <b>food web<\/b>. Food, and so energy, flows from species to species. <b>Decomposers<\/b> (bacteria, fungi, earthworms) feed on the dead matter and waste of every species and turn it into nutrients that plants reuse: they close the loop. The two ecosystems below circulate the same plant production (100). The first channels it through a single route; the second through several parallel routes. Trigger an epidemic among the rabbits and see what is left for the predators to eat.\",\n shockOn:\"An epidemic strikes the rabbits\", shockOff:\"Back to normal\",\n shockhint:\"Flows that went through the rabbits disappear.\",\n w1t:\"A chain\", w1d:\"Plants → rabbits → foxes. Everything goes through the rabbits: the most direct route, hence the most <b>efficient<\/b>.\",\n w2t:\"A web\", w2d:\"Three herbivores, two predators, decomposers that recycle. Routes are <b>redundant<\/b>: each predator has several prey.\",\n pred:\"Food left for the predators\",\n s1box:\"This is <b>resilience<\/b> in ecologist C. S. Holling's sense (1973): a system's ability to absorb a shock and keep functioning. It comes from <b>spare routes<\/b>. But those routes have a price: in the web, food is spread out, each route carries less, the system is less efficient. An ecosystem cannot maximise efficiency and resilience at the same time. It has to find a balance.\",\n s2t:\"Measuring the balance between efficiency and resilience\",\n s2d:\"Ecologist Robert Ulanowicz proposed measuring this balance on the table of flows (who eats how much of whom). Two quantities come out of it. <b>Ascendency<\/b> A measures the organised part of the network: it is high when food follows single, predictable routes. The <b>reserve<\/b> Φ measures the redundant part: the parallel routes. Their sum is the <b>capacity<\/b> C. The ratio <b>a = A / C<\/b> places the network between these two poles.\",\n th_m:\"Quantity\", th_f:\"Formula\", th_A:\"Chain\", th_B:\"Web\",\n m_T:\"Total throughput\", m_A:\"Ascendency\", m_P:\"Reserve\", m_C:\"Capacity\", m_a:\"Degree of order\", m_F:\"Fitness to last\",\n measnote:\"T<sub>ij<\/sub>: flow from i to j; T<sub>i·<\/sub>: all that i pays out; T<sub>·j<\/sub>: all that j receives; TST: sum of all flows. Natural logarithms.\",\n s2box:\"<b>The bell curve.<\/b> Fitness F = −e · a · ln(a) is zero at both ends: an all-redundancy network (a near 0) is not organised, an all-efficiency network (a near 1) has no reserve. It peaks at a = 1/e ≈ 0.37. The natural ecosystems studied by Ulanowicz cluster around this peak, in a narrow zone: the <b>window of vitality<\/b>, defined here as F ≥ 0.95. The chain falls outside it, on the efficiency side; the web is inside.\",\n lA:\"chain\", lB:\"web\",\n s3t:\"From the ecosystem to the economy\",\n s3d:\"Goerner, Lietaer and Ulanowicz (2009) propose applying the same measure to <b>money flows<\/b>. An economy's evolvability, its capacity to last and adapt, then depends on two factors: the <b>intensity of flows<\/b>, summed up by GDP, and the <b>diversity of the network<\/b> that carries them, that is, the diversity of institutional logics and types of producers.\",\n mapH:[\"In an ecosystem\",\"In an economy\"],\n map:[[\"Species (rabbits, foxes, decomposers…)\",\"Organisations: large groups, SMEs, micro-enterprises, public bodies, cooperatives, associations…\"],\n      [\"Flows of food and energy\",\"Flows of money: wages, consumption, loans, interest\"],\n      [\"Intensity of trophic flows\",\"GDP\"],\n      [\"Number and diversity of routes\",\"Diversity of institutional logics (market, public, SSE) and of types of producers\"],\n      [\"A single prey for a predator\",\"An economy dominated by a single logic or by a few large groups\"]],\n th_flow:\"Flow\", th_from:\"from\", th_to:\"to\", th_val:\"amount\",\n fl:{M:\"deposits\",rM:\"interest on deposits\",L:\"loans\",rL:\"interest on loans\",WB:\"wages\",C:\"consumption\",I:\"investment (between firms)\"},\n nodes:{H:\"Households\",B:\"Banks\",E:\"Firms\"},\n s3res:\"<b>The circuit of Didier and Lagoarde-Ségot (2024).<\/b> Households, banks and firms, a single institutional logic, a GDP of 100. The degree of order is <b>a = {a}<\/b> and fitness <b>F = {F}<\/b>: like the chain, this economy sits outside the window, on the efficiency side. All flows go through a single type of bank and a single type of firm: nothing takes over if that type of organisation falters.\",\n s4t:\"Diversifying logics and types of producers\",\n s4d:\"We keep the same GDP (100) but run it through several <b>logics<\/b>: market, public, SSE, or several types of producers. Each has its banks and firms; households stay shared. Set the number of logics and the weight of the main one.\",\n c_n:\"Number of logics or types of producers\", c_s:\"Weight of the main logic\",\n pr:[[\"100 % large groups\",1,100],[\"90 / 10\",2,90],[\"Market, public, SSE (66 / 25 / 9)\",3,66],[\"A myriad of micro-enterprises\",30,4]],\n cx:\"a = A / C\", cy:\"fitness F\", left:\"diversity, redundancy\", right:\"efficiency, optimisation\", win:\"window of vitality (F ≥ 0.95)\",\n st_frag:\"Brittle: too much efficiency\", st_ok:\"Inside the window of vitality\", st_stag:\"Stagnation: too much diversity\",\n k_A:\"Ascendency A\", k_P:\"Reserve Φ\", k_sh:\"If the main logic stops\", k_shs:\"share of flows that carry on\", k_n:\"Total throughput\",\n s5t:\"Reading the curve\",\n z1t:\"Too much diversity\", z1d:\"A myriad of small units, little flow on each. The system is robust but poorly organised: it <b>stagnates<\/b>. This is an economy made only of micro-enterprises.\",\n z2t:\"The window of vitality\", z2d:\"Enough organisation to be efficient, enough redundancy to absorb a shock. Diverting 10 % of flows to a second logic is enough to enter it; the market, public, SSE combination sits near the peak.\",\n z3t:\"Too much efficiency\", z3d:\"All flows go through the same route. The system performs well until something breaks, then collapses at once: the <b>brittleness<\/b> of an economy dominated by a single logic or by a few large groups.\",\n lesson:\"<b>For the same GDP, structure matters.<\/b> Like an ecosystem, an economy needs spare routes. The diversity of institutional logics, market, public and SSE, and of types of producers is not an efficiency cost: it is the reserve that lets a system last. What remains is to measure this diversity in the data, with the Simpson, Shannon and Pielou indices.\",\n foot:\"Holling, C. S. (1973), “Resilience and stability of ecological systems”, <i>Annual Review of Ecology and Systematics<\/i> 4; Ulanowicz, R. E. (2009), <i>A Third Window<\/i>; Goerner, S. J., Lietaer, B. &amp; Ulanowicz, R. E. (2009), “Quantifying economic sustainability”, <i>Ecological Economics<\/i> 69(1), 76-81; Didier, T. &amp; Lagoarde-Ségot, T. (2024).\"\n}};\nfunction t(k){return T[LANG][k];}\nfunction fmt(x,d){var s=(+x).toFixed(d==null?0:d);if(LANG===\"fr\")s=s.replace(\".\",\",\");return s.replace(\"-\",\"−\");}\n\n/* ---------- sections ---------- */\nfunction draw1(){\n  $(\"shock\").textContent=shocked?t(\"shockOff\"):t(\"shockOn\");$(\"shock\").classList.toggle(\"on\",shocked);\n  drawWeb(\"A\");drawWeb(\"B\");\n}\nfunction draw2(){\n  var a=measure(webFlows(\"A\")),b=measure(webFlows(\"B\"));\n  var rows=[[\"m_T\",\"TST = Σ T<sub>ij<\/sub>\",\"T\",1],[\"m_A\",\"A = Σ T<sub>ij<\/sub> ln(T<sub>ij<\/sub>·TST / T<sub>i·<\/sub>T<sub>·j<\/sub>)\",\"A\",1],\n   [\"m_C\",\"C = − Σ T<sub>ij<\/sub> ln(T<sub>ij<\/sub> / TST)\",\"C\",1],[\"m_P\",\"Φ = C − A\",\"Phi\",1],[\"m_a\",\"a = A / C\",\"a\",3],[\"m_F\",\"F = − e · a · ln(a)\",\"F\",3]];\n  $(\"measTab\").innerHTML='<tr><th>'+t(\"th_m\")+'<\/th><th>'+t(\"th_f\")+'<\/th><th style=\"text-align:right\">'+t(\"th_A\")+'<\/th><th style=\"text-align:right\">'+t(\"th_B\")+'<\/th><\/tr>'+\n   rows.map(function(r){return '<tr><td>'+t(r[0])+'<\/td><td class=\"f\">'+r[1]+'<\/td><td class=\"n\">'+fmt(a[r[2]],r[3])+'<\/td><td class=\"n\">'+fmt(b[r[2]],r[3])+'<\/td><\/tr>';}).join(\"\");\n  drawCurve($(\"curve1\"),[{a:a.a,F:a.F,lbl:t(\"lA\")},{a:b.a,F:b.F,lbl:t(\"lB\"),dy:26}]);\n}\nfunction draw3(){\n  var d=T[LANG];\n  $(\"mapTab\").innerHTML='<tr><th>'+d.mapH[0]+'<\/th><th>'+d.mapH[1]+'<\/th><\/tr>'+d.map.map(function(r){return '<tr><td>'+r[0]+'<\/td><td>'+r[1]+'<\/td><\/tr>';}).join(\"\");\n  drawNet($(\"net1\"),[1],true);\n  var rows=[[\"M\",\"H\",\"B\"],[\"rM\",\"B\",\"H\"],[\"L\",\"B\",\"E\"],[\"rL\",\"E\",\"B\"],[\"WB\",\"E\",\"H\"],[\"C\",\"H\",\"E\"],[\"I\",\"E\",\"E\"]];\n  $(\"flowTab\").innerHTML='<tr><th>'+t(\"th_flow\")+'<\/th><th>'+t(\"th_from\")+'<\/th><th>'+t(\"th_to\")+'<\/th><th style=\"text-align:right\">'+t(\"th_val\")+'<\/th><\/tr>'+\n   rows.map(function(r){return '<tr><td><b>'+r[0]+'<\/b> · '+d.fl[r[0]]+'<\/td><td>'+r[1]+'<\/td><td>'+r[2]+'<\/td><td class=\"n\">'+fmt(BASE[r[0]],BASE[r[0]]<1?2:0)+'<\/td><\/tr>';}).join(\"\");\n  var m=measure(flows([1]));\n  $(\"s3res\").innerHTML=t(\"s3res\").replace(\"{a}\",fmt(m.a,2)).replace(\"{F}\",fmt(m.F,2));\n}\nvar n=1,s=100;\nfunction draw4(){\n  var minS=n===1?100:Math.ceil(100/n);\n  if(n===1)s=100;if(s<minS)s=minS;\n  $(\"s\").min=minS;$(\"s\").disabled=n===1;$(\"s\").value=s;$(\"n\").value=n;\n  var sh=shares(n,s/100),m=measure(flows(sh));\n  $(\"nv\").textContent=n;\n  $(\"sv\").textContent=n===1?\"100 %\":(s+\" % · \"+fmt((100-s)/(n-1),1)+\" % × \"+(n-1));\n  $(\"smin\").textContent=n===1?\"—\":minS+\" %\";\n  drawNet($(\"net2\"),sh,false);\n  drawCurve($(\"curve2\"),[{a:m.a,F:m.F}]);\n  var z=zone(m.a),c=zcol(z);\n  $(\"status\").style.borderColor=c;\n  $(\"status\").innerHTML='<div><div class=\"lab\" style=\"margin:0 0 4px\">a = A / C · F<\/div><span class=\"big\" style=\"color:'+c+'\">'+fmt(m.a,3)+'<\/span> <span style=\"font-family:var(--font-m);color:var(--muted)\">· F = '+fmt(m.F,3)+'<\/span><\/div><span class=\"chip\" style=\"color:'+c+';background:color-mix(in srgb,'+c+' 14%,transparent)\">'+t(\"st_\"+z)+'<\/span>';\n  var keep=Math.round((1-sh[0])*100);\n  $(\"kp\").innerHTML='<div><div class=\"k\">'+t(\"k_A\")+'<\/div><div class=\"v\">'+fmt(m.A,1)+'<\/div><\/div><div><div class=\"k\">'+t(\"k_P\")+'<\/div><div class=\"v\" style=\"color:var(--eco)\">'+fmt(m.Phi,1)+'<\/div><\/div>'+\n    '<div style=\"grid-column:1/-1\"><div class=\"k\">'+t(\"k_sh\")+'<\/div><div class=\"v\" style=\"color:'+(keep>0?\"var(--eco)\":\"var(--warn)\")+'\">'+keep+' %<\/div><div class=\"s\">'+t(\"k_shs\")+'<\/div><\/div>';\n  var pr=t(\"pr\");\n  $(\"presets\").innerHTML=pr.map(function(p,i){return '<button type=\"button\" data-i=\"'+i+'\" class=\"'+(p[1]===n&&p[2]===s?\"on\":\"\")+'\">'+p[0]+'<\/button>';}).join(\"\");\n  Array.prototype.forEach.call($(\"presets\").querySelectorAll(\"button\"),function(b){b.addEventListener(\"click\",function(){var p=t(\"pr\")[+b.getAttribute(\"data-i\")];n=p[1];s=p[2];draw4();});});\n}\n$(\"n\").addEventListener(\"input\",function(){var old=n;n=+this.value;if(n!==old)s=n===1?100:Math.max(Math.ceil(100/n),Math.min(s,99));draw4();});\n$(\"s\").addEventListener(\"input\",function(){s=+this.value;draw4();});\n$(\"shock\").addEventListener(\"click\",function(){shocked=!shocked;draw1();});\n\n/* ---------- langue, thème ---------- */\nfunction applyLang(){\n  document.documentElement.lang=LANG;\n  Array.prototype.forEach.call(document.querySelectorAll(\"[data-t]\"),function(el){var k=el.getAttribute(\"data-t\");if(typeof T[LANG][k]===\"string\")el.innerHTML=T[LANG][k];});\n  $(\"langlbl\").textContent=LANG.toUpperCase();\n  var fr=LANG===\"fr\";\n  $(\"webAT\").textContent=fr?\"Réseau trophique en chaîne\":\"Chain food web\";\n  $(\"webBT\").textContent=fr?\"Réseau trophique ramifié\":\"Branching food web\";\n  $(\"curve1T\").textContent=fr?\"Aptitude F selon le degré d'ordre a, chaîne et réseau\":\"Fitness F against degree of order a, chain and web\";\n  $(\"net1T\").textContent=fr?\"Circuit ménages, banques, entreprises\":\"Households, banks, firms circuit\";\n  $(\"net2T\").textContent=fr?\"Réseau selon le nombre de logiques\":\"Network by number of logics\";\n  $(\"curve2T\").textContent=fr?\"Aptitude F de l'économie simulée\":\"Fitness F of the simulated economy\";\n  draw1();draw2();draw3();draw4();\n}\n$(\"lang\").addEventListener(\"click\",function(){LANG=LANG===\"fr\"?\"en\":\"fr\";try{localStorage.setItem(P+\"_lang\",LANG);}catch(e){}applyLang();});\nfunction effTheme(){var a=document.documentElement.getAttribute(\"data-theme\");if(a)return a;return (window.matchMedia&&matchMedia(\"(prefers-color-scheme: dark)\").matches)?\"dark\":\"light\";}\n$(\"theme\").addEventListener(\"click\",function(){var nt=effTheme()===\"dark\"?\"light\":\"dark\";document.documentElement.setAttribute(\"data-theme\",nt);try{localStorage.setItem(P+\"_theme\",nt);}catch(e){}});\napplyLang();\n})();\n<\/script>\n<\/body>\n<\/html>\n\n<\/body><\/html>", "diversite-chocs.html": "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1\"><script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Diversité et chocs<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\">\n<style>\n/* Mise en page : en-tête qui pose la question ; 1 = les trois mécanismes ; 2 = scénario mars 2020 (adaptation, synergie) ; 3 = simulateur de l'effet portefeuille ; leçon */\n:root{\n  --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;\n  --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n  --econ:#2A78D6;--eco:#2E8B57;--rms:#C08A00;--warn:#C0392B;--fish:#0E7C9B;\n  --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);\n  --font-d:\"Spectral\",\"IBM Plex Sans\",Georgia,serif;\n  --font-b:\"IBM Plex Sans\",system-ui,sans-serif;\n  --font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n}\n:root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n  --bg:#0D1319;--surface:#161D24;--panel:#111820;\n  --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n  --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  color-scheme:dark;\n}}\n:root[data-theme=\"dark\"]{\n  --bg:#0D1319;--surface:#161D24;--panel:#111820;\n  --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n  --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  color-scheme:dark;\n}\n*{box-sizing:border-box}\nhtml,body{background:var(--bg)}\nbody{margin:0;color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}\n.wrap{max-width:1120px;margin:0 auto;padding-block:26px 44px;padding-inline:18px}\n.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}\n.eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--eco);font-weight:500;margin:0 0 6px}\nh1{font-family:var(--font-d);font-weight:600;font-size:clamp(27px,4.2vw,40px);line-height:1.06;margin:0;letter-spacing:-.01em;text-wrap:balance}\n.sub{color:var(--muted);font-size:15px;margin:12px 0 0;max-width:72ch;text-wrap:pretty}\n.sub b,.desc b,.mech b,.lesson b,.need b,.verdict b,.box b{color:var(--ink);font-weight:600}\n.toggles{display:flex;gap:8px;flex-shrink:0}\n.tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:
