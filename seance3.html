font-family:var(--font-m);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}\n.kp .v .s{font-size:11.5px;color:var(--faint);font-weight:400;font-family:var(--font-b)}\n.box{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--econ));border-radius:12px;padding:12px 16px;font-size:14px;color:var(--muted);text-wrap:pretty;margin-top:14px}\n.lesson{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--eco);border-radius:12px;padding:14px 18px;font-size:14px;color:var(--muted);text-wrap:pretty}\n.note{font-size:12.5px;color:var(--faint);margin:10px 0 0;text-wrap:pretty}\nfooter{margin-top:22px;color:var(--faint);font-size:11.5px;text-align:center;text-wrap:balance}\nfooter i{font-family:var(--font-d)}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\">\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\"><\/p>\n      <h1 data-t=\"title\"><\/h1>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" type=\"button\" aria-label=\"Langue / Language\">FR/EN <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" type=\"button\" aria-label=\"Thème clair ou sombre\">◐<\/button>\n    <\/div>\n  <\/div>\n  <p class=\"sub\" data-t=\"sub\"><\/p>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">1<\/span><h2 data-t=\"s1t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s1d\"><\/p>\n    <div class=\"mechs\">\n      <div class=\"mech\" style=\"--c:var(--fish)\"><div class=\"tag\" data-t=\"m1k\"><\/div><h3 data-t=\"m1t\"><\/h3><p data-t=\"m1d\"><\/p><\/div>\n      <div class=\"mech\" style=\"--c:var(--econ)\"><div class=\"tag\" data-t=\"m2k\"><\/div><h3 data-t=\"m2t\"><\/h3><p data-t=\"m2d\"><\/p><\/div>\n      <div class=\"mech\" style=\"--c:var(--eco)\"><div class=\"tag\" data-t=\"m3k\"><\/div><h3 data-t=\"m3t\"><\/h3><p data-t=\"m3d\"><\/p><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">2<\/span><h2 data-t=\"s2t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s2d\"><\/p>\n    <div class=\"sectors\" id=\"secBtns\"><\/div>\n    <div class=\"needs\" id=\"needs\"><\/div>\n    <div class=\"verdict\" id=\"verdict\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">3<\/span><h2 data-t=\"s3t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s3d\"><\/p>\n    <div class=\"presets\" id=\"presets\"><\/div>\n    <div class=\"grid2\">\n      <div>\n        <div class=\"ctrl\">\n          <p class=\"lab\" data-t=\"c_mix\"><\/p>\n          <div class=\"crow\"><div class=\"ch\"><span style=\"--c:var(--econ)\"><i><\/i><em data-t=\"sec_m\" style=\"font-style:normal\"><\/em><\/span><b id=\"vm\"><\/b><\/div><input type=\"range\" id=\"wm\" min=\"0\" max=\"100\" step=\"1\" value=\"66\" aria-label=\"Part du secteur marchand\"><\/div>\n          <div class=\"crow\"><div class=\"ch\"><span style=\"--c:var(--fish)\"><i><\/i><em data-t=\"sec_p\" style=\"font-style:normal\"><\/em><\/span><b id=\"vp\"><\/b><\/div><input type=\"range\" id=\"wp\" min=\"0\" max=\"100\" step=\"1\" value=\"25\" aria-label=\"Part du secteur public\"><\/div>\n          <div class=\"crow\"><div class=\"ch\"><span style=\"--c:var(--eco)\"><i><\/i><em data-t=\"sec_e\" style=\"font-style:normal\"><\/em><\/span><b id=\"ve\"><\/b><\/div><p class=\"small\" data-t=\"c_rest\"><\/p><\/div>\n          <div class=\"mix\" id=\"mixbar\"><\/div>\n        <\/div>\n        <div class=\"ctrl\">\n          <div class=\"crow\"><div class=\"ch\"><span data-t=\"c_rho\"><\/span><b id=\"vr\"><\/b><\/div><input type=\"range\" id=\"rho\" min=\"0\" max=\"100\" step=\"5\" value=\"30\" aria-label=\"Corrélation des chocs\"><div class=\"ends\"><span data-t=\"rho0\"><\/span><span data-t=\"rho1\"><\/span><\/div><\/div>\n        <\/div>\n        <p class=\"note\" data-t=\"vols\"><\/p>\n      <\/div>\n      <div>\n        <svg id=\"chart\" viewBox=\"0 0 560 300\" role=\"img\" aria-labelledby=\"chartT\"><title id=\"chartT\">Croissance simulée<\/title><\/svg>\n        <div class=\"legend\" id=\"legend\"><\/div>\n        <div class=\"kp\" id=\"kp\"><\/div>\n        <div class=\"box\" id=\"pfBox\" style=\"--c:var(--econ)\"><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"lesson\" data-t=\"lesson\"><\/div>\n  <\/section>\n\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\nvar NS=\"http://www.w3.org/2000/svg\";\nfunction mk(t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}\nfunction $(id){return document.getElementById(id);}\nfunction clear(svg){var ti=svg.querySelector(\"title\");while(svg.lastChild&&svg.lastChild!==ti)svg.removeChild(svg.lastChild);}\nvar P=\"dc\",LANG=\"fr\";\ntry{var sl=localStorage.getItem(P+\"_lang\");if(sl===\"fr\"||sl===\"en\")LANG=sl;}catch(e){}\ntry{var st=localStorage.getItem(P+\"_theme\");if(st===\"dark\"||st===\"light\")document.documentElement.setAttribute(\"data-theme\",st);}catch(e){}\nvar SC={m:\"var(--econ)\",p:\"var(--fish)\",e:\"var(--eco)\"};\n\nvar T={\nfr:{\n eyebrow:\"Séance 3 · Diversité et résilience\",\n title:\"Diversité et chocs\",\n sub:\"L'outil précédent a montré qu'à PIB égal, un réseau diversifié se trouve plus près de la fenêtre de vitalité. Reste à comprendre <b>concrètement<\/b> pourquoi une économie qui combine secteur marchand, secteur public et économie sociale et solidaire (ESS) traverse mieux une crise qu'une économie faite d'un seul secteur. On distingue trois mécanismes, puis on les met à l'épreuve sur une crise réelle et sur une simulation.\",\n s1t:\"Trois raisons pour lesquelles la diversité protège\",\n s1d:\"Chacun de ces mécanismes a son équivalent dans un écosystème. On les retrouve dans les deux exercices qui suivent.\",\n m1k:\"Adaptation\",m1t:\"Plus de façons de répondre\",m1d:\"Plus il y a d'espèces, plus il y a de chances que l'une soit adaptée aux nouvelles conditions. De même, plus il y a de types d'organisations, plus il y a de chances que l'une sache répondre à un choc imprévu.\",m1w:\"Exercice 2 : chaque besoin de la crise trouve-t-il un secteur pour y répondre ?\",\n m2k:\"Portefeuille\",m2t:\"Des chocs qui se compensent\",m2d:\"Les secteurs ne réagissent pas de la même façon aux fluctuations. Quand l'un recule, l'autre tient : ils se compensent, et l'ensemble est plus stable que chacune de ses parties.\",m2w:\"Exercice 3 : on mesure cette stabilité sur une simulation.\",\n m3k:\"Synergie\",m3t:\"Des secteurs qui s'appuient l'un sur l'autre\",m3d:\"Les secteurs se facilitent mutuellement. L'ESS utilise les infrastructures publiques ; l'activité marchande finance le secteur public par l'impôt ; le public achète au marché.\",m3w:\"Exercice 2 : certains besoins ne sont couverts qu'en combinant plusieurs secteurs.\",\n s2t:\"Mars 2020 : une pandémie frappe\",\n s2d:\"Voici six besoins auxquels la société a dû répondre pendant la crise sanitaire de 2020-2021, et les secteurs qui y ont effectivement répondu en France. Retirez un ou deux secteurs pour voir quels besoins restent sans réponse. Certains besoins peuvent être couverts par n'importe lequel des secteurs indiqués ; d'autres exigent de les <b>combiner<\/b>.\",\n sec_m:\"Secteur marchand\",sec_p:\"Secteur public\",sec_e:\"ESS\",\n any:\"Un seul de ces secteurs suffit (adaptation)\",all:\"Il faut tous ces secteurs ensemble (synergie)\",\n cov:\"couvert\",nocov:\"non couvert\",\n needs:[\n  {t:\"Soigner les malades graves\",d:\"Hôpitaux publics, cliniques privées et hôpitaux privés à but non lucratif ont tous accueilli des patients Covid.\",w:[\"p\",\"m\",\"e\"],k:\"any\"},\n  {t:\"Maintenir les revenus des salariés\",d:\"Le chômage partiel, pris en charge par l'État et l'assurance chômage, a évité des licenciements massifs pendant les confinements.\",w:[\"p\"],k:\"any\"},\n  {t:\"Produire et livrer masques, tests, repas\",d:\"Industriels, pharmacies, transporteurs et plateformes de livraison ont adapté leur production et leur logistique.\",w:[\"m\"],k:\"any\"},\n  {t:\"Nourrir les plus fragiles\",d:\"Restos du cœur, Secours populaire, banques alimentaires, avec les centres communaux d'action sociale, ont fait face à l'afflux de nouvelles demandes.\",w:[\"e\",\"p\"],k:\"any\"},\n  {t:\"Garder le lien avec les personnes isolées\",d:\"Associations d'aide à domicile, réseaux de bénévoles et services municipaux ont appelé, visité, livré.\",w:[\"e\",\"p\"],k:\"any\"},\n  {t:\"Vacciner la population (2021)\",d:\"Des laboratoires privés produisent ; l'État achète, organise et finance ; communes, Croix-Rouge et Protection civile font tourner les centres.\",w:[\"m\",\"p\",\"e\"],k:\"all\"}],\n v_all:\"Tous les besoins trouvent une réponse : c'est la combinaison <b>marché + public + ESS<\/b> que décrit le cours, celle qui permet une adaptation rapide.\",\n v_m:\"<b>Marché seul.<\/b> Ce qui n'est pas rentable n'est pas assuré : pas de lits de réserve, pas de revenu de remplacement, pas d'aide aux plus fragiles. Le cours parle de « faillite des hôpitaux ».\",\n v_p:\"<b>Public seul.<\/b> L'État soigne et indemnise, mais sans entreprises ni associations, il lui manque la production, la logistique et le réseau de proximité. Le cours parle de « rigidité et de lenteur ».\",\n v_e:\"<b>ESS seule.<\/b> Les associations savent mobiliser vite au plus près des personnes, mais sans budget public ni capacité industrielle, elles ne peuvent ni indemniser ni produire à grande échelle.\",\n v_two:\"<b>Deux secteurs sur trois.<\/b> La plupart des besoins sont couverts, car plusieurs secteurs peuvent y répondre : c'est l'effet d'<b>adaptation<\/b>. Mais la vaccination, qui exige les trois ensemble, échoue : c'est la <b>synergie<\/b> qui manque.\",\n v_none:\"Aucun secteur : aucun besoin n'est couvert.\",\n s3t:\"L'effet portefeuille, en chiffres\",\n s3d:\"On simule trente années de croissance. Chaque année, chaque secteur subit un choc aléatoire, plus ou moins fort selon le secteur. La croissance de l'économie est la moyenne des secteurs, pondérée par leur part de l'emploi. Comparez une économie <b>100 % marchande<\/b> à l'économie que vous composez, puis faites varier la façon dont les crises se propagent d'un secteur à l'autre.\",\n c_mix:\"Composition de l'économie (part de l'emploi)\",c_rest:\"Le reste de l'emploi.\",\n c_rho:\"Les crises frappent-elles tous les secteurs en même temps ?\",rho0:\"jamais ensemble\",rho1:\"toujours ensemble\",\n pr:[[\"France (66 / 25 / 9)\",66,25],[\"Trois parts égales\",34,33],[\"100 % marchand\",100,0]],\n vols:\"Hypothèses illustratives : croissance moyenne de 1,5 % par an dans chaque secteur ; écart-type des chocs de 3 points pour le secteur marchand, 1 point pour le public, 1,5 point pour l'ESS. Les mêmes tirages aléatoires servent à toutes les compositions, pour une comparaison à chocs identiques.\",\n l_m:\"100 % marchand\",l_mix:\"votre composition\",\n k_sd:\"Volatilité (écart-type)\",k_worst:\"Pire année\",k_rec:\"Années de récession\",\n yax:\"croissance annuelle (%)\",xax:\"année simulée\",\n pf:\"La volatilité passe de <b>{a} points<\/b> pour l'économie 100 % marchande à <b>{b} points<\/b> pour votre composition, soit {r} % de moins. \",\n pf_rho0:\"Les chocs étant indépendants, ils se compensent au maximum.\",\n pf_rhoM:\"Plus les crises frappent les secteurs en même temps, moins ils se compensent.\",\n pf_rho1:\"Les chocs frappent tous les secteurs en même temps : seule reste la moindre exposition des secteurs public et ESS.\",\n pf_same:\"Votre composition est 100 % marchande : aucun effet portefeuille.\",\n lesson:\"<b>La diversité ne supprime pas les chocs, elle en change les effets.<\/b> Elle multiplie les façons d'y répondre (adaptation), elle les amortit parce que les secteurs ne plongent pas ensemble (portefeuille), et elle permet des réponses qu'aucun secteur ne peut apporter seul (synergie). Pour piloter cette diversité, il faut d'abord savoir la décrire : quels biens chaque secteur produit, et quelle place il occupe dans l'économie.\",\n foot:\"Mécanismes et exemple de la crise de 2020 : support de cours de la séance 3 (L. Le Poder). Effet portefeuille : la volatilité d'un ensemble dépend des volatilités de ses parties et de leurs corrélations, σ² = Σ<sub>i<\/sub>Σ<sub>j<\/sub> w<sub>i<\/sub>w<sub>j<\/sub>ρ<sub>ij<\/sub>σ<sub>i<\/sub>σ<sub>j<\/sub> (Markowitz, 1952). Simulation illustrative, sans données réelles.\"\n},\nen:{\n eyebrow:\"Session 3 · Diversity and resilience\",\n title:\"Diversity and shocks\",\n sub:\"The previous tool showed that, for the same GDP, a diversified network sits closer to the window of vitality. What remains is to understand <b>concretely<\/b> why an economy combining a market sector, a public sector and a social and solidarity economy (SSE) weathers a crisis better than a single-sector economy. We distinguish three mechanisms, then test them on a real crisis and on a simulation.\",\n s1t:\"Three reasons why diversity protects\",\n s1d:\"Each mechanism has its counterpart in an ecosystem. They come back in the two exercises that follow.\",\n m1k:\"Adaptation\",m1t:\"More ways to respond\",m1d:\"The more species, the greater the chance that one is suited to new conditions. Likewise, the more types of organisations, the greater the chance that one knows how to respond to an unexpected shock.\",m1w:\"Exercise 2: does each need of the crisis find a sector to meet it?\",\n m2k:\"Portfolio\",m2t:\"Shocks that offset each other\",m2d:\"Sectors do not react the same way to fluctuations. When one falls back, another holds: they offset each other, and the whole is more stable than each of its parts.\",m2w:\"Exercise 3: we measure this stability on a simulation.\",\n m3k:\"Synergy\",m3t:\"Sectors that lean on each other\",m3d:\"Sectors facilitate each other. The SSE uses public infrastructure; market activity funds the public sector through taxes; the public sector buys from the market.\",m3w:\"Exercise 2: some needs are only met by combining several sectors.\",\n s2t:\"March 2020: a pandemic strikes\",\n s2d:\"Here are six needs society had to meet during the 2020-2021 health crisis, and the sectors that actually met them in France. Remove one or two sectors to see which needs go unmet. Some needs can be met by any of the sectors shown; others require <b>combining<\/b> them.\",\n sec_m:\"Market sector\",sec_p:\"Public sector\",sec_e:\"SSE\",\n any:\"Any one of these sectors is enough (adaptation)\",all:\"All these sectors are needed together (synergy)\",\n cov:\"met\",nocov:\"unmet\",\n needs:[\n  {t:\"Treating the seriously ill\",d:\"Public hospitals, private clinics and private non-profit hospitals all took in Covid patients.\",w:[\"p\",\"m\",\"e\"],k:\"any\"},\n  {t:\"Keeping employees' incomes\",d:\"Short-time work, paid for by the State and unemployment insurance, prevented mass lay-offs during lockdowns.\",w:[\"p\"],k:\"any\"},\n  {t:\"Producing and delivering masks, tests, meals\",d:\"Manufacturers, pharmacies, carriers and delivery platforms adapted their production and logistics.\",w:[\"m\"],k:\"any\"},\n  {t:\"Feeding the most vulnerable\",d:\"Restos du cœur, Secours populaire, food banks, together with municipal social-action centres, coped with a wave of new requests.\",w:[\"e\",\"p\"],k:\"any\"},\n  {t:\"Staying in touch with isolated people\",d:\"Home-help associations, volunteer networks and municipal services called, visited, delivered.\",w:[\"e\",\"p\"],k:\"any\"},\n  {t:\"Vaccinating the population (2021)\",d:\"Private laboratories produce; the State buys, organises and pays; municipalities, the Red Cross and civil-protection volunteers run the centres.\",w:[\"m\",\"p\",\"e\"],k:\"all\"}],\n v_all:\"Every need finds an answer: this is the <b>market + public + SSE<\/b> combination the course describes, the one that allows a rapid adaptation.\",\n v_m:\"<b>Market alone.<\/b> What is not profitable is not provided: no spare beds, no replacement income, no help for the most vulnerable. The course speaks of “hospital bankruptcy”.\",\n v_p:\"<b>Public alone.<\/b> The State treats and compensates, but without firms or associations it lacks production, logistics and a local network. The course speaks of “rigidity and slowness”.\",\n v_e:\"<b>SSE alone.<\/b> Associations mobilise quickly and close to people, but without a public budget or industrial capacity they can neither compensate nor produce at scale.\",\n v_two:\"<b>Two sectors out of three.<\/b> Most needs are met, because several sectors can meet them: this is the <b>adaptation<\/b> effect. But vaccination, which requires all three together, fails: <b>synergy<\/b> is missing.\",\n v_none:\"No sector: no need is met.\",\n s3t:\"The portfolio effect, in figures\",\n s3d:\"We simulate thirty years of growth. Each year, each sector suffers a random shock, stronger or weaker depending on the sector. The economy's growth is the average of the sectors, weighted by their share of employment. Compare a <b>100 % market<\/b> economy with the one you build, then vary how crises spread from one sector to another.\",\n c_mix:\"Composition of the economy (share of employment)\",c_rest:\"The rest of employment.\",\n c_rho:\"Do crises hit all sectors at the same time?\",rho0:\"never together\",rho1:\"always together\",\n pr:[[\"France (66 / 25 / 9)\",66,25],[\"Three equal shares\",34,33],[\"100 % market\",100,0]],\n vols:\"Illustrative assumptions: average growth of 1.5 % a year in each sector; standard deviation of shocks of 3 points for the market sector, 1 point for the public sector, 1.5 points for the SSE. The same random draws serve every composition, so comparisons are made under identical shocks.\",\n l_m:\"100 % market\",l_mix:\"your composition\",\n k_sd:\"Volatility (standard deviation)\",k_worst:\"Worst year\",k_rec:\"Years of recession\",\n yax:\"annual growth (%)\",xax:\"simulated year\",\n pf:\"Volatility falls from <b>{a} points<\/b> for the 100 % market economy to <b>{b} points<\/b> for your composition, {r} % less. \",\n pf_rho0:\"Since shocks are independent, they offset each other as much as possible.\",\n pf_rhoM:\"The more crises hit sectors at the same time, the less they offset each other.\",\n pf_rho1:\"Shocks hit all sectors at the same time: only the lower exposure of the public sector and the SSE remains.\",\n pf_same:\"Your composition is 100 % market: no portfolio effect.\",\n lesson:\"<b>Diversity does not remove shocks, it changes their effects.<\/b> It multiplies the ways of responding (adaptation), it cushions them because sectors do not plunge together (portfolio), and it allows responses no sector can provide alone (synergy). To steer this diversity, we first need to describe it: which goods each sector produces, and what place it holds in the economy.\",\n foot:\"Mechanisms and the 2020 crisis example: Session 3 course material (L. Le Poder). Portfolio effect: the volatility of a whole depends on the volatilities of its parts and their correlations, σ² = Σ<sub>i<\/sub>Σ<sub>j<\/sub> w<sub>i<\/sub>w<sub>j<\/sub>ρ<sub>ij<\/sub>σ<sub>i<\/sub>σ<sub>j<\/sub> (Markowitz, 1952). Illustrative simulation, not real data.\"\n}};\nfunction t(k){return T[LANG][k];}\nfunction fmt(x,d){var s=(+x).toFixed(d==null?0:d);if(LANG===\"fr\")s=s.replace(\".\",\",\");return s.replace(\"-\",\"−\");}\n\n/* ---------- section 2 : scénario 2020 ---------- */\nvar ON={m:true,p:true,e:true};\nfunction draw2(){\n  var keys=[\"m\",\"p\",\"e\"];\n  $(\"secBtns\").innerHTML=keys.map(function(k){return '<button type=\"button\" class=\"sec'+(ON[k]?\" on\":\"\")+'\" data-k=\"'+k+'\" style=\"--c:'+SC[k]+'\" aria-pressed=\"'+ON[k]+'\"><span class=\"dot\"><\/span>'+t(\"sec_\"+k)+'<\/button>';}).join(\"\");\n  Array.prototype.forEach.call($(\"secBtns\").querySelectorAll(\"button\"),function(b){b.addEventListener(\"click\",function(){var k=b.getAttribute(\"data-k\");ON[k]=!ON[k];draw2();});});\n  var cov=0,N=t(\"needs\" h(function(i){ks.forEach(function(j){s+=w[i]*w[j]*SIG[i]*SIG[j]*(i===j?1:rho);});});return Math.sqrt(s);}\nfunction stats(a){var mean=a.reduce(function(x,y){return x+y;},0)/a.length;var sd=Math.sqrt(a.reduce(function(x,y){return x+(y-mean)*(y-mean);},0)/(a.length-1));return {sd:sd,worst:Math.min.apply(null,a),rec:a.filter(function(x){return x<0;}).length};}\nfunction draw3(){\n  if(wm+wp>100)wp=100-wm;\n  var we=100-wm-wp;\n  $(\"wm\").value=wm;$(\"wp\").value=wp;$(\"wp\").max=100;\n  $(\"vm\").textContent=wm+\" %\";$(\"vp\").textContent=wp+\" %\";$(\"ve\").textContent=we+\" %\";\n  $(\"vr\").textContent=fmt(rho,2);$(\"rho\").value=Math.round(rho*100);\n  $(\"mixbar\").innerHTML='<span style=\"width:'+wm+'%;background:var(--econ)\"><\/span><span style=\"width:'+wp+'%;background:var(--fish)\"><\/span><span style=\"width:'+we+'%;background:var(--eco)\"><\/span>';\n  var W={m:wm/100,p:wp/100,e:we/100},W0={m:1,p:0,e:0};\n  var a=series(W0),b=series(W),sa=stats(a),sb=stats(b);\n  // chart\n  var svg=$(\"chart\");clear(svg);\n  var L=46,Rr=548,Tp=14,B=262,lo=-6,hi=8;\n  function X(i){return L+(Rr-L)*i/(YRS-1);}function Y(v){return Tp+(B-Tp)*(hi-v)/(hi-lo);}\n  for(var v=lo;v<=hi;v+=2){svg.appendChild(mk(\"line\",{x1:L,x2:Rr,y1:Y(v),y2:Y(v),stroke:v===0?\"var(--faint)\":\"var(--grid)\"}));svg.appendChild(mk(\"text\",{x:L-6,y:Y(v)+4,\"text-anchor\":\"end\",\"font-size\":11,\"font-family\":\"var(--font-m)\",fill:\"var(--faint)\"},(v>0?\"+\":\"\")+v));}\n  [0,9,19,29].forEach(function(i){svg.appendChild(mk(\"text\",{x:X(i),y:B+16,\"text-anchor\":\"middle\",\"font-size\":11,\"font-family\":\"var(--font-m)\",fill:\"var(--faint)\"},i+1));});\n  svg.appendChild(mk(\"rect\",{x:L,y:Y(0),width:Rr-L,height:Y(lo)-Y(0),fill:\"var(--warn)\",\"fill-opacity\":.05}));\n  function line(arr,c,w,dash){var d=\"\";arr.forEach(function(g,i){d+=(i?\"L\":\"M\")+X(i).toFixed(1)+\" \"+Y(Math.max(lo,Math.min(hi,g))).toFixed(1);});svg.appendChild(mk(\"path\",{d:d,fill:\"none\",stroke:c,\"stroke-width\      <h3 data-t=\"rt\"><\/h3>\n        <p class=\"desc\" style=\"margin:4px 0 10px\" data-t=\"rd\"><\/p>\n        <div class=\"sw\"><span data-t=\"r_toll\"><\/span><button class=\"tog\" id=\"toll\" type=\"button\" aria-pressed=\"false\"><\/button><\/div>\n        <div class=\"sw\"><span data-t=\"r_jam\"><\/span><button class=\"tog\" id=\"jam\" type=\"button\" aria-pressed=\"false\"><\/button><\/div>\n      <\/div>\n      <div>\n        <div class=\"mini\" id=\"mini\"><\/div>\n        <p class=\"desc\" style=\"margin:10px 0 0\" id=\"roadTxt\"><\/p>\n      <\/div>\n    <\/div>\n    <div class=\"lesson\" data-t=\"lesson\"><\/div>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\nfunction $(id){return document.getElementById(id);}\nvar P=\"cb\",LANG=\"fr\";\ntry{var sl=localStorage.getItem(P+\"_lang\");if(sl===\"fr\"||sl===\"en\")LANG=sl;}catch(e){}\ntry{var st=localStorage.getItem(P+\"_theme\");if(st===\"dark\"||st===\"light\")document.documentElement.setAttribute(\"data-theme\",st);}catch(e){}\n\n/* catégories : clé = rival(1/0) + exclusif(1/0) */\nvar CAT={\"11\":\"priv\",\"10\":\"comm\",\"01\":\"club\",\"00\":\"pub\"};\nvar CC={priv:\"var(--econ)\",comm:\"var(--eco)\",club:\"var(--rms)\",pub:\"var(--fish)\"};\n\n/* r = rival, x = exclusif ; alt = autre réponse admise */\nvar ITEMS=[\n {fr:\"Pain\",en:\"Bread\",r:1,x:1},\n {fr:\"Netflix\",en:\"Netflix\",r:0,x:1},\n {fr:\"Phare maritime\",en:\"Lighthouse\",r:0,x:0},\n {fr:\"Forêt amazonienne\",en:\"Amazon rainforest\",r:1,x:0},\n {fr:\"Autoroute à péage\",en:\"Toll motorway\",r:0,x:1},\n {fr:\"Wikipédia\",en:\"Wikipedia\",r:0,x:0},\n {fr:\"Voiture\",en:\"Car\",r:1,x:1},\n {fr:\"Poissons de haute mer\",en:\"High-seas fish\",r:1,x:0},\n {fr:\"Salle de sport\",en:\"Gym\",r:0,x:1},\n {fr:\"Air pur\",en:\"Clean air\",r:0,x:0},\n {fr:\"Rendez-vous chez le médecin\",en:\"Doctor's appointment\",r:1,x:1},\n {fr:\"Spotify\",en:\"Spotify\",r:0,x:1},\n {fr:\"Parc de Yellowstone\",en:\"Yellowstone Park\",r:1,x:0,alt:\"01\"},\n {fr:\"Smartphone\",en:\"Smartphone\",r:1,x:1},\n {fr:\"Défense nationale\",en:\"National defence\",r:0,x:0},\n {fr:\"Salle de cinéma\",en:\"Cinema\",r:0,x:1},\n {fr:\"Nappe phréatique\",en:\"Groundwater aquifer\",r:1,x:0},\n {fr:\"Club de golf\",en:\"Golf club\",r:0,x:1}\n];\nvar EXPL={\nfr:[\n \"Une baguette mangée ne l'est plus pour personne, et le boulanger la vend à qui paie.\",\n \"Un abonné de plus ne prive personne du film ; sans abonnement, pas d'accès.\",\n \"Sa lumière guide tous les navires à la fois, et on ne peut pas la réserver à ceux qui paient : c'est l'exemple classique de bien public.\",\n \"Le bois coupé et les terres défrichées ne sont plus disponibles ; l'accès à un territoire aussi vaste est presque impossible à contrôler.\",\n \"Tant qu'elle n'est pas saturée, un véhicule de plus ne gêne pas les autres ; le péage exclut ceux qui ne paient pas.\",\n \"Lire un article ne l'use pas, et il est accessible à tous gratuitement.\",\n \"Une voiture achetée sert à son propriétaire et à personne d'autre en même temps.\",\n \"Un poisson pêché ne l'est plus pour les autres, et personne ne contrôle l'accès à la haute mer : c'est le cas d'école de la surexploitation.\",\n \"Tant que la salle n'est pas pleine, un membre de plus ne gêne pas ; l'abonnement réserve l'accès aux membres.\",\n \"Respirer ne prive pas son voisin d'air, et personne n'en est exclu.\",\n \"Un créneau donné à un patient ne l'est plus pour un autre ; le cabinet peut refuser ou faire payer. La Sécurité sociale rend l'accès plus universel en le finançant, sans changer la nature du bien.\",\n \"Un auditeur de plus n'empêche personne d'écouter ; l'abonnement exclut les autres.\",\n \"Les visiteurs usent le site et peuvent l'encombrer : il est rival. On le place en bien commun, car l'accès à un territoire aussi vaste est très difficile à contrôler.\",\n \"Un téléphone acheté appartient à une personne, et il faut payer pour l'avoir.\",\n \"La protection du territoire bénéficie à tous les habitants à la fois, et on ne peut en exclure personne.\",\n \"Tant qu'il reste des places, un spectateur de plus ne gêne pas ; il faut un billet pour entrer.\",\n \"L'eau pompée par un agriculteur manque aux autres, et il est difficile d'empêcher quiconque de forer.\",\n \"Le parcours accueille de nombreux joueurs sans s'épuiser ; il faut être membre pour y jouer.\"],\nen:[\n \"A loaf eaten is gone for everyone else, and the baker sells it to whoever pays.\",\n \"One more subscriber deprives no one of the film; without a subscription, no access.\",\n \"Its light guides every ship at once, and it cannot be reserved for those who pay: the textbook public good.\",\n \"Timber cut and land cleared are no longer available; access to such a vast territory is almost impossible to control.\",\n \"As long as it is not congested, one more vehicle does not hinder others; the toll excludes those who do not pay.\",\n \"Reading an article does not wear it out, and it is free to all.\",\n \"A car that has been bought serves its owner and no one else at the same time.\",\n \"A fish caught is gone for others, and no one controls access to the high seas: the textbook case of over-exploitation.\",\n \"As long as the room is not full, one more member does not get in the way; membership restricts access.\",\n \"Breathing does not deprive your neighbour of air, and no one is excluded from it.\",\n \"A slot given to one patient is gone for another; the practice can refuse or charge. Social security makes access more universal by funding it, without changing the nature of the good.\",\n \"One more listener stops no one else from listening; the subscription excludes others.\",\n \"Visitors wear the site down and can crowd it: it is rival. We place it among common goods, because access to such a vast territory is very hard to control.\",\n \"A phone that has been bought belongs to one person, and you have to pay to get it.\",\n \"Protecting the territory benefits all inhabitants at once, and no one can be excluded from it.\",\n \"As long as seats remain, one more viewer does not get in the way; you need a ticket to get in.\",\n \"Water pumped by one farmer is missing for others, and it is hard to stop anyone from drilling.\",\n \"The course hosts many players without wearing out; you have to be a member to play.\"]\n};\nvar DEB={fr:\"Débat : le parc fait payer un droit d'entrée, ce qui le rend en partie exclusif. On peut donc aussi le classer en bien de club ; les deux réponses sont acceptées.\",\n en:\"Debate: the park charges an entrance fee, which makes it partly excludable. It can therefore also be classed as a club good; both answers are accepted.\"};\n\nvar T={\nfr:{\n eyebrow:\"Séance 3 · La diversité dans l'économie\",\n title:\"Classer les biens\",\n sub:\"Une économie ne produit pas qu'un seul type de bien. Cet outil apprend à les distinguer avec <b>deux questions<\/b>, puis montre pourquoi chaque type de bien appelle un <b>type d'organisation<\/b> différent. C'est la première raison d'être de la diversité des logiques institutionnelles.\",\n s1t:\"Deux questions, quatre catégories\",\n s1d:\"Pour classer un bien, on se demande ce qui se passe quand quelqu'un le consomme, puis si l'on peut en empêcher l'accès.\",\n q1:\"Est-il rival ?\",q1d:\"Un bien est <b>rival<\/b> si ma consommation diminue la quantité disponible pour les autres. Il est <b>non rival<\/b> si ma consommation ne retire rien aux autres.\",\n q2:\"Est-il exclusif ?\",q2d:\"Un bien est <b>exclusif<\/b> si l'on peut en réserver l'accès à certaines personnes, par un prix, un abonnement, une clôture. Il est <b>non exclusif<\/b> si l'accès est libre et qu'on ne peut empêcher personne d'en profiter.\",\n h_x:\"Exclusif\",h_nx:\"Non exclusif\",h_r:\"Rival\",h_nr:\"Non rival\",\n cats:{priv:[\"Bien privé\",\"Rival et exclusif.\",\"pain, voiture\"],comm:[\"Bien commun\",\"Rival, mais d'accès libre.\",\"forêt, poissons\"],club:[\"Bien de club\",\"Non rival, mais réservé aux membres.\",\"Netflix, cinéma\"],pub:[\"Bien public\",\"Non rival et d'accès libre.\",\"phare, air pur\"]},\n s2t:\"À vous de classer\",\n s2d:\"Dix-huit biens. Pour chacun, répondez aux deux questions : le bien se place dans la grille, et l'on vous dit si c'est juste et pourquoi.\",\n rq:\"Ma consommation prive-t-elle les autres ?\",xq:\"Peut-on empêcher quelqu'un d'y accéder ?\",\n yes:\"Oui\",no:\"Non\",place:\"Placer dans la grille\",next:\"Bien suivant\",\n reveal:\"Tout révéler\",reset:\"Recommencer\",\n prog:\"Bien {i} sur {n}\",done:\"Classement terminé\",\n fb0:\"Répondez aux deux questions, puis placez le bien.\",\n fbOk:\"<b>Juste.<\/b> \",fbKo:\"<b>Pas tout à fait :<\/b> c'est un {c}. \",\n fbEnd:\"Vous avez classé les dix-huit biens. Les erreurs sont barrées dans la grille ; touchez « Recommencer » pour rejouer.\",\n catName:{priv:\"bien privé\",comm:\"bien commun\",club:\"bien de club\",pub:\"bien public\"},\n s3t:\"Chaque type de bien appelle son organisation\",\n s3d:\"Le classement n'est pas qu'un exercice de vocabulaire. Il dit <b>qui peut produire<\/b> chaque bien, et c'est là que se joue la diversité des organisations.\",\n orgs:[[\"priv\",\"Bien privé\",\"Organisations privées\",\"L'entreprise marchande sait le produire : elle le vend à ceux qui paient et peut en tirer un profit.\"],\n       [\"club\",\"Bien de club\",\"Privées ou publiques\",\"Abonnement, cotisation, billet : une entreprise, une association ou une collectivité peut le financer par l'accès qu'elle vend à ses membres.\"],\n       [\"pub\",\"Bien public\",\"Organisations publiques\",\"Personne ne peut être exclu, donc personne n'est obligé de payer : chacun a intérêt à attendre que d'autres financent, c'est le <b>passager clandestin<\/b>. Le marché ne le produit pas, car il ne peut pas en tirer de revenu ; l'impôt le finance.\"],\n       [\"comm\",\"Bien commun\",\"Une gouvernance\",\"Chacun a intérêt à prélever, au risque de l'épuiser : c'est la <b>tragédie des communs<\/b>. Elinor Ostrom a montré que des communautés savent les gérer par des règles collectives, souvent sous la forme de coopératives ou d'associations.\"]],\n rt:\"Un même bien peut changer de case\",\n rd:\"La catégorie ne dépend pas seulement de l'objet, mais aussi des institutions et des conditions d'usage. Prenez une route.\",\n r_toll:\"On installe un péage\",r_jam:\"Heure de pointe : la route est saturée\",\n road:{pub:\"Une route gratuite et fluide est un <b>bien public<\/b> : un automobiliste de plus ne gêne personne, et chacun peut l'emprunter.\",\n       club:\"Avec un péage, la route reste fluide mais devient <b>exclusive<\/b> : c'est un <b>bien de club<\/b>.\",\n       comm:\"Gratuite mais saturée, la route devient <b>rivale<\/b> : chaque voiture ralentit les autres. C'est un <b>bien commun<\/b>, exposé à l'encombrement.\",\n       priv:\"Payante et saturée, la route est à la fois rivale et exclusive : elle se comporte comme un <b>bien privé<\/b>. Le péage peut alors servir à réguler l'affluence.\"},\n lesson:\"<b>Diversité des biens, diversité des organisations.<\/b> Une société a besoin des quatre types de biens. Aucune organisation ne sait tous les produire. Le secteur marchand fournit les biens privés, le secteur public les biens publics, et l'économie sociale et solidaire est souvent la mieux placée pour gouverner les communs. Reste à voir quelle place chacun de ces secteurs occupe réellement dans l'économie.\"\n},\nen:{\n eyebrow:\"Session 3 · Diversity in the economy\",\n title:\"Classifying goods\",\n sub:\"An economy does not produce just one type of good. This tool teaches how to tell them apart with <b>two questions<\/b>, then shows why each type of good calls for a different <b>type of organisation<\/b>. This is the first reason why the diversity of institutional logics matters.\",\n s1t:\"Two questions, four categories\",\n s1d:\"To classify a good, ask what happens when someone consumes it, then whether access can be prevented.\",\n q1:\"Is it rival?\",q1d:\"A good is <b>rival<\/b> if my consumption reduces the quantity available to others. It is <b>non-rival<\/b> if my consumption takes nothing from others.\",\n q2:\"Is it excludable?\",q2d:\"A good is <b>excludable<\/b> if access can be restricted to certain people, through a price, a subscription, a fence. It is <b>non-excludable<\/b> if access is free and no one can be stopped from benefiting.\",\n h_x:\"Excludable\",h_nx:\"Non-excludable\",h_r:\"Rival\",h_nr:\"Non-rival\",\n cats:{priv:[\"Private good\",\"Rival and excludable.\",\"bread, car\"],comm:[\"Common good\",\"Rival, but open access.\",\"forest, fish\"],club:[\"Club good\",\"Non-rival, but members only.\",\"Netflix, cinema\"],pub:[\"Public good\",\"Non-rival and open access.\",\"lighthouse, clean air\"]},\n s2t:\"Your turn to classify\",\n s2d:\"Eighteen goods. For each, answer the two questions: the good lands in the grid, and you are told whether it is right and why.\",\n rq:\"Does my consumption deprive others?\",xq:\"Can someone be stopped from accessing it?\",\n yes:\"Yes\",no:\"No\",place:\"Place in the grid\",next:\"Next good\",\n reveal:\"Reveal all\",reset:\"Start again\",\n prog:\"Good {i} of {n}\",done:\"Classification complete\",\n fb0:\"Answer both questions, then place the good.\",\n fbOk:\"<b>Right.<\/b> \",fbKo:\"<b>Not quite:<\/b> it is a {c}. \",\n fbEnd:\"You have classified all eighteen goods. Mistakes are struck through in the grid; tap “Start again” to replay.\",\n catName:{priv:\"private good\",comm:\"common good\",club:\"club good\",pub:\"public good\"},\n s3t:\"Each type of good calls for its organisation\",\n s3d:\"Classification is not just a vocabulary exercise. It tells <b>who can produce<\/b> each good, and that is where the diversity of organisations comes into play.\",\n orgs:[[\"priv\",\"Private good\",\"Private organisations\",\"A market firm knows how to produce it: it sells it to those who pay and can make a profit.\"],\n       [\"club\",\"Club good\",\"Private or public\",\"Subscription, membership fee, ticket: a firm, an association or a local authority can fund it through the access it sells to members.\"],\n       [\"pub\",\"Public good\",\"Public organisations\",\"No one can be excluded, so no one is obliged to pay: everyone has an interest in waiting for others to fund it, the <b>free rider<\/b>. The market does not produce it, because it cannot earn any revenue from it; taxes fund it.\"],\n       [\"comm\",\"Common good\",\"Governance\",\"Everyone has an interest in taking more, at the risk of exhausting it: the <b>tragedy of the commons<\/b>. Elinor Ostrom showed that communities can manage them through collective rules, often as cooperatives or associations.\"]],\n rt:\"The same good can change box\",\n rd:\"The category depends not only on the object but also on institutions and conditions of use. Take a road.\",\n r_toll:\"A toll is installed\",r_jam:\"Rush hour: the road is congested\",\n road:{pub:\"A free, flowing road is a <b>public good<\/b>: one more driver hinders no one, and anyone can use it.\",\n       club:\"With a toll, the road stays fluid but becomes <b>excludable<\/b>: a <b>club good<\/b>.\",\n       comm:\"Free but congested, the road becomes <b>rival<\/b>: each car slows the others. It is a <b>common good<\/b>, exposed to congestion.\",\n       priv:\"Tolled and congested, the road is both rival and excludable: it behaves like a <b>private good<\/b>. The toll can then be used to regulate traffic.\"},\n lesson:\"<b>Diversity of goods, diversity of organisations.<\/b> A society needs all four types of goods. No single organisation can produce them all. The market sector supplies private goods, the public sector public goods, and the social and solidarity economy is often best placed to govern the commons. What remains is to see what place each of these sectors actually holds in the economy.\"\n}};\nfunction t(k){return T[LANG][k];}\n\n/* ---------- matrice ---------- */\nfunction matrix(el,opts){\n  var d=T[LANG],h='<div><\/div><div class=\"mh\">'+d.h_x+'<\/div><div class=\"mh\">'+d.h_nx+'<\/div>';\n  [[\"1\",d.h_r],[\"0\",d.h_nr]].forEach(function(row){\n    h+='<div class=\"mh row\">'+row[1]+'<\/div>';\n    [\"1\",\"0\"].forEach(function(x){\n      var key=row[0]+x,c=CAT[key],cat=d.cats[c];\n      h+='<div class=\"cell'+(opts.target?\" target\":\"\")+'\" data-k=\"'+key+'\" style=\"--c:'+CC[c]+'\"><div class=\"ct\">'+cat[0]+'<\/div><p>'+cat[1]+'<\/p>'+\n        (opts.ex?'<div class=\"ex\">'+cat[2]+'<\/div>':'')+(opts.chips?'<div class=\"chips\">'+opts.chips(key)+'<\/div>':'')+'<\/div>';\n    });\n  });\n  el.innerHTML=h;\n}\n\n/* ---------- jeu ---------- */\nvar cur=0,ans={r:null,x:null},placed=[],shown=false;\nfunction keyOf(it){return \"\"+it.r+it.x;}\nfunction isOk(it,k){return k===keyOf(it)||(it.alt&&k===it.alt);}\nfunction chipsFor(k){\n  return placed.filter(function(p){return p.k===k;}).map(function(p){var it=ITEMS[p.i];return '<span class=\"chip '+(p.ok?\"ok\":\"ko\")+'\"><span class=\"m\">'+(p.ok?\"✓\":\"✕\")+'<\/span>'+it[LANG]+'<\/span>';}).join(\"\")+\n    placed.filter(function(p){return !p.ok&&keyOf(ITEMS[p.i])===k;}).map(function(p){return '<span class=\"chip ok\"><span class=\"m\">→<\/span>'+ITEMS[p.i][LANG]+'<\/span>';}).join(\"\");\n}\nfunction drawGame(){\n  var n=ITEMS.length,score=placed.filter(function(p){return p.ok;}).length;\n  $(\"score\").textContent=score+\" / \"+placed.length;\n  $(\"progBar\").style.width=(placed.length/n*100)+\"%\";\n  matrix($(\"m2\"),{chips:chipsFor});\n  if(cur>=n){\n    $(\"progLbl\").textContent=t(\"done\");\n    $(\"item\").innerHTML='<div class=\"in\" style=\"margin:0\">'+score+' / '+n+'<\/div>';\n    if(!shown)$(\"fb\").innerHTML=t(\"fbEnd\");\n    $(\"fb\").style.setProperty(\"--c\",\"var(--econ)\");\n    return;\n  }\n  $(\"progLbl\").textContent=t(\"prog\").replace(\"{i}\",cur+1).replace(\"{n}\",n);\n  var it=ITEMS[cur],last=placed.length&&placed[placed.length-1].i===cur;\n  function yn(id,q,v){return '<div class=\"yn\"><div class=\"yq\">'+q+'<\/div><div class=\"yb\"><button type=\"button\" data-q=\"'+id+'\" data-v=\"1\" class=\"'+(v===1?\"on\":\"\")+'\"'+(last?\" disabled\":\"\")+'>'+t(\"yes\")+'<\/button><button type=\"button\" data-q=\"'+id+'\" data-v=\"0\" class=\"'+(v===0?\"on\":\"\")+'\"'+(last?\" disabled\":\"\")+'>'+t(\"no\")+'<\/button><\/div><\/div>';}\n  $(\"item\").innerHTML='<div class=\"ic\">'+(cur+1)+' / '+n+'<\/div><div class=\"in\">'+it[LANG]+'<\/div>'+yn(\"r\",t(\"rq\"),ans.r)+yn(\"x\",t(\"xq\"),ans.x)+\n    '<div class=\"act\">'+(last?'<button class=\"btn\" id=\"go\" type=\"button\">'+t(\"next\")+'<\/button>':'<button class=\"btn\" id=\"go\" type=\"button\"'+(ans.r===null||ans.x===null?\" disabled\":\"\")+'>'+t(\"place\")+'<\/button>')+'<\/div>';\n  Array.prototype.forEach.call($(\"item\").querySelectorAll(\".yn button\"),function(b){b.addEventListener(\"click\",function(){ans[b.getAttribute(\"data-q\")]=+b.getAttribute(\"data-v\");drawGame();});});\n  $(\"go\").addEventListener(\"click\",function(){\n    if(last){cur++;ans={r:null,x:null};$(\"fb\").innerHTML=t(\"fb0\");$(\"fb\").style.setProperty(\"--c\",\"var(--line)\");drawGame();return;}\n    var k=\"\"+ans.r+ans.x,ok=isOk(it,k);\n    placed.push({i:cur,k:k,ok:ok});\n    feedback(cur,ok);drawGame();\n  });\n}\nfunction feedback(i,ok){\n  var it=ITEMS[i],c=CAT[keyOf(it)];\n  var msg=(ok?t(\"fbOk\"):t(\"fbKo\").replace(\"{c}\",t(\"catName\")[c]))+EXPL[LANG][i]+(it.alt?'<span class=\"deb\">'+DEB[LANG]+'<\/span>':'');\n  $(\"fb\").innerHTML=msg;$(\"fb\").style.setProperty(\"--c\",ok?\"var(--eco)\":\"var(--warn)\");\n}\n$(\"reveal\").addEventListener(\"click\",function(){\n  for(var i=cur;i<ITEMS.length;i++){if(!placed.some(function(p){return p.i===i;}))placed.push({i:i,k:keyOf(ITEMS[i]),ok:true,rev:true});}\n  cur=ITEMS.length;shown=true;\n  $(\"fb\").innerHTML=t(\"fbEnd\");drawGame();\n});\n$(\"reset\").addEventListener(\"click\",function(){cur=0;placed=[];ans={r:null,x:null};shown=false;$(\"fb\").innerHTML=t(\"fb0\");$(\"fb\").style.setProperty(\"--c\",\"var(--line)\");drawGame();});\n\n/* ---------- section 3 ---------- */\nvar toll=false,jam=false;\nfunction drawRoad(){\n  $(\"toll\").classList.toggle(\"on\",toll);$(\"toll\").setAttribute(\"aria-pressed\",toll);\n  $(\"jam\").classList.toggle(\"on\",jam);$(\"jam\").setAttribute(\"aria-pressed\",jam);\n  var k=(jam?\"1\":\"0\")+(toll?\"1\":\"0\"),c=CAT[k],d=T[LANG];\n  function cl(kk){var cc=CAT[kk];return '<div class=\"'+(kk===k?\"on\":\"\")+'\" style=\"--c:'+CC[cc]+'\">'+d.cats[cc][0]+'<\/div>';}\n  $(\"mini\").innerHTML='<span><\/span><div class=\"mh\">'+d.h_x+'<\/div><div class=\"mh\">'+d.h_nx+'<\/div><div class=\"mh row\">'+d.h_r+'<\/div>'+cl(\"11\")+cl(\"10\")+'<div class=\"mh row\">'+d.h_nr+'<\/div>'+cl(\"01\")+cl(\"00\");\n  $(\"roadTxt\").innerHTML=d.road[c];\n}\n$(\"toll\").addEventListener(\"click\",function(){toll=!toll;drawRoad();});\n$(\"jam\").addEventListener(\"click\",function(){jam=!jam;drawRoad();});\nfunction drawOrgs(){\n  $(\"orgs\").innerHTML=t(\"orgs\").map(function(o){return '<div class=\"org\" style=\"--c:'+CC[o[0]]+'\"><div class=\"ot\">'+o[1]+'<\/div><div class=\"ow\">'+o[2]+'<\/div><p>'+o[3]+'<\/p><\/div>';}).join(\"\");\n}\n\n/* ---------- langue, thème ---------- */\nfunction applyLang(){\n  document.documentElement.lang=LANG;\n  Array.prototype.forEach.call(document.querySelectorAll(\"[data-t]\"),function(el){var k=el.getAttribute(\"data-t\");if(typeof T[LANG][k]===\"string\")el.innerHTML=T[LANG][k];});\n  $(\"langlbl\").textContent=LANG.toUpperCase();\n  $(\"reveal\").textContent=t(\"reveal\");$(\"reset\").textContent=t(\"reset\");\n  matrix($(\"m1\"),{});\n  var lastP=placed.length&&placed[placed.length-1];\n  if(lastP&&lastP.i===cur&&!lastP.rev)feedback(cur,lastP.ok);\n  else if(cur>=ITEMS.length)$(\"fb\").innerHTML=t(\"fbEnd\");\n  else $(\"fb\").innerHTML=t(\"fb0\");\n  drawGame();drawOrgs();drawRoad();\n}\n$(\"lang\").addEventListener(\"click\",function(){LANG=LANG= :repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}\n@media(max-width:820px){.exs{grid-template-columns:minmax(0,1fr)}}\n.exg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}\n.exg h3{font-size:16px;margin:0 0 2px}\n.exg .eg{font-size:12.5px;color:var(--muted);margin:0 0 8px;text-wrap:pretty}\n.exg ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}\n.exg li{border-left:3px solid var(--eco);padding:2px 0 2px 10px;font-size:13px;color:var(--muted);text-wrap:pretty}\n.exg li b{display:block;color:var(--ink);font-weight:600;font-size:14px}\n.hb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13px}\n.hb .hl{color:var(--ink);text-wrap:pretty}\n.hb .ht{height:14px;border-radius:4px;background:var(--grid);overflow:hidden}\n.hb .ht i{display:block;height:100%;background:var(--eco)}\n.hb .hv{font-family:var(--font-m);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}\n.lesson{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--econ);border-radius:12px;padding:14px 18px;font-size:14px;color:var(--muted);text-wrap:pretty}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\">\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\"><\/p>\n      <h1 data-t=\"title\"><\/h1>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" type=\"button\" aria-label=\"Langue / Language\">FR/EN <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" type=\"button\" aria-label=\"Thème clair ou sombre\">◐<\/button>\n    <\/div>\n  <\/div>\n  <p class=\"sub\" data-t=\"sub\"><\/p>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">1<\/span><h2 data-t=\"s1t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s1d\"><\/p>\n    <div class=\"grid2\">\n      <div>\n        <div class=\"squares\" id=\"squares\" role=\"img\" aria-label=\"Répartition de l'emploi en cent carrés\"><\/div>\n        <div class=\"sqleg\" id=\"sqleg\"><\/div>\n        <p class=\"note\" data-t=\"sqnote\"><\/p>\n      <\/div>\n      <div class=\"det\" id=\"det\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\" style=\"--c:var(--econ)\">2<\/span><h2 data-t=\"s2t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s2d\"><\/p>\n    <div class=\"grid2\">\n      <div>\n        <p class=\"lab\" data-t=\"s2lab\"><\/p>\n        <div id=\"stacks\"><\/div>\n        <div class=\"bkey\" id=\"bkey\"><\/div>\n        <div class=\"fact\" style=\"--c:var(--econ)\" data-t=\"s2fact\"><\/div>\n      <\/div>\n      <div>\n        <div class=\"tabwrap\"><table class=\"ttab\" id=\"mtab\"><\/table><\/div>\n        <p class=\"note\" data-t=\"s2note\"><\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\" style=\"--c:var(--fish)\">3<\/span><h2 data-t=\"s3t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s3d\"><\/p>\n    <div class=\"vers\" id=\"vers\"><\/div>\n    <p class=\"lab\" style=\"margin-top:20px\" data-t=\"s3plab\"><\/p>\n    <div class=\"prs three\" id=\"pubpr\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\" style=\"--c:var(--eco)\">4<\/span><h2 data-t=\"s4t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s4d\"><\/p>\n    <div class=\"prs\" id=\"esspr\"><\/div>\n    <p class=\"lab\" style=\"margin-top:20px;margin-bottom:0\" data-t=\"exlab\"><\/p>\n    <div class=\"exs\" id=\"exs\"><\/div>\n    <div class=\"grid2\" style=\"margin-top:20px\">\n      <div>\n        <p class=\"lab\" data-t=\"s4lab\"><\/p>\n        <div class=\"hb\" id=\"hb\"><\/div>\n      <\/div>\n      <div class=\"fact\" style=\"--c:var(--eco);margin-top:0\" data-t=\"s4fact\"><\/div>\n    <\/div>\n    <div class=\"lesson\" data-t=\"lesson\"><\/div>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\nfunction $(id){return document.getElementById(id);}\nvar P=\"tl\",LANG=\"fr\";\ntry{var sl=localStorage.getItem(P+\"_lang\");if(sl===\"fr\"||sl===\"en\")LANG=sl;}catch(e){}\ntry{var st=localStorage.getItem(P+\"_theme\");if(st===\"dark\"||st===\"light\")document.documentElement.setAttribute(\"data-theme\",st);}catch(e){}\n\n/* Emploi salarié en ETP, milliers (2023) */\nvar EMP={m:14841.9,p:5644.5,e:2074};\nvar TOT=EMP.m+EMP.p+EMP.e;\nvar SC={m:\"var(--econ)\",p:\"var(--fish)\",e:\"var(--eco)\"};\n/* Secteur marchand, INSEE Ésane 2023, champ principal */\nvar MK=[{k:\"mic\",n:4042715,etp:2524.2,va:219.2,c:\"#8FB8EA\"},{k:\"pme\",n:163992,etp:4323.9,va:312.2,c:\"#5A97DE\"},{k:\"eti\",n:7031,etp:3826.0,va:354.7,c:\"#2A78D6\"},{k:\"ge\",n:312,etp:4167.9,va:459.1,c:\"#18508F\"}];\n/* Fonction publique, ETP 2023 y.c. contrats aidés */\nvar FP=[{k:\"fpe\",v:2554.2},{k:\"fpt\",v:1905.1},{k:\"fph\",v:1185.2}];\n/* ESS : part de l'ESS dans l'emploi de chaque activité (support de cours, INSEE) */\nvar ESS=[[\"ens\",43.6],[\"fin\",41.5],[\"aut\",13.6],[\"inf\",6.2],[\"agr\",5.2],[\"com\",1.5],[\"ind\",1.3]];\n\nvar T={\nfr:{\n eyebrow:\"Séance 3 · La diversité dans l'économie\",\n title:\"Trois logiques, une économie\",\n sub:\"On oppose souvent deux systèmes : le marché et l'État. Aucun des deux n'a jamais existé à l'état pur. Dans l'économie réelle, trois façons d'organiser la production coexistent, chacune avec son principe : le <b>secteur marchand<\/b>, le <b>secteur public<\/b> et l'<b>économie sociale et solidaire<\/b> (ESS). Cet outil mesure la place de chacune en France, puis la diversité qu'elle abrite.\",\n s1t:\"Qui emploie qui ?\",\n s1d:\"En 2023, les trois secteurs emploient environ <b>22,6 millions<\/b> de salariés en équivalent temps plein. Chaque carré représente 1 % de cet emploi, soit environ 226 000 postes à temps plein. Touchez un secteur pour lire son principe.\",\n sqnote:\"Emploi salarié en équivalent temps plein. Les non-salariés (indépendants, agriculteurs exploitants) ne sont pas comptés.\",\n names:{m:\"Secteur marchand\",p:\"Secteur public\",e:\"ESS\"},\n dets:{\n  m:[\"millions d'ETP\",\"Le principe capitaliste\",\"Des entreprises privées produisent pour vendre et dégager un profit, qui rémunère ceux qui ont apporté le capital. C'est le secteur qui produit l'essentiel des biens privés.\"],\n  p:[\"millions d'ETP\",\"Le principe d'égalité\",\"Administrations, collectivités et hôpitaux publics fournissent des services à tous, au même prix ou gratuitement, financés par l'impôt et les cotisations. C'est le secteur des biens publics.\"],\n  e:[\"millions d'ETP\",\"Le marché au service d'un objectif social\",\"Associations, coopératives, mutuelles et fondations vendent souvent des biens et services, mais leur but n'est pas le profit : les excédents sont réinvestis dans le projet.\"]},\n s2t:\"Le secteur marchand : beaucoup d'entreprises, peu de poids lourds\",\n s2d:\"L'INSEE range les entreprises en quatre catégories, selon leur effectif et leur chiffre d'affaires : microentreprises (moins de 10 salariés), PME, entreprises de taille intermédiaire (ETI) et grandes entreprises. Comparez leur part dans le nombre d'entreprises, dans l'emploi et dans la valeur ajoutée.\",\n s2lab:\"Parts de chaque catégorie, 2023\",\n rows:{n:\"Nombre d'entreprises\",etp:\"Emploi salarié (ETP)\",va:\"Valeur ajoutée\"},\n cats:{mic:\"Microentreprises\",pme:\"PME (hors micro)\",eti:\"ETI\",ge:\"Grandes entreprises\"},\n s2fact:\"<b>Un tissu très concentré.<\/b> Les 312 grandes entreprises, moins d'une entreprise sur dix mille, emploient 28 % des salariés du secteur et produisent 34 % de sa valeur ajoutée. À l'inverse, les microentreprises forment 96 % des entreprises mais ne produisent que 16 % de la valeur ajoutée. La diversité existe aussi à l'intérieur du marché : de l'artisan au groupe mondial.\",\n th:[\"Catégorie\",\"Entreprises\",\"ETP (milliers)\",\"VA (Md€)\"],tot:\"Ensemble\",\n s2note:\"Champ : secteurs principalement marchands, hors agriculture et finance. Source : INSEE, Ésane 2023.\",\n s3t:\"Le secteur public : trois versants\",\n s3d:\"La fonction publique compte 5,6 millions d'équivalents temps plein en 2023, soit un quart des emplois salariés des trois secteurs. Elle se divise en trois versants.\",\n fp:{fpe:[\"Fonction publique de l'État\",\"Ministères et services de l'État : enseignement, police, justice, armées, recherche.\"],\n     fpt:[\"Fonction publique territoriale\",\"Communes, départements, régions, intercommunalités : écoles, voirie, action sociale, transports locaux.\"],\n     fph:[\"Fonction publique hospitalière\",\"Hôpitaux publics, établissements pour personnes âgées, aide sociale à l'enfance.\"]},\n fpu:\"milliers d’ETP\",fpsh:\"de l'emploi des trois secteurs\",\n s3plab:\"Les trois principes du service public à la française\",\n pubpr:[[\"Égalité\",\"Le même service, au même prix ou presque, partout sur le territoire, quel que soit son coût de production.\"],\n        [\"Continuité\",\"Le service est fourni en permanence, sans interruption, partout sur le territoire.\"],\n        [\"Adaptabilité\",\"Le périmètre du service public évolue avec ce que la société considère, à un moment donné, comme relevant de l'intérêt général.\"]],\n s4t:\"L'ESS : produire autrement\",\n s4d:\"L'ESS emploie environ 2,1 millions d'équivalents temps plein. Ce n'est pas un secteur d'activité mais une façon de s'organiser, définie par quatre principes communs.\",\n esspr:[[\"1\",\"Lucrativité limitée\",\"Les excédents ne deviennent pas des profits appropriés par les membres : ils sont réinvestis, en totalité ou en majorité, dans l'organisation.\"],\n        [\"2\",\"Adhésion libre\",\"On adhère au projet de l'organisation et l'on choisit son degré d'engagement : cotisation, bénévolat, parts sociales.\"],\n        [\"3\",\"Gouvernance démocratique\",\"Une personne, une voix en assemblée générale, quel que soit le capital apporté. Dans une société de capitaux, c'est une action, une voix.\"],\n        [\"4\",\"Par et pour les usagers\",\"Les membres sont ceux qui profitent du service : les salariés dans une coopérative de production, les assurés dans une mutuelle.\"]],\n s4lab:\"Part de l'ESS dans l'emploi de chaque activité\",\n ess:{ens:\"Enseignement, santé, action sociale\",fin:\"Banque et assurance\",aut:\"Autres services (dont arts et spectacles)\",inf:\"Information, immobilier, services aux entreprises\",agr:\"Agriculture, sylviculture, pêche\",com:\"Commerce, transports, hôtellerie-restauration\",ind:\"Industrie et construction\"},\n exlab:\"Exemples\",\n exs:[[\"Coopératives\",\"Les membres sont les producteurs ou les consommateurs eux-mêmes : on supprime les intermédiaires.\",[[\"Biocoop\",\"Réseau coopératif de magasins bio.\"],[\"Sodiaal\",\"Coopérative laitière détenue par les éleveurs qui lui livrent leur lait.\"],[\"Finacoop\",\"Cabinet d'expertise comptable organisé en coopérative.\"]]],\n      [\"Banques coopératives et mutuelles\",\"Les clients sont sociétaires ou adhérents et votent en assemblée générale.\",[[\"Crédit Agricole\",\"Banque coopérative et mutualiste, construite sur des caisses locales détenues par leurs sociétaires.\"],[\"Banque Populaire\",\"Banque coopérative, membre du groupe BPCE.\"],[\"MAIF\",\"Mutuelle d'assurance : les assurés en sont les sociétaires.\"]]],\n      [\"Associations\",\"Des activités très variées : social, santé, culture, sport, logement, éducation.\",[[\"Secours Catholique\",\"Association caritative, branche française de Caritas.\"],[\"Artisans du Monde\",\"Réseau associatif de commerce équitable.\"],[\"KEDGE Business School\",\"École de commerce constituée en association.\"]]]],\n s4fact:\"<b>Deux points forts : le social et la finance.<\/b> Dans l'action sociale, la santé et l'enseignement, les associations prennent en charge des services que le marché juge peu rentables. Dans la banque et l'assurance, les banques coopératives et les mutuelles occupent une grande place : nées à la fin du XIX<sup>e<\/sup> siècle pour offrir crédit et assurance aux agriculteurs, artisans et salariés que les banques classiques servaient mal, elles sont devenues de grands groupes. L'ESS est en revanche presque absente de l'industrie et du commerce.\",\n lesson:\"<b>Une économie, trois logiques, et de la diversité dans chacune.<\/b> Le marché domine l'emploi, mais il est lui-même très concentré ; le public et l'ESS couvrent les biens que le marché ne produit pas ou produit mal. Reste à résumer cette diversité par un chiffre, pour comparer les économies entre elles : c'est l'objet des indices de Simpson, Shannon et Pielou.\"\n},\nen:{\n eyebrow:\"Session 3 · Diversity in the economy\",\n title:\"Three logics, one economy\",\n sub:\"Two systems are often set against each other: the market and the State. Neither has ever existed in pure form. In the real economy, three ways of organising production coexist, each with its own principle: the <b>market sector<\/b>, the <b>public sector<\/b> and the <b>social and solidarity economy<\/b> (SSE). This tool measures the place of each in France, then the diversity each contains.\",\n s1t:\"Who employs whom?\",\n s1d:\"In 2023, the three sectors employ about <b>22.6 million<\/b> full-time-equivalent employees. Each square stands for 1 % of this employment, about 226,000 full-time jobs. Tap a sector to read its principle.\",\n sqnote:\"Salaried employment in full-time equivalents. The self-employed (including farmers) are not counted.\",\n names:{m:\"Market sector\",p:\"Public sector\",e:\"SSE\"},\n dets:{\n  m:[\"million FTE\",\"The capitalist principle\",\"Private firms produce to sell and make a profit, which rewards those who provided the capital. This sector produces most private goods.\"],\n  p:[\"million FTE\",\"The principle of equality\",\"Administrations, local authorities and public hospitals provide services to all, at the same price or free, funded by taxes and contributions. This is the sector of public goods.\"],\n  e:[\"million FTE\",\"The market serving a social goal\",\"Associations, cooperatives, mutuals and foundations often sell goods and services, but their aim is not profit: surpluses are reinvested in the project.\"]},\n s2t:\"The market sector: many firms, few heavyweights\",\n s2d:\"INSEE sorts firms into four categories by headcount and turnover: micro-enterprises (fewer than 10 employees), SMEs, intermediate-sized enterprises (ETI) and large enterprises. Compare their share in the number of firms, in employment and in value added.\",\n s2lab:\"Share of each category, 2023\",\n rows:{n:\"Number of firms\",etp:\"Salaried employment (FTE)\",va:\"Value added\"},\n cats:{mic:\"Micro-enterprises\",pme:\"SMEs (excl. micro)\",eti:\"Intermediate-sized\",ge:\"Large enterprises\"},\n s2fact:\"<b>A highly concentrated fabric.<\/b> The 312 large enterprises, fewer than one firm in ten thousand, employ 28 % of the sector's employees and produce 34 % of its value added. Conversely, micro-enterprises make up 96 % of firms but produce only 16 % of value added. Diversity also exists within the market: from the craftsman to the global group.\",\n th:[\"Category\",\"Firms\",\"FTE (thousands)\",\"VA (€bn)\"],tot:\"Total\",\n s2note:\"Scope: mainly market sectors, excluding agriculture and finance. Source: INSEE, Ésane 2023.\",\n s3t:\"The public sector: three branches\",\n s3d:\"The civil service counts 5.6 million full-time equivalents in 2023, a quarter of salaried employment in the three sectors. It is divided into three branches.\",\n fp:{fpe:[\"State civil service\",\"Ministries and State services: education, police, justice, armed forces, research.\"],\n     fpt:[\"Local civil service\",\"Municipalities, departments, regions, inter-municipal bodies: schools, roads, social action, local transport.\"],\n     fph:[\"Hospital civil service\",\"Public hospitals, homes for the elderly, child welfare.\"]},\n fpu:\"thousand FTE\",fpsh:\"of employment in the three sectors\",\n s3plab:\"The three principles of French public service\",\n pubpr:[[\"Equality\",\"The same service, at the same or nearly the same price, everywhere in the country, whatever its production cost.\"],\n        [\"Continuity\",\"The service is provided permanently, without interruption, everywhere in the country.\"],\n        [\"Adaptability\",\"The scope of public service changes with what society considers, at a given time, to be in the general interest.\"]],\n s4t:\"The SSE: producing differently\",\n s4d:\"The SSE employs about 2.1 million full-time equivalents. It is not a sector of activity but a way of organising, defined by four shared principles.\",\n esspr:[[\"1\",\"Limited profit-making\",\"Surpluses do not become profits appropriated by members: they are reinvested, wholly or mostly, in the organisation.\"],\n        [\"2\",\"Voluntary membership\",\"You join the organisation's project and choose your level of commitment: dues, volunteering, cooperative shares.\"],\n        [\"3\",\"Democratic governance\",\"One person, one vote in the general assembly, whatever the capital contributed. In a joint-stock company, it is one share, one vote.\"],\n        [\"4\",\"By and for users\",\"Members are those who benefit from the service: workers in a worker cooperative, policyholders in a mutual.\"]],\n s4lab:\"Share of the SSE in employment in each activity\",\n ess:{ens:\"Education, health, social action\",fin:\"Banking and insurance\",aut:\"Other services (incl. arts and entertainment)\",inf:\"Information, real estate, business services\",agr:\"Agriculture, forestry, fishing\",com:\"Trade, transport, hotels and restaurants\",ind:\"Industry and construction\"},\n exlab:\"Examples\",\n exs:[[\"Cooperatives\",\"Members are the producers or the consumers themselves: intermediaries are removed.\",[[\"Biocoop\",\"Cooperative network of organic food shops.\"],[\"Sodiaal\",\"Dairy cooperative owned by the farmers who deliver their milk to it.\"],[\"Finacoop\",\"Accounting firm organised as a cooperative.\"]]],\n      [\"Cooperative banks and mutuals\",\"Customers are members and vote in the general assembly.\",[[\"Crédit Agricole\",\"Cooperative and mutual bank, built on local banks owned by their members.\"],[\"Banque Populaire\",\"Cooperative bank, part of the BPCE group.\"],[\"MAIF\",\"Mutual insurer: policyholders are its members.\"]]],\n      [\"Associations\",\"A wide range of activities: social, health, culture, sport, housing, education.\",[[\"Secours Catholique\",\"Charity, the French branch of Caritas.\"],[\"Artisans du Monde\",\"Associative fair-trade network.\"],[\"KEDGE Business School\",\"Business school set up as an association.\"]]]],\n s4fact:\"<b>Two strongholds: social services and finance.<\/b> In social action, health and education, associations provide services the market considers unprofitable. In banking and insurance, cooperative banks and mutuals hold a large place: born in the late 19th century to offer credit and insurance to farmers, craftsmen and workers poorly served by conventional banks, they have grown into large groups. The SSE is, on the other hand, almost absent from industry and trade.\",\n lesson:\"<b>One economy, three logics, and diversity within each.<\/b> The market dominates employment, but is itself highly concentrated; the public sector and the SSE cover the goods the market does not produce or produces poorly. What remains is to sum up this diversity in one figure, to compare economies: this is the purpose of the Simpson, Shannon and Pielou indices.\"\n}};\nfunction t(k){return T[LANG][k];}\nfunction fmt(x,d){var s=(+x).toFixed(d==null?0:d);if(LANG===\"fr\")s=s.replace(\".\",\",\");return s;}\nfunction fmtInt(x){var s=Math.round(x).toString();return s.replace(/\\B(?=(\\d{3})+(?!\\d))/g,LANG===\"fr\"?\" \":\",\");}\nfunction pct(x){var d=x<0.1?3:(x<1?2:(x<10?1:0));return fmt(x,d)+\" %\";}\n\n/* section 1 */\nvar sel=\"m\";\nfunction shares(){var o={};[\"m\",\"p\",\"e\"].forEach(function(k){o[k]=EMP[k]/TOT*100;});return o;}\nfunction draw1(){\n  var sh=shares(),n={m:Math.round(sh.m),p:Math.round(sh.p)};n.e=100-n.m-n.p;\n  var h=\"\",i=0;[\"m\",\"p\",\"e\"].forEach(function(k){for(var j=0;j<n[k];j++){h+='<button type=\"button\" class=\"sq'+(k===sel?\"\":\" dim\")+'\" data-k=\"'+k+'\" style=\"--c:'+SC[k]+'\" aria-label=\"'+t(\"names\")[k]+'\"><\/button>';i++;}});\n  $(\"squares\").innerHTML=h;\n  $(\"sqleg\").innerHTML=[\"m\",\"p\",\"e\"].map(function(k){return '<button type=\"button\" data-k=\"'+k+'\" class=\"'+(k===sel?\"on\":\"\")+'\" style=\"--c:'+SC[k]+'\"><i><\/i>'+t(\"names\")[k]+' <b>'+fmt(sh[k],0)+' %<\/b><\/button>';}).join(\"\");\n  Array.prototype.forEach.call(document.querySelectorAll(\"#squares .sq, #sqleg button\"),function(b){b.addEventListener(\"click\",function(){sel=b.getAttribute(\"data-k\");draw1();});});\n  var d=t(\"dets\")[sel];\n  $(\"det\").style.setProperty(\"--c\",SC[sel]);\n  $(\"det\").innerHTML='<div class=\"dn\">'+fmt(EMP[sel]/1000,1)+'<\/div><div class=\"dl\">'+d[0]+' · '+fmt(sh[sel],0)+' %<\/div><div class=\"pp\">'+d[1]+'<\/div><div>'+d[2]+'<\/div>';\n}\n\n/* section 2 */\nfunction draw2(){\n  var tot={n:0,etp:0,va:0};MK.forEach(function(c){tot.n+=c.n;tot.etp+=c.etp;tot.va+=c.va;});\n  $(\"stacks\").innerHTML=[\"n\",\"etp\",\"va\"].map(function(r){\n    return '<div class=\"stack\"><div class=\"sh\"><span>'+t(\"rows\")[r]+'<\/span><\/div><div class=\"bar\">'+\n      MK.map(function(c){var p=c[r]/tot[r]*100;return '<span style=\"width:'+p+'%;background:'+c.c+'\" title=\"'+t(\"cats\")[c.k]+' : '+pct(p)+'\">'+(p>=8?fmt(p,0)+\" %\":\"\")+'<\/span>';}).join(\"\")+'<\/div><\/div>';\n  }).join(\"\");\n  $(\"bkey\").innerHTML=MK.map(function(c){return '<span><i style=\"background:'+c.c+'\"><\/i>'+t(\"cats\")[c.k]+'<\/span>';}).join(\"\");\n  var th=t(\"th\");\n  $(\"mtab\").innerHTML='<tr><th>'+th[0]+'<\/th><th>'+th[1]+'<\/th><th>'+th[2]+'<\/th><th>'+th[3]+'<\/th><\/tr>'+\n    MK.map(function(c){return '<tr><td>'+t(\"cats\")[c.k]+'<
