er-radius:12px;padding:12px 14px;border:1.5px solid var(--rms)}\n.res .big{font-family:var(--font-d);font-size:34px;font-weight:600;color:var(--rms);line-height:1;font-variant-numeric:tabular-nums}\n.res span{font-size:14px;color:var(--muted)}\n.tabwrap{overflow-x:auto}\n.ctab{width:100%;border-collapse:collapse;font-size:13.5px}\n.ctab th{text-align:right;font-family:var(--font-m);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:500;padding:0 10px 8px;border-bottom:1px solid var(--line)}\n.ctab th:first-child,.ctab td:first-child{text-align:left}\n.ctab td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--muted);text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums}\n.ctab td:first-child{font-family:var(--font-b);color:var(--ink)}\n.ctab tr:last-child td{border-bottom:none}\n.gauge{height:8px;border-radius:4px;background:var(--grid);position:relative;min-width:90px}\n.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--rms)}\n.gauge u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}\n.lesson{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--rms);border-radius:12px;padding:14px 18px;font-size:14px;color:var(--muted);text-wrap:pretty}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\">\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\"><\/p>\n      <h1 data-t=\"title\"><\/h1>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" type=\"button\" aria-label=\"Langue / Language\">FR/EN <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" type=\"button\" aria-label=\"Thème clair ou sombre\">◐<\/button>\n    <\/div>\n  <\/div>\n  <p class=\"sub\" data-t=\"sub\"><\/p>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">1<\/span><h2 data-t=\"s1t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s1d\"><\/p>\n    <div class=\"presets\" id=\"presets\"><\/div>\n    <div class=\"grid2\">\n      <div>\n        <div class=\"urn\" id=\"urn\" role=\"img\" aria-label=\"Urne de cent jetons\"><\/div>\n        <div class=\"key\" id=\"key\"><\/div>\n      <\/div>\n      <div>\n        <div class=\"act\">\n          <button class=\"btn\" id=\"d1\" type=\"button\"><\/button>\n          <button class=\"btn ghost\" id=\"d100\" type=\"button\"><\/button>\n          <button class=\"btn ghost\" id=\"d1000\" type=\"button\"><\/button>\n          <button class=\"btn ghost\" id=\"dreset\" type=\"button\"><\/button>\n        <\/div>\n        <div class=\"last\" id=\"last\"><\/div>\n        <div class=\"cnt\" id=\"cnt\"><\/div>\n        <svg id=\"conv\" viewBox=\"0 0 460 170\" role=\"img\" aria-labelledby=\"convT\" style=\"margin-top:12px\"><title id=\"convT\">Convergence<\/title><\/svg>\n      <\/div>\n    <\/div>\n    <div class=\"fbox\">\n      <div>\n        <h3 data-t=\"f1t\"><\/h3>\n        <div class=\"formula\">λ = <span class=\"sig\"><small>S<\/small><span>Σ<\/span><small>i=1<\/small><\/span> p<sub>i<\/sub>²<\/div>\n        <ol class=\"steps\" id=\"steps\"><\/ol>\n      <\/div>\n      <div>\n        <h3 data-t=\"f1a\"><\/h3>\n        <div class=\"appl\" id=\"appl\"><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"box\" data-t=\"f1d\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">2<\/span><h2 data-t=\"s2t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s2d\"><\/p>\n    <div class=\"grid2\">\n      <div>\n        <svg id=\"sq\" viewBox=\"0 0 400 412\" role=\"img\" aria-labelledby=\"sqT\"><title id=\"sqT\">Carré des paires<\/title><\/svg>\n      <\/div>\n      <div>\n        <div class=\"formula\">λ = Σ p<sub>i<\/sub>²  ·  D = 1 − λ<\/div>\n        <div class=\"terms\" id=\"terms\"><\/div>\n        <div class=\"res\" id=\"res\"><\/div>\n        <div class=\"box\" data-t=\"s2box\"><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">3<\/span><h2 data-t=\"s3t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s3d\"><\/p>\n    <div class=\"tabwrap\"><table class=\"ctab\" id=\"ctab\"><\/table><\/div>\n    <div class=\"box\" style=\"--c:var(--econ)\" data-t=\"s3box\"><\/div>\n    <div class=\"lesson\" data-t=\"lesson\"><\/div>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\nvar NS=\"http://www.w3.org/2000/svg\";\nfunction mk(t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}\nfunction $(id){return document.getElementById(id);}\nfunction clear(svg){var ti=svg.querySelector(\"title\");while(svg.lastChild&&svg.lastChild!==ti)svg.removeChild(svg.lastChild);}\nvar P=\"us\",LANG=\"fr\";\ntry{var sl=localStorage.getItem(P+\"_lang\");if(sl===\"fr\"||sl===\"en\")LANG=sl;}catch(e){}\ntry{var st=localStorage.getItem(P+\"_theme\");if(st===\"dark\"||st===\"light\")document.documentElement.setAttribute(\"data-theme\",st);}catch(e){}\n\n/* populations : parts exactes (somme = 1) */\nvar POPS=[\n {k:\"fr\",c:[[\"m\",14841.9,\"var(--econ)\"],[\"p\",5644.5,\"var(--fish)\"],[\"e\",2074,\"var(--eco)\"]]},\n {k:\"eq\",c:[[\"m\",1,\"var(--econ)\"],[\"p\",1,\"var(--fish)\"],[\"e\",1,\"var(--eco)\"]]},\n {k:\"one\",c:[[\"m\",1,\"var(--econ)\"]]},\n {k:\"va\",c:[[\"mic\",219.2,\"#8FB8EA\"],[\"pme\",312.2,\"#5A97DE\"],[\"eti\",354.7,\"#2A78D6\"],[\"ge\",459.1,\"#18508F\"]]},\n {k:\"nb\",c:[[\"mic\",4042715,\"#8FB8EA\"],[\"pme\",163992,\"#5A97DE\"],[\"eti\",7031,\"#2A78D6\"],[\"ge\",312,\"#18508F\"]]}\n];\nfunction norm(pop){var s=0;pop.c.forEach(function(x){s+=x[1];});return pop.c.map(function(x){return {k:x[0],p:x[1]/s,c:x[2]};});}\nfunction lam(ps){var l=0;ps.forEach(function(x){l+=x.p*x.p;});return l;}\n\nvar T={\nfr:{\n eyebrow:\"Séance 3 · Mesurer la diversité\",\n title:\"L'urne de Simpson\",\n sub:\"Les outils précédents ont montré que la diversité des logiques institutionnelles protège une économie. Pour comparer des économies entre elles, il faut la <b>mesurer<\/b> par un seul nombre. En 1949, le statisticien Edward Simpson a proposé une question simple : <i>si je tire au hasard deux individus d'une population, quelle est la probabilité qu'ils appartiennent à la même espèce ?<\/i> Plus cette probabilité est forte, moins la population est diverse.\",\n s1t:\"Tirer deux individus au hasard\",\n s1d:\"L'urne contient la population à étudier : chaque jeton est un emploi ou une entreprise, coloré selon sa catégorie. On tire un premier jeton, on le remet, puis on en tire un second. Répétez l'expérience et regardez la part des tirages où les deux jetons sont de la même couleur se stabiliser.\",\n pops:{fr:\"Emploi : marché, public, ESS\",eq:\"Trois secteurs égaux\",one:\"Un seul secteur\",va:\"Valeur ajoutée marchande par taille d'entreprise\",nb:\"Nombre d'entreprises par taille\"},\n cats:{m:\"Secteur marchand\",p:\"Secteur public\",e:\"ESS\",mic:\"Microentreprises\",pme:\"PME\",eti:\"ETI\",ge:\"Grandes entreprises\"},\n d1:\"Tirer deux jetons\",d100:\"100 tirages\",d1000:\"1 000 tirages\",dreset:\"Remettre à zéro\",\n last0:\"Aucun tirage pour l'instant.\",same:\"<b>Même catégorie<\/b>\",diff:\"<b>Catégories différentes<\/b>\",\n k_n:\"Tirages\",k_same:\"Même catégorie\",k_freq:\"Fréquence observée ≈ <span class=\\\"lc\\\">λ<\/span>\",\n convY:\"part des tirages « même catégorie »\",convL:\"λ attendu\",\n f1t:\"Ce que la fréquence estime : λ\",\n steps:[\"La part des tirages « même catégorie » estime une probabilité, notée <b>λ<\/b> (la lettre grecque lambda) : la probabilité que deux individus tirés au hasard appartiennent à la même catégorie.\",\n  \"<b>p<sub>i<\/sub><\/b> est la part de la catégorie i dans la population : p<sub>i<\/sub> = n<sub>i<\/sub> / N, nombre d'individus de la catégorie i divisé par la population totale N. C'est la probabilité que le premier jeton soit de la catégorie i.\",\n  \"On remet le jeton avant le second tirage : le second jeton est lui aussi de la catégorie i avec la probabilité p<sub>i<\/sub>. Les deux tirages sont indépendants, donc les deux jetons sont de la catégorie i avec la probabilité <b>p<sub>i<\/sub> × p<sub>i<\/sub> = p<sub>i<\/sub>²<\/b>.\",\n  \"Deux jetons sont de même catégorie s'ils sont tous deux de la catégorie 1, ou tous deux de la catégorie 2, et ainsi de suite jusqu'à <b>S, le nombre de catégories<\/b>. Ces cas s'excluent, on additionne leurs probabilités : <b>λ = p<sub>1<\/sub>² + p<sub>2<\/sub>² + … + p<sub>S<\/sub>²<\/b>. Le symbole Σ note cette somme.\"],\n f1a:\"Avec la population choisie\",\n applEnd:\"Plus on fait de tirages, plus la fréquence observée se rapproche de cette valeur.\",\n f1d:\"<b>λ mesure la domination<\/b> : il est proche de 1 quand une catégorie écrase les autres. L'indice de Simpson en est le complément, <b>D = 1 − λ<\/b> : la probabilité que deux individus tirés au hasard soient de <b>catégories différentes<\/b>.\",\n tokNote:\"Chaque jeton représente environ 1 % de la population.\",\n s2t:\"Pourquoi λ est une somme de carrés\",\n s2d:\"Le carré ci-contre représente toutes les paires possibles. En largeur, la catégorie du premier jeton ; en hauteur, celle du second. Chaque catégorie occupe une bande proportionnelle à sa part p<sub>i<\/sub>. Les paires « même catégorie » sont les carrés sur la diagonale, d'aire p<sub>i<\/sub> × p<sub>i<\/sub>. Leur somme est λ, la probabilité de tirer deux fois la même catégorie.\",\n first:\"premier jeton →\",second:\"second jeton →\",\n lamL:\"λ, probabilité « même catégorie »\",\n resTxt:\"probabilité que deux jetons tirés au hasard soient de <b>catégories différentes<\/b>\",\n s2box:\"<b>L'indice de Simpson<\/b> D = 1 − λ vaut 0 quand tout le monde appartient à la même catégorie : deux tirages tombent toujours sur la même. Il augmente à mesure que les catégories se multiplient et s'équilibrent.\",\n s3t:\"Lire D : comparer au maximum possible\",\n s3d:\"D ne peut pas dépasser une limite qui dépend du nombre de catégories S. Ce maximum est atteint quand toutes les catégories ont la même part (p<sub>i<\/sub> = 1/S) : on obtient alors <b>D<sub>max<\/sub> = 1 − 1/S<\/b>. Avec trois secteurs, D ne dépasse jamais 0,67 ; avec quatre catégories d'entreprises, 0,75.\",\n th:[\"Population\",\"S\",\"D\",\"D max = 1 − 1/S\",\"D / D max\",\"\"],\n s3box:\"<b>Même secteur, deux lectures.<\/b> Compté en nombre d'entreprises, le secteur marchand est très peu divers (D ≈ 0,08) : 96 % des entreprises sont des microentreprises. Compté en valeur ajoutée, il est presque aussi divers que possible (D ≈ 0,73 pour un maximum de 0,75), car les quatre catégories produisent des parts comparables. Le choix de ce que l'on compte change la mesure.\",\n lesson:\"<b>Simpson répond à une question de probabilité.<\/b> λ mesure la domination ; D = 1 − λ mesure la diversité, entre 0 et 1 − 1/S. Pour comparer des populations qui n'ont pas le même nombre de catégories, il faut rapporter D à son maximum. L'indice de Shannon, et sa version normalisée de Pielou, posent la question autrement : combien d'incertitude reste-t-il sur la catégorie d'un individu tiré au hasard ?\"\n},\nen:{\n eyebrow:\"Session 3 · Measuring diversity\",\n title:\"Simpson's urn\",\n sub:\"The previous tools showed that the diversity of institutional logics protects an economy. To compare economies, we need to <b>measure<\/b> it with a single number. In 1949, the statistician Edward Simpson proposed a simple question: <i>if I draw two individuals at random from a population, what is the probability that they belong to the same species?<\/i> The higher this probability, the less diverse the population.\",\n s1t:\"Drawing two individuals at random\",\n s1d:\"The urn holds the population under study: each token is a job or a firm, coloured by its category. Draw a first token, put it back, then draw a second. Repeat the experiment and watch the share of draws in which both tokens have the same colour settle down.\",\n pops:{fr:\"Employment: market, public, SSE\",eq:\"Three equal sectors\",one:\"A single sector\",va:\"Market value added by firm size\",nb:\"Number of firms by size\"},\n cats:{m:\"Market sector\",p:\"Public sector\",e:\"SSE\",mic:\"Micro-enterprises\",pme:\"SMEs\",eti:\"Intermediate-sized\",ge:\"Large enterprises\"},\n d1:\"Draw two tokens\",d100:\"100 draws\",d1000:\"1,000 draws\",dreset:\"Reset\",\n last0:\"No draw yet.\",same:\"<b>Same category<\/b>\",diff:\"<b>Different categories<\/b>\",\n k_n:\"Draws\",k_same:\"Same category\",k_freq:\"Observed frequency ≈ <span class=\\\"lc\\\">λ<\/span>\",\n convY:\"share of “same category” draws\",convL:\"expected λ\",\n f1t:\"What the frequency estimates: λ\",\n steps:[\"The share of “same category” draws estimates a probability, written <b>λ<\/b> (the Greek letter lambda): the probability that two individuals drawn at random belong to the same category.\",\n  \"<b>p<sub>i<\/sub><\/b> is the share of category i in the population: p<sub>i<\/sub> = n<sub>i<\/sub> / N, the number of individuals in category i divided by the total population N. It is the probability that the first token is of category i.\",\n  \"The token is put back before the second draw, so the second token is also of category i with probability p<sub>i<\/sub>. The two draws are independent, so both tokens are of category i with probability <b>p<sub>i<\/sub> × p<sub>i<\/sub> = p<sub>i<\/sub>²<\/b>.\",\n  \"Two tokens share a category if both are in category 1, or both in category 2, and so on up to <b>S, the number of categories<\/b>. These cases exclude one another, so their probabilities add up: <b>λ = p<sub>1<\/sub>² + p<sub>2<\/sub>² + … + p<sub>S<\/sub>²<\/b>. The symbol Σ denotes this sum.\"],\n f1a:\"With the chosen population\",\n applEnd:\"The more draws, the closer the observed frequency gets to this value.\",\n f1d:\"<b>λ measures dominance<\/b>: it is close to 1 when one category overwhelms the others. The Simpson index is its complement, <b>D = 1 − λ<\/b>: the probability that two individuals drawn at random belong to <b>different categories<\/b>.\",\n tokNote:\"Each token stands for about 1 % of the population.\",\n s2t:\"Why λ is a sum of squares\",\n s2d:\"The square shows every possible pair. Across, the category of the first token; up, that of the second. Each category takes a band proportional to its share p<sub>i<\/sub>. “Same category” pairs are the squares on the diagonal, of area p<sub>i<\/sub> × p<sub>i<\/sub>. Their sum is λ, the probability of drawing the same category twice.\",\n first:\"first token →\",second:\"second token →\",\n lamL:\"λ, probability of “same category”\",\n resTxt:\"probability that two tokens drawn at random belong to <b>different categories<\/b>\",\n s2box:\"<b>The Simpson index<\/b> D = 1 − λ equals 0 when everyone belongs to the same category: two draws always land on it. It rises as categories multiply and even out.\",\n s3t:\"Reading D: compare with the maximum possible\",\n s3d:\"D cannot exceed a limit that depends on the number of categories S. This maximum is reached when all categories have the same share (p<sub>i<\/sub> = 1/S): then <b>D<sub>max<\/sub> = 1 − 1/S<\/b>. With three sectors, D never exceeds 0.67; with four categories of firms, 0.75.\",\n th:[\"Population\",\"S\",\"D\",\"D max = 1 − 1/S\",\"D / D max\",\"\"],\n s3box:\"<b>Same sector, two readings.<\/b> Counted by number of firms, the market sector is barely diverse (D ≈ 0.08): 96 % of firms are micro-enterprises. Counted by value added, it is almost as diverse as possible (D ≈ 0.73 for a maximum of 0.75), because the four categories produce comparable shares. What you count changes the measure.\",\n lesson:\"<b>Simpson answers a probability question.<\/b> λ measures dominance; D = 1 − λ measures diversity, between 0 and 1 − 1/S. To compare populations with different numbers of categories, D must be related to its maximum. The Shannon index, and its normalised version by Pielou, ask the question differently: how much uncertainty remains about the category of an individual drawn at random?\"\n}};\nfunction t(k){return T[LANG][k];}\nfunction fmt(x,d){var s=(+x).toFixed(d==null?0:d);if(LANG===\"fr\")s=s.replace(\".\",\",\");return s;}\nfunction fmtInt(x){return Math.round(x).toString().replace(/\\B(?=(\\d{3})+(?!\\d))/g,LANG===\"fr\"?\" \":\",\");}\n\n/* tirages reproductibles */\nvar seed=7;function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return ((x^x>>>14)>>>0)/4294967296;}\nvar cur=0,N=0,S=0,hist=[],lastPair=null,toks=[];\nfunction draw(ps){var r=rnd(),a=0;for(var i=0;i<ps.length;i++){a+=ps[i].p;if(r<a)return i;}return ps.length-1;}\nfunction buildToks(ps){\n  // 100 jetons, arrondi par la méthode des plus forts restes\n  var raw=ps.map(function(x){return x.p*100;}),fl=raw.map(Math.floor),rest=100-fl.reduce(function(a,b){return a+b;},0);\n  var ord=raw.map(function(v,i){return [v-Math.floor(v),i];}).sort(function(a,b){return b[0]-a[0];});\n  for(var j=0;j<rest;j++)fl[ord[j][1]]++;\n  var out=[];fl.forEach(function(n,i){for(var k=0;k<n;k++)out.push(i);});return out;\n}\nfunction tokIndexFor(cat){var idx=[];toks.forEach(function(c,i){if(c===cat)idx.push(i);});return idx.length?idx[Math.floor(rnd()*idx.length)]:-1;}\nfunction doDraws(n){\n  var ps=norm(POPS[cur]);\n  for(var i=0;i<n;i++){var a=draw(ps),b=draw(ps);N++;if(a===b)S++;if(N<=2000)hist.push(S/N);lastPair=[a,b];}\n  draw1();\n}\nfunction reset(){N=0;S=0;hist=[];lastPair=null;seed=7;}\n\nfunction draw1(){\n  var pop=POPS[cur],ps=norm(pop),L=lam(ps),d=T[LANG];\n  $(\"presets\").innerHTML=POPS.map(function(p,i){return '<button type=\"button\" data-i=\"'+i+'\" class=\"'+(i===cur?\"on\":\"\")+'\">'+d.pops[p.k]+'<\/button>';}).join(\"\");\n  Array.prototype.forEach.call($(\"presets\").querySelectorAll(\"button\"),function(b){b.addEventListener(\"click\",function(){cur=+b.getAttribute(\"data-i\");reset();toks=buildToks(norm(POPS[cur]));draw1();draw2();});});\n  if(!toks.length)toks=buildToks(ps);\n  var picks=[-1,-1];\n  if(lastPair){picks[0]=tokIndexFor(lastPair[0]);picks[1]=tokIndexFor(lastPair[1]);if(picks[1]===picks[0]){var alt=tokIndexFor(lastPair[1]);picks[1]=alt;}}\n  $(\"urn\").className=\"urn\"+(lastPair?\" drawing\":\"\");\n  $(\"urn\").innerHTML=toks.map(function(c,i){return '<span class=\"tok'+(i===picks[0]||i===picks[1]?\" pick\":\"\")+'\" style=\"--c:'+ps[c].c+'\"><\/span>';}).join(\"\");\n  $(\"key\").innerHTML=ps.map(function(x){return '<span style=\"--c:'+x.c+'\"><i><\/i>'+d.cats[x.k]+' <b>'+fmt(x.p*100,x.p<0.01?2:(x.p<0.1?1:0))+' %<\/b><\/span>';}).join(\"\")+'<span style=\"color:var(--faint)\">'+d.tokNote+'<\/span>';\n  if(lastPair){var same=lastPair[0]===lastPair[1];\n    $(\"last\").innerHTML='<span class=\"pair\"><i style=\"--c:'+ps[lastPair[0]].c+'\"><\/i><i style=\"--c:'+ps[lastPair[1]].c+'\"><\/i><\/span><span class=\"lt\">'+(same?d.same:d.diff)+' · '+d.cats[ps[lastPair[0]].k]+' / '+d.cats[ps[lastPair[1]].k]+'<\/span>';}\n  else $(\"last\").innerHTML='<span class=\"lt\">'+d.last0+'<\/span>';\n  $(\"cnt\").innerHTML='<div><div class=\"k\">'+d.k_n+'<\/div><div class=\"v\">'+fmtInt(N)+'<\/div><\/div><div><div class=\"k\">'+d.k_same+'<\/div><div class=\"v\">'+fmtInt(S)+'<\/div><\/div><div><div class=\"k\">'+d.k_freq+'<\/div><div class=\"v\" style=\"color:var(--rms)\">'+(N?fmt(S/N,3):\"—\")+'<\/div><\/div>';\n  // convergence\n  var svg=$(\"conv\");clear(svg);var Lx=40,R=450,Tp=10,B=140;\n  function X(i){return Lx+(R-Lx)*i/Math.max(1,Math.min(2000,Math.max(hist.length,100))-1);}function Y(v){return B-(B-Tp)*v;}\n  [0,0.25,0.5,0.75,1].forEach(function(v){svg.appendChild(mk(\"line\",{x1:Lx,x2:R,y1:Y(v),y2:Y(v),stroke:\"var(--grid)\"}));svg.appendChild(mk(\"text\",{x:Lx-6,y:Y(v)+4,\"text-anchor\":\"end\",\"font-size\":10.5,\"font-family\":\"var(--font-m)\",fill:\"var(--faint)\"},fmt(v,2)));});\n  svg.appendChild(mk(\"line\",{x1:Lx,x2:R,y1:Y(L),y2:Y(L),stroke:\"var(--rms)\",\"stroke-dasharray\":\"5 4\",\"stroke-width\":1.6}));\n  svg.appendChild(mk(\"text\",{x:R,y:Y(L)-5,\"text-anchor\":\"end\",\"font-size\":11,\"font-weight\":600,fill:\"var(--rms)\"},d.convL+\" = \"+fmt(L,3)));\n  if(hist.length){var p=\"\";hist.forEach(function(v,i){p+=(i?\"L\":\"M\")+X(i).toFixed(1)+\" \"+Y(v).toFixed(1);});svg.appendChild(mk(\"path\",{d:p,fill:\"none\",stroke:\"var(--ink)\",\"stroke-width\":1.6}));}\n  svg.appendChild(mk(\"text\",{x:Lx,y:B+20,\"font-size\":11,fill:\"var(--muted)\"},d.convY));\n  $(\"steps\").innerHTML=d.steps.map(function(x){return \"<li>\"+x+\"<\/li>\";}).join(\"\");\n  var S0=ps.length,dg=function(x){return x.p<0.01?4:3;};\n  $(\"appl\").innerHTML=\"S = \"+S0+\"<br>λ = \"+ps.map(function(x){return fmt(x.p,dg(x))+\"²\";}).join(\" + \")+\n    \"<br>&nbsp;&nbsp;= \"+ps.map(function(x){return fmt(x.p*x.p,4);}).join(\" + \")+\n    '<br>&nbsp;&nbsp;= <span class=\"r\">'+fmt(L,3)+'<\/span>'+\n    '<br><span style=\"font-family:var(--font-b);color:var(--muted)\">'+d.applEnd+'<\/span>';\n}\n\n/* section 2 : carré des paires */\nfunction draw2(){\n  var ps=norm(POPS[cur]),L=lam(ps),d=T[LANG],svg=$(\"sq\");clear(svg);\n  var o=40,W=340,x=o,y;\n  // bandes\n  var cum=0;\n  ps.forEach(function(a){var w=a.p*W;var cy=0;\n    ps.forEach(function(b){var h=b.p*W;var same=a===b;\n      if(w>0&&h>0)svg.appendChild(mk(\"rect\",{x:o+cum,y:o+W-cy-h,width:w,height:h,fill:same?a.c:\"var(--grid)\",\"fill-opacity\":same?0.9:1,stroke:\"var(--surface)\",\"stroke-width\":1}));\n      cy+=h;});\n    cum+=w;});\n  svg.appendChild(mk(\"rect\",{x:o,y:o,width:W,height:W,fill:\"none\",stroke:\"var(--line)\"}));\n  svg.appendChild(mk(\"text\",{x:o+W/2,y:o+W+22,\"text-anchor\":\"middle\",\"font-size\":12,fill:\"var(--muted)\"},d.first));\n  svg.appendChild(mk(\"text\",{x:16,y:o+W/2,\"text-anchor\":\"middle\",\"font-size\":12,fill:\"var(--muted)\",transform:\"rotate ;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\">\n<style>\n/* Mise en page : en-tête ; 1 = Shannon et Pielou : la surprise d'un tirage (tirages et surprise moyenne, formule, surfaces et maximum ln S) ; 2 = trois questions, trois formules ; 3 = le laboratoire (curseurs à gauche, trois jauges et contributions à droite) ; 3 = ce que chaque indice voit (catégorie rare, comparer des S différents) ; 5 = vers l'économie la plus diverse ; leçon */\n:root{\n  --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;\n  --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n  --econ:#2A78D6;--eco:#2E8B57;--rms:#C08A00;--warn:#C0392B;--fish:#0E7C9B;\n  --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);\n  --font-d:\"Spectral\",\"IBM Plex Sans\",Georgia,serif;\n  --font-b:\"IBM Plex Sans\",system-ui,sans-serif;\n  --font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n}\n:root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n  --bg:#0D1319;--surface:#161D24;--panel:#111820;\n  --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n  --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  color-scheme:dark;\n}}\n:root[data-theme=\"dark\"]{\n  --bg:#0D1319;--surface:#161D24;--panel:#111820;\n  --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n  --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  color-scheme:dark;\n}\n*{box-sizing:border-box}\nhtml,body{background:var(--bg)}\nbody{margin:0;color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}\n.wrap{max-width:1120px;margin:0 auto;padding-block:26px 44px;padding-inline:18px}\n.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}\n. lass=\"delta\" id=\"delta\" style=\"margin-top:12px\"><\/div>\n      <div class=\"box\" id=\"rareBox\" style=\"--c:var(--fish)\"><\/div>\n    <\/div>\n    <div class=\"box\" style=\"--c:var(--eco)\" data-t=\"maxbox\"><\/div>\n    <div class=\"lesson\" data-t=\"lesson\"><\/div>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\nfunction $(id){return document.getElementById(id);}\nvar NS=\"http://www.w3.org/2000/svg\";\nfunction mk(t,at,txt){var e=document.createElementNS(NS,t);for(var k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;return e;}\nfunction clear(svg){var ti=svg.querySelector(\"title\");while(svg.lastChild&&svg.lastChild!==ti)svg.removeChild(svg.lastChild);}\nvar P=\"li\",LANG=\"fr\";\ntry{var sl=localStorage.getItem(P+\"_lang\");if(sl===\"fr\"||sl===\"en\")LANG=sl;}catch(e){}\ntry{var st=localStorage.getItem(P+\"_theme\");if(st===\"dark\"||st===\"light\")document.documentElement.setAttribute(\"data-theme\",st);}catch(e){}\n\nvar COLS=[\"var(--econ)\",\"var(--fish)\",\"var(--eco)\",\"var(--rms)\",\"var(--warn)\",\"var(--muted)\",\"color-mix(in srgb,var(--econ) 45%,var(--surface))\",\"color-mix(in srgb,var(--eco) 45%,var(--surface))\"];\nvar SMAX=8;\n\n/* préréglages : [clé, [[nom fr, nom en, poids], ...]] */\nvar PRE=[\n [\"fr\",[[\"Secteur marchand\",\"Market sector\",14841.9],[\"Secteur public\",\"Public sector\",5644.5],[\"ESS\",\"SSE\",2074]]],\n [\"eq3\",[[\"Secteur marchand\",\"Market sector\",1],[\"Secteur public\",\"Public sector\",1],[\"ESS\",\"SSE\",1]]],\n [\"dom\",[[\"Secteur marchand\",\"Market sector\",90],[\"Secteur public\",\"Public sector\",5],[\"ESS\",\"SSE\",5]]],\n [\"gir\",[[\"Agriculture\",\"Agriculture\",3.5],[\"Industrie\",\"Industry\",10],[\"Construction\",\"Construction\",5.7],[\"Tertiaire marchand\",\"Market services\",47.4],[\"Tertiaire non marchand\",\"Non-market services\",33.4]]],\n [\"nb\",[[\"Microentreprises\",\"Micro-enterprises\",4042715],[\"PME\",\"SMEs\",163992],[\"ETI\",\"Intermediate-sized\",7031],[\"Grandes entreprises\",\"Large enterprises\",312]]],\n [\"va\",[[\"Microentreprises\",\"Micro-enterprises\",219.2],[\"PME\",\"SMEs\",312.2],[\"ETI\",\"Intermediate-sized\",354.7],[\"Grandes entreprises\",\"Large enterprises\",459.1]]]\n];\nvar cats=[],curPre=\"fr\",before=null;\nfunction load(k){var p=PRE.filter(function(x){return x[0]===k;})[0];cats=p[1].map(function(c){return {fr:c[0],en:c[1],w:c[2]};});curPre=k;before=null;}\nfunction shares(){var s=0;cats.forEach(function(c){s+=c.w;});return cats.map(function(c){return s>0?c.w/s:0;});}\nfunction idx(ps){\n  var S=ps.length,lam=0,H=0;ps.forEach(function(p){lam+=p*p;if(p>0)H-=p*Math.log(p);});\n  var D=1-lam,Dm=1-1/S,Hm=Math.log(S);\n  return {S:S,D:D,Dm:Dm,H:H,Hm:Hm,J:S>1?H/Hm:0,Dr:S>1?D/Dm:0};\n}\n\nvar T={\nfr:{\n eyebrow:\"Séance 3 · Mesurer la diversité\",\n title:\"Le laboratoire des indices\",\n sub:\"Trois indices résument la diversité d'une population en un nombre : <b>Simpson<\/b>, <b>Shannon<\/b> et <b>Pielou<\/b>. Ils ne posent pas la même question et ne réagissent pas de la même façon. Surtout, chacun a un maximum qui dépend du <b>nombre de catégories S<\/b>, pas de la taille N de la population : un résultat ne se lit qu'en le comparant à ce maximum.\",\n z_t:\"Shannon et Pielou : la surprise d'un tirage\",\n z_d:\"On tire un individu au hasard et l'on note la surprise que provoque sa catégorie. Tomber sur la catégorie majoritaire n'étonne guère ; tomber sur une catégorie rare surprend beaucoup. L'indice de Shannon est la <b>surprise moyenne<\/b> : plus elle est forte, plus il est difficile de deviner la catégorie d'un individu, plus la population est diverse.\",\n z_pre:{fr:\"Emploi : marché, public, ESS\",eq3:\"Trois secteurs égaux\",dom:\"Un secteur dominant (90 / 5 / 5)\",nb:\"Entreprises, en nombre\"},\n z_lad:\"Surprise de chaque catégorie : − ln p\",\n z1:\"Tirer un individu\",z100:\"100 tirages\",z1000:\"1 000 tirages\",zreset:\"Remettre à zéro\",\n z_last0:\"Aucun tirage pour l'instant.\",z_lastS:\"surprise\",\n z_kn:\"Tirages\",z_kl:\"Dernière surprise\",z_km:\"Surprise moyenne ≈ <span class=\\\"lc\\\">H<\/span>\",\n z_convY:\"surprise moyenne des tirages\",z_convH:\"H attendu\",z_convM:\"maximum ln S\",\n z_ft:\"Ce que la moyenne estime : H\",\n z_steps:[\"<b>p<sub>i<\/sub><\/b> = n<sub>i<\/sub> / N est la part de la catégorie i, et <b>S<\/b> le nombre de catégories.\",\n  \"La <b>surprise<\/b> de tirer un individu de la catégorie i est <b>− ln p<sub>i<\/sub><\/b>. Elle vaut 0 si la catégorie rassemble tout le monde (p<sub>i<\/sub> = 1 : aucune surprise) et grandit à mesure que la catégorie est rare. Le signe moins la rend positive, car le logarithme d'une part inférieure à 1 est négatif.\",\n  \"La catégorie i sort avec la probabilité p<sub>i<\/sub> : dans la moyenne, sa surprise compte avec ce poids, <b>p<sub>i<\/sub> × (− ln p<sub>i<\/sub>)<\/b>.\",\n  \"On additionne sur les S catégories : <b>H = − Σ p<sub>i<\/sub> ln p<sub>i<\/sub><\/b>, la surprise moyenne d'un tirage.\"],\n z_at:\"Avec la population choisie\",\n z_appEnd:\"Plus on fait de tirages, plus la surprise moyenne observée se rapproche de H.\",\n z_pt:\"Pielou : rapporter H à son maximum\",\n z_axP:\"part p (largeur)\",z_axS:\"surprise\",z_eqL:\"parts égales : ln S\",\n z_sl:\"Rapprocher chaque part de 1/S\",z_sl0:\"population choisie\",z_sl1:\"parts égales\",z_parts:\"Parts :\",\n z_psteps:[\"Le graphique : chaque barre a pour largeur p<sub>i<\/sub> et pour hauteur la surprise − ln p<sub>i<\/sub>. Sa surface est la contribution p<sub>i<\/sub> × (− ln p<sub>i<\/sub>) ; <b>H est la surface colorée totale<\/b>.\",\n  \"Si les S catégories avaient la même part 1/S, chaque tirage aurait la même surprise, ln S : H atteindrait son <b>maximum, ln S<\/b> (le rectangle en pointillés). Faites glisser le curseur : les barres des catégories rares descendent, celles des catégories dominantes montent, et la surface colorée finit par remplir exactement le rectangle.\",\n  \"Pielou mesure la part de ce maximum atteinte : <b>J = H / ln S<\/b>, entre 0 (une catégorie domine tout) et 1 (parts égales), quel que soit le nombre de catégories.\"],\n z_box:\"<b>Shannon mesure une incertitude<\/b> : la surprise moyenne d'un tirage. Il vaut 0 quand une seule catégorie existe et au plus ln S quand les S catégories ont la même part. <b>Pielou, J = H / ln S<\/b>, ramène ce résultat entre 0 et 1 : il mesure l'équilibre de la répartition, quel que soit le nombre de catégories.\",\n s1t:\"Trois questions, trois formules\",\n s1d:\"Dans les trois formules, p<sub>i<\/sub> = n<sub>i<\/sub> / N est la part de la catégorie i, et la somme porte sur les S catégories. N ne sert qu'à calculer ces parts.\",\n qs:[\n  [\"Simpson\",\"var(--rms)\",\"Si je tire deux individus au hasard, quelle est la probabilité qu'ils soient de <b>catégories différentes<\/b> ?\",\"D = 1 − Σ p<sub>i<\/sub>²\",\"Maximum : <b>1 − 1/S<\/b>, quand toutes les catégories ont la même part. Minimum : 0, quand une seule catégorie rassemble tout.\"],\n  [\"Shannon\",\"var(--fish)\",\"Quelle <b>incertitude<\/b> reste-t-il sur la catégorie d'un individu tiré au hasard ? Plus il y a de catégories et plus elles sont équilibrées, plus il est difficile de deviner.\",\"H = − Σ p<sub>i<\/sub> ln(p<sub>i<\/sub>)\",\"Maximum : <b>ln S<\/b>, quand toutes les catégories ont la même part. Minimum : 0.\"],\n  [\"Pielou\",\"var(--eco)\",\"Les catégories présentes sont-elles <b>bien réparties<\/b> ? On rapporte l'indice de Shannon à son maximum possible avec ces S catégories.\",\"J = H / ln S\",\"Entre <b>0<\/b> (une catégorie domine tout) et <b>1<\/b> (parts égales), quel que soit S.\"]],\n s2t:\"Le laboratoire\",\n s2d:\"Choisissez une population ou composez la vôtre : réglez le nombre de catégories et le poids de chacune. Les parts sont recalculées pour faire 100 %. Les trois indices réagissent ensemble, chacun placé sur son échelle, de 0 à son maximum.\",\n pre:{fr:\"Emploi en France (66 / 25 / 9)\",eq3:\"Trois parts égales\",dom:\"Un secteur dominant (90 / 5 / 5)\",gir:\"Gironde, cinq secteurs\",nb:\"Entreprises, en nombre\",va:\"Entreprises, en valeur ajoutée\"},\n c_S:\"Nombre de catégories S\",c_cat:\"Catégorie \",\n c_note:\"Logarithme népérien. Shannon change de valeur selon la base du logarithme ; Pielou, rapport de deux logarithmes de même base, n'en dépend pas.\",\n g_D:\"Simpson D\",g_H:\"Shannon H\",g_J:\"Pielou J\",\n g_Ds:\"maximum 1 − 1/S = {m} · soit {r} % du maximum\",\n g_Hs:\"maximum ln S = {m}\",\n g_Js:\"H / ln S · 1 = parts parfaitement égales\",\n th:[\"Catégorie\",\"Part p\",\"p²\",\"− p ln p\"],tot:\"Total\",\n s3t:\"Le nombre de catégories change la lecture\",\n s3d:\"Les maximums de Simpson et de Shannon dépendent du nombre de catégories S. On le voit en ajoutant une seule catégorie, très petite, à une population.\",\n r_t:\"Ajouter une catégorie rare\",\n r_d:\"On part d'une population et on lui ajoute une catégorie qui ne pèse que 1 % ; les autres parts baissent d'autant. S augmente d'une unité. Comment chaque indice réagit-il ?\",\n rare:\"Ajouter une catégorie à 1 %\",rareBack:\"Annuler\",\n r_rows:[\"Avant\",\"Après\"],r_th:[\"\",\"Répartition\",\"S\",\"D\",\"H\",\"J\"],\n r_none:\"Touchez « Ajouter une catégorie à 1 % » pour afficher la ligne « après ».\",\n r_cD:\"Simpson met les parts au carré : une catégorie de 1 % ne pèse presque rien (0,01² = 0,0001). D bouge à peine.\",\n r_cH:\"Shannon donne plus de poids aux catégories rares, car chacune ajoute de la surprise. H monte : sa valeur brute dépend donc du nombre de catégories retenu, pas seulement de leur équilibre.\",\n r_cJ:\"Pielou peut même <b>baisser<\/b> : le maximum passe de ln {s0} à ln {s1}, et la nouvelle catégorie, très petite, déséquilibre la répartition.\",\n maxbox:\"<b>Le maximum n'est pas 1.<\/b> À trois catégories, Simpson plafonne à 1 − 1/3 ≈ 0,667 et Shannon à ln 3 ≈ 1,10 ; seul Pielou atteint 1. Un D de 0,5 ou un H de 0,8 ne disent donc rien seuls : il faut les comparer au maximum possible avec le même nombre de catégories, par D / D<sub>max<\/sub> ou par J = H / ln S.\",\n lesson:\"<b>Lire un indice, c'est le comparer à son maximum.<\/b> Simpson mesure une probabilité, Shannon une incertitude, Pielou un équilibre. Tous trois dépendent du nombre de catégories S, jamais de la taille N de la population. Pour comparer des économies découpées différemment, on s'appuie sur Pielou ou sur D / D<sub>max<\/sub>.\"\n},\nen:{\n eyebrow:\"Session 3 · Measuring diversity\",\n title:\"The index laboratory\",\n sub:\"Three indices sum up a population's diversity in one number: <b>Simpson<\/b>, <b>Shannon<\/b> and <b>Pielou<\/b>. They do not ask the same question and do not react the same way. Above all, each has a maximum that depends on the <b>number of categories S<\/b>, not on the population size N: a result can only be read against that maximum.\",\n z_t:\"Shannon and Pielou: the surprise of a draw\",\n z_d:\"Draw one individual at random and note how surprising its category is. Landing on the majority category hardly surprises anyone; landing on a rare category is very surprising. The Shannon index is the <b>average surprise<\/b>: the higher it is, the harder it is to guess an individual's category, and the more diverse the population.\",\n z_pre:{fr:\"Employment: market, public, SSE\",eq3:\"Three equal sectors\",dom:\"One dominant sector (90 / 5 / 5)\",nb:\"Firms, by number\"},\n z_lad:\"Surprise of each category: − ln p\",\n z1:\"Draw one individual\",z100:\"100 draws\",z1000:\"1,000 draws\",zreset:\"Reset\",\n z_last0:\"No draw yet.\",z_lastS:\"surprise\",\n z_kn:\"Draws\",z_kl:\"Last surprise\",z_km:\"Average surprise ≈ <span class=\\\"lc\\\">H<\/span>\",\n z_convY:\"average surprise of the draws\",z_convH:\"expected H\",z_convM:\"maximum ln S\",\n z_ft:\"What the average estimates: H\",\n z_steps:[\"<b>p<sub>i<\/sub><\/b> = n<sub>i<\/sub> / N is the share of category i, and <b>S<\/b> the number of categories.\",\n  \"The <b>surprise<\/b> of drawing an individual from category i is <b>− ln p<sub>i<\/sub><\/b>. It is 0 if the category contains everyone (p<sub>i<\/sub> = 1: no surprise) and grows as the category gets rarer. The minus sign makes it positive, since the logarithm of a share below 1 is negative.\",\n  \"Category i comes up with probability p<sub>i<\/sub>, so in the average its surprise counts with that weight: <b>p<sub>i<\/sub> × (− ln p<sub>i<\/sub>)<\/b>.\",\n  \"Summing over the S categories gives <b>H = − Σ p<sub>i<\/sub> ln p<sub>i<\/sub><\/b>, the average surprise of a draw.\"],\n z_at:\"With the chosen population\",\n z_appEnd:\"The more draws, the closer the observed average surprise gets to H.\",\n z_pt:\"Pielou: relating H to its maximum\",\n z_axP:\"share p (width)\",z_axS:\"surprise\",z_eqL:\"equal shares: ln S\",\n z_sl:\"Move each share towards 1/S\",z_sl0:\"chosen population\",z_sl1:\"equal shares\",z_parts:\"Shares:\",\n z_psteps:[\"The chart: each bar has width p<sub>i<\/sub> and height equal to the surprise − ln p<sub>i<\/sub>. Its area is the contribution p<sub>i<\/sub> × (− ln p<sub>i<\/sub>); <b>H is the total coloured area<\/b>.\",\n  \"If the S categories had the same share 1/S, every draw would carry the same surprise, ln S: H would reach its <b>maximum, ln S<\/b> (the dashed rectangle). Drag the slider: the bars of rare categories come down, those of dominant categories rise, and the coloured area ends up filling the rectangle exactly.\",\n  \"Pielou measures the share of that maximum reached: <b>J = H / ln S<\/b>, between 0 (one category dominates everything) and 1 (equal shares), whatever the number of categories.\"],\n z_box:\"<b>Shannon measures uncertainty<\/b>: the average surprise of a draw. It is 0 when only one category exists and at most ln S when the S categories have equal shares. <b>Pielou, J = H / ln S<\/b>, brings this result between 0 and 1: it measures how evenly the population is spread, whatever the number of categories.\",\n s1t:\"Three questions, three formulas\",\n s1d:\"In all three formulas, p<sub>i<\/sub> = n<sub>i<\/sub> / N is the share of category i, and the sum runs over the S categories. N is only used to compute these shares.\",\n qs:[\n  [\"Simpson\",\"var(--rms)\",\"If I draw two individuals at random, what is the probability that they belong to <b>different categories<\/b>?\",\"D = 1 − Σ p<sub>i<\/sub>²\",\"Maximum: <b>1 − 1/S<\/b>, when all categories have the same share. Minimum: 0, when a single category holds everything.\"],\n  [\"Shannon\",\"var(--fish)\",\"How much <b>uncertainty<\/b> remains about the category of an individual drawn at random? The more categories and the more balanced they are, the harder it is to guess.\",\"H = − Σ p<sub>i<\/sub> ln(p<sub>i<\/sub>)\",\"Maximum: <b>ln S<\/b>, when all categories have the same share. Minimum: 0.\"],\n  [\"Pielou\",\"var(--eco)\",\"Are the categories present <b>evenly spread<\/b>? The Shannon index is divided by its maximum possible value with these S categories.\",\"J = H / ln S\",\"Between <b>0<\/b> (one category dominates everything) and <b>1<\/b> (equal shares), whatever S.\"]],\n s2t:\"The laboratory\",\n s2d:\"Choose a population or build your own: set the number of categories and the weight of each. Shares are rescaled to add up to 100 %. The three indices react together, each on its own scale, from 0 to its maximum.\",\n pre:{fr:\"Employment in France (66 / 25 / 9)\",eq3:\"Three equal shares\",dom:\"One dominant sector (90 / 5 / 5)\",gir:\"Gironde, five sectors\",nb:\"Firms, by number\",va:\"Firms, by value added\"},\n c_S:\"Number of categories S\",c_cat:\"Category \",\n c_note:\"Natural logarithm. Shannon's value changes with the base of the logarithm; Pielou, a ratio of two logarithms of the same base, does not.\",\n g_D:\"Simpson D\",g_H:\"Shannon H\",g_J:\"Pielou J\",\n g_Ds:\"maximum 1 − 1/S = {m} · {r} % of the maximum\",\n g_Hs:\"maximum ln S = {m}\",\n g_Js:\"H / ln S · 1 = perfectly equal shares\",\n th:[\"Category\",\"Share p\",\"p²\",\"− p ln p\"],tot:\"Total\",\n s3t:\"The number of categories changes the reading\",\n s3d:\"The maximums of Simpson and Shannon depend on the number of categories S. Adding a single, very small category to a population shows it.\",\n r_t:\"Adding a rare category\",\n r_d:\"Start from a population and add a category weighing only 1 %; the other shares shrink accordingly. S rises by one. How does each index react?\",\n rare:\"Add a 1 % category\",rareBack:\"Undo\",\n r_rows:[\"Before\",\"After\"],r_th:[\"\",\"Distribution\",\"S\",\"D\",\"H\",\"J\"],\n r_none:\"Tap “Add a 1 % category” to show the “after” row.\",\n r_cD:\"Simpson squares the shares: a 1 % category weighs almost nothing (0.01² = 0.0001). D barely moves.\",\n r_cH:\"Shannon gives more weight to rare categories, since each adds surprise. H rises: its raw value therefore depends on the number of categories chosen, not only on how balanced they are.\",\n r_cJ:\"Pielou can even <b>fall<\/b>: the maximum moves from ln {s0} to ln {s1}, and the new, very small category unbalances the distribution.\",\n maxbox:\"<b>The maximum is not 1.<\/b> With three categories, Simpson caps at 1 − 1/3 ≈ 0.667 and Shannon at ln 3 ≈ 1.10; only Pielou reaches 1. A D of 0.5 or an H of 0.8 therefore says nothing on its own: it must be compared with the maximum possible for the same number of categories, through D / D<sub>max<\/sub> or J = H / ln S.\",\n lesson:\"<b>Reading an index means comparing it with its maximum.<\/b> Simpson measures a probability, Shannon an uncertainty, Pielou a balance. All three depend on the number of categories S, never on the population size N. To compare economies broken down differently, rely on Pielou or on D / D<sub>max<\/sub>.\"\n}};\nfunction t(k){return T[LANG][k];}\nfunction fmt(x,d){var s=(+x).toFixed(d==null?0:d);if(LANG===\"fr\")s=s.replace(\".\",\",\");return s.replace(\"-\",\"−\");}\nfunction pct(p){return fmt(p*100,p<0.001?3:(p<0.01?2:(p<0.1?1:0)))+\" %\";}\n\n\n/* sec       case 'seuil':       return S+'<path d="M3 20C7 20 8 8 13 8s2 8 8 8" stroke="'+a+'"/><path d="M3 6h18" stroke-dasharray="2 2"/></svg>';
      case 'divergence':  return S+'<path d="M3 18C9 18 12 15 21 14"/><path d="M3 18C9 18 11 7 21 4" stroke="'+a+'"/><path d="M3 21V3" opacity=".45"/></svg>';
      case 'fourche':     return S+'<path d="M3 12h7"/><path d="M10 12l8-5.5" stroke="'+a+'"/><path d="M10 12l8 5.5" stroke="var(--faint)"/><path d="M18 6.5l-3 .4M18 6.5l.5 2.9" stroke="'+a+'"/></svg>';
      case 'leviers':     return S+'<path d="M3 20h18"/><path d="M6 20v-7"/><path d="M12 20V6" stroke="'+a+'"/><path d="M18 20v-10"/><path d="M8.6 8.4l2.2 2.2M10.8 8.4l-2.2 2.2" stroke="var(--faint)"/><path d="M14.6 12l2.2 2.2M16.8 12l-2.2 2.2" stroke="var(--faint)"/></svg>';
      case 'anneau':      return S+'<circle cx="12" cy="12" r="8.6" stroke-dasharray="3.4 2.4"/><circle cx="12" cy="12" r="4.4" stroke="'+a+'"/></svg>';
      case 'aires':       return S+'<path d="M3 20h18"/><path d="M3 17.6c4 0 6-2.4 9-2.4s5.4 1.6 9 1.6" stroke="'+a+'"/><path d="M3 13.6c4 0 6-3.6 9-3.6s5.4 2.6 9 2.6"/><path d="M3 9.4c4 0 6-2.6 9-2.6s5.4 1.8 9 1.8" opacity=".5"/></svg>';
      case 'balance':     return S+'<path d="M12 4v16M5 8h14" stroke="'+a+'"/><path d="M5 8l-2.2 5a2.6 2.6 0 0 0 4.4 0z"/><path d="M19 8l-2.2 5a2.6 2.6 0 0 0 4.4 0z"/></svg>';
      case 'flux':        return S+'<path d="M3 8h13" stroke="'+a+'"/><path d="M16 8l-3-2.6M16 8l-3 2.6" stroke="'+a+'"/><path d="M21 16H8"/><path d="M8 16l3-2.6M8 16l3 2.6"/></svg>';
      case 'horloge':     return S+'<circle cx="12" cy="12" r="8.6"/><path d="M12 7v5.4l3.4 2" stroke="'+a+'"/></svg>';
      case 'grille':      return S+'<rect x="4" y="4" width="16" height="16" rx="2.6"/><path d="M12 4.4v15.2M4.4 12h15.2"/><path d="M5.7 5.7h5.1v5.1h-5.1z" fill="'+a+'" stroke="none"/></svg>';
      case 'carres':      return S+'<g stroke="none"><rect x="4.6" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="10.2" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="15.8" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="4.6" y="10.2" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="10.2" y="10.2" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="15.8" y="10.2" width="4.6" height="4.6" rx="1" fill="currentColor"/><rect x="4.6" y="15.8" width="4.6" height="4.6" rx="1" fill="currentColor"/><rect x="10.2" y="15.8" width="4.6" height="4.6" rx="1" fill="var(--faint)"/><rect x="15.8" y="15.8" width="4.6" height="4.6" rx="1" fill="var(--line)"/></g></svg>';
      case 'curseurs':    return S+'<path d="M3.4 7h17.2M3.4 12h17.2M3.4 17h17.2"/><circle cx="8" cy="7" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/><circle cx="15.2" cy="12" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/><circle cx="11" cy="17" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/></svg>';
      case 'seau':        return S+'<path d="M4.2 6.6h15.6l-1.7 9.7a1.8 1.8 0 0 1-1.8 1.5H7.7a1.8 1.8 0 0 1-1.8-1.5z"/><path d="M10.4 11.6h.01M13.7 13.6h.01" stroke="'+a+'" stroke-width="2.6"/><circle cx="10.5" cy="20.4" r="1.05" fill="'+a+'" stroke="none"/><circle cx="13.9" cy="21.4" r="0.85" fill="'+a+'" stroke="none"/></svg>';
      case 'des':         return S+'<rect x="4" y="4" width="16" height="16" rx="3.4"/><circle cx="8.6" cy="8.6" r="1.35" fill="'+a+'" stroke="none"/><circle cx="15.4" cy="8.6" r="1.35" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.35" fill="'+a+'" stroke="none"/><circle cx="8.6" cy="15.4" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.35" fill="'+a+'" stroke="none"/></svg>';
      case 'planchers':   return S+'<path d="M3 20h18"/><rect x="5" y="6.5" width="3.8" height="13.5" rx="1"/><rect x="10.1" y="9.5" width="3.8" height="10.5" rx="1"/><rect x="15.2" y="12" width="3.8" height="8" rx="1" stroke="'+a+'"/><path d="M3.8 16.8h16.4" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'mappemonde':  return S+'<circle cx="12" cy="12" r="8.6" stroke="'+a+'"/><path d="M12 3.4c3.1 3 3.1 14.2 0 17.2M12 3.4c-3.1 3-3.1 14.2 0 17.2"/><path d="M3.7 9.3h16.6M3.7 14.7h16.6"/></svg>';
      /* silhouette réelle de la courbe de l'éléphant : bosse, creux, trompe */
      case 'elephant':    return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17.5C6.6 17.5 7.2 10 9.6 10S12.6 15.2 15.4 15.2C17.4 15.2 18.2 9.5 20 4.6" stroke="'+a+'"/></svg>';
      case 'convergence': return S+'<path d="M3.2 5.5h4.4M3.2 12h4.4M3.2 18.5h4.4"/><path d="M7.6 5.5C12.8 5.5 12.8 12 16.2 12" stroke="'+a+'"/><path d="M7.6 12h8.6" stroke="'+a+'"/><path d="M7.6 18.5C12.8 18.5 12.8 12 16.2 12" stroke="'+a+'"/><circle cx="18.4" cy="12" r="2.1" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'distribution':return S+'<path d="M3 20h18"/><path d="M5.5 20v-3.2M8.5 20v-9M11.5 20v-6M14.5 20v-3.4M17.5 20v-1.8"/><path d="M12.8 4.5V20" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'lorenz':      return S+'<path d="M4 20h16M4 20V4"/><path d="M4 20L20 4" stroke-dasharray="2.5 2" opacity=".55"/><path d="M4 20C11 20 16.5 15 20 4" stroke="'+a+'"/></svg>';
      /* plusieurs séries superposées, pilotées par un même sélecteur */
      case 'series':      return S+'<path d="M4 20h16M4 20V4"/><path d="M6 14.5l3.4-3.4 3.4 3.4 3.4-6.6 2.6 2.4" stroke="'+a+'"/><path d="M6 17.8c3.4-.6 6.2 1 12-2.6" opacity=".45"/><circle cx="9.4" cy="11.1" r="1.25" fill="'+a+'" stroke="none"/><circle cx="16.2" cy="7.9" r="1.25" fill="'+a+'" stroke="none"/></svg>';
      case 'croisement':  return S+'<path d="M4 20h16M4 20V4"/><path d="M6 17.5L19 7" stroke="'+a+'" stroke-dasharray="3 2"/><circle cx="8.5" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="13.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="10.5" r="1.2" fill="'+a+'" stroke="none"/><circle cx="18" cy="8" r="1.2" fill="'+a+'" stroke="none"/></svg>';
      case 'voile':       return S+'<path d="M2.6 12S6 6.8 12 6.8 21.4 12 21.4 12 18 17.2 12 17.2 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="2.5" stroke="'+a+'"/><path d="M4.5 19.5L19.5 4.5" stroke="'+a+'"/></svg>';
      case 'course':      return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17C9 17 13 13.5 20 5.5" stroke="'+a+'"/><path d="M4.5 17C9 17 13 15.5 20 13.5"/></svg>';
      case 'ratio':       return S+'<path d="M3 20h18"/><rect x="5.5" y="4.5" width="4.6" height="15.5" rx="1.2" stroke="'+a+'"/><rect x="13.9" y="15" width="4.6" height="5" rx="1.2"/></svg>';
      case 'ecart':       return S+'<path d="M3 20h18"/><path d="M4 7h16" stroke="'+a+'"/><path d="M4 12.6C9 12.6 13.5 16 20 17"/><path d="M12 7.6v6.9" stroke="var(--faint)"/><path d="M12 7.6l-1.5 1.7M12 7.6l1.5 1.7M12 14.5l-1.5-1.7M12 14.5l1.5-1.7" stroke="var(--faint)"/></svg>';
    }
    return S+'<circle cx="12" cy="12" r="8" stroke="'+a+'"/></svg>';
  }

  /* ───────── état ───────── */
  var LANG = CFG.langue_defaut || 'fr';
  try{ var sl=localStorage.getItem(PREFIXE+'_lang'); if(sl) LANG=sl; }catch(e){}
  var THEME=null;
  try{ var st=localStorage.getItem(PREFIXE+'_theme'); if(st) THEME=st; }catch(e){}
  if(!THEME) THEME = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', THEME);

  function T(){ return CFG.textes[LANG]; }

  function seed(){
    for(var i=0;i<N;i++){
      try{
        localStorage.setItem(STEPS[i].cle+'_theme', THEME);
        localStorage.setItem(STEPS[i].cle+'_lang',  LANG);
      }catch(e){}
    }
    try{ localStorage.setItem(PREFIXE+'_theme',THEME); localStorage.setItem(PREFIXE+'_lang',LANG); }catch(e){}
  }

  /* ───────── le fil ───────── */
  function carte(i){
    var d=T(), s=STEPS[i];
    var a=document.createElement('a');
    a.className='card'; a.href='#/'+(i+1);
    a.innerHTML='<span class="emb" style="color:'+tok(s.couleur)+'">'+emb(s.icone,s.couleur)+'</span>'+
      '<span class="cbody"><span class="idx">'+(i+1)+'</span>'+
      '<h3>'+d.cartes[i].titre+'</h3><p>'+d.cartes[i].resume+'</p>'+
      '<span class="go">'+d.nav_ouvrir+' →</span></span>';
    return a;
  }

  /* Une partie sans numéro est un seuil : elle ouvre la séance sans être
     comptée dans les parties. Le fil l'annonce par une étiquette, le bandeau
     par un repère discret placé avant les chiffres romains. */
  function estSeuil(p){ var P=PARTIES[p-1]; return !!P.seuil || !P.numero; }
  function marque(p){ return estSeuil(p) ? '◦' : PARTIES[p-1].numero; }
  function etiquette(p){
    var e=T().parties[p-1].etiquette;
    return e || (LANG==='en' ? 'Opening' : 'Ouverture');
  }

  function buildFil(){
    var d=T(), box=document.getElementById('parties');
    box.innerHTML='';
    for(var p=1;p<=NP;p++){
      var sec=document.createElement('section');
      sec.className='part'+(estSeuil(p)?' seuil':'');
      sec.style.setProperty('--pc', tok(PARTIES[p-1].couleur));
      var rang = estSeuil(p)
        ? '<span class="sn">'+etiquette(p)+'</span>'
        : '<span class="rn">'+PARTIES[p-1].numero+'</span>';
      var h='<div class="parthead">'+rang+
            '<h2>'+d.parties[p-1].titre+'</h2></div>'+
            '<p class="partlead">'+d.parties[p-1].chapo+'</p>'+
            '<div class="cards"></div>';
      sec.innerHTML=h;
      var grille=sec.querySelector('.cards');
      for(var i=0;i<N;i++) if(STEPS[i].partie===p) grille.appendChild(carte(i));
      box.appendChild(sec);
    }
  }

  /* ───────── bandeau de situation ───────── */
  function premierDe(p){ for(var j=0;j<N;j++) if(STEPS[j].partie===p) return j; return 0; }

  function buildNav(i){
    var d=T(), s=STEPS[i], cur=null,
        bar=document.getElementById('nparts'), box=document.getElementById('steps');
    document.documentElement.style.setProperty('--acc', tok(PARTIES[s.partie-1].couleur));
    document.getElementById('ncount').textContent=(i+1)+' / '+N;

    bar.innerHTML='';
    for(var p=1;p<=NP;p++){
      if(p===s.partie){
        var c=document.createElement('span');
        c.className='pcur';
        c.innerHTML='<em>'+marque(p)+'</em><span>'+d.parties[p-1].titre+'</span>';
        c.setAttribute('aria-current','true');
        bar.appendChild(c);
      } else {
        var g=document.createElement('a');
        g.className='pgrp';
        g.href='#/'+(premierDe(p)+1);
        g.title=(estSeuil(p)?etiquette(p):PARTIES[p-1].numero)+' · '+d.parties[p-1].titre;
        g.textContent=marque(p);
        bar.appendChild(g);
      }
    }

    box.innerHTML='';
    for(var j=0;j<N;j++){
      if(STEPS[j].partie!==s.partie) continue;
      var a=document.createElement('a');
      a.className='stp'+(j===i?' on':'');
      a.href='#/'+(j+1);
      a.title=d.cartes[j].titre;
      a.innerHTML='<em>'+(j+1)+'</em><span>'+d.cartes[j].titre+'</span>';
      if(j===i){ a.setAttribute('aria-current','true'); cur=a; }
      box.appendChild(a);
    }
    /* le bandeau peut être encore masqué : on attend une frame pour mesurer */
    if(cur) requestAnimationFrame(function(){
      box.scrollLeft = Math.max(0, cur.offsetLeft - (box.clientWidth - cur.offsetWidth)/2);
    });
  }

  /* ───────── iframes ───────── */
  var host=document.getElementById('host'), frames={}, current=-1;

  /* Une iframe capte le clavier dès qu'on a cliqué dedans, et la coquille ne
     voit plus rien. On y relaie donc Échap et F — et seulement eux : les
     flèches appartiennent aux outils, qui s'en servent pour leurs propres
     étapes. Les iframes srcdoc héritent de notre origine, d'où l'accès. */
  function brancherClavier(fr){
    try{
      var doc=fr.contentDocument; if(!doc) return;
      doc.addEventListener('keydown', function(ev){
        if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
        if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
        else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
      });
    }catch(e){}
  }

  function syncFrame(fr){
    if(!fr) return;
    try{
      var doc=fr.contentDocument;
      if(!doc || !doc.documentElement) return;
      for(var n=0;n<2;n++){
        if(doc.documentElement.getAttribute('data-theme')===THEME) break;
        var tb=doc.getElementById('theme'); if(!tb) break; tb.click();
      }
      for(var m=0;m<2;m++){
        if((doc.documentElement.lang||'fr')===LANG) break;
        var lb=doc.getElementById('lang'); if(!lb) break; lb.click();
      }
    }catch(e){}
  }

  function showTool(i){
    var s=STEPS[i], d=T();
    document.body.classList.add('mode-tool');
    seed();
    if(!frames[s.fichier]){
      var fr=document.createElement('iframe');
      fr.setAttribute('title', d.cartes[i].titre);
      host.appendChild(fr);
      frames[s.fichier]=fr;
      fr.addEventListener('load', function(){ syncFrame(fr); brancherClavier(fr); });
      fr.srcdoc = TOOLS[s.fichier];
    } else {
      syncFrame(frames[s.fichier]);
    }
    for(var k in frames) frames[k].style.display = (k===s.fichier) ? 'block' : 'none';
    if(plein) montrerNav(1600);
    current=i;
    buildNav(i);
    var pb=document.getElementById('prev'), nb=document.getElementById('next');
    pb.disabled=(i===0); nb.disabled=(i===N-1);
    pb.title=d.nav_prec; nb.title=d.nav_suiv;
  }

  function showFil(){
    if(plein) setPlein(false);
    document.body.classList.remove('mode-tool');
    current=-1;
    window.scrollTo(0, window.__filScroll||0);
  }

  /* ───────── plein écran ───────── */
  var plein=false, minuterieNav=null, minuterieAstuce=null;

  function montrerNav(delaiMasquage){
    document.body.classList.add('nav-on');
    clearTimeout(minuterieNav);
    if(delaiMasquage) minuterieNav=setTimeout(function(){
      document.body.classList.remove('nav-on');
    }, delaiMasquage);
  }

  function demanderPleinEcran(){
    var el=document.documentElement;
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(f){ try{ var p=f.call(el); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }
  function quitterPleinEcran(){
    var actif=document.fullscreenElement||document.webkitFullscreenElement;
    if(!actif) return;
    var f=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(f){ try{ var p=f.call(document); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }

  function setPlein(v){
    if(plein===v) return;
    plein=v;
    document.body.classList.toggle('mode-plein', v);
    var b=document.getElementById('tplein'), d=T();
    b.textContent = v ? '⤡' : '⤢';
    b.title = v ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    if(v){
      demanderPleinEcran();
      montrerNav(2400);
      document.getElementById('pastille').textContent =
        (d.nav_plein_astuce||'Approchez du haut pour revoir la barre · Échap pour sortir');
      document.body.classList.add('astuce');
      clearTimeout(minuterieAstuce);
      /* l'astuce doit rester lisible après le retrait du bandeau, pas pendant */
      minuterieAstuce=setTimeout(function(){ document.body.classList.remove('astuce'); }, 6500);
    } else {
      quitterPleinEcran();
      clearTimeout(minuterieNav); clearTimeout(minuterieAstuce);
      document.body.classList.remove('nav-on','astuce');
    }
  }

  document.getElementById('tplein').addEventListener('click', function(){ setPlein(!plein); });
  document.getElementById('hotzone').addEventListener('mouseenter', function(){ montrerNav(0); });
  document.querySelector('.nav').addEventListener('mouseleave', function(){ if(plein) montrerNav(500); });
  /* Sortie par F11 ou par la touche Échap interceptée par le navigateur :
     on resynchronise la coquille sur l'état réel. */
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement||document.webkitFullscreenElement) && plein) setPlein(false);
    });
  });

  function route(){
    var h=(location.hash||'').replace(/^#\/?/,'');
    var n=parseInt(h,10);
    if(h && !isNaN(n) && n>=1 && n<=N){
      if(current===-1) window.__filScroll = window.pageYOffset||0;
      showTool(n-1);
    } else {
      showFil();
    }
  }
  window.addEventListener('hashchange', route);

  function go(i){
    if(i<0){ location.hash='#/fil'; return; }
    if(i>N-1) return;
    location.hash='#/'+(i+1);
  }
  document.getElementById('prev').addEventListener('click', function(){ if(current>0) go(current-1); });
  document.getElementById('next').addEventListener('click', function(){ if(current>-1 && current<N-1) go(current+1); });

  document.addEventListener('keydown', function(ev){
    if(current===-1) return;
    if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
    else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
    else if(ev.key==='ArrowLeft'  && current>0)   { go(current-1); }
    else if(ev.key==='ArrowRight' && current<N-1) { go(current+1); }
  });

  /* ───────── bascules ───────── */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', THEME);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleTheme(){ THEME=(THEME==='dark')?'light':'dark'; applyTheme(); }
  document.getElementById('theme').addEventListener('click', toggleTheme);
  document.getElementById('ttheme').addEventListener('click', toggleTheme);

  function applyLang(){
    var d=T();
    document.documentElement.lang=LANG;
    document.title = d.titre_onglet;
    document.getElementById('eyebrow').innerHTML = d.surtitre;
    document.getElementById('titre').textContent = d.titre;
    document.getElementById('seance').textContent = d.seance;
    document.getElementById('chapo').innerHTML = d.chapo;
    document.getElementById('pied').innerHTML = d.pied;
    document.getElementById('licence').innerHTML = d.licence;
    document.getElementById('homelbl').textContent = d.nav_fil;
    /* Remontée vers la page du cours : seulement si le manifeste la déclare.
       Une séance diffusée seule, sans page d'accueil à côté, n'affiche rien
       plutôt qu'un lien qui mènerait à une erreur. */
    var lien = CFG.lien_accueil, rm = document.getElementById('remonte'),
        ab = document.getElementById('accueilbtn');
    if(lien){
      rm.href = lien; ab.href = lien;
      rm.hidden = false; ab.hidden = false;
      document.getElementById('remontelbl').textContent = d.nav_accueil || 'Le cours';
      ab.title = d.nav_accueil || 'Le cours';
    } else {
      rm.hidden = true; ab.hidden = true;
    }
    var bp=document.getElementById('tplein');
    bp.title = plein ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    document.getElementById('langlbl').textContent = LANG.toUpperCase();
    document.getElementById('tlanglbl').textContent = LANG.toUpperCase();
    buildFil();
    if(current>-1) buildNav(current);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleLang(){
    var codes=Object.keys(CFG.textes);
    LANG = codes[(codes.indexOf(LANG)+1) % codes.length];
    applyLang();
  }
  document.getElementById('lang').addEventListener('click', toggleLang);
  document.getElementById('tlang').addEventListener('click', toggleLang);

  /* ───────── démarrage ───────── */
  seed();
  applyLang();
  route();
})();
</script>

</body>
</html>
