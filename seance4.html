lor:#fff;font-weight:600}\n.fb{font-size:13px;color:var(--muted);background:var(--panel);border-radius:9px;padding:8px 10px;text-wrap:pretty}\n.fb .v{font-weight:600} .fb .v.ok{color:var(--eco)} .fb .v.ko{color:var(--warn)}\n.quote{margin:16px 0 0;font-family:var(--font-d);font-style:italic;font-size:16px;color:var(--ink);border-left:3px solid var(--line);padding:2px 0 2px 16px;max-width:82ch}\n.quote cite{display:block;font-family:var(--font-b);font-style:normal;font-size:12.5px;color:var(--faint);margin-top:4px}\n.tabwrap{overflow-x:auto}\n.ctab{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}\n.ctab th{text-align:left;font-family:var(--font-m);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:500;padding:0 12px 8px;border-bottom:1px solid var(--line)}\n.ctab td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:top;text-wrap:pretty}\n.ctab td:first-child{color:var(--ink);font-weight:500;width:20%}\n.ctab td:last-child{color:var(--ink)}\n.ctab tr:last-child td{border-bottom:none}\n.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}\n.stepsrow{display:flex;flex-wrap:wrap;gap:8px}\n.stepbtn{font-family:var(--font-b);font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:20px;padding:6px 12px;cursor:pointer;display:flex;gap:7px;align-items:center}\n.stepbtn .n{font-family:var(--font-m);font-size:11px;color:var(--faint)}\n.stepbtn.on{color:var(--ink);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;font-weight:600}\n.nav{display:flex;gap:8px;margin-left:auto}\n.btn:disabled{opacity:.35;cursor:default}\n.circ{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}\n@media(max-width:880px){.circ{grid-template-columns:minmax(0,1fr)}}\n.circ>*{min-width:0}\n.stxt h3{font-family:var(--font-d);font-weight:600;font-size:17px;margin:0 0 6px}\n.stxt p{margin:0 0 10px;font-size:14px;color:var(--muted);text-wrap:pretty}\n.led{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}\n.led th{font-family:var(--font-m);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:500;padding:0 8px 7px;border-bottom:1px solid var(--line);text-align:right}\n.led th:first-child,.led td:first-child{text-align:left}\n.led td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums;color:var(--ink)}\n.led td:first-child{font-family:var(--font-b);font-weight:600}\n.led td .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}\n.led td.z{color:var(--eco)} .led td.nz{color:var(--warn)}\n.led tr:last-child td{border-bottom:none}\n.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}\n@media(max-width:520px){.res{grid-template-columns:minmax(0,1fr)}}\n.res>div{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:9px 11px;background:var(--panel);font-size:13px;color:var(--muted);min-width:0}\n.res b{display:block;margin-bottom:3px}\n.refs{margin-top:18px;font-size:12.5px;color:var(--muted);text-wrap:pretty}\n.refs p{margin:0 0 4px}\n.refs .rt{font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}\n.refs i{font-style:italic}\n.refs a{color:var(--econ);overflow-wrap:anywhere}\n.lesson{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:14px 18px;font-size:14px;color:var(--muted);text-wrap:pretty;box-shadow:var(--shadow)}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\">\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\"><\/p>\n      <h1 data-t=\"title\"><\/h1>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" type=\"button\" aria-label=\"Langue / Language\">FR/EN <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" type=\"button\" aria-label=\"Thème clair ou sombre\">◐<\/button>\n    <\/div>\n  <\/div>\n  <p class=\"sub\" data-t=\"sub\"><\/p>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">1<\/span><h2 data-t=\"s1t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s1d\"><\/p>\n    <div class=\"modes\">\n      <span id=\"modes\" style=\"display:flex;flex-wrap:wrap;gap:8px\"><\/span>\n      <span class=\"sp\"><\/span>\n      <button class=\"btn\" id=\"coin\" type=\"button\"><\/button>\n      <button class=\"btn ghost\" id=\"pause\" type=\"button\"><\/button>\n    <\/div>\n    <div class=\"game\">\n      <div class=\"tablewrap\"><canvas id=\"cv\" width=\"560\" height=\"460\" role=\"img\" aria-label=\"Flipper monétaire\"><\/canvas><\/div>\n      <div>\n        <div class=\"kpis\" id=\"kpis\"><\/div>\n        <div class=\"chartbox\"><p class=\"lab\" data-t=\"chL\"><\/p><svg id=\"ch\" viewBox=\"0 0 420 150\" role=\"img\" aria-labelledby=\"chT\"><title id=\"chT\">Débit<\/title><\/svg><\/div>\n        <div class=\"verdict\" id=\"verdict\"><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"box\" data-t=\"b1\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">2<\/span><h2 data-t=\"s2t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s2d\"><\/p>\n    <div class=\"bar\"><span class=\"score\" id=\"sc2\"><\/span><button class=\"btn ghost\" id=\"sol2\" type=\"button\"><\/button><\/div>\n    <div class=\"pq\" id=\"pq\"><\/div>\n    <div class=\"box\" data-t=\"b2\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">3<\/span><h2 data-t=\"s3t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s3d\"><\/p>\n    <div class=\"tabwrap\"><table class=\"ctab\" id=\"ctab\"><\/table><\/div>\n    <blockquote class=\"quote\"><span data-t=\"q3\"><\/span><cite>Jézabel Couppey-Soubeyran, Pierre Delandre, Augustin Sersiron, 2024<\/cite><\/blockquote>\n    <div class=\"box\" style=\"--c:var(--faint)\" data-t=\"b3\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">4<\/span><h2 data-t=\"s4t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s4d\"><\/p>\n    <div class=\"stepper\">\n      <div class=\"stepsrow\" id=\"aSteps\"><\/div>\n      <div class=\"nav\"><button class=\"btn ghost\" id=\"aPrev\" type=\"button\"><\/button><button class=\"btn\" id=\"aNext\" type=\"button\"><\/button><\/div>\n    <\/div>\n    <div class=\"circ\">\n      <div><svg id=\"sq\" viewBox=\"0 0 540 420\" role=\"img\" aria-labelledby=\"sqT\"><title id=\"sqT\">Circuit<\/title><\/svg><\/div>\n      <div><div class=\"stxt\" id=\"aTxt\"><\/div><table class=\"led\" id=\"aLed\"><\/table><div class=\"res\" id=\"aRes\" hidden><\/div><\/div>\n    <\/div>\n    <div class=\"box\" style=\"--c:var(--fish)\" data-t=\"b4\"><\/div>\n  <\/section>\n\n  <div class=\"lesson\" data-t=\"lesson\"><\/div>\n  <footer class=\"refs\">\n    <p class=\"rt\" data-t=\"refsT\"><\/p>\n    <p>Couppey-Soubeyran J., Delandre P., Sersiron A. (2024), <i>Le pouvoir de la monnaie. Transformons la monnaie pour transformer la société<\/i>, Paris, Les Liens qui libèrent.<\/p>\n    <p>Harribey J.-M., recension de <i>Le pouvoir de la monnaie<\/i> : <a href=\"https://harribey.u-bordeaux.fr/travaux/monnaie/pouvoir-monnaie.pdf\" target=\"_blank\" rel=\"noopener\">harribey.u-bordeaux.fr/travaux/monnaie/pouvoir-monnaie.pdf<\/a><\/p>\n  <\/footer>\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\nvar NS=\"http://www.w3.org/2000/svg\";\nfunction mk(t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}\nfunction $(id){return document.getElementById(id);}\nfunction clear(svg){var ti=svg.querySelector(\"title\");while(svg.lastChild&&svg.lastChild!==ti)svg.removeChild(svg.lastChild);}\nvar P=\"flip\",LANG=\"fr\";\ntry{var sl=localStorage.getItem(P+\"_lang\");if(sl===\"fr\"||sl===\"en\")LANG=sl;}catch(e){}\ntry{var st=localStorage.getItem(P+\"_theme\");if(st===\"dark\"||st===\"light\")document.documentElement.setAttribute(\"data-theme\",st);}catch(e){}\n\nvar T={\nfr:{\n eyebrow:\"Séance 4 · Implications écologiques\",\n title:\"Le flipper monétaire\",\n sub:\"Dans un système où toute monnaie naît d'un crédit, l'économie ressemble à un flipper : chaque bille est une unité de monnaie, la partie s'arrête quand toutes les billes sont tombées. On relie ce flipper à l'engrenage de la séance 1, puis on regarde ce que la monnaie-dette finance, et ce qu'une autre monnaie pourrait financer.\",\n s1t:\"Pour que la partie continue, il faut remettre des pièces\",\n s1d:\"Chaque bille est lancée par un crédit. Elle percute les pôles du circuit : la <b>production<\/b>, qui consomme énergie et matières et fait tourner la roue énergétique, puis les revenus et la consommation. Elle finit dans le trou du <b>remboursement<\/b>, où elle est détruite. Choisissez un régime de crédit et regardez les deux roues.\",\n modes:[\"Plus de crédits\",\"Crédits stables\",\"Crédits +10 % par période\"],\n coin:\"Insérer une pièce\",pause:\"Pause\",resume:\"Reprendre\",\n launch:\"crédit\",drain:\"remboursement\",prod:\"Production\",inc:\"Revenus\",cons:\"Consommation\",\n wM:\"roue monétaire\",wE:\"roue énergétique\",energy:\"énergie et matières\",\n kM:\"Billes en jeu (monnaie)\",kC:\"Crédits par période\",kE:\"Débit énergétique\",\n chL:\"Débit énergétique par période\",per:\"périodes\",\n vStop:\"Plus aucune pièce : les billes en jeu tombent une à une dans le trou du remboursement. La monnaie disparaît, la production s'arrête, et la roue énergétique avec elle.\",\n vStable:\"Chaque remboursement est compensé par un nouveau crédit : le nombre de billes reste stable, et la roue énergétique tourne à vitesse constante.\",\n vGrowth:\"Les crédits augmentent à chaque période : plus de billes, plus de production, et la roue énergétique accélère au même rythme. On ne peut pas accélérer la roue monétaire sans accélérer la roue énergétique.\",\n vCap:\"La table est saturée. Dans l'économie réelle, ce sont les ressources et les limites planétaires qui finissent par freiner la roue énergétique, et avec elle la roue monétaire.\",\n b1:\"<b>L'engrenage, vu depuis la monnaie.<\/b> Avec une monnaie qui naît du crédit, il faut sans cesse de nouveaux crédits pour que la partie continue. Chaque crédit finance une production, et chaque production entraîne la roue énergétique : énergie et matières en entrée, chaleur et déchets en sortie. Quand le crédit accélère pour entretenir la croissance, le débit physique accélère avec lui. Couppey-Soubeyran, Delandre et Sersiron (2024) y voient une <b>addiction à la croissance<\/b> qui éloigne l'économie de la résilience.\",\n s2t:\"Ce que finance la monnaie-dette\",\n s2d:\"Une banque crée de la monnaie si elle pense être remboursée. Pour chaque projet, une banque le financera-t-elle facilement à crédit ?\",\n sc:\"Réponses justes : \",sol:\"Montrer la correction\",\n yes:\"Oui, il est rentable\",no:\"Difficilement\",\n ok:\"Juste.\",ko:\"Pas tout à fait.\",\n pr:[\"Un entrepôt logistique loué à un grand distributeur\",\"Une centrale solaire avec un tarif d'achat garanti\",\"La rénovation thermique de logements de ménages modestes\",\"La restauration d'une zone humide qui protège des crues\",\"Un réseau de pistes cyclables\",\"L'agrandissement du parking d'un centre commercial\"],\n ex:[\"Les loyers assurent des recettes régulières : le remboursement est presque garanti.\",\"Le tarif garanti rend les recettes prévisibles : c'est ce qui rend ce type de projet finançable.\",\"Les économies d'énergie profitent aux occupants, souvent peu solvables, et remboursent lentement : sans aide publique, le crédit suit mal.\",\"Le bénéfice, éviter des inondations, est réel mais collectif : il ne produit aucune recette pour rembourser un prêt.\",\"Pas de recette directe : ces réseaux sont financés par l'impôt, pas par le crédit bancaire.\",\"Le parking attire des clients et donc du chiffre d'affaires : le projet est rentable pour son propriétaire.\"],\n b2:\"<b>La monnaie-dette suit la rentabilité, pas l'utilité.<\/b> Les projets rentables trouvent leur crédit ; beaucoup d'investissements écologiques et sociaux, utiles mais sans recettes, restent à la charge des budgets publics, ou ne se font pas.\",\n s3t:\"Une monnaie volontaire ?\",\n s3d:\"Couppey-Soubeyran, Delandre et Sersiron proposent de compléter la monnaie bancaire par une monnaie créée sans dette, réservée aux investissements nécessaires à la transition.\",\n th:[\"\",\"Monnaie-dette bancaire\",\"Monnaie volontaire (proposition)\"],\n rows:[\n  [\"Qui la crée\",\"Les banques, en accordant des crédits\",\"La banque centrale, sur décision d'un institut d'émission\"],\n  [\"Contrepartie\",\"Une dette à rembourser\",\"Aucune dette : une « contribution aux missions du développement durable »\"],\n  [\"Ce qu'elle finance\",\"Des projets capables de rembourser\",\"Des investissements nécessaires mais non rentables, surtout par subventions\"],\n  [\"Qui choisit\",\"La banque, selon la solvabilité\",\"Une gouvernance associant entreprises, services publics, associations et collectivités\"],\n  [\"Comment elle disparaît\",\"Au remboursement du crédit\",\"Par des prélèvements, notamment sur l'extraction de ressources non renouvelables\"]\n ],\n q3:\"« Imaginons que vienne la compléter une monnaie volontaire, créée en dehors de toute dette […] finançant des investissements non rentables mais nécessaires au développement durable. »\",\n b3:\"<b>Une proposition discutée.<\/b> Ses auteurs y voient l'un des piliers d'un changement de paradigme. Ses critiques, comme Jean-Marie Harribey dans sa recension, y voient surtout une dépense publique fléchée sous un autre nom, et jugent flous le statut de l'institut d'émission et son articulation avec les institutions existantes.\",\n refsT:\"Références\",\n s4t:\"L'État peut aussi financer la transition\",\n s4d:\"On ajoute au circuit un quatrième pôle, <b>A<\/b>, les administrations publiques. Comme les entreprises, elles peuvent dépenser avant d'avoir encaissé : leur déficit est financé par une création monétaire à destination du secteur public. Avancez flux par flux avec les boutons ou les flèches ← →.\",\n prev:\"← Précédent\",next:\"Suivant →\",\n aS:[\"Les pôles\",\"Crédit aux entreprises\",\"Déficit public\",\"Investissement privé\",\"Investissement public\",\"Revenus\",\"Consommation\",\"Épargne\",\"Réservoirs\"],\n aP:{B:[\"B\",\"Banques\"],A:[\"A\",\"Administrations\"],E:[\"E\",\"Entreprises\"],M:[\"M\",\"Ménages\"]},\n aF:[[\"financement net\",\"20\"],[\"financement du déficit\",\"20\"],[\"investissement\",\"I = 20\"],[\"commande publique\",\"G = 20\"],[\"revenus\",\"Y = W + P = 120\"],[\"consommation\",\"C = 80\"],[\"épargne nette\",\"S = 40\"]],\n aT:[\n  {t:\"Quatre pôles\",p:[\"Le pôle <b>A<\/b> regroupe l'État, les collectivités et les administrations de sécurité sociale. Pour simplifier, on laisse de côté les impôts : tout le déficit sert à financer des investissements de transition.\",\"On garde les chiffres du circuit à trois pôles et on y ajoute la dépense publique.\"]},\n  {t:\"Le crédit aux entreprises\",p:[\"Comme avant, les banques accordent <b>20<\/b> de financement net aux entreprises, pour des projets qu'elles jugent rentables.\"]},\n  {t:\"Le financement du déficit\",p:[\"Les banques achètent <b>20<\/b> de titres publics : elles créent les dépôts que l'État va dépenser. C'est une <b>création monétaire à destination du secteur public<\/b>.\",\"En zone euro, la banque centrale ne peut pas prêter directement aux États (article 123 du traité sur le fonctionnement de l'Union européenne) : ce sont les banques qui achètent les titres, la banque centrale pouvant ensuite les racheter sur le marché secondaire.\"]},\n  {t:\"L'investissement privé\",p:[\"Les entreprises achètent pour 20 d'équipements à d'autres entreprises. Ce flux reste à l'intérieur du pôle E.\"]},\n  {t:\"L'investissement public de transition\",p:[\"L'État commande <b>20<\/b> d'investissements que le crédit bancaire finance mal : rénovation thermique de logements modestes, restauration de zones humides, pistes cyclables. Les entreprises qui les réalisent sont payées par la dépense publique.\",\"Ces projets ne rapportent rien à l'État qui les paie, mais ils sont réalisés : le déficit a fait ce que la rentabilité ne permettait pas.\"]},\n  {t:\"Les revenus\",p:[\"La production distribue <b>Y = W + P = 120<\/b> de revenus. C'est la valeur ajoutée de la période : 80 de biens de consommation, 20 d'investissement privé et 20 d'investissement public.\",\"La dépense publique a augmenté la production et les revenus de 20.\"]},\n  {t:\"La consommation\",p:[\"Les ménages dépensent <b>80<\/b> en biens de consommation : la monnaie revient au pôle E.\"]},\n  {t:\"L'épargne nette ferme le circuit\",p:[\"Les ménages épargnent <b>S = Y − C = 40<\/b>, sous forme de dépôts ou de titres. Le circuit est bouclé : chaque pôle reçoit autant qu'il verse.\"]},\n  {t:\"Les réservoirs\",p:[\"L'État s'est endetté de 20 et dispose de 20 d'équipements publics de transition. Les entreprises se sont endettées de 20 et disposent de 20 d'équipements. Les ménages ont 40 d'actifs financiers.\",\"L'épargne privée égale l'investissement privé plus le déficit public : <b>S = I + (G − T)<\/b>, soit 40 = 20 + 20. Le déficit ne prive pas le secteur privé d'épargne : il en est la contrepartie.\"]}\n ],\n aLth:[\"Pôle\",\"Entrées\",\"Sorties\",\"Solde\"],\n aRes:{B:[\"Banques\",\"prêts +20 et titres publics +20 à l'actif, dépôts +40 au passif\"],A:[\"Administrations\",\"dette publique +20, équipements de transition +20\"],E:[\"Entreprises\",\"dette +20, équipements +20\"],M:[\"Ménages\",\"actifs financiers +40 (dépôts ou titres)\"]},\n sqT:\"Circuit à quatre pôles : banques, administrations, entreprises, ménages\",\n b4:\"<b>Une autre voie que la monnaie volontaire : le déficit public.<\/b> Elle existe dans les institutions actuelles et permet de financer dès aujourd'hui des investissements non rentables. Elle reste une dette, soumise aux règles budgétaires européennes et au jugement des marchés sur les titres publics. Dans les deux cas, la contrainte ultime est réelle : le travail, l'énergie et les matières que ces investissements mobilisent.\",\n lesson:\"<b>La monnaie fait tourner la roue énergétique.<\/b> Avec une monnaie-dette, la partie ne continue que si le crédit coule, et le crédit va d'abord aux projets rentables. Réformer la monnaie, c'est interroger à la fois le rythme de la roue monétaire et ce qu'elle finance.\"\n},\nen:{\n eyebrow:\"Session 4 · Ecological implications\",\n title:\"The monetary pinball\",\n sub:\"In a system where all money is born from a loan, the economy resembles a pinball machine: each ball is a unit of money, and the game stops when all the balls have dropped. We link this pinball to the gear of session 1, then look at what debt-money finances, and what another money could finance.\",\n s1t:\"To keep the game going, you have to insert more coins\",\n s1d:\"Each ball is launched by a loan. It hits the poles of the circuit: <b>production<\/b>, which uses energy and materials and turns the energy wheel, then incomes and consumption. It ends in the <b>repayment<\/b> hole, where it is destroyed. Choose a credit regime and watch the two wheels.\",\n modes:[\"No more loans\",\"Stable lending\",\"Lending +10 % per period\"],\n coin:\"Insert a coin\",pause:\"Pause\",resume:\"Resume\",\n launch:\"loan\",drain:\"repayment\",prod:\"Production\",inc:\"Incomes\",cons:\"Consumption\",\n wM:\"monetary wheel\",wE:\"energy wheel\",energy:\"energy and materials\",\n kM:\"Balls in play (money)\",kC:\"Loans per period\",kE:\"Energy throughput\",\n chL:\"Energy throughput per period\",per:\"periods\",\n vStop:\"No more coins: the balls in play drop one by one into the repayment hole. Money disappears, production stops, and the energy wheel with it.\",\n vStable:\"Each repayment is offset by a new loan: the number of balls stays stable, and the energy wheel turns at constant speed.\",\n vGrowth:\"Lending rises every period: more balls, more production, and the energy wheel speeds up at the same pace. You cannot speed up the monetary wheel without speeding up the energy wheel.\",\n vCap:\"The table is saturated. In the real economy, resources and planetary boundaries end up braking the energy wheel, and the monetary wheel with it.\",\n b1:\"<b>The gear, seen from money.<\/b> With money born from credit, new loans are constantly needed to keep the game going. Each loan finances production, and each production drives the energy wheel: energy and materials in, heat and waste out. When credit speeds up to sustain growth, physical throughput speeds up with it. Couppey-Soubeyran, Delandre and Sersiron (2024) see in this an <b>addiction to growth<\/b> that takes the economy away from resilience.\",\n s2t:\"What debt-money finances\",\n s2d:\"A bank creates money if it expects to be repaid. For each project, would a bank readily finance it on credit?\",\n sc:\"Correct answers: \",sol:\"Show the answers\",\n yes:\"Yes, it is profitable\",no:\"Hardly\",\n ok:\"Correct.\",ko:\"Not quite.\",\n pr:[\"A logistics warehouse leased to a large retailer\",\"A solar plant with a guaranteed feed-in tariff\",\"Thermal renovation of low-income households' homes\",\"Restoring a wetland that protects against floods\",\"A network of cycle lanes\",\"Extending a shopping centre's car park\"],\n ex:[\"Rents provide steady revenue: repayment is almost guaranteed.\",\"The guaranteed tariff makes revenue predictable: that is what makes this kind of project bankable.\",\"Energy savings benefit occupants, often not very creditworthy, and pay back slowly: without public support, credit hardly follows.\",\"The benefit, avoiding floods, is real but collective: it generates no revenue to repay a loan.\",\"No direct revenue: such networks are financed by taxes, not by bank credit.\",\"The car park attracts customers and therefore turnover: the project is profitable for its owner.\"],\n b2:\"<b>Debt-money follows profitability, not usefulness.<\/b> Profitable projects find their credit; many ecological and social investments, useful but without revenue, fall to public budgets, or do not happen.\",\n s3t:\"A voluntary money?\",\n s3d:\"Couppey-Soubeyran, Delandre and Sersiron propose supplementing bank money with money created without debt, reserved for the investments the transition requires.\",\n th:[\"\",\"Bank debt-money\",\"Voluntary money (proposal)\"],\n rows:[\n  [\"Who creates it\",\"Banks, by granting loans\",\"The central bank, on the decision of an issuing institute\"],\n  [\"Counterpart\",\"A debt to be repaid\",\"No debt: a “contribution to sustainable development missions”\"],\n  [\"What it finances\",\"Projects able to repay\",\"Necessary but unprofitable investments, mainly through subsidies\"],\n  [\"Who chooses\",\"The bank, based on creditworthiness\",\"A governance body bringing together firms, public services, associations and local authorities\"],\n  [\"How it disappears\",\"When the loan is repaid\",\"Through levies, notably on the extraction of non-renewable resources\"]\n ],\n q3:\"“Let us imagine it being supplemented by a voluntary money, created outside any debt […] financing unprofitable investments that are nevertheless necessary for sustainable development.”\",\n b3:\"<b>A debated proposal.<\/b> Its authors see it as one of the pillars of a paradigm shift. Its critics, such as Jean-Marie Harribey in his review, see it mainly as earmarked public spending under another name, and find the status of the issuing institute and its fit with existing institutions unclear.\",\n refsT:\"References\",\n s4t:\"The state can also finance the transition\",\n s4d:\"We add a fourth pole to the circuit, <b>A<\/b>, general government. Like firms, it can spend before it has collected: its deficit is financed by money creation directed to the public sector. Step through flow by flow with the buttons or the ← → arrow keys.\",\n prev:\"← Previous\",next:\"Next →\",\n aS:[\"The poles\",\"Credit to firms\",\"Public deficit\",\"Private investment\",\"Public investment\",\"Incomes\",\"Consumption\",\"Saving\",\"Reservoirs\"],\n aP:{B:[\"B\",\"Banks\"],A:[\"A\",\"Government\"],E:[\"E\",\"Firms\"],M:[\"M\",\"Households\"]},\n aF:[[\"net financing\",\"20\"],[\"deficit financing\",\"20\"],[\"investment\",\"I = 20\"],[\"public procurement\",\"G = 20\"],[\"incomes\",\"Y = W + P = 120\"],[\"consumption\",\"C = 80\"],[\"net saving\",\"S = 40\"]],\n aT:[\n  {t:\"Four poles\",p:[\"Pole <b>A<\/b> brings together the state, local authorities and social security bodies. For simplicity, taxes are left aside: the whole deficit finances transition investments.\",\"We keep the figures of the three-pole circuit and add public spending to them.\"]},\n  {t:\"Credit to firms\",p:[\"As before, banks grant <b>20<\/b> of net financing to firms, for projects they judge profitable.\"]},\n  {t:\"Financing the deficit\",p:[\"Banks buy <b>20<\/b> of government securities: they create the deposits the state will spend. This is <b>money creation directed to the public sector<\/b>.\",\"In the euro area, the central bank cannot lend directly to governments (Article 123 of the Treaty on the Functioning of the European Union): banks buy the securities, and the central bank may then buy them back on the secondary market.\"]},\n  {t:\"Private investment\",p:[\"Firms buy 20 of equipment from other firms. This flow stays inside pole E.\"]},\n  {t:\"Public transition investment\",p:[\"The state orders <b>20<\/b> of investments that bank credit finances poorly: thermal renovation of low-income homes, wetland restoration, cycle lanes. The firms that carry them out are paid by public spending.\",\"These projects bring no revenue to the state that pays for them, but they get done: the deficit did what profitability did not allow.\"]},\n  {t:\"Incomes\",p:[\"Production distributes <b>Y = W + P = 120<\/b> of incomes. This is the period's value added: 80 of consumer goods, 20 of private investment and 20 of public investment.\",\"Public spending has raised output and incomes by 20.\"]},\n  {t:\"Consumption\",p:[\"Households spend <b>80<\/b> on consumer goods: money returns to pole E.\"]},\n  {t:\"Net saving closes the circuit\",p:[\"Households save <b>S = Y − C = 40<\/b>, as deposits or securities. The circuit is closed: each pole receives as much as it pays out.\"]},\n  {t:\"The reservoirs\",p:[\"The state has borrowed 20 and holds 20 of public transition equipment. Firms have borrowed 20 and hold 20 of equipment. Households hold 40 of financial assets.\",\"Private saving equals private investment plus the public deficit: <b>S = I + (G − T)<\/b>, that is 40 = 20 + 20. The deficit does not deprive the private sector of saving: it is its counterpart.\"]}\n ],\n aLth:[\"Pole\",\"Inflows\",\"Outflows\",\"Balance\"],\n aRes:{B:[\"Banks\",\"loans +20 and government securities +20 in assets, deposits +40 in liabilities\"],A:[\"Government\",\"public debt +20, transition equipment +20\"],E:[\"Firms\",\"debt +20, equipment +20\"],M:[\"Households\",\"financial assets +40 (deposits or securities)\"]},\n sqT:\"Four-pole circuit: banks, government, firms, households\",\n b4:\"<b>Another route than voluntary money: the public deficit.<\/b> It exists within current institutions and makes it possible to finance unprofitable investments today. It remains a debt, subject to European fiscal rules and to markets' judgement of government securities. In both cases, the ultimate constraint is real: the labour, energy and materials these investments mobilise.\",\n lesson:\"<b>Money turns the energy wheel.<\/b> With debt-money, the game goes on only if credit flows, and credit goes first to profitable projects. Reforming money means questioning both the pace of the monetary wheel and what it finances.\"\n}};\n\n/* ================= section 1 : le flipper ================= */\nvar cv=$(\"cv\"),ctx=cv.getContext(\"2d\"),W=560,H=460,dpr=Math.min(2,window.devicePixelRatio||1);\ncv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);\nfunction css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||\"#888\";}\nvar C={};function readColors(){[\"--ink\",\"--muted\",\"--faint\",\"--line\",\"--surface\",\"--panel\",\"--econ\",\"--eco\",\"--rms\",\"--warn\",\"--grid\"].forEach(function(k){C[k]=css(k);});}\n/* géométrie */\nvar BUMP={prod:[300,150,30],inc:[420,235,26],cons:[300,300,26]};\nvar WM=[90,120,46],WE=[90,330,60];\nvar PATH=[[520,430],[520,70],[500,40],[440,30],[360,60],[BUMP.prod[0]+18,BUMP.prod[1]-22],[BUMP.inc[0]-20,BUMP.inc[1]-14],[BUMP.cons[0]+20,BUMP.cons[1]-18],[300,360],[300,438]];\nvar PL=[0];for(var i=1;i<PATH.length;i++){var dx=PATH[i][0]-PATH[i-1][0],dy=PATH[i][1]-PATH[i-1][1];PL.push(PL[i-1]+Math.sqrt(dx*dx+dy*dy));}\nvar TOT=PL[PL.length-1],HIT={prod:PL[5],inc:PL[6],cons:PL[7]};\nvar SPEED=150; /* px/s : une bille vit environ 6 s */\nfunction posAt(s){for(var i=1;i<PL.length;i++){if(s<=PL[i]){var t=(s-PL[i-1])/(PL[i]-PL[i-1]);return [PATH[i-1][0]+(PATH[i][0]-PATH[i-1][0])*t,PATH[i-1][1]+(PATH[i][1]-PATH[i-1][1])*t];}}return PATH[PATH.length-1];}\nvar balls=[],parts=[],glow={prod:0,inc:0,cons:0,drain:0,launch:0};\nvar mode=1,rate=1.2,acc=0,running=true,PERIOD=1.5,ptime=0,credP=0,enP=0,hist=[],CAP=40,capped=false;\nvar angM=0,angE=0,spM=0,spE=0,sm=1.2;\nfunction launch(){if(balls.length>=CAP){capped=true;return;}balls.push({s:0,j:(Math.random()-.5)*14,hit:{}});glow.launch=1;credP++;}\nfunction step(dt){\n  /* lancements selon le régime */\n  if(mode>0){acc+=rate*dt/PERIOD;while(acc>=1){acc-=1;launch();}}\n  balls.forEach(function(b){b.s+=SPEED*dt;\n    [\"prod\",\"inc\",\"cons\"].forEach(function(k)       case 'mappemonde':  return S+'<circle cx="12" cy="12" r="8.6" stroke="'+a+'"/><path d="M12 3.4c3.1 3 3.1 14.2 0 17.2M12 3.4c-3.1 3-3.1 14.2 0 17.2"/><path d="M3.7 9.3h16.6M3.7 14.7h16.6"/></svg>';
      /* silhouette réelle de la courbe de l'éléphant : bosse, creux, trompe */
      case 'elephant':    return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17.5C6.6 17.5 7.2 10 9.6 10S12.6 15.2 15.4 15.2C17.4 15.2 18.2 9.5 20 4.6" stroke="'+a+'"/></svg>';
      case 'convergence': return S+'<path d="M3.2 5.5h4.4M3.2 12h4.4M3.2 18.5h4.4"/><path d="M7.6 5.5C12.8 5.5 12.8 12 16.2 12" stroke="'+a+'"/><path d="M7.6 12h8.6" stroke="'+a+'"/><path d="M7.6 18.5C12.8 18.5 12.8 12 16.2 12" stroke="'+a+'"/><circle cx="18.4" cy="12" r="2.1" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'distribution':return S+'<path d="M3 20h18"/><path d="M5.5 20v-3.2M8.5 20v-9M11.5 20v-6M14.5 20v-3.4M17.5 20v-1.8"/><path d="M12.8 4.5V20" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'lorenz':      return S+'<path d="M4 20h16M4 20V4"/><path d="M4 20L20 4" stroke-dasharray="2.5 2" opacity=".55"/><path d="M4 20C11 20 16.5 15 20 4" stroke="'+a+'"/></svg>';
      /* plusieurs séries superposées, pilotées par un même sélecteur */
      case 'series':      return S+'<path d="M4 20h16M4 20V4"/><path d="M6 14.5l3.4-3.4 3.4 3.4 3.4-6.6 2.6 2.4" stroke="'+a+'"/><path d="M6 17.8c3.4-.6 6.2 1 12-2.6" opacity=".45"/><circle cx="9.4" cy="11.1" r="1.25" fill="'+a+'" stroke="none"/><circle cx="16.2" cy="7.9" r="1.25" fill="'+a+'" stroke="none"/></svg>';
      case 'croisement':  return S+'<path d="M4 20h16M4 20V4"/><path d="M6 17.5L19 7" stroke="'+a+'" stroke-dasharray="3 2"/><circle cx="8.5" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="13.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="10.5" r="1.2" fill="'+a+'" stroke="none"/><circle cx="18" cy="8" r="1.2" fill="'+a+'" stroke="none"/></svg>';
      case 'voile':       return S+'<path d="M2.6 12S6 6.8 12 6.8 21.4 12 21.4 12 18 17.2 12 17.2 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="2.5" stroke="'+a+'"/><path d="M4.5 19.5L19.5 4.5" stroke="'+a+'"/></svg>';
      case 'course':      return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17C9 17 13 13.5 20 5.5" stroke="'+a+'"/><path d="M4.5 17C9 17 13 15.5 20 13.5"/></svg>';
      case 'ratio':       return S+'<path d="M3 20h18"/><rect x="5.5" y="4.5" width="4.6" height="15.5" rx="1.2" stroke="'+a+'"/><rect x="13.9" y="15" width="4.6" height="5" rx="1.2"/></svg>';
      case 'ecart':       return S+'<path d="M3 20h18"/><path d="M4 7h16" stroke="'+a+'"/><path d="M4 12.6C9 12.6 13.5 16 20 17"/><path d="M12 7.6v6.9" stroke="var(--faint)"/><path d="M12 7.6l-1.5 1.7M12 7.6l1.5 1.7M12 14.5l-1.5-1.7M12 14.5l1.5-1.7" stroke="var(--faint)"/></svg>';
    }
    return S+'<circle cx="12" cy="12" r="8" stroke="'+a+'"/></svg>';
  }

  /* ───────── état ───────── */
  var LANG = CFG.langue_defaut || 'fr';
  try{ var sl=localStorage.getItem(PREFIXE+'_lang'); if(sl) LANG=sl; }catch(e){}
  var THEME=null;
  try{ var st=localStorage.getItem(PREFIXE+'_theme'); if(st) THEME=st; }catch(e){}
  if(!THEME) THEME = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', THEME);

  function T(){ return CFG.textes[LANG]; }

  function seed(){
    for(var i=0;i<N;i++){
      try{
        localStorage.setItem(STEPS[i].cle+'_theme', THEME);
        localStorage.setItem(STEPS[i].cle+'_lang',  LANG);
      }catch(e){}
    }
    try{ localStorage.setItem(PREFIXE+'_theme',THEME); localStorage.setItem(PREFIXE+'_lang',LANG); }catch(e){}
  }

  /* ───────── le fil ───────── */
  function carte(i){
    var d=T(), s=STEPS[i];
    var a=document.createElement('a');
    a.className='card'; a.href='#/'+(i+1);
    a.innerHTML='<span class="emb" style="color:'+tok(s.couleur)+'">'+emb(s.icone,s.couleur)+'</span>'+
      '<span class="cbody"><span class="idx">'+(i+1)+'</span>'+
      '<h3>'+d.cartes[i].titre+'</h3><p>'+d.cartes[i].resume+'</p>'+
      '<span class="go">'+d.nav_ouvrir+' →</span></span>';
    return a;
  }

  /* Une partie sans numéro est un seuil : elle ouvre la séance sans être
     comptée dans les parties. Le fil l'annonce par une étiquette, le bandeau
     par un repère discret placé avant les chiffres romains. */
  function estSeuil(p){ var P=PARTIES[p-1]; return !!P.seuil || !P.numero; }
  function marque(p){ return estSeuil(p) ? '◦' : PARTIES[p-1].numero; }
  function etiquette(p){
    var e=T().parties[p-1].etiquette;
    return e || (LANG==='en' ? 'Opening' : 'Ouverture');
  }

  function buildFil(){
    var d=T(), box=document.getElementById('parties');
    box.innerHTML='';
    for(var p=1;p<=NP;p++){
      var sec=document.createElement('section');
      sec.className='part'+(estSeuil(p)?' seuil':'');
      sec.style.setProperty('--pc', tok(PARTIES[p-1].couleur));
      var rang = estSeuil(p)
        ? '<span class="sn">'+etiquette(p)+'</span>'
        : '<span class="rn">'+PARTIES[p-1].numero+'</span>';
      var h='<div class="parthead">'+rang+
            '<h2>'+d.parties[p-1].titre+'</h2></div>'+
            '<p class="partlead">'+d.parties[p-1].chapo+'</p>'+
            '<div class="cards"></div>';
      sec.innerHTML=h;
      var grille=sec.querySelector('.cards');
      for(var i=0;i<N;i++) if(STEPS[i].partie===p) grille.appendChild(carte(i));
      box.appendChild(sec);
    }
  }

  /* ───────── bandeau de situation ───────── */
  function premierDe(p){ for(var j=0;j<N;j++) if(STEPS[j].partie===p) return j; return 0; }

  function buildNav(i){
    var d=T(), s=STEPS[i], cur=null,
        bar=document.getElementById('nparts'), box=document.getElementById('steps');
    document.documentElement.style.setProperty('--acc', tok(PARTIES[s.partie-1].couleur));
    document.getElementById('ncount').textContent=(i+1)+' / '+N;

    bar.innerHTML='';
    for(var p=1;p<=NP;p++){
      if(p===s.partie){
        var c=document.createElement('span');
        c.className='pcur';
        c.innerHTML='<em>'+marque(p)+'</em><span>'+d.parties[p-1].titre+'</span>';
        c.setAttribute('aria-current','true');
        bar.appendChild(c);
      } else {
        var g=document.createElement('a');
        g.className='pgrp';
        g.href='#/'+(premierDe(p)+1);
        g.title=(estSeuil(p)?etiquette(p):PARTIES[p-1].numero)+' · '+d.parties[p-1].titre;
        g.textContent=marque(p);
        bar.appendChild(g);
      }
    }

    box.innerHTML='';
    for(var j=0;j<N;j++){
      if(STEPS[j].partie!==s.partie) continue;
      var a=document.createElement('a');
      a.className='stp'+(j===i?' on':'');
      a.href='#/'+(j+1);
      a.title=d.cartes[j].titre;
      a.innerHTML='<em>'+(j+1)+'</em><span>'+d.cartes[j].titre+'</span>';
      if(j===i){ a.setAttribute('aria-current','true'); cur=a; }
      box.appendChild(a);
    }
    /* le bandeau peut être encore masqué : on attend une frame pour mesurer */
    if(cur) requestAnimationFrame(function(){
      box.scrollLeft = Math.max(0, cur.offsetLeft - (box.clientWidth - cur.offsetWidth)/2);
    });
  }

  /* ───────── iframes ───────── */
  var host=document.getElementById('host'), frames={}, current=-1;

  /* Une iframe capte le clavier dès qu'on a cliqué dedans, et la coquille ne
     voit plus rien. On y relaie donc Échap et F — et seulement eux : les
     flèches appartiennent aux outils, qui s'en servent pour leurs propres
     étapes. Les iframes srcdoc héritent de notre origine, d'où l'accès. */
  function brancherClavier(fr){
    try{
      var doc=fr.contentDocument; if(!doc) return;
      doc.addEventListener('keydown', function(ev){
        if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
        if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
        else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
      });
    }catch(e){}
  }

  function syncFrame(fr){
    if(!fr) return;
    try{
      var doc=fr.contentDocument;
      if(!doc || !doc.documentElement) return;
      for(var n=0;n<2;n++){
        if(doc.documentElement.getAttribute('data-theme')===THEME) break;
        var tb=doc.getElementById('theme'); if(!tb) break; tb.click();
      }
      for(var m=0;m<2;m++){
        if((doc.documentElement.lang||'fr')===LANG) break;
        var lb=doc.getElementById('lang'); if(!lb) break; lb.click();
      }
    }catch(e){}
  }

  function showTool(i){
    var s=STEPS[i], d=T();
    document.body.classList.add('mode-tool');
    seed();
    if(!frames[s.fichier]){
      var fr=document.createElement('iframe');
      fr.setAttribute('title', d.cartes[i].titre);
      host.appendChild(fr);
      frames[s.fichier]=fr;
      fr.addEventListener('load', function(){ syncFrame(fr); brancherClavier(fr); });
      fr.srcdoc = TOOLS[s.fichier];
    } else {
      syncFrame(frames[s.fichier]);
    }
    for(var k in frames) frames[k].style.display = (k===s.fichier) ? 'block' : 'none';
    if(plein) montrerNav(1600);
    current=i;
    buildNav(i);
    var pb=document.getElementById('prev'), nb=document.getElementById('next');
    pb.disabled=(i===0); nb.disabled=(i===N-1);
    pb.title=d.nav_prec; nb.title=d.nav_suiv;
  }

  function showFil(){
    if(plein) setPlein(false);
    document.body.classList.remove('mode-tool');
    current=-1;
    window.scrollTo(0, window.__filScroll||0);
  }

  /* ───────── plein écran ───────── */
  var plein=false, minuterieNav=null, minuterieAstuce=null;

  function montrerNav(delaiMasquage){
    document.body.classList.add('nav-on');
    clearTimeout(minuterieNav);
    if(delaiMasquage) minuterieNav=setTimeout(function(){
      document.body.classList.remove('nav-on');
    }, delaiMasquage);
  }

  function demanderPleinEcran(){
    var el=document.documentElement;
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(f){ try{ var p=f.call(el); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }
  function quitterPleinEcran(){
    var actif=document.fullscreenElement||document.webkitFullscreenElement;
    if(!actif) return;
    var f=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(f){ try{ var p=f.call(document); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }

  function setPlein(v){
    if(plein===v) return;
    plein=v;
    document.body.classList.toggle('mode-plein', v);
    var b=document.getElementById('tplein'), d=T();
    b.textContent = v ? '⤡' : '⤢';
    b.title = v ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    if(v){
      demanderPleinEcran();
      montrerNav(2400);
      document.getElementById('pastille').textContent =
        (d.nav_plein_astuce||'Approchez du haut pour revoir la barre · Échap pour sortir');
      document.body.classList.add('astuce');
      clearTimeout(minuterieAstuce);
      /* l'astuce doit rester lisible après le retrait du bandeau, pas pendant */
      minuterieAstuce=setTimeout(function(){ document.body.classList.remove('astuce'); }, 6500);
    } else {
      quitterPleinEcran();
      clearTimeout(minuterieNav); clearTimeout(minuterieAstuce);
      document.body.classList.remove('nav-on','astuce');
    }
  }

  document.getElementById('tplein').addEventListener('click', function(){ setPlein(!plein); });
  document.getElementById('hotzone').addEventListener('mouseenter', function(){ montrerNav(0); });
  document.querySelector('.nav').addEventListener('mouseleave', function(){ if(plein) montrerNav(500); });
  /* Sortie par F11 ou par la touche Échap interceptée par le navigateur :
     on resynchronise la coquille sur l'état réel. */
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement||document.webkitFullscreenElement) && plein) setPlein(false);
    });
  });

  function route(){
    var h=(location.hash||'').replace(/^#\/?/,'');
    var n=parseInt(h,10);
    if(h && !isNaN(n) && n>=1 && n<=N){
      if(current===-1) window.__filScroll = window.pageYOffset||0;
      showTool(n-1);
    } else {
      showFil();
    }
  }
  window.addEventListener('hashchange', route);

  function go(i){
    if(i<0){ location.hash='#/fil'; return; }
    if(i>N-1) return;
    location.hash='#/'+(i+1);
  }
  document.getElementById('prev').addEventListener('click', function(){ if(current>0) go(current-1); });
  document.getElementById('next').addEventListener('click', function(){ if(current>-1 && current<N-1) go(current+1); });

  document.addEventListener('keydown', function(ev){
    if(current===-1) return;
    if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
    else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
    else if(ev.key==='ArrowLeft'  && current>0)   { go(current-1); }
    else if(ev.key==='ArrowRight' && current<N-1) { go(current+1); }
  });

  /* ───────── bascules ───────── */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', THEME);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleTheme(){ THEME=(THEME==='dark')?'light':'dark'; applyTheme(); }
  document.getElementById('theme').addEventListener('click', toggleTheme);
  document.getElementById('ttheme').addEventListener('click', toggleTheme);

  function applyLang(){
    var d=T();
    document.documentElement.lang=LANG;
    document.title = d.titre_onglet;
    document.getElementById('eyebrow').innerHTML = d.surtitre;
    document.getElementById('titre').textContent = d.titre;
    document.getElementById('seance').textContent = d.seance;
    document.getElementById('chapo').innerHTML = d.chapo;
    document.getElementById('pied').innerHTML = d.pied;
    document.getElementById('licence').innerHTML = d.licence;
    document.getElementById('homelbl').textContent = d.nav_fil;
    /* Remontée vers la page du cours : seulement si le manifeste la déclare.
       Une séance diffusée seule, sans page d'accueil à côté, n'affiche rien
       plutôt qu'un lien qui mènerait à une erreur. */
    var lien = CFG.lien_accueil, rm = document.getElementById('remonte'),
        ab = document.getElementById('accueilbtn');
    if(lien){
      rm.href = lien; ab.href = lien;
      rm.hidden = false; ab.hidden = false;
      document.getElementById('remontelbl').textContent = d.nav_accueil || 'Le cours';
      ab.title = d.nav_accueil || 'Le cours';
    } else {
      rm.hidden = true; ab.hidden = true;
    }
    var bp=document.getElementById('tplein');
    bp.title = plein ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    document.getElementById('langlbl').textContent = LANG.toUpperCase();
    document.getElementById('tlanglbl').textContent = LANG.toUpperCase();
    buildFil();
    if(current>-1) buildNav(current);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleLang(){
    var codes=Object.keys(CFG.textes);
    LANG = codes[(codes.indexOf(LANG)+1) % codes.length];
    applyLang();
  }
  document.getElementById('lang').addEventListener('click', toggleLang);
  document.getElementById('tlang').addEventListener('click', toggleLang);

  /* ───────── démarrage ───────── */
  seed();
  applyLang();
  route();
})();
</script>

</body>
</html>
