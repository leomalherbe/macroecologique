:500;margin:0 0 6px}\nh1{font-family:var(--font-d);font-weight:600;font-size:clamp(27px,4.2vw,40px);line-height:1.06;margin:0;letter-spacing:-.01em;text-wrap:balance}\n.sub{color:var(--muted);font-size:15px;margin:12px 0 0;max-width:74ch;text-wrap:pretty}\nb{color:var(--ink);font-weight:600}\n.toggles{display:flex;gap:8px;flex-shrink:0}\n.tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center}\n.tg:hover{color:var(--ink);border-color:var(--faint)}\nbutton:focus-visible{outline:2px solid var(--econ);outline-offset:2px}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-top:22px;padding:22px}\n@media(max-width:520px){.card{padding:16px}}\n.head{display:flex;align-items:center;gap:11px;flex-wrap:wrap}\n.num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);font-family:var(--font-m);font-size:12.5px;font-weight:600;display:grid;place-items:center}\nh2{font-family:var(--font-d);font-weight:600;font-size:21px;margin:0;letter-spacing:-.01em;text-wrap:balance}\n.desc{color:var(--muted);font-size:14px;margin:8px 0 18px;max-width:84ch;text-wrap:pretty}\n.lab{font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}\n.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}\n.score{font-family:var(--font-m);font-size:13px;color:var(--muted)}\n.score b{font-family:var(--font-d);font-size:20px}\n.btn{font-family:var(--font-b);font-size:13.5px;font-weight:600;border:1px solid var(--ink);background:var(--ink);color:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer}\n.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:500}\n.txs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}\n@media(max-width:860px){.txs{grid-template-columns:minmax(0,1fr)}}\n.tx{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--surface)}\n.tx.done{border-color:color-mix(in srgb,var(--eco) 45%,var(--line))}\n.tx.bad{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}\n.txh{display:flex;gap:10px;align-items:baseline}\n.txh .n{font-family:var(--font-m);font-size:12px;font-weight:600;color:var(--surface);background:var(--ink);border-radius:6px;padding:1px 7px;flex-shrink:0}\n.txh p{margin:0;font-size:14.5px;color:var(--ink);text-wrap:pretty}\n.q{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}\n.q .ql{font-size:12.5px;color:var(--muted);min-width:128px}\n@media(max-width:520px){.q .ql{width:100%}}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}\n.seg button{font-family:var(--font-b);font-size:12.5px;border:none;background:var(--surface);color:var(--muted);padding:6px 10px;cursor:pointer;border-right:1px solid var(--line)}\n.seg button:last-child{border-right:none}\n.seg button:hover{color:var(--ink);background:var(--panel)}\n.seg button.on{background:var(--ink);color:var(--surface);font-weight:600}\n.seg button.on.ok{background:var(--eco);color:#fff}\n.seg button.on.ko{background:var(--warn);color:#fff}\n.fb{font-size:13px;color:var(--muted);background:var(--panel);border-radius:9px;padding:9px 11px;text-wrap:pretty}\n.fb .v{font-weight:600}\n.fb .v.ok{color:var(--eco)} .fb .v.ko{color:var(--warn)}\n.duo{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}\n@media(max-width:900px){.duo{grid-template-columns:minmax(0,1fr)}}\n.duo>*{min-width:0}\n.tabwrap{overflow-x:auto}\n.mx{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}\n.mx th{font-family:var(--font-m);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:500;padding:0 8px 8px;border-bottom:1px solid var(--line);text-align:right}\n.mx th:first-child,.mx td:first-child{text-align:left}\n.mx td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}\n.mx td.z{color:var(--faint)}\n.mx td.sum{color:var(--faint)}\n.mx td.pos{color:var(--econ)} .mx td.neg{color:var(--warn)}\n.mx tr.hid td{color:transparent}\n.mx tr.hid td:first-child{color:var(--faint)}\n.mx tr.tot td{border-top:2px solid var(--ink);border-bottom:none;font-weight:600}\n.mx td.sep{border-left:1px solid var(--line)}\nsvg{display:block;width:100%;height:auto}\nsvg text{font-family:var(--font-b)}\n.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:8px}\n.key span{display:flex;align-items:center;gap:7px}\n.key i{width:18px;height:3px;border-radius:2px;background:var(--c);display:block}\n.box{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--eco));border-radius:12px;padding:12px 16px;font-size:14px;color:var(--muted);text-wrap:pretty;margin-top:16px}\n.lesson{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--eco);border-radius:12px;padding:14px 18px;font-size:14px;color:var(--muted);text-wrap:pretty}\n/* section 3 : circuit de Poulon */\n.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}\n.stepsrow{display:flex;flex-wrap:wrap;gap:8px}\n.stepbtn{font-family:var(--font-b);font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:20px;padding:6px 12px;cursor:pointer;display:flex;gap:7px;align-items:center}\n.stepbtn .n{font-family:var(--font-m);font-size:11px;color:var(--faint)}\n.stepbtn.on{color:var(--ink);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;font-weight:600}\n.stepbtn.on .n{color:var(--ink)}\n.nav{display:flex;gap:8px;margin-left:auto}\n.btn:disabled{opacity:.35;cursor:default}\n.circ{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}\n@media(max-width:880px){.circ{grid-template-columns:minmax(0,1fr)}}\n.circ>*{min-width:0}\nsvg{display:block;width:100%;height:auto}\nsvg text{font-family:var(--font-b)}\n.stxt h3{font-family:var(--font-d);font-weight:600;font-size:17px;margin:0 0 6px}\n.stxt p{margin:0 0 10px;font-size:14px;color:var(--muted);text-wrap:pretty}\n.led{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}\n.led th{font-family:var(--font-m);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:500;padding:0 8px 7px;border-bottom:1px solid var(--line);text-align:right}\n.led th:first-child,.led td:first-child{text-align:left}\n.led td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums;color:var(--ink)}\n.led td:first-child{font-family:var(--font-b);font-weight:600}\n.led td .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}\n.led td.sol.z{color:var(--eco)} .led td.sol.nz{color:var(--warn)}\n.led tr:last-child td{border-bottom:none}\n.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}\n@media(max-width:520px){.res{grid-template-columns:minmax(0,1fr)}}\n.res>div{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:9px 11px;background:var(--panel);font-size:13px;color:var(--muted);min-width:0}\n.res b{display:block;margin-bottom:3px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n.arrow{transition:opacity .4s}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\">\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\"><\/p>\n      <h1 data-t=\"title\"><\/h1>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" type=\"button\" aria-label=\"Langue / Language\">FR/EN <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" type=\"button\" aria-label=\"Thème clair ou sombre\">◐<\/button>\n    <\/div>\n  <\/div>\n  <p class=\"sub\" data-t=\"sub\"><\/p>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">1<\/span><h2 data-t=\"s1t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s1d\"><\/p>\n    <div class=\"bar\">\n      <span class=\"score\" id=\"score\"><\/span>\n      <button class=\"btn ghost\" id=\"solve\" type=\"button\"><\/button>\n      <button class=\"btn ghost\" id=\"reset\" type=\"button\"><\/button>\n    <\/div>\n    <div class=\"txs\" id=\"txs\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">2<\/span><h2 data-t=\"s2t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s2d\"><\/p>\n    <div class=\"tabwrap\"><table class=\"mx\" id=\"mx\"><\/table><\/div>\n    <div class=\"box\" id=\"mxbox\"><\/div>\n    <div class=\"lesson\" data-t=\"lesson\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">3<\/span><h2 data-t=\"s3t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s3d\"><\/p>\n    <div class=\"stepper\">\n      <div class=\"stepsrow\" id=\"cSteps\"><\/div>\n      <div class=\"nav\">\n        <button class=\"btn ghost\" id=\"cPrev\" type=\"button\"><\/button>\n        <button class=\"btn\" id=\"cNext\" type=\"button\"><\/button>\n      <\/div>\n    <\/div>\n    <div class=\"circ\">\n      <div><svg id=\"tri\" viewBox=\"0 0 530 410\" role=\"img\" aria-labelledby=\"triT\"><title id=\"triT\">Circuit<\/title><\/svg><\/div>\n      <div>\n        <div class=\"stxt\" id=\"cTxt\"><\/div>\n        <table class=\"led\" id=\"led\"><\/table>\n        <div class=\"res\" id=\"res\" hidden><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"box\" style=\"--c:var(--econ)\" data-t=\"s3box\"><\/div>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\nvar NS=\"http://www.w3.org/2000/svg\";\nfunction mk(t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}\nfunction $(id){return document.getElementById(id);}\nfunction clear(svg){var ti=svg.querySelector(\"title\");while(svg.lastChild&&svg.lastChild!==ti)svg.removeChild(svg.lastChild);}\nvar P=\"sixt\",LANG=\"fr\";\ntry{var sl=localStorage.getItem(P+\"_lang\");if(sl===\"fr\"||sl===\"en\")LANG=sl;}catch(e){}\ntry{var st=localStorage.getItem(P+\"_theme\");if(st===\"dark\"||st===\"light\")document.documentElement.setAttribute(\"data-theme\",st);}catch(e){}\n\n/* from → to : sens du flux monétaire. m : effet sur la masse monétaire (+1, 0, -1) ; g : effet sur le PIB (1, 0) ; kind : création / destruction / circulation */\nvar TX=[\n {from:\"Y\",to:\"A\",v:20000,m:1,g:0,kind:\"c\"},\n {from:\"A\",to:\"B\",v:8000,m:0,g:1,kind:\"t\"},\n {from:\"A\",to:\"Y\",v:2000,m:-1,g:0,kind:\"d\"},\n {from:\"B\",to:\"Y\",v:5000,m:-1,g:0,kind:\"d\"},\n {from:\"B\",to:\"A\",v:1000,m:0,g:0,kind:\"t\"},\n {from:\"Y\",to:\"B\",v:3000,m:1,g:0,kind:\"c\"}\n];\nvar ans=TX.map(function(){return {m:null,g:null};});\n\nvar T={\nfr:{\n eyebrow:\"Séance 4 · Le circuit monétaire\",\n title:\"La théorie du circuit monétaire\",\n sub:\"La théorie du circuit monétaire décrit l'économie comme un <b>réseau de bilans<\/b> reliés par la monnaie. Sa matière est celle de l'analyse financière d'entreprise : des flux de paiement. Mais là où un directeur financier ne suit que son entreprise, le circuit suit les flux de tous les agents à la fois. On part de six opérations entre deux entreprises et une banque.\",\n s1t:\"Classer chaque transaction\",\n s1d:\"Pour chaque opération, deux questions : modifie-t-elle la <b>masse monétaire<\/b> (le total des dépôts) ? Modifie-t-elle le <b>PIB<\/b> (la somme des valeurs ajoutées) ? La correction s'affiche dès que les deux réponses sont données ; on peut changer d'avis.\",\n score:\"Réponses justes : \",solve:\"Montrer toute la correction\",reset:\"Recommencer\",\n txt:[\"La banque Y prête 20 000 à l'entreprise A.\",\"L'entreprise A achète 8 000 de biens d'équipement à l'entreprise B.\",\"L'entreprise A rembourse 2 000 à la banque Y.\",\"L'entreprise B rembourse 5 000 à la banque Y.\",\"L'entreprise B rembourse à l'entreprise A un crédit commercial de 1 000.\",\"La banque Y prête 3 000 à l'entreprise B.\"],\n qM:\"Masse monétaire\",qG:\"PIB\",\n oM:[\"Augmente\",\"Inchangée\",\"Diminue\"],oG:[\"Augmente\",\"Inchangé\"],\n ok:\"Juste.\",ko:\"Pas tout à fait.\",\n ex:[\n  \"En accordant le crédit, la banque crée 20 000 de dépôts sur le compte de A : la masse monétaire augmente de 20 000. Aucune valeur ajoutée n'est créée : le PIB ne bouge pas.\",\n  \"Les dépôts passent de A à B : la monnaie change de mains, sa quantité ne change pas. En revanche, B a produit des biens d'équipement vendus à A. Ce sont des biens finals : A les achète pour s'en servir, pas pour les transformer. Leur valeur, 8 000, est la somme des valeurs ajoutées de toute la filière qui les a produits, B et ses éventuels fournisseurs : le PIB augmente de 8 000.\",\n  \"Le remboursement annule à la fois une partie du prêt et une partie des dépôts de A : 2 000 de monnaie sont détruits. Aucune valeur ajoutée : le PIB ne change pas.\",\n  \"Même mécanisme : B rembourse la banque, 5 000 de dépôts disparaissent avec la dette correspondante. Le PIB ne change pas.\",\n  \"Un crédit commercial est une dette entre entreprises, pas une création monétaire. Son remboursement fait passer 1 000 de dépôts de B à A : la masse monétaire ne change pas, le PIB non plus.\",\n  \"Comme pour A, la banque crée les dépôts qu'elle prête : la masse monétaire augmente de 3 000. Aucune valeur ajoutée : le PIB ne change pas.\"\n ],\n s2t:\"La matrice des transactions\",\n s2d:\"Chaque transaction remplit une ligne de la matrice : ce qu'un agent reçoit est compté en positif, ce qu'il verse en négatif. Les lignes apparaissent au fur et à mesure de vos réponses.\",\n th:[\"Transaction\",\"Entreprise A\",\"Entreprise B\",\"Banque Y\",\"Somme\",\"Δ monnaie\",\"Δ PIB\"],\n tot:\"Total\",\n boxPart:\"La somme de chaque ligne est <b>nulle<\/b> : tout flux a une origine et une destination. Répondez aux six questions pour voir les soldes de la période.\",\n boxAll:\"Chaque ligne somme à zéro, donc les soldes aussi : A gagne <b>11 000<\/b> de liquidités, B <b>5 000<\/b>, et la banque affiche <b>−16 000<\/b>. Ce solde de la banque est exactement la monnaie créée sur la période (+16 000) : si A et B accumulent des liquidités, c'est que la banque leur a accordé plus de crédits qu'elle n'en a récupéré. À l'échelle du système, rien n'apparaît sans contrepartie. Le PIB, lui, n'a augmenté que de 8 000 : seule la transaction 2 correspond à la production d'un bien final.\",\n s3t:\"Le circuit macroéconomique\",\n s3d:\"On passe des transactions individuelles aux grands flux de l'économie entière. Le circuit relie trois pôles : <b>B<\/b>, le financement (banques et marchés financiers), <b>E<\/b>, la production (entreprises), <b>M<\/b>, la dépense finale (ménages). D'après Poulon (2015). Avancez flux par flux avec les boutons ou les flèches ← →.\",\n prev:\"← Précédent\",next:\"Suivant →\",\n cS:[\"Les pôles\",\"Financement\",\"Investissement\",\"Revenus\",\"Consommation\",\"Épargne\",\"Réservoirs\"],\n poles:{B:[\"B\",\"Banques\",\"financement\"],E:[\"E\",\"Entreprises\",\"production\"],M:[\"M\",\"Ménages\",\"dépense finale\"]},\n fl:[[\"financement net\",\"20\"],[\"investissement\",\"I = 20\"],[\"revenus\",\"Y = W + P = 100\"],[\"consommation\",\"C = 80\"],[\"épargne nette\",\"S = 20\"]],\n cT:[\n  {t:\"Trois pôles, trois fonctions\",p:[\"Les pôles sont des <b>fonctions<\/b> plutôt que des groupes de personnes : un même individu peut être salarié, épargnant et actionnaire, et passer ainsi par plusieurs pôles.\",\"Pour chaque pôle, un flux entrant est une ressource, un flux sortant un emploi. Le tableau ci-dessous tient les comptes de chaque pôle au fil des étapes.\"]},\n  {t:\"Ouverture : le financement net\",p:[\"Le circuit s'ouvre au pôle B : les banques accordent des crédits aux entreprises. Le <b>financement net<\/b>, crédits nouveaux moins remboursements, s'élève à 20 sur la période. C'est le robinet de la baignoire monétaire.\",\"Les flux qui suivent sont bien plus gros que ce financement net : ils sont payés avec une monnaie qui circule. Seul le net s'inscrit durablement dans les bilans.\"]},\n  {t:\"L'investissement\",p:[\"Les entreprises achètent pour 20 d'équipements à d'autres entreprises. Ce flux reste à l'intérieur du pôle E : ce que l'une dépense, une autre l'encaisse.\",\"Le solde du pôle E ne change pas, mais la dépense d'investissement compte bien dans la demande finale.\"]},\n  {t:\"Les revenus\",p:[\"La production distribue des revenus aux ménages : salaires et profits distribués, <b>Y = W + P = 100<\/b>. C'est la valeur ajoutée de la période, égale à la valeur des biens finals produits : biens de consommation et biens d'équipement. Les achats de biens intermédiaires entre entreprises n'y entrent pas.\",\"On suppose ici que les profits sont entièrement distribués. D'où viennent-ils ? C'est ce qu'explique le modèle de Graziani. À ce stade, le pôle E a versé bien plus qu'il n'a reçu : le circuit n'est pas encore refermé.\"]},\n  {t:\"La consommation finale\",p:[\"Les ménages dépensent <b>80<\/b> en biens de consommation : la monnaie revient au pôle E.\",\"Le pôle E n'a pas récupéré tout ce qu'il a versé : il manque 20, la part du revenu que les ménages n'ont pas dépensée.\"]},\n  {t:\"L'épargne nette ferme le circuit\",p:[\"Les 20 non dépensés forment l'<b>épargne nette<\/b> des ménages : <b>S = Y − C = 20<\/b>. Elle part vers le pôle B, sous forme de dépôts ou de titres.\",\"Le circuit est bouclé : chaque pôle reçoit exactement autant qu'il verse. Au niveau macroéconomique, la somme des flux entrants égale la somme des flux sortants.\"]},\n  {t:\"Les réservoirs : épargne et dette\",p:[\"Chaque pôle garde la mémoire de ses flux dans son bilan, son <b>réservoir<\/b>. Les entreprises ont reçu 20 de financement net : leur dette augmente de 20. Les ménages ont épargné 20 : leurs actifs financiers augmentent de 20.\",\"On retrouve <b>I = S = 20<\/b> : l'épargne nette des ménages est la contrepartie exacte de la dette des entreprises. Aucune épargne nette n'apparaît au pôle récepteur sans un déficit, ou une dette, au pôle émetteur.\"]}\n ],\n lth:[\"Pôle\",\"Entrées\",\"Sorties\",\"Solde\"],\n res:{B:[\"Banques\",\"prêts +20 à l'actif, dépôts +20 au passif\"],E:[\"Entreprises\",\"dette +20, équipements +20\"],M:[\"Ménages\",\"actifs financiers +20 (dépôts ou titres)\"]},\n triT:\"Circuit macroéconomique à trois pôles : banques, entreprises, ménages\",\n s3box:\"<b>La dette fait tourner le circuit.<\/b> La dépense et la dette ne sont pas des facteurs de désordre : ce sont ses moteurs. Une dette ne réduit pas la richesse, puisqu'elle la fait naître : sans le financement net de 20, ni l'investissement, ni l'épargne correspondante n'auraient existé.\",\n lesson:\"<b>Trois sortes de flux, trois effets.<\/b> Un crédit bancaire <b>crée<\/b> la monnaie, un remboursement à la banque la <b>détruit<\/b>, un paiement entre agents non bancaires la fait <b>circuler<\/b> sans en changer la quantité. Le PIB mesure la valeur ajoutée, égale à la valeur des biens finals : ni un crédit ni un remboursement n'en créent. La monnaie tourne, se crée et se détruit en permanence : l'équilibre de circuit est dynamique, et non un état statique.\"\n},\nen:{\n eyebrow:\"Session 4 · The monetary circuit\",\n title:\"Monetary circuit theory\",\n sub:\"Monetary circuit theory describes the economy as a <b>network of balance sheets<\/b> linked by money. Its material is the same as corporate financial analysis: payment flows. But where a CFO follows only their own firm, the circuit follows the flows of every agent at once. We start from six operations between two firms and a bank.\",\n s1t:\"Classify each transaction\",\n s1d:\"For each operation, two questions: does it change the <b>money supply<\/b> (total deposits)? Does it change <b>GDP<\/b> (the sum of value added)? The answer appears as soon as both questions are answered; you can change your mind.\",\n score:\"Correct answers: \",solve:\"Show all answers\",reset:\"Start again\",\n txt:[\"Bank Y lends 20,000 to firm A.\",\"Firm A buys 8,000 of capital goods from firm B.\",\"Firm A repays 2,000 to bank Y.\",\"Firm B repays 5,000 to bank Y.\",\"Firm B repays a trade credit of 1,000 to firm A.\",\"Bank Y lends 3,000 to firm B.\"],\n qM:\"Money supply\",qG:\"GDP\",\n oM:[\"Rises\",\"Unchanged\",\"Falls\"],oG:[\"Rises\",\"Unchanged\"],\n ok:\"Correct.\",ko:\"Not quite.\",\n ex:[\n  \"By granting the loan, the bank creates 20,000 of deposits in A's account: the money supply rises by 20,000. No value added is created: GDP does not move.\",\n  \"Deposits pass from A to B: money changes hands, its quantity does not change. But B has produced capital goods sold to A. These are final goods: A buys them to use them, not to transform them. Their value, 8,000, is the sum of the value added by the whole chain that produced them, B and any suppliers: GDP rises by 8,000.\",\n  \"Repayment cancels part of the loan and part of A's deposits at the same time: 2,000 of money is destroyed. No value added: GDP does not change.\",\n  \"Same mechanism: B repays the bank, and 5,000 of deposits disappear along with the matching debt. GDP does not change.\",\n  \"A trade credit is a debt between firms, not money creation. Repaying it moves 1,000 of deposits from B to A: neither the money supply nor GDP changes.\",\n  \"As with A, the bank creates the deposits it lends: the money supply rises by 3,000. No value added: GDP does not change.\"\n ],\n s2t:\"The transaction matrix\",\n s2d:\"Each transaction fills a row of the matrix: what an agent receives counts as positive, what it pays out as negative. Rows appear as you answer.\",\n th:[\"Transaction\",\"Firm A\",\"Firm B\",\"Bank Y\",\"Sum\",\"Δ money\",\"Δ GDP\"],\n tot:\"Total\",\n boxPart:\"Each row sums to <b>zero<\/b>: every flow has an origin and a destination. Answer all six questions to see the balances for the period.\",\n boxAll:\"Every row sums to zero, so the balances do too: A gains <b>11,000<\/b> in liquidity, B <b>5,000<\/b>, and the bank shows <b>−16,000<\/b>. The bank's balance is exactly the money created over the period (+16,000): if A and B accumulate liquidity, it is because the bank granted them more loans than it got back. At the level of the system, nothing appears without a counterpart. GDP, meanwhile, rose by only 8,000: only transaction 2 corresponds to the production of a final good.\",\n s3t:\"The macroeconomic circuit\",\n s3d:\"We move from individual transactions to the major flows of the whole economy. The circuit links three poles: <b>B<\/b>, financing (banks and financial markets), <b>E<\/b>, production (firms), <b>M<\/b>, final expenditure (households). After Poulon (2015). Step through flow by flow with the buttons or the ← → arrow keys.\",\n prev:\"← Previous\",next:\"Next →\",\n cS:[\"The poles\",\"Financing\",\"Investment\",\"Incomes\",\"Consumption\",\"Saving\",\"Reservoirs\"],\n poles:{B:[\"B\",\"Banks\",\"financing\"],E:[\"E\",\"Firms\",\"production\"],M:[\"M\",\"Households\",\"final expenditure\"]},\n fl:[[\"net financing\",\"20\"],[\"investment\",\"I = 20\"],[\"incomes\",\"Y = W + P = 100\"],[\"consumption\",\"C = 80\"],[\"net saving\",\"S = 20\"]],\n cT:[\n  {t:\"Three poles, three functions\",p:[\"The poles are <b>functions<\/b> rather than groups of people: the same individual can be an employee, a saver and a shareholder, and so pass through several poles.\",\"For each pole, an inflow is a resource and an outflow a use. The table below keeps each pole's accounts step by step.\"]},\n  {t:\"Opening: net financing\",p:[\"The circuit opens at pole B: banks grant loans to firms. <b>Net financing<\/b>, new loans minus repayments, amounts to 20 over the period. This is the tap of the monetary bathtub.\",\"The flows that follow are much larger than this net financing: they are paid with money that circulates. Only the net amount is recorded lastingly in balance sheets.\"]},\n  {t:\"Investment\",p:[\"Firms buy 20 of equipment from other firms. This flow stays inside pole E: what one spends, another receives.\",\"Pole E's balance does not change, but investment spending does count in final demand.\"]},\n  {t:\"Incomes\",p:[\"Production distributes incomes to households: wages and distributed profits, <b>Y = W + P = 100<\/b>. This is the period's value added, equal to the value of the final goods produced: consumer goods and capital goods. Purchases of intermediate goods between firms are not included.\",\"Here profits are assumed to be fully distributed. Where do they come from? That is what Graziani's model explains. At this stage, pole E has paid out far more than it has received: the circuit is not yet closed.\"]},\n  {t:\"Final consumption\",p:[\"Households spend <b>80<\/b> on consumer goods: money returns to pole E.\",\"Pole E has not recovered everything it paid out: 20 is missing, the part of income households did not spend.\"]},\n  {t:\"Net saving closes the circuit\",p:[\"The 20 not spent form households' <b>net saving<\/b>: <b>S = Y − C = 20<\/b>. It goes to pole B, as deposits or securities.\",\"The circuit is closed: each pole receives exactly as much as it pays out. At the macroeconomic level, the sum of inflows equals the sum of outflows.\"]},\n  {t:\"The reservoirs: saving and debt\",p:[\"Each pole keeps a record of its flows in its balance sheet, its <b>reservoir<\/b>. Firms received 20 of net financing: their debt rises by 20. Households saved 20: their financial assets rise by 20.\",\"We find <b>I = S = 20<\/b> again: households' net saving is the exact counterpart of firms' debt. No net saving appears at the receiving pole without a deficit, or a debt, at the paying pole.\"]}\n ],\n lth:[\"Pole\",\"Inflows\",\"Outflows\",\"Balance\"],\n res:{B:[\"Banks\",\"loans +20 in assets, deposits +20 in liabilities\"],E:[\"Firms\",\"debt +20, equipment +20\"],M:[\"Households\",\"financial assets +20 (deposits or securities)\"]},\n triT:\"Three-pole macroeconomic circuit: banks, firms, households\",\n s3box:\"<b>Debt keeps the circuit turning.<\/b> Spending and debt are not sources of disorder: they are its engines. A debt does not reduce wealth, since it brings it into being: without the net financing of 20, neither the investment nor the matching saving would have existed.\",\n lesson:\"<b>Three kinds of flow, three effects.<\/b> A bank loan <b>creates<\/b> money, a repayment to the bank <b>destroys<\/b> it, a payment between non-bank agents makes it <b>circulate<\/b> without changing its quantity. GDP measures value added, equal to the value of final goods: neither a loan nor a repayment creates any. Money turns, is created and destroyed all the time: the circuit equilibrium is dynamic, not a static state.\"\n}};\nfunction fmt(x){var a=Math.abs(x),s=String(a).replace(/\\B(?=(\\d{3})+(?!\\d))/g,LANG===\"fr\"?\" \":\",\");return (x<0?\"−\":(x>0?\"+\":\"\"))+s;}\nfunction fmtU(x){return String(x).replace(/\\B(?=(\\d{3})+(?!\\d))/g,LANG===\"fr\"?\" \":\",\");}\n\nvar MV=[1,0,-1],GV=[1,0];\nfunction answered(i){return ans[i].m!==null&&ans[i].g!==null;}\nfunction correct(i){return answered(i)&&ans[i].m===TX[i].m&&ans[i].g===TX[i].g;}\n\nfunction drawTx(){\n  var d=T[LANG];\n  $(\"txs\").innerHTML=TX.map(function(tx,i){\n    var a=ans[i],done=answered(i),okM=a.m===tx.m,okG=a.g===tx.g;\n    function seg(q,vals,labels,cur,good){return '<div class=\"seg\" role=\"group\">'+vals.map(function(v,j){var on=cur===v;var cl=on?(\" on\"+(done?(good?\" ok\":\" ko\"):\"\")):\"\";return '<button type=\"button\" class=\"'+cl.trim()+'\" data-i=\"'+i+'\" d solid var(--rms);border-radius:12px;padding:14px 18px;font-size:14px;color:var(--muted);text-wrap:pretty}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\">\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\"><\/p>\n      <h1 data-t=\"title\"><\/h1>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" type=\"button\" aria-label=\"Langue / Language\">FR/EN <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" type=\"button\" aria-label=\"Thème clair ou sombre\">◐<\/button>\n    <\/div>\n  <\/div>\n  <p class=\"sub\" data-t=\"sub\"><\/p>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">1<\/span><h2 data-t=\"s1t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s1d\"><\/p>\n    <div class=\"stepper\">\n      <div class=\"stepsrow\" id=\"steps\"><\/div>\n      <div class=\"nav\">\n        <button class=\"btn ghost\" id=\"prev\" type=\"button\"><\/button>\n        <button class=\"btn\" id=\"next\" type=\"button\"><\/button>\n      <\/div>\n    <\/div>\n    <div class=\"story\">\n      <div class=\"stxt\" id=\"stxt\"><\/div>\n      <div class=\"side\">\n        <div class=\"panelbox\"><svg id=\"tri\" viewBox=\"0 0 440 262\" role=\"img\" aria-labelledby=\"triT\"><title id=\"triT\">Flux<\/title><\/svg><\/div>\n        <div class=\"kpis\" id=\"kpis\"><\/div>\n        <div class=\"panelbox\"><p class=\"lab\" data-t=\"mL\"><\/p><svg id=\"mC\" viewBox=\"0 0 420 120\" role=\"img\" aria-labelledby=\"mT\"><title id=\"mT\">Masse monétaire<\/title><\/svg><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"sheets\" id=\"sheets\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">2<\/span><h2 data-t=\"s2t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s2d\"><\/p>\n    <div class=\"jump\">\n      <div><p class=\"lab\" data-t=\"j1L\"><\/p><svg id=\"j1\" viewBox=\"0 0 460 250\" role=\"img\" aria-labelledby=\"j1T\"><title id=\"j1T\">Monnaie<\/title><\/svg><p data-t=\"j1p\"><\/p><\/div>\n      <div><p class=\"lab\" data-t=\"j2L\"><\/p><svg id=\"j2\" viewBox=\"0 0 460 250\" role=\"img\" aria-labelledby=\"j2T\"><title id=\"j2T\">Valeur<\/title><\/svg><p data-t=\"j2p\"><\/p><\/div>\n    <\/div>\n    <div class=\"lesson\" data-t=\"lesson\"><\/div>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\nvar NS=\"http://www.w3.org/2000/svg\";\nfunction mk(t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}\nfunction $(id){return document.getElementById(id);}\nfunction clear(svg){var ti=svg.querySelector(\"title\");while(svg.lastChild&&svg.lastChild!==ti)svg.removeChild(svg.lastChild);}\nvar P=\"graz\",LANG=\"fr\";\ntry{var sl=localStorage.getItem(P+\"_lang\");if(sl===\"fr\"||sl===\"en\")LANG=sl;}catch(e){}\ntry{var st=localStorage.getItem(P+\"_theme\");if(st===\"dark\"||st===\"light\")document.documentElement.setAttribute(\"data-theme\",st);}catch(e){}\n\n/* Bilans (stocks) à chaque étape. B = banques, E = entreprises, M = ménages.\n   Postes : L prêts, D dépôts, C biens de consommation, I biens d'équipement, E titres (actions). */\nvar SH=[\n {B:{a:{},p:{}},E:{a:{},p:{}},M:{a:{},p:{}}},\n {B:{a:{L:100},p:{D:100}},E:{a:{D:100},p:{L:100}},M:{a:{},p:{}}},\n {B:{a:{L:100},p:{D:100}},E:{a:{D:0,C:70,I:30},p:{L:100}},M:{a:{D:100},p:{}}},\n {B:{a:{L:100},p:{D:100}},E:{a:{D:80,C:0,I:30},p:{L:100}},M:{a:{D:20,C:70},p:{}}},\n {B:{a:{L:100},p:{D:100}},E:{a:{D:90,I:30},p:{L:100,E:10}},M:{a:{D:10,E:10,C:70},p:{}}},\n {B:{a:{L:10},p:{D:10}},E:{a:{D:0,I:30},p:{L:10,E:10}},M:{a:{D:10,E:10,C:70},p:{}}},\n {B:{a:{L:10},p:{D:10}},E:{a:{I:30},p:{L:10,E:10}},M:{a:{D:10,E:10,C:70},p:{}}}\n];\n/* flux de la phase sur le triangle : de, vers, montant */\nvar FLOW=[null,[\"B\",\"E\",100],[\"E\",\"M\",100],[\"M\",\"E\",80],[\"M\",\"E\",10],[\"E\",\"B\",90],null];\nvar COL={B:\"var(--rms)\",E:\"var(--econ)\",M:\"var(--eco)\"};\n\nvar T={\nfr:{\n eyebrow:\"Séance 4 · Le modèle de Graziani (2003)\",\n title:\"Suivre 100 unités monétaires\",\n sub:\"Le modèle de Graziani suit la monnaie dans l'ordre logique du circuit : elle est <b>créée<\/b> par un crédit aux entreprises, <b>circule<\/b> entre les pôles, puis <b>reflue<\/b> vers les banques où elle est détruite. À chaque étape, deux règles tiennent : chaque écriture a sa contrepartie, et la richesse nette lue dans les bilans correspond aux flux passés. On suit 100 unités, avec les paramètres du cours. Le circuit de Poulon supposait les profits distribués : le modèle de Graziani montre <b>d'où ils viennent<\/b>.\",\n s1t:\"Les phases du circuit\",\n s1d:\"Avancez phase par phase avec les boutons ou les flèches ← →. Le triangle montre le flux de la phase entre les pôles <b>B<\/b> (banques), <b>E<\/b> (entreprises) et <b>M<\/b> (ménages) ; les bilans en dessous s'actualisent, les postes modifiés sont surlignés.\",\n prev:\"← Précédent\",next:\"Suivant →\",\n stepsS:[\"Hypothèses\",\"Finance initiale\",\"Production\",\"Dépense\",\"Portefeuille\",\"Reflux\",\"Clôture\"],\n phase:\"Phase\",\n steps:[\n  {ph:\"\",t:\"Les hypothèses\",p:[\"L'économie part de zéro : aucune monnaie n'a été émise auparavant. L'État et le reste du monde sont laissés de côté, les banques et la banque centrale forment un seul pôle, et le taux d'intérêt est nul.\",\"Les entreprises demandent un crédit de 100 et décident de produire 70 de biens de consommation et 30 de biens d'équipement. Les ménages dépensent 80 % de leur revenu ; ils placent la moitié de leur épargne en actions et gardent l'autre moitié en dépôts.\"]},\n  {ph:\"Ouverture du circuit\",t:\"Création monétaire\",p:[\"Les banques accordent 100 de crédit aux entreprises : <b>prêt L = 100<\/b> à l'actif des banques, <b>dépôts D = 100<\/b> à leur passif. Les entreprises inscrivent l'inverse.\",\"Les banques ont le pouvoir de créer la monnaie, mais seulement en réponse à la demande des entreprises. La monnaie existe désormais ; elle ne vaut encore rien tant qu'elle ne circule pas.\"]},\n  {ph:\"Circulation\",t:\"Production\",p:[\"Les entreprises dépensent les 100 de dépôts pour produire. Une partie de ces dépenses va à d'autres entreprises (équipements, matières), mais ces fournisseurs paient à leur tour leurs salariés : à l'échelle de l'économie, les 100 deviennent des <b>salaires<\/b>.\",\"Les entreprises détiennent 70 de biens de consommation et 30 de biens d'équipement, et restent endettées de 100. Les ménages détiennent 100 de dépôts : ils sont devenus créanciers des banques.\"]},\n  {ph:\"Circulation\",t:\"Dépense\",p:[\"Les ménages dépensent 80 % de leur revenu, soit <b>80<\/b>. Ils achètent les biens de consommation, dont la production a coûté 70. Les entreprises encaissent 80 pour des biens qui leur ont coûté 70 : leur <b>marge est de 10<\/b>.\",\"C'est l'<b>origine du profit<\/b> : les entreprises ont versé 100 de revenus, mais n'ont mis en vente que 70 de biens de consommation, le reste étant des équipements qu'elles gardent. Les ménages dépensent 80 pour ces 70 de biens : la marge naît de ce partage de la production, décidé par les entreprises. Les biens de consommation sortent de leurs stocks (C : −70).\"],q:[\"« Les capitalistes gagnent ce qu'ils dépensent, les travailleurs dépensent ce qu'ils gagnent. »\",\"Michał Kalecki\"]},\n  {ph:\"Circulation\",t:\"Choix de portefeuille\",p:[\"Les ménages ont épargné 100 − 80 = 20. Ils en placent la moitié, <b>10<\/b>, en actions émises par les entreprises : les entreprises récupèrent 10 dépôts de plus. L'autre moitié, 10, reste en dépôts : c'est l'épargne <b>thésaurisée<\/b>.\",\"La masse monétaire est toujours de 100 : elle s'est seulement répartie autrement. Avant le reflux, la richesse nette des entreprises est de (90 + 30) − (100 + 10) = <b>10<\/b>, celle des ménages de 10 + 10 + 70 = <b>90<\/b>.\"]},\n  {ph:\"Reflux\",t:\"Remboursement et destruction\",p:[\"Les entreprises détiennent 90 de dépôts : elles remboursent <b>90<\/b> de crédit. Le prêt et les dépôts diminuent de 90 dans le bilan des banques : 90 unités de monnaie sont <b>détruites<\/b>.\",\"Il reste 10 de dette aux entreprises, exactement les 10 de dépôts que les ménages ont gardés.\"]},\n  {ph:\"Clôture du circuit\",t:\"Les bilans finaux\",p:[\"La monnaie a presque entièrement disparu, mais la production est restée : 70 de biens de consommation chez les ménages, 30 de biens d'équipement chez les entreprises. S'y ajoute une épargne financière nouvelle : 10 d'actions et 10 de dépôts.\",\"La richesse nette totale vaut <b>100<\/b> : 90 pour les ménages, 10 pour les entreprises. En achetant des actions, les ménages sont devenus copropriétaires des entreprises et de leurs équipements.\",\"Comparé au circuit de Poulon, le financement net des entreprises (10 de crédit non remboursé et 10 d'actions, soit 20) égale toujours l'épargne des ménages. Mais l'investissement vaut <b>30<\/b>. L'écart de 10 est le <b>profit<\/b> : la part de la valeur ajoutée que les entreprises ne distribuent pas. Le profit est l'<b>épargne des entreprises<\/b>, gardée sous forme d'équipements.\",\"L'épargne totale vaut donc 20 (ménages) + 10 (entreprises) = 30 = I. On retrouve l'identité comptable <b>I = S<\/b> : elle tient toujours, une fois toutes les épargnes comptées, et l'épargne résulte de l'investissement au lieu de le précéder.\"]}\n ],\n params:[[\"Crédit initial\",\"100\"],[\"Production de biens de consommation\",\"70\"],[\"Production de biens d'équipement (30 %)\",\"30\"],[\"Part du revenu consommée\",\"80 %\"],[\"Épargne placée en actions\",\"50 %\"],[\"Épargne gardée en dépôts\",\"50 %\"]],\n varsL:\"Variables :\",vars:[[\"L\",\"prêt\"],[\"D\",\"dépôt\"],[\"C\",\"biens de consommation\"],[\"I\",\"biens d'équipement\"],[\"E\",\"titres\"],[\"NW\",\"richesse nette\"]],\n ag:{B:\"Banques\",E:\"Entreprises\",M:\"Ménages\"},\n asset:\"Actif\",liab:\"Passif\",nw:\"Richesse nette\",none:\"rien\",\n it:{L:\"Prêts\",D:\"Dépôts\",C:\"Biens de consommation\",I:\"Biens d'équipement\",E:\"Titres\"},\n itE:{a:\"Titres détenus\",p:\"Titres émis\"},\n fl:[\"\",\"crédit\",\"salaires\",\"consommation\",\"achat d'actions\",\"remboursement\",\"\"],\n kM:\"Masse monétaire\",kE:\"Richesse nette E\",kH:\"Richesse nette M\",\n mL:\"Masse monétaire = total des dépôts\",\n hoard:\"10 de dépôts thésaurisés\",\n triT:\"Flux de la phase entre banques, entreprises et ménages\",\n s2t:\"Le saut périlleux de la monnaie en valeur\",\n s2d:\"À la fin du circuit, on compare ce qu'est devenue la monnaie et ce qu'est devenue la valeur qu'elle a permis de produire.\",\n j1L:\"Ce que devient la monnaie\",j2L:\"Ce que devient la valeur\",isL:\"I = S : investissement et épargne\",isM:\"épargne des ménages\",isE:\"profit = épargne des entreprises\",\n created:\"créée\",destroyed:\"détruite au reflux\",left:\"encore en circulation\",\n goods:\"biens produits\",nwL:\"richesse nette\",\n cC:\"consommation (ménages)\",cI:\"équipements (entreprises)\",\n nwM:\"ménages\",nwE:\"entreprises\",\n j1p:\"Sur 100 unités créées, 90 sont détruites au remboursement. Les 10 qui restent sont les dépôts que les ménages ont gardés : leur contrepartie est la dette que les entreprises n'ont pas pu rembourser.\",\n j2p:\"La valeur, elle, est restée : 100 de biens produits, qui forment 100 de richesse nette. Les ménages en détiennent 90 (biens, dépôts, actions), les entreprises 10 (équipements moins dette et titres émis). Ces 10 sont le profit, l'épargne des entreprises : avec les 20 d'épargne des ménages, ils égalent les 30 d'investissement.\",\n j1T:\"Monnaie créée, détruite et restante\",j2T:\"Biens produits et richesse nette\",\n lesson:\"<b>La monnaie ne dure que le temps du circuit, la valeur reste.<\/b> Le saut périlleux est réussi : 100 de monnaie créée ont permis de produire 100 de biens. Rien n'est perdu, et tout a une contrepartie : la monnaie restante correspond au crédit non remboursé, la richesse des ménages à la dette et aux titres des entreprises.\"\n},\nen:{\n eyebrow:\"Session 4 · Graziani's model (2003)\",\n title:\"Following 100 monetary units\",\n sub:\"Graziani's model follows money in the logical order of the circuit: it is <b>created<\/b> by a loan to firms, <b>circulates<\/b> between the poles, then <b>flows back<\/b> to the banks where it is destroyed. At every step, two rules hold: each entry has its counterpart, and the net worth read from the balance sheets matches past flows. We follow 100 units, with the course's parameters. Poulon's circuit assumed profits were distributed: Graziani's model shows <b>where they come from<\/b>.\",\n s1t:\"The phases of the circuit\",\n s1d:\"Step through phase by phase with the buttons or the ← → arrow keys. The triangle shows the phase's flow between poles <b>B<\/b> (banks), <b>E<\/b> (firms) and <b>M<\/b> (households); the balance sheets below update, and changed items are highlighted.\",\n prev:\"← Previous\",next:\"Next →\",\n stepsS:[\"Assumptions\",\"Initial finance\",\"Production\",\"Spending\",\"Portfolio\",\"Reflux\",\"Closure\"],\n phase:\"Phase\",\n steps:[\n  {ph:\"\",t:\"The assumptions\",p:[\"The economy starts from zero: no money has been issued before. Government and the rest of the world are left aside, banks and the central bank form a single pole, and the interest rate is zero.\",\"Firms ask for a loan of 100 and decide to produce 70 of consumer goods and 30 of capital goods. Households spend 80 % of their income; they put half of their saving into shares and keep the other half as deposits.\"]},\n  {ph:\"Opening the circuit\",t:\"Money creation\",p:[\"Banks grant 100 of credit to firms: <b>loan L = 100<\/b> among the banks' assets, <b>deposits D = 100<\/b> among their liabilities. Firms record the opposite.\",\"Banks have the power to create money, but only in response to firms' demand. Money now exists; it is worth nothing yet as long as it does not circulate.\"]},\n  {ph:\"Circulation\",t:\"Production\",p:[\"Firms spend the 100 of deposits to produce. Part of this spending goes to other firms (equipment, materials), but those suppliers in turn pay their employees: across the economy, the 100 become <b>wages<\/b>.\",\"Firms hold 70 of consumer goods and 30 of capital goods, and remain indebted by 100. Households hold 100 of deposits: they have become the banks' creditors.\"]},\n  {ph:\"Circulation\",t:\"Spending\",p:[\"Households spend 80 % of their income, that is <b>80<\/b>. They buy the consumer goods, whose production cost 70. Firms take in 80 for goods that cost them 70: their <b>margin is 10<\/b>.\",\"This is the <b>origin of profit<\/b>: firms paid out 100 in incomes, but put only 70 of consumer goods on sale, the rest being equipment they keep. Households spend 80 on these 70 of goods: the margin arises from this split of output, decided by firms. Consumer goods leave their stocks (C: −70).\"],q:[\"“Capitalists earn what they spend, workers spend what they earn.”\",\"Michał Kalecki\"]},\n  {ph:\"Circulation\",t:\"Portfolio choice\",p:[\"Households have saved 100 − 80 = 20. They put half of it, <b>10<\/b>, into shares issued by firms: firms recover 10 more deposits. The other half, 10, stays as deposits: this is <b>hoarded<\/b> saving.\",\"The money supply is still 100: it has only been distributed differently. Before the reflux, firms' net worth is (90 + 30) − (100 + 10) = <b>10<\/b>, households' is 10 + 10 + 70 = <b>90<\/b>.\"]},\n  {ph:\"Reflux\",t:\"Repayment and destruction\",p:[\"Firms hold 90 of deposits: they repay <b>90<\/b> of credit. Loans and deposits fall by 90 in the banks' balance sheet: 90 units of money are <b>destroyed<\/b>.\",\"Firms are left with 10 of debt, exactly the 10 of deposits households have kept.\"]},\n  {ph:\"Closing the circuit\",t:\"The final balance sheets\",p:[\"Money has almost entirely disappeared, but production has remained: 70 of consumer goods with households, 30 of capital goods with firms. To this is added new financial saving: 10 of shares and 10 of deposits.\",\"Total net worth is <b>100<\/b>: 90 for households, 10 for firms. By buying shares, households have become co-owners of firms and their equipment.\",\"Compared with Poulon's circuit, firms' net financing (10 of unrepaid credit and 10 of shares, that is 20) still equals household saving. But investment is <b>30<\/b>. The gap of 10 is <b>profit<\/b>: the part of value added that firms do not distribute. Profit is <b>firms' saving<\/b>, kept as equipment.\",\"Total saving is therefore 20 (households) + 10 (firms) = 30 = I. We find the accounting identity <b>I = S<\/b> again: it always holds once all saving is counted, and saving results from investment instead of preceding it.\"]}\n ],\n params:[[\"Initial loan\",\"100\"],[\"Production of consumer goods\",\"70\"],[\"Production of capital goods (30 %)\",\"30\"],[\"Share of income consumed\",\"80 %\"],[\"Saving placed in shares\",\"50 %\"],[\"Saving kept as deposits\",\"50 %\"]],\n varsL:\"Variables:\",vars:[[\"L\",\"loan\"],[\"D\",\"deposit\"],[\"C\",\"consumer goods\"],[\"I\",\"capital goods\"],[\"E\",\"securities\"],[\"NW\",\"net worth\"]],\n ag:{B:\"Banks\",E:\"Firms\",M:\"Households\"},\n asset:\"Assets\",liab:\"Liabilities\",nw:\"Net worth\",none:\"nothing\",\n it:{L:\"Loans\",D:\"Deposits\",C:\"Consumer goods\",I:\"Capital goods\",E:\"Securities\"},\n itE:{a:\"Securities held\",p:\"Securities issued\"},\n fl:[\"\",\"loan\",\"wages\",\"consumption\",\"share purchase\",\"repayment\",\"\"],\n kM:\"Money supply\",kE:\"Net worth E\",kH:\"Net worth M\",\n mL:\"Money supply = total deposits\",\n hoard:\"10 of hoarded deposits\",\n triT:\"The phase's flow between banks, firms and households\",\n s2t:\"Money's somersault into value\",\n s2d:\"At the end of the circuit, we compare what has become of money and what has become of the value it made it possible to produce.\",\n j1L:\"What becomes of money\",j2L:\"What becomes of value\",isL 07);\n  --font-d:\"Spectral\",\"IBM Plex Sans\",Georgia,serif;\n  --font-b:\"IBM Plex Sans\",system-ui,sans-serif;\n  --font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n}\n:root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n  --bg:#0D1319;--surface:#161D24;--panel:#111820;\n  --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n  --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  color-scheme:dark;\n}}\n:root[data-theme=\"dark\"]{\n  --bg:#0D1319;--surface:#161D24;--panel:#111820;\n  --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n  --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  color-scheme:dark;\n}\n*{box-sizing:border-box}\nhtml,body{background:var(--bg)}\nbody{margin:0;color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}\n.wrap{max-width:1120px;margin:0 auto;padding-block:26px 44px;padding-inline:18px}\n.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}\n.eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fish);font-weight:500;margin:0 0 6px}\nh1{font-family:var(--font-d);font-weight:600;font-size:clamp(27px,4.2vw,40px);line-height:1.06;margin:0;letter-spacing:-.01em;text-wrap:balance}\n.sub{color:var(--muted);font-size:15px;margin:12px 0 0;max-width:74ch;text-wrap:pretty}\nb{color:var(--ink);font-weight:600}\n.toggles{display:flex;gap:8px;flex-shrink:0}\n.tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center}\n.tg:hover{color:var(--ink);border-color:var(--faint)}\nbutton:focus-visible{outline:2px solid var(--e display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n@media(max-width:820px){.qs{grid-template-columns:minmax(0,1fr)}}\n.qi{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:8px;min-width:0}\n.qi.ok{border-color:color-mix(in srgb,var(--eco) 50%,var(--line))}\n.qi.ko{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}\n.qi p{margin:0;font-size:14px;color:var(--ink);text-wrap:pretty}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;align-self:flex-start;flex-wrap:wrap}\n.seg button{font-family:var(--font-b);font-size:12.5px;border:none;background:var(--surface);color:var(--muted);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line)}\n.seg button:last-child{border-right:none}\n.seg button:hover{color:var(--ink);background:var(--panel)}\n.seg button.on.ok{background:var(--eco);color:#fff;font-weight:600}\n.seg button.on.ko{background:var(--warn);color:#fff;font-weight:600}\n.fb{font-size:13px;color:var(--muted);background:var(--panel);border-radius:9px;padding:8px 10px;text-wrap:pretty}\n.fb .v{font-weight:600} .fb .v.ok{color:var(--eco)} .fb .v.ko{color:var(--warn)}\n\n/* hiérarchie */\n.hier{margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel)}\n.harrow{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;gap:10px}\n.hgrad{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--rms),var(--econ),var(--eco));margin-bottom:12px}\n.hcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n@media(max-width:640px){.hcols{grid-template-columns:minmax(0,1fr)}}\n.hcol{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:10px 12px;min-width:0}\n.hcol h4{margin:0 0 2px;font-size:14px}\n.hcol .rk{font-size:12px;color:var(--muted);margin:0 0 8px}\n.hcol ul{margin:0;padding-left:17px;font-size:13px;color:var(--ink)}\n.hcol li{margin-bottom:4px}\n.hcol li.pend{color:var(--faint);font-style:italic;list-style:none;margin-left:-17px}\n\n/* profit */\n.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}\n@media(max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}\n.two>*{min-width:0}\n.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}\n.stepbtn{font-family:var(--font-b);font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:20px;padding:6px 12px;cursor:pointer;display:flex;gap:7px;align-items:center}\n.stepbtn .n{font-family:var(--font-m);font-size:11px;color:var(--faint)}\n.stepbtn.on{color:var(--ink);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;font-weight:600}\n.stxt p{margin:0 0 10px;font-size:14px;color:var(--muted);text-wrap:pretty}\n\n/* finance initiale / finale */\n.fq{display:grid;gap:8px}\n.fqi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px 12px}\n@media(max-width:600px){.fqi{grid-template-columns:minmax(0,1fr)}}\n.fqi.ok{border-color:color-mix(in srgb,var(--eco) 50%,var(--line))}\n.fqi.ko{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}\n.fqi p{margin:0;font-size:14px}\n.fqi .fb{grid-column:1/-1}\n\n/* chaîne de l'épargne */\n.chain{display:grid;gap:8px;margin-top:4px}\n.link{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);transition:opacity .35s}\n.link.off{opacity:.18}\n.link.cur{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}\n.link .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-m);font-size:12px;font-weight:600;color:#fff;background:var(--c)}\n.link p{margin:0;font-size:14px;color:var(--muted);text-wrap:pretty}\n.link p .lt{display:block;margin-bottom:2px;color:var(--ink);font-weight:600}\n.lesson{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--fish);border-radius:12px;padding:14px 18px;font-size:14px;color:var(--muted);text-wrap:pretty;box-shadow:var(--shadow)}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\">\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\"><\/p>\n      <h1 data-t=\"title\"><\/h1>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" type=\"button\" aria-label=\"Langue / Language\">FR/EN <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" type=\"button\" aria-label=\"Thème clair ou sombre\">◐<\/button>\n    <\/div>\n  <\/div>\n  <p class=\"sub\" data-t=\"sub\"><\/p>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">1<\/span><h2 data-t=\"s1t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s1d\"><\/p>\n    <div class=\"bar\"><span class=\"score\" id=\"sc1\"><\/span><button class=\"btn ghost\" id=\"sol1\" type=\"button\"><\/button><\/div>\n    <div class=\"qs\" id=\"qs\"><\/div>\n    <div class=\"hier\">\n      <div class=\"harrow\"><span data-t=\"hStrong\"><\/span><span data-t=\"hWeak\"><\/span><\/div>\n      <div class=\"hgrad\"><\/div>\n      <div class=\"hcols\" id=\"hcols\"><\/div>\n    <\/div>\n    <blockquote class=\"quote\"><span data-t=\"q1\"><\/span><cite>Augusto Graziani, 2003<\/cite><\/blockquote>\n    <div class=\"box\" data-t=\"b1\"><\/div>\n  <\/section>\n\n  <section class=\"card\" id=\"card2\">\n    <div class=\"head\"><span class=\"num\">2<\/span><h2 data-t=\"s2t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s2d\"><\/p>\n    <div class=\"stepper\" id=\"pSteps\"><\/div>\n    <div class=\"two\">\n      <div class=\"stxt\" id=\"pTxt\"><\/div>\n      <div><svg id=\"pSvg\" viewBox=\"0 0 460 310\" role=\"img\" aria-labelledby=\"pT\"><title id=\"pT\">Bilan des entreprises<\/title><\/svg><\/div>\n    <\/div>\n    <blockquote class=\"quote\"><span data-t=\"q2\"><\/span><cite>Bernard Vallageas, 2023<\/cite><\/blockquote>\n    <div class=\"box\" data-t=\"b2\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">3<\/span><h2 data-t=\"s3t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s3d\"><\/p>\n    <div class=\"bar\"><span class=\"score\" id=\"sc3\"><\/span><button class=\"btn ghost\" id=\"sol3\" type=\"button\"><\/button><\/div>\n    <div class=\"fq\" id=\"fq\"><\/div>\n    <div style=\"margin-top:16px;overflow-x:auto\"><svg id=\"fr\" viewBox=\"0 0 900 170\" role=\"img\" aria-labelledby=\"frT\" style=\"min-width:640px\"><title id=\"frT\">Frise<\/title><\/svg><\/div>\n    <div class=\"box\" data-t=\"b3\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">4<\/span><h2 data-t=\"s4t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s4d\"><\/p>\n    <div class=\"bar\">\n      <button class=\"btn ghost\" id=\"cPrev\" type=\"button\"><\/button>\n      <button class=\"btn\" id=\"cNext\" type=\"button\"><\/button>\n    <\/div>\n    <div class=\"chain\" id=\"chain\"><\/div>\n    <blockquote class=\"quote\"><span data-t=\"q4\"><\/span><cite>Alain Parguez, 2003<\/cite><\/blockquote>\n  <\/section>\n\n  <div class=\"lesson\" data-t=\"lesson\"><\/div>\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\nvar NS=\"http://www.w3.org/2000/svg\";\nfunction mk(t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}\nfunction $(id){return document.getElementById(id);}\nfunction clear(svg){var ti=svg.querySelector(\"title\");while(svg.lastChild&&svg.lastChild!==ti)svg.removeChild(svg.lastChild);}\nvar P=\"impl\",LANG=\"fr\";\ntry{var sl=localStorage.getItem(P+\"_lang\");if(sl===\"fr\"||sl===\"en\")LANG=sl;}catch(e){}\ntry{var st=localStorage.getItem(P+\"_theme\");if(st===\"dark\"||st===\"light\")document.documentElement.setAttribute(\"data-theme\",st);}catch(e){}\n\nvar COL={B:\"var(--rms)\",E:\"var(--econ)\",M:\"var(--eco)\"};\nvar Q1=[\"B\",\"E\",\"E\",\"E\",\"M\",\"M\"];      /* qui décide */\nvar Q3=[\"i\",\"f\",\"f\",\"f\",\"f\"];          /* finance initiale / finale */\nvar a1=Q1.map(function(){return null;}),a3=Q3.map(function(){return null;});\nvar pstep=0,cstep=0;\n\nvar T={\nfr:{\n eyebrow:\"Séance 4 · Implications macroéconomiques\",\n title:\"Ce que révèle le circuit\",\n sub:\"Le modèle de Graziani ne fait pas que suivre la monnaie : il change la manière de lire l'économie. Quatre résultats s'opposent à la théorie néoclassique. On les lit sur le circuit de 100 unités, avec les mêmes chiffres.\",\n s1t:\"Qui décide quoi ?\",\n s1d:\"Dans la théorie néoclassique, le consommateur est souverain : ses préférences orientent la production. Dans le circuit, l'accès au marché dépend de l'accès à la monnaie. Attribuez chaque décision au pôle qui la prend.\",\n sc:\"Réponses justes : \",sol:\"Montrer la correction\",\n poles:{B:\"Banques\",E:\"Entreprises\",M:\"Ménages\"},\n q1:[\"Créer la monnaie, en accordant ou en refusant le crédit\",\"Fixer le niveau de la production, donc de l'emploi\",\"Répartir la production entre biens de consommation et biens d'équipement\",\"Déterminer le profit macroéconomique\",\"Choisir la part du revenu consommée\",\"Choisir entre placer son épargne en actions ou la garder en dépôts\"],\n e1:[\"Les banques détiennent le pouvoir de créer la monnaie, qu'elles exercent en réponse à la demande des entreprises.\",\"Les entreprises, premières à recevoir la monnaie, décident combien produire, donc combien embaucher.\",\"Ce choix de composition revient aux entreprises : c'est lui qui décide de la part des biens que les ménages pourront acheter.\",\"Le profit macroéconomique découle des choix des entreprises sur la composition de la production, non de leur performance individuelle.\",\"Les ménages arrivent en dernier : ils choisissent comment dépenser un revenu qu'ils n'ont pas décidé.\",\"Ce choix appartient aux ménages, mais il ne fait que répartir une épargne née des décisions des entreprises.\"],\n ok:\"Juste.\",ko:\"Pas tout à fait.\",\n hStrong:\"souveraineté forte : on crée la monnaie\",hWeak:\"souveraineté faible : on dépend de la monnaie des autres\",\n rank:{B:\"créent la monnaie\",E:\"y accèdent en premier\",M:\"la reçoivent en dernier\"},\n pend:\"répondez pour remplir\",\n q1q:\"« Le modèle remplace la souveraineté du consommateur par la souveraineté du producteur. »\",\n b1:\"<b>Il n'y a pas de démocratie économique dans le circuit.<\/b> Les agents sont hiérarchisés selon leur distance au pôle qui crée la monnaie. La théorie du circuit est aussi une théorie de la répartition du pouvoir entre groupes sociaux : ce pouvoir tient à la capacité de déclencher et d'orienter les flux monétaires.\",\n s2t:\"Le profit est fait de biens d'équipement\",\n s2d:\"Dans le circuit, le profit ne rémunère pas la productivité du capital. On suit les 10 de profit des entreprises, de leur apparition à la fin du circuit.\",\n pS:[\"La marge\",\"Le remboursement\",\"À la clôture\"],\n pTx:[\n  [\"Phase 3 : les ménages paient 80 des biens de consommation qui ont coûté 70. Les entreprises encaissent <b>10 de plus<\/b> que ce qu'elles ont dépensé pour les produire : c'est le profit, qui arrive sous forme de dépôts.\",\"Ce profit dépend du partage de la production décidé par les entreprises : plus elles produisent d'équipements, moins il y a de biens de consommation face à la dépense des ménages, et plus la marge sur chacun est forte.\"],\n  [\"Phase 5 : les entreprises utilisent tous leurs dépôts, y compris ces 10, pour rembourser leur crédit. Le profit ne reste pas en caisse : il sert à réduire la dette.\",\"Les entreprises ne peuvent pas garder de monnaie à la fin du circuit : elle reflue vers les banques et disparaît.\"],\n  [\"À la clôture, l'actif des entreprises ne contient plus que <b>30 d'équipements<\/b>. Ils sont financés par 10 de dette bancaire, 10 d'actions détenues par les ménages et <b>10 de richesse nette<\/b> : le profit.\",\"Le profit n'est pas une somme que les entreprises pourraient dépenser demain : c'est la part de leurs équipements qu'elles possèdent en propre.\"]\n ],\n pL:{eq:\"Biens d'équipement\",dep:\"Dépôts\",debt:\"Dette bancaire\",sh:\"Actions émises\",nw:\"Richesse nette = profit\",cost:\"Coût des biens vendus\",depGone:\"Dépôts rendus\",debtGone:\"Dette remboursée\",melt:[\"Le bilan est passé de 120 à 30 :\",\"la monnaie a disparu, les équipements restent.\"],sales:\"Ventes aux ménages\",asset:\"Actif\",liab:\"Passif\",margin:\"marge\"},\n q2:\"« Les entreprises, ne pouvant gagner de la monnaie, ne peuvent gagner que des biens, donc des biens d'investissement. »\",\n b2:\"<b>Le taux de profit n'est pas la productivité marginale du capital.<\/b> Il dépend du partage de la production entre biens de consommation et biens d'équipement, décidé par les entreprises. Graziani en tire une conclusion sur la redistribution : pour améliorer la part des ménages, produire et distribuer des biens publics est plus efficace que verser des subventions monétaires.\",\n s3t:\"Banques et marchés : finance initiale, finance finale\",\n s3d:\"La théorie néoclassique oppose la finance directe (les marchés) à la finance indirecte (les banques). Le circuit les distingue par leur moment : la <b>finance initiale<\/b> ouvre le circuit, la <b>finance finale<\/b> permet aux entreprises de récupérer les dépôts qui rembourseront le crédit. Classez chaque opération.\",\n fI:\"Finance initiale\",fF:\"Finance finale\",\n q3:[\"Un crédit bancaire qui crée les dépôts nécessaires à la production\",\"La vente de biens de consommation aux ménages\",\"L'émission d'actions achetées par les ménages\",\"La vente de biens d'équipement à d'autres entreprises\",\"L'émission d'obligations sur le marché primaire\"],\n e3:[\"C'est l'afflux monétaire de la phase 1 : sans lui, rien ne démarre.\",\"Les ventes ramènent les dépôts des ménages vers les entreprises : 80 dans le modèle.\",\"Les titres captent une partie de l'épargne des ménages : 10 dans le modèle. Ils ne peuvent être achetés qu'avec une monnaie déjà créée par les banques.\",\"Ce que l'une vend, une autre l'achète : les dépôts reviennent au pôle des entreprises.\",\"Comme les actions, les obligations captent une épargne formée par des revenus déjà distribués.\"],\n frT:\"Frise du circuit : finance initiale à l'ouverture, finance finale au reflux\",\n fr:{open:\"ouverture\",flow:\"circulation\",back:\"reflux\",credit:\"crédit 100\",prod:\"production, salaires\",sales:\"ventes 80\",shares:\"actions 10\",repay:\"remboursement 90\"},\n b3:\"<b>Le crédit bancaire passe avant les marchés.<\/b> Les marchés financiers n'interviennent qu'une fois la monnaie émise par les banques : leur fonction est d'assurer le reflux quand les ménages épargnent. Leur essor des dernières décennies traduit la hausse de l'épargne liée à celle des patrimoines ; ils ne sont pas indispensables au financement de l'économie.\",\n s4t:\"L'épargne, vertu privée et fléau social\",\n s4d:\"Pour la théorie néoclassique, l'épargne finance l'investissement. Dans le circuit, l'épargne gardée en dépôts empêche la monnaie de revenir aux entreprises. Avancez maillon par maillon.\",\n prev:\"← Précédent\",next:\"Suivant →\",\n ch:[\n  [\"Les ménages gardent 10 en dépôts\",\"Une partie de leur épargne n'est ni dépensée ni placée en titres : elle est thésaurisée.\"],\n  [\"Ces dépôts ne refluent pas\",\"Les entreprises ne récupèrent que 90 des 100 dépôts qu'elles ont distribués.\"],\n  [\"La dette ne s'éteint pas\",\"Il reste 10 de crédit non remboursé, exactement les 10 de dépôts thésaurisés. Le crédit aux entreprises comporte donc toujours un <b>fonds tournant<\/b>, contrepartie de l'épargne liquide.\"],\n  [\"Plus de thésaurisation, plus de dette\",\"Si les ménages thésaurisent davantage, la dette restante des entreprises augmente et leur richesse nette diminue.\"],\n  [\"Le crédit se resserre\",\"Si la richesse nette des entreprises passe sous ce qu'exige le fonds tournant, les banques durcissent leurs conditions. Le circuit se referme mal et la récession s'enclenche.\"]\n ],\n q4:\"« Le mode de production capitaliste fonctionne d'autant mieux que la demande de dépôts comme capital liquide tend vers zéro. »\",\n lesson:\"<b>Quatre renversements.<\/b> La souveraineté appartient au producteur, pas au consommateur. Le profit est un choix de composition de la production, pas une rémunération de la productivité. Les banques précèdent les marchés. Et l'épargne liquide, vertu pour chaque ménage, fragilise le circuit dans son ensemble. Dans tous les cas, ce sont les positions dans le circuit qui comptent, plus que les comportements individuels.\"\n},\nen:{\n eyebrow:\"Session 4 · Macroeconomic implications\",\n title:\"What the circuit reveals\",\n sub:\"Graziani's model does more than follow money: it changes the way we read the economy. Four results run against neoclassical theory. We read them off the circuit of 100 units, with the same figures.\",\n s1t:\"Who decides what?\",\n s1d:\"In neoclassical theory, the consumer is sovereign: their preferences steer production. In the circuit, access to the market depends on access to money. Assign each decision to the pole that takes it.\",\n sc:\"Correct answers: \",sol:\"Show the answers\",\n poles:{B:\"Banks\",E:\"Firms\",M:\"Households\"},\n q1:[\"Creating money, by granting or refusing credit\",\"Setting the level of output, hence of employment\",\"Splitting output between consumer goods and capital goods\",\"Determining macroeconomic profit\",\"Choosing the share of income consumed\",\"Choosing between putting saving into shares or keeping it as deposits\"],\n e1:[\"Banks hold the power to create money, which they exercise in response to firms' demand.\",\"Firms, the first to receive money, decide how much to produce, hence how many people to hire.\",\"This choice of composition belongs to firms: it decides what share of goods households will be able to buy.\",\"Macroeconomic profit follows from firms' choices on the composition of output, not from their individual performance.\",\"Households come last: they choose how to spend an income they did not decide.\",\"This choice belongs to households, but it only allocates a saving that arose from firms' decisions.\"],\n ok:\"Correct.\",ko:\"Not quite.\",\n hStrong:\"strong sovereignty: creating money\",hWeak:\"weak sovereignty: depending on others' money\",\n rank:{B:\"create money\",E:\"access it first\",M:\"receive it last\"},\n pend:\"answer to fill in\",\n q1q:\"“The model replaces consumer sovereignty with producer sovereignty.”\",\n b1:\"<b>There is no economic democracy in the circuit.<\/b> Agents are ranked by their distance from the pole that creates money. Circuit theory is also a theory of how power is distributed among social groups: that power rests on the capacity to trigger and steer monetary flows.\",\n s2t:\"Profit is made of capital goods\",\n s2d:\"In the circuit, profit does not reward the productivity of capital. We follow firms' 10 of profit from its appearance to the end of the circuit.\",\n pS:[\"The margin\",\"Repayment\",\"At closure\"],\n pTx:[\n  [\"Phase 3: households pay 80 for consumer goods that cost 70. Firms take in <b>10 more<\/b> than they spent producing them: this is profit, which arrives as deposits.\",\"This profit depends on the split of output decided by firms: the more capital goods they produce, the fewer consumer goods there are to meet households' spending, and the higher the margin on each.\"],\n  [\"Phase 5: firms use all their deposits, these 10 included, to repay their loan. Profit does not stay in the till: it serves to reduce debt.\",\"Firms cannot keep money at the end of the circuit: it flows back to the banks and disappears.\"],\n  [\"At closure, firms' assets contain only <b>30 of capital goods<\/b>. They are financed by 10 of bank debt, 10 of shares held by households and <b>10 of net worth<\/b>: the profit.\",\"Profit is not a sum firms could spend tomorrow: it is the part of their equipment they own outright.\"]\n ],\n pL:{eq:\"Capital goods\",dep:\"Deposits\",debt:\"Bank debt\",sh:\"Shares issued\",nw:\"Net worth = profit\",cost:\"Cost of goods sold\",depGone:\"Deposits returned\",debtGone:\"Debt repaid\",melt:[\"The balance sheet has shrunk from 120 to 30:\",\"money has gone, the equipment remains.\"],sales:\"Sales to households\",asset:\"Assets\",liab:\"Liabilities\",margin:\"margin\"},\n q2:\"“Firms, being unable to earn money, can only earn goods, hence investment goods.”\",\n b2:\"<b>The rate of profit is not the marginal productivity of capital.<\/b> It depends on the split of output between consumer goods and capital goods, decided by firms. Graziani draws a conclusion on redistribution from this: to improve households' share, producing and distributing public goods is more effective than paying monetary subsidies.\",\n s3t:\"Banks and markets: initial finance, final finance\",\n s3d:\"Neoclassical theory contrasts direct finance (markets) with indirect finance (banks). The circuit distinguishes them by their timing: <b>initial finance<\/b> opens the circuit, <b>final finance<\/b> lets firms recover the deposits that will repay the loan. Classify each operation.\",\n fI:\"Initial finance\",fF:\"Final finance\",\n q3:[\"A bank loan that creates the deposits needed for production\",\"Selling consumer goods to households\",\"Issuing shares bought by households\",\"Selling capital goods to other firms\",\"Issuing bonds on the primary market\"],\n e3:[\"This is the monetary inflow of phase 1: without it, nothing starts.\",\"Sales bring households' deposits back to firms: 80 in the model.\",\"Securities capture part of households' saving: 10 in the model. They can only be bought with money already created by banks.\",\"What one firm sells, another buys: deposits return to the firms' pole.\",\"Like shares, bonds capture saving formed out of incomes already distributed.\"],\n frT:\"Timeline of the circuit: initial finance at the opening, final finance at the reflux\",\n fr:{open:\"opening\",flow:\"circulation\",back:\"reflux\",credit:\"loan 100\",prod:\"production, wages\",sales:\"sales 80\",shares:\"shares 10\",repay:\"repayment 90\"},\n b3:\"<b>Bank credit comes before markets.<\/b> Financial markets come into play only once money has been issued by banks: their function is to ensure the reflux when households save. Their growth in recent decades reflects the rise in saving that came with rising wealth; they are not indispensable to financing the economy.\",\n s4t:\"Saving, a private virtue and a social scourge\",\n s4d:\"For neoclassical theory, saving finances investment. In the circuit, saving kept as deposits prevents money from returning to firms. Step through link by link.\",\n prev:\"← Previous\",next:\"Next →\",\n ch:[\n  [\"Households keep 10 as deposits\",\"Part of their saving is neither spent nor placed in securities: it is hoarded.\"],\n  [\"These deposits do not flow back\",\"Firms recover only 90 of the 100 deposits they paid out.\"],\n  [\"The debt is not extinguished\",\"10 of credit remains unrepaid, exactly the 10 of hoarded deposits. Credit to firms therefore always includes a <b>revolving fund<\/b>, the counterpart of liquid saving.\"],\n  [\"More hoarding, more debt\",\"If households hoard more, firms' remaining debt rises and their net worth falls.\"],\n  [\"Credit tightens\",\"If firms' net worth falls below what the revolving fund requires, banks tighten their conditions. The circuit closes badly and recession sets in.\"]\n ],\n q4:\"“The capitalist mode of production works all the better as the demand for deposits as liquid capital tends towards zero.”\",\n lesson:\"<b>Four reversals.<\/b> Sovereignty belongs to the producer, not the consumer. Profit is a choice about the composition of output, not a reward for productivity. Banks come before markets. And liquid saving, a virtue for each household, weakens the circuit as a whole. In every case, positions in the circuit matter more than individual behaviour.\"\n}};\n\n/* --- section 1 --- */\nfunction draw1(){\n  var d=T[LANG],n=0;\n  $(\"qs\").innerHTML=d.q1.map(function(q,i){var a=a1[i],done=a!==null,ok=a===Q1[i];if(ok)n++;\n    return '<div class=\"qi'+(done?(ok?\" ok\":\" ko\"):\"\")+'\"><p>'+q+'<\/p><div class=\"seg\">'+[\"B\",\"E\",\"M\"].map(function(k){var on=a===k;return '<button type=\"button\" data-i=\"'+i+'\" data-v=\"'+k+'\" class=\"'+(on?(\"on \"+(ok?\"ok\":\"ko\")):\"\")+'\" aria-pressed=\"'+on+'\">'+d.poles[k]+'<\/button>';}).join(\"\")+'<\/div>'+\n      (done?'<div class=\"fb\"><span class=\"v '+(ok?\"ok\":\"ko\")+'\">'+(ok?d.ok:d.ko)+'<\/span> '+d.e1[i]+'<\/div>':\"\")+'<\/div>';}).join(\"\");\n  Array.prototype.forEach.call($(\"qs\").querySelectorAll(\"button\"),function(b){b.addEventListener(\"click\",function(){a1[+b.getAttribute(\"data-i\")]=b.getAttribute(\"data-v\");draw1();});});\n  $(\"sc1\").innerHTML=d.sc+\"<b>\"+n+\"<\/b> / \"+Q1.length;\n  $(\"hcols\").innerHTML=[\"B\",\"E\",\"M\"].map(function(k){\n    var items=d.q1.map(function(q,i){return a1[i]===Q1[i]&&Q1[i]===k?\"<li>\"+q+\"<\/li>\":\"\";}).join(\"\");\n    return '<div class=\"hcol\" style=\"--c:'+COL[k]+'\"><h4>'+d.poles[k]+'<\/h4><p class=\"rk\">'+d.rank[k]+'<\/p><ul>'+(items||'<li class=\"pend\">'+d.pend+'<\/li>')+'<\/ul><\/div>';}).join(\"\");\n}\n$(\"sol1\").addEventListener(\"click\",function(){Q1.forEach(function(v,i){a1[i]=v;});draw1();});\n\n/* --- section 2 --- */\nfunction draw2(){\n  var d=T[LANG],L=d.pL,svg=$(\"pSvg\");clear(svg);\n  $(\"pSteps\").innerHTML=d.pS.map(function(x,i){return '<button type=\"button\" class=\"stepb
