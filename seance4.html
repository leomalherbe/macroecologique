<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;
    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;
    --econ:#2A78D6;--eco:#2E8B57;--rms:#C08A00;--warn:#C0392B;--fish:#0E7C9B;
    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);
    --font-d:"Spectral","IBM Plex Sans",Georgia,serif;/* IBM Plex en second : Spectral n'a pas le grec, β et α y retomberaient sur Georgia */--font-b:"IBM Plex Sans",system-ui,sans-serif;--font-m:"IBM Plex Mono",ui-monospace,monospace;
  }
  :root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}
  body.mode-tool{overflow:hidden;}

  /* ───────── vue « fil » ───────── */
  .wrap{max-width:1080px;margin:0 auto;padding-block:28px 56px;padding-inline:20px;}
  header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .remonte{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-m);font-size:11.5px;color:var(--faint);text-decoration:none;margin:0 0 12px;padding:3px 0;}
  .remonte:hover{color:var(--ink);}
  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:400;margin:0 0 7px;text-wrap:pretty;}
  .eyebrow b{color:var(--fish);font-weight:500;}
  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.6vw,44px);line-height:1.03;margin:0;letter-spacing:-.015em;text-wrap:balance;}
  .seance{font-family:var(--font-d);font-weight:500;font-size:clamp(17px,2.1vw,21px);line-height:1.15;color:var(--muted);margin:7px 0 0;}
  .sub{color:var(--muted);font-size:15.5px;margin:14px 0 0;max-width:80ch;text-wrap:pretty;}
  .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}
  .toggles{display:flex;gap:8px;flex-shrink:0;}
  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}
  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}
  .tg:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--rms);outline-offset:2px;}

  .part{margin-top:40px;}
  .parthead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px;}
  .parthead .rn{font-family:var(--font-m);font-size:12px;font-weight:600;color:#fff;background:var(--pc);border-radius:7px;padding:3px 10px;line-height:1;flex-shrink:0;}
  /* Une partie-seuil ouvre la séance sans prendre de rang : étiquette ajourée
     plutôt que badge plein, pour qu'elle ne se lise pas comme une partie I. */
  .parthead .sn{font-family:var(--font-m);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--pc);background:transparent;border:1px solid var(--pc);border-radius:7px;padding:3px 9px;line-height:1;flex-shrink:0;}
  .parthead h2{font-family:var(--font-d);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance;}
  .partlead{color:var(--muted);font-size:14px;margin:10px 0 16px;max-width:84ch;text-wrap:pretty;}
  .partlead b{color:var(--ink);font-weight:600;} .partlead i{font-family:var(--font-d);font-style:italic;}

  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media (max-width:680px){.cards{grid-template-columns:1fr;}}
  a.card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;transition:border-color .15s,transform .15s;}
  a.card:hover{border-color:var(--faint);transform:translateY(-1px);}
  .emb{flex-shrink:0;width:46px;height:46px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .emb svg{width:26px;height:26px;}
  .cbody{flex:1;min-width:0;}
  .cbody .idx{font-family:var(--font-m);font-size:11px;color:var(--faint);}
  .cbody h3{font-family:var(--font-d);font-weight:600;font-size:16.5px;margin:1px 0 3px;line-height:1.15;text-wrap:balance;}
  .cbody p{font-size:12.8px;color:var(--muted);margin:0;text-wrap:pretty;}
  .cbody .go{font-family:var(--font-m);font-size:11.5px;color:var(--fish);font-weight:500;margin-top:7px;display:inline-block;}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px;text-align:center;text-wrap:balance;}
  footer p{margin:0 0 7px;} footer p:last-child{margin-bottom:0;}
  footer a{color:var(--muted);text-decoration:underline;text-underline-offset:2px;}
  footer a:hover{color:var(--ink);}
  .lic{max-width:62ch;margin-inline:auto;text-wrap:pretty;line-height:1.6;}
  .lic a{white-space:nowrap;}

  /* ───────── vue « outil » ───────── */
  #view-tool{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);}
  body.mode-tool #view-tool{display:flex;}
  body.mode-tool #view-fil{display:none;}
  .nav{display:flex;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;}
  .navrow{display:flex;align-items:center;gap:10px;padding:7px 14px;}
  .navrow.r1{min-height:46px;}
  .nbtn{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:7px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1;}
  .nbtn:hover:not([disabled]){color:var(--ink);border-color:var(--faint);}
  .nbtn[disabled]{opacity:.35;cursor:default;}
  .nbtn.home{color:var(--ink);font-weight:500;}
  .nparts{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding-inline:4px;}
  .pcur{display:inline-flex;align-items:baseline;gap:9px;min-width:0;font-family:var(--font-d);font-weight:600;font-size:15.5px;line-height:1.15;white-space:nowrap;}
  .pcur em{font-family:var(--font-m);font-style:normal;font-size:12px;font-weight:600;color:var(--acc);flex-shrink:0;}
  .pcur span{overflow:hidden;text-overflow:ellipsis;}
  .ngroup{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .ncount{font-family:var(--font-m);font-size:11.5px;color:var(--faint);min-width:46px;text-align:center;}

  .navrow.r2{gap:4px;border-top:1px solid var(--line);padding-block:5px;overflow-x:auto;scrollbar-width:none;background:var(--panel);}
  .navrow.r2::-webkit-scrollbar{display:none;}
  .stp{display:inline-flex;align-items:baseline;gap:7px;flex:0 0 auto;min-width:0;max-width:260px;padding:5px 10px;border-radius:8px;border:1px solid transparent;text-decoration:none;color:var(--faint);font-size:12.5px;line-height:1.2;white-space:nowrap;}
  .stp em{font-family:var(--font-m);font-style:normal;font-size:10.5px;flex-shrink:0;opacity:.8;}
  .stp span{overflow:hidden;text-overflow:ellipsis;}
  .stp:hover{color:var(--ink);background:var(--surface);}
  .stp.on{color:var(--ink);font-weight:600;background:var(--surface);border-color:var(--line);box-shadow:inset 2px 0 0 var(--acc);max-width:none;}
  .stp.on em{color:var(--acc);opacity:1;}
  .pgrp{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);text-decoration:none;font-family:var(--font-m);font-size:11px;font-weight:600;color:var(--faint);line-height:1;}
  .pgrp:hover{color:var(--ink);background:var(--surface);border-color:var(--faint);}

  .host{flex:1;position:relative;min-height:0;}
  .host iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);}

  /* ───────── plein écran ─────────
     Le bandeau se retire au-dessus du bord et revient dès que le pointeur
     approche du haut. La bande de déclenchement #hotzone appartient à la page
     hôte : indispensable, car une iframe absorbe les mouvements de souris et
     la coquille ne les verrait jamais. */
  body.mode-plein .nav{position:absolute;top:0;left:0;right:0;z-index:6;
    transform:translateY(-100%);transition:transform .18s ease;box-shadow:0 8px 26px rgba(0,0,0,.20);}
  body.mode-plein.nav-on .nav{transform:none;}
  #hotzone{display:none;}
  body.mode-plein #hotzone{display:block;position:absolute;top:0;left:0;right:0;height:6px;z-index:7;}
  body.mode-plein.nav-on #hotzone{display:none;}
  .pastille{display:none;}
  body.mode-plein .pastille{display:block;position:absolute;top:10px;right:14px;z-index:5;
    font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;color:var(--faint);
    background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 9px;
    opacity:0;transition:opacity .4s ease;pointer-events:none;}
  body.mode-plein.astuce .pastille{opacity:.92;}
  @media (prefers-reduced-motion:reduce){
    body.mode-plein .nav{transition:none;} .pastille{transition:none;}
  }
  @media (max-width:640px){
    .pcur{font-size:13.5px;}
    .nbtn{padding:7px 8px;} .ncount{min-width:38px;}
    .nbtn.home span{display:none;}
    .stp{max-width:200px;}
    .navrow{padding-inline:10px;}
  }
</style>
</head>

d'une dette, elle disparaît dès qu'on la rembourse : il faut un flux de crédit continu pour que la production continue — et la production consomme <b>énergie et matières<\/b>. C'est l'engrenage de la séance 1 vu depuis la monnaie. De là deux questions : ce que le crédit finance, et ce qu'une autre monnaie pourrait financer."}], "cartes": [{"titre": "D'où vient la monnaie ?", "resume": "On remonte la chaîne pas à pas en partant de l'épargne, et le sens de <b>I = S<\/b> s'inverse. Une baignoire met ensuite la monnaie en mouvement : le robinet, ce sont les nouveaux crédits, la bonde les remboursements, le niveau les dépôts — ouvrez le robinet, allongez la durée des crédits, et regardez le niveau chercher son équilibre. Puis 100 unités traversent trois bilans, et un tableau oppose les deux visions."}, {"titre": "La théorie du circuit monétaire", "resume": "Six opérations à classer sur deux questions : la masse monétaire bouge-t-elle, le PIB bouge-t-il ? Chaque réponse remplit une ligne de la <b>matrice des transactions<\/b>, où tout flux versé par l'un est reçu par l'autre. Les soldes révèlent 16 000 de monnaie créée pour 8 000 de PIB. Le circuit à trois pôles B–E–M se parcourt ensuite flux par flux, d'après Poulon."}, {"titre": "Suivre 100 unités monétaires", "resume": "Sept phases, du crédit initial à la clôture : finance initiale, production, dépense, choix de portefeuille, reflux. À chaque étape, le triangle B–E–M montre le flux, les trois bilans en T s'actualisent et la masse monétaire se déplace de 0 à 100 puis retombe à <b>10<\/b>. La deuxième section compare ce qu'est devenue la monnaie et ce qu'est devenue la valeur — et c'est là qu'apparaît le profit."}, {"titre": "Ce que révèle le circuit", "resume": "Six décisions à attribuer à la banque, aux entreprises ou aux ménages : les bonnes réponses dessinent une <b>hiérarchie de souveraineté<\/b>. On suit ensuite les 10 de profit dans le bilan des entreprises jusqu'à découvrir qu'ils sont faits d'équipements, on classe cinq opérations en finance initiale ou finale, et l'on déroule la chaîne qui fait de l'épargne un fléau pour le circuit."}, {"titre": "Le flipper monétaire", "resume": "Chaque bille est une unité de monnaie lancée par un crédit ; elle percute la production, les revenus, la consommation, puis tombe dans le trou du remboursement. Deux roues dentées tournent au même rythme : la monétaire et l'<b>énergétique<\/b>. Coupez les crédits, la table se vide ; accélérez-les, elle sature. Puis six projets à faire financer par une banque, une monnaie sans dette, et un circuit à quatre pôles où l'État investit."}], "pied": "Parcours du cours de macroéconomie écologique — chaque carte ouvre l'outil interactif correspondant.", "licence": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — réutilisation et adaptation libres à des fins non commerciales, avec attribution et sous la même licence.", "nav_fil": "Le fil", "nav_accueil": "Le cours", "nav_ouvrir": "Ouvrir l’outil", "nav_prec": "Outil précédent", "nav_suiv": "Outil suivant", "nav_plein": "Plein écran (F)", "nav_plein_sortie": "Quitter le plein écran (Échap)", "nav_plein_astuce": "Approchez du haut pour revoir la barre · Échap pour sortir"}, "en": {"titre_onglet": "Ecological macroeconomics — Session 4: the thread of the course", "surtitre": "<b>Ecological macroeconomics<\/b> · Léo Malherbe · KEDGE Business School", "titre": "The thread of the course", "seance": "Session 4 — Money, debt and the circuit", "chapo": "Five movements. The first asks where money comes from, and reverses the direction of <b>I = S<\/b>: credit opens the chain, saving closes it. The second turns the circuit into a way of reading the whole economy. The third tests it on <b>100 monetary units<\/b>, from loan to repayment. The fourth draws four reversals from it against neoclassical theory. The fifth links the monetary wheel to the <b>energy wheel<\/b>, and asks what a currency can finance. Five interactive tools, in the order of the thread: each opens right here, and one click brings you back.", "parties": [{"titre": "What money is", "chapo": "The equality <b>I = S<\/b> is an accounting identity: it says nothing about the direction of causality. Two answers compete. For loanable-funds theory, saving comes before investment. For endogenous money, credit opens the chain, investment generates income, and saving is its residue. Money is then not a stock to be shared out, but a flow that is born and dies."}, {"titre": "The monetary circuit", "chapo": "If money is born of credit, following its movements becomes a way of reading the whole economy. Circuit theory describes it as a network of <b>balance sheets linked by payments<\/b>: every operation has an origin and a destination, and every row closes. What remains is to tell apart what creates money from what creates value — the two do not go together."}, {"titre": "Graziani's model (2003)", "chapo": "The three-pole circuit is then walked through on a worked case: <b>100 monetary units<\/b>, from the initial loan to repayment. Each phase is read in the balance sheets of the bank, the firms and the households. By the end, almost all the money has vanished — but the goods produced have not. It is in that gap that the origin of profit lies."}, {"titre": "Macroeconomic implications", "chapo": "The same circuit, reread, overturns four neoclassical results: sovereignty passes from the consumer to the producer, profit turns out to be made of <b>capital goods<\/b>, banks and markets differ by their moment rather than their nature, and saving stops being a virtue to become what prevents money from flowing back."}, {"titre": "Ecological implications", "chapo": "What remains is to tie money to the physical world. If all money is born of debt, it disappears as soon as it is repaid: a continuous flow of credit is needed for production to continue — and production consumes <b>energy and materials<\/b>. This is the gearing of session 1 seen from money. Hence two questions: what credit finances, and what another kind of money could finance."}], "cartes": [{"titre": "Where does money come from?", "resume": "Walk back up the chain step by step, starting from saving, and the direction of <b>I = S<\/b> reverses. A bathtub then sets money in motion: the tap is new lending, the drain repayments, the level deposits — open the tap, lengthen the loans, and watch the level seek its equilibrium. Then 100 units cross three balance sheets, and a table sets the two views side by side."}, {"titre": "The theory of the monetary circuit", "resume": "Six operations to classify on two questions: does the money supply move, does GDP move? Each answer fills a row of the <b>transactions matrix<\/b>, where whatever one agent pays another receives. The balances reveal 16,000 of money created for 8,000 of GDP. The three-pole circuit B–E–M is then walked through flow by flow, after Poulon."}, {"titre": "Following 100 monetary units", "resume": "Seven phases, from the initial loan to closing: initial finance, production, spending, portfolio choice, reflux. At each step the B–E–M triangle shows the flow, the three T-accounts update, and the money supply moves from 0 to 100 before falling back to <b>10<\/b>. The second section compares what became of the money with what became of the value — and that is where profit appears."}, {"titre": "What the circuit reveals", "resume": "Six decisions to assign to the bank, the firms or the households: the right answers draw a <b>hierarchy of sovereignty<\/b>. Then follow the 10 of profit through the firms' balance sheet until it turns out to be made of equipment, classify five operations as initial or final finance, and unroll the chain that makes saving a scourge for the circuit."}, {"titre": "The monetary pinball machine", "resume": "Each ball is a unit of money launched by a loan; it strikes production, incomes and consumption, then drops into the repayment hole. Two cogwheels turn at the same rate: the monetary one and the <b>energy<\/b> one. Cut lending and the table empties; accelerate it and the table saturates. Then six projects for a bank to finance, a debt-free money, and a four-pole circuit where the state invests."}], "pied": "Course path for ecological macroeconomics — each card opens the matching interactive tool.", "licence": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — free to reuse and adapt for non-commercial purposes, with attribution and under the same licence.", "nav_fil": "The thread", "nav_accueil": "The course", "nav_ouvrir": "Open the tool", "nav_prec": "Previous tool", "nav_suiv": "Next tool", "nav_plein": "Full screen (F)", "nav_plein_sortie": "Exit full screen (Esc)", "nav_plein_astuce": "Move to the top edge to bring the bar back · Esc to exit"}}}</script>
<script type="application/json" id="toolsrc">{"monnaie-endogene.html": "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1\"><script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>D'où vient la monnaie ?<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\">\n<style>\n/* Mise en page : en-tête ; 1 = I = S lu dans les deux sens : une chaîne que l'on remonte depuis l'épargne, puis que l'on prolonge (crédit, dépôts) ; 2 = trois bilans en T suivis pas à pas avec la masse monétaire ; 3 = tableau des deux visions et leçon */\n:root{\n  --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;\n  --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n  --econ:#2A78D6;--eco:#2E8B57;--rms:#C08A00;--warn:#C0392B;--fish:#0E7C9B;\n  --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);\n  --font-d:\"Spectral\",\"IBM Plex Sans\",Georgia,serif;\n  --font-b:\"IBM Plex Sans\",system-ui,sans-serif;\n  --font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n}\n:root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n  --bg:#0D1319;--surface:#161D24;--panel:#111820;\n  --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n  --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  color-scheme:dark;\n}}\n:root[data-theme=\"dark\"]{\n  --bg:#0D1319;--surface:#161D24;--panel:#111820;\n  --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n  --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  color-scheme:dark;\n}\n*{box-sizing:border-box}\nhtml,body{background:var(--bg)}\nbody{margin:0;color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}\n.wrap{max-width:1120px;margin:0 auto;padding-block:26px 44px;padding-inline:18px}\n.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}\n.eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--econ);font-weight:500;margin:0 0 6px}\nh1{font-family:var(--font-d);font-weight:600;font-size:clamp(27px,4.2vw,40px);line-height:1.06;margin:0;letter-spacing:-.01em;text-wrap:balance}\n.sub{color:var(--muted);font-size:15px;margin:12px 0 0;max-width:74ch;text-wrap:pretty}\nb{color:var(--ink);font-weight:600}\n.toggles{display:flex;gap:8px;flex-shrink:0}\n.tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center}\n.tg:hover{color:var(--ink);border-color:var(--faint)}\nbutton:focus-visible{outline:2px solid var(--econ);outline-offset:2px}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-top:22px;padding:22px}\n@media(max-width:520px){.card{padding:16px}}\n.head{display:flex;align-items:center;gap:11px}\n.num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--surface);font-family:var(--font-m);font-size:12.5px;font-weight:600;display:grid;place-items:center}\nh2{font-family:var(--font-d);font-weight:600;font-size:21px;margin:0;letter-spacing:-.01em;text-wrap:balance}\nh3{font-family:var(--font-d);font-weight:600;font-size:17px;margin:0}\n.desc{color:var(--muted);font-size:14px;margin:8px 0 18px;max-width:84ch;text-wrap:pretty}\n.lab{font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0}\n.quote{margin:18px 0 0;font-family:var(--font-d);font-style:italic;font-size:16px;color:var(--ink);border-left:3px solid var(--line);padding:2px 0 2px 16px;max-width:80ch}\n.quote cite{display:block;font-family:var(--font-b);font-style:normal;font-size:12.5px;color:var(--faint);margin-top:4px}\n\n/* steppers (sections 1 et 2) */\n.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}\n.stepsrow{display:flex;flex-wrap:wrap;gap:8px}\n.stepbtn{font-family:var(--font-b);font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:20px;padding:6px 12px;cursor:pointer;display:flex;gap:7px;align-items:center}\n.stepbtn .n{font-family:var(--font-m);font-size:11px;color:var(--faint)}\n.stepbtn.on{color:var(--ink);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;font-weight:600}\n.stepbtn.on .n{color:var(--ink)}\n.nav{display:flex;gap:8px;margin-left:auto}\n.btn{font-family:var(--font-b);font-size:13.5px;font-weight:600;border:1px solid var(--ink);background:var(--ink);color:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer}\n.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:500}\n.btn:disabled{opacity:.35;cursor:default}\n.stxt h3{margin-bottom:6px}\n.stxt p{margin:0 0 10px;font-size:14px;color:var(--muted);text-wrap:pretty;max-width:80ch}\n\n/* section 1 */\n.chainwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px;margin-bottom:16px}\n.chainwrap svg{min-width:680px}\n.node{transition:opacity .45s}\n.cmp{display:grid;gap:8px;margin-top:6px}\n.cmp>div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:baseline;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:9px 12px;background:var(--surface)}\n@media(max-width:560px){.cmp>div{grid-template-columns:minmax(0,1fr)}}\n.cmp .k{font-size:13px;font-weight:600;color:var(--c)}\n.cmp .v{font-family:var(--font-m);font-size:13px;color:var(--ink);text-wrap:pretty}\n\n/* baignoire */\n.tubctl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px}\n.tubctl .sl{display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:0}\n.tubctl label{font-size:13.5px;color:var(--ink);font-weight:500;white-space:nowrap}\n.tubctl output{font-family:var(--font-m);font-size:14px;font-weight:600;min-width:5.5ch;text-align:right;font-variant-numeric:tabular-nums}\n.tubctl input[type=range]{flex:1;min-width:80px}\n#cr{accent-color:var(--rms)} #du{accent-color:var(--warn)}\n@media(max-width:560px){.tubctl .sl{flex-wrap:wrap}.tubctl label{width:100%;white-space:normal}.tstats .k{overflow-wrap:anywhere;font-size:9px}}\n.presets{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;align-items:center}\n.presets button{font-family:var(--font-b);font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:20px;padding:6px 12px;cursor:pointer}\n.presets button:hover{color:var(--ink);border-color:var(--faint)}\n.presets .play{margin-left:auto;display:flex;gap:7px}\n.tub{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}\n@media(max-width:860px){.tub{grid-template-columns:minmax(0,1fr)}}\n.tub>*{min-width:0}\n.tstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}\n.tstats>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}\n.tstats .k{font-family:var(--font-m);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);line-height:1.25}\n.tstats .v{font-family:var(--font-d);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}\n.verdict{border-radius:10px;padding:10px 13px;font-size:13.5px;color:var(--muted);border:1px solid var(--line);border-left:4px solid var(--c);background:var(--surface);text-wrap:pretty;margin-top:12px}\n.box{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--econ);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--muted);text-wrap:pretty;margin-top:16px}\n\n/* contraintes sur l'investissement */\n.vsh{margin:22px 0 10px;padding-top:18px;border-top:1px solid var(--line)}\n.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}\n@media(max-width:760px){.vs{grid-template-columns:minmax(0,1fr)}}\n.vs>div{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:12px 16px;min-width:0;background:var(--surface)}\n.vs .vt{font-size:14px;font-weight:600;color:var(--c);margin:0 0 2px}\n.vs .vq{font-family:var(--font-d);font-size:16px;font-weight:600;color:var(--ink);margin:0 0 8px}\n.vs ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}\n.vs li{margin-bottom:6px;text-wrap:pretty}\n.vsc{margin-top:12px;font-size:14px;color:var(--muted);text-wrap:pretty;max-width:90ch}\n\n/* section 2 */\n.story{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}\n@media(max-width:860px){.story{grid-template-columns:minmax(0,1fr)}}\n.story>*{min-width:0}\n.meter{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}\n.meter .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}\n.meter .big{font-family:var(--font-d);font-size:32px;font-weight:600;color:var(--econ);font-variant-numeric:tabular-nums;line-height:1}\nsvg{display:block;width:100%;height:auto}\nsvg text{font-family:var(--font-b)}\n.sheets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}\n@media(max-width:860px){.sheets{grid-template-columns:minmax(0,1fr)}}\n.sheet{border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;background:var(--surface)}\n.sheet .sh{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel)}\n.sheet .sh i{width:10px;height:10px;border-radius:3px;background:var(--c)}\n.sheet .sh span{font-weight:600;font-size:14px}\n.tcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}\n.tcols>div{padding:8px 10px;min-height:96px;min-width:0}\n.tcols>div+div{border-left:2px solid var(--ink)}\n.tcols .th{font-family:var(--font-m);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-bottom:4px;margin-bottom:6px;border-bottom:2px solid var(--ink)}\n.it{display:flex;justify-content:space-between;gap:6px;font-size:13px;padding:3px 0;border-radius:5px}\n.it span:last-child{font-family:var(--font-m);font-variant-numeric:tabular-nums;color:var(--ink)}\n.it.zero{color:var(--faint)} .it.zero span:last-child{color:var(--faint);text-decoration:line-through}\n.it.chg{background:color-mix(in srgb,var(--econ) 14%,transparent);padding-inline:5px;margin-inline:-5px}\n.it.nw{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;color:var(--muted);font-style:italic}\n.empty{font-size:12.5px;color:var(--faint)}\n\n/* section 3 */\n.tabwrap{overflow-x:auto}\n.ctab{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}\n.ctab th{text-align:left;font-family:var(--font-m);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:500;padding:0 12px 8px;border-bottom:1px solid var(--line)}\n.ctab td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--muted);vertical-align:top;text-wrap:pretty}\n.ctab td:first-child{color:var(--ink);font-weight:500;width:24%}\n.ctab td:last-child{color:var(--ink)}\n.ctab tr:last-child td{border-bottom:none}\n.lesson{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--econ);border-radius:12px;padding:14px 18px;font-size:14px;color:var(--muted);text-wrap:pretty}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\">\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\"><\/p>\n      <h1 data-t=\"title\"><\/h1>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" type=\"button\" aria-label=\"Langue / Language\">FR/EN <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" type=\"button\" aria-label=\"Thème clair ou sombre\">◐<\/button>\n    <\/div>\n  <\/div>\n  <p class=\"sub\" data-t=\"sub\"><\/p>\n\n  <section class=\"card\" id=\"card1\">\n    <div class=\"head\"><span class=\"num\">1<\/span><h2 data-t=\"s1t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s1d\"><\/p>\n    <div class=\"stepper\">\n      <div class=\"stepsrow\" id=\"steps1\"><\/div>\n      <div class=\"nav\">\n        <button class=\"btn ghost\" id=\"prev1\" type=\"button\"><\/button>\n        <button class=\"btn\" id=\"next1\" type=\"button\"><\/button>\n      <\/div>\n    <\/div>\n    <div class=\"chainwrap\"><svg id=\"chain\" viewBox=\"0 0 960 230\" role=\"img\" aria-labelledby=\"chT\"><title id=\"chT\">Chaîne<\/title><\/svg><\/div>\n    <div class=\"stxt\" id=\"stxt1\"><\/div>\n    <div class=\"cmp\" id=\"cmp\" hidden><\/div>\n    <h3 class=\"vsh\" data-t=\"vsT\"><\/h3>\n    <div class=\"vs\" id=\"vs\"><\/div>\n    <p class=\"vsc\" data-t=\"vsC\"><\/p>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">2<\/span><h2 data-t=\"btT\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"btD\"><\/p>\n    <div class=\"tubctl\">\n      <div class=\"sl\"><label for=\"cr\" data-t=\"crL\"><\/label><input type=\"range\" id=\"cr\" min=\"0\" max=\"40\" step=\"2\" value=\"20\"><output id=\"crV\" for=\"cr\"><\/output><\/div>\n      <div class=\"sl\"><label for=\"du\" data-t=\"duL\"><\/label><input type=\"range\" id=\"du\" min=\"2\" max=\"8\" step=\"1\" value=\"5\"><output id=\"duV\" for=\"du\"><\/output><\/div>\n    <\/div>\n    <div class=\"presets\">\n      <span id=\"pres\" style=\"display:flex;flex-wrap:wrap;gap:7px\"><\/span>\n      <span class=\"play\"><button type=\"button\" class=\"btn\" id=\"tplay\"><\/button><button type=\"button\" class=\"btn ghost\" id=\"treset\"><\/button><\/span>\n    <\/div>\n    <div class=\"tub\">\n      <div>\n        <svg id=\"bath\" viewBox=\"0 0 380 300\" role=\"img\" aria-labelledby=\"bathT\"><title id=\"bathT\">Baignoire<\/title><\/svg>\n        <div class=\"tstats\" id=\"tstats\"><\/div>\n      <\/div>\n      <div>\n        <p class=\"lab\" data-t=\"lvL\"><\/p>\n        <svg id=\"lvC\" viewBox=\"0 0 440 170\" role=\"img\" aria-labelledby=\"lvT\"><title id=\"lvT\">Niveau<\/title><\/svg>\n        <p class=\"lab\" style=\"margin-top:10px\" data-t=\"flL\"><\/p>\n        <svg id=\"flC\" viewBox=\"0 0 440 150\" role=\"img\" aria-labelledby=\"flT\"><title id=\"flT\">Flux<\/title><\/svg>\n        <div class=\"verdict\" id=\"tverd\"><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"box\" data-t=\"btBox\"><\/div>\n  <\/section>\n\n  <section class=\"card\" id=\"card2\">\n    <div class=\"head\"><span class=\"num\">3<\/span><h2 data-t=\"s2t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s2d\"><\/p>\n    <div class=\"stepper\">\n      <div class=\"stepsrow\" id=\"steps\"><\/div>\n      <div class=\"nav\">\n        <button class=\"btn ghost\" id=\"prev\" type=\"button\"><\/button>\n        <button class=\"btn\" id=\"next\" type=\"button\"><\/button>\n      <\/div>\n    <\/div>\n    <div class=\"story\">\n      <div class=\"stxt\" id=\"stxt\"><\/div>\n      <div class=\"meter\">\n        <div class=\"row\"><p class=\"lab\" data-t=\"mL\"><\/p><span class=\"big\" id=\"mV\">0<\/span><\/div>\n        <svg id=\"mChart\" viewBox=\"0 0 380 120\" role=\"img\" aria-labelledby=\"mT\"><title id=\"mT\">Masse monétaire<\/title><\/svg>\n      <\/div>\n    <\/div>\n    <div class=\"sheets\" id=\"sheets\"><\/div>\n    <blockquote class=\"quote\" id=\"q2\" hidden><span data-t=\"q2\"><\/span><cite>Jean-Pierre Zerbato, 1989<\/cite><\/blockquote>\n  <\/section>\n\n  <section class=\"card\">\n    <div class=\"head\"><span class=\"num\">4<\/span><h2 data-t=\"s3t\"><\/h2><\/div>\n    <p class=\"desc\" data-t=\"s3d\"><\/p>\n    <div class=\"tabwrap\"><table class=\"ctab\" id=\"ctab\"><\/table><\/div>\n    <div class=\"lesson\" data-t=\"lesson\"><\/div>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\nvar NS=\"http://www.w3.org/2000/svg\";\nfunction mk(t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}\nfunction $(id){return document.getElementById(id);}\nfunction clear(svg){var ti=svg.querySelector(\"title\");while(svg.lastChild&&svg.lastChild!==ti)svg.removeChild(svg.lastChild);}\nvar P=\"fpme\",LANG=\"fr\";\ntry{var sl=localStorage.getItem(P+\"_lang\");if(sl===\"fr\"||sl===\"en\")LANG=sl;}catch(e){}\ntry{var st=localStorage.getItem(P+\"_theme\");if(st===\"dark\"||st===\"light\")document.documentElement.setAttribute(\"data-theme\",st);}catch(e){}\n\nvar T={\nfr:{\n eyebrow:\"Séance 4 · L'essence de la monnaie\",\n title:\"D'où vient la monnaie ?\",\n sub:\"On apprend souvent qu'il faut épargner avant d'investir, et que les banques prêtent l'épargne des ménages. La théorie du circuit monétaire renverse cet ordre : l'investissement vient d'abord, financé par un crédit qui <b>crée<\/b> la monnaie ; cette monnaie circule, puis <b>disparaît<\/b> quand le crédit est remboursé. On lit d'abord l'égalité entre investissement et épargne dans les deux sens, puis on suit 100 unités dans les bilans.\",\n s1t:\"I = S : qui détermine qui ?\",\n s1d:\"En économie fermée et sans État, l'investissement est toujours égal à l'épargne. Cette égalité ne dit pas dans quel sens va la causalité. Avancez pas à pas avec les boutons ou les flèches ← → : on part de l'épargne et l'on remonte la chaîne.\",\n stepsS1:[\"I = S\",\"Épargne préalable\",\"Revenu\",\"Production\",\"Investissement\",\"Crédit\",\"Dépôts\"],\n steps1:[\n  {t:\"Une égalité comptable\",p:[\"Sur une période, la valeur de l'investissement (<b>I<\/b>) est égale à celle de l'épargne (<b>S<\/b>). C'est une identité de la comptabilité nationale : elle se vérifie toujours, quoi qu'il arrive.\",\"Une identité ne dit pas ce qui cause quoi. Deux lectures s'opposent.\"]},\n  {t:\"La lecture intuitive : l'épargne préalable\",p:[\"Les ménages épargnent, les banques collectent cette épargne et la prêtent, les entreprises investissent : <b>S détermine I<\/b>. C'est la logique d'un budget familial, où il faut mettre de côté avant d'acheter.\",\"Cette lecture est intuitive, mais elle est fausse à l'échelle de l'économie entière. Pour le voir, on part de l'épargne et l'on se demande d'où elle vient.\"]},\n  {t:\"L'épargne est un résidu\",p:[\"L'épargne est ce qui reste du revenu une fois la consommation payée : <b>S = Y − C<\/b>. Elle n'existe pas à côté du revenu : c'est la part du revenu qui n'a pas été consommée.\",\"Pas de revenu, pas d'épargne. D'où vient le revenu ?\"]},\n  {t:\"Le revenu suppose une production\",p:[\"Salaires, profits, dividendes : un revenu n'est versé que par une entreprise qui produit. À l'échelle de l'économie, le revenu distribué est la contrepartie de la valeur ajoutée.\",\"Pas de production, pas de revenu. Que faut-il pour produire ?\"]},\n  {t:\"La production suppose l'investissement\",p:[\"Avant de vendre quoi que ce soit, l'entreprise doit dépenser : acheter des équipements, payer des salaires. Cette dépense engagée en premier, c'est l'investissement.\",\"La chaîne se lit maintenant dans l'autre sens : <b>I détermine S<\/b>. L'investissement fait naître une production, qui distribue des revenus, dont une partie n'est pas consommée. C'est la théorie de l'<b>épargne induite<\/b> : l'épargne résulte de l'investissement, elle n'en est pas la condition.\"]},\n  {t:\"Avant l'investissement : le crédit\",p:[\"Avec quoi l'entreprise paie-t-elle ses dépenses avant d'avoir vendu ? Avec un <b>crédit bancaire<\/b>. En l'accordant, la banque crée la monnaie dont l'entreprise a besoin : aucune épargne préalable n'est nécessaire.\",\"La baignoire de la section 2 montre ce que deviennent ces dépôts dans le temps.\"]},\n  {t:\"Après l'épargne : les dépôts\",p:[\"Le revenu épargné est détenu sous forme de <b>dépôts<\/b> bancaires, ou de titres. Ces dépôts sont la monnaie créée par le crédit, arrivée au bout de la chaîne.\",\"Les dépôts ne financent pas le crédit : ils en sont la conséquence. La lecture intuitive parcourait la même chaîne à l'envers.\"]}\n ],\n nodes:{L:[\"Crédit\",\"L\"],I:[\"Investissement\",\"I\"],Q:[\"Production\",\"Q\"],Y:[\"Revenu\",\"Y\"],S:[\"Épargne\",\"S = Y − C\"],D:[\"Dépôts\",\"D\"]},\n vsT:\"Ce qui contraint l'investissement\",\n vs:[[\"Fonds prêtables\",\"L'épargne disponible\",[\"On ne peut investir que ce qui a été épargné avant : pour investir plus, il faut d'abord consommer moins.\",\"Le taux d'intérêt est le prix qui ajuste l'offre d'épargne à la demande d'investissement : une épargne rare le fait monter et freine l'investissement.\",\"Ce que l'État emprunte est retiré à l'investissement privé : c'est l'effet d'éviction.\"]],\n  [\"Monnaie endogène\",\"Les débouchés, le crédit, les ressources réelles\",[\"Les entreprises investissent si elles anticipent de pouvoir vendre : c'est la demande attendue qui décide.\",\"La banque prête si elle juge le projet solvable, à un taux qu'elle fixe à partir du taux directeur de la banque centrale.\",\"Le crédit peut créer autant de monnaie que demandé, mais pas les travailleurs, l'énergie et les matières qu'il sert à mobiliser.\"]]],\n vsC:\"Dans la vision de la monnaie endogène, la contrainte ultime sur l'investissement est donc <b>réelle<\/b> : on ne manque jamais d'argent, on peut manquer de travail, d'énergie ou de matières. C'est sur ces limites physiques que la macroéconomie écologique fait porter l'analyse.\",\n arcPrior:\"épargne préalable : S → I\",arcFalse:\"lecture intuitive, mais fausse\",\n back:\"on remonte la chaîne\",\n induced:\"épargne induite : I → S\",\n cmp:[[\"Épargne préalable\",\"épargne → dépôts → crédit → investissement\"],[\"Épargne induite\",\"crédit → investissement → production → revenu → épargne → dépôts\"]],\n chT:\"Chaîne qui relie le crédit, l'investissement, la production, le revenu, l'épargne et les dépôts\",\n btT:\"La baignoire monétaire\",\n btD:\"À l'échelle de l'économie, la monnaie se comporte comme l'eau d'une baignoire. Le <b>robinet<\/b>, ce sont les nouveaux crédits accordés à chaque période ; la <b>bonde<\/b>, les remboursements ; le <b>niveau de l'eau<\/b>, les dépôts, c'est-à-dire la monnaie en circulation. Réglez le robinet et la durée des crédits, puis lancez le temps.\",\n crL:\"Nouveaux crédits par période\",duL:\"Durée moyenne d'un crédit\",per:\"\",yrs:\" pér.\",\n pres:[\"Équilibre\",\"Le robinet s'ouvre\",\"Le robinet se ferme\",\"Crédits plus longs\"],\n play:\"▶ Lancer\",pause:\"❚❚ Pause\",reset:\"Revenir au départ\",\n tap:\"robinet : nouveaux crédits\",drain:\"bonde : remboursements\",level:\"niveau : dépôts\",\n kIn:\"Entrée (crédits)\",kOut:\"Sortie (remboursements)\",kLv:\"Niveau (dépôts)\",\n lvL:\"Niveau de l'eau : monnaie en circulation\",flL:\"Débit du robinet et de la bonde\",\n t:\"période\",eq:\"niveau d'équilibre\",\n vUp:\"Le robinet débite plus que la bonde : <b>le niveau monte<\/b>. Les crédits nouveaux dépassent les remboursements, la monnaie en circulation augmente.\",\n vDown:\"La bonde débite plus que le robinet : <b>le niveau baisse<\/b>. Les remboursements dépassent les crédits nouveaux : de la monnaie est détruite plus vite qu'elle n'est créée.\",\n vEq:\"Entrée = sortie : <b>le niveau est stable<\/b>. Il ne tient que parce que de nouveaux crédits remplacent sans cesse ceux qui sont remboursés.\",\n vEqv:\"Le niveau tend vers {e} = crédits par période × durée.\",\n vZero:\"Le robinet est fermé : la baignoire se vide. Sans nouveaux crédits, toute la monnaie finit détruite par les remboursements.\",\n btBox:\"<b>Plus le niveau est haut, plus la bonde débite<\/b> : chaque période, on rembourse une fraction des crédits en cours (1 / durée). Le niveau se stabilise donc là où le robinet compense exactement la bonde. Dans ce schéma, où seules les entreprises empruntent, la monnaie en circulation est égale aux crédits non encore remboursés. Pour que la monnaie ne disparaisse pas, <b>le robinet doit couler en permanence<\/b>.\",\n bathT:\"Baignoire : le robinet des crédits, la bonde des remboursements, le niveau des dépôts\",\n s2t:\"Suivre 100 unités dans les bilans\",\n s2d:\"On regarde maintenant une seule « goutte » de 100 unités. Un bilan enregistre ce qu'un agent possède (<b>actif<\/b>) et ce qu'il doit (<b>passif<\/b>). La différence est sa <b>richesse nette<\/b>. Avancez étape par étape avec les boutons ou les flèches ← →.\",\n prev:\"← Précédent\",next:\"Suivant →\",\n mL:\"Masse monétaire = total des dépôts\",\n ag:{bank:\"Banque\",firm:\"Entreprise\",hh:\"Ménages\"},\n asset:\"Actif\",liab:\"Passif\",nw:\"Richesse nette\",none:\"rien\",\n it:{loan:\"Prêt\",dep:\"Dépôts\",stock:\"Production en stock\",goods:\"Biens achetés\"},\n stepsS:[\"Avant\",\"Crédit\",\"Salaires\",\"Ventes\",\"Remboursement\"],\n steps:[\n  {t:\"Avant le crédit\",p:[\"Aucun bilan ne contient rien. Il n'y a pas de monnaie, et personne n'a épargné.\",\"On cherche à savoir comment une production peut démarrer dans ces conditions.\"]},\n  {t:\"Le crédit crée la monnaie\",p:[\"L'entreprise ouvre une ligne de crédit de 100. La banque inscrit un <b>prêt<\/b> de 100 à son actif et des <b>dépôts<\/b> de 100 à son passif ; l'entreprise inscrit l'inverse.\",\"La banque ne prête aucune somme qu'elle aurait possédée avant : deux écritures suffisent. La masse monétaire passe de 0 à 100. <b>Les crédits font les dépôts.<\/b>\"]},\n  {t:\"La monnaie circule\",p:[\"L'entreprise paie 100 de salaires. Ses dépôts passent aux ménages ; elle obtient en échange une production de 100, qu'elle garde en stock.\",\"La masse monétaire reste 100 : la monnaie a seulement changé de mains. L'entreprise doit toujours 100 à la banque, et les ménages, qui détiennent les dépôts, sont devenus créanciers de la banque.\"]},\n  {t:\"La monnaie revient\",p:[\"Les ménages achètent la production avec leurs 100 de dépôts. La monnaie revient à l'entreprise, les biens passent aux ménages.\",\"Ici, les ménages dépensent tout leur revenu. Le modèle de Graziani lèvera cette hypothèse : une partie de l'épargne ne revient pas, et c'est là que les choses se compliquent.\"]},\n  {t:\"Le remboursement détruit la monnaie\",p:[\"L'entreprise rembourse son crédit avec les 100 de dépôts récupérés. Le prêt et les dépôts s'annulent dans les deux bilans : <b>la monnaie disparaît<\/b>.\",\"La masse monétaire retombe à 0. Ce qui reste, ce sont les biens produits, désormais chez les ménages. La monnaie n'a vécu que le temps du circuit.\"]}\n ],\n q2:\"« La monnaie ne peut pas vraiment être conservée, car elle finira inévitablement par être détruite. »\",\n s3t:\"Ce qui change d'une vision à l'autre\",\n s3d:\"Les deux visions décrivent les mêmes opérations, mais pas dans le même ordre.\",\n th:[\"\",\"Épargne préalable (fonds prêtables)\",\"Épargne induite (monnaie endogène)\"],\n rows:[\n  [\"Le sens de I = S\",\"S détermine I\",\"I détermine S\"],\n  [\"Ce qui vient d'abord\",\"L'épargne, puis les dépôts, puis le crédit\",\"Le crédit, puis l'investissement ; l'épargne et les dépôts viennent à la fin\"],\n  [\"Rôle de la banque\",\"Intermédiaire : elle transmet une épargne existante\",\"Elle crée la monnaie en accordant le crédit\"],\n  [\"Durée de vie de la monnaie\",\"Un stock permanent\",\"Temporaire : créée par le crédit, détruite au remboursement\"]\n ],\n lesson:\"<b>L'investissement précède l'épargne, le crédit précède les dépôts.<\/b> La monnaie naît d'une demande de crédit des entreprises, pas d'une épargne préalable, et elle ne dure que le temps du circuit qui va du crédit au remboursement. La théorie du circuit monétaire suit ce trajet dans l'économie entière : c'est l'objet du modèle de Graziani, où les ménages ne dépensent pas tout ce qu'ils reçoivent.\"\n},\nen:{\n eyebrow:\"Session 4 · The essence of money\",\n title:\"Where does money come from?\",\n sub:\"We are often taught that one must save before investing, and that banks lend out households' savings. Monetary circuit theory reverses this order: investment comes first, financed by a loan that <b>creates<\/b> money; this money circulates, then <b>disappears<\/b> when the loan is repaid. We first read the equality between investment and saving in both directions, then follow 100 units through the balance sheets.\",\n s1t:\"I = S: which determines which?\",\n s1d:\"In a closed economy without government, investment always equals saving. This equality says nothing about the direction of causality. Step through with the buttons or the ← → arrow keys: we start from saving and work back up the chain.\",\n stepsS1:[\"I = S\",\"Prior saving\",\"Income\",\"Production\",\"Investment\",\"Credit\",\"Deposits\"],\n steps1:[\n  {t:\"An accounting equality\",p:[\"Over a period, the value of investment (<b>I<\/b>) equals that of saving (<b>S<\/b>). This is a national accounting identity: it always holds, whatever happens.\",\"An identity says nothing about what causes what. Two readings compete.\"]},\n  {t:\"The intuitive reading: prior saving\",p:[\"Households save, banks collect these savings and lend them, firms invest: <b>S determines I<\/b>. This is the logic of a household budget, where one must put money aside before buying.\",\"This reading is intuitive, but it is wrong at the level of the whole economy. To see why, we start from saving and ask where it comes from.\"]},\n  {t:\"Saving is a residual\",p:[\"Saving is what is left of income once consumption has been paid for: <b>S = Y − C<\/b>. It does not exist alongside income: it is the part of income that has not been consumed.\",\"No income, no saving. Where does income come from?\"]},\n  {t:\"Income requires production\",p:[\"Wages, profits, dividends: income is paid only by a firm that produces. Across the economy, the income distributed is the counterpart of value added.\",\"No production, no income. What does it take to produce?\"]},\n  {t:\"Production requires investment\",p:[\"Before selling anything, the firm must spend: buy equipment, pay wages. This spending, committed first, is investment.\",\"The chain now reads the other way round: <b>I determines S<\/b>. Investment gives rise to production, which distributes incomes, part of which is not consumed. This is the theory of <b>induced saving<\/b>: saving results from investment, it is not its precondition.\"]},\n  {t:\"Before investment: credit\",p:[\"How does the firm pay for its spending before it has sold anything? With a <b>bank loan<\/b>. By granting it, the bank creates the money the firm needs: no prior saving is required.\",\"The bathtub in section 2 shows what happens to these deposits over time.\"]},\n  {t:\"After saving: deposits\",p:[\"Saved income is held as bank <b>deposits<\/b>, or as securities. These deposits are the money created by the loan, arrived at the end of the chain.\",\"Deposits do not finance credit: they are its consequence. The intuitive reading ran along the same chain backwards.\"]}\n ],\n nodes:{L:[\"Credit\",\"L\"],I:[\"Investment\",\"I\"],Q:[\"Production\",\"Q\"],Y:[\"Income\",\"Y\"],S:[\"Saving\",\"S = Y − C\"],D:[\"Deposits\",\"D\"]},\n vsT:\"What constrains investment\",\n vs:[[\"Loanable funds\",\"Available savings\",[\"One can invest only what has been saved beforehand: to invest more, one must first consume less.\",\"The interest rate is the price that matches the supply of savings to the demand for investment: scarce savings push it up and hold investment back.\",\"What the government borrows is taken away from private investment: this is the crowding-out effect.\"]],\n  [\"Endogenous money\",\"Sales prospects, credit, real resources\",[\"Firms invest if they expect to be able to sell: expected demand is what decides.\",\"The bank lends if it judges the project creditworthy, at a rate it sets from the central bank's policy rate.\",\"Credit can create as much money as is demanded, but not the workers, energy and materials it is used to mobilise.\"]]],\n vsC:\"In the endogenous money view, the ultimate constraint on investment is therefore <b>real<\/b>: there is never a shortage of money, but there can be a shortage of labour, energy or materials. Ecological macroeconomics focuses its analysis on these physical limits.\",\n arcPrior:\"prior saving: S → I\",arcFalse:\"intuitive, but wrong\",\n back:\"working back up the chain\",\n induced:\"induced saving: I → S\",\n cmp:[[\"Prior saving\",\"saving → deposits → credit → investment\"],[\"Induced saving\",\"credit → investment → production → income → saving → deposits\"]],\n chT:\"Chain linking credit, investment, production, income, saving and deposits\",\n btT:\"The monetary bathtub\",\n btD:\"At the level of the economy, money behaves like the water in a bathtub. The <b>tap<\/b> is the new loans granted each period; the <b>drain<\/b>, repayments; the <b>water level<\/b>, deposits, that is, money in circulation. Set the tap and the length of loans, then start the clock.\",\n crL:\"New loans per period\",duL:\"Average loan length\",per:\"\",yrs:\" per.\",\n pres:[\"Equilibrium\",\"The tap opens\",\"The tap closes\",\"Longer loans\"],\n play:\"▶ Start\",pause:\"❚❚ Pause\",reset:\"Back to start\",\n tap:\"tap: new loans\",drain:\"drain: repayments\",level:\"level: deposits\",\n kIn:\"Inflow (loans)\",kOut:\"Outflow (repayments)\",kLv:\"Level (deposits)\",\n lvL:\"Water level: money in circulation\",flL:\"Flow through the tap and the drain\",\n t:\"period\",eq:\"equilibrium level\",\n vUp:\"The tap runs faster than the drain: <b>the level rises<\/b>. New loans exceed repayments, money in circulation increases.\",\n vDown:\"The drain runs faster than the tap: <b>the level falls<\/b>. Repayments exceed new loans: money is destroyed faster than it is created.\",\n vEq:\"Inflow = outflow: <b>the level is stable<\/b>. It holds only because new loans constantly replace those being repaid.\",\n vEqv:\"The level tends towards {e} = loans per period × length.\",\n vZero:\"The tap is closed: the bathtub empties. Without new loans, all money ends up destroyed by repayments.\",\n btBox:\"<b>The higher the level, the faster the drain runs<\/b>: each period, a fraction of outstanding loans is repaid (1 / length). The level therefore settles where the tap exactly offsets the drain. In this scheme, where only firms borrow, money in circulation equals loans not yet repaid. For money not to disappear, <b>the tap must run all the time<\/b>.\",\n bathT:\"Bathtub: the tap of loans, the drain of repayments, the level of deposits\",\n s2t:\"Following 100 units through the balance sheets\",\n s2d:\"We now look at a single “drop” of 100 units. A balance sheet records what an agent owns (<b>assets<\/b>) and what it owes (<b>liabilities<\/b>). The difference is its <b>net worth<\/b>. Step through with the buttons or the ← → arrow keys.\",\n prev:\"← Previous\",next:\"Next →\",\n mL:\"Money supply = total deposits\",\n ag:{bank:\"Bank\",firm:\"Firm\",hh:\"Households\"},\n asset:\"Assets\",liab:\"Liabilities\",nw:\"Net worth\",none:\"nothing\",\n it:{loan:\"Loan\",dep:\"Deposits\",stock:\"Output in stock\",goods:\"Goods bought\"},\n stepsS:[\"Before\",\"Loan\",\"Wages\",\"Sales\",\"Repayment\"],\n steps:[\n  {t:\"Before the loan\",p:[\"Every balance sheet is empty. There is no money, and nobody has saved.\",\"The question is how production can get started under these conditions.\"]},\n  {t:\"The loan creates money\",p:[\"The firm opens a credit line of 100. The bank records a <b>loan<\/b> of 100 among its assets and <b>deposits<\/b> of 100 among its liabilities; the firm records the opposite.\",\"The bank lends no sum it held beforehand: two entries are enough. The money supply rises from 0 to 100. <b>Loans make deposits.<\/b>\"]},\n  {t:\"Money circulates\",p:[\"The firm pays 100 in wages. Its deposits pass to households; in return it obtains output worth 100, which it holds in stock.\",\"The money supply stays at 100: money has only changed hands. The firm still owes 100 to the bank, and households, who now hold the deposits, have become the bank's creditors.\"]},\n  {t:\"Money comes back\",p:[\"Households buy the output with their 100 of deposits. Money returns to the firm, the goods pass to households.\",\"Here households spend all their income. Graziani's model will drop this assumption: part of saving does not come back, and that is where things get complicated.\"]},\n  {t:\"Repayment destroys money\",p:[\"The firm repays its loan with the 100 of deposits it has recovered. Loan and deposits cancel out in both balance sheets: <b>money disappears<\/b>.\",\"The money supply falls back to 0. What remains is the goods produced, now held by households. Money lived only as long as the circuit.\"]}\n ],\n q2:\"“Money cannot really be kept, because it will inevitably end up being destroyed.”\",\n s3t:\"What changes from one view to the other\",\n s3d:\"Both views describe the same operations, but not in the same order.\",\n th:[\"\",\"Prior saving (loanable funds)\",\"Induced saving (endogenous money)\"],\n rows:[\n  [\"Direction of I = S\",\"S determines I\",\"I determines S\"],\n  [\"What comes first\",\"Saving, then deposits, then credit\",\"Credit, then investment; saving and deposits come at the end\"],\n  [\"Role of the bank\",\"Intermediary: it passes on existing savings\",\"It creates money by granting loans\"],\n  [\"Lifespan of money\",\"A permanent stock\",\"Temporary: created by a loan, destroyed on repayment\"]\n ],\n lesson:\"<b>Investment precedes saving, credit precedes deposits.<\/b> Money is born from firms' demand for credit, not from prior saving, and it lasts only as long as the circuit that runs from loan to repayment. Monetary circuit theory follows this path through the whole economy: that is the purpose of Graziani's model, in which households do not spend everything they receive.\"\n}};\n\n/* ---------- section 1 : la chaîne ---------- */\nvar ORDER=[\"L\",\"I\",\"Q\",\"Y\",\"S\",\"D\"],NX={L:82,I:240,Q:398,Y:556,S:714,D:872},NY=128,NW=136,NH=58;\nvar NC={L:\"var(--rms)\",I:\"var(--econ)\",Q:\"var(--econ)\",Y:\"var(--eco)\",S:\"var(--eco)\",D:\"var(--rms)\"};\n/* nœuds visibles et nœud ajouté à chaque étape */\nvar VIS=[[\"I\",\"S\"],[\"I\",\"S\"],[\"I\",\"Y\",\"S\"],[\"I\",\"Q\",\"Y\",\"S\"],[\"I\",\"Q\",\"Y\",\"S\"],[\"L\",\"I\",\"Q\",\"Y\",\"S\"],[\"L\",\"I\",\"Q\",\"Y\",\"S\",\"D\"]];\nvar NEW=[null,null,\"Y\",\"Q\",\"I\",\"L\",\"D\"];\nvar LINKS=[[\"Y\",\"S\",2],[\"Q\",\"Y\",3],[\"I\",\"Q\",4],[\"L\",\"I\",5],[\"S\",\"D\",6]]; /* lien, étape d'apparition */\nvar step1=0;\nfunction arrow(svg,x1,x2,y,col,w,dash){\n  svg.appendChild(mk(\"line\",{x1:x1,y1:y,x2:x2-7,y2:y,stroke:col,\"stroke-width\":w,\"stroke-dasharray\":dash||\"none\"}));\n  svg.appendChild(mk(\"path\",{d:\"M\"+(x2-10)+\" \"+(y-6)+\"L\"+x2+\" \"+y+\"L\"+(x2-10)+\" \"+(y+6)+\"z\",fill:col}));\n}\nfunction draw1(){\n  var d=T[LANG],svg=$(\"chain\");clear(svg);\n  $(\"steps1\").innerHTML=d.stepsS1.map(function(x,i){return '<button type=\"button\" class=\"stepbtn'+(i===step1?\" on\":\"\")+'\" data-i=\"'+i+'\"><span class=\"n\">'+i+'<\/span>'+x+'<\/button>';}).join(\"\");\n  Array.prototype.forEach.call($(\"steps1\").querySelectorAll(\"button\"),function(b){b.addEventListener(\"click\",function(){step1=+b.getAttribute(\"data-i\");active=1;draw1();});});\n  $(\"prev1\").disabled=step1===0;$(\"next1\").disabled=step1===VIS.length-1;\n  var vis=VIS[step1];\n  /* arc de l'épargne préalable : de S vers I, au-dessus */\n  if(step1>=1&&step1<=3){\n    var wrong=step1>=2,col=wrong?\"var(--faint)\":\"var(--warn)\";\n    var x1=NX.S,x2=NX.I,top=34;\n    svg.appendChild(mk(\"path\",{d:\"M\"+x1+\" \"+(NY-NH/2-4)+\"C\"+x1+\" \"+top+\" \"+x2+\" \"+top+\" \"+x2+\" \"+(NY-NH/2-12),fill:\"none\",stroke:col,\"stroke-width\":2.2,\"stroke-dasharray\":wrong?\"6 5\":\"none\"}));\n    svg.appendChild(mk(\"path\",{d:\"M\"+(x2-6)+\" \"+(NY-NH/2-14)+\"L\"+x2+\" \"+(NY-NH/2-3)+\"L\"+(x2+6)+\" \"+(NY-NH/2-14)+\"z\",fill:col}));\n    svg.appendChild(mk(\"text\",{x:(x1+x2)/2,y:top-6,\"text-anchor\":\"middle\",\"font-size\":13,\"font-weight\":600,fill:col,stroke:\"var(--panel)\",\"stroke-width\":5,\"paint-order\":\"stroke\"},wrong?d.arcPrior+\" · \"+d.arcFalse:d.arcPrior));\n  }\n  /* liens de la chaîne induite */\n  LINKS.forEach(function(l){if(step1<l[2])return;var fresh=step1===l[2];\n    arrow(svg,NX[l[0]]+NW/2+4,NX[l[1]]-NW/2-4,NY,fresh?\"var(--ink)\":\"var(--muted)\",fresh?2.6:1.8);});\n  /* « = » à l'étape 0 */\n  if(step1===0){svg.appendChild(mk(\"text\",{x:(NX.I+NX.S)/2,y:NY+14,\"text-anchor\":\"middle\",\"font-size\":44,\"font-family\":\"var(--font-d)\",\"font-weight\":600,fill:\"var(--ink)\"},\"=\"));}\n  /* remontée */\n  if(step1>=2&&step1<=3){var xa=NX[NEW[step1]]+NW/2+6,xb=NX.S+NW/2;\n    svg.appendChild(mk(\"line\",{x1:xb,y1:NY+NH/2+22,x2:xa+8,y2:NY+NH/2+22,stroke:\"var(--faint)\",\"stroke-width\":1.4}));\n    svg.appendChild(mk(\"path\",{d:\"M\"+(xa+10)+\" \"+(NY
