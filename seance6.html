nd[1])),style:'fill:'+o.band[2]+';fill-opacity:.09'}));\n  o.series.forEach(function(s){\n    var dd='';s.vals.forEach(function(v,i){if(v==null||!isFinite(v))return;dd+=(dd?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';});\n    svg.appendChild(mk('path',{d:dd,style:'fill:none;stroke:'+s.color+';stroke-width:'+(s.w||2.4)+';'+(s.dash?'stroke-dasharray:'+s.dash+';':'')+'stroke-linejoin:round'}));\n    if(s.end){var lastI=s.vals.length-1,lv=s.vals[lastI];if(isFinite(lv)){svg.appendChild(mk('circle',{cx:X(lastI),cy:Y(lv),r:3.6,style:'fill:'+s.color}));}}\n  });\n  if(o.ylab)svg.appendChild(mk('text',{x:L,y:T-3,style:'fill:var(--faint);font-size:10.5px;font-family:var(--font-m)'},o.ylab));\n  return {X:X,Y:Y};\n}\nfunction boot(){\n  $('theme').addEventListener('click',function(){var nt=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nt);try{localStorage.setItem(PFX+'_theme',nt);}catch(e){}renderAll();});\n  $('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem(PFX+'_lang',LANG);}catch(e){}applyLang();});\n  if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){renderAll();});}catch(e){}}\n  applyLang();\n}\n\nvar STR={\nfr:{\n doc_title:\"Trois soldes qui s'annulent\",prev:\"Précédent\",next:\"Suivant\",assets:\"Actif\",liabs:\"Passif\",reset:\"Réinitialiser\",\n eyebrow:\"Séance 6 · Les balances sectorielles\",\n title:\"Trois soldes qui s'annulent\",\n sub:\"Le circuit a montré, sur un cas, que le déficit public comble l'épargne des ménages. La comptabilité nationale le dit en toute généralité : dans une économie fermée, ce qu'un secteur dépense en plus de ses revenus, un autre le reçoit en plus de ses dépenses. <b>Les soldes financiers des secteurs s'annulent toujours.<\/b>\",\n s1t:\"La matrice des flux\",\n s1d:\"Chaque ligne est une transaction : ce qui est versé par l'un (−) est reçu par l'autre (+), et chaque ligne fait zéro. Les colonnes donnent le solde de chaque secteur. Modifiez les dépenses et les impôts : les soldes bougent, la dernière case reste à zéro.\",\n sl:{C:\"Consommation C\",I:\"Investissement I\",G:\"Dépenses publiques G\",T:\"Impôts T\",INT:\"Intérêts sur la dette publique INT\"},\n cols:[\"\",\"Ménages\",\"Entreprises<br>courant\",\"Entreprises<br>capital\",\"État\",\"Total\"],\n rows:{C:\"Consommation (C)\",G:\"Dépenses publiques (G)\",I:\"Investissement (I)\",Y:\"PIB (pour mémoire)\",WB:\"Salaires (WB)\",FD:\"Profits distribués (FD)\",FU:\"Profits non distribués (FU)\",T:\"Impôts (T)\",INT:\"Intérêts (INT)\",BAL:\"Solde financier\"},\n mx_note:\"Hypothèses : les salaires font 75 % du PIB, les profits 25 %, distribués pour moitié ; les impôts pèsent sur les ménages, qui détiennent les titres publics. Le compte de capital des entreprises reçoit les profits non distribués (leur épargne) et paie l'investissement.\",\n s2t:\"Trois soldes, une identité\",\n s2d:\"La dernière ligne de la matrice s'écrit en une équation. Elle ne dit pas qui décide : elle dit que les trois soldes ne peuvent pas être choisis indépendamment.\",\n n_h:\"Ménages\",n_f:\"Entreprises\",n_g:\"État\",\n s_h:\"épargne SAV<sub>h<\/sub>\",s_f:\"FU − I\",s_g:\"− DEF\",\n eq:\"<span class='h'>SAV<sub>h<\/sub><\/span> + <span class='f'>(FU − I<sub>f<\/sub>)<\/span> − <span class='g'>DEF<\/span> = 0<br><span class='h'>{h}<\/span> + (<span class='f'>{f}<\/span>) − <span class='g'>{g}<\/span> = <b>0<\/b><br>Avec SAV<sub>p<\/sub> = SAV<sub>h<\/sub> + (FU − I<sub>f<\/sub>) : <b>SAV<sub>p<\/sub> = DEF = {p}<\/b>\",\n rd_def:\"L'épargne nette du secteur privé (<b>{p}<\/b>) est exactement égale au déficit public : la dette publique émise cette année est l'actif financier que le privé accumule.\",\n rd_sur:\"L'État est en excédent (<b>{g}<\/b>) : le secteur privé, pris ensemble, doit être en besoin de financement du même montant. Il se désendette moins vite, ou s'endette.\",\n g_h:\"Le cas général\",\n g_d:\"La matrice est un exemple chiffré. Le résultat vaut pour toute économie fermée, et se démontre en deux lignes à partir des deux façons de décrire le même revenu.\",\n g_steps:[\n  [\"(1)\",\"Y = C + I + G\",\"<b>Côté dépense<\/b> : le produit est acheté par les ménages (C), les entreprises (I) et l'État (G).\",\"\"],\n  [\"(2)\",\"Y = C + S + T\",\"<b>Côté revenu<\/b> : une fois distribué, le revenu est consommé (C), épargné (S) ou versé en impôts (T).\",\"\"],\n  [\"(1) = (2)\",\"C + I + G = C + S + T\",\"Les deux égalités décrivent le même Y. On les égalise, et la consommation disparaît des deux côtés.\",\"\"],\n  [\"⇒\",\"<span class='pv'>(S − I)<\/span> + <span class='g'>(T − G)<\/span> = 0\",\"Le <b>solde du secteur privé<\/b> et le <b>solde public<\/b> s'annulent. Le privé ne peut dégager une capacité de financement (S > I) que si l'État a un besoin de financement (G > T), et réciproquement.\",\"key\"],\n  [\"avec\",\"<span class='pv'>S − I<\/span> = <span class='h'>SAV<sub>h<\/sub><\/span> + <span class='f'>(FU − I<sub>f<\/sub>)<\/span>\",\"L'épargne privée S réunit celle des ménages (SAV<sub>h<\/sub>) et celle des entreprises, leurs profits non distribués (FU) ; l'investissement I est celui des entreprises (I<sub>f<\/sub>). Le solde privé se scinde en <b>solde des ménages<\/b> et <b>solde des entreprises<\/b> : on retrouve la dernière ligne de la matrice.\",\"\"]\n ],\n geq:\"Avec vos réglages : <span class='pv' style='color:var(--fish);font-weight:600'>S − I = {p}<\/span> &nbsp;·&nbsp; <span style='color:var(--rms);font-weight:600'>(T − INT) − G = {g}<\/span> &nbsp;·&nbsp; somme = <b>0<\/b>\",\n g_note:\"<span class='nh'>Deux précisions<\/span>T s'entend ici <b>net des transferts<\/b> versés par l'État, intérêts de la dette compris : dans la matrice, T − G − INT = −DEF. Et cette écriture en deux soldes est faite pour s'étendre : avec le reste du monde, un troisième terme viendra s'ajouter, et la somme restera nulle.\",\n rd_bal:\"Budget à l'équilibre : l'épargne des ménages ne peut alors être absorbée que par un investissement des entreprises supérieur à leurs profits retenus.\",\n s4t:\"Ce que l'État émet, d'autres le détiennent\",\n s4d:\"France, 1996-2024, variations annuelles en milliards d'euros. Au-dessus de zéro, les titres publics acquis par leurs détenteurs (long et court terme) ; au-dessous, la hausse des dettes de l'État. Les deux se répondent exactement. Touchez une année.\",\n lg_lt:\"titres de dette à long terme acquis\",lg_st:\"titres à court terme acquis\",lg_gv:\"hausse des dettes de l'État\",\n yr:\"<b>{y}<\/b> · titres long terme {lt} · court terme {st} · dettes de l'État {gv} (Md€)\",\n yr0:\"Touchez une barre pour lire l'année. Les pics de 2009 et 2020 sont ceux des deux récessions : le déficit s'est creusé quand le privé a réduit ses dépenses.\",\n l_h:\"La dette publique est l'épargne du privé, vue de l'autre côté.\",\n l_x:\"En économie fermée, <b>SAV<sub>p<\/sub> = DEF<\/b> : on ne peut pas vouloir à la fois que les ménages épargnent, que les entreprises se désendettent et que l'État réduise son déficit. Une partie des détenteurs étant étrangers (environ 57 % de la dette négociable de l'État français début 2026), la France est une économie ouverte : l'identité s'y écrit avec le reste du monde, mais sa logique ne change pas.\",\n l_next:\"Reste à voir comment, concrètement, l'État émet cette dette et la renouvelle.\",\n foot:\"Matrice des flux et équation des soldes dans la tradition des modèles stock-flux cohérents (Godley et Lavoie, 2007, <i>Monetary Economics<\/i>). Données France : BCE (variations annuelles, millions d'euros, ici en milliards). Part des non-résidents : Agence France Trésor, bulletin mensuel d'août 2026 (T1 2026, en valeur de marché).\"\n},\nen:{\n doc_title:\"Three balances that cancel out\",prev:\"Previous\",next:\"Next\",assets:\"Assets\",liabs:\"Liabilities\",reset:\"Reset\",\n eyebrow:\"Session 6 · Sectoral balances\",\n title:\"Three balances that cancel out\",\n sub:\"The circuit showed, on one case, that the public deficit fills household saving. National accounting says it in full generality: in a closed economy, what one sector spends beyond its income another receives beyond its spending. <b>The sectors' financial balances always sum to zero.<\/b>\",\n s1t:\"The transactions-flow matrix\",\n s1d:\"Each row is a transaction: what one pays (−) another receives (+), and every row sums to zero. The columns give each sector's balance. Change spending and taxes: the balances move, the last cell stays at zero.\",\n sl:{C:\"Consumption C\",I:\"Investment I\",G:\"Government spending G\",T:\"Taxes T\",INT:\"Interest on public debt INT\"},\n cols:[\"\",\"Households\",\"Firms<br>current\",\"Firms<br>capital\",\"Government\",\"Total\"],\n rows:{C:\"Consumption (C)\",G:\"Government spending (G)\",I:\"Investment (I)\",Y:\"GDP (memo)\",WB:\"Wages (WB)\",FD:\"Distributed profits (FD)\",FU:\"Retained profits (FU)\",T:\"Taxes (T)\",INT:\"Interest (INT)\",BAL:\"Financial balance\"},\n mx_note:\"Assumptions: wages are 75% of GDP, profits 25%, half distributed; taxes fall on households, which hold the government bonds. The firms' capital account receives retained profits (their saving) and pays for investment.\",\n s2t:\"Three balances, one identity\",\n s2d:\"The last row of the matrix can be written as one equation. It does not say who decides: it says the three balances cannot be chosen independently.\",\n n_h:\"Households\",n_f:\"Firms\",n_g:\"Government\",\n s_h:\"saving SAV<sub>h<\/sub>\",s_f:\"FU − I\",s_g:\"− DEF\",\n eq:\"<span class='h'>SAV<sub>h<\/sub><\/span> + <span class='f'>(FU − I<sub>f<\/sub>)<\/span> − <span class='g'>DEF<\/span> = 0<br><span class='h'>{h}<\/span> + (<span class='f'>{f}<\/span>) − <span class='g'>{g}<\/span> = <b>0<\/b><br>With SAV<sub>p<\/sub> = SAV<sub>h<\/sub> + (FU − I<sub>f<\/sub>): <b>SAV<sub>p<\/sub> = DEF = {p}<\/b>\",\n rd_def:\"The private sector's net saving (<b>{p}<\/b>) is exactly equal to the public deficit: the public debt issued this year is the financial asset the private sector accumulates.\",\n rd_sur:\"The government is in surplus (<b>{g}<\/b>): the private sector, taken together, must run a deficit of the same amount. It deleverages more slowly, or borrows.\",\n g_h:\"The general case\",\n g_d:\"The matrix is a numerical example. The result holds for any closed economy, and can be shown in two lines from the two ways of describing the same income.\",\n g_steps:[\n  [\"(1)\",\"Y = C + I + G\",\"<b>Expenditure side<\/b>: output is bought by households (C), firms (I) and the government (G).\",\"\"],\n  [\"(2)\",\"Y = C + S + T\",\"<b>Income side<\/b>: once paid out, income is consumed (C), saved (S) or paid in taxes (T).\",\"\"],\n  [\"(1) = (2)\",\"C + I + G = C + S + T\",\"Both equalities describe the same Y. Set them equal, and consumption drops out of both sides.\",\"\"],\n  [\"⇒\",\"<span class='pv'>(S − I)<\/span> + <span class='g'>(T − G)<\/span> = 0\",\"The <b>private sector balance<\/b> and the <b>government balance<\/b> cancel out. The private sector can only run a financial surplus (S > I) if the government runs a deficit (G > T), and vice versa.\",\"key\"],\n  [\"with\",\"<span class='pv'>S − I<\/span> = <span class='h'>SAV<sub>h<\/sub><\/span> + <span class='f'>(FU − I<sub>f<\/sub>)<\/span>\",\"Private saving S combines households' saving (SAV<sub>h<\/sub>) and firms' saving, their retained profits (FU); investment I is firms' investment (I<sub>f<\/sub>). The private balance splits into a <b>household balance<\/b> and a <b>firm balance<\/b>: this is the last row of the matrix.\",\"\"]\n ],\n geq:\"With your settings: <span style='color:var(--fish);font-weight:600'>S − I = {p}<\/span> &nbsp;·&nbsp; <span style='color:var(--rms);font-weight:600'>(T − INT) − G = {g}<\/span> &nbsp;·&nbsp; sum = <b>0<\/b>\",\n g_note:\"<span class='nh'>Two remarks<\/span>T is understood here <b>net of transfers<\/b> paid by the government, interest on the debt included: in the matrix, T − G − INT = −DEF. And this two-balance form is built to be extended: with the rest of the world a third term will be added, and the sum will still be zero.\",\n rd_bal:\"Balanced budget: household saving can then only be absorbed by firms investing more than their retained profits.\",\n s4t:\"What the state issues, others hold\",\n s4d:\"France, 1996-2024, annual changes in billions of euros. Above zero, the government securities acquired by their holders (long and short term); below, the increase in the state's liabilities. The two match exactly. Tap a year.\",\n lg_lt:\"long-term debt securities acquired\",lg_st:\"short-term securities acquired\",lg_gv:\"increase in government liabilities\",\n yr:\"<b>{y}<\/b> · long-term securities {lt} · short-term {st} · government liabilities {gv} (€bn)\",\n yr0:\"Tap a bar to read the year. The 2009 and 2020 peaks are the two recessions: the deficit widened when the private sector cut its spending.\",\n l_h:\"Public debt is private saving seen from the other side.\",\n l_x:\"In a closed economy, <b>SAV<sub>p<\/sub> = DEF<\/b>: one cannot want households to save, firms to deleverage and the government to cut its deficit all at once. Since part of the holders are foreign (about 57% of French negotiable state debt in early 2026), France is an open economy: the identity includes the rest of the world, but its logic is unchanged.\",\n l_next:\"What remains is to see how, concretely, the state issues this debt and renews it.\",\n foot:\"Transactions-flow matrix and balance equation in the tradition of stock-flow consistent models (Godley and Lavoie, 2007, <i>Monetary Economics<\/i>). France data: ECB (annual changes, millions of euros, shown here in billions). Non-resident share: Agence France Trésor, monthly bulletin, August 2026 (Q1 2026, market value).\"\n}};\n\nvar DEF0={C:70,I:20,G:30,T:25,INT:5},P={},RANGES={C:[40,110],I:[0,40],G:[0,60],T:[0,60],INT:[0,15]};\nfor(var k in DEF0)P[k]=DEF0[k];\nfunction compute(){var Y=P.C+P.I+P.G,WB=.75*Y,F=Y-WB,FD=F/2,FU=F-FD;\n  var SH=WB+FD+P.INT-P.T-P.C,SF=FU-P.I,SG=P.T-P.G-P.INT;\n  return {Y:Y,WB:WB,FD:FD,FU:FU,SH:SH,SF:SF,SG:SG,DEF:-SG};}\nfunction nf(x){if(Math.abs(x)<1e-9)return '0';return (x>0?'+':'')+fmt(x,Math.abs(x-Math.round(x))<1e-9?0:1);}\nfunction cell(x,cls){if(x===null)return '<td><\/td>';return '<td class=\"'+(cls||(x>1e-9?'pos':(x<-1e-9?'neg':'tot')))+'\">'+nf(x)+'<\/td>';}\nfunction renderSliders(){var d=D(),box=$('sliders');if(box.childElementCount){for(var k in P){$('v_'+k).textContent=fmt(P[k]);box.querySelector('[data-k=\"'+k+'\"] .nm').innerHTML=d.sl[k];}return;}\n  Object.keys(P).forEach(function(k){var f=document.createElement('div');f.className='field';f.setAttribute('data-k',k);\n    f.innerHTML='<label><span class=\"nm\">'+d.sl[k]+'<\/span><span class=\"vv\" id=\"v_'+k+'\">'+P[k]+'<\/span><\/label><input type=\"range\" min=\"'+RANGES[k][0]+'\" max=\"'+RANGES[k][1]+'\" step=\"1\" value=\"'+P[k]+'\">';\n    f.querySelector('input').addEventListener('input',function(e){P[k]=+e.target.value;$('v_'+k).textContent=P[k];renderMx();renderBal();renderGen();});box.appendChild(f);});}\nfunction renderMx(){var d=D(),r=compute(),R=d.rows;\n  var h='<thead><tr>'+d.cols.map(function(c,i){return '<th class=\"'+['','h','f','f','g',''][i]+'\">'+c+'<\/th>';}).join('')+'<\/tr><\/thead><tbody>';\n  function row(lbl,a,cls){return '<tr class=\"'+(cls||'')+'\"><td>'+lbl+'<\/td>'+a.map(function(x){return cell(x);}).join('')+cell(0,'tot')+'<\/tr>';}\n  h+=row(R.C,[-P.C,P.C,null,null]);h+=row(R.G,[null,P.G,null,-P.G]);h+=row(R.I,[null,P.I,-P.I,null]);\n  h+='<tr class=\"memo\"><td>'+R.Y+'<\/td><td><\/td><td>['+fmt(r.Y,1)+']<\/td><td><\/td><td><\/td><td><\/td><\/tr>';\n  h+=row(R.WB,[r.WB,-r.WB,null,null]);h+=row(R.FD,[r.FD,-r.FD,null,null]);h+=row(R.FU,[null,-r.FU,r.FU,null]);\n  h+=row(R.T,[-P.T,null,null,P.T]);h+=row(R.INT,[P.INT,null,null,-P.INT]);\n  h+=row(R.BAL,[r.SH,0,r.SF,r.SG],'bal');\n  $('mx').innerHTML=h+'<\/tbody>';}\nfun kbd';kb.textContent='← →';\n  root.appendChild(this.prev);root.appendChild(this.dots);root.appendChild(this.next);root.appendChild(kb);\n  STEPPERS.push(this);\n}\nStepper.prototype.go=function(k){if(k<0||k>=this.n)return;this.i=k;if(k>this.max)this.max=k;LAST_STEPPER=this;this.paint();};\nStepper.prototype.paint=function(){\n  var d=D();this.prev.textContent='← '+d.prev;this.next.textContent=d.next+' →';\n  this.prev.disabled=this.i===0;this.next.disabled=this.i===this.n-1;\n  var self=this;Array.prototype.forEach.call(this.dots.children,function(b,k){b.className=(k===self.i?'on':(k<=self.max?'done':''));});\n  this.on(this.i);\n};\ndocument.addEventListener('keydown',function(e){\n  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;\n  var s=LAST_STEPPER||STEPPERS[0];if(!s)return;\n  if(e.key==='ArrowRight'){s.go(s.i+1);e.preventDefault();}\n  else if(e.key==='ArrowLeft'){s.go(s.i-1);e.preventDefault();}\n});\n/* bilan en T : lines = [[label, value, flags]] flags: 'hl','del','nw' */\nfunction bsHTML(title,color,assets,liabs,opts){\n  opts=opts||{};var d=D();\n  function col(h,arr){var s='<div class=\"col\"><div class=\"ch\">'+h+'<\/div>';\n    if(!arr.length)s+='<div class=\"empty\">—<\/div>';\n    arr.forEach(function(r){var cls='ln'+(r[2]?' '+r[2]:'');s+='<div class=\"'+cls+'\"><span>'+r[0]+'<\/span><span class=\"v\">'+(typeof r[1]==='number'?fmt(r[1]):r[1])+'<\/span><\/div>';});\n    return s+'<\/div>';}\n  return '<div class=\"bs'+(opts.dim?' dim':'')+'\"><div class=\"bh\" style=\"background:'+color+'\"><span>'+title+'<\/span>'+(opts.tag?'<span>'+opts.tag+'<\/span>':'')+'<\/div><div class=\"bt\">'+col(d.assets,assets)+col(d.liabs,liabs)+'<\/div><\/div>';\n}\n/* graphique en lignes */\nfunction lineChart(svg,o){\n  clear(svg);var W=o.W||620,H=o.H||280,L=o.L||46,R=o.R||16,T=o.T||14,B=o.B||30;\n  svg.setAttribute('viewBox','0 0 '+W+' '+H);\n  var n=o.n,ymin=o.ymin,ymax=o.ymax;\n  function X(i){return L+(n<=1?0:i/(n-1))*(W-L-R);}\n  function Y(v){v=Math.max(ymin,Math.min(ymax,v));return H-B-(v-ymin)/(ymax-ymin)*(H-B-T);}\n  var g=mk('g',{'class':'ax'});\n  (o.yticks||[]).forEach(function(v){g.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v)}));g.appendChild(mk('text',{x:L-6,y:Y(v)+3.5,'text-anchor':'end'},o.fy?o.fy(v):fmt(v)));});\n  (o.xticks||[]).forEach(function(i){g.appendChild(mk('text',{x:X(i),y:H-B+16,'text-anchor':'middle'},o.fx?o.fx(i):i));});\n  svg.appendChild(g);\n  if(o.zero!=null&&o.zero>ymin&&o.zero<ymax)svg.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(o.zero),y2:Y(o.zero),style:'stroke:var(--faint);stroke-width:1'}));\n  if(o.band)svg.appendChild(mk('rect',{x:L,y:Y(o.band[1]),width:W-L-R,height:Math.max(0,Y(o.band[0])-Y(o.band[1])),style:'fill:'+o.band[2]+';fill-opacity:.09'}));\n  o.series.forEach(function(s){\n    var dd='';s.vals.forEach(function(v,i){if(v==null||!isFinite(v))return;dd+=(dd?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';});\n    svg.appendChild(mk('path',{d:dd,style:'fill:none;stroke:'+s.color+';stroke-width:'+(s.w||2.4)+';'+(s.dash?'stroke-dasharray:'+s.dash+';':'')+'stroke-linejoin:round'}));\n    if(s.end){var lastI=s.vals.length-1,lv=s.vals[lastI];if(isFinite(lv)){svg.appendChild(mk('circle',{cx:X(lastI),cy:Y(lv),r:3.6,style:'fill:'+s.color}));}}\n  });\n  if(o.ylab)svg.appendChild(mk('text',{x:L,y:T-3,style:'fill:var(--faint);font-size:10.5px;font-family:var(--font-m)'},o.ylab));\n  return {X:X,Y:Y};\n}\nfunction boot(){\n  $('theme').addEventListener('click',function(){var nt=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nt);try{localStorage.setItem(PFX+'_theme',nt);}catch(e){}renderAll();});\n  $('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem(PFX+'_lang',LANG);}catch(e){}applyLang();});\n  if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){renderAll();});}catch(e){}}\n  applyLang();\n}\n\nvar STR={\nfr:{\n doc_title:\"Émettre et rouler la dette\",prev:\"Précédent\",next:\"Suivant\",assets:\"Actif\",liabs:\"Passif\",\n eyebrow:\"Séance 6 · L'émission de dette publique en zone euro\",\n title:\"Émettre et rouler la dette\",\n sub:\"On sait maintenant pourquoi l'État est en déficit. Reste à voir <b>comment<\/b> il le finance : qui achète ses titres, avec quelle monnaie, et ce qui se passe quand un titre arrive à échéance.\",\n s1t:\"La pyramide monétaire\",\n s1d:\"Avant de suivre une émission, il faut savoir qui utilise quelle monnaie. Le système monétaire est une pyramide à trois étages : on la monte pas à pas, puis on y place le Trésor.\",\n py_l:\"Fournit / gère\",py_r:\"Utilise\",\n py_cb:\"Banque<br>centrale\",py_bk:\"Banques<br>commerciales\",py_anf:\"Agents non financiers\",\n py_l1:\"<span><b>Monnaie centrale<\/b><br>réserves et billets<\/span>\",py_l2:\"<span><b>Monnaie bancaire<\/b><br>dépôts<\/span>\",\n py_r2:\"<span><b>Monnaie centrale<\/b><br>pour se régler entre elles<\/span>\",py_r3:\"<span><b>Monnaie bancaire<\/b><br>et billets<\/span>\",\n py_trp:\"+ Trésor\",\n py_steps:[\n  [\"Les dépôts, monnaie des ménages et des entreprises\",\"On l'a vu en séance 4 : en accordant un crédit, une banque crée un dépôt. Ces dépôts forment l'essentiel de la masse monétaire ; dans la zone euro, les billets n'en représentent qu'environ un dixième. Les <b>agents non financiers<\/b> (ménages, entreprises) utilisent cette <b>monnaie bancaire<\/b> ; les <b>banques commerciales<\/b> la fournissent et la gèrent.\"],\n  [\"Pourquoi les banques ont besoin d'une autre monnaie\",\"Un dépôt est une dette de la banque. Quand un client de la banque A paie un client de la banque B, B doit davantage à son client et A moins au sien : A doit régler B avec un actif que B accepte, et ce ne peut pas être un dépôt chez A. Chaque jour, les banques <b>compensent<\/b> leurs paiements croisés et ne règlent que le solde : si les clients de A versent 100 à ceux de B et ceux de B 70 à ceux de A, seuls 30 passent de A à B. Ce solde se règle en <b>monnaie centrale<\/b>, sur les comptes que les banques tiennent à la banque centrale : les <b>réserves<\/b>. Les banques en ont aussi besoin quand leurs clients retirent des <b>billets<\/b>, qu'elles achètent à la banque centrale, et pour les réserves obligatoires (1 % de certains dépôts en zone euro).\"],\n  [\"La banque centrale, banque des banques\",\"La banque centrale crée la monnaie centrale par le même mécanisme que les banques créent les dépôts : le <b>crédit<\/b>. Quand elle prête à une banque, elle crédite son compte : un prêt à son actif, des réserves à son passif. Elle en crée aussi en achetant des titres. Elle est la <b>banque des banques<\/b>. Les réserves restent à cet étage : elles ne font pas partie de la masse monétaire, seuls les billets en descendent.\"],\n  [\"Et le Trésor ?\",\"Le Trésor, qui exécute le budget de l'État, tient lui aussi son compte à la banque centrale, en monnaie centrale : celle-ci est donc aussi la <b>banque de l'État<\/b>. Mais il n'a pas les droits des banques : en zone euro, il ne peut pas emprunter à la banque centrale (article 123 du TFUE). Et pour payer un ménage, il passe par la banque de celui-ci, qui reçoit des réserves et crédite un dépôt. Les banques sont la seule passerelle entre les deux étages de monnaie : c'est ce que montre l'émission qui suit.\"]\n ],\n s2t:\"Émettre 100 de dette\",\n s2d:\"Le Trésor veut dépenser 100 au-delà de ses recettes. On suit les bilans des quatre acteurs, en supposant que la banque centrale prête à 0 % et que le titre rapporte 5 %.\",\n cb:\"Banque centrale\",tr:\"Trésor\",bk:\"Banque commerciale\",hh:\"Ménages\",\n i_loanbk:\"Prêt aux banques\",i_resbk:\"Réserves des banques\",i_trac:\"Compte du Trésor\",i_res:\"Réserves\",i_cbloan:\"Emprunt à la BC\",\n i_bond:\"Titres publics\",i_dep:\"Dépôts\",i_nw:\"Valeur nette\",i_old:\"Ancien bon du Trésor\",i_new:\"Nouveau bon du Trésor\",\n steps2:[\n  [\"Avant l'émission\",\"Le Trésor doit financer une dépense de 100 que ses impôts ne couvrent pas. Aucun bilan n'a encore bougé.\"],\n  [\"Les banques empruntent des réserves\",\"Le Trésor ne peut pas emprunter à la banque centrale (article 123 du TFUE). Ce sont donc les banques qui empruntent 100 de réserves à la BCE, à son taux directeur (ici 0 %). Ce taux est le <b>plancher<\/b> du rendement qu'elles exigeront des titres publics.\"],\n  [\"Elles achètent les titres\",\"Les banques versent 100 de réserves sur le compte du Trésor à la banque centrale et reçoivent un titre qui leur paiera <b>105<\/b> à l'échéance. La différence, 5, est l'intérêt : une richesse nette de +5 pour la banque, de −5 pour le Trésor.\"],\n  [\"Le Trésor dépense\",\"Le Trésor paie 100 à un ménage (un salaire de fonctionnaire, une prestation, une commande). Les réserves reviennent à la banque du ménage, qui crédite son compte : <b>100 de dépôts nouveaux<\/b>. La masse monétaire a augmenté, exactement comme lorsqu'une banque prête à une entreprise.\"],\n  [\"Les banques remboursent la banque centrale\",\"Les réserves revenues aux banques leur servent à rembourser la BCE. Le bilan de la banque centrale se vide : les réserves n'ont fait que transiter. Il reste une dette publique de 105 et, en face, 105 de richesse privée (100 de dépôts pour les ménages, 5 de valeur nette pour la banque). C'est l'identité <b>SAV<sub>p<\/sub> = DEF<\/b> de la partie III, inscrite dans les bilans.\"]\n ],\n k_m:\"Masse monétaire (dépôts)\",k_r:\"Réserves en circulation\",k_d:\"Dette publique\",k_w:\"Richesse nette privée\",\n corr2:\"Après le remboursement, le prêt de la banque centrale et l'emprunt des banques reviennent à zéro.\",\n s3t:\"Rouler la dette\",\n s3d:\"Un bon du Trésor de 50 arrive à échéance et les impôts ne suffisent pas à le rembourser. Le gouvernement émet un titre neuf pour rembourser l'ancien, au taux de 10 % pour que les chiffres se lisent bien. Bilans en niveaux.\",\n steps3:[\n  [\"L'échéance\",\"Une banque détient un bon du Trésor de 50 émis il y a quelques années. Comme dans l'émission de la section 2, ce titre a pour <b>contrepartie monétaire<\/b> 50 de dépôts, créés quand l'État a dépensé : ils figurent au passif de la banque. Le titre arrive à échéance : le Trésor doit trouver 50.\"],\n  [\"Les banques empruntent des réserves\",\"Comme pour toute émission, les banques empruntent 50 de réserves à la banque centrale.\"],\n  [\"Elles achètent le nouveau bon\",\"Le Trésor émet un nouveau bon du Trésor, remboursable 55 dans un an. Les banques le paient 50 de réserves. Pendant un instant, le Trésor doit les deux titres.\"],\n  [\"Le Trésor rembourse l'ancien\",\"Avec les 50 reçus, le Trésor rembourse l'ancien bon, qui est détruit. Les réserves reviennent à la banque qui le détenait.\"],\n  [\"La dette a été renouvelée, pas remboursée\",\"Les banques remboursent la banque centrale. L'ancien bon a été remplacé par le nouveau : la dette n'a pas été éteinte, elle a été <b>roulée<\/b>. Une seule chose a changé : elle vaut 55 au lieu de 50, du fait des <b>intérêts<\/b>. Le roulement évite toute crise de liquidité tant qu'un acheteur se présente : tout se joue donc sur le taux auquel on roule.\"]\n ],\n ez_h:\"Qui garantit qu'il y aura un acheteur ?\",\n ez_x:\"Dans la plupart des pays, la banque centrale peut acheter des titres publics : un État endetté dans sa propre monnaie ne peut alors pas être forcé au défaut, et le taux à court terme suit presque parfaitement le taux directeur. La zone euro est un cas à part : la BCE n'achète que sur le marché secondaire, et sous conditions. En 2010-2012, plusieurs États ont subi des taux de crise jusqu'au « whatever it takes » de Mario Draghi (juillet 2012). Depuis, les achats massifs de titres ont porté la part de la dette publique détenue par l'Eurosystème à près d'un quart en 2022-2023.\",\n s4t:\"Le coût de la dette suit les taux, avec retard\",\n s4d:\"Rouler la dette, c'est la refinancer chaque année en partie au taux du moment. Quand le taux de marché change, le <b>taux apparent<\/b> (intérêts payés / dette) ne le rejoint que progressivement, au rythme des échéances. Réglez la durée moyenne de la dette et le choc de taux.\",\n pz:[[\"fr\",\"France : 8,5 ans\"],[\"short\",\"Dette courte : 2 ans\"],[\"long\",\"Dette longue : 15 ans\"],[\"down\",\"Baisse des taux\"]],\n sl:{M:\"Durée moyenne de la dette (ans)\",r0:\"Taux d'avant (moyenne du stock, %)\",r1:\"Taux de marché nouveau (%)\",d:\"Dette, en % du PIB\"},\n k_a1:\"Taux apparent après 1 an\",k_a5:\"après 5 ans\",k_a10:\"après 10 ans\",k_ch:\"Charge d'intérêts à 10 ans\",\n lg_mk:\"taux de marché (nouvelles émissions)\",lg_ap:\"taux apparent (sur tout le stock)\",\n read4:\"Avec une durée moyenne de <b>{M} ans<\/b>, environ {f} % de la dette est refinancée chaque année. Il faut <b>{h} ans<\/b> pour que le taux apparent parcoure la moitié de l'écart. La charge d'intérêts passe de {c0} à {c10} % du PIB en dix ans.\",\n yrs:\"ans\",\n l_h:\"L'État ne rembourse pas sa dette : il la renouvelle.\",\n l_x:\"Une émission de dette publique crée de la monnaie dans le secteur privé, comme un crédit aux entreprises ; la monnaie centrale ne fait que transiter. À l'échéance, la dette est roulée, et la seule chose qui compte est le <b>taux<\/b> auquel on la roule. C'est lui, comparé à la croissance, qui décide si la dette rapportée au PIB monte ou baisse : c'est l'objet de la dernière partie.\",\n foot:\"Écritures comptables simplifiées : refinancement de la banque centrale à 0 %, titres inscrits à leur valeur de remboursement ; chaque bilan s'équilibre à chaque étape. Durée de vie moyenne de la dette négociable de l'État : 8 ans et 163 jours fin juillet 2026 (Agence France Trésor, bulletin mensuel d'août 2026). Part détenue par l'Eurosystème : BCE.\"\n},\nen:{\n doc_title:\"Issuing and rolling over debt\",prev:\"Previous\",next:\"Next\",assets:\"Assets\",liabs:\"Liabilities\",\n eyebrow:\"Session 6 · Issuing public debt in the euro area\",\n title:\"Issuing and rolling over debt\",\n sub:\"We now know why the state runs a deficit. What remains is <b>how<\/b> it finances it: who buys its bonds, with which money, and what happens when a bond matures.\",\n s1t:\"The monetary pyramid\",\n s1d:\"Before following an issuance, we need to know who uses which money. The monetary system is a three-storey pyramid: we climb it step by step, then place the Treasury in it.\",\n py_l:\"Supplies / manages\",py_r:\"Uses\",\n py_cb:\"Central<br>bank\",py_bk:\"Commercial<br>banks\",py_anf:\"Non-financial agents\",\n py_l1:\"<span><b>Central bank money<\/b><br>reserves and notes<\/span>\",py_l2:\"<span><b>Bank money<\/b><br>deposits<\/span>\",\n py_r2:\"<span><b>Central bank money<\/b><br>to settle between them<\/span>\",py_r3:\"<span><b>Bank money<\/b><br>and notes<\/span>\",\n py_trp:\"+ Treasury\",\n py_steps:[\n  [\"Deposits, the money of households and firms\",\"We saw it in session 4: by granting a loan, a bank creates a deposit. These deposits make up most of the money supply; in the euro area, banknotes are only about a tenth of it. <b>Non-financial agents<\/b> (households, firms) use this <b>bank money<\/b>; <b>commercial banks<\/b> supply and manage it.\"],\n  [\"Why banks need another money\",\"A deposit is a debt of the bank. When a customer of bank A pays a customer of bank B, B owes more to its customer and A less to its own: A must settle with B using an asset B accepts, and it cannot be a deposit at A. Every day banks <b>net<\/b> their cross payments and settle only the balance: if A's customers pay 100 to B's and B's pay 70 to A's, only 30 goes from A to B. That balance is settled in <b>central bank money<\/b>, on the accounts banks hold at the central bank: <b>reserves<\/b>. Banks also need it when customers withdraw <b>banknotes<\/b>, which they buy from the central bank, and for reserve requirements (1% of certain deposits in the euro area).\"],\n  [\"The central bank, the banks' bank\",\"The central bank creates central bank money by the same mechanism banks use to create deposits: <b>credit<\/b>. When it lends to a bank, it credits that bank's account: a loan on its assets, reserves on its liabilities. It also creates reserves by buying securities. It is the <b>banks' bank<\/b>. Reserves stay on that floor: they are not part of the money supply; only banknotes come down.\"],\n  [\"And the Treasury?\",\"The Treasury, which executes the state budget, also keeps its account at the central bank, in central bank money: the central bank is thus also the <b>state's bank<\/b>. But the Treasury does not have the banks' rights: in the euro area it cannot borrow from the central bank (Article 123 TFEU). And to pay a household it goes through that household's bank, which receives reserves and credits a deposit. Banks are the only bridge between the two floors of money: this is what the issuance below shows.\"]\n ],\n s2t:\"Issuing 100 of debt\",\n s2d:\"The Treasury wants to spend 100 beyond its revenue. We follow the balance sheets of the four actors, assuming the central bank lends at 0% and the bond yields 5%.\",\n cb:\"Central bank\",tr:\"Treasury\",bk:\"Commercial bank\",hh:\"Households\",\n i_loanbk:\"Loans to banks\",i_resbk:\"Banks' reserves\",i_trac:\"Treasury account\",i_res:\"Reserves\",i_cbloan:\"Borrowing from CB\",\n i_bond:\"Government bonds\",i_dep:\"Deposits\",i_nw:\"Net worth\",i_old:\"Old Treasury bond\",i_new:\"New Treasury bond\",\n steps2:[\n  [\"Before issuance\",\"The Treasury must finance spending of 100 that its taxes do not cover. No balance sheet has moved yet.\"],\n  [\"Banks borrow reserves\",\"The Treasury cannot borrow from the central bank (Article 123 TFEU). So banks borrow 100 of reserves from the ECB at its policy rate (here 0%). This rate is the <b>floor<\/b> of the yield they will demand on government bonds.\"],\n  [\"They buy the bonds\",\"Banks transfer 100 of reserves to the Treasury's account at the central bank and receive a bond that will pay them <b>105<\/b> at maturity. The difference, 5, is interest: net worth of +5 for the bank, −5 for the Treasury.\"],\n  [\"The Treasury spends\",\"The Treasury pays 100 to a household (a civil servant's salary, a benefit, a purchase). The reserves go to the household's bank, which credits its account: <b>100 of new deposits<\/b>. The money supply has grown, exactly as when a bank lends to a firm.\"],\n  [\"Banks repay the central bank\",\"The reserves that came back to the banks are used to repay the ECB. The central bank's balance sheet empties: reserves were only in transit. What remains is public debt of 105 and, against it, 105 of private wealth (100 of deposits for households, 5 of net worth for the bank). This is the identity <b>SAV<sub>p<\/sub> = DEF<\/b> of part III, written into balance sheets.\"]\n ],\n k_m:\"Money supply (deposits)\",k_r:\"Reserves outstanding\",k_d:\"Public debt\",k_w:\"Private net worth\",\n corr2:\"After repayment, the central bank's loan and the banks' borrowing go back to zero.\",\n s3t:\"Rolling over the debt\",\n s3d:\"A Treasury bond of 50 matures and taxes are not enough to repay it. The government issues a new bond to repay the old one, at 10% so the figures read easily. Balance sheets in levels.\",\n steps3:[\n  [\"Maturity\",\"A bank holds a Treasury bond of 50 issued some years ago. As in the issuance of section 2, its <b>monetary counterpart<\/b> is 50 of deposits, created when the state spent: they sit on the bank's liabilities. The bond matures: the Treasury must find 50.\"],\n  [\"Banks borrow reserves\",\"As for any issuance, banks borrow 50 of reserves from the central bank.\"],\n  [\"They buy the new bond\",\"The Treasury issues a new Treasury bond, repayable at 55 in one year. Banks pay 50 of reserves for it. For a moment, the Treasury owes both bonds.\"],\n  [\"The Treasury redeems the old one\",\"With the 50 received, the Treasury redeems the old bond, which is destroyed. The reserves go back to the bank that held it.\"],\n  [\"The debt was renewed, not repaid\",\"Banks repay the central bank. The old bond has been replaced by the new one: the debt was not extinguished, it was <b>rolled over<\/b>. Only one thing changed: it is worth 55 instead of 50, because of <b>interest<\/b>. Rolling over avoids any liquidity crisis as long as a buyer turns up: everything therefore depends on the rate at which it is rolled.\"]\n ],\n ez_h:\"Who guarantees there will be a buyer?\",\n ez_x:\"In most countries the central bank can buy government bonds: a state indebted in its own currency cannot then be forced into default, and the short-term rate tracks the policy rate almost perfectly. The euro area is a special case: the ECB only buys on the secondary market, and under conditions. In 2010-2012 several states faced crisis rates until Mario Draghi's “whatever it takes” (July 2012). Since then, large-scale bond purchases brought the share of public debt held by the Eurosystem to nearly a quarter in 2022-2023.\",\n s4t:\"The cost of debt follows rates, with a lag\",\n s4d:\"Rolling over means refinancing part of the debt each year at the going rate. When the market rate changes, the <b>effective rate<\/b> (interest paid / debt) only catches up gradually, as bonds mature. Set the average maturity and the rate shock.\",\n pz:[[\"fr\",\"France: 8.5 years\"],[\"short\",\"Short debt: 2 years\"],[\"long\",\"Long debt: 15 years\"],[\"down\",\"Falling rates\"]],\n sl:{M:\"Average maturity of the debt (years)\",r0:\"Previous rate (average on the stock, %)\",r1:\"New market rate (%)\",d:\"Debt, % of GDP\"},\n k_a1:\"Effective rate after 1 year\",k_a5:\"after 5 years\",k_a10:\"after 10 years\",k_ch:\"Interest burden at 10 years\",\n lg_mk:\"market rate (new issues)\",lg_ap:\"effective rate (on the whole stock)\",\n read4:\"With an average maturity of <b>{M} years<\/b>, about {f}% of the debt is refinanced each year. It takes <b>{h} years<\/b> for the effective rate to cover half the gap. The interest burden moves from {c0} to {c10}% of GDP in ten years.\",\n yrs:\"yrs\",\n l_h:\"The state does not repay its debt: it renews it.\",\n l_x:\"Issuing public debt creates money in the private sector, like a loan to firms; central bank money is only in transit. At maturity the debt is rolled over, and the only thing that matters is the <b>rate<\/b> at which it is rolled. That rate, compared with growth, decides whether debt relative to GDP rises or falls: the subject of the last part.\",\n foot:\"Simplified accounting entries: central bank refinancing at 0%, bonds recorded at redemption value; every balance sheet balances at every step. Average life of French negotiable state debt: 8 years and 163 days at end-July 2026 (Agence France Trésor, monthly bulletin, August 2026). Share held by the Eurosystem: ECB.\"\n}};\n\n/* section 1 : pyramide */\nvar st1=null;\nfunction renderS1(k){var d=D();$('st1t').innerHTML=d.py_steps[k][0];$('st1x').innerHTML=d.py_steps[k][1];\n  var on={1:k>=2,2:k>=0,3:k>=0},cur={3:k===0,2:k===1,1:k===2};\n  function sl(n,lab){return '<div class=\"slice s'+n+(on[n]?'':' dim')+(cur[n]?' cur':'')+'\"><div class=\"shape\"><\/div><div class=\"lab\">'+lab+'<\/div><\/div>';}\n  function sd(txt,vis,cls){return '<div class=\"side'+(vis?'':' off')+(cls?' '+cls:'')+'\">'+(txt||'')+'<\/div>';}\n  $('pyr').innerHTML='<div class=\"ph\">'+d.py_l+'<\/div><div><\/div><div class=\"ph r\">'+d.py_r+'<\/div>'+\n    sd(d.py_l1,k>=2)+sl(1,d.py_cb)+sd('',false)+\n    sd(d.py_l2,k>=0)+sl(2,d.py_bk+(k>=3?'<br><span class=\"tpill\">'+d.py_trp+'<\/span>':''))+sd(d.py_r2,k>=1)+\n    sd('',false)+sl(3,d.py_anf)+sd(d.py_r3,k>=0);}\n/* section 2 : bilans */\nfunction S2(k){var d=D();var CB=[],TR=[],BK=[],HH=[];\n  // returns {cb:[a,l], tr:[a,l], bk:[a,l], hh:[a,l], m, r, debt, w}\n  if(k===0)return {cb:[[],[]],tr:[[],[]],bk:[[],[]],hh:[[],[]],m:0,r:0,debt:0,w:0};\n  if(k===1)return {cb:[[[d.i_loanbk,100,'hl']],[[d.i_resbk,100,'hl']]],tr:[[],[]],bk:[[[d.i_res,100,'hl']],[[d.i_cbloan,100,'hl']]],hh:[ , -0.5, -0.5, -0.5, -0.5, -0.5, 0, 0.75, 0.75, 1.5, 1.5, 2, 2.5, 2.5, 3, 3.25, 3.25, 3.5, 3.75, 3.75, 4, 4, 4, 4, 4, 4, 4, 4, 3.75, 3.75, 3.75, 3.75, 3.5, 3.25, 3.25, 3, 2.75, 2.5, 2.5, 2.25, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2.25, 2.25, 2.25, 2.5]};\nvar STR={\nfr:{\n doc_title:\"La courbe des taux\",prev:\"Précédent\",next:\"Suivant\",assets:\"Actif\",liabs:\"Passif\",reset:\"Recommencer\",\n eyebrow:\"Séance 6 · Le roulement et la courbe des taux\",\n title:\"La courbe des taux\",\n sub:\"La dette publique n'est pas un emprunt unique : c'est un empilement de titres de montants, de maturités et de taux différents. Chaque année, une partie arrive à échéance et doit être réempruntée. À quel taux ? Cela dépend de la maturité choisie et du moment : c'est ce que dit la <b>courbe des taux<\/b>.\",\n s1t:\"Un stock de 100 milliards\",\n s1d:\"Une dette de 100 Md€ répartie en six titres. Chaque bloc est un titre : sa <b>largeur<\/b> est son montant, sa <b>hauteur<\/b> son taux, sa <b>couleur<\/b> sa maturité restante (le temps avant son remboursement). Les titres sont rangés du plus court au plus long.\",\n th:[\"Montant\",\"Maturité restante\",\"Taux\",\"Part du stock\",\"Part × taux\",\"Part × maturité\"],\n bn:\"Md€\",bnb:\"Md\",yr:\"an\",yrs:\"ans\",tot:\"Total\",\n calc:\"<b>Taux apparent<\/b> = Σ part × taux = {rc} = <b>{r}<\/b><br><b>Maturité moyenne<\/b> = Σ part × maturité = {mc} = <b>{m}<\/b>\",\n s1n:\"Le taux de chaque titre a été fixé le jour de son émission et ne change plus. Dans cet exemple, plus un titre est long, plus son taux est élevé : les blocs dessinent une marche d'escalier, comme une courbe des taux. La ligne pointillée est le <b>taux apparent<\/b>, la moyenne pondérée des taux.\",\n axr:\"taux\",axa:\"montant cumulé (Md€)\",apl:\"taux apparent\",\n mleg:[\"1 an ou moins\",\"2 à 3 ans\",\"4 à 7 ans\",\"8 à 15 ans\",\"plus de 15 ans\"],\n tagmat:\"à rembourser\",tagnew:\"nouveau\",\n s3t:\"Pourquoi la courbe monte\",\n s3d:\"La courbe des taux donne, à une date donnée, le taux auquel l'État emprunte pour chaque maturité. D'ordinaire, elle <b>monte<\/b> avec la maturité, pour trois raisons.\",\n reasons:[[\"La prime de terme\",\"Prêter longtemps immobilise l'argent et expose à un risque de taux : si les taux montent, le prix d'un titre long baisse beaucoup plus que celui d'un titre court. Le prêteur demande une compensation.\"],\n  [\"Le risque\",\"Plus l'horizon est lointain, plus l'incertitude est grande : inflation, croissance, état des finances publiques. Le prêteur se fait payer cette incertitude.\"],\n  [\"Les anticipations\",\"Un taux à 10 ans reflète les taux courts attendus pendant 10 ans, eux-mêmes guidés par la banque centrale. Si l'on attend une hausse de son taux, la courbe monte davantage ; si l'on attend une baisse, elle peut s'aplatir, voire s'inverser.\"]],\n s4t:\"Les taux de la dette française\",\n s4d:\"À gauche, les rendements des titres d'État français pour chaque maturité disponible. D'ordinaire, les courbes se rangent les unes au-dessus des autres, les plus longues en haut. Déplacez le curseur : à droite s'affiche la courbe des taux à cette date.\",\n c4h:\"Rendement des titres d'État français, en %\",\n c5h:\"Courbe des taux · {d}\",\n ser:{\"0.25\":\"3 mois (BTF)\",\"10\":\"10 ans\"},\n read4:\"<b>{d}<\/b> · {vals}\",\n rinv:\" — <b>Courbe inversée<\/b> : les taux courts dépassent les taux longs, la banque centrale resserre.\",rnorm:\" — Courbe croissante.\",\n aft:\"courbe complète AFT\",\n months:[\"janv.\",\"févr.\",\"mars\",\"avr.\",\"mai\",\"juin\",\"juil.\",\"août\",\"sept.\",\"oct.\",\"nov.\",\"déc.\"],\n s5t:\"Rouler la dette, et le jour où les taux montent\",\n s5d:\"Un nouveau stock de 100 Md€, posé sur la courbe stylisée de droite : taux = 1 % + 0,1 point par année de maturité. Sur chaque titre, « 9/10 ans » se lit : émis à 10 ans, il y a 9 ans ; il arrive à échéance dans un an. La maturité moyenne à l'émission est de 10 ans, et le taux apparent (2 %) est égal au taux à 10 ans de la courbe.\",\n xsl:\"Prime de risque supplémentaire (dégradation de la note)\",\n choose:\"Maturité du nouveau titre :\",\n c6h:\"Courbe des taux stylisée\",axm:\"maturité (ans)\",axy:\"taux d'intérêt (%)\",\n st5:[\"Un an passe\",\"Émettre le nouveau titre\",\"Rembourser l'ancien\",\"La note du pays est dégradée\",\"Un an passe\",\"Choisir la maturité et émettre\",\"Rembourser l'ancien\",\"Si ça dure\"],\n btn:[\"Étape 1 · Avancer d'un an\",\"Étape 2 · Émettre 20 Md€ à 10 ans au taux de {r}\",\"Étape 3 · Rembourser l'ancien titre\",\"Étape 4 · La note du pays est dégradée\",\"Étape 5 · Avancer d'un an\",\"Étape 6 · Émettre 20 Md€ à {m} au taux de {r}\",\"Étape 7 · Rembourser l'ancien titre\",\"Étape 8 · Si ça dure : plusieurs années plus tard\",\"Fin\"],\n ph:[\"Le titre de 20 Md€ marqué <b>9/10 ans<\/b> arrivera à échéance dans un an. Avancez d'un an.\",\n  \"Un an a passé : tous les titres ont vieilli d'un an, et le titre <b>10/10 ans<\/b> arrive à échéance (en noir). L'État ne le rembourse pas avec ses impôts : il émet un nouveau titre à 10 ans, au taux de la courbe.\",\n  \"Le nouveau titre (<b>0/10 ans<\/b>, contour orangé) coexiste un instant avec l'ancien : la dette totale passe à 120 Md€. L'argent levé sert à rembourser l'ancien titre.\",\n  \"L'ancien titre est remboursé. Rien n'a changé : <b>même maturité moyenne, même taux apparent<\/b>. Tant que la courbe ne bouge pas, rouler la dette à maturité constante ne coûte rien de plus.\",\n  \"La note du pays est dégradée : les prêteurs exigent une prime de risque de <b>+{x} point<\/b>, et toute la courbe monte d'un cran (l'ancienne est en pointillés). Le second titre à 10 ans, à <b>9/10 ans<\/b>, arrivera à échéance dans un an. Avancez d'un an.\",\n  \"Le titre <b>10/10 ans<\/b> arrive à échéance. Deux options : <b>garder la maturité<\/b> (émettre à 10 ans, plus cher) ou <b>garder le taux apparent<\/b> en raccourcissant (à {ms}, le nouveau taux reste à 2 %). Choisissez la maturité au curseur, puis émettez.\",\n  \"Le nouveau titre coexiste un instant avec l'ancien. Remboursez l'ancien titre.\",\n  \"C'est fait : selon votre choix, la dette est devenue plus chère ou plus courte. Et si la prime de risque reste là ?\",\n  \"<b>Si ça dure.<\/b> Au fil des années, chaque titre arrive à échéance et il est réemprunté à la même maturité, sur la nouvelle courbe. On a toujours 100 Md€ et une maturité moyenne de 10 ans, mais chaque titre coûte <b>{x} point de plus<\/b> : le taux apparent passe à {r}. La prime de risque a fini par toucher toute la dette, au rythme du roulement.\"],\n k_r:\"Taux apparent\",k_m:\"Maturité moyenne à l'émission\",k_t:\"Dette totale\",\n cmpH:[\"Choix pour le titre qui arrive à échéance\",\"Taux apparent\",\"Maturité moyenne\"],\n optM:\"Garder la maturité : émettre à 10 ans\",optR:\"Garder le taux apparent : émettre à {m}\",optU:\"Votre choix : émettre à {m}\",\n s6t:\"Deux stratégies selon le sens des taux\",\n s6d:\"Le gestionnaire de la dette (en France, l'Agence France Trésor) choisit les maturités qu'il émet. Il arbitre entre le coût d'aujourd'hui et l'exposition aux taux de demain.\",\n strat:[[\"Quand les taux montent\",[[\"A\",\"<b>Accepter la hausse<\/b> : on continue d'émettre aux mêmes maturités, et le taux apparent monte peu à peu, à mesure que les anciens titres sont remplacés.\"],[\"B\",\"<b>Raccourcir les maturités<\/b> : on émet plus court, là où les taux sont plus bas (si la courbe est croissante). Le taux apparent monte moins vite, mais la maturité moyenne baisse et l'État devra réemprunter plus souvent, peut-être plus cher.\"]]],\n  [\"Quand les taux baissent\",[[\"A\",\"<b>Encaisser la baisse<\/b> : on émet aux maturités habituelles et le taux apparent baisse.\"],[\"B\",\"<b>Allonger la maturité<\/b> : on émet plus long pour figer des taux bas pendant des décennies. Le taux apparent baisse moins, mais l'État se protège des hausses futures. Dans les années 2010, la France a émis des titres à 50 ans ; la maturité moyenne de sa dette dépasse 8 ans et demi.\"]]]],\n l_h:\"Le roulement relie la dette d'hier aux taux d'aujourd'hui.\",\n l_x:\"Le taux apparent est une moyenne de taux passés ; il rejoint le taux du marché au rythme des échéances. La maturité des émissions est le seul levier du gestionnaire de la dette : elle arbitre entre le coût immédiat et l'exposition aux taux futurs. Mais le niveau de la courbe, lui, dépend avant tout de la politique monétaire.\",\n foot:\"Stock de 100 Md€ et courbes des taux : exemples illustratifs.\"\n},\nen:{\n doc_title:\"The yield curve\",prev:\"Previous\",next:\"Next\",assets:\"Assets\",liabs:\"Liabilities\",reset:\"Restart\",\n eyebrow:\"Session 6 · Rollover and the yield curve\",\n title:\"The yield curve\",\n sub:\"Public debt is not a single loan: it is a stack of bonds with different amounts, maturities and rates. Every year part of it matures and must be borrowed again. At what rate? It depends on the maturity chosen and on the moment: that is what the <b>yield curve<\/b> tells us.\",\n s1t:\"A stock of 100 billion\",\n s1d:\"A debt of €100bn split into six bonds. Each block is a bond: its <b>width<\/b> is its amount, its <b>height<\/b> its rate, its <b>colour<\/b> its remaining maturity (the time until it is repaid). Bonds are ordered from shortest to longest.\",\n th:[\"Amount\",\"Remaining maturity\",\"Rate\",\"Share of stock\",\"Share × rate\",\"Share × maturity\"],\n bn:\"€bn\",bnb:\"bn\",yr:\"yr\",yrs:\"yrs\",tot:\"Total\",\n calc:\"<b>Effective rate<\/b> = Σ share × rate = {rc} = <b>{r}<\/b><br><b>Average maturity<\/b> = Σ share × maturity = {mc} = <b>{m}<\/b>\",\n s1n:\"Each bond's rate was set on the day it was issued and no longer changes. In this example, the longer a bond, the higher its rate: the blocks form a staircase, like a yield curve. The dashed line is the <b>effective rate<\/b>, the weighted average of rates.\",\n axr:\"rate\",axa:\"cumulative amount (€bn)\",apl:\"effective rate\",\n mleg:[\"1 year or less\",\"2 to 3 years\",\"4 to 7 years\",\"8 to 15 years\",\"over 15 years\"],\n tagmat:\"to repay\",tagnew:\"new\",\n s3t:\"Why the curve slopes upward\",\n s3d:\"The yield curve gives, at a given date, the rate at which the state borrows for each maturity. Usually it <b>rises<\/b> with maturity, for three reasons.\",\n reasons:[[\"The term premium\",\"Lending for long ties up money and carries interest-rate risk: if rates rise, the price of a long bond falls much more than that of a short one. The lender asks for compensation.\"],\n  [\"Risk\",\"The more distant the horizon, the greater the uncertainty: inflation, growth, the state of public finances. The lender charges for that uncertainty.\"],\n  [\"Expectations\",\"A 10-year rate reflects the short rates expected over 10 years, themselves guided by the central bank. If a rise in its rate is expected, the curve rises further; if a cut is expected, it can flatten, or even invert.\"]],\n s4t:\"Rates on French debt\",\n s4d:\"On the left, yields on French government bonds for each available maturity. Usually the lines stack on top of each other, the longest at the top. Move the cursor: the yield curve at that date appears on the right.\",\n c4h:\"Yield on French government bonds, %\",\n c5h:\"Yield curve · {d}\",\n ser:{\"0.25\":\"3-month (BTF)\",\"10\":\"10-year\"},\n read4:\"<b>{d}<\/b> · {vals}\",\n rinv:\" — <b>Inverted curve<\/b>: short rates exceed long rates; the central bank is tightening.\",rnorm:\" — Upward curve.\",\n aft:\"complete AFT curve\",\n months:[\"Jan.\",\"Feb.\",\"Mar.\",\"Apr.\",\"May\",\"Jun.\",\"Jul.\",\"Aug.\",\"Sep.\",\"Oct.\",\"Nov.\",\"Dec.\"],\n s5t:\"Rolling over the debt, and the day rates rise\",\n s5d:\"A new €100bn stock, sitting on the stylised curve on the right: rate = 1% + 0.1 point per year of maturity. On each bond, “9/10 yrs” reads: issued at 10 years, 9 years ago; it matures in one year. The average maturity at issuance is 10 years, and the effective rate (2%) equals the curve's 10-year rate.\",\n xsl:\"Additional risk premium (credit downgrade)\",\n choose:\"Maturity of the new bond:\",\n c6h:\"Stylised yield curve\",axm:\"maturity (years)\",axy:\"interest rate (%)\",\n st5:[\"One year passes\",\"Issue the new bond\",\"Repay the old one\",\"The country's rating is downgraded\",\"One year passes\",\"Choose the maturity and issue\",\"Repay the old one\",\"If it lasts\"],\n btn:[\"Step 1 · Move one year ahead\",\"Step 2 · Issue €20bn at 10 years at {r}\",\"Step 3 · Repay the old bond\",\"Step 4 · The country's rating is downgraded\",\"Step 5 · Move one year ahead\",\"Step 6 · Issue €20bn at {m} at {r}\",\"Step 7 · Repay the old bond\",\"Step 8 · If it lasts: several years later\",\"End\"],\n ph:[\"The €20bn bond marked <b>9/10 yrs<\/b> will mature in one year. Move one year ahead.\",\n  \"A year has passed: every bond is one year older, and the <b>10/10 yrs<\/b> bond matures (in black). The state does not repay it out of taxes: it issues a new 10-year bond at the curve rate.\",\n  \"The new bond (<b>0/10 yrs<\/b>, orange outline) coexists for a moment with the old one: total debt rises to €120bn. The money raised is used to repay the old bond.\",\n  \"The old bond is repaid. Nothing has changed: <b>same average maturity, same effective rate<\/b>. As long as the curve does not move, rolling the debt at constant maturity costs nothing extra.\",\n  \"The country's rating is downgraded: lenders demand a risk premium of <b>+{x} point<\/b>, and the whole curve shifts up a notch (the old one is dashed). The second 10-year bond, at <b>9/10 yrs<\/b>, will mature in one year. Move one year ahead.\",\n  \"The <b>10/10 yrs<\/b> bond matures. Two options: <b>keep the maturity<\/b> (issue at 10 years, at a higher rate) or <b>keep the effective rate<\/b> by shortening (at {ms}, the new rate stays at 2%). Choose the maturity with the slider, then issue.\",\n  \"The new bond coexists for a moment with the old one. Repay the old bond.\",\n  \"Done: depending on your choice, the debt has become more expensive or shorter. And what if the risk premium stays?\",\n  \"<b>If it lasts.<\/b> Over the years, each bond matures and is borrowed again at the same maturity, on the new curve. There is still €100bn and an average maturity of 10 years, but each bond costs <b>{x} point more<\/b>: the effective rate rises to {r}. The risk premium has eventually reached the whole debt, at the pace of rollover.\"],\n k_r:\"Effective rate\",k_m:\"Average maturity at issuance\",k_t:\"Total debt\",\n cmpH:[\"Choice for the maturing bond\",\"Effective rate\",\"Average maturity\"],\n optM:\"Keep the maturity: issue at 10 years\",optR:\"Keep the effective rate: issue at {m}\",optU:\"Your choice: issue at {m}\",\n s6t:\"Two strategies depending on the direction of rates\",\n s6d:\"The debt manager (in France, the Agence France Trésor) chooses the maturities it issues. It trades off today's cost against exposure to tomorrow's rates.\",\n strat:[[\"When rates rise\",[[\"A\",\"<b>Accept the rise<\/b>: keep issuing at the same maturities, and the effective rate rises gradually as old bonds are replaced.\"],[\"B\",\"<b>Shorten maturities<\/b>: issue shorter, where rates are lower (if the curve slopes up). The effective rate rises more slowly, but average maturity falls and the state will have to borrow again more often, perhaps at higher cost.\"]]],\n  [\"When rates fall\",[[\"A\",\"<b>Pocket the fall<\/b>: issue at the usual maturities and the effective rate falls.\"],[\"B\",\"<b>Lengthen maturity<\/b>: issue longer to lock in low rates for decades. The effective rate falls less, but the state protects itself against future rises. In the 2010s France issued 50-year bonds; the average maturity of its debt exceeds eight and a half years.\"]]]],\n l_h:\"Rollover ties yesterday's debt to today's rates.\",\n l_x:\"The effective rate is an average of past rates; it catches up with the market rate as bonds mature. The maturity of new issues is the debt manager's only lever: it trades off immediate cost against exposure to future rates. But the level of the curve depends above all on monetary policy.\",\n foot:\"€100bn stock and yield curves: illustrative examples.\"\n}};\n\n/* ---------- stock et graphique en blocs ---------- */\nvar INIT=[{a:10,m:1,r:1.1},{a:20,m:2,r:1.2},{a:20,m:5,r:1.5},{a:20,m:10,r:2},{a:20,m:20,r:3},{a:10,m:25,r:3.5}];\nfunction clone(p){return p.map(function(b){return {a:b.a,m:b.m,r:b.r,nw:b.nw,mat:b.mat};});}\nfunction tot(p){return p.reduce(function(s,b){return s+b.a;},0);}\nfunction arate(p){var t=tot(p);return p.reduce(function(s,b){return s+b.a*b.r;},0)/t;}\nfunction amat(p){var t=tot(p);return p.reduce(function(s,b){return s+b.a*b.m;},0)/t;}\nfunction mtxt(m){var d=D();if(m<1)return fmt(m*12,0)+(LANG==='fr'?' mois':' mo');return fmt(m,0)+' '+(m===1?d.yr:d.yrs);}\nfunction rtxt(r){return pct(r,(Math.abs(r*10-Math.round(r*10))<1e-9)?(Math.abs(r-Math.round(r))<1e-9?0:1):2);}\nfunction mb(m){return m<=1?0:(m<=3?1:(m<=7?2:(m<=15?3:4)));}\nvar MCOL=['var(--m1)','var(--m2)','var(--m3)','var(--m4)','var(--m5)'],MTXT=['var(--ink)','var(--ink)','#fff','#fff','#fff'];\nfunction mlegend(id){var d=D();$(id).innerHTML=d.mleg.map(function(t,i){return '<span><i style=\"background:'+MCOL[i]+'\"><\/i>'+t+'<\/span>';}).join('');}\nfunction blockChart(svg,p,o){o=o||{};clear(svg);var d=D();var W=640,H=300,L=44,R=14,T=26,B=34,xmax=o.xmax||100,ymax=o.ymax||4;\n  svg.setAttribute('viewBox','0 0 '+W+' '+H);\n  function X(v){return L+v/xmax*(W-L-R);}function Y(v){return H-B-v/ymax*(H-B-T);}\n  var g=mk('g',{'class':'ax'});for(var v=0;v<=ymax;v++){g.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v)}));g.appendChild(mk('text',{x:L-6,y:Y(v)+3.5,'text-anchor':'end'},v+'%'));}\n  for(var a=0;a<=xmax;a+=20){g.appendChild(mk('text',{x:X(a),y:H-B+15,'text-anchor':'middle'},a));}\n  g.appendChild(mk('text',{x:W-R,y:H-4,'text-anchor':'end'},d.axa));svg.appendChild(g);\n  var arr=p.slice().sort(function(x,y){return (x.m-y.m)||((y.k||0)-(x.k||0));});var cx=0,narrow=window.innerWidth<560;\n  arr.forEach(function(b){var x0=X(cx),x1=X(cx+b.a),y=Y(b.r),w=x1-x0;var k=mb(Math.max(b.m,0.01));\n    var fill=b.mat?'#1d252c':MCOL[k],tc=b.mat?'#fff':MTXT[k];\n    svg.appendChild(mk('rect',{x:x0+1,y:y,width:Math.max(1,w-2),height:Y(0)-y,rx:3,style:'fill:'+fill+';'+(b.nw?'stroke:var(--rms);stroke-width:3;':'')}));\n    var cxm=(x0+x1)/2,top=y+16;\n    svg.appendChild(mk('text',{x:cxm,y:top,'text-anchor':'middle',style:'fill:'+tc+';font-family:var(--font-m);font-size:'+(narrow?13:12.5)+'px;font-weight:600'},fmt(b.a,0)+' '+d.bnb));\n    var fs2=w<62?9.5:11;if(w>(narrow?60:40)&&Y(0)-y>48){svg.appendChild(mk('text',{x:cxm,y:top+22,'text-anchor':'middle',style:'fill:'+tc+';font-family:var(--font-m);font-size:'+fs2+'px'},b.mat?d.tagmat:(b.k!=null?b.k+'/'+b.m+' '+d.yrs:mtxt(b.m))));\n      if(!b.mat)svg.appendChild(mk('text',{x:cxm,y:top+36,'text-anchor':'middle',style:'fill:'+tc+';font-family:var(--font-m);font-size:'+fs2+'px'},rtxt(b.r)));}\n    if(b.nw)svg.appendChild(mk('text',{x:cxm,y:y-6,'text-anchor':'middle',style:'fill:var(--rms);font-family:var(--font-m);font-size:11px;font-weight:600'},d.tagnew));\n    cx+=b.a;});\n  var ar=arate(p);svg.appendChild(mk('line',{x1:L,x2:X(cx),y1:Y(ar),y2:Y(ar),style:'stroke:var(--warn);stroke-width:1.6;stroke-dasharray:6 4'}));\n  svg.appendChild(mk('text',{x:L+4,y:Y(ar)-5,style:'fill:var(--warn);font-family:var(--font-m);font-size:11px;font-weight:600'},d.apl+' '+pct(ar,2)));}\n/* ---------- section 1 ---------- */\nfunction renderS1(){var d=D(),p=INIT;blockChart($('b1'),p,{});mlegend('ml1');\n  var h='<tr>'+d.th.map(function(x,i){return '<th'+(i?' class=\"n\"':'')+'>'+x+'<\/th>';}).join('')+'<\/tr>';\n  p.forEach(function(b){h+='<tr><td>'+fmt(b.a,0)+' '+d.bn+'<\/td><td class=\"n\">'+mtxt(b.m)+'<\/td><td class=\"n\">'+pct(b.r,2)+'<\/td><td class=\"n\">'+fmt(b.a/100,2)+'<\/td><td class=\"n\">'+fmt(b.a/100*b.r,3)+'<\/td><td class=\"n\">'+fmt(b.a/100*b.m,1)+'<\/td><\/tr>';});\n ---------- section 2 : courbe stylisée ---------- */\nvar SHN=[2.0,2.1,2.25,2.45,2.6,2.75,2.9,3.0,3.1,3.2,3.3,3.4,3.7,3.9,4.1,4.2];\nfunction renderS3(){var d=D();curveChart($('c3'),[{ten:TEN,v:SHN,col:'var(--rms)',w:3}],{ymin:1,ymax:5,ylab:(LANG==='fr'?\"taux d'intérêt (%)\":'interest rate (%)')});\n  $('reasons').innerHTML=d.reasons.map(function(r,i){return '<div class=\"rcard\"><b class=\"h\"><span class=\"n\">'+(i+1)+'<\/span>'+r[0]+'<\/b>'+r[1]+'<\/div>';}).join('');}\n/* ---------- section 3 : historique (séries par maturité, extensible) ---------- */\nvar BOFF=(2019-1986)*12,NMON=YD.y10.length;\nvar SER=[{m:10,col:'var(--warn)',vals:YD.y10},{m:0.25,col:'var(--econ)',vals:(function(){var a=[];for(var i=0;i<NMON;i++){var k=i-BOFF;a.push(k>=0&&k<YD.btf.length?YD.btf[k]:null);}return a;})()}];\nif(YD.more)YD.more.forEach(function(s){SER.push(s);});\nSER.sort(function(a,b){return b.m-a.m;});\nvar CUR=NMON-1,SNAP={464:'2024',476:'2025',488:'2026'};\nfunction dlabel(i){var d=D();return d.months[i%12]+' '+(1986+Math.floor(i/12));}\nfunction serLabel(s){var d=D();return d.ser[String(s.m)]||(s.m+' '+d.yrs);}\nfunction renderS4(){var d=D();var xt=[];for(var j=0;j<NMON;j+=60)xt.push(j);\n  var o=lineChart($('c4'),{n:NMON,ymin:-1,ymax:11,yticks:[0,2,4,6,8,10],xticks:xt,zero:0,H:270,fx:function(i){return 1986+Math.floor(i/12);},fy:function(v){return v+'%';},series:SER.map(function(s){return {vals:s.vals,color:s.col,w:1.8};})});\n  var sv=$('c4');sv.appendChild(mk('line',{x1:o.X(CUR),x2:o.X(CUR),y1:14,y2:240,style:'stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3'}));\n  $('lg4').innerHTML=SER.map(function(s){return '<span><i style=\"background:'+s.col+'\"><\/i>'+serLabel(s)+'<\/span>';}).join('');\n  $('cur').value=CUR;\n  var pts=SER.filter(function(s){return s.vals[CUR]!=null;}).sort(function(a,b){return a.m-b.m;});\n  var curves=[];var full=SNAP[CUR];\n  if(full)curves.push({ten:TEN,v:YD.curves[full],col:'var(--faint)',w:1.6,dash:'4 4'});\n  curves.push({ten:pts.
