 k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;}\nfunction clear(el){while(el.firstChild)el.removeChild(el.firstChild);}\nfunction fmt(x,d){d=d||0;var neg=x<0;var s=Math.abs(+x).toFixed(d);var p=s.split('.');\n  var sep=LANG==='fr'?' ':',';p[0]=p[0].replace(/\\B(?=(\\d{3})+(?!\\d))/g,sep);\n  s=p.join(LANG==='fr'?',':'.');return (neg?'−':'')+s;}\nfunction sfmt(x,d){return (x>0?'+':'')+fmt(x,d);}\nfunction pct(x,d){return fmt(x,d==null?1:d)+' %';}\nfunction effTheme(){var a=document.documentElement.getAttribute('data-theme');if(a)return a;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}\nfunction applyLang(){\n  var d=D();document.documentElement.lang=LANG;\n  document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');if(d[k]!=null)el.innerHTML=d[k];});\n  var ll=$('langlbl');if(ll)ll.textContent=LANG.toUpperCase();\n  if(d.doc_title)document.title=d.doc_title.replace(/<[^>]+>/g,'');\n  renderAll();\n}\n/* stepper générique : flèches ← → pilotent le dernier utilisé */\nvar STEPPERS=[],LAST_STEPPER=null;\nfunction Stepper(id,n,onStep){\n  var self=this;this.id=id;this.n=n;this.i=0;this.max=0;this.on=onStep;\n  var root=$(id);root.classList.add('stepper');\n  this.prev=document.createElement('button');this.prev.className='btn';\n  this.next=document.createElement('button');this.next.className='btn pri';\n  this.dots=document.createElement('div');this.dots.className='dots';\n  for(var k=0;k<n;k++){(function(k){var b=document.createElement('button');b.textContent=k;b.addEventListener('click',function(){self.go(k);});self.dots.appendChild(b);})(k);}\n  this.prev.addEventListener('click',function(){self.go(self.i-1);});\n  this.next.addEventListener('click',function(){self.go(self.i+1);});\n  var kb=document.createElement('span');kb.className='kbd';kb.textContent='← →';\n  root.appendChild(this.prev);root.appendChild(this.dots);root.appendChild(this.next);root.appendChild(kb);\n  STEPPERS.push(this);\n}\nStepper.prototype.go=function(k){if(k<0||k>=this.n)return;this.i=k;if(k>this.max)this.max=k;LAST_STEPPER=this;this.paint();};\nStepper.prototype.paint=function(){\n  var d=D();this.prev.textContent='← '+d.prev;this.next.textContent=d.next+' →';\n  this.prev.disabled=this.i===0;this.next.disabled=this.i===this.n-1;\n  var self=this;Array.prototype.forEach.call(this.dots.children,function(b,k){b.className=(k===self.i?'on':(k<=self.max?'done':''));});\n  this.on(this.i);\n};\ndocument.addEventListener('keydown',function(e){\n  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;\n  var s=LAST_STEPPER||STEPPERS[0];if(!s)return;\n  if(e.key==='ArrowRight'){s.go(s.i+1);e.preventDefault();}\n  else if(e.key==='ArrowLeft'){s.go(s.i-1);e.preventDefault();}\n});\n/* bilan en T : lines = [[label, value, flags]] flags: 'hl','del','nw' */\nfunction bsHTML(title,color,assets,liabs,opts){\n  opts=opts||{};var d=D();\n  function col(h,arr){var s='<div class=\"col\"><div class=\"ch\">'+h+'<\/div>';\n    if(!arr.length)s+='<div class=\"empty\">—<\/div>';\n    arr.forEach(function(r){var cls='ln'+(r[2]?' '+r[2]:'');s+='<div class=\"'+cls+'\"><span>'+r[0]+'<\/span><span class=\"v\">'+(typeof r[1]==='number'?fmt(r[1]):r[1])+'<\/span><\/div>';});\n    return s+'<\/div>';}\n  return '<div class=\"bs'+(opts.dim?' dim':'')+'\"><div class=\"bh\" style=\"background:'+color+'\"><span>'+title+'<\/span>'+(opts.tag?'<span>'+opts.tag+'<\/span>':'')+'<\/div><div class=\"bt\">'+col(d.assets,assets)+col(d.liabs,liabs)+'<\/div><\/div>';\n}\n/* graphique en lignes */\nfunction lineChart(svg,o){\n  clear(svg);var W=o.W||620,H=o.H||280,L=o.L||46,R=o.R||16,T=o.T||14,B=o.B||30;\n  svg.setAttribute('viewBox','0 0 '+W+' '+H);\n  var n=o.n,ymin=o.ymin,ymax=o.ymax;\n  function X(i){return L+(n<=1?0:i/(n-1))*(W-L-R);}\n  function Y(v){v=Math.max(ymin,Math.min(ymax,v));return H-B-(v-ymin)/(ymax-ymin)*(H-B-T);}\n  var g=mk('g',{'class':'ax'});\n  (o.yticks||[]).forEach(function(v){g.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v)}));g.appendChild(mk('text',{x:L-6,y:Y(v)+3.5,'text-anchor':'end'},o.fy?o.fy(v):fmt(v)));});\n  (o.xticks||[]).forEach(function(i){g.appendChild(mk('text',{x:X(i),y:H-B+16,'text-anchor':'middle'},o.fx?o.fx(i):i));});\n  svg.appendChild(g);\n  if(o.zero!=null&&o.zero>ymin&&o.zero<ymax)svg.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(o.zero),y2:Y(o.zero),style:'stroke:var(--faint);stroke-width:1'}));\n  if(o.band)svg.appendChild(mk('rect',{x:L,y:Y(o.band[1]),width:W-L-R,height:Math.max(0,Y(o.band[0])-Y(o.band[1])),style:'fill:'+o.band[2]+';fill-opacity:.09'}));\n  o.series.forEach(function(s){\n    var dd='';s.vals.forEach(function(v,i){if(v==null||!isFinite(v))return;dd+=(dd?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';});\n    svg.appendChild(mk('path',{d:dd,style:'fill:none;stroke:'+s.color+';stroke-width:'+(s.w||2.4)+';'+(s.dash?'stroke-dasharray:'+s.dash+';':'')+'stroke-linejoin:round'}));\n    if(s.end){var lastI=s.vals.length-1,lv=s.vals[lastI];if(isFinite(lv)){svg.appendChild(mk('circle',{cx:X(lastI),cy:Y(lv),r:3.6,style:'fill:'+s.color}));}}\n  });\n  if(o.ylab)svg.appendChild(mk('text',{x:L,y:T-3,style:'fill:var(--faint);font-size:10.5px;font-family:var(--font-m)'},o.ylab));\n  return {X:X,Y:Y};\n}\nfunction boot(){\n  $('theme').addEventListener('click',function(){var nt=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nt);try{localStorage.setItem(PFX+'_theme',nt);}catch(e){}renderAll();});\n  $('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem(PFX+'_lang',LANG);}catch(e){}applyLang();});\n  if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){renderAll();});}catch(e){}}\n  applyLang();\n}\n\nfunction FR(a,b){return '<span class=\"fr\"><span>'+a+'<\/span><span>'+b+'<\/span><\/span>';}\nvar F=[\n '<i>D<sub>t<\/sub><\/i> = (1 + <i class=\"r\">r<\/i>) <i>D<sub>t−1<\/sub><\/i> − <i class=\"p\">P<sub>t<\/sub><\/i>',\n FR('<i>D<sub>t<\/sub><\/i>','<i>Y<sub>t<\/sub><\/i>')+' = (1 + <i class=\"r\">r<\/i>) '+FR('<i>D<sub>t−1<\/sub><\/i>','<i>Y<sub>t<\/sub><\/i>')+' − '+FR('<i class=\"p\">P<sub>t<\/sub><\/i>','<i>Y<sub>t<\/sub><\/i>'),\n '<i>d<sub>t<\/sub><\/i> = '+FR('1 + <i class=\"r\">r<\/i>','1 + <i class=\"g\">g<\/i>')+' <i>d<sub>t−1<\/sub><\/i> − <i class=\"p\">p<sub>t<\/sub><\/i>',\n '<i class=\"p\">p<\/i>* = '+FR('<i class=\"r\">r<\/i> − <i class=\"g\">g<\/i>','1 + <i class=\"g\">g<\/i>')+' <i>d<\/i> &nbsp;≈&nbsp; (<i class=\"r\">r<\/i> − <i class=\"g\">g<\/i>) <i>d<\/i>',\n '<i class=\"p\">p<\/i>* ≈ (<i class=\"r\">r<\/i> − <i class=\"g\">g<\/i>) <i>d<\/i>'\n];\nvar STR={\nfr:{\n doc_title:\"La course entre r et g\",prev:\"Précédent\",next:\"Suivant\",assets:\"Actif\",liabs:\"Passif\",\n eyebrow:\"Séance 6 · La soutenabilité de la dette publique\",\n title:\"La course entre r et g\",\n sub:\"La dette publique se roule : on ne la rembourse pas, on la renouvelle au taux du moment. La question pertinente n'est donc pas « peut-on la rembourser ? » mais « son poids dans l'économie grandit-il ? ». La réponse tient dans une course entre deux taux : le taux d'intérêt <b>r<\/b> et le taux de croissance du PIB <b>g<\/b>.\",\n s1t:\"L'équation de la dette, pas à pas\",\n s1d:\"Cinq étapes, du stock de dette en euros à la condition de stabilisation.\",\n steps:[\n  [\"La dette d'une année sur l'autre\",\"La dette de cette année est celle de l'an dernier, augmentée des intérêts, diminuée du <b>solde primaire<\/b> <i>P<\/i> : recettes moins dépenses <b>hors intérêts<\/b>. Un excédent primaire (<i>P<\/i> > 0) réduit la dette ; un déficit primaire l'augmente. On parle souvent de « solde budgétaire » : il s'agit bien ici du solde primaire, puisque les intérêts sont déjà comptés dans (1 + <i>r<\/i>).\"],\n  [\"Rapporter la dette au PIB\",\"Une dette de 3 300 milliards ne dit rien seule : il faut la comparer aux revenus sur lesquels l'État prélève. On divise tout par le PIB de l'année, <i>Y<sub>t<\/sub><\/i>.\"],\n  [\"Faire apparaître la croissance\",\"Le PIB de cette année est celui de l'an dernier multiplié par (1 + <i>g<\/i>). En remplaçant, on obtient l'équation du ratio de dette <i>d<\/i> = <i>D<\/i>/<i>Y<\/i>, avec <i>p<\/i> = <i>P<\/i>/<i>Y<\/i>. <i>r<\/i> et <i>g<\/i> sont <b>nominaux<\/b> : le taux payé et la croissance en euros courants, inflation comprise.\"],\n  [\"La condition de stabilisation\",\"Le ratio est stable si <i>d<sub>t<\/sub><\/i> = <i>d<sub>t−1<\/sub><\/i>. On en tire le solde primaire <i>p<\/i>* qui stabilise la dette. Comme <i>g<\/i> dépasse rarement quelques pourcents, 1 + <i>g<\/i> ≈ 1.\"],\n  [\"Trois cas\",\"Tout dépend du signe de <i>r<\/i> − <i>g<\/i>. Pour réduire le ratio, il faut faire mieux que <i>p<\/i>* ; pour le stabiliser, il suffit de l'atteindre.\"]\n ],\n defs:[[\"D\",\"dette publique, en euros\"],[\"r\",\"taux d'intérêt moyen payé sur la dette\"],[\"P\",\"solde primaire (hors intérêts)\"],[\"t\",\"l'année\"]],\n cases:[[\"r < g\",\"var(--eco)\",\"Un <b>déficit<\/b> primaire est compatible avec une dette stable, jusqu'à (<i>g<\/i> − <i>r<\/i>) × <i>d<\/i>. La croissance « dilue » la dette plus vite que les intérêts ne la gonflent.\"],\n  [\"r = g\",\"var(--rms)\",\"Il faut un budget primaire <b>à l'équilibre<\/b> pour stabiliser le ratio. Situation fragile : le moindre écart fait basculer.\"],\n  [\"r > g\",\"var(--warn)\",\"Il faut un <b>excédent<\/b> primaire. Sans lui, la dette croît d'elle-même : c'est l'effet « boule de neige ».\"]],\n ex:\"Exemple avec <i>d<\/i> = 100 % du PIB : si <i>r<\/i> − <i>g<\/i> = −1 point, un déficit primaire de 1 % du PIB stabilise la dette ; si <i>r<\/i> − <i>g<\/i> = +1 point, il faut un excédent de 1 %.\",\n b_t:\"Deux grandeurs qui gonflent\",\n b_d:\"Le ratio de dette est une fraction. Les intérêts font gonfler le numérateur <b>D<\/b> au rythme <b>r<\/b> ; la croissance fait gonfler le dénominateur <b>Y<\/b> au rythme <b>g<\/b>. Supposons le solde primaire nul, pour ne garder que ces deux forces. Ce qui compte n'est pas que la dette augmente, mais <b>laquelle des deux grandeurs gonfle le plus vite<\/b>. Réglez r et g, puis lancez le temps.\",\n b_pz:[[\"lo\",\"r < g\"],[\"eq\",\"r = g\"],[\"hi\",\"r > g\"]],\n b_r:\"Taux d'intérêt r, %\",b_g:\"Croissance nominale g, %\",\n b_play:\"▶ Lancer\",b_pause:\"❚❚ Pause\",b_again:\"↻ Relancer\",b_reset:\"Réinitialiser\",\n b_yr:\"Année {t}\",\n b_rates:\"<b class='dd'>D<\/b> : ×{fd} depuis le départ (intérêts à {r} %)<br><b class='yy'>Y<\/b> : ×{fy} depuis le départ (croissance de {g} %)\",\n bb_up:\"La dette gonfle plus vite que le PIB : le ratio <b>monte<\/b>, alors que l'État ne fait aucun déficit primaire.\",\n bb_dn:\"La dette augmente en euros, et pourtant le ratio <b>baisse<\/b> : le PIB gonfle plus vite qu'elle.\",\n bb_eq:\"Les deux gonflent au même rythme : le ratio <b>ne bouge pas<\/b>, quelle que soit la hausse de la dette en euros.\",\n b_next:\"Reste un seul autre levier : le <b>solde primaire<\/b>. Un déficit primaire ajoute chaque année au numérateur, un excédent en retire. C'est ce qu'ajoute le simulateur.\",\n s2t:\"Le simulateur de trajectoire\",\n s2d:\"Réglez la dette de départ, le taux, la croissance et le solde primaire : la courbe montre le ratio de dette sur 30 ans.\",\n pz:[[\"fr\",\"France 2024\"],[\"rg\",\"r < g, déficit stabilisant\"],[\"snow\",\"r > g, budget équilibré\"],[\"zero\",\"Croissance nulle\"]],\n ptxt:{fr:\"En 2024, la France a eu un déficit primaire d'environ 3,8 % du PIB (5,8 % de déficit, dont 2,0 % d'intérêts), pour un taux apparent d'environ 1,9 % et une croissance nominale de 3,5 %. Un déficit primaire de 1,7 % aurait suffi à stabiliser la dette ; elle est passée de 109,8 % à 113 % du PIB.\",\n  rg:\"Mêmes valeurs que la France en 2024, sauf le solde primaire : un déficit primaire de 1,7 % du PIB au lieu de 3,8 %. Comme r reste inférieur à g (1,9 % contre 3,5 %), ce déficit suffit à maintenir la dette autour de 113 % du PIB : réduire le déficit primaire d'environ 2 points de PIB suffit, sans viser l'équilibre budgétaire.\",\n  snow:\"Le taux dépasse la croissance de 3 points. Même sans aucun déficit primaire, la dette rapportée au PIB grimpe : les intérêts s'ajoutent à la dette plus vite que le PIB ne grandit.\",\n  zero:\"Sans croissance, il n'y a plus rien pour diluer la dette : le solde primaire stabilisant devient simplement <i>r<\/i> × <i>d<\/i>. Avec 2 % de taux et 100 % de dette, il faut 2 % du PIB d'excédent primaire, chaque année.\"},\n sl:{d0:\"Dette de départ, % du PIB\",r:\"Taux d'intérêt r, %\",g:\"Croissance nominale g, %\",p:\"Solde primaire p, % du PIB\"},\n k_ps:\"Solde primaire stabilisant p*\",k_gap:\"Écart p − p*\",k_10:\"Dette dans 10 ans\",k_30:\"Dette dans 30 ans\",\n lg_d:\"ratio de dette\",lg_d0:\"niveau de départ\",\n v_up:\"Le solde primaire ({p} %) est en dessous de ce qu'il faudrait ({ps} %) : le ratio <b>monte<\/b>.\",\n v_dn:\"Le solde primaire ({p} %) dépasse le niveau stabilisant ({ps} %) : le ratio <b>baisse<\/b>.\",\n v_eq:\"Le solde primaire est au niveau stabilisant : le ratio <b>reste stable<\/b>.\",\n b_up:\"en hausse\",b_dn:\"en baisse\",b_eq:\"stable\",\n s3t:\"Pas de seuil magique\",\n s3d:\"Le débat public cherche souvent un seuil de dette à ne pas franchir. L'équation montre pourquoi il n'en existe pas : ce qui compte est l'écart <b>r − g<\/b>, et ce qui fixe <b>r<\/b>.\",\n myths:[[\"60 %\",\"Le critère de Maastricht\",\"Fixé en 1992, il reprenait à peu près la dette moyenne des pays de la Communauté à l'époque. C'est une convention politique, pas un résultat d'économie.\"],\n  [\"90 %\",\"Le seuil de Reinhart et Rogoff\",\"En 2010, deux économistes concluent qu'au-delà de 90 % du PIB la croissance chute. En 2013, Herndon, Ash et Pollin retrouvent des erreurs de calcul et des exclusions de données : le seuil disparaît.\"],\n  [\"≈ 237 %\",\"Le Japon\",\"La dette la plus élevée des pays riches (FMI, 2024), sans crise : des taux proches de zéro pendant des décennies, une banque centrale qui détient environ la moitié des titres publics, des créanciers surtout résidents, une dette dans sa propre monnaie.\"],\n  [\"2010-2012\",\"La Grèce et la zone euro\",\"Une dette dans une monnaie que l'État n'émet pas, et pas d'acheteur en dernier ressort : quand les créanciers fuient, <i>r<\/i> s'envole pendant que <i>g<\/i> devient négatif. L'austérité imposée a fait chuter le PIB d'environ un quart, et le ratio de dette a continué de monter.\"]],\n z_t:\"Sans croissance, tout se joue sur r\",\n z_next:\"La soutenabilité de la dette ne dépend alors plus que du <b>taux d'intérêt<\/b>. Qui le fixe ? Ce n'est pas l'État. C'est l'objet de l'outil suivant : la banque centrale et la courbe des taux.\",\n z_d:\"Si la transition écologique impose la sobriété, la croissance nominale <i>g<\/i> sera faible, voire nulle. Le solde primaire qui stabilise la dette devient alors simplement :\",\n z_d2:\"La soutenabilité de la dette ne dépend plus que du taux d'intérêt. Deux regards sur ce taux. À gauche, la <b>vision longue<\/b> : le taux à 10 ans de l'État français depuis quarante ans. À droite, la <b>vision courte<\/b> : depuis 2019, le taux auquel la France emprunte à 3 mois suit presque exactement le taux de la BCE. Ce taux, l'État ne le fixe pas : c'est la <b>banque centrale<\/b> qui le pilote.\",\n z_lt:\"Vision longue : le taux à 10 ans, 1986-2026\",z_st:\"Vision courte : taux de la BCE et taux à 3 mois, 2019-2026\",z_lg3:\"taux à 10 ans de l'État français (moyenne mensuelle)\",\n z_ltx:\"En quarante ans, le taux à 10 ans est passé de 10 % à moins de zéro (−0,34 % en août 2019), puis il est remonté à partir de 2022. En octobre 2026, à 4,9 %, il retrouve son niveau de 2002.\",\n z_stx:\"Le taux à 3 mois colle au taux de la BCE : corrélation de 0,996 depuis 2019.\",\n z_k1:\"Corrélation, 2019-2026\",z_k2:\"Écart moyen\",z_k3:\"Taux BCE, 2022 → 2023\",z_k4:\"Croissance prévue en 2026\",\n z_k2v:\"0,16 point\",z_k3v:\"−0,50 → 4,00 %\",z_k3s:\"en 14 mois\",z_k4s:\"zone euro, projection BCE (sept. 2026)\",\n z_lg1:\"taux de la facilité de dépôt de la BCE\",z_lg2:\"rendement des bons du Trésor français à 3 mois (BTF, moyenne mensuelle des adjudications)\",\n z_cases:[[\"2022-2023\",\"var(--warn)\",\"Pour freiner l'inflation née du choc énergétique, la BCE relève son taux de 4,5 points en 14 mois. Le taux des BTF suit, et anticipe même chaque décision. Le budget n'y est pour rien.\"],\n  [\"2024-2025\",\"var(--eco)\",\"La BCE redescend à 2 % : le taux à 3 mois redescend avec elle, au même rythme.\"],\n  [\"2026\",\"var(--rms)\",\"Nouveau choc énergétique (conflit au Moyen-Orient) : la BCE remonte à 2,50 % en juin et septembre, alors qu'elle prévoit une croissance de 0,9 % seulement. La hausse de la charge d'intérêts qui s'annonce est une conséquence de la politique monétaire, transmise peu à peu à toute la dette par le roulement (partie IV).\"]],\n z_deb_h:\"Un débat ouvert : coordonner budget et banque centrale ?\",\n z_deb:\"Dans une économie sans croissance, la politique budgétaire dépend donc de la politique monétaire. Pour les uns, il faut en tirer les conséquences : coordonner explicitement gouvernement et banque centrale, par exemple en garantissant des taux bas pour la dette qui finance la transition. Pour les autres, ce serait la fin de l'indépendance de la banque centrale, avec un risque d'inflation et de perte de crédibilité. Dans les deux cas, la question n'est plus seulement « combien l'État dépense-t-il ? », mais « à quel taux, et qui le décide ? ».\",\n l_h:\"La dette publique se juge à la course entre r et g, pas à son niveau.\",\n l_x:\"La dette privée porte le risque systémique ; l'épargne des ménages exige qu'un autre secteur dépense plus qu'il ne gagne ; l'État joue ce rôle et roule sa dette sans jamais la rembourser. Sa soutenabilité ne dépend alors pas de la seule vertu budgétaire, mais de l'écart entre le taux auquel il emprunte et la croissance de ses recettes — donc, en dernier ressort, de la banque centrale.\",\n foot:\"France 2024 : Insee, comptes nationaux des administrations publiques (mars 2025) : déficit 5,8 % du PIB, charge d'intérêts 58 Md€ (2,0 % du PIB), dette 113,0 % du PIB, 109,8 % en 2023 ; taux apparent ≈ 58 / 3 102,5.\"\n},\nen:{\n doc_title:\"The race between r and g\",prev:\"Previous\",next:\"Next\",assets:\"Assets\",liabs:\"Liabilities\",\n eyebrow:\"Session 6 · Public debt sustainability\",\n title:\"The race between r and g\",\n sub:\"Public debt is rolled over: it is not repaid, it is renewed at the going rate. So the relevant question is not “can it be repaid?” but “is its weight in the economy growing?”. The answer lies in a race between two rates: the interest rate <b>r<\/b> and the GDP growth rate <b>g<\/b>.\",\n s1t:\"The debt equation, step by step\",\n s1d:\"Five steps, from the stock of debt in euros to the stabilisation condition.\",\n steps:[\n  [\"Debt from one year to the next\",\"This year's debt is last year's, plus interest, minus the <b>primary balance<\/b> <i>P<\/i>: revenue minus spending <b>excluding interest<\/b>. A primary surplus (<i>P<\/i> > 0) reduces debt; a primary deficit increases it. People often say “budget balance”: here it is indeed the primary balance, since interest is already counted in (1 + <i>r<\/i>).\"],\n  [\"Relating debt to GDP\",\"A debt of 3,300 billion means nothing on its own: it must be compared with the incomes the state taxes. Divide everything by the year's GDP, <i>Y<sub>t<\/sub><\/i>.\"],\n  [\"Bringing growth in\",\"This year's GDP is last year's multiplied by (1 + <i>g<\/i>). Substituting gives the equation of the debt ratio <i>d<\/i> = <i>D<\/i>/<i>Y<\/i>, with <i>p<\/i> = <i>P<\/i>/<i>Y<\/i>. <i>r<\/i> and <i>g<\/i> are <b>nominal<\/b>: the rate paid and growth in current euros, inflation included.\"],\n  [\"The stabilisation condition\",\"The ratio is stable if <i>d<sub>t<\/sub><\/i> = <i>d<sub>t−1<\/sub><\/i>. This gives the primary balance <i>p<\/i>* that stabilises debt. Since <i>g<\/i> rarely exceeds a few percent, 1 + <i>g<\/i> ≈ 1.\"],\n  [\"Three cases\",\"Everything depends on the sign of <i>r<\/i> − <i>g<\/i>. To reduce the ratio, one must do better than <i>p<\/i>*; to stabilise it, reaching it is enough.\"]\n ],\n defs:[[\"D\",\"public debt, in euros\"],[\"r\",\"average interest rate paid on the debt\"],[\"P\",\"primary balance (excluding interest)\"],[\"t\",\"the year\"]],\n cases:[[\"r < g\",\"var(--eco)\",\"A primary <b>deficit<\/b> is compatible with stable debt, up to (<i>g<\/i> − <i>r<\/i>) × <i>d<\/i>. Growth “dilutes” the debt faster than interest swells it.\"],\n  [\"r = g\",\"var(--rms)\",\"A <b>balanced<\/b> primary budget is needed to stabilise the ratio. A fragile situation: the slightest gap tips it over.\"],\n  [\"r > g\",\"var(--warn)\",\"A primary <b>surplus<\/b> is needed. Without it, debt grows by itself: the “snowball” effect.\"]],\n ex:\"Example with <i>d<\/i> = 100% of GDP: if <i>r<\/i> − <i>g<\/i> = −1 point, a primary deficit of 1% of GDP stabilises debt; if <i>r<\/i> − <i>g<\/i> = +1 point, a surplus of 1% is needed.\",\n b_t:\"Two quantities that inflate\",\n b_d:\"The debt ratio is a fraction. Interest inflates the numerator <b>D<\/b> at rate <b>r<\/b>; growth inflates the denominator <b>Y<\/b> at rate <b>g<\/b>. Assume a zero primary balance, to keep only these two forces. What matters is not that debt rises, but <b>which of the two quantities inflates faster<\/b>. Set r and g, then start the clock.\",\n b_pz:[[\"lo\",\"r < g\"],[\"eq\",\"r = g\"],[\"hi\",\"r > g\"]],\n b_r:\"Interest rate r, %\",b_g:\"Nominal growth g, %\",\n b_play:\"▶ Start\",b_pause:\"❚❚ Pause\",b_again:\"↻ Restart\",b_reset:\"Reset\",\n b_yr:\"Year {t}\",\n b_rates:\"<b class='dd'>D<\/b>: ×{fd} since the start (interest at {r}%)<br><b class='yy'>Y<\/b>: ×{fy} since the start (growth of {g}%)\",\n bb_up:\"Debt inflates faster than GDP: the ratio <b>rises<\/b>, although the state runs no primary deficit.\",\n bb_dn:\"Debt rises in euros, and yet the ratio <b>falls<\/b>: GDP inflates faster than it.\",\n bb_eq:\"Both inflate at the same pace: the ratio <b>does not move<\/b>, however much debt rises in euros.\",\n b_next:\"Only one other lever remains: the <b>primary balance<\/b>. A primary deficit adds to the numerator each year, a surplus takes from it. This is what the simulator adds.\",\n s2t:\"The trajectory simulator\",\n s2d:\"Set the starting debt, the rate, growth and the primary balance: the curve shows the debt ratio over 30 years.\",\n pz:[[\"fr\",\"France 2024\"],[\"rg\",\"r < g, stabilising deficit\"],[\"snow\",\"r > g, balanced budget\"],[\"zero\",\"Zero growth\"]],\n ptxt:{fr:\"In 2024 France ran a primary deficit of about 3.8% of GDP (5.8% deficit, of which 2.0% interest), with an effective rate of about 1.9% and nominal growth of 3.5%. A primary deficit of 1.7% would have been enough to stabilise debt; it rose from 109.8% to 113% of GDP.\",\n  rg:\"Same values as France in 2024, except the primary balance: a primary deficit of 1.7% of GDP instead of 3.8%. Since r stays below g (1.9% against 3.5%), this deficit is enough to hold debt around 113% of GDP: cutting the primary deficit by about 2 points of GDP is enough, with no need to balance the budget.\",\n  snow:\"The rate exceeds growth by 3 points. Even with no primary deficit at all, debt relative to GDP climbs: interest adds to the debt faster than GDP grows.\",\n  zero:\"With no growth, nothing dilutes the debt any more: the stabilising primary balance becomes simply <i>r<\/i> × <i>d<\/i>. With a 2% rate and 100% debt, a primary surplus of 2% of GDP is needed, every year.\"},\n sl:{d0:\"Starting debt, % of GDP\",r:\"Interest rate r, %\",g:\"Nominal growth g, %\",p:\"Primary balance p, % of GDP\"},\n k_ps:\"Stabilising primary balance p*\",k_gap:\"Gap p − p*\",k_10:\"Debt in 10 years\",k_30:\"Debt in 30 years\",\n lg_d:\"debt ratio\",lg_d0:\"starting level\",\n v_up:\"The primary balance ({p}%) is below what is needed ({ps}%): the ratio <b>rises<\/b>.\",\n v_dn:\"The primary balance ({p}%) exceeds the stabilising level ({ps}%): the ratio <b>falls<\/b>.\",\n v_eq:\"The primary balance is at the stabilising level: the ratio <b>stays stable<\/b>.\",\n b_up:\"rising\",b_dn:\"falling\",b_eq:\"stable\",\n s3t:\"No magic threshold\",\n s3d:\"Public debate often looks for a debt threshold not to be crossed. The equation shows why there is none: what matters is the gap <b>r − g<\/b>, and what sets <b>r<\/b>.\",\n myths:[[\"60%\",\"The Maastricht criterion\",\"Set in 1992, it roughly matched the average debt of Community countries at the time. A political convention, not an economic result.\"],\n  [\"90%\",\"The Reinhart-Rogoff threshold\",\"In 2010 two economists concluded that above 90% of GDP growth collapses. In 2013 Herndon, Ash and Pollin found spreadsheet errors and data exclusions: the threshold vanished.\"],\n  [\"≈ 237%\",\"Japan\",\"The highest debt among rich countries (IMF, 2024), with no crisis: rates close to zero for decades, a central bank holding about half of government bonds, mostly domestic creditors, debt in its own currency.\"],\n  [\"2010-2012\",\"Greece and the euro area\",\"Debt in a currency the state does not issue, and no buyer of last resort: when creditors flee, <i>r<\/i> soars while <i>g<\/i> turns negative. The austerity imposed cut GDP by about a quarter, and the debt ratio kept rising.\"]],\n z_t:\"Without growth, everything hinges on r\",\n z_next:\"Debt sustainability then depends on the <b>interest rate<\/b> alone. Who sets it? Not the state. This is the subject of the next tool: the central bank and the yield curve.\",\n z_d:\"If the ecological transition demands sufficiency, nominal growth <i>g<\/i> will be low, even zero. The primary balance that stabilises debt then becomes simply:\",\n z_d2:\"Debt sustainability then depends on the interest rate alone. Two views of that rate. On the left, the <b>long view<\/b>: the French 10-year government rate over forty years. On the right, the <b>short view<\/b>: since 2019, the rate at which France borrows for 3 months has followed the ECB rate almost exactly. The state does not set that rate: the <b>central bank<\/b> steers it.\",\n z_lt:\"Long view: the 10-year rate, 1986-2026\",z_st:\"Short view: ECB rate and 3-month rate, 2019-2026\",z_lg3:\"French 10-year government rate (monthly average)\",\n z_ltx:\"In forty years the 10-year rate went from 10% to below zero (−0.34% in August 2019), then rose again from 2022. In October 2026, at 4.9%, it is back to its 2002 level.\",\n z_stx:\"The 3-month rate tracks the ECB rate: correlation of 0.996 since 2019.\",\n z_k1:\"Correlation, 2019-2026\",z_k2:\"Average gap\",z_k3:\"ECB rate, 2022 → 2023\",z_k4:\"Growth projected for 2026\",\n z_k2v:\"0.16 point\",z_k3v:\"−0.50 → 4.00%\",z_k3s:\"in 14 months\",z_k4s:\"euro area, ECB projection (Sept. 2026)\",\n z_lg1:\"ECB deposit facility rate\",z_lg2:\"yield on French 3-month Treasury bills (BTF, monthly average of auctions)\",\n z_cases:[[\"2022-2023\",\"var(--warn)\",\"To curb inflation born of the energy shock, the ECB raises its rate by 4.5 points in 14 months. The BTF yield follows, and even anticipates each decision. The budget plays no part in it.\"],\n  [\"2024-2025\",\"var(--eco)\",\"The ECB comes back down to 2%: the 3-month yield comes down with it, at the same pace.\"],\n  [\"2026\",\"var(--rms)\",\"A new energy shock (conflict in the Middle East): the ECB goes back up to 2.50% in June and September, while projecting growth of only 0.9%. The coming rise in the interest burden is a consequence of monetary policy, passed on gradually to the whole debt through rollover (part IV).\"]],\n z_deb_h:\"An open debate: coordinating the budget and the central bank?\",\n z_deb:\"In an economy without growth, fiscal policy thus depends on monetary policy. For some, the conclusion follows: explicitly coordinate government and central bank, for instance by guaranteeing low rates on the debt that finances the transition. For others, this would end central bank independence, with a risk of inflation and lost credibility. Either way, the question is no longer only “how much does the state spend?” but “at what rate, and who decides?”.\",\n l_h:\"Public debt is judged by the race between r and g, not by its level.\",\n l_x:\"Private debt carries systemic risk; household saving requires another sector to spend more than it earns; the state plays that role and rolls its debt over without ever repaying it. Its sustainability then depends not on fiscal virtue alone, but on the gap between the rate at which it borrows and the growth of its revenue — hence, in the last resort, on the central bank.\",\n foot:\"France 2024: Insee, general government accounts (March 2025): deficit 5.8% of GDP, interest 58 bn€ (2.0% of GDP), debt 113.0% of GDP, 109.8% in 2023; effective rate ≈ 58 / 3,102.5.\"\n}};\n\nvar st1=null;\nfunction renderS1(k){var d=D();$('st1t').innerHTML=d.steps[k][0];$('st1f').innerHTML=F[k];$('st1x').innerHTML=d.steps[k][1];\n  var ex='';\n  if(k===0)ex='<div class=\"defs\">'+d.defs.map(function(x){return '<div><b>'+x[0]+'<\/b>'+x[1]+'<\/div>';}).join('')+'<\/div>';\n  if(k===4)ex='<div class=\"cases\">'+d.cases.map(function(c){return '<div class=\"case\" style=\"border-top:3px solid '+c[1]+'\"><b class=\"h\" style=\"color:'+c[1]+'\">'+c[0]+'<\/b>'+c[2]+'<\/div>';}).join('')+'<\/div><p class=\"steptext\" style=\"margin-top:10px\">'+d.ex+'<\/p>';\n  $('st1extra').innerHTML=ex;}\nvar Q={d0:113,r:1.9,g:3.5,p:-3.8},PREM=false,BC=false,CUR='fr';\nvar PZ={fr:{d0:113,r:1.9,g:3.5,p:-3.8,prem:false,bc:false},rg:{d0:113,r:1.9,g:3.5,p:-1.7,prem:false,bc:false},snow:{d0:100,r:5,g:2,p:0,prem:false,bc:false},zero:{d0:100,r:2,g:0,p:0,prem:false,bc:false}};\nvar RG={d0:[0,250,1],r:[-1,10,0.1],g:[-3,8,0.1],p:[-8,6,0.1]};\nfunction rate(dprev){return Q.r;}\nfunction sim(){var d=[Q.d0],rr=[rate(Q 0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, -0.5, 0, 0.75, 0.75, 1.5, 1.5, 2, 2.5, 2.5, 3, 3.25, 3.25, 3.5, 3.75, 3.75, 4, 4, 4, 4, 4, 4, 4, 4, 3.75, 3.75, 3.75, 3.75, 3.5, 3.25, 3.25, 3, 2.75, 2.5, 2.5, 2.25, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2.25, 2.25, 2.25, 2.5]};\nvar STR={\nfr:{\n doc_title:\"La banque centrale et les taux\",prev:\"Précédent\",next:\"Suivant\",assets:\"Actif\",liabs:\"Passif\",\n eyebrow:\"Séance 6 · Politique monétaire et soutenabilité de la dette\",\n title:\"La banque centrale et les taux\",\n sub:\"Sans croissance, la soutenabilité de la dette ne dépend plus que du taux d'intérêt. Qui le fixe ? Pour les taux courts, la banque centrale, directement. Pour les taux longs, elle peut aussi intervenir. Au bout du compte, c'est potentiellement <b>toute la courbe des taux<\/b> qu'elle peut piloter.\",\n s1t:\"La vision longue : quarante ans de taux à 10 ans\",\n s1d:\"Le taux auquel l'État français emprunte à 10 ans, en moyenne mensuelle, depuis 1986.\",\n c1h:\"Taux à 10 ans de l'État français, en %\",\n s1x:\"En quarante ans, le taux à 10 ans est passé de 10 % à moins de zéro (−0,34 % en août 2019). Depuis 2022, il est remonté de 0,3 % à <b>4,9 %<\/b> en octobre 2026, son niveau de 2002. La hausse récente est forte, mais elle ramène le taux à des niveaux qui étaient la norme avant 2010.\",\n s2t:\"La BCE pilote les taux courts\",\n s2d:\"Le taux de la facilité de dépôt de la BCE et le taux auquel l'État français emprunte à 3 mois, en moyenne mensuelle, depuis 2019.\",\n c2h:\"Taux de la BCE et taux à 3 mois, en %\",lg1:\"taux de la BCE (facilité de dépôt)\",lg2:\"taux à 3 mois de l'État français\",\n corr:\"Les deux courbes sont presque confondues : corrélation de 0,996, écart moyen de 0,16 point. Le taux court de la dette publique, c'est le taux de la BCE.\",\n months:[\"janv.\",\"févr.\",\"mars\",\"avr.\",\"mai\",\"juin\",\"juil.\",\"août\",\"sept.\",\"oct.\",\"nov.\",\"déc.\"],\n cases:[[\"2022-2023\",\"var(--warn)\",\"Pour freiner l'inflation née du choc énergétique, la BCE relève son taux de 4,5 points en 14 mois. Le taux à 3 mois suit, et anticipe même chaque décision. Le budget n'y est pour rien.\"],\n  [\"2024-2025\",\"var(--eco)\",\"La BCE redescend à 2 % : le taux à 3 mois redescend avec elle, au même rythme.\"],\n  [\"2026\",\"var(--rms)\",\"Nouveau choc énergétique : la BCE remonte à 2,50 % en juin et septembre, alors qu'elle prévoit une croissance de 0,9 %. La hausse de la charge d'intérêts qui s'annonce vient de la politique monétaire, transmise peu à peu à toute la dette par le roulement.\"]],\n s3t:\"Taux directeur et rachats de titres : deux leviers sur la courbe\",\n s3d:\"Deux curseurs, deux leviers. Le <b>taux directeur<\/b> tient l'extrémité courte : le taux à 3 mois le suit, et l'extrémité longue bouge un peu, par les anticipations. Les <b>achats de titres longs<\/b> sur le marché secondaire (en zone euro, la banque centrale n'a pas le droit de les acheter directement au Trésor) font monter leur prix et baisser leur rendement : l'extrémité longue descend, la courbe s'aplatit.\",\n ql:\"Achats de titres longs par la banque centrale\",\n pxh:\"Un titre à 10 ans : quand son prix monte, son rendement baisse\",\n pxt:\"Le titre verse toujours 5 € par an, quoi qu'il arrive. Quand la banque centrale en achète, la demande monte et le prix aussi : ces 5 € rapportent moins en proportion. À l'inverse, quand le taux directeur monte, les titres déjà émis perdent de la valeur : leur prix baisse et leur rendement s'aligne sur les nouveaux taux.\",\n px:[\"Coupon annuel\",\"Prix du titre\",\"Rendement\"],pxs:[\"fixé à l'émission\",\"sur le marché\",\"coupon / prix\"],\n pcalc:\"Rendement ≈ 5 € / {p} € = <b>{y}<\/b>\",\n qnone:\"aucun\",qmax:\"massifs\",\n c4h:\"Courbe des taux stylisée\",lgq1:\"après vos réglages\",lgq0:\"au départ (BCE à 2,50 %, sans achats)\",pl:\"Taux directeur de la BCE\",read3:\"3 mois <b>{s}<\/b> · 10 ans <b>{l}<\/b> · écart entre les deux <b>{g}<\/b>\",pts:\"point\",\n l_h:\"Le taux de la dette publique est d'abord une décision de politique monétaire.\",\n l_x:\"Le taux court suit le taux de la banque centrale ; le taux long peut être abaissé par ses achats de titres. La soutenabilité de la dette, dans une économie qui ne croît plus, dépend donc moins de la vertu budgétaire que des choix de la banque centrale, et de leur coordination avec ceux de l'État.\",\n foot:\"Taux à 10 ans : Banque de France, « Taux de l'emprunt phare à 10 ans - France » (FM.M.FR.EUR.FR2.BB.FR10YT_RR.YLD), moyennes mensuelles 1986-2026. Taux de la BCE : décisions de politique monétaire (dernière : 10 septembre 2026). Taux à 3 mois : résultats hebdomadaires des adjudications de BTF (Agence France Trésor, via metatrader.com et investing.com), moyennes mensuelles, septembre 2026 manquant. Croissance 2026 : projections BCE de septembre 2026. Courbes et prix du titre : modèle stylisé, à visée pédagogique.\"\n},\nen:{\n doc_title:\"The central bank and interest rates\",prev:\"Previous\",next:\"Next\",assets:\"Assets\",liabs:\"Liabilities\",\n eyebrow:\"Session 6 · Monetary policy and debt sustainability\",\n title:\"The central bank and interest rates\",\n sub:\"Without growth, debt sustainability depends on the interest rate alone. Who sets it? For short rates, the central bank, directly. For long rates, it can intervene too. In the end, it can potentially steer <b>the whole yield curve<\/b>.\",\n s1t:\"The long view: forty years of 10-year rates\",\n s1d:\"The rate at which the French state borrows for 10 years, monthly average, since 1986.\",\n c1h:\"French 10-year government rate, %\",\n s1x:\"In forty years the 10-year rate went from 10% to below zero (−0.34% in August 2019). Since 2022 it has risen from 0.3% to <b>4.9%<\/b> in October 2026, its 2002 level. The recent rise is steep, but it brings the rate back to levels that were the norm before 2010.\",\n s2t:\"The ECB steers short rates\",\n s2d:\"The ECB deposit facility rate and the rate at which the French state borrows for 3 months, monthly average, since 2019.\",\n c2h:\"ECB rate and 3-month rate, %\",lg1:\"ECB rate (deposit facility)\",lg2:\"French 3-month government rate\",\n corr:\"The two lines almost coincide: correlation of 0.996, average gap of 0.16 point. The short rate on public debt is the ECB rate.\",\n months:[\"Jan.\",\"Feb.\",\"Mar.\",\"Apr.\",\"May\",\"Jun.\",\"Jul.\",\"Aug.\",\"Sep.\",\"Oct.\",\"Nov.\",\"Dec.\"],\n cases:[[\"2022-2023\",\"var(--warn)\",\"To curb inflation born of the energy shock, the ECB raises its rate by 4.5 points in 14 months. The 3-month rate follows, and even anticipates each decision. The budget plays no part in it.\"],\n  [\"2024-2025\",\"var(--eco)\",\"The ECB comes back down to 2%: the 3-month rate comes down with it, at the same pace.\"],\n  [\"2026\",\"var(--rms)\",\"A new energy shock: the ECB goes back up to 2.50% in June and September, while projecting growth of 0.9%. The coming rise in the interest burden comes from monetary policy, passed on gradually to the whole debt through rollover.\"]],\n s3t:\"Policy rate and bond purchases: two levers on the curve\",\n s3d:\"Two sliders, two levers. The <b>policy rate<\/b> holds the short end: the 3-month rate follows it, and the long end moves a little, through expectations. <b>Purchases of long bonds<\/b> on the secondary market (in the euro area the central bank may not buy them directly from the Treasury) push their price up and their yield down: the long end falls, the curve flattens.\",\n ql:\"Central bank purchases of long bonds\",\n pxh:\"A 10-year bond: when its price rises, its yield falls\",\n pxt:\"The bond always pays €5 a year, whatever happens. When the central bank buys, demand rises and so does the price: those €5 yield less in proportion. Conversely, when the policy rate rises, bonds already issued lose value: their price falls and their yield moves in line with the new rates.\",\n px:[\"Annual coupon\",\"Bond price\",\"Yield\"],pxs:[\"set at issuance\",\"on the market\",\"coupon / price\"],\n pcalc:\"Yield ≈ €5 / €{p} = <b>{y}<\/b>\",\n qnone:\"none\",qmax:\"massive\",\n c4h:\"Stylised yield curve\",lgq1:\"after your settings\",lgq0:\"starting point (ECB at 2.50%, no purchases)\",pl:\"ECB policy rate\",read3:\"3-month <b>{s}<\/b> · 10-year <b>{l}<\/b> · gap between the two <b>{g}<\/b>\",pts:\"point\",\n l_h:\"The rate on public debt is first a monetary policy decision.\",\n l_x:\"The short rate follows the central bank rate; the long rate can be lowered by its bond purchases. In an economy that no longer grows, debt sustainability therefore depends less on fiscal virtue than on the central bank's choices, and on their coordination with the state's.\",\n foot:\"10-year rate: Banque de France, “Taux de l'emprunt phare à 10 ans - France” (FM.M.FR.EUR.FR2.BB.FR10YT_RR.YLD), monthly averages 1986-2026. ECB rate: monetary policy decisions (latest: 10 September 2026). 3-month rate: weekly BTF auction results (Agence France Trésor, via metatrader.com and investing.com), monthly averages, September 2026 missing. 2026 growth: ECB September 2026 projections. Curves and bond price: stylised model, for teaching purposes.\"\n}};\n\n/* ---------- section 1 ---------- */\nfunction renderS1(){var y=YD.y10,n=y.length,xt=[];for(var j=0;j<n;j+=60)xt.push(j);\n  lineChart($('c1'),{n:n,ymin:-1,ymax:11,yticks:[0,2,4,6,8,10],xticks:xt,zero:0,H:280,fx:function(i){return 1986+Math.floor(i/12);},fy:function(v){return v+'%';},series:[{vals:y,color:'var(--rms)',w:2.2,end:true}]});}\n/* ---------- section 2 ---------- */\nvar H0=YD.dfr.length;\nfunction fill3m(){var b=YD.btf.slice();for(var i=0;i<b.length;i++){if(b[i]==null)b[i]=(b[i-1]+b[i+1])/2;}return b;}\nvar B3=fill3m();\nfunction scurve(svg,curves,o){clear(svg);var d=D();var W=600,H=280,L=46,R=14,Tp=28,B=32;svg.setAttribute('viewBox','0 0 '+W+' '+H);\n  var ymin=o.ymin,ymax=o.ymax;function X(m){return L+m/30*(W-L-R);}function Y(v){return H-B-(v-ymin)/(ymax-ymin)*(H-B-Tp);}\n  var g=mk('g',{'class':'ax'});for(var v=Math.ceil(ymin);v<=ymax;v++){g.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v)}));g.appendChild(mk('text',{x:L-6,y:Y(v)+3.5,'text-anchor':'end'},v+'%'));}\n  [0,5,10,15,20,25,30].forEach(function(t){g.appendChild(mk('text',{x:X(t),y:H-B+16,'text-anchor':'middle'},t));});\n  g.appendChild(mk('text',{x:W-R,y:H-4,'text-anchor':'end'},LANG==='fr'?'maturité (ans)':'maturity (years)'));g.appendChild(mk('text',{x:L-40,y:12},LANG==='fr'?\"taux d'intérêt (%)\":'interest rate (%)'));svg.appendChild(g);\n  if(ymin<0&&ymax>0)svg.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(0),y2:Y(0),style:'stroke:var(--faint)'}));\n  curves.forEach(function(c){var dd='';c.ten.forEach(function(m,i){dd+=(i?'L':'M')+X(m).toFixed(1)+' '+Y(c.v[i]).toFixed(1)+' ';});svg.appendChild(mk('path',{d:dd,style:'fill:none;stroke:'+c.col+';stroke-width:'+(c.w||2.6)+';'+(c.dash?'stroke-dasharray:'+c.dash:'')}));\n    if(c.dots)c.dots.forEach(function(p){svg.appendChild(mk('circle',{cx:X(p[0]),cy:Y(p[1]),r:4.5,style:'fill:'+p[2]}));});});}\nfunction renderS2(){var d=D();\n  var xt=[];for(var i=0;i<H0;i+=12)xt.push(i);\n  lineChart($('c2'),{n:H0,ymin:-1,ymax:5,yticks:[-1,0,1,2,3,4,5],xticks:xt,zero:0,H:280,fx:function(i){return 2019+Math.floor(i/12);},fy:function(v){return v+'%';},\n    series:[{vals:YD.dfr,color:'var(--warn)',w:2.6,end:true},{vals:B3,color:'var(--econ)',w:2,dash:'5 3',end:true}]});\n  $('cases').innerHTML=d.cases.map(function(c){return '<div class=\"case\" style=\"border-top:3px solid '+c[1]+'\"><b class=\"h\" style=\"color:'+c[1]+'\">'+c[0]+'<\/b>'+c[2]+'<\/div>';}).join('');}\n/* ---------- section 3 ---------- */\nvar Q=0,PR=2.5,TEN=[0.25,0.5,1,2,3,5,7,10,15,20,30],KW=1-Math.exp(-10/6),LB=2.65+2.35/KW;\nfunction crv(p,q){var sh=p+0.15,L=LB+0.4*(p-2.5)-2.5*q/100;return TEN.map(function(m){return sh+(L-sh)*(1-Math.exp(-m/6));});}\nfunction y10(v){return v[TEN.indexOf(10)];}\nfunction renderS3(){var d=D();\n  $('qv').textContent=Q===0?d.qnone:(Q+' %');$('pv').textContent=pct(PR,2);\n  var v0=crv(2.5,0),v=crv(PR,Q),yq=y10(v),sh=v[0],price=5/yq*100;\n  var bx=[[d.px[0],'5 €',d.pxs[0],'var(--ink)'],[d.px[1],fmt(price,0)+' €',d.pxs[1],'var(--econ)'],[d.px[2],pct(yq,2),d.pxs[2],'var(--warn)']];\n  $('price').innerHTML=bx.map(function(b){return '<div class=\"pbox\"><div class=\"kl\">'+b[0]+'<\/div><div class=\"kv\" style=\"color:'+b[3]+'\">'+b[1]+'<\/div><div class=\"ks\">'+b[2]+'<\/div><\/div>';}).join('');\n  $('pcalc').innerHTML=d.pcalc.replace('{p}',fmt(price,0)).replace('{y}',pct(yq,2));\n  $('read3').innerHTML=d.read3.replace('{s}',pct(sh,2)).replace('{l}',pct(yq,2)).replace('{g}',fmt(yq-sh,2)+' '+d.pts);\n  scurve($('c4'),[{ten:TEN,v:v0,col:'var(--faint)',w:1.5,dash:'5 4'},{ten:TEN,v:v,col:'var(--rms)',w:3,dots:[[0.25,sh,'var(--econ)'],[10,yq,'var(--warn)']]}],{ymin:-1,ymax:7});}\n$('q').addEventListener('input',function(e){Q=+e.target.value;renderS3();});\n$('pol').addEventListener('input',function(e){PR=+e.target.value;renderS3();});\nfunction renderAll(){renderS1();renderS2();renderS3();}\nboot();\n<\/script>\n<\/body>\n<\/html>\n\n<\/body><\/html>"}</script>

<script>

  var STEPS   = CFG.outils;          // {fichier, cle, partie, icone, couleur}

  function tok(nom){ return 'var(--' + (nom || 'ink') + ')'; }

  /* ───────── bibliothèque d'icônes ─────────
     Chaque icône reçoit la couleur d'accent de sa carte. Pour en ajouter une,

      case 'eclair':      return S+'<circle cx="12" cy="12" r="8"/><path d="M12.5 7l-3.2 5.4H12l-0.6 4.2 3.6-5.6H12z" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'engrenages':  return S+'<circle cx="9" cy="10" r="3.2"/><circle cx="15.4" cy="15" r="2.6"/><path d="M9 4.6v1.6M9 13.8v1.6M3.8 10h1.6M12.6 10h1.6M5.4 6.4l1.1 1.1M11.5 12.5l1.1 1.1M12.6 6.4l-1.1 1.1M5.4 13.6l1.1-1.1" stroke="'+a+'"/></svg>';
      case 'courbes':     return S+'<path d="M3 20C10 20 12 5 21 4" stroke="'+a+'"/><path d="M3 20C9 20 9 9 20 8.5"/></svg>';
      case 'bosse':       return S+'<path d="M3.5 19C8 5 16 5 20.5 19" stroke="'+a+'"/><path d="M3 12.5h18" stroke-dasharray="2 2"/></svg>';
      case 'lecture':     return S+'<path d="M9 7l8 5-8 5z" fill="'+a+'" stroke="'+a+'"/><path d="M4 12h2"/></svg>';
      case 'seuil':       return S+'<path d="M3 20C7 20 8 8 13 8s2 8 8 8" stroke="'+a+'"/><path d="M3 6h18" stroke-dasharray="2 2"/></svg>';
      case 'divergence':  return S+'<path d="M3 18C9 18 12 15 21 14"/><path d="M3 18C9 18 11 7 21 4" stroke="'+a+'"/><path d="M3 21V3" opacity=".45"/></svg>';
      case 'fourche':     return S+'<path d="M3 12h7"/><path d="M10 12l8-5.5" stroke="'+a+'"/><path d="M10 12l8 5.5" stroke="var(--faint)"/><path d="M18 6.5l-3 .4M18 6.5l.5 2.9" stroke="'+a+'"/></svg>';
      case 'leviers':     return S+'<path d="M3 20h18"/><path d="M6 20v-7"/><path d="M12 20V6" stroke="'+a+'"/><path d="M18 20v-10"/><path d="M8.6 8.4l2.2 2.2M10.8 8.4l-2.2 2.2" stroke="var(--faint)"/><path d="M14.6 12l2.2 2.2M16.8 12l-2.2 2.2" stroke="var(--faint)"/></svg>';
      case 'anneau':      return S+'<circle cx="12" cy="12" r="8.6" stroke-dasharray="3.4 2.4"/><circle cx="12" cy="12" r="4.4" stroke="'+a+'"/></svg>';
      case 'aires':       return S+'<path d="M3 20h18"/><path d="M3 17.6c4 0 6-2.4 9-2.4s5.4 1.6 9 1.6" stroke="'+a+'"/><path d="M3 13.6c4 0 6-3.6 9-3.6s5.4 2.6 9 2.6"/><path d="M3 9.4c4 0 6-2.6 9-2.6s5.4 1.8 9 1.8" opacity=".5"/></svg>';
      case 'balance':     return S+'<path d="M12 4v16M5 8h14" stroke="'+a+'"/><path d="M5 8l-2.2 5a2.6 2.6 0 0 0 4.4 0z"/><path d="M19 8l-2.2 5a2.6 2.6 0 0 0 4.4 0z"/></svg>';
      case 'flux':        return S+'<path d="M3 8h13" stroke="'+a+'"/><path d="M16 8l-3-2.6M16 8l-3 2.6" stroke="'+a+'"/><path d="M21 16H8"/><path d="M8 16l3-2.6M8 16l3 2.6"/></svg>';
      case 'horloge':     return S+'<circle cx="12" cy="12" r="8.6"/><path d="M12 7v5.4l3.4 2" stroke="'+a+'"/></svg>';
      case 'grille':      return S+'<rect x="4" y="4" width="16" height="16" rx="2.6"/><path d="M12 4.4v15.2M4.4 12h15.2"/><path d="M5.7 5.7h5.1v5.1h-5.1z" fill="'+a+'" stroke="none"/></svg>';
      case 'carres':      return S+'<g stroke="none"><rect x="4.6" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="10.2" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="15.8" y="4.6" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="4.6" y="10.2" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="10.2" y="10.2" width="4.6" height="4.6" rx="1" fill="'+a+'"/><rect x="15.8" y="10.2" width="4.6" height="4.6" rx="1" fill="currentColor"/><rect x="4.6" y="15.8" width="4.6" height="4.6" rx="1" fill="currentColor"/><rect x="10.2" y="15.8" width="4.6" height="4.6" rx="1" fill="var(--faint)"/><rect x="15.8" y="15.8" width="4.6" height="4.6" rx="1" fill="var(--line)"/></g></svg>';
      case 'curseurs':    return S+'<path d="M3.4 7h17.2M3.4 12h17.2M3.4 17h17.2"/><circle cx="8" cy="7" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/><circle cx="15.2" cy="12" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/><circle cx="11" cy="17" r="2.3" fill="var(--surface)" stroke="'+a+'" stroke-width="2.2"/></svg>';
      /* robinet : un apport par le haut, un niveau qui s'établit, une fuite par

      /* fuite : une monnaie qui circule dans un périmètre, et ce qui en sort.
         Le trait d'accent est la fuite, pas la circulation. */

      case 'robinet':     return S+'<path d="M3.4 5.2h5.4" stroke="'+a+'"/><path d="M8.8 5.2v2.7" stroke="'+a+'"/><circle cx="8.8" cy="9.5" r="0.8" fill="'+a+'" stroke="none"/><path d="M4.6 12.2h14.8v5.4a2 2 0 0 1-2 2H6.6a2 2 0 0 1-2-2z"/><path d="M4.6 15.1h14.8" stroke="'+a+'"/><circle cx="12" cy="22" r="0.95" fill="'+a+'" stroke="none"/></svg>';
      case 'seau':        return S+'<path d="M4.2 6.6h15.6l-1.7 9.7a1.8 1.8 0 0 1-1.8 1.5H7.7a1.8 1.8 0 0 1-1.8-1.5z"/><path d="M10.4 11.6h.01M13.7 13.6h.01" stroke="'+a+'" stroke-width="2.6"/><circle cx="10.5" cy="20.4" r="1.05" fill="'+a+'" stroke="none"/><circle cx="13.9" cy="21.4" r="0.85" fill="'+a+'" stroke="none"/></svg>';
      case 'des':         return S+'<rect x="4" y="4" width="16" height="16" rx="3.4"/><circle cx="8.6" cy="8.6" r="1.35" fill="'+a+'" stroke="none"/><circle cx="15.4" cy="8.6" r="1.35" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.35" fill="'+a+'" stroke="none"/><circle cx="8.6" cy="15.4" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.35" fill="'+a+'" stroke="none"/></svg>';
      case 'planchers':   return S+'<path d="M3 20h18"/><rect x="5" y="6.5" width="3.8" height="13.5" rx="1"/><rect x="10.1" y="9.5" width="3.8" height="10.5" rx="1"/><rect x="15.2" y="12" width="3.8" height="8" rx="1" stroke="'+a+'"/><path d="M3.8 16.8h16.4" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'mappemonde':  return S+'<circle cx="12" cy="12" r="8.6" stroke="'+a+'"/><path d="M12 3.4c3.1 3 3.1 14.2 0 17.2M12 3.4c-3.1 3-3.1 14.2 0 17.2"/><path d="M3.7 9.3h16.6M3.7 14.7h16.6"/></svg>';
      /* silhouette réelle de la courbe de l'éléphant : bosse, creux, trompe */
      case 'elephant':    return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17.5C6.6 17.5 7.2 10 9.6 10S12.6 15.2 15.4 15.2C17.4 15.2 18.2 9.5 20 4.6" stroke="'+a+'"/></svg>';
      case 'convergence': return S+'<path d="M3.2 5.5h4.4M3.2 12h4.4M3.2 18.5h4.4"/><path d="M7.6 5.5C12.8 5.5 12.8 12 16.2 12" stroke="'+a+'"/><path d="M7.6 12h8.6" stroke="'+a+'"/><path d="M7.6 18.5C12.8 18.5 12.8 12 16.2 12" stroke="'+a+'"/><circle cx="18.4" cy="12" r="2.1" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'distribution':return S+'<path d="M3 20h18"/><path d="M5.5 20v-3.2M8.5 20v-9M11.5 20v-6M14.5 20v-3.4M17.5 20v-1.8"/><path d="M12.8 4.5V20" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'lorenz':      return S+'<path d="M4 20h16M4 20V4"/><path d="M4 20L20 4" stroke-dasharray="2.5 2" opacity=".55"/><path d="M4 20C11 20 16.5 15 20 4" stroke="'+a+'"/></svg>';
      /* plusieurs séries superposées, pilotées par un même sélecteur */
      case 'series':      return S+'<path d="M4 20h16M4 20V4"/><path d="M6 14.5l3.4-3.4 3.4 3.4 3.4-6.6 2.6 2.4" stroke="'+a+'"/><path d="M6 17.8c3.4-.6 6.2 1 12-2.6" opacity=".45"/><circle cx="9.4" cy="11.1" r="1.25" fill="'+a+'" stroke="none"/><circle cx="16.2" cy="7.9" r="1.25" fill="'+a+'" stroke="none"/></svg>';
      case 'croisement':  return S+'<path d="M4 20h16M4 20V4"/><path d="M6 17.5L19 7" stroke="'+a+'" stroke-dasharray="3 2"/><circle cx="8.5" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="13.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="10.5" r="1.2" fill="'+a+'" stroke="none"/><circle cx="18" cy="8" r="1.2" fill="'+a+'" stroke="none"/></svg>';
      case 'voile':       return S+'<path d="M2.6 12S6 6.8 12 6.8 21.4 12 21.4 12 18 17.2 12 17.2 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="2.5" stroke="'+a+'"/><path d="M4.5 19.5L19.5 4.5" stroke="'+a+'"/></svg>';
      case 'course':      return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17C9 17 13 13.5 20 5.5" stroke="'+a+'"/><path d="M4.5 17C9 17 13 15.5 20 13.5"/></svg>';
      case 'ratio':       return S+'<path d="M3 20h18"/><rect x="5.5" y="4.5" width="4.6" height="15.5" rx="1.2" stroke="'+a+'"/><rect x="13.9" y="15" width="4.6" height="5" rx="1.2"/></svg>';
      case 'ecart':       return S+'<path d="M3 20h18"/><path d="M4 7h16" stroke="'+a+'"/><path d="M4 12.6C9 12.6 13.5 16 20 17"/><path d="M12 7.6v6.9" stroke="var(--faint)"/><path d="M12 7.6l-1.5 1.7M12 7.6l1.5 1.7M12 14.5l-1.5-1.7M12 14.5l1.5-1.7" stroke="var(--faint)"/></svg>';
    }
    return S+'<circle cx="12" cy="12" r="8" stroke="'+a+'"/></svg>';
  }

  /* ───────── état ───────── */
  var LANG = CFG.langue_defaut || 'fr';
  try{ var sl=localStorage.getItem(PREFIXE+'_lang'); if(sl) LANG=sl; }catch(e){}
  var THEME=null;
  try{ var st=localStorage.getItem(PREFIXE+'_theme'); if(st) THEME=st; }catch(e){}
  if(!THEME) THEME = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', THEME);

  function T(){ return CFG.textes[LANG]; }

  function seed(){
    for(var i=0;i<N;i++){
      try{
        localStorage.setItem(STEPS[i].cle+'_theme', THEME);
        localStorage.setItem(STEPS[i].cle+'_lang',  LANG);
      }catch(e){}
    }
    try{ localStorage.setItem(PREFIXE+'_theme',THEME); localStorage.setItem(PREFIXE+'_lang',LANG); }catch(e){}
  }

  /* ───────── le fil ───────── */
  function carte(i){
    var d=T(), s=STEPS[i];
    var a=document.createElement('a');
    a.className='card'; a.href='#/'+(i+1);
    a.innerHTML='<span class="emb" style="color:'+tok(s.couleur)+'">'+emb(s.icone,s.couleur)+'</span>'+
      '<span class="cbody"><span class="idx">'+(i+1)+'</span>'+
      '<h3>'+d.cartes[i].titre+'</h3><p>'+d.cartes[i].resume+'</p>'+
      '<span class="go">'+d.nav_ouvrir+' →</span></span>';
    return a;
  }

  /* Une partie sans numéro est un seuil : elle ouvre la séance sans être
     comptée dans les parties. Le fil l'annonce par une étiquette, le bandeau
     par un repère discret placé avant les chiffres romains. */
  function estSeuil(p){ var P=PARTIES[p-1]; return !!P.seuil || !P.numero; }
  function marque(p){ return estSeuil(p) ? '◦' : PARTIES[p-1].numero; }
  function etiquette(p){
    var e=T().parties[p-1].etiquette;
    return e || (LANG==='en' ? 'Opening' : 'Ouverture');
  }

  function buildFil(){
    var d=T(), box=document.getElementById('parties');
    box.innerHTML='';
    for(var p=1;p<=NP;p++){
      var sec=document.createElement('section');
      sec.className='part'+(estSeuil(p)?' seuil':'');
      sec.style.setProperty('--pc', tok(PARTIES[p-1].couleur));
      var rang = estSeuil(p)
        ? '<span class="sn">'+etiquette(p)+'</span>'
        : '<span class="rn">'+PARTIES[p-1].numero+'</span>';
      var h='<div class="parthead">'+rang+
            '<h2>'+d.parties[p-1].titre+'</h2></div>'+
            '<p class="partlead">'+d.parties[p-1].chapo+'</p>'+
            '<div class="cards"></div>';
      sec.innerHTML=h;
      var grille=sec.querySelector('.cards');
      for(var i=0;i<N;i++) if(STEPS[i].partie===p) grille.appendChild(carte(i));
      box.appendChild(sec);
    }
  }

  /* ───────── bandeau de situation ───────── */
  function premierDe(p){ for(var j=0;j<N;j++) if(STEPS[j].partie===p) return j; return 0; }

  function buildNav(i){
    var d=T(), s=STEPS[i], cur=null,
        bar=document.getElementById('nparts'), box=document.getElementById('steps');
    document.documentElement.style.setProperty('--acc', tok(PARTIES[s.partie-1].couleur));
    document.getElementById('ncount').textContent=(i+1)+' / '+N;

    bar.innerHTML='';
    for(var p=1;p<=NP;p++){
      if(p===s.partie){
        var c=document.createElement('span');
        c.className='pcur';
        /* Séance à une seule partie : le repère n'oppose la partie à rien,
           il ne reste que son intitulé. */
        c.innerHTML=(NP>1?'<em>'+marque(p)+'</em>':'')+'<span>'+d.parties[p-1].titre+'</span>';
        c.setAttribute('aria-current','true');
        bar.appendChild(c);
      } else {
        var g=document.createElement('a');
        g.className='pgrp';
        g.href='#/'+(premierDe(p)+1);
        g.title=(estSeuil(p)?etiquette(p):PARTIES[p-1].numero)+' · '+d.parties[p-1].titre;
        g.textContent=marque(p);
        bar.appendChild(g);
      }
    }

    box.innerHTML='';
    for(var j=0;j<N;j++){
      if(STEPS[j].partie!==s.partie) continue;
      var a=document.createElement('a');
      a.className='stp'+(j===i?' on':'');
      a.href='#/'+(j+1);
      a.title=d.cartes[j].titre;
      a.innerHTML='<em>'+(j+1)+'</em><span>'+d.cartes[j].titre+'</span>';
      if(j===i){ a.setAttribute('aria-current','true'); cur=a; }
      box.appendChild(a);
    }
    /* le bandeau peut être encore masqué : on attend une frame pour mesurer */
    if(cur) requestAnimationFrame(function(){
      box.scrollLeft = Math.max(0, cur.offsetLeft - (box.clientWidth - cur.offsetWidth)/2);
    });
  }

  /* ───────── iframes ───────── */
  var host=document.getElementById('host'), frames={}, current=-1;

  /* Une iframe capte le clavier dès qu'on a cliqué dedans, et la coquille ne
     voit plus rien. On y relaie donc Échap et F — et seulement eux : les
     flèches appartiennent aux outils, qui s'en servent pour leurs propres
     étapes. Les iframes srcdoc héritent de notre origine, d'où l'accès. */
  function brancherClavier(fr){
    try{
      var doc=fr.contentDocument; if(!doc) return;
      doc.addEventListener('keydown', function(ev){
        if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
        if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
        else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
      });
    }catch(e){}
  }

  function syncFrame(fr){
    if(!fr) return;
    try{
      var doc=fr.contentDocument;
      if(!doc || !doc.documentElement) return;
      for(var n=0;n<2;n++){
        if(doc.documentElement.getAttribute('data-theme')===THEME) break;
        var tb=doc.getElementById('theme'); if(!tb) break; tb.click();
      }
      for(var m=0;m<2;m++){
        if((doc.documentElement.lang||'fr')===LANG) break;
        var lb=doc.getElementById('lang'); if(!lb) break; lb.click();
      }
    }catch(e){}
  }

  function showTool(i){
    var s=STEPS[i], d=T();
    document.body.classList.add('mode-tool');
    seed();
    if(!frames[s.fichier]){
      var fr=document.createElement('iframe');
      fr.setAttribute('title', d.cartes[i].titre);
      host.appendChild(fr);
      frames[s.fichier]=fr;
      fr.addEventListener('load', function(){ syncFrame(fr); brancherClavier(fr); });
      fr.srcdoc = TOOLS[s.fichier];
    } else {
      syncFrame(frames[s.fichier]);
    }
    for(var k in frames) frames[k].style.display = (k===s.fichier) ? 'block' : 'none';
    if(plein) montrerNav(1600);
    current=i;
    buildNav(i);
    var pb=document.getElementById('prev'), nb=document.getElementById('next');
    pb.disabled=(i===0); nb.disabled=(i===N-1);
    pb.title=d.nav_prec; nb.title=d.nav_suiv;
  }

  function showFil(){
    if(plein) setPlein(false);
    document.body.classList.remove('mode-tool');
    current=-1;
    window.scrollTo(0, window.__filScroll||0);
  }

  /* ───────── plein écran ───────── */
  var plein=false, minuterieNav=null, minuterieAstuce=null;

  function montrerNav(delaiMasquage){
    document.body.classList.add('nav-on');
    clearTimeout(minuterieNav);
    if(delaiMasquage) minuterieNav=setTimeout(function(){
      document.body.classList.remove('nav-on');
    }, delaiMasquage);
  }

  function demanderPleinEcran(){
    var el=document.documentElement;
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(f){ try{ var p=f.call(el); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }
  function quitterPleinEcran(){
    var actif=document.fullscreenElement||document.webkitFullscreenElement;
    if(!actif) return;
    var f=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(f){ try{ var p=f.call(document); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }

  function setPlein(v){
    if(plein===v) return;
    plein=v;
    document.body.classList.toggle('mode-plein', v);
    var b=document.getElementById('tplein'), d=T();
    b.textContent = v ? '⤡' : '⤢';
    b.title = v ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    if(v){
      demanderPleinEcran();
      montrerNav(2400);
      document.getElementById('pastille').textContent =
        (d.nav_plein_astuce||'Approchez du haut pour revoir la barre · Échap pour sortir');
      document.body.classList.add('astuce');
      clearTimeout(minuterieAstuce);
      /* l'astuce doit rester lisible après le retrait du bandeau, pas pendant */
      minuterieAstuce=setTimeout(function(){ document.body.classList.remove('astuce'); }, 6500);
    } else {
      quitterPleinEcran();
      clearTimeout(minuterieNav); clearTimeout(minuterieAstuce);
      document.body.classList.remove('nav-on','astuce');
    }
  }

  document.getElementById('tplein').addEventListener('click', function(){ setPlein(!plein); });
  document.getElementById('hotzone').addEventListener('mouseenter', function(){ montrerNav(0); });
  document.querySelector('.nav').addEventListener('mouseleave', function(){ if(plein) montrerNav(500); });
  /* Sortie par F11 ou par la touche Échap interceptée par le navigateur :
     on resynchronise la coquille sur l'état réel. */
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement||document.webkitFullscreenElement) && plein) setPlein(false);
    });
  });

  function route(){
    var h=(location.hash||'').replace(/^#\/?/,'');
    var n=parseInt(h,10);
    if(h && !isNaN(n) && n>=1 && n<=N){
      if(current===-1) window.__filScroll = window.pageYOffset||0;
      showTool(n-1);
    } else {
      showFil();
    }
  }
  window.addEventListener('hashchange', route);

  function go(i){
    if(i<0){ location.hash='#/fil'; return; }
    if(i>N-1) return;
    location.hash='#/'+(i+1);
  }
  document.getElementById('prev').addEventListener('click', function(){ if(current>0) go(current-1); });
  document.getElementById('next').addEventListener('click', function(){ if(current>-1 && current<N-1) go(current+1); });

  document.addEventListener('keydown', function(ev){
    if(current===-1) return;
    if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
    else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
    else if(ev.key==='ArrowLeft'  && current>0)   { go(current-1); }
    else if(ev.key==='ArrowRight' && current<N-1) { go(current+1); }
  });

  /* ───────── bascules ───────── */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', THEME);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleTheme(){ THEME=(THEME==='dark')?'light':'dark'; applyTheme(); }
  document.getElementById('theme').addEventListener('click', toggleTheme);
  document.getElementById('ttheme').addEventListener('click', toggleTheme);

  function applyLang(){
    var d=T();
    document.documentElement.lang=LANG;
    document.title = d.titre_onglet;
    document.getElementById('eyebrow').innerHTML = d.surtitre;
    document.getElementById('titre').textContent = d.titre;
    document.getElementById('seance').textContent = d.seance;
    document.getElementById('chapo').innerHTML = d.chapo;
    document.getElementById('pied').innerHTML = d.pied;
    document.getElementById('licence').innerHTML = d.licence;
    document.getElementById('homelbl').textContent = d.nav_fil;
    /* Remontée vers la page du cours : seulement si le manifeste la déclare.
       Une séance diffusée seule, sans page d'accueil à côté, n'affiche rien
       plutôt qu'un lien qui mènerait à une erreur. */
    var lien = CFG.lien_accueil, rm = document.getElementById('remonte'),
        ab = document.getElementById('accueilbtn');
    if(lien){
      rm.href = lien; ab.href = lien;
      rm.hidden = false; ab.hidden = false;
      document.getElementById('remontelbl').textContent = d.nav_accueil || 'Le cours';
      ab.title = d.nav_accueil || 'Le cours';
    } else {
      rm.hidden = true; ab.hidden = true;
    }
    var bp=document.getElementById('tplein');
    bp.title = plein ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    document.getElementById('langlbl').textContent = LANG.toUpperCase();
    document.getElementById('tlanglbl').textContent = LANG.toUpperCase();
    buildFil();
    if(current>-1) buildNav(current);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleLang(){
    var codes=Object.keys(CFG.textes);
    LANG = codes[(codes.indexOf(LANG)+1) % codes.length];
    applyLang();
  }
  document.getElementById('lang').addEventListener('click', toggleLang);
  document.getElementById('tlang').addEventListener('click', toggleLang);

  /* ───────── démarrage ───────── */
  seed();
  applyLang();
  route();
})();
</script>

</body>
</html>
