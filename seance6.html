stI),cy:Y(lv),r:3.6,style:'fill:'+s.color}));}}\n  });\n  if(o.ylab)svg.appendChild(mk('text',{x:L,y:T-3,style:'fill:var(--faint);font-size:10.5px;font-family:var(--font-m)'},o.ylab));\n  return {X:X,Y:Y};\n}\nfunction boot(){\n  $('theme').addEventListener('click',function(){var nt=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nt);try{localStorage.setItem(PFX+'_theme',nt);}catch(e){}renderAll();});\n  $('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem(PFX+'_lang',LANG);}catch(e){}applyLang();});\n  if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){renderAll();});}catch(e){}}\n  applyLang();\n}\n\nvar STR={\nfr:{\n doc_title:\"Émettre et rouler la dette\",prev:\"Précédent\",next:\"Suivant\",assets:\"Actif\",liabs:\"Passif\",\n eyebrow:\"Séance 6 · L'émission de dette publique en zone euro\",\n title:\"Émettre et rouler la dette\",\n sub:\"On sait maintenant pourquoi l'État est en déficit. Reste à voir <b>comment<\/b> il le finance : qui achète ses titres, avec quelle monnaie, et ce qui se passe quand un titre arrive à échéance.\",\n s1t:\"La pyramide monétaire\",\n s1d:\"Avant de suivre une émission, il faut savoir qui utilise quelle monnaie. Le système monétaire est une pyramide à trois étages : on la monte pas à pas, puis on y place le Trésor.\",\n py_l:\"Fournit / gère\",py_r:\"Utilise\",\n py_cb:\"Banque<br>centrale\",py_bk:\"Banques<br>commerciales\",py_anf:\"Agents non financiers\",\n py_l1:\"<span><b>Monnaie centrale<\/b><br>réserves et billets<\/span>\",py_l2:\"<span><b>Monnaie bancaire<\/b><br>dépôts<\/span>\",\n py_r2:\"<span><b>Monnaie centrale<\/b><br>pour se régler entre elles<\/span>\",py_r3:\"<span><b>Monnaie bancaire<\/b><br>et billets<\/span>\",\n py_trp:\"+ Trésor\",\n py_steps:[\n  [\"Les dépôts, monnaie des ménages et des entreprises\",\"On l'a vu en séance 4 : en accordant un crédit, une banque crée un dépôt. Ces dépôts forment l'essentiel de la masse monétaire ; dans la zone euro, les billets n'en représentent qu'environ un dixième. Les <b>agents non financiers<\/b> (ménages, entreprises) utilisent cette <b>monnaie bancaire<\/b> ; les <b>banques commerciales<\/b> la fournissent et la gèrent.\"],\n  [\"Pourquoi les banques ont besoin d'une autre monnaie\",\"Un dépôt est une dette de la banque. Quand un client de la banque A paie un client de la banque B, B doit davantage à son client et A moins au sien : A doit régler B avec un actif que B accepte, et ce ne peut pas être un dépôt chez A. Chaque jour, les banques <b>compensent<\/b> leurs paiements croisés et ne règlent que le solde : si les clients de A versent 100 à ceux de B et ceux de B 70 à ceux de A, seuls 30 passent de A à B. Ce solde se règle en <b>monnaie centrale<\/b>, sur les comptes que les banques tiennent à la banque centrale : les <b>réserves<\/b>. Les banques en ont aussi besoin quand leurs clients retirent des <b>billets<\/b>, qu'elles achètent à la banque centrale, et pour les réserves obligatoires (1 % de certains dépôts en zone euro).\"],\n  [\"La banque centrale, banque des banques\",\"La banque centrale crée la monnaie centrale par le même mécanisme que les banques créent les dépôts : le <b>crédit<\/b>. Quand elle prête à une banque, elle crédite son compte : un prêt à son actif, des réserves à son passif. Elle en crée aussi en achetant des titres. Elle est la <b>banque des banques<\/b>. Les réserves restent à cet étage : elles ne font pas partie de la masse monétaire, seuls les billets en descendent.\"],\n  [\"Et le Trésor ?\",\"Le Trésor, qui exécute le budget de l'État, tient lui aussi son compte à la banque centrale, en monnaie centrale : celle-ci est donc aussi la <b>banque de l'État<\/b>. Mais il n'a pas les droits des banques : en zone euro, il ne peut pas emprunter à la banque centrale (article 123 du TFUE). Et pour payer un ménage, il passe par la banque de celui-ci, qui reçoit des réserves et crédite un dépôt. Les banques sont la seule passerelle entre les deux étages de monnaie : c'est ce que montre l'émission qui suit.\"]\n ],\n s2t:\"Émettre 100 de dette\",\n s2d:\"Le Trésor veut dépenser 100 au-delà de ses recettes. On suit les bilans des quatre acteurs, en supposant que la banque centrale prête à 0 % et que le titre rapporte 5 %.\",\n cb:\"Banque centrale\",tr:\"Trésor\",bk:\"Banque commerciale\",hh:\"Ménages\",\n i_loanbk:\"Prêt aux banques\",i_resbk:\"Réserves des banques\",i_trac:\"Compte du Trésor\",i_res:\"Réserves\",i_cbloan:\"Emprunt à la BC\",\n i_bond:\"Titres publics\",i_dep:\"Dépôts\",i_nw:\"Valeur nette\",i_old:\"Ancien bon du Trésor\",i_new:\"Nouveau bon du Trésor\",\n steps2:[\n  [\"Avant l'émission\",\"Le Trésor doit financer une dépense de 100 que ses impôts ne couvrent pas. Aucun bilan n'a encore bougé.\"],\n  [\"Les banques empruntent des réserves\",\"Le Trésor ne peut pas emprunter à la banque centrale (article 123 du TFUE). Ce sont donc les banques qui empruntent 100 de réserves à la BCE, à son taux directeur (ici 0 %). Ce taux est le <b>plancher<\/b> du rendement qu'elles exigeront des titres publics.\"],\n  [\"Elles achètent les titres\",\"Les banques versent 100 de réserves sur le compte du Trésor à la banque centrale et reçoivent un titre qui leur paiera <b>105<\/b> à l'échéance. La différence, 5, est l'intérêt : une richesse nette de +5 pour la banque, de −5 pour le Trésor.\"],\n  [\"Le Trésor dépense\",\"Le Trésor paie 100 à un ménage (un salaire de fonctionnaire, une prestation, une commande). Les réserves reviennent à la banque du ménage, qui crédite son compte : <b>100 de dépôts nouveaux<\/b>. La masse monétaire a augmenté, exactement comme lorsqu'une banque prête à une entreprise.\"],\n  [\"Les banques remboursent la banque centrale\",\"Les réserves revenues aux banques leur servent à rembourser la BCE. Le bilan de la banque centrale se vide : les réserves n'ont fait que transiter. Il reste une dette publique de 105 et, en face, 105 de richesse privée (100 de dépôts pour les ménages, 5 de valeur nette pour la banque). C'est l'identité <b>SAV<sub>p<\/sub> = DEF<\/b> de la partie III, inscrite dans les bilans.\"]\n ],\n k_m:\"Masse monétaire (dépôts)\",k_r:\"Réserves en circulation\",k_d:\"Dette publique\",k_w:\"Richesse nette privée\",\n corr2:\"Après le remboursement, le prêt de la banque centrale et l'emprunt des banques reviennent à zéro.\",\n s3t:\"Rouler la dette\",\n s3d:\"Un bon du Trésor de 50 arrive à échéance et les impôts ne suffisent pas à le rembourser. Le gouvernement émet un titre neuf pour rembourser l'ancien, au taux de 10 % pour que les chiffres se lisent bien. Bilans en niveaux.\",\n steps3:[\n  [\"L'échéance\",\"Une banque détient un bon du Trésor de 50 émis il y a quelques années. Comme dans l'émission de la section 2, ce titre a pour <b>contrepartie monétaire<\/b> 50 de dépôts, créés quand l'État a dépensé : ils figurent au passif de la banque. Le titre arrive à échéance : le Trésor doit trouver 50.\"],\n  [\"Les banques empruntent des réserves\",\"Comme pour toute émission, les banques empruntent 50 de réserves à la banque centrale.\"],\n  [\"Elles achètent le nouveau bon\",\"Le Trésor émet un nouveau bon du Trésor, remboursable 55 dans un an. Les banques le paient 50 de réserves. Pendant un instant, le Trésor doit les deux titres.\"],\n  [\"Le Trésor rembourse l'ancien\",\"Avec les 50 reçus, le Trésor rembourse l'ancien bon, qui est détruit. Les réserves reviennent à la banque qui le détenait.\"],\n  [\"La dette a été renouvelée, pas remboursée\",\"Les banques remboursent la banque centrale. L'ancien bon a été remplacé par le nouveau : la dette n'a pas été éteinte, elle a été <b>roulée<\/b>. Une seule chose a changé : elle vaut 55 au lieu de 50, du fait des <b>intérêts<\/b>. Le roulement évite toute crise de liquidité tant qu'un acheteur se présente : tout se joue donc sur le taux auquel on roule.\"]\n ],\n ez_h:\"Qui garantit qu'il y aura un acheteur ?\",\n ez_x:\"Dans la plupart des pays, la banque centrale peut acheter des titres publics : un État endetté dans sa propre monnaie ne peut alors pas être forcé au défaut, et le taux à court terme suit presque parfaitement le taux directeur. La zone euro est un cas à part : la BCE n'achète que sur le marché secondaire, et sous conditions. En 2010-2012, plusieurs États ont subi des taux de crise jusqu'au « whatever it takes » de Mario Draghi (juillet 2012). Depuis, les achats massifs de titres ont porté la part de la dette publique détenue par l'Eurosystème à près d'un quart en 2022-2023.\",\n s4t:\"Le coût de la dette suit les taux, avec retard\",\n s4d:\"Rouler la dette, c'est la refinancer chaque année en partie au taux du moment. Quand le taux de marché change, le <b>taux apparent<\/b> (intérêts payés / dette) ne le rejoint que progressivement, au rythme des échéances. Réglez la durée moyenne de la dette et le choc de taux.\",\n pz:[[\"fr\",\"France : 8,5 ans\"],[\"short\",\"Dette courte : 2 ans\"],[\"long\",\"Dette longue : 15 ans\"],[\"down\",\"Baisse des taux\"]],\n sl:{M:\"Durée moyenne de la dette (ans)\",r0:\"Taux d'avant (moyenne du stock, %)\",r1:\"Taux de marché nouveau (%)\",d:\"Dette, en % du PIB\"},\n k_a1:\"Taux apparent après 1 an\",k_a5:\"après 5 ans\",k_a10:\"après 10 ans\",k_ch:\"Charge d'intérêts à 10 ans\",\n lg_mk:\"taux de marché (nouvelles émissions)\",lg_ap:\"taux apparent (sur tout le stock)\",\n read4:\"Avec une durée moyenne de <b>{M} ans<\/b>, environ {f} % de la dette est refinancée chaque année. Il faut <b>{h} ans<\/b> pour que le taux apparent parcoure la moitié de l'écart. La charge d'intérêts passe de {c0} à {c10} % du PIB en dix ans.\",\n yrs:\"ans\",\n l_h:\"L'État ne rembourse pas sa dette : il la renouvelle.\",\n l_x:\"Une émission de dette publique crée de la monnaie dans le secteur privé, comme un crédit aux entreprises ; la monnaie centrale ne fait que transiter. À l'échéance, la dette est roulée, et la seule chose qui compte est le <b>taux<\/b> auquel on la roule. C'est lui, comparé à la croissance, qui décide si la dette rapportée au PIB monte ou baisse : c'est l'objet de la dernière partie.\",\n foot:\"Écritures comptables simplifiées : refinancement de la banque centrale à 0 %, titres inscrits à leur valeur de remboursement ; chaque bilan s'équilibre à chaque étape. Durée de vie moyenne de la dette négociable de l'État : 8 ans et 163 jours fin juillet 2026 (Agence France Trésor, bulletin mensuel d'août 2026). Part détenue par l'Eurosystème : BCE. Simulation du taux apparent : échéances réparties uniformément, stock constant, sans nouveaux déficits.\"\n},\nen:{\n doc_title:\"Issuing and rolling over debt\",prev:\"Previous\",next:\"Next\",assets:\"Assets\",liabs:\"Liabilities\",\n eyebrow:\"Session 6 · Issuing public debt in the euro area\",\n title:\"Issuing and rolling over debt\",\n sub:\"We now know why the state runs a deficit. What remains is <b>how<\/b> it finances it: who buys its bonds, with which money, and what happens when a bond matures.\",\n s1t:\"The monetary pyramid\",\n s1d:\"Before following an issuance, we need to know who uses which money. The monetary system is a three-storey pyramid: we climb it step by step, then place the Treasury in it.\",\n py_l:\"Supplies / manages\",py_r:\"Uses\",\n py_cb:\"Central<br>bank\",py_bk:\"Commercial<br>banks\",py_anf:\"Non-financial agents\",\n py_l1:\"<span><b>Central bank money<\/b><br>reserves and notes<\/span>\",py_l2:\"<span><b>Bank money<\/b><br>deposits<\/span>\",\n py_r2:\"<span><b>Central bank money<\/b><br>to settle between them<\/span>\",py_r3:\"<span><b>Bank money<\/b><br>and notes<\/span>\",\n py_trp:\"+ Treasury\",\n py_steps:[\n  [\"Deposits, the money of households and firms\",\"We saw it in session 4: by granting a loan, a bank creates a deposit. These deposits make up most of the money supply; in the euro area, banknotes are only about a tenth of it. <b>Non-financial agents<\/b> (households, firms) use this <b>bank money<\/b>; <b>commercial banks<\/b> supply and manage it.\"],\n  [\"Why banks need another money\",\"A deposit is a debt of the bank. When a customer of bank A pays a customer of bank B, B owes more to its customer and A less to its own: A must settle with B using an asset B accepts, and it cannot be a deposit at A. Every day banks <b>net<\/b> their cross payments and settle only the balance: if A's customers pay 100 to B's and B's pay 70 to A's, only 30 goes from A to B. That balance is settled in <b>central bank money<\/b>, on the accounts banks hold at the central bank: <b>reserves<\/b>. Banks also need it when customers withdraw <b>banknotes<\/b>, which they buy from the central bank, and for reserve requirements (1% of certain deposits in the euro area).\"],\n  [\"The central bank, the banks' bank\",\"The central bank creates central bank money by the same mechanism banks use to create deposits: <b>credit<\/b>. When it lends to a bank, it credits that bank's account: a loan on its assets, reserves on its liabilities. It also creates reserves by buying securities. It is the <b>banks' bank<\/b>. Reserves stay on that floor: they are not part of the money supply; only banknotes come down.\"],\n  [\"And the Treasury?\",\"The Treasury, which executes the state budget, also keeps its account at the central bank, in central bank money: the central bank is thus also the <b>state's bank<\/b>. But the Treasury does not have the banks' rights: in the euro area it cannot borrow from the central bank (Article 123 TFEU). And to pay a household it goes through that household's bank, which receives reserves and credits a deposit. Banks are the only bridge between the two floors of money: this is what the issuance below shows.\"]\n ],\n s2t:\"Issuing 100 of debt\",\n s2d:\"The Treasury wants to spend 100 beyond its revenue. We follow the balance sheets of the four actors, assuming the central bank lends at 0% and the bond yields 5%.\",\n cb:\"Central bank\",tr:\"Treasury\",bk:\"Commercial bank\",hh:\"Households\",\n i_loanbk:\"Loans to banks\",i_resbk:\"Banks' reserves\",i_trac:\"Treasury account\",i_res:\"Reserves\",i_cbloan:\"Borrowing from CB\",\n i_bond:\"Government bonds\",i_dep:\"Deposits\",i_nw:\"Net worth\",i_old:\"Old Treasury bond\",i_new:\"New Treasury bond\",\n steps2:[\n  [\"Before issuance\",\"The Treasury must finance spending of 100 that its taxes do not cover. No balance sheet has moved yet.\"],\n  [\"Banks borrow reserves\",\"The Treasury cannot borrow from the central bank (Article 123 TFEU). So banks borrow 100 of reserves from the ECB at its policy rate (here 0%). This rate is the <b>floor<\/b> of the yield they will demand on government bonds.\"],\n  [\"They buy the bonds\",\"Banks transfer 100 of reserves to the Treasury's account at the central bank and receive a bond that will pay them <b>105<\/b> at maturity. The difference, 5, is interest: net worth of +5 for the bank, −5 for the Treasury.\"],\n  [\"The Treasury spends\",\"The Treasury pays 100 to a household (a civil servant's salary, a benefit, a purchase). The reserves go to the household's bank, which credits its account: <b>100 of new deposits<\/b>. The money supply has grown, exactly as when a bank lends to a firm.\"],\n  [\"Banks repay the central bank\",\"The reserves that came back to the banks are used to repay the ECB. The central bank's balance sheet empties: reserves were only in transit. What remains is public debt of 105 and, against it, 105 of private wealth (100 of deposits for households, 5 of net worth for the bank). This is the identity <b>SAV<sub>p<\/sub> = DEF<\/b> of part III, written into balance sheets.\"]\n ],\n k_m:\"Money supply (deposits)\",k_r:\"Reserves outstanding\",k_d:\"Public debt\",k_w:\"Private net worth\",\n corr2:\"After repayment, the central bank's loan and the banks' borrowing go back to zero.\",\n s3t:\"Rolling over the debt\",\n s3d:\"A Treasury bond of 50 matures and taxes are not enough to repay it. The government issues a new bond to repay the old one, at 10% so the figures read easily. Balance sheets in levels.\",\n steps3:[\n  [\"Maturity\",\"A bank holds a Treasury bond of 50 issued some years ago. As in the issuance of section 2, its <b>monetary counterpart<\/b> is 50 of deposits, created when the state spent: they sit on the bank's liabilities. The bond matures: the Treasury must find 50.\"],\n  [\"Banks borrow reserves\",\"As for any issuance, banks borrow 50 of reserves from the central bank.\"],\n  [\"They buy the new bond\",\"The Treasury issues a new Treasury bond, repayable at 55 in one year. Banks pay 50 of reserves for it. For a moment, the Treasury owes both bonds.\"],\n  [\"The Treasury redeems the old one\",\"With the 50 received, the Treasury redeems the old bond, which is destroyed. The reserves go back to the bank that held it.\"],\n  [\"The debt was renewed, not repaid\",\"Banks repay the central bank. The old bond has been replaced by the new one: the debt was not extinguished, it was <b>rolled over<\/b>. Only one thing changed: it is worth 55 instead of 50, because of <b>interest<\/b>. Rolling over avoids any liquidity crisis as long as a buyer turns up: everything therefore depends on the rate at which it is rolled.\"]\n ],\n ez_h:\"Who guarantees there will be a buyer?\",\n ez_x:\"In most countries the central bank can buy government bonds: a state indebted in its own currency cannot then be forced into default, and the short-term rate tracks the policy rate almost perfectly. The euro area is a special case: the ECB only buys on the secondary market, and under conditions. In 2010-2012 several states faced crisis rates until Mario Draghi's “whatever it takes” (July 2012). Since then, large-scale bond purchases brought the share of public debt held by the Eurosystem to nearly a quarter in 2022-2023.\",\n s4t:\"The cost of debt follows rates, with a lag\",\n s4d:\"Rolling over means refinancing part of the debt each year at the going rate. When the market rate changes, the <b>effective rate<\/b> (interest paid / debt) only catches up gradually, as bonds mature. Set the average maturity and the rate shock.\",\n pz:[[\"fr\",\"France: 8.5 years\"],[\"short\",\"Short debt: 2 years\"],[\"long\",\"Long debt: 15 years\"],[\"down\",\"Falling rates\"]],\n sl:{M:\"Average maturity of the debt (years)\",r0:\"Previous rate (average on the stock, %)\",r1:\"New market rate (%)\",d:\"Debt, % of GDP\"},\n k_a1:\"Effective rate after 1 year\",k_a5:\"after 5 years\",k_a10:\"after 10 years\",k_ch:\"Interest burden at 10 years\",\n lg_mk:\"market rate (new issues)\",lg_ap:\"effective rate (on the whole stock)\",\n read4:\"With an average maturity of <b>{M} years<\/b>, about {f}% of the debt is refinanced each year. It takes <b>{h} years<\/b> for the effective rate to cover half the gap. The interest burden moves from {c0} to {c10}% of GDP in ten years.\",\n yrs:\"yrs\",\n l_h:\"The state does not repay its debt: it renews it.\",\n l_x:\"Issuing public debt creates money in the private sector, like a loan to firms; central bank money is only in transit. At maturity the debt is rolled over, and the only thing that matters is the <b>rate<\/b> at which it is rolled. That rate, compared with growth, decides whether debt relative to GDP rises or falls: the subject of the last part.\",\n foot:\"Simplified accounting entries: central bank refinancing at 0%, bonds recorded at redemption value; every balance sheet balances at every step. Average life of French negotiable state debt: 8 years and 163 days at end-July 2026 (Agence France Trésor, monthly bulletin, August 2026). Share held by the Eurosystem: ECB. Effective-rate simulation: maturities spread evenly, constant stock, no new deficits.\"\n}};\n\n/* section 1 : pyramide */\nvar st1=null;\nfunction renderS1(k){var d=D();$('st1t').innerHTML=d.py_steps[k][0];$('st1x').innerHTML=d.py_steps[k][1];\n  var on={1:k>=2,2:k>=0,3:k>=0},cur={3:k===0,2:k===1,1:k===2};\n  function sl(n,lab){return f(isFinite(lv)){svg.appendChild(mk('circle',{cx:X(lastI),cy:Y(lv),r:3.6,style:'fill:'+s.color}));}}\n  });\n  if(o.ylab)svg.appendChild(mk('text',{x:L,y:T-3,style:'fill:var(--faint);font-size:10.5px;font-family:var(--font-m)'},o.ylab));\n  return {X:X,Y:Y};\n}\nfunction boot(){\n  $('theme').addEventListener('click',function(){var nt=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nt);try{localStorage.setItem(PFX+'_theme',nt);}catch(e){}renderAll();});\n  $('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem(PFX+'_lang',LANG);}catch(e){}applyLang();});\n  if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){renderAll();});}catch(e){}}\n  applyLang();\n}\n\nfunction FR(a,b){return '<span class=\"fr\"><span>'+a+'<\/span><span>'+b+'<\/span><\/span>';}\nvar F=[\n '<i>D<sub>t<\/sub><\/i> = (1 + <i class=\"r\">r<\/i>) <i>D<sub>t−1<\/sub><\/i> − <i class=\"p\">P<sub>t<\/sub><\/i>',\n FR('<i>D<sub>t<\/sub><\/i>','<i>Y<sub>t<\/sub><\/i>')+' = (1 + <i class=\"r\">r<\/i>) '+FR('<i>D<sub>t−1<\/sub><\/i>','<i>Y<sub>t<\/sub><\/i>')+' − '+FR('<i class=\"p\">P<sub>t<\/sub><\/i>','<i>Y<sub>t<\/sub><\/i>'),\n '<i>d<sub>t<\/sub><\/i> = '+FR('1 + <i class=\"r\">r<\/i>','1 + <i class=\"g\">g<\/i>')+' <i>d<sub>t−1<\/sub><\/i> − <i class=\"p\">p<sub>t<\/sub><\/i>',\n '<i class=\"p\">p<\/i>* = '+FR('<i class=\"r\">r<\/i> − <i class=\"g\">g<\/i>','1 + <i class=\"g\">g<\/i>')+' <i>d<\/i> &nbsp;≈&nbsp; (<i class=\"r\">r<\/i> − <i class=\"g\">g<\/i>) <i>d<\/i>',\n '<i class=\"p\">p<\/i>* ≈ (<i class=\"r\">r<\/i> − <i class=\"g\">g<\/i>) <i>d<\/i>'\n];\nvar STR={\nfr:{\n doc_title:\"La course entre r et g\",prev:\"Précédent\",next:\"Suivant\",assets:\"Actif\",liabs:\"Passif\",\n eyebrow:\"Séance 6 · La soutenabilité de la dette publique\",\n title:\"La course entre r et g\",\n sub:\"La dette publique se roule : on ne la rembourse pas, on la renouvelle au taux du moment. La question pertinente n'est donc pas « peut-on la rembourser ? » mais « son poids dans l'économie grandit-il ? ». La réponse tient dans une course entre deux taux : le taux d'intérêt <b>r<\/b> et le taux de croissance du PIB <b>g<\/b>.\",\n s1t:\"L'équation de la dette, pas à pas\",\n s1d:\"Cinq étapes, du stock de dette en euros à la condition de stabilisation.\",\n steps:[\n  [\"La dette d'une année sur l'autre\",\"La dette de cette année est celle de l'an dernier, augmentée des intérêts, diminuée du <b>solde primaire<\/b> <i>P<\/i> : recettes moins dépenses <b>hors intérêts<\/b>. Un excédent primaire (<i>P<\/i> > 0) réduit la dette ; un déficit primaire l'augmente. On parle souvent de « solde budgétaire » : il s'agit bien ici du solde primaire, puisque les intérêts sont déjà comptés dans (1 + <i>r<\/i>).\"],\n  [\"Rapporter la dette au PIB\",\"Une dette de 3 300 milliards ne dit rien seule : il faut la comparer aux revenus sur lesquels l'État prélève. On divise tout par le PIB de l'année, <i>Y<sub>t<\/sub><\/i>.\"],\n  [\"Faire apparaître la croissance\",\"Le PIB de cette année est celui de l'an dernier multiplié par (1 + <i>g<\/i>). En remplaçant, on obtient l'équation du ratio de dette <i>d<\/i> = <i>D<\/i>/<i>Y<\/i>, avec <i>p<\/i> = <i>P<\/i>/<i>Y<\/i>. <i>r<\/i> et <i>g<\/i> sont <b>nominaux<\/b> : le taux payé et la croissance en euros courants, inflation comprise.\"],\n  [\"La condition de stabilisation\",\"Le ratio est stable si <i>d<sub>t<\/sub><\/i> = <i>d<sub>t−1<\/sub><\/i>. On en tire le solde primaire <i>p<\/i>* qui stabilise la dette. Comme <i>g<\/i> dépasse rarement quelques pourcents, 1 + <i>g<\/i> ≈ 1.\"],\n  [\"Trois cas\",\"Tout dépend du signe de <i>r<\/i> − <i>g<\/i>. Pour réduire le ratio, il faut faire mieux que <i>p<\/i>* ; pour le stabiliser, il suffit de l'atteindre.\"]\n ],\n defs:[[\"D\",\"dette publique, en euros\"],[\"r\",\"taux d'intérêt moyen payé sur la dette\"],[\"P\",\"solde primaire (hors intérêts)\"],[\"t\",\"l'année\"]],\n cases:[[\"r < g\",\"var(--eco)\",\"Un <b>déficit<\/b> primaire est compatible avec une dette stable, jusqu'à (<i>g<\/i> − <i>r<\/i>) × <i>d<\/i>. La croissance « dilue » la dette plus vite que les intérêts ne la gonflent.\"],\n  [\"r = g\",\"var(--rms)\",\"Il faut un budget primaire <b>à l'équilibre<\/b> pour stabiliser le ratio. Situation fragile : le moindre écart fait basculer.\"],\n  [\"r > g\",\"var(--warn)\",\"Il faut un <b>excédent<\/b> primaire. Sans lui, la dette croît d'elle-même : c'est l'effet « boule de neige ».\"]],\n ex:\"Exemple avec <i>d<\/i> = 100 % du PIB : si <i>r<\/i> − <i>g<\/i> = −1 point, un déficit primaire de 1 % du PIB stabilise la dette ; si <i>r<\/i> − <i>g<\/i> = +1 point, il faut un excédent de 1 %.\",\n b_t:\"Deux grandeurs qui gonflent\",\n b_d:\"Le ratio de dette est une fraction. Les intérêts font gonfler le numérateur <b>D<\/b> au rythme <b>r<\/b> ; la croissance fait gonfler le dénominateur <b>Y<\/b> au rythme <b>g<\/b>. Supposons le solde primaire nul, pour ne garder que ces deux forces. Ce qui compte n'est pas que la dette augmente, mais <b>laquelle des deux grandeurs gonfle le plus vite<\/b>. Réglez r et g, puis lancez le temps.\",\n b_pz:[[\"lo\",\"r < g\"],[\"eq\",\"r = g\"],[\"hi\",\"r > g\"]],\n b_r:\"Taux d'intérêt r, %\",b_g:\"Croissance nominale g, %\",\n b_play:\"▶ Lancer\",b_pause:\"❚❚ Pause\",b_again:\"↻ Relancer\",b_reset:\"Réinitialiser\",\n b_yr:\"Année {t}\",\n b_rates:\"<b class='dd'>D<\/b> : ×{fd} depuis le départ (intérêts à {r} %)<br><b class='yy'>Y<\/b> : ×{fy} depuis le départ (croissance de {g} %)\",\n bb_up:\"La dette gonfle plus vite que le PIB : le ratio <b>monte<\/b>, alors que l'État ne fait aucun déficit primaire.\",\n bb_dn:\"La dette augmente en euros, et pourtant le ratio <b>baisse<\/b> : le PIB gonfle plus vite qu'elle.\",\n bb_eq:\"Les deux gonflent au même rythme : le ratio <b>ne bouge pas<\/b>, quelle que soit la hausse de la dette en euros.\",\n b_next:\"Reste un seul autre levier : le <b>solde primaire<\/b>. Un déficit primaire ajoute chaque année au numérateur, un excédent en retire. C'est ce qu'ajoute le simulateur.\",\n s2t:\"Le simulateur de trajectoire\",\n s2d:\"Réglez la dette de départ, le taux, la croissance et le solde primaire : la courbe montre le ratio de dette sur 30 ans.\",\n pz:[[\"fr\",\"France 2024\"],[\"rg\",\"r < g, déficit stabilisant\"],[\"snow\",\"r > g, budget équilibré\"],[\"zero\",\"Croissance nulle\"]],\n ptxt:{fr:\"En 2024, la France a eu un déficit primaire d'environ 3,8 % du PIB (5,8 % de déficit, dont 2,0 % d'intérêts), pour un taux apparent d'environ 1,9 % et une croissance nominale de 3,5 %. Un déficit primaire de 1,7 % aurait suffi à stabiliser la dette ; elle est passée de 109,8 % à 113 % du PIB.\",\n  rg:\"Mêmes valeurs que la France en 2024, sauf le solde primaire : un déficit primaire de 1,7 % du PIB au lieu de 3,8 %. Comme r reste inférieur à g (1,9 % contre 3,5 %), ce déficit suffit à maintenir la dette autour de 113 % du PIB : réduire le déficit primaire d'environ 2 points de PIB suffit, sans viser l'équilibre budgétaire.\",\n  snow:\"Le taux dépasse la croissance de 3 points. Même sans aucun déficit primaire, la dette rapportée au PIB grimpe : les intérêts s'ajoutent à la dette plus vite que le PIB ne grandit.\",\n  zero:\"Sans croissance, il n'y a plus rien pour diluer la dette : le solde primaire stabilisant devient simplement <i>r<\/i> × <i>d<\/i>. Avec 2 % de taux et 100 % de dette, il faut 2 % du PIB d'excédent primaire, chaque année.\"},\n sl:{d0:\"Dette de départ, % du PIB\",r:\"Taux d'intérêt r, %\",g:\"Croissance nominale g, %\",p:\"Solde primaire p, % du PIB\"},\n k_ps:\"Solde primaire stabilisant p*\",k_gap:\"Écart p − p*\",k_10:\"Dette dans 10 ans\",k_30:\"Dette dans 30 ans\",\n lg_d:\"ratio de dette\",lg_d0:\"niveau de départ\",\n v_up:\"Le solde primaire ({p} %) est en dessous de ce qu'il faudrait ({ps} %) : le ratio <b>monte<\/b>.\",\n v_dn:\"Le solde primaire ({p} %) dépasse le niveau stabilisant ({ps} %) : le ratio <b>baisse<\/b>.\",\n v_eq:\"Le solde primaire est au niveau stabilisant : le ratio <b>reste stable<\/b>.\",\n b_up:\"en hausse\",b_dn:\"en baisse\",b_eq:\"stable\",\n s3t:\"Pas de seuil magique\",\n s3d:\"Le débat public cherche souvent un seuil de dette à ne pas franchir. L'équation montre pourquoi il n'en existe pas : ce qui compte est l'écart <b>r − g<\/b>, et ce qui fixe <b>r<\/b>.\",\n myths:[[\"60 %\",\"Le critère de Maastricht\",\"Fixé en 1992, il reprenait à peu près la dette moyenne des pays de la Communauté à l'époque. C'est une convention politique, pas un résultat d'économie.\"],\n  [\"90 %\",\"Le seuil de Reinhart et Rogoff\",\"En 2010, deux économistes concluent qu'au-delà de 90 % du PIB la croissance chute. En 2013, Herndon, Ash et Pollin retrouvent des erreurs de calcul et des exclusions de données : le seuil disparaît.\"],\n  [\"≈ 237 %\",\"Le Japon\",\"La dette la plus élevée des pays riches (FMI, 2024), sans crise : des taux proches de zéro pendant des décennies, une banque centrale qui détient environ la moitié des titres publics, des créanciers surtout résidents, une dette dans sa propre monnaie.\"],\n  [\"2010-2012\",\"La Grèce et la zone euro\",\"Une dette dans une monnaie que l'État n'émet pas, et pas d'acheteur en dernier ressort : quand les créanciers fuient, <i>r<\/i> s'envole pendant que <i>g<\/i> devient négatif. L'austérité imposée a fait chuter le PIB d'environ un quart, et le ratio de dette a continué de monter.\"]],\n z_t:\"Sans croissance, tout se joue sur r\",\n z_d:\"Si la transition écologique impose la sobriété, la croissance nominale <i>g<\/i> sera faible, voire nulle. Le solde primaire qui stabilise la dette devient alors simplement :\",\n z_d2:\"La soutenabilité de la dette ne dépend plus que du taux d'intérêt. Or ce taux, l'État ne le fixe pas : c'est la <b>banque centrale<\/b> qui le pilote. Le graphique le montre pour les titres à court terme : le taux auquel la France emprunte à 3 mois suit presque exactement le taux de la BCE.\",\n z_k1:\"Corrélation, 2019-2026\",z_k2:\"Écart moyen\",z_k3:\"Taux BCE, 2022 → 2023\",z_k4:\"Croissance prévue en 2026\",\n z_k2v:\"0,16 point\",z_k3v:\"−0,50 → 4,00 %\",z_k3s:\"en 14 mois\",z_k4s:\"zone euro, projection BCE (sept. 2026)\",\n z_lg1:\"taux de la facilité de dépôt de la BCE\",z_lg2:\"rendement des bons du Trésor français à 3 mois (BTF, moyenne mensuelle des adjudications)\",\n z_cases:[[\"2022-2023\",\"var(--warn)\",\"Pour freiner l'inflation née du choc énergétique, la BCE relève son taux de 4,5 points en 14 mois. Le taux des BTF suit, et anticipe même chaque décision. Le budget n'y est pour rien.\"],\n  [\"2024-2025\",\"var(--eco)\",\"La BCE redescend à 2 % : le taux à 3 mois redescend avec elle, au même rythme.\"],\n  [\"2026\",\"var(--rms)\",\"Nouveau choc énergétique (conflit au Moyen-Orient) : la BCE remonte à 2,50 % en juin et septembre, alors qu'elle prévoit une croissance de 0,9 % seulement. La hausse de la charge d'intérêts qui s'annonce est une conséquence de la politique monétaire, transmise peu à peu à toute la dette par le roulement (partie IV).\"]],\n z_deb_h:\"Un débat ouvert : coordonner budget et banque centrale ?\",\n z_deb:\"Dans une économie sans croissance, la politique budgétaire dépend donc de la politique monétaire. Pour les uns, il faut en tirer les conséquences : coordonner explicitement gouvernement et banque centrale, par exemple en garantissant des taux bas pour la dette qui finance la transition. Pour les autres, ce serait la fin de l'indépendance de la banque centrale, avec un risque d'inflation et de perte de crédibilité. Dans les deux cas, la question n'est plus seulement « combien l'État dépense-t-il ? », mais « à quel taux, et qui le décide ? ».\",\n l_h:\"La dette publique se juge à la course entre r et g, pas à son niveau.\",\n l_x:\"Le fil de la séance se referme. La dette privée porte le risque systémique ; l'épargne des ménages exige qu'un autre secteur dépense plus qu'il ne gagne ; l'État joue ce rôle et roule sa dette sans jamais la rembourser. Sa soutenabilité ne dépend alors ni d'un seuil ni de la vertu budgétaire seule, mais de l'écart entre le taux auquel il emprunte et la croissance de ses recettes — donc, en dernier ressort, de la banque centrale.\",\n foot:\"France 2024 : Insee, comptes nationaux des administrations publiques (mars 2025) : déficit 5,8 % du PIB, charge d'intérêts 58 Md€ (2,0 % du PIB), dette 113,0 % du PIB, 109,8 % en 2023 ; taux apparent ≈ 58 / 3 102,5. Japon : FMI (2024). Reinhart et Rogoff (2010), « Growth in a Time of Debt », <i>American Economic Review<\/i> ; Herndon, Ash et Pollin (2013), <i>Cambridge Journal of Economics<\/i>. Taux de la BCE : décisions de politique monétaire (dernière : 10 septembre 2026, effet le 16) ; rendement des BTF à 3 mois : résultats hebdomadaires des adjudications (Agence France Trésor, via metatrader.com et investing.com), moyenne mensuelle, septembre 2026 manquant ; croissance 2026 : projections BCE de septembre 2026.\"\n},\nen:{\n doc_title:\"The race between r and g\",prev:\"Previous\",next:\"Next\",assets:\"Assets\",liabs:\"Liabilities\",\n eyebrow:\"Session 6 · Public debt sustainability\",\n title:\"The race between r and g\",\n sub:\"Public debt is rolled over: it is not repaid, it is renewed at the going rate. So the relevant question is not “can it be repaid?” but “is its weight in the economy growing?”. The answer lies in a race between two rates: the interest rate <b>r<\/b> and the GDP growth rate <b>g<\/b>.\",\n s1t:\"The debt equation, step by step\",\n s1d:\"Five steps, from the stock of debt in euros to the stabilisation condition.\",\n steps:[\n  [\"Debt from one year to the next\",\"This year's debt is last year's, plus interest, minus the <b>primary balance<\/b> <i>P<\/i>: revenue minus spending <b>excluding interest<\/b>. A primary surplus (<i>P<\/i> > 0) reduces debt; a primary deficit increases it. People often say “budget balance”: here it is indeed the primary balance, since interest is already counted in (1 + <i>r<\/i>).\"],\n  [\"Relating debt to GDP\",\"A debt of 3,300 billion means nothing on its own: it must be compared with the incomes the state taxes. Divide everything by the year's GDP, <i>Y<sub>t<\/sub><\/i>.\"],\n  [\"Bringing growth in\",\"This year's GDP is last year's multiplied by (1 + <i>g<\/i>). Substituting gives the equation of the debt ratio <i>d<\/i> = <i>D<\/i>/<i>Y<\/i>, with <i>p<\/i> = <i>P<\/i>/<i>Y<\/i>. <i>r<\/i> and <i>g<\/i> are <b>nominal<\/b>: the rate paid and growth in current euros, inflation included.\"],\n  [\"The stabilisation condition\",\"The ratio is stable if <i>d<sub>t<\/sub><\/i> = <i>d<sub>t−1<\/sub><\/i>. This gives the primary balance <i>p<\/i>* that stabilises debt. Since <i>g<\/i> rarely exceeds a few percent, 1 + <i>g<\/i> ≈ 1.\"],\n  [\"Three cases\",\"Everything depends on the sign of <i>r<\/i> − <i>g<\/i>. To reduce the ratio, one must do better than <i>p<\/i>*; to stabilise it, reaching it is enough.\"]\n ],\n defs:[[\"D\",\"public debt, in euros\"],[\"r\",\"average interest rate paid on the debt\"],[\"P\",\"primary balance (excluding interest)\"],[\"t\",\"the year\"]],\n cases:[[\"r < g\",\"var(--eco)\",\"A primary <b>deficit<\/b> is compatible with stable debt, up to (<i>g<\/i> − <i>r<\/i>) × <i>d<\/i>. Growth “dilutes” the debt faster than interest swells it.\"],\n  [\"r = g\",\"var(--rms)\",\"A <b>balanced<\/b> primary budget is needed to stabilise the ratio. A fragile situation: the slightest gap tips it over.\"],\n  [\"r > g\",\"var(--warn)\",\"A primary <b>surplus<\/b> is needed. Without it, debt grows by itself: the “snowball” effect.\"]],\n ex:\"Example with <i>d<\/i> = 100% of GDP: if <i>r<\/i> − <i>g<\/i> = −1 point, a primary deficit of 1% of GDP stabilises debt; if <i>r<\/i> − <i>g<\/i> = +1 point, a surplus of 1% is needed.\",\n b_t:\"Two quantities that inflate\",\n b_d:\"The debt ratio is a fraction. Interest inflates the numerator <b>D<\/b> at rate <b>r<\/b>; growth inflates the denominator <b>Y<\/b> at rate <b>g<\/b>. Assume a zero primary balance, to keep only these two forces. What matters is not that debt rises, but <b>which of the two quantities inflates faster<\/b>. Set r and g, then start the clock.\",\n b_pz:[[\"lo\",\"r < g\"],[\"eq\",\"r = g\"],[\"hi\",\"r > g\"]],\n b_r:\"Interest rate r, %\",b_g:\"Nominal growth g, %\",\n b_play:\"▶ Start\",b_pause:\"❚❚ Pause\",b_again:\"↻ Restart\",b_reset:\"Reset\",\n b_yr:\"Year {t}\",\n b_rates:\"<b class='dd'>D<\/b>: ×{fd} since the start (interest at {r}%)<br><b class='yy'>Y<\/b>: ×{fy} since the start (growth of {g}%)\",\n bb_up:\"Debt inflates faster than GDP: the ratio <b>rises<\/b>, although the state runs no primary deficit.\",\n bb_dn:\"Debt rises in euros, and yet the ratio <b>falls<\/b>: GDP inflates faster than it.\",\n bb_eq:\"Both inflate at the same pace: the ratio <b>does not move<\/b>, however much debt rises in euros.\",\n b_next:\"Only one other lever remains: the <b>primary balance<\/b>. A primary deficit adds to the numerator each year, a surplus takes from it. This is what the simulator adds.\",\n s2t:\"The trajectory simulator\",\n s2d:\"Set the starting debt, the rate, growth and the primary balance: the curve shows the debt ratio over 30 years.\",\n pz:[[\"fr\",\"France 2024\"],[\"rg\",\"r < g, stabilising deficit\"],[\"snow\",\"r > g, balanced budget\"],[\"zero\",\"Zero growth\"]],\n ptxt:{fr:\"In 2024 France ran a primary deficit of about 3.8% of GDP (5.8% deficit, of which 2.0% interest), with an effective rate of about 1.9% and nominal growth of 3.5%. A primary deficit of 1.7% would have been enough to stabilise debt; it rose from 109.8% to 113% of GDP.\",\n  rg:\"Same values as France in 2024, except the primary balance: a primary deficit of 1.7% of GDP instead of 3.8%. Since r stays below g (1.9% against 3.5%), this deficit is enough to hold debt around 113% of GDP: cutting the primary deficit by about 2 points of GDP is enough, with no need to balance the budget.\",\n  snow:\"The rate exceeds growth by 3 points. Even with no primary deficit at all, debt relative to GDP climbs: interest adds to the debt faster than GDP grows.\",\n  zero:\"With no growth, nothing dilutes the debt any more: the stabilising primary balance becomes simply <i>r<\/i> × <i>d<\/i>. With a 2% rate and 100% debt, a primary surplus of 2% of GDP is needed, every year.\"},\n sl:{d0:\"Starting debt, % of GDP\",r:\"Interest rate r, %\",g:\"Nominal growth g, %\",p:\"Primary balance p, % of GDP\"},\n k_ps:\"Stabilising primary balance p*\",k_gap:\"Gap p − p*\",k_10:\"Debt in 10 years\",k_30:\"Debt in 30 years\",\n lg_d:\"debt ratio\",lg_d0:\"starting level\",\n v_up:\"The primary balance ({p}%) is below what is needed ({ps}%): the ratio <b>rises<\/b>.\",\n v_dn:\"The primary balance ({p}%) exceeds the stabilising level ({ps}%): the ratio <b>falls<\/b>.\",\n v_eq:\"The primary balance is at the stabilising level: the ratio <b>stays stable<\/b>.\",\n b_up:\"rising\",b_dn:\"falling\",b_eq:\"stable\",\n s3t:\"No magic threshold\",\n s3d:\"Public debate often looks for a debt threshold not to be crossed. The equation shows why there is none: what matters is the gap <b>r − g<\/b>, and what sets <b>r<\/b>.\",\n myths:[[\"60%\",\"The Maastricht criterion\",\"Set in 1992, it roughly matched the average debt of Community countries at the time. A political convention, not an economic result.\"],\n  [\"90%\",\"The Reinhart-Rogoff threshold\",\"In 2010 two economists concluded that above 90% of GDP growth collapses. In 2013 Herndon, Ash and Pollin found spreadsheet errors and data exclusions: the threshold vanished.\"],\n  [\"≈ 237%\",\"Japan\",\"The highest debt among rich countries (IMF, 2024), with no crisis: rates close to zero for decades, a central bank holding about half of government bonds, mostly domestic creditors, debt in its own currency.\"],\n  [\"2010-2012\",\"Greece and the euro area\",\"Debt in a currency the state does not issue, and no buyer of last resort: when creditors flee, <i>r<\/i> soars while <i>g<\/i> turns negative. The austerity imposed cut GDP by about a quarter, and the debt ratio kept rising.\"]],\n z_t:\"Without growth, everything hinges on r\",\n z_d:\"If the ecological transition demands sufficiency, nominal growth <i>g<\/i> will be low, even zero. The primary balance that stabilises debt then becomes simply:\",\n z_d2:\"Debt sustainability then depends on the interest rate alone. And that rate is not set by the state: the <b>central bank<\/b> steers it. The chart shows it for short-term bills: the rate at which France borrows for 3 months follows the ECB rate almost exactly.\",\n z_k1:\"Correlation, 2019-2026\",z_k2:\"Average gap\",z_k3:\"ECB rate, 2022 → 2023\",z_k4:\"Growth projected for 2026\",\n z_k2v:\"0.16 point\",z_k3v:\"−0.50 → 4.00%\",z_k3s:\"in 14 months\",z_k4s:\"euro area, ECB projection (Sept. 2026)\",\n z_lg1:\"ECB deposit facility rate\",z_lg2:\"yield on French 3-month Treasury bills (BTF, monthly average of auctions)\",\n z_cases:[[\"2022-2023\",\"var(--warn)\",\"To curb inflation born of the energy shock, the ECB raises its rate by 4.5 points in 14 months. The BTF yield follows, and even anticipates each decision. The budget plays no part in it.\"],\n  [\"2024-2025\",\"var(--eco)\",\"The ECB comes back down to 2%: the 3-month yield comes down with it, at the same pace.\"],\n  [\"2026\",\"var(--rms)\",\"A new energy shock (conflict in the Middle East): the ECB goes back up to 2.50% in June and September, while projecting growth of only 0.9%. The coming rise in the interest burden is a consequence of monetary policy, passed on gradually to the whole debt through rollover (part IV).\"]],\n z_deb_h:\"An open debate: coordinating the budget and the central bank?\",\n z_deb:\"In an economy without growth, fiscal policy thus depends on monetary policy. For some, the conclusion follows: explicitly coordinate government and central bank, for instance by guaranteeing low rates on the debt that finances the transition. For others, this would end central bank independence, with a risk of inflation and lost credibility. Either way, the question is no longer only “how much does the state spend?” but “at what rate, and who decides?”.\",\n l_h:\"Public debt is judged by the race between r and g, not by its level.\",\n l_x:\"The thread of the session closes. Private debt carries systemic risk; household saving requires another sector to spend more than it earns; the state plays that role and rolls its debt over without ever repaying it. Its sustainability then depends neither on a threshold nor on fiscal virtue alone, but on the gap between the rate at which it borrows and the growth of its revenue — hence, in the last resort, on the central bank.\",\n foot:\"France 2024: Insee, general government accounts (March 2025): deficit 5.8% of GDP, interest 58 bn€ (2.0% of GDP), debt 113.0% of GDP, 109.8% in 2023; effective rate ≈ 58 / 3,102.5. Japan: IMF (2024). Reinhart and Rogoff (2010), “Growth in a Time of Debt”, <i>American Economic Review<\/i>; Herndon, Ash and Pollin (2013), <i>Cambridge Journal of Economics<\/i>. ECB rate: monetary policy decisions (latest: 10 September 2026, effective on the 16th); 3-month BTF yield: weekly auction results (Agence France Trésor, via metatrader.com and investing.com), monthly average, September 2026 missing; 2026 growth: ECB September 2026 projections.\"\n}};\n\nvar st1=null;\nfunction renderS1(k){var d=D();$('st1t').innerHTML=d.steps[k][0];$('st1f').innerHTML=F[k];$('st1x').innerHTML=d.steps[k][1];\n  var ex='';\n  if(k===0)ex='<div class=\"defs\">'+d.defs.map(function(x){return '<div><b>'+x[0]+'<\/b>'+x[1]+'<\/div>';}).join('')+'<\/div>';\n  if(k===4)ex='<div class=\"cases\">'+d.cases.map(function(c){return '<div class=\"case\" style=\"border-top:3px solid '+c[1]+'\"><b class=\"h\" style=\"color:'+c[1]+'\">'+c[0]+'<\/b>'+c[2]+'<\/div>';}).join('')+'<\/div><p class=\"steptext\" style=\"margin-top:10px\">'+d.ex+'<\/p>';\n  $('st1extra').innerHTML=ex;}\nvar Q={d0:113,r:1.9,g:3.5,p:-3.8},PREM=false,BC=false,CUR='fr';\nvar PZ={fr:{d0:113,r:1.9,g:3.5,p:-3.8,prem:false,bc:false},rg:{d0:113,r:1.9,g:3.5,p:-1.7,prem:false,bc:false},snow:{d0:100,r:5,g:2,p:0,prem:false,bc:false},zero:{d0:100,r:2,g:0,p:0,prem:false,bc:false}};\nvar RG={d0:[0,250,1],r:[-1,10,0.1],g:[-3,8,0.1],p:[-8,6,0.1]};\nfunction rate(dprev){return Q.r;}\nfunction sim(){var d=[Q.d0],rr=[rate(Q.d0)];for(var t=1;t<=30;t++){var r=rate(d[t-1]);var x=(1+r/100)/(1+Q.g/100)*d[t-1]-Q.p;if(x>400)x=400;if(x<0)x=0;d.push(x);rr.push(rate(x));}return {d:d,r:rr};}\nfunction renderCtrl(){var d=D(),box=$('ctrl');\n  if(!box.childElementCount){Object.keys(RG).forEach(function(k){var f=document.createElement('div');f.className='field';f.setAttribute('data-k',k);\n    f.innerHTML='<label><span class=\"nm\"><\/span><span class=\"vv\"><\/span><\/label><input type=\"range\" min=\"'+RG[k][0]+'\" max=\"'+RG[k][1]+'\" step=\"'+RG[k][2]+'\">';\n    f.querySelector('input').addEventListener('input',function(e){Q[k]=+e.target.value;CUR=null;renderS2();});box.appendChild(f);});}\n  box.querySelectorAll('.field').forEach(function(f){var k=f.getAttribute('data-k');f.querySelector('.nm').innerHTML=d.sl[k];f.querySelector('input').value=Q[k];\n    f.querySelector('.vv').textContent=(k==='d0'?fmt(Q[k],0):(k==='p'?sfmt(Q[k],1):fmt(Q[k],1)))+' %';});\n  var pz=$('presets');pz.innerHTML='';d.pz.forEach(function(p){var b=document.createElement('button');b.className='pz'+(CUR===p[0]?' on':'');b.textContent=p[1];\n    b.addEventListener('click',function(){var z=PZ[p[0]];Q.d0=z.d0;Q.r=z.r;Q.g=z.g;Q.p=z.p;PREM=z.prem;BC=z.bc;CUR=p[0];renderS2();});pz.appendChild(b);});\n  $('ptxt').innerHTML=CUR?d.ptxt[CUR]:'';}\nfunction renderS2(){var d=D();renderCtrl();var s=sim();\n  var reff=rate(Q.d0);var ps=(reff-Q.g)/(100+Q.g)*Q.d0;var gap=Q.p-ps;\n  var mx=Math.max(150,Math.max.apply(null,s.d));var ymax=Math.ceil(mx/50)*50;var ticks=[];for(var v=0;v<=ymax;v+=50)ticks.push(v);\n  var showR=false;\n  var cut=-1;for(var i=0;i<s.d.length;i++){if(s.d[i]>=400){cut=i;break;}}\n  var dv=s.d.map(function(x,i){return cut>=0&&i>cut?null:x;}),rv=s.r.map(function(x,i){return cut>=0&&i>cut?null:x*10;});\n  var series=[{vals:s.d.map(function(){return Q.d0;}),color:'var(--faint)',dash:'3 4',w:1.4},{vals:dv,color:'var(--warn)',end:cut<0,w:2.8}];\n  if(showR)series.push({vals:rv,color:'var(--rms)',dash:'6 3',w:1.8});\n  lineChart($('c2'),{n:31,ymin:0,ymax:ymax,yticks:ticks,xticks:[0,5,10,15,20,25,30],H:270,fy:function(v){return v+'%';},series:series});\n  var d10=s.d[10],d30=s.d[30];\n  function kp(l,v,c){return '<div class=\"kpi\"><div class=\"kl\">'+l+'<\/div><div class=\"kv\" style=\"color:'+c+'\">'+v+'<\/div><\/div>';}\n  $('k2').innerHTML=kp(d.k_ps,sfmt(ps,2)+' %','var(--econ)')+kp(d.k_gap,sfmt(gap,2),gap<-0.05?'var(--warn)':'var(--eco)')+kp(d.k_10,(d10>=400?'> 400':fmt(d10,0))+' %','var(--warn)')+kp(d.k_30,(d30>=400?'> 400':fmt(d30,0))+' %','var(--warn)');\n  var trend=d30-Q.d0;var b,t;\n  if(Math.abs(gap)<0.05){b='<span class=\"badge mid\">'+d.b_eq+'<\/span>';t=d.v_eq;}\n  else if(gap<0){b='<span class=\"badge no\">'+d.b_up+'<\/span>';t=d.v_up.replace('{p}',sfmt(Q.p,1)).replace('{ps}',sfmt(ps,2));}\n  else{b='<span class=\"badge ok\">'+d.b_dn+'<\/span>';t=d.v_dn.replace('{p}',sfmt(Q.p,1)).replace('{ps}',sfmt(ps,2));}\n  $('verd').innerHTML=b+'<span class=\"t\">'+t+'<\/span>';}\nfunction renderMyths(){var d=D();$('myths').innerHTML=d.myths.map(function(m){return '<div class=\"myth\"><div class=\"mn\">'+m[0]+'<\/div><div class=\"mt\">'+m[1]+'<\/div><p>'+m[2]+'<\/p><\/div>';}).join('');}\n/* section 2 : deux ballons */\nvar B={r:4,g:2,t:0,run:false,last:0,pz:'hi'},BPZ={lo:{r:2,g:4},eq:{r:3,g:3},hi:{r:4,g:2}},BT=30;\nfunction renderBctl(){var d=D(),box=$('bctrl');\n  if(!box.childElementCount){[['r','b_r'],['g','b_g']].forEach(function(x){var f=document.createElement('div');f.className='field';f.setAttribute('d       case 'course':      return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17C9 17 13 13.5 20 5.5" stroke="'+a+'"/><path d="M4.5 17C9 17 13 15.5 20 13.5"/></svg>';
      case 'ratio':       return S+'<path d="M3 20h18"/><rect x="5.5" y="4.5" width="4.6" height="15.5" rx="1.2" stroke="'+a+'"/><rect x="13.9" y="15" width="4.6" height="5" rx="1.2"/></svg>';
      case 'ecart':       return S+'<path d="M3 20h18"/><path d="M4 7h16" stroke="'+a+'"/><path d="M4 12.6C9 12.6 13.5 16 20 17"/><path d="M12 7.6v6.9" stroke="var(--faint)"/><path d="M12 7.6l-1.5 1.7M12 7.6l1.5 1.7M12 14.5l-1.5-1.7M12 14.5l1.5-1.7" stroke="var(--faint)"/></svg>';
    }
    return S+'<circle cx="12" cy="12" r="8" stroke="'+a+'"/></svg>';
  }

  /* ───────── état ───────── */
  var LANG = CFG.langue_defaut || 'fr';
  try{ var sl=localStorage.getItem(PREFIXE+'_lang'); if(sl) LANG=sl; }catch(e){}
  var THEME=null;
  try{ var st=localStorage.getItem(PREFIXE+'_theme'); if(st) THEME=st; }catch(e){}
  if(!THEME) THEME = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', THEME);

  function T(){ return CFG.textes[LANG]; }

  function seed(){
    for(var i=0;i<N;i++){
      try{
        localStorage.setItem(STEPS[i].cle+'_theme', THEME);
        localStorage.setItem(STEPS[i].cle+'_lang',  LANG);
      }catch(e){}
    }
    try{ localStorage.setItem(PREFIXE+'_theme',THEME); localStorage.setItem(PREFIXE+'_lang',LANG); }catch(e){}
  }

  /* ───────── le fil ───────── */
  function carte(i){
    var d=T(), s=STEPS[i];
    var a=document.createElement('a');
    a.className='card'; a.href='#/'+(i+1);
    a.innerHTML='<span class="emb" style="color:'+tok(s.couleur)+'">'+emb(s.icone,s.couleur)+'</span>'+
      '<span class="cbody"><span class="idx">'+(i+1)+'</span>'+
      '<h3>'+d.cartes[i].titre+'</h3><p>'+d.cartes[i].resume+'</p>'+
      '<span class="go">'+d.nav_ouvrir+' →</span></span>';
    return a;
  }

  /* Une partie sans numéro est un seuil : elle ouvre la séance sans être
     comptée dans les parties. Le fil l'annonce par une étiquette, le bandeau
     par un repère discret placé avant les chiffres romains. */
  function estSeuil(p){ var P=PARTIES[p-1]; return !!P.seuil || !P.numero; }
  function marque(p){ return estSeuil(p) ? '◦' : PARTIES[p-1].numero; }
  function etiquette(p){
    var e=T().parties[p-1].etiquette;
    return e || (LANG==='en' ? 'Opening' : 'Ouverture');
  }

  function buildFil(){
    var d=T(), box=document.getElementById('parties');
    box.innerHTML='';
    for(var p=1;p<=NP;p++){
      var sec=document.createElement('section');
      sec.className='part'+(estSeuil(p)?' seuil':'');
      sec.style.setProperty('--pc', tok(PARTIES[p-1].couleur));
      var rang = estSeuil(p)
        ? '<span class="sn">'+etiquette(p)+'</span>'
        : '<span class="rn">'+PARTIES[p-1].numero+'</span>';
      var h='<div class="parthead">'+rang+
            '<h2>'+d.parties[p-1].titre+'</h2></div>'+
            '<p class="partlead">'+d.parties[p-1].chapo+'</p>'+
            '<div class="cards"></div>';
      sec.innerHTML=h;
      var grille=sec.querySelector('.cards');
      for(var i=0;i<N;i++) if(STEPS[i].partie===p) grille.appendChild(carte(i));
      box.appendChild(sec);
    }
  }

  /* ───────── bandeau de situation ───────── */
  function premierDe(p){ for(var j=0;j<N;j++) if(STEPS[j].partie===p) return j; return 0; }

  function buildNav(i){
    var d=T(), s=STEPS[i], cur=null,
        bar=document.getElementById('nparts'), box=document.getElementById('steps');
    document.documentElement.style.setProperty('--acc', tok(PARTIES[s.partie-1].couleur));
    document.getElementById('ncount').textContent=(i+1)+' / '+N;

    bar.innerHTML='';
    for(var p=1;p<=NP;p++){
      if(p===s.partie){
        var c=document.createElement('span');
        c.className='pcur';
        /* Séance à une seule partie : le repère n'oppose la partie à rien,
           il ne reste que son intitulé. */
        c.innerHTML=(NP>1?'<em>'+marque(p)+'</em>':'')+'<span>'+d.parties[p-1].titre+'</span>';
        c.setAttribute('aria-current','true');
        bar.appendChild(c);
      } else {
        var g=document.createElement('a');
        g.className='pgrp';
        g.href='#/'+(premierDe(p)+1);
        g.title=(estSeuil(p)?etiquette(p):PARTIES[p-1].numero)+' · '+d.parties[p-1].titre;
        g.textContent=marque(p);
        bar.appendChild(g);
      }
    }

    box.innerHTML='';
    for(var j=0;j<N;j++){
      if(STEPS[j].partie!==s.partie) continue;
      var a=document.createElement('a');
      a.className='stp'+(j===i?' on':'');
      a.href='#/'+(j+1);
      a.title=d.cartes[j].titre;
      a.innerHTML='<em>'+(j+1)+'</em><span>'+d.cartes[j].titre+'</span>';
      if(j===i){ a.setAttribute('aria-current','true'); cur=a; }
      box.appendChild(a);
    }
    /* le bandeau peut être encore masqué : on attend une frame pour mesurer */
    if(cur) requestAnimationFrame(function(){
      box.scrollLeft = Math.max(0, cur.offsetLeft - (box.clientWidth - cur.offsetWidth)/2);
    });
  }

  /* ───────── iframes ───────── */
  var host=document.getElementById('host'), frames={}, current=-1;

  /* Une iframe capte le clavier dès qu'on a cliqué dedans, et la coquille ne
     voit plus rien. On y relaie donc Échap et F — et seulement eux : les
     flèches appartiennent aux outils, qui s'en servent pour leurs propres
     étapes. Les iframes srcdoc héritent de notre origine, d'où l'accès. */
  function brancherClavier(fr){
    try{
      var doc=fr.contentDocument; if(!doc) return;
      doc.addEventListener('keydown', function(ev){
        if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
        if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
        else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
      });
    }catch(e){}
  }

  function syncFrame(fr){
    if(!fr) return;
    try{
      var doc=fr.contentDocument;
      if(!doc || !doc.documentElement) return;
      for(var n=0;n<2;n++){
        if(doc.documentElement.getAttribute('data-theme')===THEME) break;
        var tb=doc.getElementById('theme'); if(!tb) break; tb.click();
      }
      for(var m=0;m<2;m++){
        if((doc.documentElement.lang||'fr')===LANG) break;
        var lb=doc.getElementById('lang'); if(!lb) break; lb.click();
      }
    }catch(e){}
  }

  function showTool(i){
    var s=STEPS[i], d=T();
    document.body.classList.add('mode-tool');
    seed();
    if(!frames[s.fichier]){
      var fr=document.createElement('iframe');
      fr.setAttribute('title', d.cartes[i].titre);
      host.appendChild(fr);
      frames[s.fichier]=fr;
      fr.addEventListener('load', function(){ syncFrame(fr); brancherClavier(fr); });
      fr.srcdoc = TOOLS[s.fichier];
    } else {
      syncFrame(frames[s.fichier]);
    }
    for(var k in frames) frames[k].style.display = (k===s.fichier) ? 'block' : 'none';
    if(plein) montrerNav(1600);
    current=i;
    buildNav(i);
    var pb=document.getElementById('prev'), nb=document.getElementById('next');
    pb.disabled=(i===0); nb.disabled=(i===N-1);
    pb.title=d.nav_prec; nb.title=d.nav_suiv;
  }

  function showFil(){
    if(plein) setPlein(false);
    document.body.classList.remove('mode-tool');
    current=-1;
    window.scrollTo(0, window.__filScroll||0);
  }

  /* ───────── plein écran ───────── */
  var plein=false, minuterieNav=null, minuterieAstuce=null;

  function montrerNav(delaiMasquage){
    document.body.classList.add('nav-on');
    clearTimeout(minuterieNav);
    if(delaiMasquage) minuterieNav=setTimeout(function(){
      document.body.classList.remove('nav-on');
    }, delaiMasquage);
  }

  function demanderPleinEcran(){
    var el=document.documentElement;
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(f){ try{ var p=f.call(el); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }
  function quitterPleinEcran(){
    var actif=document.fullscreenElement||document.webkitFullscreenElement;
    if(!actif) return;
    var f=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(f){ try{ var p=f.call(document); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }

  function setPlein(v){
    if(plein===v) return;
    plein=v;
    document.body.classList.toggle('mode-plein', v);
    var b=document.getElementById('tplein'), d=T();
    b.textContent = v ? '⤡' : '⤢';
    b.title = v ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    if(v){
      demanderPleinEcran();
      montrerNav(2400);
      document.getElementById('pastille').textContent =
        (d.nav_plein_astuce||'Approchez du haut pour revoir la barre · Échap pour sortir');
      document.body.classList.add('astuce');
      clearTimeout(minuterieAstuce);
      /* l'astuce doit rester lisible après le retrait du bandeau, pas pendant */
      minuterieAstuce=setTimeout(function(){ document.body.classList.remove('astuce'); }, 6500);
    } else {
      quitterPleinEcran();
      clearTimeout(minuterieNav); clearTimeout(minuterieAstuce);
      document.body.classList.remove('nav-on','astuce');
    }
  }

  document.getElementById('tplein').addEventListener('click', function(){ setPlein(!plein); });
  document.getElementById('hotzone').addEventListener('mouseenter', function(){ montrerNav(0); });
  document.querySelector('.nav').addEventListener('mouseleave', function(){ if(plein) montrerNav(500); });
  /* Sortie par F11 ou par la touche Échap interceptée par le navigateur :
     on resynchronise la coquille sur l'état réel. */
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement||document.webkitFullscreenElement) && plein) setPlein(false);
    });
  });

  function route(){
    var h=(location.hash||'').replace(/^#\/?/,'');
    var n=parseInt(h,10);
    if(h && !isNaN(n) && n>=1 && n<=N){
      if(current===-1) window.__filScroll = window.pageYOffset||0;
      showTool(n-1);
    } else {
      showFil();
    }
  }
  window.addEventListener('hashchange', route);

  function go(i){
    if(i<0){ location.hash='#/fil'; return; }
    if(i>N-1) return;
    location.hash='#/'+(i+1);
  }
  document.getElementById('prev').addEventListener('click', function(){ if(current>0) go(current-1); });
  document.getElementById('next').addEventListener('click', function(){ if(current>-1 && current<N-1) go(current+1); });

  document.addEventListener('keydown', function(ev){
    if(current===-1) return;
    if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
    else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
    else if(ev.key==='ArrowLeft'  && current>0)   { go(current-1); }
    else if(ev.key==='ArrowRight' && current<N-1) { go(current+1); }
  });

  /* ───────── bascules ───────── */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', THEME);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleTheme(){ THEME=(THEME==='dark')?'light':'dark'; applyTheme(); }
  document.getElementById('theme').addEventListener('click', toggleTheme);
  document.getElementById('ttheme').addEventListener('click', toggleTheme);

  function applyLang(){
    var d=T();
    document.documentElement.lang=LANG;
    document.title = d.titre_onglet;
    document.getElementById('eyebrow').innerHTML = d.surtitre;
    document.getElementById('titre').textContent = d.titre;
    document.getElementById('seance').textContent = d.seance;
    document.getElementById('chapo').innerHTML = d.chapo;
    document.getElementById('pied').innerHTML = d.pied;
    document.getElementById('licence').innerHTML = d.licence;
    document.getElementById('homelbl').textContent = d.nav_fil;
    /* Remontée vers la page du cours : seulement si le manifeste la déclare.
       Une séance diffusée seule, sans page d'accueil à côté, n'affiche rien
       plutôt qu'un lien qui mènerait à une erreur. */
    var lien = CFG.lien_accueil, rm = document.getElementById('remonte'),
        ab = document.getElementById('accueilbtn');
    if(lien){
      rm.href = lien; ab.href = lien;
      rm.hidden = false; ab.hidden = false;
      document.getElementById('remontelbl').textContent = d.nav_accueil || 'Le cours';
      ab.title = d.nav_accueil || 'Le cours';
    } else {
      rm.hidden = true; ab.hidden = true;
    }
    var bp=document.getElementById('tplein');
    bp.title = plein ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    document.getElementById('langlbl').textContent = LANG.toUpperCase();
    document.getElementById('tlanglbl').textContent = LANG.toUpperCase();
    buildFil();
    if(current>-1) buildNav(current);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleLang(){
    var codes=Object.keys(CFG.textes);
    LANG = codes[(codes.indexOf(LANG)+1) % codes.length];
    applyLang();
  }
  document.getElementById('lang').addEventListener('click', toggleLang);
  document.getElementById('tlang').addEventListener('click', toggleLang);

  /* ───────── démarrage ───────── */
  seed();
  applyLang();
  route();
})();
</script>

</body>
</html>
