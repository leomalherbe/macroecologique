<title>Macroéconomie écologique — Séance 6 : le fil du cours</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;
    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;
    --econ:#2A78D6;--eco:#2E8B57;--rms:#C08A00;--warn:#C0392B;--fish:#0E7C9B;
    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);
    --font-d:"Spectral","IBM Plex Sans",Georgia,serif;/* IBM Plex en second : Spectral n'a pas le grec, β et α y retomberaient sur Georgia */--font-b:"IBM Plex Sans",system-ui,sans-serif;--font-m:"IBM Plex Mono",ui-monospace,monospace;
  }
  :root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    --bg:#0D1319;--surface:#161D24;--panel:#111820;
    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;
    --econ:#3987E5;--eco:#41A76D;--rms:#D6A83A;--warn:#E0705F;--fish:#38A9C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}
  body.mode-tool{overflow:hidden;}

  /* ───────── vue « fil » ───────── */
  .wrap{max-width:1080px;margin:0 auto;padding-block:28px 56px;padding-inline:20px;}
  header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .remonte{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-m);font-size:11.5px;color:var(--faint);text-decoration:none;margin:0 0 12px;padding:3px 0;}
  .remonte:hover{color:var(--ink);}
  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:400;margin:0 0 7px;text-wrap:pretty;}
  .eyebrow b{color:var(--fish);font-weight:500;}
  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.6vw,44px);line-height:1.03;margin:0;letter-spacing:-.015em;text-wrap:balance;}
  .seance{font-family:var(--font-d);font-weight:500;font-size:clamp(17px,2.1vw,21px);line-height:1.15;color:var(--muted);margin:7px 0 0;}
  .sub{color:var(--muted);font-size:15.5px;margin:14px 0 0;max-width:80ch;text-wrap:pretty;}
  .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}
  .toggles{display:flex;gap:8px;flex-shrink:0;}
  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}
  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}
  .tg:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--rms);outline-offset:2px;}

  .part{margin-top:40px;}
  .parthead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px;}
  .parthead .rn{font-family:var(--font-m);font-size:12px;font-weight:600;color:#fff;background:var(--pc);border-radius:7px;padding:3px 10px;line-height:1;flex-shrink:0;}
  /* Une partie-seuil ouvre la séance sans prendre de rang : étiquette ajourée
     plutôt que badge plein, pour qu'elle ne se lise pas comme une partie I. */
  .parthead .sn{font-family:var(--font-m);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--pc);background:transparent;border:1px solid var(--pc);border-radius:7px;padding:3px 9px;line-height:1;flex-shrink:0;}
  .parthead h2{font-family:var(--font-d);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance;}
  .partlead{color:var(--muted);font-size:14px;margin:10px 0 16px;max-width:84ch;text-wrap:pretty;}
  .partlead b{color:var(--ink);font-weight:600;} .partlead i{font-family:var(--font-d);font-style:italic;}

  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media (max-width:680px){.cards{grid-template-columns:1fr;}}
  a.card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;transition:border-color .15s,transform .15s;}
  a.card:hover{border-color:var(--faint);transform:translateY(-1px);}
  .emb{flex-shrink:0;width:46px;height:46px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
  .emb svg{width:26px;height:26px;}
  .cbody{flex:1;min-width:0;}
  .cbody .idx{font-family:var(--font-m);font-size:11px;color:var(--faint);}
  .cbody h3{font-family:var(--font-d);font-weight:600;font-size:16.5px;margin:1px 0 3px;line-height:1.15;text-wrap:balance;}
  .cbody p{font-size:12.8px;color:var(--muted);margin:0;text-wrap:pretty;}
  .cbody .go{font-family:var(--font-m);font-size:11.5px;color:var(--fish);font-weight:500;margin-top:7px;display:inline-block;}

  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px;text-align:center;text-wrap:balance;}
  footer p{margin:0 0 7px;} footer p:last-child{margin-bottom:0;}
  footer a{color:var(--muted);text-decoration:underline;text-underline-offset:2px;}
  footer a:hover{color:var(--ink);}
  .lic{max-width:62ch;margin-inline:auto;text-wrap:pretty;line-height:1.6;}
  .lic a{white-space:nowrap;}

  /* ───────── vue « outil » ───────── */
  #view-tool{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);}
  body.mode-tool #view-tool{display:flex;}
  body.mode-tool #view-fil{display:none;}
  .nav{display:flex;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;}
  .navrow{display:flex;align-items:center;gap:10px;padding:7px 14px;}
  .navrow.r1{min-height:46px;}
  .nbtn{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:7px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1;}
  .nbtn:hover:not([disabled]){color:var(--ink);border-color:var(--faint);}
  .nbtn[disabled]{opacity:.35;cursor:default;}
  .nbtn.home{color:var(--ink);font-weight:500;}
  .nparts{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding-inline:4px;}
  .pcur{display:inline-flex;align-items:baseline;gap:9px;min-width:0;font-family:var(--font-d);font-weight:600;font-size:15.5px;line-height:1.15;white-space:nowrap;}
  .pcur em{font-family:var(--font-m);font-style:normal;font-size:12px;font-weight:600;color:var(--acc);flex-shrink:0;}
  .pcur span{overflow:hidden;text-overflow:ellipsis;}
  .ngroup{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .ncount{font-family:var(--font-m);font-size:11.5px;color:var(--faint);min-width:46px;text-align:center;}

  .navrow.r2{gap:4px;border-top:1px solid var(--line);padding-block:5px;overflow-x:auto;scrollbar-width:none;background:var(--panel);}
  .navrow.r2::-webkit-scrollbar{display:none;}
  .stp{display:inline-flex;align-items:baseline;gap:7px;flex:0 0 auto;min-width:0;max-width:260px;padding:5px 10px;border-radius:8px;border:1px solid transparent;text-decoration:none;color:var(--faint);font-size:12.5px;line-height:1.2;white-space:nowrap;}
  .stp em{font-family:var(--font-m);font-style:normal;font-size:10.5px;flex-shrink:0;opacity:.8;}
  .stp span{overflow:hidden;text-overflow:ellipsis;}
  .stp:hover{color:var(--ink);background:var(--surface);}
  .stp.on{color:var(--ink);font-weight:600;background:var(--surface);border-color:var(--line);box-shadow:inset 2px 0 0 var(--acc);max-width:none;}
  .stp.on em{color:var(--acc);opacity:1;}
  .pgrp{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);text-decoration:none;font-family:var(--font-m);font-size:11px;font-weight:600;color:var(--faint);line-height:1;}
  .pgrp:hover{color:var(--ink);background:var(--surface);border-color:var(--faint);}

  .host{flex:1;position:relative;min-height:0;}
  .host iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);}

  /* ───────── plein écran ─────────
     Le bandeau se retire au-dessus du bord et revient dès que le pointeur
     approche du haut. La bande de déclenchement #hotzone appartient à la page
     hôte : indispensable, car une iframe absorbe les mouvements de souris et
     la coquille ne les verrait jamais. */
  body.mode-plein .nav{position:absolute;top:0;left:0;right:0;z-index:6;
    transform:translateY(-100%);transition:transform .18s ease;box-shadow:0 8px 26px rgba(0,0,0,.20);}
  body.mode-plein.nav-on .nav{transform:none;}
  #hotzone{display:none;}
  body.mode-plein #hotzone{display:block;position:absolute;top:0;left:0;right:0;height:6px;z-index:7;}
  body.mode-plein.nav-on #hotzone{display:none;}
  .pastille{display:none;}
  body.mode-plein .pastille{display:block;position:absolute;top:10px;right:14px;z-index:5;
    font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;color:var(--faint);
    background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 9px;
    opacity:0;transition:opacity .4s ease;pointer-events:none;}
  body.mode-plein.astuce .pastille{opacity:.92;}
  @media (prefers-reduced-motion:reduce){
    body.mode-plein .nav{transition:none;} .pastille{transition:none;}
  }
  @media (max-width:640px){
    .pcur{font-size:13.5px;}
    .nbtn{padding:7px 8px;} .ncount{min-width:38px;}
    .nbtn.home span{display:none;}
    .stp{max-width:200px;}
    .navrow{padding-inline:10px;}
  }
</style>
</head>

ie ne revient pas aux entreprises, et le déficit de l'État comble le trou ; les balances sectorielles en font une identité comptable. Le deuxième ouvre la <b>mécanique<\/b> : la pyramide monétaire, l'émission bilan par bilan, le roulement, et la courbe des taux qui en fixe le coût. Le troisième pose la seule question qui compte — la course entre le taux d'intérêt et la croissance — puis demande qui fixe ce taux : la <b>banque centrale<\/b>. Sept outils interactifs, dans l'ordre du fil : chacun s'ouvre ici même, et l'on revient au fil d'un clic.", "parties": [{"titre": "D'où vient la dette publique", "chapo": "Le débat public ne parle que de la dette de l'État. Dans la plupart des grandes économies, c'est pourtant la plus petite des deux : celle des <b>ménages et des entreprises<\/b> pèse davantage, et c'est elle qui, dans l'histoire, déclenche les crises — la dette publique arrive après, quand l'État ramasse les morceaux. Mais elle n'arrive pas qu'après les crises. La séance 4 s'était refermée sur un problème : quand les ménages épargnent, une partie de la monnaie ne revient pas aux entreprises. Le <b>déficit public<\/b> comble ce trou, et la comptabilité nationale en fait une identité — les soldes financiers des trois secteurs <b>s'annulent toujours<\/b>. L'épargne du privé et la dette publique sont une même grandeur, vue des deux côtés."}, {"titre": "La mécanique de la dette publique", "chapo": "Reste la mécanique. Qui achète les titres de l'État, avec quelle monnaie, et que se passe-t-il quand un titre arrive à échéance ? Il faut d'abord savoir qui utilise quelle monnaie — la <b>pyramide monétaire<\/b> —, puis suivre une émission bilan par bilan. On découvre alors qu'une dette publique ne se rembourse pas : elle se <b>roule<\/b>. Reste à savoir à quel taux : c'est la <b>courbe des taux<\/b> qui répond, et c'est par là que les taux rattrapent la dette."}, {"titre": "La soutenabilité, et qui en décide", "chapo": "Puisque la dette se roule, la question n'est pas « peut-on la rembourser ? » mais « son poids dans l'économie grandit-il ? ». Tout se joue entre deux taux : <b>r<\/b>, auquel l'État emprunte, et <b>g<\/b>, auquel le PIB croît. Dans une économie sans croissance, tout dépend donc de r. Et r, l'État ne le fixe pas : pour les taux courts, la <b>banque centrale<\/b> le fixe directement ; pour les taux longs, elle agit en achetant des titres. C'est toute la courbe qu'elle peut déplacer — et donc, par le roulement, le coût de la dette."}], "cartes": [{"titre": "Deux dettes, deux risques", "resume": "Estimez d'abord la dette privée de la France, puis révélez celle du G7 : elle dépasse la dette publique partout sauf au Japon. Six critères dépliables opposent ensuite les deux dettes — qui emprunte, dans quelle monnaie, ce qui arrive en récession, comment la contagion se propage. Un <b>cycle stylisé<\/b>, qu'on lance année par année, montre le crédit privé suivre le cycle et la dette publique monter après le krach. Les données de l'<b>Espagne<\/b> le confirment ensuite, de la bulle immobilière de 1996 à une dette publique qui a presque triplé en sept ans."}, {"titre": "Pourquoi l'État doit être en déficit", "resume": "On reprend les <b>100 unités de Graziani<\/b> : 10 thésaurisés, 5 d'intérêts, et il manque 15 aux entreprises pour solder leur dette. Trois issues possibles, à ouvrir une à une. Le simulateur fait ensuite épargner les ménages sur vingt périodes : réglez le déficit public et la réaction des entreprises, et voyez la dette privée s'empiler, la production s'effondrer, ou le déficit tout stabiliser."}, {"titre": "Trois soldes qui s'annulent", "resume": "Une matrice des flux où chaque ligne fait zéro : modifiez dépenses, impôts et investissement, les soldes des ménages, des entreprises et de l'État bougent, leur somme reste nulle. Le cas général se démontre ensuite en deux lignes, de Y = C + I + G à <b>(S − I) + (T − G) = 0<\/b>. Pour finir, les variations annuelles de 1996 à 2024 montrent l'identité des deux côtés : ce que l'État émet, d'autres le détiennent."}, {"titre": "Émettre et rouler la dette", "resume": "On monte d'abord la <b>pyramide monétaire<\/b> : les dépôts, les réserves qui servent aux banques à se régler entre elles, la banque centrale banque des banques — puis le Trésor, qui y a un compte mais ne peut pas y emprunter. Suivez enfin bilan par bilan l'émission de 100 de dette, puis le renouvellement d'un <b>bon du Trésor<\/b> arrivé à échéance — à la fin, la banque centrale est sortie du tableau et la dette de 105 a pour contrepartie 100 de dépôts."}, {"titre": "La courbe des taux", "resume": "Une dette de 100 Md€ en six titres, dessinés en blocs : la largeur est le montant, la hauteur le taux, la couleur la maturité restante. On en tire le <b>taux apparent<\/b>, 2 %, et la maturité moyenne, dix ans. À quel taux réemprunter ce qui arrive à échéance ? La <b>courbe des taux<\/b> répond — prime de terme, risque, anticipations. On roule enfin le stock en huit étapes : sans choc rien ne change, mais après une dégradation de la note il faut choisir entre garder la maturité et garder le taux. Et si cela dure, toute la dette finit plus chère."}, {"titre": "La course entre r et g", "resume": "L'équation de la dette se construit en cinq étapes. On regarde ensuite gonfler, au rythme de r et de g, le numérateur et le dénominateur du ratio <b>D/Y<\/b>. Le simulateur trace trente ans de trajectoire selon r, g et le solde primaire, avec le solde qui stabiliserait le ratio. Pour finir, l'économie <b>sans croissance<\/b> : g = 0, et la dette ne dépend plus que de r. Mais qui fixe r ?"}, {"titre": "La banque centrale et les taux", "resume": "Quarante ans de taux à dix ans remettent la hausse récente en perspective : de 10 % en 1986 à −0,34 % en 2019, puis 4,9 % en octobre 2026 — le niveau de 2002. Depuis 2019, le taux à <b>trois mois<\/b> de l'État colle à celui de la BCE. Deux curseurs déplacent enfin la courbe des taux : le <b>taux directeur<\/b> tient l'extrémité courte, les <b>rachats de titres longs<\/b> font monter leur prix et baisser leur rendement, et la courbe s'aplatit."}], "pied": "Parcours du cours de macroéconomie écologique — chaque carte ouvre l'outil interactif correspondant.", "licence": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — réutilisation et adaptation libres à des fins non commerciales, avec attribution et sous la même licence.", "nav_fil": "Le fil", "nav_accueil": "Le cours", "nav_ouvrir": "Ouvrir l’outil", "nav_prec": "Outil précédent", "nav_suiv": "Outil suivant", "nav_plein": "Plein écran (F)", "nav_plein_sortie": "Quitter le plein écran (Échap)", "nav_plein_astuce": "Approchez du haut pour revoir la barre · Échap pour sortir"}, "en": {"titre_onglet": "Ecological macroeconomics — Session 6: the thread of the course", "surtitre": "<b>Ecological macroeconomics<\/b> · Léo Malherbe · KEDGE Business School", "titre": "The thread of the course", "seance": "Session 6 — Money, debt and the public deficit", "chapo": "Three movements, seven tools. The first asks <b>where public debt comes from<\/b>: the heaviest debt, and the most dangerous, is private; when households save, the money does not come back to firms, and the state's deficit fills the hole; sectoral balances turn this into an accounting identity. The second opens the <b>mechanics<\/b>: the monetary pyramid, the issue followed balance sheet by balance sheet, the rollover, and the yield curve that sets its cost. The third asks the only question that matters — the race between the interest rate and growth — then asks who sets that rate: the <b>central bank<\/b>. Seven interactive tools, in the order of the thread: each opens right here, and one click brings you back.", "parties": [{"titre": "Where public debt comes from", "chapo": "Public debate talks only about government debt. In most large economies it is the smaller of the two: the debt of <b>households and firms<\/b> weighs more, and historically it is the one that triggers crises — public debt comes afterwards, when the state picks up the pieces. But it does not only come after crises. Session 4 closed on a problem: when households save, part of the money never returns to firms. The <b>public deficit<\/b> fills that hole, and national accounting turns it into an identity — the financial balances of the three sectors <b>always cancel out<\/b>. Private saving and public debt are one and the same magnitude, seen from either side."}, {"titre": "The mechanics of public debt", "chapo": "The mechanics remain. Who buys government securities, with what money, and what happens when one matures? First you need to know who uses which money — the <b>monetary pyramid<\/b> — then follow an issue balance sheet by balance sheet. It turns out that public debt is not repaid: it is <b>rolled over<\/b>. At what rate, then? The <b>yield curve<\/b> answers, and that is how interest rates catch up with the debt."}, {"titre": "Sustainability, and who decides it", "chapo": "Since the debt is rolled over, the question is not “can it be repaid?” but “is its weight in the economy growing?”. Everything turns on two rates: <b>r<\/b>, at which the state borrows, and <b>g<\/b>, at which GDP grows. In an economy without growth, everything therefore depends on r. And r is not set by the state: for short rates the <b>central bank<\/b> sets it directly; for long rates it acts by buying securities. It is the whole curve it can shift — and so, through rollover, the cost of the debt."}], "cartes": [{"titre": "Two debts, two risks", "resume": "First estimate France's private debt, then reveal the G7's: it exceeds public debt everywhere except Japan. Six expandable criteria then set the two debts against each other — who borrows, in which currency, what happens in a recession, how contagion spreads. A <b>stylised cycle<\/b>, run year by year, shows private credit following the cycle and public debt rising after the crash. <b>Spain's<\/b> figures then confirm it, from the 1996 housing boom to a public debt that nearly tripled in seven years."}, {"titre": "Why the state must run a deficit", "resume": "We pick up <b>Graziani's 100 units<\/b>: 10 hoarded, 5 of interest, and firms are 15 short of settling their debt. Three possible ways out, to be opened one by one. The simulator then has households save over twenty periods: set the public deficit and how firms react, and watch private debt pile up, output collapse, or the deficit steady everything."}, {"titre": "Three balances that cancel out", "resume": "A matrix of flows in which every row sums to zero: change spending, taxes and investment, and the balances of households, firms and government move while their sum stays nil. The general case is then proved in two lines, from Y = C + I + G to <b>(S − I) + (T − G) = 0<\/b>. Finally, annual changes from 1996 to 2024 show the identity from both sides: what the state issues, others hold."}, {"titre": "Issuing and rolling over debt", "resume": "First build the <b>monetary pyramid<\/b>: deposits, the reserves banks use to settle with one another, the central bank as bank of the banks — then the Treasury, which holds an account there but cannot borrow from it. Then follow the issue of 100 of debt balance sheet by balance sheet, and the renewal of a maturing <b>Treasury bill<\/b> — by the end the central bank has left the picture, and the debt of 105 is matched by 100 of deposits."}, {"titre": "The yield curve", "resume": "A debt of 100 bn€ in six securities, drawn as blocks: width is the amount, height the rate, colour the remaining maturity. From it come the <b>effective rate<\/b>, 2 %, and the average maturity, ten years. At what rate should maturing debt be reborrowed? The <b>yield curve<\/b> answers — term premium, risk, expectations. The stock is then rolled over in eight steps: with no shock nothing changes, but after a ratings downgrade you must choose between keeping the maturity and keeping the rate. And if it lasts, the whole debt ends up dearer."}, {"titre": "The race between r and g", "resume": "The debt equation is built in five steps. Then watch the numerator and the denominator of the <b>D/Y<\/b> ratio swell at the pace of r and of g. The simulator traces thirty years of trajectory from r, g and the primary balance, with the balance that would stabilise the ratio. Finally, the economy <b>without growth<\/b>: g = 0, and the debt depends on r alone. But who sets r?"}, {"titre": "The central bank and interest rates", "resume": "Forty years of ten-year rates put the recent rise in perspective: from 10 % in 1986 to −0.34 % in 2019, then 4.9 % in October 2026 — its 2002 level. Since 2019 the state's <b>three-month<\/b> rate has tracked the ECB's. Two sliders then shift the yield curve: the <b>policy rate<\/b> holds the short end, <b>purchases of long securities<\/b> push their price up and their yield down, and the curve flattens."}], "pied": "Course path for ecological macroeconomics — each card opens the matching interactive tool.", "licence": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — free to reuse and adapt for non-commercial purposes, with attribution and under the same licence.", "nav_fil": "The thread", "nav_accueil": "The course", "nav_ouvrir": "Open the tool", "nav_prec": "Previous tool", "nav_suiv": "Next tool", "nav_plein": "Full screen (F)", "nav_plein_sortie": "Exit full screen (Esc)", "nav_plein_astuce": "Move to the top edge to bring the bar back · Esc to exit"}}}</script>

lass=\"empty\">—<\/div>';\n    arr.forEach(function(r){var cls='ln'+(r[2]?' '+r[2]:'');s+='<div class=\"'+cls+'\"><span>'+r[0]+'<\/span><span class=\"v\">'+(typeof r[1]==='number'?fmt(r[1]):r[1])+'<\/span><\/div>';});\n    return s+'<\/div>';}\n  return '<div class=\"bs'+(opts.dim?' dim':'')+'\"><div class=\"bh\" style=\"background:'+color+'\"><span>'+title+'<\/span>'+(opts.tag?'<span>'+opts.tag+'<\/span>':'')+'<\/div><div class=\"bt\">'+col(d.assets,assets)+col(d.liabs,liabs)+'<\/div><\/div>';\n}\n/* graphique en lignes */\nfunction lineChart(svg,o){\n  clear(svg);var W=o.W||620,H=o.H||280,L=o.L||46,R=o.R||16,T=o.T||14,B=o.B||30;\n  svg.setAttribute('viewBox','0 0 '+W+' '+H);\n  var n=o.n,ymin=o.ymin,ymax=o.ymax;\n  function X(i){return L+(n<=1?0:i/(n-1))*(W-L-R);}\n  function Y(v){v=Math.max(ymin,Math.min(ymax,v));return H-B-(v-ymin)/(ymax-ymin)*(H-B-T);}\n  var g=mk('g',{'class':'ax'});\n  (o.yticks||[]).forEach(function(v){g.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v)}));g.appendChild(mk('text',{x:L-6,y:Y(v)+3.5,'text-anchor':'end'},o.fy?o.fy(v):fmt(v)));});\n  (o.xticks||[]).forEach(function(i){g.appendChild(mk('text',{x:X(i),y:H-B+16,'text-anchor':'middle'},o.fx?o.fx(i):i));});\n  svg.appendChild(g);\n  if(o.zero!=null&&o.zero>ymin&&o.zero<ymax)svg.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(o.zero),y2:Y(o.zero),style:'stroke:var(--faint);stroke-width:1'}));\n  if(o.band)svg.appendChild(mk('rect',{x:L,y:Y(o.band[1]),width:W-L-R,height:Math.max(0,Y(o.band[0])-Y(o.band[1])),style:'fill:'+o.band[2]+';fill-opacity:.09'}));\n  o.series.forEach(function(s){\n    var dd='';s.vals.forEach(function(v,i){if(v==null||!isFinite(v))return;dd+=(dd?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';});\n    svg.appendChild(mk('path',{d:dd,style:'fill:none;stroke:'+s.color+';stroke-width:'+(s.w||2.4)+';'+(s.dash?'stroke-dasharray:'+s.dash+';':'')+'stroke-linejoin:round'}));\n    if(s.end){var lastI=s.vals.length-1,lv=s.vals[lastI];if(isFinite(lv)){svg.appendChild(mk('circle',{cx:X(lastI),cy:Y(lv),r:3.6,style:'fill:'+s.color}));}}\n  });\n  if(o.ylab)svg.appendChild(mk('text',{x:L,y:T-3,style:'fill:var(--faint);font-size:10.5px;font-family:var(--font-m)'},o.ylab));\n  return {X:X,Y:Y};\n}\nfunction boot(){\n  $('theme').addEventListener('click',function(){var nt=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nt);try{localStorage.setItem(PFX+'_theme',nt);}catch(e){}renderAll();});\n  $('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem(PFX+'_lang',LANG);}catch(e){}applyLang();});\n  if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){renderAll();});}catch(e){}}\n  applyLang();\n}\n\nvar DATA={\n  imf:{c:['ca','fr','de','it','jp','uk','us'],pub:{ca:110.8,fr:113.1,de:63.9,it:135.3,jp:236.7,uk:101.2,us:120.8},prv:{ca:266.3,fr:276.5,de:163.8,it:147.0,jp:219.9,uk:156.5,us:216.6}}\n};\nvar CTY={fr:{ca:'Canada',fr:'France',de:'Allemagne',it:'Italie',es:'Espagne',jp:'Japon',uk:'Royaume-Uni',us:'États-Unis',ea:'Zone euro'},\n         en:{ca:'Canada',fr:'France',de:'Germany',it:'Italy',es:'Spain',jp:'Japan',uk:'United Kingdom',us:'United States',ea:'Euro area'}};\nvar STR={\nfr:{\n doc_title:\"Deux dettes, deux risques\",\n prev:\"Précédent\",next:\"Suivant\",assets:\"Actif\",liabs:\"Passif\",\n eyebrow:\"Séance 6 · Dette privée, dette publique\",\n title:\"Deux dettes, deux risques\",\n sub:\"Le débat public ne parle que de la dette de l'État. Dans la plupart des grandes économies, c'est pourtant la plus petite des deux : la dette des <b>ménages et des entreprises<\/b> pèse davantage. Elle obéit surtout à d'autres règles, et c'est elle qui, dans l'histoire, a le plus souvent déclenché les crises financières.\",\n s1t:\"Laquelle pèse le plus ?\",\n s1d:\"À l'échelle du monde, l'ordre de grandeur est net. Pour la France, faites d'abord votre estimation, puis révélez les données des pays du G7.\",\n w_tot:\"Dette mondiale\",w_prv:\"dont privée\",w_pub:\"dont publique\",w_s:\"du PIB mondial, 2023\",\n g_lbl:\"Dette privée de la France, en % du PIB\",g_hint:\"Repère : la dette publique française est d'environ 113 % du PIB (2024).\",\n g_btn:\"Révéler les données\",\n g_res:\"Vous estimiez <b>{g} %<\/b>. La mesure du FMI donne <b>{v} %<\/b> : environ <b>{x} fois<\/b> la dette publique. {c}\",\n g_lo:\"Comme la plupart des gens, vous avez sous-estimé la dette privée.\",g_ok:\"Bonne intuition.\",g_hi:\"Vous l'aviez même surestimée.\",\n def_h:\"Ce qu'on appelle dette privée\",\n def_x:\"Les dettes des <b>ménages<\/b> (surtout immobilières) et des <b>entreprises non financières<\/b> (crédits bancaires et obligations). Les dettes des banques entre elles en sont exclues.\",\n m_imf:\"G7 · en % du PIB · 2024 · FMI\",\n lg_pub:\"dette publique\",lg_prv:\"dette privée\",lg_ratio:\"privée / publique\",\n n_imf:\"La dette privée dépasse la dette publique dans tout le G7 sauf au <b>Japon<\/b>, et de plus du double au Canada, en France et en Allemagne. L'Italie, souvent citée pour sa dette publique, est l'un des rares pays où les deux sont proches.\",\n hide_prv:\"Révélez d'abord votre estimation.\",\n s2t:\"Ce qui les distingue\",\n s2d:\"Les deux dettes ont la même forme comptable : un passif chez l'emprunteur, un actif chez le créancier. Elles n'ont pas le même risque. Ouvrez chaque critère.\",\n openall:\"Tout ouvrir\",\n crit:[\n  [\"Qui emprunte ?\",\"Des millions de ménages et d'entreprises, chacun limité par ses revenus futurs. Aucun ne contrôle le revenu de l'économie.\",\"Un État qui lève l'impôt sur l'ensemble des revenus et dont le budget pèse sur le niveau de l'activité elle-même.\"],\n  [\"Dans quelle monnaie ?\",\"Une monnaie que l'emprunteur ne crée pas : il doit la gagner en vendant.\",\"Dans la plupart des pays, la monnaie que sa propre banque centrale émet. Dans la zone euro, une monnaie commune : l'État ne la contrôle pas seul (partie IV).\"],\n  [\"À quel horizon ?\",\"Elle doit être <b>remboursée<\/b> : un ménage vieillit, une entreprise peut disparaître.\",\"Elle est <b>renouvelée<\/b> : l'État ne meurt pas, il émet un titre neuf pour rembourser l'ancien. On dit qu'il <b>roule<\/b> sa dette (partie IV).\"],\n  [\"Que se passe-t-il en récession ?\",\"Tous cherchent à se désendetter en même temps : ventes forcées, chute des prix des actifs, revenus en baisse. Le poids réel de la dette augmente : c'est la <b>déflation par la dette<\/b> (Fisher, 1933).\",\"Le déficit se creuse de lui-même (moins d'impôts, plus de prestations). Il soutient les revenus privés au moment où ils chutent.\"],\n  [\"Qui est touché si elle tourne mal ?\",\"Les créances privées sont l'actif des banques. Des défauts en série amputent leurs fonds propres, elles restreignent le crédit, et la crise se propage.\",\"Les titres publics sont l'actif <b>sûr<\/b> du système financier, celui qu'on donne en garantie. Ils ne deviennent risqués que si personne, banque centrale comprise, ne se porte acheteur (zone euro, 2010-2012).\"],\n  [\"Que dit l'histoire ?\",\"Charles Kindleberger (<i>Manias, Panics, and Crashes<\/i>, 1978) relit trois siècles de crises financières à l'aide du modèle de <b>Minsky<\/b> : un choc ouvre des perspectives de profit, le crédit privé s'emballe, l'euphorie pousse à s'endetter pour spéculer, puis viennent la détresse et la panique. Pour Minsky, c'est la stabilité elle-même qui est déstabilisante : les années calmes encouragent l'endettement qui prépare la crise suivante. Dans chaque épisode, le moteur est l'expansion du <b>crédit privé<\/b>.\",\"Dans ces récits, la dette publique arrive surtout <b>après<\/b> la crise : l'État absorbe les pertes, soutient l'activité, et sa dette gonfle. Kindleberger insiste sur le rôle inverse de la puissance publique : celui de <b>prêteur en dernier ressort<\/b>, qui arrête la panique.\"]\n ],\n sh_prv:\"Dette privée\",sh_pub:\"Dette publique\",\n c_t:\"Le cycle des deux dettes\",\n c_d:\"Un cycle stylisé, année par année. Lancez-le, ou déplacez le curseur, et regardez dans quel ordre les deux dettes bougent : le crédit privé suit le cycle, la dette publique le contrarie.\",\n c_play:\"▶ Lancer le cycle\",c_pause:\"❚❚ Pause\",c_again:\"↻ Recommencer\",c_year:\"Année\",\n c_phases:[[0,1,\"Reprise\",\"L'activité repart. Ménages et entreprises recommencent à emprunter ; le déficit public, creusé par la crise précédente, se résorbe.\"],\n  [1,7,\"Expansion : le crédit privé s'emballe\",\"Plus l'activité accélère, plus on emprunte, en anticipant des revenus et des prix d'actifs en hausse. Le crédit privé croît plus vite que le PIB : la dette privée monte. Les recettes fiscales gonflent, le déficit fond, et la dette publique rapportée au PIB <b>baisse<\/b>.\"],\n  [7,8,\"Krach\",\"La bulle éclate : prix des actifs en chute, défauts, banques en pertes. Le crédit privé s'arrête net.\"],\n  [8,11,\"Récession et désendettement\",\"Ménages et entreprises remboursent au lieu d'emprunter : le flux de crédit devient négatif. L'activité chute, les recettes fiscales aussi, les dépenses sociales montent et l'État soutient les banques : le déficit se creuse et la dette publique <b>grimpe<\/b>.\"],\n  [11,14,\"Reprise\",\"La dette privée a reflué ; la dette publique s'est installée plus haut. La montée de la dette publique est venue <b>après<\/b> la bulle financée par la dette privée, pas avant.\"]],\n c_p1:\"Le cycle : écart de production, en % du PIB potentiel\",c_p2:\"Les flux, en % du PIB : crédit privé net et déficit public\",c_p3:\"Les stocks, en % du PIB : dette privée et dette publique\",\n c_lkr:\"krach (foncé) et récession (clair)\",\n c_lp:\"privé (crédit, dette)\",c_lg:\"public (déficit, dette)\",c_lgap:\"écart de production\",\n c_note:\"Chiffres illustratifs : un cycle stylisé, pas un pays. Axe horizontal : années. Les stocks sont calculés à partir des flux et d'une croissance nominale qui suit le cycle.\",\n r_t:\"L'Espagne : quand la dette privée devient publique\",\n r_d:\"Crédit au secteur privé non financier et dette publique de l'Espagne, en % du PIB, avec la croissance du PIB en dessous. En gris, les années de recul du PIB. Suivez l'histoire pas à pas, ou déplacez le curseur.\",\n r_lp:\"crédit au secteur privé non financier\",r_lg:\"dette publique\",r_lr:\"année de recul du PIB\",r_p2:\"Croissance du PIB réel, en %\",\n r_read:\"<b>{y}<\/b> · crédit privé {p} % · dette publique {g} % · croissance {gr} %\",\n r_notes:{es:[[1996,2007,\"<b>Le boom immobilier.<\/b> Le crédit privé passe de 83 % à 216 % du PIB. La dette publique, elle, recule de 65 % à 36 % : l'Espagne dégage des excédents.\"],\n   [2008,2009,\"<b>Le krach.<\/b> Le PIB recule de 3,8 % en 2009. Le crédit privé plafonne vers 230 % du PIB ; la dette publique repart.\"],\n   [2010,2014,\"<b>La double récession.<\/b> Le privé se désendette, l'État sauve ses banques (aide européenne de 2012) : la dette publique passe de 60 % à 104 % du PIB en quatre ans.\"],\n   [2015,2019,\"<b>La reprise.<\/b> Le privé continue de se désendetter (152 % en 2019) ; la dette publique se stabilise autour de 100 %.\"],\n   [2020,2025,\"<b>Le Covid.<\/b> Le PIB chute de 11 % : les deux ratios bondissent en 2020, rapportés à un PIB effondré, puis refluent. Ici la crise ne vient pas d'une bulle de crédit.\"]]},\n steps:[\n  [\"Le boom du crédit privé\",\"De 1996 à 2006, ménages et promoteurs s'endettent pour acheter et construire des logements ; les banques gonflent leur bilan, en partie avec des financements venus du reste de la zone euro. Le crédit privé passe de 83 % à 202 % du PIB.\",2006],\n  [\"2007 : un État modèle\",\"Au sommet de la bulle, la dette publique n'est plus que de 36 % du PIB, bien moins qu'en France ou en Allemagne (≈ 64 %), et l'Espagne dégage un excédent budgétaire d'environ 2 % du PIB. Aucun critère de Maastricht n'est enfreint.\",2007],\n  [\"L'éclatement\",\"Les prix immobiliers chutent. Emprunteurs en défaut, banques en pertes, chantiers arrêtés : le PIB recule de 3,8 % en 2009. Le crédit privé plafonne, la dette publique repart.\",2009],\n  [\"La dette change de camp\",\"Ménages et entreprises se désendettent, les recettes fiscales s'effondrent, le chômage explose, et l'État recapitalise ses banques, avec une aide européenne en 2012. Les pertes privées deviennent un déficit public : la dette atteint 90 % du PIB en 2012.\",2012],\n  [\"Le résultat\",\"En 2014, la dette publique dépasse 100 % du PIB : elle a presque triplé depuis 2007. La « crise des dettes souveraines » était ici, d'abord, une crise de dette privée transférée à l'État.\",2014],\n  [\"Et ensuite\",\"Le privé continue de se désendetter (119 % du PIB en 2025) ; la dette publique reste autour de 100 %. Le Covid fait bondir les deux ratios en 2020, mais cette crise-là ne vient pas d'une bulle de crédit.\",2025]\n ],\n l_h:\"Le vrai risque systémique est d'abord privé.\",\n l_x:\"La dette privée est plus lourde, elle doit être remboursée dans une monnaie que l'emprunteur ne crée pas, et son reflux simultané fait chuter les revenus de tous. La dette publique, elle, peut être renouvelée indéfiniment et grossit justement quand le privé se désendette. Reste à comprendre pourquoi l'État <b>doit<\/b> être en déficit pour que les entreprises ne s'endettent pas sans fin : c'est le circuit de la séance 4 qui donne la réponse.\",\n foot:\"Sources : FMI, <i>Global Debt Database<\/i> et <i>World Economic Outlook<\/i> (2025) ; FMI, <i>Global Debt Monitor<\/i> (septembre 2024, données 2023) ; Eurostat ; crédit au secteur privé non financier et dette publique (crédit total aux administrations, valeur nominale) : BRI, statistiques du crédit total, via FRED, valeurs du quatrième trimestre ; croissance : OCDE, via FRED. Fisher (1933), « The Debt-Deflation Theory of Great Depressions », <i>Econometrica<\/i> ; Kindleberger (1978), <i>Manias, Panics, and Crashes: A History of Financial Crises<\/i>, Basic Books (rééditions avec R. Aliber) ; Minsky (1986), <i>Stabilizing an Unstable Economy<\/i>, Yale University Press.\"\n},\nen:{\n doc_title:\"Two debts, two risks\",\n prev:\"Previous\",next:\"Next\",assets:\"Assets\",liabs:\"Liabilities\",\n eyebrow:\"Session 6 · Private debt, public debt\",\n title:\"Two debts, two risks\",\n sub:\"Public debate only talks about government debt. Yet in most large economies it is the smaller of the two: the debt of <b>households and firms<\/b> weighs more. Above all, it follows different rules, and historically it is private debt that has most often triggered financial crises.\",\n s1t:\"Which one weighs more?\",\n s1d:\"At world level the orders of magnitude are clear. For France, make your own estimate first, then reveal the data for the G7 countries.\",\n w_tot:\"World debt\",w_prv:\"of which private\",w_pub:\"of which public\",w_s:\"of world GDP, 2023\",\n g_lbl:\"France's private debt, % of GDP\",g_hint:\"Benchmark: French public debt is about 113% of GDP (2024).\",\n g_btn:\"Reveal the data\",\n g_res:\"You guessed <b>{g}%<\/b>. The IMF measure gives <b>{v}%<\/b>: about <b>{x} times<\/b> public debt. {c}\",\n g_lo:\"Like most people, you underestimated private debt.\",g_ok:\"Good intuition.\",g_hi:\"You even overestimated it.\",\n def_h:\"What counts as private debt\",\n def_x:\"The debts of <b>households<\/b> (mostly mortgages) and <b>non-financial corporations<\/b> (bank loans and bonds). Debts between banks are excluded.\",\n m_imf:\"G7 · % of GDP · 2024 · IMF\",\n lg_pub:\"public debt\",lg_prv:\"private debt\",lg_ratio:\"private / public\",\n n_imf:\"Private debt exceeds public debt across the G7 except in <b>Japan<\/b>, and by more than double in Canada, France and Germany. Italy, often cited for its public debt, is one of the few countries where the two are close.\",\n hide_prv:\"Reveal your estimate first.\",\n s2t:\"What sets them apart\",\n s2d:\"Both debts have the same accounting form: a liability for the borrower, an asset for the creditor. They do not carry the same risk. Open each criterion.\",\n openall:\"Open all\",\n crit:[\n  [\"Who borrows?\",\"Millions of households and firms, each limited by its future income. None of them controls the economy's income.\",\"A state that taxes all incomes and whose budget weighs on the level of activity itself.\"],\n  [\"In which currency?\",\"A currency the borrower does not create: it has to be earned by selling.\",\"In most countries, the currency its own central bank issues. In the euro area, a common currency that no state controls on its own (part IV).\"],\n  [\"Over what horizon?\",\"It must be <b>repaid<\/b>: a household ages, a firm can disappear.\",\"It is <b>renewed<\/b>: the state does not die, it issues a new bond to repay the old one. It <b>rolls over<\/b> its debt (part IV).\"],\n  [\"What happens in a recession?\",\"Everyone tries to deleverage at the same time: fire sales, falling asset prices, falling incomes. The real burden of debt rises: this is <b>debt deflation<\/b> (Fisher, 1933).\",\"The deficit widens by itself (less tax, more benefits). It supports private incomes just when they are falling.\"],\n  [\"Who is hit if it goes wrong?\",\"Private claims are the banks' assets. A wave of defaults eats into their capital, they cut lending, and the crisis spreads.\",\"Government bonds are the <b>safe<\/b> asset of the financial system, the one pledged as collateral. They only become risky if nobody, the central bank included, stands ready to buy them (euro area, 2010-2012).\"],\n  [\"What does history say?\",\"Charles Kindleberger (<i>Manias, Panics, and Crashes<\/i>, 1978) rereads three centuries of financial crises through <b>Minsky<\/b>'s model: a shock opens profit opportunities, private credit takes off, euphoria drives borrowing to speculate, then come distress and panic. For Minsky, stability itself is destabilising: calm years encourage the borrowing that prepares the next crisis. In every episode, the engine is the expansion of <b>private credit<\/b>.\",\"In these accounts, public debt mostly arrives <b>after<\/b> the crisis: the state absorbs losses, supports activity, and its debt swells. Kindleberger stresses the opposite role of public authority: that of <b>lender of last resort<\/b>, which stops the panic.\"]\n ],\n sh_prv:\"Private debt\",sh_pub:\"Public debt\",\n c_t:\"The cycle of the two debts\",\n c_d:\"A stylised cycle, year by year. Start it, or move the slider, and watch the order in which the two debts move: private credit follows the cycle, public debt leans against it.\",\n c_play:\"▶ Run the cycle\",c_pause:\"❚❚ Pause\",c_again:\"↻ Restart\",c_year:\"Year\",\n c_phases:[[0,1,\"Recovery\",\"Activity picks up. Households and firms start borrowing again; the public deficit, widened by the previous crisis, shrinks.\"],\n  [1,7,\"Expansion: private credit takes off\",\"The faster activity grows, the more people borrow, expecting rising incomes and asset prices. Private credit grows faster than GDP: private debt rises. Tax revenue swells, the deficit melts, and public debt relative to GDP <b>falls<\/b>.\"],\n  [7,8,\"Crash\",\"The bubble bursts: asset prices fall, defaults, bank losses. Private credit stops dead.\"],\n  [8,11,\"Recession and deleveraging\",\"Households and firms repay instead of borrowing: the credit flow turns negative. Activity falls, so does tax revenue, social spending rises and the state supports the banks: the deficit widens and public debt <b>climbs<\/b>.\"],\n  [11,14,\"Recovery\",\"Private debt has receded; public debt has settled higher. The rise in public debt came <b>after<\/b> the bubble financed by private debt, not before.\"]],\n c_p1:\"The cycle: output gap, % of potential GDP\",c_p2:\"Flows, % of GDP: net private credit and public deficit\",c_p3:\"Stocks, % of GDP: private debt and public debt\",\n c_lkr:\"crash (dark) and recession (light)\",\n c_lp:\"private (credit, debt)\",c_lg:\"public (deficit, debt)\",c_lgap:\"output gap\",\n c_note:\"Illustrative figures: a stylised cycle, not a country. Horizontal axis: years. Stocks are computed from the flows and from nominal growth that follows the cycle.\",\n r_t:\"Spain: when private debt becomes public\",\n r_d:\"Credit to the private non-financial sector and public debt in Spain, % of GDP, with GDP growth below. In grey, years when GDP fell. Follow the story step by step, or move the slider.\",\n r_lp:\"credit to the private non-financial sector\",r_lg:\"public debt\",r_lr:\"year of falling GDP\",r_p2:\"Real GDP growth, %\",\n r_read:\"<b>{y}<\/b> · private credit {p}% · public debt {g}% · growth {gr}%\",\n r_notes:{es:[[1996,2007,\"<b>The housing boom.<\/b> Private credit rises from 83% to 216% of GDP. Public debt falls from 65% to 36%: Spain runs surpluses.\"],\n   [2008,2009,\"<b>The crash.<\/b> GDP falls 3.8% in 2009. Private credit peaks around 230% of GDP; public debt starts rising.\"],\n   [2010,2014,\"<b>The double-dip recession.<\/b> The private sector deleverages, the state rescues its banks (European assistance in 2012): public debt rises from 60% to 104% of GDP in four years.\"],\n   [2015,2019,\"<b>The recovery.<\/b> The private sector keeps deleveraging (152% in 2019); public debt settles around 100%.\"],\n   [2020,2025,\"<b>Covid.<\/b> GDP falls 11%: both ratios jump in 2020, measured against a collapsed GDP, then recede. Here the crisis did not come from a credit bubble.\"]]},\n steps:[\n  [\"The private credit boom\",\"From 1996 to 2006, households and developers borrow to buy and build homes; banks expand their balance sheets, partly with funding from the rest of the euro area. Private credit rises from 83% to 202% of GDP.\",2006],\n  [\"2007: a model state\",\"At the peak of the bubble, public debt is only 36% of GDP, far less than in France or Germany (≈ 64%), and Spain runs a budget surplus of about 2% of GDP. No Maastricht criterion is breached.\",2007],\n  [\"The bust\",\"House prices fall. Borrowers default, banks make losses, building sites stop: GDP falls 3.8% in 2009. Private credit peaks, public debt starts rising.\",2009],\n  [\"Debt changes hands\",\"Households and firms deleverage, tax revenue collapses, unemployment soars, and the state recapitalises its banks, with European assistance in 2012. Private losses become a public deficit: debt reaches 90% of GDP in 2012.\",2012],\n  [\"The outcome\",\"In 2014 public debt exceeds 100% of GDP: it has nearly tripled since 2007. Here the “sovereign debt crisis” was first a private debt crisis transferred to the state.\",2014],\n  [\"And then\",\"The private sector keeps deleveraging (119% of GDP in 2025); public debt stays around 100%. Covid makes both ratios jump in 2020, but that crisis did not come from a credit bubble.\",2025]\n ],\n l_h:\"Systemic risk is first of all private.\",\n l_x:\"Private debt is heavier, it must be repaid in a currency the borrower does not create, and when everyone pays it down at once, everyone's income falls. Public debt can be renewed indefinitely and grows precisely when the private sector deleverages. What remains is to understand why the state <b>must<\/b> run a deficit if firms are not to borrow without end: the circuit of session 4 provides the answer.\",\n foot:\"Sources: IMF, <i>Global Debt Database<\/i> and <i>World Economic Outlook<\/i> (2025); IMF, <i>Global Debt Monitor<\/i> (September 2024, 2023 data); Eurostat; credit to the private non-financial sector and public debt (total credit to general government, nominal value): BIS total credit statistics, via FRED, fourth-quarter values; growth: OECD, via FRED. Fisher (1933), “The Debt-Deflation Theory of Great Depressions”, <i>Econometrica<\/i>; Kindleberger (1978), <i>Manias, Panics, and Crashes: A History of Financial Crises<\/i>, Basic Books (later editions with R. Aliber); Minsky (1986), <i>Stabilizing an Unstable Economy<\/i>, Yale University Press.\"\n}};\n\nvar revealed=false, step3=null, openSet={};\nvar gin=$('gin');\ngin.addEventListener('input',function(){$('gv').textContent=gin.value+' %';});\n$('reveal') an class=\"ar\">▸<\/span><\/button><div class=\"ca\"><div class=\"side prv\"><span class=\"sh\">'+d.sh_prv+'<\/span>'+c[1]+'<\/div><div class=\"side pub\"><span class=\"sh\">'+d.sh_pub+'<\/span>'+c[2]+'<\/div><\/div>';\n    el.querySelector('.cq').addEventListener('click',function(){openSet[i]=!openSet[i];renderCrits();});box.appendChild(el);});}\nfunction renderStep3(i){var d=D();var st=d.steps[i];$('st3t').innerHTML=st[0];$('st3x').innerHTML=st[1];RI=st[2]-RD.es.y0;SMODE=true;renderReal();}\n/* section 3 : cycle stylisé */\nvar CY={gap:[0,0.5,1,1.5,2,2.5,3,3,-2,-3.5,-2.5,-1.5,-0.5,0,0.5],cr:[3,4,6,8,10,12,13,12,-1,-5,-4,-3,-1,1,2],de:[3,2.5,2,1.5,1,0.5,0,0,4,8,7,5.5,4,3,3]};\n(function(){var p=[100],d=[60];for(var t=1;t<15;t++){var g=3.5+0.8*CY.gap[t];p.push(p[t-1]/(1+g/100)+CY.cr[t]);d.push(d[t-1]/(1+g/100)+CY.de[t]);}CY.p=p;CY.d=d;})();\nvar CT=14,CRUN=false,CTIMER=null;\nfunction cut(a){return a.map(function(v,i){return i<=CT?v:null;});}\nfunction phaseShade(svg,fx,H,T,B){var d=D();d.c_phases.forEach(function(ph,i){if(i!==2&&i!==3)return;var r=mk('rect',{x:fx(ph[0]),y:T,width:fx(ph[1])-fx(ph[0]),height:H-T-B,style:'fill:var(--warn);fill-opacity:'+(i===2?.14:.07)});svg.insertBefore(r,svg.firstChild);});}\nfunction renderCycle(){var d=D();var xt=[0,2,4,6,8,10,12,14];\n  var o1=lineChart($('cg1'),{n:15,ymin:-4,ymax:4,yticks:[-4,0,4],xticks:[],zero:0,H:120,B:8,series:[{vals:cut(CY.gap),color:'var(--eco)',w:2.6,end:true}]});\n  phaseShade($('cg1'),o1.X,120,14,8);\n  var o2=lineChart($('cg2'),{n:15,ymin:-6,ymax:14,yticks:[-5,0,5,10],xticks:[],zero:0,H:140,B:8,series:[{vals:cut(CY.cr),color:'var(--econ)',end:true},{vals:cut(CY.de),color:'var(--rms)',end:true}]});\n  phaseShade($('cg2'),o2.X,140,14,8);\n  var o3=lineChart($('cg3'),{n:15,ymin:40,ymax:140,yticks:[40,60,80,100,120,140],xticks:xt,H:190,R:22,fx:function(i){return i;},series:[{vals:cut(CY.p),color:'var(--econ)',w:2.8,end:true},{vals:cut(CY.d),color:'var(--rms)',w:2.8,end:true}]});\n  phaseShade($('cg3'),o3.X toUpperCase();\n  if(d.doc_title)document.title=d.doc_title.replace(/<[^>]+>/g,'');\n  renderAll();\n}\n/* stepper générique : flèches ← → pilotent le dernier utilisé */\nvar STEPPERS=[],LAST_STEPPER=null;\nfunction Stepper(id,n,onStep){\n  var self=this;this.id=id;this.n=n;this.i=0;this.max=0;this.on=onStep;\n  var root=$(id);root.classList.add('stepper');\n  this.prev=document.createElement('button');this.prev.className='btn';\n  this.next=document.createElement('button');this.next.className='btn pri';\n  this.dots=document.createElement('div');this.dots.className='dots';\n  for(var k=0;k<n;k++){(function(k){var b=document.createElement('button');b.textContent=k;b.addEventListener('click',function(){self.go(k);});self.dots.appendChild(b);})(k);}\n  this.prev.addEventListener('click',function(){self.go(self.i-1);});\n  this.next.addEventListener('click',function(){self.go(self.i+1);});\n  var kb=document.createElement('span');kb.className='kbd';kb.textContent='← →';\n  root.appendChild(this.prev);root.appendChild(this.dots);root.appendChild(this.next);root.appendChild(kb);\n  STEPPERS.push(this);\n}\nStepper.prototype.go=function(k){if(k<0||k>=this.n)return;this.i=k;if(k>this.max)this.max=k;LAST_STEPPER=this;this.paint();};\nStepper.prototype.paint=function(){\n  var d=D();this.prev.textContent='← '+d.prev;this.next.textContent=d.next+' →';\n  this.prev.disabled=this.i===0;this.next.disabled=this.i===this.n-1;\n  var self=this;Array.prototype.forEach.call(this.dots.children,function(b,k){b.className=(k===self.i?'on':(k<=self.max?'done':''));});\n  this.on(this.i);\n};\ndocument.addEventListener('keydown',function(e){\n  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;\n  var s=LAST_STEPPER||STEPPERS[0];if(!s)return;\n  if(e.key==='ArrowRight'){s.go(s.i+1);e.preventDefault();}\n  else if(e.key==='ArrowLeft'){s.go(s.i-1);e.preventDefault();}\n});\n/* bilan en T : lines = [[label, value, flags]] flags: 'hl','del','nw' */\nfunction bsHTML(title,color,assets,liabs,opts){\n  opts=opts||{};var d=D();\n  function col(h,arr){var s='<div class=\"col\"><div class=\"ch\">'+h+'<\/div>';\n    if(!arr.length)s+='<div class=\"empty\">—<\/div>';\n    arr.forEach(function(r){var cls='ln'+(r[2]?' '+r[2]:'');s+='<div class=\"'+cls+'\"><span>'+r[0]+'<\/span><span class=\"v\">'+(typeof r[1]==='number'?fmt(r[1]):r[1])+'<\/span><\/div>';});\n    return s+'<\/div>';}\n  return '<div class=\"bs'+(opts.dim?' dim':'')+'\"><div class=\"bh\" style=\"background:'+color+'\"><span>'+title+'<\/span>'+(opts.tag?'<span>'+opts.tag+'<\/span>':'')+'<\/div><div class=\"bt\">'+col(d.assets,assets)+col(d.liabs,liabs)+'<\/div><\/div>';\n}\n/* graphique en lignes */\nfunction lineChart(svg,o){\n  clear(svg);var W=o.W||620,H=o.H||280,L=o.L||46,R=o.R||16,T=o.T||14,B=o.B||30;\n  svg.setAttribute('viewBox','0 0 '+W+' '+H);\n  var n=o.n,ymin=o.ymin,ymax=o.ymax;\n  function X(i){return L+(n<=1?0:i/(n-1))*(W-L-R);}\n  function Y(v){v=Math.max(ymin,Math.min(ymax,v));return H-B-(v-ymin)/(ymax-ymin)*(H-B-T);}\n  var g=mk('g',{'class':'ax'});\n  (o.yticks||[]).forEach(function(v){g.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v)}));g.appendChild(mk('text',{x:L-6,y:Y(v)+3.5,'text-anchor':'end'},o.fy?o.fy(v):fmt(v)));});\n  (o.xticks||[]).forEach(function(i){g.appendChild(mk('text',{x:X(i),y:H-B+16,'text-anchor':'middle'},o.fx?o.fx(i):i));});\n  svg.appendChild(g);\n  if(o.zero!=null&&o.zero>ymin&&o.zero<ymax)svg.appendChild(mk('line',{x1:L,x2:W-R,y1:Y(o.zero),y2:Y(o.zero),style:'stroke:var(--faint);stroke-width:1'}));\n  if(o.band)svg.appendChild(mk('rect',{x:L,y:Y(o.band[1]),width:W-L-R,height:Math.max(0,Y(o.band[0])-Y(o.band[1])),style:'fill:'+o.band[2]+';fill-opacity:.09'}));\n  o.series.forEach(function(s){\n    var dd='';s.vals.forEach(function(v,i){if(v==null||!isFinite(v))return;dd+=(dd?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';});\n    svg.appendChild(mk('path',{d:dd,style:'fill:none;stroke:'+s.color+';stroke-width:'+(s.w||2.4)+';'+(s.dash?'stroke-dasharray:'+s.dash+';':'')+'stroke-linejoin:round'}));\n    if(s.end){var lastI=s.vals.length-1,lv=s.vals[lastI];if(isFinite(lv)){svg.appendChild(mk('circle',{cx:X(lastI),cy:Y(lv),r:3.6,style:'fill:'+s.color}));}}\n  });\n  if(o.ylab)svg.appendChild(mk('text',{x:L,y:T-3,style:'fill:var(--faint);font-size:10.5px;font-family:var(--font-m)'},o.ylab));\n  return {X:X,Y:Y};\n}\nfunction boot(){\n  $('theme').addEventListener('click',function(){var nt=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nt);try{localStorage.setItem(PFX+'_theme',nt);}catch(e){}renderAll();});\n  $('lang').addEventListener('click',function(){LANG=LANG==='fr'?'en':'fr';try{localStorage.setItem(PFX+'_lang',LANG);}catch(e){}applyLang();});\n  if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){renderAll();});}catch(e){}}\n  applyLang();\n}\n\nvar STR={\nfr:{\n doc_title:\"Pourquoi l'État doit être en déficit\",prev:\"Précédent\",next:\"Suivant\",assets:\"Actif\",liabs:\"Passif\",reset:\"Réinitialiser\",\n eyebrow:\"Séance 6 · Retour au circuit\",\n title:\"Pourquoi l'État doit être en déficit\",\n sub:\"En séance 4, le circuit s'est refermé sur un problème : quand les ménages épargnent, une partie de la monnaie ne revient pas aux entreprises, et leur dette ne s'éteint pas. On avait ajouté l'État en fin de séance sans dire pourquoi il comptait autant. La réponse tient en une phrase : <b>son déficit comble le trou que laisse l'épargne<\/b>.\",\n s1t:\"Le trou laissé dans le circuit\",\n s1d:\"Reprenons le modèle de Graziani avec les chiffres de la séance 4, puis ajoutons un taux d'intérêt.\",\n bar_h:\"Ce que les entreprises doivent rembourser, et ce qui leur revient\",\n steps:[\n  [\"Le crédit ouvre le circuit\",\"Les entreprises empruntent <b>100<\/b> et versent 100 de salaires. Leur dette est de 100 ; les ménages détiennent 100 de dépôts. Tout reste à rembourser.\"],\n  [\"Les ménages consomment 80\",\"En achetant des biens, les ménages rendent 80 aux entreprises, qui remboursent d'autant. C'est le <b>reflux<\/b>.\"],\n  [\"Ils placent 10 en actions\",\"Les ménages achètent 10 d'actions nouvelles : cette <b>finance finale<\/b> revient aussi aux entreprises. 90 sont remboursés et détruits.\"],\n  [\"Ils thésaurisent 10\",\"Les 10 derniers restent sur les comptes des ménages. Les entreprises ne peuvent pas les récupérer : <b>10 de dette résiduelle<\/b>, exactement égale aux dépôts thésaurisés. Plus les ménages épargnent sous forme liquide, plus cette dette grossit : c'est le paradoxe de l'épargne vu en séance 4.\"],\n  [\"Et les intérêts ?\",\"Supposons maintenant un taux de <b>5 %<\/b>. Les entreprises doivent 105, mais seuls 100 ont été créés. Même si les ménages dépensaient tout, il manquerait 5. Les intérêts versés à la banque reviennent dans le circuit quand elle les dépense (salaires, dividendes), mais seulement <b>après<\/b> l'échéance.\"],\n  [\"La question\",\"Au total, il manque <b>15<\/b> pour que les entreprises soldent leur dette. Cette monnaie ne peut venir que d'une <b>dette supplémentaire<\/b> : il faut ouvrir un nouveau circuit. Reste à savoir qui s'endette.\"]\n ],\n lg_c:\"consommation\",lg_a:\"actions\",lg_hd:\"thésaurisé : non remboursé\",lg_i:\"intérêts : non remboursés\",lg_o:\"pas encore revenu\",\n k_f:\"Dette des entreprises\",k_h:\"Dépôts des ménages\",k_m:\"Masse monétaire\",k_gap:\"Monnaie manquante\",\n s2t:\"Trois façons de combler le trou\",\n s2d:\"Il y en a trois. Cliquez sur chacune pour voir ce qu'elle implique.\",\n exits:[\n  [\"1\",\"Plus de dette privée\",\"Les entreprises empruntent à nouveau, entre elles ou auprès des banques, ou bien les ménages s'endettent pour consommer. Le circuit continue de tourner, mais la dette résiduelle s'empile de période en période : la structure financière devient de plus en plus <b>fragile<\/b> (partie I).\",\"no\",\"fragile\"],\n  [\"2\",\"Un excédent extérieur\",\"Le reste du monde achète davantage chez nous que nous chez lui : la monnaie qui manque vient de l'étranger, qui s'endette à notre place. Mais l'excédent d'un pays est le déficit d'un autre : <b>tous ne peuvent pas<\/b> suivre cette stratégie en même temps.\",\"mid\",\"pas pour tous\"],\n  [\"3\",\"Le déficit public\",\"L'État dépense plus qu'il ne prélève. Sa dépense arrive dans les caisses des entreprises sans qu'elles aient eu à l'emprunter : elles peuvent rembourser, et même réaliser leurs profits en monnaie. La dette est logée chez l'agent qui peut la <b>renouveler<\/b> indéfiniment (partie IV).\",\"ok\",\"soutenable sous conditions (partie V)\"]\n ],\n s4_h:\"Rappel de la séance 4 : le circuit à quatre pôles\",\n s4_x:\"Dans le flipper monétaire, on avait ajouté l'État (pôle A) : crédit aux entreprises 20, achat de titres publics par les banques 20, commande publique G = 20. Résultat : épargne des ménages <b>S = 40 = I + (G − T) = 20 + 20<\/b>. Sans le déficit, les ménages n'auraient pas pu épargner 40 sans que les entreprises s'endettent d'autant.\",\n s3t:\"Fragilité, récession ou déficit\",\n s3d:\"Vingt périodes. À chacune, les entreprises empruntent leur masse salariale, les ménages en épargnent une part sous forme de dépôts, et l'État achète pour <b>G<\/b> aux entreprises en s'endettant auprès des banques (pas d'impôts). Choisissez aussi comment réagissent les entreprises quand leurs ventes ne couvrent pas leurs coûts.\",\n l_s:\"Taux d'épargne des ménages\",h_s:\"part du revenu gardée en dépôts\",\n l_g:\"Déficit public par période\",h_g:\"achats de l'État, en unités (salaires initiaux = 100)\",\n l_m:\"Les entreprises…\",h_m:\"maintenir : la production reste à 100 ; ajuster : la production suit les ventes de la période précédente\",\n m_keep:\"maintiennent la production\",m_adj:\"ajustent la production\",\n presets:[[\"p1\",\"Séance 4 : sans État\"],[\"p2\",\"Les entreprises réduisent la voilure\"],[\"p3\",\"Le déficit comble l'épargne\"],[\"p4\",\"Les ménages épargnent davantage\"],[\"p5\",\"Le déficit dépasse l'épargne\"]],\n ptxt:{p1:\"Les ménages thésaurisent 10 % et les entreprises maintiennent leur production : leur dette grossit de 10 à chaque période.\",\n  p2:\"Même épargne, mais les entreprises produisent ce qu'elles ont vendu la veille : la production s'effondre. Le paradoxe de l'épargne au complet.\",\n  p3:\"L'État dépense 10 par période : exactement l'épargne des ménages. La production tient, et ce sont des titres publics qui s'accumulent en face des dépôts.\",\n  p4:\"Les ménages épargnent 20 % au lieu de 10 %, le déficit reste à 10. Regardez l'épargne de la dernière période : elle n'a pas augmenté, c'est le revenu qui a baissé.\",\n  p5:\"Le déficit (15) dépasse l'épargne : la production croît et les entreprises accumulent des profits en monnaie. Plus de production, c'est aussi plus d'énergie et de matières : ce que l'État achète compte (séance 4, flipper).\"},\n c1h:\"Production (masse salariale), par période\",c2h:\"Stocks accumulés\",\n lg_h:\"dépôts des ménages\",lg_f:\"dette nette des entreprises\",lg_b:\"dette publique\",\n k_y:\"Production finale\",k_fs:\"Dette des entreprises / ventes\",k_b:\"Dette publique\",k_hh:\"Épargne cumulée\",\n idrow:\"Dernière période : épargne des ménages <b>{s}<\/b> = besoin de financement des entreprises <b>{f}<\/b> + déficit public <b>{g}<\/b>\",\n v_frag:\"La dette des entreprises s'accumule (<b>{f}<\/b> après 20 périodes, {r} fois leurs ventes) : chaque période ajoute la part du revenu que les ménages n'ont pas dépensée. C'est la fragilité financière vue en séance 4.\",\n v_rec:\"La production tombe à <b>{y}<\/b> : en réduisant leur activité pour ne plus s'endetter, les entreprises réduisent les revenus, donc les ventes. Une économie où les ménages veulent épargner sans que personne ne s'endette ne peut que se contracter.\",\n v_stab:\"La production se stabilise à <b>{y}<\/b>, le niveau où l'épargne des ménages (s × Y) égale le déficit public : <b>Y = G / s<\/b>. C'est le multiplicateur keynésien, lu dans le circuit.\",\n v_bal:\"Le déficit public absorbe désormais exactement l'épargne : la dette des entreprises ne bouge plus, et chaque nouveau dépôt des ménages a pour contrepartie un titre public.\",\n v_leg:\"Les <b>{f}<\/b> de dette accumulés par les entreprises pendant l'ajustement restent dus.\",\n v_prof:\"Les entreprises vendent plus qu'elles ne versent : elles accumulent <b>{p}<\/b> de profits en monnaie. Le déficit leur permet de réaliser leurs profits.\",\n v_thr:\"Remarque : sur la dernière période, l'épargne des ménages vaut <b>{s}<\/b>, soit le déficit public. Vouloir épargner davantage n'a pas augmenté l'épargne : cela a réduit le revenu.\",\n v_none:\"Sans épargne des ménages, tout le revenu revient aux entreprises : ni dette résiduelle, ni besoin de déficit.\",\n l_h:\"Le déficit public est la contrepartie de l'épargne privée.\",\n l_x:\"Si les ménages veulent garder une part de leur revenu en monnaie et que l'investissement ne l'absorbe pas, il n'y a que trois issues : la dette privée s'accumule, la production baisse, ou quelqu'un d'autre dépense plus qu'il ne gagne. Le déficit public n'est donc pas une anomalie à corriger, mais la condition d'un circuit qui ne se contracte pas. La partie suivante généralise ce résultat avec les <b>balances sectorielles<\/b>.\",\n foot:\"Modèle du circuit d'après Graziani (2003), <i>The Monetary Theory of Production<\/i>, avec les paramètres de la séance 4 . Simulation volontairement minimale : économie fermée, ni impôts ni investissement, profits nuls tant que les ventes ne dépassent pas les salaires, déficit financé par des titres achetés par les banques. Exercice de mécanique, pas une prévision.\"\n},\nen:{\n doc_title:\"Why the state must run a deficit\",prev:\"Previous\",next:\"Next\",assets:\"Assets\",liabs:\"Liabilities\",reset:\"Reset\",\n eyebrow:\"Session 6 · Back to the circuit\",\n title:\"Why the state must run a deficit\",\n sub:\"In session 4 the circuit closed on a problem: when households save, part of the money does not flow back to firms, and their debt is not extinguished. We added the state at the end of the session without saying why it mattered so much. The answer fits in one sentence: <b>its deficit fills the hole that saving leaves<\/b>.\",\n s1t:\"The hole left in the circuit\",\n s1d:\"Take Graziani's model again with the figures of session 4, then add an interest rate.\",\n bar_h:\"What firms must repay, and what comes back to them\",\n steps:[\n  [\"Credit opens the circuit\",\"Firms borrow <b>100<\/b> and pay 100 in wages. Their debt is 100; households hold 100 in deposits. Everything remains to be repaid.\"],\n  [\"Households consume 80\",\"By buying goods, households hand 80 back to firms, which repay as much. This is the <b>reflux<\/b>.\"],\n  [\"They put 10 into shares\",\"Households buy 10 of new shares: this <b>final finance<\/b> also flows back to firms. 90 is repaid and destroyed.\"],\n  [\"They hoard 10\",\"The last 10 stay in households' accounts. Firms cannot get them back: <b>10 of residual debt<\/b>, exactly equal to the hoarded deposits. The more households save in liquid form, the larger this debt: the paradox of thrift seen in session 4.\"],\n  [\"And the interest?\",\"Now assume a <b>5%<\/b> rate. Firms owe 105, but only 100 was created. Even if households spent everything, 5 would be missing. Interest paid to the bank comes back into the circuit when the bank spends it (wages, dividends), but only <b>after<\/b> the repayment date.\"],\n  [\"The question\",\"In all, <b>15<\/b> is missing for firms to clear their debt. That money can only come from <b>additional debt<\/b>: a new circuit has to be opened. The question is who borrows.\"]\n ],\n lg_c:\"consumption\",lg_a:\"shares\",lg_hd:\"hoarded: not repaid\",lg_i:\"interest: not repaid\",lg_o:\"not yet returned\",\n k_f:\"Firms' debt\",k_h:\"Households' deposits\",k_m:\"Money supply\",k_gap:\"Missing money\",\n s2t:\"Three ways to fill the hole\",\n s2d:\"There are three. Click each one to see what it implies.\",\n exits:[\n  [\"1\",\"More private debt\",\"Firms borrow again, from each other or from banks, or households borrow to consume. The circuit keeps turning, but residual debt piles up period after period: the financial structure becomes more and more <b>fragile<\/b> (part I).\",\"no\",\"fragile\"],\n  [\"2\",\"An external surplus\",\"The rest of the world buys more from us than we buy from it: the missing money comes from abroad, which borrows in our place. But one country's surplus is another's deficit: <b>not everyone<\/b> can pursue this strategy at the same time.\",\"mid\",\"not for everyone\"],\n  [\"3\",\"The public deficit\",\"The state spends more than it levies. Its spending reaches firms' tills without their having had to borrow it: they can repay, and even realise their profits in money. The debt sits with the agent that can <b>renew<\/b> it indefinitely (part IV).\",\"ok\",\"sustainable under conditions (part V)\"]\n ],\n s4_h:\"Recap from session 4: the four-pole circuit\",\n s4_x:\"In the monetary pinball machine we added the state (pole A): lending to firms 20, banks buying government bonds 20, public procurement G = 20. Result: household saving <b>S = 40 = I + (G − T) = 20 + 20<\/b>. Without the deficit, households could not have saved 40 without firms borrowing as much.\",\n s3t:\"Fragility, recession or deficit\",\n s3d:\"Twenty periods. In each, firms borrow their wage bill, households save part of it as deposits, and the state buys <b>G<\/b> from firms by borrowing from banks (no taxes). Also choose how firms react when their sales do not cover their costs.\",\n l_s:\"Household saving rate\",h_s:\"share of income kept as deposits\",\n l_g:\"Public deficit per period\",h_g:\"state purchases, in units (initial wages = 100)\",\n l_m:\"Firms…\",h_m:\"maintain: output stays at 100; adjust: output follows the previous period's sales\",\n m_keep:\"maintain output\",m_adj:\"adjust output\",\n presets:[[\"p1\",\"Session 4: no state\"],[\"p2\",\"Firms scale back\"],[\"p3\",\"The deficit fills the saving\"],[\"p4\",\"Households save more\"],[\"p5\",\"The deficit exceeds saving\"]],\n ptxt:{p1:\"Households hoard 10% and firms maintain output: their debt grows by 10 each period.\",\n  p2:\"Same saving, but firms produce what they sold the day before: output collapses. The full paradox of thrift.\",\n  p3:\"The state spends 10 per period: exactly households' saving. Output holds, and it is government bonds that pile up against the deposits.\",\n  p4:\"Households save 20% instead of 10%, the deficit stays at 10. Look at saving in the last period: it has not increased, income has fallen.\",\n  p5:\"The deficit (15) exceeds saving: output grows and firms accumulate monetary profits. More output also means more energy and materials: what the state buys matters (session 4, pinball).\"},\n c1h:\"Output (wage bill), per period\",c2h:\"Accumulated stocks\",\n lg_h:\"household deposits\",lg_f:\"firms' net debt\",lg_b:\"public debt\",\n k_y:\"Final output\",k_fs:\"Firms' debt / sales\",k_b:\"Public debt\",k_hh:\"Cumulative saving\",\n idrow:\"Last period: household saving <b>{s}<\/b> = firms' borrowing requirement <b>{f}<\/b> + public deficit <b>{g}<\/b>\",\n v_frag:\"Firms' debt piles up (<b>{f}<\/b> after 20 periods, {r} times their sales): each period adds the share of income households did not spend. This is the financial fragility seen in session 4.\",\n v_rec:\"Output falls to <b>{y}<\/b>: by cutting activity so as not to borrow, firms cut incomes, hence sales. An economy where households want to save while nobody borrows can only shrink.\",\n v_stab:\"Output settles at <b>{y}<\/b>, the level at which household saving (s × Y) equals the public deficit: <b>Y = G / s<\/b>. This is the Keynesian multiplier, read in the circuit.\",\n v_bal:\"The public deficit now absorbs saving exactly: firms' debt no longer moves, and every new household deposit has a government bond as its counterpart.\",\n v_leg:\"The <b>{f}<\/b> of debt firms accumulated during the adjustment remain owed.\",\n v_prof:\"Firms sell more than they pay out: they accumulate <b>{p}<\/b> of monetary profits. The deficit lets them realise their profits.\",\n v_thr:\"Note: in the last period household saving is <b>{s}<\/b>, i.e. the public deficit. Wanting to save more has not increased saving: it has reduced income.\",\n v_none:\"With no household saving, all income flows back to firms: no residual debt, no need for a deficit.\",\n l_h:\"The public deficit is the counterpart of private saving.\",\n l_x:\"If households want to keep part of their income in money and investment does not absorb it, there are only three outcomes: private debt piles up, output falls, or someone else spends more than they earn. The public deficit is therefore not an anomaly to be corrected but the condition for a circuit that does not contract. The next part generalises this result with <b>sectoral balances<\/b>.\",\n foot:\"Circuit model after Graziani (2003), <i>The Monetary Theory of Production<\/i>, with the parameters of session 4. A deliberately minimal simulation: closed economy, no taxes or investment, zero profits as long as sales do not exceed wages, deficit financed by bonds bought by banks. A mechanical exercise, not a forecast.\"\n}};\n\n/* ---------- section 1 ---------- */\nvar S1=[ // c, a, h, i, owed\n  {c:0,a:0,h:0,i:0,owed:100,f:100,hh:100,m:100,gap:0},\n  {c:80,a:0,h:0,i:0,owed:100,f:20,hh:20,m:20,gap:0},\n  {c:80,a:10,h:0,i:0,owed:100,f:10,hh:10,m:10,gap:0},\n  {c:80,a:10,h:10,i:0,owed:100,f:10,hh:10,m:10,gap:10},\n  {c:80,a:10,h:10,i:5,owed:105,f:15,hh:10,m:10,gap:15},\n  {c:80,a:10,h:10,i:5,owed:105,f:15,hh:10,m:10,gap:15}];\nvar st1=null;\nfunction renderS1(k){var d=D(),s=S1[k];$('st1t').innerHTML=d.steps[k][0];$('st1x').innerHTML=d.steps[k][1];\n  var tot=105,o=s.owed-s.c-s.a-s.h-s.i;\n  var segs=[['c',s.c,d.lg_c],['a',s.a,d.lg_a],['h',s.h,d.lg_hd],['i',s.i,d.lg_i],['o',Math.max(0,o),d.lg_o]];\n  $('dbar').innerHTML=segs.map(function(g){return '<div class=\"sg '+g[0]+'\" style=\"width:'+(g[1]/tot*100)+'%\">'+(g[1]>=5?g[1]:'')+'<\/div>';}).join('')+(s.owed<105?'<div class=\"sg\" style=\"width:'+((105-s.owed)/tot*100)+'%;background:var(--surface)\"><\/div>':'');\n  $('sc_end').textContent=s.owed===105?'105':'100 · 105';\n  $('leg1').innerHTML=segs.filter(function(g){return g[1]>0;}).map(function(g){var col={c:'var(--eco)',a:'var(--fish)',h:'var(--warn)',i:'var(--rms)',o:'var(--line)'}[g[0]];return '<span><i style=\"background:'+col+'\"><\/i>'+g[2]+'<\/span>';}).join('');\n  $('k1').innerHTML=[[d.k_f,s.f,'var(--econ)'],[d.k_h,s.hh,'var(--eco)'],[d.k_m,s.m,'var(--ink)'],[d.k_gap,s.gap,'var(--warn)']].map(function(x){return '<div class=\"kpi\"><div class=\"kl\">'+x[0]+'<\/div><div class=\"kv\" style=\"color:'+x[2]+'\">'+x[1]+'<\/div><\/div>';}).join('');\n}\n/* ---------- section 2 ---------- */\nvar exitOn={};\nfunction renderExits(){var d=D();$('exits').innerHTML='';\n  d.exits.forEach(function(e,i){var b=document.createElement('button');b.className='exit'+(exitOn[i]?' on':'');\n    b.innerHTML='<span class=\"en\">'+e[0]+'<\/span><span class=\"et\">'+e[1]+'<\/span><span class=\"ex\">'+e[2]+'<\/span><span class=\"eb\"><span class=\"badge '+e[3]+'\">'+e[4]+'<\/span><\/span>';\n    b.addEventListener('click',function(){exitOn[i]=!exitOn[i];renderExits();});$('exits').appendChild(b);});}\n/* ---------- section 3 ---------- */\nvar is=$('i_s'),ig=$('i_g'),MODE='keep',PRE=null,N=20;\nvar PRESETS={p1:{s:10,g:0,m:'keep'},p2:{s:10,g:0,m:'adj'},p3:{s:10,g:10,m:'adj'},p4:{s:20,g:10,m:'adj'},p5:{s:10,g:15,m:'adj'}};\nfunction sim(s,G,mode){var W=100,Y=[],F=[0],H=[0],B=[0],Sv=[],last={};\n  for(var t=1;t<=N;t++){Y.push(W);var sales=(1-s)*W+G,sav=s*W;\n    F.push(F[t-1]+W-sales);H.push(H[t-1]+sav);B.push(B[t-1]+G);last={sav:sav,fneed:W-sales,sales:sales,W:W};\n    if(mode==='adj')W=sales;}\n  return {Y:Y,F:F,H:H,B:B,last:last};}\nfunction renderS3(){var d=D();var s=+is.value/100,G=+ig.value;\n  $('v_s').textContent=is.value+' %';$('v_g').textContent=G;\n  var m=$('mode');m.innerHTML='';[['keep',d.m_keep],['adj',d.m_adj]].forEach(function(x){var b=document.createElement('button');b.textContent=x[1];if(x[0]===MODE)b.className='on';b.addEventListener('click',function(){MODE=x[0];PRE=null;renderS3();});m.appendChild(b);});\n  var pz=$('presets');pz.innerHTML='';d.presets.forEach(function(p){var b=document.createElement('button');b.className='pz'+(PRE===p[0]?' on':'');b.textContent=p[1];\n    b.addEventListener('click',function(){var q=PRESETS[p[0]];is.value=q.s;ig.value=q.g;MODE=q.m;PRE=p[0];renderS3();});pz.appendChild(b);});\n  $('ptxt').innerHTML=PRE?d.ptxt[PRE]:'';\n  var r=sim(s,G,MODE);\n  var yend=r.Y[N-1],fend=r.F[N],bend=r.B[N],hend=r.H[N];\n  var ratio=r.last.sales>0?fend/r.last.sales:0;\n  $('k3').innerHTML=[[d.k_y,fmt(yend,0),'var(--fish)'],[d.k_fs,fmt(ratio,1),fend>1?'var(--warn)':'var(--econ)'],[d.k_b,fmt(bend,0),'var(--rms)'],[d.k_hh,fmt(hend,0),'var(--eco)']].map(function(x){return '<div class=\"kpi\"><div class=\"kl\">'+x[0]+'<\/div><div class=\"kv\" style=\"color:'+x[2]+'\">'+x[1]+'<\/div><\/div>';}).join('');\n  var ymax1=Math.max(160,Math.ceil(Math.max.apply(null,r.Y)/40)*40);\n  var ticks1=[];for(var v=0;v<=ymax1;v+=40)ticks1.push(v);\n  lineChart($('c1'),{n:N,ymin:0,ymax:ymax1,yticks:ticks1,xticks:[0,4,9,14,19],fx:function(i){return i+1;},H:240,\n    series:[{vals:r.Y.map(function(){return 100;}),color:'var(--faint)',dash:'3 4',w:1.4},{vals:r.Y,color:'var(--fish)',end:true}]});\n  var all=r.F.concat(r.H,r.B);var mx=Math.max.apply(null,all),mn=Math.min.apply(null,all);\n  var step=mx-mn>400?100:(mx-mn>160?50:20);var ymax2=Math.max(step,Math.ceil(mx/step)*step),ymin2=Math.min(0,Math.floor(mn/step)*step);\n  var ticks2=[];for(var w=ymin2;w<=ymax2;w+=step)ticks2.push(w);\n  lineChart($('c2'),{n:N+1,ymin:ymin2,ymax:ymax2,yticks:ticks2,xticks:[0,5,10,15,20],zero:0,H:240,\n    series:[{vals:r.H,color:'var(--eco)',end:true},{vals:r.B,color:'var(--rms)',end:true,dash:'6 3'},{vals:r.F,color:'var(--econ)',end:true}]});\n  var L=r.last;\n  $('idrow').innerHTML=d.idrow.replace('{s}',fmt(L.sav,1)).replace('{f}',fmt(L.fneed,1)).replace('{g}',fmt(G,1));\n  var v=[];\n  if(s===0){v.push(d.v_none);}\n  else{\n    if(MODE==='adj'){\n      if(G===0)v.push(d.v_rec.replace('{y}',fmt(yend,1)));\n      else v.push(d.v_stab.replace('{y}',fmt(G/s,1)));\n    }\n    if(Math.abs(L.fneed)<0.5&&G>0){v.push(d.v_bal.replace('{b}',fmt(bend,0)).replace('{h}',fmt(hend,0)));\n      if(fend>1)v.push(d.v_leg.replace('{f}',fmt(fend,0)));}\n    else if(fend>1)v.push(d.v_frag.replace('{f}',fmt(fend,0)).replace('{r}',fmt(ratio,1)));\n    else if(fend<-1)v.push(d.v_prof.replace('{p}',fmt(-fend,0)));\n    if(MODE==='adj'&&G>0&&Math.abs(L.sav-G)<0.6&&s>0.1)v.push(d.v_thr.replace('{s}',fmt(L.sav,1)));\n  }\n  $('verdict').innerHTML=v.join(' ');\n}\nis.addEventListener('input',function(){PRE=null;renderS3();});ig.addEventListener('input',function(){PRE=null;renderS3();});\n$('reset').addEventListener('click',function(){var q=PRESETS.p1;is.value=q.s;ig.value=q.g;MODE=q.m;PRE='p1';renderS3();});\nPRE='p1';\nfunction renderAll(){if(!st1)st1=new Stepper('st1',6,renderS1);st1.paint();renderExits();renderS3();}\nboot();\n<\/script>\n<\/body>\n<\/html>\n\n<\/body><\/html>", "balances-sectorielles.html": "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1\"><script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\
