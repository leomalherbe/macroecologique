+')\" x=\"13\" y=\"'+((pT+H-pB)/2).toFixed(1)+'\" text-anchor=\"middle\">'+opt.ylab+'<\/text>';\n    series.forEach(function(s){if(!s.pts.length)return;var d='M '+X(s.pts[0][0]).toFixed(1)+' '+Y(s.pts[0][1]).toFixed(1);for(var k=1;k<s.pts.length;k++)d+=' L '+X(s.pts[k][0]).toFixed(1)+' '+Y(s.pts[k][1]).toFixed(1);g+='<path class=\"ln\" d=\"'+d+'\" stroke=\"'+s.color+'\"'+(s.dash?' stroke-dasharray=\"6 4\"':'')+'/>';});\n    svg.innerHTML=g;return {X:X,Y:Y,xmin:xmin,xmax:xmax,pL:pL,pR:pR,pT:pT,pB:pB,W:W,H:H,series:series};\n  }\n  function wireHover(svgId,tipId,sc,fmt,xlabel){\n    var svg=document.getElementById(svgId),tip=document.getElementById(tipId);\n    if(!sc){tip.classList.remove('on');svg.onpointermove=null;return;}\n    function clearG(){var gl=document.getElementById(svgId+'-g');if(gl)gl.innerHTML='';}\n    svg.onpointermove=function(e){var r=svg.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*sc.W;\n      if(mx<sc.pL||mx>sc.W-sc.pR){tip.classList.remove('on');clearG();return;}\n      var xv=sc.xmin+(mx-sc.pL)/(sc.W-sc.pL-sc.pR)*(sc.xmax-sc.xmin),year=Math.round(xv),rows='',gx=null,dots='',tol=Math.max(2,(sc.xmax-sc.xmin)*0.03);\n      sc.series.forEach(function(s){var best=null,bd=1e9;s.pts.forEach(function(p){var dd=Math.abs(p[0]-year);if(dd<bd){bd=dd;best=p;}});\n        if(best&&bd<=tol){gx=sc.X(best[0]);dots+='<circle class=\"gdot\" cx=\"'+sc.X(best[0]).toFixed(1)+'\" cy=\"'+sc.Y(best[1]).toFixed(1)+'\" r=\"3.5\" fill=\"'+s.color+'\"/>';\n          rows+='<div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:'+s.color+'\">\\u25CF<\/span><span style=\"flex:1\">'+s.label+'<\/span><b>'+fmt(best[1])+'<\/b><\/div>';}});\n      var gl=document.getElementById(svgId+'-g');\n      if(gx!=null){var guide='<line class=\"gd\" x1=\"'+gx.toFixed(1)+'\" y1=\"'+sc.pT+'\" x2=\"'+gx.toFixed(1)+'\" y2=\"'+(sc.H-sc.pB)+'\"/>'+dots;if(!gl){gl=document.createElementNS('http://www.w3.org/2000/svg','g');gl.setAttribute('id',svgId+'-g');svg.appendChild(gl);}gl.innerHTML=guide;}else clearG();\n      tip.innerHTML='<b>'+(xlabel?xlabel(year):year)+'<\/b>'+rows;var x=e.clientX-r.left+14,ty=e.clientY-r.top+14;if(x>r.width-150)x=e.clientX-r.left-tip.offsetWidth-14;tip.style.left=x+'px';tip.style.top=ty+'px';tip.classList.add('on');};\n    svg.onpointerleave=function(){tip.classList.remove('on');clearG();};\n  }\n  function nf(){return LANG==='fr'?'fr-FR':'en-US';}\n\n  var PER=[[\"0\\u20131000\",4.5,0.1],[\"1000\\u20131500\",4.5,0.1],[\"1500\\u20131700\",4.5,0.2],[\"1700\\u20131820\",4.5,0.5],[\"1820\\u20131913\",5.0,1.5],[\"1913\\u20131950\",1.5,1.9],[\"1950\\u20132012\",2.5,3.8],[\"2012\\u20132050\",3.9,3.3],[\"2050\\u20132100\",4.3,1.5]];\n  var BND=[\"0\",\"1000\",\"1500\",\"1700\",\"1820\",\"1913\",\"1950\",\"2012\",\"2050\",\"2100\"];\n  var stt={r:5,g:2,s:12};\n  var T={fr:{eyebrow:\"Macro\\u00e9conomie \\u00e9cologique \\u00b7 Le mod\\u00e8le de Piketty\",title:\"r \\u2212 g : l'\\u00e9cart qui concentre les patrimoines\",sub:\"Le moteur du mod\\u00e8le de Piketty : quand le rendement du capital <i>r<\/i> d\\u00e9passe la croissance <i>g<\/i>, les patrimoines croissent plus vite que l'\\u00e9conomie et se concentrent. Que devient cet \\u00e9cart quand la croissance s'annule \\u2014 l'horizon de l'\\u00e9conomie \\u00e9cologique ?\",\n    h_title:\"r et g, de l'Antiquit\\u00e9 \\u00e0 2100\",h_sub:\"Rendement du capital <b>après impôt<\/b> (et pertes en capital) et taux de croissance mondial. Le rendement a presque toujours dépassé la croissance — sauf au XXᵉ siècle, où impôts, guerres et destructions l'ont fait passer <b>sous g<\/b>, ce qui a fait reculer les inégalités. L'écart pourrait se rouvrir au XXIᵉ.\",\n    h_note:\"Reproduction de la figure 10.10 de Thomas Piketty, Le Capital au XXIᵉ siècle (2013) — rendement pur du capital après impôt et pertes en capital, vs taux de croissance de la production mondiale, par période. Données : piketty.pse.ens.fr/capital21c.\",\n    ss_title:\"L'\\u00e9tat stationnaire : le dilemme de l'\\u00e9conomie \\u00e9cologique\",ss_sub:\"Faites tomber la croissance <i>g<\/i> vers z\\u00e9ro (l'\\u00e9tat stationnaire impos\\u00e9 par les limites plan\\u00e9taires) et observez l'\\u00e9cart r \\u2212 g et le rapport \\u03b2 = s/g.\",\n    r_lab:\"r (rendement)\",g_lab:\"g (croissance)\",yr:\"ans\",bf_title:\"La croissance, un amortisseur : et si g devient nul, voire négatif ?\",bf_sub:\"Le rendement r reste autour de 5 %. À mesure que la croissance g s'effondre — jusqu'à l'état stationnaire (g = 0), voire le déclin (g < 0) —, l'écart r − g se creuse : le patrimoine hérité l'emporte de plus en plus sur le revenu du travail.\",bf_x:[\"Forte croissance\",\"Croissance modérée\",\"Stationnaire (g = 0)\",\"Déclin (g < 0)\"],bf_r:\"r (rendement) ≈ 5 %\",bf_g:\"g (croissance)\",bf_gap:\"écart r − g : moteur des inégalités\",bf_note:\"Illustration schématique. Plus g diminue, plus l'écart r − g s'élargit : le patrimoine hérité pèse plus lourd que le revenu du travail — précisément le scénario que pose l'économie écologique (état stationnaire, décroissance).\",\n    v_stat:\"<b>\\u00c9tat stationnaire (g \\u2192 0).<\/b> \\u03b2 explose et la part du capital tend vers son maximum : une \\u00e9conomie sans croissance mais \\u00e0 rendement positif devient une <b>soci\\u00e9t\\u00e9 d'h\\u00e9ritiers<\/b>.\",\n    v_snow:\"<b>r > g.<\/b> Le patrimoine cro\\u00eet plus vite que l'\\u00e9conomie et \\u00ab fait boule de neige \\u00bb : les in\\u00e9galit\\u00e9s de patrimoine se creusent.\",\n    v_dilute:\"<b>g \\u2265 r.<\/b> La croissance dilue le poids du patrimoine h\\u00e9rit\\u00e9 \\u2014 situation rare (ex. Trente Glorieuses), l'exception historique.\",\n    v_mid:\"<b>r > g<\/b> mod\\u00e9r\\u00e9. Le capital garde l'avantage sur le travail, mais lentement.\",\n    ss_note:\"Historiquement, r n'est repassé sous g qu'au XXᵉ siècle — grâce à une forte croissance et à une lourde fiscalité du capital — et c'est la seule période où les inégalités ont reculé. Les limites planétaires poussent aujourd'hui g vers zéro : sans agir sur r (fiscalité du capital, redistribution, voire taux d'intérêt négatifs), l'état stationnaire rouvre l'écart r > g et maximise la concentration. C'est le dilemme que l'économie écologique doit affronter.\"},\n   en:{eyebrow:\"Ecological macroeconomics \\u00b7 Piketty's model\",title:\"r \\u2212 g: the gap that concentrates wealth\",sub:\"The engine of Piketty's model: when the return on capital <i>r<\/i> exceeds growth <i>g<\/i>, wealth grows faster than the economy and concentrates. What happens to this gap when growth falls to zero \\u2014 the horizon of ecological economics?\",\n    h_title:\"r and g, from Antiquity to 2100\",h_sub:\"Pure return on capital <b>after tax<\/b> (and capital losses) and world growth rate. The return has almost always exceeded growth — except in the 20th century, when taxes, wars and destruction pushed it <b>below g<\/b>, which reduced inequality. The gap may reopen in the 21st.\",\n    h_note:\"Reproduction of Figure 10.10 from Thomas Piketty, Capital in the Twenty-First Century (2013) — pure after-tax return on capital (and capital losses) vs world output growth rate, by period. Data: piketty.pse.ens.fr/capital21c.\",\n    ss_title:\"The steady state: the dilemma of ecological economics\",ss_sub:\"Push growth <i>g<\/i> toward zero (the steady state imposed by planetary limits) and watch the r \\u2212 g gap and the ratio \\u03b2 = s/g.\",\n    r_lab:\"r (return)\",g_lab:\"g (growth)\",yr:\"yr\",bf_title:\"Growth as a buffer: what if g falls to zero, or below?\",bf_sub:\"The return r stays around 5%. As growth g collapses — down to the steady state (g = 0), even decline (g < 0) —, the r − g gap widens: inherited wealth increasingly outweighs earned income.\",bf_x:[\"Strong growth\",\"Moderate growth\",\"Stationary (g = 0)\",\"Decline (g < 0)\"],bf_r:\"r (return) ≈ 5%\",bf_g:\"g (growth)\",bf_gap:\"r − g gap: driver of inequality\",bf_note:\"Schematic illustration. The more g declines, the wider the r − g gap: inherited wealth outweighs earned income — precisely the scenario ecological economics raises (steady state, degrowth).\",\n    v_stat:\"<b>Steady state (g \\u2192 0).<\/b> \\u03b2 explodes and capital's share tends to its maximum: an economy with no growth but positive returns becomes a <b>society of heirs<\/b>.\",\n    v_snow:\"<b>r > g.<\/b> Wealth grows faster than the economy and snowballs: wealth inequality widens.\",\n    v_dilute:\"<b>g \\u2265 r.<\/b> Growth dilutes the weight of inherited wealth \\u2014 a rare case (e.g. the post-war boom), the historical exception.\",\n    v_mid:\"<b>r > g<\/b>, moderate. Capital keeps its edge over labour, but slowly.\",\n    ss_note:\"Historically, r fell below g only in the 20th century — thanks to fast growth and heavy capital taxation — and that was the only period when inequality declined. Planetary limits now push g toward zero: without acting on r (capital taxation, redistribution, even negative interest rates), the steady state reopens the r > g gap and maximises concentration. This is the dilemma ecological economics must confront.\"}};\n  function renderHist(){var d=T[LANG],W=680,H=360,pL=42,pR=14,pT=18,pB=50,ymax=6,n=PER.length,slot=(W-pL-pR)/n;\n    function cx(i){return pL+slot*(i+0.5);} function Y(v){return (H-pB)-v/ymax*(H-pT-pB);}\n    var g='';for(var t=0;t<=6;t++){var yy=Y(t);g+='<line class=\"grid\" x1=\"'+pL+'\" y1=\"'+yy.toFixed(1)+'\" x2=\"'+(W-pR)+'\" y2=\"'+yy.toFixed(1)+'\"/><text class=\"ax\" x=\"'+(pL-6)+'\" y=\"'+(yy+3.5).toFixed(1)+'\" text-anchor=\"end\">'+t+'%<\/text>';}\n    for(var i=0;i<=n;i++){var x=pL+slot*i;g+='<text class=\"ax\" x=\"'+x.toFixed(1)+'\" y=\"'+(H-pB+14)+'\" text-anchor=\"middle\" font-size=\"8.5\">'+BND[i]+'<\/text>';}\n    g+='<line class=\"axl\" x1=\"'+pL+'\" y1=\"'+(H-pB)+'\" x2=\"'+(W-pR)+'\" y2=\"'+(H-pB)+'\"/><line class=\"axl\" x1=\"'+pL+'\" y1=\"'+pT+'\" x2=\"'+pL+'\" y2=\"'+(H-pB)+'\"/>';\n    function ln(idx,col){var dd='';for(var i=0;i<n;i++){dd+=(i?' L ':'M ')+cx(i).toFixed(1)+' '+Y(PER[i][idx]).toFixed(1);}var c='';for(var j=0;j<n;j++)c+='<circle cx=\"'+cx(j).toFixed(1)+'\" cy=\"'+Y(PER[j][idx]).toFixed(1)+'\" r=\"2.6\" fill=\"'+col+'\"/>';return '<path class=\"ln\" d=\"'+dd+'\" stroke=\"'+col+'\"/>'+c;}\n    g+='<rect x=\"'+(pL+slot*5).toFixed(1)+'\" y=\"'+pT+'\" width=\"'+(slot*2).toFixed(1)+'\" height=\"'+(H-pB-pT)+'\" fill=\"#0F766E\" opacity=\"0.08\"/>';g+='<text x=\"'+(pL+slot*6).toFixed(1)+'\" y=\"'+(pT+13)+'\" text-anchor=\"middle\" style=\"font-family:var(--font-m);font-size:10px;fill:#0F766E\">r &lt; g<\/text>';g+=ln(1,'#B8860B')+ln(2,'#0F766E');\n    g+='<text x=\"'+(cx(0)+6).toFixed(1)+'\" y=\"'+(Y(4.5)-7).toFixed(1)+'\" style=\"fill:#B8860B;font-family:var(--font-d);font-style:italic;font-size:13px\">r<\/text>';\n    g+='<text x=\"'+(cx(n-1)).toFixed(1)+'\" y=\"'+(Y(1.5)+15).toFixed(1)+'\" style=\"fill:#0F766E;font-family:var(--font-d);font-style:italic;font-size:13px\" text-anchor=\"middle\">g<\/text>';\n    document.getElementById('hist').innerHTML=g;}\n  function out(k,v){return '<div class=\"pk-out\"><p class=\"k\">'+k+'<\/p><div class=\"v\">'+v+'<\/div><\/div>';}\n  function bar(lab,val,col,mx){return '<div class=\"ss-bar\"><span class=\"bl\">'+lab+'<\/span><div class=\"bt\"><div class=\"bf\" style=\"width:'+(100*Math.max(val,0)/mx).toFixed(1)+'%;background:'+col+'\">'+val.toLocaleString(nf(),{maximumFractionDigits:1})+' %<\/div><\/div><\/div>';}\n  function renderSS(){var d=T[LANG],gap=stt.r-stt.g,beta=stt.s/stt.g,alpha=stt.r*beta,mx=7;\n    document.getElementById('bars').innerHTML=bar(d.r_lab,stt.r,'#B8860B',mx)+bar(d.g_lab,stt.g,'#0F766E',mx);\n    document.getElementById('ssouts').innerHTML=out('r \\u2212 g',gap.toLocaleString(nf(),{maximumFractionDigits:1})+' <small>pts<\/small>')+out('\\u03b2 = s / g',(beta>99?'\\u221e':beta.toLocaleString(nf(),{maximumFractionDigits:1}))+' <small>'+d.yr+'<\/small>')+out('\\u03b1 = r\\u00d7\\u03b2',(alpha>999?'\\u221e':Math.round(alpha))+' <small>%<\/small>');\n    var v;if(stt.g<=0.3)v=d.v_stat;else if(stt.g>=stt.r)v=d.v_dilute;else if(gap>=2)v=d.v_snow;else v=d.v_mid;\n    document.getElementById('verdict').innerHTML=v;}\n  var CTL=[['r',2,6,0.1],['g',0,4,0.1],['s',5,25,0.5]];\n  function fmtCtl(k){return stt[k].toLocaleString(nf(),{maximumFractionDigits:1})+' %';}\n  var LBL={fr:{r:\"Rendement du capital r\",g:\"Croissance g\",s:\"Taux d'\\u00e9pargne s\"},en:{r:\"Return on capital r\",g:\"Growth g\",s:\"Savings rate s\"}};\n  function buildCtrls(){var box=document.getElementById('ctrls');box.innerHTML='';CTL.forEach(function(c){var k=c[0];var row=document.createElement('div');row.className='pk-ctrl';row.innerHTML='<div class=\"lab\"><span class=\"name\">'+LBL[LANG][k]+'<\/span><span class=\"val\" id=\"v_'+k+'\"><\/span><\/div><input type=\"range\" id=\"i_'+k+'\" min=\"'+c[1]+'\" max=\"'+c[2]+'\" step=\"'+c[3]+'\">';box.appendChild(row);});CTL.forEach(function(c){var k=c[0],el=document.getElementById('i_'+k);el.value=stt[k];document.getElementById('v_'+k).textContent=fmtCtl(k);el.addEventListener('input',function(){stt[k]=parseFloat(this.value);document.getElementById('v_'+k).textContent=fmtCtl(k);renderSS();});});}\n  function renderBuffer(){var d=T[LANG],W=680,H=380,pL=48,pR=18,pT=42,pB=56,ymin=-2,ymax=6,n=4,R=5,G=[5,2.5,0,-1.5],slot=(W-pL-pR)/n;\n    function cx(i){return pL+slot*(i+0.5);} function Y(v){return (H-pB)-(v-ymin)/(ymax-ymin)*(H-pT-pB);}\n    var g='';\n    for(var t=-2;t<=6;t+=2){var yy=Y(t);g+='<line class=\"grid\" x1=\"'+pL+'\" y1=\"'+yy.toFixed(1)+'\" x2=\"'+(W-pR)+'\" y2=\"'+yy.toFixed(1)+'\"/><text class=\"ax\" x=\"'+(pL-7)+'\" y=\"'+(yy+3.5).toFixed(1)+'\" text-anchor=\"end\">'+t+'%<\/text>';}\n    g+='<line x1=\"'+pL+'\" y1=\"'+Y(0).toFixed(1)+'\" x2=\"'+(W-pR)+'\" y2=\"'+Y(0).toFixed(1)+'\" stroke=\"var(--faint)\" stroke-dasharray=\"5 4\" opacity=\"0.55\"/>';\n    var poly='';for(var i=0;i<n;i++)poly+=(i?' L ':'M ')+cx(i).toFixed(1)+' '+Y(R).toFixed(1);for(var j=n-1;j>=0;j--)poly+=' L '+cx(j).toFixed(1)+' '+Y(G[j]).toFixed(1);\n    g+='<path d=\"'+poly+' Z\" fill=\"#DC2626\" opacity=\"0.10\"/>';\n    var rd='';for(var i=0;i<n;i++)rd+=(i?' L ':'M ')+cx(i).toFixed(1)+' '+Y(R).toFixed(1);g+='<path d=\"'+rd+'\" fill=\"none\" stroke=\"#B8860B\" stroke-width=\"2.6\"/>';for(var i=0;i<n;i++)g+='<circle cx=\"'+cx(i).toFixed(1)+'\" cy=\"'+Y(R).toFixed(1)+'\" r=\"3.6\" fill=\"#B8860B\"/>';\n    var gd='';for(var i=0;i<n;i++)gd+=(i?' L ':'M ')+cx(i).toFixed(1)+' '+Y(G[i]).toFixed(1);g+='<path d=\"'+gd+'\" fill=\"none\" stroke=\"#0F766E\" stroke-width=\"2.6\"/>';for(var i=0;i<n;i++)g+='<circle cx=\"'+cx(i).toFixed(1)+'\" cy=\"'+Y(G[i]).toFixed(1)+'\" r=\"3.6\" fill=\"#0F766E\"/>';\n    g+='<line class=\"axl\" x1=\"'+pL+'\" y1=\"'+(H-pB)+'\" x2=\"'+(W-pR)+'\" y2=\"'+(H-pB)+'\"/>';\n    for(var i=0;i<n;i++)g+='<text class=\"ax\" x=\"'+cx(i).toFixed(1)+'\" y=\"'+(H-pB+18)+'\" text-anchor=\"middle\" font-size=\"10.5\">'+d.bf_x[i]+'<\/text>';\n    g+='<text x=\"'+(cx(0)-8).toFixed(1)+'\" y=\"'+(Y(R)-10).toFixed(1)+'\" style=\"font-family:var(--font-b);font-size:12px;fill:var(--ink);font-weight:600\">'+d.bf_r+'<\/text>';\n    g+='<text x=\"'+cx(1).toFixed(1)+'\" y=\"'+(Y(G[1])+22).toFixed(1)+'\" text-anchor=\"middle\" style=\"font-family:var(--font-b);font-size:12px;fill:#0F766E;font-weight:600\">'+d.bf_g+'<\/text>';\n    g+='<text x=\"'+(cx(2)+6).toFixed(1)+'\" y=\"'+Y(3.4).toFixed(1)+'\" text-anchor=\"middle\" style=\"font-family:var(--font-d);font-style:italic;font-size:12.5px;fill:#C0392B\">'+d.bf_gap+'<\/text>';\n    document.getElementById('buf').innerHTML=g;}\n  function onTheme(){renderHist();renderBuffer();}\n  function applyLang(){var d=T[LANG];document.documentElement.lang=LANG;document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');if(d[k]!=null)el.innerHTML=d[k];});document.getElementById('langlbl').textContent=LANG.toUpperCase();document.title=d.title;renderHist();buildCtrls();renderSS();renderBuffer();}\n\n\n  document.getElementById('lang').addEventListener('click',function(){ LANG=LANG==='fr'?'en':'fr'; try{localStorage.setItem('rg_lang',LANG);}catch(e){} applyLang(); });\n  document.getElementById('theme').addEventListener('click',function(){ var n=effTheme()==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); try{localStorage.setItem('rg_theme',n);}catch(e){} if(typeof onTheme==='function')onTheme(); });\n\napplyLang();\n})();\n<\/script>\n<\/body>\n<\/html>\n"}</script>

<script>
(function(){
  "use strict";

  var CFG   = JSON.parse(document.getElementById('configsrc').textContent);
  var TOOLS = JSON.parse(document.getElementById('toolsrc').textContent);

  var STEPS   = CFG.outils;          // {fichier, cle, partie, icone, couleur}
  var PARTIES = CFG.parties;         // {numero, couleur}
  var N       = STEPS.length;
  var NP      = PARTIES.length;
  var PREFIXE = CFG.prefixe_stockage || 'fil';

  function tok(nom){ return 'var(--' + (nom || 'ink') + ')'; }

  /* ───────── bibliothèque d'icônes ─────────
     Chaque icône reçoit la couleur d'accent de sa carte. Pour en ajouter une,
     déclarer un cas supplémentaire et le nommer dans la configuration. */
  function emb(nom, couleur){
    var a = tok(couleur);
    var S = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">';
    switch(nom){
      case 'cibles':      return S+'<circle cx="12" cy="12" r="9" stroke="'+a+'"/><circle cx="12" cy="12" r="5.4"/><circle cx="12" cy="12" r="2" fill="var(--econ)" stroke="var(--econ)"/></svg>';
      case 'circuit':     return S+'<circle cx="12" cy="12" r="8"/><path d="M15 9.2A4 4 0 0 0 8.5 11" stroke="'+a+'"/><path d="M9 14.8A4 4 0 0 0 15.5 13" stroke="'+a+'"/><path d="M9.5 11.5h4M9.5 13h4" stroke="'+a+'"/></svg>';
      case 'eclair':      return S+'<circle cx="12" cy="12" r="8"/><path d="M12.5 7l-3.2 5.4H12l-0.6 4.2 3.6-5.6H12z" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'engrenages':  return S+'<circle cx="9" cy="10" r="3.2"/><circle cx="15.4" cy="15" r="2.6"/><path d="M9 4.6v1.6M9 13.8v1.6M3.8 10h1.6M12.6 10h1.6M5.4 6.4l1.1 1.1M11.5 12.5l1.1 1.1M12.6 6.4l-1.1 1.1M5.4 13.6l1.1-1.1" stroke="'+a+'"/></svg>';
      case 'courbes':     return S+'<path d="M3 20C10 20 12 5 21 4" stroke="'+a+'"/><path d="M3 20C9 20 9 9 20 8.5"/></svg>';
      case 'bosse':       return S+'<path d="M3.5 19C8 5 16 5 20.5 19" stroke="'+a+'"/><path d="M3 12.5h18" stroke-dasharray="2 2"/></svg>';
      case 'lecture':     return S+'<path d="M9 7l8 5-8 5z" fill="'+a+'" stroke="'+a+'"/><path d="M4 12h2"/></svg>';
      case 'seuil':       return S+'<path d="M3 20C7 20 8 8 13 8s2 8 8 8" stroke="'+a+'"/><path d="M3 6h18" stroke-dasharray="2 2"/></svg>';
      case 'divergence':  return S+'<path d="M3 18C9 18 12 15 21 14"/><path d="M3 18C9 18 11 7 21 4" stroke="'+a+'"/><path d="M3 21V3" opacity=".45"/></svg>';
      case 'fourche':     return S+'<path d="M3 12h7"/><path d="M10 12l8-5.5" stroke="'+a+'"/><path d="M10 12l8 5.5" stroke="var(--faint)"/><path d="M18 6.5l-3 .4M18 6.5l.5 2.9" stroke="'+a+'"/></svg>';
      case 'leviers':     return S+'<path d="M3 20h18"/><path d="M6 20v-7"/><path d="M12 20V6" stroke="'+a+'"/><path d="M18 20v-10"/><path d="M8.6 8.4l2.2 2.2M10.8 8.4l-2.2 2.2" stroke="var(--faint)"/><path d="M14.6 12l2.2 2.2M16.8 12l-2.2 2.2" stroke="var(--faint)"/></svg>';
      case 'anneau':      return S+'<circle cx="12" cy="12" r="8.6" stroke-dasharray="3.4 2.4"/><circle cx="12" cy="12" r="4.4" stroke="'+a+'"/></svg>';
      case 'aires':       return S+'<path d="M3 20h18"/><path d="M3 17.6c4 0 6-2.4 9-2.4s5.4 1.6 9 1.6" stroke="'+a+'"/><path d="M3 13.6c4 0 6-3.6 9-3.6s5.4 2.6 9 2.6"/><path d="M3 9.4c4 0 6-2.6 9-2.6s5.4 1.8 9 1.8" opacity=".5"/></svg>';
      case 'balance':     return S+'<path d="M12 4v16M5 8h14" stroke="'+a+'"/><path d="M5 8l-2.2 5a2.6 2.6 0 0 0 4.4 0z"/><path d="M19 8l-2.2 5a2.6 2.6 0 0 0 4.4 0z"/></svg>';
      case 'flux':        return S+'<path d="M3 8h13" stroke="'+a+'"/><path d="M16 8l-3-2.6M16 8l-3 2.6" stroke="'+a+'"/><path d="M21 16H8"/><path d="M8 16l3-2.6M8 16l3 2.6"/></svg>';
      case 'horloge':     return S+'<circle cx="12" cy="12" r="8.6"/><path d="M12 7v5.4l3.4 2" stroke="'+a+'"/></svg>';
      case 'seau':        return S+'<path d="M4.2 6.6h15.6l-1.7 9.7a1.8 1.8 0 0 1-1.8 1.5H7.7a1.8 1.8 0 0 1-1.8-1.5z"/><path d="M10.4 11.6h.01M13.7 13.6h.01" stroke="'+a+'" stroke-width="2.6"/><circle cx="10.5" cy="20.4" r="1.05" fill="'+a+'" stroke="none"/><circle cx="13.9" cy="21.4" r="0.85" fill="'+a+'" stroke="none"/></svg>';
      case 'des':         return S+'<rect x="4" y="4" width="16" height="16" rx="3.4"/><circle cx="8.6" cy="8.6" r="1.35" fill="'+a+'" stroke="none"/><circle cx="15.4" cy="8.6" r="1.35" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.35" fill="'+a+'" stroke="none"/><circle cx="8.6" cy="15.4" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.35" fill="'+a+'" stroke="none"/></svg>';
      case 'planchers':   return S+'<path d="M3 20h18"/><rect x="5" y="6.5" width="3.8" height="13.5" rx="1"/><rect x="10.1" y="9.5" width="3.8" height="10.5" rx="1"/><rect x="15.2" y="12" width="3.8" height="8" rx="1" stroke="'+a+'"/><path d="M3.8 16.8h16.4" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'mappemonde':  return S+'<circle cx="12" cy="12" r="8.6" stroke="'+a+'"/><path d="M12 3.4c3.1 3 3.1 14.2 0 17.2M12 3.4c-3.1 3-3.1 14.2 0 17.2"/><path d="M3.7 9.3h16.6M3.7 14.7h16.6"/></svg>';
      /* silhouette réelle de la courbe de l'éléphant : bosse, creux, trompe */
      case 'elephant':    return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17.5C6.6 17.5 7.2 10 9.6 10S12.6 15.2 15.4 15.2C17.4 15.2 18.2 9.5 20 4.6" stroke="'+a+'"/></svg>';
      case 'convergence': return S+'<path d="M3.2 5.5h4.4M3.2 12h4.4M3.2 18.5h4.4"/><path d="M7.6 5.5C12.8 5.5 12.8 12 16.2 12" stroke="'+a+'"/><path d="M7.6 12h8.6" stroke="'+a+'"/><path d="M7.6 18.5C12.8 18.5 12.8 12 16.2 12" stroke="'+a+'"/><circle cx="18.4" cy="12" r="2.1" fill="'+a+'" stroke="'+a+'"/></svg>';
      case 'distribution':return S+'<path d="M3 20h18"/><path d="M5.5 20v-3.2M8.5 20v-9M11.5 20v-6M14.5 20v-3.4M17.5 20v-1.8"/><path d="M12.8 4.5V20" stroke="'+a+'" stroke-dasharray="2.5 2"/></svg>';
      case 'lorenz':      return S+'<path d="M4 20h16M4 20V4"/><path d="M4 20L20 4" stroke-dasharray="2.5 2" opacity=".55"/><path d="M4 20C11 20 16.5 15 20 4" stroke="'+a+'"/></svg>';
      /* plusieurs séries superposées, pilotées par un même sélecteur */
      case 'series':      return S+'<path d="M4 20h16M4 20V4"/><path d="M6 14.5l3.4-3.4 3.4 3.4 3.4-6.6 2.6 2.4" stroke="'+a+'"/><path d="M6 17.8c3.4-.6 6.2 1 12-2.6" opacity=".45"/><circle cx="9.4" cy="11.1" r="1.25" fill="'+a+'" stroke="none"/><circle cx="16.2" cy="7.9" r="1.25" fill="'+a+'" stroke="none"/></svg>';
      case 'croisement':  return S+'<path d="M4 20h16M4 20V4"/><path d="M6 17.5L19 7" stroke="'+a+'" stroke-dasharray="3 2"/><circle cx="8.5" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="13.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="10.5" r="1.2" fill="'+a+'" stroke="none"/><circle cx="18" cy="8" r="1.2" fill="'+a+'" stroke="none"/></svg>';
      case 'voile':       return S+'<path d="M2.6 12S6 6.8 12 6.8 21.4 12 21.4 12 18 17.2 12 17.2 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="2.5" stroke="'+a+'"/><path d="M4.5 19.5L19.5 4.5" stroke="'+a+'"/></svg>';
      case 'course':      return S+'<path d="M3 20h18M3 20V4"/><path d="M4.5 17C9 17 13 13.5 20 5.5" stroke="'+a+'"/><path d="M4.5 17C9 17 13 15.5 20 13.5"/></svg>';
      case 'ratio':       return S+'<path d="M3 20h18"/><rect x="5.5" y="4.5" width="4.6" height="15.5" rx="1.2" stroke="'+a+'"/><rect x="13.9" y="15" width="4.6" height="5" rx="1.2"/></svg>';
      case 'ecart':       return S+'<path d="M3 20h18"/><path d="M4 7h16" stroke="'+a+'"/><path d="M4 12.6C9 12.6 13.5 16 20 17"/><path d="M12 7.6v6.9" stroke="var(--faint)"/><path d="M12 7.6l-1.5 1.7M12 7.6l1.5 1.7M12 14.5l-1.5-1.7M12 14.5l1.5-1.7" stroke="var(--faint)"/></svg>';
    }
    return S+'<circle cx="12" cy="12" r="8" stroke="'+a+'"/></svg>';
  }

  /* ───────── état ───────── */
  var LANG = CFG.langue_defaut || 'fr';
  try{ var sl=localStorage.getItem(PREFIXE+'_lang'); if(sl) LANG=sl; }catch(e){}
  var THEME=null;
  try{ var st=localStorage.getItem(PREFIXE+'_theme'); if(st) THEME=st; }catch(e){}
  if(!THEME) THEME = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', THEME);

  function T(){ return CFG.textes[LANG]; }

  function seed(){
    for(var i=0;i<N;i++){
      try{
        localStorage.setItem(STEPS[i].cle+'_theme', THEME);
        localStorage.setItem(STEPS[i].cle+'_lang',  LANG);
      }catch(e){}
    }
    try{ localStorage.setItem(PREFIXE+'_theme',THEME); localStorage.setItem(PREFIXE+'_lang',LANG); }catch(e){}
  }

  /* ───────── le fil ───────── */
  function carte(i){
    var d=T(), s=STEPS[i];
    var a=document.createElement('a');
    a.className='card'; a.href='#/'+(i+1);
    a.innerHTML='<span class="emb" style="color:'+tok(s.couleur)+'">'+emb(s.icone,s.couleur)+'</span>'+
      '<span class="cbody"><span class="idx">'+(i+1)+'</span>'+
      '<h3>'+d.cartes[i].titre+'</h3><p>'+d.cartes[i].resume+'</p>'+
      '<span class="go">'+d.nav_ouvrir+' →</span></span>';
    return a;
  }

  function buildFil(){
    var d=T(), box=document.getElementById('parties');
    box.innerHTML='';
    for(var p=1;p<=NP;p++){
      var sec=document.createElement('section');
      sec.className='part';
      sec.style.setProperty('--pc', tok(PARTIES[p-1].couleur));
      var h='<div class="parthead"><span class="rn">'+PARTIES[p-1].numero+'</span>'+
            '<h2>'+d.parties[p-1].titre+'</h2></div>'+
            '<p class="partlead">'+d.parties[p-1].chapo+'</p>'+
            '<div class="cards"></div>';
      sec.innerHTML=h;
      var grille=sec.querySelector('.cards');
      for(var i=0;i<N;i++) if(STEPS[i].partie===p) grille.appendChild(carte(i));
      box.appendChild(sec);
    }
  }

  /* ───────── bandeau de situation ───────── */
  function premierDe(p){ for(var j=0;j<N;j++) if(STEPS[j].partie===p) return j; return 0; }

  function buildNav(i){
    var d=T(), s=STEPS[i], cur=null,
        bar=document.getElementById('nparts'), box=document.getElementById('steps');
    document.documentElement.style.setProperty('--acc', tok(PARTIES[s.partie-1].couleur));
    document.getElementById('ncount').textContent=(i+1)+' / '+N;

    bar.innerHTML='';
    for(var p=1;p<=NP;p++){
      if(p===s.partie){
        var c=document.createElement('span');
        c.className='pcur';
        c.innerHTML='<em>'+PARTIES[p-1].numero+'</em><span>'+d.parties[p-1].titre+'</span>';
        c.setAttribute('aria-current','true');
        bar.appendChild(c);
      } else {
        var g=document.createElement('a');
        g.className='pgrp';
        g.href='#/'+(premierDe(p)+1);
        g.title=PARTIES[p-1].numero+' · '+d.parties[p-1].titre;
        g.textContent=PARTIES[p-1].numero;
        bar.appendChild(g);
      }
    }

    box.innerHTML='';
    for(var j=0;j<N;j++){
      if(STEPS[j].partie!==s.partie) continue;
      var a=document.createElement('a');
      a.className='stp'+(j===i?' on':'');
      a.href='#/'+(j+1);
      a.title=d.cartes[j].titre;
      a.innerHTML='<em>'+(j+1)+'</em><span>'+d.cartes[j].titre+'</span>';
      if(j===i){ a.setAttribute('aria-current','true'); cur=a; }
      box.appendChild(a);
    }
    /* le bandeau peut être encore masqué : on attend une frame pour mesurer */
    if(cur) requestAnimationFrame(function(){
      box.scrollLeft = Math.max(0, cur.offsetLeft - (box.clientWidth - cur.offsetWidth)/2);
    });
  }

  /* ───────── iframes ───────── */
  var host=document.getElementById('host'), frames={}, current=-1;

  /* Une iframe capte le clavier dès qu'on a cliqué dedans, et la coquille ne
     voit plus rien. On y relaie donc Échap et F — et seulement eux : les
     flèches appartiennent aux outils, qui s'en servent pour leurs propres
     étapes. Les iframes srcdoc héritent de notre origine, d'où l'accès. */
  function brancherClavier(fr){
    try{
      var doc=fr.contentDocument; if(!doc) return;
      doc.addEventListener('keydown', function(ev){
        if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
        if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
        else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
      });
    }catch(e){}
  }

  function syncFrame(fr){
    if(!fr) return;
    try{
      var doc=fr.contentDocument;
      if(!doc || !doc.documentElement) return;
      for(var n=0;n<2;n++){
        if(doc.documentElement.getAttribute('data-theme')===THEME) break;
        var tb=doc.getElementById('theme'); if(!tb) break; tb.click();
      }
      for(var m=0;m<2;m++){
        if((doc.documentElement.lang||'fr')===LANG) break;
        var lb=doc.getElementById('lang'); if(!lb) break; lb.click();
      }
    }catch(e){}
  }

  function showTool(i){
    var s=STEPS[i], d=T();
    document.body.classList.add('mode-tool');
    seed();
    if(!frames[s.fichier]){
      var fr=document.createElement('iframe');
      fr.setAttribute('title', d.cartes[i].titre);
      host.appendChild(fr);
      frames[s.fichier]=fr;
      fr.addEventListener('load', function(){ syncFrame(fr); brancherClavier(fr); });
      fr.srcdoc = TOOLS[s.fichier];
    } else {
      syncFrame(frames[s.fichier]);
    }
    for(var k in frames) frames[k].style.display = (k===s.fichier) ? 'block' : 'none';
    if(plein) montrerNav(1600);
    current=i;
    buildNav(i);
    var pb=document.getElementById('prev'), nb=document.getElementById('next');
    pb.disabled=(i===0); nb.disabled=(i===N-1);
    pb.title=d.nav_prec; nb.title=d.nav_suiv;
  }

  function showFil(){
    if(plein) setPlein(false);
    document.body.classList.remove('mode-tool');
    current=-1;
    window.scrollTo(0, window.__filScroll||0);
  }

  /* ───────── plein écran ───────── */
  var plein=false, minuterieNav=null, minuterieAstuce=null;

  function montrerNav(delaiMasquage){
    document.body.classList.add('nav-on');
    clearTimeout(minuterieNav);
    if(delaiMasquage) minuterieNav=setTimeout(function(){
      document.body.classList.remove('nav-on');
    }, delaiMasquage);
  }

  function demanderPleinEcran(){
    var el=document.documentElement;
    var f=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(f){ try{ var p=f.call(el); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }
  function quitterPleinEcran(){
    var actif=document.fullscreenElement||document.webkitFullscreenElement;
    if(!actif) return;
    var f=document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
    if(f){ try{ var p=f.call(document); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  }

  function setPlein(v){
    if(plein===v) return;
    plein=v;
    document.body.classList.toggle('mode-plein', v);
    var b=document.getElementById('tplein'), d=T();
    b.textContent = v ? '⤡' : '⤢';
    b.title = v ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    if(v){
      demanderPleinEcran();
      montrerNav(2400);
      document.getElementById('pastille').textContent =
        (d.nav_plein_astuce||'Approchez du haut pour revoir la barre · Échap pour sortir');
      document.body.classList.add('astuce');
      clearTimeout(minuterieAstuce);
      /* l'astuce doit rester lisible après le retrait du bandeau, pas pendant */
      minuterieAstuce=setTimeout(function(){ document.body.classList.remove('astuce'); }, 6500);
    } else {
      quitterPleinEcran();
      clearTimeout(minuterieNav); clearTimeout(minuterieAstuce);
      document.body.classList.remove('nav-on','astuce');
    }
  }

  document.getElementById('tplein').addEventListener('click', function(){ setPlein(!plein); });
  document.getElementById('hotzone').addEventListener('mouseenter', function(){ montrerNav(0); });
  document.querySelector('.nav').addEventListener('mouseleave', function(){ if(plein) montrerNav(500); });
  /* Sortie par F11 ou par la touche Échap interceptée par le navigateur :
     on resynchronise la coquille sur l'état réel. */
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement||document.webkitFullscreenElement) && plein) setPlein(false);
    });
  });

  function route(){
    var h=(location.hash||'').replace(/^#\/?/,'');
    var n=parseInt(h,10);
    if(h && !isNaN(n) && n>=1 && n<=N){
      if(current===-1) window.__filScroll = window.pageYOffset||0;
      showTool(n-1);
    } else {
      showFil();
    }
  }
  window.addEventListener('hashchange', route);

  function go(i){
    if(i<0){ location.hash='#/fil'; return; }
    if(i>N-1) return;
    location.hash='#/'+(i+1);
  }
  document.getElementById('prev').addEventListener('click', function(){ if(current>0) go(current-1); });
  document.getElementById('next').addEventListener('click', function(){ if(current>-1 && current<N-1) go(current+1); });

  document.addEventListener('keydown', function(ev){
    if(current===-1) return;
    if(ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    if(ev.key==='Escape'){ if(plein) setPlein(false); else location.hash='#/fil'; }
    else if(ev.key==='f' || ev.key==='F'){ setPlein(!plein); }
    else if(ev.key==='ArrowLeft'  && current>0)   { go(current-1); }
    else if(ev.key==='ArrowRight' && current<N-1) { go(current+1); }
  });

  /* ───────── bascules ───────── */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', THEME);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleTheme(){ THEME=(THEME==='dark')?'light':'dark'; applyTheme(); }
  document.getElementById('theme').addEventListener('click', toggleTheme);
  document.getElementById('ttheme').addEventListener('click', toggleTheme);

  function applyLang(){
    var d=T();
    document.documentElement.lang=LANG;
    document.title = d.titre_onglet;
    document.getElementById('eyebrow').innerHTML = d.surtitre;
    document.getElementById('titre').textContent = d.titre;
    document.getElementById('seance').textContent = d.seance;
    document.getElementById('chapo').innerHTML = d.chapo;
    document.getElementById('pied').innerHTML = d.pied;
    document.getElementById('licence').innerHTML = d.licence;
    document.getElementById('homelbl').textContent = d.nav_fil;
    var bp=document.getElementById('tplein');
    bp.title = plein ? (d.nav_plein_sortie||'Quitter le plein écran') : (d.nav_plein||'Plein écran');
    document.getElementById('langlbl').textContent = LANG.toUpperCase();
    document.getElementById('tlanglbl').textContent = LANG.toUpperCase();
    buildFil();
    if(current>-1) buildNav(current);
    seed();
    for(var k in frames) syncFrame(frames[k]);
  }
  function toggleLang(){
    var codes=Object.keys(CFG.textes);
    LANG = codes[(codes.indexOf(LANG)+1) % codes.length];
    applyLang();
  }
  document.getElementById('lang').addEventListener('click', toggleLang);
  document.getElementById('tlang').addEventListener('click', toggleLang);

  /* ───────── démarrage ───────── */
  seed();
  applyLang();
  route();
})();
</script>

</body>
</html>
