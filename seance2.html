ss=\"chartwrap\"><svg class=\"chart\" id=\"chart\" viewBox=\"0 0 472 462\" role=\"img\" aria-label=\"Courbe de Lorenz\"><\/svg><\/div>\n        <div class=\"legend\" id=\"legend\"><\/div>\n        <p class=\"note\" data-t=\"model_note\"><\/p>\n      <\/div>\n      <div class=\"stats\" id=\"stats\"><\/div>\n      <p class=\"insight\" id=\"insight\"><\/p>\n    <\/section>\n  <\/div>\n\n  <section class=\"card explain\">\n    <h2 data-t=\"ex_title\"><\/h2>\n    <p data-t=\"ex_p1\"><\/p>\n    <p data-t=\"ex_p2\"><\/p>\n    <p data-t=\"ex_p3\"><\/p>\n    <div class=\"formula-box\">\n      <div class=\"formula\" aria-label=\"Gini = A / (A + B) = 2A\">\n        <span><i>G<\/i><\/span><span class=\"eq\">=<\/span>\n        <span class=\"frac\"><span class=\"num\"><i>A<\/i><\/span><span class=\"den\"><i>A<\/i>&#8202;+&#8202;<i>B<\/i><\/span><\/span>\n        <span class=\"eq\">=<\/span><span>2<i>A<\/i><\/span>\n      <\/div>\n      <p class=\"formuladef\" data-t=\"gini_def\"><\/p>\n    <\/div>\n  <\/section>\n  <section class=\"card\">\n    <h2 data-t=\"sg_title\"><\/h2>\n    <p class=\"sub\" data-t=\"sg_sub\" style=\"margin-top:0;margin-bottom:2px;\"><\/p>\n    <div class=\"sg-ctrl\"><div class=\"lab\"><span class=\"name\" data-t=\"sg_g\"><\/span><span class=\"val\"><b id=\"sgv\"><\/b><\/span><\/div><input type=\"range\" id=\"sg\" min=\"0.20\" max=\"0.60\" step=\"0.01\"><\/div>\n    <div class=\"sg-wrap\"><svg id=\"sglz\" viewBox=\"0 0 300 300\" role=\"img\"><\/svg><\/div>\n    <div class=\"sg-row\" id=\"sgrow\"><\/div>\n    <p class=\"note\" data-t=\"sg_note\"><\/p>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  /* ───────── maths : normale, Lorenz, Gini ───────── */\n  function erf(x){var t=1/(1+0.3275911*Math.abs(x));\n    var y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);\n    return x<0?-y:y;}\n  function normCdf(x){return 0.5*(1+erf(x/Math.SQRT2));}\n  function normInv(p){ if(p<=0)return -Infinity; if(p>=1)return Infinity;\n    var a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];\n    var b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];\n    var c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];\n    var d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];\n    var pl=0.02425,ph=1-pl,q,r,x;\n    if(p<pl){q=Math.sqrt(-2*Math.log(p));x=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}\n    else if(p<=ph){q=p-0.5;r=q*q;x=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}\n    else{q=Math.sqrt(-2*Math.log(1-p));x=-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}\n    return x;}\n  function Lz(p,s){ if(p<=0)return 0; if(p>=1)return 1; if(s<=0) return p; return normCdf(normInv(p)-s); }\n  function giniOf(s){ return 2*normCdf(s/Math.SQRT2)-1; }\n  function sigmaForG(G){ return G<=0?0:Math.SQRT2*normInv((G+1)/2); }\n\n  /* ───────── état ───────── */\n  var DEFAULT={sigma:sigmaForG(0.35), lens:'quart'};\n  var state={sigma:DEFAULT.sigma, lens:DEFAULT.lens};\n  var PRESETS={ eq:0, low:sigmaForG(0.25), mod:sigmaForG(0.35), high:sigmaForG(0.50), vhigh:sigmaForG(0.62) };\n\n  try{var st=localStorage.getItem('lorenz_theme'); if(st) document.documentElement.setAttribute('data-theme',st);}catch(e){}\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme'); if(a) return a; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}\n  var LANG='fr'; try{var sl=localStorage.getItem('lorenz_lang'); if(sl) LANG=sl;}catch(e){}\n\n  var STR={\n    fr:{\n      eyebrow:\"Macroéconomie écologique · Fondamentaux statistiques\",\n      title:\"Quantiles &amp; courbe de Lorenz\",\n      sub:\"On classe la population du plus pauvre au plus riche, puis on porte, pour chaque part cumulée de la population, la <b>part cumulée du revenu<\/b> qu'elle détient : c'est la <b>courbe de Lorenz<\/b>. Plus elle s'éloigne de la diagonale d'égalité, plus l'inégalité est forte — et le <b>Gini<\/b> mesure cet écart. Faites varier la concentration, et lisez la distribution à l'échelle de votre choix.\",\n      ctrl_title:\"Régler la distribution\",\n      ineq_label:\"Concentration des revenus\",\n      gini_lab:\"Gini\", presets_lab:\"Scénarios\", lens_lab:\"Loupe à quantiles\",\n      presets:{eq:\"Égalité parfaite\", low:\"Faible\", mod:\"Modérée\", high:\"Forte\", vhigh:\"Très forte\"},\n      lens:{median:\"Médiane\", quart:\"Quartiles\", decile:\"Déciles\", cent:\"Centiles\"},\n      reset:\"↺ Revenir au scénario par défaut\",\n      k_gini:\"Coefficient de Gini\", k_b50:\"Part des 50 % les plus pauvres\", k_top10:\"Part des 10 % les plus riches\",\n      k_top1:\"Part du 1 % le plus riche\", k_ratio:\"Ratio top 10 % / 50 % pauvres\",\n      axis_x:\"part cumulée de la population\", axis_y:\"part cumulée du revenu\",\n      equal_lab:\"égalité parfaite\",\n      lg_curve:\"courbe de Lorenz\", lg_equal:\"égalité parfaite\", lg_area:\"aire (Gini)\",\n      model_note:\"Modèle : distribution log-normale (illustratif — non basé sur des données réelles). Données réelles en partie II.\",\n      lenscap:{\n        median:\"<b>Médiane<\/b> (K = 2) — les <b>50 % les plus pauvres<\/b> détiennent <b>{b50}<\/b> du revenu total.\",\n        quart:\"<b>Quartiles<\/b> (K = 4) — les <b>25 % les plus pauvres<\/b> détiennent <b>{q1}<\/b> ; les <b>25 % les plus riches<\/b>, <b>{q4}<\/b>.\",\n        decile:\"<b>Déciles<\/b> (K = 10) — le <b>dernier décile<\/b> (10 % les plus riches) capte <b>{top10}<\/b> du revenu.\",\n        cent:\"<b>Centiles<\/b> (K = 100) — le <b>centile supérieur<\/b> (1 % le plus riche) capte <b>{top1}<\/b> du revenu total.\"\n      },\n      insight_eq:\"<b>Égalité parfaite<\/b> : la courbe de Lorenz épouse la diagonale, le Gini vaut 0 — chaque part de la population détient une part égale du revenu. Augmentez la concentration pour la faire fléchir.\",\n      insight_tpl:\"Gini = <b>{gini}<\/b>. Les <b>50 % les plus pauvres<\/b> se partagent <b>{b50}<\/b> du revenu, tandis que les <b>10 % les plus riches<\/b> en captent <b>{top10}<\/b> — et le <b>1 % le plus riche<\/b>, <b>{top1}<\/b>. Plus la courbe s'éloigne de la diagonale, plus l'inégalité est forte.\",\n      ex_title:\"Lire la courbe de Lorenz\",\n      ex_p1:\"Un <b>quantile<\/b> est un seuil qui découpe la population, classée par revenu croissant, en <i>K<\/i> parts égales : la <b>médiane<\/b> (K = 2) la partage en deux, les <b>quartiles<\/b> (K = 4) en quatre, les <b>déciles<\/b> (K = 10) en dix, les <b>centiles<\/b> (K = 100) en cent. La loupe ci-contre lit la courbe à chacune de ces échelles.\",\n      ex_p2:\"La <b>courbe de Lorenz<\/b> porte, pour chaque part cumulée de la population (des plus pauvres aux plus riches), la part cumulée du revenu qu'elle détient. La <b>diagonale<\/b> représente l'égalité parfaite — les 20 % les plus pauvres détiennent 20 % du revenu, et ainsi de suite. Plus la courbe s'en <b>éloigne<\/b> vers le bas, plus une minorité concentre le revenu.\",\n      ex_p3:\"Le <b>coefficient de Gini<\/b> résume cet écart : c'est le double de l'aire comprise entre la diagonale et la courbe. Il vaut <b>0<\/b> à l'égalité parfaite et tend vers <b>1<\/b> quand une seule personne détient tout. Les indicateurs lus ici — part des 50 % les plus pauvres, des 10 % et du 1 % les plus riches — sont exactement ceux que l'on suivra sur <b>données réelles<\/b> dans la partie suivante.\",\n      gini_def:\"<b>A<\/b> : aire entre la diagonale et la courbe · <b>B<\/b> : aire sous la courbe · comme <b>A + B = ½<\/b> (le triangle sous la diagonale), on a <b>G = 2A<\/b>.\",\n      sg_title:\"Même Gini, courbes de Lorenz différentes\",sg_sub:\"Le Gini est <b>l'aire A entre la diagonale et la courbe<\/b>. Mais deux distributions très différentes peuvent avoir <b>exactement le même Gini<\/b> : voici deux courbes de même Gini qui se croisent.\",sg_g:\"Coefficient de Gini (identique pour les deux courbes)\",sg_cA:\"A — sommet plus riche\",sg_cB:\"B — base plus pauvre\",sg_b50:\"50 % les plus pauvres\",sg_t10:\"10 % les plus riches\",sg_note:\"Deux modèles théoriques de même Gini : distribution log-normale (A) et distribution en puissance (B). Le Gini résume l'inégalité en un seul nombre, mais ne dit rien de sa forme — l'une concentre davantage au sommet, l'autre appauvrit la base.\"\n    },\n    en:{\n      eyebrow:\"Ecological macroeconomics · Statistical fundamentals\",\n      title:\"Quantiles &amp; the Lorenz curve\",\n      sub:\"Rank the population from poorest to richest, then plot, for each cumulative share of the population, the <b>cumulative share of income<\/b> it holds: that is the <b>Lorenz curve<\/b>. The further it falls below the line of equality, the greater the inequality — and the <b>Gini<\/b> coefficient measures that gap. Vary concentration, and read the distribution at any scale you choose.\",\n      ctrl_title:\"Set the distribution\",\n      ineq_label:\"Income concentration\",\n      gini_lab:\"Gini\", presets_lab:\"Scenarios\", lens_lab:\"Quantile lens\",\n      presets:{eq:\"Perfect equality\", low:\"Low\", mod:\"Moderate\", high:\"High\", vhigh:\"Very high\"},\n      lens:{median:\"Median\", quart:\"Quartiles\", decile:\"Deciles\", cent:\"Percentiles\"},\n      reset:\"↺ Back to the default scenario\",\n      k_gini:\"Gini coefficient\", k_b50:\"Share of poorest 50%\", k_top10:\"Share of richest 10%\",\n      k_top1:\"Share of richest 1%\", k_ratio:\"Top 10% / bottom 50% ratio\",\n      axis_x:\"cumulative share of population\", axis_y:\"cumulative share of income\",\n      equal_lab:\"perfect equality\",\n      lg_curve:\"Lorenz curve\", lg_equal:\"perfect equality\", lg_area:\"area (Gini)\",\n      model_note:\"Model: log-normal distribution (illustrative — not based on real data). Real data in Part II.\",\n      lenscap:{\n        median:\"<b>Median<\/b> (K = 2) — the <b>poorest 50%<\/b> hold <b>{b50}<\/b> of total income.\",\n        quart:\"<b>Quartiles<\/b> (K = 4) — the <b>poorest 25%<\/b> hold <b>{q1}<\/b> ; the <b>richest 25%<\/b>, <b>{q4}<\/b>.\",\n        decile:\"<b>Deciles<\/b> (K = 10) — the <b>top decile<\/b> (richest 10%) captures <b>{top10}<\/b> of income.\",\n        cent:\"<b>Percentiles<\/b> (K = 100) — the <b>top percentile<\/b> (richest 1%) captures <b>{top1}<\/b> of total income.\"\n      },\n      insight_eq:\"<b>Perfect equality<\/b>: the Lorenz curve lies on the diagonal, Gini = 0 — every share of the population holds an equal share of income. Increase concentration to bend it.\",\n      insight_tpl:\"Gini = <b>{gini}<\/b>. The <b>poorest 50%<\/b> share <b>{b50}<\/b> of income, while the <b>richest 10%<\/b> capture <b>{top10}<\/b> — and the <b>richest 1%<\/b>, <b>{top1}<\/b>. The further the curve is from the diagonal, the greater the inequality.\",\n      ex_title:\"Reading the Lorenz curve\",\n      ex_p1:\"A <b>quantile<\/b> is a threshold that splits the population, ranked by increasing income, into <i>K<\/i> equal parts: the <b>median<\/b> (K = 2) splits it in two, <b>quartiles<\/b> (K = 4) in four, <b>deciles<\/b> (K = 10) in ten, <b>percentiles<\/b> (K = 100) in a hundred. The lens reads the curve at each of these scales.\",\n      ex_p2:\"The <b>Lorenz curve<\/b> plots, for each cumulative share of the population (from poorest to richest), the cumulative share of income it holds. The <b>diagonal<\/b> is perfect equality — the poorest 20% hold 20% of income, and so on. The further the curve falls <b>below<\/b> it, the more a minority concentrates income.\",\n      ex_p3:\"The <b>Gini coefficient<\/b> sums up this gap: it is twice the area between the diagonal and the curve. It equals <b>0<\/b> under perfect equality and tends to <b>1<\/b> when a single person holds everything. The indicators read here — share of the poorest 50%, of the richest 10% and 1% — are exactly the ones we will track on <b>real data<\/b> in the next part.\",\n      gini_def:\"<b>A<\/b>: area between the diagonal and the curve · <b>B<\/b>: area under the curve · since <b>A + B = ½<\/b> (the triangle under the diagonal), <b>G = 2A<\/b>.\",\n      sg_title:\"Same Gini, different Lorenz curves\",sg_sub:\"The Gini is <b>the area A between the diagonal and the curve<\/b>. But two very different distributions can share <b>exactly the same Gini<\/b>: here are two equal-Gini curves that cross.\",sg_g:\"Gini coefficient (same for both curves)\",sg_cA:\"A — richer top\",sg_cB:\"B — poorer bottom\",sg_b50:\"poorest 50%\",sg_t10:\"richest 10%\",sg_note:\"Two theoretical models with the same Gini: a log-normal distribution (A) and a power-law distribution (B). The Gini sums up inequality in one number but says nothing about its shape — one concentrates more at the top, the other impoverishes the base.\"\n    }\n  };\n\n  /* ───────── utils ───────── */\n  function nf(){ return LANG==='fr'?'fr-FR':'en-US'; }\n  function pct(x){ return (100*x).toLocaleString(nf(),{maximumFractionDigits:1})+' %'; }\n  function gfmt(g){ return g.toLocaleString(nf(),{minimumFractionDigits:2,maximumFractionDigits:2}); }\n  function rfmt(r){ return r.toLocaleString(nf(),{maximumFractionDigits:1})+' ×'; }\n\n  function compute(){\n    var s=state.sigma;\n    var b50=Lz(0.5,s), top10=1-Lz(0.9,s), top1=1-Lz(0.99,s), q1=Lz(0.25,s), q4=1-Lz(0.75,s), d1=Lz(0.1,s);\n    return {s:s, G:giniOf(s), b50:b50, top10:top10, top1:top1, q1:q1, q4:q4, d1:d1,\n            ratio: b50>0? top10/b50 : Infinity};\n  }\n\n  /* ───────── graphique ───────── */\n  var VB={W:472,H:462,padL:54,padR:18,padT:16,padB:46,S:400};\n  function X(p){ return VB.padL + p*VB.S; }\n  function Yv(v){ return (VB.padT+VB.S) - v*VB.S; }\n\n  function drawChart(c){\n    var d=STR[LANG], s=c.s, g='';\n    var x0=VB.padL, y0=VB.padT+VB.S, x1=VB.padL+VB.S, y1=VB.padT;\n\n    // aire de Gini (entre diagonale et courbe)\n    var area='M '+x0+' '+y0+' L '+x1+' '+y1+' ';\n    for(var p=1.0; p>=-0.0001; p-=0.02){ var pp=Math.max(0,p); area+='L '+X(pp).toFixed(1)+' '+Yv(Lz(pp,s)).toFixed(1)+' '; }\n    area+='Z';\n    g+='<path class=\"gini-area\" d=\"'+area+'\"/>';\n\n    // grille + ticks (0,25,50,75,100)\n    [0,.25,.5,.75,1].forEach(function(t){\n      g+='<line class=\"gridline\" x1=\"'+X(t).toFixed(1)+'\" y1=\"'+y1+'\" x2=\"'+X(t).toFixed(1)+'\" y2=\"'+y0+'\"/>';\n      g+='<line class=\"gridline\" x1=\"'+x0+'\" y1=\"'+Yv(t).toFixed(1)+'\" x2=\"'+x1+'\" y2=\"'+Yv(t).toFixed(1)+'\"/>';\n      g+='<text class=\"axis\" x=\"'+X(t).toFixed(1)+'\" y=\"'+(y0+15)+'\" text-anchor=\"middle\">'+(t*100)+'<\/text>';\n      g+='<text class=\"axis\" x=\"'+(x0-8)+'\" y=\"'+(Yv(t)+3.5).toFixed(1)+'\" text-anchor=\"end\">'+(t*100)+'<\/text>';\n    });\n    g+='<line class=\"axisline\" x1=\"'+x0+'\" y1=\"'+y0+'\" x2=\"'+x1+'\" y2=\"'+y0+'\"/>';\n    g+='<line class=\"axisline\" x1=\"'+x0+'\" y1=\"'+y1+'\" x2=\"'+x0+'\" y2=\"'+y0+'\"/>';\n    g+='<text class=\"axis-title\" x=\"'+((x0+x1)/2).toFixed(1)+'\" y=\"'+(y0+34)+'\" text-anchor=\"middle\">'+d.axis_x+'<\/text>';\n    g+='<text class=\"axis-title\" transform=\"rotate(-90 14 '+((y0+y1)/2).toFixed(1)+')\" x=\"14\" y=\"'+((y0+y1)/2).toFixed(1)+'\" text-anchor=\"middle\">'+d.axis_y+'<\/text>';\n\n    // diagonale d'égalité\n    g+='<line class=\"equal-line\" x1=\"'+x0+'\" y1=\"'+y0+'\" x2=\"'+x1+'\" y2=\"'+y1+'\"/>';\n    g+='<text class=\"equal-lab\" transform=\"rotate(-45 '+X(.5).toFixed(1)+' '+Yv(.5).toFixed(1)+')\" x=\"'+X(.5).toFixed(1)+'\" y=\"'+(Yv(.5)-6).toFixed(1)+'\" text-anchor=\"middle\">'+d.equal_lab+'<\/text>';\n\n    // libellés des aires A (Gini) et B (sous la courbe) — reliés à la formule G = A/(A+B) = 2A\n    if(s>0.03){\n      var ax=X(0.40), ay=(Yv(0.40)+Yv(Lz(0.40,s)))/2;\n      var bx=X(0.70), by=Yv(Lz(0.70,s)*0.42);\n      g+='<text class=\"arealab\" x=\"'+ax.toFixed(1)+'\" y=\"'+ay.toFixed(1)+'\" text-anchor=\"middle\">A<\/text>';\n      g+='<text class=\"arealab\" x=\"'+bx.toFixed(1)+'\" y=\"'+by.toFixed(1)+'\" text-anchor=\"middle\">B<\/text>';\n    }\n\n    // marqueurs de la loupe\n    function tag(x,y,anchor,txt,cls){\n      var w=txt.length*6.2+12, rx=anchor==='end'?x-w+5:x-5;\n      return '<rect class=\"tagbg\" x=\"'+rx.toFixed(1)+'\" y=\"'+(y-12).toFixed(1)+'\" width=\"'+w.toFixed(1)+'\" height=\"16\" rx=\"4\"/>'+\n             '<text class=\"'+cls+'\" x=\"'+x.toFixed(1)+'\" y=\"'+y.toFixed(1)+'\" text-anchor=\"'+anchor+'\">'+txt+'<\/text>';\n    }\n    function cutAt(p){ var xv=X(p), yv=Yv(Lz(p,s));\n      g+='<line class=\"cut\" x1=\"'+xv.toFixed(1)+'\" y1=\"'+y0+'\" x2=\"'+xv.toFixed(1)+'\" y2=\"'+yv.toFixed(1)+'\"/>';\n      g+='<circle class=\"cutdot\" cx=\"'+xv.toFixed(1)+'\" cy=\"'+yv.toFixed(1)+'\" r=\"2.6\"/>';\n    }\n    function readTo(p,label){ var xv=X(p), yv=Yv(Lz(p,s));\n      g+='<line class=\"readline\" x1=\"'+x0+'\" y1=\"'+yv.toFixed(1)+'\" x2=\"'+xv.toFixed(1)+'\" y2=\"'+yv.toFixed(1)+'\"/>';\n      g+=tag(xv+6, yv-6, 'start', label, 'readlab');\n    }\n    function topSegment(p0){ // segment de la courbe de p0 à 1, mis en avant\n      var seg='M '+X(p0).toFixed(1)+' '+Yv(Lz(p0,s)).toFixed(1);\n      for(var p=p0; p<=1.0001; p+=0.004){ var pp=Math.min(1,p); seg+=' L '+X(pp).toFixed(1)+' '+Yv(Lz(pp,s)).toFixed(1); }\n      g+='<rect class=\"topstrip\" x=\"'+X(p0).toFixed(1)+'\" y=\"'+y1+'\" width=\"'+(x1-X(p0)).toFixed(1)+'\" height=\"'+(y0-y1)+'\"/>';\n      g+='<path class=\"topseg\" d=\"'+seg+'\"/>';\n    }\n\n    if(state.lens==='median'){ cutAt(.5); readTo(.5, pct(Lz(.5,s))); }\n    else if(state.lens==='quart'){ [.25,.5,.75].forEach(cutAt); readTo(.25, pct(Lz(.25,s))); }\n    else if(state.lens==='decile'){ for(var k=1;k<=9;k++) cutAt(k/10); topSegment dEventListener('click',function(){ state.sigma=DEFAULT.sigma; state.lens=DEFAULT.lens; syncInputs(); buildLens(); render(); markPreset(); });\n\n  /* ───────── langue / thème ───────── */\n  function Lb(p,G){ return Math.pow(p,(1+G)/(1-G)); }\n  var SGV=0.40;\n  function drawSameGini(){\n    var G=SGV, sig=sigmaForG(G), Wc=300,pad=34,S=Wc-pad-10;\n    function X(p){return pad+p*S;} function Y(v){return (pad+S)-v*S;}\n    var g='';[0,.25,.5,.75,1].forEach(function(t){g+='<line class=\"sg-grid\" x1=\"'+X(t).toFixed(1)+'\" y1=\"'+Y(0).toFixed(1)+'\" x2=\"'+X(t).toFixed(1)+'\" y2=\"'+Y(1).toFixed(1)+'\"/><line class=\"sg-grid\" x1=\"'+X(0).toFixed(1)+'\" y1=\"'+Y(t).toFixed(1)+'\" x2=\"'+X(1).toFixed(1)+'\" y2=\"'+Y(t).toFixed(1)+'\"/>';});\n    g+='<line class=\"sg-ax\" x1=\"'+X(0)+'\" y1=\"'+Y(0)+'\" x2=\"'+X(1)+'\" y2=\"'+Y(0)+'\"/><line class=\"sg-ax\" x1=\"'+X(0)+'\" y1=\"'+Y(1)+'\" x2=\"'+X(0)+'\" y2=\"'+Y(0)+'\"/>';\n    g+='<line class=\"sg-diag\" x1=\"'+X(0)+'\" y1=\"'+Y(0)+'\" x2=\"'+X(1)+'\" y2=\"'+Y(1)+'\"/>';\n    function pth(fn,cls){var d='M '+X(0)+' '+Y(0);for(var i=1;i<=50;i++){var p=i/50;d+=' L '+X(p).toFixed(1)+' '+Y(fn(p)).toFixed(1);}return '<path class=\"'+cls+'\" d=\"'+d+'\"/>';}\n    g+=pth(function(p){return Lz(p,sig);},'sg-A')+pth(function(p){return Lb(p,G);},'sg-B');\n    document.getElementById('sglz').innerHTML=g;\n    var d=STR[LANG],loc=(LANG==='fr'?'fr-FR':'en-US');\n    function pc(x){return (100*x).toLocaleString(loc,{maximumFractionDigits:1})+' %';}\n    var gf=G.toLocaleString(loc,{minimumFractionDigits:2,maximumFractionDigits:2});\n    var aB=Lz(0.5,sig),aT=1-Lz(0.9,sig),bB=Lb(0.5,G),bT=1-Lb(0.9,G);\n    document.getElementById('sgrow').innerHTML=\n      '<div class=\"sg-card\" style=\"border-left:3px solid #2A78D6\"><h4 style=\"color:#2A78D6\">'+d.sg_cA+'<\/h4><div class=\"r\"><span>Gini<\/span><b>'+gf+'<\/b><\/div><div class=\"r\"><span>'+d.sg_b50+'<\/span><b>'+pc(aB)+'<\/b><\/div><div class=\"r\"><span>'+d.sg_t10+'<\/span><b>'+pc( w(svgId, series, opt){\n    var svg=document.getElementById(svgId);var W=VB.W,H=VB.H,pL=VB.padL,pR=VB.padR,pT=VB.padT,pB=VB.padB;\n    var xs=[],ys=[]; series.forEach(function(s){s.pts.forEach(function(p){xs.push(p[0]);ys.push(p[1]);});});\n    if(!xs.length){svg.innerHTML=''; return null;}\n    var xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs),ymaxRaw=Math.max.apply(null,ys),ymin,ymax,logy=!!opt.log;\n    if(logy){var pos=ys.filter(function(v){return v>0;});var yminRaw=Math.min.apply(null,pos);ymin=Math.pow(10,Math.floor(Math.log10(yminRaw)));ymax=Math.pow(10,Math.ceil(Math.log10(ymaxRaw)));}\n    else {ymin=(opt.ymin!=null?opt.ymin:0);ymax=(opt.ymax!=null?opt.ymax:niceCeil(ymaxRaw));}\n    function X(v){return pL+(xmax===xmin?0:(v-xmin)/(xmax-xmin))*(W-pL-pR);}\n    function Y(v){if(logy){var lo=Math.log10(ymin),hi=Math.log10(ymax);return (H-pB)-(Math.log10(Math.max(v,ymin))-lo)/(hi-lo)*(H-pT-pB);}return (H-pB)-(v-ymin)/(ymax-ymin)*(H-pT-pB);}\n    var g='',yticks=[];\n    if(logy){for(var e=Math.log10(ymin);e<=Math.log10(ymax)+1e-9;e++)yticks.push(Math.pow(10,e));}else{var step=(ymax-ymin)/5;for(var i=0;i<=5;i++)yticks.push(ymin+step*i);}\n    yticks.forEach(function(t){var yy=Y(t);g+='<line class=\"grid\" x1=\"'+pL+'\" y1=\"'+yy.toFixed(1)+'\" x2=\"'+(W-pR)+'\" y2=\"'+yy.toFixed(1)+'\"/>';g+='<text class=\"ax\" x=\"'+(pL-7)+'\" y=\"'+(yy+3.5).toFixed(1)+'\" text-anchor=\"end\">'+opt.yfmt(t)+'<\/text>';});\n    var span=xmax-xmin,stepx=span<=12?2:span<=40?10:span<=120?20:40,x0=Math.ceil(xmin/stepx)*stepx;\n    for(var xt=x0;xt<=xmax;xt+=stepx){var xx=X(xt);g+='<line class=\"grid\" x1=\"'+xx.toFixed(1)+'\" y1=\"'+pT+'\" x2=\"'+xx.toFixed(1)+'\" y2=\"'+(H-pB)+'\"/>';g+='<text class=\"ax\" x=\"'+xx.toFixed(1)+'\" y=\"'+(H-pB+15)+'\" text-anchor=\"middle\">'+xt+'<\/text>';}\n    g+='<line class=\"axl\" x1=\"'+pL+'\" y1=\"'+(H-pB)+'\" x2=\"'+(W-pR)+'\" y2=\"'+(H-pB)+'\"/>';g+='<line class=\"axl\" x1=\"'+pL+'\" y1=\"'+pT+'\" x2=\"'+pL+'\" y2=\"'+(H-pB)+'\"/>';\n    g+='<text class=\"axt\" transform=\"rotate(-90 13 '+((pT+H-pB)/2).toFixed(1)+')\" x=\"13\" y=\"'+((pT+H-pB)/2).toFixed(1)+'\" text-anchor=\"middle\">'+opt.ylab+'<\/text>';\n    series.forEach(function(s){if(!s.pts.length)return;var d='M '+X(s.pts[0][0]).toFixed(1)+' '+Y(s.pts[0][1]).toFixed(1);for(var k=1;k<s.pts.length;k++)d+=' L '+X(s.pts[k][0]).toFixed(1)+' '+Y(s.pts[k][1]).toFixed(1);g+='<path class=\"ln\" d=\"'+d+'\" stroke=\"'+s.color+'\"'+(s.dash?' stroke-dasharray=\"6 4\"':'')+'/>';});\n    svg.innerHTML=g;return {X:X,Y:Y,xmin:xmin,xmax:xmax,pL:pL,pR:pR,pT:pT,pB:pB,W:W,H:H,series:series};\n  }\n  function wireHover(svgId,tipId,sc,fmt,xlabel){\n    var svg=document.getElementById(svgId),tip=document.getElementById(tipId);\n    if(!sc){tip.classList.remove('on');svg.onpointermove=null;return;}\n    function clearG(){var gl=document.getElementById(svgId+'-g');if(gl)gl.innerHTML='';}\n    svg.onpointermove=function(e){var r=svg.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*sc.W;\n      if(mx<sc.pL||mx>sc.W-sc.pR){tip.classList.remove('on');clearG();return;}\n      var xv=sc.xmin+(mx-sc.pL)/(sc.W-sc.pL-sc.pR)*(sc.xmax-sc.xmin),year=Math.round(xv),rows='',gx=null,dots='',tol=Math.max(2,(sc.xmax-sc.xmin)*0.03);\n      sc.series.forEach(function(s){var best=null,bd=1e9;s.pts.forEach(function(p){var dd=Math.abs(p[0]-year);if(dd<bd){bd=dd;best=p;}});\n        if(best&&bd<=tol){gx=sc.X(best[0]);dots+='<circle class=\"gdot\" cx=\"'+sc.X(best[0]).toFixed(1)+'\" cy=\"'+sc.Y(best[1]).toFixed(1)+'\" r=\"3.5\" fill=\"'+s.color+'\"/>';\n          rows+='<div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:'+s.color+'\">\\u25CF<\/span><span style=\"flex:1\">'+s.label+'<\/span><b>'+fmt(best[1])+'<\/b><\/div>';}});\n      var gl=document.getElementById(svgId+'-g');\n      if(gx!=null){var guide='<line class=\"gd\" x1=\"'+gx.toFixed(1)+'\" y1=\"'+sc.pT+'\" x2=\"'+gx.toFixed(1)+'\" y2=\"'+(sc.H-sc.pB)+'\"/>'+dots;if(!gl){gl=document.createElementNS('http://www.w3.org/2000/svg','g');gl.setAttribute('id',svgId+'-g');svg.appendChild(gl);}gl.innerHTML=guide;}else clearG();\n      tip.innerHTML='<b>'+(xlabel?xlabel(year):year)+'<\/b>'+rows;var x=e.clientX-r.left+14,ty=e.clientY-r.top+14;if(x>r.width-150)x=e.clientX-r.left-tip.offsetWidth-14;tip.style.left=x+'px';tip.style.top=ty+'px';tip.classList.add('on');};\n    svg.onpointerleave=function(){tip.classList.remove('on');clearG();};\n  }\n  function nf(){return LANG==='fr'?'fr-FR':'en-US';}\n\n  var BETW=JSON.parse(document.getElementById('betw').textContent);\n  var ELE=[[5,15],[10,32],[15,46],[20,56],[25,63],[30,67],[35,70],[40,73],[45,75],[50,76],[55,75],[60,69],[65,60],[70,48],[75,36],[80,25],[85,14],[90,4],[95,20],[99,54],[100,64]];\n  var T={fr:{eyebrow:\"In\\u00e9galit\\u00e9s mondiales \\u00b7 Milanovi\\u0107\",title:\"La courbe de l'\\u00e9l\\u00e9phant\",sub:\"Branko Milanovi\\u0107 et Christoph Lakner : qui a gagn\\u00e9 et qui a perdu \\u00e0 la mondialisation ? Et faut-il distinguer les in\\u00e9galit\\u00e9s <i>dans<\/i> les pays de celles <i>entre<\/i> pays ?\",\n    f_title:\"La courbe de l'\\u00e9l\\u00e9phant (Lakner-Milanovi\\u0107)\",f_sub:\"Croissance r\\u00e9elle cumul\\u00e9e du revenu, 1988-2008, par centile de la distribution <b>mondiale<\/b> des revenus (des plus pauvres \\u00e0 gauche aux plus riches \\u00e0 droite).\",f_y:\"croissance r\\u00e9elle 1988-2008 (%)\",f_x:\"centile de la distribution mondiale des revenus\",f_leg:\"croissance\",f_a1:\"Classes moyennes d'Asie\",f_a2:\"Classes moyennes des pays riches\",f_a3:\"1 % mondial\",\n    f_note:\"Reproduction de la courbe de Lakner & Milanovi\\u0107 (2016), \\u00ab Global Income Distribution \\u00bb (Banque mondiale) : croissance r\\u00e9elle du revenu par centile de la distribution mondiale, 1988-2008 (PPA).\",\n    f_points:\"<div class='kp'><span class='mk' style='background:#16A34A'><\/span><span><b>La bosse \\u2014 les gagnants d'Asie.<\/b> Les classes moyennes \\u00e9mergentes (Chine, Inde) captent la plus forte croissance : la mondialisation a r\\u00e9duit l'in\\u00e9galit\\u00e9 <i>entre<\/i> pays.<\/span><\/div><div class='kp'><span class='mk' style='background:#64748B'><\/span><span><b>Le creux \\u2014 les classes moyennes des pays riches.<\/b> Leurs revenus stagnent ; ce d\\u00e9classement nourrit la contestation de la mondialisation.<\/span><\/div><div class='kp'><span class='mk' style='background:#DC2626'><\/span><span><b>La trompe \\u2014 le 1 % mondial.<\/b> Il capte une part d\\u00e9mesur\\u00e9e de la croissance (environ deux fois celle des 50 % les plus pauvres) : l'in\\u00e9galit\\u00e9 augmente <i>au sein<\/i> des pays.<\/span><\/div>\",\n    g_title:\"In\\u00e9galit\\u00e9s dans les pays vs entre les pays\",g_sub:\"L'inégalité mondiale peut se résumer par un seul nombre, l'<b>indice de Theil<\/b>. Contrairement au coefficient de Gini, il se <b>décompose exactement<\/b> en une part <b>entre pays<\/b> et une part <b>dans les pays<\/b>. Depuis Bourguignon-Morrisson (2002) et Morrisson-Murtin (2011), on suit ce partage sur deux siècles.\",i_cap:\"L'inégalité mondiale totale, mesurée par l'indice de Theil\",i_y:\"indice de Theil (inégalité totale)\",i_leg:\"Theil total\",h_cap:\"Sa décomposition : écarts entre pays vs inégalités dans les pays (1820-2020)\",h_y:\"part des in\\u00e9galit\\u00e9s mondiales (%)\",h_bet:\"entre pays\",h_wit:\"dans les pays\",g_cap:\"In\\u00e9galit\\u00e9 entre pays \\u2014 indice de Theil (calcul direct, Maddison)\",g_y:\"in\\u00e9galit\\u00e9 entre pays (indice de Theil)\",g_leg:\"entre pays (Theil)\",\n    g_note:\"Indice de Theil total et décomposition entre/dans les pays : estimations de référence de Morrisson & Murtin (2011), « Internal Income Inequality and Global Inequality » (FERDI), et Bourguignon & Morrisson (2002), actualisées par le Rapport sur les inégalités mondiales (WID, 2022). Dernier graphique : inégalité entre pays calculée directement (Theil-T du PIB/hab. pondéré population, Maddison 2020, ~175 pays).\",\n    g_points:\"<div class='kp'><span class='mk' style='background:#DC2626'><\/span><span><b>Entre pays : d\\u00e9sormais en baisse.<\/b> Apr\\u00e8s un pic vers 1968-2000, les \\u00e9carts de revenu moyen <i>entre<\/i> pays se r\\u00e9duisent nettement \\u2014 rattrapage de la Chine puis de l'Inde.<\/span><\/div><div class='kp'><span class='mk' style='background:#7C3AED'><\/span><span><b>Dans les pays : en hausse.<\/b> L'in\\u00e9galit\\u00e9 <i>au sein<\/i> des pays augmente presque partout depuis 1980 (voir la courbe du top 1 % dans l'outil WID).<\/span><\/div><div class='kp'><span class='mk' style='background:#16A34A'><\/span><span><b>Le renversement.<\/b> La part des in\\u00e9galit\\u00e9s mondiales due aux \\u00e9carts entre pays est pass\\u00e9e de <b>~55 % en 1980 \\u00e0 ~30 % en 2020<\/b> : la composante <i>intra-pays<\/i> est devenue majoritaire vers l'an 2000 (WID, Rapport 2022).<\/span><\/div><div class='kp'><span class='mk' style='background:#A9791B'><\/span><span><b>Au total.<\/b> L'in\\u00e9galit\\u00e9 mondiale <i>globale<\/i> a l\\u00e9g\\u00e8rement recul\\u00e9 : la baisse entre pays l'emporte (pour l'instant) sur la hausse dans les pays.<\/span><\/div>\"},\n   en:{eyebrow:\"Global inequality \\u00b7 Milanovi\\u0107\",title:\"The elephant curve\",sub:\"Branko Milanovi\\u0107 and Christoph Lakner: who won and who lost from globalisation? And should we separate inequality <i>within<\/i> countries from inequality <i>between<\/i> countries?\",\n    f_title:\"The elephant curve (Lakner-Milanovi\\u0107)\",f_sub:\"Cumulative real income growth, 1988-2008, by percentile of the <b>global<\/b> income distribution (poorest left, richest right).\",f_y:\"real growth 1988-2008 (%)\",f_x:\"percentile of the global income distribution\",f_leg:\"growth\",f_a1:\"Emerging Asian middle class\",f_a2:\"Rich countries' middle class\",f_a3:\"Global top 1%\",\n    f_note:\"Reproduction of the Lakner & Milanovi\\u0107 (2016) curve, 'Global Income Distribution' (World Bank): real income growth by percentile of the global distribution, 1988-2008 (PPP).\",\n    f_points:\"<div class='kp'><span class='mk' style='background:#16A34A'><\/span><span><b>The hump \\u2014 Asia's winners.<\/b> Emerging middle classes (China, India) capture the fastest growth: globalisation reduced inequality <i>between<\/i> countries.<\/span><\/div><div class='kp'><span class='mk' style='background:#64748B'><\/span><span><b>The dip \\u2014 rich countries' middle class.<\/b> Their incomes stagnate; this fuels the backlash against globalisation.<\/span><\/div><div class='kp'><span class='mk' style='background:#DC2626'><\/span><span><b>The trunk \\u2014 the global top 1%.<\/b> It captures a disproportionate share of growth (about twice that of the poorest 50%): inequality rises <i>within<\/i> countries.<\/span><\/div>\",\n    g_title:\"Inequality within vs between countries\",g_sub:\"Global inequality can be summed up in a single number, the <b>Theil index<\/b>. Unlike the Gini coefficient, it <b>decomposes exactly<\/b> into a <b>between-country<\/b> part and a <b>within-country<\/b> part. Since Bourguignon-Morrisson (2002) and Morrisson-Murtin (2011), this split has been tracked over two centuries.\",i_cap:\"Total global inequality, measured by the Theil index\",i_y:\"Theil index (total inequality)\",i_leg:\"total Theil\",h_cap:\"Its decomposition: between-country gaps vs within-country inequality (1820-2020)\",h_y:\"share of global inequality (%)\",h_bet:\"between countries\",h_wit:\"within countries\",g_cap:\"Between-country inequality \\u2014 Theil index (direct computation, Maddison)\",g_y:\"between-country inequality (Theil index)\",g_leg:\"between countries (Theil)\",\n    g_note:\"Total Theil index and between/within decomposition: benchmark estimates from Morrisson & Murtin (2011), 'Internal Income Inequality and Global Inequality' (FERDI), and Bourguignon & Morrisson (2002), updated by the World Inequality Report (WID, 2022). Last chart: between-country inequality computed directly (population-weighted Theil-T of GDP per capita, Maddison 2020, ~175 countries).\",\n    g_points:\"<div class='kp'><span class='mk' style='background:#DC2626'><\/span><span><b>Between countries: now falling.<\/b> After a peak around 1968-2000, gaps in mean income <i>between<\/i> countries shrink markedly \\u2014 China's then India's catch-up.<\/span><\/div><div class='kp'><span class='mk' style='background:#7C3AED'><\/span><span><b>Within countries: rising.<\/b> Inequality <i>within<\/i> countries rises almost everywhere since 1980 (see the top-1% curve in the WID tool).<\/span><\/div><div class='kp'><span class='mk' style='background:#16A34A'><\/span><span><b>The reversal.<\/b> The share of global inequality due to between-country gaps fell from <b>~55% in 1980 to ~30% in 2020<\/b>: the <i>within-country<\/i> component became the majority around 2000 (WID, 2022 Report).<\/span><\/div><div class='kp'><span class='mk' style='background:#A9791B'><\/span><span><b>Overall.<\/b> <i>Total<\/i> global inequality edged down: the fall between countries outweighs (for now) the rise within countries.<\/span><\/div>\"}};\n  function renderF(){var d=T[LANG];var sc=draw('fchart',[{name:'e',label:d.f_leg,color:'#7C3AED',pts:ELE}],{log:false,ylab:d.f_y,yfmt:function(v){return Math.round(v);}});wireHover('fchart','ftip',sc,function(v){return Math.round(v)+' %';});if(!sc)return;var svg=document.getElementById('fchart');function an(px,py,a,t){return '<text x=\"'+sc.X(px).toFixed(1)+'\" y=\"'+sc.Y(py).toFixed(1)+'\" text-anchor=\"'+a+'\" style=\"font-family:var(--font-d);font-style:italic;font-size:11.5px;fill:var(--muted)\">'+t+'<\/text>';}svg.insertAdjacentHTML('beforeend',an(50,82,'middle',d.f_a1)+an(76,31,'middle',d.f_a2)+an(95,70,'end',d.f_a3)+'<text x=\"'+((sc.pL+sc.W-sc.pR)/2).toFixed(1)+'\" y=\"'+(sc.H-4)+'\" text-anchor=\"middle\" style=\"font-family:var(--font-m);font-size:10.5px;fill:var(--faint)\">'+d.f_x+'<\/text>');}\n  var TOTAL=[[1820,0.40],[1870,0.50],[1910,0.60],[1950,0.72],[1980,0.78],[2000,0.80],[2020,0.76]];\n  function renderI(){var d=T[LANG];var sc=draw('ichart',[{name:'t',label:d.i_leg,color:'#334155',pts:TOTAL}],{log:false,ymin:0,ymax:1,ylab:d.i_y,yfmt:function(v){return v.toLocaleString(nf(),{minimumFractionDigits:1,maximumFractionDigits:1});}});wireHover('ichart','itip',sc,function(v){return v.toLocaleString(nf(),{maximumFractionDigits:2});});}\n  var SHB=[[1820,12],[1870,22],[1910,37],[1950,53],[1980,57],[2000,50],[2020,32]];\n  function renderH(){var d=T[LANG];var wit=SHB.map(function(p){return [p[0],100-p[1]];});var sc=draw('hchart',[{name:'b',label:d.h_bet,color:'#DC2626',pts:SHB},{name:'w',label:d.h_wit,color:'#7C3AED',pts:wit}],{log:false,ymin:0,ymax:100,ylab:d.h_y,yfmt:function(v){return Math.round(v);}});wireHover('hchart','htip',sc,function(v){return Math.round(v)+' %';});if(!sc)return;var svg=document.getElementById('hchart');function lb(x,y,a,t,c){return '<text x=\"'+sc.X(x).toFixed(1)+'\" y=\"'+sc.Y(y).toFixed(1)+'\" text-anchor=\"'+a+'\" style=\"font-family:var(--font-d);font-style:italic;font-size:11.5px;fill:'+c+'\">'+t+'<\/text>';}svg.insertAdjacentHTML('beforeend', lb(2015,25,'end',d.h_bet,'#DC2626')+lb(2015,74,'end',d.h_wit,'#7C3AED'));}\n  function renderG(){var d=T[LANG];var sc=draw('gchart',[{name:'b',label:d.g_leg,color:'#DC2626',pts:BETW}],{log:false,ylab:d.g_y,yfmt:function(v){return v.toLocaleString(nf(),{maximumFractionDigits:2});}});wireHover('gchart','gtip',sc,function(v){return v.toLocaleString(nf(),{maximumFractionDigits:3});});}\n  function renderAll(){renderF();renderI();renderH();renderG();}\n  function applyLang(){var d=T[LANG];document.documentElement.lang=LANG;document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');if(d[k]!=null)el.innerHTML=d[k];});document.getElementById('langlbl').textContent=LANG.toUpperCase();document.title=d.title;renderAll();}\n  function onTheme(){renderAll();}\n\n\n  document.getElementById('lang').addEventListener('click',function(){ LANG=LANG==='fr'?'en':'fr'; try{localStorage.setItem('ele_lang',LANG);}catch(e){} applyLang(); });\n  document.getElementById('theme').addEventListener('click',function(){ var n=effTheme()==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); try{localStorage.setItem('ele_theme',n);}catch(e){} if(typeof onTheme==='function')onTheme(); });\n\napplyLang();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "voile-ignorance.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Le voile d'ignorance et le maximin<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;--ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n    --accent:#4F46E5;\n    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);\n    --font-d:\"Spectral\",\"IBM Plex Sans\",Georgia,serif;--font-b:\"IBM Plex Sans\",system-ui,sans-serif;--font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n  }\n  :root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;--ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --accent:#8B84F0;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }}\n  :root[data-theme=\"dark\"]{\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;--ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --accent:#8B84F0;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}\n  .wrap{max-width:900px;margin:0 auto;padding-block:26px 46px;padding-inline:20px;}\n  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}\n  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500;margin:0 0 6px;}\n  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.7vw,42px);line-height:1.03;margin:0;letter-spacing:-.015em;text-wrap:balance;}\n  .sub{color:var(--muted);font-size:15px;margin:9px 0 0;max-width:76ch;text-wrap:pretty;} .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}\n  .toggles{display:flex;gap:8px;flex-shrink:0;}\n  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}\n  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}\n  .tg:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 19px;margin-top:16px;}\n  .card h2{font-family:var(--font-d);font-weight:600;font-size:20px;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance;}\n  .card .expl{color:var(--muted);font-size:14px;margin:0 0 10px;max-width:82ch;text-wrap:pretty;} .card .expl:last-child{margin-bottom:0; or:#C0392B;white-space:nowrap;}\n  .world .lab{display:flex;justify-content:space-between;align-items:center;gap:10px;}\n  .world .lab .name2{font-size:12px;color:var(--muted);} .world .lab .val2{font-family:var(--font-m);font-size:12px;color:var(--accent);}\n  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:var(--grid);outline:none;} input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer;} input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:pointer;}\n  .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;} @media(max-width:620px){.rules{grid-template-columns:1fr;}}\n  .rule{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--panel);}\n  .rule.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));}\n  .rule h3{margin:0 0 5px;font-family:var(--font-m);font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);} .rule.on h3{color:var(--accent);}\n  .rule .pick{font-family:var(--font-d);font-weight:600;font-size:16px;color:var(--ink);margin:0 0 3px;line-height:1.15;}\n  .rule .why{font-size:12px;color:var(--muted);margin:0;text-wrap:pretty;}\n  .footnote{font-size:13px;color:var(--muted);margin-top:16px;text-wrap:pretty;} .footnote b{color:var(--ink);font-weight:600;}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <div><p class=\"eyebrow\" data-t=\"eyebrow\"><\/p><h1 data-t=\"title\"><\/h1><p class=\"sub\" data-t=\"sub\"><\/p><\/div>\n    <div class=\"toggles\"><button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button><button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button><\/div>\n  <\/header>\n\n  <section class=\"card\">\n    <h2 data-t=\"v_title\"><\/h2>\n    <p class=\"expl\" data-t=\"v_1\"><\/p>\n    <p class=\"expl\" data-t=\"v_2\"><\/p>\n    <p class=\"expl\" data-t=\"cond_intro\" style=\"margin-bottom:4px;\"><\/p>\n    <div class=\"principles\">\n      <div class=\"p\"><span class=\"n\">1<\/span><span data-t=\"cond_1\"><\/span><\/div>\n      <div class=\"p\"><span class=\"n\">2<\/span><span data-t=\"cond_2\"><\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <h2 data-t=\"m_title\"><\/h2>\n    <p class=\"expl\" data-t=\"m_1\"><\/p>\n    <p class=\"expl\" data-t=\"m_2\"><\/p>\n    <div class=\"callout\"><p class=\"lbl\" data-t=\"m_rule_lbl\"><\/p><p data-t=\"m_rule\"><\/p><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <h2 data-t=\"sim_title\"><\/h2>\n    <p class=\"expl\" data-t=\"sim_expl\"><\/p>\n    <div class=\"worlds\" id=\"worlds\"><\/div>\n    <div class=\"rules\" id=\"rules\"><\/div>\n    <p class=\"footnote\" data-t=\"sim_note\"><\/p>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  try{var st=localStorage.getItem('rawls_theme'); if(st) document.documentElement.setAttribute('data-theme',st);}catch(e){}\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme'); if(a) return a; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}\n  var LANG='fr'; try{var sl=localStorage.getItem('rawls_lang'); if(sl) LANG=sl;}catch(e){}\n  function nf(){return LANG==='fr'?'fr-FR':'en-US';}\n\n  var SCALE=260;\n  var W=[{floor:30,spread:30,col:'#2E8B57'},{floor:20,spread:80,col:'#B8860B'},{floor:10,spread:190,col:'#C0392B'}];\n  function avg(w){return w.floor+w.spread/2;} function ceil(w){return w.floor+w.spread;}\n\n  var T={fr:{\n    eyebrow:\"Macroéconomie écologique · Évaluer les inégalités : Rawls\",\n    title:\"Le voile d'ignorance et le maximin\",\n    sub:\"Comment juger si des inégalités sont <b>justes<\/b> ? John Rawls (1971) propose une méthode : raisonner comme si l'on devait choisir sa société <b>sans savoir quelle place on y occupera<\/b>.\",\n    v_title:\"1 · Le voile d'ignorance\",\n    v_1:\"Rawls part d'une expérience de pensée. Imaginez concevoir les règles d'une société <i>avant<\/i> d'y naître — sans connaître votre futur sexe, vos talents, votre héritage, ni votre place sociale. Vous êtes placé derrière un <b>voile d'ignorance<\/b>.\",\n    v_2:\"Ce voile est un <b>voile d'impartialité<\/b> : en ignorant votre position, vous ne pouvez pas concevoir des règles qui vous avantageraient personnellement. Vous jugez alors les inégalités du point de vue de n'importe qui — y compris du plus défavorisé.\",\n    cond_intro:\"Dans ces conditions, chacun peut conclure que des inégalités ne sont justes <i>que si<\/i> :\",\n    cond_1:\"<b>elles sont attachées à des positions ouvertes à tous<\/b>, dans des conditions d'égalité équitable des chances ;\",\n    cond_2:\"<b>elles bénéficient aux plus défavorisés<\/b> de la société — c'est le <i>principe de différence<\/i>.\",\n    m_title:\"2 · Le critère du maximin\",\n    m_1:\"Derrière le voile, quelle règle de décision adopter ? Puisque vous pourriez naître <b>n'importe où<\/b>, y compris tout en bas, le choix prudent est celui qui rend votre <b>pire situation possible la moins mauvaise<\/b>.\",\n    m_2:\"C'est le <b>maximin<\/b> — contraction de « <b>maxi<\/b>miser le <b>min<\/b>imum ». On compare les sociétés par le sort qu'elles réservent à leurs membres <b>les plus défavorisés<\/b>, et l'on choisit celle dont ce plancher est le plus haut. À l'inverse, l'<b>utilitariste<\/b> maximise le revenu <i>moyen<\/i> (quitte à sacrifier les plus pauvres), et le pari du <b>maximax<\/b> vise le meilleur sort possible (au risque du pire).\",\n    m_rule_lbl:\"La règle de Rawls\",\n    m_rule:\"Une société est d'autant plus juste que ses membres <b>les plus pauvres<\/b> y sont mieux lotis. Rawls ne dit pas <i>quelle<\/i> répartition est juste : il fournit une <b>méthode<\/b> pour la reconnaître.\",\n    sim_title:\"3 · Maximin, moyenne, maximax : trois règles, trois choix\",\n    sim_expl:\"Trois mondes aux inégalités plus ou moins fortes. Réglez le <b>plancher<\/b> (le revenu du plus pauvre) de chacun et observez ce que choisit chaque règle. Le maximin ne regarde qu'une chose : l'extrémité <b>gauche<\/b> de chaque barre.\",\n    wnames:[\"Monde égalitaire\",\"Monde intermédiaire\",\"Monde inégalitaire\"],\n    wdesc:[\"faibles écarts\",\"écarts moyens\",\"forts écarts\"],\n    floor_lab:\"plancher (revenu du plus pauvre)\",\n    st_floor:\"plancher\",st_mean:\"moyenne\",st_ceil:\"plafond\",\n    r_maximin:\"Maximin (Rawls)\",r_mean:\"Utilitariste (moyenne)\",r_max:\"Maximax (pari)\",\n    why_maximin:\"le plancher le plus haut\",why_mean:\"le revenu moyen le plus haut\",why_max:\"le plafond le plus haut\",\n    sim_note:\"Selon la règle choisie, le « meilleur » monde change. Rawls défend le maximin : derrière le voile, un esprit prudent protège d'abord son pire sort possible.\"\n   },en:{\n    eyebrow:\"Ecological macroeconomics · Assessing inequality: Rawls\",\n    title:\"The veil of ignorance and maximin\",\n    sub:\"How to judge whether inequalities are <b>fair<\/b>? John Rawls (1971) offers a method: reason as if you had to choose your society <b>without knowing what place you'll hold in it<\/b>.\",\n    v_title:\"1 · The veil of ignorance\",\n    v_1:\"Rawls starts from a thought experiment. Imagine designing the rules of a society <i>before<\/i> being born into it — not knowing your future sex, talents, inheritance, or social position. You stand behind a <b>veil of ignorance<\/b>.\",\n    v_2:\"This veil is a <b>veil of impartiality<\/b>: not knowing your position, you cannot design rules that favour you personally. You judge inequalities from anyone's point of view — including the worst-off.\",\n    cond_intro:\"Under these conditions, everyone can conclude that inequalities are fair <i>only if<\/i>:\",\n    cond_1:\"<b>they are attached to positions open to all<\/b>, under fair equality of opportunity;\",\n    cond_2:\"<b>they benefit the most disadvantaged<\/b> in society — the <i>difference principle<\/i>.\",\n    m_title:\"2 · The maximin criterion\",\n    m_1:\"Behind the veil, which decision rule should you adopt? Since you could be born <b>anywhere<\/b>, including at the very bottom, the prudent choice makes your <b>worst possible outcome as good as possible<\/b>.\",\n    m_2:\"This is <b>maximin<\/b> — short for « <b>maxi<\/b>mise the <b>min<\/b>imum ». You compare societies by how they treat their <b>most disadvantaged<\/b>, and choose the one whose floor is highest. By contrast, the <b>utilitarian<\/b> maximises <i>average<\/i> income (even at the expense of the poorest), and the <b>maximax<\/b> gamble aims for the best possible outcome (risking the worst).\",\n    m_rule_lbl:\"Rawls's rule\",\n    m_rule:\"A society is fairer the better off its <b>poorest<\/b> members are. Rawls doesn't say <i>which<\/i> distribution is fair: he provides a <b>method<\/b> to recognise it.\",\n    sim_title:\"3 · Maximin, average, maximax: three rules, three choices\",\n    sim_expl:\"Three worlds with more or less inequality. Set the <b>floor<\/b> (the poorest person's income) of each and watch what each rule chooses. Maximin looks at one thing only: the <b>left<\/b> end of each bar.\",\n    wnames:[\"Egalitarian world\",\"In-between world\",\"Unequal world\"],\n    wdesc:[\"small spread\",\"medium spread\",\"large spread\"],\n    floor_lab:\"floor (poorest person's income)\",\n    st_floor:\"floor\",st_mean:\"average\",st_ceil:\"ceiling\",\n    r_maximin:\"Maximin (Rawls)\",r_mean:\"Utilitarian (average)\",r_max:\"Maximax (gamble)\",\n    why_maximin:\"the highest floor\",why_mean:\"the highest average income\",why_max:\"the highest ceiling\",\n    sim_note:\"Depending on the rule, the « best » world changes. Rawls defends maximin: behind the veil, a prudent mind protects its worst possible outcome first.\"\n   }};\n\n  function num(v){return Math.round(v).toLocaleString(nf());}\n\n  function renderWorlds(){\n    var d=T[LANG], box=document.getElementById('worlds'); box.innerHTML='';\n    W.forEach(function(w,i){\n      var el=document.createElement('div'); el.className='world';\n      var lf=100*w.floor/SCALE, wd=100*w.spread/SCALE, mid=100*avg(w)/SCALE;\n      el.innerHTML=\n        '<div class=\"top\"><span class=\"wn\">'+d.wnames[i]+'<small>'+d.wdesc[i]+'<\/small><\/span>'+\n          '<span class=\"stats\">'+d.st_floor+' <b>'+num(w.floor)+'<\/b> · '+d.st_mean+' <b>'+num(avg(w))+'<\/b> · '+d.st_ceil+' <b>'+num(ceil(w))+'<\/b><\/span><\/div>'+\n        '<div class=\"track\">'+\n          '<div class=\"flag\" style=\"left:'+lf.toFixed(1)+'%\">▼ '+d.st_floor+'<\/div>'+\n          '<div class=\"seg\" style=\"left:'+lf.toFixed(1)+'%;width:'+wd.toFixed(1)+'%;background:'+w.col+'\"><\/div>'+\n          '<div class=\"cap\" style=\"left:'+mid.toFixed(1)+'%\">'+num(avg(w))+'<\/div>'+\n        '<\/div>'+\n        '<div class=\"lab\"><span class=\"name2\">'+d.floor_lab+'<\/span><span class=\"val2\" id=\"fv'+i+'\">'+num(w.floor)+'<\/span><\/div>'+\n        '<input type=\"range\" id=\"f'+i+'\" min=\"0\" max=\"60\" step=\"1\" value=\"'+w.floor+'\">';\n      box.appendChild(el);\n    });\n    W.forEach(function(w,i){ document.getElementById('f'+i).addEventListener('input',function(){ W[i].floor=parseInt(this.value,10); renderWorlds(); renderRules(); }); });\n  }\n  function argmax(fn){var bi=0;for(var i=1;i<W.length;i++){if(fn(W[i])>fn(W[bi]))bi=i;}return bi;}\n  function renderRules(){\n    var d=T[LANG];\n    var im=argmax(function(w){return w.floor;}), iu=argmax(avg), ix=argmax(ceil);\n    function card(h,idx,why,on){return '<div class=\"rule'+(on?' on':'')+'\"><h3>'+h+'<\/h3><p class=\"pick\">'+d.wnames[idx]+'<\/p><p class=\"why\">'+why+'<\/p><\/div>';}\n    document.getElementById('rules').innerHTML=\n      card(d.r_maximin,im,d.why_maximin,true)+card(d.r_mean,iu,d.why_mean,false)+card(d.r_max,ix,d.why_max,false);\n  }\n\n  function applyLang(){\n    var d=T[LANG]; document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t'); if(d[k]!=null) el.innerHTML=d[k];});\n    document.getElementById('langlbl').textContent=LANG.toUpperCase();\n    document.title = LANG==='fr' ? \"Le voile d'ignorance et le maximin\" : \"The veil of ignorance and maximin\";\n    renderWorlds(); renderRules();\n  }\n  document.getElementById('lang').addEventListener('click',function(){ LANG=LANG==='fr'?'en':'fr'; try{localStorage.setItem('rawls_lang',LANG);}catch(e){} applyLang(); });\n  document.getElementById('theme').addEventListener('click',function(){ var n=effTheme()==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); try{localStorage.setItem('rawls_theme',n);}catch(e){} });\n  applyLang();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "trois-societes.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Choisir entre trois sociétés<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;--ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n    --accent:#4F46E sible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 19px;margin-top:16px;}\n  .card h2{font-family:var(--font-d);font-weight:600;font-size:20px;margin:0 0 5px;letter-spacing:-.01em;text-wrap:balance;}\n  .card .expl{color:var(--muted);font-size:14px;margin:0 0 12px;max-width:82ch;text-wrap:pretty;} .card .expl b{color:var(--ink);font-weight:600;} .card .expl i{font-family:var(--font-d);font-style:italic;}\n\n  .pres{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;} @media(max-width:680px){.pres{grid-template-columns:1fr;}}\n  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;}\n  .pcard .sn{font-family:var(--font-d);font-weight:600;font-size:16px;margin:0;}\n  .pcard .desc{font-size:12px;color:var(--muted);margin:2px 0 10px;}\n  .pcard .mean{font-family:var(--font-d);font-weight:600;font-size:23px;color:var(--ink);line-height:1;} .pcard .meanlab{font-family:var(--font-m);font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);margin:2px 0 11px;}\n  .qbar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line);}\n  .qbar .qseg{height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:9.5px;color:#fff;overflow:hidden;}\n  .qbar .q1{background:#C7C4F0;color:#2b2870;} .qbar .q2{background:#9B95E8;} .qbar .q3{background:#6E64DE;} .qbar .q4{background:#4F46E5;}\n  .qcap{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:9.5px;color:var(--faint);margin-top:4px;}\n  .prow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:3px 0;border-top:1px solid var(--line);margin-top:8px;} .prow b{color:var(--ink);font-family:var(--font-m);} .prow.floor b{color:#C0392B;}\n  .pres-note{font-size:13px;color:var(--muted);margin-top:14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:10px 13px;text-wrap:pretty;} .pres-note b{color:var(--ink);font-weight:600;}\n\n  .ctrlbar{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin:4px 0 8px;}\n  .ctrl{flex:1;min-width:240px;} .ctrl .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;} .ctrl .name{font-size:13px;color:var(--ink);} .ctrl .qlab{font-family:var(--font-m);font-size:12px;color:var(--accent);font-weight:500;}\n  .qslider{display:flex;gap:6px;}\n  .qstep{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;padding:9px 4px;text-align:center;font-family:var(--font-m);font-size:12px;cursor:pointer;transition:all .12s;}\n  .qstep:hover{border-color:var(--faint);color:var(--ink);} .qstep.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent);font-weight:600;}\n  .dice{font-family:var(--font-m);font-size:13px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:9px;padding:10px 15px;cursor:pointer;font-weight:500;white-space:nowrap;} .dice:hover{background:var(--accent);color:#fff;}\n\n  .socs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;} @media(max-width:620px){.socs{grid-template-columns:1fr;}}\n  .soc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;transition:border-color .15s,box-shadow .15s;}\n  .soc.win{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), var(--shadow);}\n  .soc .sn{font-family:var(--font-d);font-weight:600;font-size:15px;margin:0;}\n  .soc .here{font-family:var(--font-d);font-weight:600;font-size:25px;line-height:1.1;margin:6px 0 2px;color:var(--ink);} .soc.win .here{color:var(--accent);}\n  .soc .herelab{font-family:var(--font-m);font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;}\n  .soc .track{height:8px;background:var(--grid);border-radius:6px;overflow:hidden;margin-bottom:11px;} .soc .fill{height:100%;background:var(--faint);border-radius:6px;transition:width .18s;} .soc.win .fill{background:var(--accent);}\n  .soc .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:2px 0;border-top:1px solid var(--line);} .soc .row:first-of-type{border-top:none;} .soc .row b{color:var(--ink);font-family:var(--font-m);} .soc .row.floor b{color:#C0392B;}\n\n  .verdict{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:2px;} @media(max-width:620px){.verdict{grid-template-columns:1fr;}}\n  .vc{border:1px solid var(--line);border-radius:12px;padding:14px 15px;} .vc.rawls{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-color:var(--accent);} .vc.util{background:var(--panel);}\n  .vc h3{margin:0 0 6px;font-size:13px;font-family:var(--font-m);letter-spacing:.03em;text-transform:uppercase;} .vc.rawls h3{color:var(--accent);} .vc.util h3{color:var(--muted);}\n  .vc .pick{font-family:var(--font-d);font-weight:600;font-size:20px;margin:0 0 4px;} .vc p{margin:4px 0 0;font-size:13px;color:var(--muted);text-wrap:pretty;} .vc p b{color:var(--ink);font-weight:600;}\n  .rankline{font-family:var(--font-m);font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:14px;text-align:center;} .rankline b{color:var(--accent);}\n  .note{font-size:13px;color:var(--muted);margin-top:14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:10px 13px;text-wrap:pretty;} .note b{color:var(--ink);font-weight:600;}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <div><p class=\"eyebrow\" data-t=\"eyebrow\"><\/p><h1 data-t=\"title\"><\/h1><p class=\"sub\" data-t=\"sub\"><\/p><\/div>\n    <div class=\"toggles\"><button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button><button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button><\/div>\n  <\/header>\n\n  <section class=\"card\">\n    <h2 data-t=\"pres_title\"><\/h2>\n    <p class=\"expl\" data-t=\"pres_expl\"><\/p>\n    <div class=\"pres\" id=\"pres\"><\/div>\n    <p class=\"pres-note\" data-t=\"pres_note\"><\/p>\n  <\/section>\n\n  <section class=\"card\">\n    <h2 data-t=\"sim_title\"><\/h2>\n    <p class=\"expl\" data-t=\"sim_expl\"><\/p>\n    <div class=\"ctrlbar\">\n      <div class=\"ctrl\"><div class=\"lab\"><span class=\"name\" data-t=\"pos_lab\"><\/span><span class=\"qlab\" id=\"qlab\"><\/span><\/div><div class=\"qslider\" id=\"qslider\"><\/div><\/div>\n      <button class=\"dice\" id=\"dice\" data-t=\"dice\"><\/button>\n    <\/div>\n    <div class=\"socs\" id=\"socs\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <h2 data-t=\"v_title\"><\/h2>\n    <div class=\"verdict\">\n      <div class=\"vc rawls\"><h3 data-t=\"v_rawls_h\"><\/h3><div class=\"pick\" id=\"rawls-pick\"><\/div><p data-t=\"v_rawls_p\"><\/p><\/div>\n      <div class=\"vc util\"><h3 data-t=\"v_util_h\"><\/h3><div class=\"pick\" id=\"util-pick\"><\/div><p data-t=\"v_util_p\"><\/p><\/div>\n    <\/div>\n    <p class=\"rankline\" data-t=\"v_rank\"><\/p>\n    <p class=\"note\" data-t=\"v_limits\"><\/p>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  try{var st=localStorage.getItem('trois_theme'); if(st) document.documentElement.setAttribute('data-theme',st);}catch(e){}\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme'); if(a) return a; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}\n  var LANG='fr'; try{var sl=localStorage.getItem('trois_lang'); if(sl) LANG=sl;}catch(e){}\n  function nf(){return LANG==='fr'?'fr-FR':'en-US';}\n\n  var SOC={A:{mean:120,q:[4,10,21,65]},B:{mean:130,q:[2,6,17,75]},C:{mean:250,q:[0.5,2,9.5,88]}};\n  var KEYS=['A','B','C'];\n  function qavg(s,i){return SOC[s].q[i]/25*SOC[s].mean;}\n  var qi=0; // quartile de naissance (0..3)\n\n  var T={fr:{\n    eyebrow:\"Macroéconomie écologique · Évaluer les inégalités : Rawls\",\n    title:\"Choisir entre trois sociétés\",\n    sub:\"Trois pays de même population. En appliquant le <b>voile d'ignorance<\/b> — choisir sans savoir où l'on naîtra —, lequel est le plus juste au sens de Rawls ? Le résultat surprend.\",\n    pres_title:\"1 · Les trois sociétés\",\n    pres_expl:\"Avant de choisir, observez-les. Même population (100 000 habitants), mais des richesses et des <b>répartitions<\/b> très différentes. La barre montre la part du revenu total détenue par chaque quartile (du plus pauvre au plus riche).\",\n    pres_note:\"<b>A<\/b> est la plus <b>égalitaire<\/b> mais la plus <b>pauvre<\/b> en moyenne. <b>C<\/b> est la plus <b>riche<\/b> en moyenne, mais la plus <b>inégalitaire<\/b> : son quart supérieur y capte 88 % du revenu, et son quart inférieur presque rien.\",\n    desc:[\"faibles écarts\",\"écarts moyens\",\"très forts écarts\"],\n    meanlab:\"PIB moyen / habitant\",\n    dist:\"répartition du revenu (par quartile)\",\n    p_floor:\"revenu des 25 % du bas\",p_top:\"revenu des 25 % du haut\",\n    sim_title:\"2 · Derrière le voile : où allez-vous naître ?\",\n    sim_expl:\"Vous naissez dans l'un des quatre quartiles, mais vous ignorez lequel. <b>Si vous naissez dans un quartile, vous recevez le revenu moyen de ce quartile.<\/b> Choisissez la position — ou tirez au sort.\",\n    pos_lab:\"Votre quartile de naissance\",\n    q_short:[\"Q1\",\"Q2\",\"Q3\",\"Q4\"],\n    q_labels:[\"Q1 — les 25 % les plus pauvres\",\"Q2\",\"Q3\",\"Q4 — les 25 % les plus riches\"],\n    dice:\"🎲 Naître au hasard\",\n    here:\"revenu à cette position\",mean:\"revenu moyen\",floor:\"revenu des plus pauvres (Q1)\",\n    v_title:\"3 · Alors, quelle société ?\",\n    v_rawls_h:\"Selon Rawls (maximin)\",\n    v_rawls_p:\"On choisit la société où les <b>plus pauvres<\/b> sont le mieux lotis — même si c'est la <b>plus pauvre en moyenne<\/b>. Derrière le voile, si vous pouviez tomber dans le quart inférieur, c'est le choix le plus prudent.\",\n    v_util_h:\"Selon l'utilitarisme (moyenne)\",\n    v_util_p:\"On choisit la société au <b>revenu moyen<\/b> le plus élevé — mais ses plus pauvres y sont les <b>moins bien lotis<\/b> (5 k€ contre 19,2 k€ en A).\",\n    v_rank:\"Classement maximin : <b>A > B > C<\/b> · Classement par la moyenne : <b>C > B > A<\/b> — un renversement complet.\",\n    v_limits:\"Cette méthode suppose des individus rationnels et <b>averses au risque<\/b>, un bien-être réduit au <b>revenu monétaire<\/b>, et des droits formels identiques partout. Rawls lui-même la présentait comme un point de départ.\"\n   },en:{\n    eyebrow:\"Ecological macroeconomics · Assessing inequality: Rawls\",\n    title:\"Choosing between three societies\",\n    sub:\"Three countries with the same population. Applying the <b>veil of ignorance<\/b> — choosing without knowing where you'll be born —, which is fairest by Rawls's criterion? The result is surprising.\",\n    pres_title:\"1 · The three societies\",\n    pres_expl:\"Before choosing, look at them. Same population (100,000 people), but very different wealth and <b>distributions<\/b>. The bar shows the share of total income held by each quartile (poorest to richest).\",\n    pres_note:\"<b>A<\/b> is the most <b>equal<\/b> but the <b>poorest<\/b> on average. <b>C<\/b> is the <b>richest<\/b> on average but the most <b>unequal<\/b>: its top quarter captures 88% of income, its bottom quarter almost nothing.\",\n    desc:[\"small spread\",\"medium spread\",\"very large spread\"],\n    meanlab:\"average GDP per capita\",\n    dist:\"income distribution (by quartile)\",\n    p_floor:\"income of the bottom 25%\",p_top:\"income of the top 25%\",\n    sim_title:\"2 · Behind the veil: where will you be born?\",\n    sim_expl:\"You are born in one of the four quartiles, but you don't know which. <b>If you're born in a quartile, you receive that quartile's average income.<\/b> Choose the position — or roll the dice.\",\n    pos_lab:\"Your birth quartile\",\n    q_short:[\"Q1\",\"Q2\",\"Q3\",\"Q4\"],\n    q_labels:[\"Q1 — the poorest 25%\",\"Q2\",\"Q3\",\"Q4 — the richest 25%\"],\n    dice:\"🎲 Be born at random\",\n    here:\"income at this position\",mean:\"average income\",floor:\"income of the poorest (Q1)\",\n    v_title:\"3 · So, which society?\",\n    v_rawls_h:\"By Rawls (maximin)\",\n    v_rawls_p:\"You choose the society where the <b>poorest<\/b> are best off — even if it is the <b>poorest on average<\/b>. Behind the veil, if you could land in the bottom quarter, this is the safest choice.\",\n    v_util_h:\"By utilitarianism (average)\",\n    v_util_p:\"You choose the society with the highest <b>average income<\/b> — but its poorest are the <b>worst off<\/b> (5k vs 19.2k in A).\",\n    v_rank:\"Maximin ranking: <b>A > B > C<\/b> · Ranking by average: <b>C > B > A<\/b> — a complete reversal.\",\n    v_limits:\"This method assumes rational, <b>risk-averse<\/b> individuals, well-being reduced to <b>monetary income<\/b>, and identical formal rights everywhere. Rawls himself presented it as a starting point.\"\n   }};\n\n  function eur(v){return v.toLocaleString(nf(),{maximumFractionDigits:1})+' k€';}\n  function argmax(fn){var best=KEYS[0];KEYS.forEach(function(k){if(fn(k)>fn(best))best=k;});return best;}\n\n  function renderPres(){\n    var d=T[LANG], box=document.getElementById('pres'); box.innerHTML='';\n    KEYS.forEach(function(k,idx){\n      var s=SOC[k], seg='';\n      s.q.forEach(function(sh,i){ seg+='<div class=\"qseg q'+(i+1)+'\" style=\"width:'+sh+'%\">'+(sh>=8?sh+'%':'')+'<\/div>'; });\n      var el=document.createElement('div'); el.className='pcard';\n      el.innerHTML='<p class=\"sn\">'+(LANG==='fr'?'Société ':'Society ')+k+'<\/p><p class=\"desc\">'+d.desc[idx]+'<\/p>'+\n        '<div class=\"mean\">'+eur(s.mean)+'<\/div><p class=\"meanlab\">'+d.meanlab+'<\/p>'+\n        '<div style=\"font-size:11px;color:var(--muted);margin-bottom:5px\">'+d.dist+'<\/div>'+\n        '<div class=\"qbar\">'+seg+'<\/div><div class=\"qcap\"><span>Q1<\/span><span>Q4<\/span><\/div>'+\n        '<div class=\"prow floor\"><span>'+d.p_floor+'<\/span><b>'+eur(qavg(k,0))+'<\/b><\/div>'+\n        '<div class=\"prow\"><span>'+d.p_top+'<\/span><b>'+eur(qavg(k,3))+'<\/b><\/div>';\n      box.appendChild(el);\n    });\n  }\n\n  function buildSlider(){\n    var d=T[LANG], box=document.getElementById('qslider'); box.innerHTML='';\n    d.q_short.forEach(function(lab,i){\n      var b=document.createElement('div'); b.className='qstep'+(i===qi?' on':''); b.textContent=lab;\n      b.onclick=function(){ qi=i; renderSim(); };\n      box.appendChild(b);\n    });\n  }\n  function renderSim(){\n    var d=T[LANG];\n    document.getElementById('qlab').textContent=d.q_labels[qi];\n    document.querySelectorAll('#qslider .qstep').forEach(function(x,i){ x.classList.toggle('on',i===qi); });\n    var here={}; KEYS.forEach(function(k){here[k]=qavg(k,qi);});\n    var winHere=argmax(function(k){return here[k];}), maxHere=Math.max(here.A,here.B,here.C);\n    var box=document.getElementById('socs'); box.innerHTML='';\n    KEYS.forEach(function(k){\n      var win=(k===winHere), el=document.createElement('div'); el.className='soc'+(win?' win':'');\n      el.innerHTML='<p class=\"sn\">'+(LANG==='fr'?'Société ':'Society ')+k+'<\/p>'+\n        '<div class=\"here\">'+eur(here[k])+'<\/div><p class=\"herelab\">'+d.here+'<\/p>'+\n        '<div class=\"track\"><div class=\"fill\" style=\"width:'+(100*here[k]/maxHere).toFixed(1)+'%\"><\/div><\/div>'+\n        '<div class=\"row\"><span>'+d.mean+'<\/span><b>'+eur(SOC[k].mean)+'<\/b><\/div>'+\n        '<div class=\"row floor\"><span>'+d.floor+'<\/span><b>'+eur(qavg(k,0))+'<\/b><\/div>';\n      box.appendChild(el);\n    });\n    var rawls=argmax(function(k){return qavg(k,0);}), util=argmax(function(k){return SOC[k].mean;});\n    document.getElementById('rawls-pick').textContent=(LANG==='fr'?'Société ':'Society ')+rawls+' · '+eur(qavg(rawls,0));\n    document.getElementById('util-pick').textContent=(LANG==='fr'?'Société ':'Society ')+util+' · '+eur(SOC[util].mean);\n  }\n\n  document.getElementById('dice').addEventListener('click',function(){ qi=Math.floor(Math.random()*4); renderSim(); });\n\n  function applyLang(){\n    var d=T[LANG]; document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t'); if(d[k]!=null) el.innerHTML=d[k];});\n    document.getElementById('langlbl').textContent=LANG.toUpperCase();\n    document.title = LANG==='fr' ? \"Choisir entre trois sociétés\" : \"Choosing between three societies\";\n    renderPres(); buildSlider(); renderSim();\n  }\n  document.getElementById('lang').addEventListener('click',function(){ LANG=LANG==='fr'?'en':'fr'; try{localStorage.setItem('trois_lang',LANG);}catch(e){} applyLang(); });\n  document.getElementById('theme').addEventListener('click',function(){ var n=effTheme()==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); try{localStorage.setItem('trois_theme',n);}catch(e){} });\n  applyLang();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "pays-europeens.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Trois pays européens derrière le voile<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribut
