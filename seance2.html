font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}\n  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}\n  .tg:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 19px;margin-top:16px;}\n  .card h2{font-family:var(--font-d);font-weight:600;font-size:20px;margin:0 0 5px;letter-spacing:-.01em;text-wrap:balance;}\n  .card .expl{color:var(--muted);font-size:14px;margin:0 0 12px;max-width:82ch;text-wrap:pretty;} .card .expl b{color:var(--ink);font-weight:600;} .card .expl i{font-family:var(--font-d);font-style:italic;}\n\n  .pres{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;} @media(max-width:680px){.pres{grid-template-columns:1fr;}}\n  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;}\n  .pcard .sn{font-family:var(--font-d);font-weight:600;font-size:16px;margin:0;}\n  .pcard .desc{font-size:12px;color:var(--muted);margin:2px 0 10px;}\n  .pcard .mean{font-family:var(--font-d);font-weight:600;font-size:23px;color:var(--ink);line-height:1;} .pcard .meanlab{font-family:var(--font-m);font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);margin:2px 0 11px;}\n  .qbar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line);}\n  .qbar .qseg{height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:9.5px;color:#fff;overflow:hidden;}\n  .qbar .q1{background:#C7C4F0;color:#2b2870;} .qbar .q2{background:#9B95E8;} .qbar .q3{background:#6E64DE;} .qbar .q4{background:#4F46E5;}\n  .qcap{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:9.5px;color:var(--faint);margin-top:4px;}\n  .prow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:3px 0;border-top:1px solid var(--line);margin-top:8px;} .prow b{color:var(--ink);font-family:var(--font-m);} .prow.floor b{color:#C0392B;}\n  .pres-note{font-size:13px;color:var(--muted);margin-top:14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:10px 13px;text-wrap:pretty;} .pres-note b{color:var(--ink);font-weight:600;}\n\n  .ctrlbar{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin:4px 0 8px;}\n  .ctrl{flex:1;min-width:240px;} .ctrl .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;} .ctrl .name{font-size:13px;color:var(--ink);} .ctrl .qlab{font-family:var(--font-m);font-size:12px;color:var(--accent);font-weight:500;}\n  .qslider{display:flex;gap:6px;}\n  .qstep{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;padding:9px 4px;text-align:center;font-family:var(--font-m);font-size:12px;cursor:pointer;transition:all .12s;}\n  .qstep:hover{border-color:var(--faint);color:var(--ink);} .qstep.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent);font-weight:600;}\n  .dice{font-family:var(--font-m);font-size:13px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:9px;padding:10px 15px;cursor:pointer;font-weight:500;white-space:nowrap;} .dice:hover{background:var(--accent);color:#fff;}\n\n  .socs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;} @media(max-width:620px){.socs{grid-template-columns:1fr;}}\n  .soc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;transition:border-color .15s,box-shadow .15s;}\n  .soc.win{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), var(--shadow);}\n  .soc .sn{font-family:var(--font-d);font-weight:600;font-size:15px;margin:0;}\n  .soc .here{font-family:var(--font-d);font-weight:600;font-size:25px;line-height:1.1;margin:6px 0 2px;color:var(--ink);} .soc.win .here{color:var(--accent);}\n  .soc .herelab{font-family:var(--font-m);font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);margin:0 0 10px;}\n  .soc .track{height:8px;background:var(--grid);border-radius:6px;overflow:hidden;margin-bottom:11px;} .soc .fill{height:100%;background:var(--faint);border-radius:6px;transition:width .18s;} .soc.win .fill{background:var(--accent);}\n  .soc .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:2px 0;border-top:1px solid var(--line);} .soc .row:first-of-type{border-top:none;} .soc .row b{color:var(--ink);font-family:var(--font-m);} .soc .row.floor b{color:#C0392B;}\n\n  .verdict{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:2px;} @media(max-width:620px){.verdict{grid-template-columns:1fr;}}\n  .vc{border:1px solid var(--line);border-radius:12px;padding:14px 15px;} .vc.rawls{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-color:var(--accent);} .vc.util{background:var(--panel);}\n  .vc h3{margin:0 0 6px;font-size:13px;font-family:var(--font-m);letter-spacing:.03em;text-transform:uppercase;} .vc.rawls h3{color:var(--accent);} .vc.util h3{color:var(--muted);}\n  .vc .pick{font-family:var(--font-d);font-weight:600;font-size:20px;margin:0 0 4px;} .vc p{margin:4px 0 0;font-size:13px;color:var(--muted);text-wrap:pretty;} .vc p b{color:var(--ink);font-weight:600;}\n  .rankline{font-family:var(--font-m);font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:14px;text-align:center;} .rankline b{color:var(--accent);}\n  .note{font-size:13px;color:var(--muted);margin-top:14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:10px 13px;text-wrap:pretty;} .note b{color:var(--ink);font-weight:600;}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <div><p class=\"eyebrow\" data-t=\"eyebrow\"><\/p><h1 data-t=\"title\"><\/h1><p class=\"sub\" data-t=\"sub\"><\/p><\/div>\n    <div class=\"toggles\"><button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button><button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button><\/div>\n  <\/header>\n\n  <section class=\"card\">\n    <h2 data-t=\"pres_title\"><\/h2>\n    <p class=\"expl\" data-t=\"pres_expl\"><\/p>\n    <div class=\"pres\" id=\"pres\"><\/div>\n    <p class=\"pres-note\" data-t=\"pres_note\"><\/p>\n  <\/section>\n\n  <section class=\"card\">\n    <h2 data-t=\"sim_title\"><\/h2>\n    <p class=\"expl\" data-t=\"sim_expl\"><\/p>\n    <div class=\"ctrlbar\">\n      <div class=\"ctrl\"><div class=\"lab\"><span class=\"name\" data-t=\"pos_lab\"><\/span><span class=\"qlab\" id=\"qlab\"><\/span><\/div><div class=\"qslider\" id=\"qslider\"><\/div><\/div>\n      <button class=\"dice\" id=\"dice\" data-t=\"dice\"><\/button>\n    <\/div>\n    <div class=\"socs\" id=\"socs\"><\/div>\n  <\/section>\n\n  <section class=\"card\">\n    <h2 data-t=\"v_title\"><\/h2>\n    <div class=\"verdict\">\n      <div class=\"vc rawls\"><h3 data-t=\"v_rawls_h\"><\/h3><div class=\"pick\" id=\"rawls-pick\"><\/div><p data-t=\"v_rawls_p\"><\/p><\/div>\n      <div class=\"vc util\"><h3 data-t=\"v_util_h\"><\/h3><div class=\"pick\" id=\"util-pick\"><\/div><p data-t=\"v_util_p\"><\/p><\/div>\n    <\/div>\n    <p class=\"rankline\" data-t=\"v_rank\"><\/p>\n    <p class=\"note\" data-t=\"v_limits\"><\/p>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  try{var st=localStorage.getItem('euro_theme'); if(st) document.documentElement.setAttribute('data-theme',st);}catch(e){}\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme'); if(a) return a; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}\n  var LANG='fr'; try{var sl=localStorage.getItem('euro_lang'); if(sl) LANG=sl;}catch(e){}\n  function nf(){return LANG==='fr'?'fr-FR':'en-US';}\n\n  var SOC={ES:{mean:44.2,q:[5.5,15.2,23.9,55.4],gini:0.46},CZ:{mean:38.8,q:[7.1,18.0,25.9,48.9],gini:0.39},BG:{mean:23.2,q:[4.4,12.0,20.7,62.8],gini:0.54}};\n  var KEYS=['ES','CZ','BG'];\n  var NAMES={fr:{ES:'Espagne',CZ:'Tchéquie',BG:'Bulgarie'},en:{ES:'Spain',CZ:'Czechia',BG:'Bulgaria'}};\n  function cn(k){return NAMES[LANG][k];}\n  function qavg(s,i){return SOC[s].q[i]/25*SOC[s].mean;}\n  var qi=0; // quartile de naissance (0..3)\n\n  var T={fr:{\n    eyebrow:\"Macroéconomie écologique · Évaluer les inégalités : Rawls\",\n    title:\"Trois pays européens derrière le voile\",\n    sub:\"Trois pays européens, avec de <b>vraies données<\/b> de distribution des revenus. En appliquant le <b>voile d'ignorance<\/b> — choisir sans savoir où l'on naîtra —, lequel est le plus juste au sens de Rawls ? Le pays le plus riche n'est pas celui qu'on croit.\",\n    pres_title:\"1 · Les trois sociétés\",\n    pres_expl:\"Avant de choisir, observez-les. Revenu moyen par adulte et <b>répartition<\/b> réelle : la barre montre la part du revenu détenue par chaque quartile (du plus pauvre à gauche au plus riche à droite).\",\n    pres_note:\"L'<b>Espagne<\/b> est la <b>plus riche<\/b> (44 k€) mais assez <b>inégalitaire<\/b> (Gini 0,46) : son quart le plus pauvre y touche <b>moins<\/b> (9,7 k€) qu'en <b>Tchéquie<\/b> (11,0 k€), pourtant moins riche. La <b>Bulgarie<\/b>, la plus pauvre et la plus inégalitaire, laisse ses plus démunis à 4,1 k€. ⚠️ Ce sont des revenus <b>avant impôts et transferts<\/b>.\",\n    desc:[\"Gini 0,46 — inégalitaire\",\"Gini 0,39 — égalitaire\",\"Gini 0,54 — très inégalitaire\"],\n    meanlab:\"revenu moyen / adulte (avant impôts)\",\n    dist:\"répartition du revenu (par quartile)\",\n    p_floor:\"revenu des 25 % du bas\",p_top:\"revenu des 25 % du haut\",\n    sim_title:\"2 · Derrière le voile : où allez-vous naître ?\",\n    sim_expl:\"Vous naissez dans l'un des quatre quartiles, mais vous ignorez lequel. <b>Si vous naissez dans un quartile, vous recevez le revenu moyen de ce quartile.<\/b> Choisissez la position — ou tirez au sort.\",\n    pos_lab:\"Votre quartile de naissance\",\n    q_short:[\"Q1\",\"Q2\",\"Q3\",\"Q4\"],\n    q_labels:[\"Q1 — les 25 % les plus pauvres\",\"Q2\",\"Q3\",\"Q4 — les 25 % les plus riches\"],\n    dice:\"🎲 Naître au hasard\",\n    here:\"revenu à cette position\",mean:\"revenu moyen\",floor:\"revenu des plus pauvres (Q1)\",\n    v_title:\"3 · Alors, quelle société ?\",\n    v_rawls_h:\"Selon Rawls (maximin)\",\n    v_rawls_p:\"On choisit le pays où les <b>plus pauvres<\/b> sont le mieux lotis : la <b>Tchéquie<\/b> (11,0 k€ pour le quart du bas) — alors que l'Espagne, plus riche, y laisse ses plus pauvres à 9,7 k€.\",\n    v_util_h:\"Selon l'utilitarisme (moyenne)\",\n    v_util_p:\"On choisit le pays au <b>revenu moyen<\/b> le plus élevé : l'<b>Espagne<\/b> (44 k€) — mais ses plus pauvres y sont <b>moins bien lotis<\/b> qu'en Tchéquie (9,7 contre 11,0 k€), pourtant moins riche.\",\n    v_rank:\"Classement maximin : <b>Tchéquie > Espagne > Bulgarie<\/b> · Classement par la moyenne : <b>Espagne > Tchéquie > Bulgarie<\/b> — le pays le plus riche (l'Espagne) n'est pas le plus juste.\",\n    v_limits:\"Source : World Inequality Database via Our World in Data — revenu national par adulte <b>avant impôts et transferts<\/b>, 2017 ($ int. constants, PPA). ⚠️ La <b>redistribution<\/b> (impôts, transferts) relève le plancher <i>après<\/i> impôts et peut modifier ce classement : c'est précisément l'enjeu des outils de redistribution.\"\n   },en:{\n    eyebrow:\"Ecological macroeconomics · Assessing inequality: Rawls\",\n    title:\"Three European countries behind the veil\",\n    sub:\"Three European countries, with <b>real<\/b> income-distribution data. Applying the <b>veil of ignorance<\/b> — choosing without knowing where you'll be born —, which is fairest by Rawls's criterion? The richest country is not the one you'd expect.\",\n    pres_title:\"1 · The three societies\",\n    pres_expl:\"Before choosing, look at them. Average income per adult and real <b>distribution<\/b>: the bar shows the share of income held by each quartile (poorest on the left, richest on the right).\",\n    pres_note:\"<b>Spain<\/b> is the <b>richest<\/b> (44k) but fairly <b>unequal<\/b> (Gini 0.46): its poorest quarter gets <b>less<\/b> (9.7k) than in <b>Czechia<\/b> (11.0k), which is poorer. <b>Bulgaria<\/b>, the poorest and most unequal, leaves its worst-off at 4.1k. ⚠️ These are incomes <b>before taxes and transfers<\/b>.\",\n    desc:[\"Gini 0.46 — unequal\",\"Gini 0.39 — equal\",\"Gini 0.54 — very unequal\"],\n    meanlab:\"average income / adult (pre-tax)\",\n    dist:\"income distribution (by quartile)\",\n    p_floor:\"income of the bottom 25%\",p_top:\"income of the top 25%\",\n    sim_title:\"2 · Behind the veil: where will you be born?\",\n    sim_expl:\"You are born in one of the four quartiles, but you don't know which. <b>If you're born in a quartile, you receive that quartile's average income.<\/b> Choose the position — or roll the dice.\",\n    pos_lab:\"Your birth quartile\",\n    q_short:[\"Q1\",\"Q2\",\"Q3\",\"Q4\"],\n    q_labels:[\"Q1 — the poorest 25%\",\"Q2\",\"Q3\",\"Q4 — the richest 25%\"],\n    dice:\"🎲 Be born at random\",\n    here:\"income at this position\",mean:\"average income\",floor:\"income of the poorest (Q1)\",\n    v_title:\"3 · So, which society?\",\n    v_rawls_h:\"By Rawls (maximin)\",\n    v_rawls_p:\"You choose the country where the <b>poorest<\/b> are best off: <b>Czechia<\/b> (11.0k for the bottom quarter) — while Spain, though richer, leaves its poorest at 9.7k.\",\n    v_util_h:\"By utilitarianism (average)\",\n    v_util_p:\"You choose the country with the highest <b>average income<\/b>: <b>Spain<\/b> (44k) — but its poorest are <b>worse off<\/b> than in Czechia (9.7 vs 11.0k), which is poorer.\",\n    v_rank:\"Maximin ranking: <b>Czechia > Spain > Bulgaria<\/b> · Ranking by average: <b>Spain > Czechia > Bulgaria<\/b> — the richest country (Spain) is not the fairest.\",\n    v_limits:\"Source: World Inequality Database via Our World in Data — national income per adult <b>before taxes and transfers<\/b>, 2017 (constant int-$, PPP). ⚠️ <b>Redistribution<\/b> (taxes, transfers) raises the floor <i>after<\/i> tax and can change this ranking: exactly the point of redistribution tools.\"\n   }};\n\n  function eur(v){return v.toLocaleString(nf(),{maximumFractionDigits:1})+' k€';}\n  function argmax(fn){var best=KEYS[0];KEYS.forEach(function(k){if(fn(k)>fn(best))best=k;});return best;}\n\n  function renderPres(){\n    var d=T[LANG], box=document.getElementById('pres'); box.innerHTML='';\n    KEYS.forEach(function(k,idx){\n      var s=SOC[k], seg='';\n      s.q.forEach(function(sh,i){ seg+='<div class=\"qseg q'+(i+1)+'\" style=\"width:'+sh+'%\">'+(sh>=8?sh+'%':'')+'<\/div>'; });\n      var el=document.createElement('div'); el.className='pcard';\n      el.innerHTML='<p class=\"sn\">'+cn(k)+'<\/p><p class=\"desc\">'+d.desc[idx]+'<\/p>'+\n        '<div class=\"mean\">'+eur(s.mean)+'<\/div><p class=\"meanlab\">'+d.meanlab+'<\/p>'+\n        '<div style=\"font-size:11px;color:var(--muted);margin-bottom:5px\">'+d.dist+'<\/div>'+\n        '<div class=\"qbar\">'+seg+'<\/div><div class=\"qcap\"><span>Q1<\/span><span>Q4<\/span><\/div>'+\n        '<div class=\"prow floor\"><span>'+d.p_floor+'<\/span><b>'+eur(qavg(k,0))+'<\/b><\/div>'+\n        '<div class=\"prow\"><span>'+d.p_top+'<\/span><b>'+eur(qavg(k,3))+'<\/b><\/div>'+'<div class=\"prow\"><span>Gini<\/span><b>'+s.gini.toLocaleString(nf(),{minimumFractionDigits:2,maximumFractionDigits:2})+'<\/b><\/div>';\n      box.appendChild(el);\n    });\n  }\n\n  function buildSlider(){\n    var d=T[LANG], box=document.getElementById('qslider'); box.innerHTML='';\n    d.q_short.forEach(function(lab,i){\n      var b=document.createElement('div'); b.className='qstep'+(i===qi?' on':''); b.textContent=lab;\n      b.onclick=function(){ qi=i; renderSim(); };\n      box.appendChild(b);\n    });\n  }\n  function renderSim(){\n    var d=T[LANG];\n    document.getElementById('qlab').textContent=d.q_labels[qi];\n    document.querySelectorAll('#qslider .qstep').forEach(function(x,i){ x.classList.toggle('on',i===qi); });\n    var here={}; KEYS.forEach(function(k){here[k]=qavg(k,qi);});\n    var winHere=argmax(function(k){return here[k];}), maxHere=Math.max(here.A,here.B,here.C);\n    var box=document.getElementById('socs'); box.innerHTML='';\n    KEYS.forEach(function(k){\n      var win=(k===winHere), el=document.createElement('div'); el.className='soc'+(win?' win':'');\n      el.innerHTML='<p class=\"sn\">'+cn(k)+'<\/p>'+\n        '<div class=\"here\">'+eur(here[k])+'<\/div><p class=\"herelab\">'+d.here+'<\/p>'+\n        '<div class=\"track\"><div class=\"fill\" style=\"width:'+(100*here[k]/maxHere).toFixed(1)+'%\"><\/div><\/div>'+\n        '<div class=\"row\"><span>'+d.mean+'<\/span><b>'+eur(SOC[k].mean)+'<\/b><\/div>'+\n        '<div class=\"row floor\"><span>'+d.floor+'<\/span><b>'+eur(qavg(k,0))+'<\/b><\/div>';\n      box.appendChild(el);\n    });\n    var rawls=argmax(function(k){return qavg(k,0);}), util=argmax(function(k){return SOC[k].mean;});\n    document.getElementById('rawls-pick').textContent=cn(rawls)+' · '+eur(qavg(rawls,0));\n    document.getElementById('util-pick').textContent=cn(util)+' · '+eur(SOC[util].mean);\n  }\n\n  document.getElementById('dice').addEventListener('click',function(){ qi=Math.floor(Math.random()*4); renderSim(); });\n\n  function applyLang(){\n    var d=T[LANG]; document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t'); if(d[k]!=null) el.innerHTML=d[k];});\n    document.getElementById('langlbl').textContent=LANG.toUpperCase();\n    document.title = LANG==='fr' ? \"Choisir entre trois sociétés\" : \"Choosing between three societies\";\n    renderPres(); buildSlider(); renderSim();\n  }\n  document.getElementById('lang').addEventListener('click',function(){ LANG=LANG==='fr'?'en':'fr'; try{localStorage.setItem('euro_lang',LANG);}catch(e){} applyLang(); });\n  document.getElementById('theme').addEventListener('click',function(){ var n=effTheme()==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); try{localStorage.setItem('euro_theme',n);}catch(e){} });\n  applyLang();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "maximin-moyenne.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Maximin ou moyenne ?<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;--ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n    --accent:#4F46E5;\n    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);\n    --font-d:\"Spectral\",\"IBM Plex Sans\",Georgia,serif;--font-b:\"IBM Plex Sans\",system-ui,sans-serif;--font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n  }\n  :root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;--ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --accent:#8B84F0;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }}\n  :root[data-theme=\"dark\"]{\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;--ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --accent:#8B84F0;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}\n  .wrap{max-width:900px;margin:0 auto;padding-block:26px 46px;padding-inline:20px;}\n  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}\n  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500;margin:0 0 6px;}\n  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.7vw,42px);line-height:1.03;margin:0;letter-spacing:-.015em;text-wrap:balance;}\n  .sub{color:var(--muted);font-size:15px;margin:9px 0 0;max-width:76ch;text-wrap:pretty;} .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}\n  .toggles{display:flex;gap:8px;flex-shrink:0;}\n  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}\n  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}\n  .tg:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 19px;margin-top:16px;}\n  .card h2{font-family:var(--font-d);font-weight:600;font-size:20px;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance;}\n  .card .expl{color:var(--muted);font-size:14px;margin:0 0 10px;max-width:82ch;text-wrap:pretty;} .card .expl:last-child{margin-bottom:0;}\n  .card .expl b{color:var(--ink);font-weight:600;} .card .expl i{font-family:var(--font-d);font-style:italic;}\n  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px;} @media(max-width:600px){.two{grid-template-columns:1fr;}}\n  .crit{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--panel);}\n  .crit h3{margin:0 0 4px;font-family:var(--font-d);font-weight:600;font-size:16px;} .crit .who{font-family:var(--font-m);font-size:11px;color:var(--muted);margin:0 0 6px;}\n  .crit.m h3{color:#D9840E;} .crit.f h3{color:var(--accent);}\n  .crit p{margin:0;font-size:13px;color:var(--muted);text-wrap:pretty;}\n\n  .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:6px;} @media(max-width:600px){.ctrls{grid-template-columns:1fr;}}\n  .ctrl .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;} .ctrl .name{font-size:12.5px;color:var(--ink);} .ctrl .val{font-family:var(--font-m);font-size:12px;color:var(--accent);font-weight:500;}\n  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:var(--grid);outline:none;} input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.28);cursor:pointer;} input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);cursor:pointer;}\n  .lc-wrap{position:relative;width:100%;margin-top:6px;} svg.lc{display:block;width:100%;height:auto;} .lc text{font-family:var(--font-m);}\n  .lc .ax{fill:var(--faint);font-size:10.5px;} .lc .axt{fill:var(--faint);font-size:10.5px;} .lc .grid{stroke:var(--grid);stroke-width:1;} .lc .axl{stroke:var(--line);stroke-width:1.2;}\n\n  .live{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;}\n  .livec{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;}\n  .livec .k{font-family:var(--font-m);font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);margin:0 0 4px;}\n  .livec .v{font-family:var(--font-d);font-weight:600;font-size:24px;line-height:1;} .livec.m .v{color:#D9840E;} .livec.f .v{color:var(--accent);}\n  .verdict{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;} @media(max-width:600px){.verdict{grid-template-columns:1fr;}}\n  .vc{border:1px solid var(--line);border-radius:12px;padding:13px 14px;} .vc.f{background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-color:var(--accent);} .vc.m{background:var(--panel);}\n  .vc h3{margin:0 0 5px;font-size:11px;font-family:var(--font-m);letter-spacing:.03em;text-transform:uppercase;} .vc.f h3{color:var(--accent);} .vc.m h3{color:#D9840E;}\n  .vc .pick{font-family:var(--font-d);font-weight:600;font-size:19px;margin:0 0 3px;} .vc p{margin:3px 0 0;font-size:12.5px;color:var(--muted);text-wrap:pretty;} .vc p b{color:var(--ink);font-weight:600;}\n  .note{font-size:13px;color:var(--muted);margin-top:16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:11px 13px;text-wrap:pretty;} .note b{color:var(--ink);font-weight:600;} .note i{font-family:var(--font-d);font-style:italic;}\n  .vtoggle{display:flex;gap:8px;margin:2px 0 15px;flex-wrap:wrap;}\n  .vtoggle .vbtn{flex:1;min-width:210px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:10px 13px;cursor:pointer;text-align:left;transition:all .12s;}\n  .vtoggle .vbtn:hover{border-color:var(--faint);}\n  .vtoggle .vbtn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface));}\n  .vtoggle .vbtn b{display:block;font-family:var(--font-b);font-size:13px;color:var(--ink);font-weight:600;margin-bottom:2px;}\n  .vtoggle .vbtn.on b{color:var(--accent);}\n  .vtoggle .vbtn span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block;}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <div><p class=\"eyebrow\" data-t=\"eyebrow\"><\/p><h1 data-t=\"title\"><\/h1><p class=\"sub\" data-t=\"sub\"><\/p><\/div>\n    <div class=\"toggles\"><button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button><button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button><\/div>\n  <\/header>\n\n  <section class=\"card\">\n    <h2 data-t=\"i_title\"><\/h2>\n    <p class=\"expl\" data-t=\"i_1\"><\/p>\n    <div class=\"two\">\n      <div class=\"crit m\"><h3 data-t=\"c_m_h\"><\/h3><p class=\"who\" data-t=\"c_m_w\"><\/p><p data-t=\"c_m_p\"><\/p><\/div>\n      <div class=\"crit f\"><h3 data-t=\"c_f_h\"><\/h3><p class=\"who\" data-t=\"c_f_w\"><\/p><p data-t=\"c_f_p\"><\/p><\/div>\n    <\/div>\n    <p class=\"expl\" data-t=\"i_2\" style=\"margin-top:14px;\"><\/p>\n    <p class=\"expl\" data-t=\"i_3\" style=\"margin-top:12px;\"><\/p>\n  <\/section>\n\n  <section class=\"card\">\n    <h2 data-t=\"s_title\"><\/h2>\n    <p class=\"expl\" data-t=\"s_expl\"><\/p>\n    <div class=\"vtoggle\" id=\"viewtg\"><\/div>\n    <div class=\"ctrls\">\n      <div class=\"ctrl\"><div class=\"lab\"><span class=\"name\" data-t=\"rho_lab\"><\/span><span class=\"val\" id=\"rho-v\"><\/span><\/div><input type=\"range\" id=\"rho\" min=\"0\" max=\"100\" step=\"1\"><\/div>\n      <div class=\"ctrl\"><div class=\"lab\"><span class=\"name\" id=\"k-name\"><\/span><span class=\"val\" id=\"k-v\"><\/span><\/div><input type=\"range\" id=\"k\" min=\"10\" max=\"100\" step=\"1\"><\/div>\n    <\/div>\n    <div class=\"lc-wrap\"><svg class=\"lc\" id=\"chart\" viewBox=\"0 0 680 360\"><\/svg><\/div>\n    <div class=\"live\">\n      <div class=\"livec m\"><p class=\"k\" data-t=\"l_mean\"><\/p><div class=\"v\" id=\"l-mean\"><\/div><\/div>\n      <div class=\"livec f\"><p class=\"k\" data-t=\"l_floor\"><\/p><div class=\"v\" id=\"l-floor\"><\/div><\/div>\n    <\/div>\n    <div class=\"verdict\">\n      <div class=\"vc m\"><h3 data-t=\"v_m_h\"><\/h3><div class=\"pick\" id=\"v-m-pick\"><\/div><p id=\"vmp\"><\/p><\/div>\n      <div class=\"vc f\"><h3 data-t=\"v_f_h\"><\/h3><div class=\"pick\" id=\"v-f-pick\"><\/div><p id=\"vfp\"><\/p><\/div>\n    <\/div>\n    <p class=\"note\" id=\"s-note\"><\/p>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  try{var st=localStorage.getItem('mm_theme'); if(st) document.documentElement.setAttribute('data-theme',st);}catch(e){}\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme'); if(a) return a; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}\n  var LANG='fr'; try{var sl=localStorage.getItem('mm_lang'); if(sl) LANG=sl;}catch(e){}\n  function nf(){return LANG==='fr'?'fr-FR':'en-US';}\n\n  var MMAX=100, FMIN=20;   // k€\n  var rho=50, k=50, view='offre';   // view: 'offre' (seau percé) | 'demande' (multiplicateur)\n  function M(r,kk){ return view==='demande' ? MMAX*(1 + 0.6*kk*r*(2-r) - 0.15*r*r) : MMAX*(1 - kk*r*r); }\n  function F(r,kk){ return FMIN+(M(r,kk)-FMIN)*r; }\n  function argmaxR(fn,kk){var best=0,bv=-1e9;for(var r=0;r<=1.0001;r+=0.002){var v=fn(r,kk);if(v>bv){bv=v;best=r;}}return best;}\n  function rhoStar(kk){ return argmaxR(F,kk); }   // optimum maximin (plancher)\n  function mStar(kk){ return argmaxR(M,kk); }      // optimum utilitariste (moyenne)\n\n  var COLM='#D9840E', COLF='#4F46E5';\n  var T={fr:{\n    eyebrow:\"Macroéconomie écologique · Évaluer les inégalités : Rawls\",\n    title:\"Maximin ou moyenne ? Deux critères, deux choix\",\n    sub:\"Face à une même répartition, deux façons de juger. L'une regarde la <b>taille du gâteau<\/b>, l'autre le sort du <b>plus mal loti<\/b>. Elles ne désignent presque jamais la même société.\",\n    i_title:\"Deux critères de justice\",\n    i_1:\"Comment choisir entre plusieurs répartitions possibles ? Deux règles s'affrontent :\",\n    c_m_h:\"La moyenne\",c_m_w:\"critère utilitariste\",c_m_p:\"On choisit la répartition au <b>revenu moyen<\/b> le plus élevé — la richesse totale produite, quelle que soit sa distribution.\",\n    c_f_h:\"Le maximin\",c_f_w:\"critère de Rawls\",c_f_p:\"On choisit la répartition où le <b>plus pauvre<\/b> est le mieux loti — on maximise le plancher, le minimum garanti.\",\n    i_2:\"Ces deux critères s'opposent — <b>ou non<\/b> — selon un point de théorie économique : la redistribution <b>réduit-elle<\/b> ou <b>augmente-t-elle<\/b> la production totale ? Deux visions s'affrontent ; basculez de l'une à l'autre dans le simulateur.\",i_3:\"Une précision : l'idée que taxer les riches réduirait l'<b>investissement<\/b> faute d'<b>épargne<\/b> n'a pas de fondement macroéconomique — la monnaie naît du crédit, et c'est l'investissement qui engendre l'épargne, non l'inverse. Il ne reste donc, côté coût, que les effets d'<b>incitation<\/b> et les <b>frictions<\/b> (vision offre) ; et côté bénéfice, l'effet <b>multiplicateur<\/b> de la demande (vision demande).\",vo_h:\"Vision offre — le « seau percé »\",vo_s:\"La redistribution a un coût (incitations, frictions) : le gâteau rétrécit.\",vd_h:\"Vision demande — le multiplicateur\",vd_s:\"La redistribution soutient la demande (forte PmC en bas) : le gâteau grossit.\",klab_o:\"Ampleur de la fuite (le « seau percé »)\",klab_d:\"Force du multiplicateur (le seau se remplit)\",vmp_o:\"Il maximise la <b>moyenne<\/b>. Comme toute redistribution rogne le gâteau, il s'arrête tôt — un plancher très bas.\",vmp_d:\"Il maximise la <b>moyenne<\/b>. Mais ici la redistribution <b>fait grossir<\/b> le gâteau : l'utilitariste redistribue lui aussi largement.\",vfp_o:\"Il maximise le <b>plancher<\/b> : il redistribue tant que cela aide les plus pauvres, mais <b>pas au-delà<\/b> — trop de fuite finirait par les appauvrir.\",vfp_d:\"Il maximise le <b>plancher<\/b> : redistribuer élève <i>à la fois<\/i> le plancher <i>et<\/i> la moyenne, il pousse donc la redistribution loin.\",note_o:\"<b>Vision offre : les deux critères s'opposent.<\/b> L'utilitariste veut peu redistribuer, Rawls davantage — c'est le principe de différence : viser le niveau d'inégalité qui <b>maximise le sort des plus démunis<\/b>.\",note_d:\"<b>Vision demande : les deux critères convergent.<\/b> Redistribuer élève à la fois le plancher et la production — l'arbitrage efficacité/équité <b>disparaît<\/b>. C'est la logique des approches post-keynésiennes (croissance <i>wage-led<\/i>).\",\n    s_title:\"Le simulateur : où chaque critère place-t-il son optimum ?\",\n    s_expl:\"Réglez le niveau de <b>redistribution<\/b> (et le coût de cette redistribution). Deux courbes : le <b>revenu moyen<\/b> et le <b>plancher<\/b>. Chaque critère vise le sommet de <i>sa<\/i> courbe.\",\n    rho_lab:\"Redistribution (des riches vers les pauvres)\",\n    k_lab:\"Coût de la redistribution (le « seau percé »)\",\n    ax_x:\"redistribution (%)\",ax_y:\"revenu (k€)\",\n    lgM:\"revenu moyen\",lgF:\"plancher\",\n    l_mean:\"revenu moyen ici\",l_floor:\"plancher ici\",\n    v_m_h:\"L'utilitariste choisit\",v_m_p:\"Il maximise la <b>moyenne<\/b> : toute redistribution rogne le gâteau, il s'arrête donc au minimum. Résultat : moyenne élevée, mais un plancher très bas.\",\n    v_f_h:\"Rawls (maximin) choisit\",v_f_p:\"Il maximise le <b>plancher<\/b> : il redistribue tant que cela aide les plus pauvres — mais <b>pas au-delà<\/b>, car trop de redistribution rétrécit le gâteau et finit par les appauvrir aussi.\",\n    s_note:\"C'est le <b>principe de différence<\/b> : Rawls ne vise pas l'égalité parfaite, mais le niveau d'inégalité qui <b>maximise le sort des plus démunis<\/b>. Augmentez le <i>coût<\/i> de la redistribution : l'optimum de Rawls se rapproche de celui de l'utilitariste — quand réduire les inégalités nuit vraiment aux pauvres, Rawls lui-même y renonce.\"\n   },en:{\n    eyebrow:\"Ecological macroeconomics · Assessing inequality: Rawls\",\n    title:\"Maximin or average? Two criteria, two choices\",\n    sub:\"Facing the same distribution, two ways to judge. One looks at the <b>size of the pie<\/b>, the other at the fate of the <b>worst-off<\/b>. They almost never pick the same society.\",\n    i_title:\"Two criteria of justice\",\n    i_1:\"How to choose between possible distributions? Two rules compete:\",\n    c_m_h:\"The average\",c_m_w:\"utilitarian criterion\",c_m_p:\"You choose the distribution with the highest <b>average income<\/b> — total wealth produced, whatever its distribution.\",\n    c_f_h:\"Maximin\",c_f_w:\"Rawls's criterion\",c_f_p:\"You choose the distribution where the <b>poorest<\/b> is best off — you maximise the floor, the guaranteed minimum.\",\n    i_2:\"These two criteria clash — <b>or not<\/b> — depending on a point of economic theory: does redistribution <b>reduce<\/b> or <b>raise<\/b> total output? Two views compete; switch between them in the simulator.\",i_3:\"One clarification: the idea that taxing the rich would cut <b>investment<\/b> for lack of <b>saving<\/b> has no macroeconomic basis — money is created by credit, and it is investment that generates saving, not the other way round. So on the cost side only <b>incentive<\/b> effects and <b>frictions<\/b> remain (supply view); on the benefit side, the demand <b>multiplier<\/b> (demand view).\",vo_h:\"Supply view — the « leaky bucket »\",vo_s:\"Redistribution has a cost (incentives, frictions): the pie shrinks.\",vd_h:\"Demand view — the multiplier\",vd_s:\"Redistribution supports demand (high MPC at the bottom): the pie grows.\",klab_o:\"Size of the leak (the « leaky bucket »)\",klab_d:\"Strength of the multiplier (the bucket fills)\",vmp_o:\"They maximise the <b>average<\/b>. Since any redistribution shrinks the pie, they stop early — a very low floor.\",vmp_d:\"They maximise the <b>average<\/b>. But here redistribution <b>grows<\/b> the pie: the utilitarian also redistributes widely.\",vfp_o:\"They maximise the <b>floor<\/b>: they redistribute as long as it helps the poorest, but <b>no further<\/b> — too much leak would impoverish them too.\",vfp_d:\"They maximise the <b>floor<\/b>: redistributing raises <i>both<\/i> the floor <i>and<\/i> the average, so they push redistribution far.\",note_o:\"<b>Supply view: the two criteria clash.<\/b> The utilitarian wants little redistribution, Rawls more — the difference principle: aim for the level of inequality that <b>maximises the position of the worst-off<\/b>.\",note_d:\"<b>Demand view: the two criteria converge.<\/b> Redistribution raises both the floor and output — the efficiency/equity trade-off <b>vanishes<\/b>. This is the logic of post-Keynesian approaches (<i>wage-led<\/i> growth).\",\n    s_title:\"The simulator: where does each criterion place its optimum?\",\n    s_expl:\"Set the level of <b>redistribution<\/b> (and its cost). Two curves: <b>average income<\/b> and the <b>floor<\/b>. Each criterion aims for the top of <i>its<\/i> curve.\",\n    rho_lab:\"Redistribution (from rich to poor)\",\n    k_lab:\"Cost of redistribution (the « leaky bucket »)\",\n    ax_x:\"redistribution (%)\",ax_y:\"income (k€)\",\n    lgM:\"average income\",lgF:\"floor\",\n    l_mean:\"average income here\",l_floor:\"floor here\",\n    v_m_h:\"The utilitarian chooses\",v_m_p:\"They maximise the <b>average<\/b>: any redistribution shrinks the pie, so they stop at the minimum. Result: high average, but a very low floor.\",\n    v_f_h:\"Rawls (maximin) chooses\",v_f_p:\"They maximise the <b>floor<\/b>: they redistribute as long as it helps the poorest — but <b>no further<\/b>, since too much redistribution shrinks the pie and eventually impoverishes them too.\",\n    s_note:\"This is the <b>difference principle<\/b>: Rawls does not aim for perfect equality, but for the level of inequality that <b>maximises the position of the worst-off<\/b>. Raise the <i>cost<\/i> of redistribution: Rawls's optimum moves toward the utilitarian's — when reducing inequality truly hurts the poor, even Rawls gives it up.\"\n   }};\n\n  function eur(v){return v.toLocaleString(nf(),{maximumFractionDigits:0})+' k€';}\n\n  function draw(){\n    var d=T[LANG], svg=document.getElementById('chart');\n    var W=680,H=360,pL=52,pR=16,pT=18,pB=42, ymax=160;\n    var kk=k/100, r0=rho/100, rs=rhoStar(kk), ms=mStar(kk);\n    function X(v){return pL+v*(W-pL-pR);}         // v in [0,1]\n    function Y(v){return (H-pB)-v/ymax*(H-pT-pB);}\n    var g='';\n    for(var t=0;t<=160;t+=40){var yy=Y(t);g+='<line class=\"grid\" x1=\"'+pL+'\" y1=\"'+yy.toFixed(1)+'\" x2=\"'+(W-pR)+'\" y2=\"'+yy.toFixed(1)+'\"/><text class=\"ax\" x=\"'+(pL-7)+'\" y=\"'+(yy+3.5).toFixed(1)+'\" text-anchor=\"end\">'+t+'<\/text>';}\n    for(var x=0;x<=100;x+=25){var xx=X(x/100);g+='<text class=\"ax\" x=\"'+xx.toFixed(1)+'\" y=\"'+(H-pB+15)+'\" text-anchor=\"middle\">'+x+'%<\/text>';}\n    g+='<line class=\"axl\" x1=\"'+pL+'\" y1=\"'+(H-pB)+'\" x2=\"'+(W-pR)+'\" y2=\"'+(H-pB)+'\"/><line class=\"axl\" x1=\"'+pL+'\" y1=\"'+pT+'\" x2=\"'+pL+'\" y2=\"'+(H-pB)+'\"/>';\n    g+='<text class=\"axt\" transform=\"rotate(-90 14 '+((pT+H-pB)/2).toFixed(1)+')\" x=\"14\" y=\"'+((pT+H-pB)/2).toFixed(1)+'\" text-anchor=\"middle\">'+d.ax_y+'<\/text>';\n    g+='<text class=\"axt\" x=\"'+((pL+W-pR)/2).toFixed(1)+'\" y=\"'+(H-4)+'\" text-anchor=\"middle\">'+d.ax_x+'<\/text>';\n    function path(fn,col){var dd='';for(var i=0;i<=100;i++){var r=i/100,yy=Y(fn(r,kk));dd+=(i?' L ':'M ')+X(r).toFixed(1)+' '+yy.toFixed(1);}return '<path d=\"'+dd+'\" fill=\"none\" stroke=\"'+col+'\" stroke-width=\"2.6\"/>';}\n    g+=path(M,COLM)+path(F,COLF);\n    // current rho guide\n    g+='<line x1=\"'+X(r0).toFixed(1)+'\" y1=\"'+pT+'\" x2=\"'+X(r0).toFixed(1)+'\" y2=\"'+(H-pB)+'\" stroke=\"var(--faint)\" stroke-dasharray=\"4 4\" opacity=\"0.6\"/>';\n    g+='<circle cx=\"'+X(r0).toFixed(1)+'\" cy=\"'+Y(M(r0,kk)).toFixed(1)+'\" r=\"4.5\" fill=\"'+COLM+'\" stroke=\"var(--surface)\" stroke-width=\"2\"/>';\n    g+='<circle cx=\"'+X(r0).toFixed(1)+'\" cy=\"'+Y(F(r0,kk)).toFixed(1)+'\" r=\"4.5\" fill=\"'+COLF+'\" stroke=\"var(--surface)\" stroke-width=\"2\"/>';\n    // optima markers\n    g+='<circle cx=\"'+X(ms).toFixed(1)+'\" cy=\"'+Y(M(ms,kk)).toFixed(1)+'\" r=\"5.5\" fill=\"none\" stroke=\"'+COLM+'\" stroke-width=\"2.4\"/>';\n    g+='<circle cx=\"'+X(rs).toFixed(1)+'\" cy=\"'+Y(F(rs,kk)).toFixed(1)+'\" r=\"5.5\" fill=\"none\" stroke=\"'+COLF+'\" stroke-width=\"2.4\"/>';\n    // curve labels\n    g+='<text x=\"'+X(0.62).toFixed(1)+'\" y=\"'+(Y(M(0.62,kk))-8).toFixed(1)+'\" style=\"font-family:var(--font-b);font-size:12px;font-weight:600;fill:'+COLM+'\">'+d.lgM+'<\/text>';\n    g+='<text x=\"'+X(0.30).toFixed(1)+'\" y=\"'+(Y(F(0.30,kk))+18).toFixed(1)+'\" style=\"font-family:var(--font-b);font-size:12px;font-weight:600;fill:'+COLF+'\">'+d.lgF+'<\/text>';\n    svg.innerHTML=g;\n    // live + verdicts\n    document.getElementById('l-mean').textContent=eur(M(r0,kk));\n    document.getElementById('l-floor').textContent=eur(F(r0,kk));\n    document.getElementById('v-m-pick').textContent=Math.round(ms*100)+' % · '+d.lgM+' '+eur(M(ms,kk));\n    document.getElementById('v-f-pick').textContent=Math.round(rs*100)+' % · '+d.lgF+' '+eur(F(rs,kk));\n    document.getElementById('rho-v').textContent=rho+' %';\n    document.getElementById('k-v').textContent=k+' %';\n  }\n\n  document.getElementById('rho').addEventListener('input',function(){rho=parseInt(this.value,10);draw();});\n  document.getElementById('k').addEventListener('input',function(){k=parseInt(this.value,10);draw();});\n\n  function buildView(){var d=T[LANG],box=document.getElementById('viewtg');box.innerHTML='';\n    [['offre',d.vo_h,d.vo_s],['demande',d.vd_h,d.vd_s]].forEach(function(o){\n      var btn=document.createElement('button');btn.className='vbtn'+(view===o[0]?' on':'');\n      btn.innerHTML='<b>'+o[1]+'<\/b><span>'+o[2]+'<\/span>';\n      btn.onclick=function(){view=o[0];buildView();applyViewText();draw();};\n      box.appendChild(btn);});\n  }\n  function applyViewText(){var d=T[LANG];\n    document.getElementById('k-name').innerHTML = view==='offre'? d.klab_o : d.klab_d;\n    document.getElementById('vmp').innerHTML   = view==='offre'? d.vmp_o  : d.vmp_d;\n    document.getElementById('vfp').innerHTML   = view==='offre'? d.vfp_o  : d.vfp_d;\n    document.getElementById('s-note').innerHTML= view==='offre'? d.note_o : d.note_d;\n  }\n  function applyLang(){\n    var d=T[LANG]; document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){var kk=el.getAttribute('data-t'); if(d[kk]!=null) el.innerHTML=d[kk];});\n    document.getElementById('langlbl').textContent=LANG.toUpperCase();\n    document.getElementById('rho').value=rho; document.getElementById('k').value=k;\n    document.title = LANG==='fr' ? \"Maximin ou moyenne ?\" : \"Maximin or average?\";\n    buildView(); applyViewText(); draw();\n  }\n  document.getElementById('lang').addEventListener('click',function(){ LANG=LANG==='fr'?'en':'fr'; try{localStorage.setItem('mm_lang',LANG);}catch(e){} applyLang(); });\n  document.getElementById('theme').addEventListener('click',function(){ var n=effTheme()==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); try{localStorage.setItem('mm_theme',n);}catch(e){} draw(); });\n  applyLang();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "rentier-travailleur.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Rentier ou travailleur ?<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;--ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n    --accent:#B8860B;--ctry-stroke:rgba(20,32,42,.16);\n    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);\n    --font-d:\"Spectral\",\"IBM Plex Sans\",Georgia,serif;--font-b:\"IBM Plex Sans\",system-ui,sans-serif;--font-m:\"IBM Plex Mono\",ui-monospace,monospace;}\n  :root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;--ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --accent:#D4A93B;--ctry-stroke:rgba(231,238,243,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);}}\n  :root[data-theme=\"dark\"]{\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;--ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --accent:#D4A93B;--ctry-stroke:rgba(231,238,243,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);}\n\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}\n  .wrap{max-width:940px;margin:0 auto;padding-block:26px 46px;padding-inline:20px;}\n  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}\n  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500;margin:0 0 6px;}\n  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.7vw,42px);line-height:1.03;margin:0;letter-spacing:-.015em;text-wrap:balance;}\n  .sub{color:var(--muted);font-size:15px;margin:9px 0 0;max-width:76ch;text-wrap:pretty;} .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}\n  .toggles{display:flex;gap:8px;flex-shrink:0;}\n  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}\n  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}\n  .tg:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 19px;margin-top:16px;}\n  .sectitle{font-family:var(--font-d);font-weight:600;font-size:20px;margin:0 0 3px;letter-spacing:-.01em;text-wrap:balance;}\n  .secsub{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:82ch;text-wrap:pretty;} .secsub b{color:var(--ink);} .secsub i{font-family:var(--font-d);font-style:italic;}\n  .lc-wrap{position:relative;width:100%;} svg.lc{display:block;width:100%;height:auto;} .lc text{font-family:var(--font-m);}\n  .lc .ax{fill:var(--faint);font-size:10.5px;} .lc .axt{fill:var(--faint);font-size:10.5px;} .lc .grid{stroke:var(--grid);stroke-width:1;}\n  .lc .axl{stroke:var(--line);stroke-width:1.2;} .lc .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}\n  .lc .gd{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3;} .lc .gdot{stroke:var(--surface);stroke-width:1.5;}\n  .tip{position:absolute;pointer-events:none;z-index:5;background:var(--ink);color:var(--surface);font-family:var(--font-m);font-size:12px;padding:6px 9px;border-radius:7px;white-space:nowrap;opacity:0;transition:opacity .08s;box-shadow:0 4px 14px rgba(0,0,0,.25);}\n  .tip.on{opacity:1;} .tip b{color:var(--surface);font-weight:600;}\n  .seg2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}\n  .sb{font-family:var(--font-m);font-size:11.5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;line-height:1.1;}\n  .sb:hover{color:var(--ink);border-color:var(--faint);} .sb.on{color:var(--ink);border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent);background:var(--surface);}\n  .cleg{display:flex;gap:7px;flex-wrap:wrap;} .cchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:11.5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:20px;padding:4px 11px;cursor:pointer;}\n  .cchip .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;} .cchip.off{opacity:.42;} .cchip.off .dot{background:var(--faint)!important;} .cchip:hover{border-color:var(--faint);color:var(--ink);}\n  .sellab{font-family:var(--font-m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 9px;}\n  .mapnote{font-family:var(--font-m);font-size:10.5px;color:var(--faint);margin-top:14px;text-wrap:pretty;line-height:1.6;} .mapnote b{color:var(--muted);font-weight:600;}\n\n  .pk-ctrls{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;} @media(max-width:640px){.pk-ctrls{grid-template-columns:1fr 1fr;}}\n  .pk-ctrl .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px;} .pk-ctrl .name{font-size:12.5px;color:var(--ink);} .pk-ctrl .val{font-family:var(--font-m);font-size:12px;color:var(--accent);font-weight:500;white-space:nowrap;}\n  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:var(--grid);outline:none;} input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer;} input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:pointer;}\n  .pk-outs{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;}\n  .pk-out{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;}\n  .pk-out .k{font-family:var(--font-m);font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);margin:0 0 5px;}\n  .pk-out .v{font-family:var(--font-d);font-weight:600;font-size:23px;line-height:1;color:var(--ink);} .pk-out .v small{font-family:var(--font-b);font-size:12px;color:var(--muted);font-weight:500;}\n  .pk-note{font-size:13.5px;color:var(--muted);margin-top:15px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:11px 13px;text-wrap:pretty;} .pk-note b{color:var(--ink);font-weight:600;} .pk-note i{font-family:var(--font-d);font-style:italic;}\n  .pk-reset{margin-top:15px;font-family:var(--font-m);font-size:11.5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 13px;cursor:pointer;} .pk-reset:hover{color:var(--ink);border-color:var(--faint);}\n  .pk-intro p{font-size:14px;color:var(--muted);margin:0 0 12px;text-wrap:pretty;} .pk-intro p b{color:var(--ink);font-weight:600;} .pk-intro p i{font-family:var(--font-d);font-style:italic;}\n  .pk-defs{display:grid;gap:9px;margin:0 0 14px;} .pk-defs .d{display:flex;gap:12px;align-items:baseline;font-size:13.5px;color:var(--muted);text-wrap:pretty;} .pk-defs .d .t{font-family:var(--font-d);font-style:italic;font-size:17px;color:var(--accent);min-width:36px;flex-shrink:0;text-align:center;} .pk-defs .d b{color:var(--ink);font-weight:600;}\n  .pk-laws{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 14px;} .pk-laws>div{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:var(--font-m);font-size:17px;color:var(--ink);} .pk-laws .lb{display:block;font-family:var(--font-b);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:5px;} .pk-laws .ln2{display:block;font-family:var(--font-b);font-size:11.5px;color:var(--muted);margin-top:5px;}\n  .ss-bar{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;margin-bottom:8px;} .ss-bar .bl{font-family:var(--font-m);font-size:12px;color:var(--muted);text-align:right;} .ss-bar .bt{background:var(--grid);border-radius:6px;height:26px;overflow:hidden;} .ss-bar .bf{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-family:var(--font-m);font-size:11.5px;border-radius:6px;transition:width .18s;min-width:34px;}\n  .pk-verdict{font-family:var(--font-d);font-size:15px;color:var(--ink);margin-top:15px;text-wrap:pretty;line-height:1.45;} .pk-verdict b{color:var(--accent);} .pk-verdict i{font-style:italic;}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <div><p class=\"eyebrow\" data-t=\"eyebrow\"><\/p><h1 data-t=\"title\"><\/h1><p class=\"sub\" data-t=\"sub\"><\/p><\/div>\n    <div class=\"toggles\"><button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button><button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button><\/div>\n  <\/header>\n  <section class=\"card\"><div class=\"pk-ctrls\" id=\"ctrls\"><\/div><div class=\"seg2\" id=\"scale\"><\/div><div class=\"lc-wrap\"><svg class=\"lc\" id=\"chart\" viewBox=\"0 0 680 360\"><\/svg><div class=\"tip\" id=\"tip\"><\/div><\/div><div class=\"pk-outs\" id=\"outs\"><\/div><p class=\"pk-note\" id=\"note\" data-t=\"note\"><\/p><button class=\"pk-reset\" id=\"reset\" data-t=\"reset\"><\/button><\/section>\n\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\n\n  try{var st=localStorage.getItem('rent_theme'); if(st) document.documentElement.setAttribute('data-theme',st);}catch(e){}\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme'); if(a) return a; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}\n  var LANG='fr'; try{var sl=localStorage.getItem('rent_lang'); if(sl) LANG=sl;}catch(e){}\n\n  function niceCeil(v){var e=Math.pow(10,Math.floor(Math.log10(v)));var m=v/e;var n=m<=1?1:m<=1.5?1.5:m<=2?2:m<=2.5?2.5:m<=3?3:m<=4?4:m<=5?5:m<=6?6:m<=8?8:10;return n*e;}\n  var VB={W:680,H:360,padL:58,padR:16,padT:16,padB:42};\n  function draw(svgId, series, opt){\n    var svg=document.getElementById(svgId);var W=VB.W,H=VB.H,pL=VB.padL,pR=VB.padR,pT=VB.padT,pB=VB.padB;\n    var xs=[],ys=[]; series.forEach(function(s){s.pts.forEach(function(p){xs.push(p[0]);ys.push(p[1]);});});\n    if(!xs.length){svg.innerHTML=''; return null;}\n    var xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs),ymaxRaw=Math.max.apply(null,ys),ymin,ymax,logy=!!opt.log;\n    if(logy){var pos=ys.filter(function(v){return v>0;});var yminRaw=Math.min.apply(null,pos);ymin=Math.pow(10,Math.floor(Math.log10(yminRaw)));ymax=Math.pow(10,Math.ceil(Math.log10(ymaxRaw)));}\n    else {ymin=(opt.ymin!=null?opt.ymin:0);ymax=(opt.ymax!=null?opt.ymax:niceCeil(ymaxRaw));}\n    function X(v){return pL+(xmax===xmin?0:(v-xmin)/(xmax-xmin))*(W-pL-pR);}\n    function Y(v){if(logy){var lo=Math.log10(ymin),hi=Math.log10(ymax);return (H-pB)-(Math.log10(Math.max(v,ymin))-lo)/(hi-lo)*(H-pT-pB);}return (H-pB)-(v-ymin)/(ymax-ymin)*(H-pT-pB);}\n    var g='',yticks=[];\n    if(logy){for(var e=Math.log10(ymin);e<=Math.log10(ymax)+1e-9;e++)yticks.push(Math.pow(10,e));}else{var step=(ymax-ymin)/5;for(var i=0;i<=5;i++)yticks.push(ymin+step*i);}\n    yticks.forEach(function(t){var yy=Y(t);g+='<line class=\"grid\" x1=\"'+pL+'\" y1=\"'+yy.toFixed(1)+'\" x2=\"'+(W-pR)+'\" y2=\"'+yy.toFixed(1)+'\"/>';g+='<text class=\"ax\" x=\"'+(pL-7)+'\" y=\"'+(yy+3.5).toFixed(1)+'\" text-anchor=\"end\">'+opt.yfmt(t)+'<\/text>';});\n    var span=xmax-xmin,stepx=span<=12?2:span<=40?10:span<=120?20:40,x0=Math.ceil(xmin/stepx)*stepx;\n    for(var xt=x0;xt<=xmax;xt+=stepx){var xx=X(xt);g+='<line class=\"grid\" x1=\"'+xx.toFixed(1)+'\" y1=\"'+pT+'\" x2=\"'+xx.toFixed(1)+'\" y2=\"'+(H-pB)+'\"/>';g+='<text class=\"ax\" x=\"'+xx.toFixed(1)+'\" y=\"'+(H-pB+15)+'\" text-anchor=\"middle\">'+xt+'<\/text>';}\n    g+='<line class=\"axl\" x1=\"'+pL+'\" y1=\"'+(H-pB)+'\" x2=\"'+(W-pR)+'\" y2=\"'+(H-pB)+'\"/>';g+='<line class=\"axl\" x1=\"'+pL+'\" y1=\"'+pT+'\" x2=\"'+pL+'\" y2=\"'+(H-pB)+'\"/>';\n    g+='<text class=\"axt\" transform=\"rotate(-90 13 '+((pT+H-pB)/2).toFixed(1)+')\" x=\"13\" y=\"'+((pT+H-pB)/2).toFixed(1)+'\" text-anchor=\"middle\">'+opt.ylab+'<\/text>';\n    series.forEach(function(s){if(!s.pts.length)return;var d='M '+X(s.pts[0][0]).toFixed(1)+' '+Y(s.pts[0][1]).toFixed(1);for(var k=1;k<s.pts.length;k++)d+=' L '+X(s.pts[k][0]).toFixed(1)+' '+Y(s.pts[k][1]).toFixed(1);g+='<path class=\"ln\" d=\"'+d+'\" stroke=\"'+s.color+'\"'+(s.dash?' stroke-dasharray=\"6 4\"':'')+'/>';});\n    svg.innerHTML=g;return {X:X,Y:Y,xmin:xmin,xmax:xmax,pL:pL,pR:pR,pT:pT,pB:pB,W:W,H:H,series:series};\n  }\n  function wireHover(svgId,tipId,sc,fmt,xlabel){\n    var svg=document.getElementById(svgId),tip=document.getElementById(tipId);\n    if(!sc){tip.classList.remove('on');svg.onpointermove=null;return;}\n    function clearG(){var gl=document.getElementById(svgId+'-g');if(gl)gl.innerHTML='';}\n    svg.onpointermove=function(e){var r=svg.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*sc.W;\n      if(mx<sc.pL||mx>sc.W-sc.pR){tip.classList.remove('on');clearG();return;}\n      var xv=sc.xmin+(mx-sc.pL)/(sc.W-sc.pL-sc.pR)*(sc.xmax-sc.xmin),year=Math.round(xv),rows='',gx=null,dots='',tol=Math.max(2,(sc.xmax-sc.xmin)*0.03);\n      sc.series.forEach(function(s){var best=null,bd=1e9;s.pts.forEach(function(p){var dd=Math.abs(p[0]-year);if(dd<bd){bd=dd;best=p;}});\n        if(best&&bd<=tol){gx=sc.X(best[0]);dots+='<circle class=\"gdot\" cx=\"'+sc.X(best[0]).toFixed(1)+'\" cy=\"'+sc.Y(best[1]).toFixed(1)+'\" r=\"3.5\" fill=\"'+s.color+'\"/>';\n          rows+='<div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:'+s.color+'\">\\u25CF<\/span><span style=\"flex:1\">'+s.label+'<\/span><b>'+fmt(best[1])+'<\/b><\/div>';}});\n      var gl=document.getElementById(svgId+'-g');\n      if(gx!=null){var guide='<line class=\"gd\" x1=\"'+gx.toFixed(1)+'\" y1=\"'+sc.pT+'\" x2=\"'+gx.toFixed(1)+'\" y2=\"'+(sc.H-sc.pB)+'\"/>'+dots;if(!gl){gl=document.createElementNS('http://www.w3.org/2000/svg','g');gl.setAttribute('id',svgId+'-g');svg.appendChild(gl);}gl.innerHTML=guide;}else clearG();\n      tip.innerHTML='<b>'+(xlabel?xlabel(year):year)+'<\/b>'+rows;var x=e.clientX-r.left+14,ty=e.clientY-r.top+14;if(x>r.width-150)x=e.clientX-r.left-tip.offsetWidth-14;tip.style.left=x+'px';tip.style.top=ty+'px';tip.classList.add('on');};\n    svg.onpointerleave=function(){tip.classList.remove('on');clearG();};\n  }\n  function nf(){return LANG==='fr'?'fr-FR':'en-US';}\n\n  var DEF={sal:50000,g:1,W0:1000000,r:10,spend:50,years:15,log:false};\n  var st=Object.assign({},DEF);\n  var T={fr:{eyebrow:\"Macro\\u00e9conomie \\u00e9cologique \\u00b7 Le mod\\u00e8le de Piketty\",title:\"Rentier ou travailleur ? La course sur 15 ans\",sub:\"<b>M. A<\/b> est salari\\u00e9 : il gagne 50 000 \\u20ac, index\\u00e9s sur la croissance <i>g<\/i>. <b>M. B<\/b> est rentier : il a h\\u00e9rit\\u00e9 d'un capital plac\\u00e9 au rendement <i>r<\/i>, dont il d\\u00e9pense une partie et r\\u00e9investit le reste. Faites varier les param\\u00e8tres et observez qui prend l'avantage.\",\n    c_sal:\"Salaire de M. A\",c_g:\"Croissance g (indexation du salaire)\",c_W0:\"H\\u00e9ritage de M. B\",c_r:\"Rendement r du capital\",c_spend:\"Part du revenu que M. B d\\u00e9pense\",c_years:\"Dur\\u00e9e\",\n    axy:\"revenu annuel (\\u20ac)\",wk:\"M. A \\u2014 revenu du travail\",rn:\"M. B \\u2014 revenu du capital\",lin:\"Lin\\u00e9aire\",log:\"Log\",yr:\"ans\",yrx:\"Ann\\u00e9e\",\n    o_wk:\"Revenu final de M. A\",o_rn:\"Revenu final de M. B\",o_ratio:\"Rapport A / B\",o_gr:\"Croissance du patrimoine de M. B\",reset:\"↺ Réinitialiser\",\n    note:\"M\\u00eame en d\\u00e9pensant la moiti\\u00e9 de ses revenus, le patrimoine de M. B cro\\u00eet \\u00e0 r\\u00d7(1\\u2212d\\u00e9pense) = <b>{gr} %<\/b> par an, plus vite que le salaire de M. A (g = <b>{g} %<\/b>). C'est le c\\u0153ur du mod\\u00e8le de Piketty : quand <i>r > g<\/i>, le capital h\\u00e9rit\\u00e9 l'emporte sur le travail et les patrimoines se concentrent.\"},\n   en:{eyebrow:\"Ecological macroeconomics \\u00b7 Piketty's model\",title:\"Rentier or worker? The 15-year race\",sub:\"<b>Mr. A<\/b> is a worker: he earns \\u20ac50,000, indexed to growth <i>g<\/i>. <b>Mr. B<\/b> is a rentier: he inherited capital invested at return <i>r<\/i>, spends part of it and reinvests the rest. Vary the parameters and watch who pulls ahead.\",\n    c_sal:\"Mr. A's salary\",c_g:\"Growth g (salary indexation)\",c_W0:\"Mr. B's inheritance\",c_r:\"Return r on capital\",c_spend:\"Share of income Mr. B spends\",c_years:\"Duration\",\n    axy:\"annual income (\\u20ac)\",wk:\"Mr. A \\u2014 labour income\",rn:\"Mr. B \\u2014 capital income\",lin:\"Linear\",log:\"Log\",yr:\"yr\",yrx:\"Year\",\n    o_wk:\"Mr. A's final income\",o_rn:\"Mr. B's final income\",o_ratio:\"Ratio A / B\",o_gr:\"Growth of Mr. B's wealth\",reset:\"↺ Reset\",\n    note:\"Even spending half his income, Mr. B's wealth grows at r\\u00d7(1\\u2212spend) = <b>{gr} %<\/b> a year, faster than Mr. A's salary (g = <b>{g} %<\/b>). This is the heart of Piketty's model: when <i>r > g<\/i>, inherited capital beats labour and wealth concentrates.\"}};\n  function fmtE(v){return Math.round(v).toLocaleString(nf())+' \\u20ac';}\n  function series(){var A=[],B=[],gr=st.r*(1-st.spend/100)/100;for(var t=0;t<=st.years;t++){A.push([t,st.sal*Math.pow(1+st.g/100,t)]);B.push([t,st.W0*Math.pow(1+gr,t)*st.r/100]);}return {A:A,B:B,gr:gr};}\n  function out(k,v){return '<div class=\"pk-out\"><p class=\"k\">'+k+'<\/p><div class=\"v\">'+v+'<\/div><\/div>';}\n  function render(){var d=T[LANG],s=series();\n    var sc=draw('chart',[{name:'A',label:d.wk,color:'#2A78D6',pts:s.A},{name:'B',label:d.rn,color:'#B8860B',pts:s.B}],{log:st.log,ylab:d.axy,yfmt:function(v){return v>=1000?(Math.round(v/1000)+'k'):(''+Math.round(v));}});\n    wireHover('chart','tip',sc,fmtE,function(y){return d.yrx+' '+y;});\n    var fA=s.A[s.A.length-1][1],fB=s.B[s.B.length-1][1];\n    document.getElementById('outs').innerHTML=out(d.o_wk,fmtE(fA))+out(d.o_rn,fmtE(fB))+out(d.o_ratio,(fA/fB).toLocaleString(nf(),{maximumFractionDigits:2}))+out(d.o_gr,(100*s.gr).toLocaleString(nf(),{maximumFractionDigits:1})+' %');\n    document.getElementById('note').innerHTML=d.note.replace('{gr}',(100*s.gr).toLocaleString(nf(),{maximumFractionDigits:1})).replace('{g}',st.g.toLocaleString(nf(),{maximumFractionDigits:1}));}\n  var CTL=[['sal',10000,150000,5000],['g',0,5,0.1],['W0',0,3000000,100000],['r',0,15,0.5],['spend',0,100,5],['years',5,30,1]];\n  function fmtCtl(k){var d=T[LANG];if(k==='sal')return fmtE(st.sal);if(k==='W0')return fmtE(st.W0);if(k==='g'||k==='r')return st[k].toLocaleString(nf(),{maximumFractionDigits:1})+' %';if(k==='spend')return st.spend+' %';return st.years+' '+d.yr;}\n  function buildCtrls(){var d=T[LANG],box=document.getElementById('ctrls');box.innerHTML='';CTL.forEach(function(c){var k=c[0];var row=document.createElement('div');row.className='pk-ctrl';row.innerHTML='<div class=\"lab\"><span class=\"name\">'+d['c_'+k]+'<\/span><span class=\"val\" id=\"v_'+k+'\"><\/span><\/div><input type=\"range\" id=\"i_'+k+'\" min=\"'+c[1]+'\" max=\"'+c[2]+'\" step=\"'+c[3]+'\">';box.appendChild(row);});CTL.forEach(function(c){var k=c[0],el=document.getElementById('i_'+k);el.value=st[k];document.getElementById('v_'+k).textContent=fmtCtl(k);el.addEventListener('input',function(){st[k]=parseFloat(this.value);document.getElemen de trois grandeurs et de deux « lois ».<\/p><div class=\\'pk-defs\\'><div class=\\'d\\'><span class=\\'t\\'>β<\/span><span><b>rapport capital / revenu.<\/b> Le patrimoine total du pays rapporté à son revenu annuel. β = 6 signifie 6 années de revenu accumulées en patrimoine. C'est une <b>perspective de stock<\/b>.<\/span><\/div><div class=\\'d\\'><span class=\\'t\\'>α<\/span><span><b>part du capital.<\/b> La fraction du revenu national qui rémunère les propriétaires du capital — le reste rémunère le travail. C'est une <b>perspective de flux<\/b>.<\/span><\/div><div class=\\'d\\'><span class=\\'t\\'>r<\/span><span><b>rendement du capital.<\/b> Ce que rapporte le capital chaque année (loyers, dividendes, intérêts, plus-values) — de l\\'ordre de 4-5 % dans l\\'histoire.<\/span><\/div><div class=\\'d\\'><span class=\\'t\\'>s·g<\/span><span><b>épargne et croissance.<\/b> La part du revenu épargnée chaque année, et le taux de croissance de l\\'économie.<\/span><\/div><\/div><div class=\\'pk-laws\\'><div><span class=\\'lb\\'>1ʳᵉ loi<\/span>α = r × β<span class=\\'ln2\\'>identité comptable<\/span><\/div><div><span class=\\'lb\\'>2ᵉ loi<\/span>β = s / g<span class=\\'ln2\\'>équilibre de long terme<\/span><\/div><\/div><p><b>β = un stock, α = un flux.<\/b> β mesure le <b>patrimoine accumulé<\/b> (un stock, en années de revenu) ; α la <b>part du revenu annuel<\/b> qui va au capital (un flux). Le rendement <i>r<\/i> fait le pont entre les deux : α = r × β.<\/p><p><b>La logique.<\/b> Quand la croissance ralentit, le patrimoine accumulé (β = s/g) gonfle, donc la part du capital (α = r × β) augmente ; comme le capital est très concentré, les inégalités se creusent. Et tant que <i>r > g<\/i>, le patrimoine croît plus vite que l\\'économie : il fait boule de neige.<\/p>\",title:\"\\u03b2 = s / g : la croissance, amortisseur des in\\u00e9galit\\u00e9s\",sub:\"La <b>deuxi\\u00e8me loi fondamentale<\/b> de Piketty : \\u00e0 long terme, le rapport capital/revenu <i>\\u03b2<\/i> \\u00e9gale le taux d'\\u00e9pargne <i>s<\/i> divis\\u00e9 par le taux de croissance <i>g<\/i>. La <b>premi\\u00e8re loi<\/b> \\u03b1 = r\\u00d7\\u03b2 en d\\u00e9duit la part du capital dans le revenu.\",\n    c_s:\"Taux d'\\u00e9pargne s\",c_g:\"Taux de croissance g\",c_r:\"Rendement du capital r\",axy:\"\\u03b2 = capital / revenu (ann\\u00e9es de PIB)\",leg:\"\\u03b2 = s / g\",yr:\"ans\",\n    o_beta:\"soit\",ofgdp:\"% du PIB\",o_alpha:\"part du capital \\u03b1\",\n    stock:\"stock\",flux:\"flux\",b_sub:\"= {p} % du PIB · le patrimoine accumulé\",a_sub:\"la part du revenu annuel qui va au capital\",sim_sub:\"La courbe montre comment le rapport capital/revenu β = s/g varie avec la croissance g, à épargne s fixée. Le point marque votre scénario : abaissez g et regardez β grimper.\",summary:\"Avec <b>{s} %<\/b> du revenu épargnés et une croissance <b>{g} %<\/b>, le patrimoine se stabilise à <b>{beta} ans<\/b> de revenu (β, un stock). À un rendement <b>{r} %<\/b>, le capital capte <b>{alpha} %<\/b> du revenu national (α, un flux).\",note:\"Exemples (s = 12 %) : g = 3 % \\u2192 \\u03b2 = 4 ans ; g = 2 % \\u2192 \\u03b2 = 6 ans ; g = 1,5 % \\u2192 \\u03b2 = 8 ans. Quand <b>g \\u2192 0, \\u03b2 \\u2192 \\u221e<\/b> : la croissance dilue le poids du patrimoine h\\u00e9rit\\u00e9. \\u00c0 l'inverse, <b>croissance nulle + rendement positif = soci\\u00e9t\\u00e9 d'h\\u00e9ritiers<\/b> \\u2014 tout l'enjeu \\u00e9cologique d'un \\u00e9tat stationnaire \\u00ab juste \\u00bb.\"},\n   en:{eyebrow:\"Ecological macroeconomics \\u00b7 Piketty's model\",intro:\"<p style=\\'margin-top:0\\'>Piketty explains <b>long-run wealth concentration<\/b> with three quantities and two \\'laws\\'.<\/p><div class=\\'pk-defs\\'><div class=\\'d\\'><span class=\\'t\\'>β<\/span><span><b>capital / income ratio.<\/b> A country\\'s total wealth relative to its annual income. β = 6 means 6 years of income accumulated as wealth. A <b>stock<\/b> perspective.<\/span><\/div><div class=\\'d\\'><span class=\\'t\\'>α<\/span><span><b>capital share.<\/b> The fraction of national income paid to capital owners — the rest pays labour. A <b>flow<\/b> perspective.<\/span><\/div><div class=\\'d\\'><span class=\\'t\\'>r<\/span><span><b>return on capital.<\/b> What capital earns each year (rents, dividends, interest, capital gains) — around 4-5% historically.<\/span><\/div><div class=\\'d\\'><span class=\\'t\\'>s·g<\/span><span><b>saving and growth.<\/b> The share of income saved each year, and the economy\\'s growth rate.<\/span><\/div><\/div><div class=\\'pk-laws\\'><div><span class=\\'lb\\'>1st law<\/span>α = r × β<span class=\\'ln2\\'>accounting identity<\/span><\/div><div><span class=\\'lb\\'>2nd law<\/span>β = s / g<span class=\\'ln2\\'>long-run equilibrium<\/span><\/div><\/div><p><b>β is a stock, α is a flow.<\/b> β measures <b>accumulated wealth<\/b> (a stock, in years of income); α the <b>share of annual income<\/b> going to capital (a flow). The return <i>r<\/i> bridges them: α = r × β.<\/p><p><b>The logic.<\/b> When growth slows, accumulated wealth (β = s/g) swells, so capital\\'s share (α = r × β) rises; since capital is highly concentrated, inequality grows. And as long as <i>r > g<\/i>, wealth grows faster than the economy: it snowballs.<\/p>\",title:\"\\u03b2 = s / g: growth as a buffer against inequality\",sub:\"Piketty's <b>second fundamental law<\/b>: in the long run the capital/income ratio <i>\\u03b2<\/i> equals the savings rate <i>s<\/i> divided by the growth rate <i>g<\/i>. The <b>first law<\/b> \\u03b1 = r\\u00d7\\u03b2 gives capital's share of income.\",\n    c_s:\"Savings rate s\",c_g:\"Growth rate g\",c_r:\"Return on capital r\",axy:\"\\u03b2 = capital / income (years of GDP)\",leg:\"\\u03b2 = s / g\",yr:\"yr\",\n    o_beta:\"i.e.\",ofgdp:\"% of GDP\",o_alpha:\"capital share \\u03b1\",\n    stock:\"stock\",flux:\"flow\",b_sub:\"= {p}% of GDP · accumulated wealth\",a_sub:\"the share of annual income going to capital\",sim_sub:\"The curve shows how the capital/income ratio β = s/g varies with growth g, at fixed saving s. The dot marks your scenario: lower g and watch β climb.\",summary:\"With <b>{s}%<\/b> of income saved and <b>{g}%<\/b> growth, wealth stabilises at <b>{beta} years<\/b> of income (β, a stock). At a <b>{r}%<\/b> return, capital captures <b>{alpha}%<\/b> of national income (α, a flow).\",note:\"Examples (s = 12%): g = 3% \\u2192 \\u03b2 = 4 yr; g = 2% \\u2192 \\u03b2 = 6 yr; g = 1.5% \\u2192 \\u03b2 = 8 yr. As <b>g \\u2192 0, \\u03b2 \\u2192 \\u221e<\/b>: growth dilutes the weight of inherited wealth. Conversely, <b>zero growth + positive return = a society of heirs<\/b> \\u2014 the ecological crux of a \\\"fair\\\" steady state.\"}};\n  function out(k,v){return '<div class=\"pk-out\"><p class=\"k\">'+k+'<\/p><div class=\"v\">'+v+'<\/div><\/div>';}\n  function curve(){var a=[];for(var gg=0.5;gg<=5.0001;gg+=0.05){a.push([gg,Math.min(st.s/gg,20)]);}return a;}\n  function render(){var d=T[LANG],beta=st.s/st.g,alpha=st.r*beta;\n    var sc=draw('chart',[{name:'b',label:d.leg,color:'#0F766E',pts:curve()}],{log:false,ymin:0,ymax:20,ylab:d.axy,yfmt:function(v){return Math.round(v);}});\n    wireHover('chart','tip',sc,function(v){return v.toLocaleString(nf(),{maximumFractionDigits:1})+' '+d.yr;},function(x){return 'g = '+x.toLocaleString(nf(),{maximumFractionDigits:1})+' %';});\n    if(sc){var svg=document.getElementById('chart'),cx=sc.X(st.g),cy=sc.Y(Math.min(beta,20));svg.insertAdjacentHTML('beforeend','<line x1=\"'+cx.toFixed(1)+'\" y1=\"'+cy.toFixed(1)+'\" x2=\"'+cx.toFixed(1)+'\" y2=\"'+(sc.H-sc.pB)+'\" stroke=\"#0F766E\" stroke-dasharray=\"3 3\" opacity=\"0.55\"/><circle cx=\"'+cx.toFixed(1)+'\" cy=\"'+cy.toFixed(1)+'\" r=\"5.5\" fill=\"#0F766E\" stroke=\"var(--surface)\" stroke-width=\"2\"/>');}\n    var bs=beta.toLocaleString(nf(),{maximumFractionDigits:1});\n    document.getElementById('outs').innerHTML='<div class=\"pk-out\"><p class=\"k\">β = s / g <span class=\"tag tag-s\">'+d.stock+'<\/span><\/p><div class=\"v\">'+bs+' <small>'+d.yr+'<\/small><span class=\"sub2\">'+d.b_sub.replace('{p}',Math.round(beta*100))+'<\/span><\/div><\/div>'+'<div class=\"pk-out\"><p class=\"k\">α = r × β <span class=\"tag tag-f\">'+d.flux+'<\/span><\/p><div class=\"v\">'+Math.round(alpha)+' <small>%<\/small><span class=\"sub2\">'+d.a_sub+'<\/span><\/div><\/div>';\n    document.getElementById('summary').innerHTML=d.summary.replace('{s}',st.s.toLocaleString(nf(),{maximumFractionDigits:1})).replace('{g}',st.g.toLocaleString(nf(),{maximumFractionDigits:1})).replace('{beta}',bs).replace('{r}',st.r.toLocaleString(nf(),{maximumFractionDigits:1})).replace('{alpha}',Math.round(alpha));\n    document.getElementById('note').innerHTML=d.note;}\n  var CTL=[['s',5,25,0.5],['g',0.5,5,0.1],['r',1,10,0.5]];\n  function fmtCtl(k){return st[k].toLocaleString(nf(),{maximumFractionDigits:1})+' %';}\n  function buildCtrls(){var d=T[LANG],box=document.getElementById('ctrls');box.innerHTML='';CTL.forEach(function(c){var k=c[0];var row=document.createElement('div');row.className='pk-ctrl';row.innerHTML='<div class=\"lab\"><span class=\"name\">'+d['c_'+k]+'<\/span><span class=\"val\" id=\"v_'+k+'\"><\/span><\/div><input type=\"range\" id=\"i_'+k+'\" min=\"'+c[1]+'\" max=\"'+c[2]+'\" step=\"'+c[3]+'\">';box.appendChild(row);});CTL.forEach(function(c){var k=c[0],el=document.getElementById('i_'+k);el.value=st[k];document.getElementById('v_'+k).textContent=fmtCtl(k);el.addEventListener('input',function(){st[k]=parseFloat(this.value);document.getElementById('v_'+k).textContent=fmtCtl(k);render();});});}\n  function onTheme(){render();}\n  function applyLang(){var d=T[LANG];document.documentElement.lang=LANG;document.querySelectorAll('[data-t]').forEach(function(el){var k=el.getAttribute('data-t');if(d[k]!=null)el.innerHTML=d[k];});document.getElementById('langlbl').textContent=LANG.toUpperCase();document.title=d.title;buildCtrls();render();}\n\n\n  document.getElementById('lang').addEventListener('click',function(){ LANG=LA
