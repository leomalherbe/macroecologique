du PIB par habitant au coefficient de Gini — et montre qu'un même chiffre recouvre des répartitions opposées. Le deuxième les confronte aux <b>données mondiales<\/b> et déplace la question : l'inégalité se creuse-t-elle entre les pays, ou à l'intérieur de chacun ? Le troisième demande ce qu'une répartition <b>juste<\/b> voudrait dire, avec Rawls. Le quatrième examine ce qui, chez Piketty, fait <b>diverger<\/b> les patrimoines — et pourquoi une économie qui ralentit aggrave le problème. Treize outils interactifs, dans l'ordre du fil : chacun s'ouvre ici même, et l'on revient au fil d'un clic.", "parties": [{"titre": "Fondamentaux statistiques", "chapo": "On part de l'agrégat le plus courant : le <b>PIB<\/b>, que trois chemins de calcul — production, revenus, dépenses — font tomber sur le même total. Divisé par la population, il devient le chiffre avec lequel on compare les pays. Mais c'est une <b>moyenne<\/b>, et une moyenne ne dit presque rien d'une répartition : une poignée de très hauts revenus suffit à la tirer vers le haut pendant que la majorité reste en dessous. Pour voir la répartition elle-même, il faut d'autres instruments — les <b>quantiles<\/b>, la courbe de <b>Lorenz<\/b>, et le <b>Gini<\/b> qui résume d'un chiffre l'écart à l'égalité parfaite."}, {"titre": "Les inégalités dans les données", "chapo": "Les instruments en main, on regarde le monde réel. Le <b>Gini<\/b> d'abord, pays par pays aujourd'hui puis dans le temps : un seul chiffre pour situer chaque société. Ensuite les séries du WID, du PIB total à la part du <b>top 1 %<\/b>, qui montrent qu'un pays peut s'enrichir sans que la moitié la plus pauvre y gagne. Enfin la <b>courbe de l'éléphant<\/b>, qui dit qui a profité de la mondialisation — et pose la question décisive : l'inégalité se joue-t-elle <b>entre<\/b> les pays ou <b>à l'intérieur<\/b> de chacun ?"}, {"titre": "Évaluer les inégalités : le modèle de Rawls (1971)", "chapo": "Décrire une répartition ne dit pas encore si elle est juste. Rawls propose un test : choisir les règles de la société sans savoir quelle place on y occupera. Sous ce <b>voile d'ignorance<\/b>, on ne cherche plus à maximiser la moyenne mais le sort des <b>plus défavorisés<\/b> — c'est le critère du <b>maximin<\/b>. On l'éprouve d'abord sur trois sociétés fictives, où le classement s'inverse d'un bout à l'autre selon la règle retenue. Puis sur trois pays réels, où le renversement tient : celui qui l'emporte à la moyenne n'est pas celui que Rawls désigne. Les revenus y étant comptés avant impôts, reste la question qui suit : <b>combien redistribuer<\/b> ? La réponse dépend d'un point de théorie — la redistribution rétrécit-elle le gâteau, ou le fait-elle grossir ? — et l'on bascule de l'une à l'autre vision pour voir les deux critères s'opposer, puis se rejoindre."}, {"titre": "La divergence des patrimoines", "chapo": "Reste à comprendre pourquoi l'inégalité de <b>patrimoine<\/b> se creuse d'elle-même. On part d'un cas concret : deux personnes, quinze ans, et un écart qui se creuse sans que l'effort de personne ait changé. Le mécanisme vient ensuite — <b>β = s/g<\/b>, le patrimoine rapporté au revenu, qui enfle d'autant plus que la croissance faiblit. Puis l'histoire longue : <b>r − g<\/b>, l'écart qui concentre, que le XX<sup>e<\/sup> siècle avait resserré par l'impôt et par la croissance. C'est là que les deux séances se nouent — si les limites physiques ramènent g vers zéro, l'écart se rouvre, et la société redevient une société d'héritiers faute d'agir sur <b>r<\/b>."}], "cartes": [{"titre": "Le PIB et ses trois approches", "resume": "Production, revenus, dépenses : trois façons de compter, un seul total. Puis on divise par la population — et le chiffre qui sert à comparer les pays se révèle n'être qu'une <b>moyenne<\/b>."}, {"titre": "La moyenne trompeuse", "resume": "Répartissez une population en tranches de revenu et regardez la moyenne se faire tirer par le haut. Combien de personnes vivent en dessous ? L'écart à la <b>médiane<\/b> mesure la déformation."}, {"titre": "Quantiles et courbe de Lorenz", "resume": "On range la population du plus pauvre au plus riche et l'on cumule. La courbe s'éloigne de la diagonale à mesure que l'inégalité croît : cet écart, c'est le <b>coefficient de Gini<\/b>. Et deux sociétés très différentes peuvent afficher le même."}, {"titre": "Le Gini dans le monde", "resume": "Un chiffre par pays sur une carte — le Gini après redistribution — puis son évolution dans le temps, avant impôts. L'état des lieux d'abord, la trajectoire ensuite."}, {"titre": "PIB, revenus et inégalités", "resume": "Cinq séries pilotées par un même sélecteur de pays : PIB total, PIB par habitant, revenu médian, part des 50 % les plus pauvres, part du <b>top 1 %<\/b>. Un pays peut s'enrichir sans que la moitié la plus pauvre y gagne."}, {"titre": "La courbe de l'éléphant", "resume": "Qui a gagné à la mondialisation entre 1988 et 2008 ? La bosse asiatique, le creux des classes moyennes occidentales, la trompe du 1 %. Puis la question de fond : l'inégalité est-elle <b>entre<\/b> les pays ou <b>dans<\/b> les pays ?"}, {"titre": "Le voile d'ignorance et le maximin", "resume": "Le socle : le voile comme instrument d'impartialité, les deux principes de justice, puis le <b>maximin<\/b> mis à l'épreuve — trois règles de décision confrontées sur trois mondes dont on règle le plancher. Rawls ne regarde que le sort du plus défavorisé."}, {"titre": "Choisir entre trois sociétés", "resume": "Trois sociétés fictives, quatre quartiles, et un dé pour naître au hasard. Le maximin désigne A, l'utilitarisme désigne C : le classement <b>s'inverse d'un bout à l'autre<\/b>. Et A l'emporte dans trois quartiles sur quatre."}, {"titre": "Trois pays derrière le voile", "resume": "La même mécanique sur des données réelles — Espagne, Tchéquie, Bulgarie (WID). L'Espagne l'emporte à la moyenne, la <b>Tchéquie<\/b> au maximin : le renversement tient hors du cas d'école. Revenus avant impôts."}, {"titre": "Maximin ou moyenne ? Deux critères, deux choix", "resume": "Redistribuer rétrécit-il le gâteau ou le fait-il grossir ? Deux visions à basculer : le <b>seau percé<\/b> d'Okun, où la redistribution coûte, et l'effet <b>multiplicateur<\/b>, où elle soutient la demande. Selon celle qu'on retient, les deux critères s'opposent — ou tombent d'accord."}, {"titre": "Rentier ou travailleur ?", "resume": "M. A gagne 50 000 € par an, indexés sur la croissance. M. B hérite d'un million placé au rendement du capital et en réinvestit la moitié. Quinze ans plus tard l'écart est fait — sans que l'effort de personne ait changé."}, {"titre": "β = s/g, la croissance amortisseur", "resume": "Le cœur théorique, précédé des définitions : β est un <b>stock<\/b> — le patrimoine rapporté au revenu — quand α est un <b>flux<\/b>. On fait tendre <b>g<\/b> vers zéro et β s'envole : la divergence n'est pas un accident."}, {"titre": "r − g, l'écart qui concentre", "resume": "De l'Antiquité à 2100, le rendement du capital face à la croissance. Au XX<sup>e<\/sup> siècle seulement, <b>r<\/b> après impôt passe sous <b>g<\/b> — et les inégalités reculent. Puis on pousse g vers zéro, et l'écart se rouvre."}], "pied": "Parcours du cours de macroéconomie écologique — chaque carte ouvre l'outil interactif correspondant.", "licence": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — réutilisation et adaptation libres à des fins non commerciales, avec attribution et sous la même licence.", "nav_fil": "Le fil", "nav_ouvrir": "Ouvrir l’outil", "nav_prec": "Outil précédent", "nav_suiv": "Outil suivant", "nav_plein": "Plein écran (F)", "nav_plein_sortie": "Quitter le plein écran (Échap)", "nav_plein_astuce": "Approchez du haut pour revoir la barre · Échap pour sortir"}, "en": {"titre_onglet": "Ecological macroeconomics — Session 2: the thread of the course", "surtitre": "<b>Ecological macroeconomics<\/b> · Léo Malherbe · KEDGE Business School", "titre": "The thread of the course", "seance": "Session 2 — Inequality and justice", "chapo": "Four movements. The first sets up the <b>measuring instruments<\/b> — from GDP per capita to the Gini coefficient — and shows that one and the same figure can cover opposite distributions. The second tests them against <b>global data<\/b> and shifts the question: is inequality widening between countries, or within each of them? The third asks what a <b>just<\/b> distribution would mean, with Rawls. The fourth examines what, in Piketty, makes wealth <b>diverge<\/b> — and why an economy that slows down makes the problem worse. Thirteen interactive tools, in the order of the thread: each opens right here, and one click brings you back.", "parties": [{"titre": "Statistical fundamentals", "chapo": "We start from the most familiar aggregate: <b>GDP<\/b>, which three routes of calculation — output, income, expenditure — bring to one and the same total. Divided by population, it becomes the figure countries are compared with. But it is an <b>average<\/b>, and an average says almost nothing about a distribution: a handful of very high incomes is enough to pull it up while the majority stays below. To see the distribution itself you need other instruments — <b>quantiles<\/b>, the <b>Lorenz<\/b> curve, and the <b>Gini<\/b> index that sums up in one number the distance from perfect equality."}, {"titre": "Inequality in the data", "chapo": "Instruments in hand, we look at the real world. The <b>Gini<\/b> first, country by country today and then over time: a single figure to place each society. Then the WID series, from total GDP to the share of the <b>top 1 %<\/b>, showing that a country can grow richer without the poorer half gaining anything. Finally the <b>elephant curve<\/b>, which says who gained from globalisation — and raises the decisive question: does inequality play out <b>between<\/b> countries or <b>within<\/b> each of them?"}, {"titre": "Assessing inequality: Rawls's model (1971)", "chapo": "Describing a distribution does not yet say whether it is just. Rawls proposes a test: choose the rules of society without knowing which place you will occupy in it. Under this <b>veil of ignorance<\/b>, the aim is no longer to maximise the average but the lot of the <b>worst off<\/b> — the <b>maximin<\/b> criterion. We try it first on three fictional societies, where the ranking reverses end to end depending on the rule chosen. Then on three real countries, where the reversal holds: the one that wins on the average is not the one Rawls picks. Since incomes there are counted before tax, the next question follows: <b>how much to redistribute<\/b>? The answer turns on a point of theory — does redistribution shrink the pie or grow it? — and you switch from one view to the other to watch the two criteria clash, then agree."}, {"titre": "The divergence of wealth", "chapo": "It remains to understand why <b>wealth<\/b> inequality widens on its own. We start from a concrete case: two people, fifteen years, and a gap that opens without anyone's effort having changed. The mechanism comes next — <b>β = s/g<\/b>, wealth relative to income, swelling all the more as growth weakens. Then the long history: <b>r − g<\/b>, the gap that concentrates, which the 20th century had narrowed through taxation and growth. This is where the two sessions meet — if physical limits bring g back towards zero, the gap reopens, and society becomes a society of heirs again unless <b>r<\/b> is acted upon."}], "cartes": [{"titre": "GDP and its three approaches", "resume": "Output, income, expenditure: three ways of counting, one single total. Then divide by population — and the figure countries are compared with turns out to be just an <b>average<\/b>."}, {"titre": "The misleading average", "resume": "Spread a population across income brackets and watch the mean get pulled upwards. How many people live below it? The gap to the <b>median<\/b> measures the distortion."}, {"titre": "Quantiles and the Lorenz curve", "resume": "Rank the population from poorest to richest and accumulate. The curve pulls away from the diagonal as inequality grows: that gap is the <b>Gini coefficient<\/b>. And two very different societies can post the same one."}, {"titre": "The Gini around the world", "resume": "One figure per country on a map — the Gini after redistribution — then its evolution over time, before taxes. The state of play first, the trajectory next."}, {"titre": "GDP, incomes and inequality", "resume": "Five series driven by a single country selector: total GDP, GDP per capita, median income, share of the bottom 50 %, share of the <b>top 1 %<\/b>. A country can grow richer without the poorer half gaining anything."}, {"titre": "The elephant curve", "resume": "Who gained from globalisation between 1988 and 2008? The Asian hump, the dip of Western middle classes, the trunk of the top 1 %. Then the underlying question: is inequality <b>between<\/b> countries or <b>within<\/b> them?"}, {"titre": "The veil of ignorance and the maximin", "resume": "The foundation: the veil as an instrument of impartiality, the two principles of justice, then the <b>maximin<\/b> put to the test — three decision rules compared across three worlds whose floor you set. Rawls looks only at the lot of the worst off."}, {"titre": "Choosing between three societies", "resume": "Three fictional societies, four quartiles, and a die to be born at random. Maximin picks A, utilitarianism picks C: the ranking <b>reverses end to end<\/b>. And A wins in three quartiles out of four."}, {"titre": "Three countries behind the veil", "resume": "The same mechanism on real data — Spain, Czechia, Bulgaria (WID). Spain wins on the average, <b>Czechia<\/b> on the maximin: the reversal holds outside the textbook case. Incomes before tax."}, {"titre": "Maximin or average? Two criteria, two choices", "resume": "Does redistribution shrink the pie or grow it? Two views to switch between: Okun's <b>leaky bucket<\/b>, where redistribution has a cost, and the <b>multiplier<\/b> effect, where it sustains demand. Depending on which you hold, the two criteria clash — or agree."}, {"titre": "Rentier or worker?", "resume": "Mr A earns €50,000 a year, indexed to growth. Mr B inherits a million invested at the return on capital and reinvests half of it. Fifteen years later the gap is made — with nobody's effort having changed."}, {"titre": "β = s/g, growth as shock absorber", "resume": "The theoretical core, preceded by the definitions: β is a <b>stock<\/b> — wealth relative to income — where α is a <b>flow<\/b>. Push <b>g<\/b> towards zero and β takes off: the divergence is no accident."}, {"titre": "r − g, the gap that concentrates", "resume": "From antiquity to 2100, the return on capital against growth. Only in the 20th century does <b>r<\/b> after tax fall below <b>g<\/b> — and inequality recedes. Then push g towards zero, and the gap reopens."}], "pied": "Course path for ecological macroeconomics — each card opens the matching interactive tool.", "licence": "© 2026 Léo Malherbe · KEDGE Business School — <a href=\"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.en\" target=\"_blank\" rel=\"noopener license\">CC BY-NC-SA 4.0<\/a> — free to reuse and adapt for non-commercial purposes, with attribution and under the same licence.", "nav_fil": "The thread", "nav_ouvrir": "Open the tool", "nav_prec": "Previous tool", "nav_suiv": "Next tool", "nav_plein": "Full screen (F)", "nav_plein_sortie": "Exit full screen (Esc)", "nav_plein_astuce": "Move to the top edge to bring the bar back · Esc to exit"}}}</script>
<script type="application/json" id="toolsrc">{"pib-trois-approches.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Mesurer le PIB<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;\n    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n    --accent:#2E8B57;\n    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);\n    --font-d:\"Spectral\",Georgia,serif;--font-b:\"IBM Plex Sans\",system-ui,sans-serif;--font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n  }\n  :root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;\n    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --accent:#41A76D;\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }}\n  :root[data-theme=\"dark\"]{\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;\n    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --accent:#41A76D;\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}\n  .wrap{max-width:940px;margin:0 auto;padding-block:26px 46px;padding-inline:20px;}\n\n  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}\n  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500;margin:0 0 6px;}\n  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.7vw,42px);line-height:1.03;margin:0;letter-spacing:-.015em;text-wrap:balance;}\n  .sub{color:var(--muted);font-size:15px;margin:9px 0 0;max-width:74ch;text-wrap:pretty;}\n  .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}\n  .toggles{display:flex;gap:8px;flex-shrink:0;}\n  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}\n  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}\n  .tg:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}\n\n  .hero{display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-top:20px;text-align:center;}\n  .hero .eq{font-family:var(--font-m);font-size:13px;color:var(--muted);}\n  .hero .eq b{color:var(--ink);}\n  .hero .val{font-family:var(--font-d);font-weight:600;font-size:32px;color:var(--accent);line-height:1;}\n\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 19px;margin-top:16px;}\n  .card h2{font-family:var(--font-d);font-weight:600;font-size:20px;margin:0 0 5px;letter-spacing:-.01em;text-wrap:balance;}\n  .card .expl{color:var(--muted);font-size:14px;margin:0 0 15px;max-width:82ch;text-wrap:pretty;}\n  .card .expl b{color:var(--ink);font-weight:600;} .card .expl i{font-family:var(--font-d);font-style:italic;}\n  .card .expl .eqn{font-family:var(--font-m);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap;}\n\n  .ctrls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;}\n  @media (max-width:620px){.ctrls{grid-template-columns:1fr;}}\n  .ctrl .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px;}\n  .ctrl .name{font-size:12.5px;color:var(--ink);}\n  .ctrl .val{font-family:var(--font-m);font-size:12px;font-weight:500;}\n  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:var(--grid);outline:none;margin:3px 0;}\n  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer;}\n  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:pointer;}\n\n  .bar{display:flex;height:40px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--panel);}\n  .seg{display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-m);font-size:12px;font-weight:500;overflow:hidden;white-space:nowrap;min-width:0;transition:width .18s ease;}\n  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted);}\n  .legend .it{display:inline-flex;align-items:center;gap:7px;}\n  .legend .sw{width:12px;height:12px;border-radius:3px;flex-shrink:0;}\n  .legend b{color:var(--ink);font-weight:600;font-family:var(--font-m);}\n\n  table.chain{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;}\n  table.chain th,table.chain td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);}\n  table.chain th:first-child,table.chain td:first-child{text-align:left;}\n  table.chain thead th{font-family:var(--font-m);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);font-weight:500;}\n  table.chain td{font-family:var(--font-m);color:var(--ink);}\n  table.chain td:first-child{font-family:var(--font-b);color:var(--muted);}\n  table.chain tr.tot td{border-top:1.5px solid var(--faint);border-bottom:none;font-weight:600;}\n  table.chain tr.tot td:first-child{color:var(--ink);}\n  .va-cell{color:var(--accent)!important;font-weight:600;}\n\n  .note{font-size:13px;color:var(--muted);margin-top:12px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 12px;text-wrap:pretty;}\n  .note b{color:var(--ink);font-weight:600;} .note .n{font-family:var(--font-m);}\n\n  .synthrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;margin-bottom:10px;}\n  .synthrow .rl{font-family:var(--font-m);font-size:11.5px;color:var(--muted);text-align:right;line-height:1.15;}\n  .synthrow .rl b{display:block;color:var(--ink);font-family:var(--font-b);font-weight:600;font-size:12.5px;}\n  .synthcap{font-family:var(--font-m);font-size:13px;color:var(--ink);text-align:center;margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px;}\n  .synthcap b{color:var(--accent);}\n\n  .pc{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}\n  .pc .big{font-family:var(--font-d);font-weight:600;font-size:clamp(30px,7vw,52px);color:var(--accent);line-height:1;}\n  .pc .big small{font-family:var(--font-b);font-weight:500;font-size:15px;color:var(--muted);margin-left:6px;}\n  .pc .calc{font-family:var(--font-m);font-size:13px;color:var(--muted);}\n  .pcdots{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}\n  .pcdots .p{width:22px;height:22px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}\n  .pcdots .p::after{content:\"\";width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:.75;}\n  .bridge{margin-top:14px;font-size:14px;color:var(--muted);text-wrap:pretty;}\n  .bridge b{color:var(--ink);font-weight:600;}\n\n  .reset{margin-top:16px;font-family:var(--font-m);font-size:11.5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:8px 13px;cursor:pointer;}\n  .reset:hover{color:var(--ink);border-color:var(--faint);}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\"><\/p>\n      <h1 data-t=\"title\"><\/h1>\n      <p class=\"sub\" data-t=\"sub\"><\/p>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"hero\">\n    <span class=\"eq\" data-t=\"hero_lab\"><\/span>\n    <span class=\"val\" id=\"hero-val\"><\/span>\n    <span class=\"eq\" id=\"hero-id\"><\/span>\n  <\/div>\n\n  <!-- ① Production -->\n  <section class=\"card\">\n    <h2 data-t=\"s1_title\"><\/h2>\n    <p class=\"expl\" data-t=\"s1_expl\"><\/p>\n    <div class=\"ctrls\" id=\"chain-ctrls\"><\/div>\n    <div class=\"bar\" id=\"chain-bar\"><\/div>\n    <div class=\"legend\" id=\"chain-leg\"><\/div>\n    <table class=\"chain\" id=\"chain-tab\"><\/table>\n    <p class=\"note\" id=\"chain-note\"><\/p>\n  <\/section>\n\n  <!-- ② Revenus -->\n  <section class=\"card\">\n    <h2 data-t=\"s2_title\"><\/h2>\n    <p class=\"expl\" data-t=\"s2_expl\"><\/p>\n    <div class=\"ctrls\" id=\"inc-ctrls\"><\/div>\n    <div class=\"bar\" id=\"inc-bar\"><\/div>\n    <div class=\"legend\" id=\"inc-leg\"><\/div>\n  <\/section>\n\n  <!-- ③ Dépense -->\n  <section class=\"card\">\n    <h2 data-t=\"s3_title\"><\/h2>\n    <p class=\"expl\" data-t=\"s3_expl\"><\/p>\n    <div class=\"ctrls\" id=\"exp-ctrls\"><\/div>\n    <div class=\"bar\" id=\"exp-bar\"><\/div>\n    <div class=\"legend\" id=\"exp-leg\"><\/div>\n  <\/section>\n\n  <!-- Synthèse -->\n  <section class=\"card\">\n    <h2 data-t=\"synth_title\"><\/h2>\n    <p class=\"expl\" data-t=\"synth_expl\"><\/p>\n    <div id=\"synth\"><\/div>\n    <p class=\"synthcap\" id=\"synth-cap\"><\/p>\n  <\/section>\n\n  <!-- ④ Par tête -->\n  <section class=\"card\">\n    <h2 data-t=\"s4_title\"><\/h2>\n    <p class=\"expl\" data-t=\"s4_expl\"><\/p>\n    <div class=\"ctrls\" style=\"grid-template-columns:1fr\"><div class=\"ctrl\" id=\"pop-ctrl\"><\/div><\/div>\n    <div class=\"pc\">\n      <div class=\"big\" id=\"pc-val\"><\/div>\n      <div class=\"calc\" id=\"pc-calc\"><\/div>\n    <\/div>\n    <div class=\"pcdots\" id=\"pc-dots\"><\/div>\n    <p class=\"bridge\" data-t=\"bridge\"><\/p>\n    <button class=\"reset\" id=\"reset\" data-t=\"reset\"><\/button>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  var DEF={ wheat:30, flour:50, bread:100, W:52,P:33,T:15, C:53,I:23,G:24, pop:4 };\n  var s=Object.assign({},DEF);\n\n  try{var st=localStorage.getItem('pib_theme'); if(st) document.documentElement.setAttribute('data-theme',st);}catch(e){}\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme'); if(a) return a; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}\n  var LANG='fr'; try{var sl=localStorage.getItem('pib_lang'); if(sl) LANG=sl;}catch(e){}\n\n  var COL={ va1:'#2E8B57', va2:'#3E9E8F', va3:'#69B0C4', W:'#2A78D6', P:'#A9791B', T:'#7A6FB0', C:'#C0392B', I:'#2E8B57', G:'#5B6B78' };\n\n  var STR={\n    fr:{\n      eyebrow:\"Macroéconomie écologique · Fondamentaux statistiques\",\n      title:\"Mesurer le PIB\",\n      sub:\"Le <b>produit intérieur brut<\/b> est une seule grandeur que l'on peut mesurer de <b>trois façons<\/b> : ce qui est <i>produit<\/i> est <i>distribué<\/i> en revenus, puis <i>dépensé<\/i>. Suivez le circuit dans une petite économie, puis ramenez le PIB au nombre d'habitants.\",\n      hero_lab:\"PIB de cette économie :\",\n      s1_title:\"① Le PIB par la production : la valeur ajoutée\",\n      s1_expl:\"Chaque entreprise vend une production (Q) mais achète des biens à d'autres — ses <b>consommations intermédiaires<\/b> (CI). Sa contribution propre est la <b>valeur ajoutée<\/b> : <span class='eqn'>VA = Q − CI<\/span>. Le PIB est la <b>somme des valeurs ajoutées<\/b> : <span class='eqn'>PIB = ΣVA<\/span>. Suivez une filière blé → farine → pain.\",\n      s2_title:\"② Le PIB par les revenus : W + P + T\",\n      s2_expl:\"La valeur ajoutée se <b>distribue en revenus<\/b> : les <b>salaires<\/b> (W) rémunèrent le travail, les <b>profits<\/b> (P) rémunèrent le capital, les <b>impôts sur la production<\/b> (T) reviennent à l'État. D'où <span class='eqn'>PIB = W + P + T<\/span>.\",\n      s3_title:\"③ Le PIB par la dépense : C + I + G\",\n      s3_expl:\"Ces revenus sont <b>dépensés<\/b> : la <b>consommation<\/b> des ménages (C), l'<b>investissement<\/b> des entreprises (I), les <b>dépenses publiques<\/b> (G). D'où <span class='eqn'>PIB = C + I + G<\/span> (en économie fermée).\",\n      synth_title:\"Les trois visages d'une même grandeur\",\n      synth_expl:\"Les trois mesures donnent le même total. Ce qui est produit (VA) est distribué en revenus (W+P+T), puis dépensé (C+I+G) : trois lectures d'un unique circuit.\",\n      synth_cap:\"PIB = ΣVA = W + P + T = C + I + G = <b>{gdp}<\/b>\",\n      s4_title:\"④ Le PIB par tête : le PIB moyen\",\n      s4_expl:\"En divisant le PIB par le nombre d'habitants, on obtient le <b>PIB par habitant<\/b> — une moyenne censée résumer le niveau de vie.\",\n      bridge:\"Mais une moyenne peut <b>masquer de fortes inégalités<\/b> : à l'échelle d'un pays, on divise des milliers de milliards d'euros par des millions d'habitants, et cette moyenne dépasse le revenu de la plupart des ménages. C'est ce que montre l'outil suivant.\",\n      reset:\"↺ Réinitialiser\",\n      stages:[\"Blé (agriculteur)\",\"Farine (meunier)\",\"Pain (boulanger)\"],\n      va:[\"VA blé\",\"VA farine\",\"VA pain\"],\n      th:[\"Filière\",\"Vend (Q)\",\"Conso. int. (CI)\",\"Valeur ajoutée\"],\n      total:\"PIB = ΣVA\",\n      chain_note:\"Additionner toutes les <b>ventes<\/b> (<span class='n'>{sales}<\/span>) compterait deux fois les consommations intermédiaires. Le PIB ne retient que la <b>valeur ajoutée<\/b> : <span class='n'>{gdp}<\/span>.\",\n      inc:[\"Salaires (W)\",\"Profits (P)\",\"Impôts (T)\"],\n      exp:[\"Consommation (C)\",\"Investissement (I)\",\"Dépenses publ. (G)\"],\n      lens:[\"Production\",\"Revenus\",\"Dépense\"],\n      pop_lab:\"Nombre d'habitants\",\n      pc_lab:\"par habitant\",\n      pc_calc:\"{gdp} ÷ {pop} habitants = {pc}\"\n    },\n    en:{\n      eyebrow:\"Ecological macroeconomics · Statistical fundamentals\",\n      title:\"Measuring GDP\",\n      sub:\"<b>Gross domestic product<\/b> is a single quantity that can be measured in <b>three ways<\/b>: what is <i>produced<\/i> is <i>distributed<\/i> as income, then <i>spent<\/i>. Follow the circuit in a small economy, then divide GDP by the number of inhabitants.\",\n      hero_lab:\"GDP of this economy:\",\n      s1_title:\"① GDP by production: value added\",\n      s1_expl:\"Each firm sells output (Q) but buys goods from others — its <b>intermediate consumption<\/b> (IC). Its own contribution is the <b>value added<\/b>: <span class='eqn'>VA = Q − IC<\/span>. GDP is the <b>sum of value added<\/b>: <span class='eqn'>GDP = ΣVA<\/span>. Follow a wheat → flour → bread chain.\",\n      s2_title:\"② GDP by income: W + P + T\",\n      s2_expl:\"Value added is <b>distributed as income<\/b>: <b>wages<\/b> (W) reward labour, <b>profits<\/b> (P) reward capital, <b>taxes on production<\/b> (T) go to the state. Hence <span class='eqn'>GDP = W + P + T<\/span>.\",\n      s3_title:\"③ GDP by expenditure: C + I + G\",\n      s3_expl:\"This income is <b>spent<\/b>: household <b>consumption<\/b> (C), firms' <b>investment<\/b> (I), <b>government spending<\/b> (G). Hence <span class='eqn'>GDP = C + I + G<\/span> (closed economy).\",\n      synth_title:\"Three faces of one quantity\",\n      synth_expl:\"The three measures give the same total. What is produced (VA) is distributed as income (W+P+T), then spent (C+I+G): three readings of a single circuit.\",\n      synth_cap:\"GDP = ΣVA = W + P + T = C + I + G = <b>{gdp}<\/b>\",\n      s4_title:\"④ GDP per capita: average GDP\",\n      s4_expl:\"Dividing GDP by the number of inhabitants gives <b>GDP per capita<\/b> — an average meant to summarise living standards.\",\n      bridge:\"But an average can <b>hide large inequalities<\/b>: at a country's scale, we divide trillions of euros by millions of households, and this average exceeds the income of most of them. That is what the next tool shows.\",\n      reset:\"↺ Reset\",\n      stages:[\"Wheat (farmer)\",\"Flour (miller)\",\"Bread (baker)\"],\n      va:[\"VA wheat\",\"VA flour\",\"VA bread\"],\n      th:[\"Chain\",\"Sells (Q)\",\"Interm. (IC)\",\"Value added\"],\n      total:\"GDP = ΣVA\",\n      chain_note:\"Adding up all <b>sales<\/b> (<span class='n'>{sales}<\/span>) would double-count intermediate consumption. GDP keeps only the <b>value added<\/b>: <span class='n'>{gdp}<\/span>.\",\n      inc:[\"Wages (W)\",\"Profits (P)\",\"Taxes (T)\"],\n      exp:[\"Consumption (C)\",\"Investment (I)\",\"Gov. spending (G)\"],\n      lens:[\"Production\",\"Income\",\"Expenditure\"],\n      pop_lab:\"Number of inhabitants\",\n      pc_lab:\"per capita\",\n      pc_calc:\"{gdp} ÷ {pop} inhabitants = {pc}\"\n    }\n  };\n\n  function nf(){ return LANG==='fr'?'fr-FR':'en-US'; }\n  function eur(n){ return Math.round(n).toLocaleString(nf())+' €'; }\n\n  function gdp(){ return s.bread; }\n  function vas(){ return [s.wheat, s.flour-s.wheat, s.bread-s.flour]; }\n  function shares(w){ var t=w[0]+w[1]+w[2]||1; return [w[0]/t,w[1]/t,w[2]/t]; }\n\n  /* ---- bar + legend ---- */\n  function drawBar(barId,legId,parts){ // parts: [{val,color,label}]\n    var G=gdp()||1, bar=document.getElementById(barId), leg=document.getElementById(legId), b='',l='';\n    parts.forEach(function(p){\n      var wpct=100*p.val/G;\n      b+='<div class=\"seg\" style=\"width:'+wpct.toFixed(2)+'%;background:'+p.color+'\" title=\"'+p.label+'\">'+(wpct>9?eur(p.val):'')+'<\/div>';\n      l+='<span class=\"it\"><i class=\"sw\" style=\"background:'+p.color+'\"><\/i>'+p.label+' · <b>'+eur(p.val)+'<\/b> ('+Math.round(wpct)+'%)<\/span>';\n    });\n    bar.innerHTML=b; leg.innerHTML=l;\n  }\n\n  /* ---- ① production ---- */\n  function buildChainCtrls(){\n    var d=STR[LANG], box=document.getElementById('chain-ctrls'); box.innerHTML='';\n    var keys=['wheat','flour','bread'], max={wheat:100,flour:150,bread:200};\n    keys.forEach(function(k,i){\n      var row=document.createElement('div'); row.className='ctrl';\n      row.innerHTML='<div class=\"lab\"><span class=\"name\">'+d.stages[i]+'<\/span><span class=\"val\" id=\"cv-'+k+'\" style=\"color:'+[COL.va1,COL.va2,COL.va3][i]+'\"><\/span><\/div>'+\n                    '<input type=\"range\" id=\"c-'+k+'\" min=\"0\" max=\"'+max[k]+'\" step=\"5\">';\n      box.appendChild(row);\n    });\n    keys.forEach(function(k){\n      document.getElementById('c-'+k).addEventListener('input',function(){\n        var v=parseInt(this.value,10);\n        if(k==='wheat'){ s.wheat=v; if(s.flour<v)s.flour=v; if(s.bread<s.flour)s.bread=s.flour; }\n        if(k==='flour'){ s.flour=v; if(v<s.wheat)s.wheat=v; if(s.bread<v)s.bread=v; }\n        if(k==='bread'){ s.bread=v; if(v<s.flour)s.flour=v; if(s.flour<s.wheat)s.wheat=s.flour; }\n        syncChain(); render();\n      });\n    });\n    syncChain();\n  }\n  function syncChain(){\n    ['wheat','flour','bread'].forEach(function(k){ document.getElementById('c-'+k).value=s[k]; document.getElementById('cv-'+k).textContent=eur(s[k]); });\n  }\n  function renderChain(){\n    var d=STR[LANG], va=vas();\n    drawBar('chain-bar','chain-leg',[\n      {val:va[0],color:COL.va1,label:d.va[0]},{val:va[1],color:COL.va2,label:d.va[1]},{val:va[2],color:COL.va3,label:d.va[2]}]);\n    // table\n    var Q=[s.wheat,s.flour,s.bread], CI=[0,s.wheat,s.flour];\n    var t='<thead><tr><th>'+d.th[0]+'<\/th><th>'+d.th[1]+'<\/th><th>'+d.th[2]+'<\/th><th>'+d.th[3]+'<\/th><\/tr><\/thead><tbody>';\n    for(var i=0;i<3;i++){ t+='<tr><td>'+d.stages[i]+'<\/td><td>'+eur(Q[i])+'<\/td><td>'+eur(CI[i])+'<\/td><td class=\"va-cell\">'+eur(va[i])+'<\/td><\/tr>'; }\n    t+='<tr class=\"tot\"><td>'+d.total+'<\/td><td><\/td><td><\/td><td class=\"va-cell\">'+eur(gdp())+'<\/td><\/tr><\/tbody>';\n    document.getElementById('chain-tab').innerHTML=t;\n    var sales=Q[0]+Q[1]+Q[2];\n    document.getElementById('chain-note').innerHTML=d.chain_note.replace('{sales}',eur(sales)).replace('{gdp}',eur(gdp()));\n  }\n\n  /* ---- ②③ weight triplets ---- */\n  function buildTriplet(prefix, keys, labels){\n    var box=document.getElementById(prefix+'-ctrls'); box.innerHTML='';\n    keys.forEach(function(k,i){\n      var row=document.createElement('div'); row.className='ctrl';\n      row.innerHTML='<div class=\"lab\"><span class=\"name\">'+labels[i]+'<\/span><span class=\"val\" id=\"'+prefix+'v-'+k+'\"><\/span><\/div>'+\n                    '<input type=\"range\" id=\"'+prefix+'-'+k+'\" min=\"0\" max=\"100\" step=\"1\">';\n      box.appendChild(row);\n    });\n    keys.forEach(function(k){\n      document.getElementById(prefix+'-'+k).addEventListener('input',function(){ s[k]=parseInt(this.value,10); render(); });\n    });\n  }\n  function renderTriplet(prefix,barId,legId,keys,colors,labels){\n    var w=[s[keys[0]],s[keys[1]],s[keys[2]]], sh=shares(w), G=gdp();\n    keys.forEach(function(k,i){ var el=document.getElementById(prefix+'-'+k); if(el) el.value=s[k];\n      var v=document.getElementById(prefix+'v-'+k); if(v){ v.style.color=colors[i]; v.textContent=eur(sh[i]*G); } });\n    drawBar(barId,legId, keys.map(function(k,i){ return {val:sh[i]*G, color:colors[i], label:labels[i]}; }));\n    return sh;\n  }\n\n  /* ---- synthèse ---- */\n  function renderSynth(){\n    var d=STR[LANG], G=gdp()||1, va=vas();\n    var incSh=shares([s.W,s.P,s.T]), expSh=shares([s.C,s.I,s.G]);\n    var rows=[\n      {lab:d.lens[0], parts:[[va[0],COL.va1],[va[1],COL.va2],[va[2],COL.va3]]},\n      {lab:d.lens[1], parts:[[incSh[0]*G,COL.W],[incSh[1]*G,COL.P],[incSh[2]*G,COL.T]]},\n      {lab:d.lens[2], parts:[[expSh[0]*G,COL.C],[expSh[1]*G,COL.I],[expSh[2]*G,COL.G]]}\n    ];\n    var h='';\n    rows.forEach(function(r){\n      var segs=r.parts.map(function(p){ var wp=100*p[0]/G; return '<div class=\"seg\" style=\"width:'+wp.toFixed(2)+'%;background:'+p[1]+'\">'+(wp>13?eur(p[0]):'')+'<\/div>'; }).join('');\n      h+='<div class=\"synthrow\"><div class=\"rl\"><b>'+r.lab+'<\/b><\/div><div class=\"bar\">'+segs+'<\/div><\/div>';\n    });\n    document.getElementById('synth').innerHTML=h;\n    document.getElementById('synth-cap').innerHTML=d.synth_cap.replace('{gdp}',eur(G));\n  }\n\n  /* ---- ④ per capita ---- */\n  function buildPop(){\n    var d=STR[LANG], box=document.getElementById('pop-ctrl');\n    box.innerHTML='<div class=\"lab\"><span class=\"name\">'+d.pop_lab+'<\/span><span class=\"val\" id=\"popv\" style=\"color:var(--accent)\"><\/span><\/div><input type=\"range\" id=\"pop\" min=\"1\" max=\"10\" step=\"1\">';\n    document.getElementById('pop').addEventListener('input',function(){ s.pop=parseInt(this.value,10); render(); });\n  }\n  function renderPC(){\n    var d=STR[LANG], G=gdp(), pc=G/s.pop;\n    document.getElementById('pop').value=s.pop;\n    document.getElementById('popv').textContent=s.pop;\n    document.getElementById('pc-val').innerHTML=eur(pc)+' <small>'+d.pc_lab+'<\/small>';\n    document.getElementById('pc-calc').innerHTML=d.pc_calc.replace('{gdp}',eur(G)).replace('{pop}',s.pop).replace('{pc}',eur(pc));\n    var dots=''; for(var i=0;i<s.pop;i++) dots+='<span class=\"p\" title=\"'+eur(pc)+'\"><\/span>';\n    document.getElementById('pc-dots').innerHTML=dots;\n  }\n\n  function render(){\n    var d=STR[LANG];\n    document.getElementById('hero-val').textContent=eur(gdp());\n    document.getElementById('hero-id').innerHTML='<b>ΣVA = W+P+T = C+I+G<\/b>';\n    renderChain();\n    renderTriplet('inc','inc-bar','inc-leg',['W','P','T'],[COL.W,COL.P,COL.T],d.inc);\n    renderTriplet('exp','exp-bar','exp-leg',['C','I','G'],[COL.C,COL.I,COL.G],d.exp);\n    renderSynth();\n    renderPC();\n  }\n\n  /* ---- langue / thème ---- */\n  function applyLang(){\n    var d=STR[LANG];\n    document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){ var k=el.getAttribute('data-t'); if(d[k]!=null) el.innerHTML=d[k]; });\n    document.getElementById('langlbl').textContent=LANG.toUpperCase();\n    document.title = LANG==='fr' ? \"Mesurer le PIB\" : \"Measuring GDP\";\n    buildChainCtrls();\n    buildTriplet('inc',['W','P','T'],d.inc);\n    buildTriplet('exp',['C','I','G'],d.exp);\n    buildPop();\n    render();\n  }\n  document.getElementById('lang').addEventListener('click',function(){\n    LANG=LANG==='fr'?'en':'fr'; try{localStorage.setItem('pib_lang',LANG);}catch(e){} applyLang();\n  });\n  document.getElementById('theme').addEventListener('click',function(){\n    var next=effTheme()==='dark'?'light':'dark';\n    document.documentElement.setAttribute('data-theme',next);\n    try{localStorage.setItem('pib_theme',next);}catch(e){}\n  });\n  document.getElementById('reset').addEventListener('click',function(){ s=Object.assign({},DEF); applyLang(); });\n\n  applyLang();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "moyenne-mediane.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>La moyenne trompeuse<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;\n    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n    --dist:#2A78D6;--gold:#A9791B;--mean:#C0392B;--median:#2E8B57;\n    --dist-soft:rgba(42,120,214,.10);--mean-soft:rgba(192,57,43,.08);--median-soft:rgba(46,139,87,.09);--gold-soft:rgba(169,121,27,.14);\n    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);\n    --font-d:\"Spectral\",Georgia,serif;--font-b:\"IBM Plex Sans\",system-ui,sans-serif;--font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n  }\n  :root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;\n    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --dist:#3987E5;--gold:#D6A83A;--mean:#E0705F;--median:#41A76D;\n    --dist-soft:rgba(57,135,229,.14);--mean-soft:rgba(224,112,95,.12);--median-soft:rgba(65,167,109,.13);--gold-soft:rgba(214,168,58,.16);\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }}\n  :root[data-theme=\"dark\"]{\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;\n    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --dist:#3987E5;--gold:#D6A83A;--mean:#E0705F;--median:#41A76D;\n    --dist-soft:rgba(57,135,229,.14);--mean-soft:rgba(224,112,95,.12);--median-soft:rgba(65,167,109,.13);--gold-soft:rgba(214,168,58,.16);\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}\n  .wrap{max-width:1120px;margin:0 auto;padding-block:26px 46px;padding-inline:20px;}\n\n  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}\n  .eyebrow{font-family:var(--font-m);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dist);font-weight:500;margin:0 0 6px;}\n  h1{font-family:var(--font-d);font-weight:600;font-size:clamp(28px,4.7vw,42px);line-height:1.03;margin:0;letter-spacing:-.015em;text-wrap:balance;}\n  .sub{color:var(--muted);font-size:15px;margin:9px 0 0;max-width:70ch;text-wrap:pretty;}\n  .sub b{color:var(--ink);font-weight:600;} .sub i{font-family:var(--font-d);font-style:italic;}\n  .toggles{display:flex;gap:8px;flex-shrink:0;}\n  .tg{font-family:var(--font-m);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;gap:6px;align-items:center;}\n  .tg:hover{color:var(--ink);border-color:var(--faint);} .tg b{color:var(--ink);font-weight:600;}\n  .tg:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}\n\n  .grid{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:22px;align-items:start;}\n  @media (max-width:860px){.grid{grid-template-columns:1fr;}}\n\n  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 17px;}\n  .card h2{font-family:var(--font-d);font-weight:600;font-size:16px;margin:0 0 12px;letter-spacing:-.01em;}\n\n  .presets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px;}\n  .pbtn{font-family:var(--font-m);font-size:11.5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;line-height:1.1;}\n  .pbtn:hover{color:var(--ink);border-color:var(--faint);}\n  .pbtn.on{color:var(--ink);border-color:var(--dist);box-shadow:inset 2px 0 0 var(--dist);background:var(--surface);}\n\n  .ctrl{margin-bottom:13px;}\n  .ctrl:last-child{margin-bottom:0;}\n  .ctrl .lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px;}\n  .ctrl .name{font-size:13px;color:var(--ink);}\n  .ctrl .name em{font-family:var(--font-d);font-style:italic;color:var(--muted);font-size:12px;}\n  .ctrl .val{font-family:var(--font-m);font-size:12.5px;color:var(--dist);font-weight:500;white-space:nowrap;}\n  .ctrl.top .name{color:var(--gold);} .ctrl.top .val{color:var(--gold);}\n  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:var(--grid);outline:none;margin:3px 0;}\n  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--dist);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer;}\n  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--dist);border:2px solid var(--surface);cursor:pointer;}\n  .ctrl.top input[type=range]::-webkit-slider-thumb{background:var(--gold);}\n  .ctrl.top input[type=range]::-moz-range-thumb{background:var(--gold);}\n  .subrange{margin-top:8px;padding-top:9px;border-top:1px dashed var(--line);}\n  .reset{margin-top:14px;font-family:var(--font-m);font-size:11.5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:7px 11px;cursor:pointer;width:100%;}\n  .reset:hover{color:var(--ink);border-color:var(--faint);}\n\n  .viz{display:flex;flex-direction:column;gap:14px;}\n  .chartcard{padding:14px 14px 10px;}\n  .chartwrap{width:100%;}\n  svg.chart{display:block;width:100%;height:auto;}\n  .chart text{font-family:var(--font-m);}\n  .bar{fill:var(--dist);}\n  .bar.top{fill:var(--gold);}\n  .barlab{fill:var(--muted);font-size:11px;}\n  .axis{fill:var(--faint);font-size:11px;}\n  .axis-title{fill:var(--faint);font-size:10.5px;letter-spacing:.06em;}\n  .gridline{stroke:var(--grid);stroke-width:1;}\n  .axisline{stroke:var(--line);stroke-width:1.2;}\n  .belowband{fill:var(--dist-soft);}\n  .mean-line{stroke:var(--mean);stroke-width:2;stroke-dasharray:5 4;}\n  .median-line{stroke:var(--median);stroke-width:2;}\n  .mean-tag{fill:var(--mean);font-size:11.5px;font-weight:600;}\n  .median-tag{fill:var(--median);font-size:11.5px;font-weight:600;}\n  .tagbg{fill:var(--surface);fill-opacity:.86;}\n\n  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-family:var(--font-m);font-size:11px;color:var(--muted);}\n  .legend span{display:inline-flex;align-items:center;gap:6px;}\n  .swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0;}\n  .swatch.dist{background:var(--dist);} .swatch.gold{background:var(--gold);}\n  .swatch.mean{background:transparent;border-top:2px dashed var(--mean);height:0;border-radius:0;}\n  .swatch.median{background:transparent;border-top:2px solid var(--median);height:0;border-radius:0;}\n\n  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}\n  @media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr);}}\n  .stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;}\n  .stat .k{font-family:var(--font-m);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:0 0 4px;text-wrap:pretty;line-height:1.25;}\n  .stat .v{font-family:var(--font-d);font-weight:600;font-size:19px;line-height:1;color:var(--ink);}\n  .stat .v small{font-family:var(--font-b);font-weight:500;font-size:12px;color:var(--muted);margin-left:4px;}\n  .stat.mean .v{color:var(--mean);} .stat.median .v{color:var(--median);} .stat.top .v{color:var(--gold);}\n\n  .insight{background:var(--mean-soft);border:1px solid var(--line);border-left:3px solid var(--mean);border-radius:11px;padding:12px 14px;font-size:14px;color:var(--ink);text-wrap:pretty;}\n  .insight b{font-weight:600;}\n\n  .explain{margin-top:20px;}\n  .explain h2{font-family:var(--font-d);font-weight:600;font-size:19px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance;}\n  .explain p{color:var(--muted);font-size:14px;margin:9px 0 0;max-width:82ch;text-wrap:pretty;}\n  .explain p b{color:var(--ink);font-weight:600;} .explain p i{font-family:var(--font-d);font-style:italic;}\n  .src{font-family:var(--font-m);font-size:11px;color:var(--faint);margin-top:12px;}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <div>\n      <p class=\"eyebrow\" data-t=\"eyebrow\"><\/p>\n      <h1 data-t=\"title\"><\/h1>\n      <p class=\"sub\" data-t=\"sub\"><\/p>\n    <\/div>\n    <div class=\"toggles\">\n      <button class=\"tg\" id=\"lang\" aria-label=\"Langue\">🌐 <b id=\"langlbl\">FR<\/b><\/button>\n      <button class=\"tg\" id=\"theme\" aria-label=\"Thème\">◐<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"grid\">\n    <!-- ─────────── contrôles ─────────── -->\n    <section class=\"card\">\n      <h2 data-t=\"ctrl_title\"><\/h2>\n      <div class=\"presets\" id=\"presets\"><\/div>\n      <div id=\"sliders\"><\/div>\n      <button class=\"reset\" id=\"reset\" data-t=\"reset\"><\/button>\n    <\/section>\n\n    <!-- ─────────── visualisation ─────────── -->\n    <section class=\"viz\">\n      <div class=\"card chartcard\">\n        <div class=\"chartwrap\"><svg class=\"chart\" id=\"chart\" viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"Distribution des revenus\"><\/svg><\/div>\n        <div class=\"legend\" id=\"legend\"><\/div>\n      <\/div>\n\n      <div class=\"stats\" id=\"stats\"><\/div>\n      <p class=\"insight\" id=\"insight\"><\/p>\n    <\/section>\n  <\/div>\n\n  <!-- ─────────── encadré pédagogique ─────────── -->\n  <section class=\"card explain\">\n    <h2 data-t=\"ex_title\"><\/h2>\n    <p data-t=\"ex_p1\"><\/p>\n    <p data-t=\"ex_p2\"><\/p>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  /* ───────── état ───────── */\n  var Y=[10000,30000,50000,100000];         // revenus repères (les 3 premiers fixes ; le 4e = state.topY)\n  var DEFAULT={f:[5,20,20,5], topY:70000};  // répartition symétrique : moyenne = médiane\n  var state={f:DEFAULT.f.slice(), topY:DEFAULT.topY};\n\n  var PRESETS={\n    sym:    {f:[5,20,20,5],   topY:70000},   // symétrique — moyenne ≈ médiane\n    conc1:  {f:[6,20,18,6],   topY:120000},  // concentration modérée\n    conc2:  {f:[12,18,12,8],  topY:200000}   // forte concentration\n  };\n\n  /* ───────── thème (avant peinture) ───────── */\n  try{var st=localStorage.getItem('moyenne_theme'); if(st) document.documentElement.setAttribute('data-theme',st);}catch(e){}\n  function effTheme(){var a=document.documentElement.getAttribute('data-theme'); if(a) return a; return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}\n\n  /* ───────── langue ───────── */\n  var LANG='fr'; try{var sl=localStorage.getItem('moyenne_lang'); if(sl) LANG=sl;}catch(e){}\n\n  var STR={\n    fr:{\n      eyebrow:\"Macroéconomie écologique · Fondamentaux statistiques\",\n      title:\"La moyenne trompeuse\",\n      sub:\"Le PIB par habitant est une <b>moyenne<\/b>. Partez d'une répartition <b>symétrique<\/b>, où la moyenne et la médiane coïncident : l'« individu moyen » est alors représentatif. Puis <b>concentrez les revenus<\/b> vers le haut, et regardez la moyenne s'éloigner de la médiane — jusqu'à décrire un individu qui <i>n'existe pas<\/i>.\",\n      ctrl_title:\"Répartir la population (millions de ménages)\",\n      presets:{sym:\"Répartition symétrique\", conc1:\"Concentration modérée\", conc2:\"Forte concentration\"},\n      brackets:[\"0 – 20 000 €\",\"20 000 – 40 000 €\",\"40 000 – 60 000 €\",\"60 000 € et plus\"],\n      pop:\"ménages\",\n      topincome:\"Revenu moyen de cette tranche\",\n      reset:\"↺ Revenir à la répartition symétrique\",\n      k_gdp:\"Revenu total\", k_mean:\"Moyenne (PIB / hab.)\", k_median:\"Médiane\",\n      k_below:\"Sous la moyenne\", k_gap:\"Écart moyenne − médiane\", k_topshare:\"Part du revenu · hauts revenus\",\n      unit_house:\"ménages\", of_pop:\"de la population\", for_pop:\"pour\",\n      mean_tag:\"moyenne\", median_tag:\"médiane\",\n      lg_dist:\"ménages par tranche\", lg_gold:\"hauts revenus (60 k€ +)\", lg_mean:\"moyenne (PIB/hab.)\", lg_median:\"médiane\",\n      insight_eq:\"<b>Moyenne et médiane coïncident<\/b> ({mean}). La répartition est symétrique : l'« individu moyen » est représentatif — la moitié des ménages est au-dessus, la moitié en dessous. Concentrez les revenus en haut pour ouvrir l'écart.\",\n      insight_tpl:\"La moyenne (<b>{mean}<\/b>) dépasse la médiane (<b>{median}<\/b>) de <b>{gap}<\/b> : <b>{belowPct}<\/b> des ménages gagnent moins que la moyenne. Plus les revenus se concentrent en haut, plus la moyenne s'éloigne de la médiane — l'« individu moyen » devient plus riche que la majorité.\",\n      insight_empty:\"Ajoutez des ménages dans au moins une tranche pour calculer la moyenne.\",\n      ex_title:\"Moyenne, médiane et concentration\",\n      ex_p1:\"La <b>moyenne<\/b> additionne tous les revenus et les divise par la population : un ménage y pèse à proportion de sa richesse. La <b>médiane<\/b> partage la population en deux moitiés — elle est indifférente au montant des plus hauts revenus. Quand la répartition est <b>symétrique<\/b>, les deux coïncident et la moyenne décrit bien un ménage typique.\",\n      ex_p2:\"Dès que les revenus se <b>concentrent<\/b> en haut, la moyenne est tirée vers le haut tandis que la médiane bouge à peine : l'écart se creuse. C'est pourquoi le <b>PIB par habitant<\/b> — une moyenne — peut dépasser le revenu de bien plus de la moitié des ménages, et donner une image flatteuse d'un niveau de vie que la plupart n'atteignent pas.\"\n    },\n    en:{\n      eyebrow:\"Ecological macroeconomics · Statistical fundamentals\",\n      title:\"The deceptive average\",\n      sub:\"GDP per capita is an <b>average<\/b>. Start from a <b>symmetric<\/b> distribution, where the mean and the median coincide: the “average individual” is then representative. Then <b>concentrate income<\/b> at the top, and watch the mean pull away from the median — until it describes a person who <i>does not exist<\/i>.\",\n      ctrl_title:\"Distribute the population (millions of households)\",\n      presets:{sym:\"Symmetric distribution\", conc1:\"Moderate concentration\", conc2:\"High concentration\"},\n      brackets:[\"0 – 20,000 €\",\"20,000 – 40,000 €\",\"40,000 – 60,000 €\",\"60,000 € and above\"],\n      pop:\"households\",\n      topincome:\"Average income of this bracket\",\n      reset:\"↺ Back to the symmetric distribution\",\n      k_gdp:\"Total income\", k_mean:\"Mean (GDP / capita)\", k_median:\"Median\",\n      k_below:\"Below the mean\", k_gap:\"Mean − median gap\", k_topshare:\"Income share · top bracket\",\n      unit_house:\"households\", of_pop:\"of the population\", for_pop:\"for\",\n      mean_tag:\"mean\", median_tag:\"median\",\n      lg_dist:\"households per bracket\", lg_gold:\"top bracket (60k€ +)\", lg_mean:\"mean (GDP/capita)\", lg_median:\"median\",\n      insight_eq:\"<b>Mean and median coincide<\/b> ({mean}). The distribution is symmetric: the “average individual” is representative — half of households above, half below. Concentrate income at the top to open the gap.\",\n      insight_tpl:\"The mean (<b>{mean}<\/b>) exceeds the median (<b>{median}<\/b>) by <b>{gap}<\/b>: <b>{belowPct}<\/b> of households earn less than the mean. The more income concentrates at the top, the further the mean drifts from the median — the “average individual” becomes richer than the majority.\",\n      insight_empty:\"Add households to at least one bracket to compute the mean.\",\n      ex_title:\"Mean, median and concentration\",\n      ex_p1:\"The <b>mean<\/b> sums all incomes and divides by the population: a household carries weight in proportion to its wealth. The <b>median<\/b> splits the population in half — it is indifferent to how large the top incomes are. When the distribution is <b>symmetric<\/b>, the two coincide and the mean describes a typical household well.\",\n      ex_p2:\"As soon as income <b>concentrates<\/b> at the top, the mean is pulled upward while the median barely moves: the gap widens. This is why <b>GDP per capita<\/b> — an average — can exceed the income of well over half of households, flattering a standard of living that most never reach.\"\n    }\n  };\n\n  /* ───────── utilitaires ───────── */\n  function nf(){ return LANG==='fr' ? 'fr-FR' : 'en-US'; }\n  function fmt(n){ return Math.round(n).toLocaleString(nf()); }\n  function eur(n){ return fmt(n)+' €'; }\n  function pct(x,d){ return (x).toLocaleString(nf(),{minimumFractionDigits:d||0,maximumFractionDigits:d||0})+' %'; }\n\n  var BOUNDS=[[0,20000],[20000,40000],[40000,60000],[60000,null]]; // tranches réelles\n\n  function compute(){\n    var f=state.f, y=[Y[0],Y[1],Y[2],state.topY], i;\n    var N=f[0]+f[1]+f[2]+f[3];\n    var GDP=0; for(i=0;i<4;i++) GDP+=f[i]*y[i];\n    if(N<=0) return {N:0};\n    var mean=GDP/N, half=N/2;\n\n    // médiane interpolée : position du 50e centile dans sa tranche (bornes réelles, pas les revenus repères)\n    var cum=0, median=state.topY;\n    for(i=0;i<4;i++){ var fi=f[i]; if(fi<=0) continue;\n      if(cum+fi>=half){ median = (i<3) ? BOUNDS[i][0]+((half-cum)/fi)*(BOUNDS[i][1]-BOUNDS[i][0]) : state.topY; break; }\n      cum+=fi;\n    }\n\n    // ménages sous la moyenne, interpolé dans la tranche qui contient la moyenne\n    var below=0;\n    for(i=0;i<3;i++){ var lo=BOUNDS[i][0], hi=BOUNDS[i][1];\n      if(mean>=hi) below+=f[i];\n      else if(mean>lo) below+=f[i]*(mean-lo)/(hi-lo);\n    }\n    if(mean>=state.topY) below+=f[3]; // cas extrême : moyenne au-delà du revenu repère du haut\n\n    var gap=mean-median;\n    return {N:N, y:y, GDP:GDP, mean:mean, median:median, gap:gap, below:below,\n            belowPct:100*below/N, topShare:100*f[3]*y[3]/GDP, topPop:100*f[3]/N};\n  }\n\n  /* ───────── graphique ───────── */\n  function drawChart(c){\n    var svg=document.getElementById('chart'), d=STR[LANG];\n    var W=640,H=340,padL=44,padR=18,padT=26,padB=42;\n    if(!c.N){ svg.innerHTML=''; return; }\n    var xMax=Math.max(120000, state.topY+20000); xMax=Math.ceil(xMax/20000)*20000;\n    var maxf=Math.max(c.y?Math.max(state.f[0],state.f[1],state.f[2],state.f[3]):1, 1);\n    var yMax=Math.max(10, Math.ceil(maxf/10)*10);\n    function X(v){ return padL+(v/xMax)*(W-padL-padR); }\n    function Yp(h){ return (H-padB)-(h/yMax)*(H-padT-padB); }\n    var s='';\n\n    // bande « sous la moyenne »\n    s+='<rect class=\"belowband\" x=\"'+padL.toFixed(1)+'\" y=\"'+padT+'\" width=\"'+(X(c.mean)-padL).toFixed(1)+'\" height=\"'+(H-padB-padT)+'\"/>';\n\n    // gridlines horizontales + ticks Y\n    for(var g=0;g<=yMax;g+=10){\n      var yy=Yp(g);\n      s+='<line class=\"gridline\" x1=\"'+padL+'\" y1=\"'+yy.toFixed(1)+'\" x2=\"'+(W-padR)+'\" y2=\"'+yy.toFixed(1)+'\"/>';\n      s+='<text class=\"axis\" x=\"'+(padL-7)+'\" y=\"'+(yy+3.5).toFixed(1)+'\" text-anchor=\"end\">'+g+'<\/text>';\n    }\n    s+='<text class=\"axis-title\" x=\"'+(padL-30)+'\" y=\"'+(padT-10)+'\" text-anchor=\"start\">'+(LANG==='fr'?'millions':'millions')+'<\/text>';\n\n    // axe X + ticks (tous les 20 000)\n    s+='<line class=\"axisline\" x1=\"'+padL+'\" y1=\"'+(H-padB)+'\" x2=\"'+(W-padR)+'\" y2=\"'+(H-padB)+'\"/>';\n    for(var t=0;t<=xMax;t+=20000){\n      var xx=X(t);\n      s+='<line class=\"gridline\" x1=\"'+xx.toFixed(1)+'\" y1=\"'+(H-padB)+'\" x2=\"'+xx.toFixed(1)+'\" y2=\"'+(H-padB+4)+'\"/>';\n      var lbl = t>=1000 ? (t/1000)+'k' : ''+t;\n      if(t===xMax) lbl=(t/1000)+'k+';\n      s+='<text class=\"axis\" x=\"'+xx.toFixed(1)+'\" y=\"'+(H-padB+16)+'\" text-anchor=\"middle\">'+lbl+'<\/text>';\n    }\n\n    // barres (centrées sur le revenu représentatif)\n    var half=6500;\n    for(var i=0;i<4;i++){\n      var yi=c.y[i], fi=state.f[i]; if(fi<=0) continue;\n      var x0=X(yi-half), x1=X(yi+half), bw=Math.max(3,x1-x0), by=Yp(fi), bh=(H-padB)-by;\n      s+='<rect class=\"bar'+(i===3?' top':'')+'\" x=\"'+x0.toFixed(1)+'\" y=\"'+by.toFixed(1)+'\" width=\"'+bw.toFixed(1)+'\" height=\"'+bh.toFixed(1)+'\" rx=\"2\"/>';\n      s+='<text class=\"barlab\" x=\"'+X(yi).toFixed(1)+'\" y=\"'+(by-5).toFixed(1)+'\" text-anchor=\"middle\">'+fmt(fi)+'<\/text>';\n    }\n\n    // lignes moyenne / médiane\n    var xm=X(c.mean), xmed=X(c.median);\n    s+='<line class=\"median-line\" x1=\"'+xmed.toFixed(1)+'\" y1=\"'+padT+'\" x2=\"'+xmed.toFixed(1)+'\" y2=\"'+(H-padB)+'\"/>';\n    s+='<line class=\"mean-line\" x1=\"'+xm.toFixed(1)+'\" y1=\"'+padT+'\" x2=\"'+xm.toFixed(1)+'\" y2=\"'+(H-padB)+'\"/>';\n\n    // étiquettes moyenne (haut) & médiane (bas), sur pastille pour rester lisibles sur les barres\n    function tag(x,y,anchor,txt,cls){\n      var w=txt.length*6.2+14, rx = anchor==='end' ? x-w+5 : x-5;\n      return '<rect class=\"tagbg\" x=\"'+rx.toFixed(1)+'\" y=\"'+(y-12).toFixed(1)+'\" width=\"'+w.toFixed(1)+'\" height=\"16\" rx=\"4\"/>'+\n             '<text class=\"'+cls+'\" x=\"'+x.toFixed(1)+'\" y=\"'+y.toFixed(1)+'\" text-anchor=\"'+anchor+'\">'+txt+'<\/text>';\n    }\n    var meanRight = xm > (padL+(W-padR-padL)/2);\n    s+=tag(meanRight?xm-6:xm+6, padT+12, meanRight?'end':'start', d.mean_tag+' · '+eur(c.mean), 'mean-tag');\n    var medRight = xmed > (padL+(W-padR-padL)/2);\n    s+=tag(medRight?xmed-6:xmed+6, H-padB-7, medRight?'end':'start', d.median_tag+' · '+eur(c.median), 'median-tag');\n\n    svg.innerHTML=s;\n  }\n\n  /* ───────── readouts + insight ───────── */\n  function drawStats(c){\n    var d=STR[LANG], box=document.getElementById('stats');\n    function stat(cls,k,v,sub){\n      return '<div class=\"stat '+cls+'\"><p class=\"k\">'+k+'<\/p><div class=\"v\">'+v+(sub?'<small>'+sub+'<\/small>':'')+'<\/div><\/div>';\n    }\n    if(!c.N){ box.innerHTML=stat('','',''); document.getElementById('insight').innerHTML=d.insight_empty; return; }\n    var gdpB=c.GDP/1000; // millions€ -> milliards€\n    var s='';\n    s+=stat('', d.k_gdp, fmt(gdpB)+(LANG==='fr'?' Md€':' bn€'));\n    s+=stat('mean', d.k_mean, eur(c.mean));\n    s+=stat('median', d.k_median, eur(c.median));\n    s+=stat('gap', d.k_gap, eur(c.gap));\n    s+=stat('', d.k_below, pct(c.belowPct,0));\n    s+=stat('top', d.k_topshare, pct(c.topShare,0), d.for_pop+' '+pct(c.topPop,1));\n    box.innerHTML=s;\n\n    // insight adaptatif : équivalence (répartition symétrique) vs distorsion (concentration)\n    var equal = c.gap < Math.max(500, 0.015*c.mean);\n    var tpl = equal\n      ? d.insight_eq.replace(/{mean}/g,eur(c.mean))\n      : d.insight_tpl.replace(/{mean}/g,eur(c.mean)).replace(/{median}/g,eur(c.median))\n                     .replace(/{gap}/g,eur(c.gap)).replace(/{belowPct}/g,pct(c.belowPct,0));\n    document.getElementById('insight').innerHTML=tpl;\n    document.getElementById('insight').style.background = equal ? 'var(--median-soft)' : 'var(--mean-soft)';\n    document.getElementById('insight').style.borderLeftColor = equal ? 'var(--median)' : 'var(--mean)';\n  }\n\n  function drawLegend(){\n    var d=STR[LANG];\n    document.getElementById('legend').innerHTML=\n      '<span><i class=\"swatch dist\"><\/i>'+d.lg_dist+'<\/span>'+\n      '<span><i class=\"swatch gold\"><\/i>'+d.lg_gold+'<\/span>'+\n      '<span><i class=\"swatch mean\"><\/i>'+d.lg_mean+'<\/span>'+\n      '<span><i class=\"swatch median\"><\/i>'+d.lg_median+'<\/span>';\n  }\n\n  function render(){ var c=compute(); drawChart(c); drawStats(c); drawLegend(); }\n\n  /* ───────── construction des contrôles ───────── */\n  function buildPresets(){\n    var d=STR[LANG], box=document.getElementById('presets'); box.innerHTML='';\n    ['sym','conc1','conc2'].forEach(function(key){\n      var b=document.createElement('button'); b.className='pbtn'; b.dataset.k=key; b.textContent=d.presets[key];\n      b.addEventListener('click',function(){ applyPreset(key); });\n      box.appendChild(b);\n    });\n    markPreset();\n  }\n  function markPreset(){\n    var cur=null;\n    for(var key in PRESETS){ var p=PRESETS[key];\n      if(p.f[0]===state.f[0]&&p.f[1]===state.f[1]&&p.f[2]===state.f[2]&&p.f[3]===state.f[3]&&p.topY===state.topY){ cur=key; break; } }\n    document.querySelectorAll('#presets .pbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.k===cur); });\n  }\n  function applyPreset(key){ var p=PRESETS[key]; state.f=p.f.slice(); state.topY=p.topY; syncInputs(); render(); markPreset(); }\n\n  function buildSliders(){\n    var d=STR[LANG], box=document.getElementById('sliders'); box.innerHTML='';\n    for(var i=0;i<4;i++){\n      var top=(i===3);\n      var row=document.createElement('div'); row.className='ctrl'+(top?' top':'');\n      row.innerHTML=\n        '<div class=\"lab\"><span class=\"name\">'+d.brackets[i]+'<\/span><span class=\"val\"><span id=\"pv'+i+'\"><\/span> M<\/span><\/div>'+\n        '<input type=\"range\" id=\"pop'+i+'\" min=\"0\" max=\"40\" step=\"0.5\">'+\n        (top? '<div class=\"subrange\"><div class=\"lab\"><span class=\"name\"><em>'+d.topincome+'<\/em><\/span>'+\n              '<span class=\"val\" id=\"tyv\"><\/span><\/div>'+\n              '<input type=\"range\" id=\"topy\" min=\"60000\" max=\"300000\" step=\"5000\"><\/div>' : '');\n      box.appendChild(row);\n    }\n    for(i=0;i<4;i++){ (function(i){\n      document.getElementById('pop'+i).addEventListener('input',function(){ state.f[i]=parseFloat(this.value); refreshVals(); render(); markPreset(); });\n    })(i); }\n    document.getElementById('topy').addEventListener('input',function(){ state.topY=parseFloat(this.value); refreshVals(); render(); markPreset(); });\n    syncInputs();\n  }\n  function refreshVals(){\n    for(var i=0;i<4;i++) document.getElementById('pv'+i).textContent=fmt(state.f[i]);\n    document.getElementById('tyv').textContent=eur(state.topY);\n  }\n  function syncInputs(){\n    for(var i=0;i<4;i++) document.getElementById('pop'+i).value=state.f[i];\n    document.getElementById('topy').value=state.topY;\n    refreshVals();\n  }\n\n  /* ───────── langue / thème ───────── */\n  function applyLang(){\n    var d=STR[LANG];\n    document.documentElement.lang=LANG;\n    document.querySelectorAll('[data-t]').forEach(function(el){ var k=el.getAttribute('data-t'); if(d[k]!=null) el.innerHTML=d[k]; });\n    document.getElementById('langlbl').textContent=LANG.toUpperCase();\n    document.title = LANG==='fr' ? \"La moyenne trompeuse\" : \"The deceptive average\";\n    buildPresets(); buildSliders(); render();\n  }\n  document.getElementById('lang').addEventListener('click',function(){\n    LANG = LANG==='fr'?'en':'fr';\n    try{localStorage.setItem('moyenne_lang',LANG);}catch(e){}\n    applyLang();\n  });\n  document.getElementById('theme').addEventListener('click',function(){\n    var next = effTheme()==='dark'?'light':'dark';\n    document.documentElement.setAttribute('data-theme',next);\n    try{localStorage.setItem('moyenne_theme',next);}catch(e){}\n    render(); // relit les couleurs si besoin\n  });\n  document.getElementById('reset').addEventListener('click',function(){ applyPreset('sym'); });\n\n  /* ───────── démarrage ───────── */\n  applyLang();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "lorenz-gini.html": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Quantiles &amp; courbe de Lorenz<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<script>try{if(window.top!==window.self&&window.parent.document)document.documentElement.setAttribute('data-embedded','1');}catch(e){}<\/script>\n<style>:root[data-embedded=\"1\"] #theme,:root[data-embedded=\"1\"] #lang{display:none!important}<\/style>\n<style>\n  :root{\n    --bg:#EDF1F4;--surface:#FCFDFE;--panel:#F3F7FA;\n    --ink:#14202A;--muted:#556572;--faint:#84939E;--line:#DCE4EA;--grid:#E9EEF2;\n    --lorenz:#4F46C9;--mark:#A9791B;--top:#C0392B;--equal:#84939E;\n    --lorenz-soft:rgba(79,70,201,.12);--top-soft:rgba(192,57,43,.10);--mark-soft:rgba(169,121,27,.14);\n    --shadow:0 1px 2px rgba(20,32,42,.05),0 10px 28px rgba(20,32,42,.07);\n    --font-d:\"Spectral\",Georgia,serif;--font-b:\"IBM Plex Sans\",system-ui,sans-serif;--font-m:\"IBM Plex Mono\",ui-monospace,monospace;\n  }\n  :root:not([data-theme=\"light\"]){@media (prefers-color-scheme:dark){\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;\n    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --lorenz:#8B84E8;--mark:#D6A83A;--top:#E0705F;--equal:#6B7A86;\n    --lorenz-soft:rgba(139,132,232,.16);--top-soft:rgba(224,112,95,.12);--mark-soft:rgba(214,168,58,.16);\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }}\n  :root[data-theme=\"dark\"]{\n    --bg:#0D1319;--surface:#161D24;--panel:#111820;\n    --ink:#E7EEF3;--muted:#94A3AF;--faint:#6B7A86;--line:#28323B;--grid:#222C34;\n    --lorenz:#8B84E8;--mark:#D6A83A;--top:#E0705F;--equal:#6B7A86;\n    --lorenz-soft:rgba(139,132,232,.16);--top-soft:rgba(224,112,95,.12);--mark-soft:rgba(214,168,58,.16);\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased;}\n  .wrap{max-width:1120px;margin:0 auto;padding-block:26px 46px;padding-inline:20px;}\n\n  header{display:flex;justi
